<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 7 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 7, "fecha": "2026-10-20", "tab": "Día 7 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 20 de octubre", "sub": "Las letras: la h, b y v, j y g · la primera redacción, definir un concepto y las tres preguntas fijas del comentario · la tanda de antecedente y función", "carriles": [{"chapa": "Carril A", "titulo": "Las letras: la h, b y v, j y g", "meta": "20 minutos · la h, la b y la v, la j y la g: las reglas que resuelven casi todas las faltas de letra", "teoria": "<p><strong>En el examen: ningún ítem pregunta esto.<\/strong> No hay ninguna pregunta sobre b y v, sobre la h ni sobre <em>sino<\/em> y <em>si no<\/em> en los 24 exámenes de Llengua castellana ni en los 6 de comentario. Esta pieza entera existe por el descuento:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Llengua castellana<\/th>\n<th>Comentari de text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>cuánto descuenta cada falta<\/td>\n<td>0,1<\/td>\n<td>0,1<\/td>\n<\/tr>\n<tr>\n<td>dónde se aplica<\/td>\n<td>solo en el bloque de expresión (4 puntos)<\/td>\n<td>en <strong>los 7 puntos que se escriben<\/strong>: bloque 2 y parte 2<\/td>\n<\/tr>\n<tr>\n<td>hasta dónde<\/td>\n<td><strong>tope de 2 puntos<\/strong><\/td>\n<td><strong>sin tope<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La cuenta que conviene tener delante:<\/strong> veinte faltas en el comentario son 2 puntos, la mitad de la parte 2. No hace falta equivocarse en veinte palabras distintas: con repetir tres veces <em>haber<\/em> por <em>a ver<\/em>, dos <em>porqués<\/em> y una concordancia ya van seis.<\/p>\n<h3>1 · La h<\/h3>\n<p>La h no representa ningún sonido, así que la decisión de escribirla se toma por familias de palabras. Son cuatro.<\/p>\n<table>\n<thead>\n<tr>\n<th>hay h siempre en…<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>los verbos <strong>haber, hacer, hablar, hallar, habitar<\/strong> y todas sus formas<\/td>\n<td>ha, han, hay, había, hecho, hace, hablar<\/td>\n<\/tr>\n<tr>\n<td><strong>hie-, hue-, hui-<\/strong> al empezar<\/td>\n<td>hierba, huella, huir, hueso, huérfano<\/td>\n<\/tr>\n<tr>\n<td><strong>hiper-, hipo-, hidro-, hema-, hemo-, hetero-, homo-<\/strong><\/td>\n<td>hipermercado, hidratar, hemorragia<\/td>\n<\/tr>\n<tr>\n<td><strong>herm-, horm-, hern-, holg-, hosp-, hum-<\/strong><\/td>\n<td>hermano, hormiga, hospital, humo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los seis pares que hay que saber<\/strong>, porque los dos miembros existen y el corrector los distingue. Cinco van aquí; el sexto, <em>a ver / haber<\/em>, está en el apartado 3 con las demás palabras que se separan.<\/p>\n<table>\n<thead>\n<tr>\n<th>par<\/th>\n<th>qué significa cada uno<\/th>\n<th>la prueba<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>echo<\/strong><\/td>\n<td>del verbo <em>echar<\/em>: tirar, meter o poner<\/td>\n<td>se puede sustituir por <em>tiro<\/em> o <em>meto<\/em>, salvo en la locución <em>echar de menos<\/em><\/td>\n<td>«<strong>Echo<\/strong> la basura al salir.» · «La <strong>echo<\/strong> de menos.»<\/td>\n<\/tr>\n<tr>\n<td><strong>hecho<\/strong><\/td>\n<td>participio de <em>hacer<\/em>, o el sustantivo <em>un hecho<\/em><\/td>\n<td>se puede sustituir por <em>realizado<\/em>, o lleva determinante delante<\/td>\n<td>«Ya he <strong>hecho<\/strong> el pedido.» · «Es un <strong>hecho<\/strong> probado.»<\/td>\n<\/tr>\n<tr>\n<td><strong>ola<\/strong><\/td>\n<td>sustantivo: la del mar, o la de calor<\/td>\n<td>lleva determinante delante y admite plural<\/td>\n<td>«La <strong>ola<\/strong> de calor duró diez días.»<\/td>\n<\/tr>\n<tr>\n<td><strong>hola<\/strong><\/td>\n<td>saludo<\/td>\n<td>va sola, entre comas o entre signos, y no admite determinante<\/td>\n<td>«Me dijo <strong>hola<\/strong> y siguió andando.»<\/td>\n<\/tr>\n<tr>\n<td><strong>haya<\/strong><\/td>\n<td>del verbo <em>haber<\/em>, presente de subjuntivo<\/td>\n<td>va delante de un participio, y se puede sustituir por <em>hubiera<\/em><\/td>\n<td>«Cuando <strong>haya<\/strong> terminado, avisa.»<\/td>\n<\/tr>\n<tr>\n<td><strong>halla<\/strong><\/td>\n<td>del verbo <em>hallar<\/em>: encontrar<\/td>\n<td>se puede sustituir por <em>encuentra<\/em><\/td>\n<td>«El registro se <strong>halla<\/strong> en la primera planta.»<\/td>\n<\/tr>\n<tr>\n<td><strong>hasta<\/strong><\/td>\n<td>preposición: marca el límite de un tiempo, un lugar o una cantidad<\/td>\n<td>no admite determinante delante<\/td>\n<td>«Trabajó <strong>hasta<\/strong> las ocho.» · «Llegó <strong>hasta<\/strong> la puerta.»<\/td>\n<\/tr>\n<tr>\n<td><strong>asta<\/strong><\/td>\n<td>sustantivo: el palo de la bandera, o el cuerno<\/td>\n<td>lleva determinante delante<\/td>\n<td>«La bandera ondeaba a media <strong>asta<\/strong>.»<\/td>\n<\/tr>\n<tr>\n<td><strong>hojear<\/strong><\/td>\n<td>pasar las hojas de algo escrito<\/td>\n<td>se puede sustituir por <em>pasar las páginas<\/em><\/td>\n<td>«<strong>Hojeó<\/strong> el informe sin llegar a leerlo.»<\/td>\n<\/tr>\n<tr>\n<td><strong>ojear<\/strong><\/td>\n<td>mirar deprisa y por encima<\/td>\n<td>se puede sustituir por <em>echar un vistazo<\/em><\/td>\n<td>«<strong>Ojeó<\/strong> la sala buscando un sitio libre.»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y los tres monosílabos que se confunden al escribir deprisa<\/strong>, porque los dos miembros de cada par suenan igual: <em>a<\/em> (preposición) frente a <em>ha<\/em> (verbo <em>haber<\/em>: <em>ha llegado<\/em>); <em>e<\/em> (conjunción: <em>padres e hijos<\/em>) frente a <em>he<\/em> (<em>he llegado<\/em>); <em>o<\/em> (conjunción) frente a <em>oh<\/em> (interjección: <em>¡Oh, no me digas!<\/em>).<\/p>\n<h3>2 · B y V, J y G<\/h3>\n<p>Aquí va la lista entera: la falta que sale de una regla que no se sabe no se localiza al releer, porque quien relee no sabe qué está buscando. Las primeras filas de cada bloque resuelven la mayoría de los casos de una redacción; las de abajo cubren el resto.<\/p>\n<h4>Se escribe <strong>b<\/strong><\/h4>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>-aba, -abas, -ábamos<\/strong>: el imperfecto de la primera conjugación, y el de <em>ir<\/em><\/td>\n<td>trabajaba, hablábamos, estaba, <strong>iba, íbamos<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>-bir<\/strong>: los verbos acabados así <em>(salvo hervir, servir, vivir)<\/em><\/td>\n<td>escribir, recibir, prohibir, subir<\/td>\n<\/tr>\n<tr>\n<td><strong>-buir<\/strong>: los verbos acabados así<\/td>\n<td>contribuir, atribuir, distribuir<\/td>\n<\/tr>\n<tr>\n<td><strong>b antes de consonante<\/strong> y al final de sílaba<\/td>\n<td>obtener, absorber, obvio, objeto, club<\/td>\n<\/tr>\n<tr>\n<td><strong>m antes de b<\/strong><\/td>\n<td>también, cambio, hombro, ambos<\/td>\n<\/tr>\n<tr>\n<td><strong>bi-, bis-, biz-<\/strong> cuando significan «dos»<\/td>\n<td>bicicleta, bisabuelo, bizcocho<\/td>\n<\/tr>\n<tr>\n<td><strong>bene-, bien-<\/strong><\/td>\n<td>beneficio, bienestar, bienvenida<\/td>\n<\/tr>\n<tr>\n<td><strong>bibl-<\/strong><\/td>\n<td>biblioteca, bibliografía<\/td>\n<\/tr>\n<tr>\n<td><strong>-bilidad<\/strong> <em>(salvo movilidad y civilidad)<\/em><\/td>\n<td>posibilidad, amabilidad, responsabilidad<\/td>\n<\/tr>\n<tr>\n<td><strong>-bundo, -bunda<\/strong><\/td>\n<td>vagabundo, meditabunda, moribundo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Se escribe <strong>v<\/strong><\/h4>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>n antes de v<\/strong><\/td>\n<td>invierno, envío, convenio, conviene<\/td>\n<\/tr>\n<tr>\n<td>detrás de los prefijos <strong>ad-, ob-, sub-<\/strong><\/td>\n<td>adverbio, advertir, obvio, subvención<\/td>\n<\/tr>\n<tr>\n<td>adjetivos en <strong>-ava, -ave, -avo, -eva, -eve, -evo, -iva, -ivo<\/strong> <em>(salvo árabe)<\/em><\/td>\n<td>octava, suave, nuevo, breve, activa, decisivo<\/td>\n<\/tr>\n<tr>\n<td>el pretérito de <strong>estar, andar, tener<\/strong><\/td>\n<td>estuve, anduvo, tuvimos<\/td>\n<\/tr>\n<tr>\n<td>el presente de <strong>ir<\/strong><\/td>\n<td>voy, vas, va, vamos, van<\/td>\n<\/tr>\n<tr>\n<td><strong>vice-, villa-, viz-<\/strong><\/td>\n<td>vicepresidente, villano, vizconde<\/td>\n<\/tr>\n<tr>\n<td>palabras que empiezan por <strong>eva-, eve-, evi-, evo-<\/strong> <em>(salvo ébano)<\/em><\/td>\n<td>evaluar, evento, evitar, evolución<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Se escribe <strong>j<\/strong><\/h4>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>-aje, -eje<\/strong><\/td>\n<td>garaje, mensaje, aprendizaje, hereje<\/td>\n<\/tr>\n<tr>\n<td><strong>-jero, -jera, -jería<\/strong> <em>(salvo ligero)<\/em><\/td>\n<td>extranjero, cerrajería, mensajero<\/td>\n<\/tr>\n<tr>\n<td>verbos en <strong>-jar<\/strong> y <strong>-jear<\/strong><\/td>\n<td>trabajar, bajar, cojear, hojear<\/td>\n<\/tr>\n<tr>\n<td>el pretérito de <strong>decir, traer<\/strong> y los verbos en <strong>-ducir<\/strong><\/td>\n<td>dije, trajo, condujo, produjo, tradujeron<\/td>\n<\/tr>\n<tr>\n<td>palabras que empiezan por <strong>aje-, eje-<\/strong> <em>(salvo agencia, agenda, agente y agenciar, con g)<\/em><\/td>\n<td>ajeno, ejemplo, ejercicio, ejecutar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Y nunca <em>dijieron<\/em>.<\/strong> El pretérito con j no lleva <em>i<\/em> delante de la <em>e<\/em>: se escribe <strong>dijeron<\/strong>, <strong>trajeron<\/strong>, <strong>condujeron<\/strong>, <strong>produjeron<\/strong>. Es la falta más repetida de esta familia.<\/p>\n<\/blockquote>\n<h4>Se escribe <strong>g<\/strong> con sonido fuerte, delante de <em>e<\/em> y de <em>i<\/em><\/h4>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>gen-<\/strong> y <strong>-gen<\/strong> <em>(salvo jengibre y jenízaro)<\/em><\/td>\n<td>gente, generoso, origen, imagen<\/td>\n<\/tr>\n<tr>\n<td><strong>geo-<\/strong><\/td>\n<td>geografía, geología<\/td>\n<\/tr>\n<tr>\n<td><strong>-gia, -gio, -gión, -gioso<\/strong><\/td>\n<td>magia, prodigio, religión, prestigioso<\/td>\n<\/tr>\n<tr>\n<td>verbos en <strong>-ger, -gir<\/strong> <em>(salvo tejer y crujir)<\/em><\/td>\n<td>proteger, dirigir, exigir, corregir<\/td>\n<\/tr>\n<tr>\n<td><strong>-logía, -gogía<\/strong><\/td>\n<td>psicología, pedagogía<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y cuando la <em>g<\/em> tiene que sonar suave delante de <em>e<\/em> o de <em>i<\/em>, se escribe <strong>gue, gui<\/strong> —<em>guerra<\/em>, <em>guitarra<\/em>—, con diéresis si la <em>u<\/em> debe oírse: <em>vergüenza<\/em>, <em>pingüino<\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "La h: corrige las que estén mal", "dossier": {"cuaderno": "4", "ejercicio": 1}, "ayuda": "Escribe la palabra en negrita, corregida si hace falta; si está bien escrita, escríbela igual. Unas llevan <i>h<\/i> y se han escrito sin ella; a otras se les ha puesto sin que les corresponda.", "items": [{"enun": "<b>aber<\/b>", "sol": "haber", "porque": "el verbo, con <i>h<\/i>"}, {"enun": "<b>ierba<\/b>", "sol": "hierba", "porque": "<i>hie-<\/i> al empezar"}, {"enun": "<b>hecho<\/b> de menos el turno de antes", "sol": "echo", "porque": "del verbo <i>echar<\/i>; <i>hecho<\/i> es de <i>hacer<\/i>"}, {"enun": "la <b>huella<\/b>", "sol": "huella", "porque": "correcta: <i>hue-<\/i> al empezar"}, {"enun": "<b>a<\/b> llegado tarde", "sol": "ha", "porque": "del verbo <i>haber<\/i>; <i>a<\/i> es la preposición"}, {"enun": "padres <b>e<\/b> hijos", "sol": "e", "porque": "correcta: la conjunción <i>e<\/i> no lleva <i>h<\/i>"}, {"enun": "<b>hospital<\/b>", "sol": "hospital", "porque": "correcta: <i>hosp-<\/i>"}, {"enun": "<b>ermano<\/b>", "sol": "hermano", "porque": "<i>herm-<\/i>"}, {"enun": "<b>ojeó<\/b> el andén buscando a su hermano", "sol": "ojeó", "porque": "correcta: mirar deprisa y por encima un sitio es <i>ojear<\/i>; <i>hojear<\/i> solo vale para lo que tiene hojas"}, {"enun": "<b>hasta<\/b> de bandera", "sol": "asta", "porque": "el palo; <i>hasta<\/i> es la preposición"}, {"enun": "<b>ay<\/b> dos personas", "sol": "hay", "porque": "del verbo <i>haber<\/i>"}, {"enun": "<b>umo<\/b>", "sol": "humo", "porque": "<i>hum-<\/i>"}], "apoyo": ["1 · La h"], "dossier_txt": "Del dossier: pieza 4, ejercicio 1"}, {"tipo": "hueco", "titulo": "B y V, J y G: corrige las que estén mal", "dossier": {"cuaderno": "4", "ejercicio": 2}, "ayuda": "Escribe cada palabra corregida; si está bien escrita, escríbela igual.", "items": [{"enun": "<i>trabajava<\/i>", "sol": "trabajaba", "porque": "imperfecto de la primera conjugación, <i>-aba<\/i>"}, {"enun": "<i>hablábamos<\/i>", "sol": "hablábamos", "porque": "correcta"}, {"enun": "<i>condugo<\/i>", "sol": "condujo", "porque": "pretérito de los verbos en <i>-ducir<\/i>, con <i>j<\/i>"}, {"enun": "<i>prohivir<\/i>", "sol": "prohibir", "porque": "verbo en <i>-bir<\/i>"}, {"enun": "<i>trajeron<\/i>", "sol": "trajeron", "porque": "correcta"}, {"enun": "<i>hivan<\/i>", "sol": "iban", "porque": "el imperfecto de <i>ir<\/i> va con <i>b<\/i> y sin <i>h<\/i>"}, {"enun": "<i>dijieron<\/i>", "sol": "dijeron", "porque": "el pretérito con <i>j<\/i> no lleva <i>i<\/i> delante de la <i>e<\/i>"}, {"enun": "<i>aprendizage<\/i>", "sol": "aprendizaje", "porque": "<i>-aje<\/i> con <i>j<\/i>"}, {"enun": "<i>invierno<\/i>", "sol": "invierno", "porque": "correcta: <i>n<\/i> antes de <i>v<\/i>"}, {"enun": "<i>estube<\/i>", "sol": "estuve", "porque": "pretérito de <i>estar<\/i>, con <i>v<\/i>"}, {"enun": "<i>responsavilidad<\/i>", "sol": "responsabilidad", "porque": "<i>-bilidad<\/i>"}, {"enun": "<i>dirijir<\/i>", "sol": "dirigir", "porque": "verbo en <i>-gir<\/i>"}, {"enun": "<i>extrangero<\/i>", "sol": "extranjero", "porque": "<i>-jero<\/i>"}, {"enun": "<i>jeografía<\/i>", "sol": "geografía", "porque": "<i>geo-<\/i>"}, {"enun": "<i>subvención<\/i>", "sol": "subvención", "porque": "correcta: detrás de <i>sub-<\/i>"}, {"enun": "<i>contribuir<\/i>", "sol": "contribuir", "porque": "correcta: verbo en <i>-buir<\/i>"}], "apoyo": ["2 · B y V, J y G", "Se escribe g con sonido fuerte, delante de e y de i"], "dossier_txt": "Del dossier: pieza 4, ejercicio 2"}, {"tipo": "cazar", "titulo": "Caza las faltas de letra", "ayuda": "Un fragmento con faltas de b y v, de j y g y de h. Seis palabras están mal escritas: márcalas.", "items": [{"texto": "El año pasado trabajava en un garage y cada mañana avía que abrir a las siete. Mi compañero, que llebaba veinte años allí, me dijo que los dueños dijieron que iban a ampliar el taller, pero al final ivan a esperar a septiembre.", "faltas": {"trabajava": "trabajaba: imperfecto en -aba, con b", "garage": "garaje: -aje va con j", "avía": "había: del verbo <i>haber<\/i>, con h y b", "llebaba": "llevaba: <i>llevar<\/i> va con v, y el imperfecto añade la b de -aba", "dijieron": "dijeron: el pretérito de <i>decir<\/i> lleva j y no lleva i", "ivan": "iban: del verbo <i>ir<\/i>, con b"}}], "criterio": "Las seis se cazan con las reglas de la tabla: dos imperfectos en -aba, un -aje, un pretérito con j y dos formas de <i>haber<\/i> e <i>ir<\/i>. La primera pasada de la relectura de tres minutos, que se da el 3 de noviembre, busca justamente los verbos, porque ahí se concentran las faltas de letra de una redacción.", "apoyo": ["1 · La h", "2 · B y V, J y G"], "solo_web": true}, {"tipo": "hueco", "titulo": "La letra que falta", "ayuda": "Ocho palabras con un hueco. Escribe la palabra entera con la letra que le corresponde: b o v, j o g, con h o sin ella.", "items": [{"enun": "<i>traba_aba<\/i> (trabajar)", "sol": "trabajaba", "porque": "-aja con j, y el imperfecto en -aba con b"}, {"enun": "<i>escri_ir<\/i>", "sol": "escribir", "porque": "-bir con b"}, {"enun": "<i>condu_o<\/i> (conducir, ayer)", "sol": "condujo", "porque": "el pretérito con j"}, {"enun": "<i>in_ierno<\/i>", "sol": "invierno", "porque": "n antes de v"}, {"enun": "<i>_echo<\/i> (participio de hacer)", "sol": "hecho", "porque": "del verbo <i>hacer<\/i>, con h; <i>echo<\/i> es de <i>echar<\/i>"}, {"enun": "<i>gara_e<\/i>", "sol": "garaje", "porque": "-aje con j"}, {"enun": "<i>tam_ién<\/i>", "sol": "también", "porque": "m antes de b"}, {"enun": "<i>_ueso<\/i>", "sol": "hueso", "porque": "hue- al empezar lleva h"}], "criterio": "Cada hueco tiene su regla en la tabla, y las ocho son de las que aparecen en una redacción de examen. La que más se falla es <i>hecho<\/i> frente a <i>echo<\/i>, porque las dos existen: la de <i>hacer<\/i> lleva h y la de <i>echar<\/i> no.", "apoyo": ["1 · La h", "2 · B y V, J y G"], "solo_web": true}], "cuaderno": {"pieza": 4, "apartados": [1, 2], "ejercicios": [1, 2]}, "cuaderno_txt": "Pieza 4 · Las letras, las palabras que se separan y corregir lo que escribes — apartados 1 y 2: La h; B y V, J y G (p. 31 y 32) · ejercicios 1 y 2", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "La primera redacción de 50-80 palabras", "meta": "60 minutos · el texto de 2017t en el carril «El texto»; el plan de tres líneas, la misma redacción en las dos extensiones, definir un concepto y las tres preguntas fijas del comentario", "teoria": "<h3>5 · El plan de tres líneas<\/h3>\n<p>Antes de escribir, en el margen, y en los dos exámenes:<\/p>\n<table>\n<thead>\n<tr>\n<th>paso<\/th>\n<th style=\"text-align: right;\">tiempo<\/th>\n<th>qué haces<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td style=\"text-align: right;\">1 min<\/td>\n<td>Relees el enunciado y <strong>subrayas la pregunta<\/strong> que tienes que contestar<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<td>Escribes <strong>tres líneas sueltas<\/strong>: tu tesis, tus dos razones, cómo cierras<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td style=\"text-align: right;\">el grueso<\/td>\n<td>Escribes seguido, sin parar a corregir<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<td>Cuentas las palabras y relees buscando faltas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>El paso 4 no es opcional en el comentario: <strong>pasarse de 200 palabras o no llegar a 150 descuenta 0,5 puntos<\/strong>, tanto como un argumento entero.<\/p>\n<h3>6 · El mismo tema, en las dos extensiones<\/h3>\n<p>Enunciado: <em>¿Debería contar como jornada laboral el tiempo que se tarda en llegar al trabajo?<\/em><\/p>\n<h4>Versión de 69 palabras (formato de Llengua castellana)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada. Quien vive a una hora de la fábrica dedica diez horas semanales a desplazarse, y ese tiempo no lo decide él: lo organiza el horario de la empresa. Además, pagarlo empujaría a las empresas a acercar los centros a donde vive la gente. Si no se cuenta, el sueldo real baja cuanto más lejos se vive.<\/p>\n<\/blockquote>\n<p>Cuatro frases: tesis, argumento 1, argumento 2 con <em>además<\/em>, cierre. Sin concesión: la extensión no la admite.<\/p>\n<h4>Versión de 182 palabras (formato del comentario)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada laboral, y debería contarlo también cuando el trayecto se hace en transporte público.<\/p>\n<p>La primera razón atiende a quién decide ese tiempo. Alguien que vive a una hora del polígono dedica diez horas a la semana a desplazarse, más de lo que dura una jornada completa, y las dedica porque la empresa ha decidido dónde está el centro de trabajo. Quien elige el lugar debería pagar el desplazamiento que provoca.<\/p>\n<p>La segunda razón es distinta: contarlo cambiaría la manera de instalar las empresas. Mientras el traslado lo asuma el trabajador con su tiempo, a la empresa le sale igual de barato poner la nave en un polígono sin autobús que al lado de una estación.<\/p>\n<p>Es cierto que una medida así encarecería contratar a quien vive lejos, y podría acabar perjudicando justamente a esas personas. Por eso tendría que aplicarse con un tope de kilómetros y con ayudas al transporte público.<\/p>\n<p>Si no se cuenta, el sueldo real de cada trabajador baja cuanto más lejos vive de su empresa.<\/p>\n<\/blockquote>\n<p><strong>Qué se ha añadido al pasar de 69 a 182 palabras<\/strong>, y en este orden: un dato dentro de cada argumento, la frase que explica <strong>por qué los dos argumentos son distintos<\/strong> («la segunda razón es distinta»), y una concesión entera con su solución. La tesis y el cierre son casi los mismos.<\/p>\n<h3>7 · La microtarea de definir un concepto<\/h3>\n<p><strong>En el examen.<\/strong> Es la micro-tarea 2.1 de Llengua castellana, <strong>1 punto<\/strong>, en dos o tres líneas. Ha caído cuatro veces en 24 exámenes y <strong>tres de ellas en los seis últimos<\/strong>: definir qué es una radiografía a quien no lo sabe (2015t), qué es una biblioteca (2024s), en qué consiste el trabajo de aprendiz (2025t) y los parecidos y diferencias entre un tejado y una azotea (2026t). En Comentari de text no se pide con ese nombre, pero la pregunta 2.3 —«explique qué se entiende por <em>selección natural<\/em>»— se contesta con este mismo esquema, igual que las preguntas de léxico abiertas de la pieza 10 que piden explicar una expresión.<\/p>\n<h4>El esquema, en cuatro partes<\/h4>\n<p>Una definición completa lleva estas cuatro, en este orden:<\/p>\n<table>\n<thead>\n<tr>\n<th>parte<\/th>\n<th>qué es<\/th>\n<th>en el ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · Hiperónimo<\/strong><\/td>\n<td>la clase a la que pertenece<\/td>\n<td><em>una hipoteca es <span class=\"vs\">un préstamo<\/span><\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2 · Propiedad simple<\/strong><\/td>\n<td>un sintagma que la acota<\/td>\n<td><em>de dinero, <span class=\"vs\">a largo plazo<\/span><\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3 · Propiedad compleja<\/strong><\/td>\n<td>una oración de relativo que la distingue de las demás de su clase<\/td>\n<td><strong><em>que se pide a un banco para comprar una vivienda y que queda garantizado con esa misma vivienda<\/em><\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>4 · Ejemplo o consecuencia<\/strong><\/td>\n<td>media línea que lo hace visible<\/td>\n<td><em>si quien lo pide deja de pagar las cuotas, el banco puede quedarse con el piso<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Entero: <em>«Una hipoteca es un préstamo de dinero a largo plazo que se pide a un banco para comprar una vivienda y que queda garantizado con esa misma vivienda: si quien lo pide deja de pagar las cuotas, el banco puede quedarse con el piso.»<\/em> Cuarenta y cuatro palabras, tres líneas.<\/p>\n<p><strong>Sin la parte 1 la definición se queda sin clase:<\/strong> arranca por una propiedad y quien lee no sabe si le están hablando de un documento, de un préstamo o de un trámite.<\/p>\n<h4>De dónde se saca el hiperónimo<\/h4>\n<p>Encontrar la clase exige más tiempo que las otras tres partes, y no se improvisa en el examen. Lo que han preguntado y lo que pueden preguntar se reparte casi siempre en seis familias:<\/p>\n<table>\n<thead>\n<tr>\n<th>si lo que defines es…<\/th>\n<th>hiperónimos que sirven<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>un objeto<\/strong><\/td>\n<td>aparato · herramienta · documento · prenda · recipiente · mueble · material<\/td>\n<td><em>una nómina es <\/em><em>el documento<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un lugar<\/strong><\/td>\n<td>edificio · local · instalación · espacio · establecimiento<\/td>\n<td><em>una biblioteca es <\/em><em>el edificio o el local<\/em><em> donde…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una actividad o un oficio<\/strong><\/td>\n<td>trabajo · tarea · proceso · procedimiento · técnica · prueba · servicio<\/td>\n<td><em>una radiografía es <\/em><em>la prueba médica<\/em><em> que…<\/em> · <em>un aprendiz es <\/em><em>la persona que<\/em><em>…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un período de tiempo<\/strong><\/td>\n<td>jornada · turno · plazo · etapa · temporada<\/td>\n<td><em>un turno de noche es <\/em><em>la jornada<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una idea abstracta<\/strong><\/td>\n<td>derecho · norma · obligación · sentimiento · cualidad · situación · relación<\/td>\n<td><em>el pudor es <\/em><em>el sentimiento<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un conjunto de personas o de elementos<\/strong><\/td>\n<td>grupo · lista · conjunto · relación ordenada · red<\/td>\n<td><em>una lista de espera es <\/em><em>la relación ordenada<\/em><em> de…<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y una regla que confirma el hiperónimo:<\/strong> el hiperónimo tiene que poder sustituir a la palabra en una frase cualquiera sin que la frase se vuelva falsa. <em>Fui al hospital a hacerme una radiografía<\/em> → <em>fui al hospital a hacerme una prueba<\/em>: sigue siendo verdad, con menos precisión. <em>Fui al hospital a hacerme una foto<\/em> ya no lo es.<\/p>\n<h4>Definir algo que no es un sustantivo<\/h4>\n<p>Las cuatro veces que ha caído en el examen pedían definir un sustantivo, pero las preguntas de léxico abiertas piden explicar verbos, adjetivos y frases hechas, y ahí el formato cambia. <strong>La definición mantiene la clase de palabra de lo que define:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>formato<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>sustantivo<\/strong><\/td>\n<td><em>es un/una<\/em> + hiperónimo + propiedades<\/td>\n<td><em>un aprendiz es la persona que trabaja en un oficio mientras lo aprende de alguien con más experiencia<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>verbo<\/strong><\/td>\n<td><em>es<\/em> + otro verbo en infinitivo + complementos<\/td>\n<td><em>soslayar es evitar un asunto pasando por su lado en vez de entrar en él<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>adjetivo<\/strong><\/td>\n<td><em>que<\/em> + oración<\/td>\n<td><em>taciturno: que habla poco y se guarda lo que piensa<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>frase hecha<\/strong><\/td>\n<td><em>es<\/em> + verbo + complementos, y sin desmontar la frase palabra por palabra<\/td>\n<td><em>romper el silencio es acabar con una situación tensa en la que nadie se atrevía a hablar<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La fila del adjetivo tiene un error propio: se contesta con un sustantivo. <em>Taciturno es una persona callada<\/em> define a la persona, no al adjetivo. Con el formato <em>que…<\/em> el error desaparece.<\/p>\n<h4>Los seis errores que la clave no acepta<\/h4>\n<table>\n<thead>\n<tr>\n<th>error<\/th>\n<th>ejemplo<\/th>\n<th>por qué falla<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Definir con la misma palabra<\/strong><\/td>\n<td>«una hipoteca es cuando hipotecas una casa»<\/td>\n<td>no nombra la clase, y usa la palabra que hay que explicar<\/td>\n<\/tr>\n<tr>\n<td><strong>Empezar por el ejemplo<\/strong><\/td>\n<td>«una hipoteca es lo que pidió mi hermano para el piso»<\/td>\n<td>un caso no es una clase: quien no sepa qué es sigue sin saberlo<\/td>\n<\/tr>\n<tr>\n<td><strong>«Es cuando», «es donde»<\/strong><\/td>\n<td>«una biblioteca es donde hay libros»<\/td>\n<td><em>cuando<\/em> y <em>donde<\/em> no son hiperónimos: son adverbios, y el hueco de la clase se queda vacío<\/td>\n<\/tr>\n<tr>\n<td><strong>La palabra imprecisa<\/strong><\/td>\n<td>⊗ «una radiografía es una cosa que te hacen en el hospital»<\/td>\n<td><em>cosa<\/em>, <em>hacer<\/em>, <em>tener<\/em>, <em>poner<\/em> y <em>coger<\/em> no acotan nada; el hueco del hiperónimo parece lleno y está vacío<\/td>\n<\/tr>\n<tr>\n<td><strong>La definición demasiado ancha<\/strong><\/td>\n<td>«una nómina es un papel de la empresa»<\/td>\n<td>la clase está bien y faltan las propiedades: un contrato y una carta de despido también son papeles de la empresa<\/td>\n<\/tr>\n<tr>\n<td><strong>La definición en negativo<\/strong><\/td>\n<td>«un aprendiz es alguien que todavía no es oficial»<\/td>\n<td>enumerar lo que algo no es deja sin nombrar lo que es; el negativo puede ir <strong>detrás<\/strong> de la definición, no en su lugar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La micro-tarea se publica con «[1 punto]» y sin fracciones<\/strong>, así que cuánto descuenta cada uno de estos errores lo decide el corrector. La prueba de la definición demasiado ancha se hace al revés: si se te ocurre algo distinto que cumple tu definición entera, faltan propiedades.<\/p>\n<h4>Las cuatro que han caído, contestadas<\/h4>\n<blockquote>\n<p><strong>2015t · «Explique qué es una radiografía a alguien que no lo sepa.»<\/strong>\n<em>Una radiografía es una prueba médica que consiste en atravesar una parte del cuerpo con rayos X para obtener una imagen de lo que hay debajo de la piel, sobre todo de los huesos. Sirve para localizar una fractura sin necesidad de abrir.<\/em><\/p>\n<p><strong>2024s · «Explique qué es una biblioteca.»<\/strong>\n<em>Una biblioteca es el local o el edificio en el que se guarda ordenadamente una colección de libros para que puedan consultarse o llevarse en préstamo. Puede ser pública, como la del barrio, o privada, como la de una casa.<\/em><\/p>\n<p><strong>2025t · «Explique en qué consiste el trabajo de aprendiz.»<\/strong>\n<em>Un aprendiz es la persona que entra en un oficio para aprenderlo trabajando en él, al lado de alguien con más experiencia que le va enseñando, y que por eso cobra menos y asume menos responsabilidad que un oficial. Un mozo de taller que monta ruedas mientras mira cómo se repara un motor está de aprendiz.<\/em><\/p>\n<p><strong>2026t · «Explique los parecidos y las diferencias entre un tejado y una azotea.»<\/strong>\n<em>El tejado y la azotea son las dos maneras habituales de cerrar un edificio por arriba, y las dos protegen de la lluvia lo que hay debajo. Se diferencian en la forma y en el uso: el tejado es inclinado y está cubierto de tejas, de modo que el agua resbala y nadie puede andar por él; la azotea es plana y transitable, y por eso se usa para tender la ropa o poner los depósitos.<\/em><\/p>\n<\/blockquote>\n<p><strong>Compara lo que hacen las cuatro.<\/strong> Todas empiezan por el hiperónimo. Todas ocupan dos o tres líneas. En ninguna aparecen las palabras imprecisas ni el formato <em>es cuando<\/em>. Y todas cierran con un ejemplo o una consecuencia que ocupa media línea, que es la parte 4 del esquema.<\/p>\n<h4>Cuando piden comparar dos<\/h4>\n<p>El enunciado de 2026 pidió parecidos <strong>y<\/strong> diferencias entre dos objetos. La respuesta lleva las dos mitades, y contestar solo una deja sin hacer la mitad de lo que el enunciado pide. El orden que funciona: primero el hiperónimo común, porque la clase común los hace comparables, y después la propiedad que los separa.<\/p>\n<blockquote>\n<p><em>«Un alquiler y una hipoteca son las dos maneras habituales de pagar por vivir en una casa, y las dos se pagan cada mes. Se diferencian en que el alquiler no da ninguna propiedad sobre la vivienda por muchos años que se pague, mientras que la hipoteca termina y la casa queda a nombre de quien la ha pagado.»<\/em><\/p>\n<\/blockquote>\n<p><strong>El formato de la comparación, en dos frases:<\/strong> <em>X e Y son [hiperónimo común] y los dos [propiedad compartida]. Se diferencian en que X [propiedad], mientras que Y [la propiedad contraria].<\/em> La segunda frase lleva siempre un conector de oposición —<em>mientras que<\/em>, <em>en cambio<\/em>—, y sin él las dos mitades se leen como una lista.<\/p>\n<h4>Cuando piden un argumento a favor y otro en contra<\/h4>\n<p>La microtarea 2.1 de 2026s pidió, «en no más de dos o tres líneas, algún argumento a favor y alguno en contra de que niños y niñas lleven uniforme en la escuela». Cada mitad tiene que ser un argumento, con su porqué, y las dos se corrigen por separado. Tres fallos se repiten:<\/p>\n<ul>\n<li><strong>La razón doble.<\/strong> Las dos mitades discuten el mismo dato desde los dos lados: «a favor: el uniforme ahorra dinero a las familias; en contra: el uniforme cuesta dinero a las familias», que son una sola razón. Se corrige sacando la otra mitad de otro terreno, de otra fila de la tabla de los seis tipos del apartado 2: si la de a favor es empírica, la de en contra puede salir de una analogía o de la experiencia propia.<\/li>\n<li><strong>El caso en lugar de la razón.<\/strong> «En contra: mi sobrina odia el uniforme» cuenta lo que le pasa a una persona. Se convierte en razón cuando se escribe qué tiene de general: «obliga a llevar una ropa que muchos niños no elegirían».<\/li>\n<li><strong>La preferencia sin porqué.<\/strong> «A favor: me parece bien» no da nada que un lector pueda discutir, y esa mitad se queda sin puntuar.<\/li>\n<\/ul>\n<h4>Y en el comentario, la 2.3<\/h4>\n<p>La pregunta 2.3 del Comentari de text pide explicar un concepto o una frase del texto <strong>relacionándolo con la argumentación<\/strong>, y su clave oficial está construida con este esquema. La de 2024s, literal:<\/p>\n<blockquote>\n<p>«La selección natural es el proceso por el que los organismos mejor adaptados desplazan a los menos adaptados mediante la acumulación lenta de cambios genéticos favorables a lo largo de las generaciones.»<\/p>\n<\/blockquote>\n<p>Desmontada: <strong>el proceso<\/strong> es el hiperónimo; <strong>por el que los organismos mejor adaptados desplazan a los menos adaptados<\/strong> es la propiedad compleja; <strong>mediante la acumulación lenta de cambios genéticos favorables<\/strong> es la propiedad simple; <strong>a lo largo de las generaciones<\/strong> acota el tiempo. La clave oficial sigue con una segunda oración, «la selección natural hace que las poblaciones se adapten o se vuelvan cada vez más adecuadas a su entorno con el paso del tiempo», que sigue definiendo: ninguna de las dos relaciona el concepto con el argumento del texto, aunque el enunciado lo pedía. Esa otra mitad del punto, <strong>para qué está ese concepto en el texto<\/strong>, la explica el apartado 8.3.<\/p>\n<h3>8 · Las tres preguntas fijas del comentario<\/h3>\n<p><strong>En el examen.<\/strong> El bloque 2 del comentario son <strong>3 puntos<\/strong> y trae <strong>las mismas tres preguntas en las seis convocatorias<\/strong>, en el mismo orden: proponer un título, resumir un párrafo delimitado y explicar una frase. Cada una vale 1 punto, ocupa <strong>de una a cinco líneas<\/strong> y, según los criterios, «admite fracciones en la puntuación (0,25, 0,5, 0,75) en función de la precisión de la respuesta».<\/p>\n<p>Y sobre las tres pesa la instrucción que recoge el apartado 6 de la pieza 10: <strong>reproducir frases del original se considera incorrecto<\/strong>.<\/p>\n<h4>8.1 · Proponer un título<\/h4>\n<p>Llengua castellana lo pidió una vez, en 2016, con un enunciado que detalla lo que se espera:<\/p>\n<blockquote>\n<p>«Proponga un título (y, si quiere, un subtítulo) para el texto. <strong>La propuesta no debe coincidir con el título del artículo<\/strong> y tiene que recoger debidamente el contenido del fragmento reproducido.»<\/p>\n<p>La clave da dos y admite otros equivalentes: <em>Las relaciones personales en internet<\/em> / <em>Influencia de las redes sociales en las relaciones interpersonales<\/em> / etc.<\/p>\n<\/blockquote>\n<p><strong>Los dos títulos que da la clave son sintagmas nominales<\/strong>, y los tres que acepta la de 2024s también: ninguno lleva verbo conjugado y todos nombran el tema del texto entero. Es el formato más frecuente y el más seguro, y el enunciado no lo exige: pide que el título no coincida con el del artículo y que recoja el contenido del fragmento. Un título con verbo que cumpla los dos requisitos sirve, y además recoge la tesis con más precisión que un sintagma nominal: el sintagma nombra el tema y la oración afirma algo sobre él.<\/p>\n<table>\n<thead>\n<tr>\n<th>sirve<\/th>\n<th>no sirve<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>El valor de la lectura<\/em><\/td>\n<td><em>Leer es bueno<\/em><\/td>\n<td>el segundo es la opinión de quien escribe, y el título recoge el contenido del texto<\/td>\n<\/tr>\n<tr>\n<td><em>Las redes sociales y la imagen que damos<\/em><\/td>\n<td><em>Internet<\/em><\/td>\n<td>demasiado ancho: vale para cualquier texto sobre la red y no distingue <strong>este<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>La discusión sobre si leer mejora a las personas<\/em><\/td>\n<td><em>Mi opinión sobre la lectura<\/em><\/td>\n<td>el título es del texto, no tuyo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres comprobaciones antes de darlo por bueno:<\/strong> que no repita el título original, que abarque el texto entero —no solo el primer párrafo— y que recoja el contenido del texto y no la opinión de quien lo escribe. Que lleve verbo conjugado no lo invalida.<\/p>\n<h4>8.2 · Resumir un párrafo delimitado<\/h4>\n<p>El enunciado marca el párrafo con <strong>su primera y su última palabra<\/strong>: «desde <em>Negar el valor<\/em> hasta <em>como la soberbia<\/em>». El párrafo cambia de una convocatoria a otra; la tarea, no.<\/p>\n<p>Llengua castellana pidió exactamente esto en 2015, y su clave sirve de modelo:<\/p>\n<blockquote>\n<p><strong>Enunciado:<\/strong> «Sintetice el párrafo inicial del texto: <em>El niño, inquieto ante esta noche tan diferente, […] le arranca la palabra tantas veces oída<\/em>.»<\/p>\n<p><strong>Clave:<\/strong> «En este párrafo el niño intuye instintivamente, a partir de una serie signos, que algo terrible le está sucediendo a su abuelo, lo que le lleva a pronunciar el apelativo con el que siempre se ha referido a él.»<\/p>\n<\/blockquote>\n<p><strong>Esa respuesta cumple cuatro condiciones<\/strong>, y las cuatro sirven para el resumen del comentario:<\/p>\n<ol>\n<li><strong>Treinta y nueve palabras<\/strong>, tres líneas. Se reproduce tal cual, con el <em>de<\/em> que le falta en «una serie signos».<\/li>\n<li><strong>Recoge qué pasa, por qué y con qué consecuencia<\/strong>: intuye · a partir de unos signos · y por eso pronuncia el nombre.<\/li>\n<li><strong>No repite ni una secuencia del original.<\/strong> Donde el texto escribe <em>inquieto ante esta noche tan diferente<\/em>, la respuesta pone <em>intuye instintivamente<\/em>. En esa sustitución aparecen a la vez los tres pasos del apartado 6 de la pieza 10.<\/li>\n<li><strong>Empieza por «En este párrafo…»<\/strong>, que sitúa la respuesta sin gastar media línea en metadiscurso.<\/li>\n<\/ol>\n<p><strong>Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado.<\/strong> El enunciado delimita con dos palabras para evitarlo: lo que queda fuera de esas dos palabras no entra en el resumen.<\/p>\n<p><strong>Antes de resumir, se comprueba si el párrafo defiende algo o describe algo,<\/strong> y el resumen se escribe de la misma clase. El párrafo que manda resumir la 2.2 del comentario de 2026s no tiene tesis: describe cómo se va borrando la frontera entre el pensamiento propio y el acceso a la información digital, y la respuesta de la clave describe ese proceso. Un resumen que le pone una tesis a un párrafo descriptivo atribuye al texto una idea que no está en él, y los criterios puntúan esta pregunta por la precisión de la respuesta.<\/p>\n<h4>8.3 · Explicar una frase relacionándola con la argumentación<\/h4>\n<p>El enunciado entrecomilla una frase o un concepto del texto y pide explicarlo <strong>atándolo a lo que el texto defiende<\/strong>. Las palabras <em>relacionándola con la argumentación<\/em> deciden el punto: una paráfrasis de la frase, por buena que sea, deja sin contestar la mitad del enunciado si no explica para qué está esa frase en ese texto.<\/p>\n<p>La primera mitad —qué significa la expresión— ya la preguntaba Llengua castellana en 2016, en una pregunta de comprensión de 0,5 sobre «¿Somos lo que parecemos ser en internet?», el primer texto del trimestre:<\/p>\n<blockquote>\n<p><strong>Enunciado (2016t, 1.5):<\/strong> «Indique a qué idea del texto se refiere el autor con la expresión <em>idílica idea<\/em>.»<\/p>\n<p><strong>Clave oficial:<\/strong> «Contamos lo mejor de nosotros mismos (‘maquillamos’ nuestra identidad) solo en la red (en internet), y no en el contacto personal (cara a cara).»<\/p>\n<\/blockquote>\n<p>Esa pregunta se contesta entera con la paráfrasis, y la paráfrasis ya tiene dos partes: qué hacemos —<em>contamos lo mejor de nosotros mismos<\/em>— y dónde —<em>solo en la red, y no en el contacto personal<\/em>—. La 2.3 del comentario pide además la segunda mitad, <strong>qué función cumple la frase en el argumento del texto<\/strong>. En el texto de 2016, la <em>idílica idea<\/em> es la creencia que el autor discute: la nombra para rebatirla con los datos de la investigación psicológica, y una respuesta de comentario lo escribiría en su segunda frase.<\/p>\n<p><strong>El formato que funciona, en dos frases:<\/strong><\/p>\n<blockquote>\n<p><em>La expresión significa [qué].<\/em> · <em>El autor la usa para [qué defiende con ella].<\/em><\/p>\n<\/blockquote>\n<p>Y el error simétrico del 8.2: <strong>explicar la frase por su cuenta, como si fuera una definición de diccionario<\/strong>, sin indicar para qué está en ese texto. El enunciado exige «relacionándola con la argumentación», y esas tres palabras piden la segunda frase.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "El plan de tres líneas: el móvil en los centros", "dossier": {"cuaderno": "11", "ejercicio": 9}, "ayuda": "El plan del apartado 5: tesis, dos razones diferentes y cierre, en tres líneas. No escribas todavía la redacción: se escribe en «El mismo plan, en las dos extensiones».", "items": [{"enun": "Escribe el plan de tres líneas para este enunciado, con el formato de los de Llengua castellana: «Exprese su opinión sobre si el uso del móvil debería estar prohibido en los centros educativos»."}], "criterio": "El dossier no da un plan modelo: el plan se corrige con tres comprobaciones. Que la tesis admita la contraria; que las dos razones no sean la misma razón formulada de dos maneras —sacarlas de filas distintas de la tabla de los seis tipos de argumento es la manera más segura de conseguirlo, y no la única—; y que el cierre saque una consecuencia en lugar de repetir la tesis.", "usa_texto": false, "apoyo": ["5 · El plan de tres líneas"], "dossier_txt": "Del dossier: pieza 11, ejercicio 9"}, {"tipo": "abierta", "titulo": "El cierre que repite la tesis", "dossier": {"cuaderno": "11", "ejercicio": 10}, "ayuda": "Este texto tiene 54 palabras y el cierre mal resuelto: «Creo que el teletrabajo es bueno para las empresas y para los trabajadores. Se ahorra tiempo de desplazamiento y se puede organizar mejor el día. También se gasta menos en transporte y en comidas fuera. Por todo esto, pienso que el teletrabajo es bueno tanto para las empresas como para quienes trabajan en ellas.»", "items": [{"enun": "Señala dónde está repetida la tesis.", "modelo": "En la última frase, la que empieza por «Por todo esto»: vuelve a decir lo mismo que la primera con otras palabras."}, {"enun": "Explica por qué ese cierre no cierra.", "modelo": "Porque repite la tesis en lugar de sacar una consecuencia: el texto termina donde empezó."}, {"enun": "Escribe el cierre que pondrías tú.", "modelo": "<i>Si el ahorro es de las dos partes, lo que queda por decidir es cuántos días a la semana se teletrabaja.<\/i>"}], "criterio": "Los dos argumentos —tiempo y dinero— sí son diferentes, como pide el criterio, y en 54 palabras la concesión no tiene frase propia, así que no se le puede reprochar.", "usa_texto": false, "apoyo": ["5 · El plan de tres líneas"], "dossier_txt": "Del dossier: pieza 11, ejercicio 10"}, {"tipo": "abierta", "titulo": "El mismo plan, en las dos extensiones", "dossier": {"cuaderno": "11", "ejercicio": 11}, "ayuda": "Desarrolla dos veces el plan de «El plan de tres líneas: el móvil en los centros». El contador de debajo de cada respuesta cuenta las palabras.", "items": [{"enun": "La versión de 50 a 80 palabras, como pide Llengua castellana.", "palabras": {"min": 50, "max": 80}}, {"enun": "La versión de 150 a 200 palabras, como pide el comentario.", "palabras": {"min": 150, "max": 200}}, {"enun": "Los tres añadidos de la versión larga: cópialos o descríbelos.", "modelo": "Un dato dentro de cada argumento, la frase que explica por qué los dos argumentos son distintos, y la concesión entera con su solución."}], "criterio": "El dossier no da modelo de estas dos redacciones: se corrigen con las dos rúbricas —la de Llengua castellana, de 3 puntos, y la del comentario, de 4— y con el recuento de palabras. En la larga tienen que poder señalarse los tres añadidos.", "usa_texto": false, "apoyo": ["6 · El mismo tema, en las dos extensiones"], "dossier_txt": "Del dossier: pieza 11, ejercicio 11"}, {"tipo": "justificar", "titulo": "¿Qué parte del esquema le falta?", "dossier": {"cuaderno": "11", "ejercicio": 12}, "ayuda": "Indica qué parte del esquema le falta a cada definición: hiperónimo, propiedad simple, propiedad compleja o ejemplo. A algunas les falta más de una.", "items": [{"palabra": "«Una nómina es un documento.»", "requiere": [["propiedad simple", "simple"], ["propiedad compleja", "compleja"]], "modelo": "Faltan la <b>propiedad simple<\/b> y la <b>compleja<\/b>: la definición es demasiado ancha, y un contrato también es un documento."}, {"palabra": "«Una nómina es el documento mensual de la empresa.»", "requiere": [["propiedad compleja", "compleja"]], "modelo": "Falta la <b>propiedad compleja<\/b>: no indica qué distingue a la nómina de los demás documentos mensuales de la empresa."}, {"palabra": "«El que la empresa entrega cada mes con el sueldo bruto, los descuentos y lo que queda por cobrar.»", "requiere": [["hiperónimo", "hiperonimo", "la clase"]], "modelo": "Falta el <b>hiperónimo<\/b>: empieza por el relativo y no nombra la clase."}, {"palabra": "«Un turno de noche es la jornada que se hace mientras los demás duermen.»", "requiere": [["propiedad simple", "simple"], ["ejemplo", "consecuencia"]], "modelo": "Faltan la <b>propiedad simple<\/b> y el <b>ejemplo o la consecuencia<\/b>: nombra la clase —<i>la jornada<\/i>— y qué la distingue —<i>que se hace mientras los demás duermen<\/i>—, y no la acota con ningún rasgo simple, como el horario o el complemento que se cobra."}, {"palabra": "«Una lista de espera es la relación ordenada de pacientes que aún no han recibido la prueba que pidieron.»", "requiere": [["ejemplo", "consecuencia"]], "modelo": "Está completa menos la parte 4, el ejemplo o la consecuencia."}, {"palabra": "«Una hipoteca es un préstamo de dinero a largo plazo.»", "requiere": [["propiedad compleja", "compleja"], ["ejemplo", "consecuencia"]], "modelo": "Faltan la <b>propiedad compleja<\/b> y el <b>ejemplo<\/b>: un préstamo al consumo también es dinero a largo plazo."}], "pide": "le falta…", "usa_texto": false, "apoyo": ["El esquema, en cuatro partes"], "dossier_txt": "Del dossier: pieza 11, ejercicio 12"}, {"tipo": "abierta", "titulo": "Seis definiciones con las cuatro partes", "dossier": {"cuaderno": "11", "ejercicio": 13}, "ayuda": "Define cada una en dos o tres líneas, con las cuatro partes del esquema, para alguien que no sepa lo que es.", "items": [{"enun": "una nómina", "modelo": "<i>Una nómina es el documento que la empresa entrega cada mes a quien trabaja para ella, y en el que constan el sueldo bruto, lo que se descuenta para impuestos y cotizaciones, y lo que queda por cobrar: es el papel que piden para alquilar un piso o para pedir un préstamo.<\/i>"}, {"enun": "un turno de noche", "modelo": "<i>Un turno de noche es la jornada de trabajo que se hace mientras la mayoría de la gente duerme, normalmente entre las diez de la noche y las seis de la mañana, y que suele pagarse con un complemento porque desordena el descanso.<\/i>"}, {"enun": "la lista de espera de un hospital", "modelo": "<i>Una lista de espera es la relación ordenada de pacientes que han pedido una prueba o una operación y todavía no la han recibido, en la que cada uno avanza según la fecha en que entró y la gravedad de su caso.<\/i>"}, {"enun": "una mutua", "modelo": "<i>Una mutua es la entidad que colabora con la Seguridad Social en la atención de los accidentes y las enfermedades que se producen por causa del trabajo, y a la que la empresa envía a quien se lesiona en su puesto.<\/i>"}, {"enun": "un finiquito", "modelo": "<i>Un finiquito es el documento con el que se cierra una relación laboral y en el que se liquida lo que la empresa debe a quien se marcha: los días trabajados del último mes, las vacaciones no disfrutadas y las pagas proporcionales.<\/i>"}, {"enun": "una beca", "modelo": "<i>Una beca es la ayuda económica que una administración o una entidad concede a alguien para que pueda estudiar, y que se otorga por la renta familiar, por el expediente o por los dos criterios a la vez: quien la recibe queda exento de la matrícula y, según la renta, recibe además una cantidad para libros y transporte.<\/i>"}], "criterio": "El punto entero pide las cuatro partes. Sin hiperónimo la respuesta no nombra la clase a la que pertenece lo que define, y quien lee sigue sin saber si le hablan de un documento, de un trámite o de un derecho; la micro-tarea se publica con «[1 punto]» y sin fracciones, así que cuánto descuenta cada parte que falta lo decide el corrector.", "usa_texto": false, "apoyo": ["El esquema, en cuatro partes"], "dossier_txt": "Del dossier: pieza 11, ejercicio 13"}, {"tipo": "clasificar", "titulo": "¿Qué error comete cada definición?", "dossier": {"cuaderno": "11", "ejercicio": 14, "parte": "el error"}, "ayuda": "Identifica cuál de los errores de la tabla del apartado 7 comete cada definición. Dos de ellas cometen dos a la vez, y en esas vale cualquiera de los dos.", "ops": ["con la misma palabra", "empieza por el ejemplo", "«es cuando» o «es donde»", "palabra imprecisa", "demasiado ancha", "en negativo"], "items": [{"enun": "«Una nómina es cuando te pagan el sueldo.»", "sol": "«es cuando» o «es donde»", "porque": "«es cuando»: <i>una nómina es el documento en el que…<\/i>"}, {"enun": "«Un turno de noche es lo que hace mi cuñado en la fábrica.»", "sol": "empieza por el ejemplo", "porque": "un caso concreto no explica la clase"}, {"enun": "«Una lista de espera es una lista donde esperas.»", "sol": "con la misma palabra|«es cuando» o «es donde»", "porque": "define con la misma palabra, y además con <i>donde<\/i>"}, {"enun": "«Una radiografía es una cosa que te hacen en el hospital.»", "sol": "palabra imprecisa", "porque": "<i>cosa<\/i> y <i>hacer<\/i> no acotan nada: <i>una radiografía es la prueba médica que…<\/i>"}, {"enun": "«Una mutua es una empresa.»", "sol": "demasiado ancha", "porque": "una fábrica también es una empresa"}, {"enun": "«Un finiquito es algo que no es una indemnización.»", "sol": "en negativo", "porque": "<i>no es una indemnización<\/i> deja sin nombrar qué es"}, {"enun": "«Una beca es cuando te dan dinero para estudiar.»", "sol": "«es cuando» o «es donde»", "porque": "«es cuando» otra vez: <i>una beca es la ayuda económica que…<\/i>"}, {"enun": "«Un aprendiz es alguien que todavía no tiene el título.»", "sol": "en negativo|palabra imprecisa", "porque": "en negativo, y además imprecisa: <i>un aprendiz es la persona que aprende un oficio trabajando en él<\/i>"}], "usa_texto": false, "apoyo": ["Los seis errores que la clave no acepta"], "dossier_txt": "Del dossier: pieza 11, ejercicio 14 · el error"}, {"tipo": "abierta", "titulo": "Corrige las ocho definiciones", "dossier": {"cuaderno": "11", "ejercicio": 14, "parte": "la corrección"}, "ayuda": "Reescribe cada definición con las cuatro partes del esquema.", "items": [{"enun": "«Una nómina es cuando te pagan el sueldo.»", "modelo": "<i>Una nómina es el documento que la empresa entrega cada mes a quien trabaja para ella, y en el que constan el sueldo bruto, lo que se descuenta para impuestos y cotizaciones, y lo que queda por cobrar: es el papel que piden para alquilar un piso o para pedir un préstamo.<\/i>"}, {"enun": "«Un turno de noche es lo que hace mi cuñado en la fábrica.»", "modelo": "<i>Un turno de noche es la jornada de trabajo que se hace mientras la mayoría de la gente duerme, normalmente entre las diez de la noche y las seis de la mañana, y que suele pagarse con un complemento porque desordena el descanso.<\/i>"}, {"enun": "«Una lista de espera es una lista donde esperas.»", "modelo": "<i>Una lista de espera es la relación ordenada de pacientes que han pedido una prueba o una operación y todavía no la han recibido, en la que cada uno avanza según la fecha en que entró y la gravedad de su caso.<\/i>"}, {"enun": "«Una radiografía es una cosa que te hacen en el hospital.»", "modelo": "<i>Una radiografía es una prueba médica que consiste en atravesar una parte del cuerpo con rayos X para obtener una imagen de lo que hay debajo de la piel, sobre todo de los huesos. Sirve para localizar una fractura sin necesidad de abrir.<\/i>"}, {"enun": "«Una mutua es una empresa.»", "modelo": "<i>Una mutua es la entidad que colabora con la Seguridad Social en la atención de los accidentes y las enfermedades que se producen por causa del trabajo, y a la que la empresa envía a quien se lesiona en su puesto.<\/i>"}, {"enun": "«Un finiquito es algo que no es una indemnización.»", "modelo": "<i>Un finiquito es el documento con el que se cierra una relación laboral y en el que se liquida lo que la empresa debe a quien se marcha: los días trabajados del último mes, las vacaciones no disfrutadas y las pagas proporcionales.<\/i>"}, {"enun": "«Una beca es cuando te dan dinero para estudiar.»", "modelo": "<i>Una beca es la ayuda económica que una administración o una entidad concede a alguien para que pueda estudiar, y que se otorga por la renta familiar, por el expediente o por los dos criterios a la vez: quien la recibe queda exento de la matrícula y, según la renta, recibe además una cantidad para libros y transporte.<\/i>"}, {"enun": "«Un aprendiz es alguien que todavía no tiene el título.»", "modelo": "<i>Un aprendiz es la persona que entra en un oficio para aprenderlo trabajando en él, al lado de alguien con más experiencia que le va enseñando, y que por eso cobra menos y asume menos responsabilidad que un oficial.<\/i>"}], "criterio": "Los modelos de la nómina, el turno de noche, la lista de espera, la mutua, el finiquito y la beca son los de «Seis definiciones con las cuatro partes»; los de la radiografía y el aprendiz, los del apartado 7, que contestan los enunciados de 2015t y 2025t.", "usa_texto": false, "apoyo": ["El esquema, en cuatro partes", "Los seis errores que la clave no acepta"], "dossier_txt": "Del dossier: pieza 11, ejercicio 14 · la corrección"}, {"tipo": "abierta", "titulo": "Tres que no son sustantivos", "dossier": {"cuaderno": "11", "ejercicio": 15}, "ayuda": "Define cada una en la clase de palabra que le corresponde: el verbo con otro verbo, el adjetivo con <i>que…<\/i> y la frase hecha sin desmontarla palabra por palabra.", "items": [{"enun": "el verbo <i>soslayar<\/i>, en «el informe soslaya el asunto de los turnos»", "modelo": "<i>Soslayar es evitar un asunto pasando por su lado, sin entrar en él ni negarlo abiertamente.<\/i>"}, {"enun": "el adjetivo <i>reticente<\/i>, en «se mostró reticente a firmar»", "modelo": "<i>Reticente: que desconfía de algo y se resiste a hacerlo, sin llegar a negarse.<\/i>"}, {"enun": "la frase hecha <i>echar en cara<\/i>", "modelo": "<i>Echar algo en cara a alguien es reprocharle en tono de queja algo que hizo o que dejó de hacer, normalmente recordándole un favor.<\/i>"}], "criterio": "Cada una en su clase. <i>Soslayar es un verbo que significa evitar<\/i> falla igual que <i>taciturno es una persona callada<\/i>: describe la palabra en vez de definirla.", "usa_texto": false, "apoyo": ["Definir algo que no es un sustantivo"], "dossier_txt": "Del dossier: pieza 11, ejercicio 15"}, {"tipo": "abierta", "titulo": "Parecidos y diferencias", "dossier": {"cuaderno": "11", "ejercicio": 16}, "ayuda": "Escribe los parecidos y las diferencias de cada par con el formato de dos frases del apartado 7: <i>X e Y son [hiperónimo común] y los dos [propiedad compartida]. Se diferencian en que X [propiedad], mientras que Y [la propiedad contraria].<\/i>", "items": [{"enun": "un contrato fijo y un contrato temporal", "modelo": "<i>Un contrato fijo y uno temporal son las dos formas de contratar a alguien por cuenta ajena, y los dos dan de alta en la Seguridad Social. Se diferencian en la fecha de final: el temporal la lleva escrita desde el primer día, mientras que el fijo solo termina si una de las dos partes lo rompe.<\/i>"}, {"enun": "una baja y unas vacaciones", "modelo": "<i>Una baja y unas vacaciones son los dos motivos habituales por los que alguien deja de acudir al trabajo cobrando, y en los dos casos el puesto se conserva. Se diferencian en quién decide: las vacaciones se pactan con la empresa y se disfrutan, mientras que la baja la firma un médico porque no se puede trabajar.<\/i>"}, {"enun": "un instituto y un centro de adultos", "modelo": "<i>Un instituto y un centro de adultos son dos centros públicos donde se cursa la enseñanza secundaria, y los dos expiden el mismo título. Se diferencian en el público y en el horario: el instituto escolariza a adolescentes en jornada de mañana, mientras que el centro de adultos atiende a mayores de dieciocho que estudian después de trabajar.<\/i>"}], "usa_texto": false, "apoyo": ["Cuando piden comparar dos"], "dossier_txt": "Del dossier: pieza 11, ejercicio 16"}, {"tipo": "clasificar", "titulo": "¿Sirve como título de este texto?", "dossier": {"cuaderno": "11", "ejercicio": 17}, "ayuda": "Seis títulos para un texto que defiende que la lectura no mejora moralmente a quien lee. Indica si sirve cada uno; al corregir, la clave da el motivo de cada caso.", "ops": ["sirve", "no sirve"], "items": [{"enun": "<i>Leer no te hace mejor persona<\/i>", "sol": "sirve", "porque": "el enunciado pide un título que recoja el contenido del fragmento, y este recoge la tesis del autor con precisión. Lleva verbo conjugado, y los títulos que el tribunal ha aceptado son sintagmas nominales (2024s 2.1), así que el formato nominal es el más seguro de los dos; un título no se invalida por llevar verbo"}, {"enun": "<i>La lectura<\/i>", "sol": "no sirve", "porque": "demasiado ancho: vale para cualquier texto sobre libros y no distingue este"}, {"enun": "<i>El mito del lector virtuoso<\/i>", "sol": "sirve", "porque": "sintagma nominal, sin verbo conjugado, y abarca el texto entero"}, {"enun": "<i>Lectura y virtud: una relación discutida<\/i>", "sol": "sirve", "porque": "y es el más ajustado de los tres que sirven: nombra los dos términos y la discusión que el texto plantea"}, {"enun": "<i>Mi opinión sobre los libros<\/i>", "sol": "no sirve", "porque": "el título es del texto, no de quien lo lee"}, {"enun": "<i>¿Por qué hay que leer?<\/i>", "sol": "no sirve", "porque": "es una pregunta, y presupone lo contrario de lo que el texto sostiene"}], "usa_texto": false, "apoyo": ["8.1 · Proponer un título"], "dossier_txt": "Del dossier: pieza 11, ejercicio 17"}, {"tipo": "abierta", "titulo": "Resume el párrafo en tres líneas", "dossier": {"cuaderno": "11", "ejercicio": 18}, "ayuda": "Resume este párrafo en tres líneas, sin reproducir ninguna secuencia de tres palabras del original, y empezando por «En este párrafo…». Los criterios del comentario prohíben «reproducir frases del original»; el tope de tres palabras es una pauta de práctica de este dossier.", "items": [{"enun": "«El primer día que Andrés entró en la nave nadie le dijo dónde dejar el abrigo. Estuvo con él en el brazo hasta que un compañero, sin levantar la vista de la máquina, señaló con la barbilla una hilera de clavos en la pared. Colgó el abrigo en el último clavo libre y entendió, antes de que nadie se lo explicara, que allí cada cosa tenía su sitio y que el sitio se aprendía mirando.»", "modelo": "<i>En este párrafo un trabajador recién llegado averigua dónde colgar el abrigo gracias a un gesto de un compañe
