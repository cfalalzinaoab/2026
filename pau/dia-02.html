<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 2 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-09-29">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 29 de septiembre</h1>
    <p class="sub">Las tres reglas de la tilde · las cuatro pasadas del texto, el «NO» y la cuenta del −0,16 · seis palabras de un texto real</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 2, "fecha": "2026-09-29", "tab": "Día 2 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 29 de septiembre", "sub": "Las tres reglas de la tilde · las cuatro pasadas del texto, el «NO» y la cuenta del −0,16 · seis palabras de un texto real", "carriles": [{"chapa": "Carril A", "titulo": "Las tres reglas de la tilde", "meta": "20 minutos · qué es lo normal, qué se sale y cómo se contesta el ejercicio real", "teoria": "<p>Casi todas las palabras acabadas en <b>vocal, -n o -s<\/b> son llanas —<i>casa<\/i>, <i>imagen<\/i>, <i>crisis<\/i>—, y casi todas las acabadas en <b>otra consonante<\/b> son agudas —<i>reloj<\/i>, <i>papel<\/i>, <i>alquiler<\/i>—; esas no llevan tilde. La llevan las que se apartan de ese reparto: las agudas acabadas en vocal, -n o -s (<i>ojalá<\/i>, <i>canción<\/i>, <i>jamás<\/i>), las llanas acabadas en otra consonante (<i>fácil<\/i>, <i>árbol<\/i>) y todas las esdrújulas.<\/p>\n\n<h3>Las tres reglas<\/h3>\n<table>\n<tr><th>clase<\/th><th>lleva tilde cuando…<\/th><th>ejemplos<\/th><\/tr>\n<tr><td><b>aguda<\/b><\/td><td>acaba en <b>vocal, -n o -s<\/b><\/td><td><i>canción<\/i>, <i>jamás<\/i>, <i>sillón<\/i><\/td><\/tr>\n<tr><td><b>llana<\/b><\/td><td>acaba en <b>cualquier consonante que no sea -n ni -s<\/b><\/td><td><i>difícil<\/i>, <i>árbol<\/i>, <i>cárcel<\/i><\/td><\/tr>\n<tr><td><b>esdrújula<\/b> y <b>sobresdrújula<\/b><\/td><td><b>siempre<\/b><\/td><td><i>último<\/i>, <i>rapidísimo<\/i>, <i>dígamelo<\/i><\/td><\/tr>\n<\/table>\n<p>Los monosílabos quedan fuera y, por norma, no llevan tilde. Los que sí la llevan —<i>él<\/i>, <i>sí<\/i>, <i>más<\/i>— siguen otra regla, la de la tilde diacrítica, que se estudia el 15 de octubre.<\/p>\n\n<h3>Las excepciones<\/h3>\n<table>\n<tr><th>caso<\/th><th>qué pasa<\/th><th>ejemplos<\/th><\/tr>\n<tr><td>aguda acabada en <b>consonante + s<\/b><\/td><td>no lleva<\/td><td><i>complots<\/i>, <i>robots<\/i><\/td><\/tr>\n<tr><td>aguda acabada en <b>-y<\/b><\/td><td>no lleva: la <i>-y<\/i> final suena a vocal y no cuenta como tal<\/td><td><i>virrey<\/i>, <i>convoy<\/i>, <i>estoy<\/i><\/td><\/tr>\n<tr><td>llana acabada en <b>consonante + s<\/b> o en <b>-y<\/b><\/td><td>sí lleva<\/td><td><i>bíceps<\/i>, <i>cómics<\/i>, <i>yóquey<\/i><\/td><\/tr>\n<tr><td><b>mayúsculas<\/b><\/td><td>llevan tilde igual, y omitirla cuenta como falta<\/td><td>ÁFRICA, ÚLTIMO<\/td><\/tr>\n<tr><td>adverbios en <b>-mente<\/b><\/td><td>conservan la tilde del adjetivo del que salen, porque suenan con dos golpes de voz (<i>fá-cil-MEN-te<\/i>)<\/td><td><i>fácil<\/i> → <i>fácilmente<\/i>; <i>tierna<\/i> → <i>tiernamente<\/i>, sin tilde, porque <i>tierna<\/i> no la tiene<\/td><\/tr>\n<tr><td><b>compuestos sin guion<\/b><\/td><td>manda la segunda parte y la primera pierde la suya; con guion, cada una lleva la que le corresponde<\/td><td><i>kilómetros<\/i> → <i>cuentakilómetros<\/i>; <i>décimo<\/i> + <i>séptimo<\/i> → <i>decimoséptimo<\/i>; <i>físico-químico<\/i><\/td><\/tr>\n<\/table>\n\n<h3>Cómo se contesta el ejercicio real<\/h3>\n<p>El ejercicio da siete u ocho palabras escritas sin ninguna tilde y pide poner las que hagan falta. De las 79 palabras que han caído en los diez ejercicios, 30 no llevan tilde: casi cuatro de cada diez están puestas para que alguien les ponga una tilde que no les toca, y en la clave del examen una tilde de más cuenta como error igual que una que falta. Se contesta en tres pasos, siempre en este orden:<\/p>\n<ol>\n<li><b>Di la palabra en voz alta<\/b> y localiza la sílaba tónica. Sin la sílaba tónica no se puede clasificar la palabra.<\/li>\n<li><b>Clasifícala<\/b>: aguda, llana, esdrújula o sobresdrújula.<\/li>\n<li><b>Comprueba en qué acaba<\/b> y aplica la regla. Si es una llana acabada en vocal, en -n o en -s, déjala como está: veinte de las treinta palabras sin tilde se resuelven en este paso.<\/li>\n<\/ol>\n<p>El señuelo típico es una palabra de uso diario —<i>examen<\/i>, <i>volumen<\/i>, <i>crisis<\/i>, <i>imagen<\/i>—, llana y acabada en -n o en -s, de las que no llevan tilde, y desconcierta porque solo se comprueba de cerca cuando hay que decidir si le falta algo. Dejarla como está cuenta como respuesta, y la clave la corrige como tal.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Qué regla manda?", "ayuda": "Nueve palabras escritas sin ninguna tilde, como en el examen. Para cada una, dila en voz alta, clasifícala y comprueba en qué acaba antes de elegir la regla que manda. Todavía no hay que escribir nada.", "ops": ["aguda acabada en vocal, -n o -s: lleva", "llana acabada en otra consonante: lleva", "esdrújula: lleva siempre", "aguda en otra consonante o llana en vocal, -n o -s: no lleva"], "items": [{"enun": "<i>orden<\/i>", "sol": "aguda en otra consonante o llana en vocal, -n o -s: no lleva", "porque": "<b>or<\/b>-den: llana acabada en -n"}, {"enun": "<i>balcon<\/i>", "sol": "aguda acabada en vocal, -n o -s: lleva", "porque": "bal-<b>cón<\/b>: aguda acabada en -n"}, {"enun": "<i>analisis<\/i>", "sol": "esdrújula: lleva siempre", "porque": "a-<b>ná<\/b>-li-sis: la fuerza tres sílabas atrás"}, {"enun": "<i>cesped<\/i>", "sol": "llana acabada en otra consonante: lleva", "porque": "<b>cés<\/b>-ped: llana acabada en -d, que no es ni -n ni -s"}, {"enun": "<i>salud<\/i>", "sol": "aguda en otra consonante o llana en vocal, -n o -s: no lleva", "porque": "sa-<b>lud<\/b>: aguda acabada en -d"}, {"enun": "<i>interes<\/i>", "sol": "aguda acabada en vocal, -n o -s: lleva", "porque": "in-te-<b>rés<\/b>: aguda acabada en -s"}, {"enun": "<i>lapiz<\/i>", "sol": "llana acabada en otra consonante: lleva", "porque": "<b>lá<\/b>-piz: llana acabada en -z"}, {"enun": "<i>alquiler<\/i>", "sol": "aguda en otra consonante o llana en vocal, -n o -s: no lleva", "porque": "al-qui-<b>ler<\/b>: aguda acabada en -r"}, {"enun": "<i>semaforo<\/i>", "sol": "esdrújula: lleva siempre", "porque": "se-<b>má<\/b>-fo-ro"}], "criterio": "Tres de las nueve palabras se quedan como están, y en el ejercicio real la proporción es parecida: de las 79 palabras que han caído en los diez ejercicios, 30 no llevan tilde, y 20 de esas 30 son llanas acabadas en vocal, -n o -s, como <i>orden<\/i>. Quien clasifica primero y comprueba la terminación después las deja como están; quien empieza por buscar dónde poner la tilde se la pone a <i>orden<\/i> y a <i>salud<\/i>, las dos formas que no la llevan.", "apoyo": ["Las tres reglas", "Cómo se contesta el ejercicio real"]}, {"tipo": "hueco", "titulo": "Ocho palabras, como en el examen", "estricto": true, "ayuda": "Ocho palabras escritas sin ninguna tilde, en el formato del ejercicio real. Copia cada una con la tilde puesta si le corresponde y tal cual si no. El enunciado no indica cuántas llevan, igual que el del examen.", "items": [{"enun": "<i>tambien<\/i>", "sol": "también", "porque": "tam-<b>bién<\/b>: aguda acabada en -n"}, {"enun": "<i>martes<\/i>", "sol": "martes", "porque": "<b>mar<\/b>-tes: llana acabada en -s, se queda como está"}, {"enun": "<i>movil<\/i>", "sol": "móvil", "porque": "<b>mó<\/b>-vil: llana acabada en -l"}, {"enun": "<i>numero<\/i>", "sol": "número", "porque": "<b>nú<\/b>-me-ro: esdrújula"}, {"enun": "<i>hotel<\/i>", "sol": "hotel", "porque": "ho-<b>tel<\/b>: aguda acabada en -l, sin tilde"}, {"enun": "<i>tramite<\/i>", "sol": "trámite", "porque": "<b>trá<\/b>-mi-te: esdrújula"}, {"enun": "<i>turno<\/i>", "sol": "turno", "porque": "<b>tur<\/b>-no: llana acabada en vocal"}, {"enun": "<i>ingles<\/i>", "sol": "inglés", "porque": "in-<b>glés<\/b>: aguda acabada en -s"}], "criterio": "El enunciado no indica cuántas llevan tilde, y el del examen tampoco. Las tres que se quedan como están son de las formas que no llevan tilde: una llana acabada en -s, una aguda acabada en -l y una llana acabada en vocal. La corrección comprueba en cada palabra si lleva tilde y en qué sílaba: ⊗<i>tramíte<\/i>, con la tilde en la sílaba equivocada, es una palabra mal escrita, igual que <i>tramite<\/i> sin tilde.", "apoyo": ["Las tres reglas", "Cómo se contesta el ejercicio real"]}, {"tipo": "hueco", "titulo": "Las excepciones", "estricto": true, "ayuda": "Ocho palabras en las que la regla general no basta. Copia cada una como se escribe, con tilde o sin ella; en las mayúsculas, con mayúsculas.", "items": [{"enun": "<i>AFRICA<\/i>", "sol": "ÁFRICA", "porque": "las mayúsculas llevan tilde igual: <b>Á<\/b>-FRI-CA es esdrújula"}, {"enun": "<i>unicamente<\/i>", "sol": "únicamente", "porque": "conserva la tilde de <i>única<\/i>"}, {"enun": "<i>tranquilamente<\/i>", "sol": "tranquilamente", "porque": "<i>tranquila<\/i> no lleva tilde, y el adverbio tampoco"}, {"enun": "<i>jersey<\/i>", "sol": "jersey", "porque": "aguda acabada en -y: la -y final no cuenta como vocal"}, {"enun": "<i>records<\/i>", "sol": "récords", "porque": "<b>ré<\/b>-cords: llana acabada en consonante + s"}, {"enun": "<i>cortacesped<\/i>", "sol": "cortacésped", "porque": "compuesto sin guion: manda la segunda parte, <i>césped<\/i>"}, {"enun": "<i>decimoquinto<\/i>", "sol": "decimoquinto", "porque": "compuesto sin guion: <i>décimo<\/i> pierde su tilde y la palabra entera es llana acabada en vocal"}, {"enun": "<i>fisico-quimico<\/i>", "sol": "físico-químico", "porque": "con guion, cada parte conserva la suya"}], "criterio": "En las ocho la regla general no basta: hay que saber que la mayúscula no exime de la tilde, que el adverbio en <i>-mente<\/i> la hereda del adjetivo y solo si el adjetivo la tenía, que la <i>-y<\/i> final no cuenta como vocal y que en el compuesto sin guion manda la última parte. De las 79 palabras del censo, una sola es un adverbio en <i>-mente<\/i> y ninguna es una mayúscula ni un compuesto; las excepciones se aprenden porque aparecen en lo que se escribe: un adverbio en <i>-mente<\/i> sin su tilde o un nombre propio en mayúsculas sin la suya son faltas en la redacción, en los dos exámenes.", "apoyo": ["Las excepciones"]}], "cuaderno": [{"pieza": 1, "apartados": [4, 5], "ejercicios": [4, 5]}, {"pieza": 2, "apartados": [1, 2], "ejercicios": [1]}], "cuaderno_txt": "Pieza 1 · La sílaba y el acento — apartados 4 y 5: La familia que más aparece: las formas de vosotros; Cómo se contesta el ejercicio real (p. 10 y 11) · ejercicios 4 y 5 · Pieza 2 · Vocales en contacto — apartados 1 y 2: Abiertas y cerradas; El diptongo (p. 14) · ejercicio 1"}, {"chapa": "Carril B", "titulo": "Leer el texto entero", "meta": "60 minutos · el «NO», la cuenta del −0,16 y la lectura guiada de 2016t, que está en el carril «El texto»", "teoria": "<p>Hoy en clase se lee guiado el primer texto real del curso, el artículo de Luis Muiño de la convocatoria de 2016 —«¿Somos lo que parecemos ser en internet?»—, con sus seis preguntas y el método del jueves: las cuatro pasadas y las clases de pregunta. El artículo y sus preguntas están más abajo, en el carril «El texto»; en clase se trabaja sobre la fotocopia del cuadernillo. Lo que se añade hoy es la pregunta formulada en negativo y la cuenta del −0,16.<\/p>\n\n<h3>El «NO»<\/h3>\n<p>En uno de cada dos exámenes de castellano y en los seis de comentario hay una pregunta formulada en negativo: «¿cuál de las siguientes afirmaciones es <b>falsa<\/b>?», «¿cuál <b>NO<\/b> está usada en sentido figurado?». El enunciado lo marca en mayúsculas o en negrita, y aun así la pregunta va en dirección contraria a las otras cinco: tiene tres opciones que cumplen y una que no. Quien lee deprisa busca la opción que sí cumple, la encuentra —porque hay tres— y la marca. El paso que lo evita ocupa tres segundos: <b>rodear la palabra NO en el enunciado antes de leer las opciones<\/b>.<\/p>\n<p>Un ejemplo real. 2025t, 1.6: «¿Cuál de las siguientes expresiones NO está usada en sentido figurado en el texto?» a) A tiro de piedra. b) Gatos al sol. c) Iglesias de relumbrón. d) Corazón de la ciudad. La respuesta es la b): las otras tres son figuradas; <i>gatos al sol<\/i> son gatos, al sol.<\/p>\n\n<h3>Cuándo contestar y cuándo dejarlo en blanco<\/h3>\n<p>Cada error descuenta 0,16 y la pregunta en blanco se queda en cero. <b>La regla: en cuanto puedas tachar una sola opción, contesta.<\/b> Sin ninguna opción tachada, contestar al azar y dejarlo en blanco dan casi lo mismo: cinco milésimas de diferencia a favor de contestar.<\/p>\n\n<h3>Leer el texto entero<\/h3>\n<p>Los dos exámenes empiezan igual: un texto de entre doscientas veinte y\ncuatrocientas sesenta palabras y seis preguntas de opción múltiple. Son tres\npuntos de los diez, y se contestan sobre un texto que se acaba de leer una sola\nvez.<\/p>\n\n<h3>Las cuatro pasadas<\/h3>\n<ol>\n<li><b>Leer el texto entero de una vez<\/b>, sin subrayar nada, para saber de\nqué va y cómo termina.<\/li>\n<li><b>Leer las seis preguntas<\/b> antes de volver al texto, y rodear en cada\nuna la palabra que indica qué se pide.<\/li>\n<li><b>Contestar las que se localizan<\/b>, volviendo al texto pregunta por\npregunta y anotando al margen la línea donde está la respuesta.<\/li>\n<li><b>Contestar al final las que van sobre el texto entero<\/b>, cuando ya se ha\nvuelto a él cuatro o cinco veces.<\/li>\n<\/ol>\n<p>El orden importa porque contestar las cinco primeras obliga a volver al texto\ncuatro o cinco veces, y la global se contesta con ese texto ya releído.<\/p>\n\n<h3>Qué preguntan las seis<\/h3>\n<p>El reparto se repite convocatoria tras convocatoria: <b>dos preguntas\nglobales<\/b> sobre el texto entero —la intención del autor, lo que se desprende\ndel conjunto—, <b>dos locales<\/b> que se resuelven en una línea, <b>una de\nléxico<\/b> —un sinónimo, un antónimo, el significado de una palabra en su\ncontexto— y <b>una rotativa<\/b>, que cambia de convocatoria: una figura\nretórica, un marcador discursivo, los rasgos del texto narrativo.<\/p>\n<p>Saber de qué clase es cada pregunta ahorra tiempo: la local se busca, la\nglobal se piensa, y la de léxico se resuelve metiendo cada opción en la oración\ndel texto y leyéndola entera.<\/p>\n\n<h3>La pregunta de léxico<\/h3>\n<p>Cae en todos los exámenes de los dos tribunales, y en algunos aparece dos veces.\nContando las de los diez textos del banco y las de la tanda del 27 de octubre,\nel censo da <b>veintitrés preguntas de léxico<\/b> con su enunciado y su clave, y\n<b>no todas se contestan igual<\/b>: hay ocho formas.<\/p>\n<ul>\n<li><b>Sinónimo entre cuatro opciones<\/b>, y con un antónimo colado entre\nellas: «¿cuál es un sinónimo de <i>indeleble<\/i>?»<\/li>\n<li><b>Antónimo entre cuatro opciones<\/b>, y con dos o tres sinónimos colados:\n«elija un antónimo para el adjetivo <i>ilusa<\/i>».<\/li>\n<li><b>La pregunta con NO<\/b>: «¿cuál de estas palabras NO es un sinónimo de\n<i>insondable<\/i>?». Tres opciones cumplen y una no.<\/li>\n<li><b>Cuatro definiciones<\/b> para elegir una: «¿cuál es el significado en el\ntexto de <i>mi suerte natural<\/i>?». Aquí la trampa es la opción que empieza por «es\nsinónimo de…» en vez de dar el significado.<\/li>\n<li><b>El hiperónimo<\/b>, que pide el nombre de la clase y no otra palabra para\nlo mismo: el hiperónimo de <i>tufo<\/i> es <i>efluvio<\/i>, no <i>hedor<\/i>.<\/li>\n<li><b>La abierta de una palabra<\/b>: «proponga un sinónimo de\n<i>aferrados<\/i>». Se escribe una palabra, y de la clase que pida el\nenunciado.<\/li>\n<li><b>La abierta de explicación<\/b>: «explique el significado de la expresión\n<i>romper el silencio<\/i>». Se escribe una oración.<\/li>\n<li><b>El campo semántico<\/b>: «identifique cinco palabras del campo semántico\nde la luz». Es la única que resta 0,1 por cada palabra mal identificada, así que\nse escriben cinco y no seis.<\/li>\n<\/ul>\n<p><b>Nueve de las veintitrés no traen opciones.<\/b> Quien solo practica el test\nllega a más de un tercio de estas preguntas sin método.<\/p>\n<p>Y el método es el mismo para las ocho: subrayar en el enunciado la palabra\nque indica qué piden, volver al texto y leer <b>la oración entera<\/b> donde está\nla palabra, tapar las opciones y formular el significado con las propias palabras,\nantes de buscar cuál de las cuatro se parece a esa formulación. Quien\nhace ese tercer paso ya tiene contestadas las dos formas que no traen\nopciones.<\/p>\n", "ejercicios": [{"tipo": "hueco", "titulo": "¿En qué línea está la respuesta?", "estricto": true, "ayuda": "Escribe el número de la línea donde <b>empieza<\/b> la respuesta; si ocupa dos, valen las dos. Es la tercera pasada del método: se vuelve al texto pregunta por pregunta y se anota al margen del cuadernillo dónde está cada una.", "items": [{"enun": "¿A qué tres figuras de cuento infantil recurre el autor al hablar de la identidad digital?", "sol": "2|3"}, {"enun": "¿Cómo llama el texto a manifestar emociones en la red?", "sol": "7"}, {"enun": "¿Qué dice el autor que hacemos continuamente con lo que no nos gusta de nosotros?", "sol": "17"}, {"enun": "¿Qué echan de menos quienes no vivieron su juventud en la era digital?", "sol": "31|32"}, {"enun": "Según el texto, ¿qué ha dejado de funcionar para saber si podemos confiar en alguien?", "sol": "27"}], "criterio": "Las cinco se contestan volviendo al texto y ninguna pide interpretar. Anotar el número al lado de la pregunta ocupa dos segundos y evita releer el artículo entero cuando hay que comprobar una respuesta al final de la hora.", "apoyo": ["intro"]}, {"tipo": "opcion", "titulo": "¿Contestas o lo dejas en blanco?", "ayuda": "Siete situaciones en un test de seis preguntas. En cada una, decide si contestas o lo dejas en blanco, y cuántas opciones has podido tachar con una razón.", "ops": ["ninguna tachada: en blanco", "una tachada: contesta", "dos tachadas: contesta", "localizada en el texto: contesta"], "items": [{"enun": "No has encontrado el párrafo y las cuatro opciones te suenan igual.", "sol": "ninguna tachada: en blanco", "porque": "sin ninguna opción tachada, contestar equivale a elegir al azar"}, {"enun": "Has descartado la d) porque afirma lo contrario que el texto.", "sol": "una tachada: contesta", "porque": "una tachada con una razón: quedan tres"}, {"enun": "Dudas entre la a) y la c); las otras dos hablan de algo que el texto no menciona.", "sol": "dos tachadas: contesta", "porque": "dos tachadas con una razón: quedan dos"}, {"enun": "Estás seguro de la b): la has localizado en la línea 12.", "sol": "localizada en el texto: contesta", "porque": "la respuesta localizada en el texto vale entera"}, {"enun": "Has tachado dos opciones porque contradicen una cifra del texto, y las otras dos te parecen iguales.", "sol": "dos tachadas: contesta", "porque": "dos tachadas: la duda queda entre dos, y contestar puntúa de media"}, {"enun": "Has leído las cuatro opciones dos veces y no puedes tachar ninguna con una razón.", "sol": "ninguna tachada: en blanco", "porque": "leerlas dos veces no tacha ninguna: la elección sigue siendo al azar"}, {"enun": "Una opción repite palabras del texto pero afirma lo contrario; las otras tres no las has podido comprobar todavía.", "sol": "una tachada: contesta", "porque": "una tachada y tres sin comprobar: quedan tres"}], "criterio": "La regla es una sola: en cuanto puedas tachar una opción con una razón —afirma lo contrario que el texto, habla de algo que el texto no menciona—, contesta. Las dos que se dejan en blanco son las dos en las que no se ha tachado nada, y ahí contestar al azar y no contestar dan casi lo mismo: cinco milésimas de diferencia a favor de contestar. Leer las opciones otra vez no cuenta como tacharlas.", "apoyo": ["Cuándo contestar y cuándo dejarlo en blanco"], "usa_texto": false}, {"tipo": "clasificar", "titulo": "¿Con cuál se empieza?", "ops": ["se busca en el texto", "se prueban las opciones en la oración", "se deja para el final"], "ayuda": "Seis preguntas sobre el artículo de Luis Muiño, inventadas en el formato del examen. Marca qué hay que hacer con cada una antes de contestar ninguna.", "items": [{"enun": "«Según se desprende del texto, la comunicación en la red…»", "sol": "se deja para el final", "porque": "global: «se desprende» avisa de que la respuesta no está escrita en ninguna línea: se deduce del conjunto"}, {"enun": "«Según el autor, ¿cuándo representamos con más fuerza el papel que mostramos a los demás?»", "sol": "se busca en el texto", "porque": "local: la respuesta está escrita en el texto —en los primeros momentos de las relaciones— y se localiza"}, {"enun": "«Proponga un sinónimo de <i>denigrar<\/i> en el texto.»", "sol": "se prueban las opciones en la oración", "porque": "de léxico: pide una palabra que encaje en esa oración"}, {"enun": "«¿Cuál es la principal intención del autor de este texto?»", "sol": "se deja para el final", "porque": "global: pregunta por el texto entero, y se contesta al final"}, {"enun": "«Según el último párrafo, ¿qué nos descoloca cuando chateamos con alguien?»", "sol": "se busca en el texto", "porque": "local: un dato, en unas líneas concretas del último párrafo"}, {"enun": "«¿Qué significa en el texto la expresión <i>cara a cara<\/i>?»", "sol": "se prueban las opciones en la oración", "porque": "de léxico: el significado de una expresión en su contexto"}], "criterio": "Decidir esto antes de contestar es la segunda pasada, y fija el orden del resto del ejercicio: primero las que se buscan y la de léxico, y al final las globales, con el texto ya releído. Las globales se reconocen por el verbo del enunciado: <i>se desprende<\/i>, <i>pretende<\/i>, <i>defiende<\/i>.", "apoyo": ["Qué preguntan las seis"]}], "cuaderno": {"pieza": 10, "apartados": [1, 2, 3, 4, 5], "ejercicios": [1, 2, 3, 4, 5, 6, 7]}, "cuaderno_txt": "Pieza 10 · Leer el texto entero y contestar el test — apartados 1, 2, 3, 4 y 5: Las cuatro pasadas; Qué preguntan las seis; La pregunta de léxico, que tiene ocho formas; El «NO»; Cuándo contestar y cuándo dejarlo en blanco (p. 46, 47 y 51) · ejercicios 1, 2, 3, 4, 5, 6 y 7"}, {"chapa": "El texto", "titulo": "«¿Somos lo que parecemos ser en internet?», de Luis Muiño", "meta": "Convocatoria 2016, tribunal ordinario · 346 palabras · en clase, lectura guiada: el profesor resuelve las seis preguntas en voz alta con el método", "literal": true, "teoria": "<p>Este es el texto que se lee hoy en clase, tal como lo reproduce el cuadernillo de la prueba de 2016; en clase se trabaja sobre la fotocopia del cuadernillo, y aquí está para volver a él en casa. Es un examen del formato antiguo, con tres preguntas de test y tres abiertas; desde 2020 caen cinco o seis de test de seis. Se usa el primero por eso: las tres abiertas obligan a decir en voz alta cómo se ha llegado a la respuesta. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "¿Somos lo que parecemos ser en internet?", "entrada": "Luis Muiño · <i>La Vanguardia Magazine<\/i>, 4 de octubre de 2015 · texto adaptado, tal como lo reproduce el cuadernillo de Llengua castellana de 2016 (tribunal ordinario).", "lineas": ["Cuando se habla de la consistencia de nuestra identidad", "digital, seguimos creyendo en cuentos de hadas, príncipes y", "villanos. Miles de artículos dedicados a este tema utilizan", "términos que cuestionan nuestra forma de ser en internet", "porque no es «auténtica». Se habla de «falsa imagen» para", "referirse a lo que contamos de nosotros mismos, se califica de", "«pornografía emocional» al hecho de manifestar emociones en", "red o de «amor virtual» (en el sentido de fantasioso e", "inconsistente) a hablar de los lazos amorosos on line.", "", "Pero esta forma de denigrar la comunicación en la red es ilusa", "porque mitifica nuestra forma de relacionarnos cara a cara.", "Criticar internet porque en la red solo contamos lo mejor de", "nosotros mismos supone afirmar implícitamente que ese fenómeno", "no sucede en otros ámbitos. Pero esa idílica idea choca contra", "todos los datos de la investigación psicológica. Los seres", "humanos siempre seleccionamos lo que mostramos a los demás y", "hacemos esfuerzos continuos para ocultar lo que no nos gusta", "de nosotros mismos. […] Los seres humanos construimos un modo", "de presentarnos ante los demás, un papel que reúne los", "aspectos de nosotros mismos de los que nos sentimos más", "orgullosos. Representamos ese rol con todas nuestras fuerzas", "en los primeros momentos de las relaciones y después", "intentamos mantenerlo en la medida de lo posible. Ocurre en", "internet… y en cualquier otra forma de trato humano.", "", "¿Por qué nos descoloca entonces la simulación on line? Vivimos", "una época de cambio, y no es fácil encontrar nuevas «normas de", "seguridad». Los antiguos métodos para saber si podemos confiar", "en los otros no funcionan en la red. Pero aun así, la mayoría", "de las personas (los que no hemos vivido nuestra juventud en", "la era digital) seguimos aferrados a los viejos patrones de", "detección de la mentira. Echamos de menos el contacto cara a", "cara porque creemos que en esa situación captaríamos mejor la", "personalidad de nuestro interlocutor. O nos descoloca que no", "haya personas en común (amigos o familia) con la persona con", "la que chateamos porque pensamos que eso nos resta", "información."], "pie": "Texto de Luis Muiño (<i>La Vanguardia Magazine<\/i>, 4 de octubre de 2015), en la versión adaptada del cuadernillo oficial de la PAU +25 de 2016, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2016_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las tres preguntas de test", "ayuda": "Las preguntas 1.1 a 1.3 del cuadernillo, literales, con su respuesta oficial. Contesta con el método: las locales se buscan, la global se piensa al final.", "items": [{"enun": "<b>1.1<\/b> El autor del artículo cree que", "conv": "2016t", "ops": ["la relación cara a cara muestra nuestra verdadera personalidad.", "nuestra imagen digital refleja fielmente nuestra personalidad.", "ni la imagen virtual ni las relaciones personales son el fiel reflejo de lo que realmente somos.", "las relaciones personales son de calidad inferior a las virtuales."], "sol": "ni la imagen virtual ni las relaciones personales son el fiel reflejo de lo que realmente somos.", "porque": "es la pregunta de la tesis, y trae el diseño que más se repite en las globales: las opciones a) y b) recogen las dos mitades simples de una oposición, y la clave corresponde a la opción que se niega a elegir entre las dos. Está en el último párrafo"}, {"enun": "<b>1.2<\/b> El autor insiste en que para crear nuestra imagen", "conv": "2016t", "ops": ["acentuamos nuestras virtudes.", "mostramos lo que menos nos satisface de nosotros mismos.", "seleccionamos nuestras relaciones.", "simulamos tener otra personalidad."], "sol": "acentuamos nuestras virtudes.", "porque": "local, líneas 17 a 22: «un papel que reúne los aspectos de nosotros mismos de los que nos sentimos más orgullosos». El distractor b) afirma lo contrario"}, {"enun": "<b>1.3<\/b> De entre las siguientes opciones, elija un antónimo para el adjetivo <i>ilusa<\/i> en el texto.", "conv": "2016t", "ops": ["Realista.", "Idealista.", "Altruista.", "Quimérica."], "sol": "Realista.", "porque": "pide un antónimo, y dos de las opciones —<i>idealista<\/i>, <i>quimérica<\/i>— son sinónimos de <i>ilusa<\/i>. Subrayar la palabra <i>antónimo<\/i> antes de leer las opciones es la misma operación que rodear el NO"}], "criterio": "Medio punto por respuesta correcta y 0,16 de descuento por cada error, como en todas las de test. La 1.1 se contesta al final, con el último párrafo releído; la 1.2 se localiza; en la 1.3, quien lee deprisa busca una palabra que se parezca a <i>ilusa<\/i> y encuentra dos.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "El antecedente", "ayuda": "Se copia del texto, sin reformular.", "items": [{"enun": "<b>1.4<\/b> ¿Cuál es el antecedente en el texto del sintagma <i>este tema<\/i>?", "conv": "2016t", "sol": "nuestra identidad digital|la consistencia de nuestra identidad digital|identidad digital|la identidad digital|la consistencia de la identidad digital", "porque": "la clave oficial admite las dos versiones: «(la consistencia de) nuestra identidad digital», líneas 1 y 2"}], "criterio": "El paréntesis de la clave indica que se admite la versión corta. Se da el punto si se nombra el sintagma; no hace falta redactar una frase.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Las dos abiertas", "ayuda": "Con tus palabras, sin copiar frases del texto: la 1.5 en una o dos líneas, la 1.6 en una palabra.", "items": [{"enun": "<b>1.5<\/b> Indique a qué idea del texto se refiere el autor con la expresión <i>idílica idea<\/i>.", "conv": "2016t", "modelo": "Clave oficial: contamos lo mejor de nosotros mismos —«maquillamos» nuestra identidad— solo en la red, y no en el contacto personal. La respuesta tiene dos mitades, qué hacemos y dónde lo hacemos; una respuesta con solo la primera contesta a medias, y el ítem vale 0,5 sin fracciones publicadas: el descuento lo decide el corrector."}, {"enun": "<b>1.6<\/b> Proponga un sinónimo de <i>aferrados<\/i> en el texto.", "corto": true, "conv": "2016t", "modelo": "Clave oficial: apegados, sujetos, agarrados… Admite cualquier sinónimo que funcione en la frase «seguimos aferrados a los viejos patrones de detección de la mentira»: se corrige sustituyendo la palabra y leyendo la oración entera."}], "criterio": "La 1.5 es la antepasada de la pregunta 2.3 del comentario: dan una expresión del texto y piden la idea que hay detrás. Aquí se aplica por primera vez la regla de no reproducir frases del original.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [1]}, {"pieza": "TEXTOS", "apartados": [1]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 1: 2016, tribunal ordinario · «¿Somos lo que parecemos ser en internet?» (p. 249) · Los textos de cada sesión — apartado 1: «¿Somos lo que parecemos ser en internet?» · texto de examen"}, {"chapa": "Carril C", "titulo": "Seis palabras de un texto real", "meta": "10 minutos · la tanda del martes: las nueve clases sobre el texto que se ha leído en clase", "teoria": "<p>El jueves se dieron la tabla de las nueve clases y las tres preguntas con oraciones cortas. Hoy la tanda es de diez minutos y va sobre el texto real que se ha leído en clase: seis palabras del artículo de Luis Muiño (2016t), cada una dentro de su oración, en el formato del examen —la palabra, la oración donde está y cuatro clases para elegir—.<\/p>\n\n<h3>Las tres preguntas, otra vez<\/h3>\n<ol>\n<li><b>¿Cambia de forma?<\/b> Si admite femenino o plural, es sustantivo, adjetivo, determinante o pronombre. Si no cambia nunca, es adverbio, preposición o conjunción.<\/li>\n<li><b>¿Acompaña a un sustantivo o va en su lugar?<\/b> Si lo acompaña, es determinante; si va sola, pronombre.<\/li>\n<li><b>¿Une o modifica?<\/b> La que une es conjunción, sea entre dos elementos del mismo rango o metiendo una oración dentro de otra; la que va delante de su complemento y forma grupo con él es preposición; la que modifica y se puede quitar sin que falte nada es adverbio.<\/li>\n<\/ol>\n\n<h3>Lo que cambia en un texto real<\/h3>\n<p>En las oraciones del jueves la palabra preguntada tenía dos o tres palabras alrededor. En un texto de examen viene dentro de una oración de veinte o treinta, y las tres preguntas se hacen igual, pero antes hay que aislar lo que decide: qué palabra tiene inmediatamente al lado y a cuál modifica. En «en la red <b>solo<\/b> contamos lo mejor de nosotros mismos», la clase de <i>solo<\/i> la decide que va delante del verbo <i>contamos<\/i> y equivale a <i>solamente<\/i>; el resto de la oración no interviene. Y la misma palabra cambia de clase con lo que tiene al lado: <i>solo<\/i> es adjetivo en «vino solo», donde admite femenino, <i>vino sola<\/i>.<\/p>\n<p>Una palabra con dos clases posibles se presta a esta pregunta porque admite las dos, y la clase que no toca en esa oración aparece entre las cuatro opciones haciendo de distractor. Por eso la respuesta se busca en la oración y no en la palabra: <i>mejor<\/i> es adjetivo en «un trabajo mejor» y adverbio en «captaríamos mejor la personalidad».<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis palabras del texto de hoy", "ayuda": "Seis palabras del artículo de Luis Muiño (2016t), cada una en la oración donde está, con cuatro opciones como en el examen. Las oraciones son literales; las respuestas son de este curso, no de una clave oficial.", "items": [{"enun": "«<b>Pero<\/b> esta forma de denigrar la comunicación en la red es ilusa»", "ops": ["adverbio", "preposición", "conjunción", "pronombre"], "sol": "conjunción", "porque": "une esta oración con la anterior y la opone a ella, y no cambia de sitio: <i>sin embargo<\/i>, que es adverbio, admite «esta forma, sin embargo, es ilusa»; <i>pero<\/i> no admite ⊗«esta forma, pero, es ilusa»"}, {"enun": "«en la red <b>solo<\/b> contamos lo mejor de nosotros mismos»", "ops": ["adverbio", "adjetivo", "sustantivo", "determinante"], "sol": "adverbio", "porque": "equivale a <i>solamente<\/i>, modifica a <i>contamos<\/i> y no cambia de forma: en «vino solo» sí cambiaría, <i>vino sola<\/i>"}, {"enun": "«Pero <b>esa<\/b> idílica idea choca contra todos los datos»", "ops": ["pronombre", "determinante", "adjetivo", "adverbio"], "sol": "determinante", "porque": "acompaña a <i>idea<\/i> y concuerda con ella en femenino; el adjetivo <i>idílica<\/i> en medio no cambia nada"}, {"enun": "«hacemos esfuerzos <b>continuos<\/b> para ocultar lo que no nos gusta»", "ops": ["adverbio", "sustantivo", "verbo", "adjetivo"], "sol": "adjetivo", "porque": "expresa cómo son los esfuerzos y concuerda con el sustantivo en masculino plural: <i>esfuerzo continuo<\/i>, <i>esfuerzos continuos<\/i>"}, {"enun": "«pensamos que <b>eso<\/b> nos resta información»", "ops": ["pronombre", "determinante", "conjunción", "adverbio"], "sol": "pronombre", "porque": "va solo y ocupa el sitio de una idea entera, la de que no haya personas en común con quien chateamos; el neutro nunca acompaña a un sustantivo"}, {"enun": "«creemos que en esa situación captaríamos <b>mejor<\/b> la personalidad»", "ops": ["sustantivo", "adjetivo", "adverbio", "preposición"], "sol": "adverbio", "porque": "modifica a <i>captaríamos<\/i> y no cambia aunque cambie el resto: <i>captarían mejor las personalidades<\/i>, sin ⊗<i>mejores<\/i>"}], "criterio": "Las seis palabras están elegidas porque tienen otra clase en otra oración: <i>solo<\/i> y <i>mejor<\/i> son adjetivos cuando concuerdan con un sustantivo, <i>esa<\/i> es pronombre cuando va sola, y <i>pero<\/i> se confunde con adverbios como <i>sin embargo<\/i>, que también unen oraciones y, a diferencia de él, pueden cambiar de sitio. Las cuatro opciones de cada ítem incluyen siempre esa otra clase, y quien contesta por la palabra y no por la oración la marca. Dos de las seis respuestas son <i>adverbio<\/i>, la respuesta oficial en diez de los doce ítems reales: contestar siempre adverbio acierta esas dos y falla las otras cuatro.", "apoyo": ["Las tres preguntas, otra vez", "Lo que cambia en un texto real"]}, {"tipo": "abierta", "titulo": "Explícalo con las tres preguntas", "ayuda": "Dos o tres líneas por ítem: nombra la pregunta que lo decide y compara las dos oraciones.", "items": [{"enun": "¿Cómo decides que <i>esa<\/i> es determinante en «esa idílica idea» y que <i>eso<\/i> es pronombre en «eso nos resta información»?", "modelo": "Se comprueba si tienen un sustantivo al lado. <i>Esa<\/i> acompaña a <i>idea<\/i> —con el adjetivo <i>idílica<\/i> en medio— y concuerda con ella en femenino: determinante. <i>Eso<\/i> va solo, no acompaña a ningún sustantivo y ocupa el sitio de una idea entera, la de que no haya personas en común: pronombre. Además <i>eso<\/i> es neutro, y el neutro nunca acompaña a un sustantivo."}, {"enun": "<i>Mejor<\/i> es adjetivo en «un trabajo mejor» y adverbio en «captaríamos mejor la personalidad». ¿Qué pregunta de la prueba lo decide, y cómo?", "modelo": "La primera: si cambia de forma. En «un trabajo mejor» concuerda con el sustantivo y admite plural, «unos trabajos mejores»: adjetivo. En «captaríamos mejor la personalidad» modifica al verbo y no cambia aunque cambie el resto, «captarían mejor las personalidades», sin ⊗<i>mejores<\/i>: adverbio."}], "criterio": "Una explicación completa nombra la pregunta de la prueba que decide, la aplica a las dos oraciones y señala qué cambia entre ellas: con qué sustantivo concuerda la palabra en una y a qué palabra modifica en la otra. La que solo afirma «una es determinante y la otra pronombre» repite la respuesta sin la prueba.", "apoyo": ["Las tres preguntas, otra vez"]}], "cuaderno": {"pieza": 6, "apartados": [1]}, "cuaderno_txt": "Pieza 6 · Las nueve clases y la categoría de una palabra en su oración — apartado 1: Las nueve clases (p. 147)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El artículo de Luis Muiño (<i>La Vanguardia Magazine<\/i>, 2015), reproducido en el carril «El texto» en la versión adaptada del cuadernillo de 2016, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual; las oraciones del carril C son fragmentos suyos.", "revision": "2026-09-23"};</script>
<script>

(function () {

  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;

    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:

          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
