b) abundante · c) insuficiente · d) corto", "sol": "el antónimo colado en una pregunta de sinónimo", "porque": "la b), <i>abundante<\/i>: es el antónimo colado en una pregunta de sinónimo"}, {"enun": "<i>Antónimo de<\/i> <b>efímero<\/b>: a) fugaz · b) duradero · c) pasajero · d) breve", "sol": "el sinónimo colado en una pregunta de antónimo", "porque": "la a), la c) y la d): son tres sinónimos en una pregunta de antónimo, y la única válida es la b), <i>duradero<\/i>"}, {"enun": "<i>Sinónimo de<\/i> <b>inhóspito<\/b>: a) inhabitable · b) inhalable · c) desabrigado · d) desapacible", "sol": "el parecido de forma", "porque": "la b), <i>inhalable<\/i>: parecido de forma —empieza igual y termina igual— sin ningún parecido de significado"}, {"enun": "<i>Significado de<\/i> <b>adusto<\/b>: a) de trato serio y poco afable · b) es sinónimo de alegre · c) que está siempre enfermo · d) que gasta más de lo que tiene", "sol": "la relación en lugar del significado", "porque": "la b), «es sinónimo de alegre»: remite a otra palabra en lugar de definir qué significa <i>adusto<\/i>, y además <i>alegre<\/i> no lo significa. La correcta es la a)"}], "apoyo": ["3 · La pregunta de léxico, que tiene ocho formas", "La forma 5, el hiperónimo, que cayó una sola vez"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 4 · la clase de distractor"}, {"tipo": "abierta", "titulo": "La respuesta abierta", "dossier": {"cuaderno": "10", "ejercicio": 5}, "ayuda": "Tres palabras de un texto. Escribe la respuesta que darías en el examen, en la clase de palabra que pide el enunciado.", "items": [{"enun": "«Proponga un sinónimo del adjetivo <i>tenaz<\/i> en \"una lluvia tenaz que duró tres días\".»", "modelo": "<i>persistente<\/i>, <i>insistente<\/i>, <i>porfiada<\/i>, <i>obstinada<\/i>…"}, {"enun": "«Proponga un antónimo del sustantivo <i>abundancia<\/i> en el sentido que tiene en el texto.»", "modelo": "<i>escasez<\/i>, <i>carestía<\/i>, <i>falta<\/i>, <i>penuria<\/i>…"}, {"enun": "«Explique el significado de la expresión <i>echar en cara<\/i>.»", "modelo": "<i>reprochar algo a alguien<\/i>; <i>echarle la culpa de algo en un tono de queja<\/i>"}], "criterio": "Las respuestas de <i>tenaz<\/i> y de <i>abundancia<\/i> se corrigen metiendo la palabra en la frase del texto y leyéndola entera, y tienen que mantener la clase: un adjetivo para <i>tenaz<\/i>, un sustantivo para <i>abundancia<\/i>. <i>Que no para de llover<\/i> explica bien el significado, pero la clave no lo admite como sinónimo de <i>tenaz<\/i>, porque no es un adjetivo. La explicación de <i>echar en cara<\/i> admite cualquier oración que diga lo mismo.", "apoyo": ["La forma 4 pide una definición", "La forma 8 es la única que descuenta dentro de la propia respuesta"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 5"}, {"tipo": "opcion", "titulo": "Rodea el «NO» y contesta", "dossier": {"cuaderno": "10", "ejercicio": 6}, "ayuda": "Localiza el «NO» del enunciado antes de leer las opciones: pide la que no cumple.", "items": [{"enun": "«¿Cuál de estas cuatro expresiones <b>NO<\/b> está usada en sentido figurado?»", "sol": "Dejó el abrigo en el perchero.", "porque": "las otras tres son expresiones hechas, y dejar el abrigo en el perchero es dejar el abrigo en el perchero", "ops": ["Se le cayó el alma a los pies.", "Tiene la casa en el quinto pino.", "Dejó el abrigo en el perchero.", "Está en las nubes desde el lunes."]}, {"enun": "«¿Cuál de estas cuatro afirmaciones <b>NO<\/b> se deduce de un texto que sostiene que el alquiler se lleva más de la mitad del sueldo en las capitales?»", "sol": "Los sueldos de las capitales son más altos que los del resto.", "porque": "que el alquiler pese más no informa sobre el sueldo, que puede ser más alto, más bajo o igual; las otras tres recogen la misma información con tres formulaciones distintas", "ops": ["Quien vive de alquiler en una capital dedica a la vivienda más de la mitad de lo que gana.", "En las capitales, quien vive de alquiler dedica a la vivienda más que a todo lo demás junto.", "Los sueldos de las capitales son más altos que los del resto.", "A quien vive de alquiler en una capital le queda menos de la mitad del sueldo para todo lo demás."]}], "apoyo": ["La forma 4 pide una definición", "La forma 5, el hiperónimo, que cayó una sola vez"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 6"}, {"tipo": "opcion", "titulo": "¿Contestas o lo dejas en blanco?", "ayuda": "Te quedan cuatro minutos de examen y varias preguntas sin contestar. En cada situación, decide si contestas o lo dejas en blanco, y cuántas opciones has podido tachar con una razón. Las del dossier van con dos más de la web.", "ops": ["ninguna tachada: en blanco", "una tachada: contesta", "dos tachadas: contesta", "la sabes: contesta"], "items": [{"enun": "No has encontrado el párrafo y las cuatro opciones te suenan igual.", "sol": "ninguna tachada: en blanco", "porque": "sin ninguna opción tachada, contestar equivale a elegir al azar: en blanco"}, {"enun": "Has descartado la d) porque dice lo contrario que el texto.", "sol": "una tachada: contesta", "porque": "una tachada con una razón: quedan tres, y contestar puntúa de media"}, {"enun": "Dudas entre la a) y la c).", "sol": "dos tachadas: contesta", "porque": "dos tachadas: la duda queda entre dos"}, {"enun": "Estás seguro de la b).", "sol": "la sabes: contesta", "porque": "la sabes: contesta"}, {"enun": "Has descartado la a) y la b), y de las otras dos una te convence más que la otra.", "sol": "dos tachadas: contesta", "porque": "dos tachadas, y la corazonada entre las que quedan no resta"}, {"enun": "Es la pregunta de léxico, no conoces la palabra y ninguna opción se parece a nada.", "sol": "ninguna tachada: en blanco", "porque": "si al leer la oración entera puedes tachar una opción, contesta; si no puedes tachar ninguna, en blanco. La palabra que no conoces se trabaja por la oración entera, y casi siempre permite descartar una"}, {"enun": "Has leído las cuatro opciones dos veces y no puedes tachar ninguna con una razón.", "sol": "ninguna tachada: en blanco", "porque": "leerlas dos veces no tacha ninguna: la elección sigue siendo al azar"}, {"enun": "Una opción repite palabras del texto pero afirma lo contrario; las otras tres no las has podido comprobar todavía.", "sol": "una tachada: contesta", "porque": "una tachada y tres sin comprobar: quedan tres"}], "criterio": "La regla es una sola: en cuanto puedas tachar una opción con una razón —afirma lo contrario que el texto, habla de algo que el texto no menciona—, contesta. Las dos que se dejan en blanco son las dos en las que no se ha tachado nada, y ahí contestar al azar y no contestar dan casi lo mismo: cinco milésimas de diferencia a favor de contestar. Leer las opciones otra vez no cuenta como tacharlas.", "apoyo": ["5 · Cuándo contestar y cuándo dejarlo en blanco"], "usa_texto": false, "dossier": {"cuaderno": "10", "ejercicio": 7}, "dossier_txt": "Del dossier: pieza 10, ejercicio 7"}, {"tipo": "hueco", "titulo": "¿En qué línea está la respuesta?", "estricto": true, "ayuda": "Escribe el número de la línea donde <b>empieza<\/b> la respuesta; si ocupa dos, valen las dos. Es la tercera pasada del método: se vuelve al texto pregunta por pregunta y se anota al margen del cuadernillo dónde está cada una.", "items": [{"enun": "¿A qué tres figuras de cuento infantil recurre el autor al hablar de la identidad digital?", "sol": "2|3"}, {"enun": "¿Cómo llama el texto a manifestar emociones en la red?", "sol": "7"}, {"enun": "¿Qué dice el autor que hacemos continuamente con lo que no nos gusta de nosotros?", "sol": "17"}, {"enun": "¿Qué echan de menos quienes no vivieron su juventud en la era digital?", "sol": "31|32"}, {"enun": "Según el texto, ¿qué ha dejado de funcionar para saber si podemos confiar en alguien?", "sol": "27"}], "criterio": "Las cinco se contestan volviendo al texto y ninguna pide interpretar. Anotar el número al lado de la pregunta ocupa dos segundos y evita releer el artículo entero cuando hay que comprobar una respuesta al final de la hora.", "apoyo": ["3 · La pregunta de léxico, que tiene ocho formas", "La forma 4 pide una definición"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Con cuál se empieza?", "ops": ["se busca en el texto", "se prueban las opciones en la oración", "se deja para el final"], "ayuda": "Seis preguntas sobre el artículo de Luis Muiño, inventadas en el formato del examen. Marca qué hay que hacer con cada una antes de contestar ninguna.", "items": [{"enun": "«Según se desprende del texto, la comunicación en la red…»", "sol": "se deja para el final", "porque": "global: «se desprende» avisa de que la respuesta no está escrita en ninguna línea: se deduce del conjunto"}, {"enun": "«Según el autor, ¿cuándo representamos con más fuerza el papel que mostramos a los demás?»", "sol": "se busca en el texto", "porque": "local: la respuesta está escrita en el texto —en los primeros momentos de las relaciones— y se localiza"}, {"enun": "«Proponga un sinónimo de <i>denigrar<\/i> en el texto.»", "sol": "se prueban las opciones en la oración", "porque": "de léxico: pide una palabra que encaje en esa oración"}, {"enun": "«¿Cuál es la principal intención del autor de este texto?»", "sol": "se deja para el final", "porque": "global: pregunta por el texto entero, y se contesta al final"}, {"enun": "«Según el último párrafo, ¿qué nos descoloca cuando chateamos con alguien?»", "sol": "se busca en el texto", "porque": "local: un dato, en unas líneas concretas del último párrafo"}, {"enun": "«¿Qué significa en el texto la expresión <i>cara a cara<\/i>?»", "sol": "se prueban las opciones en la oración", "porque": "de léxico: el significado de una expresión en su contexto"}], "criterio": "Decidir esto antes de contestar es la segunda pasada, y fija el orden del resto del ejercicio: primero las que se buscan y la de léxico, y al final las globales, con el texto ya releído. Las globales se reconocen por el verbo del enunciado: <i>se desprende<\/i>, <i>pretende<\/i>, <i>defiende<\/i>.", "apoyo": ["2 · Qué preguntan las seis"], "solo_web": true}], "cuaderno": {"pieza": 10, "apartados": [1, 2, 3, 4, 5], "ejercicios": [1, 2, 3, 4, 5, 6, 7]}, "cuaderno_txt": "Pieza 10 · Leer el texto entero y contestar el test — apartados 1, 2, 3, 4 y 5: Las cuatro pasadas; Qué preguntan las seis; La pregunta de léxico, que tiene ocho formas; El «NO»; Cuándo contestar y cuándo dejarlo en blanco (p. 46, 47 y 51) · ejercicios 1, 2, 3, 4, 5, 6 y 7", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "«¿Somos lo que parecemos ser en internet?», de Luis Muiño", "meta": "Convocatoria 2016, tribunal ordinario · 346 palabras · en clase, lectura guiada: el profesor resuelve las seis preguntas en voz alta con el método", "literal": true, "teoria": "<h3>1 · 2016, tribunal ordinario · «¿Somos lo que parecemos ser en internet?»<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Luis Muiño, <em>La Vanguardia Magazine<\/em> (2015), adaptado<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>prensa de divulgación, 346 palabras<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Llengua castellana 2016, tribunal ordinario; el texto, en el cuaderno de textos de cada sesión (texto 1)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>29 de septiembre · <strong>lectura guiada<\/strong>: la resuelve el profesor en voz alta con el método de la pieza 10<\/td>\n<\/tr>\n<tr>\n<td><strong>reparto<\/strong><\/td>\n<td>tres preguntas de test y tres abiertas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto abre el curso.<\/strong> Es de la era anterior a 2020, cuando el bloque mezclaba test y preguntas abiertas. Desde 2020 caen cinco o seis test de seis, así que este examen <strong>no es el formato que se van a encontrar<\/strong>. Se usa el primero por eso: las tres preguntas abiertas obligan a decir en voz alta cómo se ha llegado a la respuesta, que es el método que la sesión enseña. Los textos de los martes siguientes ya van en el formato moderno.<\/p>", "lectura": {"titulo": "¿Somos lo que parecemos ser en internet?", "entrada": "Luis Muiño · <i>La Vanguardia Magazine<\/i>, 4 de octubre de 2015 · texto adaptado, tal como lo reproduce el cuadernillo de Llengua castellana de 2016 (tribunal ordinario).", "lineas": ["Cuando se habla de la consistencia de nuestra identidad", "digital, seguimos creyendo en cuentos de hadas, príncipes y", "villanos. Miles de artículos dedicados a este tema utilizan", "términos que cuestionan nuestra forma de ser en internet", "porque no es «auténtica». Se habla de «falsa imagen» para", "referirse a lo que contamos de nosotros mismos, se califica de", "«pornografía emocional» al hecho de manifestar emociones en", "red o de «amor virtual» (en el sentido de fantasioso e", "inconsistente) a hablar de los lazos amorosos on line.", "", "Pero esta forma de denigrar la comunicación en la red es ilusa", "porque mitifica nuestra forma de relacionarnos cara a cara.", "Criticar internet porque en la red solo contamos lo mejor de", "nosotros mismos supone afirmar implícitamente que ese fenómeno", "no sucede en otros ámbitos. Pero esa idílica idea choca contra", "todos los datos de la investigación psicológica. Los seres", "humanos siempre seleccionamos lo que mostramos a los demás y", "hacemos esfuerzos continuos para ocultar lo que no nos gusta", "de nosotros mismos. […] Los seres humanos construimos un modo", "de presentarnos ante los demás, un papel que reúne los", "aspectos de nosotros mismos de los que nos sentimos más", "orgullosos. Representamos ese rol con todas nuestras fuerzas", "en los primeros momentos de las relaciones y después", "intentamos mantenerlo en la medida de lo posible. Ocurre en", "internet… y en cualquier otra forma de trato humano.", "", "¿Por qué nos descoloca entonces la simulación on line? Vivimos", "una época de cambio, y no es fácil encontrar nuevas «normas de", "seguridad». Los antiguos métodos para saber si podemos confiar", "en los otros no funcionan en la red. Pero aun así, la mayoría", "de las personas (los que no hemos vivido nuestra juventud en", "la era digital) seguimos aferrados a los viejos patrones de", "detección de la mentira. Echamos de menos el contacto cara a", "cara porque creemos que en esa situación captaríamos mejor la", "personalidad de nuestro interlocutor. O nos descoloca que no", "haya personas en común (amigos o familia) con la persona con", "la que chateamos porque pensamos que eso nos resta", "información."], "pie": "Texto de Luis Muiño (<i>La Vanguardia Magazine<\/i>, 4 de octubre de 2015), en la versión adaptada del cuadernillo oficial de la PAU +25 de 2016, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2016_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las tres preguntas de test", "ayuda": "Las preguntas 1.1 a 1.3 del cuadernillo, literales, con su respuesta oficial. Contesta con el método: las locales se buscan, la global se piensa al final.", "items": [{"enun": "<b>1.1<\/b> El autor del artículo cree que", "conv": "2016t", "ops": ["la relación cara a cara muestra nuestra verdadera personalidad.", "nuestra imagen digital refleja fielmente nuestra personalidad.", "ni la imagen virtual ni las relaciones personales son el fiel reflejo de lo que realmente somos.", "las relaciones personales son de calidad inferior a las virtuales."], "sol": "ni la imagen virtual ni las relaciones personales son el fiel reflejo de lo que realmente somos.", "porque": "es la pregunta de la tesis, y trae el diseño que más se repite en las globales: las opciones a) y b) recogen las dos mitades simples de una oposición, y la clave corresponde a la opción que se niega a elegir entre las dos. Está en el último párrafo"}, {"enun": "<b>1.2<\/b> El autor insiste en que para crear nuestra imagen", "conv": "2016t", "ops": ["acentuamos nuestras virtudes.", "mostramos lo que menos nos satisface de nosotros mismos.", "seleccionamos nuestras relaciones.", "simulamos tener otra personalidad."], "sol": "acentuamos nuestras virtudes.", "porque": "local, líneas 17 a 22: «un papel que reúne los aspectos de nosotros mismos de los que nos sentimos más orgullosos». El distractor b) afirma lo contrario"}, {"enun": "<b>1.3<\/b> De entre las siguientes opciones, elija un antónimo para el adjetivo <i>ilusa<\/i> en el texto.", "conv": "2016t", "ops": ["Realista.", "Idealista.", "Altruista.", "Quimérica."], "sol": "Realista.", "porque": "pide un antónimo, y dos de las opciones —<i>idealista<\/i>, <i>quimérica<\/i>— son sinónimos de <i>ilusa<\/i>. Subrayar la palabra <i>antónimo<\/i> antes de leer las opciones es la misma operación que rodear el NO"}], "criterio": "Medio punto por respuesta correcta y 0,16 de descuento por cada error, como en todas las de test. La 1.1 se contesta al final, con el último párrafo releído; la 1.2 se localiza; en la 1.3, quien lee deprisa busca una palabra que se parezca a <i>ilusa<\/i> y encuentra dos.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "El antecedente", "ayuda": "Se copia del texto, sin reformular.", "items": [{"enun": "<b>1.4<\/b> ¿Cuál es el antecedente en el texto del sintagma <i>este tema<\/i>?", "conv": "2016t", "sol": "nuestra identidad digital|la consistencia de nuestra identidad digital|identidad digital|la identidad digital|la consistencia de la identidad digital", "porque": "la clave oficial admite las dos versiones: «(la consistencia de) nuestra identidad digital», líneas 1 y 2"}], "criterio": "El paréntesis de la clave indica que se admite la versión corta. Se da el punto si se nombra el sintagma; no hace falta redactar una frase.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Las dos abiertas", "ayuda": "Con tus palabras, sin copiar frases del texto: la 1.5 en una o dos líneas, la 1.6 en una palabra.", "items": [{"enun": "<b>1.5<\/b> Indique a qué idea del texto se refiere el autor con la expresión <i>idílica idea<\/i>.", "conv": "2016t", "modelo": "Clave oficial: contamos lo mejor de nosotros mismos —«maquillamos» nuestra identidad— solo en la red, y no en el contacto personal. La respuesta tiene dos mitades, qué hacemos y dónde lo hacemos; una respuesta con solo la primera contesta a medias, y el ítem vale 0,5 sin fracciones publicadas: el descuento lo decide el corrector."}, {"enun": "<b>1.6<\/b> Proponga un sinónimo de <i>aferrados<\/i> en el texto.", "corto": true, "conv": "2016t", "modelo": "Clave oficial: apegados, sujetos, agarrados… Admite cualquier sinónimo que funcione en la frase «seguimos aferrados a los viejos patrones de detección de la mentira»: se corrige sustituyendo la palabra y leyendo la oración entera."}], "criterio": "La 1.5 es la antepasada de la pregunta 2.3 del comentario: dan una expresión del texto y piden la idea que hay detrás. Aquí se aplica por primera vez la regla de no reproducir frases del original.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [1]}, {"pieza": "TEXTOS", "apartados": [1]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 1: 2016, tribunal ordinario · «¿Somos lo que parecemos ser en internet?» (p. 249) · Los textos de cada sesión — apartado 1: «¿Somos lo que parecemos ser en internet?» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Seis palabras de un texto real", "meta": "10 minutos · la tanda del martes: las nueve clases sobre el texto que se ha leído en clase", "teoria": "<div class=\"enelexamen\"><strong>En el examen.<\/strong> En el bloque 3 de Llengua castellana hay un ítem que pregunta directamente por una clase de palabra: <strong>«¿Qué clase de palabra es X en esta oración?»<\/strong>, con cuatro opciones. Ha caído en <strong>12 de los 24 exámenes<\/strong> y vale 0,5 puntos. El enunciado alterna dos formulaciones —«¿qué clase de palabra es…?» y «¿a qué categoría gramatical pertenece…?»— y preguntan lo mismo.<\/div>\n<p>Otros tres ejercicios no se contestan sin ella:<\/p>\n<table>\n<thead>\n<tr>\n<th>ejercicio<\/th>\n<th>vale<\/th>\n<th>cae<\/th>\n<th>qué necesita de aquí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Categoría de una palabra en su oración<\/strong><\/td>\n<td>0,5<\/td>\n<td>12/24<\/td>\n<td>todo<\/td>\n<\/tr>\n<tr>\n<td><strong>La tilde diacrítica<\/strong> (pieza 3)<\/td>\n<td>0,5, dentro del ítem de categoría gramatical<\/td>\n<td>2/24<\/td>\n<td>los dos ítems preguntan por <em>aun<\/em>, que no cambia de clase con la tilde; en <em>mi<\/em> / <em>mí<\/em>, <em>el<\/em> / <em>él<\/em> y <em>tu<\/em> / <em>tú<\/em> sí la cambia<\/td>\n<\/tr>\n<tr>\n<td><strong>Antecedente y función de un pronombre<\/strong> (pieza 8)<\/td>\n<td>0,25 + 0,25<\/td>\n<td>7/24<\/td>\n<td>distinguir el pronombre del determinante<\/td>\n<\/tr>\n<tr>\n<td><strong>La función sintáctica de un sintagma<\/strong> (sintaxis, segundo trimestre)<\/td>\n<td>0,5<\/td>\n<td><strong>24/24<\/strong><\/td>\n<td>da por sabidas las nueve clases<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1 · Las nueve clases<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">#<\/th>\n<th>clase<\/th>\n<th>¿cambia de forma?<\/th>\n<th>qué hace<\/th>\n<th>prueba<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1<\/td>\n<td><strong>Sustantivo<\/strong><\/td>\n<td>sí: número, y el género solo en algunos<\/td>\n<td>nombra seres, objetos e ideas<\/td>\n<td>admite artículo delante —<strong>el<\/strong> miedo, <strong>la<\/strong> factura—, y si lo admite una palabra de otra clase es que está sustantivada: <em>el andar<\/em>, <em>el porqué<\/em><\/td>\n<td>alquiler, turno, erosión, esperanza, vecindario, paciencia, autobús, hipoteca<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td><strong>Adjetivo<\/strong><\/td>\n<td>sí: género y número, según el sustantivo al que acompañe<\/td>\n<td>expresa <strong>cómo es<\/strong> el sustantivo al que acompaña<\/td>\n<td>admite <em>muy<\/em> delante y <em>-ísimo<\/em> detrás —muy caro, carísimo—, salvo los que clasifican: ⊗<em>muy alimentario<\/em><\/td>\n<td>caro, tradicional, delicado, ruidoso, provisional, injusta, llena<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">3<\/td>\n<td><strong>Determinante<\/strong><\/td>\n<td>casi todos: género y número; <em>mi<\/em> y <em>tu<\/em> solo número, y los numerales cardinales no cambian nunca<\/td>\n<td><strong>presenta<\/strong> al sustantivo y lo delimita<\/td>\n<td>va delante del sustantivo y lo presenta —<strong>mi<\/strong> turno, <strong>esta<\/strong> factura, <strong>tres<\/strong> meses—, y, a diferencia del adjetivo, no admite <em>muy<\/em> delante ni <em>-ísimo<\/em> detrás<\/td>\n<td>el, la, un, mi, tu, este, ese, aquel, algún, ningún, otro, mucho, tres<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">4<\/td>\n<td><strong>Pronombre<\/strong><\/td>\n<td>casi todos: género, número y persona; <em>alguien<\/em>, <em>nadie<\/em> y <em>algo<\/em> no cambian nunca<\/td>\n<td><strong>ocupa el lugar<\/strong> de un sustantivo, de un sintagma o de una oración entera<\/td>\n<td>va solo, sin sustantivo al lado: <strong>lo<\/strong> vendió<\/td>\n<td>yo, tú, él, ella, me, te, se, lo, la, le, mí, ti, esto, eso, aquello, el mío, alguien, nadie, quien<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">5<\/td>\n<td><strong>Verbo<\/strong><\/td>\n<td>sí: persona, número, tiempo y modo, <strong>salvo las formas no personales<\/strong><\/td>\n<td>expresa <strong>lo que pasa<\/strong>; es el núcleo del predicado<\/td>\n<td>se conjuga: yo vendo, tú vendiste<\/td>\n<td>vender, vendía, había, plantó, dé, firmaron, cobraremos, subieran<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">6<\/td>\n<td><strong>Adverbio<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>modifica al verbo, al adjetivo o a otro adverbio<\/td>\n<td>no concuerda con nada; contesta a cómo, cuándo, dónde, cuánto<\/td>\n<td>sí, no, más, aún, muy, ya, siempre, deprisa, aquí, entonces, quizá<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">7<\/td>\n<td><strong>Preposición<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>une un elemento de la oración con su complemento, yendo delante<\/td>\n<td>lista cerrada de veintitrés, entera en el recuadro de abajo<\/td>\n<td>a, ante, bajo, con, de, desde, en, entre, <strong>hacia<\/strong>, hasta, para, por, sin, sobre, tras<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">8<\/td>\n<td><strong>Conjunción<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td><strong>une<\/strong>: las coordinantes, dos elementos del mismo rango; las subordinantes, una oración dentro de otra<\/td>\n<td>se puede sustituir por otra conjunción del mismo grupo<\/td>\n<td>coordinantes: y, o, ni, pero, mas, sino · subordinantes: que, si, porque, aunque, pues<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">9<\/td>\n<td><strong>Interjección<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>expresa una reacción; vale por una oración entera<\/td>\n<td>va sola, entre signos de exclamación<\/td>\n<td>¡ay!, ¡uf!, ¡vaya!, ¡ojalá!, ¡anda!<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>El género del sustantivo y el género del adjetivo no funcionan igual<\/h4>\n<p>El sustantivo <strong>tiene<\/strong> un género, y casi siempre es el mismo: <em>la mesa<\/em> es femenino y <em>el alquiler<\/em> es masculino, y no hay ⊗<em>el meso<\/em> ni ⊗<em>la alquilera<\/em>. Solo cambian de género los que nombran seres con sexo —<em>perro / perra<\/em>, <em>profesor / profesora<\/em>, <em>vecino / vecina<\/em>— y algunos de oficio o cargo que lo han ido ganando —<em>jueza<\/em>, <em>concejala<\/em>—.<\/p>\n<p>El adjetivo, en cambio, <strong>no tiene<\/strong> género propio: toma el del sustantivo al que acompaña, sea cual sea. <em>Caro<\/em> es <em>caro<\/em> en «un alquiler caro» y <em>cara<\/em> en «una factura cara», sin que la palabra signifique nada distinto. Por eso la prueba del plural y del femenino separa las dos clases: el adjetivo cambia porque se lo pide el sustantivo de al lado; el sustantivo solo cambia si nombra a otro ser.<\/p>\n<h4>El determinante casi siempre va delante<\/h4>\n<p>Va pegado al sustantivo y por delante: <em>mi turno<\/em>, <em>esta factura<\/em>, <em>tres meses<\/em>. Hay dos casos en que se pospone, y los dos llevan otro determinante delante:<\/p>\n<ul>\n<li>el <strong>demostrativo<\/strong>, que pasa detrás con artículo delante: <em>el chico ese<\/em>, <em>la factura aquella<\/em>;<\/li>\n<li>el <strong>posesivo tónico<\/strong>, que se pospone igual: <em>un amigo mío<\/em>, <em>una prima suya<\/em>, <em>la culpa nuestra<\/em>.<\/li>\n<\/ul>\n<h4>La lista de pronombres, por tipos<\/h4>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>cuáles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>personales<\/strong><\/td>\n<td>yo, tú, vos, usted, él, ella, ello, nosotros, nosotras, vosotros, vosotras, ustedes, ellos, ellas · me, te, se, nos, os, lo, la, le, los, las, les · mí, ti, sí, conmigo, contigo, consigo<\/td>\n<\/tr>\n<tr>\n<td><strong>demostrativos<\/strong><\/td>\n<td>este, esta, estos, estas · ese, esa, esos, esas · aquel, aquella, aquellos, aquellas · esto, eso, aquello<\/td>\n<\/tr>\n<tr>\n<td><strong>posesivos<\/strong><\/td>\n<td>el mío, la mía, los míos… y lo mismo con tuyo, suyo, nuestro y vuestro<\/td>\n<\/tr>\n<tr>\n<td><strong>indefinidos<\/strong><\/td>\n<td>alguien, nadie, algo, nada, alguno, ninguno, uno, otro, todo, mucho, poco, bastante, demasiado, varios, cualquiera<\/td>\n<\/tr>\n<tr>\n<td><strong>numerales<\/strong><\/td>\n<td>uno, dos, tres… cuando van solos (<em>me quedan tres<\/em>), y los ordinales (<em>el primero<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>interrogativos y exclamativos<\/strong><\/td>\n<td>qué, quién, quiénes, cuál, cuáles, cuánto y sus femeninos y plurales<\/td>\n<\/tr>\n<tr>\n<td><strong>relativos<\/strong><\/td>\n<td>que, quien, quienes, el cual, cuanto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los demostrativos, los posesivos, los indefinidos y los numerales que funcionan como pronombre aparecen también en la lista de determinantes, y con la misma forma. La clase depende de si llevan sustantivo al lado o van solos, y por eso la segunda de las tres preguntas basta para separarlos.<\/p>\n<h4>La lista de preposiciones, las veintitrés<\/h4>\n<blockquote>\n<p><strong>a, ante, bajo, cabe, con, contra, de, desde, durante, en, entre, hacia, hasta, mediante, para, por, según, sin, so, sobre, tras, versus, vía<\/strong><\/p>\n<\/blockquote>\n<p>Es una lista cerrada y se aprende de memoria: cambia muy despacio, y las últimas en entrar han sido <em>versus<\/em> y <em>vía<\/em>. <em>Cabe<\/em> (= junto a) y <em>so<\/em> (= bajo) están anticuadas y es muy improbable que aparezcan, aunque <em>so<\/em> sigue vivo en <em>so pena de<\/em> y <em>so pretexto de<\/em>; las dos siguen en la lista oficial.<\/p>\n<p>Hay además <strong>locuciones preposicionales<\/strong>: grupos de palabras que funcionan como una preposición: <em>a causa de<\/em>, <em>a pesar de<\/em>, <em>delante de<\/em>, <em>dentro de<\/em>, <em>encima de<\/em>, <em>junto a<\/em>, <em>por medio de<\/em>.<\/p>\n<h4>Las tres preguntas que resuelven casi todo<\/h4>\n<ol>\n<li><strong>¿Cambia de forma?<\/strong> Sí → está entre las cinco primeras. No → entre las cuatro últimas, <strong>salvo<\/strong> los invariables de las cinco primeras: <em>alguien<\/em>, <em>nadie<\/em>, <em>algo<\/em>, el <em>que<\/em> relativo, los numerales cardinales y los infinitivos, gerundios y participios invariables del verbo.\n   <em>Ejemplo:<\/em> en «las <strong>facturas<\/strong> llegaron», <em>facturas<\/em> admite singular —<em>la factura<\/em>—, así que cambia de forma: está entre las cinco primeras. En «llegaron <strong>ayer<\/strong>», <em>ayer<\/em> no admite ningún cambio: está entre las cuatro últimas.<\/li>\n<li><strong>Para decidir entre determinante y pronombre, ¿lleva un sustantivo al lado?<\/strong> Sí → <strong>determinante<\/strong>. Va solo, en su lugar → <strong>pronombre<\/strong>.\n   <em>Ejemplo:<\/em> «<strong>esta<\/strong> factura» lleva <em>factura<\/em> detrás, luego <em>esta<\/em> es determinante; «<strong>esta<\/strong> llegó ayer» no lleva sustantivo, luego es pronombre.<\/li>\n<li><strong>¿Une?<\/strong> Un elemento con su complemento, yendo delante → <strong>preposición<\/strong>. Dos elementos del mismo rango, o una oración metida dentro de otra → <strong>conjunción<\/strong>.\n   <em>Ejemplo:<\/em> «vino <strong>con<\/strong> su hermana» une el verbo con el complemento <em>su hermana<\/em>, que va detrás: preposición. «Vino su hermana <strong>y<\/strong> su cuñado» une dos sintagmas que están al mismo nivel: conjunción.<\/li>\n<\/ol>\n<h4>Cuatro que se clasifican mal a menudo<\/h4>\n<ul>\n<li><strong><em>Cuándo<\/em>, <em>cómo<\/em> y <em>dónde<\/em> son adverbios<\/strong>, aunque lleven tilde y abran pregunta. Solo <em>quién<\/em>, <em>qué<\/em>, <em>cuál<\/em> y <em>cuánto<\/em> pueden ser pronombres. En «no sé <strong>cuándo<\/strong> llega», <em>cuándo<\/em> señala el momento, como haría <em>entonces<\/em>.<\/li>\n<li><strong><em>Mi<\/em> y <em>tu<\/em> son determinantes<\/strong> posesivos: llevan el sustantivo detrás —<em>mi turno<\/em>, <em>tu parte<\/em>—. El pronombre posesivo es <em>el mío<\/em>, <em>el tuyo<\/em>.<\/li>\n<li><strong><em>Que<\/em> es conjunción o pronombre relativo<\/strong>, según lo que haga. En «dijo <strong>que<\/strong> vendría» solo une dos oraciones: conjunción. En «el parte <strong>que<\/strong> firmaste» sustituye a <em>el parte<\/em> dentro de la subordinada —<em>firmaste el parte<\/em>—: pronombre relativo, y por eso tiene antecedente.<\/li>\n<li><strong><em>Un<\/em> y <em>una<\/em> son determinantes cuando presentan un sustantivo<\/strong> —<em>un turno<\/em>— y pronombres cuando van solos —<em>me queda <span class=\"vs\">uno<\/span><\/em>—. La forma es casi la misma y la clase, distinta.<\/li>\n<\/ul>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis palabras del texto de hoy", "ayuda": "Seis palabras del artículo de Luis Muiño (2016t), cada una en la oración donde está, con cuatro opciones como en el examen. Las oraciones son literales; las respuestas son de este curso, no de una clave oficial.", "items": [{"enun": "«<b>Pero<\/b> esta forma de denigrar la comunicación en la red es ilusa»", "ops": ["adverbio", "preposición", "conjunción", "pronombre"], "sol": "conjunción", "porque": "une esta oración con la anterior y la opone a ella, y no cambia de sitio: <i>sin embargo<\/i>, que es adverbio, admite «esta forma, sin embargo, es ilusa»; <i>pero<\/i> no admite ⊗«esta forma, pero, es ilusa»"}, {"enun": "«en la red <b>solo<\/b> contamos lo mejor de nosotros mismos»", "ops": ["adverbio", "adjetivo", "sustantivo", "determinante"], "sol": "adverbio", "porque": "equivale a <i>solamente<\/i>, modifica a <i>contamos<\/i> y no cambia de forma: en «vino solo» sí cambiaría, <i>vino sola<\/i>"}, {"enun": "«Pero <b>esa<\/b> idílica idea choca contra todos los datos»", "ops": ["pronombre", "determinante", "adjetivo", "adverbio"], "sol": "determinante", "porque": "acompaña a <i>idea<\/i> y concuerda con ella en femenino; el adjetivo <i>idílica<\/i> en medio no cambia nada"}, {"enun": "«hacemos esfuerzos <b>continuos<\/b> para ocultar lo que no nos gusta»", "ops": ["adverbio", "sustantivo", "verbo", "adjetivo"], "sol": "adjetivo", "porque": "expresa cómo son los esfuerzos y concuerda con el sustantivo en masculino plural: <i>esfuerzo continuo<\/i>, <i>esfuerzos continuos<\/i>"}, {"enun": "«pensamos que <b>eso<\/b> nos resta información»", "ops": ["pronombre", "determinante", "conjunción", "adverbio"], "sol": "pronombre", "porque": "va solo y ocupa el sitio de una idea entera, la de que no haya personas en común con quien chateamos; el neutro nunca acompaña a un sustantivo"}, {"enun": "«creemos que en esa situación captaríamos <b>mejor<\/b> la personalidad»", "ops": ["sustantivo", "adjetivo", "adverbio", "preposición"], "sol": "adverbio", "porque": "modifica a <i>captaríamos<\/i> y no cambia aunque cambie el resto: <i>captarían mejor las personalidades<\/i>, sin ⊗<i>mejores<\/i>"}], "criterio": "Las seis palabras están elegidas porque tienen otra clase en otra oración: <i>solo<\/i> y <i>mejor<\/i> son adjetivos cuando concuerdan con un sustantivo, <i>esa<\/i> es pronombre cuando va sola, y <i>pero<\/i> se confunde con adverbios como <i>sin embargo<\/i>, que también unen oraciones y, a diferencia de él, pueden cambiar de sitio. Las cuatro opciones de cada ítem incluyen siempre esa otra clase, y quien contesta por la palabra y no por la oración la marca. Dos de las seis respuestas son <i>adverbio<\/i>, la respuesta oficial en diez de los doce ítems reales: contestar siempre adverbio acierta esas dos y falla las otras cuatro.", "apoyo": ["1 · Las nueve clases"], "solo_web": true}, {"tipo": "abierta", "titulo": "Explícalo con las tres preguntas", "ayuda": "Dos o tres líneas por ítem: nombra la pregunta que lo decide y compara las dos oraciones.", "items": [{"enun": "¿Cómo decides que <i>esa<\/i> es determinante en «esa idílica idea» y que <i>eso<\/i> es pronombre en «eso nos resta información»?", "modelo": "Se comprueba si tienen un sustantivo al lado. <i>Esa<\/i> acompaña a <i>idea<\/i> —con el adjetivo <i>idílica<\/i> en medio— y concuerda con ella en femenino: determinante. <i>Eso<\/i> va solo, no acompaña a ningún sustantivo y ocupa el sitio de una idea entera, la de que no haya personas en común: pronombre. Además <i>eso<\/i> es neutro, y el neutro nunca acompaña a un sustantivo."}, {"enun": "<i>Mejor<\/i> es adjetivo en «un trabajo mejor» y adverbio en «captaríamos mejor la personalidad». ¿Qué pregunta de la prueba lo decide, y cómo?", "modelo": "La primera: si cambia de forma. En «un trabajo mejor» concuerda con el sustantivo y admite plural, «unos trabajos mejores»: adjetivo. En «captaríamos mejor la personalidad» modifica al verbo y no cambia aunque cambie el resto, «captarían mejor las personalidades», sin ⊗<i>mejores<\/i>: adverbio."}], "criterio": "Una explicación completa nombra la pregunta de la prueba que decide, la aplica a las dos oraciones y señala qué cambia entre ellas: con qué sustantivo concuerda la palabra en una y a qué palabra modifica en la otra. La que solo afirma «una es determinante y la otra pronombre» repite la respuesta sin la prueba.", "apoyo": ["1 · Las nueve clases"], "solo_web": true}], "cuaderno": {"pieza": 6, "apartados": [1]}, "cuaderno_txt": "Pieza 6 · Las nueve clases y la categoría de una palabra en su oración — apartado 1: Las nueve clases (p. 147)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El artículo de Luis Muiño (<i>La Vanguardia Magazine<\/i>, 2015), reproducido en el carril «El texto» en la versión adaptada del cuadernillo de 2016, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual; las oraciones del carril C son fragmentos suyos.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }

      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
