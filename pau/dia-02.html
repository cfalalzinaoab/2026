<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 2 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;

@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 2, "fecha": "2026-09-29", "tab": "Día 2 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 29 de septiembre", "sub": "Las tres reglas de la tilde · las cuatro pasadas del texto, el «NO» y la cuenta del −0,16 · seis palabras de un texto real", "carriles": [{"chapa": "Carril A", "titulo": "Las tres reglas de la tilde", "meta": "20 minutos · qué es lo normal, qué se sale y cómo se contesta el ejercicio real", "teoria": "<h3>Pieza 1 · 4 · La familia que más aparece: las formas de <em>vosotros<\/em><\/h3>\n<p>Diez de las 79 palabras del examen terminan en <em>-áis<\/em>, <em>-éis<\/em> o <em>-ais<\/em>, y las tres terminaciones se acentúan de manera distinta según dónde caiga la fuerza:<\/p>\n<table>\n<thead>\n<tr>\n<th>terminación<\/th>\n<th>qué formas verbales<\/th>\n<th>del examen<\/th>\n<th>otras del mismo formato<\/th>\n<th>tilde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>-áis, -éis<\/strong> con la fuerza en ellas<\/td>\n<td>presente, presente de subjuntivo y futuro<\/td>\n<td><em>huyáis, zurzáis, llevéis, tengáis, hayáis, vengáis, corregiréis<\/em><\/td>\n<td>cantéis, voláis, tenéis, viviréis<\/td>\n<td><strong>sí<\/strong>, por aguda acabada en -s<\/td>\n<\/tr>\n<tr>\n<td><strong>-íais<\/strong> con la fuerza en la <em>i<\/em><\/td>\n<td>imperfecto de indicativo y condicional<\/td>\n<td><em>hacíais<\/em><\/td>\n<td>teníais, veríais, vendríais<\/td>\n<td><strong>sí<\/strong>, por hiato: la tilde va sobre la <em>i<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>-ais, -eis<\/strong> con la fuerza antes<\/td>\n<td>imperfecto de indicativo en <em>-abais<\/em> e imperfecto de subjuntivo<\/td>\n<td><em>(la única de las diez que no lleva tilde)<\/em><\/td>\n<td>acababais, cantabais, volarais, tuvierais<\/td>\n<td><strong>no<\/strong>: llana acabada en -s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo se decide, en voz alta.<\/strong> Si la fuerza cae en la terminación —<em>lle-<span class=\"vs\">véis<\/span><\/em>, <em>ten-<span class=\"vs\">gáis<\/span><\/em>—, la palabra es aguda acabada en -s y lleva tilde. Si cae en una <em>i<\/em> que suena separada de la vocal siguiente —<em>ha-<span class=\"vs\">cí<\/span>-ais<\/em>, <em>te-<span class=\"vs\">ní<\/span>-ais<\/em>—, la tilde va sobre esa <em>i<\/em>, y la regla que manda es la del hiato, que se estudia más adelante. Si cae antes de la terminación —<em>a-ca-<span class=\"vs\">ba<\/span>-bais<\/em>, <em>vo-<span class=\"vs\">la<\/span>-rais<\/em>—, la palabra es llana acabada en -s y se queda como está.<\/p>\n<p><strong>El imperfecto de subjuntivo se parece por escrito al presente, y no por la fuerza.<\/strong> <em>Volarais<\/em> y <em>tuvierais<\/em> acaban igual que <em>voláis<\/em> y <em>tengáis<\/em>, así que quien decide por la terminación les pone tilde a las cuatro; la fuerza, en cambio, cae en <em>vo-<span class=\"vs\">la<\/span>-rais<\/em> y <em>tu-<span class=\"vs\">vie<\/span>-rais<\/em> una sílaba antes del final, así que las dos son llanas.<\/p>\n<p><strong>Dónde está el diptongo en cada una.<\/strong> En <em>lle-véis<\/em> y <em>ten-gáis<\/em>, la vocal abierta —la <em>e<\/em> de <em>llevéis<\/em>, la <em>a<\/em> de <em>tengáis<\/em>— y la <em>i<\/em> van juntas en la misma sílaba y forman diptongo: la tilde cae sobre la abierta. En <em>ha-cí-ais<\/em> hay tres vocales seguidas y no forman triptongo: la <em>i<\/em> tónica hace hiato con las otras dos, que van juntas en diptongo, y la tilde va sobre esa <em>i<\/em>. En <em>vo-la-rais<\/em> la <em>a<\/em> y la <em>i<\/em> también van juntas en la misma sílaba, pero la fuerza está una sílaba antes del final y la palabra no lleva ninguna tilde. Las tres terminaciones se escriben con las mismas vocales y se reparten en sílabas de tres maneras distintas.<\/p>\n<h3>Pieza 1 · 5 · Cómo se contesta el ejercicio real<\/h3>\n<p>El ejercicio da siete u ocho palabras escritas <strong>sin ninguna tilde<\/strong> y pide poner las que hagan falta. Se contesta en tres pasos, siempre en este orden:<\/p>\n<ol>\n<li><strong>Di la palabra en voz alta<\/strong> y localiza la sílaba tónica. Sin la sílaba tónica localizada no se puede clasificar la palabra.<\/li>\n<li><strong>Clasifícala<\/strong>: aguda, llana, esdrújula o sobresdrújula.<\/li>\n<li><strong>Lee la última letra<\/strong> y aplica la regla. Si es una llana acabada en vocal, en -n o en -s, <strong>déjala como está<\/strong>: no lleva tilde. Veinte de las treinta palabras que no la llevan se resuelven en este paso.<\/li>\n<\/ol>\n<p><strong>El señuelo típico es una palabra de uso diario<\/strong>: <em>examen<\/em>, <em>volumen<\/em>, <em>crisis<\/em>, <em>imagen<\/em>. Son llanas acabadas en -n o en -s, de las que no llevan tilde, y funcionan como señuelo porque en la lectura corriente nadie atiende a su terminación. Dejar una palabra sin tilde puntúa igual que escribir la que falta: el corrector evalúa las ocho decisiones.<\/p>\n<div class=\"enelexamen\"><strong>En el examen.<\/strong> De las 79 palabras que han caído en los diez ejercicios de «ponga tilde», <strong>17 llevan tilde por ser hiato y otras 16 son señuelos con dos vocales juntas que forman diptongo<\/strong>. Son 33 de 79: <strong>cuatro de cada diez palabras del ejercicio se deciden en esta pieza<\/strong>, más que con ninguna otra regla.<\/div>\n<p><strong>Ninguno de los 17 hiatos llevaría tilde por las tres reglas de la pieza 1.<\/strong> <em>Mayoría<\/em>, <em>bahía<\/em>, <em>grúa<\/em>, <em>oído<\/em> y <em>reírse<\/em> son llanas acabadas en vocal; <em>jabalíes<\/em> y <em>rubíes<\/em>, llanas acabadas en -s; <em>oír<\/em> y <em>reír<\/em>, agudas acabadas en -r. Las diecisiete la llevan por la regla del hiato del apartado 3, que se impone a las tres anteriores.<\/p>\n<h3>Pieza 2 · 1 · Abiertas y cerradas<\/h3>\n<p>Las cinco vocales se reparten en dos grupos. De ese reparto salen los tres tipos de diptongo del apartado 2 y las tres clases de hiato del apartado 3:<\/p>\n<table>\n<thead>\n<tr>\n<th>abiertas<\/th>\n<th>cerradas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a, e, o<\/strong><\/td>\n<td><strong>i, u<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Se llaman así por la posición de la boca: para pronunciar <em>a<\/em> se abre del todo; para pronunciar <em>i<\/em>, casi se cierra.<\/p>\n<p>Solo hay dos vocales cerradas, la <em>i<\/em> y la <em>u<\/em>, y toda la pieza se decide en ellas: el diptongo exige al menos una cerrada, y el hiato con tilde exige una cerrada tónica.<\/p>\n<h3>Pieza 2 · 2 · El diptongo<\/h3>\n<p>Un <strong>diptongo<\/strong> son <strong>dos vocales en la misma sílaba<\/strong>: se pronuncian en una sola emisión de voz. En <em>ciu-dad<\/em>, la sílaba «ciu» lleva el diptongo <em>iu<\/em>; en <em>cau-sa<\/em>, «cau» lleva el diptongo <em>au<\/em>.<\/p>\n<p>Solo hay tres maneras de formarlo:<\/p>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>combinación<\/th>\n<th>cuáles<\/th>\n<th>ejemplos del examen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>creciente<\/strong><\/td>\n<td>cerrada + abierta · <em>la boca se abre<\/em><\/td>\n<td>ia, ie, io, ua, ue, uo<\/td>\n<td>eu-<strong>fo<\/strong>-ria, his-<strong>te<\/strong>-ria, me-<strong>li<\/strong>-fluo, es-cri-<strong>to<\/strong>-rio<\/td>\n<\/tr>\n<tr>\n<td><strong>decreciente<\/strong><\/td>\n<td>abierta + cerrada · <em>la boca se cierra<\/em><\/td>\n<td>ai, ei, oi, au, eu, ou<\/td>\n<td><strong>cau<\/strong>-sa, <strong>trau<\/strong>-ma, <strong>eu<\/strong>-foria<\/td>\n<\/tr>\n<tr>\n<td><strong>homogéneo<\/strong><\/td>\n<td>cerrada + cerrada · <em>la boca ni se abre ni se cierra<\/em><\/td>\n<td><strong>ui, iu<\/strong><\/td>\n<td>je-<strong>sui<\/strong>-ta, cons-ti-<strong>tuir<\/strong>, al-<strong>truis<\/strong>-ta, gra-<strong>tui<\/strong>-to, hui-do, huir<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Dónde van <em>UI<\/em> e <em>IU<\/em>.<\/strong> No son decrecientes: son <strong>homogéneos<\/strong>, porque sus dos vocales son cerradas y ninguna de las dos abre la boca más que la otra. De ahí salen <em>rui-do<\/em>, <em>je-sui-ta<\/em> y <em>ciu-dad<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Dos avisos.<\/strong> La <strong>h<\/strong> entre vocales no deshace el diptongo: <em>ahu-ma-do<\/em> sigue teniendo diptongo. En <strong>gue, gui, que, qui<\/strong> la <em>u<\/em> no suena, así que no hay diptongo: en <em>guerra<\/em>, <em>quince<\/em> o <em>máquina<\/em> solo interviene una vocal.<\/p>\n<p>Un <strong>triptongo<\/strong> son tres vocales en la misma sílaba, cerrada átona + abierta + cerrada átona, y aparece casi siempre en la forma de <em>vosotros<\/em>: <em>es-tu-<span class=\"vs\">diáis<\/span><\/em>, <em>lim-<span class=\"vs\">piáis<\/span><\/em>, <em>a-ve-ri-<span class=\"vs\">güéis<\/span><\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Las formas de <i>vosotros<\/i>: pon la tilde", "dossier": {"cuaderno": "1", "ejercicio": 4, "parte": "la tilde"}, "ayuda": "Doce formas de <i>vosotros<\/i> escritas sin ninguna tilde. Escríbelas con la tilde donde haga falta.", "estricto": true, "items": [{"enun": "<i>tengais<\/i>", "sol": "tengáis", "porque": "-áis/-éis, con la fuerza en ellas: lleva tilde"}, {"enun": "<i>teniais<\/i>", "sol": "teníais", "porque": "-íais, con la fuerza en la i: lleva tilde"}, {"enun": "<i>acababais<\/i>", "sol": "acababais", "porque": "-ais/-eis, con la fuerza antes: no lleva tilde"}, {"enun": "<i>saldreis<\/i>", "sol": "saldréis", "porque": "-áis/-éis, con la fuerza en ellas: lleva tilde"}, {"enun": "<i>tuvierais<\/i>", "sol": "tuvierais", "porque": "-ais/-eis, con la fuerza antes: no lleva tilde"}, {"enun": "<i>hayais<\/i>", "sol": "hayáis", "porque": "-áis/-éis, con la fuerza en ellas: lleva tilde"}, {"enun": "<i>vendriais<\/i>", "sol": "vendríais", "porque": "-íais, con la fuerza en la i: lleva tilde"}, {"enun": "<i>cantabais<\/i>", "sol": "cantabais", "porque": "-ais/-eis, con la fuerza antes: no lleva tilde"}, {"enun": "<i>corregireis<\/i>", "sol": "corregiréis", "porque ormato del ejercicio real. Copia cada una con la tilde puesta si le corresponde y tal cual si no. El enunciado no indica cuántas llevan, igual que el del examen.", "items": [{"enun": "<i>tambien<\/i>", "sol": "también", "porque": "tam-<b>bién<\/b>: aguda acabada en -n"}, {"enun": "<i>martes<\/i>", "sol": "martes", "porque": "<b>mar<\/b>-tes: llana acabada en -s, se queda como está"}, {"enun": "<i>movil<\/i>", "sol": "móvil", "porque": "<b>mó<\/b>-vil: llana acabada en -l"}, {"enun": "<i>numero<\/i>", "sol": "número", "porque": "<b>nú<\/b>-me-ro: esdrújula"}, {"enun": "<i>hotel<\/i>", "sol": "hotel", "porque": "ho-<b>tel<\/b>: aguda acabada en -l, sin tilde"}, {"enun": "<i>tramite<\/i>", "sol": "trámite", "porque": "<b>trá<\/b>-mi-te: esdrújula"}, {"enun": "<i>turno<\/i>", "sol": "turno", "porque": "<b>tur<\/b>-no: llana acabada en vocal"}, {"enun": "<i>ingles<\/i>", "sol": "inglés", "porque": "in-<b>glés<\/b>: aguda acabada en -s"}], "criterio": "El enunciado no indica cuántas llevan tilde, y el del examen tampoco. Las tres que se quedan como están son de las formas que no llevan tilde: una llana acabada en -s, una aguda acabada en -l y una llana acabada en vocal. La corrección comprueba en cada palabra si lleva tilde y en qué sílaba: ⊗<i>tramíte<\/i>, con la tilde en la sílaba equivocada, es una palabra mal escrita, igual que <i>tramite<\/i> sin tilde.", "apoyo": ["Pieza 1 · 5 · Cómo se contesta el ejercicio real"], "solo_web": true}], "cuaderno": [{"pieza": 1, "apartados": [4, 5], "ejercicios": [4, 5]}, {"pieza": 2, "apartados": [1, 2], "ejercicios": [1]}], "cuaderno_txt": "Pieza 1 · La sílaba y el acento — apartados 4 y 5: La familia que más aparece: las formas de vosotros; Cómo se contesta el ejercicio real (p. 10 y 11) · ejercicios 4 y 5 · Pieza 2 · Vocales en contacto — apartados 1 y 2: Abiertas y cerradas; El diptongo (p. 14) · ejercicio 1", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Leer el texto entero", "meta": "60 minutos · el «NO», la cuenta del −0,16 y la lectura guiada de 2016t, que está en el carril «El texto»", "teoria": "<div class=\"enelexamen\"><strong>En los dos exámenes.<\/strong> Los dos empiezan igual: un texto y seis preguntas de opción múltiple de 0,5 puntos.<\/div>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Llengua castellana<\/th>\n<th>Comentari de text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>el texto<\/td>\n<td>de 224 a 454 palabras; novela en 11 de los 24 exámenes y prensa o ensayo en 13<\/td>\n<td>de 544 a 709 palabras; ensayo de divulgación en 4 de los 6 y columna de opinión en 2<\/td>\n<\/tr>\n<tr>\n<td>las preguntas<\/td>\n<td>seis de 0,5 puntos (bloque 1)<\/td>\n<td>seis de 0,5 puntos (bloque 1), y tres abiertas de 1 punto (bloque 2)<\/td>\n<\/tr>\n<tr>\n<td>si aciertas<\/td>\n<td>+0,5<\/td>\n<td>+0,5<\/td>\n<\/tr>\n<tr>\n<td>si fallas<\/td>\n<td><strong>−0,16<\/strong><\/td>\n<td><strong>−0,16<\/strong><\/td>\n<\/tr>\n<tr>\n<td>si lo dejas en blanco<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>el bloque<\/td>\n<td>no baja de 0 por muchos errores que haya<\/td>\n<td>no baja de 0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Son 3 puntos en cada examen: <strong>6 de los 20 de abril<\/strong>, y se contestan rodeando una letra.<\/p>\n<p>En el comentario, el cuadernillo trae el texto dos veces, en catalán y en castellano, una versión detrás de la otra, y las dos dicen lo mismo. <strong>La primera pasada se hace en la lengua en la que cada uno lea más rápido<\/strong>, que en buena parte del alumnado de este centro es el catalán: esa pasada solo sirve para saber de qué trata el texto, y cuanto antes se sepa, más minutos quedan para las seis preguntas.<\/p>\n<p><strong>De la segunda pasada en adelante se trabaja sobre la versión castellana<\/strong>, y por tres razones concretas: la pregunta de léxico pregunta por una palabra castellana, que en la traducción catalana puede ser otra o no existir; los enunciados entrecomillan las expresiones tal como están escritas en castellano, y hay que localizarlas ahí; y la redacción se escribe en castellano, así que las palabras que se reutilicen tienen que salir de esa versión. Leerse las dos versiones enteras y despacio ocupa cinco minutos y no añade información: son la misma traducción dos veces.<\/p>\n<h3>1 · Las cuatro pasadas<\/h3>\n<p>Leer un texto de examen consiste en <strong>localizar<\/strong>: las preguntas ya están escritas y cada una tiene su sitio en el papel.<\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué haces<\/th>\n<th style=\"text-align: right;\">cuánto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · seguida<\/strong><\/td>\n<td>Lees entero, sin parar y sin subrayar, para saber de qué trata<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2 · lees las preguntas<\/strong><\/td>\n<td>Antes de volver al texto, para saber qué hay que buscar en él<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<tr>\n<td><strong>3 · localizas<\/strong><\/td>\n<td>Vuelves al texto y anotas en el margen el número de la pregunta junto al trozo que la contesta<\/td>\n<td style=\"text-align: right;\">5 min<\/td>\n<\/tr>\n<tr>\n<td><strong>4 · el léxico<\/strong><\/td>\n<td>Buscas la palabra o las palabras del ejercicio de léxico y lees <strong>la frase entera<\/strong> donde están<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La pasada 2 convierte la relectura en una búsqueda: al volver al texto ya sabes qué seis respuestas buscas, y cada una se localiza en una pasada en lugar de releer el texto seis veces.<\/p>\n<p><strong>Las marcas son tres:<\/strong> el número de la pregunta en el margen, un círculo en la palabra que no entiendes y una raya vertical al lado del párrafo donde está la idea general del autor. Subrayar frases enteras no añade nada que no esté ya en esas tres marcas, y deja el texto sin ningún sitio que destaque cuando hay que volver a él.<\/p>\n<p><strong>Dónde está cada respuesta.<\/strong> Los textos de prensa y de ensayo —13 de los 24 de castellano y los seis del comentario— se organizan casi siempre así. En los once fragmentos de novela la respuesta se busca por el orden de los hechos, no por el sitio del párrafo:<\/p>\n<table>\n<thead>\n<tr>\n<th>dónde<\/th>\n<th>qué suele haber<\/th>\n<th>qué pregunta sale de ahí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>primer párrafo<\/td>\n<td>la anécdota concreta, el caso, la escena<\/td>\n<td>las preguntas locales: «según el texto, ¿por qué…?»<\/td>\n<\/tr>\n<tr>\n<td>párrafos centrales<\/td>\n<td>los datos, los ejemplos, las voces citadas<\/td>\n<td>las locales y la de léxico<\/td>\n<\/tr>\n<tr>\n<td>último párrafo<\/td>\n<td><strong>la idea general del autor<\/strong><\/td>\n<td>la intención del autor y la de inferencia<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La respuesta a la pregunta de la intención está casi siempre en el último párrafo.<\/strong><\/p>\n<h3>2 · Qué preguntan las seis<\/h3>\n<p>Las seis preguntas se reparten en cuatro tipos, con frecuencias conocidas. <strong>Los cuatro tipos no son casillas que sumen seis.<\/strong> Una pregunta de léxico puede ser a la vez local, y la rotativa cae unas veces dentro de una global y otras como pregunta aparte; las cifras de abajo indican cuántas suele haber de cada tipo, no cómo se reparten las seis.<\/p>\n<p><strong>Dos globales.<\/strong> Preguntan por el texto entero: la intención del autor, su actitud, qué se desprende de lo que escribe. En el comentario, la intención del autor es la pregunta 1.1 <strong>en las seis convocatorias<\/strong>, siempre la primera. En castellano caen dos por examen.<\/p>\n<blockquote>\n<p>La respuesta sale del conjunto del texto, no de una línea. Por eso se contestan al final, cuando ya has leído las otras cinco.<\/p>\n<\/blockquote>\n<p><strong>Dos o tres locales.<\/strong> Preguntan por un dato concreto: quién hizo qué, por qué ocurrió un hecho, a qué se refiere una expresión. La respuesta está en una línea del texto y se localiza.<\/p>\n<blockquote>\n<p>2025t, 1.2: «¿Cuál es el significado en el texto de la expresión <em>Mi suerte natural<\/em>?» a) El destino que me correspondía por mi origen social. b) La alegría que tenía por haber encontrado ese trabajo. c) El trabajo que me correspondía por la formación que había recibido en la escuela. d) El destino que me correspondía por mi carácter natural.<\/p>\n<p>Las cuatro opciones son plausibles si no vuelves al texto. La a) y la d) se diferencian en dos palabras.<\/p>\n<\/blockquote>\n<p><strong>Una de léxico<\/strong>, siempre, y a veces dos. Es la única que cae en todos los exámenes de los dos tribunales, y tiene ocho formas que no se contestan igual: el apartado siguiente las separa una por una.<\/p>\n<p><strong>Una rotativa.<\/strong> La que cambia de examen a examen: una figura retórica, una relación entre dos ideas, un rasgo del tipo de texto, una expresión en sentido figurado.<\/p>\n<h3>3 · La pregunta de léxico, que tiene ocho formas<\/h3>\n<p><strong>Cuántas caen.<\/strong> Una por examen como mínimo en Llengua castellana. En Comentari de text hay nueve repartidas en las seis convocatorias, así que en alguna caen dos. Contando una por una las de los diez textos del banco del anexo A-2 y las ocho de la tanda del 27 de octubre de tandas-por-tipo, el censo da <strong>veintitrés preguntas de léxico<\/strong> de las que se conoce el enunciado y la clave. Con ese censo está hecha la tabla.<\/p>\n<p><strong>Diez de las veintitrés no traen opciones<\/strong>, contando la de campo semántico. Piden escribir la palabra o la explicación en el papel. Quien solo ha practicado el test llega a más de un tercio de las preguntas de léxico sin método.<\/p>\n<table>\n<thead>\n<tr>\n<th>forma<\/th>\n<th>cómo suena el enunciado<\/th>\n<th>dónde cayó<\/th>\n<th style=\"text-align: right;\">de las 23<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · sinónimo en test<\/strong><\/td>\n<td>«¿Cuál es un sinónimo adecuado para la palabra <em>indeleble<\/em>?»<\/td>\n<td>2019t 1.3 (<em>pudor<\/em>) · 2025t 1.5 (<em>reputadas<\/em>) · 2026s 1.2 y 1.6 (<em>se ubique<\/em>)<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<\/tr>\n<tr>\n<td><strong>2 · antónimo en test<\/strong><\/td>\n<td>«elija un <strong>antónimo<\/strong> para el adjetivo <em>ilusa<\/em> en el texto»<\/td>\n<td>2016t 1.3 · 2016s 1.2 (<em>vislumbrar<\/em>) · 2024s 1.6 (<em>ineludible<\/em>)<\/td>\n<td style=\"text-align: right;\">3<\/td>\n<\/tr>\n<tr>\n<td><strong>3 · el «NO»<\/strong><\/td>\n<td>«¿Cuál de las siguientes palabras <strong>NO<\/strong> es un sinónimo de <em>insondable<\/em> en el texto?»<\/td>\n<td>2015s 1.1<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<\/tr>\n<tr>\n<td><strong>4 · cuatro definiciones<\/strong><\/td>\n<td>«¿Cuál es el significado en el texto de la expresión <em>Mi suerte natural<\/em>?»<\/td>\n<td>2025t 1.2 · 2024s 1.4 (<em>inverosímil<\/em>) · 2025s 1.3 (<em>no emanaban de él<\/em>) y comentario 2025s 1.6 (<em>tangible<\/em>)<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<\/tr>\n<tr>\n<td><strong>5 · hiperónimo en test<\/strong><\/td>\n<td>«Indique cuál de las siguientes palabras es el <strong>hiperónimo<\/strong> de <em>tufo<\/em>»<\/td>\n<td>2015t 1.3<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<\/tr>\n<tr>\n<td><strong>6 · abierta de una palabra<\/strong><\/td>\n<td>«Proponga un sinónimo de <em>aferrados<\/em> en el texto»<\/td>\n<td>2016t 1.6 · 2017s 1.5 (<em>arreboladas<\/em>) y 1.6 (<em>carnosos<\/em>) · 2018t 1.6 (<em>acumulación<\/em>) · 2026t 1.6 (<em>perentorio<\/em>)<\/td>\n<td style=\"text-align: right;\"><strong>5<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>7 · abierta de explicación<\/strong><\/td>\n<td>«Explique el significado de la expresión <em>romper el silencio<\/em>»<\/td>\n<td>2017t 1.6 (<em>ignorancia supina<\/em>) · 2018s 1.5 (<em>ahogar las penas<\/em>) · 2019t 1.6 · 2016s 1.6 (el refrán <em>no es oro todo lo que reluce<\/em>)<\/td>\n<td style=\"text-align: right;\"><strong>4<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>8 · campo semántico<\/strong><\/td>\n<td>«Identifique en el texto <strong>cinco palabras<\/strong> del campo semántico de la luz y escríbalas»<\/td>\n<td>2015t 1.4<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>La forma 4 pide una definición<\/h4>\n<p>Las cuatro opciones son cuatro oraciones que definen la palabra en ese texto, y se elige la que encaja en la frase. Tres ejemplos reales:<\/p>\n<blockquote>\n<p><strong>2024s, 1.4 · <em>inverosímil<\/em>.<\/strong> De las cuatro opciones, la b) y la d) no definen nada: proponen «es antónimo de…» y «es sinónimo de…». Quien lee deprisa contesta una <strong>relación<\/strong> donde le piden un <strong>significado<\/strong>.<\/p>\n<p><strong>Comentario 2025s, 1.6 · <em>tangible<\/em>.<\/strong> Vuelve a ocurrir: dos de las cuatro son «es sinónimo de intangible» y «es antónimo de palpable», y ninguna de las dos explica qué significa <em>tangible<\/em>.<\/p>\n<p><strong>2025s, 1.3 · <em>no emanaban de él<\/em>.<\/strong> Aquí las cuatro sí definen, y se diferencian en un matiz: <em>no los había pagado él<\/em>, <em>no eran obra suya<\/em>, <em>él no los había comprendido<\/em>, <em>no los había ordenado él<\/em>. La clave es la segunda, y las otras tres solo se descartan leyendo la oración entera del texto.<\/p>\n<\/blockquote>\n<p><strong>El paso:<\/strong> antes de leer las opciones, formula con tus palabras el significado que tiene en esa frase. Después busca la opción que coincide con lo que has formulado. Una opción que empieza por <em>es sinónimo de<\/em> o <em>es antónimo de<\/em> no define: se descarta cuando la relación que propone es falsa —«es sinónimo de <em>intangible<\/em>» para <em>tangible<\/em>— o cuando el enunciado pide el significado y no una relación.<\/p>\n<h4>La forma 5, el hiperónimo, que cayó una sola vez<\/h4>\n<p>Cayó una sola vez y con cuatro opciones del mismo terreno: el hiperónimo de <em>tufo<\/em> entre <em>hedor<\/em>, <em>humo<\/em>, <em>peste<\/em> y <em>efluvio<\/em>. <strong>La clave es <em>efluvio<\/em><\/strong>, y las dos trampas son <em>hedor<\/em> y <em>peste<\/em>, que son <strong>sinónimos<\/strong> de <em>tufo<\/em> y no nombran su clase. La prueba que lo resuelve está en la pieza 5: el hiperónimo admite la frase «un tufo es un efluvio» y no admite la contraria. Con dos sinónimos entre las opciones, quien no distinga sinonimia de hiperonimia tiene tres candidatos donde hay uno.<\/p>\n<h4>Las formas 6 y 7, las abiertas, y cómo las corrige el tribunal<\/h4>\n<p>Son diez de veintitrés y se dividen en dos:<\/p>\n<table>\n<thead>\n<tr>\n<th>qué piden<\/th>\n<th>enunciados reales<\/th>\n<th>qué se escribe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>una palabra<\/strong> (forma 6)<\/td>\n<td>«Proponga un sinónimo de <em>aferrados<\/em>» · «Proponga un sinónimo de <em>arreboladas<\/em>» · «¿Cuál sería un antónimo posible del adjetivo <em>carnosos<\/em>?» · «Proponga un antónimo del sustantivo <em>acumulación<\/em> en el sentido que tiene en el texto» · «Escriba un sinónimo del adjetivo <em>perentorio<\/em>»<\/td>\n<td>una palabra, o dos separadas por coma cuando se duda<\/td>\n<\/tr>\n<tr>\n<td><strong>una explicación<\/strong> (forma 7)<\/td>\n<td>«Proponga una expresión de significado equivalente a <em>ignorancia supina<\/em>» · «¿Cuál es el significado de la expresión <em>ahogar las penas<\/em>?» · «Explique el significado de la expresión <em>romper el silencio<\/em>» · «Explique con sus propias palabras el significado del refrán <em>no es oro todo lo que reluce<\/em>»<\/td>\n<td>una oración: la clase a la que pertenece y la propiedad que la distingue<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Las claves oficiales de estas nueve acaban en puntos suspensivos o dan una lista<\/strong>, de modo que admiten cualquier respuesta que funcione. La de <em>acumulación<\/em> admite «disminución, escasez, reducción, insuficiencia…»; la de <em>perentorio<\/em> da seis —«imperioso, apremiante, acuciante, urgente, inaplazable, impostergable»—; la de <em>romper el silencio<\/em>, «acabar con una situación tensa, incómoda o difícil; poner fin a un momento embarazoso». Se corrigen, por tanto, <strong>sustituyendo la palabra del texto por tu respuesta y leyendo la oración entera<\/strong>: si la oración sigue significando lo mismo, el punto está dado.<\/p>\n<p><strong>Dos errores que sí descuentan.<\/strong> El primero: <strong>cambiar de clase de palabra<\/strong>. El enunciado la nombra —«un antónimo para el <strong>adjetivo<\/strong> <em>ilusa<\/em>», «un antónimo del <strong>sustantivo<\/strong> <em>acumulación<\/em>», «un sinónimo del <strong>adjetivo<\/strong> <em>perentorio<\/em>»—, y contestar con un verbo donde piden un sustantivo pierde el ítem aunque el significado sea el correcto. El segundo: <strong>contestar con una relación en lugar de con la palabra<\/strong>, que es el error de la forma 4 invertido; «lo contrario de acumulación» no es un antónimo de <em>acumulación<\/em>.<\/p>\n<p><strong>En las cuatro de la forma 7, la respuesta se construye como una definición<\/strong>, con el esquema del apartado 7 de la pieza 11: primero la clase a la que pertenece y después lo que la distingue de las demás de esa clase. <em>Ahogar las penas<\/em> no es «cuando bebes para olvidar»; es «buscar consuelo para una tristeza, normalmente bebiendo». Y en el refrán, la explicación recoge para qué se usa el refrán entero, no lo que significan sus palabras una por una.<\/p>\n<h4>La forma 8 es la única que descuenta dentro de la propia respuesta<\/h4>\n<p>«Identifique en el texto cinco palabras del campo semántico de la luz.» La clave de 2015t da siete —<em>apagar, lámpara, penumbra, iluminaban, resplandor, oscuridad, fulgor<\/em>—, <strong>da 0,1 por acierto y resta 0,1 por cada palabra mal identificada<\/strong>, con el suelo en 0. La consecuencia práctica: escribir siete para asegurar cinco baja la nota en cuanto dos no pertenecen al campo, porque cinco aciertos suman 0,5 y dos errores restan 0,2. <strong>Se escriben las cinco de las que se está seguro.<\/strong><\/p>\n<h4>Los cinco distractores que se repiten<\/h4>\n<table>\n<thead>\n<tr>\n<th>distractor<\/th>\n<th>en qué consiste<\/th>\n<th>dónde cayó<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>el antónimo colado en una pregunta de sinónimo<\/strong><\/td>\n<td>piden sinónimo y una de las cuatro significa lo contrario<\/td>\n<td><em>pudor<\/em> → <em>desvergüenza<\/em> (2019t)<\/td>\n<\/tr>\n<tr>\n<td><strong>el sinónimo colado en una pregunta de antónimo<\/strong><\/td>\n<td>piden antónimo y <strong>dos o tres<\/strong> de las cuatro son sinónimos<\/td>\n<td><em>ilusa<\/em> → <em>idealista<\/em> y <em>quimérica<\/em> (2016t) · <em>vislumbrar<\/em> → <em>conjeturar<\/em>, <em>presumir<\/em>, <em>deducir<\/em> (2016s)<\/td>\n<\/tr>\n<tr>\n<td><strong>el sinónimo colado en una pregunta de hiperónimo<\/strong><\/td>\n<td>piden la clase y dos opciones nombran lo mismo con otra palabra<\/td>\n<td><em>tufo<\/em> → <em>hedor<\/em> y <em>peste<\/em> (2015t)<\/td>\n<\/tr>\n<tr>\n<td><strong>el parecido de forma<\/strong><\/td>\n<td>la opción comparte prefijo o terminación con la palabra, y no comparte el significado<\/td>\n<td><em>inhalable<\/em> → <em>inalienable<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>la relación en lugar del significado<\/strong><\/td>\n<td>la opción indica con qué palabra se relaciona en vez de definirla<\/td>\n<td><em>inverosímil<\/em> (2024s) y <em>tangible<\/em> (2025s)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A esos cinco se añade, a veces, <strong>el co-hipónimo<\/strong>: una palabra del mismo tipo que la buscada —las dos contestan a «es una clase de…» lo mismo— que no encaja en esa frase concreta. La pieza 5 lo separa de la palabra que solo comparte el campo de significado. Ninguno de los seis se detecta con la palabra sola, y los seis se descartan leyendo la oración entera del texto. Por eso la pasada 4 dura dos minutos y no veinte segundos.<\/p>\n<h4>El procedimiento, que es el mismo para las ocho formas<\/h4>\n<ol>\n<li><strong>Subraya en el enunciado la palabra que indica qué piden<\/strong>: <em>sinónimo<\/em>, <em>antónimo<\/em>, <em>hiperónimo<\/em>, <em>NO<\/em>, <em>significado<\/em>, <em>campo semántico<\/em>, y la clase de palabra cuando la nombra.<\/li>\n<li><strong>Vuelve al texto y lee la oración entera<\/strong> donde está, no la palabra sola.<\/li>\n<li><strong>Formula la respuesta con tus palabras<\/strong> antes de leer las opciones, en el margen.<\/li>\n<li><strong>Busca la opción que coincide<\/strong> con lo que has escrito.<\/li>\n<\/ol>\n<p>El paso 3 une las dos mitades del reparto: quien lo hace ya tiene contestadas las formas 6 y 7, que no traen opciones, y en las otras seis solo le queda buscar en la lista lo que ya sabe.<\/p>\n<h3>4 · El «NO»<\/h3>\n<p>En uno de cada dos exámenes de castellano y en <strong>los seis<\/strong> de comentario hay una pregunta formulada en negativo: «¿cuál de las siguientes afirmaciones es <strong>falsa<\/strong>?», «¿cuál <strong>NO<\/strong> está usada en sentido figurado?». El enunciado lo marca en mayúsculas o en negrita. Aun así, esa pregunta va en la dirección contraria a la de las otras cinco: tiene tres opciones que cumplen y una que no.<\/p>\n<blockquote>\n<p>2025t, 1.6: «¿Cuál de las siguientes expresiones NO está usada en sentido figurado?» a) A tiro de piedra. b) Gatos al sol. c) Iglesias de relumbrón. d) Corazón de la ciudad.<\/p>\n<p>La respuesta es la b). Las otras tres son figuradas; <em>gatos al sol<\/em> son gatos, al sol.<\/p>\n<p>2025s, 1.4: «¿Cuál de las siguientes palabras subrayadas NO está usada en el texto con valor metafórico?» La respuesta es «Había centrado el orgullo en su biblioteca»: ahí <em>biblioteca<\/em> son los libros de una casa, mientras que <em>las altas cimas<\/em> y <em>el terreno del pensamiento<\/em> son metáforas.<\/p>\n<\/blockquote>\n<p><strong>El paso que lo evita:<\/strong> rodea la palabra NO en el enunciado antes de leer las opciones. Quien no lo hace busca la opción que sí cumple, la encuentra —porque hay tres— y la marca.<\/p>\n<h3>5 · Cuándo contestar y cuándo dejarlo en blanco<\/h3>\n<p>Cada error descuenta 0,16 y la pregunta en blanco se queda en cero. <strong>La regla: en cuanto puedas tachar una sola opción, contesta.<\/strong> Sin ninguna opción tachada, contestar al azar y dejarlo en blanco dan casi lo mismo: cinco milésimas de diferencia a favor de contestar.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué se hace con cada pregunta?", "dossier": {"cuaderno": "10", "ejercicio": 1}, "ayuda": "Ocho preguntas sobre el mismo texto. Decide qué hacer con cada una: buscarla en el texto, probar las opciones en la oración, dejarla para el final o contestarla con lo estudiado.", "ops": ["se busca en el texto", "se prueban las opciones en la oración", "se deja para el final", "se contesta con lo estudiado"], "items": [{"enun": "«¿Cuál es la principal intención de la autora con este artículo?»", "sol": "se deja para el final", "porque": "global: es la 1.1 del comentario en las seis convocatorias"}, {"enun": "«¿Cuál es el significado en el texto de la expresión <i>Mi suerte natural<\/i>?»", "sol": "se busca en el texto", "porque": "local: la respuesta está en una frase"}, {"enun": "«De entre las siguientes opciones, elija un sinónimo para el adjetivo <i>ornamental<\/i> en el texto.»", "sol": "se prueban las opciones en la oración", "porque": "de léxico, de la forma 1"}, {"enun": "«Según lo que se puede inferir del texto, podemos decir que la autora…»", "sol": "se deja para el final", "porque": "global: pide inferir del conjunto"}, {"enun": "«¿Qué tipo de adjetivos predominan?»", "sol": "se contesta con lo estudiado", "porque": "rotativa: pregunta una clase de palabra a propósito del estilo"}, {"enun": "«¿Por qué pudo la narradora conocer a los porteros y chóferes de las mejores fincas?»", "sol": "se busca en el texto",
