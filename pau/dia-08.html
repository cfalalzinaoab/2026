<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 8 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

edor de<\/i>.", "apoyo": ["Pieza 4 · 3 · Palabras que se separan"], "dossier_txt": "Del dossier: pieza 4, ejercicio 4"}, {"tipo": "hueco", "titulo": "Set 2015t: ponga tilde en las palabras que lo requieran", "estricto": true, "ayuda": "Las ocho palabras del ejercicio de 2015, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no. En el examen, la clave cuenta como error tanto la tilde que falta como la que sobra.", "items": [{"enun": "<i>recien<\/i>", "conv": "2015t", "sol": "recién", "porque": "aguda acabada en -n"}, {"enun": "<i>jesuita<\/i>", "conv": "2015t", "sol": "jesuita", "porque": "llana acabada en vocal; <i>ui<\/i> es diptongo, <i>je-sui-ta<\/i>"}, {"enun": "<i>huyais<\/i>", "conv": "2015t", "sol": "huyáis", "porque": "aguda acabada en -s, <i>hu-yáis<\/i>"}, {"enun": "<i>huesped<\/i>", "conv": "2015t", "sol": "huésped", "porque": "llana acabada en -d"}, {"enun": "<i>pua<\/i>", "conv": "2015t", "sol": "púa", "porque": "hiato: <i>ú<\/i> tónica + <i>a<\/i>"}, {"enun": "<i>constituir<\/i>", "conv": "2015t", "sol": "constituir", "porque": "aguda acabada en -r; <i>ui<\/i> es diptongo"}, {"enun": "<i>mayoria<\/i>", "conv": "2015t", "sol": "mayoría", "porque": "hiato: <i>í<\/i> tónica + <i>a<\/i>"}, {"enun": "<i>trauma<\/i>", "conv": "2015t", "sol": "trauma", "porque": "llana acabada en vocal; <i>au<\/i> es diptongo"}], "criterio": "Llevan tilde cinco de las ocho: dos por las reglas generales, <i>recién<\/i> y <i>huésped<\/i>; una aguda de <i>vosotros<\/i>, <i>huyáis<\/i>; y dos hiatos, <i>púa<\/i> y <i>mayoría<\/i>. Los tres señuelos son llanas con diptongo o una aguda en -r. La clave oficial cuenta como error cada palabra mal acentuada y también cada tilde puesta donde no va, así que dejar <i>trauma<\/i> como está es una respuesta.", "apoyo": ["Anexo A-3 · El gimnasio: sets de tildes y formas verbales"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set 2015T"}, "dossier_txt": "Del dossier: anexo A-3 · Set 2015T"}, {"tipo": "cazar", "titulo": "Caza las que van mal escritas", "ayuda": "Un fragmento con faltas de esta familia. Cinco palabras están escritas juntas o separadas al revés de como corresponde: márcalas. Dos de las que parecen faltas están bien.", "items": [{"texto": "No sé porque no me han llamado todavía, pero mañana voy haber si me dicen algo. No es que no quiera el puesto, sino que no puedo empezar antes de las ocho, conque tendrán que cambiarme el turno. Sino me lo cambian, lo entenderé: sobretodo si la razón es el horario. Hablaremos entorno a las condiciones con los demás compañeros.", "faltas": {"porque": "por qué: pregunta indirecta, admite «por qué <i>motivo<\/i>»", "haber": "a ver: «voy a <i>mirar<\/i> si me dicen algo»", "Sino": "Si no: admite «si <i>mañana<\/i> no me lo cambian», condicional", "sobretodo": "sobre todo: significa <i>principalmente<\/i>; junto es un abrigo", "entorno": "en torno a: admite <i>alrededor de<\/i>, locución separada"}}], "criterio": "Las cinco se cazan con la prueba de su par. Las dos que están bien y parecen faltas son <i>sino<\/i>, adversativo —«no es que no quiera, sino que»—, y <i>conque<\/i>, que equivale a <i>así que<\/i>; marcarlas cuenta como error.", "apoyo": ["Pieza 4 · 3 · Palabras que se separan"], "solo_web": true}], "cuaderno": [{"pieza": 4, "apartados": [3], "ejercicios": [3, 4]}, {"pieza": "A-3", "apartados": ["Set 2015T"]}], "cuaderno_txt": "Pieza 4 · Las letras, las palabras que se separan y corregir lo que escribes — apartado 3: Palabras que se separan (p. 36) · ejercicios 3 y 4 · Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Set 2015T (p. 293)", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Significado I: sinónimo, antónimo, hiperónimo y sentido figurado", "meta": "45 minutos · el distractor co-hipónimo, el antónimo con el enunciado subrayado, la prueba del hiperónimo, literal y figurado", "teoria": "<div class=\"enelexamen\"><strong>En los dos exámenes.<\/strong> Esta pieza sostiene cuatro tipos de pregunta, y entre las cuatro suman más puntos que ninguna otra parte del bloque 1:<\/div>\n<table>\n<thead>\n<tr>\n<th>pregunta<\/th>\n<th>dónde<\/th>\n<th>cae<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Léxico en contexto<\/strong>: sinónimo, antónimo o significado de una palabra culta, entre cuatro opciones<\/td>\n<td>bloque 1 de los dos exámenes<\/td>\n<td><strong>al menos una por examen<\/strong>; en el comentario, nueve preguntas en seis convocatorias<\/td>\n<\/tr>\n<tr>\n<td><strong>Figura retórica<\/strong>: nombrar la figura entre cuatro<\/td>\n<td>bloque 1 de Llengua castellana<\/td>\n<td>5 de 24, y <strong>todas desde 2021<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Sentido figurado y fraseología<\/strong>: qué significa una expresión, o cuál NO está en sentido figurado<\/td>\n<td>bloque 1<\/td>\n<td>alrededor de una por examen<\/td>\n<\/tr>\n<tr>\n<td><strong>Sinónimo suelto, no-sinónimo, campo semántico<\/strong><\/td>\n<td>bloque 3<\/td>\n<td>3 de 24<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y el cambio de formato de las preguntas de léxico en test:<\/strong> no se propone una palabra, <strong>se elige entre cuatro<\/strong>, de modo que lo que hay que entrenar es descartar los tres distractores leyendo la frase con cada uno dentro, y no recordar el sinónimo.<\/p>\n<h3>1 · Sinonimia, y el distractor co-hipónimo<\/h3>\n<p>Dos palabras con el mismo significado y <strong>de la misma clase<\/strong>: un sustantivo por un sustantivo, un verbo por un verbo.<\/p>\n<p>La sinonimia total casi no existe. <em>Can<\/em> y <em>perro<\/em> son sinónimos y nadie dice que saca a pasear a su can. Lo normal es la <strong>sinonimia parcial<\/strong>: dos palabras se intercambian en un contexto y en otro no. Por eso el enunciado suele incluir «en el texto» o «según su uso en el texto»; en 2019t y en 2025t no lo lleva, y la palabra se decide igual leyendo su frase.<\/p>\n<blockquote>\n<p><strong>Cómo se fabrica el distractor, y tres clases que no se descartan igual.<\/strong> De las cuatro opciones, dos o tres suelen estar en el terreno de significado de la palabra buscada, y por eso parecen posibles. Se separan así:<\/p>\n<ul>\n<li><strong>El co-hipónimo<\/strong>, que es del mismo tipo: la palabra buscada y él contestan a «es una clase de…» lo mismo. <em>Furgoneta<\/em> y <em>autobús<\/em> son co-hipónimos porque las dos son vehículos. Se descarta metiéndolo en la frase: es del tipo correcto y no es ese.<\/li>\n<li><strong>La palabra del mismo campo que no es del mismo tipo.<\/strong> En el ítem de <em>tufo<\/em>, <em>humo<\/em> está en el terreno del olor sin ser una clase de olor: comparte el campo semántico y no el hiperónimo. Se descarta por el significado.<\/li>\n<li><strong>El sinónimo de la palabra buscada, en una pregunta que pedía otra relación<\/strong>: <em>idealista<\/em> y <em>quimérica<\/em> son sinónimos de <em>ilusa<\/em> en un ítem que pedía un antónimo. Se descarta releyendo el enunciado.<\/li>\n<\/ul>\n<p>Llamarlos a los tres co-hipónimos deja un solo procedimiento para tres trampas distintas. <strong>Co-hipónimo<\/strong> exige compartir hiperónimo; <strong>campo semántico<\/strong> solo exige compartir terreno, así que admite palabras que no son una clase de nada común: <em>portero<\/em> y <em>mudanza<\/em> están en el campo de la vivienda y no contestan juntas a ninguna pregunta «es una clase de…».<\/p>\n<\/blockquote>\n<p><strong>El procedimiento:<\/strong> no elijas la que se parece. <strong>Sustituye la palabra del texto por cada una de las cuatro y lee la oración entera.<\/strong> Tres de las cuatro producen una oración que no funciona.<\/p>\n<p><strong>Un ejemplo entero, hecho paso a paso.<\/strong> La frase es «el convenio <strong>contempla<\/strong> una subida del 3 %» y las opciones, a) <em>mira<\/em>, b) <em>prevé<\/em>, c) <em>observa<\/em>, d) <em>vigila<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>opción<\/th>\n<th>la frase con ella dentro<\/th>\n<th>qué pasa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a) mira<\/td>\n<td>«el convenio mira una subida»<\/td>\n<td><em>mirar<\/em> pide ojos: un convenio no mira<\/td>\n<\/tr>\n<tr>\n<td>b) prevé<\/td>\n<td>«el convenio prevé una subida»<\/td>\n<td>encaja: <em>contemplar<\/em> aquí significa tener algo previsto por escrito<\/td>\n<\/tr>\n<tr>\n<td>c) observa<\/td>\n<td>«el convenio observa una subida»<\/td>\n<td><em>observar<\/em> vale por <em>cumplir<\/em> —<em>observar la norma<\/em>—, no por <em>prever<\/em><\/td>\n<\/tr>\n<tr>\n<td>d) vigila<\/td>\n<td>«el convenio vigila una subida»<\/td>\n<td>mismo problema que <em>mirar<\/em>, y además añade una intención que no hay<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las tres descartadas son sinónimas de <em>contemplar<\/em> en otro de sus sentidos, el de mirar con atención. Las opciones suelen ser sinónimos de la palabra <strong>en un sentido que no es el del texto<\/strong>.<\/p>\n<h3>2 · Antonimia<\/h3>\n<p>Significados contrarios, misma clase. Tres tipos: <strong>graduales<\/strong> (<em>frío / templado / caliente<\/em>), <strong>complementarios<\/strong> (<em>vivo / muerto<\/em>, sin término medio) y <strong>recíprocos<\/strong> (<em>comprar / vender<\/em>).<\/p>\n<p><strong>Los antónimos con prefijo.<\/strong> El prefijo <strong>no cambia la clase de palabra<\/strong>: <em>legal<\/em> es adjetivo e <em>ilegal<\/em> también; <em>empleo<\/em> es sustantivo y <em>desempleo<\/em> también.<\/p>\n<table>\n<thead>\n<tr>\n<th>prefijo<\/th>\n<th>significa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a- / an-<\/strong><\/td>\n<td>ausencia de<\/td>\n<td>apolítico, analfabeto<\/td>\n<\/tr>\n<tr>\n<td><strong>anti-<\/strong><\/td>\n<td>contra<\/td>\n<td>antirrobo, antivirus<\/td>\n<\/tr>\n<tr>\n<td><strong>des- / de-<\/strong><\/td>\n<td>acción al revés<\/td>\n<td>deshacer, desempleo<\/td>\n<\/tr>\n<tr>\n<td><strong>in- / im- / i- / ir-<\/strong><\/td>\n<td>negación<\/td>\n<td>incapaz · imposible (ante <em>p<\/em>, <em>b<\/em>) · ilegal (ante <em>l<\/em>) · irreal (ante <em>r<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>El ítem de antónimo, donde el distractor es un sinónimo<\/h4>\n<blockquote>\n<p><strong>2016t, 1.3.<\/strong> «De entre las siguientes opciones, elija un <strong>antónimo<\/strong> para el adjetivo <em>ilusa<\/em> en el texto.» a) Realista. b) Idealista. c) Altruista. d) Quimérica.<\/p>\n<p><strong>Clave: a) Realista.<\/strong> El reparto de las cuatro: <strong>b) <em>idealista<em> y d) <\/em>quimérica<em> son sinónimos de <\/em>ilusa<\/em><\/strong>, no antónimos. Solo una de las cuatro va en dirección contraria.<\/p>\n<\/blockquote>\n<p><strong>El paso que lo evita<\/strong> es el mismo que rodear el «NO»: <strong>subraya la palabra <em>antónimo<\/em> en el enunciado antes de leer las opciones.<\/strong> Quien lee deprisa busca una palabra parecida a <em>ilusa<\/em>, y encuentra dos.<\/p>\n<h3>3 · Hiperonimia, polisemia y homonimia<\/h3>\n<p><strong>Hiperónimo<\/strong> es la palabra que nombra la clase; <strong>hipónimo<\/strong>, la que nombra un miembro. <em>Vehículo<\/em> es hiperónimo de <em>furgoneta<\/em> y de <em>autobús<\/em>. La prueba: el hiperónimo puede sustituir al hipónimo y no al revés. De una furgoneta se dice «este vehículo»; de un vehículo cualquiera, no se dice «esta furgoneta».<\/p>\n<p><strong>Polisemia:<\/strong> una palabra con varios significados relacionados entre sí, que están en la misma entrada del diccionario porque vienen unos de otros.<\/p>\n<table>\n<thead>\n<tr>\n<th>palabra<\/th>\n<th>un significado<\/th>\n<th>otro<\/th>\n<th>otro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>operación<\/strong><\/td>\n<td>la que hace un cirujano<\/td>\n<td>la que hace un banco<\/td>\n<td>la que hace una calculadora<\/td>\n<\/tr>\n<tr>\n<td><strong>carta<\/strong><\/td>\n<td>la que se echa al buzón<\/td>\n<td>la de la baraja<\/td>\n<td>la del restaurante<\/td>\n<\/tr>\n<tr>\n<td><strong>plancha<\/strong><\/td>\n<td>la de planchar<\/td>\n<td>la de metal<\/td>\n<td>el error (<em>meter la plancha<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>cabeza<\/strong><\/td>\n<td>la del cuerpo<\/td>\n<td>la de familia<\/td>\n<td>la de ajos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Homonimia:<\/strong> dos palabras distintas que coinciden en la forma por casualidad, y tienen entradas separadas en el diccionario. Se dividen según en qué coinciden:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>coinciden en<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>homógrafos<\/strong><\/td>\n<td>la escritura y la pronunciación<\/td>\n<td><em>vino<\/em> (bebida) / <em>vino<\/em> (de <em>venir<\/em>) · <em>lima<\/em> (fruta) / <em>lima<\/em> (herramienta) · <em>sobre<\/em> (preposición) / <em>sobre<\/em> (el de las cartas)<\/td>\n<\/tr>\n<tr>\n<td><strong>homófonos<\/strong><\/td>\n<td>solo la pronunciación<\/td>\n<td><em>hola<\/em> / <em>ola<\/em> · <em>vaya<\/em> / <em>valla<\/em> · <em>hasta<\/em> / <em>asta<\/em> · <em>bello<\/em> / <em>vello<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los homófonos descuentan al escribir, porque se elige la letra equivocada, y por eso se tratan en la pieza 4. Los homógrafos dan pie a las preguntas de significado: la misma palabra escrita puede estar usada en el texto en un sentido o en otro, y el enunciado pregunta en cuál.<\/p>\n<p><strong>La diferencia entre polisemia y homonimia, en una línea:<\/strong> en la polisemia los significados están emparentados —una <em>operación<\/em> de banco y una de cirugía son las dos una serie de pasos que se ejecutan—; en la homonimia los dos significados no guardan relación y coincide únicamente la forma.<\/p>\n<p><strong>El examen no pregunta cuál de las dos es<\/strong>, sino lo que las dos tienen en común: que una palabra puede estar usada en el texto en su sentido corriente o en otro. De ahí salen las preguntas de sentido figurado.<\/p>\n<h3>4 · Literal y figurado<\/h3>\n<p><strong>Sentido literal<\/strong>: el que la palabra tiene en el terreno al que pertenece. El orden del diccionario no lo decide, porque las acepciones se ordenan por frecuencia y por origen, y la primera puede ser la figurada. <strong>Sentido figurado<\/strong>: el que aparece al trasladar esa palabra a otro terreno. <em>Alto<\/em> de estatura es literal; <em>un alto cargo<\/em> es figurado, porque en ese uso la altura ya no se mide en centímetros.<\/p>\n<p>Dos preguntas del examen salen de aquí, y las dos están resueltas en la pieza 10: «¿cuál de estas expresiones NO está usada en sentido figurado?» (2025t) y «¿cuál de estas palabras subrayadas NO está usada con valor metafórico?» (2025s). Las dos son preguntas con «NO», así que se contestan rodeando primero esa palabra.<\/p>\n<p><strong>La fraseología<\/strong> son las expresiones hechas, que significan algo distinto de la suma de sus palabras. Están en el diccionario como bloque y no admiten cambios internos: se dice <em>a tiro de piedra<\/em>, no ⊗<em>a tiro de ladrillo<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>expresión<\/th>\n<th>qué significa<\/th>\n<th>en una frase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>a tiro de piedra<\/em><\/td>\n<td>muy cerca<\/td>\n<td>«La nave está a tiro de piedra de la parada»<\/td>\n<\/tr>\n<tr>\n<td><em>con luces y sombras<\/em><\/td>\n<td>con aciertos y con fallos<\/td>\n<td>«El balance del año salió con luces y sombras»<\/td>\n<\/tr>\n<tr>\n<td><em>ahogar las penas<\/em><\/td>\n<td>intentar olvidar un disgusto bebiendo<\/td>\n<td>«Se fue a ahogar las penas después de suspender»<\/td>\n<\/tr>\n<tr>\n<td><em>tener las alas cortadas<\/em><\/td>\n<td>no poder hacer lo que uno podría<\/td>\n<td>«Sin coche y en aquel pueblo, tenía las alas cortadas»<\/td>\n<\/tr>\n<tr>\n<td><em>estar en la cuerda floja<\/em><\/td>\n<td>estar a punto de perder algo<\/td>\n<td>«Su puesto lleva un año en la cuerda floja»<\/td>\n<\/tr>\n<tr>\n<td><em>echar una mano<\/em><\/td>\n<td>ayudar<\/td>\n<td>«Le echaron una mano con la mudanza»<\/td>\n<\/tr>\n<tr>\n<td><em>dar largas<\/em><\/td>\n<td>retrasar una respuesta sin negarla<\/td>\n<td>«Llevan tres meses dándole largas»<\/td>\n<\/tr>\n<tr>\n<td><em>poner el grito en el cielo<\/em><\/td>\n<td>protestar con mucha fuerza<\/td>\n<td>«El vecindario puso el grito en el cielo»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo se pregunta.<\/strong> El examen da la expresión y cuatro <strong>paráfrasis<\/strong>: cuatro maneras de decir lo mismo con otras palabras. Una es la correcta y las otras tres traducen la expresión palabra por palabra o se quedan en el sentido literal. El ejercicio de esta pieza pide una paráfrasis: explicar qué significa la expresión sin usar ninguna de sus palabras.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Mete cada opción en la frase", "dossier": {"cuaderno": "5", "ejercicio": 1}, "ayuda": "Sustituye la palabra en negrita por cada una de las cuatro opciones y lee la frase entera. Antes de elegir, descarta las tres que no encajan.", "items": [{"enun": "«Mi vecina llevaba dos años <b>sopesando<\/b> la idea de mudarse al pueblo.»", "sol": "Valorando.", "porque": "<i>Sopesar<\/i> es considerar los pros y los contras. <i>Sostener<\/i> y <i>levantar<\/i> recogen el sentido físico de <i>pesar<\/i>, que no es el del texto; <i>separar<\/i> no tiene relación.", "ops": ["Levantando.", "Sosteniendo.", "Valorando.", "Separando."]}, {"enun": "«El convenio <b>contempla<\/b> una subida del 3 %.»", "sol": "Prevé.", "porque": "Las otras tres son sinónimos de <i>contemplar<\/i> en el sentido de mirar, que no es el de la frase.", "ops": ["Prevé.", "Vigila.", "Mira.", "Observa."]}, {"enun": "«La empresa <b>eludió<\/b> el pago durante meses.»", "sol": "Evitó.", "porque": "<i>Eludir<\/i> es esquivar una obligación; <i>escapar<\/i> pide un lugar del que salir, y <i>rechazar<\/i> y <i>negar<\/i> suponen una respuesta explícita que aquí no hay.", "ops": ["Evitó.", "Negó.", "Escapó.", "Rechazó."]}, {"enun": "«El informe fue <b>tajante<\/b>.»", "sol": "Rotundo.", "porque": "<i>Cortante<\/i>, <i>afilado<\/i> y <i>brusco<\/i> son sinónimos de <i>tajante<\/i> en su sentido físico o en el del trato, no en el de un informe.", "ops": ["Cortante.", "Rotundo.", "Brusco.", "Afilado."]}, {"enun": "«Los vecinos <b>suscribieron<\/b> el acuerdo.»", "sol": "Firmaron.", "porque": "<i>Suscribir<\/i> un acuerdo es firmarlo; <i>escribir<\/i> y <i>copiar<\/i> se quedan en la letra y <i>leer<\/i> no compromete a nada.", "ops": ["Escribieron.", "Copiaron.", "Leyeron.", "Firmaron."]}], "criterio": "Las opciones que no encajan suelen ser sinónimos de la palabra en otro de sus sentidos: el físico (<i>sostener<\/i> y <i>levantar<\/i> para <i>sopesar<\/i>) o el de mirar (<i>observar<\/i> para <i>contemplar<\/i>). La frase entera decide en qué sentido está usada la palabra.", "apoyo": ["1 · Sinonimia, y el distractor co-hipónimo"], "dossier_txt": "Del dossier: pieza 5, ejercicio 1"}, {"tipo": "opcion", "titulo": "El antónimo, con el enunciado delante", "dossier": {"cuaderno": "5", "ejercicio": 2}, "ayuda": "Antes de leer las opciones, localiza en el enunciado la palabra <i>antónimo<\/i>: en cada ítem hay sinónimos puestos para quien busca la palabra parecida.", "items": [{"enun": "Antónimo. «Después de la visita al médico salió <b>animada<\/b>.»", "sol": "Abatida.", "porque": "El enunciado pide <b>antónimo<\/b>, y <i>contenta<\/i> y <i>entusiasmada<\/i> son sinónimos de <i>animada<\/i>: dos de las cuatro opciones van en la dirección contraria a la pedida, igual que en el ítem de 2016. <i>Nerviosa<\/i> no es ni lo uno ni lo otro.", "ops": ["Abatida.", "Contenta.", "Entusiasmada.", "Nerviosa."]}, {"enun": "Antónimo. «Es un trámite <b>farragoso<\/b>.»", "sol": "Sencillo.", "porque": "<i>Enrevesado<\/i>, <i>complejo<\/i> y <i>tedioso<\/i> son sinónimos de <i>farragoso<\/i>.", "ops": ["Enrevesado.", "Sencillo.", "Complejo.", "Tedioso."]}, {"enun": "Antónimo. «El horario es <b>flexible<\/b>.»", "sol": "Rígido.", "porque": "Las otras tres son sinónimos de <i>flexible<\/i>.", "ops": ["Variable.", "Adaptable.", "Amplio.", "Rígido."]}, {"enun": "Antónimo. «La respuesta fue <b>escueta<\/b>.»", "sol": "Extensa.", "porque": "<i>Breve<\/i>, <i>concisa<\/i> y <i>seca<\/i> son sinónimos de <i>escueta<\/i>.", "ops": ["Breve.", "Seca.", "Extensa.", "Concisa."]}], "criterio": "En los cuatro, la respuesta es el antónimo y las demás opciones tiran hacia el sinónimo: tres en la b), la c) y la d), y dos en la a), donde <i>nerviosa<\/i> no es ni lo uno ni lo otro. Quien busca «la parecida» encuentra siempre más de una.", "apoyo": ["El ítem de antónimo, donde el distractor es un sinónimo"], "dossier_txt": "Del dossier: pieza 5, ejercicio 2"}, {"tipo": "hueco", "titulo": "El hiperónimo de cada grupo", "dossier": {"cuaderno": "5", "ejercicio": 3, "parte": "a"}, "ayuda": "Escribe la palabra que nombra la clase a la que pertenecen las tres.", "items": [{"enun": "<i>martillo, destornillador, alicates<\/i>", "sol": "herramientas|herramienta"}, {"enun": "<i>gripe, diabetes, anemia<\/i>", "sol": "enfermedades|enfermedad"}, {"enun": "<i>contrato, factura, nómina<\/i>", "sol": "documentos|documento|papeles|documentación"}], "criterio": "Para el último grupo la clave admite también <i>papeles<\/i> o <i>documentación<\/i>.", "apoyo": ["2 · Antonimia", "3 · Hiperonimia, polisemia y homonimia"], "dossier_txt": "Del dossier: pieza 5, ejercicio 3 · a"}, {"tipo": "abierta", "titulo": "Dos significados de la misma palabra", "dossier": {"cuaderno": "5", "ejercicio": 3, "parte": "b"}, "ayuda": "Escribe dos frases con cada palabra, de modo que el significado cambie de una a otra.", "items": [{"enun": "Dos frases con <i>operación<\/i>, en dos significados distintos.", "modelo": "«La <b>operación<\/b> de rodilla salió bien.» / «El banco cobró comisión por la <b>operación<\/b>.»"}, {"enun": "Dos frases con <i>plancha<\/i>, en dos significados distintos.", "modelo": "«Dejó la <b>plancha<\/b> encendida.» / «Metió la <b>plancha<\/b> delante del jefe.»"}], "criterio": "Las dos frases valen si el contexto deja ver dos significados distintos. Los modelos son los de la clave del dossier.", "apoyo": "todo", "dossier_txt": "Del dossier: pieza 5, ejercicio 3 · b"}, {"tipo": "clasificar", "titulo": "¿Homógrafos u homófonos?", "dossier": {"cuaderno": "5", "ejercicio": 3, "parte": "c"}, "ayuda": "Clasifica cada par: homógrafos si se escriben igual, homófonos si suenan igual y se escriben distinto.", "ops": ["homógrafos", "homófonos"], "items": [{"enun": "<i>vino<\/i> / <i>vino<\/i>", "sol": "homógrafos", "porque": "se escriben igual: el sustantivo y el verbo <i>venir<\/i>"}, {"enun": "<i>hola<\/i> / <i>ola<\/i>", "sol": "homófonos", "porque": "suenan igual y se escriben distinto"}, {"enun": "<i>lima<\/i> / <i>lima<\/i>", "sol": "homógrafos", "porque": "se escriben igual: la fruta y la herramienta"}, {"enun": "<i>sobre<\/i> / <i>sobre<\/i>", "sol": "homógrafos", "porque": "se escriben igual: el sustantivo y la preposición"}, {"enun": "<i>bello<\/i> / <i>vello<\/i>", "sol": "homófonos", "porque": "suenan igual: <i>b<\/i> y <i>v<\/i> se pronuncian igual"}, {"enun": "<i>hasta<\/i> / <i>asta<\/i>", "sol": "homófonos", "porque": "suenan igual: la preposición y el palo de la bandera"}], "apoyo": ["3 · Hiperonimia, polisemia y homonimia"], "dossier_txt": "Del dossier: pieza 5, ejercicio 3 · c"}, {"tipo": "justificar", "titulo": "¿Polisemia u homonimia?", "dossier": {"cuaderno": "5", "ejercicio": 3, "parte": "d"}, "ayuda": "Indica si cada palabra es un caso de polisemia —una palabra con varios significados emparentados— o de homonimia —dos palabras distintas que se escriben igual—, y por qué.", "items": [{"palabra": "<i>sierra<\/i> (herramienta y cordillera)", "requiere": [["polisemia", "polisemica", "polisemico"]], "modelo": "<b>Polisemia<\/b>, aunque no lo parezca. El diccionario reúne los dos sentidos en una sola entrada, del latín <i>serra<\/i>: la cordillera se llamó así por los dientes de la herramienta. Cuando el parecido engaña, la entrada del diccionario decide."}, {"palabra": "<i>cabeza<\/i> (del cuerpo y de familia)", "requiere": [["polisemia", "polisemica", "polisemico"]], "modelo": "<b>Polisemia<\/b>: la de familia viene de la del cuerpo, que va delante y manda."}, {"palabra": "<i>llama<\/i> (del fuego y el animal)", "requiere": [["homonimia", "homonima", "homonimo", "homonimas", "homonimos"]], "modelo": "<b>Homonimia<\/b>: la del fuego y el animal no tienen nada que ver."}], "pide": "es polisemia / homonimia porque…", "apoyo": ["3 · Hiperonimia, polisemia y homonimia"], "dossier_txt": "Del dossier: pieza 5, ejercicio 3 · d"}, {"tipo": "opcion", "titulo": "¿Cuál NO está en sentido figurado?", "dossier": {"cuaderno": "5", "ejercicio": 4, "parte": "a y b"}, "ayuda": "En cada grupo de cuatro, una sola frase se entiende al pie de la letra; las demás son expresiones hechas o metáforas. Elige la que se entiende al pie de la letra.", "items": [{"enun": "Estas cuatro: ¿cuál NO está en sentido figurado?", "sol": "Dejó las llaves en la mesa.", "porque": "dejar las llaves en la mesa es dejar las llaves en la mesa; las otras tres son expresiones hechas", "ops": ["Se le fue el santo al cielo.", "Está con el agua al cuello.", "Dejó las llaves en la mesa.", "Le tiró la caña."]}, {"enun": "Y estas otras cuatro: ¿cuál NO está en sentido figurado?", "sol": "La reunión se alargó dos horas.", "porque": "una reunión se alarga en el tiempo en sentido literal; en las otras tres hay pulmones, raíces y agua donde no los hay", "ops": ["El barrio se ha quedado sin pulmones.", "La reunión se alargó dos horas.", "El proyecto echó raíces.", "La deuda ahoga a la familia."]}], "apoyo": ["4 · Literal y figurado"], "dossier_txt": "Del dossier: pieza 5, ejercicio 4 · a y b"}, {"tipo": "abierta", "titulo": "Explica la expresión sin usar sus palabras", "dossier": {"cuaderno": "5", "ejercicio": 4, "parte": "c"}, "ayuda": "Explica en una frase qué significa cada expresión en un contexto de trabajo, sin usar ninguna de sus palabras.", "items": [{"enun": "<i>estar en la cuerda floja<\/i>", "modelo": "estar a punto de perder el puesto"}, {"enun": "<i>hacer horas extras a destajo<\/i>", "modelo": "trabajar muchas horas de más y muy deprisa, cobrando por cantidad"}, {"enun": "<i>tener las alas cortadas<\/i>", "modelo": "no poder hacer lo que uno querría porque algo se lo impide"}, {"enun": "<i>dar largas<\/i>", "modelo": "retrasar una respuesta sin llegar a negarla"}, {"enun": "<i>echar una mano<\/i>", "modelo": "ayudar a alguien con algo"}, {"enun": "<i>poner el grito en el cielo<\/i>", "modelo": "protestar con mucha fuerza y en voz alta"}], "criterio": "Se da el punto si la explicación se entiende sin conocer la expresión y no repite ninguna de sus palabras. <i>Estar en la cuerda floja es estar en una situación de cuerda floja<\/i> no explica nada.", "apoyo": ["4 · Literal y figurado"], "dossier_txt": "Del dossier: pieza 5, ejercicio 4 · c"}, {"tipo": "abierta", "titulo": "Una frase que se entienda por el contexto", "dossier": {"cuaderno": "5", "ejercicio": 4, "parte": "d"}, "ayuda": "Escribe una frase con cada expresión, de manera que se entienda su significado por el resto de la oración.", "items": [{"enun": "<i>a tiro de piedra<\/i>"}, {"enun": "<i>con luces y sombras<\/i>"}, {"enun": "<i>ahogar las penas<\/i>"}], "criterio": "La clave del dossier no da modelo. La frase sirve si alguien que no conoce la expresión puede deducir lo que significa por el resto de la oración: «Vivo a tiro de piedra del trabajo: tardo cinco minutos andando.»", "apoyo": ["4 · Literal y figurado"], "dossier_txt": "Del dossier: pieza 5, ejercicio 4 · d"}, {"tipo": "opcion", "titulo": "Sinónimo en contexto", "ayuda": "Cinco palabras en su frase, con cuatro opciones como en el examen. Sustituye la palabra por cada opción y lee la oración entera: tres de ellas son del mismo terreno y no encajan.", "items": [{"enun": "«El ayuntamiento <b>desestimó<\/b> la queja de los vecinos.»", "ops": ["Aprobó.",
