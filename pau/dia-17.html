<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 17 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 17, "fecha": "2026-11-24", "tab": "Día 17 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 24 de noviembre", "sub": "El tercer set propio y los cinco verbos · el texto de 2018s, la sexta redacción corta y explicar una frase · la tanda de morfología verbal", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 3 · arrancan los cinco verbos", "meta": "20 minutos · adverbios en -mente, compuestos y palabras acabadas en consonante + s; la primera tanda de formas verbales", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los ocho sets propios<\/h3>\n<p>Escritos en el formato real —ocho palabras sueltas, sin indicar cuántas llevan tilde— y con palabras que no aparecen en ninguno de los diez ejercicios del censo, para no gastar ningún set real.<\/p>\n<p><strong>La proporción cambia de un set a otro, como en el examen.<\/strong> En los diez sets reales, ocho traen cinco palabras con tilde y tres sin ella, uno las reparte cuatro y cuatro, y otro trae cinco de siete. Aquí pasa lo mismo: seis sets van cinco y tres, uno cuatro y cuatro y otro seis y dos. Quien se corrija contando en lugar de aplicar la regla acertará unas veces y fallará otras.<\/p>\n<p>Los cuatro primeros practican las tres reglas y las excepciones; los cuatro últimos incorporan hiatos, que son el grupo más numeroso del examen.<\/p>\n<h3>Los cinco verbos, desde el 24 de noviembre<\/h3>\n<p>Dieciséis formas verbales que han caído en cinco exámenes, de 2017 a 2021, repartidas en tandas. Se dicta el infinitivo y lo que se pide —primera persona, participio o gerundio—, se escriben las cinco y se corrigen en el acto. La explicación de cada irregularidad está en la pieza 9.<\/p>\n<p><strong>Tres respuestas con explicación propia:<\/strong> <em>corrompido<\/em> es regular aunque <em>romper<\/em> dé <em>roto<\/em>; <em>cuezo<\/em> lleva <em>z<\/em> porque la <em>c<\/em> delante de <em>o<\/em> sonaría distinto; y <em>yerro<\/em> y <em>yergo<\/em> empiezan por <em>y<\/em>.<\/p>\n<blockquote>\n<p><strong>Para el segundo trimestre<\/strong>, cuando estas cuatro tandas ya se hayan dado, las siguientes salen del anexo A-4, que reúne verbos irregulares que no están en estas cuatro tandas.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 3: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>facilmente<\/i>", "sol": "fácilmente", "porque": "adverbio en -mente: conserva la tilde de <i>fácil<\/i>"}, {"enun": "<i>tiernamente<\/i>", "sol": "tiernamente", "porque": "<i>tierna<\/i> no lleva tilde, y el adverbio tampoco"}, {"enun": "<i>decimoseptimo<\/i>", "sol": "decimoséptimo", "porque": "compuesto sin guion: manda <i>séptimo<\/i>"}, {"enun": "<i>cuentakilometros<\/i>", "sol": "cuentakilómetros", "porque": "compuesto sin guion: <i>kilómetros<\/i> lleva tilde"}, {"enun": "<i>biceps<\/i>", "sol": "bíceps", "porque": "llana acabada en consonante + s"}, {"enun": "<i>complots<\/i>", "sol": "complots", "porque": "aguda acabada en consonante + s"}, {"enun": "<i>virrey<\/i>", "sol": "virrey", "porque": "aguda acabada en -y, que aquí cuenta como consonante"}, {"enun": "<i>comics<\/i>", "sol": "cómics", "porque": "llana acabada en consonante + s"}], "criterio": "Llevan tilde cinco de las ocho, y las tres familias de hoy explican siete: dos adverbios, dos compuestos y tres acabadas en consonante más <i>s<\/i>. <i>Virrey<\/i> es el señuelo de siempre: aguda acabada en una letra que no es <i>n<\/i> ni <i>s<\/i>.", "apoyo": ["Los ocho sets propios"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set propio 3"}, "dossier_txt": "Del dossier: anexo A-3 · Set propio 3"}, {"tipo": "hueco", "titulo": "Los cinco verbos: primera persona del presente", "ayuda": "Los cinco de 2017t, con su clave oficial. Escribe la primera persona del singular del presente de indicativo, con la ortografía de la forma.", "items": [{"enun": "<i>discernir<\/i>", "conv": "2017t", "sol": "discierno", "porque": "e → ie"}, {"enun": "<i>errar<\/i>", "conv": "2017t", "sol": "yerro", "porque": "e → ye a principio de palabra"}, {"enun": "<i>caber<\/i>", "conv": "2017t", "sol": "quepo", "porque": "cambia la raíz entera"}, {"enun": "<i>conducir<\/i>", "conv": "2017t", "sol": "conduzco", "porque": "c → zc"}, {"enun": "<i>cocer<\/i>", "conv": "2017t", "sol": "cuezo", "porque": "o → ue, y la <i>c<\/i> pasa a <i>z<\/i> delante de <i>o<\/i>"}], "criterio": "Las cinco formas del jueves 19 de noviembre, ahora de memoria y con reloj. Se anota cuántas se fallan, igual que con el set.", "apoyo": ["Los cinco verbos, desde el 24 de noviembre"], "dossier": {"cuaderno": "A-3", "ejercicio": "Los cinco verbos · tanda 1"}, "dossier_txt": "Del dossier: anexo A-3 · Los cinco verbos · tanda 1"}, {"tipo": "hueco", "titulo": "Adverbios en -mente", "estricto": true, "ayuda": "Seis adverbios sin tilde. Escribe cada uno con tilde si la lleva y tal cual si no: parte del adjetivo del que sale.", "items": [{"enun": "<i>rapidamente<\/i>", "sol": "rápidamente", "porque": "de <i>rápida<\/i>"}, {"enun": "<i>lentamente<\/i>", "sol": "lentamente", "porque": "de <i>lenta<\/i>, sin tilde"}, {"enun": "<i>ultimamente<\/i>", "sol": "últimamente", "porque": "de <i>última<\/i>"}, {"enun": "<i>cortesmente<\/i>", "sol": "cortésmente", "porque": "de <i>cortés<\/i>"}, {"enun": "<i>felizmente<\/i>", "sol": "felizmente", "porque": "de <i>feliz<\/i>, sin tilde"}, {"enun": "<i>dificilmente<\/i>", "sol": "difícilmente", "porque": "de <i>difícil<\/i>"}], "criterio": "Cuatro la llevan y dos no, y en los seis la decisión se toma sobre el adjetivo: <i>rápida<\/i>, <i>última<\/i>, <i>cortés<\/i> y <i>difícil<\/i> la llevan; <i>lenta<\/i> y <i>feliz<\/i>, no.", "apoyo": ["Los ocho sets propios"], "solo_web": true}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El texto de la fraseología · la sexta redacción corta", "meta": "60 minutos · el texto de 2018s en el carril «El texto»: una frase hecha, un sintagma de dos palabras y una frase a la que hay que quitarle las metáforas; la redacción corta con el enunciado de 2019t; se entrega la segunda larga", "teoria": "<h3>3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>\n<h3>8 · Las tres preguntas fijas del comentario<\/h3>\n<p><strong>En el examen.<\/strong> El bloque 2 del comentario son <strong>3 puntos<\/strong> y trae <strong>las mismas tres preguntas en las seis convocatorias<\/strong>, en el mismo orden: proponer un título, resumir un párrafo delimitado y explicar una frase. Cada una vale 1 punto, ocupa <strong>de una a cinco líneas<\/strong> y, según los criterios, «admite fracciones en la puntuación (0,25, 0,5, 0,75) en función de la precisión de la respuesta».<\/p>\n<p>Y sobre las tres pesa la instrucción que recoge el apartado 6 de la pieza 10: <strong>reproducir frases del original se considera incorrecto<\/strong>.<\/p>\n<h4>8.1 · Proponer un título<\/h4>\n<p>Llengua castellana lo pidió una vez, en 2016, con un enunciado que detalla lo que se espera:<\/p>\n<blockquote>\n<p>«Proponga un título (y, si quiere, un subtítulo) para el texto. <strong>La propuesta no debe coincidir con el título del artículo<\/strong> y tiene que recoger debidamente el contenido del fragmento reproducido.»<\/p>\n<p>La clave da dos y admite otros equivalentes: <em>Las relaciones personales en internet<\/em> / <em>Influencia de las redes sociales en las relaciones interpersonales<\/em> / etc.<\/p>\n<\/blockquote>\n<p><strong>Los dos títulos que da la clave son sintagmas nominales<\/strong>, y los tres que acepta la de 2024s también: ninguno lleva verbo conjugado y todos nombran el tema del texto entero. Es el formato más frecuente y el más seguro, y el enunciado no lo exige: pide que el título no coincida con el del artículo y que recoja el contenido del fragmento. Un título con verbo que cumpla los dos requisitos sirve, y además recoge la tesis con más precisión que un sintagma nominal: el sintagma nombra el tema y la oración afirma algo sobre él.<\/p>\n<table>\n<thead>\n<tr>\n<th>sirve<\/th>\n<th>no sirve<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>El valor de la lectura<\/em><\/td>\n<td><em>Leer es bueno<\/em><\/td>\n<td>el segundo es la opinión de quien escribe, y el título recoge el contenido del texto<\/td>\n<\/tr>\n<tr>\n<td><em>Las redes sociales y la imagen que damos<\/em><\/td>\n<td><em>Internet<\/em><\/td>\n<td>demasiado ancho: vale para cualquier texto sobre la red y no distingue <strong>este<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>La discusión sobre si leer mejora a las personas<\/em><\/td>\n<td><em>Mi opinión sobre la lectura<\/em><\/td>\n<td>el título es del texto, no tuyo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres comprobaciones antes de darlo por bueno:<\/strong> que no repita el título original, que abarque el texto entero —no solo el primer párrafo— y que recoja el contenido del texto y no la opinión de quien lo escribe. Que lleve verbo conjugado no lo invalida.<\/p>\n<h4>8.2 · Resumir un párrafo delimitado<\/h4>\n<p>El enunciado marca el párrafo con <strong>su primera y su última palabra<\/strong>: «desde <em>Negar el valor<\/em> hasta <em>como la soberbia<\/em>». El párrafo cambia de una convocatoria a otra; la tarea, no.<\/p>\n<p>Llengua castellana pidió exactamente esto en 2015, y su clave sirve de modelo:<\/p>\n<blockquote>\n<p><strong>Enunciado:<\/strong> «Sintetice el párrafo inicial del texto: <em>El niño, inquieto ante esta noche tan diferente, […] le arranca la palabra tantas veces oída<\/em>.»<\/p>\n<p><strong>Clave:<\/strong> «En este párrafo el niño intuye instintivamente, a partir de una serie signos, que algo terrible le está sucediendo a su abuelo, lo que le lleva a pronunciar el apelativo con el que siempre se ha referido a él.»<\/p>\n<\/blockquote>\n<p><strong>Esa respuesta cumple cuatro condiciones<\/strong>, y las cuatro sirven para el resumen del comentario:<\/p>\n<ol>\n<li><strong>Treinta y nueve palabras<\/strong>, tres líneas. Se reproduce tal cual, con el <em>de<\/em> que le falta en «una serie signos».<\/li>\n<li><strong>Recoge qué pasa, por qué y con qué consecuencia<\/strong>: intuye · a partir de unos signos · y por eso pronuncia el nombre.<\/li>\n<li><strong>No repite ni una secuencia del original.<\/strong> Donde el texto escribe <em>inquieto ante esta noche tan diferente<\/em>, la respuesta pone <em>intuye instintivamente<\/em>. En esa sustitución aparecen a la vez los tres pasos del apartado 6 de la pieza 10.<\/li>\n<li><strong>Empieza por «En este párrafo…»<\/strong>, que sitúa la respuesta sin gastar media línea en metadiscurso.<\/li>\n<\/ol>\n<p><strong>Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado.<\/strong> El enunciado delimita con dos palabras para evitarlo: lo que queda fuera de esas dos palabras no entra en el resumen.<\/p>\n<p><strong>Antes de resumir, se comprueba si el párrafo defiende algo o describe algo,<\/strong> y el resumen se escribe de la misma clase. El párrafo que manda resumir la 2.2 del comentario de 2026s no tiene tesis: describe cómo se va borrando la frontera entre el pensamiento propio y el acceso a la información digital, y la respuesta de la clave describe ese proceso. Un resumen que le pone una tesis a un párrafo descriptivo atribuye al texto una idea que no está en él, y los criterios puntúan esta pregunta por la precisión de la respuesta.<\/p>\n<h4>8.3 · Explicar una frase relacionándola con la argumentación<\/h4>\n<p>El enunciado entrecomilla una frase o un concepto del texto y pide explicarlo <strong>atándolo a lo que el texto defiende<\/strong>. Las palabras <em>relacionándola con la argumentación<\/em> deciden el punto: una paráfrasis de la frase, por buena que sea, deja sin contestar la mitad del enunciado si no explica para qué está esa frase en ese texto.<\/p>\n<p>La primera mitad —qué significa la expresión— ya la preguntaba Llengua castellana en 2016, en una pregunta de comprensión de 0,5 sobre «¿Somos lo que parecemos ser en internet?», el primer texto del trimestre:<\/p>\n<blockquote>\n<p><strong>Enunciado (2016t, 1.5):<\/strong> «Indique a qué idea del texto se refiere el autor con la expresión <em>idílica idea<\/em>.»<\/p>\n<p><strong>Clave oficial:<\/strong> «Contamos lo mejor de nosotros mismos (‘maquillamos’ nuestra identidad) solo en la red (en internet), y no en el contacto personal (cara a cara).»<\/p>\n<\/blockquote>\n<p>Esa pregunta se contesta entera con la paráfrasis, y la paráfrasis ya tiene dos partes: qué hacemos —<em>contamos lo mejor de nosotros mismos<\/em>— y dónde —<em>solo en la red, y no en el contacto personal<\/em>—. La 2.3 del comentario pide además la segunda mitad, <strong>qué función cumple la frase en el argumento del texto<\/strong>. En el texto de 2016, la <em>idílica idea<\/em> es la creencia que el autor discute: la nombra para rebatirla con los datos de la investigación psicológica, y una respuesta de comentario lo escribiría en su segunda frase.<\/p>\n<p><strong>El formato que funciona, en dos frases:<\/strong><\/p>\n<blockquote>\n<p><em>La expresión significa [qué].<\/em> · <em>El autor la usa para [qué defiende con ella].<\/em><\/p>\n<\/blockquote>\n<p>Y el error simétrico del 8.2: <strong>explicar la frase por su cuenta, como si fuera una definición de diccionario<\/strong>, sin indicar para qué está en ese texto. El enunciado exige «relacionándola con la argumentación», y esas tres palabras piden la segunda frase.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "La sexta redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2019t; el texto de ese examen no se lee hoy. Da el tema y no la pregunta: la tesis la pones tú, y tiene que admitir la contraria.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Redacte un texto, de entre cincuenta y ochenta palabras, sobre la importancia de fomentar el hábito y el gusto por la lectura a edades tempranas.»", "conv": "2019t", "modelo": "El gusto por la lectura se decide en casa antes que en la escuela. Un niño que ve leer a sus padres entiende que leer es algo que hacen los adultos, y no una tarea que termina con el curso. Además, la lectura obligatoria del colegio llega a los diez años, cuando el hábito ya está hecho o ya no está. Si la escuela quiere lectores, tendrá que prestar libros a las familias antes que a los alumnos. — Setenta y ocho palabras: tesis que admite la contraria, argumento de la experiencia, argumento con <i>además<\/i>, cierre con una propuesta."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. En adecuación se comprueba que la tesis afirme algo discutible sobre el tema, y no que repita que leer es importante.", "apoyo": ["3 · Las dos rúbricas, banda por banda", "8 · Las tres preguntas fijas del comentario"], "usa_texto": false, "solo_web": true}, {"tipo": "clasificar", "titulo": "Una redacción larga, desordenada: ¿qué parte es cada frase?", "ops": ["tesis", "argumento", "concesión", "cierre"], "ayuda": "Ocho frases de una redacción de 150-200 palabras sobre la pregunta «¿Debería el sistema de salud garantizar una cita de primaria en menos de una semana?». Identifica la pieza de cada una.", "items": [{"enun": "«Es cierto que contratar médicos cuesta dinero y que las plazas tardan meses en cubrirse.»", "sol": "concesión", "porque": "reconoce la objeción de quien no está de acuerdo"}, {"enun": "«Quien ha esperado veintitrés días con una rodilla que no le deja subir al metro sabe que la espera no es un trámite, sino un mes de vida peor.»", "sol": "argumento", "porque": "de competencia: la experiencia propia resumida en una línea"}, {"enun": "«Si la cita llegara en una semana, la mitad de las visitas a urgencias por problemas menores desaparecería, y con ellas cinco horas de sala de espera por persona.»", "sol": "cierre", "porque": "la consecuencia de hacer lo que la tesis pide"}, {"enun": "«El sistema de salud debería garantizar una cita de primaria en menos de una semana, aunque haya que contratar médicos con dinero de otras partidas.»", "sol": "tesis", "porque": "toma postura y admite la contraria"}, {"enun": "«Pero cada semana de espera se paga después en urgencias, así que el dinero que se ahorra en primaria se gasta multiplicado por cuatro.»", "sol": "concesión", "porque": "la respuesta a la objeción, con algo nuevo detrás del <i>pero<\/i>: la segunda mitad de la concesión"}, {"enun": "«Según los datos del texto, una visita a urgencias cuesta cuatro veces más que una consulta de primaria, y las visitas evitables han subido un cuarenta por ciento en cinco años.»", "sol": "argumento", "porque": "empírico, con las cifras del texto de partida"}, {"enun": "«La atención primaria tiene que estar disponible en pocos días, y eso debería ser una obligación del sistema y no una promesa.»", "sol": "tesis", "porque": "otra manera de formular la tesis: quien la pone al final repite, y quien la pone al principio ya tiene la primera frase"}, {"enun": "«Además, el tiempo que un médico de familia dedica a un paciente que ha empeorado esperando es mayor que el que habría dedicado el primer día.»", "sol": "argumento", "porque": "un segundo argumento, con conector"}], "criterio": "Una tesis, tres argumentos de filas distintas, la concesión en dos frases y un cierre con consecuencia. Hay que tachar la frase que repite la tesis con otras palabras: en 150-200 palabras se escribe una sola tesis, y la segunda vez que aparece el corrector la cuenta como argumentación circular.", "apoyo": ["8.3 · Explicar una frase relacionándola con la argumentación"], "usa_texto": false, "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: explicar una frase", "ayuda": "De una a cinco líneas cada una, con las dos frases del formato: qué significa y para qué la usa el autor.", "items": [{"enun": "Explique, relacionándola con la argumentación del texto, la frase «en el fondo es una trampa 22» del artículo de Vicente Fernández (página del día 15).", "modelo": "La frase significa que el mecanismo de las terapias contra el envejecimiento no tiene salida buena: eliminar las células inactivas favorece el cáncer y eliminar las cancerígenas acumula células inactivas, y se pierde por los dos lados. El autor la usa para sostener la tesis del artículo, que detener el envejecimiento es imposible y que las terapias solo pueden retrasarlo: si los dos caminos llevan a un daño, ninguna terapia puede recorrer los dos a la vez."}, {"enun": "Explique el significado de la frase «la expresión que vi en su rostro en el tanatorio era la de un hombre joven, renacido en la muerte», del texto de hoy, e indique qué añade al retrato de José Antonio.", "modelo": "La frase significa que la cara de José Antonio, ya sin la tensión del alcohol y de la enfermedad, aparentaba menos edad muerto que vivo. El autor la usa para sostener lo que cuenta la crónica entera: la vida que llevaba lo había envejecido antes de tiempo, y su muerte a los cincuenta y tres años cierra un deterioro que duró décadas y que nadie atendió."}], "criterio": "Se corrige con el formato: media respuesta si solo se parafrasea la frase, media si solo se dice para qué está. En la de 2018t la trampa es copiar la explicación que da el propio texto y parar ahí.", "apoyo": ["8 · Las tres preguntas fijas del comentario"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [3, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 8: Las dos rúbricas, banda por banda; Las tres preguntas fijas del comentario (p. 66 y 78)", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "Solo pido un poco de belleza, de Bru Rovira", "meta": "Convocatoria 2018, tribunal especial · fragmento de crónica · 371 palabras · el sexto texto: cuatro de test, la frase hecha, el sintagma de dos palabras y la frase sin metáforas", "literal": true, "teoria": "<h3>8 · 2018, tribunal especial · <em>Solo pido un poco de belleza<\/em><\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Bru Rovira, <em>Solo pido un poco de belleza<\/em> (Ediciones B, 2016), fragmento<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>crónica de no ficción, 368 palabras<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Llengua castellana 2018, tribunal especial; el texto, en el cuaderno de textos de cada sesión (texto 8)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>24 de noviembre · con la redacción corta de 2019t, sobre fomentar la lectura; la de este examen, sobre el entierro, se escribe el 17 de noviembre, con el texto de 2018t (temporalización)<\/td>\n<\/tr>\n<tr>\n<td><strong>reparto<\/strong><\/td>\n<td>cuatro preguntas de test y dos abiertas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto va aquí.<\/strong> Trae la única frase hecha del banco con pregunta propia —<em>ahogar las penas<\/em>— y un sintagma de dos palabras que hay que sustituir entero, <em>oratoria florida<\/em>. Es el texto de la fraseología, y cae después de la pieza 5, que la explica.<\/p>", "lectura": {"titulo": "Solo pido un poco de belleza (fragmento)", "entrada": "Bru Rovira · <i>Solo pido un poco de belleza<\/i> (Barcelona: Ediciones B, 2016) · fragmento, tal como lo reproduce el cuadernillo de Llengua castellana de 2018 (tribunal especial).", "lineas": ["José Antonio y Vittorio eran como el agua y el fuego. Dos", "caracteres completamente distintos. De Vittorio casi lo", "sabíamos todo, incluso más de lo que en realidad había vivido,", "pues en las historias que contaba con su oratoria florida", "había casi tanta fantasía como realidad. De hecho, cuando", "relataba sus aventuras y desventuras podía decirse que el", "deseo de lo que le hubiera gustado ser —pero que nunca fue—", "podría llegar a convencerle de que los errores cometidos en el", "pasado serían enmendados en el futuro. A partir incluso del", "mismo momento en que lo estaba contando.", "", "José Antonio era una tumba. Un misterio. Vivía en un piso", "lúgubre de la plaza Orwell, conocida en aquellos tiempos como", "la plaza del tripi, donde alquilaba una habitación. Jamás", "había salido de su boca una frase más larga de tres o cuatro", "palabras. Sabíamos, eso sí, que hubo una mujer en su juventud,", "Loli, cuyo nombre llevaba tatuado en el brazo. Sabíamos,", "también, que Loli había sido un gran amor y su gran condena,", "porque ella era la causa de todo el alcohol en el que llevaba", "ahogando las penas desde que lo abandonó en su juventud", "lejana. La chispa del amor perdido que había mantenido en pie", "su vida era el mismo fuego que fulminaba su alma. Y el alcohol", "se había convertido en el único aliado que le acercaba hasta", "aquel recuerdo de una plenitud irrepetible.", "", "A finales del mes de abril de 2005, José Antonio ingresó en el", "Hospital del Mar. Tenía solo 53 años, era alcohólico,", "diabético y padecía un cáncer que nunca había tratado. El día", "3 de mayo dejó de respirar. Muerte súbita, dijeron los médicos", "que lo atendían. Nadie reclamó su cuerpo, nadie acudió al", "hospital, y cuando yo fui a interesarme sobre el destino que", "se le daría a su cuerpo sin vida, por fin relajado —la", "expresión que vi en su rostro en el tanatorio era la de un", "hombre joven, renacido en la muerte—, una enfermera muy amable", "me informó de que el caso de José Antonio no era nada", "excepcional, que al menos se producían uno o dos", "fallecimientos de este tipo al mes.", "", "De este tipo, dijo exactamente la enfermera."], "pie": "Fragmento de <i>Solo pido un poco de belleza<\/i>, de Bru Rovira (Ediciones B, 2016), en la versión del cuadernillo oficial de la PAU +25 de 2018, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2018_general_llengua_castellana_suplent.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cuatro preguntas de test", "ayuda": "Las preguntas 1.1 a 1.4 del cuadernillo, literales, con su respuesta oficial. La 1.4 es el antecedente más difícil del banco: tres candidatos concuerdan, y lo decide el sentido de la oración entera.", "items": [{"enun": "<b>1.1<\/b> La enfermera utiliza la expresión <i>de este tipo<\/i> para referirse a la muerte de José Antonio porque", "conv": "2018s", "ops": ["era un fallecido no identificado.", "no se había medicado a tiempo contra el cáncer.", "nadie solicitó el cadáver para darle sepultura.", "murió de muerte súbita."], "sol": "nadie solicitó el cadáver para darle sepultura.", "porque": "la frase anterior a la de la enfermera: «nadie reclamó su cuerpo, nadie acudió al hospital». Estaba identificado, y la muerte súbita la dicen los médicos, no la enfermera"}, {"enun": "<b>1.2<\/b> ¿Cuál de los siguientes enunciados describe mejor el poder que atribuye el autor al recuerdo en los relatos de Vittorio?", "conv": "2018s", "ops": ["Los recuerdos se confunden con los deseos.", "El recuerdo puede llegar a enmascarar la realidad del pasado.", "Se recuerda exclusivamente lo que se ha vivido.", "El recuerdo puede corregir los errores del pasado."], "sol": "El recuerdo puede llegar a enmascarar la realidad del pasado.", "porque": "en las historias de Vittorio «había casi tanta fantasía como realidad»: el recuerdo tapa lo que pasó. La d) es la trampa: los errores «serían enmendados» solo en su imaginación"}, {"enun": "<b>1.3<\/b> El autor identifica como desencadenante de las penalidades de José Antonio", "conv": "2018s", "ops": ["el amor no correspondido.", "el exceso de alcohol.", "su carácter huraño.", "la fúnebre vivienda en la que habitaba."], "sol": "el amor no correspondido.", "porque": "«ella era la causa de todo el alcohol»: el alcohol es la consecuencia, y Loli la causa. Una pregunta de causa, como las del texto del 17 de noviembre"}, {"enun": "<b>1.4<\/b> ¿A quién o a qué se refiere <i>lo<\/i> en la oración del texto «llevaba ahogando las penas desde que lo abandonó»?", "conv": "2018s", "ops": ["Al alcohol.", "A José Antonio.", "A Vittorio.", "Al amor."], "sol": "A José Antonio.", "porque": "<i>lo<\/i> concuerda con el alcohol, con José Antonio y con el amor, y lo decide el sentido: quien abandona es Loli, y a quien abandonan es a José Antonio"}], "criterio": "Medio punto por acierto y 0,16 por error. La 1.3 es una pregunta de causa, y el texto nombra quién es la causa de qué; la 1.4 no se resuelve con la concordancia, porque tres opciones concuerdan, sino leyendo la oración entera y preguntando quién abandonó a quién.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La frase hecha", "ayuda": "Con tus palabras: qué expresa el autor con ella en ese punto del texto.", "items": [{"enun": "<b>1.5<\/b> ¿Cuál es el significado de la expresión del texto <i>ahogar las penas<\/i>?", "conv": "2018s", "modelo": "Clave oficial: <i>atenuar los sentimientos, las emociones o las tristezas<\/i>; <i>buscar consuelo<\/i>. Las dos se dan por buenas. En el texto: José Antonio bebía para no sentir la pérdida de Loli, y el alcohol era la manera de aliviar esa tristeza. Una respuesta como «meter las penas en agua» traduce las palabras y no la expresión."}], "criterio": "Se da el medio punto a la explicación del sentido en el texto; se admiten los dos niveles de la clave, atenuar la tristeza y buscar consuelo.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "El sintagma de dos palabras", "ayuda": "Una palabra en cada raya. La clave descuenta por cada una de las dos que falte.", "items": [{"enun": "<b>1.6<\/b> «Proporcione una expresión de significado equivalente al sintagma oratoria florida, que aparece en el texto» · la palabra que sustituye a <i>oratoria<\/i>:", "conv": "2018s", "sol": "elocuencia|verborrea|labia|facundia|palabrería|verbosidad|retórica|discurso|manera de hablar|forma de hablar", "porque": "clave: <i>elocuencia<\/i>, <i>verborrea<\/i>, <i>labia<\/i>… La manera de hablar en público"}, {"enun": "La palabra que sustituye a <i>florida<\/i>:", "sol": "exuberante|elegante|rica|exquisita|artística|adornada|recargada|abundante|brillante|ampulosa|vistosa|colorida|florida", "porque": "clave: <i>exuberante<\/i>, <i>elegante<\/i>, <i>rica<\/i>, <i>exquisita<\/i>, <i>artística<\/i>… Adornada, con más adorno que contenido"}], "criterio": "Dos palabras, dos cuartos de punto. <i>Labia<\/i> sola se queda en 0,25; <i>labia exuberante<\/i> o <i>elocuencia recargada<\/i> completan el medio punto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La frase sin metáforas", "ayuda": "Se subrayan las tres expresiones que no están en su sentido literal y se sustituye cada una por lo que significa ahí. Un punto, y 0,25 menos por cada cambio mal resuelto.", "items": [{"enun": "<b>2.1<\/b> Reescriba la siguiente frase del texto reemplazando las expresiones metafóricas por otras no metafóricas: «La chispa del amor perdido que había mantenido en pie su vida era el mismo fuego que fulminaba su alma».", "conv": "2018s", "modelo": "Clave oficial: «La fuerza (la potencia, el impulso) del amor perdido que le había mantenido vivo (con vida) era la misma fuerza que le deprimía (hundía su ánimo, desalentaba)». Tres cambios: <i>la chispa<\/i> → la fuerza; <i>había mantenido en pie su vida<\/i> → le había mantenido vivo; <i>el mismo fuego que fulminaba su alma<\/i> → la misma fuerza que lo hundía. Cambiar <i>chispa<\/i> por <i>llama<\/i> es poner una metáfora por otra, y cuenta como cambio mal resuelto."}], "criterio": "Se corrige por cambios: tres expresiones, y cada una tiene que quedar en sentido recto. Sustituir una metáfora por otra —<i>llama<\/i>, <i>brasa<\/i>, <i>quemaba<\/i>— no resuelve el cambio.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [8]}, {"pieza": "TEXTOS", "apartados": [8]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 8: 2018, tribunal especial · Solo pido un poco de belleza (p. 263) · Los textos de cada sesión — apartado 8: «Solo pido un poco de belleza (fragmento)» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda: morfología verbal", "meta": "10 minutos · los tres ítems reales que quedaban, participios dobles, satisfacer y el subjuntivo, y tres propios", "teoria": "<div class=\"enelexamen\"><strong>En el examen.<\/strong> Dos ítems del bloque 3, y entre los dos forman el contenido gramatical que más veces cae, por detrás de la función sintáctica:<\/div>\n<table>\n<thead>\n<tr>\n<th>ítem<\/th>\n<th>cae<\/th>\n<th>qué pide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Morfología verbal irregular<\/strong><\/td>\n<td><strong>13 de 24<\/strong><\/td>\n<td>la primera persona, el participio o el gerundio de dos a cinco verbos<\/td>\n<\/tr>\n<tr>\n<td><strong>«¿Cuál NO es una perífrasis verbal?»<\/strong><\/td>\n<td><strong>7 de 24<\/strong><\/td>\n<td>elegir entre cuatro secuencias de verbo + infinitivo o gerundio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los dos se puntúan por elementos: con cinco verbos, <strong>0,1 por cada uno<\/strong> que falte o esté mal; con dos, <strong>0,25<\/strong>. La clave lo formula así: «por cada verbo que falte o que sea erróneo <strong>o esté mal escrito<\/strong>».<\/p>\n<h3>1 · La primera persona del presente, que concentra la irregularidad<\/h3>\n<p>De los trece ítems, cinco piden un <strong>participio<\/strong>, cuatro un <strong>gerundio<\/strong>, dos la <strong>primera persona del singular del presente de indicativo<\/strong> (2017t y 2019t) y los otros dos, otras formas. El presente de indicativo va primero aquí porque concentra las irregularidades de la raíz, y de ahí salen también las del subjuntivo.<\/p>\n<h4>Los diez verbos que han caído, con su clave<\/h4>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>primera persona<\/th>\n<th>qué le pasa<\/th>\n<th>examen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>discernir<\/td>\n<td><strong>discierno<\/strong><\/td>\n<td>e → ie<\/td>\n<td>2017t<\/td>\n<\/tr>\n<tr>\n<td>errar<\/td>\n<td><strong>yerro<\/strong><\/td>\n<td>e → ye al principio de palabra<\/td>\n<td>2017t<\/td>\n<\/tr>\n<tr>\n<td>caber<\/td>\n<td><strong>quepo<\/strong><\/td>\n<td>cambia la raíz entera<\/td>\n<td>2017t<\/td>\n<\/tr>\n<tr>\n<td>conducir<\/td>\n<td><strong>conduzco<\/strong><\/td>\n<td>c → zc<\/td>\n<td>2017t<\/td>\n<\/tr>\n<tr>\n<td>cocer<\/td>\n<td><strong>cuezo<\/strong><\/td>\n<td>o → ue, y la c pasa a z ante <em>o<\/em><\/td>\n<td>2017t<\/td>\n<\/tr>\n<tr>\n<td>empezar<\/td>\n<td><strong>empiezo<\/strong><\/td>\n<td>e → ie<\/td>\n<td>2019t<\/td>\n<\/tr>\n<tr>\n<td>herir<\/td>\n<td><strong>hiero<\/strong><\/td>\n<td>e → ie<\/td>\n<td>2019t<\/td>\n<\/tr>\n<tr>\n<td>nacer<\/td>\n<td><strong>nazco<\/strong><\/td>\n<td>c → zc<\/td>\n<td>2019t<\/td>\n<\/tr>\n<tr>\n<td>competir<\/td>\n<td><strong>compito<\/strong><\/td>\n<td>e → i<\/td>\n<td>2019t<\/td>\n<\/tr>\n<tr>\n<td>erguir<\/td>\n<td><strong>yergo<\/strong> o <strong>irgo<\/strong><\/td>\n<td>las dos admitidas por la clave<\/td>\n<td>2019t<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Las cuatro familias<\/h4>\n<table>\n<thead>\n<tr>\n<th>familia<\/th>\n<th>qué hace<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>diptongación e → ie<\/strong><\/td>\n<td>la <em>e<\/em> de la raíz se rompe en <em>ie<\/em> cuando lleva la fuerza<\/td>\n<td>discierno, empiezo, hiero, pienso, quiero<\/td>\n<\/tr>\n<tr>\n<td><strong>diptongación o → ue<\/strong><\/td>\n<td>igual con la <em>o<\/em><\/td>\n<td>cuezo, duermo, puedo, vuelvo<\/td>\n<\/tr>\n<tr>\n<td><strong>cierre e → i<\/strong><\/td>\n<td>la <em>e<\/em> se cierra en <em>i<\/em>, en los verbos en <em>-ir<\/em><\/td>\n<td>compito, pido, sirvo, río<\/td>\n<\/tr>\n<tr>\n<td><strong>incremento -zc-<\/strong><\/td>\n<td>los verbos en <em>-acer<\/em>, <em>-ecer<\/em>, <em>-ocer<\/em> y <em>-ucir<\/em> intercalan una <em>z<\/em> <em>(salvo hacer, cocer, mecer y decir)<\/em><\/td>\n<td>nazco, conduzco, conozco, aborrezco<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Fuera de familia van los que cambian la raíz entera<\/strong>: <em>caber<\/em> → <strong>quepo<\/strong>, <em>saber<\/em> → <strong>sé<\/strong>, <em>caer<\/em> → <strong>caigo<\/strong>, <em>traer<\/em> → <strong>traigo<\/strong>, <em>haber<\/em> → <strong>he<\/strong>.<\/p>\n<blockquote>\n<p><strong>Los que más se fallan y no están en la tabla de arriba<\/strong> —<em>andar<\/em>, <em>asir<\/em>, <em>yacer<\/em>, <em>roer<\/em>, los defectivos <em>soler<\/em> y <em>balbucir<\/em>, y las faltas de <em>dijistes<\/em> y <em>andé<\/em>— están en el anexo A-4. La tabla recoge los de 2017-2021; han caído más fuera de ese tramo —<em>satisfacer<\/em> en 2016s y 2020s, <em>caber<\/em> y <em>conducir<\/em> en 2017t, <em>erguir<\/em> en 2019t, <em>freír<\/em> e <em>imprimir<\/em> en 2016s—; sí entran en el gimnasio del segundo trimestre y en la corrección de redacciones.<\/p>\n<p><strong>La ortografía de estas formas descuenta igual que la morfología.<\/strong> <em>Cuezo<\/em> lleva <em>z<\/em> y no <em>c<\/em>, porque la <em>c<\/em> delante de <em>o<\/em> sonaría distinto. <em>Yerro<\/em> lleva <em>y<\/em> al principio. <em>Nazco<\/em> lleva <em>zc<\/em>, no <em>sc<\/em>.<\/p>\n<\/blockquote>\n<h3>2 · Participios y gerundios<\/h3>\n<h4>Participios<\/h4>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>participio<\/th>\n<th>examen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>predecir<\/td>\n<td><strong>predicho<\/strong><\/td>\n<td>2017s<\/td>\n<\/tr>\n<tr>\n<td>corromper<\/td>\n<td><strong>corrompido<\/strong><\/td>\n<td>2021t<\/td>\n<\/tr>\n<tr>\n<td>rehacer<\/td>\n<td><strong>rehecho<\/strong><\/td>\n<td>2021t<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>El compuesto conserva la irregularidad del verbo simple<\/strong>, y esa regla resuelve casi todos.<\/p>\n<table>\n<thead>\n<tr>\n<th>simple<\/th>\n<th>compuestos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>hacer → <strong>hecho<\/strong><\/td>\n<td>rehacer → <strong>rehecho<\/strong>, deshacer → <strong>deshecho<\/strong>, satisfacer → <strong>satisfecho<\/strong><\/td>\n<\/tr>\n<tr>\n<td>decir → <strong>dicho<\/strong><\/td>\n<td>predecir → <strong>predicho<\/strong>, contradecir → <strong>contradicho<\/strong>, bendecir → <strong>bendecido<\/strong> <em>(esta es la excepción)<\/em><\/td>\n<\/tr>\n<tr>\n<td>poner → <strong>puesto<\/strong><\/td>\n<td>componer → <strong>compuesto<\/strong>, suponer → <strong>supuesto<\/strong>, imponer → <strong>impuesto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>escribir → <strong>escrito<\/strong><\/td>\n<td>describir → <strong>descrito<\/strong>, inscribir → <strong>inscrito<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ver → <strong>visto<\/strong><\/td>\n<td>prever → <strong>previsto<\/strong>, entrever → <strong>entrevisto<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Y la trampa que puso el examen: <em>corromper<\/em> → <em>corrompido<\/em>, regular.<\/strong> Sí es un compuesto de la misma raíz: viene del latín <em>corrumpere<\/em>, de <em>con-<\/em> + <em>rumpere<\/em>, que es también el origen de <em>romper<\/em>. Lo que pasa es que su participio irregular, <em>corrupto<\/em>, quedó reservado para el adjetivo —<em>un juez corrupto<\/em>—, y con <em>haber<\/em> solo se usa el regular. Quien aplica la regla del compuesto sin comprobar escribe ⊗<em>corroto<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Los participios dobles:<\/strong> <em>freír<\/em> → <em>frito<\/em> o <em>freído<\/em>, <em>imprimir<\/em> → <em>impreso<\/em> o <em>imprimido<\/em>, <em>proveer<\/em> → <em>provisto<\/em> o <em>proveído<\/em>. Las dos se admiten con <em>haber<\/em>: <em>ha impreso<\/em> y <em>ha imprimido<\/em>, <em>ha frito<\/em> y <em>ha freído<\/em>. De adjetivo, en cambio, la irregular es casi la única: <em>está impreso<\/em>, <em>está frito<\/em>, <em>está provisto<\/em>.<\/p>\n<h4>Gerundios<\/h4>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>gerundio<\/th>\n<th>examen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>predecir<\/td>\n<td><strong>prediciendo<\/strong><\/td>\n<td>2017s<\/td>\n<\/tr>\n<tr>\n<td>preferir<\/td>\n<td><strong>prefiriendo<\/strong><\/td>\n<td>2019s<\/td>\n<\/tr>\n<tr>\n<td>traer<\/td>\n<td><strong>trayendo<\/strong><\/td>\n<td>2019s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dos reglas:<\/strong><\/p>\n<ol>\n<li><strong>Los verbos en <em>-ir<\/em> con <em>e<\/em> en la raíz la cierran en <em>i<\/em>:<\/strong> pref<strong>e<\/strong>rir → pref<strong>i<\/strong>riendo, s<strong>e<\/strong>ntir → s<strong>i<\/strong>ntiendo, d<strong>e<\/strong>cir → d<strong>i<\/strong>ciendo, p<strong>e<\/strong>dir → p<strong>i<\/strong>diendo. Quedan fuera los que llevan la <em>e<\/em> lejos de la terminación: <em>discernir<\/em> → <strong>discerniendo<\/strong>, <em>divergir<\/em> → <em>divergiendo<\/em>.<\/li>\n<li><strong>Cuando la terminación <em>-iendo<\/em> queda entre vocales, la <em>i<\/em> se escribe <em>y<\/em>:<\/strong> traer → tra<strong>y<\/strong>endo, caer → ca<strong>y<\/strong>endo, leer → le<strong>y<\/strong>endo, corroer → corro<strong>y<\/strong>endo, huir → hu<strong>y<\/strong>endo.<\/li>\n<\/ol>\n<p>Los del censo que faltan por si caen: <em>reír<\/em> → <strong>riendo<\/strong>, <em>adherir<\/em> → <strong>adhiriendo<\/strong>, <em>morir<\/em> → <strong>muriendo<\/strong>.<\/p>\n<h4>Los ejercicios de huecos: la oración decide el tiempo<\/h4>\n<p>Dos exámenes, 2016t y 2021s, pidieron completar oraciones con la forma de un verbo que va entre paréntesis. El ejercicio exige dos decisiones. La oración fija el tiempo y el modo: «aquella noche» pide un pasado y «es vital que» pide subjuntivo. La irregularidad del verbo fija la forma: <em>condujo<\/em>, con la <em>j<\/em> del pretérito; <em>discierna<\/em>, con el diptongo, porque la fuerza cae en la <em>e<\/em>. Un tiempo bien elegido con la forma mal escrita descuenta igual que un tiempo equivocado.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "2016s: los participios, con las dos formas", "ayuda": "Los tres verbos del ejercicio real, con su clave. En los que tienen dos participios, escribe los dos separados por una coma.", "items": [{"enun": "«Escriba la forma masculina singular del participio de los siguientes verbos (si tienen más de una forma, deben consignarse ambas)»: <i>freír<\/i>", "conv": "2016s", "sol": "frito, freído|freído, frito|frito y freído|freído y frito", "porque": "participio doble: la clave cuenta las dos formas"}, {"enun": "<i>satisfacer<\/i>", "conv": "2016s", "sol": "satisfecho", "porque": "como <i>hecho<\/i>"}, {"enun": "<i>imprimir<\/i>", "conv": "2016s", "sol": "impreso, imprimido|imprimido, impreso|impreso e imprimido|imprimido e impreso", "porque": "participio doble: las dos formas"}], "criterio": "Cinco formas en tres verbos. Las dos que se pierden sin escribir nada mal son la segunda de <i>freír<\/i> y la segunda de <i>imprimir<\/i>: el enunciado las pide.", "apoyo": ["1 · La primera persona del presente, que concentra la irregularidad"], "solo_web": true}, {"tipo": "hueco", "titulo": "2020s: satisfacer", "ayuda": "Las dos formas del ejercicio real, con su clave.", "items": [{"enun": "«Escriba el gerundio y el participio del verbo satisfacer»: el gerundio", "conv": "2020s", "sol": "satisfaciendo", "porque": "como <i>haciendo<\/i>"}, {"enun": "«Escriba el gerundio y el participio del verbo satisfacer»: el participio", "conv": "2020s", "sol": "satisfecho", "porque": "como <i>hecho<\/i>"}], "criterio": "Las dos salen de <i>hacer<\/i>. ⊗<i>Satisfacido<\/i> es el fallo habitual, y cuenta como forma errónea.", "apoyo": ["1 · La primera persona del presente, que concentra la irregularidad"], "solo_web": true}, {"tipo": "hueco", "titulo": "2025t: la primera persona del presente de subjuntivo", "estricto": true, "ayuda": "Los cinco verbos del ejercicio real, con su clave. Pasa por la primera persona del indicativo y cambia la terminación; en dos, cambia también una letra.", "items": [{"enun": "<i>reír<\/i>", "conv": "2025t", "sol": "ría", "porque": "<i>río<\/i> → <i>ría<\/i>, con la tilde del hiato"}, {"enun": "<i>huir<\/i>", "conv": "2025t", "sol": "huya", "porque": "<i>huyo<\/i> → <i>huya<\/i>"}, {"enun": "<i>bostezar<\/i>", "conv": "2025t", "sol": "bostece", "porque": "<i>bostezo<\/i>, y la <i>z<\/i> pasa a <i>c<\/i> delante de <i>e<\/i>"}, {"enun": "<i>regar<\/i>", "conv": "2025t", "sol": "riegue", "porque": "<i>riego<\/i>, y la <i>g<\/i> mete una <i>u<\/i> delante de <i>e<\/i>"}, {"enun": "<i>aborrecer<\/i>", "conv": "2025t", "sol": "aborrezca", "porque": "<i>aborrezco<\/i> → <i>aborrezca<\/i>"}], "criterio": "Tres se resuelven cambiando la terminación del indicativo y dos con el cambio de letra: ⊗<i>bosteze<\/i> y ⊗<i>riege<\/i> son las formas falladas más frecuentes, y la primera además se pronunciaría igual.", "apoyo": ["1 · La primera persona del presente, que concentra la irregularidad"], "solo_web": true}, {"tipo": "hueco", "titulo": "Tres propios: primera persona, participio y gerundio", "ayuda": "Quince formas en tres ítems del formato real. Escribe la que pide cada una.", "items": [{"enun": "Primera persona del presente de <i>escocer<\/i>", "sol": "escuezo", "porque": "<i>cocer<\/i> con prefijo: la <i>o<\/i> diptonga y la <i>c<\/i> pasa a <i>z<\/i>"}, {"enun": "Primera persona del presente de <i>agradecer<\/i>", "sol": "agradezco", "porque": "c → zc"}, {"enun": "Primera persona del presente de <i>adquirir<\/i>", "sol": "adquiero", "porque": "i → ie"}, {"enun": "Primera persona del presente de <i>seguir<\/i>", "sol": "sigo", "porque": "e → i, y la <i>u<\/i> desaparece delante de <i>o<\/i>"}, {"enun": "Primera persona del presente de <i>poner<\/i>", "sol": "pongo", "porque": "raíz con <i>g<\/i>"}, {"enun": "Participio de <i>devolver<\/i>", "sol": "devuelto", "porque": "de <i>vuelto<\/i>"}, {"enun": "Participio de <i>resolver<\/i>", "sol": "resuelto", "porque": "de <i>vuelto<\/i>, con el mismo formato"}, {"enun": "Participio de <i>abrir<\/i>", "sol": "abierto"}, {"enun": "Participio de <i>cubrir<\/i>", "sol": "cubierto"}, {"enun": "Participio de <i>envolver<\/i>", "sol": "envuelto", "porque": "de <i>vuelto<\/i>"}, {"enun": "Gerundio de <i>venir<\/i>", "sol": "viniendo", "porque": "e → i"}, {"enun": "Gerundio de <i>poder<\/i>", "sol": "pudiendo", "porque": "o → u"}, {"enun": "Gerundio de <i>ir<\/i>", "sol": "yendo", "porque": "la raíz se reduce y la <i>i<\/i> se escribe <i>y<\/i>"}, {"enun": "Gerundio de <i>servir<\/i>", "sol": "sirviendo", "porque": "e → i"}, {"enun": "Gerundio de <i>construir<\/i>", "sol": "construyendo", "porque": "i → y entre vocales"}], "criterio": "Cada ítem del formato real trae cinco formas y cada forma cuenta por separado. Las tres que más se fallan: <i>escuezo<\/i> con <i>z<\/i>, <i>yendo<\/i> con <i>y<\/i>, y <i>sigo<\/i> sin la <i>u<\/i> de <i>seguir<\/i>.", "apoyo": ["1 · La primera persona del presente, que concentra la irregularidad"], "solo_web": true}], "cuaderno": {"pieza": 9, "apartados": [1, 2]}, "cuaderno_txt": "Pieza 9 · El verbo: morfología irregular y perífrasis — apartados 1 y 2: La primera persona del presente, que concentra la irregularidad; Participios y gerundios (p. 194 y 195)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El fragmento de <i>Solo pido un poco de belleza<\/i> de Bru Rovira (Ediciones B, 2016), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2018, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });
    ventana.querySelector('.v-x').focus();
  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');
        h3 = tit;
      }
      out.push({ titulo: tit, html: cuerpo, padre: es3 ? null : h3 });
    }
    return out;
  }
  function teoriaDe(c, ej) {
