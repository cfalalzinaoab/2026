<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 17 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-11-24">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 24 de noviembre</h1>
    <p class="sub">El tercer set propio y los cinco verbos · el texto de 2018s, la sexta redacción corta y explicar una frase · la tanda de morfología verbal</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 17, "fecha": "2026-11-24", "tab": "Día 17 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 24 de noviembre", "sub": "El tercer set propio y los cinco verbos · el texto de 2018s, la sexta redacción corta y explicar una frase · la tanda de morfología verbal", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 3 · arrancan los cinco verbos", "meta": "20 minutos · adverbios en -mente, compuestos y palabras acabadas en consonante + s; la primera tanda de formas verbales", "teoria": "<p>Tercer set propio, con tres familias que los sets reales no han traído y que están en la pieza 1: los adverbios en <i>-mente<\/i>, los compuestos sin guion y las palabras acabadas en consonante más <i>s<\/i>. Y desde hoy, después del set, cinco formas verbales del censo: se dicta el infinitivo y lo que se pide, se escriben las cinco y se corrigen en el acto.<\/p>\n\n<h3>Tres familias con regla propia<\/h3>\n<p><b>El adverbio en <i>-mente<\/i> conserva la tilde del adjetivo<\/b> del que sale, sin añadir ninguna: <i>fácil<\/i> lleva tilde y <i>fácilmente<\/i> también; <i>tierna<\/i> no la lleva y <i>tiernamente<\/i> tampoco. Se decide por el adjetivo, no por el adverbio entero. <b>En el compuesto sin guion manda la segunda parte<\/b>: <i>decimoséptimo<\/i> se acentúa como <i>séptimo<\/i> y <i>décimo<\/i> pierde la suya; <i>cuentakilómetros<\/i> lleva la de <i>kilómetros<\/i>. <b>Las palabras acabadas en consonante más <i>s<\/i><\/b> van al revés de la regla general: las llanas la llevan —<i>bíceps<\/i>, <i>cómics<\/i>, <i>fórceps<\/i>— y las agudas no —<i>complots<\/i>, <i>robots<\/i>—, porque el grupo de dos consonantes cuenta como una consonante distinta de <i>n<\/i> y <i>s<\/i>.<\/p>\n\n<h3>Los cinco verbos de hoy<\/h3>\n<p>La primera tanda son los cinco de 2017t, que se dieron el jueves: <i>discernir<\/i>, <i>errar<\/i>, <i>caber<\/i>, <i>conducir<\/i> y <i>cocer<\/i>, en la primera persona del presente. Tres se fallan por la ortografía y no por la forma: <i>cuezo<\/i> con <i>z<\/i>, <i>yerro<\/i> con <i>y<\/i>, <i>conduzco<\/i> con <i>zc<\/i>. Se corrigen con la ortografía delante, porque la clave cuenta como fallo la forma mal escrita.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 3: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>facilmente<\/i>", "sol": "fácilmente", "porque": "adverbio en -mente: conserva la tilde de <i>fácil<\/i>"}, {"enun": "<i>tiernamente<\/i>", "sol": "tiernamente", "porque": "<i>tierna<\/i> no lleva tilde, y el adverbio tampoco"}, {"enun": "<i>decimoseptimo<\/i>", "sol": "decimoséptimo", "porque": "compuesto sin guion: manda <i>séptimo<\/i>"}, {"enun": "<i>cuentakilometros<\/i>", "sol": "cuentakilómetros", "porque": "compuesto sin guion: <i>kilómetros<\/i> lleva tilde"}, {"enun": "<i>biceps<\/i>", "sol": "bíceps", "porque": "llana acabada en consonante + s"}, {"enun": "<i>complots<\/i>", "sol": "complots", "porque": "aguda acabada en consonante + s"}, {"enun": "<i>virrey<\/i>", "sol": "virrey", "porque": "aguda acabada en -y, que aquí cuenta como consonante"}, {"enun": "<i>comics<\/i>", "sol": "cómics", "porque": "llana acabada en consonante + s"}], "criterio": "Llevan tilde cinco de las ocho, y las tres familias de hoy explican siete: dos adverbios, dos compuestos y tres acabadas en consonante más <i>s<\/i>. <i>Virrey<\/i> es el señuelo de siempre: aguda acabada en una letra que no es <i>n<\/i> ni <i>s<\/i>.", "apoyo": ["Tres familias con regla propia"]}, {"tipo": "hueco", "titulo": "Adverbios en -mente", "estricto": true, "ayuda": "Seis adverbios sin tilde. Escribe cada uno con tilde si la lleva y tal cual si no: parte del adjetivo del que sale.", "items": [{"enun": "<i>rapidamente<\/i>", "sol": "rápidamente", "porque": "de <i>rápida<\/i>"}, {"enun": "<i>lentamente<\/i>", "sol": "lentamente", "porque": "de <i>lenta<\/i>, sin tilde"}, {"enun": "<i>ultimamente<\/i>", "sol": "últimamente", "porque": "de <i>última<\/i>"}, {"enun": "<i>cortesmente<\/i>", "sol": "cortésmente", "porque": "de <i>cortés<\/i>"}, {"enun": "<i>felizmente<\/i>", "sol": "felizmente", "porque": "de <i>feliz<\/i>, sin tilde"}, {"enun": "<i>dificilmente<\/i>", "sol": "difícilmente", "porque": "de <i>difícil<\/i>"}], "criterio": "Cuatro la llevan y dos no, y en los seis la decisión se toma sobre el adjetivo: <i>rápida<\/i>, <i>última<\/i>, <i>cortés<\/i> y <i>difícil<\/i> la llevan; <i>lenta<\/i> y <i>feliz<\/i>, no.", "apoyo": ["Tres familias con regla propia"]}, {"tipo": "hueco", "titulo": "Los cinco verbos: primera persona del presente", "ayuda": "Los cinco de 2017t, con su clave oficial. Escribe la primera persona del singular del presente de indicativo, con la ortografía de la forma.", "items": [{"enun": "<i>discernir<\/i>", "conv": "2017t", "sol": "discierno", "porque": "e → ie"}, {"enun": "<i>errar<\/i>", "conv": "2017t", "sol": "yerro", "porque": "e → ye a principio de palabra"}, {"enun": "<i>caber<\/i>", "conv": "2017t", "sol": "quepo", "porque": "cambia la raíz entera"}, {"enun": "<i>conducir<\/i>", "conv": "2017t", "sol": "conduzco", "porque": "c → zc"}, {"enun": "<i>cocer<\/i>", "conv": "2017t", "sol": "cuezo", "porque": "o → ue, y la <i>c<\/i> pasa a <i>z<\/i> delante de <i>o<\/i>"}], "criterio": "Las cinco formas del jueves, ahora de memoria y con reloj. Se anota cuántas se fallan, igual que con el set.", "apoyo": ["Los cinco verbos de hoy"]}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)"}, {"chapa": "Carril B", "titulo": "El texto de la fraseología · la sexta redacción corta", "meta": "60 minutos · el texto de 2018s en el carril «El texto»: una frase hecha, un sintagma de dos palabras y una frase a la que hay que quitarle las metáforas; la redacción corta con el enunciado de 2019t; se entrega la segunda larga", "teoria": "<p>Hoy se entrega la segunda redacción larga, la de 2025s, y se contesta el sexto texto de Llengua castellana, un fragmento de crónica de Bru Rovira sobre un hombre al que nadie reclamó: está más abajo, en el carril «El texto», con sus seis preguntas y la 2.1. Es el texto del que salía el enunciado de la redacción del 17 de noviembre, y hoy se lee entero. Después se escribe la sexta redacción corta, con un enunciado real de 2019t.5 y la 2.1.<\/p>\n\n<h3>La fraseología, tal como la pregunta el examen<\/h3>\n<p>La 1.5 pregunta el significado de <i>ahogar las penas<\/i>, y no pide una definición de diccionario, sino qué expresa el autor con ella en ese punto del texto: José Antonio bebía para no sentir la pérdida de Loli. La clave admite dos respuestas de distinto nivel —<i>atenuar las penas<\/i> y <i>buscar consuelo<\/i>— y las dos se dan por buenas; lo que no se da por bueno es traducir palabra por palabra. Es la única frase hecha del banco con pregunta propia, y se contesta con el método del 22 de octubre: la expresión dentro de su frase, y la frase entera.<\/p>\n\n<h3>Dos palabras, dos descuentos<\/h3>\n<p>La 1.6 pide una expresión equivalente a <i>oratoria florida<\/i>, y la clave descuenta 0,25 por cada una de las dos palabras no resuelta. Es el mismo formato que <i>ignorancia supina<\/i> en 2017t, el 20 de octubre, y dos apariciones justifican la regla: si el sintagma tiene dos palabras, se sustituyen las dos. <i>Oratoria<\/i> es la manera de hablar en público —<i>elocuencia<\/i>, <i>labia<\/i>—, y <i>florida<\/i>, aquí, adornada, con más adornos que contenido: <i>exuberante<\/i>, <i>recargada<\/i>. Quien escribe solo <i>labia<\/i> pierde 0,25 de los 0,5.<\/p>\n\n<h3>Quitar las metáforas: el ejercicio inverso<\/h3>\n<p>La 2.1 pide reescribir una frase reemplazando sus expresiones metafóricas por otras que no lo sean. Es el ejercicio inverso al del 29 de octubre: allí se nombraba la figura, aquí se deshace. La frase tiene tres: <i>la chispa<\/i> del amor, <i>había mantenido en pie<\/i> su vida y <i>el fuego que fulminaba<\/i> su alma, y la clave descuenta 0,25 por cada cambio mal resuelto. El procedimiento: subrayar cada palabra que no está en su sentido literal —una chispa no enamora, una vida no se pone en pie, un fuego no fulmina un alma— y sustituirla por lo que significa ahí: la fuerza del amor perdido, lo había mantenido vivo, la misma fuerza que lo hundía.<\/p>\n\n<h3>La redacción corta de hoy: 2019t<\/h3>\n<p>El enunciado da un tema y no una pregunta, como el de 2017s el 3 de noviembre: «la importancia de fomentar el hábito y el gusto por la lectura a edades tempranas». La tesis la pone quien escribe, y «leer de pequeño es importante» no sirve, porque nadie sostiene lo contrario; «el gusto por la lectura se decide en casa antes que en la escuela» o «fomentar la lectura obligando a leer consigue lo contrario» sí admiten réplica. Las dos palabras del enunciado, <i>hábito<\/i> y <i>gusto<\/i>, no son la misma: el hábito nombra lo que se hace y el gusto lo que se siente, y una redacción que las distinga tiene ya la mitad del material.<\/p>\n\n<h3>Devolución · explicar una frase<\/h3>\n<p>Hoy se devuelve la redacción del martes sobre el entierro de quien muere sin allegados, la microtarea es explicar una frase relacionándola con la argumentación —el formato de la 2.3 del comentario, sobre el texto de 2018t que se contestó el martes— y se encarga la segunda redacción larga, que se escribe en casa y se trae el martes 24.<\/p>\n\n<h3>Lo que suele salir en la devolución de la quinta corta<\/h3>\n<p>Dos marcas. La tesis sin propuesta: «merecen un entierro digno» aparece en la mayoría de las redacciones y no propone nada que se pueda hacer, así que las dos razones que siguen describen la situación en lugar de defender una medida. Se corrige añadiendo a la tesis el cómo: con nombre, con alguien presente, con el mismo trato que cualquier vecino. Y la razón que es un sentimiento: «da mucha pena que se muera solo» apela al lector y no justifica nada; en la tabla del 29 de octubre es la fila del argumento afectivo, que no cuenta. Se sustituye por un dato o una consecuencia: el gasto de un nombre en una lápida, lo que pasa con un registro sin nombre.<\/p>\n\n<h3>La microtarea: explicar una frase<\/h3>\n<p>El formato del 10 de noviembre, en dos frases: <i>la frase significa [qué]<\/i> · <i>el autor la usa para [qué defiende con ella]<\/i>. Hoy se aplica a una frase del artículo de 2018t sobre el envejecimiento, «en el fondo es una trampa 22», que el propio texto explica a continuación —«aquellas situaciones en las que, hagas lo que hagas, siempre sales perdiendo»—: la mitad del significado está casi hecha en el propio texto, y la mitad del papel decide el punto, porque explica qué papel desempeña la trampa en el argumento del artículo. Copiar la explicación del texto sin atarla a la tesis se queda en la mitad.<\/p>\n\n<h3>La segunda larga, para el martes 24<\/h3>\n<p>Se escribe en casa la parte 2 del comentario de 2025s, que está en la página del día 13, en el carril «El texto»: se elige una de las dos opciones, la inversión en saberes sin beneficio inmediato o el papel de la educación frente al utilitarismo, y se escriben entre 150 y 200 palabras con el contador de esa página. Lo que cambia respecto de la larga de 2024s: la concesión entera detrás del primer argumento, con algo nuevo detrás del <i>pero<\/i>; el recuento antes de entregar; y la relectura en tres pasadas, porque el descuento por faltas no se detiene. El propio texto de Ordine sirve de esquema: tesis en el segundo párrafo, concesión en el tercer párrafo, cierre con consecuencia en el cuarto párrafo.<\/p>\n", "ejercicios": [{"tipo": "abierta", "titulo": "La sexta redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2019t; el texto de ese examen no se lee hoy. Da el tema y no la pregunta: la tesis la pones tú, y tiene que admitir la contraria.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Redacte un texto, de entre cincuenta y ochenta palabras, sobre la importancia de fomentar el hábito y el gusto por la lectura a edades tempranas.»", "conv": "2019t", "modelo": "El gusto por la lectura se decide en casa antes que en la escuela. Un niño que ve leer a sus padres entiende que leer es algo que hacen los adultos, y no una tarea que termina con el curso. Además, la lectura obligatoria del colegio llega a los diez años, cuando el hábito ya está hecho o ya no está. Si la escuela quiere lectores, tendrá que prestar libros a las familias antes que a los alumnos. — Setenta y ocho palabras: tesis que admite la contraria, argumento de la experiencia, argumento con <i>además<\/i>, cierre con una propuesta."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. En adecuación se comprueba que la tesis afirme algo discutible sobre el tema, y no que repita que leer es importante.", "apoyo": ["La redacción corta de hoy: 2019t"], "usa_texto": false}, {"tipo": "clasificar", "titulo": "Una redacción larga, desordenada: ¿qué parte es cada frase?", "ops": ["tesis", "argumento", "concesión", "cierre"], "ayuda": "Ocho frases de una redacción de 150-200 palabras sobre la pregunta «¿Debería el sistema de salud garantizar una cita de primaria en menos de una semana?». Identifica la pieza de cada una.", "items": [{"enun": "«Es cierto que contratar médicos cuesta dinero y que las plazas tardan meses en cubrirse.»", "sol": "concesión", "porque": "reconoce la objeción de quien no está de acuerdo"}, {"enun": "«Quien ha esperado veintitrés días con una rodilla que no le deja subir al metro sabe que la espera no es un trámite, sino un mes de vida peor.»", "sol": "argumento", "porque": "de competencia: la experiencia propia resumida en una línea"}, {"enun": "«Si la cita llegara en una semana, la mitad de las visitas a urgencias por problemas menores desaparecería, y con ellas cinco horas de sala de espera por persona.»", "sol": "cierre", "porque": "la consecuencia de hacer lo que la tesis pide"}, {"enun": "«El sistema de salud debería garantizar una cita de primaria en menos de una semana, aunque haya que contratar médicos con dinero de otras partidas.»", "sol": "tesis", "porque": "toma postura y admite la contraria"}, {"enun": "«Pero cada semana de espera se paga después en urgencias, así que el dinero que se ahorra en primaria se gasta multiplicado por cuatro.»", "sol": "concesión", "porque": "la respuesta a la objeción, con algo nuevo detrás del <i>pero<\/i>: la segunda mitad de la concesión"}, {"enun": "«Según los datos del texto, una visita a urgencias cuesta cuatro veces más que una consulta de primaria, y las visitas evitables han subido un cuarenta por ciento en cinco años.»", "sol": "argumento", "porque": "empírico, con las cifras del texto de partida"}, {"enun": "«La atención primaria tiene que estar disponible en pocos días, y eso debería ser una obligación del sistema y no una promesa.»", "sol": "tesis", "porque": "otra manera de formular la tesis: quien la pone al final repite, y quien la pone al principio ya tiene la primera frase"}, {"enun": "«Además, el tiempo que un médico de familia dedica a un paciente que ha empeorado esperando es mayor que el que habría dedicado el primer día.»", "sol": "argumento", "porque": "un segundo argumento, con conector"}], "criterio": "Una tesis, tres argumentos de filas distintas, la concesión en dos frases y un cierre con consecuencia. Hay que tachar la frase que repite la tesis con otras palabras: en 150-200 palabras se escribe una sola tesis, y la segunda vez que aparece el corrector la cuenta como argumentación circular.", "apoyo": ["La segunda larga, para el martes 24"], "usa_texto": false}, {"tipo": "abierta", "titulo": "La microtarea de hoy: explicar una frase", "ayuda": "De una a cinco líneas cada una, con las dos frases del formato: qué significa y para qué la usa el autor.", "items": [{"enun": "Explique, relacionándola con la argumentación del texto, la frase «en el fondo es una trampa 22» del artículo de Vicente Fernández (página del día 15).", "modelo": "La frase significa que el mecanismo de las terapias contra el envejecimiento no tiene salida buena: eliminar las células inactivas favorece el cáncer y eliminar las cancerígenas acumula células inactivas, y se pierde por los dos lados. El autor la usa para sostener la tesis del artículo, que detener el envejecimiento es imposible y que las terapias solo pueden retrasarlo: si los dos caminos llevan a un daño, ninguna terapia puede recorrer los dos a la vez."}, {"enun": "Explique el significado de la frase «la expresión que vi en su rostro en el tanatorio era la de un hombre joven, renacido en la muerte», del texto de hoy, e indique qué añade al retrato de José Antonio.", "modelo": "La frase significa que la cara de José Antonio, ya sin la tensión del alcohol y de la enfermedad, aparentaba menos edad muerto que vivo. El autor la usa para sostener lo que cuenta la crónica entera: la vida que llevaba lo había envejecido antes de tiempo, y su muerte a los cincuenta y tres años cierra un deterioro que duró décadas y que nadie atendió."}], "criterio": "Se corrige con el formato: media respuesta si solo se parafrasea la frase, media si solo se dice para qué está. En la de 2018t la trampa es copiar la explicación que da el propio texto y parar ahí.", "apoyo": ["La microtarea: explicar una frase"]}], "cuaderno": {"pieza": 11, "apartados": [3, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 8: Las dos rúbricas, banda por banda; Las tres preguntas fijas del comentario (p. 66 y 78)"}, {"chapa": "El texto", "titulo": "Solo pido un poco de belleza, de Bru Rovira", "meta": "Convocatoria 2018, tribunal especial · fragmento de crónica · 371 palabras · el sexto texto: cuatro de test, la frase hecha, el sintagma de dos palabras y la frase sin metáforas", "literal": true, "teoria": "<p>Este es el texto que se contesta hoy en clase, sobre la fotocopia del cuadernillo de 2018 (tribunal especial); aquí está para volver a él en casa. Es una crónica de no ficción, y trae la única frase hecha del banco con pregunta propia, <i>ahogar las penas<\/i>, un sintagma de dos palabras que hay que sustituir entero, <i>oratoria florida<\/i>, y en la 2.1 una frase a la que hay que quitarle las metáforas. Cuatro preguntas de test, dos abiertas y la 2.1. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "Solo pido un poco de belleza (fragmento)", "entrada": "Bru Rovira · <i>Solo pido un poco de belleza<\/i> (Barcelona: Ediciones B, 2016) · fragmento, tal como lo reproduce el cuadernillo de Llengua castellana de 2018 (tribunal especial).", "lineas": ["José Antonio y Vittorio eran como el agua y el fuego. Dos", "caracteres completamente distintos. De Vittorio casi lo", "sabíamos todo, incluso más de lo que en realidad había vivido,", "pues en las historias que contaba con su oratoria florida", "había casi tanta fantasía como realidad. De hecho, cuando", "relataba sus aventuras y desventuras podía decirse que el", "deseo de lo que le hubiera gustado ser —pero que nunca fue—", "podría llegar a convencerle de que los errores cometidos en el", "pasado serían enmendados en el futuro. A partir incluso del", "mismo momento en que lo estaba contando.", "", "José Antonio era una tumba. Un misterio. Vivía en un piso", "lúgubre de la plaza Orwell, conocida en aquellos tiempos como", "la plaza del tripi, donde alquilaba una habitación. Jamás", "había salido de su boca una frase más larga de tres o cuatro", "palabras. Sabíamos, eso sí, que hubo una mujer en su juventud,", "Loli, cuyo nombre llevaba tatuado en el brazo. Sabíamos,", "también, que Loli había sido un gran amor y su gran condena,", "porque ella era la causa de todo el alcohol en el que llevaba", "ahogando las penas desde que lo abandonó en su juventud", "lejana. La chispa del amor perdido que había mantenido en pie", "su vida era el mismo fuego que fulminaba su alma. Y el alcohol", "se había convertido en el único aliado que le acercaba hasta", "aquel recuerdo de una plenitud irrepetible.", "", "A finales del mes de abril de 2005, José Antonio ingresó en el", "Hospital del Mar. Tenía solo 53 años, era alcohólico,", "diabético y padecía un cáncer que nunca había tratado. El día", "3 de mayo dejó de respirar. Muerte súbita, dijeron los médicos", "que lo atendían. Nadie reclamó su cuerpo, nadie acudió al", "hospital, y cuando yo fui a interesarme sobre el destino que", "se le daría a su cuerpo sin vida, por fin relajado —la", "expresión que vi en su rostro en el tanatorio era la de un", "hombre joven, renacido en la muerte—, una enfermera muy amable", "me informó de que el caso de José Antonio no era nada", "excepcional, que al menos se producían uno o dos", "fallecimientos de este tipo al mes.", "", "De este tipo, dijo exactamente la enfermera."], "pie": "Fragmento de <i>Solo pido un poco de belleza<\/i>, de Bru Rovira (Ediciones B, 2016), en la versión del cuadernillo oficial de la PAU +25 de 2018, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2018_general_llengua_castellana_suplent.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cuatro preguntas de test", "ayuda": "Las preguntas 1.1 a 1.4 del cuadernillo, literales, con su respuesta oficial. La 1.4 es el antecedente más difícil del banco: tres candidatos concuerdan, y lo decide el sentido de la oración entera.", "items": [{"enun": "<b>1.1<\/b> La enfermera utiliza la expresión <i>de este tipo<\/i> para referirse a la muerte de José Antonio porque", "conv": "2018s", "ops": ["era un fallecido no identificado.", "no se había medicado a tiempo contra el cáncer.", "nadie solicitó el cadáver para darle sepultura.", "murió de muerte súbita."], "sol": "nadie solicitó el cadáver para darle sepultura.", "porque": "la frase anterior a la de la enfermera: «nadie reclamó su cuerpo, nadie acudió al hospital». Estaba identificado, y la muerte súbita la dicen los médicos, no la enfermera"}, {"enun": "<b>1.2<\/b> ¿Cuál de los siguientes enunciados describe mejor el poder que atribuye el autor al recuerdo en los relatos de Vittorio?", "conv": "2018s", "ops": ["Los recuerdos se confunden con los deseos.", "El recuerdo puede llegar a enmascarar la realidad del pasado.", "Se recuerda exclusivamente lo que se ha vivido.", "El recuerdo puede corregir los errores del pasado."], "sol": "El recuerdo puede llegar a enmascarar la realidad del pasado.", "porque": "en las historias de Vittorio «había casi tanta fantasía como realidad»: el recuerdo tapa lo que pasó. La d) es la trampa: los errores «serían enmendados» solo en su imaginación"}, {"enun": "<b>1.3<\/b> El autor identifica como desencadenante de las penalidades de José Antonio", "conv": "2018s", "ops": ["el amor no correspondido.", "el exceso de alcohol.", "su carácter huraño.", "la fúnebre vivienda en la que habitaba."], "sol": "el amor no correspondido.", "porque": "«ella era la causa de todo el alcohol»: el alcohol es la consecuencia, y Loli la causa. Una pregunta de causa, como las del texto del 17 de noviembre"}, {"enun": "<b>1.4<\/b> ¿A quién o a qué se refiere <i>lo<\/i> en la oración del texto «llevaba ahogando las penas desde que lo abandonó»?", "conv": "2018s", "ops": ["Al alcohol.", "A José Antonio.", "A Vittorio.", "Al amor."], "sol": "A José Antonio.", "porque": "<i>lo<\/i> concuerda con el alcohol, con José Antonio y con el amor, y lo decide el sentido: quien abandona es Loli, y a quien abandonan es a José Antonio"}], "criterio": "Medio punto por acierto y 0,16 por error. La 1.3 es una pregunta de causa, y el texto nombra quién es la causa de qué; la 1.4 no se resuelve con la concordancia, porque tres opciones concuerdan, sino leyendo la oración entera y preguntando quién abandonó a quién.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La frase hecha", "ayuda": "Con tus palabras: qué expresa el autor con ella en ese punto del texto.", "items": [{"enun": "<b>1.5<\/b> ¿Cuál es el significado de la expresión del texto <i>ahogar las penas<\/i>?", "conv": "2018s", "modelo": "Clave oficial: <i>atenuar los sentimientos, las emociones o las tristezas<\/i>; <i>buscar consuelo<\/i>. Las dos se dan por buenas. En el texto: José Antonio bebía para no sentir la pérdida de Loli, y el alcohol era la manera de aliviar esa tristeza. Una respuesta como «meter las penas en agua» traduce las palabras y no la expresión."}], "criterio": "Se da el medio punto a la explicación del sentido en el texto; se admiten los dos niveles de la clave, atenuar la tristeza y buscar consuelo.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "El sintagma de dos palabras", "ayuda": "Una palabra en cada raya. La clave descuenta por cada una de las dos que falte.", "items": [{"enun": "<b>1.6<\/b> «Proporcione una expresión de significado equivalente al sintagma oratoria florida, que aparece en el texto» · la palabra que sustituye a <i>oratoria<\/i>:", "conv": "2018s", "sol": "elocuencia|verborrea|labia|facundia|palabrería|verbosidad|retórica|discurso|manera de hablar|forma de hablar", "porque": "clave: <i>elocuencia<\/i>, <i>verborrea<\/i>, <i>labia<\/i>… La manera de hablar en público"}, {"enun": "La palabra que sustituye a <i>florida<\/i>:", "sol": "exuberante|elegante|rica|exquisita|artística|adornada|recargada|abundante|brillante|ampulosa|vistosa|colorida|florida", "porque": "clave: <i>exuberante<\/i>, <i>elegante<\/i>, <i>rica<\/i>, <i>exquisita<\/i>, <i>artística<\/i>… Adornada, con más adorno que contenido"}], "criterio": "Dos palabras, dos cuartos de punto. <i>Labia<\/i> sola se queda en 0,25; <i>labia exuberante<\/i> o <i>elocuencia recargada<\/i> completan el medio punto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La frase sin metáforas", "ayuda": "Se subrayan las tres expresiones que no están en su sentido literal y se sustituye cada una por lo que significa ahí. Un punto, y 0,25 menos por cada cambio mal resuelto.", "items": [{"enun": "<b>2.1<\/b> Reescriba la siguiente frase del texto reemplazando las expresiones metafóricas por otras no metafóricas: «La chispa del amor perdido que había mantenido en pie su vida era el mismo fuego que fulminaba su alma».", "conv": "2018s", "modelo": "Clave oficial: «La fuerza (la potencia, el impulso) del amor perdido que le había mantenido vivo (con vida) era la misma fuerza que le deprimía (hundía su ánimo, desalentaba)». Tres cambios: <i>la chispa<\/i> → la fuerza; <i>había mantenido en pie su vida<\/i> → le había mantenido vivo; <i>el mismo fuego que fulminaba su alma<\/i> → la misma fuerza que lo hundía. Cambiar <i>chispa<\/i> por <i>llama<\/i> es poner una metáfora por otra, y cuenta como cambio mal resuelto."}], "criterio": "Se corrige por cambios: tres expresiones, y cada una tiene que quedar en sentido recto. Sustituir una metáfora por otra —<i>llama<\/i>, <i>brasa<\/i>, <i>quemaba<\/i>— no resuelve el cambio.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [8]}, {"pieza": "TEXTOS", "apartados": [8]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 8: 2018, tribunal especial · Solo pido un poco de belleza (p. 263) · Los textos de cada sesión — apartado 8: «Solo pido un poco de belleza (fragmento)» · texto de examen"}, {"chapa": "Carril C", "titulo": "La tanda: morfología verbal", "meta": "10 minutos · los tres ítems reales que quedaban, participios dobles, satisfacer y el subjuntivo, y tres propios", "teoria": "<p>El jueves se dieron la primera persona con sus cuatro familias, los participios y los gerundios, el subjuntivo que sale del indicativo y los cloze. Cinco de los ocho ítems reales de morfología verbal se contestaron ese día; la tanda de hoy trae los tres que quedaban y tres propios en el mismo formato, con el mismo criterio por elemento: cada forma que falte, esté mal o esté mal escrita cuenta como fallo.<\/p>\n\n<h3>Qué pide cada ítem<\/h3>\n<p>El ítem de 2016s pide tres participios y la clave cuenta cinco formas, porque el enunciado avisa: «si tienen más de una forma, deben consignarse ambas». <i>Freír<\/i> tiene <i>frito<\/i> y <i>freído<\/i>; <i>imprimir<\/i>, <i>impreso<\/i> e <i>imprimido<\/i>; quien escribe solo <i>frito<\/i> y solo <i>impreso<\/i> pierde dos formas sin haber escrito nada incorrecto. Leer el enunciado entero vale ahí lo mismo que saber los participios. <i>Satisfacer<\/i> se conjuga como <i>hacer<\/i>: <i>satisfecho<\/i>, <i>satisfaciendo<\/i>, <i>satisfizo<\/i>. En el subjuntivo de 2025t, tres formas salen del indicativo —<i>río<\/i> → <i>ría<\/i>, <i>huyo<\/i> → <i>huya<\/i>, <i>aborrezco<\/i> → <i>aborrezca<\/i>— y dos añaden el cambio de letra delante de <i>e<\/i>: <i>bostezo<\/i> → <i>bostece<\/i>, <i>riego<\/i> → <i>riegue<\/i>. Y en los propios, <i>escocer<\/i> es <i>cocer<\/i> con prefijo, <i>escuezo<\/i>, y el gerundio de <i>ir<\/i> es <i>yendo<\/i>: la raíz se reduce a una vocal y la <i>i<\/i> de <i>-iendo<\/i> se escribe <i>y<\/i>, como en <i>construyendo<\/i>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "2016s: los participios, con las dos formas", "ayuda": "Los tres verbos del ejercicio real, con su clave. En los que tienen dos participios, escribe los dos separados por una coma.", "items": [{"enun": "«Escriba la forma masculina singular del participio de los siguientes verbos (si tienen más de una forma, deben consignarse ambas)»: <i>freír<\/i>", "conv": "2016s", "sol": "frito, freído|freído, frito|frito y freído|freído y frito", "porque": "participio doble: la clave cuenta las dos formas"}, {"enun": "<i>satisfacer<\/i>", "conv": "2016s", "sol": "satisfecho", "porque": "como <i>hecho<\/i>"}, {"enun": "<i>imprimir<\/i>", "conv": "2016s", "sol": "impreso, imprimido|imprimido, impreso|impreso e imprimido|imprimido e impreso", "porque": "participio doble: las dos formas"}], "criterio": "Cinco formas en tres verbos. Las dos que se pierden sin escribir nada mal son la segunda de <i>freír<\/i> y la segunda de <i>imprimir<\/i>: el enunciado las pide.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "2020s: satisfacer", "ayuda": "Las dos formas del ejercicio real, con su clave.", "items": [{"enun": "«Escriba el gerundio y el participio del verbo satisfacer»: el gerundio", "conv": "2020s", "sol": "satisfaciendo", "porque": "como <i>haciendo<\/i>"}, {"enun": "«Escriba el gerundio y el participio del verbo satisfacer»: el participio", "conv": "2020s", "sol": "satisfecho", "porque": "como <i>hecho<\/i>"}], "criterio": "Las dos salen de <i>hacer<\/i>. ⊗<i>Satisfacido<\/i> es el fallo habitual, y cuenta como forma errónea.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "2025t: la primera persona del presente de subjuntivo", "estricto": true, "ayuda": "Los cinco verbos del ejercicio real, con su clave. Pasa por la primera persona del indicativo y cambia la terminación; en dos, cambia también una letra.", "items": [{"enun": "<i>reír<\/i>", "conv": "2025t", "sol": "ría", "porque": "<i>río<\/i> → <i>ría<\/i>, con la tilde del hiato"}, {"enun": "<i>huir<\/i>", "conv": "2025t", "sol": "huya", "porque": "<i>huyo<\/i> → <i>huya<\/i>"}, {"enun": "<i>bostezar<\/i>", "conv": "2025t", "sol": "bostece", "porque": "<i>bostezo<\/i>, y la <i>z<\/i> pasa a <i>c<\/i> delante de <i>e<\/i>"}, {"enun": "<i>regar<\/i>", "conv": "2025t", "sol": "riegue", "porque": "<i>riego<\/i>, y la <i>g<\/i> mete una <i>u<\/i> delante de <i>e<\/i>"}, {"enun": "<i>aborrecer<\/i>", "conv": "2025t", "sol": "aborrezca", "porque": "<i>aborrezco<\/i> → <i>aborrezca<\/i>"}], "criterio": "Tres se resuelven cambiando la terminación del indicativo y dos con el cambio de letra: ⊗<i>bosteze<\/i> y ⊗<i>riege<\/i> son las formas falladas más frecuentes, y la primera además se pronunciaría igual.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "Tres propios: primera persona, participio y gerundio", "ayuda": "Quince formas en tres ítems del formato real. Escribe la que pide cada una.", "items": [{"enun": "Primera persona del presente de <i>escocer<\/i>", "sol": "escuezo", "porque": "<i>cocer<\/i> con prefijo: la <i>o<\/i> diptonga y la <i>c<\/i> pasa a <i>z<\/i>"}, {"enun": "Primera persona del presente de <i>agradecer<\/i>", "sol": "agradezco", "porque": "c → zc"}, {"enun": "Primera persona del presente de <i>adquirir<\/i>", "sol": "adquiero", "porque": "i → ie"}, {"enun": "Primera persona del presente de <i>seguir<\/i>", "sol": "sigo", "porque": "e → i, y la <i>u<\/i> desaparece delante de <i>o<\/i>"}, {"enun": "Primera persona del presente de <i>poner<\/i>", "sol": "pongo", "porque": "raíz con <i>g<\/i>"}, {"enun": "Participio de <i>devolver<\/i>", "sol": "devuelto", "porque": "de <i>vuelto<\/i>"}, {"enun": "Participio de <i>resolver<\/i>", "sol": "resuelto", "porque": "de <i>vuelto<\/i>, con el mismo formato"}, {"enun": "Participio de <i>abrir<\/i>", "sol": "abierto"}, {"enun": "Participio de <i>cubrir<\/i>", "sol": "cubierto"}, {"enun": "Participio de <i>envolver<\/i>", "sol": "envuelto", "porque": "de <i>vuelto<\/i>"}, {"enun": "Gerundio de <i>venir<\/i>", "sol": "viniendo", "porque": "e → i"}, {"enun": "Gerundio de <i>poder<\/i>", "sol": "pudiendo", "porque": "o → u"}, {"enun": "Gerundio de <i>ir<\/i>", "sol": "yendo", "porque": "la raíz se reduce y la <i>i<\/i> se escribe <i>y<\/i>"}, {"enun": "Gerundio de <i>servir<\/i>", "sol": "sirviendo", "porque": "e → i"}, {"enun": "Gerundio de <i>construir<\/i>", "sol": "construyendo", "porque": "i → y entre vocales"}], "criterio": "Cada ítem del formato real trae cinco formas y cada forma cuenta por separado. Las tres que más se fallan: <i>escuezo<\/i> con <i>z<\/i>, <i>yendo<\/i> con <i>y<\/i>, y <i>sigo<\/i> sin la <i>u<\/i> de <i>seguir<\/i>.", "apoyo": ["Qué pide cada ítem"]}], "cuaderno": {"pieza": 9, "apartados": [1, 2]}, "cuaderno_txt": "Pieza 9 · El verbo: morfología irregular y perífrasis — apartados 1 y 2: La primera persona del presente, que concentra la irregularidad; Participios y gerundios (p. 194 y 195)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El fragmento de <i>Solo pido un poco de belleza<\/i> de Bru Rovira (Ediciones B, 2016), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2018, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —oscaralejandrobanos.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
