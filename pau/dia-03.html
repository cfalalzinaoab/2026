<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 3 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 3, "fecha": "2026-10-01", "tab": "Día 3 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 1 de octubre", "sub": "Diptongo, triptongo, hiato · la categoría de una palabra en su oración", "carriles": [{"chapa": "Carril A", "titulo": "Diptongo, triptongo, hiato", "meta": "15 minutos · dos vocales juntas: una sílaba o dos", "teoria": "<h3>3 · El hiato<\/h3>\n<p>El diptongo junta dos vocales en una sílaba. El hiato hace lo contrario: <strong>dos vocales juntas que se pronuncian en sílabas distintas<\/strong>. <em>Te-a-tro<\/em> tiene tres sílabas; <em>ma-íz<\/em> tiene dos, con la <em>a<\/em> y la <em>i<\/em> separadas.<\/p>\n<p>Hay tres clases, <strong>una de ellas con regla propia<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>ejemplos<\/th>\n<th>cómo se acentúa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>dos vocales iguales<\/td>\n<td><em>cre-er<\/em>, <em>le-er<\/em>, <em>chi-i-ta<\/em><\/td>\n<td>por las tres reglas<\/td>\n<\/tr>\n<tr>\n<td>dos abiertas distintas<\/td>\n<td><em>te-a-tro<\/em>, <em>po-e-ta<\/em>, <em>lí-ne-a<\/em><\/td>\n<td>por las tres reglas<\/td>\n<\/tr>\n<tr>\n<td><strong>cerrada tónica + abierta<\/strong>, o al revés<\/td>\n<td><em>ma-<span class=\"vs\">í<\/span>z<\/em>, <em>ba-<span class=\"vs\">ú<\/span>l<\/em>, <em>ma-yo-<span class=\"vs\">rí<\/span>-a<\/em>, <em>o-<span class=\"vs\">í<\/span>-do<\/em><\/td>\n<td><strong>siempre con tilde<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las dos primeras clases no intervienen en la colocación de la tilde, pero sí en el recuento de sílabas, del que sale la clase de la palabra. <em>Línea<\/em> lleva tilde por ser esdrújula, y esa clase se la da el hiato: <em>lí-ne-a<\/em> tiene tres sílabas, y si la <em>e<\/em> y la <em>a<\/em> fueran diptongo —<em>lí-nea<\/em>— sería llana y no la llevaría. <em>Teatro<\/em>, en cambio, no lleva ninguna: con hiato o sin él, es llana acabada en vocal.<\/p>\n<h4>La regla que resuelve los diecisiete<\/h4>\n<blockquote>\n<p><strong>Una vocal cerrada tónica —la <em>i<\/em> o la <em>u<\/em> cuando llevan la fuerza— junto a una vocal abierta lleva SIEMPRE tilde<\/strong>, aunque por las tres reglas no le correspondiera. La tilde va sobre la cerrada, nunca sobre la abierta.<\/p>\n<\/blockquote>\n<p>Solo puede pasar en esas dos letras, que son las únicas cerradas, así que la tilde de la que habla esta regla es siempre una <em>í<\/em> o una <em>ú<\/em>. Cuando la que lleva la fuerza es la abierta —<em>cau-sa<\/em>, <em>pei-ne<\/em>—, no hay hiato ni hay regla que aplicar: las dos vocales siguen en la misma sílaba.<\/p>\n<p><strong>Por qué «siempre».<\/strong> La tilde del hiato indica que las dos vocales se pronuncian en sílabas distintas. Sin ella, <em>mayoria<\/em> se leería <em>ma-yo-<span class=\"vs\">ria<\/span><\/em>, con diptongo y tres sílabas en lugar de cuatro.<\/p>\n<p><strong>La h intercalada no lo impide.<\/strong> <em>Bú-ho<\/em>, <em>ba-hí-a<\/em> y <em>re-hú-yo<\/em> son hiatos con una hache en medio, y las tres llevan tilde: la hache no representa ningún sonido y no separa las vocales.<\/p>\n<h3>4 · La frontera entre <em>oír<\/em> y <em>huir<\/em><\/h3>\n<p>Esta frontera se falla más que ninguna otra de la acentuación, y se resuelve con una sola pregunta.<\/p>\n<table>\n<thead>\n<tr>\n<th>lleva tilde<\/th>\n<th>no lleva<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>oír<\/strong>, <strong>oído<\/strong><\/td>\n<td><strong>huir<\/strong>, <strong>huido<\/strong><\/td>\n<td>en <em>oír<\/em> hay una abierta (<em>o<\/em>) y una cerrada tónica (<em>í<\/em>): hiato, tilde obligatoria. En <em>huir<\/em> hay <strong>dos cerradas<\/strong> (<em>u<\/em>, <em>i<\/em>): diptongo, y se acentúa por las tres reglas, que no le dan tilde<\/td>\n<\/tr>\n<tr>\n<td><strong>reír<\/strong>, <strong>reírse<\/strong><\/td>\n<td><strong>jesuita<\/strong>, <strong>gratuito<\/strong>, <strong>altruista<\/strong>, <strong>constituir<\/strong><\/td>\n<td>lo mismo: <em>e<\/em> + <em>í<\/em> es hiato; <em>ui<\/em> es diptongo siempre<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La pregunta:<\/strong> ¿alguna de las dos vocales es abierta? Si lo es y la cerrada lleva la fuerza, hay hiato y lleva tilde. Si las dos son cerradas, es diptongo y no hay nada que decidir: se aplican las tres reglas.<\/p>\n<p><em>Huir<\/em> y <em>huido<\/em> aparecen en el examen al lado de <em>oír<\/em> y <em>reír<\/em>. El grupo <em>ui<\/em> es diptongo por norma aunque al pronunciarlo parezca que se separa.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Separa en sílabas", "dossier": {"cuaderno": "2", "ejercicio": 2, "parte": "las sílabas"}, "ayuda": "Escribe cada palabra separada en sílabas con guiones, con su tilde, como en <i>te-a-tro<\/i>.", "estricto": true, "items": [{"enun": "<i>policía<\/i>", "sol": "po-li-cí-a", "porque": "po-li-<b>cí<\/b>-a: hiato de cerrada tónica + abierta"}, {"enun": "<i>maíz<\/i>", "sol": "ma-íz", "porque": "ma-<b>íz<\/b>: hiato de cerrada tónica, como <i>policía<\/i>"}, {"enun": "<i>teatro<\/i>", "sol": "te-a-tro", "porque": "te-<b>a<\/b>-tro: hiato de dos abiertas distintas"}, {"enun": "<i>baúl<\/i>", "sol": "ba-úl", "porque": "ba-<b>úl<\/b>: hiato de cerrada tónica"}, {"enun": "<i>jesuita<\/i>", "sol": "je-sui-ta", "porque": "je-<b>sui<\/b>-ta: diptongo homogéneo"}, {"enun": "<i>creer<\/i>", "sol": "cre-er", "porque": "cre-<b>er<\/b>: hiato de dos vocales iguales"}, {"enun": "<i>bahía<\/i>", "sol": "ba-hí-a", "porque": "ba-<b>hí<\/b>-a: hiato de cerrada tónica con hache en medio"}, {"enun": "<i>línea<\/i>", "sol": "lí-ne-a", "porque": "<b>lí<\/b>-ne-a: hiato de dos abiertas distintas"}, {"enun": "<i>averigüéis<\/i>", "sol": "a-ve-ri-güéis", "porque": "a-ve-ri-<b>güéis<\/b>: triptongo"}, {"enun": "<i>rubíes<\/i>", "sol": "ru-bí-es", "porque": "ru-<b>bí<\/b>-es: hiato de cerrada tónica"}, {"enun": "<i>poeta<\/i>", "sol": "po-e-ta", "porque": "po-<b>e<\/b>-ta: hiato de dos abiertas distintas"}, {"enun": "< "«iu»: dos cerradas, homogéneo"}, {"enun": "<i>país<\/i>", "sol": "hiato", "porque": "«aí»: la cerrada lleva la fuerza, <i>pa-ís<\/i>"}, {"enun": "<i>peine<\/i>", "sol": "diptongo", "porque": "«ei»: abierta + cerrada, decreciente"}], "criterio": "Cuatro diptongos, cuatro hiatos y un triptongo. Los hiatos de dos abiertas —<i>feo<\/i>, <i>caos<\/i>, <i>poema<\/i>— no llevan ninguna marca escrita y se reconocen solo oyéndolos; el de <i>país<\/i> lleva la tilde sobre la <i>i<\/i> porque la cerrada es la fuerte, y esa tilde la exige la regla del hiato: una vocal cerrada tónica junto a una abierta lleva siempre tilde.", "apoyo": ["3 · El hiato", "La regla que resuelve los diecisiete"], "solo_web": true}, {"tipo": "hueco", "titulo": "¿Cuántas sílabas?", "ayuda": "Escribe el número de sílabas de cada palabra. Cuenta cada par de vocales juntas por separado: una palabra puede tener un diptongo y un hiato a la vez.", "items": [{"enun": "<i>poesía<\/i>", "sol": "4|cuatro", "porque": "<i>po-e-sí-a<\/i>: dos hiatos"}, {"enun": "<i>guerra<\/i>", "sol": "2|dos", "porque": "<i>gue-rra<\/i>: la <i>u<\/i> no suena y no hay diptongo"}, {"enun": "<i>aéreo<\/i>", "sol": "4|cuatro", "porque": "<i>a-é-re-o<\/i>: «aé» y «eo», dos hiatos de abiertas"}, {"enun": "<i>averigüéis<\/i>", "sol": "4|cuatro", "porque": "<i>a-ve-ri-güéis<\/i>: la diéresis avisa de que la <i>u<\/i> suena, y «üéi» es un triptongo"}, {"enun": "<i>baúl<\/i>", "sol": "2|dos", "porque": "<i>ba-úl<\/i>: la cerrada lleva la fuerza, hiato"}, {"enun": "<i>continuo<\/i>", "sol": "3|tres", "porque": "<i>con-ti-nuo<\/i>: «uo» es diptongo creciente"}], "criterio": "Contar sílabas comprueba lo mismo que los dos ejercicios anteriores desde otro lado: cada hiato añade una sílaba y cada diptongo o triptongo la ahorra. <i>Continuo<\/i> tiene tres sílabas con el diptongo; cuando la <i>u<\/i> lleva la fuerza, <i>continúo<\/i>, el diptongo se rompe y la palabra pasa a tener cuatro, y ese cambio se estudia el martes 6 de octubre con las palabras que se escriben con las mismas letras.", "apoyo": ["3 · El hiato"], "solo_web": true}], "cuaderno": {"pieza": 2, "apartados": [3, 4], "ejercicios": [2, 3]}, "cuaderno_txt": "Pieza 2 · Vocales en contacto — apartados 3 y 4: El hiato; La frontera entre oír y huir (p. 16 y 17) · ejercicios 2 y 3", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La categoría de una palabra en su oración", "meta": "45 minutos · las diez palabras del censo, las tres fronteras y los cuatro ítems reales", "teoria": "<h3>2 · La categoría de una palabra <strong>en su oración<\/strong><\/h3>\n<p>El ejercicio no pregunta qué es una palabra: pregunta <strong>qué es en esa oración<\/strong>, porque las palabras que se preguntan son casi todas de las que cambian de clase según su lugar.<\/p>\n<p><strong>Las diez palabras que han caído en los doce ítems<\/strong>: <em>ya<\/em>, <em>aun<\/em>, <em>entonces<\/em>, <em>siempre<\/em>, <em>incluso<\/em>, <em>harto<\/em>, <em>mañana<\/em>, <em>hasta<\/em>, <em>bien… bien<\/em> y <em>hacia<\/em>.<\/p>\n<p><strong>Y el reparto de las respuestas oficiales: adverbio en diez de los doce<\/strong>, conjunción en uno (<em>bien… bien<\/em>) y preposición en otro (<em>hacia<\/em>).<\/p>\n<blockquote>\n<p>Ese reparto no sustituye al método: los dos casos que no son adverbio están puestos para separar a quien ha estudiado. Sirve solo como desempate: si has aplicado las tres preguntas y sigues dudando entre adverbio y otra clase, marca adverbio.<\/p>\n<\/blockquote>\n<h4>Los cuatro ítems resueltos<\/h4>\n<blockquote>\n<p><strong>2015s, 3.2.<\/strong> «¿A qué categoría gramatical pertenece la palabra <em>ya<\/em> en la oración <em>Aquel director ya no quería ni oír los rumores de la orquesta<\/em>?» a) Adverbio. b) Pronombre. c) Adjetivo. d) Conjunción.<\/p>\n<p><strong>Adverbio.<\/strong> No cambia de forma, no lleva sustantivo al lado y no une nada: modifica a <em>quería<\/em> señalando cuándo.<\/p>\n<p><strong>2017t, 3.1.<\/strong> «¿Qué clase de palabra es <em>aun<\/em> en la oración <em>A veces, aun queriendo solucionar los problemas del inversor, no pueden hacerlo por falta de recursos<\/em>?» a) Preposición. b) Adverbio. c) Conjunción. d) Adjetivo.<\/p>\n<p><strong>Adverbio.<\/strong> Aquí <em>aun<\/em> equivale a <em>incluso<\/em>: «incluso queriendo solucionarlo».<\/p>\n<p><strong>2017s, 3.2.<\/strong> «Indique cuál es la categoría gramatical de <em>aun<\/em> en la siguiente oración: <em>Con disciplina se puede crear un estado de relajación en el que es posible soñar aun despierto<\/em>.» a) Adverbio. b) Pronombre. c) Conjunción. d) Adjetivo.<\/p>\n<p><strong>Adverbio<\/strong> otra vez, y la misma equivalencia: «soñar incluso despierto». El tribunal preguntó <em>aun<\/em> dos veces en dos oraciones distintas y la respuesta fue la misma las dos veces.<\/p>\n<p><strong>2018t, 3.2.<\/strong> «Indique la categoría gramatical de <em>bien<\/em> en la siguiente oración: <em>En breve nos comunicaremos con usted, bien por correo, bien por teléfono<\/em>.» a) Adjetivo. b) Adverbio. c) Conjunción. d) Preposición.<\/p>\n<p><strong>Conjunción.<\/strong> Es el único caso de los doce en que la respuesta obvia falla. <em>Bien<\/em> suele ser adverbio —«canta bien»—, pero aquí viene <strong>repetido y por parejas<\/strong>, presentando dos alternativas, y se puede sustituir por <em>o… o<\/em>: «o por correo, o por teléfono».<\/p>\n<\/blockquote>\n<h4>Las tres fronteras que más se fallan<\/h4>\n<p><strong>Adverbio o conjunción.<\/strong> El adverbio modifica y no une; la conjunción une, sea entre dos elementos del mismo rango o metiendo una oración dentro de otra. La prueba está en el apartado anterior: si la palabra se puede sustituir por <em>o<\/em>, <em>y<\/em>, <em>pero<\/em> o <em>aunque<\/em> sin que la oración se rompa, es conjunción.<\/p>\n<blockquote>\n<p><strong>Cuidado con las locuciones conjuntivas.<\/strong> Muchas conjunciones son grupos de palabras y no una sola: <em>así que<\/em>, <em>ya que<\/em>, <em>puesto que<\/em>, <em>dado que<\/em>, <em>de modo que<\/em>, <em>a pesar de que<\/em>, <em>siempre que<\/em>, <em>aun cuando<\/em>, <em>por más que<\/em>. En esos casos la clase es la del grupo entero, y separarlo para clasificar palabra por palabra da una respuesta falsa: en «no vino, <strong>ya que<\/strong> libraba», <em>ya<\/em> no es el adverbio de «ya llegó», sino la primera mitad de una conjunción causal que se puede sustituir por <em>porque<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Adverbio o preposición.<\/strong> La preposición va <strong>delante de su complemento<\/strong> y forma grupo con él: <em>hacia el norte<\/em>, <em>hasta la puerta<\/em>. El adverbio no lleva complemento: «Lo entiende <strong>incluso<\/strong> un niño» no da ⊗<em>incluso un niño<\/em> como grupo, sino que <em>incluso<\/em> añade énfasis a <em>un niño<\/em>. <strong>La prueba es el complemento:<\/strong> comprueba si la palabra forma grupo con lo que lleva detrás —<em>hacia el cielo<\/em>, <em>hasta la puerta<\/em>—, y entonces es preposición. Quitarla no decide: «Pasó la tarde mirando el cielo» se sostiene sin <em>hacia<\/em>, y <em>hacia<\/em> es preposición; es el ítem de 2026s 3.1, cuya clave oficial da <em>preposición<\/em>.<\/p>\n<p><strong>Adverbio o adjetivo.<\/strong> El adjetivo concuerda con el sustantivo y cambia de forma —<em>una respuesta rápida<\/em>, <em>unas respuestas rápidas<\/em>—; el adverbio modifica al verbo y se mantiene invariable: <em>trabajan duro<\/em>, no ⊗<em>trabajan duros<\/em>; <em>están medio dormidas<\/em>, no ⊗<em>medias dormidas<\/em>. <strong>La prueba es ponerlo en plural:<\/strong> si la palabra tiene que cambiar, es adjetivo; si se queda como estaba, es adverbio.<\/p>\n<blockquote>\n<p><strong>El adjetivo que hace de adverbio.<\/strong> <em>Duro<\/em>, <em>claro<\/em>, <em>rápido<\/em>, <em>alto<\/em> y <em>bajo<\/em> son adjetivos que también se usan como adverbios, sin cambiar de forma: <em>habla claro<\/em>, <em>corre rápido<\/em>, <em>pisa fuerte<\/em>. Se les llama adjetivos adverbiales, y se reconocen porque acompañan a un verbo y se quedan siempre en masculino singular. Al revés pasa con los adverbios que parecen adjetivos por la forma —<em>medio<\/em> en <em>medio dormidas<\/em>—: la prueba del plural los separa a todos.<\/p>\n<\/blockquote>\n<p><strong>Y un detalle de escritura relacionado:<\/strong> cuando van dos adverbios en <em>-mente<\/em> seguidos, la terminación la lleva solo el último, y el primero se queda en femenino singular: <em>habló clara y rápidamente<\/em>.<\/p>\n<h4><em>Muy<\/em>, <em>mucho<\/em> y dónde va cada uno<\/h4>\n<p><em>Muy<\/em> y <em>mucho<\/em> no son intercambiables: <em>muy<\/em> funciona siempre como adverbio, y <em>mucho<\/em> como adverbio o como determinante según dónde vaya.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>dónde va<\/th>\n<th>clase<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>muy<\/strong><\/td>\n<td>delante de un adjetivo o de otro adverbio<\/td>\n<td>adverbio<\/td>\n<td><em>muy caro<\/em>, <em>muy lejos<\/em>, <em>muy despacio<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho<\/strong><\/td>\n<td>detrás de un verbo<\/td>\n<td>adverbio<\/td>\n<td><em>trabaja mucho<\/em>, <em>llovió mucho<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho, mucha, muchos, muchas<\/strong><\/td>\n<td>delante de un sustantivo<\/td>\n<td><strong>determinante<\/strong>, y concuerda con él<\/td>\n<td><em>mucho polvo<\/em>, <em>mucha gente<\/em>, <em>muchos turnos<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho<\/strong><\/td>\n<td>delante de <em>mayor<\/em>, <em>menor<\/em>, <em>mejor<\/em> y <em>peor<\/em><\/td>\n<td>adverbio<\/td>\n<td><em>mucho mejor<\/em>, <em>mucho peor<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La tercera fila se escapa más que las otras tres: <em>mucho polvo<\/em> no es un adverbio, porque <em>mucho<\/em> lleva un sustantivo al lado y concuerda con él —<em>mucha gente<\/em>, <em>muchos turnos<\/em>—. En esa fila la segunda pregunta basta. Y <em>muy<\/em> nunca puede ir en ese sitio: no existe ⊗<em>muy polvo<\/em>.<\/p>\n<h4>Cuando el enunciado llama <em>adjetivo<\/em> a un determinante<\/h4>\n<blockquote>\n<p><strong>2025t, 1.4.<\/strong> «El texto presenta una adjetivación muy rica. ¿Qué tipo de adjetivos predominan?» a) Numerales. b) Indefinidos. c) Calificativos. d) Demostrativos.<\/p>\n<p><strong>c) Calificativos<\/strong>, según la clave oficial.<\/p>\n<\/blockquote>\n<p>El enunciado llama <em>adjetivos<\/em> a los numerales, los indefinidos y los demostrativos, que en la tabla de las nueve clases son determinantes cuando acompañan a un sustantivo. Es la terminología de las gramáticas anteriores, y todavía aparece en los enunciados. Un texto «rico en adjetivación» tiene muchos adjetivos calificativos, los que indican cómo es el sustantivo.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "En el formato del examen: la clase en esa oración", "dossier": {"cuaderno": "6", "ejercicio": 4}, "ayuda": "Escribe la clase de la palabra en cursiva en esa oración: sustantivo, adjetivo, determinante, pronombre, verbo, adverbio, preposición, conjunción o interjección. Al corregir, la clave indica con cuál de las preguntas del apartado 2 lo decide.", "estricto": true, "items": [{"enun": "<i>Mañana<\/i> firmamos el contrato.", "sol": "adverbio|adverbio de tiempo", "porque": "<b>Adverbio<\/b> de tiempo: pregunta 1, no cambia de forma, y modifica a <i>firmamos<\/i>"}, {"enun": "Nos vemos <i>entre<\/i> semana.", "sol": "preposición", "porque": "<b>Preposición<\/b>: pregunta 3, va delante de su complemento <i>semana<\/i> y forma grupo con él"}, {"enun": "Lo entiende <i>incluso<\/i> mi vecino.", "sol": "adverbio", "porque": "<b>Adverbio<\/b>: pregunta 3, no une nada y no forma grupo con ningún complemento detrás. Que la oración se sostenga al quitarlo —«Lo entiende mi vecino»— no sirve de prueba por sí solo: también se sostiene «miró el cielo» al quitar <i>hacia<\/i> de «miró hacia el cielo», y <i>hacia<\/i> es preposición"}, {"enun": "<i>Siempre<\/i> llega tarde a los turnos de noche.", "sol": "adverbio|adverbio de tiempo", "porque": "<b>Adverbio<\/b> de tiempo: pregunta 1"}, {"enun": "Estaba <i>harto<\/i> de pagar dos alquileres.", "sol": "adjetivo|adjetivo calificativo", "porque": "<b>Adjetivo<\/b>: pregunta 1, cambia de género y número —<i>harta<\/i>, <i>hartos<\/i>— y expresa cómo estaba el sujeto"}, {"enun": "Vino <i>hacia<\/i> nosotros sin decir nada.", "sol": "preposición", "porque": "<b>Preposición<\/b>: pregunta 3, y además está en la lista cerrada"}, {"enun": "Las persianas están <i>medio<\/i> bajadas.", "sol": "adverbio", "porque": "<b>Adverbio<\/b>: modifica a <i>bajadas<\/i> y no concuerda con <i>persianas<\/i>; ⊗<i>medias bajadas<\/i> es falta"}, {"enun": "En esta empresa se trabaja <i>duro<\/i>.", "sol": "adverbio|adverbio de modo", "porque": "<b>Adverbio<\/b> de modo: expresa cómo se trabaja y no cambia de forma, mientras que el adjetivo <i>duro<\/i> de <i>un trabajo duro<\/i> sí cambia en <i>unos trabajos duros<\/i>"}, {"enun": "Firmó el contrato <i>aunque<\/i> no le convencía.", "sol": "conjunción|conjunción concesiva", "porque": "<b>Conjunción<\/b> concesiva: pregunta 3, mete una oración dentro de otra y se sustituye por <i>a pesar de que<\/i>"}, {"enun": "<i>Según<\/i> el convenio, le tocan dos pagas.", "sol": "preposición", "porque": "<b>Preposición<\/b>: pregunta 3, va delante de su complemento <i>el convenio<\/i> y forma grupo con él"}, {"enun": "No cobró, <i>pues<\/i> la nómina llegó tarde.", "sol": "conjunción|conjunción causal", "porque": "<b>Conjunción<\/b> causal: se sustituye por <i>porque<\/i>"}, {"enun": "<i>Aquello<\/i> se resolvió en una semana.", "sol": "pronombre|pronombre demostrativo", "porque": "<b>Pronombre<\/b> demostrativo: va solo y ocupa el lugar de todo un asunto ya nombrado"}], "criterio": "Se corrige también la tilde de la clase: <i>preposición<\/i>, <i>conjunción<\/i> e <i>interjección<\/i> la llevan; <i>adjetivo<\/i> y <i>adverbio<\/i> no.", "apoyo": ["2 · La categoría de una palabra en su oración", "Cuando el enunciado llama adjetivo a un determinante"], "dossier_txt": "Del dossier: pieza 6, ejercicio 4"}, {"tipo": "hueco", "titulo": "La misma palabra, dos clases", "dossier": {"cuaderno": "6", "ejercicio": 5}, "ayuda": "Cinco palabras, cada una en un par de oraciones. Escribe la clase de la palabra en cursiva en cada oración: una de las nueve clases o, si la palabra forma grupo con la siguiente, <i>locución preposicional<\/i>.", "estricto": true, "items": [{"enun": "Trabaja <i>bien<\/i>.", "sol": "adverbio|adverbio de modo", "porque": "adverbio de modo: expresa cómo trabaja"}, {"enun": "Iremos <i>bien<\/i> en tren, <i>bien<\/i> en autobús.", "sol": "conjunción", "porque": "viene por parejas y se sustituye por <i>o… o<\/i>"}, {"enun": "<i>Aun<\/i> así, firmé.", "sol": "adverbio", "porque": "equivale a <i>incluso<\/i>"}, {"enun": "No ha llegado <i>aún<\/i>.", "sol": "adverbio|adverbio de tiempo", "porque": "adverbio de tiempo: equivale a <i>todavía<\/i>; entre las dos lo que cambia es la tilde, que se estudia en la pieza 3"}, {"enun": "Vino <i>luego<\/i> de comer.", "sol": "locución preposicional", "porque": "locución preposicional: <i>luego de<\/i> son dos palabras que juntas llevan su complemento detrás, y la clase es la del grupo entero"}, {"enun": "Primero firma; <i>luego<\/i> ya reclamas.", "sol": "adverbio|adverbio de tiempo", "porque": "adverbio de tiempo"}, {"enun": "Lo dejó <i>bajo<\/i> la puerta.", "sol": "preposición", "porque": "va delante de su complemento, <i>la puerta<\/i>"}, {"enun": "Habla muy <i>bajo<\/i>.", "sol": "adverbio|adverbio de modo", "porque": "adverbio de modo, y admite <i>muy<\/i> delante"}, {"enun": "Me quedé <i>solo<\/i> en la oficina.", "sol": "adjetivo", "porque": "concuerda con el sujeto: <i>me quedé sola<\/i>"}, {"enun": "<i>Solo<\/i> me quedé media hora.", "sol": "adverbio", "porque": "equivale a <i>solamente<\/i> y no cambia de forma"}], "criterio": "Se corrige también la tilde de la clase: <i>preposición<\/i>, <i>conjunción<\/i> e <i>interjección<\/i> la llevan; <i>adjetivo<\/i> y <i>adverbio<\/i> no.", "apoyo": ["Las tres fronteras que más se fallan"], "dossier_txt": "Del dossier: pieza 6, ejercicio 5"}, {"tipo": "abierta", "titulo": "Una oración con cada clase", "dossier": {"cuaderno": "6", "ejercicio": 6}, "ayuda": "Escribe una oración con cada palabra haciendo de la clase que se pide. La clave da un modelo por ítem; cualquier oración en la que la palabra haga de esa clase es válida.", "items": [{"enun": "<i>mucho<\/i> como determinante", "modelo": "«Había <b>mucho<\/b> polvo en el almacén.»"}, {"enun": "<i>mucho<\/i> como adverbio", "modelo": "«Ese mes se trabajó <b>mucho<\/b>.»"}, {"enun": "<i>este<\/i> como determinante", "modelo": "«<b>Este<\/b> documental acaba a las diez.»"}, {"enun": "<i>este<\/i> como pronombre", "modelo": "«De los dos documentales, <b>este<\/b> es el peor.»"}, {"enun": "<i>que<\/i> como conjunción", "modelo": "«Dijo <b>que<\/b> no firmaba.»"}, {"enun": "<i>que<\/i> como pronombre relativo", "modelo": "«La vacuna <b>que<\/b> le pusieron caduca en marzo.»"}, {"enun": "<i>hasta<\/i> como preposición", "modelo": "«Esperó <b>hasta<\/b> las nueve.»"}, {"enun": "<i>hasta<\/i> como adverbio (= <i>incluso<\/i>)", "modelo": "«<b>Hasta<\/b> el conductor se quejó.»"}], "apoyo": ["2 · La categoría de una palabra en su oración", "Los cuatro ítems resueltos"], "dossier_txt": "Del dossier: pieza 6, ejercicio 6"}, {"tipo": "opcion", "titulo": "En el formato del examen: cuatro reales y ocho propios", "ayuda": "Doce ítems con cuatro opciones. Los cuatro con chapa de año son literales del examen, con sus opciones y su respuesta oficial; los ocho sin chapa están escritos en el mismo formato. En cada uno, aplica el método entero antes de elegir.", "items": [{"enun": "¿A qué categoría gramatical pertenece la palabra <i>ya<\/i> en la oración «Aquel director <b>ya<\/b> no quería ni oír los rumores de la orquesta»?", "conv": "2015s", "ops": ["Adverbio", "Pronombre", "Adjetivo", "Conjunción"], "sol": "Adverbio", "porque": "no cambia de forma, no lleva sustantivo al lado y no une nada: modifica a <i>quería<\/i> e indica cuándo"}, {"enun": "¿Qué clase de palabra es <i>aun<\/i> en la oración «A veces, <b>aun<\/b> queriendo solucionar los problemas del inversor, no pueden hacerlo por falta de recursos»?", "conv": "2017t", "ops": ["Preposición", "Adverbio", "Conjunción", "Adjetivo"], "sol": "Adverbio", "porque": "equivale a <i>incluso<\/i>: «incluso queriendo solucionarlo»"}, {"enun": "Indique cuál es la categoría gramatical de <i>aun<\/i> en la siguiente oración: «Con disciplina se puede crear un estado de relajación en el que es posible soñar <b>aun<\/b> despierto».", "conv": "2017s", "ops": ["Adverbio", "Pronombre", "Conjunción", "Adjetivo"], "sol": "Adverbio", "porque": "la misma equivalencia, «soñar incluso despierto»: el tribunal preguntó <i>aun<\/i> dos veces en dos oraciones distintas y la respuesta fue la misma las dos veces"}, {"enun": "Indique la categoría gramatical de <i>bien<\/i> en la siguiente oración: «En breve nos comunicaremos con usted, <b>bien<\/b> por correo, <b>bien<\/b> por teléfono».", "conv": "2018t", "ops": ["Adjetivo", "Adverbio", "Conjunción", "Preposición"], "sol": "Conjunción", "porque": "viene repetido y por parejas, presentando dos alternativas, y se puede cambiar por <i>o… o<\/i>: «o por correo, o por teléfono». Es el único caso de los doce en que la respuesta obvia falla"}, {"enun": "¿Qué clase de palabra es <i>alguien<\/i> en la oración «¿Ha llamado <b>alguien<\/b> esta mañana?»?", "ops": ["Pronombre", "Determinante", "Adverbio", "Sustantivo"], "sol": "Pronombre", "porque": "va solo, ocupa el sitio de un sustantivo y hace de sujeto de <i>ha llamado<\/i>"}, {"enun": "Indique la categoría gramatical de <i>entre<\/i> en la oración «Nos vemos <b>entre<\/b> semana».", "ops": ["Adverbio", "Conjunción", "Preposición", "Determinante"], "sol": "Preposición", "porque": "va delante de su complemento, <i>semana<\/i>, y forma grupo con él; quitarla deja un hueco"}, {"enun": "¿A qué categoría gramatical pertenece <i>cerca<\/i> en la oración «La parada queda <b>cerca<\/b>»?", "ops": ["Adverbio", "Preposición", "Adjetivo", "Sustantivo"], "sol": "Adverbio", "porque": "indica dónde queda la parada, no lleva complemento detrás y no cambia de forma"}, {"enun": "¿Qué clase de palabra es <i>hacia<\/i> en la oración «Salió <b>hacia<\/b> la estación a las seis»?", "ops": ["Adverbio", "Conjunción", "Adjetivo", "Preposición"], "sol": "Preposición", "porque": "lleva detrás su complemento, <i>la estación<\/i>, y está en la lista cerrada"}, {"enun": "Indique la categoría gramatical de <i>varios<\/i> en la oración «Cambiaron <b>varios<\/b> contadores del edificio».", "ops": ["Pronombre", "Determinante", "Adjetivo", "Adverbio"], "sol": "Determinante", "porque": "acompaña a <i>contadores<\/i> y concuerda con él en masculino plural; solo, sin sustantivo, sería pronombre"}, {"enun": "¿Qué clase de palabra es <i>mañana<\/i> en la oración «<b>Mañana<\/b> firmamos el contrato»?", "ops": ["Adverbio", "Sustantivo", "Adjetivo", "Preposición"], "sol": "Adverbio", "porque": "indica cuándo se firma y no cambia de forma; como sustantivo llevaría determinante, <i>la mañana del lunes<\/i>"}, {"enun": "Indique la categoría gramatical de <i>harto<\/i> en la oración «Estaba <b>harto<\/b> de pagar dos alquileres».", "ops": ["Adverbio", "Determinante", "Adjetivo", "Pronombre"], "sol": "Adjetivo", "porque": "cambia de género y de número —<i>harta<\/i>, <i>hartos<\/i>— y expresa cómo estaba el sujeto"}, {"enun": "¿A qué categoría gramatical pertenece <i>rápido<\/i> en la oración «Conduce <b>rápido<\/b> cuando llega tarde»?", "ops": ["Adjetivo", "Sustantivo", "Determinante", "Adverbio"], "sol": "Adverbio", "porque": "modifica a <i>conduce<\/i> y se queda igual con otro sujeto: <i>conducen rápido<\/i>, no ⊗<i>rápidos<\/i>"}], "criterio": "Seis de las doce respuestas son <i>adverbio<\/i>, y en el examen real son diez de doce. Las otras seis están puestas para lo que el tribunal hace con <i>bien… bien<\/i> y con <i>hacia<\/i>: comprobar que se ha leído la oración y no solo la palabra. La posición de la respuesta no significa nada, y los dos ítems reales de <i>aun<\/i> lo muestran: la misma respuesta está en la b) en uno y en la a) en el otro.", "apoyo": ["2 · La categoría de una palabra en su oración"], "solo_web": true}, {"tipo": "hueco", "titulo": "Cuatro parejas más: la misma palabra, dos clases", "ayuda": "Ocho oraciones, por parejas: la misma palabra en negrita con dos clases distintas. Escribe el nombre de la clase.", "items": [{"enun": "Trabaja <b>bien<\/b> con los compañeros.", "sol": "adverbio", "porque": "expresa cómo trabaja y no cambia de forma"}, {"enun": "Iremos <b>bien<\/b> en tren, <b>bien<\/b> en autobús.", "sol": "conjunción", "porque": "por parejas, presentando dos alternativas: se cambia por <i>o… o<\/i>"}, {"enun": "Es un trabajo <b>duro<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>trabajo<\/i>: <i>unos trabajos duros<\/i>"}, {"enun": "Aquí se trabaja <b>duro<\/b>.", "sol": "adverbio", "porque": "modifica al verbo y no cambia: <i>aquí trabajan duro<\/i>"}, {"enun": "Metió la carta en el <b>sobre<\/b>.", "sol": "sustantivo", "porque": "lleva artículo delante y admite plural, <i>los sobres<\/i>"}, {"enun": "Dejó las llaves <b>sobre<\/b> la mesa.", "sol": "preposición", "porque": "va delante de su complemento, <i>la mesa<\/i>, y está en la lista cerrada"}, {"enun": "Hoy el cielo está <b>claro<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>cielo<\/i>: <i>una tarde clara<\/i>"}, {"enun": "Habla <b>claro<\/b> cuando explica.", "sol": "adverbio", "porque": "expresa cómo habla y se queda igual con sujeto femenino: <i>ella habla claro<\/i>"}], "criterio": "Cuatro palabras en ocho oraciones, y en cada pareja la clase la fija lo que la palabra tiene al lado: con <i>bien<\/i> y con <i>duro<\/i> se decide con la sustitución y el plural; con <i>sobre<\/i>, con el artículo delante o el complemento detrás. Al escribir el nombre de la clase se corrige también la ortografía: <i>preposición<\/i> y <i>conjunción<\/i> llevan tilde, y <i>adjetivo<\/i> no.", "apoyo": ["2 · La categoría de una palabra en su oración"], "solo_web": true}, {"tipo": "hueco", "titulo": "Muy o mucho", "ayuda": "Seis frases. Escribe la palabra que falta: <i>muy<\/i> delante de adjetivo o adverbio, <i>mucho<\/i> con el verbo y delante de los comparativos.", "items": [{"enun": "Está ______ cansado después del turno.", "sol": "muy", "porque": "delante del adjetivo <i>cansado<\/i>"}, {"enun": "Trabaja ______ desde que cambió de empresa.", "sol": "mucho", "porque": "acompaña al verbo <i>trabaja<\/i>"}, {"enun": "El piso nuevo está ______ mejor situado.", "sol": "mucho", "porque": "delante del comparativo <i>mejor<\/i>"}, {"enun": "Vive ______ lejos de la parada.", "sol": "muy", "porque": "delante del adverbio <i>lejos<\/i>"}, {"enun": "Tiene ______ trabajo esta semana.", "sol": "mucho", "porque": "acompaña al sustantivo <i>trabajo<\/i> y concuerda con él: <i>mucha faena<\/i>"}, {"enun": "Duerme ______ poco entre turno y turno.", "sol": "muy", "porque": "delante del adverbio <i>poco<\/i>"}], "criterio": "Las seis se deciden por la palabra que viene detrás. La que más se falla es la del comparativo: ⊗<i>muy mejor<\/i> es una falta en la redacción, y se escribe <i>mucho mejor<\/i> porque <i>mejor<\/i> ya lleva dentro el <i>más<\/i>.", "apoyo": ["2 · La categoría de una palabra en su oración"], "solo_web": true}, {"tipo": "abierta", "titulo": "Explícalo con la prueba", "ayuda": "Dos o tres líneas por pregunta. Nombra la prueba que decide y aplícala a las dos oraciones.", "items": [{"enun": "¿Por qué <i>bien<\/i> es conjunción en «bien por correo, bien por teléfono» y adverbio en «trabaja bien»?", "modelo": "En «trabaja bien» la palabra modifica al verbo, expresa cómo se trabaja y no cambia de forma: adverbio. En «bien por correo, bien por teléfono» viene repetida y por parejas, une dos alternativas del mismo rango y admite el cambio por <i>o… o<\/i> —«o por correo, o por teléfono»— sin que la oración se rompa: conjunción. La prueba es la sustitución por otra conjunción."}, {"enun": "En «Lo entiende <i>incluso<\/i> quien no ha estudiado nunca», ¿cómo decides entre adverbio y preposición?", "modelo": "Con la prueba del complemento. Una preposición forma grupo con lo que lleva detrás, como <i>hacia<\/i> en «salió hacia la estación». <i>Incluso<\/i> no forma grupo con lo que sigue: <i>quien no ha estudiado nunca<\/i> es el sujeto de <i>entiende<\/i>, y un sujeto no va detrás de una preposición. Es adverbio. Quitar la palabra no decide la clase: «miró el cielo» se sostiene sin <i>hacia<\/i>, y <i>hacia<\/i> es preposición."}], "criterio": "Una explicación completa nombra la prueba —la sustitución o el complemento—, la aplica a las dos oraciones y señala qué resultado da en cada una. La que solo afirma «una une y la otra no» repite la definición sin comprobarla sobre la oración.", "apoyo": ["Las tres fronteras que más se fallan"], "solo_web": true}], "cuaderno": {"pieza": 6, "apartados": [2], "ejercicios": [4, 5, 6]}, "cuaderno_txt": "Pieza 6 · Las nueve clases y la categoría de una palabra en su oración — apartado 2: La categoría de una palabra en su oración (p. 154) · ejercicios 4, 5 y 6", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto del carril B está inventado para practicar.", "revision": "2026-09-24"};</script>

    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
