<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 19 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 19, "fecha": "2026-12-01", "tab": "Día 19 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 1 de diciembre", "sub": "El quinto set propio y los verbos de 2019t · el comentario de 2026s entero y con reloj, con el título y el resumen · la tanda de perífrasis", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 5 · la segunda tanda de verbos", "meta": "20 minutos · dos hiatos con la cerrada detrás, una llana en -m y un monosílabo; los cinco verbos de 2019t", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los ocho sets propios<\/h3>\n<p>Escritos en el formato real —ocho palabras sueltas, sin indicar cuántas llevan tilde— y con palabras que no aparecen en ninguno de los diez ejercicios del censo, para no gastar ningún set real.<\/p>\n<p><strong>La proporción cambia de un set a otro, como en el examen.<\/strong> En los diez sets reales, ocho traen cinco palabras con tilde y tres sin ella, uno las reparte cuatro y cuatro, y otro trae cinco de siete. Aquí pasa lo mismo: seis sets van cinco y tres, uno cuatro y cuatro y otro seis y dos. Quien se corrija contando en lugar de aplicar la regla acertará unas veces y fallará otras.<\/p>\n<p>Los cuatro primeros practican las tres reglas y las excepciones; los cuatro últimos incorporan hiatos, que son el grupo más numeroso del examen.<\/p>\n<h3>Los cinco verbos, desde el 24 de noviembre<\/h3>\n<p>Dieciséis formas verbales que han caído en cinco exámenes, de 2017 a 2021, repartidas en tandas. Se dicta el infinitivo y lo que se pide —primera persona, participio o gerundio—, se escriben las cinco y se corrigen en el acto. La explicación de cada irregularidad está en la pieza 9.<\/p>\n<p><strong>Tres respuestas con explicación propia:<\/strong> <em>corrompido<\/em> es regular aunque <em>romper<\/em> dé <em>roto<\/em>; <em>cuezo<\/em> lleva <em>z<\/em> porque la <em>c<\/em> delante de <em>o<\/em> sonaría distinto; y <em>yerro<\/em> y <em>yergo<\/em> empiezan por <em>y<\/em>.<\/p>\n<blockquote>\n<p><strong>Para el segundo trimestre<\/strong>, cuando estas cuatro tandas ya se hayan dado, las siguientes salen del anexo A-4, que reúne verbos irregulares que no están en estas cuatro tandas.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 5: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>ataud<\/i>", "sol": "ataúd", "porque": "hiato: <i>a-ta-úd<\/i>, la <i>ú<\/i> tónica junto a la <i>a<\/i>"}, {"enun": "<i>increible<\/i>", "sol": "increíble", "porque": "hiato: <i>in-cre-í-ble<\/i>"}, {"enun": "<i>compas<\/i>", "sol": "compás", "porque": "aguda acabada en -s"}, {"enun": "<i>album<\/i>", "sol": "álbum", "porque": "llana acabada en -m"}, {"enun": "<i>murcielago<\/i>", "sol": "murciélago", "porque": "esdrújula: <i>mur-cié-la-go<\/i>"}, {"enun": "<i>origen<\/i>", "sol": "origen", "porque": "llana acabada en -n; el plural <i>orígenes<\/i> sí lleva"}, {"enun": "<i>fue<\/i>", "sol": "fue", "porque": "monosílabo"}, {"enun": "<i>cartel<\/i>", "sol": "cartel", "porque": "aguda acabada en -l"}], "criterio": "Llevan tilde cinco de las ocho: dos hiatos, una aguda en -s, una llana en -m y una esdrújula. Los señuelos son una llana en -n, un monosílabo y una aguda en -l, los tres tipos que ponen los sets reales.", "apoyo": ["Los ocho sets propios"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set propio 5"}, "dossier_txt": "Del dossier: anexo A-3 · Set propio 5"}, {"tipo": "hueco", "titulo": "Los cinco verbos: la tanda de 2019t", "ayuda": "Los cinco de 2019t, con su clave oficial. Escribe la primera persona del singular del presente de indicativo, con la ortografía de la forma.", "items": [{"enun": "<i>empezar<\/i>", "conv": "2019t", "sol": "empiezo", "porque": "e → ie"}, {"enun": "<i>herir<\/i>", "conv": "2019t", "sol": "hiero", "porque": "e → ie"}, {"enun": "<i>nacer<\/i>", "conv": "2019t", "sol": "nazco", "porque": "c → zc"}, {"enun": "<i>competir<\/i>", "conv": "2019t", "sol": "compito", "porque": "e → i"}, {"enun": "<i>erguir<\/i>", "conv": "2019t", "sol": "yergo|irgo", "porque": "la clave admite las dos"}], "criterio": "Cuatro familias en cinco verbos. Los dos fallos de ortografía que cuentan como forma fallada: <i>nazco<\/i> con <i>zc<\/i> y <i>yergo<\/i> con <i>y<\/i>.", "apoyo": ["Los cinco verbos, desde el 24 de noviembre"], "dossier": {"cuaderno": "A-3", "ejercicio": "Los cinco verbos · tanda 2"}, "dossier_txt": "Del dossier: anexo A-3 · Los cinco verbos · tanda 2"}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El tercer comentario, entero y con reloj", "meta": "60 minutos · el comentario de 2026s en el carril «El texto»: test, las tres preguntas y la redacción larga, escrita en clase; el reparto del tiempo", "teoria": "<h3>3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>\n<h3>8 · Las tres preguntas fijas del comentario<\/h3>\n<p><strong>En el examen.<\/strong> El bloque 2 del comentario son <strong>3 puntos<\/strong> y trae <strong>las mismas tres preguntas en las seis convocatorias<\/strong>, en el mismo orden: proponer un título, resumir un párrafo delimitado y explicar una frase. Cada una vale 1 punto, ocupa <strong>de una a cinco líneas<\/strong> y, según los criterios, «admite fracciones en la puntuación (0,25, 0,5, 0,75) en función de la precisión de la respuesta».<\/p>\n<p>Y sobre las tres pesa la instrucción que recoge el apartado 6 de la pieza 10: <strong>reproducir frases del original se considera incorrecto<\/strong>.<\/p>\n<h4>8.1 · Proponer un título<\/h4>\n<p>Llengua castellana lo pidió una vez, en 2016, con un enunciado que detalla lo que se espera:<\/p>\n<blockquote>\n<p>«Proponga un título (y, si quiere, un subtítulo) para el texto. <strong>La propuesta no debe coincidir con el título del artículo<\/strong> y tiene que recoger debidamente el contenido del fragmento reproducido.»<\/p>\n<p>La clave da dos y admite otros equivalentes: <em>Las relaciones personales en internet<\/em> / <em>Influencia de las redes sociales en las relaciones interpersonales<\/em> / etc.<\/p>\n<\/blockquote>\n<p><strong>Los dos títulos que da la clave son sintagmas nominales<\/strong>, y los tres que acepta la de 2024s también: ninguno lleva verbo conjugado y todos nombran el tema del texto entero. Es el formato más frecuente y el más seguro, y el enunciado no lo exige: pide que el título no coincida con el del artículo y que recoja el contenido del fragmento. Un título con verbo que cumpla los dos requisitos sirve, y además recoge la tesis con más precisión que un sintagma nominal: el sintagma nombra el tema y la oración afirma algo sobre él.<\/p>\n<table>\n<thead>\n<tr>\n<th>sirve<\/th>\n<th>no sirve<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>El valor de la lectura<\/em><\/td>\n<td><em>Leer es bueno<\/em><\/td>\n<td>el segundo es la opinión de quien escribe, y el título recoge el contenido del texto<\/td>\n<\/tr>\n<tr>\n<td><em>Las redes sociales y la imagen que damos<\/em><\/td>\n<td><em>Internet<\/em><\/td>\n<td>demasiado ancho: vale para cualquier texto sobre la red y no distingue <strong>este<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>La discusión sobre si leer mejora a las personas<\/em><\/td>\n<td><em>Mi opinión sobre la lectura<\/em><\/td>\n<td>el título es del texto, no tuyo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres comprobaciones antes de darlo por bueno:<\/strong> que no repita el título original, que abarque el texto entero —no solo el primer párrafo— y que recoja el contenido del texto y no la opinión de quien lo escribe. Que lleve verbo conjugado no lo invalida.<\/p>\n<h4>8.2 · Resumir un párrafo delimitado<\/h4>\n<p>El enunciado marca el párrafo con <strong>su primera y su última palabra<\/strong>: «desde <em>Negar el valor<\/em> hasta <em>como la soberbia<\/em>». El párrafo cambia de una convocatoria a otra; la tarea, no.<\/p>\n<p>Llengua castellana pidió exactamente esto en 2015, y su clave sirve de modelo:<\/p>\n<blockquote>\n<p><strong>Enunciado:<\/strong> «Sintetice el párrafo inicial del texto: <em>El niño, inquieto ante esta noche tan diferente, […] le arranca la palabra tantas veces oída<\/em>.»<\/p>\n<p><strong>Clave:<\/strong> «En este párrafo el niño intuye instintivamente, a partir de una serie signos, que algo terrible le está sucediendo a su abuelo, lo que le lleva a pronunciar el apelativo con el que siempre se ha referido a él.»<\/p>\n<\/blockquote>\n<p><strong>Esa respuesta cumple cuatro condiciones<\/strong>, y las cuatro sirven para el resumen del comentario:<\/p>\n<ol>\n<li><strong>Treinta y nueve palabras<\/strong>, tres líneas. Se reproduce tal cual, con el <em>de<\/em> que le falta en «una serie signos».<\/li>\n<li><strong>Recoge qué pasa, por qué y con qué consecuencia<\/strong>: intuye · a partir de unos signos · y por eso pronuncia el nombre.<\/li>\n<li><strong>No repite ni una secuencia del original.<\/strong> Donde el texto escribe <em>inquieto ante esta noche tan diferente<\/em>, la respuesta pone <em>intuye instintivamente<\/em>. En esa sustitución aparecen a la vez los tres pasos del apartado 6 de la pieza 10.<\/li>\n<li><strong>Empieza por «En este párrafo…»<\/strong>, que sitúa la respuesta sin gastar media línea en metadiscurso.<\/li>\n<\/ol>\n<p><strong>Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado.<\/strong> El enunciado delimita con dos palabras para evitarlo: lo que queda fuera de esas dos palabras no entra en el resumen.<\/p>\n<p><strong>Antes de resumir, se comprueba si el párrafo defiende algo o describe algo,<\/strong> y el resumen se escribe de la misma clase. El párrafo que manda resumir la 2.2 del comentario de 2026s no tiene tesis: describe cómo se va borrando la frontera entre el pensamiento propio y el acceso a la información digital, y la respuesta de la clave describe ese proceso. Un resumen que le pone una tesis a un párrafo descriptivo atribuye al texto una idea que no está en él, y los criterios puntúan esta pregunta por la precisión de la respuesta.<\/p>\n<h4>8.3 · Explicar una frase relacionándola con la argumentación<\/h4>\n<p>El enunciado entrecomilla una frase o un concepto del texto y pide explicarlo <strong>atándolo a lo que el texto defiende<\/strong>. Las palabras <em>relacionándola con la argumentación<\/em> deciden el punto: una paráfrasis de la frase, por buena que sea, deja sin contestar la mitad del enunciado si no explica para qué está esa frase en ese texto.<\/p>\n<p>La primera mitad —qué significa la expresión— ya la preguntaba Llengua castellana en 2016, en una pregunta de comprensión de 0,5 sobre «¿Somos lo que parecemos ser en internet?», el primer texto del trimestre:<\/p>\n<blockquote>\n<p><strong>Enunciado (2016t, 1.5):<\/strong> «Indique a qué idea del texto se refiere el autor con la expresión <em>idílica idea<\/em>.»<\/p>\n<p><strong>Clave oficial:<\/strong> «Contamos lo mejor de nosotros mismos (‘maquillamos’ nuestra identidad) solo en la red (en internet), y no en el contacto personal (cara a cara).»<\/p>\n<\/blockquote>\n<p>Esa pregunta se contesta entera con la paráfrasis, y la paráfrasis ya tiene dos partes: qué hacemos —<em>contamos lo mejor de nosotros mismos<\/em>— y dónde —<em>solo en la red, y no en el contacto personal<\/em>—. La 2.3 del comentario pide además la segunda mitad, <strong>qué función cumple la frase en el argumento del texto<\/strong>. En el texto de 2016, la <em>idílica idea<\/em> es la creencia que el autor discute: la nombra para rebatirla con los datos de la investigación psicológica, y una respuesta de comentario lo escribiría en su segunda frase.<\/p>\n<p><strong>El formato que funciona, en dos frases:<\/strong><\/p>\n<blockquote>\n<p><em>La expresión significa [qué].<\/em> · <em>El autor la usa para [qué defiende con ella].<\/em><\/p>\n<\/blockquote>\n<p>Y el error simétrico del 8.2: <strong>explicar la frase por su cuenta, como si fuera una definición de diccionario<\/strong>, sin indicar para qué está en ese texto. El enunciado exige «relacionándola con la argumentación», y esas tres palabras piden la segunda frase.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Sirve como título?", "ops": ["nombra el tema entero", "nombra solo un párrafo", "opina", "es una frase con verbo"], "ayuda": "Ocho títulos propuestos para el ensayo de Irene Vallejo que se ha leído hoy. Señala cuál cumple y qué le pasa a cada uno de los otros.", "items": [{"enun": "«Los recelos de Sócrates ante la escritura»", "sol": "nombra solo un párrafo", "porque": "la escena que abre el ensayo, sin Internet ni la memoria transactiva"}, {"enun": "«Internet nos está volviendo unos ignorantes»", "sol": "opina", "porque": "toma partido por uno de los dos bandos que el texto presenta, y además lleva verbo"}, {"enun": "«La memoria, de los libros a Internet»", "sol": "nombra el tema entero", "porque": "sintagma nominal, sin verbo, y recoge el recorrido del ensayo"}, {"enun": "«Wegner midió la capacidad de recordar de unos voluntarios»", "sol": "es una frase con verbo", "porque": "un título es un sintagma, no una oración, y esta cuenta un experimento suelto"}, {"enun": "«El efecto Google»", "sol": "nombra solo un párrafo", "porque": "el nombre de un fenómeno que ocupa cinco líneas del segundo párrafo"}, {"enun": "«Menos mal que todavía existen los libros»", "sol": "opina", "porque": "<i>menos mal<\/i> valora, y el texto deja abiertas las dos lecturas"}, {"enun": "«El saber guardado fuera de la mente humana»", "sol": "nombra el tema entero", "porque": "nombra lo que recorre el ensayo entero, de la escritura griega a la cibermemoria"}, {"enun": "«Borges pensaba que el libro es una extensión de la memoria»", "sol": "es una frase con verbo", "porque": "oración con verbo conjugado, y además recoge solo la cita del final"}], "criterio": "Se da por bueno un título que pase las tres comprobaciones: que no repita el del original, que abarque el texto entero y que no tome partido. El ensayo presenta dos maneras de enfocar el asunto y no elige ninguna, así que un título que elija deja fuera la mitad del texto.", "apoyo": ["8 · Las tres preguntas fijas del comentario"], "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: título y resumen", "ayuda": "Un título para cada texto y el resumen del párrafo pedido, de unas cuarenta palabras, empezando por «En este párrafo…» y sin copiar ninguna secuencia.", "items": [{"enun": "Proponga un título para el artículo de Vicente Fernández sobre el envejecimiento (página del día 15) y resuma su último párrafo, desde «Y algo similar ocurriría al contrario» hasta «pero no podemos librarnos de ambos».", "modelo": "Título: <i>Por qué el envejecimiento no se puede detener<\/i>, o <i>La trampa de las terapias contra el envejecimiento<\/i>. Resumen: «En este párrafo se explica que el mecanismo funciona también al revés: quitar las células que pueden volverse cancerígenas hace que se acumulen las inactivas, así que cualquier camino sale mal, y los investigadores concluyen que se puede atacar uno de los dos factores, pero no los dos.» Cuarenta y ocho palabras, sin ninguna secuencia del original."}, {"enun": "Proponga un título para el ensayo de hoy y resuma su tercer párrafo, desde «Más allá de ciertos límites» hasta «el pez plátano».", "modelo": "Título: <i>La memoria, de los libros a Internet<\/i>. Resumen: «En este párrafo se sostiene que ampliar el recuerdo por encima de cierto punto ya solo es posible con máquinas, que el límite entre la mente y la red se difumina y que basta con poder localizar un dato para creer que se sabe, como muestra quien consulta el móvil en mitad de una conversación.» Cincuenta y dos palabras, sin ninguna secuencia del original."}], "criterio": "El título se corrige con las tres condiciones: sintagma sin verbo, tema entero, sin opinión. El resumen, con los cuatro rasgos, y en cuartos: un resumen que copie «no podemos librarnos de ambos» se considera incorrecto en esa parte.", "apoyo": ["8 · Las tres preguntas fijas del comentario"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [3, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 8: Las dos rúbricas, banda por banda; Las tres preguntas fijas del comentario (p. 66 y 78)", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "El libro y la memoria · Comentari de text 2026, tribunal especial", "meta": "Convocatoria 2026, tribunal especial · 652 palabras · el tercer examen de comentario, entero y con reloj: test, las tres preguntas y la redacción larga", "literal": true, "teoria": "<h3>9 · Comentari de text 2026, tribunal especial · el libro y la memoria<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Irene Vallejo, <em>El infinito en un junco<\/em> (Siruela, 2019), pp. 124-126, adaptado<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>ensayo de divulgación, 648 palabras el cuerpo castellano<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Comentari de text 2026, tribunal especial; el texto castellano, en el cuaderno de textos de cada sesión (texto 9); la clave está redactada en catalán<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>1 de diciembre · <strong>comentario entero en clase<\/strong>: test, las tres preguntas y la redacción larga<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto cierra el trimestre.<\/strong> Es el más largo de los tres y el más reciente, y su bloque 1 tiene dos preguntas de definición de concepto —el «efecto Google» y la memoria transactiva— que obligan a leer despacio dos pasajes concretos. Con él se hace el primer comentario completo con el reloj.<\/p>", "lectura": {"titulo": "El libro y la memoria", "entrada": "Irene Vallejo · <i>El infinito en un junco<\/i> (Madrid: Siruela, 2019, pp. 124-126) · adaptación, tal como la reproduce el cuadernillo de Comentari de text de 2026 (tribunal especial), versión castellana.", "lineas": ["En la época de Sócrates, los textos escritos aún no eran una", "herramienta habitual y todavía despertaban recelos. Los", "consideraban un sucedáneo de la palabra oral —liviana, alada,", "sagrada—. Aunque la Atenas del siglo v a. C. ya contaba con un", "incipiente comercio de libros, no sería hasta un siglo", "después, en tiempos de Aristóteles, cuando se llegase a", "contemplar sin extrañeza el hábito de leer. Para Sócrates, los", "libros eran ayudas de la memoria y el conocimiento, pero", "pensaba que los verdaderos sabios harían bien en desconfiar de", "ellos. Sócrates temía que, por culpa de la escritura, los", "hombres abandonasen el esfuerzo de la propia reflexión.", "Sospechaba que, gracias al auxilio de las letras, se confiaría", "el saber a los textos y, sin el empeño de comprenderlos a", "fondo, bastaría con tenerlos al alcance de la mano. Y así ya", "no sería sabiduría propia, incorporada a nosotros e indeleble,", "parte del bagaje de cada uno, sino un apéndice ajeno. El", "argumento es agudo, y todavía nos impacta. Ahora mismo estamos", "inmersos en una transición tan radical como la alfabetización", "griega. Internet está cambiando el uso de la memoria y la", "mecánica misma del saber. Un experimento realizado en 2011 por", "D. M. Wegner, pionero de la psicología social, midió la", "capacidad de recordar de unos voluntarios. Solo la mitad de", "ellos sabían que los datos a retener eran guardados en un", "ordenador. Quienes pensaron que la información quedaba grabada", "relajaron el esfuerzo por aprenderla. Los científicos", "denominan «efecto Google» a este fenómeno de relajación", "memorística. Tendemos a recordar mejor dónde se alberga un", "dato que el propio dato. Es evidente que el conocimiento", "disponible es mayor que nunca, pero casi todo se almacena", "fuera de nuestra mente.", "", "Más allá de ciertos límites, la única posibilidad de expandir", "nuestra memoria depende de la tecnología. Esas", "transformaciones son a la vez peligrosas y fascinantes. La", "línea que separa nuestras mentes de Internet se está volviendo", "cada vez más borrosa. Se ha instalado entre nosotros la", "impresión de que sabemos todo aquello que podemos localizar", "gracias a Google. Cuando se reúne un grupo de gente, suele", "haber alguien que se lanza a comprobar los datos de la", "conversación con su teléfono inteligente. Se zambulle en la", "pantalla como un ave acuática y, tras una consulta rápida,", "emerge con el pez en el pico, aclarando todas las dudas sobre", "el nombre de aquel actor o cuáles son los días perfectos para", "pescar el pez plátano.", "", "Tras sus experimentos desde los años ochenta en adelante,", "Wegner piensa que si recordamos dónde encontrar informaciones", "importantes, incluso sin retener el conocimiento concreto,", "estamos ampliando las fronteras de nuestro territorio mental.", "Es el fundamento de su teoría de la memoria transactiva. Según", "Wegner, nadie recuerda todo. Almacenamos información en las", "mentes de otros —a quienes podemos acudir a preguntar—, en los", "libros y en la gigantesca cibermemoria.", "", "El alfabeto fue una tecnología aún más revolucionaria que", "Internet. Construyó por primera vez esa memoria común,", "expandida y al alcance de todo el mundo. Ni el saber ni la", "literatura completa caben en una sola mente pero, gracias a", "los libros, cada uno de nosotros encuentra las puertas", "abiertas a todos los relatos y todos los conocimientos.", "Podemos pensar, como vaticinaba Sócrates, que nos hemos vuelto", "un puñado de engreídos ignorantes. O que, gracias a las", "letras, formamos parte del cerebro más grande y más", "inteligente que ha existido nunca. Borges, que pertenecía al", "grupo de los que piensan de la segunda manera, escribió: «De", "los diversos instrumentos del hombre, el más asombroso es, sin", "duda, el libro. Los demás son extensiones de su cuerpo. El", "microscopio y el telescopio son extensiones de su vista; el", "teléfono es extensión de la voz; luego tenemos el arado y la", "espada, extensiones de su brazo. Pero el libro es otra cosa:", "el libro es una extensión de la memoria y de la imaginación»."], "pie": "Adaptación de un fragmento de <i>El infinito en un junco<\/i>, de Irene Vallejo (Siruela, 2019), en la versión del cuadernillo oficial de la PAU +25 de 2026, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2026_general_comentari_de_text_suplent.pdf<\/i>, p. 4."}, "ejercicios": [{"tipo": "opcion", "titulo": "Bloque 1: las seis preguntas de test", "ayuda": "Literales, con su respuesta oficial. Quince minutos con la lectura. La 1.3 y la 1.4 preguntan por el mismo concepto, y en la 1.4 hay que rodear el «falsa».", "items": [{"enun": "<b>1.1<\/b> ¿Cuál es la principal intención de la autora con este texto?", "conv": "2026s", "ops": ["Resaltar el papel fundamental de los libros en la preservación del conocimiento.", "Explicar el concepto de «efecto Google».", "Comparar la memoria humana con la memoria de Internet.", "Criticar la falta de lectura en la sociedad actual."], "sol": "Resaltar el papel fundamental de los libros en la preservación del conocimiento.", "porque": "el texto expone y compara, sin criticar; el «efecto Google» es un ejemplo dentro del argumento, no la intención"}, {"enun": "<b>1.2<\/b> ¿Cuál es un sinónimo adecuado para la palabra <i>indeleble<\/i>, según su uso en el texto?", "conv": "2026s", "ops": ["Borrable.", "Permanente.", "Superficial.", "Temporal."], "sol": "Permanente.", "porque": "indeleble califica lo que no se puede borrar; las otras tres son antónimos o vecinas del antónimo"}, {"enun": "<b>1.3<\/b> ¿Qué se entiende por «efecto Google» según el texto?", "conv": "2026s", "ops": ["La habilidad de recordar mejor la información cuando se consulta en Internet.", "La tendencia a olvidar la información porque sabemos que podemos encontrarla fácilmente en Internet.", "El aumento de la capacidad memorística gracias a la tecnología digital.", "La capacidad de buscar información más rápidamente a través de motores de búsqueda."], "sol": "La tendencia a olvidar la información porque sabemos que podemos encontrarla fácilmente en Internet.", "porque": "definición de concepto: está en el pasaje del experimento, que habla de olvidar, no de recordar mejor"}, {"enun": "<b>1.4<\/b> Teniendo en cuenta lo que se defiende en el texto, ¿cuál de las siguientes afirmaciones es falsa?", "conv": "2026s", "ops": ["Sócrates desconfiaba de los libros porque temía que afectaran a la reflexión personal.", "La teoría de la memoria transactiva sostiene que compartimos información y la delegamos en otros y en herramientas externas.", "El alfabeto fue una tecnología más revolucionaria que Internet en cuanto a la expansión del conocimiento.", "El «efecto Google» demuestra que tendemos a recordar mejor los datos cuando sabemos que están almacenados en Internet."], "sol": "El «efecto Google» demuestra que tendemos a recordar mejor los datos cuando sabemos que están almacenados en Internet.", "porque": "la definición de la 1.3 al revés: <i>recordar mejor<\/i> donde el texto pone <i>olvidar<\/i>"}, {"enun": "<b>1.5<\/b> ¿Cuál era el principal temor de Sócrates respecto a los textos escritos, según el texto?", "conv": "2026s", "ops": ["Que los textos no tuvieran valor como herramienta de conocimiento.", "Que la escritura reemplazara completamente a la palabra oral.", "Que los textos permitieran a las personas adquirir sabiduría sin reflexionar profundamente.", "Que los libros se convirtieran en el único medio de transmisión de conocimiento."], "sol": "Que los textos permitieran a las personas adquirir sabiduría sin reflexionar profundamente.", "porque": "«temía que, por culpa de la escritura, los hombres abandonasen el esfuerzo de la propia reflexión»"}, {"enun": "<b>1.6<\/b> Según el texto, la teoría de la memoria transactiva de Wegner se refiere", "conv": "2026s", "ops": ["al hecho de que las personas delegan la labor de recordar cierto tipo de información en «memorias externas» (por ejemplo, en otras personas).", "a la capacidad de las personas para recordar únicamente información almacenada en su propia memoria.", "a la idea de que el conocimiento debe ser memorizado de manera individual para ser útil.", "a la tendencia a olvidar información importante si no se consulta con otras personas o fuentes externas."], "sol": "al hecho de que las personas delegan la labor de recordar cierto tipo de información en «memorias externas» (por ejemplo, en otras personas).", "porque": "la segunda definición de concepto del bloque: se lee el pasaje de Wegner despacio, que habla de delegar, no de olvidar"}], "criterio": "Dos definiciones de concepto, la 1.3 y la 1.6, que se contestan sobre el pasaje concreto y no de memoria; la 1.4 repite la 1.3 al revés; y la 1.1 pone tres opciones que critican donde el texto expone. Cada error descuenta 0,16: en las que quedan entre dos opciones, se vuelve al pasaje.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Bloque 2: las tres preguntas fijas", "ayuda": "De una a cinco líneas cada una, sin reproducir frases del original. Quince minutos: cinco por pregunta.", "items": [{"enun": "<b>2.1<\/b> Proponga un título que se adecúe al contenido del texto que acaba de leer.", "conv": "2026s", "modelo": "Clave oficial, traducida: <i>El papel fundamental de los libros en la construcción del conocimiento<\/i> · <i>La función de los libros en la evolución del saber humano<\/i> · <i>El impacto de los libros en la formación de la sabiduría colectiva<\/i> · <i>El libro como vehículo de la memoria en la era digital<\/i>. Cuatro sintagmas nominales sin verbo, y los cuatro nombran el texto entero, incluida la parte de internet."}, {"enun": "<b>2.2<\/b> Resuma el segundo párrafo del texto (es decir, desde «Más allá de ciertos límites» hasta «cuáles son los días perfectos para pescar el pez plátano»).", "conv": "2026s", "modelo": "Clave oficial, traducida: «La tecnología se ha vuelto esencial para ampliar nuestra capacidad de recordar, lo que presenta tanto oportunidades como riesgos. La frontera entre el pensamiento humano y el acceso a información digital es cada vez menos clara, y genera la sensación de que dominamos cualquier conocimiento disponible en línea. En las reuniones es frecuente que se usen los dispositivos móviles para verificar información, lo que crea la ilusión de tener respuestas inmediatas.» El párrafo describe un proceso y el resumen describe el mismo proceso, sin ponerle una tesis que el párrafo no tiene."}, {"enun": "<b>2.3<\/b> Explique, relacionándolo con la argumentación del texto, el siguiente fragmento: «De los diversos instrumentos del hombre, el más asombroso es, sin duda, el libro. […] el libro es una extensión de la memoria y de la imaginación».", "conv": "2026s", "modelo": "Clave oficial, traducida: «El fragmento destaca cómo los libros son herramientas fundamentales para el aprendizaje y la creatividad, ya que permiten almacenar el conocimiento y reflexionar sobre él. Los libros no solo transmiten datos, sino que también fomentan la reflexión y la imaginación, y son recursos esenciales para nuestro desarrollo intelectual.» Con el formato de la 2.3: <i>significa<\/i> que el libro guarda y transmite lo que una memoria sola no retiene, y amplía dos capacidades a la vez; <i>la autora lo usa para<\/i> responder al temor de Sócrates con la postura de Borges: la memoria externa no sustituye al pensamiento, lo extiende."}], "criterio": "Las tres se corrigen en cuartos. En la 2.2 el párrafo describe y el resumen tiene que describir; en la 2.3 la cita es de Borges y la clave la ata a lo que la autora defiende con ella, que es la mitad del punto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Parte 2: la redacción de 150 a 200 palabras, en clase", "ayuda": "Veinticinco minutos, con el plan de tres líneas delante y el contador de palabras; cinco minutos al final para contar y releer en tres pasadas. Se elige UNA de las dos opciones. Es la tercera larga del curso y la primera con reloj.", "palabras": {"min": 150, "max": 200}, "items": [{"enun": "«Opción A. ¿Cómo afecta la tecnología a nuestra habilidad para recordar y gestionar la información? ¿De qué manera el acceso instantáneo a datos en Internet ha transformado nuestra forma de aprender? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a estas preguntas. El texto debe incluir como mínimo dos argumentos.» · «Opción B. ¿Qué papel desempeñan los libros en la sociedad actual y cómo percibimos su importancia en nuestra vida diaria? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a esta pregunta. El texto debe incluir como mínimo dos argumentos.»", "conv": "2026s", "modelo": "Sin clave: se corrige con la rúbrica del comentario —adecuación 1, coherencia 1,5, estilo 1,5—, con el recuento y con el descuento por faltas sin tope. Un modelo para la opción A, con las cinco partes: «Internet no ha reducido nuestra memoria, pero ha cambiado lo que guardamos en ella. Según el experimento que cita el texto, quien sabe que un dato está en la red tiende a olvidarlo, y ese es el primer efecto: la memoria de los datos se ha trasladado al buscador. Es cierto que un teléfono con conexión da en segundos lo que antes exigía una tarde de biblioteca; pero encontrar un dato no es lo mismo que saberlo, y quien no lo ha guardado no puede relacionarlo con otro sin volver a buscar. Además, aprender ha pasado de acumular a seleccionar: el trabajo de un estudiante de hoy consiste en distinguir, entre mil resultados, el que se sostiene, y esa habilidad no la tenía que ejercitar quien aprendía con un solo libro. Como dice la autora, cada tecnología de la memoria ha despertado el mismo recelo, desde la escritura hasta la red. Si la memoria de los datos vive en internet, la memoria de las relaciones entre ellos tendrá que vivir en nosotros, y la escuela tendrá que enseñar la segunda.» Ciento ochenta palabras: tesis, argumento empírico del texto, concesión con algo nuevo detrás del <i>pero<\/i>, segundo argumento con <i>además<\/i>, cita atribuida a la autora, cierre con consecuencia."}], "criterio": "Los criterios del comentario: dos argumentos válidos y diferentes, 0,5 cada uno; en contra, las repeticiones, el desorden y la argumentación circular; y 0,5 menos por bajar de 150 palabras o pasar de 200. Con reloj, el recuento no es opcional: se cuenta antes de entregar.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [9]}, {"pieza": "TEXTOS", "apartados": [9]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 9: Comentari de text 2026, tribunal especial · el libro y la memoria (p. 265) · Los textos de cada sesión — apartado 9: «El libro y la memoria» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda: perífrasis verbales", "meta": "10 minutos · el ítem real de 2025t y cinco propios con el formato de la opción falsa", "teoria": "<h3>3 · Las perífrasis verbales<\/h3>\n<h4>Qué es una perífrasis<\/h4>\n<p>Son <strong>dos verbos que trabajan juntos y funcionan como uno solo<\/strong>:<\/p>\n<ul>\n<li>el <strong>auxiliar<\/strong> va delante, <strong>conjugado<\/strong>, y no aporta su significado —lo ha perdido—, sino información gramatical: quién, cuándo, en qué punto está la acción, con qué actitud se dice;<\/li>\n<li>el <strong>auxiliado<\/strong> va detrás, en <strong>forma no personal<\/strong> —infinitivo, gerundio o participio—, pone el significado y decide qué complementos puede llevar el predicado.<\/li>\n<\/ul>\n<p><em>Empieza a nevar<\/em> expresa una sola acción, la de nevar, y <em>empezar<\/em> solo marca en qué punto de esa acción estamos. Los dos verbos forman <strong>un único núcleo verbal<\/strong>, y conviene reconocerlo antes de analizar la oración.<\/p>\n<p>El auxiliado pone el significado y determina el resto del predicado: si el auxiliado es copulativo, el predicado llevará atributo y no complemento directo, sea cual sea el auxiliar —<em>puede ser peligroso<\/em>, <em>tiene que estar cansada<\/em>—.<\/p>\n<h4>Qué puede haber entre los dos verbos<\/h4>\n<table>\n<thead>\n<tr>\n<th>entre el auxiliar y el auxiliado<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>nada<\/strong><\/td>\n<td><em>suelo leer<\/em>, <em>puedo entrar<\/em>, <em>debe firmar<\/em><\/td>\n<\/tr>\n<tr>\n<td>una <strong>preposición<\/strong><\/td>\n<td><em>he de leer<\/em>, <em>empezó a llover<\/em>, <em>dejó de fumar<\/em>, <em>volvió a llamar<\/em><\/td>\n<\/tr>\n<tr>\n<td>una <strong>conjunción<\/strong><\/td>\n<td><em>tengo que leer<\/em>, <em>hay que firmarlo<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y aunque los dos verbos van muy unidos, <strong>no siempre van pegados<\/strong>: entre ellos pueden intercalarse otras palabras, con comas o sin ellas. <em>No iba <\/em><em>entonces<\/em><em> a darle la razón<\/em>, <em>solía <\/em><em>en ocasiones<\/em><em> llevarle la contraria<\/em>, <em>podía, <\/em><em>en aquel momento<\/em><em>, mostrarse encantador<\/em>. Que haya algo en medio no deshace la perífrasis.<\/p>\n<h4>Los once tipos, según lo que aporta el auxiliar<\/h4>\n<h5>1 · De modo: la actitud del hablante ante la acción<\/h5>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué indica<\/th>\n<th>con qué se forma<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1-1<\/strong><\/td>\n<td><strong>obligación<\/strong><\/td>\n<td><em>tener que<\/em>, <em>deber<\/em>, <em>haber de<\/em>, <em>hay que<\/em> + infinitivo<\/td>\n<td>«Tienes que decidirte», «Debes avisar con un mes», «Has de firmarlo hoy», «Hay que renovar el contrato»<\/td>\n<\/tr>\n<tr>\n<td><strong>1-2<\/strong><\/td>\n<td><strong>aproximación<\/strong><\/td>\n<td><em>venir a<\/em> + infinitivo<\/td>\n<td>«Viene a costar lo mismo», «Viene a ser la misma cantidad»<\/td>\n<\/tr>\n<tr>\n<td><strong>1-3<\/strong><\/td>\n<td><strong>posibilidad, conjetura o suposición<\/strong><\/td>\n<td><em>poder<\/em>, <em>deber de<\/em> + infinitivo<\/td>\n<td>«Eso podría ser cierto», «Deben de ser las cinco, porque ha sonado la sirena», «Debe de costar unos mil euros»<\/td>\n<\/tr>\n<tr>\n<td><strong>1-4<\/strong><\/td>\n<td><strong>capacidad, permiso o cortesía<\/strong><\/td>\n<td><em>poder<\/em> + infinitivo<\/td>\n<td>«¿Puedo pasar?», «Aquí no se puede fumar», «¿Podría repetirlo?»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Deber<\/em> + infinitivo y <em>deber de<\/em> + infinitivo no dicen lo mismo: <em>debe firmar<\/em> es una obligación, <em>debe de haber firmado<\/em> es una suposición. El <em>Diccionario panhispánico de dudas<\/em>, 2.ª edición, registra los dos cruces: <em>debe de firmar mañana<\/em> con valor de obligación aparece «también en la lengua culta, aunque con mucha menor frecuencia», y <em>debe estar al llegar<\/em> con valor de suposición está igualmente admitido. La forma recomendada para la obligación sigue siendo la que va sin <em>de<\/em>, y un corrector puede contar el cruce como falta, así que en el examen conviene escribir <em>debe firmar<\/em>.<\/p>\n<p><strong>Y <em>saber<\/em> + infinitivo no entra en esta tabla.<\/strong> <em>Sabe conducir camiones<\/em> lleva dos núcleos verbales: <em>conducir camiones<\/em> es el complemento de <em>saber<\/em>, igual que en <em>quiero comer<\/em>. Es la misma convención con la que se separan las cadenas encadenadas del apartado 3.<\/p>\n<h5>2 · Aspectuales: en qué punto está la acción<\/h5>\n<p>La conjugación del castellano solo distingue dos aspectos: <strong>terminado<\/strong> o <strong>sin terminar<\/strong>. Las perífrasis afinan más que el tiempo verbal solo, y marcan si la acción está a punto de empezar, si acaba de empezar, si va por la mitad, si se ha interrumpido o si se repite.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué indica<\/th>\n<th>con qué se forma<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2-1<\/strong><\/td>\n<td><strong>ingresivas<\/strong>: la acción está <strong>a punto de<\/strong> comenzar<\/td>\n<td><em>ir a<\/em>, <em>estar para<\/em>, <em>estar al<\/em>, <em>estar a punto de<\/em>, <em>estar por<\/em> + infinitivo<\/td>\n<td>«Voy a apuntarme a un curso», «Está para llover», «El tren está al salir», «Estoy a punto de firmar»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-2<\/strong><\/td>\n<td><strong>incoativas<\/strong>: la acción <strong>acaba de<\/strong> comenzar<\/td>\n<td><em>empezar a<\/em>, <em>comenzar a<\/em>, <em>ponerse a<\/em>, <em>echarse a<\/em>, <em>romper a<\/em>, <em>liarse a<\/em>, <em>pasar a<\/em>, <em>meterse a<\/em> + infinitivo<\/td>\n<td>«Comenzó a llover», «Se puso a estudiar», «Se echó a reír», «Rompió a llorar», «Pasó a controlarlo todo»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-3<\/strong><\/td>\n<td><strong>durativas<\/strong>: la acción <strong>se está desarrollando<\/strong><\/td>\n<td><em>estar<\/em>, <em>andar<\/em>, <em>seguir<\/em>, <em>continuar<\/em>, <em>llevar<\/em>, <em>venir<\/em>, <em>ir<\/em> + gerundio<\/td>\n<td>«Está nevando desde ayer», «Anda quejándose de la nómina», «Sigue vendiendo flores», «Llevan seis años estudiando francés», «Vengo diciéndotelo desde marzo»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-4<\/strong><\/td>\n<td><strong>terminativas<\/strong>: la acción <strong>ha terminado o se interrumpe<\/strong><\/td>\n<td><em>acabar de<\/em>, <em>terminar de<\/em>, <em>dejar de<\/em>, <em>cesar de<\/em>, <em>parar de<\/em>, <em>llegar a<\/em>, <em>alcanzar a<\/em> + infinitivo<\/td>\n<td>«Acaba de salir el tren», «Dejó de llover», «No paró de sonar el teléfono», «Llegó a regentar seis tiendas», «No alcanzó a comprender la situación»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-5<\/strong><\/td>\n<td><strong>de perfecto<\/strong>: la acción se presenta <strong>acabada y anterior<\/strong> a un momento de referencia<\/td>\n<td><em>llevar<\/em>, <em>tener<\/em>, <em>dejar<\/em> + participio<\/td>\n<td>«Llevan vistas tres casas», «Tienen estudiados dos temas», «Dejó dicho que no volvería»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-6<\/strong><\/td>\n<td><strong>frecuentativas<\/strong>: la acción es <strong>habitual<\/strong><\/td>\n<td><em>soler<\/em>, <em>acostumbrar a<\/em> + infinitivo<\/td>\n<td>«Suele llegar tarde», «Acostumbra a comer en el taller»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-7<\/strong><\/td>\n<td><strong>reiterativas<\/strong>: la acción <strong>se repite<\/strong><\/td>\n<td><em>volver a<\/em> + infinitivo<\/td>\n<td>«Volvió a quedarse encerrado», «Volvieron a reclamar por escrito»<\/td>\n<\/tr>\n<tr>\n<td><strong>2-8<\/strong><\/td>\n<td><strong>resultativas<\/strong>: la acción es el <strong>resultado de un proceso<\/strong><\/td>\n<td><em>acabar por<\/em>, <em>terminar por<\/em> + infinitivo; <em>acabar<\/em>, <em>terminar<\/em> + gerundio<\/td>\n<td>«Terminó por confesar», «Acabó confesando», «Acabaron por aceptar el turno»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En <strong>2-5<\/strong> el auxiliado va en participio, y el participio las separa de las terminativas: <em>acaba de salir<\/em> lleva infinitivo y mira al final de la acción; <em>llevan vistas tres casas<\/em> lleva participio y mira al resultado acumulado. En las <strong>de perfecto con <em>llevar<\/em> y <em>tener<\/em>, el participio concuerda<\/strong> con el complemento —<em>llevan vist<span class=\"vs\">as<\/span> tres cas<span class=\"vs\">as<\/span><\/em>—, y en los tiempos compuestos con <em>haber<\/em> no concuerda nunca: ⊗<em>he leídas tres novelas<\/em>. <strong>Y el <em>haber<\/em> de los tiempos compuestos no forma perífrasis:<\/strong> es el tiempo compuesto, y el tribunal lo resuelve así. En 2025t 3.4 piden la oración que <strong>no<\/strong> contiene perífrasis y la clave marca «Desde su infancia había soñado con dedicarse a la música».<\/p>\n<h5>3 · De voz pasiva<\/h5>\n<p><em>Ser<\/em> + participio: «Fueron admitidos en el máster», «El expediente fue archivado en marzo». Aquí el participio también concuerda, esta vez con el sujeto.<\/p>\n<h4>Los cuatro criterios para saber si hay perífrasis, por orden de fiabilidad<\/h4>\n<p><strong>1 · El auxiliar ha perdido su significado.<\/strong> De los cuatro, este resuelve más casos que los otros tres. En <em>vamos a comer<\/em> hay perífrasis si se habla de la intención de comer, y no la hay cuando el sujeto se desplaza andando hasta un sitio a comer: ahí <em>ir<\/em> significa <em>ir<\/em>, y la oración tiene un verbo principal y un complemento.<\/p>\n<blockquote>\n<p><em>Mañana vamos a estudiar en la biblioteca<\/em> → intención: <strong>perífrasis<\/strong>.\n<em>Voy en bici a estudiar a la biblioteca<\/em> → desplazamiento real: <strong>no hay perífrasis<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>2 · El verbo en forma no personal no se puede sustituir por un sustantivo ni por una subordinada.<\/strong> Si en su lugar puede ir un sintagma nominal o una oración con <em>que<\/em>, los dos verbos no forman uno solo.<\/p>\n<blockquote>\n<p><em>Puedo comer<\/em> → ⊗<em>puedo una fabada<\/em>, ⊗<em>puedo que tú comas<\/em> → <strong>perífrasis<\/strong>.\n<em>Quiero comer<\/em> → <em>quiero una fabada<\/em>, <em>quiero que tú comas<\/em> → <strong>no es perífrasis<\/strong>: <em>comer<\/em> es el complemento de <em>quiero<\/em>.<\/p>\n<\/blockquote>\n<p><strong>3 · Hay una sola acción.<\/strong> En <em>se paró a charlar<\/em> hay dos: pararse y charlar. En <em>dejó de charlar<\/em> hay una: <em>dejar<\/em> no aporta ninguna acción propia, solo indica que la de charlar terminó.<\/p>\n<p><strong>4 · El verbo principal no se puede sustituir por un pronombre.<\/strong> <em>Deseo participar<\/em> → <em>lo deseo<\/em>; <em>puedo participar<\/em> → ⊗<em>lo puedo<\/em>. Esta prueba solo funciona con verbos transitivos, y por eso va la última.<\/p>\n<h4>La frontera que decide el ítem: perífrasis o complemento de régimen<\/h4>\n<p><strong>El complemento de régimen<\/strong> —también llamado suplemento, y CRV en muchos manuales— es el complemento que un verbo exige <strong>con una preposición fija<\/strong>: <em>acordarse <span class=\"vs\">de<\/span><\/em>, <em>insistir <span class=\"vs\">en<\/span><\/em>, <em>soñar <span class=\"vs\">con<\/span><\/em>, <em>contribuir <span class=\"vs\">a<\/span><\/em>, <em>arrepentirse <span class=\"vs\">de<\/span><\/em>, <em>confiar <span class=\"vs\">en<\/span><\/em>. La preposición no la pone la construcción: la pide el verbo, y siempre la misma.<\/p>\n<p>Cuando detrás de esa preposición hay un infinitivo, la secuencia <strong>se parece<\/strong> a una perífrasis, porque también son dos verbos con una preposición en medio. Y no lo es: la tabla separa las dos construcciones por cuatro rasgos.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>perífrasis<\/th>\n<th>verbo + complemento de régimen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>la preposición<\/strong><\/td>\n<td>la pide la <strong>perífrasis<\/strong> y viene fijada con ella: <em>dejar <span class=\"vs\">de<\/span><\/em>, <em>empezar <span class=\"vs\">a<\/span><\/em><\/td>\n<td>la pide el <strong>verbo<\/strong>, que la lleva siempre, vaya detrás lo que vaya: <em>soñar <span class=\"vs\">con<\/span> un viaje<\/em>, <em>soñar <span class=\"vs\">con<\/span> viajar<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>el significado del primer verbo<\/strong><\/td>\n<td>lo ha perdido<\/td>\n<td>lo conserva entero: quien sueña, sueña<\/td>\n<\/tr>\n<tr>\n<td><strong>la prueba del <em>eso<\/em><\/strong><\/td>\n<td>no la pasa: ⊗<em>dejó de eso<\/em><\/td>\n<td>la pasa: <em>soñaba con eso<\/em> ✔<\/td>\n<\/tr>\n<tr>\n<td><strong>cuántas acciones hay<\/strong><\/td>\n<td>una<\/td>\n<td>dos, y la segunda es el contenido de la primera<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Cómo se comprueba:<\/strong> sustituye el infinitivo por <strong>eso<\/strong>. Si la oración se sostiene, lo que hay es un complemento de régimen y <strong>no una perífrasis<\/strong>.<\/p>\n<p><em>Soñaba con repetirlo<\/em> → <em>soñaba con eso<\/em> ✔ → complemento de régimen\n<em>Solía reflexionar<\/em> → ⊗<em>solía eso<\/em> → perífrasis<\/p>\n<\/blockquote>\n<p>Y un matiz que el examen todavía no ha preguntado: <em>acostumbrar a<\/em> + infinitivo, sin pronombre, es perífrasis frecuentativa —«acostumbra a llegar tarde»—; <em>acostumbrarse a<\/em> + infinitivo, con pronombre, es un verbo pronominal con su complemento de régimen —«se acostumbró <strong>a eso<\/strong>»—. La preposición es la misma, y los dos análisis se separan por el pronombre.<\/p>\n<p><strong>Con gerundio la prueba es otra, porque no hay preposición: quítalo.<\/strong> Si la oración se sostiene y significa lo mismo, el gerundio era un complemento que expresaba de qué manera, y no hay perífrasis.<\/p>\n<blockquote>\n<p><em>Caminaba quejándose<\/em> → <em>caminaba<\/em> ✔, y <em>quejándose<\/em> solo expresaba de qué manera → <strong>no es perífrasis<\/strong>\n<em>Andaba lamentándose<\/em> → ⊗<em>andaba<\/em>, que ya no significa lo mismo → <strong>sí es perífrasis<\/strong><\/p>\n<\/blockquote>\n<h4>Cuando hay más de dos verbos seguidos<\/h4>\n<p>Se analizan <strong>de dos en dos<\/strong>, de izquierda a derecha, y cada pareja se clasifica por su cuenta. En <em>van a dejar de atender<\/em> hay dos relaciones encadenadas: <em>van a dejar<\/em> es ingresiva y <em>dejar de atender<\/em>, terminativa. Como van encadenadas, el bloque forma <strong>un único núcleo verbal<\/strong>.<\/p>\n<blockquote>\n<p><strong>Ampliación, y no entra en el examen de este trimestre.<\/strong> Las cadenas de tres eslabones o más se analizan igual, sin límite. En <em>podíamos haber empezado a dejar de ser considerados culpables<\/em> hay cinco relaciones: <em>podíamos haber empezado<\/em> es modal de posibilidad, con el infinitivo compuesto de <em>empezar<\/em>; <em>empezado a dejar<\/em> es incoativa, <em>dejar de ser<\/em> es terminativa y <em>ser considerados<\/em> es de voz pasiva; y las cuatro encadenadas siguen siendo un solo núcleo verbal. Ninguno de los ítems reales pasa de dos eslabones, así que esto se lee y no se practica.<\/p>\n<\/blockquote>\n<p>No siempre están todas encadenadas, y el análisis depende de localizar dónde termina la cadena. En <em>teníamos que haber sabido empezar a organizarnos<\/em> hay perífrasis en <em>teníamos que haber sabido<\/em>, de obligación, con el infinitivo compuesto de <em>saber<\/em>; pero entre <em>sabido<\/em> y <em>empezar<\/em> no la hay: <em>empezar a organizarnos<\/em> es el complemento de <em>saber<\/em>, igual que en <em>quiero comer<\/em>. Así que hay <strong>dos núcleos verbales<\/strong>, y el análisis los separa en ese punto.<\/p>\n<blockquote>\n<p>Y un consejo de redacción: acumular formas no personales en la misma oración dificulta la lectura. Si en una frase tuya aparecen cuatro infinitivos seguidos, córtala.<\/p>\n<\/blockquote>\n<h4>Los cinco ítems reales, resueltos<\/h4>\n<table>\n<thead>\n<tr>\n<th>examen<\/th>\n<th>las cuatro opciones<\/th>\n<th>la que NO es perífrasis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2015s 3.3<\/strong><\/td>\n<td>Solía reflexionar · Acababa de recoger · <strong>Insistía en hacerlo<\/strong> · Se echó a reír<\/td>\n<td><em>insistía en hacerlo<\/em> → <em>insistía en eso<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2019s 3.1<\/strong><\/td>\n<td>Rompió a llorar · Andaba lamentándose · <strong>Caminaba quejándose<\/strong> · …<\/td>\n<td>gerundio que se puede quitar<\/td>\n<\/tr>\n<tr>\n<td><strong>2020s 3.2<\/strong><\/td>\n<td>Tenía que decidirse · Van a juzgarle · Empieza a nevar · <strong>Contribuye a mejorarlo<\/strong><\/td>\n<td><em>contribuye a eso<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2020t 3.3<\/strong><\/td>\n<td>Viene quejándose · <strong>Soñaba con repetirlo<\/strong> · Estoy por llamarle · Echó a correr<\/td>\n<td><em>soñaba con eso<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2021t 3.1<\/strong><\/td>\n<td>Se puso a estudiar · Solía deambular · Dio por terminada la sesión · <strong>Soñaba con triunfar<\/strong><\/td>\n<td><em>soñaba con eso<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>El patrón, en una línea: la opción falsa es siempre un verbo con preposición fija —<em>soñar con<\/em>, <em>insistir en<\/em>, <em>contribuir a<\/em>— o un gerundio que expresa de qué manera.<\/strong> <em>Soñar con<\/em> ha caído dos veces. Si en las cuatro opciones hay una con <em>con<\/em>, <em>en<\/em> o <em>a<\/em> que admita <em>eso<\/em>, esa opción no es perífrasis.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis ítems en el formato del examen", "ayuda": "Seis preguntas con cuatro opciones. La que lleva chapa de año es literal de 2025t, con su clave oficial. Rodea el NO, aplica el <i>eso<\/i> a las de preposición y quita el gerundio en las otras.", "items": [{"enun": "Señale cuál de las siguientes oraciones NO contiene una perífrasis verbal.", "conv": "2025t", "ops": ["Desde su infancia había soñado con dedicarse a la música.", "Como era muy tarde, mi padre acabó por llevarme al aeropuerto.", "Conté un chiste y todos se echaron a reír.", "Suelo acudir al gimnasio dos veces por semana."], "sol": "Desde su infancia había soñado con dedicarse a la música.", "porque": "<i>había soñado con eso<\/i>: <i>soñar con<\/i> por tercera vez, esta vez en pluscuamperfecto, y el <i>haber<\/i> despista"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Tiene que esperar.", "Confía en aprobar en abril.", "Va a llover.", "Sigue trabajando."], "sol": "Confía en aprobar en abril.", "porque": "<i>confía en eso<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Está por llamar.", "Lleva esperando media hora.", "Vino corriendo desde la parada.", "Anda diciendo que se va."], "sol": "Vino corriendo desde la parada.", "porque": "se quita el gerundio y queda <i>vino desde la parada<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Rompió a llorar.", "Empezó a trabajar a los dieciséis.", "Dejó de fumar.", "Se olvidó de avisar al encargado."], "sol": "Se olvidó de avisar al encargado.", "porque": "<i>se olvidó de eso<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Acabó por aceptarlo.", "Anda buscando piso.", "Salió cantando de la oficina.", "Volvió a llamar."], "sol": "Salió cantando de la oficina.", "porque": "se quita el gerundio y queda <i>salió de la oficina<\/i>; en <i>anda buscando piso<\/i>, sin gerundio queda <i>anda<\/i>, que ya no significa nada parecido"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Aspira a dirigir el equipo.", "Tengo que renovar el carné.", "Se puso a llover.", "Acaba de salir."], "sol": "Aspira a dirigir el equipo.", "porque": "<i>aspira a eso<\/i>"}], "criterio": "Cuatro se descartan con el <i>eso<\/i> —<i>soñar con<\/i>, <i>aspirar a<\/i>, <i>olvidarse de<\/i>, <i>confiar en<\/i>— y dos quitando el gerundio. Las tres opciones que sí son perífrasis en cada ítem están puestas para quien busca la que le parece distinta en lugar de aplicar la prueba.", "apoyo": ["3 · Las perífrasis verbales"], "solo_web": true}, {"tipo": "hueco", "titulo": "Aplica la prueba y escribe lo que queda", "ayuda": "Las seis opciones falsas de la tanda. Escribe lo que queda al aplicar la prueba: el infinitivo sustituido por <i>eso<\/i>, o la oración sin el gerundio.", "items": [{"enun": "«Desde su infancia había soñado con dedicarse a la música»", "sol": "había soñado con eso|desde su infancia había soñado con eso"}, {"enun": "«Aspira a dirigir el equipo»", "sol": "aspira a eso"}, {"enun": "«Vino corriendo desde la parada»", "sol": "vino desde la parada"}, {"enun": "«Se olvidó de avisar al encargado»", "sol": "se olvidó de eso"}, {"enun": "«Confía en aprobar en abril»", "sol": "confía en eso|confía en eso en abril"}, {"enun": "«Salió cantando de la oficina»", "sol": "salió de la oficina"}], "criterio": "En los seis, lo que queda se sostiene y el verbo conjugado sigue significando lo mismo: por eso no eran perífrasis. La prueba se escribe entera, con la preposición delante del <i>eso<\/i>.", "apoyo": ["3 · Las perífrasis verbales"], "solo_web": true}], "cuaderno": {"pieza": 9, "apartados": [3]}, "cuaderno_txt": "Pieza 9 · El verbo: morfología irregular y perífrasis — apartado 3: Las perífrasis verbales (p. 198)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto de Irene Vallejo (Siruela, 2019), reproducido en el carril «El texto» en la adaptación del cuadernillo de 2026, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
