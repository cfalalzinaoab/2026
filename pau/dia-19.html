<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 19 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-12-01">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 1 de diciembre</h1>
    <p class="sub">El quinto set propio y los verbos de 2019t · el comentario de 2026s entero y con reloj, con el título y el resumen · la tanda de perífrasis</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 19, "fecha": "2026-12-01", "tab": "Día 19 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 1 de diciembre", "sub": "El quinto set propio y los verbos de 2019t · el comentario de 2026s entero y con reloj, con el título y el resumen · la tanda de perífrasis", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 5 · la segunda tanda de verbos", "meta": "20 minutos · dos hiatos con la cerrada detrás, una llana en -m y un monosílabo; los cinco verbos de 2019t", "teoria": "<p>Quinto set propio, y hoy entra la segunda tanda de verbos, la de 2019t. El set trae dos hiatos en los que la vocal cerrada va detrás de la abierta —<i>a-ta-úd<\/i>, <i>in-cre-í-ble<\/i>—, que se resuelven con la misma pregunta que <i>búho<\/i> y <i>oír<\/i>: ¿la cerrada lleva la fuerza y está al lado de una abierta? Si sí, hiato, y la tilde va sobre la cerrada aunque la regla general no la pida. <i>Ataúd<\/i> es aguda acabada en -d y aun así la lleva; <i>increíble<\/i> es llana acabada en vocal y también.<\/p>\n\n<h3>La llana en -m y los otros dos señuelos<\/h3>\n<p><i>Álbum<\/i> es llana acabada en -m, una consonante distinta de <i>n<\/i> y <i>s<\/i>, así que lleva tilde, igual que <i>ultimátum<\/i> en el set de 2018s y que <i>túnel<\/i> o <i>cárcel<\/i> en el set del 24 de noviembre. Los tres señuelos son de los tipos de siempre: <i>origen<\/i>, llana en -n; <i>fue<\/i>, monosílabo; <i>cartel<\/i>, aguda en -l. Y <i>murciélago<\/i> es esdrújula con un diptongo dentro, <i>mur-cié-la-go<\/i>: la tilde va sobre la abierta del diptongo.<\/p>\n\n<h3>Los cinco verbos de hoy<\/h3>\n<p>La segunda tanda son los cinco de 2019t: <i>empezar<\/i>, <i>herir<\/i>, <i>nacer<\/i>, <i>competir<\/i> y <i>erguir<\/i>, en la primera persona del presente. Cuatro familias en cinco verbos —<i>empiezo<\/i> e <i>hiero<\/i> diptongan, <i>nazco<\/i> mete la <i>z<\/i>, <i>compito<\/i> cierra la <i>e<\/i>— y <i>yergo<\/i>, que la clave admite también como <i>irgo<\/i>. El jueves, la segunda pasada.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 5: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>ataud<\/i>", "sol": "ataúd", "porque": "hiato: <i>a-ta-úd<\/i>, la <i>ú<\/i> tónica junto a la <i>a<\/i>"}, {"enun": "<i>increible<\/i>", "sol": "increíble", "porque": "hiato: <i>in-cre-í-ble<\/i>"}, {"enun": "<i>compas<\/i>", "sol": "compás", "porque": "aguda acabada en -s"}, {"enun": "<i>album<\/i>", "sol": "álbum", "porque": "llana acabada en -m"}, {"enun": "<i>murcielago<\/i>", "sol": "murciélago", "porque": "esdrújula: <i>mur-cié-la-go<\/i>"}, {"enun": "<i>origen<\/i>", "sol": "origen", "porque": "llana acabada en -n; el plural <i>orígenes<\/i> sí lleva"}, {"enun": "<i>fue<\/i>", "sol": "fue", "porque": "monosílabo"}, {"enun": "<i>cartel<\/i>", "sol": "cartel", "porque": "aguda acabada en -l"}], "criterio": "Llevan tilde cinco de las ocho: dos hiatos, una aguda en -s, una llana en -m y una esdrújula. Los señuelos son una llana en -n, un monosílabo y una aguda en -l, los tres tipos que ponen los sets reales.", "apoyo": ["La llana en -m y los otros dos señuelos"]}, {"tipo": "hueco", "titulo": "Los cinco verbos: la tanda de 2019t", "ayuda": "Los cinco de 2019t, con su clave oficial. Escribe la primera persona del singular del presente de indicativo, con la ortografía de la forma.", "items": [{"enun": "<i>empezar<\/i>", "conv": "2019t", "sol": "empiezo", "porque": "e → ie"}, {"enun": "<i>herir<\/i>", "conv": "2019t", "sol": "hiero", "porque": "e → ie"}, {"enun": "<i>nacer<\/i>", "conv": "2019t", "sol": "nazco", "porque": "c → zc"}, {"enun": "<i>competir<\/i>", "conv": "2019t", "sol": "compito", "porque": "e → i"}, {"enun": "<i>erguir<\/i>", "conv": "2019t", "sol": "yergo|irgo", "porque": "la clave admite las dos"}], "criterio": "Cuatro familias en cinco verbos. Los dos fallos de ortografía que cuentan como forma fallada: <i>nazco<\/i> con <i>zc<\/i> y <i>yergo<\/i> con <i>y<\/i>.", "apoyo": ["Los cinco verbos de hoy"]}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)"}, {"chapa": "Carril B", "titulo": "El tercer comentario, entero y con reloj", "meta": "60 minutos · el comentario de 2026s en el carril «El texto»: test, las tres preguntas y la redacción larga, escrita en clase; el reparto del tiempo", "teoria": "<p>Hoy se hace por primera vez un examen de comentario entero y con reloj: el de 2026s, sobre un ensayo de Irene Vallejo, que está más abajo, en el carril «El texto», con el test, las tres preguntas del bloque 2 y los dos enunciados de la parte 2. Es el primer comentario cuya redacción larga se escribe en clase y no en casa. Este carril lleva hoy solo dos ejercicios cortos, para no quitarle tiempo al examen.<\/p>\n\n<h3>El reparto de los sesenta minutos<\/h3>\n<p>Quince minutos para leer el texto entero y contestar el test; quince para las tres preguntas del bloque 2, cinco por pregunta; veinticinco para la redacción larga, con el plan de tres líneas delante; y cinco al final para contar las palabras y hacer la relectura en tres pasadas. El orden importa: el test y las tres preguntas se contestan antes que la redacción, porque valen seis puntos y se resuelven sobre el texto, y la redacción se apoya en lo que se ha entendido al contestarlas. Quien empieza por la redacción llega al test sin tiempo y con el texto a medio leer.<\/p>\n\n<h3>Dos preguntas por el mismo concepto<\/h3>\n<p>La 1.3 pide qué es el «efecto Google» y la 1.4 mete como opción falsa la misma definición al revés: que recordamos mejor lo que sabemos que está guardado en internet. Quien contesta la 1.3 y sigue leyendo despacio acierta las dos; quien va rápido marca en la 1.4 la idea que acaba de dar por buena, sin notar que está invertida. Y la 1.1 tiene tres opciones que atribuyen a la autora una postura contra la tecnología o contra los lectores de hoy, y el texto no la sostiene: expone una transición y la compara con otra antigua. El error habitual es proyectar en el texto la opinión que uno tiene sobre el tema.<\/p>\n\n<h3>El párrafo que describe un proceso<\/h3>\n<p>El párrafo que manda resumir la 2.2 no tiene tesis, tiene proceso: la frontera entre el pensamiento propio y el acceso a la información digital se va borrando. Por eso la respuesta de la clave describe un movimiento en lugar de enunciar una idea. Antes de resumir, conviene preguntarse si el párrafo defiende algo o describe algo, y resumirlo de la misma clase: un resumen que le ponga una tesis a un párrafo que no la tiene inventa, y los criterios lo descuentan.<\/p>\n\n<h3>Devolución de la segunda larga · título y resumen<\/h3>\n<p>Hoy se devuelve la segunda redacción larga, la de 2025s, corregida con la rúbrica del comentario, y la microtarea son dos de las tres preguntas fijas del bloque 2: un título y el resumen de un párrafo, sobre el artículo de 2018t y sobre el ensayo de hoy.<\/p>\n\n<h3>Lo que suele salir en la segunda larga<\/h3>\n<p>Tres marcas, distintas de las de la larga de 2024s. <b>La concesión de fórmula<\/b>: <i>es cierto que… pero…<\/i> aparece en casi todas, y en la mitad la objeción que reconoce no la pondría nadie —«es cierto que las humanidades no dan dinero, pero…»—, así que la concesión no rompe nada. Se corrige buscando la objeción que pondría quien no está de acuerdo: que hay hospitales sin médicos y el dinero es uno. <b>Los dos argumentos de la misma fila<\/b>: dos datos del texto de Ordine, uno detrás de otro, que el corrector cuenta como uno. Se corrige sacando uno de los dos de otra fila: una analogía, la experiencia propia. <b>La cita inventada<\/b>: «como dice un estudio» sin estudio, o una frase puesta en boca del autor que el autor no dice. La adecuación baja por ahí, porque el corrector tiene el texto delante. El recuento ha mejorado respecto de la larga de 2024s; las faltas de verbo, no, y la lista de diez se actualiza hoy.<\/p>\n\n<h3>Título y resumen, otra vez<\/h3>\n<p>El título nombra el tema entero, no un párrafo, y recoge el contenido del texto y no la opinión de quien lo escribe; el formato más seguro es el sintagma nominal sin verbo, que es el de todas las claves —2024s da tres, 2025s cuatro—, y un título con verbo que recoja la tesis del autor también sirve. El resumen de un párrafo delimitado cumple cuatro condiciones, del 20 de octubre: unas cuarenta palabras, tres líneas; recoge qué pasa, por qué y con qué consecuencia; no repite ninguna secuencia del original; y se ciñe al párrafo pedido. Resumir el texto entero en lugar del párrafo deja la respuesta fuera del enunciado, y copiar media frase se considera incorrecto en los criterios.<\/p>\n", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Sirve como título?", "ops": ["nombra el tema entero", "nombra solo un párrafo", "opina", "es una frase con verbo"], "ayuda": "Ocho títulos propuestos para el ensayo de Irene Vallejo que se ha leído hoy. Señala cuál cumple y qué le pasa a cada uno de los otros.", "items": [{"enun": "«Los recelos de Sócrates ante la escritura»", "sol": "nombra solo un párrafo", "porque": "la escena que abre el ensayo, sin Internet ni la memoria transactiva"}, {"enun": "«Internet nos está volviendo unos ignorantes»", "sol": "opina", "porque": "toma partido por uno de los dos bandos que el texto presenta, y además lleva verbo"}, {"enun": "«La memoria, de los libros a Internet»", "sol": "nombra el tema entero", "porque": "sintagma nominal, sin verbo, y recoge el recorrido del ensayo"}, {"enun": "«Wegner midió la capacidad de recordar de unos voluntarios»", "sol": "es una frase con verbo", "porque": "un título es un sintagma, no una oración, y esta cuenta un experimento suelto"}, {"enun": "«El efecto Google»", "sol": "nombra solo un párrafo", "porque": "el nombre de un fenómeno que ocupa cinco líneas del segundo párrafo"}, {"enun": "«Menos mal que todavía existen los libros»", "sol": "opina", "porque": "<i>menos mal<\/i> valora, y el texto deja abiertas las dos lecturas"}, {"enun": "«El saber guardado fuera de la mente humana»", "sol": "nombra el tema entero", "porque": "nombra lo que recorre el ensayo entero, de la escritura griega a la cibermemoria"}, {"enun": "«Borges pensaba que el libro es una extensión de la memoria»", "sol": "es una frase con verbo", "porque": "oración con verbo conjugado, y además recoge solo la cita del final"}], "criterio": "Se da por bueno un título que pase las tres comprobaciones: que no repita el del original, que abarque el texto entero y que no tome partido. El ensayo presenta dos maneras de enfocar el asunto y no elige ninguna, así que un título que elija deja fuera la mitad del texto.", "apoyo": ["Título y resumen, otra vez"]}, {"tipo": "abierta", "titulo": "La microtarea de hoy: título y resumen", "ayuda": "Un título para cada texto y el resumen del párrafo pedido, de unas cuarenta palabras, empezando por «En este párrafo…» y sin copiar ninguna secuencia.", "items": [{"enun": "Proponga un título para el artículo de Vicente Fernández sobre el envejecimiento (página del día 15) y resuma su último párrafo, desde «Y algo similar ocurriría al contrario» hasta «pero no podemos librarnos de ambos».", "modelo": "Título: <i>Por qué el envejecimiento no se puede detener<\/i>, o <i>La trampa de las terapias contra el envejecimiento<\/i>. Resumen: «En este párrafo se explica que el mecanismo funciona también al revés: quitar las células que pueden volverse cancerígenas hace que se acumulen las inactivas, así que cualquier camino sale mal, y los investigadores concluyen que se puede atacar uno de los dos factores, pero no los dos.» Cuarenta y ocho palabras, sin ninguna secuencia del original."}, {"enun": "Proponga un título para el ensayo de hoy y resuma su tercer párrafo, desde «Más allá de ciertos límites» hasta «el pez plátano».", "modelo": "Título: <i>La memoria, de los libros a Internet<\/i>. Resumen: «En este párrafo se sostiene que ampliar el recuerdo por encima de cierto punto ya solo es posible con máquinas, que el límite entre la mente y la red se difumina y que basta con poder localizar un dato para creer que se sabe, como muestra quien consulta el móvil en mitad de una conversación.» Cincuenta y dos palabras, sin ninguna secuencia del original."}], "criterio": "El título se corrige con las tres condiciones: sintagma sin verbo, tema entero, sin opinión. El resumen, con los cuatro rasgos, y en cuartos: un resumen que copie «no podemos librarnos de ambos» se considera incorrecto en esa parte.", "apoyo": ["Título y resumen, otra vez"]}], "cuaderno": {"pieza": 11, "apartados": [3, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 8: Las dos rúbricas, banda por banda; Las tres preguntas fijas del comentario (p. 66 y 78)"}, {"chapa": "El texto", "titulo": "El libro y la memoria · Comentari de text 2026, tribunal especial", "meta": "Convocatoria 2026, tribunal especial · 652 palabras · el tercer examen de comentario, entero y con reloj: test, las tres preguntas y la redacción larga", "literal": true, "teoria": "<p>Este es el texto de comentario que se contesta hoy en clase entero, en su versión castellana, tal como lo reproduce el cuadernillo de 2026 (tribunal especial); aquí está para volver a él en casa. Es el más largo de los tres del trimestre, un ensayo de divulgación adaptado de <i>El infinito en un junco<\/i>, y su bloque 1 tiene dos preguntas de definición de concepto —el «efecto Google» y la memoria transactiva— que obligan a leer despacio dos pasajes concretos. Trae las nueve preguntas del examen. La clave oficial está redactada en catalán; las respuestas modelo de aquí son su traducción. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "El libro y la memoria", "entrada": "Irene Vallejo · <i>El infinito en un junco<\/i> (Madrid: Siruela, 2019, pp. 124-126) · adaptación, tal como la reproduce el cuadernillo de Comentari de text de 2026 (tribunal especial), versión castellana.", "lineas": ["En la época de Sócrates, los textos escritos aún no eran una", "herramienta habitual y todavía despertaban recelos. Los", "consideraban un sucedáneo de la palabra oral —liviana, alada,", "sagrada—. Aunque la Atenas del siglo v a. C. ya contaba con un", "incipiente comercio de libros, no sería hasta un siglo", "después, en tiempos de Aristóteles, cuando se llegase a", "contemplar sin extrañeza el hábito de leer. Para Sócrates, los", "libros eran ayudas de la memoria y el conocimiento, pero", "pensaba que los verdaderos sabios harían bien en desconfiar de", "ellos. Sócrates temía que, por culpa de la escritura, los", "hombres abandonasen el esfuerzo de la propia reflexión.", "Sospechaba que, gracias al auxilio de las letras, se confiaría", "el saber a los textos y, sin el empeño de comprenderlos a", "fondo, bastaría con tenerlos al alcance de la mano. Y así ya", "no sería sabiduría propia, incorporada a nosotros e indeleble,", "parte del bagaje de cada uno, sino un apéndice ajeno. El", "argumento es agudo, y todavía nos impacta. Ahora mismo estamos", "inmersos en una transición tan radical como la alfabetización", "griega. Internet está cambiando el uso de la memoria y la", "mecánica misma del saber. Un experimento realizado en 2011 por", "D. M. Wegner, pionero de la psicología social, midió la", "capacidad de recordar de unos voluntarios. Solo la mitad de", "ellos sabían que los datos a retener eran guardados en un", "ordenador. Quienes pensaron que la información quedaba grabada", "relajaron el esfuerzo por aprenderla. Los científicos", "denominan «efecto Google» a este fenómeno de relajación", "memorística. Tendemos a recordar mejor dónde se alberga un", "dato que el propio dato. Es evidente que el conocimiento", "disponible es mayor que nunca, pero casi todo se almacena", "fuera de nuestra mente.", "", "Más allá de ciertos límites, la única posibilidad de expandir", "nuestra memoria depende de la tecnología. Esas", "transformaciones son a la vez peligrosas y fascinantes. La", "línea que separa nuestras mentes de Internet se está volviendo", "cada vez más borrosa. Se ha instalado entre nosotros la", "impresión de que sabemos todo aquello que podemos localizar", "gracias a Google. Cuando se reúne un grupo de gente, suele", "haber alguien que se lanza a comprobar los datos de la", "conversación con su teléfono inteligente. Se zambulle en la", "pantalla como un ave acuática y, tras una consulta rápida,", "emerge con el pez en el pico, aclarando todas las dudas sobre", "el nombre de aquel actor o cuáles son los días perfectos para", "pescar el pez plátano.", "", "Tras sus experimentos desde los años ochenta en adelante,", "Wegner piensa que si recordamos dónde encontrar informaciones", "importantes, incluso sin retener el conocimiento concreto,", "estamos ampliando las fronteras de nuestro territorio mental.", "Es el fundamento de su teoría de la memoria transactiva. Según", "Wegner, nadie recuerda todo. Almacenamos información en las", "mentes de otros —a quienes podemos acudir a preguntar—, en los", "libros y en la gigantesca cibermemoria.", "", "El alfabeto fue una tecnología aún más revolucionaria que", "Internet. Construyó por primera vez esa memoria común,", "expandida y al alcance de todo el mundo. Ni el saber ni la", "literatura completa caben en una sola mente pero, gracias a", "los libros, cada uno de nosotros encuentra las puertas", "abiertas a todos los relatos y todos los conocimientos.", "Podemos pensar, como vaticinaba Sócrates, que nos hemos vuelto", "un puñado de engreídos ignorantes. O que, gracias a las", "letras, formamos parte del cerebro más grande y más", "inteligente que ha existido nunca. Borges, que pertenecía al", "grupo de los que piensan de la segunda manera, escribió: «De", "los diversos instrumentos del hombre, el más asombroso es, sin", "duda, el libro. Los demás son extensiones de su cuerpo. El", "microscopio y el telescopio son extensiones de su vista; el", "teléfono es extensión de la voz; luego tenemos el arado y la", "espada, extensiones de su brazo. Pero el libro es otra cosa:", "el libro es una extensión de la memoria y de la imaginación»."], "pie": "Adaptación de un fragmento de <i>El infinito en un junco<\/i>, de Irene Vallejo (Siruela, 2019), en la versión del cuadernillo oficial de la PAU +25 de 2026, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2026_general_comentari_de_text_suplent.pdf<\/i>, p. 4."}, "ejercicios": [{"tipo": "opcion", "titulo": "Bloque 1: las seis preguntas de test", "ayuda": "Literales, con su respuesta oficial. Quince minutos con la lectura. La 1.3 y la 1.4 preguntan por el mismo concepto, y en la 1.4 hay que rodear el «falsa».", "items": [{"enun": "<b>1.1<\/b> ¿Cuál es la principal intención de la autora con este texto?", "conv": "2026s", "ops": ["Resaltar el papel fundamental de los libros en la preservación del conocimiento.", "Explicar el concepto de «efecto Google».", "Comparar la memoria humana con la memoria de Internet.", "Criticar la falta de lectura en la sociedad actual."], "sol": "Resaltar el papel fundamental de los libros en la preservación del conocimiento.", "porque": "el texto expone y compara, sin criticar; el «efecto Google» es un ejemplo dentro del argumento, no la intención"}, {"enun": "<b>1.2<\/b> ¿Cuál es un sinónimo adecuado para la palabra <i>indeleble<\/i>, según su uso en el texto?", "conv": "2026s", "ops": ["Borrable.", "Permanente.", "Superficial.", "Temporal."], "sol": "Permanente.", "porque": "indeleble califica lo que no se puede borrar; las otras tres son antónimos o vecinas del antónimo"}, {"enun": "<b>1.3<\/b> ¿Qué se entiende por «efecto Google» según el texto?", "conv": "2026s", "ops": ["La habilidad de recordar mejor la información cuando se consulta en Internet.", "La tendencia a olvidar la información porque sabemos que podemos encontrarla fácilmente en Internet.", "El aumento de la capacidad memorística gracias a la tecnología digital.", "La capacidad de buscar información más rápidamente a través de motores de búsqueda."], "sol": "La tendencia a olvidar la información porque sabemos que podemos encontrarla fácilmente en Internet.", "porque": "definición de concepto: está en el pasaje del experimento, que habla de olvidar, no de recordar mejor"}, {"enun": "<b>1.4<\/b> Teniendo en cuenta lo que se defiende en el texto, ¿cuál de las siguientes afirmaciones es falsa?", "conv": "2026s", "ops": ["Sócrates desconfiaba de los libros porque temía que afectaran a la reflexión personal.", "La teoría de la memoria transactiva sostiene que compartimos información y la delegamos en otros y en herramientas externas.", "El alfabeto fue una tecnología más revolucionaria que Internet en cuanto a la expansión del conocimiento.", "El «efecto Google» demuestra que tendemos a recordar mejor los datos cuando sabemos que están almacenados en Internet."], "sol": "El «efecto Google» demuestra que tendemos a recordar mejor los datos cuando sabemos que están almacenados en Internet.", "porque": "la definición de la 1.3 al revés: <i>recordar mejor<\/i> donde el texto pone <i>olvidar<\/i>"}, {"enun": "<b>1.5<\/b> ¿Cuál era el principal temor de Sócrates respecto a los textos escritos, según el texto?", "conv": "2026s", "ops": ["Que los textos no tuvieran valor como herramienta de conocimiento.", "Que la escritura reemplazara completamente a la palabra oral.", "Que los textos permitieran a las personas adquirir sabiduría sin reflexionar profundamente.", "Que los libros se convirtieran en el único medio de transmisión de conocimiento."], "sol": "Que los textos permitieran a las personas adquirir sabiduría sin reflexionar profundamente.", "porque": "«temía que, por culpa de la escritura, los hombres abandonasen el esfuerzo de la propia reflexión»"}, {"enun": "<b>1.6<\/b> Según el texto, la teoría de la memoria transactiva de Wegner se refiere", "conv": "2026s", "ops": ["al hecho de que las personas delegan la labor de recordar cierto tipo de información en «memorias externas» (por ejemplo, en otras personas).", "a la capacidad de las personas para recordar únicamente información almacenada en su propia memoria.", "a la idea de que el conocimiento debe ser memorizado de manera individual para ser útil.", "a la tendencia a olvidar información importante si no se consulta con otras personas o fuentes externas."], "sol": "al hecho de que las personas delegan la labor de recordar cierto tipo de información en «memorias externas» (por ejemplo, en otras personas).", "porque": "la segunda definición de concepto del bloque: se lee el pasaje de Wegner despacio, que habla de delegar, no de olvidar"}], "criterio": "Dos definiciones de concepto, la 1.3 y la 1.6, que se contestan sobre el pasaje concreto y no de memoria; la 1.4 repite la 1.3 al revés; y la 1.1 pone tres opciones que critican donde el texto expone. Cada error descuenta 0,16: en las que quedan entre dos opciones, se vuelve al pasaje.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Bloque 2: las tres preguntas fijas", "ayuda": "De una a cinco líneas cada una, sin reproducir frases del original. Quince minutos: cinco por pregunta.", "items": [{"enun": "<b>2.1<\/b> Proponga un título que se adecúe al contenido del texto que acaba de leer.", "conv": "2026s", "modelo": "Clave oficial, traducida: <i>El papel fundamental de los libros en la construcción del conocimiento<\/i> · <i>La función de los libros en la evolución del saber humano<\/i> · <i>El impacto de los libros en la formación de la sabiduría colectiva<\/i> · <i>El libro como vehículo de la memoria en la era digital<\/i>. Cuatro sintagmas nominales sin verbo, y los cuatro nombran el texto entero, incluida la parte de internet."}, {"enun": "<b>2.2<\/b> Resuma el segundo párrafo del texto (es decir, desde «Más allá de ciertos límites» hasta «cuáles son los días perfectos para pescar el pez plátano»).", "conv": "2026s", "modelo": "Clave oficial, traducida: «La tecnología se ha vuelto esencial para ampliar nuestra capacidad de recordar, lo que presenta tanto oportunidades como riesgos. La frontera entre el pensamiento humano y el acceso a información digital es cada vez menos clara, y genera la sensación de que dominamos cualquier conocimiento disponible en línea. En las reuniones es frecuente que se usen los dispositivos móviles para verificar información, lo que crea la ilusión de tener respuestas inmediatas.» El párrafo describe un proceso y el resumen describe el mismo proceso, sin ponerle una tesis que el párrafo no tiene."}, {"enun": "<b>2.3<\/b> Explique, relacionándolo con la argumentación del texto, el siguiente fragmento: «De los diversos instrumentos del hombre, el más asombroso es, sin duda, el libro. […] el libro es una extensión de la memoria y de la imaginación».", "conv": "2026s", "modelo": "Clave oficial, traducida: «El fragmento destaca cómo los libros son herramientas fundamentales para el aprendizaje y la creatividad, ya que permiten almacenar el conocimiento y reflexionar sobre él. Los libros no solo transmiten datos, sino que también fomentan la reflexión y la imaginación, y son recursos esenciales para nuestro desarrollo intelectual.» Con el formato de la 2.3: <i>significa<\/i> que el libro guarda y transmite lo que una memoria sola no retiene, y amplía dos capacidades a la vez; <i>la autora lo usa para<\/i> responder al temor de Sócrates con la postura de Borges: la memoria externa no sustituye al pensamiento, lo extiende."}], "criterio": "Las tres se corrigen en cuartos. En la 2.2 el párrafo describe y el resumen tiene que describir; en la 2.3 la cita es de Borges y la clave la ata a lo que la autora defiende con ella, que es la mitad del punto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Parte 2: la redacción de 150 a 200 palabras, en clase", "ayuda": "Veinticinco minutos, con el plan de tres líneas delante y el contador de palabras; cinco minutos al final para contar y releer en tres pasadas. Se elige UNA de las dos opciones. Es la tercera larga del curso y la primera con reloj.", "palabras": {"min": 150, "max": 200}, "items": [{"enun": "«Opción A. ¿Cómo afecta la tecnología a nuestra habilidad para recordar y gestionar la información? ¿De qué manera el acceso instantáneo a datos en Internet ha transformado nuestra forma de aprender? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a estas preguntas. El texto debe incluir como mínimo dos argumentos.» · «Opción B. ¿Qué papel desempeñan los libros en la sociedad actual y cómo percibimos su importancia en nuestra vida diaria? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a esta pregunta. El texto debe incluir como mínimo dos argumentos.»", "conv": "2026s", "modelo": "Sin clave: se corrige con la rúbrica del comentario —adecuación 1, coherencia 1,5, estilo 1,5—, con el recuento y con el descuento por faltas sin tope. Un modelo para la opción A, con las cinco partes: «Internet no ha reducido nuestra memoria, pero ha cambiado lo que guardamos en ella. Según el experimento que cita el texto, quien sabe que un dato está en la red tiende a olvidarlo, y ese es el primer efecto: la memoria de los datos se ha trasladado al buscador. Es cierto que un teléfono con conexión da en segundos lo que antes exigía una tarde de biblioteca; pero encontrar un dato no es lo mismo que saberlo, y quien no lo ha guardado no puede relacionarlo con otro sin volver a buscar. Además, aprender ha pasado de acumular a seleccionar: el trabajo de un estudiante de hoy consiste en distinguir, entre mil resultados, el que se sostiene, y esa habilidad no la tenía que ejercitar quien aprendía con un solo libro. Como dice la autora, cada tecnología de la memoria ha despertado el mismo recelo, desde la escritura hasta la red. Si la memoria de los datos vive en internet, la memoria de las relaciones entre ellos tendrá que vivir en nosotros, y la escuela tendrá que enseñar la segunda.» Ciento ochenta palabras: tesis, argumento empírico del texto, concesión con algo nuevo detrás del <i>pero<\/i>, segundo argumento con <i>además<\/i>, cita atribuida a la autora, cierre con consecuencia."}], "criterio": "Los criterios del comentario: dos argumentos válidos y diferentes, 0,5 cada uno; en contra, las repeticiones, el desorden y la argumentación circular; y 0,5 menos por bajar de 150 palabras o pasar de 200. Con reloj, el recuento no es opcional: se cuenta antes de entregar.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [9]}, {"pieza": "TEXTOS", "apartados": [9]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 9: Comentari de text 2026, tribunal especial · el libro y la memoria (p. 265) · Los textos de cada sesión — apartado 9: «El libro y la memoria» · texto de examen"}, {"chapa": "Carril C", "titulo": "La tanda: perífrasis verbales", "meta": "10 minutos · el ítem real de 2025t y cinco propios con el formato de la opción falsa", "teoria": "<p>El jueves se dieron las perífrasis con sus dos pruebas y los cinco ítems reales de 2015 a 2021. Queda uno real sin gastar, el de 2025t, y la tanda lo completa con cinco propios escritos con el mismo formato: la opción falsa es un verbo con preposición fija o un gerundio que expresa modo.<\/p>\n\n<h3>Qué pide cada ítem<\/h3>\n<p>El ítem de 2025t confirma el patrón y lo complica: la opción falsa vuelve a ser <i>soñar con<\/i>, que ya había caído dos veces, pero en pretérito pluscuamperfecto —<i>había soñado con<\/i>—, y el verbo auxiliar <i>haber<\/i> despista, porque <i>había soñado<\/i> parece ya una perífrasis. La prueba se hace igual sobre el segundo verbo: <i>había soñado con eso<\/i> se sostiene, así que no hay perífrasis. En cuatro de los seis ítems la prueba del <i>eso<\/i> basta; en los dos de gerundio hay que quitarlo y comprobar si la oración sigue significando lo mismo. <i>Anda buscando piso<\/i> sin gerundio queda en <i>anda<\/i>, que ya no significa nada parecido: ahí sí hay perífrasis, que es la trampa de esos dos.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis ítems en el formato del examen", "ayuda": "Seis preguntas con cuatro opciones. La que lleva chapa de año es literal de 2025t, con su clave oficial. Rodea el NO, aplica el <i>eso<\/i> a las de preposición y quita el gerundio en las otras.", "items": [{"enun": "Señale cuál de las siguientes oraciones NO contiene una perífrasis verbal.", "conv": "2025t", "ops": ["Desde su infancia había soñado con dedicarse a la música.", "Como era muy tarde, mi padre acabó por llevarme al aeropuerto.", "Conté un chiste y todos se echaron a reír.", "Suelo acudir al gimnasio dos veces por semana."], "sol": "Desde su infancia había soñado con dedicarse a la música.", "porque": "<i>había soñado con eso<\/i>: <i>soñar con<\/i> por tercera vez, esta vez en pluscuamperfecto, y el <i>haber<\/i> despista"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Tiene que esperar.", "Confía en aprobar en abril.", "Va a llover.", "Sigue trabajando."], "sol": "Confía en aprobar en abril.", "porque": "<i>confía en eso<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Está por llamar.", "Lleva esperando media hora.", "Vino corriendo desde la parada.", "Anda diciendo que se va."], "sol": "Vino corriendo desde la parada.", "porque": "se quita el gerundio y queda <i>vino desde la parada<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Rompió a llorar.", "Empezó a trabajar a los dieciséis.", "Dejó de fumar.", "Se olvidó de avisar al encargado."], "sol": "Se olvidó de avisar al encargado.", "porque": "<i>se olvidó de eso<\/i>"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Acabó por aceptarlo.", "Anda buscando piso.", "Salió cantando de la oficina.", "Volvió a llamar."], "sol": "Salió cantando de la oficina.", "porque": "se quita el gerundio y queda <i>salió de la oficina<\/i>; en <i>anda buscando piso<\/i>, sin gerundio queda <i>anda<\/i>, que ya no significa nada parecido"}, {"enun": "¿Cuál de las siguientes secuencias NO es una perífrasis verbal?", "ops": ["Aspira a dirigir el equipo.", "Tengo que renovar el carné.", "Se puso a llover.", "Acaba de salir."], "sol": "Aspira a dirigir el equipo.", "porque": "<i>aspira a eso<\/i>"}], "criterio": "Cuatro se descartan con el <i>eso<\/i> —<i>soñar con<\/i>, <i>aspirar a<\/i>, <i>olvidarse de<\/i>, <i>confiar en<\/i>— y dos quitando el gerundio. Las tres opciones que sí son perífrasis en cada ítem están puestas para quien busca la que le parece distinta en lugar de aplicar la prueba.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "Aplica la prueba y escribe lo que queda", "ayuda": "Las seis opciones falsas de la tanda. Escribe lo que queda al aplicar la prueba: el infinitivo sustituido por <i>eso<\/i>, o la oración sin el gerundio.", "items": [{"enun": "«Desde su infancia había soñado con dedicarse a la música»", "sol": "había soñado con eso|desde su infancia había soñado con eso"}, {"enun": "«Aspira a dirigir el equipo»", "sol": "aspira a eso"}, {"enun": "«Vino corriendo desde la parada»", "sol": "vino desde la parada"}, {"enun": "«Se olvidó de avisar al encargado»", "sol": "se olvidó de eso"}, {"enun": "«Confía en aprobar en abril»", "sol": "confía en eso|confía en eso en abril"}, {"enun": "«Salió cantando de la oficina»", "sol": "salió de la oficina"}], "criterio": "En los seis, lo que queda se sostiene y el verbo conjugado sigue significando lo mismo: por eso no eran perífrasis. La prueba se escribe entera, con la preposición delante del <i>eso<\/i>.", "apoyo": ["Qué pide cada ítem"]}], "cuaderno": {"pieza": 9, "apartados": [3]}, "cuaderno_txt": "Pieza 9 · El verbo: morfología irregular y perífrasis — apartado 3: Las perífrasis verbales (p. 198)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto de Irene Vallejo (Siruela, 2019), reproducido en el carril «El texto» en la adaptación del cuadernillo de 2026, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —oscaralejandrobanos.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });

    function corrige() {

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';

      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
