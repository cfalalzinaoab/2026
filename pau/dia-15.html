<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 15 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

  background:var(--fondo);font-size:14px;line-height:1.75}

/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo

details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}

<script>window.DIA = {"dia": 15, "fecha": "2026-11-17", "tab": "Día 15 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 17 de noviembre", "sub": "El primer set propio · el texto de 2018t, la quinta redacción corta y las definiciones · la tanda de derivación y primitivos", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 1 · la tilde depende de la forma", "meta": "20 minutos · el primer set propio, en el formato del examen; examen y exámenes: la tilde se decide en cada forma", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de diez de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de diez, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los ocho sets propios<\/h3>\n<p>Escritos en el formato real —ocho palabras sueltas, sin indicar cuántas llevan tilde— y con palabras que no aparecen en ninguno de los diez ejercicios del censo, para no gastar ningún set real.<\/p>\n<p><strong>La proporción cambia de un set a otro, como en el examen.<\/strong> En los diez sets reales, ocho traen cinco palabras con tilde y tres sin ella, uno las reparte cuatro y cuatro, y otro trae cinco de siete. Aquí pasa lo mismo: seis sets van cinco y tres, uno cuatro y cuatro y otro seis y dos. Quien se corrija contando en lugar de aplicar la regla acertará unas veces y fallará otras.<\/p>\n<p>Los cuatro primeros practican las tres reglas y las excepciones; los cuatro últimos incorporan hiatos, que son el grupo más numeroso del examen.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 1: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>cancion<\/i>", "sol": "canción", "porque": "aguda acabada en -n"}, {"enun": "<i>dificil<\/i>", "sol": "difícil", "porque": "llana acabada en -l"}, {"enun": "<i>ultimo<\/i>", "sol": "último", "porque": "esdrújula"}, {"enun": "<i>examen<\/i>", "sol": "examen", "porque": "llana acabada en -n; el plural <i>exámenes<\/i> sí lleva"}, {"enun": "<i>jamas<\/i>", "sol": "jamás", "porque": "aguda acabada en -s"}, {"enun": "<i>volumen<\/i>", "sol": "volumen", "porque": "llana acabada en -n; el plural <i>volúmenes<\/i> sí lleva"}, {"enun": "<i>arbol<\/i>", "sol": "árbol", "porque": "llana acabada en -l"}, {"enun": "<i>reloj<\/i>", "sol": "reloj", "porque": "aguda acabada en consonante distinta de -n y -s"}], "criterio": "Llevan tilde cinco de las ocho: dos agudas en -n y -s, dos llanas en -l y una esdrújula. Los tres señuelos son dos llanas en -n y una aguda en -j, los mismos tipos que ponen los sets reales.", "apoyo": "todo", "dossier": {"cuaderno": "A-3", "ejercicio": "Set propio 1"}, "dossier_txt": "Del dossier: anexo A-3 · Set propio 1"}, {"tipo": "hueco", "titulo": "La misma palabra, en plural", "estricto": true, "ayuda": "Seis plurales sin tilde, de palabras del set de hoy. Escribe cada uno con tilde si la lleva y tal cual si no: se clasifica el plural, no el singular.", "items": [{"enun": "<i>examenes<\/i>", "sol": "exámenes", "porque": "esdrújula: gana la tilde"}, {"enun": "<i>volumenes<\/i>", "sol": "volúmenes", "porque": "esdrújula: gana la tilde"}, {"enun": "<i>arboles<\/i>", "sol": "árboles", "porque": "esdrújula: la conserva"}, {"enun": "<i>canciones<\/i>", "sol": "canciones", "porque": "llana acabada en -s: la pierde"}, {"enun": "<i>relojes<\/i>", "sol": "relojes", "porque": "llana acabada en -s"}, {"enun": "<i>dificiles<\/i>", "sol": "difíciles", "porque": "esdrújula: la conserva"}], "criterio": "Dos plurales la ganan, uno la pierde y dos la conservan porque siguen siendo esdrújulas; <i>relojes<\/i> no la lleva en ninguna de las dos formas. En cada uno se ha clasificado el plural por su cuenta.", "apoyo": "todo", "solo_web": true}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios (p. 296)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Un texto de causas y consecuencias · la quinta redacción corta", "meta": "60 minutos · el texto de 2018t en el carril «El texto»: preguntas de causa, léxico en contexto y la paráfrasis; la redacción corta con el enunciado de 2018s", "teoria": "<h3>3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>\n<h3>7 · La microtarea de definir un concepto<\/h3>\n<p><strong>En el examen.<\/strong> Es la micro-tarea 2.1 de Llengua castellana, <strong>1 punto<\/strong>, en dos o tres líneas. Ha caído cuatro veces en 24 exámenes y <strong>tres de ellas en los seis últimos<\/strong>: definir qué es una radiografía a quien no lo sabe (2015t), qué es una biblioteca (2024s), en qué consiste el trabajo de aprendiz (2025t) y los parecidos y diferencias entre un tejado y una azotea (2026t). En Comentari de text no se pide con ese nombre, pero la pregunta 2.3 —«explique qué se entiende por <em>selección natural<\/em>»— se contesta con este mismo esquema, igual que las preguntas de léxico abiertas de la pieza 10 que piden explicar una expresión.<\/p>\n<h4>El esquema, en cuatro partes<\/h4>\n<p>Una definición completa lleva estas cuatro, en este orden:<\/p>\n<table>\n<thead>\n<tr>\n<th>parte<\/th>\n<th>qué es<\/th>\n<th>en el ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · Hiperónimo<\/strong><\/td>\n<td>la clase a la que pertenece<\/td>\n<td><em>una hipoteca es <span class=\"vs\">un préstamo<\/span><\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2 · Propiedad simple<\/strong><\/td>\n<td>un sintagma que la acota<\/td>\n<td><em>de dinero, <span class=\"vs\">a largo plazo<\/span><\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3 · Propiedad compleja<\/strong><\/td>\n<td>una oración de relativo que la distingue de las demás de su clase<\/td>\n<td><strong><em>que se pide a un banco para comprar una vivienda y que queda garantizado con esa misma vivienda<\/em><\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>4 · Ejemplo o consecuencia<\/strong><\/td>\n<td>media línea que lo hace visible<\/td>\n<td><em>si quien lo pide deja de pagar las cuotas, el banco puede quedarse con el piso<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Entero: <em>«Una hipoteca es un préstamo de dinero a largo plazo que se pide a un banco para comprar una vivienda y que queda garantizado con esa misma vivienda: si quien lo pide deja de pagar las cuotas, el banco puede quedarse con el piso.»<\/em> Cuarenta y cuatro palabras, tres líneas.<\/p>\n<p><strong>Sin la parte 1 la definición se queda sin clase:<\/strong> arranca por una propiedad y quien lee no sabe si le están hablando de un documento, de un préstamo o de un trámite.<\/p>\n<h4>De dónde se saca el hiperónimo<\/h4>\n<p>Encontrar la clase exige más tiempo que las otras tres partes, y no se improvisa en el examen. Lo que han preguntado y lo que pueden preguntar se reparte casi siempre en seis familias:<\/p>\n<table>\n<thead>\n<tr>\n<th>si lo que defines es…<\/th>\n<th>hiperónimos que sirven<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>un objeto<\/strong><\/td>\n<td>aparato · herramienta · documento · prenda · recipiente · mueble · material<\/td>\n<td><em>una nómina es <\/em><em>el documento<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un lugar<\/strong><\/td>\n<td>edificio · local · instalación · espacio · establecimiento<\/td>\n<td><em>una biblioteca es <\/em><em>el edificio o el local<\/em><em> donde…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una actividad o un oficio<\/strong><\/td>\n<td>trabajo · tarea · proceso · procedimiento · técnica · prueba · servicio<\/td>\n<td><em>una radiografía es <\/em><em>la prueba médica<\/em><em> que…<\/em> · <em>un aprendiz es <\/em><em>la persona que<\/em><em>…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un período de tiempo<\/strong><\/td>\n<td>jornada · turno · plazo · etapa · temporada<\/td>\n<td><em>un turno de noche es <\/em><em>la jornada<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una idea abstracta<\/strong><\/td>\n<td>derecho · norma · obligación · sentimiento · cualidad · situación · relación<\/td>\n<td><em>el pudor es <\/em><em>el sentimiento<\/em><em> que…<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un conjunto de personas o de elementos<\/strong><\/td>\n<td>grupo · lista · conjunto · relación ordenada · red<\/td>\n<td><em>una lista de espera es <\/em><em>la relación ordenada<\/em><em> de…<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y una regla que confirma el hiperónimo:<\/strong> el hiperónimo tiene que poder sustituir a la palabra en una frase cualquiera sin que la frase se vuelva falsa. <em>Fui al hospital a hacerme una radiografía<\/em> → <em>fui al hospital a hacerme una prueba<\/em>: sigue siendo verdad, con menos precisión. <em>Fui al hospital a hacerme una foto<\/em> ya no lo es.<\/p>\n<h4>Definir algo que no es un sustantivo<\/h4>\n<p>Las cuatro veces que ha caído en el examen pedían definir un sustantivo, pero las preguntas de léxico abiertas piden explicar verbos, adjetivos y frases hechas, y ahí el formato cambia. <strong>La definición mantiene la clase de palabra de lo que define:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>formato<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>sustantivo<\/strong><\/td>\n<td><em>es un/una<\/em> + hiperónimo + propiedades<\/td>\n<td><em>un aprendiz es la persona que trabaja en un oficio mientras lo aprende de alguien con más experiencia<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>verbo<\/strong><\/td>\n<td><em>es<\/em> + otro verbo en infinitivo + complementos<\/td>\n<td><em>soslayar es evitar un asunto pasando por su lado en vez de entrar en él<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>adjetivo<\/strong><\/td>\n<td><em>que<\/em> + oración<\/td>\n<td><em>taciturno: que habla poco y se guarda lo que piensa<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>frase hecha<\/strong><\/td>\n<td><em>es<\/em> + verbo + complementos, y sin desmontar la frase palabra por palabra<\/td>\n<td><em>romper el silencio es acabar con una situación tensa en la que nadie se atrevía a hablar<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La fila del adjetivo tiene un error propio: se contesta con un sustantivo. <em>Taciturno es una persona callada<\/em> define a la persona, no al adjetivo. Con el formato <em>que…<\/em> el error desaparece.<\/p>\n<h4>Los seis errores que la clave no acepta<\/h4>\n<table>\n<thead>\n<tr>\n<th>error<\/th>\n<th>ejemplo<\/th>\n<th>por qué falla<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Definir con la misma palabra<\/strong><\/td>\n<td>«una hipoteca es cuando hipotecas una casa»<\/td>\n<td>no nombra la clase, y usa la palabra que hay que explicar<\/td>\n<\/tr>\n<tr>\n<td><strong>Empezar por el ejemplo<\/strong><\/td>\n<td>«una hipoteca es lo que pidió mi hermano para el piso»<\/td>\n<td>un caso no es una clase: quien no sepa qué es sigue sin saberlo<\/td>\n<\/tr>\n<tr>\n<td><strong>«Es cuando», «es donde»<\/strong><\/td>\n<td>«una biblioteca es donde hay libros»<\/td>\n<td><em>cuando<\/em> y <em>donde<\/em> no son hiperónimos: son adverbios, y el hueco de la clase se queda vacío<\/td>\n<\/tr>\n<tr>\n<td><strong>La palabra imprecisa<\/strong><\/td>\n<td>⊗ «una radiografía es una cosa que te hacen en el hospital»<\/td>\n<td><em>cosa<\/em>, <em>hacer<\/em>, <em>tener<\/em>, <em>poner<\/em> y <em>coger<\/em> no acotan nada; el hueco del hiperónimo parece lleno y está vacío<\/td>\n<\/tr>\n<tr>\n<td><strong>La definición demasiado ancha<\/strong><\/td>\n<td>«una nómina es un papel de la empresa»<\/td>\n<td>la clase está bien y faltan las propiedades: un contrato y una carta de despido también son papeles de la empresa<\/td>\n<\/tr>\n<tr>\n<td><strong>La definición en negativo<\/strong><\/td>\n<td>«un aprendiz es alguien que todavía no es oficial»<\/td>\n<td>enumerar lo que algo no es deja sin nombrar lo que es; el negativo puede ir <strong>detrás<\/strong> de la definición, no en su lugar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La micro-tarea se publica con «[1 punto]» y sin fracciones<\/strong>, así que cuánto descuenta cada uno de estos errores lo decide el corrector. La prueba de la definición demasiado ancha se hace al revés: si se te ocurre algo distinto que cumple tu definición entera, faltan propiedades.<\/p>\n<h4>Las cuatro que han caído, contestadas<\/h4>\n<blockquote>\n<p><strong>2015t · «Explique qué es una radiografía a alguien que no lo sepa.»<\/strong>\n<em>Una radiografía es una prueba médica que consiste en atravesar una parte del cuerpo con rayos X para obtener una imagen de lo que hay debajo de la piel, sobre todo de los huesos. Sirve para localizar una fractura sin necesidad de abrir.<\/em><\/p>\n<p><strong>2024s · «Explique qué es una biblioteca.»<\/strong>\n<em>Una biblioteca es el local o el edificio en el que se guarda ordenadamente una colección de libros para que puedan consultarse o llevarse en préstamo. Puede ser pública, como la del barrio, o privada, como la de una casa.<\/em><\/p>\n<p><strong>2025t · «Explique en qué consiste el trabajo de aprendiz.»<\/strong>\n<em>Un aprendiz es la persona que entra en un oficio para aprenderlo trabajando en él, al lado de alguien con más experiencia que le va enseñando, y que por eso cobra menos y asume menos responsabilidad que un oficial. Un mozo de taller que monta ruedas mientras mira cómo se repara un motor está de aprendiz.<\/em><\/p>\n<p><strong>2026t · «Explique los parecidos y las diferencias entre un tejado y una azotea.»<\/strong>\n<em>El tejado y la azotea son las dos maneras habituales de cerrar un edificio por arriba, y las dos protegen de la lluvia lo que hay debajo. Se diferencian en la forma y en el uso: el tejado es inclinado y está cubierto de tejas, de modo que el agua resbala y nadie puede andar por él; la azotea es plana y transitable, y por eso se usa para tender la ropa o poner los depósitos.<\/em><\/p>\n<\/blockquote>\n<p><strong>Compara lo que hacen las cuatro.<\/strong> Todas empiezan por el hiperónimo. Todas ocupan dos o tres líneas. En ninguna aparecen las palabras imprecisas ni el formato <em>es cuando<\/em>. Y todas cierran con un ejemplo o una consecuencia que ocupa media línea, que es la parte 4 del esquema.<\/p>\n<h4>Cuando piden comparar dos<\/h4>\n<p>El enunciado de 2026 pidió parecidos <strong>y<\/strong> diferencias entre dos objetos. La respuesta lleva las dos mitades, y contestar solo una deja sin hacer la mitad de lo que el enunciado pide. El orden que funciona: primero el hiperónimo común, porque la clase común los hace comparables, y después la propiedad que los separa.<\/p>\n<blockquote>\n<p><em>«Un alquiler y una hipoteca son las dos maneras habituales de pagar por vivir en una casa, y las dos se pagan cada mes. Se diferencian en que el alquiler no da ninguna propiedad sobre la vivienda por muchos años que se pague, mientras que la hipoteca termina y la casa queda a nombre de quien la ha pagado.»<\/em><\/p>\n<\/blockquote>\n<p><strong>El formato de la comparación, en dos frases:<\/strong> <em>X e Y son [hiperónimo común] y los dos [propiedad compartida]. Se diferencian en que X [propiedad], mientras que Y [la propiedad contraria].<\/em> La segunda frase lleva siempre un conector de oposición —<em>mientras que<\/em>, <em>en cambio<\/em>—, y sin él las dos mitades se leen como una lista.<\/p>\n<h4>Cuando piden un argumento a favor y otro en contra<\/h4>\n<p>La microtarea 2.1 de 2026s pidió, «en no más de dos o tres líneas, algún argumento a favor y alguno en contra de que niños y niñas lleven uniforme en la escuela». Cada mitad tiene que ser un argumento, con su porqué, y las dos se corrigen por separado. Tres fallos se repiten:<\/p>\n<ul>\n<li><strong>La razón doble.<\/strong> Las dos mitades discuten el mismo dato desde los dos lados: «a favor: el uniforme ahorra dinero a las familias; en contra: el uniforme cuesta dinero a las familias», que son una sola razón. Se corrige sacando la otra mitad de otro terreno, de otra fila de la tabla de los seis tipos del apartado 2: si la de a favor es empírica, la de en contra puede salir de una analogía o de la experiencia propia.<\/li>\n<li><strong>El caso en lugar de la razón.<\/strong> «En contra: mi sobrina odia el uniforme» cuenta lo que le pasa a una persona. Se convierte en razón cuando se escribe qué tiene de general: «obliga a llevar una ropa que muchos niños no elegirían».<\/li>\n<li><strong>La preferencia sin porqué.<\/strong> «A favor: me parece bien» no da nada que un lector pueda discutir, y esa mitad se queda sin puntuar.<\/li>\n<\/ul>\n<h4>Y en el comentario, la 2.3<\/h4>\n<p>La pregunta 2.3 del Comentari de text pide explicar un concepto o una frase del texto <strong>relacionándolo con la argumentación<\/strong>, y su clave oficial está construida con este esquema. La de 2024s, literal:<\/p>\n<blockquote>\n<p>«La selección natural es el proceso por el que los organismos mejor adaptados desplazan a los menos adaptados mediante la acumulación lenta de cambios genéticos favorables a lo largo de las generaciones.»<\/p>\n<\/blockquote>\n<p>Desmontada: <strong>el proceso<\/strong> es el hiperónimo; <strong>por el que los organismos mejor adaptados desplazan a los menos adaptados<\/strong> es la propiedad compleja; <strong>mediante la acumulación lenta de cambios genéticos favorables<\/strong> es la propiedad simple; <strong>a lo largo de las generaciones<\/strong> acota el tiempo. La clave oficial sigue con una segunda oración, «la selección natural hace que las poblaciones se adapten o se vuelvan cada vez más adecuadas a su entorno con el paso del tiempo», que sigue definiendo: ninguna de las dos relaciona el concepto con el argumento del texto, aunque el enunciado lo pedía. Esa otra mitad del punto, <strong>para qué está ese concepto en el texto<\/strong>, la explica el apartado 8.3.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "La quinta redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2018s; el texto de ese examen, sobre José Antonio, se lee el 24 de noviembre, y el propio enunciado cuenta la situación. La tesis tiene que ser una propuesta concreta.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Cuando un fallecido no es reclamado por ningún familiar ni allegado, como sucede en el texto en el caso de José Antonio, la Administración se hace cargo del correspondiente entierro. Escriba un texto, de entre cincuenta y ochenta palabras, en el que exprese su opinión sobre el tipo de entierro que cree que merecen estas personas.»", "conv": "2018s", "modelo": "Quien muere sin nadie que lo reclame merece el mismo entierro que cualquier otro vecino: sencillo, con su nombre y con alguien presente. Un nombre en una lápida cuesta poco a la Administración y evita que una persona desaparezca dos veces, del mundo y de los registros. Además, un funcionario o un voluntario que acompañe el ataúd convierte un trámite en una despedida. Si el Estado se hace cargo, que se haga cargo del todo. — Setenta y cinco palabras: tesis con la propuesta, argumento del gasto, argumento de la compañía con <i>además<\/i>, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. En adecuación se comprueba que la tesis concrete qué tipo de entierro, con algo que se pueda hacer; <i>digno<\/i> o <i>respetuoso<\/i> sin más no lo concretan.", "apoyo": ["7 · La microtarea de definir un concepto"], "usa_texto": false, "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Qué le pasa a la definición?", "ops": ["completa: las cuatro partes", "falta el hiperónimo", "define con la misma palabra", "empieza por el ejemplo", "es cuando / es donde"], "ayuda": "Ocho definiciones de palabras del mundo del reparto a domicilio. Señala cuál está completa y qué le falta a cada una de las otras.", "items": [{"enun": "«Con ochenta o cien al mes, según los pedidos que salgan.»", "sol": "falta el hiperónimo", "porque": "una cifra sin la clase: ¿un sueldo, una propina, una cuota?"}, {"enun": "«Una propina es cuando el cliente da algo de dinero al repartidor.»", "sol": "es cuando / es donde", "porque": "<i>cuando<\/i> no es una clase; el hueco del hiperónimo se queda vacío"}, {"enun": "«Un repartidor es el que reparte los pedidos.»", "sol": "define con la misma palabra", "porque": "<i>reparte<\/i> es la palabra que hay que explicar, y no nombra de qué clase de trabajador se trata"}, {"enun": "«Una aplicación de reparto es un programa para el móvil que pone en contacto a quien pide comida, al restaurante que la prepara y a quien la lleva, y que se queda una parte del precio de cada pedido.»", "sol": "completa: las cuatro partes", "porque": "hiperónimo <i>programa<\/i>, propiedad simple, relativo y consecuencia"}, {"enun": "«Una propina es lo que le dio mi vecino al chico de la pizza el sábado.»", "sol": "empieza por el ejemplo", "porque": "un caso; quien no sepa qué es una propina sigue sin saberlo"}, {"enun": "«Un pedido es donde el cliente elige la comida en el móvil.»", "sol": "es cuando / es donde", "porque": "<i>donde<\/i> es un adverbio, y un pedido no es un lugar"}, {"enun": "«Lleva la comida en una mochila cuadrada y va en bicicleta o en moto.»", "sol": "falta el hiperónimo", "porque": "dos propiedades y ningún nombre de clase: no se sabe de qué se habla"}, {"enun": "«Un repartidor a domicilio es un trabajador que lleva a la puerta del cliente lo que este ha pedido por una aplicación, y que cobra por cada entrega y no por horas: si una tarde no hay pedidos, no cobra nada.»", "sol": "completa: las cuatro partes", "porque": "hiperónimo, propiedad simple, relativo que lo distingue y consecuencia"}], "criterio": "Las dos completas empiezan por la clase y acaban en una consecuencia. En las demás, el hueco está casi siempre en la primera pieza: sin hiperónimo la definición arranca por una propiedad, y con <i>cuando<\/i>, <i>donde<\/i> o la misma palabra el hueco queda ocupado por algo que no es una clase.", "apoyo": ["7 · La microtarea de definir un concepto"], "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: definir", "ayuda": "Dos o tres líneas cada una, con las cuatro partes del esquema. El enunciado con chapa de año es el real de 2025t y se entrega hoy.", "items": [{"enun": "«Explique brevemente, en dos o tres líneas, en qué consiste el trabajo de aprendiz.»", "conv": "2025t", "modelo": "Clave oficial: el aprendiz aprende un oficio trabajando junto a personas con experiencia, que lo orientan y supervisan; realiza tareas simples y de apoyo mientras adquiere habilidades y conocimientos prácticos sobre la profesión. Con el esquema: «El trabajo de aprendiz es un periodo de formación en un oficio, dentro de un taller o de una empresa, en el que una persona sin experiencia hace las tareas sencillas y de ayuda mientras un profesional le enseña y la corrige: un aprendiz de electricista pela cables y sujeta la escalera antes de instalar nada solo.» Cincuenta y siete palabras: clase, propiedad simple, relativo y ejemplo."}, {"enun": "En qué consiste el trabajo de repartidor a domicilio, para quien no lo conoce.", "modelo": "«El trabajo de repartidor a domicilio es un empleo por encargos, gestionado desde una aplicación del móvil, en el que una persona con bicicleta o moto recoge la comida en el restaurante y la lleva a la dirección del cliente, cobrando una cantidad fija por cada entrega: una tarde de lluvia con catorce pedidos se paga igual que una de sol.» Sesenta y una palabras."}], "criterio": "Se corrige con las cuatro partes. El hiperónimo de un trabajo es una clase de trabajo —un periodo de formación, un empleo por encargos—, y las definiciones que arrancan con un relativo o con <i>cuando<\/i> dejan la primera pieza sin poner.", "apoyo": ["7 · La microtarea de definir un concepto"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [3, 7]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 7: Las dos rúbricas, banda por banda; La microtarea de definir un concepto (p. 66 y 74)", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "«Dicen que detener el envejecimiento es imposible», de Vicente Fernández", "meta": "Convocatoria 2018, tribunal ordinario · 337 palabras · el quinto texto: cinco de test, un antónimo abierto y la paráfrasis de la 2.1", "literal": true, "teoria": "<h3>7 · 2018, tribunal ordinario · «Dicen que detener el envejecimiento es imposible»<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Vicente Fernández, «Dicen que detener el envejecimiento es imposible», <em>Quo<\/em> (31 de octubre de 2017)<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>divulgación científica, 336 palabras<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Llengua castellana 2018, tribunal ordinario; el texto, en el cuaderno de textos de cada sesión (texto 7)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>17 de noviembre · con la redacción corta de 2018s, sobre el entierro de quien muere sin allegados; la de este examen, sobre las terapias antiaging, se escribe el 10 de noviembre, con el comentario de 2025s (temporalización)<\/td>\n<\/tr>\n<tr>\n<td><strong>reparto<\/strong><\/td>\n<td>cinco preguntas de test y una abierta: el formato actual<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto va aquí.<\/strong> Es el primer texto expositivo con datos del curso, y sus cinco preguntas de test son de causa y consecuencia: por qué pasa algo, qué produce qué. Prepara la microtarea de explicar un mecanismo y la pregunta 2.1 del comentario.<\/p>", "lectura": {"titulo": "Dicen que detener el envejecimiento es imposible", "entrada": "Vicente Fernández · <i>Quo<\/i>, 31 de octubre de 2017 · tal como lo reproduce el cuadernillo de Llengua castellana de 2018 (tribunal ordinario).", "lineas": ["Millones de personas en todo el mundo luchan contra el", "envejecimiento con todo tipo de terapias antiaging. Pero esa", "lucha es infructuosa. Con esto no queremos decir que todos", "esos tratamientos no sirvan para nada. Lo que ocurre es que lo", "único que pueden hacer es retrasar el proceso, no detenerlo. Y", "en esa misma dirección apuntan las conclusiones de un estudio", "realizado por investigadores de ecología y biología evolutiva", "de la Universidad de Arizona, que han llegado a la conclusión", "de que lograr el no envejecimiento es algo imposible, según", "sus propias palabras.", "", "Los autores del estudio explican que casi todas las", "investigaciones sobre el tema van dirigidas a tratar de", "detener el envejecimiento mediante terapias que aprovechen la", "competencia entre células para eliminar aquellas que se han", "vuelto inactivas, y aprovechar las que siguen siendo activas.", "Pero, tal y como ellos explican ese mecanismo, en el fondo es", "una «trampa 22», expresión que utilizan los estadounidenses", "para referirse a aquellas situaciones en las que, hagas lo que", "hagas, siempre sales perdiendo.", "", "Los investigadores explican lo que ocurre en nuestro organismo", "a nivel celular cuando envejecemos. Y lo que sucede es que", "muchísimas células van ralentizando su crecimiento y", "reduciendo su capacidad para funcionar, hasta volverse", "inactivas. Aunque quedan otras que sí siguen haciéndolo. El", "problema es que una parte de ellas comienzan a crecer de forma", "anómala y se vuelven cancerígenas, aunque la persona no", "siempre muestre síntomas de la enfermedad. La cosa se agrava", "si se eliminan las células inútiles ya que, al no haber", "competencia, el número de células que se vuelven cancerígenas", "crece, y con ellas el riesgo de sufrir la enfermedad.", "", "Y algo similar ocurriría al contrario. Eliminar las células en", "riesgo de volverse cancerígenas favorecería la acumulación de", "células inactivas. Así que, se haga lo que se haga, el", "resultado sigue siendo malo. En definitiva, que, según los", "investigadores de Arizona, se puede trabajar por eliminar uno", "de los dos factores de esta ecuación, pero no podemos", "librarnos de ambos."], "pie": "Artículo de Vicente Fernández (<i>Quo<\/i>, 31 de octubre de 2017), en la versión del cuadernillo oficial de la PAU +25 de 2018, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, para su análisis en este curso (artículos 32.1 y 32.3 de la Ley de Propiedad Intelectual). Cuadernillo: <i>Exámenes/2018_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cinco preguntas de test", "ayuda": "Las preguntas 1.1 a 1.5 del cuadernillo, literales, con su respuesta oficial. En cada enunciado, subraya si pide la causa o la consecuencia antes de leer las opciones.", "items": [{"enun": "<b>1.1<\/b> Del texto se deduce que el envejecimiento en los humanos se debe, al menos en parte,", "conv": "2018t", "ops": ["al envejecimiento de las células.", "al aumento progresivo de células inactivas.", "a la inactividad de las células cancerígenas.", "a la eliminación de las células en riesgo."], "sol": "al aumento progresivo de células inactivas.", "porque": "<i>se debe a<\/i> pide la causa: las células se vuelven inactivas y se acumulan. La a) repite la palabra del enunciado sin explicar nada"}, {"enun": "<b>1.2<\/b> ¿Por qué es muy difícil detener el envejecimiento?", "conv": "2018t", "ops": ["Porque se desconocen los factores que influyen.", "Porque los investigadores solo saben cómo atacar uno de los mecanismos implicados.", "Porque los dos principales mecanismos que intervienen producen resultados opuestos.", "Porque las terapias antiaging solo eliminan las células inútiles."], "sol": "Porque los dos principales mecanismos que intervienen producen resultados opuestos.", "porque": "la «trampa 22»: eliminar unas células favorece a las otras, en las dos direcciones"}, {"enun": "<b>1.3<\/b> Según el texto, ¿cuál es la causa del aumento del número de células cancerígenas?", "conv": "2018t", "ops": ["La eliminación de las células inactivas.", "La competencia entre células.", "La aplicación de terapias de rejuvenecimiento.", "La acumulación de células inútiles."], "sol": "La eliminación de las células inactivas.", "porque": "una sola dirección: «si se eliminan las células inútiles, al no haber competencia, el número de células que se vuelven cancerígenas crece». La d) es la otra dirección del mismo mecanismo"}, {"enun": "<b>1.4<\/b> La palabra <i>inactiva<\/i> asociada a las células se emplea en el sentido de", "conv": "2018t", "ops": ["envejecida.", "mermada.", "insuficiente.", "inútil."], "sol": "inútil.", "porque": "el texto llama <i>inútiles<\/i> a esas mismas células dos frases después: el sentido está en el texto, no en el diccionario"}, {"enun": "<b>1.5<\/b> ¿Qué significa en el texto la expresión <i>siguen haciéndolo<\/i>, referida a algunas células?", "conv": "2018t", "ops": ["Que siguen funcionando.", "Que se vuelven inactivas.", "Que se ralentizan.", "Que prosiguen su deterioro."], "sol": "Que siguen funcionando.", "porque": "<i>lo<\/i> sustituye a <i>funcionar<\/i>, que está en la frase anterior: «reduciendo su capacidad para funcionar, hasta volverse inactivas. Aunque quedan otras que sí siguen haciéndolo»"}], "criterio": "Medio punto por acierto y 0,16 por error. La 1.2 y la 1.3 forman un par: la primera pregunta por los dos mecanismos y la segunda por una sola dirección, y la opción d) de la 1.3 es la dirección contraria. La 1.4 y la 1.5 se resuelven en el texto: <i>inútil<\/i> está escrito dos frases después y <i>funcionar<\/i> una frase antes.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "El antónimo", "ayuda": "La clave acaba en <i>etcétera<\/i>: se corrige poniendo tu palabra en la frase del texto, «favorecería la acumulación de células inactivas».", "items": [{"enun": "<b>1.6<\/b> Proponga un antónimo del sustantivo <i>acumulación<\/i> teniendo en cuenta el sentido concreto que tiene en el texto.", "conv": "2018t", "sol": "disminución|escasez|reducción|insuficiencia|descenso|merma|falta|carencia|pérdida|eliminación|desaparición", "porque": "clave oficial: <i>disminución, escasez, reducción, insuficiencia…<\/i> Tiene que ser un sustantivo, como <i>acumulación<\/i>: <i>disminuir<\/i> es un verbo y no vale como antónimo de un sustantivo"}], "criterio": "Se corrige por sustitución y por clase de palabra: «favorecería la disminución de células inactivas» se sostiene. Un adjetivo o un verbo no son antónimos de un sustantivo.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La paráfrasis", "ayuda": "Con otras palabras: se reformula la frase entera, no se resume.", "items": [{"enun": "<b>2.1<\/b> Parafrasee —es decir, redacte con otras palabras— el siguiente fragmento del texto: «aquellas situaciones en las que, hagas lo que hagas, siempre sales perdiendo».", "conv": "2018t", "modelo": "Clave oficial: «asuntos o circunstancias en los que siempre se sale mal parado, en los que las personas resultan perjudicadas necesariamente, independientemente de las soluciones que se adopten para evitar sus efectos negativos». La clave cambia todas las palabras —<i>situaciones<\/i> por <i>circunstancias<\/i>, <i>hagas lo que hagas<\/i> por <i>independientemente de las soluciones que se adopten<\/i>, <i>sales perdiendo<\/i> por <i>se sale mal parado<\/i>— y no acorta: treinta y una palabras para un fragmento de doce, porque una paráfrasis dice lo mismo con otras palabras y añade lo que la expresión da a entender."}], "criterio": "Se da el punto a la reformulación completa; dejar dentro <i>hagas lo que hagas<\/i> o <i>sales perdiendo<\/i> es copiar media frase, y acortarla a «situaciones sin salida» es resumir, que es otra tarea.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [7]}, {"pieza": "TEXTOS", "apartados": [7]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 7: 2018, tribunal ordinario · «Dicen que detener el envejecimiento es imposible» (p. 262) · Los textos de cada sesión — apartado 7: «Dicen que detener el envejecimiento es imposible» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda: derivación y primitivos", "meta": "10 minutos · los dos ítems reales de prefijación, los dos de test y dos propios", "teoria": "<h3>2 · El sustantivo primitivo<\/h3>\n<p>El primitivo es la palabra de la que salen las demás. El ejercicio da cuatro o cinco derivadas y pide la palabra de origen de cada una.<\/p>\n<blockquote>\n<p><strong>La clave de 2016 pone un límite que hay que conocer:<\/strong> «No se aceptará como respuesta correcta proporcionar <strong>otro derivado<\/strong>». Para <em>ciudadanía<\/em> la respuesta es <em>ciudad<\/em>, no <em>ciudadano<\/em>; para <em>demostración<\/em>, <em>muestra<\/em>, no <em>demostrar<\/em>.<\/p>\n<\/blockquote>\n<h4>Las cuatro maneras en que una derivada se aleja de su primitivo<\/h4>\n<p>Entre la derivada y el primitivo hay siempre un cambio, y casi todos se reparten en cuatro franjas. Reconocer en cuál está la palabra acorta la búsqueda, porque cada franja se deshace con un paso distinto.<\/p>\n<p><strong>1 · El primitivo está entero dentro de la derivada.<\/strong> Se quitan el prefijo y el sufijo, y lo que queda es la respuesta.<\/p>\n<table>\n<thead>\n<tr>\n<th>derivada<\/th>\n<th>lo que se quita<\/th>\n<th>primitivo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>zapat<strong>ero<\/strong><\/td>\n<td>-ero<\/td>\n<td><strong>zapato<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>des<\/strong>mesur<strong>ado<\/strong><\/td>\n<td>des- y -ado<\/td>\n<td><strong>mesura<\/strong><\/td>\n<\/tr>\n<tr>\n<td>reloj<strong>ería<\/strong><\/td>\n<td>-ería<\/td>\n<td><strong>reloj<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>em<\/strong>pan<strong>ada<\/strong><\/td>\n<td>em- y -ada<\/td>\n<td><strong>pan<\/strong><\/td>\n<\/tr>\n<tr>\n<td>bomb<strong>ero<\/strong><\/td>\n<td>-ero<\/td>\n<td><strong>bomba<\/strong><\/td>\n<\/tr>\n<tr>\n<td>arbol<strong>eda<\/strong><\/td>\n<td>-eda<\/td>\n<td><strong>árbol<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ojer<strong>oso<\/strong><\/td>\n<td>-oso<\/td>\n<td><strong>ojo<\/strong> <em>(ojera está en medio)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>2 · El primitivo tiene un diptongo que la derivada pierde.<\/strong> De los dieciséis casos reales, nueve caen en esta franja: más que en las otras tres juntas. Si la raíz lleva una <em>e<\/em> o una <em>o<\/em> y no reconoces la palabra, <strong>devuélvele el diptongo<\/strong>: <em>e<\/em> → <em>ie<\/em>, <em>o<\/em> → <em>ue<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>derivada<\/th>\n<th>raíz sin diptongo<\/th>\n<th>primitivo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>den<strong>t<\/strong>ífrico, <strong>dent<\/strong>adura<\/td>\n<td>dent-<\/td>\n<td><strong>diente<\/strong><\/td>\n<\/tr>\n<tr>\n<td>sub<strong>terr<\/strong>áneo, en<strong>terr<\/strong>ar, <strong>terr<\/strong>eno<\/td>\n<td>terr-<\/td>\n<td><strong>tierra<\/strong><\/td>\n<\/tr>\n<tr>\n<td>co<strong>v<\/strong>acha<\/td>\n<td>cov-<\/td>\n<td><strong>cueva<\/strong><\/td>\n<\/tr>\n<tr>\n<td>des<strong>memb<\/strong>rar<\/td>\n<td>memb-<\/td>\n<td><strong>miembro<\/strong><\/td>\n<\/tr>\n<tr>\n<td>em<strong>pedr<\/strong>ar, a<strong>pedr<\/strong>ear, <strong>pedr<\/strong>usco<\/td>\n<td>pedr-<\/td>\n<td><strong>piedra<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>pont<\/strong>ear<\/td>\n<td>pont-<\/td>\n<td><strong>puente<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>herr<\/strong>ero, <strong>herr<\/strong>amienta, <strong>herr<\/strong>adura<\/td>\n<td>herr-<\/td>\n<td><strong>hierro<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>port<\/strong>ero, <strong>port<\/strong>al, <strong>port<\/strong>ada<\/td>\n<td>port-<\/td>\n<td><strong>puerta<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>nev<\/strong>ada, <strong>nev<\/strong>ar<\/td>\n<td>nev-<\/td>\n<td><strong>nieve<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>cont<\/strong>able, <strong>cont<\/strong>ar<\/td>\n<td>cont-<\/td>\n<td><strong>cuenta<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>fort<\/strong>alecer<\/td>\n<td>fort-<\/td>\n<td><strong>fuerte<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>3 · La raíz cambia una letra, o se le añade algo en medio.<\/strong> El cambio suele ser el de la <em>z<\/em>, que pasa a <em>c<\/em> delante de <em>e<\/em> o de <em>i<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>derivada<\/th>\n<th>el cambio<\/th>\n<th>primitivo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pe<strong>c<\/strong>era, pe<strong>c<\/strong>ecito<\/td>\n<td>z → c<\/td>\n<td><strong>pez<\/strong><\/td>\n<\/tr>\n<tr>\n<td>lu<strong>c<\/strong>ero, lu<strong>c<\/strong>ir<\/td>\n<td>z → c<\/td>\n<td><strong>luz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>cru<strong>c<\/strong>ero, cru<strong>c<\/strong>ificar<\/td>\n<td>z → c<\/td>\n<td><strong>cruz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>pa<strong>n<\/strong>adero<\/td>\n<td>sin cambio, pero con <em>-ad-<\/em> en medio<\/td>\n<td><strong>pan<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>leñ<\/strong>ador<\/td>\n<td>de <em>leña<\/em>, no de <em>leño<\/em><\/td>\n<td><strong>leña<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>4 · La derivada viene de una raíz culta, y el primitivo corriente no se parece.<\/strong> Esta franja no la pregunta el examen, y conviene reconocerla para no perder tiempo buscando: <em>ocular<\/em> no viene de <em>ojo<\/em> sino del latín <em>oculus<\/em>, igual que <em>capilar<\/em> y <em>pelo<\/em>, <em>hepático<\/em> e <em>hígado<\/em>, <em>pluvial<\/em> y <em>lluvia<\/em>. Si la palabra suena a técnica o a médica, los tres pasos anteriores no la resuelven.<\/p>\n<blockquote>\n<p><strong>Y una advertencia sobre el enunciado.<\/strong> Cuando pide el <strong>sustantivo<\/strong> primitivo, conviene comprobar antes que el primitivo sea un sustantivo. El de <em>empobrecer<\/em> no lo es: es el adjetivo <em>pobre<\/em> —<em>em-pobrec-er<\/em>, parasintética—, y contestar <em>pobreza<\/em> sería dar otro derivado, que es justo lo que la clave de 2016 rechaza. Cuando pide solo «la palabra de la que sale», vale la clase que sea.<\/p>\n<\/blockquote>\n<h4>Los dieciséis casos reales, con su clave<\/h4>\n<table>\n<thead>\n<tr>\n<th>derivada<\/th>\n<th>primitivo<\/th>\n<th>examen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ciudadanía<\/td>\n<td>ciudad<\/td>\n<td>2016s<\/td>\n<\/tr>\n<tr>\n<td>desmesurado<\/td>\n<td>mesura<\/td>\n<td>2016s<\/td>\n<\/tr>\n<tr>\n<td>paralizar<\/td>\n<td>parálisis<\/td>\n<td>2016s<\/td>\n<\/tr>\n<tr>\n<td>demostración<\/td>\n<td>muestra<\/td>\n<td>2016s<\/td>\n<\/tr>\n<tr>\n<td>bombero<\/td>\n<td>bomba<\/td>\n<td>2021s<\/td>\n<\/tr>\n<tr>\n<td>empedrar<\/td>\n<td>piedra<\/td>\n<td>2021s<\/td>\n<\/tr>\n<tr>\n<td>apedrear<\/td>\n<td>piedra<\/td>\n<td>2026s<\/td>\n<\/tr>\n<tr>\n<td>ojeroso<\/td>\n<td>ojo<\/td>\n<td>2026s<\/td>\n<\/tr>\n<tr>\n<td>desmembrar<\/td>\n<td>miembro<\/td>\n<td>2026s<\/td>\n<\/tr>\n<tr>\n<td>pontear<\/td>\n<td>puente<\/td>\n<td>2026s<\/td>\n<\/tr>\n<tr>\n<td>arboleda<\/td>\n<td>árbol<\/td>\n<td>2026s<\/td>\n<\/tr>\n<tr>\n<td>dentífrico<\/td>\n<td>diente<\/td>\n<td>2026t<\/td>\n<\/tr>\n<tr>\n<td>covacha<\/td>\n<td>cueva<\/td>\n<td>2026t<\/td>\n<\/tr>\n<tr>\n<td>despiadado<\/td>\n<td>piedad<\/td>\n<td>2026t<\/td>\n<\/tr>\n<tr>\n<td>subterráneo<\/td>\n<td>tierra<\/td>\n<td>2026t<\/td>\n<\/tr>\n<tr>\n<td>enraizar<\/td>\n<td>raíz<\/td>\n<td>2026t<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los tres más difíciles son de 2016<\/strong>: <em>parálisis<\/em> y <em>muestra<\/em> no se parecen a su derivada tanto como las demás, y <em>mesura<\/em> es de uso culto, poco frecuente fuera de la prensa escrita. Cuando la regla del diptongo no funcione, quita los prefijos y los sufijos y comprueba qué queda: <em>des-mesur-ado<\/em> → <em>mesura<\/em>.<\/p>\n<h3>3 · Cinco palabras derivadas<\/h3>\n<p>El ejercicio da una palabra y pide <strong>cinco<\/strong> de su familia. Las palabras que han caído: <em>mar<\/em> (2017t), <em>color<\/em> (2020s), <em>piedra<\/em> (2016t y 2025s) y <em>campo<\/em>. En 2026s <em>piedra<\/em> aparece, pero en el ejercicio de primitivos.<\/p>\n<p><strong>Lo que aceptan las claves<\/strong>, con <em>mar<\/em> de ejemplo: marítimo, marino, marinero, submarino, maremoto, marejada. Con <em>color<\/em>: colorante, colorear, colorido, colorete, decolorar, tricolor. Con <em>piedra<\/em>: apedrear, empedrar, pedrusco, pedrada, pedrisco, pedregal, pedrería, picapedrero.<\/p>\n<h4>De dónde salen las cinco: los sufijos que fabrican familias<\/h4>\n<p>Una familia no se improvisa palabra por palabra. Se recorren los sufijos, que son siempre los mismos, y cada uno da una derivada:<\/p>\n<table>\n<thead>\n<tr>\n<th>qué fabrica<\/th>\n<th>sufijos<\/th>\n<th>con <em>pan<\/em><\/th>\n<th>con <em>casa<\/em><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>quien lo hace<\/strong><\/td>\n<td>-ero, -ista, -dor, -ante<\/td>\n<td>panadero<\/td>\n<td>casero<\/td>\n<\/tr>\n<tr>\n<td><strong>dónde se hace o se guarda<\/strong><\/td>\n<td>-ería, -ero, -al, -ar<\/td>\n<td>panadería<\/td>\n<td>caserío<\/td>\n<\/tr>\n<tr>\n<td><strong>la acción o su resultado<\/strong><\/td>\n<td>-ción, -miento, -aje, -ada<\/td>\n<td>empanada<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>la cualidad<\/strong><\/td>\n<td>-eza, -ura, -idad, -ez<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>más pequeño, más grande o peor<\/strong><\/td>\n<td>-ito, -illo, -ón, -azo, -ucho<\/td>\n<td>panecillo<\/td>\n<td>caseta, casona, casucha<\/td>\n<\/tr>\n<tr>\n<td><strong>el verbo<\/strong><\/td>\n<td>-ear, -izar, -ificar, en-…-ar<\/td>\n<td>empanar, panificar<\/td>\n<td>encasillar<\/td>\n<\/tr>\n<tr>\n<td><strong>el adjetivo<\/strong><\/td>\n<td>-oso, -al, -ario, -able, -izo<\/td>\n<td>—<\/td>\n<td>casero<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cuatro familias enteras, para ver el recorrido:<\/strong><\/p>\n<ul>\n<li><strong>agua<\/strong> → aguar, desaguar, desagüe, aguacero, aguado, aguador, aguanieve, paraguas, aguaducho<\/li>\n<li><strong>hierro<\/strong> → herrero, herrería, herradura, herramienta, herrumbre, herrar<\/li>\n<li><strong>trabajo<\/strong> → trabajar, trabajador, trabajoso, trabajillo<\/li>\n<li><strong>libro<\/strong> → librero, librería, libreta, libresco, librillo, libreto<\/li>\n<\/ul>\n<p>Cada lista recorre varias filas de la tabla —el oficio, el lugar, el verbo, el adjetivo, el diminutivo— sin repetir sufijo, y ninguna familia llena las seis. Conviene aplicar ese recorrido cuando el enunciado pide cinco y solo salen dos.<\/p>\n<p><strong>Tres avisos que salen de esas listas:<\/strong><\/p>\n<ol>\n<li><strong>Valen los compuestos y los prefijados<\/strong>: <em>submarino<\/em>, <em>maremoto<\/em>, <em>tricolor<\/em>, <em>picapedrero<\/em>. No hace falta que las cinco lleven el mismo sufijo.<\/li>\n<li><strong>Vale cambiar de clase<\/strong>: <em>colorear<\/em> es un verbo y cuenta igual que <em>colorante<\/em>, que es un sustantivo.<\/li>\n<li><strong>No vale el plural ni el femenino de la misma palabra<\/strong>: <em>mares<\/em> es la misma palabra que <em>mar<\/em> con la marca de plural. La flexión no fabrica una palabra nueva; la derivación sí, y cada plural que se cuele entre las cinco descuenta 0,1.<\/li>\n<\/ol>\n<p><strong>Y la trampa de la ortografía:<\/strong> <em>pedrusco<\/em> y <em>maremoto<\/em> mal escritas descuentan 0,1 i <script>

(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se

     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');

  /* ---------- utilidades ---------- */
  function norm(s) {

      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();

  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */

  function el(t, cls, txt) {

  function aviso(txt) {

  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */

    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------

  var ventana = null, disparador = null;
