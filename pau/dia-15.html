<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 15 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-11-17">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 17 de noviembre</h1>
    <p class="sub">El primer set propio · el texto de 2018t, la quinta redacción corta y las definiciones · la tanda de derivación y primitivos</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 15, "fecha": "2026-11-17", "tab": "Día 15 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 17 de noviembre", "sub": "El primer set propio · el texto de 2018t, la quinta redacción corta y las definiciones · la tanda de derivación y primitivos", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 1 · la tilde depende de la forma", "meta": "20 minutos · el primer set propio, en el formato del examen; examen y exámenes: la tilde se decide en cada forma", "teoria": "<p>Desde hoy los sets del gimnasio son propios: ocho palabras sin tilde, cinco que la llevan y tres que no, escritas con el formato y los señuelos de los seis sets reales que ya se han contestado, y sin ninguna palabra del censo, para que ningún examen quede gastado antes de su fecha. Se contestan igual: pronunciar la palabra en voz alta, clasificarla y leer la última letra, y en las vocales juntas la pregunta del hiato. Y después de corregir, la segunda pasada de la lista de diez: si una palabra del set está en tu lista, hoy toca comprobarla.<\/p>\n\n<h3>La tilde se decide en cada forma<\/h3>\n<p>Dos palabras del set de hoy, <i>examen<\/i> y <i>volumen<\/i>, no llevan tilde y sus plurales sí: <i>exámenes<\/i> y <i>volúmenes<\/i> son esdrújulas. Y al revés: <i>canción<\/i> la lleva y <i>canciones<\/i> no, porque el plural es llana acabada en -s. La tilde depende de dónde cae la fuerza en esa forma concreta y de en qué acaba esa forma; la familia de la palabra no interviene, y cada forma se clasifica por su cuenta. El 5 de noviembre se vio desde el otro lado, con los plurales que ganan o pierden la tilde; hoy se practica en el gimnasio.<\/p>\n\n<h3>Lo que viene en el carril A<\/h3>\n<p>Ocho sets propios hasta el 15 de diciembre, uno por sesión. Desde el 24 de noviembre, además, cinco formas verbales del censo cada día —participios y gerundios irregulares, presentes con cambio de raíz—, que se dan el 19 en el carril C, y la lista de diez de cada uno, que se revisa en cada devolución.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 1: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>cancion<\/i>", "sol": "canción", "porque": "aguda acabada en -n"}, {"enun": "<i>dificil<\/i>", "sol": "difícil", "porque": "llana acabada en -l"}, {"enun": "<i>ultimo<\/i>", "sol": "último", "porque": "esdrújula"}, {"enun": "<i>examen<\/i>", "sol": "examen", "porque": "llana acabada en -n; el plural <i>exámenes<\/i> sí lleva"}, {"enun": "<i>jamas<\/i>", "sol": "jamás", "porque": "aguda acabada en -s"}, {"enun": "<i>volumen<\/i>", "sol": "volumen", "porque": "llana acabada en -n; el plural <i>volúmenes<\/i> sí lleva"}, {"enun": "<i>arbol<\/i>", "sol": "árbol", "porque": "llana acabada en -l"}, {"enun": "<i>reloj<\/i>", "sol": "reloj", "porque": "aguda acabada en consonante distinta de -n y -s"}], "criterio": "Llevan tilde cinco de las ocho: dos agudas en -n y -s, dos llanas en -l y una esdrújula. Los tres señuelos son dos llanas en -n y una aguda en -j, los mismos tipos que ponen los sets reales.", "apoyo": ["La tilde se decide en cada forma"]}, {"tipo": "hueco", "titulo": "La misma palabra, en plural", "estricto": true, "ayuda": "Seis plurales sin tilde, de palabras del set de hoy. Escribe cada uno con tilde si la lleva y tal cual si no: se clasifica el plural, no el singular.", "items": [{"enun": "<i>examenes<\/i>", "sol": "exámenes", "porque": "esdrújula: gana la tilde"}, {"enun": "<i>volumenes<\/i>", "sol": "volúmenes", "porque": "esdrújula: gana la tilde"}, {"enun": "<i>arboles<\/i>", "sol": "árboles", "porque": "esdrújula: la conserva"}, {"enun": "<i>canciones<\/i>", "sol": "canciones", "porque": "llana acabada en -s: la pierde"}, {"enun": "<i>relojes<\/i>", "sol": "relojes", "porque": "llana acabada en -s"}, {"enun": "<i>dificiles<\/i>", "sol": "difíciles", "porque": "esdrújula: la conserva"}], "criterio": "Dos plurales la ganan, uno la pierde y dos la conservan porque siguen siendo esdrújulas; <i>relojes<\/i> no la lleva en ninguna de las dos formas. En cada uno se ha clasificado el plural por su cuenta.", "apoyo": ["La tilde se decide en cada forma"]}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios (p. 296)"}, {"chapa": "Carril B", "titulo": "Un texto de causas y consecuencias · la quinta redacción corta", "meta": "60 minutos · el texto de 2018t en el carril «El texto»: preguntas de causa, léxico en contexto y la paráfrasis; la redacción corta con el enunciado de 2018s", "teoria": "<p>Hoy se contesta el quinto texto de Llengua castellana, un artículo de divulgación científica de 2018 sobre el envejecimiento: está más abajo, en el carril «El texto», con sus seis preguntas y la 2.1. Después se escribe la quinta redacción corta, con un enunciado real de 2018s, y se devuelve la microtarea del jueves.<\/p>\n\n<h3>Preguntas de causa y consecuencia<\/h3>\n<p>Es el primer texto expositivo con datos del curso, y sus cinco preguntas de test preguntan por qué pasa algo o qué produce qué. El texto explica dos mecanismos que se estorban: eliminar las células inactivas favorece el cáncer, y eliminar las cancerígenas favorece la acumulación de inactivas. La 1.2 pregunta por qué no se puede detener el envejecimiento, y la respuesta son los dos mecanismos a la vez; la 1.3 pregunta por una sola dirección, la causa del aumento de células cancerígenas, y una de sus opciones —«la acumulación de células inútiles»— es la otra dirección. Quien no ha separado las dos al leer marca la contraria. El paso: subrayar en el enunciado si pide la causa (<i>por qué<\/i>, <i>a qué se debe<\/i>) o la consecuencia (<i>qué produce<\/i>, <i>qué efecto<\/i>), y buscar en el texto la frase que va en esa dirección.<\/p>\n\n<h3>Léxico en contexto con una palabra de uso diario, y la paráfrasis<\/h3>\n<p>La 1.4 pregunta por <i>inactiva<\/i>, que no significa <i>inútil<\/i> en el diccionario y sí en este texto, porque el autor llama así a las células que ya no cumplen su función: el enunciado trae «en el sentido de», y ese sentido se busca en la frase, no en la memoria. La 1.5 pregunta por <i>siguen haciéndolo<\/i>, que solo significa algo si se recupera el verbo al que sustituye, y ese verbo está en la línea anterior: el método de la anáfora del 8 de octubre, aplicado a un verbo. Y la 2.1 pide parafrasear una frase: reformularla entera —la clave oficial escribe treinta y una palabras para un fragmento de doce— cambiando todas las palabras que se pueda. Es lo contrario del resumen del comentario, donde hay que acortar: el 6 de octubre se hizo con <i>anegados de júbilo<\/i>, un sintagma; hoy es una oración entera.<\/p>\n\n<h3>La redacción corta de hoy: 2018s<\/h3>\n<p>El enunciado cuenta una situación —un fallecido al que no reclama nadie, del que se hace cargo la Administración— y pide la opinión sobre el tipo de entierro que merecen esas personas. La tesis es una propuesta, y tiene que concretar cómo: «el mismo entierro que cualquier vecino, con su nombre y con alguien presente» se puede discutir; «merecen un entierro digno» no, porque nadie sostiene lo contrario y la palabra <i>digno<\/i> no propone nada que se pueda hacer. Las dos razones salen de dos filas de la tabla: el gasto que supone, y lo que pasa si no se hace.<\/p>\n\n<h3>Devolución de la primera larga · definir: el trabajo de aprendiz<\/h3>\n<p>Hoy se devuelve la primera redacción larga, la de 2024s, corregida con la rúbrica del comentario, y la microtarea es la 2.1 de 2025t: explicar en qué consiste el trabajo de aprendiz, con el esquema de la definición del 8 de octubre.<\/p>\n\n<h3>Lo que suele salir en la primera larga<\/h3>\n<p>Cuatro marcas, por orden de frecuencia. <b>La concesión que falta<\/b>: en 150-200 palabras cabe entera y la banda de coherencia la echa en falta, porque sin ella el texto vuelve tres veces sobre la misma idea. Se corrige escribiendo, detrás del primer argumento, la objeción que pondría quien no está de acuerdo y la respuesta: <i>es cierto que… pero…<\/i>. <b>La concesión que vuelve a la tesis<\/b>: detrás del <i>pero<\/i> reaparece la tesis con otras palabras, y el corrector la cuenta como argumentación circular. Se corrige poniendo detrás del <i>pero<\/i> un dato o una consecuencia que no estaba antes. <b>El recuento<\/b>: 140 palabras o 215 son 0,5 menos, y la mitad de las primeras largas cae fuera del margen por no contar. <b>Las faltas<\/b>: en el comentario el descuento no se detiene, y ocho faltas en doscientas palabras son 0,8; la relectura en tres pasadas del 3 de noviembre está para eso.<\/p>\n\n<h3>Definir, con el esquema<\/h3>\n<p>La definición completa lleva cuatro partes, en este orden: el <b>hiperónimo<\/b>, la clase a la que pertenece; una <b>propiedad simple<\/b>, un sintagma que la acota; una <b>propiedad compleja<\/b>, una oración de relativo que la distingue de las demás de su clase; y un <b>ejemplo o una consecuencia<\/b>, media línea que la hace visible. Los tres errores que anula la clave: definir con la misma palabra —«un aprendiz es el que aprende»—, empezar por el ejemplo —«un aprendiz es lo que fue mi padre en el taller»— y el <i>es cuando<\/i> o el <i>es donde<\/i>, que dejan vacío el hueco de la clase. El enunciado de 2025t pide «en qué consiste el trabajo de aprendiz», así que el hiperónimo es la clase de ese trabajo: un periodo de formación en un oficio, y no una persona. La clave oficial lo resuelve en dos frases: aprende un oficio trabajando junto a personas con experiencia que lo orientan y supervisan, y hace tareas simples y de apoyo mientras adquiere las habilidades de la profesión.<\/p>\n", "ejercicios": [{"tipo": "abierta", "titulo": "La quinta redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2018s; el texto de ese examen, sobre José Antonio, se lee el 24 de noviembre, y el propio enunciado cuenta la situación. La tesis tiene que ser una propuesta concreta.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Cuando un fallecido no es reclamado por ningún familiar ni allegado, como sucede en el texto en el caso de José Antonio, la Administración se hace cargo del correspondiente entierro. Escriba un texto, de entre cincuenta y ochenta palabras, en el que exprese su opinión sobre el tipo de entierro que cree que merecen estas personas.»", "conv": "2018s", "modelo": "Quien muere sin nadie que lo reclame merece el mismo entierro que cualquier otro vecino: sencillo, con su nombre y con alguien presente. Un nombre en una lápida cuesta poco a la Administración y evita que una persona desaparezca dos veces, del mundo y de los registros. Además, un funcionario o un voluntario que acompañe el ataúd convierte un trámite en una despedida. Si el Estado se hace cargo, que se haga cargo del todo. — Setenta y cinco palabras: tesis con la propuesta, argumento del gasto, argumento de la compañía con <i>además<\/i>, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. En adecuación se comprueba que la tesis concrete qué tipo de entierro, con algo que se pueda hacer; <i>digno<\/i> o <i>respetuoso<\/i> sin más no lo concretan.", "apoyo": ["La redacción corta de hoy: 2018s"], "usa_texto": false}, {"tipo": "clasificar", "titulo": "¿Qué le pasa a la definición?", "ops": ["completa: las cuatro partes", "falta el hiperónimo", "define con la misma palabra", "empieza por el ejemplo", "es cuando / es donde"], "ayuda": "Ocho definiciones de palabras del mundo del reparto a domicilio. Señala cuál está completa y qué le falta a cada una de las otras.", "items": [{"enun": "«Con ochenta o cien al mes, según los pedidos que salgan.»", "sol": "falta el hiperónimo", "porque": "una cifra sin la clase: ¿un sueldo, una propina, una cuota?"}, {"enun": "«Una propina es cuando el cliente da algo de dinero al repartidor.»", "sol": "es cuando / es donde", "porque": "<i>cuando<\/i> no es una clase; el hueco del hiperónimo se queda vacío"}, {"enun": "«Un repartidor es el que reparte los pedidos.»", "sol": "define con la misma palabra", "porque": "<i>reparte<\/i> es la palabra que hay que explicar, y no nombra de qué clase de trabajador se trata"}, {"enun": "«Una aplicación de reparto es un programa para el móvil que pone en contacto a quien pide comida, al restaurante que la prepara y a quien la lleva, y que se queda una parte del precio de cada pedido.»", "sol": "completa: las cuatro partes", "porque": "hiperónimo <i>programa<\/i>, propiedad simple, relativo y consecuencia"}, {"enun": "«Una propina es lo que le dio mi vecino al chico de la pizza el sábado.»", "sol": "empieza por el ejemplo", "porque": "un caso; quien no sepa qué es una propina sigue sin saberlo"}, {"enun": "«Un pedido es donde el cliente elige la comida en el móvil.»", "sol": "es cuando / es donde", "porque": "<i>donde<\/i> es un adverbio, y un pedido no es un lugar"}, {"enun": "«Lleva la comida en una mochila cuadrada y va en bicicleta o en moto.»", "sol": "falta el hiperónimo", "porque": "dos propiedades y ningún nombre de clase: no se sabe de qué se habla"}, {"enun": "«Un repartidor a domicilio es un trabajador que lleva a la puerta del cliente lo que este ha pedido por una aplicación, y que cobra por cada entrega y no por horas: si una tarde no hay pedidos, no cobra nada.»", "sol": "completa: las cuatro partes", "porque": "hiperónimo, propiedad simple, relativo que lo distingue y consecuencia"}], "criterio": "Las dos completas empiezan por la clase y acaban en una consecuencia. En las demás, el hueco está casi siempre en la primera pieza: sin hiperónimo la definición arranca por una propiedad, y con <i>cuando<\/i>, <i>donde<\/i> o la misma palabra el hueco queda ocupado por algo que no es una clase.", "apoyo": ["Definir, con el esquema"]}, {"tipo": "abierta", "titulo": "La microtarea de hoy: definir", "ayuda": "Dos o tres líneas cada una, con las cuatro partes del esquema. El enunciado con chapa de año es el real de 2025t y se entrega hoy.", "items": [{"enun": "«Explique brevemente, en dos o tres líneas, en qué consiste el trabajo de aprendiz.»", "conv": "2025t", "modelo": "Clave oficial: el aprendiz aprende un oficio trabajando junto a personas con experiencia, que lo orientan y supervisan; realiza tareas simples y de apoyo mientras adquiere habilidades y conocimientos prácticos sobre la profesión. Con el esquema: «El trabajo de aprendiz es un periodo de formación en un oficio, dentro de un taller o de una empresa, en el que una persona sin experiencia hace las tareas sencillas y de ayuda mientras un profesional le enseña y la corrige: un aprendiz de electricista pela cables y sujeta la escalera antes de instalar nada solo.» Cincuenta y siete palabras: clase, propiedad simple, relativo y ejemplo."}, {"enun": "En qué consiste el trabajo de repartidor a domicilio, para quien no lo conoce.", "modelo": "«El trabajo de repartidor a domicilio es un empleo por encargos, gestionado desde una aplicación del móvil, en el que una persona con bicicleta o moto recoge la comida en el restaurante y la lleva a la dirección del cliente, cobrando una cantidad fija por cada entrega: una tarde de lluvia con catorce pedidos se paga igual que una de sol.» Sesenta y una palabras."}], "criterio": "Se corrige con las cuatro partes. El hiperónimo de un trabajo es una clase de trabajo —un periodo de formación, un empleo por encargos—, y las definiciones que arrancan con un relativo o con <i>cuando<\/i> dejan la primera pieza sin poner.", "apoyo": ["Definir, con el esquema"]}], "cuaderno": {"pieza": 11, "apartados": [3, 7]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 7: Las dos rúbricas, banda por banda; La microtarea de definir un concepto (p. 66 y 74)"}, {"chapa": "El texto", "titulo": "«Dicen que detener el envejecimiento es imposible», de Vicente Fernández", "meta": "Convocatoria 2018, tribunal ordinario · 337 palabras · el quinto texto: cinco de test, un antónimo abierto y la paráfrasis de la 2.1", "literal": true, "teoria": "<p>Este es el texto que se contesta hoy en clase, sobre la fotocopia del cuadernillo de 2018 (tribunal ordinario); aquí está para volver a él en casa. Es el primer artículo de divulgación científica del curso, y sus cinco preguntas de test son de causa y consecuencia: por qué pasa algo, qué produce qué. La sexta es un antónimo abierto, y del bloque 2 se contesta también la 2.1, que pide parafrasear una frase. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "Dicen que detener el envejecimiento es imposible", "entrada": "Vicente Fernández · <i>Quo<\/i>, 31 de octubre de 2017 · tal como lo reproduce el cuadernillo de Llengua castellana de 2018 (tribunal ordinario).", "lineas": ["Millones de personas en todo el mundo luchan contra el", "envejecimiento con todo tipo de terapias antiaging. Pero esa", "lucha es infructuosa. Con esto no queremos decir que todos", "esos tratamientos no sirvan para nada. Lo que ocurre es que lo", "único que pueden hacer es retrasar el proceso, no detenerlo. Y", "en esa misma dirección apuntan las conclusiones de un estudio", "realizado por investigadores de ecología y biología evolutiva", "de la Universidad de Arizona, que han llegado a la conclusión", "de que lograr el no envejecimiento es algo imposible, según", "sus propias palabras.", "", "Los autores del estudio explican que casi todas las", "investigaciones sobre el tema van dirigidas a tratar de", "detener el envejecimiento mediante terapias que aprovechen la", "competencia entre células para eliminar aquellas que se han", "vuelto inactivas, y aprovechar las que siguen siendo activas.", "Pero, tal y como ellos explican ese mecanismo, en el fondo es", "una «trampa 22», expresión que utilizan los estadounidenses", "para referirse a aquellas situaciones en las que, hagas lo que", "hagas, siempre sales perdiendo.", "", "Los investigadores explican lo que ocurre en nuestro organismo", "a nivel celular cuando envejecemos. Y lo que sucede es que", "muchísimas células van ralentizando su crecimiento y", "reduciendo su capacidad para funcionar, hasta volverse", "inactivas. Aunque quedan otras que sí siguen haciéndolo. El", "problema es que una parte de ellas comienzan a crecer de forma", "anómala y se vuelven cancerígenas, aunque la persona no", "siempre muestre síntomas de la enfermedad. La cosa se agrava", "si se eliminan las células inútiles ya que, al no haber", "competencia, el número de células que se vuelven cancerígenas", "crece, y con ellas el riesgo de sufrir la enfermedad.", "", "Y algo similar ocurriría al contrario. Eliminar las células en", "riesgo de volverse cancerígenas favorecería la acumulación de", "células inactivas. Así que, se haga lo que se haga, el", "resultado sigue siendo malo. En definitiva, que, según los", "investigadores de Arizona, se puede trabajar por eliminar uno", "de los dos factores de esta ecuación, pero no podemos", "librarnos de ambos."], "pie": "Artículo de Vicente Fernández (<i>Quo<\/i>, 31 de octubre de 2017), en la versión del cuadernillo oficial de la PAU +25 de 2018, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, para su análisis en este curso (artículos 32.1 y 32.3 de la Ley de Propiedad Intelectual). Cuadernillo: <i>Exámenes/2018_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cinco preguntas de test", "ayuda": "Las preguntas 1.1 a 1.5 del cuadernillo, literales, con su respuesta oficial. En cada enunciado, subraya si pide la causa o la consecuencia antes de leer las opciones.", "items": [{"enun": "<b>1.1<\/b> Del texto se deduce que el envejecimiento en los humanos se debe, al menos en parte,", "conv": "2018t", "ops": ["al envejecimiento de las células.", "al aumento progresivo de células inactivas.", "a la inactividad de las células cancerígenas.", "a la eliminación de las células en riesgo."], "sol": "al aumento progresivo de células inactivas.", "porque": "<i>se debe a<\/i> pide la causa: las células se vuelven inactivas y se acumulan. La a) repite la palabra del enunciado sin explicar nada"}, {"enun": "<b>1.2<\/b> ¿Por qué es muy difícil detener el envejecimiento?", "conv": "2018t", "ops": ["Porque se desconocen los factores que influyen.", "Porque los investigadores solo saben cómo atacar uno de los mecanismos implicados.", "Porque los dos principales mecanismos que intervienen producen resultados opuestos.", "Porque las terapias antiaging solo eliminan las células inútiles."], "sol": "Porque los dos principales mecanismos que intervienen producen resultados opuestos.", "porque": "la «trampa 22»: eliminar unas células favorece a las otras, en las dos direcciones"}, {"enun": "<b>1.3<\/b> Según el texto, ¿cuál es la causa del aumento del número de células cancerígenas?", "conv": "2018t", "ops": ["La eliminación de las células inactivas.", "La competencia entre células.", "La aplicación de terapias de rejuvenecimiento.", "La acumulación de células inútiles."], "sol": "La eliminación de las células inactivas.", "porque": "una sola dirección: «si se eliminan las células inútiles, al no haber competencia, el número de células que se vuelven cancerígenas crece». La d) es la otra dirección del mismo mecanismo"}, {"enun": "<b>1.4<\/b> La palabra <i>inactiva<\/i> asociada a las células se emplea en el sentido de", "conv": "2018t", "ops": ["envejecida.", "mermada.", "insuficiente.", "inútil."], "sol": "inútil.", "porque": "el texto llama <i>inútiles<\/i> a esas mismas células dos frases después: el sentido está en el texto, no en el diccionario"}, {"enun": "<b>1.5<\/b> ¿Qué posición decide: lo que va delante es prefijo y lo que va detrás es sufijo.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "El sustantivo primitivo: cinco propias", "estricto": true, "ayuda": "Cinco derivadas que no están en el censo. Escribe el primitivo de cada una, y no otro derivado.", "items": [{"enun": "<i>panadería<\/i>", "sol": "pan", "porque": "<i>pan<\/i>, no <i>panadero<\/i>, que es otro derivado"}, {"enun": "<i>encarcelar<\/i>", "sol": "cárcel", "porque": "<i>cárcel<\/i>, con su tilde: llana acabada en -l"}, {"enun": "<i>embotellar<\/i>", "sol": "botella"}, {"enun": "<i>atardecer<\/i>", "sol": "tarde"}, {"enun": "<i>empapelar<\/i>", "sol": "papel"}], "criterio": "Cuatro de las cinco son parasintéticas, y el primitivo está en medio, sin prefijo ni sufijo. En <i>panadería<\/i> hay que pasar por encima de <i>panadero<\/i>, que es otro derivado y no cuenta.", "apoyo": ["Qué pide cada ítem"]}], "cuaderno": {"pieza": 7, "apartados": [2, 3]}, "cuaderno_txt": "Pieza 7 · Nombre y adjetivo: plurales, femeninos, derivadas y primitivos — apartados 2 y 3: El sustantivo primitivo; Cinco palabras derivadas (p. 173 y 175)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El artículo de Vicente Fernández (<i>Quo<\/i>, 2017), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2018, se incluye con fines docentes y para su análisis, al amparo de los artículos 32.1 y 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27

(function () {

  /* ---------- utilidades ---------- */
  function norm(s) {

      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */

  function el(t, cls, txt) {

     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».

  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */

  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres

  function negado(antes) {

  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo

  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */

  /* acepta variantes separadas por | y compara normalizado */

    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.

  var ventana = null, disparador = null;
  function creaVentana() {

    caja.appendChild(el('div', 'v-cuerpo'));

    function marcaTxt() {

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
