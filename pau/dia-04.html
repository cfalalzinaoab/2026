<script>window.DIA = {"dia": 4, "fecha": "2026-10-06", "tab": "Día 4 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 6 de octubre", "sub": "La tilde del hiato · el esqueleto de la redacción, la concesión y el cierre · la tanda de categoría", "carriles": [{"chapa": "Carril A", "titulo": "La tilde del hiato", "meta": "20 minutos · la regla que resuelve diecisiete de las 49 tildes del censo", "teoria": "<p>El jueves se separaron las vocales juntas en una sílaba o en dos. Hoy se decide la tilde. <b>Ninguno de los 17 hiatos que han caído en el ejercicio llevaría tilde por las tres reglas del 29 de septiembre<\/b>. Son llanas acabadas en vocal o en -s y agudas acabadas en -r, y las diecisiete la llevan por la regla del hiato.<\/p>\n\n<h3>La regla que resuelve los diecisiete<\/h3>\n<p><b>Una vocal cerrada tónica —<i>í<\/i>, <i>ú<\/i>— junto a una vocal abierta lleva siempre tilde<\/b>, aunque las tres reglas no la pidan. La tilde va sobre la cerrada, nunca sobre la abierta: <i>ma-íz<\/i>, <i>ba-úl<\/i>, <i>po-li-cí-a<\/i>, <i>son-re-ír<\/i>. En un hiato la tilde señala que hay dos sílabas y no una, además de dónde cae la fuerza. Sin ella, <i>policia<\/i> se leería <i>po-li-cia<\/i>, con diptongo, en tres sílabas en lugar de cuatro.<\/p>\n<p>Los hiatos de dos abiertas —<i>te-a-tro<\/i>, <i>le-er<\/i>, <i>ca-os<\/i>— no entran aquí: se acentúan por las tres reglas, y <i>línea<\/i> lleva tilde por ser esdrújula, no por el hiato.<\/p>\n<p><b>La h intercalada no lo impide.<\/b> <i>Pro-hí-bo<\/i> y <i>bú-ho<\/i> son hiatos con una hache en medio, y llevan tilde igual: la hache no suena y no cuenta.<\/p>\n\n<h3>El par que decide el ejercicio<\/h3>\n<p>El examen ha puesto <i>oír<\/i> al lado de <i>huir<\/i>, y <i>reír<\/i> al lado de <i>huido<\/i>. En <i>oír<\/i> hay una abierta, <i>o<\/i>, y una cerrada tónica, <i>í<\/i>: hiato, tilde obligatoria. En <i>huir<\/i> hay dos cerradas, <i>u<\/i> e <i>i<\/i>: diptongo, y se acentúa por las tres reglas, que no le dan tilde. La pregunta es una sola: ¿hay alguna vocal abierta entre las dos? Si la hay y la cerrada es la tónica, es hiato y lleva tilde. Si las dos son cerradas, es diptongo y no hay nada que decidir. El grupo <i>ui<\/i> es diptongo por norma aunque al pronunciarlo parezca que se separa: <i>cuidar<\/i>, <i>ruina<\/i>, <i>fluido<\/i>, <i>circuito<\/i>.<\/p>\n\n<h3>Las mismas letras, otra palabra<\/h3>\n<p>En estas parejas la tilde decide qué palabra se ha escrito, y el ejercicio del examen da las palabras sueltas, sin frase alrededor que ayude a distinguirlas.<\/p>\n<table>\n<tr><th>sin tilde<\/th><th>con tilde<\/th><th>qué cambia<\/th><\/tr>\n<tr><td><i>hacia<\/i> (preposición)<\/td><td><i>hacía<\/i> (verbo <i>hacer<\/i>)<\/td><td><i>ha-cia<\/i> tiene dos sílabas; <i>ha-cí-a<\/i>, tres<\/td><\/tr>\n<tr><td><i>sabia<\/i> (que sabe mucho)<\/td><td><i>sabía<\/i> (verbo <i>saber<\/i>)<\/td><td>el diptongo <i>ia<\/i> se rompe<\/td><\/tr>\n<tr><td><i>continuo<\/i> (seguido)<\/td><td><i>continúo<\/i> (verbo, yo) y <i>continuó<\/i> (él, ayer)<\/td><td>tres palabras con las mismas letras y tres sitios para la fuerza<\/td><\/tr>\n<tr><td><i>secretaria<\/i> (la persona)<\/td><td><i>secretaría<\/i> (la oficina)<\/td><td>la tilde traslada el significado de la persona al sitio<\/td><\/tr>\n<tr><td><i>policia<\/i> no existe<\/td><td><i>policía<\/i><\/td><td>sin la tilde no hay palabra, y el hiato la exige<\/td><\/tr>\n<\/table>\n<p>Cuando salga una de estas en el examen, la decisión la da la regla, porque no hay dos palabras que distinguir: si la <i>i<\/i> o la <i>u<\/i> suena separada de la vocal de al lado, lleva tilde.<\/p>\n\n<h3>La diéresis<\/h3>\n<p>Dos puntos sobre la <b>u<\/b> en las sílabas <i>güe<\/i> y <i>güi<\/i>, para avisar de que esa <i>u<\/i> sí suena: <i>vergüenza<\/i>, <i>pingüino<\/i>, <i>lingüística<\/i>, <i>averigüéis<\/i>. Sin ellos se leería <i>verguenza<\/i> con la <i>u<\/i> muda, como en <i>guerra<\/i>. No ha caído en ningún ejercicio de tildes de los 24 exámenes; está aquí porque escribir <i>verguenza<\/i> en la redacción es una falta.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "¿Diptongo o hiato? Pon la tilde si hace falta", "estricto": true, "ayuda": "Ocho palabras escritas sin tilde. En cada una hay una sola pregunta: ¿hay una vocal abierta al lado de la cerrada, y la cerrada lleva la fuerza? Copia la palabra con tilde si le corresponde, y tal cual si no.", "items": [{"enun": "<i>sonreir<\/i>", "sol": "sonreír", "porque": "<i>e<\/i> abierta + <i>í<\/i> cerrada tónica: hiato, <i>son-re-ír<\/i>"}, {"enun": "<i>fluido<\/i>", "sol": "fluido", "porque": "<i>ui<\/i>, dos cerradas: diptongo, y por las tres reglas es llana acabada en vocal"}, {"enun": "<i>raiz<\/i>", "sol": "raíz", "porque": "<i>a<\/i> + <i>í<\/i> tónica: hiato, <i>ra-íz<\/i>"}, {"enun": "<i>cuidar<\/i>", "sol": "cuidar", "porque": "<i>ui<\/i>: diptongo; aguda acabada en -r, sin tilde"}, {"enun": "<i>policia<\/i>", "sol": "policía", "porque": "<i>í<\/i> tónica + <i>a<\/i>: hiato, <i>po-li-cí-a<\/i>"}, {"enun": "<i>aire<\/i>", "sol": "aire", "porque": "<i>ai<\/i>: la cerrada no lleva la fuerza, diptongo; llana acabada en vocal"}, {"enun": "<i>prohibo<\/i>", "sol": "prohíbo", "porque": "<i>o<\/i> + <i>í<\/i> tónica con hache en medio: hiato, <i>pro-hí-bo<\/i>"}, {"enun": "<i>transeunte<\/i>", "sol": "transeúnte", "porque": "<i>e<\/i> + <i>ú<\/i> tónica: hiato, <i>tran-se-ún-te<\/i>"}], "criterio": "Cinco llevan tilde y tres no, y ninguna de las cinco la llevaría por las tres reglas: <i>sonreír<\/i> es aguda acabada en -r, <i>policía<\/i> es llana acabada en vocal. Las tres que se quedan como están tienen o bien dos cerradas —<i>fluido<\/i>, <i>cuidar<\/i>— o bien una cerrada sin fuerza —<i>aire<\/i>—, y en las tres el diptongo se mantiene.", "apoyo": ["La regla que resuelve los diecisiete", "El par que decide el ejercicio"]}, {"tipo": "hueco", "titulo": "Las mismas letras, otra palabra", "estricto": true, "ayuda": "Escribe la forma que pide cada oración, con tilde o sin ella: <i>hacia / hacía<\/i>, <i>sabia / sabía<\/i>, <i>continuo / continúo / continuó<\/i>, <i>secretaria / secretaría<\/i>. Aquí la frase indica cuál corresponde; en el examen la palabra va sola.", "items": [{"enun": "Iba ______ la oficina cuando me llamaron.", "sol": "hacia", "porque": "la preposición: <i>ha-cia<\/i>, dos sílabas"}, {"enun": "De joven ______ horas extras todos los sábados.", "sol": "hacía", "porque": "del verbo <i>hacer<\/i>: <i>ha-cí-a<\/i>, tres sílabas"}, {"enun": "Pidió el certificado en la ______ del centro.", "sol": "secretaría", "porque": "la oficina; <i>secretaria<\/i> sin tilde sería la persona, y el certificado se pide en la oficina"}, {"enun": "El ruido del taller es ______ desde las siete.", "sol": "continuo", "porque": "el adjetivo: <i>con-ti-nuo<\/i>, con diptongo"}, {"enun": "______ en el mismo puesto desde 2019.", "sol": "Continúo", "porque": "verbo en presente, yo: <i>con-ti-nú-o<\/i>, la <i>ú<\/i> rompe el diptongo"}, {"enun": "Ayer la reunión ______ media hora más.", "sol": "continuó", "porque": "verbo en pasado, él: <i>con-ti-nuó<\/i>, aguda acabada en vocal"}, {"enun": "Mi abuela era una mujer ______ que no fue a la escuela.", "sol": "sabia", "porque": "el adjetivo: <i>sa-bia<\/i>, dos sílabas"}, {"enun": "No ______ que el plazo terminaba hoy.", "sol": "sabía", "porque": "del verbo <i>saber<\/i>: <i>sa-bí-a<\/i>, tres sílabas"}], "criterio": "En las ocho la frase decide qué palabra es, y la tilde se pone después, según dónde caiga la fuerza en esa palabra. En el examen las palabras van sueltas y la decisión se toma solo con la regla: <i>continuo<\/i> sin frase puede ser cualquiera de las tres, y hay que pronunciarla para saber cuál de las tres se está escribiendo.", "apoyo": ["Las mismas letras, otra palabra"]}, {"tipo": "hueco", "titulo": "La diéresis", "estricto": true, "ayuda": "Seis palabras. Copia cada una como se escribe: con diéresis si la <i>u<\/i> suena, sin ella si la <i>u<\/i> es muda, y con su tilde si además la lleva.", "items": [{"enun": "<i>verguenza<\/i>", "sol": "vergüenza", "porque": "la <i>u<\/i> suena: <i>ver-güen-za<\/i>"}, {"enun": "<i>guerra<\/i>", "sol": "guerra", "porque": "la <i>u<\/i> es muda: <i>gue-rra<\/i>, sin diéresis"}, {"enun": "<i>pinguino<\/i>", "sol": "pingüino", "porque": "la <i>u<\/i> suena: <i>pin-güi-no<\/i>"}, {"enun": "<i>quince<\/i>", "sol": "quince", "porque": "en <i>qui<\/i> la <i>u<\/i> nunca suena, y la diéresis solo va sobre la <i>u<\/i> de <i>güe<\/i> y <i>güi<\/i>"}, {"enun": "<i>linguistica<\/i>", "sol": "lingüística", "porque": "la <i>u<\/i> suena, y además la palabra es esdrújula: <i>lin-güís-ti-ca<\/i>"}, {"enun": "<i>guitarra<\/i>", "sol": "guitarra", "porque": "la <i>u<\/i> es muda: <i>gui-ta-rra<\/i>"}], "criterio": "Tres llevan diéresis y tres no, y la prueba es pronunciarlas: en <i>guerra<\/i> y <i>guitarra<\/i> la <i>u<\/i> no se oye, y en <i>vergüenza<\/i> y <i>pingüino<\/i> sí. <i>Lingüística<\/i> lleva las dos marcas, la diéresis sobre la <i>u<\/i> y la tilde sobre la <i>i<\/i>, porque la diéresis indica que la <i>u<\/i> suena y la tilde marca dónde cae la fuerza.", "apoyo": ["La diéresis"]}], "cuaderno": {"pieza": 2, "apartados": [5, 6], "ejercicios": [4, 5]}, "cuaderno_txt": "Pieza 2 · Vocales en contacto — apartados 5 y 6: Las mismas letras, otra palabra; La diéresis (p. 19 y 20) · ejercicios 4 y 5"}, {"chapa": "Carril B", "titulo": "Escribir: la concesión, el cierre y el texto narrativo", "meta": "60 minutos · la tesis discutible, la concesión que responde, el cierre que no repite; los cinco rasgos del texto narrativo; el primer texto por tu cuenta, 2015s, en el carril «El texto»", "teoria": "<p>Hoy se contesta el primer texto real por cuenta de cada uno, el fragmento de <i>La sonrisa etrusca<\/i> de la convocatoria de 2015, con sus seis preguntas y cronómetro: está más abajo, en el carril «El texto», y en clase se trabaja sobre la fotocopia del cuadernillo. Es una novela, y por eso hoy se dan también los rasgos del texto narrativo.<\/p>\n\n<h3>La concesión y el cierre<\/h3>\n<p>El jueves se vieron la tesis que admite la contraria y la diferencia entre argumento y ejemplo. Quedan la concesión y el cierre.<\/p>\n<p><b>La concesión<\/b> reconoce la objeción de quien no está de acuerdo y la contesta: <i>es cierto que… pero…<\/i>. Tiene que reconocer una objeción real —la que pondría quien no comparte la tesis— y, detrás del <i>pero<\/i>, añadir una idea distinta de las que el texto ya llevaba. Si detrás del <i>pero<\/i> vuelve la tesis, no hay concesión: hay una frase larga. En 150-200 palabras ocupa una frase entera y es recomendable, no obligatoria: la banda de coherencia del comentario descuenta por «argumentación circular», y la concesión añade una idea que el texto no llevaba, así que el texto avanza en lugar de volver sobre sí mismo; un texto sin concesión puede salir coherente igual. En 50-80 no tiene frase propia: va dentro del segundo argumento con un <i>aunque<\/i>.<\/p>\n<p><b>El cierre saca una consecuencia.<\/b> Repetir la tesis con otras palabras —«por todo esto, creo que…», «en conclusión…»— baja la banda de coherencia, porque el corrector encuentra la misma idea dos veces y el texto no ha avanzado. El cierre que funciona expresa qué pasa si se hace lo que la tesis pide, o qué pasará si no se hace: «si no se cuenta, el sueldo real baja cuanto más lejos se vive».<\/p>\n\n<h3>Los rasgos del texto narrativo<\/h3>\n<p>Cuando el texto es una novela, uno de los seis ítems puede pedir que se demuestre que es narrativo. Ha caído dos veces en castellano, y las dos claves oficiales piden lo mismo con distintas palabras. La lista que hay que poder recitar tiene cinco elementos:<\/p>\n<ol>\n<li><b>Sucesión de acontecimientos<\/b>: ocurren hechos, uno detrás de otro.<\/li>\n<li><b>Causalidad<\/b>: cada hecho lleva al siguiente, y no están puestos en cualquier orden.<\/li>\n<li><b>Un actor-sujeto<\/b> que sostiene la unidad del relato: los hechos le pasan a alguien.<\/li>\n<li><b>Verbos en pasado<\/b>, sobre todo perfecto simple e imperfecto.<\/li>\n<li><b>Marcas de tiempo y de lugar<\/b>: <i>entonces<\/i>, <i>al día siguiente<\/i>, <i>allí<\/i>, <i>en aquella casa<\/i>.<\/li>\n<\/ol>\n<p><b>Se dan tantos rasgos como pida el enunciado.<\/b> El número está escrito en la pregunta, y las dos claves oficiales descuentan por cada uno que falte. 2015t, 1.5: «Indique al menos tres elementos característicos del texto (lingüísticos y textuales) que demuestran que es de tipo narrativo»; la clave descuenta 0,16 por cada elemento erróneo u omitido. 2020t, 1.6: «Este fragmento es un claro ejemplo de texto narrativo. Mencione dos rasgos, o propiedades prototípicas, que lo identifican como una narración»; la clave descuenta 0,25 por rasgo no proporcionado. Si pide tres y se escriben dos, se pierde 0,16 aunque los dos sean correctos, así que se escriben los tres, y cada uno con su ejemplo sacado del texto.<\/p>\n\n<h3>Escribir I: el esqueleto y las dos extensiones<\/h3>\n<p>Los dos exámenes acaban pidiendo un texto argumentativo sobre el tema del texto que se acaba de leer. Cambian la extensión y la manera de puntuarlo:<\/p>\n<table>\n<tr><th><\/th><th>Llengua castellana 2.2<\/th><th>Comentari de text, parte 2<\/th><\/tr>\n<tr><td>vale<\/td><td>3 puntos<\/td><td>4 puntos<\/td><\/tr>\n<tr><td>extensión<\/td><td>50 a 80 palabras<\/td><td>150 a 200 palabras<\/td><\/tr>\n<tr><td>elección<\/td><td>un solo enunciado<\/td><td>dos enunciados, se elige uno<\/td><\/tr>\n<tr><td>qué pide<\/td><td>«exprese su opinión sobre…»<\/td><td>responder a una pregunta con dos argumentos como mínimo<\/td><\/tr>\n<tr><td>rúbrica<\/td><td>adecuación · coherencia · cohesión · riqueza de expresión<\/td><td>adecuación 1 · coherencia 1,5 · estilo 1,5<\/td><\/tr>\n<tr><td>extensión mal<\/td><td>—<\/td><td>−0,5 por bajar de 150 o pasar de 200<\/td><\/tr>\n<tr><td>faltas<\/td><td>−0,1 cada una, con tope de 2 puntos<\/td><td>−0,1 cada una, sin tope<\/td><\/tr>\n<\/table>\n<p>Entre los dos son 7 de los 20 puntos del curso.<\/p>\n\n<h3>El esqueleto, que es el mismo en los dos<\/h3>\n<p><b>Tesis · dos razones · cierre.<\/b> Las dos rúbricas piden lo mismo: que se sepa qué defiendes y que lo defiendas dos veces por caminos distintos. Lo que cambia entre un examen y el otro es cuánto cabe dentro de cada pieza: en 50-80 palabras la tesis es una frase, cada argumento una o dos y el cierre una; en 150-200, cada argumento lleva dentro un dato o un caso y su consecuencia, y cabe una concesión entera —<i>es cierto que… pero<\/i>— que en el formato corto entra, si entra, dentro del segundo argumento con un <i>aunque<\/i>.<\/p>\n\n<h3>Las cinco partes, contadas<\/h3>\n<p><b>La tesis tiene que admitir la contraria.<\/b> «La contaminación es un problema» no sirve como tesis, porque nadie lo discute: no queda nada que defender, y los dos argumentos acaban describiendo la situación en lugar de justificar una postura. «Voy a hablar de las redes sociales» tampoco: anuncia el tema y no dice nada sobre él. «El tiempo de desplazamiento al trabajo debería contar como jornada» sí admite réplica, y por eso se puede defender.<\/p>\n<p><b>Un argumento no es un ejemplo.<\/b> El argumento explica por qué pasa algo; el ejemplo cuenta un caso. «Mi vecino estudió de mayor y ahora está mejor» es un ejemplo; «estudiar de adulto cambia la relación con el trabajo, porque deja de ser el único sitio donde se puede mejorar» es un argumento. Un ejemplo cabe dentro de un argumento, en media línea. Solo, no defiende nada, porque siempre se puede contestar «pues yo conozco otro caso».<\/p>\n<p><b>Los dos argumentos tienen que ser distintos<\/b>, y cada uno entra con su conector —<i>en primer lugar<\/i>, <i>además<\/i>, <i>por otra parte<\/i>— para que el corrector localice dos argumentos y no uno repetido. Los criterios del comentario lo exigen con esas palabras: «dos argumentos válidos y diferentes, 0,5 puntos cada argumento». Son distintos cuando se apoyan en razones que no dependen una de otra: uno en un dato y otro en un caso parecido; uno en dinero y otro en salud.<\/p>\n<p><b>El cierre saca una consecuencia y no repite la tesis.<\/b> Repetir la tesis con otras palabras baja la banda de coherencia, porque el corrector encuentra la misma idea dos veces y el texto no ha avanzado.<\/p>\n<p>Los dos modelos de la pieza 11 llevan las cinco partes en el orden del esqueleto, con sus conectores a la vista.<\/p>\n", "ejercicios": [{"tipo": "hueco", "titulo": "¿En qué línea está la respuesta?", "estricto": true, "ayuda": "Escribe el número de la línea donde <b>empieza<\/b> la respuesta; si ocupa dos, valen las dos. Es la tercera pasada del método: se vuelve al texto pregunta por pregunta y se anota al margen del cuadernillo dónde está cada una.", "items": [{"enun": "¿Qué hace el niño en la primera línea del fragmento?", "sol": "1"}, {"enun": "¿Qué palabra pronuncia el niño?", "sol": "7"}, {"enun": "¿Qué le devuelve la calma cuando empieza a gemir?", "sol": "19"}, {"enun": "¿Con qué imagen del rostro del abuelo se cierra el fragmento?", "sol": "25"}, {"enun": "¿Qué significa <i>nonno<\/i> en italiano?", "sol": "27"}], "criterio": "Un fragmento de novela se localiza igual que un artículo, y además lleva los hechos en orden. La pregunta por el significado de <i>nonno<\/i> se contesta en la nota al pie, que forma parte del cuadernillo y que mucha gente no llega a leer.", "apoyo": ["intro"]}, {"tipo": "opcion", "titulo": "Concesión, cierre o tesis repetida", "ops": ["concesión que responde", "concesión sin respuesta", "cierre con consecuencia", "tesis repetida"], "ayuda": "Siete frases escritas para la tesis «el tiempo de desplazamiento al trabajo debería contar como jornada». Clasifica cada una.", "items": [{"enun": "«Es cierto que pagar el trayecto encarecería contratar a quien vive lejos, pero ese gasto es pequeño al lado de lo que pierde quien, por no poder mudarse, se queda sin empleo.»", "sol": "concesión que responde", "porque": "reconoce una objeción real y detrás del <i>pero<\/i> añade una idea nueva"}, {"enun": "«En conclusión, el desplazamiento tendría que formar parte de la jornada laboral.»", "sol": "tesis repetida", "porque": "la misma idea de la tesis con otras palabras; el texto no avanza"}, {"enun": "«Aunque es verdad que muchos trayectos son cortos, los turnos partidos los multiplican por dos cada día.»", "sol": "concesión que responde", "porque": "la objeción —trayectos cortos— y la respuesta con un dato: los turnos partidos"}, {"enun": "«Mientras el trayecto lo pague el trabajador, las empresas seguirán instalándose donde no llega el autobús.»", "sol": "cierre con consecuencia", "porque": "anuncia qué pasará si nada cambia"}, {"enun": "«Es cierto que las empresas no eligen dónde vive cada trabajador.»", "sol": "concesión sin respuesta", "porque": "reconoce la objeción y no la contesta: falta el <i>pero<\/i> y lo que va detrás"}, {"enun": "«Por todo esto, creo que el tiempo de desplazamiento debería contar como jornada.»", "sol": "tesis repetida", "porque": "«por todo esto» anuncia una consecuencia y lo que sigue es la tesis otra vez"}, {"enun": "«Si no se cuenta, el sueldo real baja cuanto más lejos se vive.»", "sol": "cierre con consecuencia", "porque": "una consecuencia de no hacer lo que la tesis pide"}], "criterio": "Las dos concesiones que responden llevan las dos mitades, la objeción y la respuesta; la que no responde se queda en la objeción y la deja sin contestar. Los dos cierres anuncian qué pasa después; las dos tesis repetidas arrancan con una fórmula de cierre —<i>en conclusión<\/i>, <i>por todo esto<\/i>— y detrás no traen nada nuevo, y por eso se descuentan en la banda de coherencia aunque suenen a final.", "apoyo": ["La concesión y el cierre"]}, {"tipo": "abierta", "titulo": "La concesión y el cierre que faltan", "ayuda": "Cinco minutos. Dos frases: la concesión, que empieza por <i>Es cierto que<\/i> y sigue con <i>pero<\/i>, y el cierre, que saca una consecuencia y no repite la tesis.", "items": [{"enun": "Completa este argumento: «Los exámenes de acceso deberían poder hacerse en dos convocatorias al año, porque quien trabaja no siempre puede presentarse en abril.»", "modelo": "Es cierto que dos convocatorias obligarían a montar dos tribunales y a preparar dos juegos de exámenes, lo que encarece la prueba. Pero ese gasto es pequeño al lado de lo que pierde quien, por no poder pedir el día libre en abril, espera un año entero para presentarse. Cierre: mientras haya una sola fecha, entrar en la universidad seguirá dependiendo del calendario de la empresa de cada uno."}], "criterio": "La concesión se da por buena si plantea la objeción que pondría quien no está de acuerdo —el gasto, aquí— y si detrás del <i>pero<\/i> hay algo distinto de la tesis. El cierre se da por bueno si anuncia qué pasa si nada cambia; «por eso creo que hacen falta dos convocatorias» repetiría la tesis y no cerraría nada.", "apoyo": ["La concesión y el cierre"]}, {"tipo": "clasificar", "titulo": "¿Sirve como tesis?", "ops": ["admite la contraria", "no la discute nadie", "solo anuncia el tema"], "ayuda": "Siete tesis para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?». Señala cuáles admiten la contraria y explica por qué fallan las otras.", "items": [{"enun": "«Ahorrar energía es bueno.»", "sol": "no la discute nadie", "porque": "nadie sostendría lo contrario, y con ella no queda nada que defender"}, {"enun": "«El descuento de la tarifa nocturna debería ampliarse a la tarde para quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede contestar que la tarifa tiene que ser igual para todos: hay postura"}, {"enun": "«Voy a hablar de la tarifa eléctrica por horas.»", "sol": "solo anuncia el tema", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}, {"enun": "«La factura de la luz es un gasto importante para las familias.»", "sol": "no la discute nadie", "porque": "lleva un adjetivo valorativo en lugar de una postura, y no admite réplica"}, {"enun": "«La luz debería costar lo mismo a cualquier hora del día.»", "sol": "admite la contraria", "porque": "se puede sostener lo contrario, y de hecho la tarifa actual lo sostiene"}, {"enun": "«En este texto se habla de la lavadora de Ramón y de los tramos de la tarifa.»", "sol": "solo anuncia el tema", "porque": "resume el texto leído en lugar de tomar postura sobre la pregunta"}, {"enun": "«Los tramos horarios perjudican a quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede defender que los tramos benefician a todos por igual"}], "criterio": "Tres sirven y cuatro no, y las cuatro fallan por una de las dos razones de la teoría: o nadie las discute, o anuncian el tema sin decir nada sobre él. La comprobación es siempre la misma: escribir la frase contraria y comprobar si alguien la firmaría. «Ahorrar energía es malo» no la firma nadie, y por eso su contraria tampoco defiende nada; «la luz debería costar distinto según la hora» sí la firmaría la compañía eléctrica, y por eso «la luz debería costar lo mismo a cualquier hora» es una tesis.", "apoyo": ["Las cinco partes, contadas"]}, {"tipo": "clasificar", "titulo": "¿Argumento o ejemplo?", "ops": ["argumento", "ejemplo"], "ayuda": "Seis frases sobre el tema del texto. El argumento explica por qué pasa algo; el ejemplo cuenta un caso.", "items": [{"enun": "«Encender las centrales de reserva en hora punta contamina más, así que repartir la demanda reduce emisiones.»", "sol": "argumento", "porque": "explica un mecanismo: por qué repartir la demanda tiene un efecto"}, {"enun": "«En mi escalera hay tres familias que planchan de madrugada.»", "sol": "ejemplo", "porque": "un caso contado, sin explicar por qué pasa"}, {"enun": "«Mi cuñado pone el lavavajillas a las dos de la mañana.»", "sol": "ejemplo", "porque": "un caso; se contesta con «pues mi cuñado lo pone a las ocho»"}, {"enun": "«Cuando el precio cambia por horas, el ahorro va a parar a quien tiene horario flexible, que suele ser quien más cobra.»", "sol": "argumento", "porque": "explica a quién beneficia el mecanismo y por qué"}, {"enun": "«Quien hace turnos no puede mover su consumo a las horas baratas, porque no elige a qué hora está en casa.»", "sol": "argumento", "porque": "la razón lleva su <i>porque<\/i> dentro"}, {"enun": "«El año pasado mi factura de julio subió treinta euros.»", "sol": "ejemplo", "porque": "un dato de un caso, sin la razón que lo explica"}], "criterio": "Los tres ejemplos hablan de una persona o de una factura concretas; los tres argumentos hablan de lo que pasa siempre que se da una condición, y por eso llevan un <i>porque<\/i>, un <i>así que<\/i> o un <i>cuando<\/i>. El ejemplo cabe dentro del argumento como media línea de apoyo —«quien hace turnos no puede mover su consumo, como mi cuñado, que llega a las diez»—, y ahí sí ayuda.", "apoyo": ["Las cinco partes, contadas"]}, {"tipo": "clasificar", "titulo": "¿De qué examen es cada condición?", "ops": ["Llengua castellana", "Comentari de text", "los dos"], "ayuda": "Ocho condiciones de las dos rúbricas. Indica si valen para la redacción de Llengua castellana, para la del comentario o para las dos.", "items": [{"enun": "Cada falta descuenta 0,1.", "sol": "los dos", "porque": "en los dos exámenes; lo que cambia es el tope"}, {"enun": "Pide dos argumentos distintos, y cada uno vale 0,5.", "sol": "Comentari de text", "porque": "es la banda de adecuación del comentario, escrita así en sus criterios"}, {"enun": "Entre 50 y 80 palabras.", "sol": "Llengua castellana", "porque": "la extensión del 2.2 de castellano"}, {"enun": "Se elige entre dos enunciados.", "sol": "Comentari de text", "porque": "castellano da un solo enunciado"}, {"enun": "El texto tiene que ser argumentativo y sobre el tema del texto leído.", "sol": "los dos", "porque": "los dos piden opinar sobre el tema del texto de partida"}, {"enun": "Entre 150 y 200 palabras.", "sol": "Comentari de text", "porque": "la extensión de la parte 2 del comentario"}, {"enun": "El descuento por faltas se detiene en 2 puntos.", "sol": "Llengua castellana", "porque": "en el comentario no hay tope"}, {"enun": "Pasarse de la extensión o no llegar descuenta 0,5.", "sol": "Comentari de text", "porque": "en castellano la extensión entra en la adecuación, sin cifra aparte"}], "criterio": "Las condiciones que cambian de un examen a otro son cuatro: la extensión, el número de enunciados, el tope de las faltas y la cifra por argumento. Con ellas se decide cómo se reparte el tiempo: en el comentario, contar las palabras al final no es opcional, porque pasarse de 200 o no llegar a 150 descuenta tanto como un argumento entero.", "apoyo": ["intro"], "usa_texto": false}, {"tipo": "abierta", "titulo": "El plan de tres líneas", "ayuda": "Tres minutos, como en el examen. Todavía no se escribe el texto: solo el plan.", "items": [{"enun": "Para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?», escribe el plan de tres líneas: tu tesis, en una frase que admita la contraria; tus dos razones, de clases distintas —un dato, un caso parecido, la experiencia propia—; y cómo cierras, con una consecuencia y no con la tesis repetida.", "modelo": "Tesis: la luz debería costar lo mismo a todas horas, porque el precio por tramos solo lo aprovecha quien elige su horario. Razón 1, un dato: la hora punta cuesta el doble que la madrugada, y quien vuelve del turno a las diez consume en punta sin poder evitarlo. Razón 2, un caso parecido: el agua se cobra igual a cualquier hora y nadie pide que ducharse a las ocho cueste más. Cierre: si el precio depende del horario, el ahorro se lo queda quien tiene un horario que elegir."}], "criterio": "El plan se da por bueno si la tesis admite réplica, si las dos razones no dependen una de otra —en el modelo, un dato y un caso parecido— y si el cierre añade algo que no estaba en la tesis. Un plan con dos razones que dependen una de otra produce después dos argumentos que dicen lo mismo con dos cifras, y la banda de adecuación del comentario da sus 0,5 solo a los «válidos y diferentes».", "apoyo": ["El esqueleto, que es el mismo en los dos", "Las cinco partes, contadas"], "usa_texto": false}], "cuaderno": [{"pieza": 10, "apartados": [6, 7], "ejercicios": [8, 9, 10]}, {"pieza": 11, "apartados": [1, 2, 3], "ejercicios": [1, 2, 3, 4, 5]}], "cuaderno_txt": "Pieza 10 · Leer el texto entero y contestar el test — apartados 6 y 7: Responder sin copiar; Los rasgos del texto narrativo (p. 57 y 58) · ejercicios 8, 9 y 10 · Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 1, 2 y 3: El esqueleto, que es un formato de práctica; Seis reglas sobre esas cinco partes; Las dos rúbricas, banda por banda (p. 62, 63 y 66) · ejercicios 1, 2, 3, 4 y 5"}, {"chapa": "El texto", "titulo": "<i>La sonrisa etrusca<\/i>, de José Luis Sampedro", "meta": "Convocatoria 2015, tribunal especial · fragmento final de la novela · 238 palabras · el primer texto que se contesta solo, con reloj", "literal": true, "teoria": "<p>Este es el texto que hoy se contesta en clase por cuenta de cada uno, cronometrado, sobre la fotocopia del cuadernillo de 2015; aquí está para volver a él en casa. Es la primera novela del curso y trae, en la misma página, las tres trampas que se acaban de explicar: una pregunta con NO, un distractor de anáfora que concuerda y una paráfrasis. Cinco preguntas de test y una abierta: el formato actual. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "La sonrisa etrusca", "entrada": "José Luis Sampedro · <i>La sonrisa etrusca<\/i> (Madrid: Alfaguara, 1985) · fragmento final de la novela, tal como lo reproduce el cuadernillo de Llengua castellana de 2015 (tribunal especial).", "lineas": ["El niño, inquieto ante esta noche tan diferente, gatea por la", "cama hacia el viejo. Se agarra temeroso al brazo ya paralizado", "y se pone en pie, su carita junto a la del abuelo, esperando,", "esperando… De golpe, su instinto le revela el desplome del", "mundo, la tiniebla vacía. El aletazo de la soledad le arranca", "la palabra tantas veces oída:", "", "—Non-no* —pronuncia nítidamente, frente a ese rostro cuyos", "ojos le buscan ya sin verle, pero cuyos oídos aún le oyen,", "anegados de júbilo. Y repite el conjuro, su llamada de", "cachorro perdido—. Nonno, nonno. ¡Nonno!", "", "¡Por fin ese cántico celeste!", "", "Colores de ultramundo, lumbres de mil estrellas incendian el", "viejo corazón y le arrebatan a esta gloria, esta grandeza,", "esta palabra insondable:", "", "¡NONNO!", "", "A ella se entrega para siempre el viejo, invocando el nombre", "infantil que sus labios ya no logran pronunciar.", "", "El niño, en su desamparo, inicia un gemido. Pero se calma al", "olfatear en la vieja manta el rastro de los brazos que le", "acunaban. Se envuelve confiado en sus pliegues, en ese olor", "que reconstruye el mundo al devolverle la presencia de su", "abuelo, y clama, orgulloso de su proeza, una y otra vez:", "", "—¡Nonno, nonno, nonno, nonno…!", "", "Sus manitas, mientras tanto, juguetean con los amuletos.", "", "En la carnal arcilla del viejo rostro ha florecido una sonrisa", "que se petrifica poco a poco, sobre un trasfondo sanguíneo de", "antigua terracota. *Nonno: En italiano, abuelo."], "pie": "* <i>Nonno<\/i>: en italiano, abuelo. — Fragmento de <i>La sonrisa etrusca<\/i>, de José Luis Sampedro (Alfaguara, 1985), en la versión del cuadernillo oficial de la PAU +25 de 2015, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2015_general_llengua_castellana_suplent.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cinco preguntas de test", "ayuda": "Las preguntas 1.1 a 1.5 del cuadernillo, literales, con su respuesta oficial. Diez minutos de reloj para las seis, como en el examen; después se corrige.", "items": [{"enun": "<b>1.1<\/b> ¿Cuál de las siguientes palabras NO es un sinónimo de <i>insondable<\/i> en el texto?", "conv": "2015s", "ops": ["Inescrutable.", "Ininteligible.", "Inconmensurable.", "Impenetrable."], "sol": "Ininteligible.", "porque": "léxico con NO, y con un distractor de forma: la que hay que marcar se parece a <i>insondable<\/i> más que las otras tres, con su prefijo negativo y su terminación culta. Las otras tres son sinónimos"}, {"enun": "<b>1.2<\/b> ¿Qué palabras describen mejor este texto?", "conv": "2015s", "ops": ["Conmovedor y sosegado.", "Sospechoso y turbador.", "Angustiado y excitante.", "Ingenioso y misterioso."], "sol": "Conmovedor y sosegado.", "porque": "global, y pregunta el tono: no hay una línea que la conteste. Los tres distractores emparejan un adjetivo plausible con otro que no encaja —<i>sospechoso<\/i>, <i>angustiado<\/i>, <i>ingenioso<\/i>—, y se descartan por la segunda palabra de cada par"}, {"enun": "<b>1.3<\/b> ¿Cuál de los siguientes enunciados del texto recoge el momento en que el abuelo ya ha fallecido?", "conv": "2015s", "ops": ["A ella se entrega para siempre el viejo, invocando el nombre infantil que sus labios ya no logran pronunciar.", "De golpe, su instinto le revela el desplome del mundo, la tiniebla vacía.", "En la carnal arcilla del viejo rostro ha florecido una sonrisa que se petrifica poco a poco.", "Colores de ultramundo, lumbres de mil estrellas incendian el viejo corazón."], "sol": "En la carnal arcilla del viejo rostro ha florecido una sonrisa que se petrifica poco a poco.", "porque": "local, y exige leer la metáfora: «una sonrisa que se petrifica» es la muerte expresada sin nombrarla. El distractor b) describe el momento en que el niño se entera"}, {"enun": "<b>1.4<\/b> ¿A quién o a qué se refiere la palabra <i>su<\/i> en la oración «De golpe, <b>su<\/b> instinto le revela el desplome del mundo, la tiniebla vacía»?", "conv": "2015s", "ops": ["A la manta.", "Al abuelo.", "A la tiniebla.", "Al niño."], "sol": "Al niño.", "porque": "anáfora con el distractor que concuerda: <i>su<\/i> podría ser del abuelo o del niño. Quien tiene el instinto que revela el desplome es el niño, y se decide leyendo despacio la oración anterior"}, {"enun": "<b>1.5<\/b> ¿Qué despierta en el niño el recuerdo de su abuelo?", "conv": "2015s", "ops": ["La visión de los ojos del abuelo.", "El olor de la manta.", "La sonrisa del abuelo.", "Los amuletos."], "sol": "El olor de la manta.", "porque": "local, sin trampa: «se calma al olfatear en la vieja manta el rastro de los brazos que le acunaban»"}], "criterio": "Medio punto por acierto y 0,16 por error. Dos de las cinco se contestan volviendo al texto y nada más; la 1.2 se decide con el texto entero, y con dos opciones descartadas contestar gana 0,17 de media; la 1.1 y la 1.4 son las dos trampas de la semana, el NO y el distractor que concuerda.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La paráfrasis", "ayuda": "Con tus palabras, sin repetir las del texto.", "items": [{"enun": "<b>1.6<\/b> Sustituya, utilizando sus propias palabras, el sintagma <i>anegados de júbilo<\/i> en la siguiente oración extraída del texto: «[…] ese rostro cuyos ojos le buscan ya sin verle, pero cuyos oídos aún le oyen, …».", "corto": 16, "conv": "2015s", "modelo": "Clave oficial: inundados de alegría, llenos de gozo, de felicidad, de satisfacción… Se corrige por sustitución: se pone la respuesta en la oración y se lee entera; si se sostiene y no repite las palabras del texto, el punto es entero."}], "criterio": "La clave admite varias soluciones. Es la primera aplicación de los tres pasos para decir lo mismo con otras palabras —cambiar la palabra, cambiar el verbo, resumir la cita— y la antepasada de la microtarea de paráfrasis.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [2]}, {"pieza": "TEXTOS", "apartados": [2]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 2: 2015, tribunal especial · La sonrisa etrusca (p. 251) · Los textos de cada sesión — apartado 2: «La sonrisa etrusca» · texto de examen"}, {"chapa": "Carril C", "titulo": "La tanda de categoría", "meta": "10 minutos · los cinco ítems reales que quedan y nueve propios, en el formato del examen", "teoria": "<p>El jueves se dieron las diez palabras del censo, las tres fronteras y los cuatro ítems reales de <i>ya<\/i>, <i>aun<\/i> y <i>bien… bien<\/i>. Hoy la tanda son los otros cinco ítems reales de exámenes que no se leen en clase, con su chapa de año, sus opciones y su respuesta oficial, y nueve propios escritos en el mismo formato. Los propios van a propósito contra la estadística: en los doce ítems reales la respuesta es <i>adverbio<\/i> en diez, y quien conteste siempre «adverbio» acierta diez de doce sin abrir el método; esa costumbre falla en los dos ítems cuya respuesta no es adverbio y en cuanto la palabra preguntada sea un sustantivo o un determinante. Por eso aquí solo tres de los nueve propios son adverbios.<\/p>\n\n<h3>Qué pide cada uno<\/h3>\n<p>Las tres preguntas, en orden: si la palabra cambia de forma; si acompaña a un sustantivo o va en su lugar; si une o modifica. Y las dos pruebas de las fronteras: el complemento —si la palabra forma grupo con lo que lleva detrás, preposición; si no lleva complemento, adverbio— y el plural —si tiene que cambiar, adjetivo; si se queda como estaba, adverbio—. Quitar la palabra no decide ninguna de las dos: «Pasó la tarde mirando el cielo» se sostiene sin <i>hacia<\/i>, y la clave oficial de 2026s 3.1 da <i>preposición<\/i>. Los adverbios de tiempo admiten preposición delante y siguen siendo adverbios: <i>desde ayer<\/i>, <i>hasta mañana<\/i>, <i>para siempre<\/i>, <i>desde entonces<\/i>. Si fueran sustantivos admitirían un determinante, <i>desde la mañana<\/i>, y la oración hablaría de una franja del día, no del día siguiente.<\/p>\n\n<h3>Un aviso sobre la palabra «adjetivo» en el examen<\/h3>\n<p>2025t, 1.4: «El texto presenta una adjetivación muy rica. ¿Qué tipo de adjetivos predominan?» a) Numerales. b) Indefinidos. c) Calificativos. d) Demostrativos. La respuesta oficial es la c). El enunciado llama <i>adjetivos<\/i> a los numerales, los indefinidos y los demostrativos, que en la tabla de las nueve clases son determinantes cuando acompañan a un sustantivo: es la terminología antigua, que todavía aparece. La pregunta es qué abunda en un texto «rico en adjetivación», : los calificativos, los que indican cómo es el sustantivo.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "La tanda: cinco reales y nueve propios", "ayuda": "Catorce ítems con cuatro opciones. Los cinco con chapa de año son literales del examen; los nueve sin chapa están escritos en el mismo formato. Aplica el método entero antes de elegir: ¿cambia de forma?, ¿lleva un sustantivo al lado?, ¿une?", "items": [{"enun": "¿A qué categoría gramatical pertenece la palabra <i>ya<\/i> en la siguiente oración: «Pero él <b>ya<\/b> no le escuchaba y se alejaba a buen paso de la casa»?", "conv": "2019t", "ops": ["Pronombre", "Conjunción", "Adjetivo", "Adverbio"], "sol": "Adverbio", "porque": "el mismo ítem que el de 2015s con otra oración, y con las opciones barajadas: la respuesta está en la d) aquí y en la a) allí"}, {"enun": "¿Cuál es la categoría gramatical de la palabra <i>hasta<\/i> en la siguiente oración: «Esto lo hace <b>hasta<\/b> un niño pequeño»?", "conv": "2020s", "ops": ["Pronombre", "Preposición", "Adverbio", "Conjunción"], "sol": "Adverbio", "porque": "equivale a <i>incluso<\/i> y se puede quitar sin que la oración quede coja —«Esto lo hace un niño pequeño»—; una preposición dejaría un hueco, y por eso <i>preposición<\/i> es el distractor fuerte"}, {"enun": "Identifique a qué clase de palabra corresponde <i>harto<\/i> en la oración «La situación es <b>harto<\/b> complicada».", "conv": "2025t", "ops": ["Adjetivo", "Preposición", "Determinante", "Adverbio"], "sol": "Adverbio", "porque": "modifica al adjetivo <i>complicada<\/i> y no cambia de forma: no se dice ⊗<i>harta complicada<\/i>. En «estaba harto», en cambio, sí es adjetivo"}, {"enun": "¿Qué clase de palabra es <i>mañana<\/i> en la siguiente oración: «Desde <b>mañana<\/b> trabajará en la nueva empresa de informática»?", "conv": "2026t", "ops": ["Sustantivo", "Preposición", "Adjetivo", "Adverbio"], "sol": "Adverbio", "porque": "los adverbios de tiempo admiten preposición delante y siguen siendo adverbios; si fuera sustantivo admitiría determinante, «desde la mañana», y hablaría de una franja del día"}, {"enun": "¿Qué clase de palabra es <i>hacia<\/i> en la oración «Pasó toda la tarde mirando <b>hacia<\/b> el cielo»?", "conv": "2026s", "ops": ["Conjunción", "Preposición", "Adjetivo", "Adverbio"], "sol": "Preposición", "porque": "«Pasó toda la tarde mirando el cielo» cambia de significado y deja el complemento suelto; además está en la lista cerrada"}, {"enun": "Indique la categoría gramatical de <i>medias<\/i> en la oración «Las notas <b>medias<\/b> del grupo subieron dos décimas».", "ops": ["Adverbio", "Determinante", "Sustantivo", "Adjetivo"], "sol": "Adjetivo", "porque": "concuerda con <i>notas<\/i> y expresa cómo son, no cuántas"}, {"enun": "Indique la categoría gramatical de <i>medio<\/i> en la oración «Llegó <b>medio<\/b> dormido al trabajo».", "ops": ["Determinante", "Adjetivo", "Adverbio", "Sustantivo"], "sol": "Adverbio", "porque": "no cambia de forma: de una mujer se dice <i>medio dormida<\/i>, no ⊗<i>media dormida<\/i>"}, {"enun": "¿Qué clase de palabra es <i>media<\/i> en la oración «<b>Media<\/b> plantilla se acogió a la reducción de jornada»?", "ops": ["Determinante", "Adverbio", "Adjetivo", "Pronombre"], "sol": "Determinante", "porque": "acompaña a <i>plantilla<\/i>, concuerda con ella e indica cuánta"}, {"enun": "¿Qué clase de palabra es <i>rojo<\/i> en la oración «El <b>rojo<\/b> del semáforo se ve mal desde aquí»?", "ops": ["Sustantivo", "Adjetivo", "Adverbio", "Determinante"], "sol": "Sustantivo", "porque": "lleva un determinante delante, <i>el<\/i>, y hace de sujeto de <i>se ve<\/i>; en «el semáforo rojo» sería adjetivo"}, {"enun": "Indique la categoría gramatical de <i>bajo<\/i> en la oración «Firmaron el contrato <b>bajo<\/b> presión».", "ops": ["Adjetivo", "Adverbio", "Sustantivo", "Preposición"], "sol": "Preposición", "porque": "va delante de su complemento, <i>presión<\/i>, y forma grupo con él; es adjetivo en «un techo bajo», sustantivo en «el bajo del edificio» y adverbio en «habla bajo»"}, {"enun": "¿A qué categoría gramatical pertenece <i>luego<\/i> en la oración «Terminó el turno y <b>luego<\/b> se fue a casa»?", "ops": ["Conjunción", "Preposición", "Adverbio", "Adjetivo"], "sol": "Adverbio", "porque": "indica cuándo y no une nada; es conjunción en «pienso, luego existo», donde saca una consecuencia"}, {"enun": "¿Qué clase de palabra es <i>nada<\/i> en la oración «No dijo <b>nada<\/b> en toda la reunión»?", "ops": ["Pronombre", "Adverbio", "Determinante", "Sustantivo"], "sol": "Pronombre", "porque": "ocupa el sitio de un sustantivo —nombra el contenido de la respuesta— y hace de complemento directo; en «no me gusta nada este turno» sería adverbio"}, {"enun": "¿Qué clase de palabra es <i>solo<\/i> en la oración «A la reunión <b>solo<\/b> vino la encargada»?", "ops": ["Adjetivo", "Adverbio", "Determinante", "Pronombre"], "sol": "Adverbio", "porque": "equivale a <i>solamente<\/i>; el sujeto es femenino, así que el adjetivo tendría que ser <i>sola<\/i> —«vino sola la encargada», sin compañía—, y la palabra está en masculino"}, {"enun": "¿A qué categoría gramatical pertenece <i>aunque<\/i> en la oración «Fue a trabajar <b>aunque<\/b> tenía fiebre»?", "ops": ["Adverbio", "Conjunción", "Preposición", "Pronombre"], "sol": "Conjunción", "porque": "mete una oración dentro de otra y admite el cambio por <i>a pesar de que<\/i>"}], "criterio": "Siete de las catorce respuestas son <i>adverbio<\/i>, y las otras siete se reparten entre las demás clases. Los tres ítems con más trampa son <i>hasta<\/i>, que está en la lista de preposiciones y aquí no lo es; <i>mañana<\/i>, porque va detrás de una preposición y mucha gente da por hecho que detrás de una preposición solo caben sustantivos; y la serie <i>medio<\/i>, <i>media<\/i>, <i>medias<\/i>, una sola palabra con tres clases según lo que tiene al lado.", "apoyo": ["Qué pide cada uno"]}, {"tipo": "hueco", "titulo": "Escribe la clase", "ayuda": "Cinco oraciones más, sin opciones: escribe el nombre de la clase de la palabra en negrita.", "items": [{"enun": "El informe llegó <b>ayer<\/b>.", "sol": "adverbio", "porque": "indica cuándo y no cambia de forma"}, {"enun": "Salió <b>con<\/b> prisa.", "sol": "preposición", "porque": "va delante de su complemento, <i>prisa<\/i>"}, {"enun": "<b>Ninguno<\/b> de los dos contestó.", "sol": "pronombre", "porque": "va solo y ocupa el sitio de un sustantivo"}, {"enun": "Este mes no hay <b>ningún<\/b> turno libre.", "sol": "determinante", "porque": "acompaña a <i>turno<\/i>; la forma se apoya en el sustantivo"}, {"enun": "Es un piso <b>pequeño<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>piso<\/i> y expresa cómo es: <i>una casa pequeña<\/i>"}], "criterio": "Las cinco clases distintas, sin opciones que ayuden. <i>Ninguno<\/i> y <i>ningún<\/i> son la pareja del día: la forma corta va pegada al sustantivo y es determinante; la forma entera va sola y es pronombre.", "apoyo": ["Qué pide cada uno"]}], "cuaderno": {"pieza": 6, "apartados": [2]}, "cuaderno_txt": "Pieza 6 · Las nueve clases y la categoría de una palabra en su oración — apartado 2: La categoría de una palabra en su oración (p. 154)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto del carril B está inventado para practicar. El fragmento de <i>La sonrisa etrusca<\/i> de José Luis Sampedro (Alfaguara, 1985), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2015, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —oscaralejandrobanos.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });
    ventana.querySelector('.v-x').focus();
  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer <h3> y un
     bloque por cada <h3>. "apoyo" del ejercicio dice cuáles enseñar. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h3[^>]*>[\s\S]*?<\/h3>)/);
    var out = [{ titulo: '', html: partes[0] }];
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      out.push({ titulo: tit, html: partes[i] + (partes[i + 1] || '') });
    }
    return out;
  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        if (ej.tipo === 'abierta' && ej.palabras) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = ej.palabras, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.sol));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
