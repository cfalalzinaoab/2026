da": "Pon la diéresis y la tilde donde hagan falta. El enunciado no indica cuántas llevan diéresis, igual que en el examen; dos de las que la llevan necesitan además tilde.", "estricto": true, "items": [{"enun": "<i>verguenza<\/i>", "sol": "vergüenza", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>guerra<\/i>", "sol": "guerra", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>pinguino<\/i>", "sol": "pingüino", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>quince<\/i>", "sol": "quince", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>averigueis<\/i>", "sol": "averigüéis", "porque": "lleva diéresis: la <i>u<\/i> suena; y tilde, por ser aguda acabada en -s"}, {"enun": "<i>linguistica<\/i>", "sol": "lingüística", "porque": "lleva diéresis: la <i>u<\/i> suena; y tilde, por ser esdrújula"}, {"enun": "<i>antiguedad<\/i>", "sol": "antigüedad", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>guitarra<\/i>", "sol": "guitarra", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>cigueña<\/i>", "sol": "cigüeña", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>desague<\/i>", "sol": "desagüe", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>seguido<\/i>", "sol": "seguido", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>bilingue<\/i>", "sol": "bilingüe", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>paraguero<\/i>", "sol": "paragüero", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>guiso<\/i>", "sol": "guiso", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>unguento<\/i>", "sol": "ungüento", "porque": "lleva diéresis: la <i>u<\/i> suena"}, {"enun": "<i>nicaraguense<\/i>", "sol": "nicaragüense", "porque": "lleva diéresis: la <i>u<\/i> suena"}], "criterio": "Once de las dieciséis llevan diéresis: en todas la <i>u<\/i> de <i>gue<\/i> o <i>gui<\/i> se pronuncia. En <i>guerra<\/i>, <i>guitarra<\/i>, <i>seguido<\/i>, <i>guiso<\/i> y <i>quince<\/i> no suena, y no la llevan.", "apoyo": ["6 · La diéresis"], "dossier_txt": "Del dossier: pieza 2, ejercicio 5"}, {"tipo": "hueco", "titulo": "¿Diptongo o hiato? Pon la tilde si hace falta", "estricto": true, "ayuda": "Ocho palabras escritas sin tilde. En cada una hay una sola pregunta: ¿hay una vocal abierta al lado de la cerrada, y la cerrada lleva la fuerza? Copia la palabra con tilde si le corresponde, y tal cual si no.", "items": [{"enun": "<i>sonreir<\/i>", "sol": "sonreír", "porque": "<i>e<\/i> abierta + <i>í<\/i> cerrada tónica: hiato, <i>son-re-ír<\/i>"}, {"enun": "<i>fluido<\/i>", "sol": "fluido", "porque": "<i>ui<\/i>, dos cerradas: diptongo, y por las tres reglas es llana acabada en vocal"}, {"enun": "<i>raiz<\/i>", "sol": "raíz", "porque": "<i>a<\/i> + <i>í<\/i> tónica: hiato, <i>ra-íz<\/i>"}, {"enun": "<i>cuidar<\/i>", "sol": "cuidar", "porque": "<i>ui<\/i>: diptongo; aguda acabada en -r, sin tilde"}, {"enun": "<i>policia<\/i>", "sol": "policía", "porque": "<i>í<\/i> tónica + <i>a<\/i>: hiato, <i>po-li-cí-a<\/i>"}, {"enun": "<i>aire<\/i>", "sol": "aire", "porque": "<i>ai<\/i>: la cerrada no lleva la fuerza, diptongo; llana acabada en vocal"}, {"enun": "<i>prohibo<\/i>", "sol": "prohíbo", "porque": "<i>o<\/i> + <i>í<\/i> tónica con hache en medio: hiato, <i>pro-hí-bo<\/i>"}, {"enun": "<i>transeunte<\/i>", "sol": "transeúnte", "porque": "<i>e<\/i> + <i>ú<\/i> tónica: hiato, <i>tran-se-ún-te<\/i>"}], "criterio": "Cinco llevan tilde y tres no, y ninguna de las cinco la llevaría por las tres reglas: <i>sonreír<\/i> es aguda acabada en -r, <i>policía<\/i> es llana acabada en vocal. Las tres que se quedan como están tienen o bien dos cerradas —<i>fluido<\/i>, <i>cuidar<\/i>— o bien una cerrada sin fuerza —<i>aire<\/i>—, y en las tres el diptongo se mantiene.", "apoyo": ["5 · Las mismas letras, otra palabra"], "solo_web": true}], "cuaderno": {"pieza": 2, "apartados": [5, 6], "ejercicios": [4, 5]}, "cuaderno_txt": "Pieza 2 · Vocales en contacto — apartados 5 y 6: Las mismas letras, otra palabra; La diéresis (p. 19 y 20) · ejercicios 4 y 5", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Escribir: la concesión, el cierre y el texto narrativo", "meta": "60 minutos · la tesis discutible, la concesión que responde, el cierre que no repite; los cinco rasgos del texto narrativo; el primer texto por tu cuenta, 2015s, en el carril «El texto»", "teoria": "<h3>Pieza 10 · 6 · Responder sin copiar<\/h3>\n<p>Este apartado vale para las tres preguntas abiertas del comentario, que suman 3 puntos, y va antes que el estudio de cada una. Los criterios oficiales lo recogen con estas palabras en las seis convocatorias: <strong>«se considerará incorrecto reproducir frases del original».<\/strong><\/p>\n<p>La instrucción prohíbe reproducir frases del original, y una palabra suelta repetida no es una frase. Un nombre propio o un término técnico se repiten sin problema, porque no tienen sinónimo.<\/p>\n<p><strong>Tres pasos para decir lo mismo con otras palabras:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>paso<\/th>\n<th>antes<\/th>\n<th>después<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cambiar la palabra<\/strong><\/td>\n<td>«una inversión inicial desorbitada»<\/td>\n<td>un dinero de entrada muy alto<\/td>\n<\/tr>\n<tr>\n<td><strong>cambiar el verbo, y con él la construcción<\/strong><\/td>\n<td>«los precios se han disparado»<\/td>\n<td>el precio ha subido mucho en poco tiempo<\/td>\n<\/tr>\n<tr>\n<td><strong>resumir la cita en tus términos<\/strong><\/td>\n<td>«Nadie quiere quedarse. ¿Cómo va a querer?»<\/td>\n<td>el autor sostiene que ya no hay relevo generacional<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Una cita entrecomillada dentro de tu respuesta cuenta como frase reproducida del original, así que el tercer paso deja de ser opcional en cuanto el texto trae voces citadas.<\/p>\n<p><strong>Dos avisos más sobre las abiertas del comentario<\/strong>, que se puntúan en cuartos (0,25, 0,5, 0,75 y 1 según la precisión):<\/p>\n<ul>\n<li><strong>Cada falta de ortografía, léxico, morfología o sintaxis descuenta 0,1<\/strong>, y en el comentario ese descuento <strong>no tiene tope<\/strong>: se aplica a los 7 puntos que se escriben. En castellano el mismo descuento existe, solo en el bloque de expresión, y ahí sí se detiene en 2 puntos.<\/li>\n<li><strong>La respuesta ocupa de una a cinco líneas.<\/strong> Lo indica el enunciado. Media página en una pregunta de 1 punto resta tiempo a la redacción, que vale 4.<\/li>\n<\/ul>\n<h3>Pieza 10 · 7 · Los rasgos del texto narrativo<\/h3>\n<p>Cuando el texto es una novela, uno de los seis ítems puede pedirte que demuestres que es narrativo. Ha caído dos veces en castellano, y las dos claves oficiales piden lo mismo con distintas palabras. La lista que hay que poder recitar tiene cinco elementos:<\/p>\n<ol>\n<li><strong>Sucesión de acontecimientos<\/strong>: ocurren hechos, uno detrás de otro.<\/li>\n<li><strong>Causalidad<\/strong>: cada hecho lleva al siguiente, y no están puestos en cualquier orden.<\/li>\n<li><strong>Un actor-sujeto<\/strong> que sostiene la unidad del relato: los hechos le pasan a alguien.<\/li>\n<li><strong>Verbos en pasado<\/strong>, sobre todo perfecto simple e imperfecto.<\/li>\n<li><strong>Marcas de tiempo y de lugar<\/strong>: <em>entonces<\/em>, <em>al día siguiente<\/em>, <em>allí<\/em>, <em>en aquella casa<\/em>.<\/li>\n<\/ol>\n<p><strong>Da tantos rasgos como te pida el enunciado.<\/strong> El número está escrito en la pregunta, y las dos claves oficiales descuentan por cada uno que falte:<\/p>\n<blockquote>\n<p>2015t, 1.5: «Indique al menos <strong>tres<\/strong> elementos característicos del texto (lingüísticos y textuales) que demuestran que es de tipo narrativo». La clave descuenta <strong>0,16 por cada elemento erróneo u omitido<\/strong>.<\/p>\n<p>2020t, 1.6: «Este fragmento es un claro ejemplo de texto narrativo. Mencione <strong>dos<\/strong> rasgos, o propiedades prototípicas, que lo identifican como una narración». La clave descuenta <strong>0,25 por rasgo no proporcionado<\/strong>.<\/p>\n<\/blockquote>\n<p>Si pide tres y escribes dos, pierdes 0,16 aunque los dos sean correctos. Se escriben los tres, aunque el tercero sea el menos evidente de los cinco.<\/p>\n<div class=\"enelexamen\"><strong>En los dos exámenes.<\/strong> Los dos acaban pidiendo un texto argumentativo sobre el tema del texto que acabas de leer. Cambian la extensión y la manera de puntuarlo.<\/div>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Llengua castellana 2.2<\/th>\n<th>Comentari de text, parte 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>vale<\/strong><\/td>\n<td>3 puntos<\/td>\n<td><strong>4 puntos<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>50 a 80 palabras<\/td>\n<td><strong>150 a 200 palabras<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>cae<\/strong><\/td>\n<td>en los 24 exámenes<\/td>\n<td>en los 6<\/td>\n<\/tr>\n<tr>\n<td><strong>elección<\/strong><\/td>\n<td>un solo enunciado<\/td>\n<td>dos enunciados, se elige uno<\/td>\n<\/tr>\n<tr>\n<td><strong>qué pide<\/strong><\/td>\n<td>«exprese su opinión sobre…», «desarrolle la siguiente cuestión»<\/td>\n<td>responder a una pregunta <strong>con dos argumentos como mínimo<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>rúbrica<\/strong><\/td>\n<td>adecuación · coherencia · cohesión · riqueza de expresión (léxico y sintaxis)<\/td>\n<td>adecuación 1 · coherencia 1,5 · estilo 1,5<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión mal<\/strong><\/td>\n<td>—<\/td>\n<td><strong>−0,5<\/strong> por bajar de 150 o pasar de 200<\/td>\n<\/tr>\n<tr>\n<td><strong>faltas<\/strong><\/td>\n<td>−0,1 cada una, solo en este bloque, <strong>tope de 2 puntos<\/strong><\/td>\n<td>−0,1 cada una, <strong>sin tope<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Entre los dos suman <strong>7 de los 20 puntos del curso<\/strong>, más que ningún otro apartado.<\/p>\n<p>Y desde 2026 la clave de Llengua castellana añade una línea: <strong>«Se valorará la presencia de conectores argumentativos».<\/strong><\/p>\n<h3>Pieza 11 · 1 · El esqueleto, que es un formato de práctica<\/h3>\n<p><strong>Tesis · dos razones · cierre.<\/strong> Las dos rúbricas piden lo mismo: que se sepa qué defiendes y que lo defiendas con dos razones diferentes. Entre un examen y el otro cambia la extensión de cada parte.<\/p>\n<table>\n<thead>\n<tr>\n<th>parte<\/th>\n<th>en 50-80 palabras<\/th>\n<th>en 150-200 palabras<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tesis<\/strong><\/td>\n<td>una frase, 12-18 palabras<\/td>\n<td>una frase, 15-20, y puede llevar delante el planteamiento<\/td>\n<\/tr>\n<tr>\n<td><strong>Argumento 1<\/strong><\/td>\n<td>una o dos frases, 15-20 palabras<\/td>\n<td>40-50: la razón, un dato o un caso dentro, y su consecuencia<\/td>\n<\/tr>\n<tr>\n<td><strong>Argumento 2<\/strong><\/td>\n<td>una o dos frases, 15-20 palabras<\/td>\n<td>30-40, igual que el primero<\/td>\n<\/tr>\n<tr>\n<td><strong>Concesión<\/strong><\/td>\n<td>sin frase propia: va dentro del argumento 2 con <em>aunque<\/em><\/td>\n<td>30-40: una frase entera, <em>es cierto que… pero<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Cierre<\/strong><\/td>\n<td>una frase, 10-15 palabras<\/td>\n<td>18-25: la consecuencia de lo escrito<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Las cifras de la derecha son orientativas y suman de 133 a 175 palabras<\/strong>, así que quien se quede en el mínimo de cada parte no llega a las 150 que pide el enunciado. Con la concesión dentro, el reparto que cumple es 18 · 50 · 40 · 35 · 25.<\/p>\n<p><strong>Qué exige la convocatoria y qué es de este dossier.<\/strong> Los criterios oficiales valoran cuatro apartados —adecuación, coherencia, cohesión y riqueza de expresión— y desde 2026 añaden la presencia de conectores argumentativos. No piden cinco partes ni este reparto de palabras. La tabla de arriba es un <strong>formato de práctica<\/strong>: sirve para escribir los primeros textos sin quedarse en blanco y para repartir el espacio antes de empezar. Un texto que no la siga puede sacar la misma nota si cumple las cuatro bandas. Lo que sí está en los criterios es que los dos argumentos sean <strong>válidos y diferentes<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>La concesión es la diferencia práctica entre los dos formatos.<\/strong> En 50-80 palabras no tiene frase propia y va dentro del argumento 2; en 150-200 ocupa una frase entera, y este dossier la recomienda porque la banda de coherencia del comentario descuenta por «argumentación circular» y la concesión lo dificulta: reconoce la objeción de quien no está de acuerdo y la contesta, así que el texto avanza en lugar de volver sobre sí mismo. Obligatoria no es: un texto sin concesión puede salir coherente, y uno con concesión puede repetirse igual. Lo que añade es una idea que antes no estaba.<\/p>\n<p><strong>La concesión de fórmula.<\/strong> La objeción que se reconoce tiene que ser una que alguien sostenga. «Es cierto que hay opiniones distintas, pero…» reconoce que existe una discusión sin dar ninguna razón del otro lado, y una concesión así no añade ninguna idea al texto. Se corrige escribiendo la objeción con un dato: qué alegaría quien no está de acuerdo, con qué cifra o con qué caso. Detrás del <em>pero<\/em> tampoco vuelve la tesis con otras palabras; va una consecuencia o un dato que la objeción no tenía en cuenta.<\/p>\n<h3>Pieza 11 · 2 · Seis reglas sobre esas cinco partes<\/h3>\n<p><strong>1 · La tesis tiene que admitir la contraria.<\/strong> «La contaminación es un problema» no sirve como tesis, porque nadie lo discute: no queda nada que defender, y los dos argumentos acaban describiendo la situación en lugar de justificar una postura. «Voy a hablar de las redes sociales» tampoco: anuncia el tema y no sostiene ninguna afirmación sobre él. «El tiempo de desplazamiento al trabajo debería contar como jornada» sí admite réplica, y por eso se puede defender.<\/p>\n<p><strong>Cuando el enunciado nombra dos conceptos, la tesis tiene que colocar los dos.<\/strong> El de 2018t pide un texto «en el que exponga su punto de vista sobre el uso y el abuso de las terapias antiaging», y la tesis tiene que fijar dónde acaba el uso y dónde empieza el abuso. Quien escribe solo contra las terapias, o solo a favor, deja fuera uno de los dos conceptos y baja en adecuación. «Tienen sentido mientras tratan un daño y dejan de tenerlo cuando prometen parar el tiempo» admite la contraria y coloca los dos.<\/p>\n<p><strong>2 · Un argumento no es un ejemplo.<\/strong> El argumento explica <strong>por qué<\/strong> pasa algo; el ejemplo cuenta un caso.<\/p>\n<blockquote>\n<p>«Mi vecino estudió de mayor y ahora está mejor» → <strong>ejemplo<\/strong>.\n«Estudiar de adulto cambia la relación con el trabajo, porque quien tiene un título puede elegir entre varios empleos y no aguantar cualquier condición en el único que tiene» → <strong>argumento<\/strong>.<\/p>\n<\/blockquote>\n<p>Un argumento sin ejemplo se sostiene, porque el mecanismo que explica vale para cualquier caso. Un ejemplo sin argumento no se sostiene, porque siempre se puede contestar «pues yo conozco otro caso», y la discusión termina sin que se haya demostrado nada. Por eso el ejemplo va dentro del argumento, en media línea, como prueba de que el mecanismo existe: «Estudiar de adulto cambia la relación con el trabajo, porque quien tiene un título puede elegir entre varios empleos: mi vecina cambió de empresa a los cuarenta y cinco».<\/p>\n<p><strong>3 · Los dos argumentos tienen que ser distintos.<\/strong> Los criterios del comentario lo exigen con esas palabras —«dos argumentos válidos <strong>y diferentes<\/strong>, 0,5 puntos cada argumento»—, así que quien repite la misma razón con otras palabras se queda con 0,5 de los 1 que valen los dos. Dos argumentos son distintos cuando se apoyan en razones que no dependen una de otra: uno en un derecho y otro en un efecto; uno en dinero y otro en salud; uno en lo que le pasa a una persona y otro en lo que le pasa al conjunto. Que además salgan de dos filas distintas de la tabla de los seis tipos es la manera más segura de conseguirlo, y no la única.<\/p>\n<p><strong>4 · Cada argumento entra con su conector.<\/strong> El conector marca dónde empieza cada argumento; que sean dos y no uno repetido lo decide lo que afirma cada uno. <em>En primer lugar… Además… Por otra parte… Por eso.<\/em><\/p>\n<p><strong>5 · La redacción no se anuncia.<\/strong> «Voy a hablar de…», «quiero defenderlo con dos razones», «en esta redacción explicaré…»: son palabras gastadas en contar lo que el corrector ya tiene delante. En 50-80 palabras, una entradilla así ocupa la octava parte del texto; en 150-200, son once palabras que faltan después para la concesión o para el dato de un argumento. La primera frase es la tesis, y el corrector sabe que hay dos razones porque van detrás con su conector.<\/p>\n<p><strong>6 · El cierre saca una consecuencia.<\/strong> El cierre que solo repite la tesis con otras palabras no añade nada, y la rúbrica del comentario recoge entre sus faltas de coherencia las «repeticiones injustificadas» y «no saber concluir»; el que saca una consecuencia aprovecha la última frase.<\/p>\n<h4>De dónde se saca un argumento: los seis tipos<\/h4>\n<p>Quien se queda con un solo argumento suele estar buscando los dos en el mismo material. Hay seis maneras de fundamentar una postura, y cada una se apoya en algo distinto: un dato, la experiencia propia, lo que sostiene un especialista, un caso parecido, una idea que nadie discute o un sentimiento. La columna de la derecha las aplica todas a una misma tesis, la del apartado anterior, y así se comprueba que ninguna repite a las otras.<\/p>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>se apoya en<\/th>\n<th>sobre «el tiempo de desplazamiento al trabajo debería contar como jornada»<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>empírico<\/strong><\/td>\n<td>un hecho comprobable; en este examen los hechos comprobables están en el texto de partida<\/td>\n<td>«Según los datos del texto, quien vive a más de veinte kilómetros dedica diez horas semanales al trayecto»<\/td>\n<\/tr>\n<tr>\n<td><strong>de competencia<\/strong><\/td>\n<td>la experiencia de quien escribe, resumida en una línea y sin contar la vida entera<\/td>\n<td>«Quien ha encadenado turnos con dos autobuses de por medio sabe que esas horas no se recuperan durmiendo»<\/td>\n<\/tr>\n<tr>\n<td><strong>de autoridad<\/strong><\/td>\n<td>lo que sostiene un especialista; el más a mano es quien firma el texto de partida<\/td>\n<td>«El autor del texto, que dirige un servicio de salud laboral, relaciona los trayectos largos con el sueño corto»<\/td>\n<\/tr>\n<tr>\n<td><strong>analogía<\/strong><\/td>\n<td>un caso parecido que ya está resuelto de otra manera<\/td>\n<td>«El tiempo que un electricista pasa yendo de un aviso a otro se paga desde hace años; el del trayecto de casa al trabajo, no»<\/td>\n<\/tr>\n<tr>\n<td><strong>lugar común<\/strong><\/td>\n<td>una idea que acepta todo el mundo<\/td>\n<td>«Nadie discute que el tiempo es lo único que no se recupera» — el menos eficaz de los seis, porque no añade ninguna razón que el lector no tuviera ya<\/td>\n<\/tr>\n<tr>\n<td><strong>afectivo<\/strong><\/td>\n<td>el sentimiento del lector<\/td>\n<td>«Da pena ver a esa gente levantarse a las cinco» — no cuenta como argumento válido, porque no justifica la tesis, y la banda de adecuación da sus 0,5 solo a los válidos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Elegirlos de filas distintas es la manera más segura de que salgan distintos<\/strong>, porque dos razones de la misma fila se apoyan en el mismo material y acaban coincidiendo. No es la única: lo que exige la regla 3 es que una razón no dependa de la otra, y dos empíricas sobre terrenos separados —una en dinero y otra en salud— también cumplen. De ahí salen los 0,5 + 0,5 de «dos argumentos válidos y diferentes».<\/p>\n<p><strong>Ninguna cita se inventa.<\/strong> Una cifra o una frase atribuida a alguien que nunca la sostuvo es una afirmación sin respaldo, y si el corrector conoce la fuente, es además una afirmación falsa. Cuando no se recuerda la fuente con seguridad, el argumento se escribe sin ella: «los trayectos largos acortan el sueño» se sostiene solo, y no necesita un «según un estudio de 2023» inventado.<\/p>\n<h3>Pieza 11 · 3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Reescribe sin reproducir frases del texto", "dossier": {"cuaderno": "10", "ejercicio": 8}, "ayuda": "Estas cinco respuestas reproducen frases del texto. Reescríbelas con los tres pasos del apartado 6.", "items": [{"enun": "<i>El autor dice que «la vivienda se ha convertido en un bien de lujo inalcanzable».<\/i>", "modelo": "<i>El autor sostiene que comprar o alquilar una casa se ha puesto al alcance de muy pocos.<\/i>"}, {"enun": "<i>Según el texto, «los jóvenes retrasan la emancipación hasta los treinta y dos años».<\/i>", "modelo": "<i>Según el texto, la gente joven se independiza cada vez más tarde, a los treinta y dos años de media.<\/i>"}, {"enun": "<i>Porque «no hay relevo generacional y nadie quiere quedarse».<\/i>", "modelo": "<i>Porque, según el agricultor, ya no hay nadie joven que coja el testigo del oficio.<\/i>"}, {"enun": "<i>La autora sostiene que «leer no nos hace mejores personas, solo mejor informadas».<\/i>", "modelo": "<i>La autora sostiene que la lectura aumenta lo que uno sabe y no mejora a la persona que lee.<\/i>"}, {"enun": "<i>El texto explica que lo que no se contabiliza acaba perdiéndose.<\/i>", "modelo": "<i>El texto explica que el consumo de agua que no se contabiliza acaba desperdiciándose.<\/i>"}], "criterio": "Se da el punto si no queda ninguna secuencia de tres o más palabras seguidas del original —el tope de tres es una pauta de práctica de este dossier; los criterios oficiales prohíben «reproducir frases del original»— y si la respuesta se entiende sin tener el texto delante. Las cifras (<i>treinta y dos años<\/i>) y los nombres propios se conservan: no son frases reproducidas.", "apoyo": ["Pieza 11 · 1 · El esqueleto, que es un formato de práctica"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 8"}, {"tipo": "abierta", "titulo": "Dos rasgos de la narración", "dossier": {"cuaderno": "10", "ejercicio": 9}, "items": [{"enun": "Un enunciado pide: «Mencione <b>dos<\/b> rasgos que identifican este fragmento como una narración». Escribe una respuesta completa sobre este párrafo:<br><br>«Aquella mañana Elena salió de casa sin desayunar. Llegó a la parada cuando el autobús ya arrancaba, así que echó a correr detrás de él dos manzanas. El conductor la vio por el espejo y frenó. Ella subió sin aliento y, al buscar la cartera, se dio cuenta de que la había dejado sobre la mesa de la cocina.»", "modelo": "<i>Es una narración porque cuenta una sucesión de hechos encadenados —Elena sale, pierde el autobús, corre, sube— en los que cada uno lleva al siguiente, y porque los verbos van en pasado (salió, llegó, subió) con marcas de tiempo y lugar (aquella mañana, la parada, dos manzanas).<\/i>"}], "criterio": "Dos rasgos, nombrados y ejemplificados sobre el texto. Nombrar uno solo descuenta 0,25. Nombrar los dos sin señalar dónde están en el párrafo se queda a medias; el ítem vale 0,5 y las claves oficiales no publican bandas dentro de esa cifra, así que este reparto es una estimación del dossier.", "apoyo": ["Pieza 10 · 7 · Los rasgos del texto narrativo"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 9"}, {"tipo": "abierta", "titulo": "Los cinco rasgos narrativos", "dossier": {"cuaderno": "10", "ejercicio": 10}, "items": [{"enun": "¿Cuáles de los cinco rasgos narrativos cumple este párrafo y cuáles no? Explica además qué habría que añadirle para que los cumpliera todos.<br><br>«La fábrica ocupa tres naves al final del polígono. Las paredes son de chapa gris y el tejado tiene claraboyas que no cierran bien. Dentro hay ochenta puestos de trabajo, la mayoría en la cadena de envasado, y un comedor con doce mesas.»", "modelo": "<b>Cumple<\/b> el rasgo 5 —marcas de lugar: <i>al final del polígono<\/i>, <i>dentro<\/i>— y ninguno de los otros cuatro. <b>No cumple<\/b> el 1 ni el 2: no ocurre ningún hecho, así que no hay sucesión ni causalidad. <b>No cumple<\/b> el 3: no hay nadie a quien le pase nada. Y <b>no cumple<\/b> el 4: los verbos van en presente (<i>ocupa<\/i>, <i>son<\/i>, <i>tiene<\/i>, <i>hay<\/i>), que es el tiempo de la descripción. Para que cumpliera los cinco haría falta meter dentro a alguien que hiciera algo, en pasado y en un orden en que cada hecho llevara al siguiente: <i>Aquella mañana el encargado subió a revisar las claraboyas, resbaló en la chapa mojada y la cadena de envasado estuvo parada hasta mediodía.<\/i>"}], "criterio": "El párrafo es <b>descriptivo<\/b>, y la diferencia con el narrativo está en dos rasgos concretos, el tiempo verbal y la sucesión de hechos. Quien conteste «no es narrativo porque describe» no ha dado ningún rasgo y se queda sin el ítem.", "apoyo": ["Pieza 10 · 7 · Los rasgos del texto narrativo"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 10, ejercicio 10"}, {"tipo": "clasificar", "titulo": "¿Sirve como tesis?", "dossier": {"cuaderno": "11", "ejercicio": 1}, "ayuda": "Ocho frases. Indica cuáles admiten la contraria y sirven como tesis, y de las que no sirvan, si nadie las discutiría, si anuncian el tema o si describen un hecho.", "ops": ["sirve como tesis", "no la discutiría nadie", "anuncia el tema", "describe un hecho"], "items": [{"enun": "El transporte público en esta ciudad es mejorable.", "sol": "no la discutiría nadie", "porque": "no la discute nadie, y usa un adjetivo valorativo en lugar de una postura"}, {"enun": "Las empresas deberían pagar el tiempo de desplazamiento.", "sol": "sirve como tesis", "porque": "alguien puede sostener lo contrario"}, {"enun": "Voy a hablar del precio del alquiler.", "sol": "anuncia el tema", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}, {"enun": "Compartir piso después de los cuarenta no debería ser lo normal.", "sol": "sirve como tesis", "porque": "alguien puede sostener lo contrario"}, {"enun": "Los exámenes de acceso deberían poder hacerse dos veces al año.", "sol": "sirve como tesis", "porque": "alguien puede sostener lo contrario"}, {"enun": "En España hay mucha gente que trabaja a turnos.", "sol": "describe un hecho", "porque": "describe un hecho: es verdad o mentira, y no admite postura"}, {"enun": "La vivienda es un problema muy importante.", "sol": "no la discutiría nadie", "porque": "no la discute nadie, y usa un adjetivo valorativo en lugar de una postura"}, {"enun": "El móvil no debería poder usarse en clase ni siquiera en los descansos.", "sol": "sirve como tesis", "porque": "alguien puede sostener lo contrario"}], "apoyo": ["Pieza 11 · 2 · Seis reglas sobre esas cinco partes"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 1"}, {"tipo": "clasificar", "titulo": "¿Argumento o ejemplo?", "dossier": {"cuaderno": "11", "ejercicio": 2, "parte": "argumento o ejemplo"}, "ayuda": "Seis frases. Decide si cada una es un argumento o un ejemplo.", "ops": ["argumento", "ejemplo"], "items": [{"enun": "«Mi hermana tardó dos años en encontrar piso.»", "sol": "ejemplo", "porque": "el argumento sería que la oferta de alquiler es tan escasa que la búsqueda se alarga años"}, {"enun": "«Cuando el alquiler se lleva más de la mitad del sueldo, cualquier imprevisto se convierte en deuda.»", "sol": "argumento", "porque": "explica el mecanismo"}, {"enun": "«En mi barrio han cerrado tres tiendas este año.»", "sol": "ejemplo", "porque": "el argumento sería que el comercio de barrio no soporta la subida de los locales"}, {"enun": "«Una compañera mía estudió el acceso con dos hijos pequeños.»", "sol": "ejemplo", "porque": "el argumento sería que el alumnado adulto sostiene los estudios a costa de su tiempo de descanso"}, {"enun": "«Los turnos rotativos desordenan el sueño, y quien duerme mal enferma más.»", "sol": "argumento"}, {"enun": "«Quien estudia de adulto rinde más por hora, porque ha elegido estar ahí.»", "sol": "argumento"}], "apoyo": ["Pieza 11 · 2 · Seis reglas sobre esas cinco partes"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 2 · argumento o ejemplo"}, {"tipo": "abierta", "titulo": "El argumento que defiende cada ejemplo", "dossier": {"cuaderno": "11", "ejercicio": 2, "parte": "el argumento del ejemplo"}, "ayuda": "Las tres frases que son ejemplo. Escribe el argumento que estaría defendiendo cada una.", "items": [{"enun": "«Mi hermana tardó dos años en encontrar piso.»", "modelo": "El argumento sería que la oferta de alquiler es tan escasa que la búsqueda se alarga años."}, {"enun": "«En mi barrio han cerrado tres tiendas este año.»", "modelo": "El argumento sería que el comercio de barrio no soporta la subida de los locales."}, {"enun": "«Una compañera mía estudió el acceso con dos hijos pequeños.»", "modelo": "El argumento sería que el alumnado adulto sostiene los estudios a costa de su tiempo de descanso."}], "apoyo": ["De dónde se saca un argumento: los seis tipos"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 2 · el argumento del ejemplo"}, {"tipo": "clasificar", "titulo": "¿De qué tipo es cada argumento?", "dossier": {"cuaderno": "11", "ejercicio": 3}, "ayuda": "Todos defienden la misma tesis: <i>los centros de adultos deberían abrir también en agosto<\/i>. Indica de qué tipo es cada argumento, entre los seis del apartado 2.", "ops": ["empírico", "de competencia", "analogía", "afectivo", "de autoridad", "lugar común"], "items": [{"enun": "«Según la memoria del centro, el 40 % del alumnado trabaja en hostelería y libra justamente en agosto.»", "sol": "empírico"}, {"enun": "«Quien ha intentado retomar los estudios en septiembre después de dos meses parado sabe lo que cuesta volver a coger el ritmo.»", "sol": "de competencia"}, {"enun": "«Las bibliotecas municipales abren en agosto desde hace años, y nadie discute que su público es el mismo.»", "sol": "analogía"}, {"enun": "«Da mucha pena ver un edificio cerrado dos meses mientras hay gente que quiere estudiar.»", "sol": "afectivo", "porque": "y no cuenta como argumento"}, {"enun": "«La directora del servicio de formación de adultos sostiene que la interrupción larga es la primera causa de abandono.»", "sol": "de autoridad"}, {"enun": "«Todo el mundo sabe que estudiar es bueno.»", "sol": "lugar común", "porque": "el más flojo de los seis"}], "apoyo": ["De dónde se saca un argumento: los seis tipos"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 3"}, {"tipo": "abierta", "titulo": "La concesión que falta", "dossier": {"cuaderno": "11", "ejercicio": 4}, "items": [{"enun": "Escribe la concesión que le falta a este argumento, en una frase que empiece por <i>Es cierto que<\/i> y siga con un <i>pero<\/i>:<br><br>«Los exámenes de acceso deberían poder hacerse en dos convocatorias al año, porque quien trabaja no siempre puede presentarse en abril.»", "modelo": "<i>Es cierto que dos convocatorias obligarían a las universidades a montar dos tribunales y a preparar dos juegos de exámenes, lo que encarece la prueba. Pero ese gasto es pequeño al lado de lo que pierde quien, por no poder pedir el día libre en abril, espera un año entero para presentarse.<\/i>"}], "criterio": "La concesión tiene que reconocer una objeción <b>real<\/b> —la que pondría quien no está de acuerdo— y, detrás del <i>pero<\/i>, añadir una idea <b>distinta<\/b> de las que el texto ya llevaba. Si detrás del <i>pero<\/i> vuelve la tesis, no hay concesión: hay una frase larga.", "apoyo": ["De dónde se saca un argumento: los seis tipos"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 4"}, {"tipo": "clasificar", "titulo": "¿Qué banda falla?", "dossier": {"cuaderno": "11", "ejercicio": 5}, "ayuda": "Indica qué banda de la rúbrica del comentario falla en cada caso: adecuación, coherencia o estilo. Uno de los ocho no cae en ninguna de las tres.", "ops": ["adecuación", "coherencia", "estilo", "ninguna de las tres"], "items": [{"enun": "El texto defiende que el teletrabajo es bueno y cierra afirmando que presencialmente se rinde más, sin reconocerlo como objeción ni contestarla.", "sol": "adecuación", "porque": "contradecirse es uno de los tres descuentos de esa banda"}, {"enun": "Los dos argumentos dicen lo mismo con palabras distintas.", "sol": "adecuación", "porque": "da 0,5 por cada argumento «válido y distinto», y ahí solo hay uno"}, {"enun": "Hay ocho faltas de concordancia y tres preposiciones mal.", "sol": "estilo", "porque": "y además el descuento de 0,1 por falta, que en el comentario no tiene tope"}, {"enun": "El texto tiene 240 palabras.", "sol": "ninguna de las tres", "porque": "la extensión no entra en ninguna banda: es un descuento aparte de 0,5 y tiene su propia fila en la tabla del apartado 1"}, {"enun": "El texto opina sobre el precio de la vivienda, y el enunciado preguntaba por el transporte.", "sol": "adecuación", "porque": "no se ajusta al tema"}, {"enun": "Todas las frases empiezan por <i>y<\/i> y ninguna lleva conector.", "sol": "estilo", "porque": "conectores y puntuación"}, {"enun": "El texto sostiene que la medida es necesaria y lo justifica afirmando que hace falta.", "sol": "coherencia", "porque": "argumentación circular: justificar la tesis repitiéndola"}, {"enun": "El texto plantea el tema, da los dos argumentos y termina sin cerrar: la última frase es el segundo argumento.", "sol": "coherencia", "porque": "no saber cerrar"}], "criterio": "Las tres bandas se separan por lo que descuenta cada una, y la tabla del apartado 3 las tiene enteras. Adecuación mira si el texto contesta lo que se pide y con qué; coherencia, si avanza y se cierra; estilo, cómo está escrito. Lo que no corresponde a ninguna de las tres —la extensión y las faltas— se descuenta aparte.", "apoyo": ["De dónde se saca un argumento: los seis tipos", "Pieza 11 · 3 · Las dos rúbricas, banda por banda"], "usa_texto": false, "dossier_txt": "Del dossier: pieza 11, ejercicio 5"}, {"tipo": "hueco", "titulo": "¿En qué línea está la respuesta?", "estricto": true, "ayuda": "Escribe el número de la línea donde <b>empieza<\/b> la respuesta; si ocupa dos, valen las dos. Es la tercera pasada del método: se vuelve al texto pregunta por pregunta y se anota al margen del cuadernillo dónde está cada una.", "items": [{"enun": "¿Qué hace el niño en la primera línea del fragmento?", "sol": "1"}, {"enun": "¿Qué palabra pronuncia el niño?", "sol": "7"}, {"enun": "¿Qué le devuelve la calma cuando empieza a gemir?", "sol": "19"}, {"enun": "¿Con qué imagen del rostro del abuelo se cierra el fragmento?", "sol": "25"}, {"enun": "¿Qué significa <i>nonno<\/i> en italiano?", "sol": "27"}], "criterio": "Un fragmento de novela se localiza igual que un artículo, y además lleva los hechos en orden. La pregunta por el significado de <i>nonno<\/i> se contesta en la nota al pie, que forma parte del cuadernillo y que mucha gente no llega a leer.", "apoyo": ["Pieza 11 · 2 · Seis reglas sobre esas cinco partes"], "solo_web": true}, {"tipo": "opcion", "titulo": "Concesión, cierre o tesis repetida", "ops": ["concesión que responde", "concesión sin respuesta", "cierre con consecuencia", "tesis repetida"], "ayuda": "Siete frases escritas para la tesis «el tiempo de desplazamiento al trabajo debería contar como jornada». Clasifica cada una.", "items": [{"enun": "«Es cierto que pagar el trayecto encarecería contratar a quien vive lejos, pero ese gasto es pequeño al lado de lo que pierde quien, por no poder mudarse, se queda sin empleo.»", "sol": "concesión que responde", "porque": "reconoce una objeción real y detrás del <i>pero<\/i> añade una idea nueva"}, {"enun": "«En conclusión, el desplazamiento tendría que formar parte de la jornada laboral.»", "sol": "tesis repetida", "porque": "la misma idea de la tesis con otras palabras; el texto no avanza"}, {"enun": "«Aunque es verdad que muchos trayectos son cortos, los turnos partidos los multiplican por dos cada día.»", "sol": "concesión que responde", "porque": "la objeción —trayectos cortos— y la respuesta con un dato: los turnos partidos"}, {"enun": "«Mientras el trayecto lo pague el trabajador, las empresas seguirán instalándose donde no llega el autobús.»", "sol": "cierre con consecuencia", "porque": "anuncia qué pasará si nada cambia"}, {"enun": "«Es cierto que las empresas no eligen dónde vive cada trabajador.»", "sol": "concesión sin respuesta", "porque": "reconoce la objeción y no la contesta: falta el <i>pero<\/i> y lo que va detrás"}, {"enun": "«Por todo esto, creo que el tiempo de desplazamiento debería contar como jornada.»", "sol": "tesis repetida", "porque": "«por todo esto» anuncia una consecuencia y lo que sigue es la tesis otra vez"}, {"enun": "«Si no se cuenta, el sueldo real baja cuanto más lejos se vive.»", "sol": "cierre con consecuencia", "porque": "una consecuencia de no hacer lo que la tesis pide"}], "criterio": "Las dos concesiones que responden llevan las dos mitades, la objeción y la respuesta; la que no responde se queda en la objeción y la deja sin contestar. Los dos cierres anuncian qué pasa después; las dos tesis repetidas arrancan con una fórmula de cierre —<i>en conclusión<\/i>, <i>por todo esto<\/i>— y detrás no traen nada nuevo, y por eso se descuentan en la banda de coherencia aunque suenen a final.", "apoyo": ["Pieza 11 · 1 · El esqueleto, que es un formato de práctica"], "solo_web": true}, {"tipo": "clasificar", "titulo": "Siete frases más: ¿sirve como tesis?", "ops": ["admite la contraria", "no la discute nadie", "solo anuncia el tema"], "ayuda": "Siete tesis para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?». Señala cuáles admiten la contraria y explica por qué fallan las otras.", "items": [{"enun": "«Ahorrar energía es bueno.»", "sol": "no la discute nadie", "porque": "nadie sostendría lo contrario, y con ella no queda nada que defender"}, {"enun": "«El descuento de la tarifa nocturna debería ampliarse a la tarde para quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede contestar que la tarifa tiene que ser igual para todos: hay postura"}, {"enun": "«Voy a hablar de la tarifa eléctrica por horas.»", "sol": "solo anuncia el tema", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}, {"enun": "«La factura de la luz es un gasto importante para las familias.»", "sol": "no la discute nadie", "porque": "lleva un adjetivo valorativo en lugar de una postura, y no admite réplica"}, {"enun": "«La luz debería costar lo mismo a cualquier hora del día.»", "sol": "admite la contraria", "porque": "se puede sostener lo contrario, y de hecho la tarifa actual lo sostiene"}, {"enun": "«En este texto se habla de la lavadora de Ramón y de los tramos de la tarifa.»", "sol": "solo anuncia el tema", "porque": "resume el texto leído en lugar de tomar postura sobre la pregunta"}, {"enun": "«Los tramos horarios perjudican a quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede defender que los tramos benefician a todos por igual"}], "criterio": "Tres sirven y cuatro no, y las cuatro fallan por una de las dos razones de la teoría: o nadie las discute, o anuncian el tema sin decir nada sobre él. La comprobación es siempre la misma: escribir la frase contraria y comprobar si alguien la firmaría. «Ahorrar energía es malo» no la firma nadie, y por eso su contraria tampoco defiende nada; «la luz debería costar distinto según la hora» sí la firmaría la compañía eléctrica, y por eso «la luz debería costar lo mismo a cualquier hora» es una tesis.", "apoyo": ["Pieza 11 · 2 · Seis reglas sobre esas cinco partes", "De dónde se saca un argumento: los seis tipos"], "solo_web": true}, {"tipo": "clasificar", "titulo": "Seis frases más: ¿argumento o ejemplo?", "ops": ["argumento", "ejemplo"], "ayuda": "Seis frases sobre el tema del texto. El argumento explica por qué pasa algo; el ejemplo cuenta un caso.", "items": [{"enun": "«Encender las centrales de reserva en hora punta contamina más, así que repartir la demanda reduce emisiones.»", "sol": "argumento", "porque": "explica un mecanismo: por qué repartir la demanda tiene un efecto"}, {"enun": "«En mi escalera hay tres familias que planchan de madrugada.»", "sol": "ejemplo", "porque": "un caso contado, sin explicar por qué pasa"}, {"enun": "«Mi cuñado pone el lavavajillas a las dos de la mañana.»", "sol": "ejemplo", "porque": "un caso; se contesta con «pues mi cuñado lo pone a las ocho»"}, {"enun": "«Cuando el precio cambia por horas, el ahorro va a parar a quien tiene horario flexible, que suele ser quien más cobra.»", "sol": "argumento", "porque": "explica a quién beneficia el mecanismo y por qué"}, {"enun": "«Quien hace turnos no puede mover su consumo a las horas baratas, porque no elige a qué hora está en casa.»", "sol": "argumento", "porque": "la razón lleva su <i>porque<\/i> dentro"}, {"enun": "«El año pasado mi factura de julio subió treinta euros.»", "sol": "ejemplo", "porque": "un dato de un caso, sin la razón que lo explica"}], "criterio": "Los tres ejemplos hablan de una persona o de una factura concretas; los tres argumentos hablan de lo que pasa siempre que se da una condición, y por eso llevan un <i>porque<\/i>, un <i>así que<\/i> o un <i>cuando<\/i>. El ejemplo cabe dentro del argumento como media línea de apoyo —«quien hace turnos no puede mover su consumo, como mi cuñado, que llega a las diez»—, y ahí sí ayuda.", "apoyo": ["De dónde se saca un argumento: los seis tipos"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿De qué examen es cada condición?", "ops": ["Llengua castellana", "Comentari de text", "los dos"], "ayuda": "Ocho condiciones de las dos rúbricas. Indica si valen para la redacción de Llengua castellana, para la del comentario o para las dos.", "items": [{"enun": "Cada falta descuenta 0,1.", "sol": "los dos", "porque": "en los dos exámenes; lo que cambia es el tope"}, {"enun": "Pide dos argumentos distintos, y cada uno vale 0,5.", "sol": "Comentari de text", "porque": "es la banda de adecuación del comentario, escrita así en sus criterios"}, {"enun": "Entre 50 y 80 palabras.", "sol": "Llengua castellana", "porque": "la extensión del 2.2 de castellano"}, {"enun": "Se elige entre dos enunciados.", "sol": "Comentari de text", "porque": "castellano da un solo enunciado"}, {"enun": "El texto tiene que ser argumentativo y sobre el tema del texto leído.", "sol": "los dos", "porque": "los dos piden opinar sobre el tema del texto de partida"}, {"enun": "Entre 150 y 200 palabras.", "sol": "Comentari de text", "porque": "la extensión de la parte 2 del comentario"}, {"enun": "El descuento por faltas se detiene en 2 puntos.", "sol": "Llengua castellana", "porque": "en el comentario no hay tope"}, {"enun": "Pasarse de la extensión o no llegar descuenta 0,5.", "sol": "Comentari de text", "porque": "en castellano la extensión entra en la adecuación, sin cifra aparte"}], "criterio": "Las condiciones que cambian de un examen a otro son cuatro: la extensión, el número de enunciados, el tope de las faltas y la cifra por argumento. Con ellas se decide cómo se reparte el tiempo: en el comentario, contar las palabras al final no es opcional, porque pasarse de 200 o no llegar a 150 descuenta tanto como un argumento entero.", "apoyo": ["Pieza 11 · 3 · Las dos rúbricas, banda por banda", "Llengua castellana (3 puntos)"], "usa_texto": false, "solo_web": true}, {"tipo": "abierta", "titulo": "El plan de tres líneas", "ayuda": "Tres minutos, como en el examen. Todavía no se escribe el texto: solo el plan.", "items": [{"enun": "Para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?», escribe el plan de tres líneas: tu tesis, en una frase que admita la contraria; tus dos razones, de clases distintas —un dato, un caso parecido, la experiencia propia—; y cómo cierras, con una consecuencia y no con la tesis repetida.", "modelo": "Tesis: la luz debería costar lo mismo a todas horas, porque el precio por tramos solo lo aprovecha quien elige su horario. Razón 1, un dato: la hora punta cuesta el doble que la madrugada, y quien vuelve del turno a las diez consume en punta sin poder evitarlo. Razón 2, un caso parecido: el agua se cobra igual a cualquier hora y nadie pide que ducharse a las ocho cueste más. Cierre: si el precio depende del horario, el ahorro se lo queda quien tiene un horario que elegir."}], "criterio": "El plan se da por bueno si la tesis admite réplica, si las dos razones no dependen una de otra —en el modelo, un dato y un caso parecido— y si el cierre añade algo que no estaba en la tesis. Un plan con dos razones que dependen una de otra produce después dos argumentos que dicen lo mismo con dos cifras, y la banda de adecuación del comentario da sus 0,5 solo a los «válidos y diferentes».", "apoyo": ["Pieza 11 · 1 · El esqueleto, que es un formato de práctica", "Pieza 11 · 2 · Seis reglas sobre esas cinco partes"], "usa_texto": false, "solo_web": true}], "cuaderno": [{"pieza": 10, "apartados": [6, 7], "ejercicios": [8, 9, 10]}, {"pieza": 11, "apartados": [1, 2, 3], "ejercicios": [1, 2, 3, 4, 5]}], "cuaderno_txt": "Pieza 10 · Leer el texto entero y contestar el test — apartados 6 y 7: Responder sin copiar; Los rasgos del texto narrativo (p. 57 y 58) · ejercicios 8, 9 y 10 · Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 1, 2 y 3: El esqueleto, que es un formato de práctica; Seis reglas sobre esas cinco partes; Las dos rúbricas, banda por banda (p. 62, 63 y 66) · ejercicios 1, 2, 3, 4 y 5", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "<i>La sonrisa etrusca<\/i>, de José Luis Sampedro", "meta": "Convocatoria 2015, tribunal especial · fragmento final de la novela · 238 palabras · el primer texto que se contesta solo, con reloj", "literal": true, "teoria": "<h3>2 · 2015, tribunal especial · <em>La sonrisa etrusca<\/em><\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>José Luis Sampedro, <em>La sonrisa etrusca<\/em> (Alfaguara, 1985), fragmento<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>novela, 238 palabras<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Llengua castellana 2015, tribunal especial; el texto, en el cuaderno de textos de cada sesión (texto 2)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>6 de octubre · <strong>primer texto que el alumno contesta solo<\/strong>, cronometrado<\/td>\n<\/tr>\n<tr>\n<td><strong>reparto<\/strong><\/td>\n<td>cinco preguntas de test y una abierta: el formato actual<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto va el segundo.<\/strong> Es la primera novela del curso, y con ella se dan los rasgos del texto narrativo de la pieza 10. Trae además, en la misma página, las tres trampas que se acaban de explicar: una pregunta con «NO», un distractor de anáfora que concuerda y una paráfrasis.<\/p>", "lectura": {"titulo": "La sonrisa etrusca", "entrada": "José Luis Sampedro · <i>La sonrisa etrusca<\/i> (Madrid: Alfaguara, 1985) · fragmento final de la novela, tal como lo reproduce el cuadernillo de Llengua castellana de 2015 (tribunal especial).", "lineas": ["El niño, inquieto ante esta noche tan diferente, gatea por la", "cama hacia el viejo. Se agarra temeroso al brazo ya paralizado", "y se pone en pie, su carita junto a la del abuelo, esperando,", "esperando… De golpe, su instinto le revela el desplome del", "mundo, la tiniebla vacía. El aletazo de la soledad le arranca", "la palabra tantas veces oída:", "", "—Non-no* —pronuncia nítidamente, frente a ese rostro cuyos", "ojos le buscan ya sin verle, pero cuyos oídos aún le oyen,", "anegados de júbilo. Y repite el conjuro, su llamada de", "cachorro perdido—. Nonno, nonno. ¡Nonno!", "", "¡Por fin ese cántico celeste!", "", "Colores de ultramundo, lumbres de mil estrellas incendian el", "viejo corazón y le arrebatan a esta gloria, esta grandeza,", "esta palabra insondable:", "", "¡NONNO!", "", "A ella se entrega para siempre el viejo, invocando el nombre", "infantil que sus labios ya no logran pronunciar.", "", "El niño, en su desamparo, inicia un gemido. Pero se calma al", "olfatear en la vieja manta el rastro de los brazos que le", "acunaban. Se envuelve confiado en sus pliegues, en ese olor", "que reconstruye el mundo al devolverle la presencia de su", "abuelo, y clama, orgulloso de su proeza, una y otra vez:", "", "—¡Nonno, nonno, nonno, nonno…!", "", "Sus manitas, mientras tanto, juguetean con los amuletos.", "", "En la carnal arcilla del viejo rostro ha florecido una sonrisa", "que se petrifica poco a poco, sobre un trasfondo sanguíneo de", "antigua terracota. *Nonno: En italiano, abuelo."], "pie": "* <i>Nonno<\/i>: en italiano, abuelo. — Fragmento de <i>La sonrisa etrusca<\/i>, de José Luis Sampedro (Alfaguara, 1985), en la versión del cuadernillo oficial de la PAU +25 de 2015, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2015_general_llengua_castellana_suplent.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las cinco preguntas de test", "ayuda": "Las preguntas 1.1 a 1.5 del cuadernillo, literales, con su respuesta oficial. Diez minutos de reloj para las seis, como en el examen; después se corrige.", "items": [{"enun": "<b>1.1<\/b> ¿Cuál de las siguientes palabras NO es un sinónimo de <i>insondable<\/i> en el texto?", "conv": "2015s", "ops": ["Inescrutable.", "Ininteligible.", "Inconmensurable.", "Impenetrable."], "sol": "Ininteligible.", "porque": "léxico con NO, y con un distractor de forma: la que hay que marcar se parece a <i>insondable<\/i> más que las otras tres, con su prefijo negativo y su terminación culta. Las otras tres son sinónimos"}, {"enun": "<b>1.2<\/b> ¿Qué palabras describen mejor este texto?", "conv": "2015s", "ops": ["Conmovedor y sosegado.", "Sospechoso y turbador.", "Angustiado y excitante.", "Ingenioso y misterioso."], "sol": "Conmovedor y sosegado.", "porque": "global, y pregunta el tono: no hay una línea que la conteste. Los tres distractores emparejan un adjetivo plausible con otro que no encaja —<i>sospechoso<\/i>, <i>angustiado<\/i>, <i>ingenioso<\/i>—, y se descartan por la segunda palabra de cada par"}, {"enun": "<b>1.3<\/b> ¿Cuál de los siguientes enunciados del texto recoge el momento en que el abuelo ya ha fallecido?", "conv": "2015s", "ops": ["A ella se entrega para siempre el viejo, invocando el nombre infantil que sus labios ya no logran pronunciar.", "De golpe, su instinto le revela el desplome del mundo, la tiniebla vacía.", "En la carnal arcilla del viejo rostro ha florecido una sonrisa que se petrifica poco a poco.", "Colores de ultramundo, lumbres de mil estrellas incendian el viejo corazón."], "sol": "En la carnal arcilla del viejo rostro ha florecido una sonrisa que se petrifica poco a poco.", "porque": "local, y exige leer la metáfora: «una sonrisa que se petrifica» es la muerte expresada sin nombrarla. El distractor b) describe el momento en que el niño se entera"}, {"enun": "<b>1.4<\/b> ¿A quién o a qué se refiere la palabra <i>su<\/i> en la oración «De golpe, <b>su<\/b> instinto le revela el desplome del mundo, la tiniebla vacía»?", "conv": "2015s", "ops": ["A la manta.", "Al abuelo.", "A la tiniebla.", "Al niño."], "sol": "Al niño.", "porque": "anáfora con el distractor que concuerda: <i>su<\/i> podría ser del abuelo o del niño. Quien tiene el instinto que revela el desplome es el niño, y se decide leyendo despacio la oración anterior"}, {"enun": "<b>1.5<\/b> ¿Qué despierta en el niño el recuerdo de su abuelo?", "conv": "2015s", "ops": ["La visión de los ojos del abuelo.", "El olor de la manta.", "La sonrisa del abuelo.", "Los amuletos."], "sol": "El olor de la manta.", "porque": "local, sin trampa: «se calma al olfatear en la vieja manta el rastro de los brazos que le acunaban»"}], "criterio": "Medio punto por acierto y 0,16 por error. Dos de las cinco se contestan volviendo al texto y nada más; la 1.2 se decide con el texto entero, y con dos opciones descartadas contestar gana 0,17 de media; la 1.1 y la 1.4 son las dos trampas de la semana, el NO y el distractor que concuerda.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "La paráfrasis", "ayuda": "Con tus palabras, sin repetir las del texto.", "items": [{"enun": "<b>1.6<\/b> Sustituya, utilizando sus propias palabras, el sintagma <i>anegados de júbilo<\/i> en la siguiente oración extraída del texto: «[…] ese rostro cuyos ojos le buscan ya sin verle, pero cuyos oídos aún le oyen, …».", "corto": 16, "conv": "2015s", "modelo": "Clave oficial: inundados de alegría, llenos de gozo, de felicidad, de satisfacción… Se corrige por sustitución: se pone la respuesta en la oración y se lee entera; si se sostiene y no repite las palabras del texto, el punto es entero."}], "criterio": "La clave admite varias soluciones. Es la primera aplicación de los tres pasos para decir lo mismo con otras palabras —cambiar la palabra, cambiar el verbo, resumir la cita— y la antepasada de la microtarea de paráfrasis.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [2]}, {"pieza": "TEXTOS", "apartados": [2]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 2: 2015, tribunal especial · La sonrisa etrusca (p. 251) · Los textos de cada sesión — apartado 2: «La sonrisa etrusca» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda de categoría", "meta": "10 minutos · los cinco ítems reales que quedan y nueve propios, en el formato del examen", "teoria": "<h3>2 · La categoría de una palabra <strong>en su oración<\/strong><\/h3>\n<p>El ejercicio no pregunta qué es una palabra: pregunta <strong>qué es en esa oración<\/strong>, porque las palabras que se preguntan son casi todas de las que cambian de clase según su lugar.<\/p>\n<p><strong>Las diez palabras que han caído en los doce ítems<\/strong>: <em>ya<\/em>, <em>aun<\/em>, <em>entonces<\/em>, <em>siempre<\/em>, <em>incluso<\/em>, <em>harto<\/em>, <em>mañana<\/em>, <em>hasta<\/em>, <em>bien… bien<\/em> y <em>hacia<\/em>.<\/p>\n<p><strong>Y el reparto de las respuestas oficiales: adverbio en diez de los doce<\/strong>, conjunción en uno (<em>bien… bien<\/em>) y preposición en otro (<em>hacia<\/em>).<\/p>\n<blockquote>\n<p>Ese reparto no sustituye al método: los dos casos que no son adverbio están puestos para separar a quien ha estudiado. Sirve solo como desempate: si has aplicado las tres preguntas y sigues dudando entre adverbio y otra clase, marca adverbio.<\/p>\n<\/blockquote>\n<h4>Los cuatro ítems resueltos<\/h4>\n<blockquote>\n<p><strong>2015s, 3.2.<\/strong> «¿A qué categoría gramatical pertenece la palabra <em>ya<\/em> en la oración <em>Aquel director ya no quería ni oír los rumores de la orquesta<\/em>?» a) Adverbio. b) Pronombre. c) Adjetivo. d) Conjunción.<\/p>\n<p><strong>Adverbio.<\/strong> No cambia de forma, no lleva sustantivo al lado y no une nada: modifica a <em>quería<\/em> señalando cuándo.<\/p>\n<p><strong>2017t, 3.1.<\/strong> «¿Qué clase de palabra es <em>aun<\/em> en la oración <em>A veces, aun queriendo solucionar los problemas del inversor, no pueden hacerlo por falta de recursos<\/em>?» a) Preposición. b) Adverbio. c) Conjunción. d) Adjetivo.<\/p>\n<p><strong>Adverbio.<\/strong> Aquí <em>aun<\/em> equivale a <em>incluso<\/em>: «incluso queriendo solucionarlo».<\/p>\n<p><strong>2017s, 3.2.<\/strong> «Indique cuál es la categoría gramatical de <em>aun<\/em> en la siguiente oración: <em>Con disciplina se puede crear un estado de relajación en el que es posible soñar aun despierto<\/em>.» a) Adverbio. b) Pronombre. c) Conjunción. d) Adjetivo.<\/p>\n<p><strong>Adverbio<\/strong> otra vez, y la misma equivalencia: «soñar incluso despierto». El tribunal preguntó <em>aun<\/em> dos veces en dos oraciones distintas y la respuesta fue la misma las dos veces.<\/p>\n<p><strong>2018t, 3.2.<\/strong> «Indique la categoría gramatical de <em>bien<\/em> en la siguiente oración: <em>En breve nos comunicaremos con usted, bien por correo, bien por teléfono<\/em>.» a) Adjetivo. b) Adverbio. c) Conjunción. d) Preposición.<\/p>\n<p><strong>Conjunción.<\/strong> Es el único caso de los doce en que la respuesta obvia falla. <em>Bien<\/em> suele ser adverbio —«canta bien»—, pero aquí viene <strong>repetido y por parejas<\/strong>, presentando dos alternativas, y se puede sustituir por <em>o… o<\/em>: «o por correo, o por teléfono».<\/p>\n<\/blockquote>\n<h4>Las tres fronteras que más se fallan<\/h4>\n<p><strong>Adverbio o conjunción.<\/strong> El adverbio modifica y no une; la conjunción une, sea entre dos elementos del mismo rango o metiendo una oración dentro de otra. La prueba está en el apartado anterior: si la palabra se puede sustituir por <em>o<\/em>, <em>y<\/em>, <em>pero<\/em> o <em>aunque<\/em> sin que la oración se rompa, es conjunción.<\/p>\n<blockquote>\n<p><strong>Cuidado con las locuciones conjuntivas.<\/strong> Muchas conjunciones son grupos de palabras y no una sola: <em>así que<\/em>, <em>ya que<\/em>, <em>puesto que<\/em>, <em>dado que<\/em>, <em>de modo que<\/em>, <em>a pesar de que<\/em>, <em>siempre que<\/em>, <em>aun cuando<\/em>, <em>por más que<\/em>. En esos casos la clase es la del grupo entero, y separarlo para clasificar palabra por palabra da una respuesta falsa: en «no vino, <strong>ya que<\/strong> libraba», <em>ya<\/em> no es el adverbio de «ya llegó», sino la primera mitad de una conjunción causal que se puede sustituir por <em>porque<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Adverbio o preposición.<\/strong> La preposición va <strong>delante de su complemento<\/strong> y forma grupo con él: <em>hacia el norte<\/em>, <em>hasta la puerta<\/em>. El adverbio no lleva complemento: «Lo entiende <strong>incluso<\/strong> un niño» no da ⊗<em>incluso un niño<\/em> como grupo, sino que <em>incluso<\/em> añade énfasis a <em>un niño<\/em>. <strong>La prueba es el complemento:<\/strong> comprueba si la palabra forma grupo con lo que lleva detrás —<em>hacia el cielo<\/em>, <em>hasta la puerta<\/em>—, y entonces es preposición. Quitarla no decide: «Pasó la tarde mirando el cielo» se sostiene sin <em>hacia<\/em>, y <em>hacia<\/em> es preposición; es el ítem de 2026s 3.1, cuya clave oficial da <em>preposición<\/em>.<\/p>\n<p><strong>Adverbio o adjetivo.<\/strong> El adjetivo concuerda con el sustantivo y cambia de forma —<em>una respuesta rápida<\/em>, <em>unas respuestas rápidas<\/em>—; el adverbio modifica al verbo y se mantiene invariable: <em>trabajan duro<\/em>, no ⊗<em>trabajan duros<\/em>; <em>están medio dormidas<\/em>, no ⊗<em>medias dormidas<\/em>. <strong>La prueba es ponerlo en plural:<\/strong> si la palabra tiene que cambiar, es adjetivo; si se queda como estaba, es adverbio.<\/p>\n<blockquote>\n<p><strong>El adjetivo que hace de adverbio.<\/strong> <em>Duro<\/em>, <em>claro<\/em>, <em>rápido<\/em>, <em>alto<\/em> y <em>bajo<\/em> son adjetivos que también se usan como adverbios, sin cambiar de forma: <em>habla claro<\/em>, <em>corre rápido<\/em>, <em>pisa fuerte<\/em>. Se les llama adjetivos adverbiales, y se reconocen porque acompañan a un verbo y se quedan siempre en masculino singular. Al revés pasa con los adverbios que parecen adjetivos por la forma —<em>medio<\/em> en <em>medio dormidas<\/em>—: la prueba del plural los separa a todos.<\/p>\n<\/blockquote>\n<p><strong>Y un detalle de escritura relacionado:<\/strong> cuando van dos adverbios en <em>-mente<\/em> seguidos, la terminación la lleva solo el último, y el primero se queda en femenino singular: <em>habló clara y rápidamente<\/em>.<\/p>\n<h4><em>Muy<\/em>, <em>mucho<\/em> y dónde va cada uno<\/h4>\n<p><em>Muy<\/em> y <em>mucho<\/em> no son intercambiables: <em>muy<\/em> funciona siempre como adverbio, y <em>mucho<\/em> como adverbio o como determinante según dónde vaya.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>dónde va<\/th>\n<th>clase<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>muy<\/strong><\/td>\n<td>delante de un adjetivo o de otro adverbio<\/td>\n<td>adverbio<\/td>\n<td><em>muy caro<\/em>, <em>muy lejos<\/em>, <em>muy despacio<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho<\/strong><\/td>\n<td>detrás de un verbo<\/td>\n<td>adverbio<\/td>\n<td><em>trabaja mucho<\/em>, <em>llovió mucho<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho, mucha, muchos, muchas<\/strong><\/td>\n<td>delante de un sustantivo<\/td>\n<td><strong>determinante<\/strong>, y concuerda con él<\/td>\n<td><em>mucho polvo<\/em>, <em>mucha gente<\/em>, <em>muchos turnos<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mucho<\/strong><\/td>\n<td>delante de <em>mayor<\/em>, <em>menor<\/em>, <em>mejor<\/em> y <em>peor<\/em><\/td>\n<td>adverbio<\/td>\n<td><em>mucho mejor<\/em>, <em>mucho peor<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La tercera fila se escapa más que las otras tres: <em>mucho polvo<\/em> no es un adverbio, porque <em>mucho<\/em> lleva un sustantivo al lado y concuerda con él —<em>mucha gente<\/em>, <em>muchos turnos<\/em>—. En esa fila la segunda pregunta basta. Y <em>muy<\/em> nunca puede ir en ese sitio: no existe ⊗<em>muy polvo<\/em>.<\/p>\n<h4>Cuando el enunciado llama <em>adjetivo<\/em> a un determinante<\/h4>\n<blockquote>\n<p><strong>2025t, 1.4.<\/strong> «El texto presenta una adjetivación muy rica. ¿Qué tipo de adjetivos predominan?» a) Numerales. b) Indefinidos. c) Calificativos. d) Demostrativos.<\/p>\n<p><strong>c) Calificativos<\/strong>, según la clave oficial.<\/p>\n<\/blockquote>\n<p>El enunciado llama <em>adjetivos<\/em> a los numerales, los indefinidos y los demostrativos, que en la tabla de las nueve clases son determinantes cuando acompañan a un sustantivo. Es la terminología de las gramáticas anteriores, y todavía aparece en los enunciados. Un texto «rico en adjetivación» tiene muchos adjetivos calificativos, los que indican cómo es el sustantivo.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "La tanda: cinco reales y nueve propios", "ayuda": "Catorce ítems con cuatro opciones. Los cinco con chapa de año son literales del examen; los nueve sin chapa están escritos en el mismo formato. Aplica el método entero antes de elegir: ¿cambia de forma?, ¿lleva un sustantivo al lado?, ¿une?", "items": [{"enun": "¿A qué categoría gramatical pertenece la palabra <i>ya<\/i> en la siguiente oración: «Pero él <b>ya<\/b> no le escuchaba y se alejaba a buen paso de la casa»?", "conv": "2019t", "ops": ["Pronombre", "Conjunción", "Adjetivo", "Adverbio"], "sol": "Adverbio", "porque": "el mismo ítem que el de 2015s con otra oración, y con las opciones barajadas: la respuesta está en la d) aquí y en la a) allí"}, {"enun": "¿Cuál es la categoría gramatical de la palabra <i>hasta<\/i> en la siguiente oración: «Esto lo hace <b>hasta<\/b> un niño pequeño»?", "conv": "2020s", "ops": ["Pronombre", "Preposición", "Adverbio", "Conjunción"], "sol": "Adverbio", "porque": "equivale a <i>incluso<\/i> y se puede quitar sin que la oración quede coja —«Esto lo hace un niño pequeño»—; una preposición dejaría un hueco, y por eso <i>preposición<\/i> es el distractor fuerte"}, {"enun": "Identifique a qué clase de palabra corresponde <i>harto<\/i> en la oración «La situación es <b>harto<\/b> complicada».", "conv": "2025t", "ops": ["Adjetivo", "Preposición", "Determinante", "Adverbio"], "sol": "Adverbio", "porque": "modifica al adjetivo <i>complicada<\/i> y no cambia de forma: no se dice ⊗<i>harta complicada<\/i>. En «estaba harto», en cambio, sí es adjetivo"}, {"enun": "¿Qué clase de palabra es <i>mañana<\/i> en la siguiente oración: «Desde <b>mañana<\/b> trabajará en la nueva empresa de informática»?", "conv": "2026t", "ops": ["Sustantivo", "Preposición", "Adjetivo", "Adverbio"], "sol": "Adverbio", "porque": "los adverbios de tiempo admiten preposición delante y siguen siendo adverbios; si fuera sustantivo admitiría determinante, «desde la mañana», y hablaría de una franja del día"}, {"enun": "¿Qué clase de palabra es <i>hacia<\/i> en la oración «Pasó toda la tarde mirando <b>hacia<\/b> el cielo»?", "conv": "2026s", "ops": ["Conjunción", "Preposición", "Adjetivo", "Adverbio"], "sol": "Preposición", "porque": "«Pasó toda la tarde mirando el cielo» cambia de significado y deja el complemento suelto; además está en la lista cerrada"}, {"enun": "Indique la categoría gramatical de <i>medias<\/i> en la oración «Las notas <b>medias<\/b> del grupo subieron dos décimas».", "ops": ["Adverbio", "Determinante", "Sustantivo", "Adjetivo"], "sol": "Adjetivo", "porque": "concuerda con <i>notas<\/i> y expresa cómo son, no cuántas"}, {"enun": "Indique la categoría gramatical de <i>medio<\/i> en la oración «Llegó <b>medio<\/b> dormido al trabajo».", "ops": ["Determinante", "Adjetivo", "Adverbio", "Sustantivo"], "sol": "Adverbio", "porque": "no cambia de forma: de una mujer se dice <i>medio dormida<\/i>, no ⊗<i>media dormida<\/i>"}, {"enun": "¿Qué clase de palabra es <i>media<\/i> en la oración «<b>Media<\/b> plantilla se acogió a la reducción de jornada»?", "ops": ["Determinante", "Adverbio", "Adjetivo", "Pronombre"], "sol": "Determinante", "porque": "acompaña a <i>plantilla<\/i>, concuerda con ella e indica cuánta"}, {"enun": "¿Qué clase de palabra es <i>rojo<\/i> en la oración «El <b>rojo<\/b> del semáforo se ve mal desde aquí»?", "ops": ["Sustantivo", "Adjetivo", "Adverbio", "Determinante"], "sol": "Sustantivo", "porque": "lleva un determinante delante, <i>el<\/i>, y hace de sujeto de <i>se ve<\/i>; en «el semáforo rojo» sería adjetivo"}, {"enun": "Indique la categoría gramatical de <i>bajo<\/i> en la oración «Firmaron el contrato <b>bajo<\/b> presión».", "ops": ["Adjetivo", "Adverbio", "Sustantivo", "Preposición"], "sol": "Preposición", "porque": "va delante de su complemento, <i>presión<\/i>, y forma grupo con él; es adjetivo en «un techo bajo», sustantivo en «el bajo del edificio» y adverbio en «habla bajo»"}, {"enun": "¿A qué categoría gramatical pertenece <i>luego<\/i> en la oración «Terminó el turno y <b>luego<\/b> se fue a casa»?", "ops": ["Conjunción", "Preposición", "Adverbio", "Adjetivo"], "sol": "Adverbio", "porque": "indica cuándo y no une nada; es conjunción en «pienso, luego existo», donde saca una consecuencia"}, {"enun": "¿Qué clase de palabra es <i>nada<\/i> en la oración «No dijo <b>nada<\/b> en toda la reunión»?", "ops": ["Pronombre", "Adverbio", "Determinante", "Sustantivo"], "sol": "Pronombre", "porque": "ocupa el sitio de un sustantivo —nombra el contenido de la respuesta— y hace de complemento directo; en «no me gusta nada este turno» sería adverbio"}, {"enun": "¿Qué clase de palabra es <i>solo<\/i> en la oración «A la reunión <b>solo<\/b> vino la encargada»?", "ops": ["Adjetivo", "Adverbio", "Determinante", "Pronombre"], "sol": "Adverbio", "porque": "equivale a <i>solamente<\/i>; el sujeto es femenino, así que el adjetivo tendría que ser <i>sola<\/i> —«vino sola la encargada», sin compañía—, y la palabra está en masculino"}, {"enun": "¿A qué categoría gramatical pertenece <i>aunque<\/i> en la oración «Fue a trabajar <b>aunque<\/b> tenía fiebre»?", "ops": ["Adverbio", "Conjunción", "Preposición", "Pronombre"], "sol": "Conjunción", "porque": "mete una oración dentro de otra y admite el cambio por <i>a pesar de que<\/i>"}], "criterio": "Siete de las catorce respuestas son <i>adverbio<\/i>, y las otras siete se reparten entre las demás clases. Los tres ítems con más trampa son <i>hasta<\/i>, que está en la lista de preposiciones y aquí no lo es; <i>mañana<\/i>, porque va detrás de una preposición y mucha gente da por hecho que detrás de una preposición solo caben sustantivos; y la serie <i>medio<\/i>, <i>media<\/i>, <i>medias<\/i>, una sola palabra con tres clases según lo que tiene al lado.", "apoyo": ["2 · La categoría de una palabra en su oración"], "solo_web": true}, {"tipo": "hueco", "titulo": "Escribe la clase", "ayuda": "Cinco oraciones más, sin opciones: escribe el nombre de la clase de la palabra en negrita.", "items": [{"enun": "El informe llegó <b>ayer<\/b>.", "sol": "adverbio", "porque": "indica cuándo y no cambia de forma"}, {"enun": "Salió <b>con<\/b> prisa.", "sol": "preposición", "porque": "va delante de su complemento, <i>prisa<\/i>"}, {"enun": "<b>Ninguno<\/b> de los dos contestó.", "sol": "pronombre", "porque": "va solo y ocupa el sitio de un sustantivo"}, {"enun": "Este mes no hay <b>ningún<\/b> turno libre.", "sol": "determinante", "porque": "acompaña a <i>turno<\/i>; la forma se apoya en el sustantivo"}, {"enun": "Es un piso <b>pequeño<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>piso<\/i> y expresa cómo es: <i>una casa pequeña<\/i>"}], "criterio": "Las cinco clases distintas, sin opciones que ayuden. <i>Ninguno<\/i> y <i>ningún<\/i> son la pareja del día: la forma corta va pegada al sustantivo y es determinante; la forma entera va sola y es pronombre.", "apoyo": ["2 · La categoría de una palabra en su oración"], "solo_web": true}], "cuaderno": {"pieza": 6, "apartados": [2]}, "cuaderno_txt": "Pieza 6 · Las nueve clases y la categoría de una palabra en su oración — apartado 2: La categoría de una palabra en su oración (p. 154)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto del carril B está inventado para practicar. El fragmento de <i>La sonrisa etrusca<\/i> de José Luis Sampedro (Alfaguara, 1985), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2015, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
