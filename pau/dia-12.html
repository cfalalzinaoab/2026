<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 12 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}
.teoria .hueco,.v-bloque .hueco{display:inline-block;border-bottom:1px solid var(--tinta3);height:.9em;
  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}
/* una palabra con guion, barra o raya no se parte de un renglón a otro:
   motor.js la mete en un <span class="nb"> (sinPartir) */
.nb{white-space:nowrap}

<script>window.DIA = {"dia": 12, "fecha": "2026-11-05", "tab": "Día 12 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 5 de noviembre", "sub": "Arranca el gimnasio con el set de 2025s · plurales, femeninos y diminutivos", "carriles": [{"chapa": "Carril A", "titulo": "Arranca el gimnasio · set 2025s", "meta": "15 minutos · cómo funciona el gimnasio de tildes hasta diciembre, y el cuarto set real", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de diez de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de diez, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "ejercicios": [{"tipo": "hueco", "titulo": "Set 2025s: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Las ocho palabras del ejercicio de 2025, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>textil<\/i>", "conv": "2025s", "sol": "textil", "porque": "aguda acabada en -l, <i>tex-til<\/i>"}, {"enun": "<i>acuifero<\/i>", "conv": "2025s", "sol": "acuífero", "porque": "esdrújula, <i>a-cuí-fe-ro<\/i>"}, {"enun": "<i>buho<\/i>", "conv": "2025s", "sol": "búho", "porque": "hiato: <i>ú<\/i> tónica + <i>o<\/i>; la hache no lo impide"}, {"enun": "<i>abdomen<\/i>", "conv": "2025s", "sol": "abdomen", "porque": "llana acabada en -n; el plural <i>abdómenes<\/i> sí lleva"}, {"enun": "<i>escuchemosle<\/i>", "conv": "2025s", "sol": "escuchémosle", "porque": "esdrújula: es-cu-<b>ché<\/b>-mos-le, con el pronombre pegado"}, {"enun": "<i>caracteres<\/i>", "conv": "2025s", "sol": "caracteres", "porque": "llana acabada en -s; el singular <i>carácter<\/i> sí lleva"}, {"enun": "<i>hincapie<\/i>", "conv": "2025s", "sol": "hincapié", "porque": "aguda acabada en vocal"}, {"enun": "<i>oir<\/i>", "conv": "2025s", "sol": "oír", "porque": "hiato: <i>o-ír<\/i>, dos sílabas, no un monosílabo"}], "criterio": "Llevan tilde cinco de las ocho. Los tres señuelos son una aguda en -l, una llana en -n y una llana en -s, y las dos llanas tienen trampa en la otra forma de la palabra: <i>abdómenes<\/i> y <i>carácter<\/i> sí llevan.", "apoyo": "todo", "dossier": {"cuaderno": "A-3", "ejercicio": "Set 2025S"}, "dossier_txt": "Del dossier: anexo A-3 · Set 2025S"}, {"tipo": "clasificar", "titulo": "¿Por qué la lleva o no la lleva?", "ops": ["aguda acabada en vocal, -n o -s: lleva", "aguda acabada en otra consonante: no lleva", "llana acabada en vocal, -n o -s: no lleva", "esdrújula o sobresdrújula: lleva", "hiato con la cerrada tónica: lleva"], "ayuda": "Las mismas ocho palabras. Indica por qué regla lleva o no lleva tilde cada una.", "items": [{"enun": "<i>acuífero<\/i>", "sol": "esdrújula o sobresdrújula: lleva", "porque": "la fuerza va en la antepenúltima"}, {"enun": "<i>oír<\/i>", "sol": "hiato con la cerrada tónica: lleva", "porque": "<i>í<\/i> tónica junto a <i>o<\/i>"}, {"enun": "<i>hincapié<\/i>", "sol": "aguda acabada en vocal, -n o -s: lleva", "porque": "acaba en vocal y la fuerza va en la última"}, {"enun": "<i>caracteres<\/i>", "sol": "llana acabada en vocal, -n o -s: no lleva", "porque": "acaba en -s y la fuerza va en la penúltima"}, {"enun": "<i>textil<\/i>", "sol": "aguda acabada en otra consonante: no lleva", "porque": "acaba en -l"}, {"enun": "<i>escuchémosle<\/i>", "sol": "esdrújula o sobresdrújula: lleva", "porque": "la fuerza va en la antepenúltima"}, {"enun": "<i>búho<\/i>", "sol": "hiato con la cerrada tónica: lleva", "porque": "<i>ú<\/i> tónica junto a <i>o<\/i>"}, {"enun": "<i>abdomen<\/i>", "sol": "llana acabada en vocal, -n o -s: no lleva", "porque": "acaba en -n y la fuerza va en la penúltima"}], "criterio": "Cada palabra cae en una sola regla, y las dos de hiato se deciden antes que las demás: si hay hiato con la cerrada tónica, la tilde va aunque la regla general no la pida.", "apoyo": "todo", "solo_web": true}], "cuaderno": {"pieza": "A-3", "apartados": ["Set 2025S"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Set 2025S (p. 295)", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Nombre y adjetivo I: plurales, femeninos y diminutivos", "meta": "45 minutos · las preguntas de lista de cinco palabras: los dos sets de plural, los dos de femenino y el de diminutivo, con sus claves", "teoria": "<div class=\"enelexamen\"><strong>En el examen.<\/strong> Cuatro ítems del bloque 3 salen de esta pieza, y entre los cuatro suman casi medio punto por examen:<\/div>\n<table>\n<thead>\n<tr>\n<th>ítem<\/th>\n<th>cae<\/th>\n<th>qué pide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>El sustantivo primitivo<\/strong> de cuatro o cinco palabras derivadas<\/td>\n<td>6 de 24<\/td>\n<td><em>dentífrico<\/em> → <em>diente<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Cinco palabras derivadas<\/strong> de una palabra dada<\/td>\n<td>6 de 24<\/td>\n<td><em>piedra<\/em> → cinco<\/td>\n<\/tr>\n<tr>\n<td><strong>Plurales, femeninos o diminutivos<\/strong> de cinco sustantivos<\/td>\n<td>6 de 24<\/td>\n<td><em>tabú<\/em> → <em>tabús<\/em> o <em>tabúes<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Prefijada, compuesta o parasintética<\/strong><\/td>\n<td>5 de 24<\/td>\n<td>clasificar por su estructura<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1 · Cómo se puntúan estas preguntas<\/h3>\n<p>Son <strong>preguntas de lista<\/strong>, y se corrigen elemento a elemento. El descuento por cada uno que falte o esté mal depende de cuántos pidan:<\/p>\n<table>\n<thead>\n<tr>\n<th>elementos pedidos<\/th>\n<th>descuento por cada fallo<\/th>\n<th>dónde consta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cinco<\/strong><\/td>\n<td><strong>0,1<\/strong><\/td>\n<td>2017t, 2020t, 2020s, 2025s, 2025t, 2026s, 2026t<\/td>\n<\/tr>\n<tr>\n<td><strong>cuatro<\/strong><\/td>\n<td><strong>0,15<\/strong><\/td>\n<td>2016s<\/td>\n<\/tr>\n<tr>\n<td><strong>tres<\/strong><\/td>\n<td><strong>0,16<\/strong><\/td>\n<td>2016t<\/td>\n<\/tr>\n<tr>\n<td><strong>dos<\/strong><\/td>\n<td><strong>0,25<\/strong><\/td>\n<td>2021s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>El reparto no es una regla fija: 2016t descuenta 0,12 por cada uno en un ítem de cuatro femeninos, y 0,15 × 4 daría 0,6 sobre un ítem de 0,5. Lo que sí se repite es el criterio de las claves: <strong>medio punto repartido entre los elementos que se piden<\/strong>.<\/p>\n<p><strong>Dos consecuencias prácticas.<\/strong> La primera: <strong>se contestan todos los que piden<\/strong>, aunque el quinto sea el menos seguro, porque dejarlo en blanco descuenta lo mismo que ponerlo mal. La segunda, que sale literal de las claves: «se descontarán 0,1 puntos por cada palabra que falte o que sea errónea <strong>o esté mal escrita<\/strong>». <strong>Una palabra bien pensada y mal escrita descuenta igual que una equivocada.<\/strong><\/p>\n<h3>4 · Plurales, femeninos y diminutivos<\/h3>\n<h4>Plurales<\/h4>\n<p>Dos sets reales: <em>vals, tabú, pasapurés, rapaz, compás<\/em> (2020t) y <em>jueves, tabú, arpón, desliz, análisis<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>singular<\/th>\n<th>plural<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>vals<\/td>\n<td><strong>valses<\/strong><\/td>\n<td>acabado en consonante, añade <em>-es<\/em><\/td>\n<\/tr>\n<tr>\n<td>tabú<\/td>\n<td><strong>tabús<\/strong> o <strong>tabúes<\/strong><\/td>\n<td>acabado en <em>-ú<\/em> tónica: la clave oficial de 2015t da «tabús (o tabúes)»<\/td>\n<\/tr>\n<tr>\n<td>pasapurés<\/td>\n<td><strong>pasapurés<\/strong><\/td>\n<td>compuesto de verbo más sustantivo en plural, como <em>sacacorchos<\/em>: <strong>no cambia<\/strong><\/td>\n<\/tr>\n<tr>\n<td>rapaz<\/td>\n<td><strong>rapaces<\/strong><\/td>\n<td>la <em>z<\/em> pasa a <em>c<\/em> delante de <em>e<\/em><\/td>\n<\/tr>\n<tr>\n<td>compás<\/td>\n<td><strong>compases<\/strong><\/td>\n<td>aguda acabada en <em>-s<\/em>: añade <em>-es<\/em> y <strong>pierde la tilde<\/strong><\/td>\n<\/tr>\n<tr>\n<td>jueves<\/td>\n<td><strong>jueves<\/strong><\/td>\n<td>llana acabada en <em>-s<\/em>: no cambia<\/td>\n<\/tr>\n<tr>\n<td>arpón<\/td>\n<td><strong>arpones<\/strong><\/td>\n<td>pierde la tilde al añadir sílaba<\/td>\n<\/tr>\n<tr>\n<td>desliz<\/td>\n<td><strong>deslices<\/strong><\/td>\n<td><em>z<\/em> → <em>c<\/em><\/td>\n<\/tr>\n<tr>\n<td>análisis<\/td>\n<td><strong>análisis<\/strong><\/td>\n<td>esdrújula acabada en <em>-s<\/em>: no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los dos grupos que dan los puntos:<\/strong> los que <strong>no cambian<\/strong> —<em>jueves<\/em> y <em>análisis<\/em>, llano y esdrújula acabados en <em>-s<\/em>— y los que <strong>pierden la tilde<\/strong> al crecer una sílaba —<em>compás<\/em> → <em>compases<\/em>, <em>arpón<\/em> → <em>arpones<\/em>—. <em>Pasapurés<\/em> también se queda igual, y por otra razón: es agudo, y lo que lo hace invariable es su formación, verbo más sustantivo en plural. En <em>régimen<\/em> → <em>regímenes<\/em> la tilde ni se gana ni se pierde: las dos formas son esdrújulas y la tilde se mueve con la fuerza.<\/p>\n<h4>Femeninos<\/h4>\n<p><em>Emperador<\/em> → <strong>emperatriz<\/strong>; <em>alcalde<\/em> → <strong>alcaldesa<\/strong>; <em>testigo<\/em> → <strong>la testigo<\/strong>, que es común en cuanto al género y solo cambia el artículo, como <em>el pianista / la pianista<\/em>. Distinto es <em>la víctima<\/em>, que es <strong>epiceno<\/strong>: una sola forma y un solo artículo para los dos sexos —«la víctima era un hombre de sesenta años»—.<\/p>\n<p><strong>Los acabados en consonante añaden <em>-a<\/em>,<\/strong> y si eran agudos con tilde la pierden, porque la palabra gana una sílaba y pasa a llana acabada en vocal: <em>bailarín<\/em> → <strong>bailarina<\/strong>, <em>escocés<\/em> → <strong>escocesa<\/strong>. En el examen se escriben con el artículo delante. La clave de 2019s da así las cinco que pedía: <em>la maniquí<\/em>, <em>la bailarina<\/em>, <em>la alcaldesa<\/em>, <em>la escocesa<\/em>, <em>la testigo<\/em>; en <em>maniquí<\/em> y <em>testigo<\/em> el artículo es lo único que marca el femenino.<\/p>\n<h4>Diminutivos<\/h4>\n<p>Set real de 2025t: <em>agua, pez, ruido, lluvia, examen<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>palabra<\/th>\n<th>diminutivo<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>agua<\/td>\n<td><strong>agüita<\/strong><\/td>\n<td>necesita diéresis para que la <em>u<\/em> suene<\/td>\n<\/tr>\n<tr>\n<td>pez<\/td>\n<td><strong>pececito<\/strong><\/td>\n<td>la <em>z<\/em> pasa a <em>c<\/em>, y entra <em>-ecito<\/em><\/td>\n<\/tr>\n<tr>\n<td>ruido<\/td>\n<td><strong>ruidito<\/strong><\/td>\n<td>regular<\/td>\n<\/tr>\n<tr>\n<td>lluvia<\/td>\n<td><strong>lluviecita<\/strong> o <strong>lluvita<\/strong><\/td>\n<td>la clave admite las dos<\/td>\n<\/tr>\n<tr>\n<td>examen<\/td>\n<td><strong>examencito<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>La clave admite también las formas en -illo / -illa.<\/em><\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Plurales", "dossier": {"cuaderno": "7", "ejercicio": 3}, "ayuda": "Escribe el plural de cada sustantivo, con su tilde si la lleva.", "estricto": true, "items": [{"enun": "<i>lunes<\/i>", "sol": "lunes", "porque": "llana acabada en -s: no cambia"}, {"enun": "<i>champú<\/i>", "sol": "champús|champúes", "porque": "las dos formas son válidas"}, {"enun": "<i>cruz<\/i>", "sol": "cruces", "porque": "la <i>z<\/i> pasa a <i>c<\/i>"}, {"enun": "<i>sartén<\/i>", "sol": "sartenes", "porque": "pierde la tilde: al ganar una sílaba pasa a llana acabada en -s"}, {"enun": "<i>paraguas<\/i>", "sol": "paraguas", "porque": "llana acabada en -s: no cambia"}, {"enun": "<i>carácter<\/i>", "sol": "caracteres", "porque": "pierde la tilde y mueve la fuerza una sílaba: ca-rac-<b>te<\/b>-res"}], "criterio": "<i>Lunes<\/i> y <i>paraguas<\/i> no cambian, porque son llanas acabadas en -s. <i>Cruz<\/i> cambia la <i>z<\/i> por <i>c<\/i>. <i>Sartenes<\/i> pierde la tilde al pasar a llana acabada en -s, y <i>caracteres<\/i> la pierde además porque la fuerza pasa a otra sílaba. <i>Caracteres<\/i> ha aparecido tres veces como señuelo en el ejercicio de tildes.", "apoyo": ["4 · Plurales, femeninos y diminutivos", "Plurales"], "dossier_txt": "Del dossier: pieza 7, ejercicio 3"}, {"tipo": "hueco", "titulo": "Diminutivos", "dossier": {"cuaderno": "7", "ejercicio": 4}, "ayuda": "Escribe el diminutivo de cada sustantivo. Se admiten las formas en , "porque": "<i>volúmenes<\/i>: esdrújula"}, {"enun": "<i>tesis<\/i>", "sol": "no cambia", "porque": "llana acabada en -s: <i>las tesis<\/i>"}, {"enun": "<i>virus<\/i>", "sol": "no cambia", "porque": "llana acabada en -s: <i>los virus<\/i>"}, {"enun": "<i>canción<\/i>", "sol": "pierde la tilde", "porque": "<i>canciones<\/i>: al ganar una sílaba pasa a llana acabada en -s"}, {"enun": "<i>francés<\/i>", "sol": "pierde la tilde", "porque": "<i>franceses<\/i>: llana acabada en -s"}, {"enun": "<i>origen<\/i>", "sol": "gana la tilde", "porque": "<i>orígenes<\/i>: al ganar una sílaba pasa a esdrújula"}], "criterio": "Las que ganan o pierden la tilde se deciden con la regla general aplicada al plural: <i>canciones<\/i> es llana acabada en -s y <i>exámenes<\/i> es esdrújula. <i>Tesis<\/i> y <i>virus<\/i> no cambian, porque son llanas acabadas en -s.", "apoyo": ["4 · Plurales, femeninos y diminutivos"], "solo_web": true}, {"tipo": "hueco", "titulo": "Femeninos: los dos sets reales", "estricto": true, "ayuda": "Las cuatro palabras de 2016t y las cinco de 2019s, con su clave oficial. En las que no cambian de forma, escribe el artículo delante: <i>la testigo<\/i>.", "items": [{"enun": "<i>sacerdote<\/i>", "conv": "2016t", "sol": "sacerdotisa|la sacerdotisa", "porque": "<i>-isa<\/i>"}, {"enun": "<i>emperador<\/i>", "conv": "2016t", "sol": "emperatriz|la emperatriz", "porque": "<i>-triz<\/i>"}, {"enun": "<i>héroe<\/i>", "conv": "2016t", "sol": "heroína|la heroína", "porque": "<i>-ina<\/i>, y pierde la tilde: <i>he-ro-í-na<\/i> lleva la suya por el hiato"}, {"enun": "<i>barón<\/i>", "conv": "2016t", "sol": "baronesa|la baronesa", "porque": "<i>-esa<\/i>, y pierde la tilde"}, {"enun": "<i>maniquí<\/i>", "conv": "2019s", "sol": "la maniquí|maniquí", "porque": "común en cuanto al género: solo cambia el artículo"}, {"enun": "<i>bailarín<\/i>", "conv": "2019s", "sol": "la bailarina|bailarina", "porque": "añade <i>-a<\/i> y pierde la tilde"}, {"enun": "<i>alcalde<\/i>", "conv": "2019s", "sol": "la alcaldesa|alcaldesa", "porque": "<i>-esa<\/i>"}, {"enun": "<i>escocés<\/i>", "conv": "2019s", "sol": "la escocesa|escocesa", "porque": "añade <i>-a<\/i> y pierde la tilde"}, {"enun": "<i>testigo<\/i>", "conv": "2019s", "sol": "la testigo|testigo", "porque": "común en cuanto al género: <i>la testigo<\/i>; ⊗<i>la testiga<\/i> cuenta como fallo"}], "criterio": "Cuatro terminaciones propias, dos que añaden <i>-a<\/i> y dos que no cambian. Las que pierden la tilde —<i>bailarina<\/i>, <i>escocesa<\/i>, <i>baronesa<\/i>— la pierden por la regla general: al ganar una sílaba pasan a llanas acabadas en vocal.", "apoyo": ["Femeninos"], "solo_web": true}, {"tipo": "hueco", "titulo": "Set 2025t: escriba el diminutivo de los siguientes sustantivos", "estricto": true, "ayuda": "Las cinco palabras del ejercicio de 2025, con su clave oficial. La clave admite también las formas en <i>-illo<\/i>.", "items": [{"enun": "<i>agua<\/i>", "conv": "2025t", "sol": "agüita|agüilla", "porque": "la diéresis hace sonar la <i>u<\/i>; ⊗<i>aguita<\/i> se leería sin ella"}, {"enun": "<i>pez<\/i>", "conv": "2025t", "sol": "pececito|pececillo", "porque": "monosílabo: <i>-ecito<\/i>, y la <i>z<\/i> pasa a <i>c<\/i>"}, {"enun": "<i>ruido<\/i>", "conv": "2025t", "sol": "ruidito|ruidillo", "porque": "<i>-ito<\/i>, regular"}, {"enun": "<i>lluvia<\/i>", "conv": "2025t", "sol": "lluviecita|lluvita|lluviecilla|lluvilla", "porque": "la clave admite <i>lluviecita<\/i> y <i>lluvita<\/i>"}, {"enun": "<i>examen<\/i>", "conv": "2025t", "sol": "examencito|examencillo", "porque": "acabada en -n: <i>-cito<\/i>"}], "criterio": "Las dos trampas del set son de letra: la diéresis de <i>agüita<\/i> y la <i>c<\/i> de <i>pececito<\/i>. Un diminutivo bien formado y sin la diéresis cuenta como fallo.", "apoyo": ["Diminutivos"], "solo_web": true}, {"tipo": "abierta", "titulo": "Explica la tilde que va y viene", "ayuda": "Dos o tres líneas.", "items": [{"enun": "¿Por qué <i>compás<\/i> pierde la tilde en <i>compases<\/ <script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');

    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');

    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {

        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;

        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
