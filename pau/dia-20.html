<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 20 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}

.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}

.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 20, "fecha": "2026-12-03", "tab": "Día 20 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 3 de diciembre", "sub": "El sexto set propio · los conectores", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 6", "meta": "15 minutos · dos hiatos, una aguda en -n, una llana en -r, una esdrújula, una sobresdrújula y dos señuelos; los verbos de 2019t, segunda pasada", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los ocho sets propios<\/h3>\n<p>Escritos en el formato real —ocho palabras sueltas, sin indicar cuántas llevan tilde— y con palabras que no aparecen en ninguno de los diez ejercicios del censo, para no gastar ningún set real.<\/p>\n<p><strong>La proporción cambia de un set a otro, como en el examen.<\/strong> En los diez sets reales, ocho traen cinco palabras con tilde y tres sin ella, uno las reparte cuatro y cuatro, y otro trae cinco de siete. Aquí pasa lo mismo: seis sets van cinco y tres, uno cuatro y cuatro y otro seis y dos. Quien se corrija contando en lugar de aplicar la regla acertará unas veces y fallará otras.<\/p>\n<p>Los cuatro primeros practican las tres reglas y las excepciones; los cuatro últimos incorporan hiatos, que son el grupo más numeroso del examen.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 6: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>pais<\/i>", "sol": "país", "porque": "hiato: <i>pa-ís<\/i>"}, {"enun": "<i>duo<\/i>", "sol": "dúo", "porque": "hiato: <i>dú-o<\/i>"}, {"enun": "<i>anden<\/i>", "sol": "andén", "porque": "aguda acabada en -n"}, {"enun": "<i>crater<\/i>", "sol": "cráter", "porque": "llana acabada en -r"}, {"enun": "<i>prestamelo<\/i>", "sol": "préstamelo", "porque": "sobresdrújula: verbo con dos pronombres"}, {"enun": "<i>humedo<\/i>", "sol": "húmedo", "porque": "esdrújula"}, {"enun": "<i>joven<\/i>", "sol": "joven", "porque": "llana acabada en -n; el plural <i>jóvenes<\/i> sí lleva"}, {"enun": "<i>feroz<\/i>", "sol": "feroz", "porque": "aguda acabada en -z"}], "criterio": "Llevan tilde seis de las ocho: dos hiatos, una aguda en -n, una llana en -r, una esdrújula y una sobresdrújula. Los dos señuelos son <i>joven<\/i>, llana acabada en -n, cuyo plural <i>jóvenes<\/i> sí la lleva porque pasa a esdrújula, y <i>feroz<\/i>, aguda acabada en -z.", "apoyo": "todo", "dossier": {"cuaderno": "A-3", "ejercicio": "Set propio 6"}, "dossier_txt": "Del dossier: anexo A-3 · Set propio 6"}, {"tipo": "hueco", "titulo": "Los cinco verbos: segunda pasada", "ayuda": "Los cinco de 2019t, de memoria. Primera persona del singular del presente de indicativo.", "items": [{"enun": "<i>empezar<\/i>", "conv": "2019t", "sol": "empiezo"}, {"enun": "<i>herir<\/i>", "conv": "2019t", "sol": "hiero"}, {"enun": "<i>nacer<\/i>", "conv": "2019t", "sol": "nazco"}, {"enun": "<i>competir<\/i>", "conv": "2019t", "sol": "compito"}, {"enun": "<i>erguir<\/i>", "conv": "2019t", "sol": "yergo|irgo"}], "criterio": "Se anota cuántas se fallan y se compara con la primera pasada, la del martes 1 de diciembre.", "apoyo": "todo", "dossier": {"cuaderno": "A-3", "ejercicio": "Los cinco verbos · tanda 2", "parte": "segunda pasada"}, "dossier_txt": "Del dossier: anexo A-3 · Los cinco verbos · tanda 2 · segunda pasada"}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios (p. 296)", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los conectores: la lista, los cuatro momentos y el ítem del bloque 3", "meta": "45 minutos · las once funciones y las seis que hacen falta para escribir; conceder frente a oponer; qué va detrás de cada conector; y → e delante de i-; los cuatro ítems reales", "teoria": "<div class=\"enelexamen\"><strong>En los dos exámenes.<\/strong> Los conectores se puntúan en dos sitios, y el segundo pesa más que el primero:<\/div>\n<table>\n<thead>\n<tr>\n<th>dónde<\/th>\n<th>qué pide<\/th>\n<th>cae<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bloque 3 de Llengua castellana<\/strong><\/td>\n<td>elegir la secuencia de dos a cuatro conectores que encaja en un enunciado, entre cuatro opciones<\/td>\n<td><strong>7 de 24<\/strong>, y ninguno desde 2023<\/td>\n<\/tr>\n<tr>\n<td><strong>Las dos redacciones<\/strong><\/td>\n<td>usarlos<\/td>\n<td><strong>en los 7 puntos que se escriben<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y la línea que la clave de Llengua castellana añadió en 2026: <strong>«Se valorará la presencia de conectores argumentativos».<\/strong> En el comentario, la banda de estilo —1,5 puntos— puntúa el «uso apropiado de conectores» con esas palabras.<\/p>\n<blockquote>\n<p>El ítem del bloque 3 lleva cuatro años sin caer (2023-2026), y aun así esta pieza da puntos en todos los exámenes: los conectores marcan dónde empieza cada argumento, y desde 2026 la clave de castellano los valora expresamente.<\/p>\n<\/blockquote>\n<h3>1 · Los once oficios, con la lista larga<\/h3>\n<p>Cada fila es un oficio, y dentro de la fila los conectores no son equivalentes: cambian de intensidad, de registro y de posición en la oración. La columna de la derecha marca con <strong>●<\/strong> los seis oficios que hacen falta para escribir las dos redacciones; los otros cinco aparecen <strong>dentro<\/strong> de los argumentos y no en las junturas.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\"><\/th>\n<th>oficio<\/th>\n<th>los que se escriben en un examen<\/th>\n<th style=\"text-align: center;\">●<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\"><strong>1<\/strong><\/td>\n<td><strong>Ordenar<\/strong><\/td>\n<td>en primer lugar · para empezar · de entrada · por un lado / por una parte · en segundo lugar · a continuación · seguidamente · por otro lado / por otra parte · por último · finalmente · para terminar<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>2<\/strong><\/td>\n<td><strong>Añadir<\/strong><\/td>\n<td>además · asimismo · también · igualmente · a esto se añade que · a esto hay que sumar que · más aún · incluso · es más · por añadidura<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>3<\/strong><\/td>\n<td><strong>Oponer<\/strong><\/td>\n<td>pero · sin embargo · no obstante · en cambio · por el contrario · ahora bien · antes bien · con todo · eso sí · sino (que)<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>4<\/strong><\/td>\n<td><strong>Conceder<\/strong><\/td>\n<td>aunque · a pesar de (que) · pese a (que) · si bien · aun cuando · por más que · es cierto que… pero · ciertamente… ahora bien<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>5<\/strong><\/td>\n<td><strong>Causa<\/strong><\/td>\n<td>porque · ya que · puesto que · dado que · debido a (que) · a causa de · en vista de que · como (al principio de la oración) · pues (detrás de coma)<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>6<\/strong><\/td>\n<td><strong>Consecuencia<\/strong><\/td>\n<td>por eso · por (lo) tanto · por consiguiente · así pues · en consecuencia · de ahí que · de modo que · de manera que · por ello · razón por la cual<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>7<\/strong><\/td>\n<td><strong>Condición<\/strong><\/td>\n<td>si · siempre que · a no ser que · salvo que · en caso de que · a condición de que · con tal de que · de lo contrario<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>8<\/strong><\/td>\n<td><strong>Finalidad<\/strong><\/td>\n<td>para (que) · con el fin de (que) · a fin de (que) · con el objeto de · con vistas a<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>9<\/strong><\/td>\n<td><strong>Ejemplificar y concretar<\/strong><\/td>\n<td>por ejemplo · así · en concreto · en particular · concretamente · pongamos por caso · sin ir más lejos · tal es el caso de<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>10<\/strong><\/td>\n<td><strong>Aclarar y rectificar<\/strong><\/td>\n<td>es decir · esto es · en otras palabras · dicho de otro modo · a saber · mejor dicho · más bien · o al menos<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>11<\/strong><\/td>\n<td><strong>Cerrar<\/strong><\/td>\n<td>en definitiva · en conclusión · en resumen · en suma · en último término · al fin y al cabo · a fin de cuentas<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres avisos sobre esta lista.<\/strong><\/p>\n<p><strong>El primero: <em>o sea<\/em> no se escribe en un examen.<\/strong> Es una fórmula correcta, pero propia de la lengua oral, y en la banda de adecuación cuenta como tono de conversación. Se escribe <em>es decir<\/em> o <em>esto es<\/em>.<\/p>\n<p><strong>El segundo: conceder no es oponer.<\/strong> Oponer es negar lo anterior (<em>pero<\/em>, <em>sin embargo<\/em>); conceder es darlo por bueno y sostener la postura de todos modos (<em>aunque<\/em>, <em>es cierto que… pero<\/em>). En 150-200 palabras la concesión es recomendable, no obligatoria: la banda de coherencia del comentario descuenta por «argumentación circular», y conceder añade una idea que el texto no llevaba —la objeción y su respuesta—, así que el texto avanza en lugar de volver sobre sí mismo; un texto sin concesión puede salir coherente igual.<\/p>\n<p><strong>El tercero: dentro de una fila hay grados.<\/strong> <em>Pero<\/em> es el más suave y el más frecuente de la fila 3; <em>no obstante<\/em> y <em>antes bien<\/em> son los más formales; <em>eso sí<\/em> es el más restringido, porque solo sirve para añadir una pega a algo que se acaba de conceder. En la fila 2, <em>incluso<\/em> y <em>es más<\/em> no son intercambiables con <em>además<\/em>: añaden algo <strong>más fuerte<\/strong> que lo anterior, y por eso no se ponen delante del argumento de menor peso.<\/p>\n<h3>2 · Los cinco grupos de marcadores del discurso<\/h3>\n<p>En el apartado 1, <em>conector<\/em> nombra a todo lo que enlaza dos ideas, y la lista mezcla conjunciones —<em>pero<\/em>, <em>aunque<\/em>, <em>porque<\/em>, <em>si<\/em>, <em>para que<\/em>— con marcadores —<em>sin embargo<\/em>, <em>además<\/em>, <em>por tanto<\/em>—, porque en una redacción hacen el mismo oficio; el apartado 3 las separa por la puntuación. El <strong>marcador del discurso<\/strong> es una palabra o un grupo de palabras que no funciona como sujeto ni como complemento de nada, va entre comas y orienta al lector sobre cómo tiene que leer lo que viene. Los cinco grupos de abajo son los de la gramática académica, y en ellos <em>conector<\/em> es solo el nombre del grupo 2.<\/p>\n<table>\n<thead>\n<tr>\n<th>grupo<\/th>\n<th>qué hace<\/th>\n<th>los de cada clase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · Estructuradores de la información<\/strong><\/td>\n<td>ordenan, sin argumentar nada<\/td>\n<td><strong>comentadores<\/strong>: <em>pues bien<\/em>, <em>así las cosas<\/em>, <em>dicho esto<\/em> · <strong>ordenadores<\/strong>: <em>en primer lugar<\/em>, <em>por una parte<\/em>, <em>de un lado<\/em>, <em>por último<\/em> · <strong>digresores<\/strong>: <em>por cierto<\/em>, <em>a todo esto<\/em>, <em>a propósito<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2 · Conectores<\/strong><\/td>\n<td>relacionan dos miembros y el segundo se lee a la luz del primero<\/td>\n<td><strong>aditivos<\/strong>: <em>además<\/em>, <em>asimismo<\/em>, <em>incluso<\/em>, <em>es más<\/em> · <strong>consecutivos<\/strong>: <em>por tanto<\/em>, <em>por consiguiente<\/em>, <em>así pues<\/em>, <em>de ahí que<\/em>, <em>entonces<\/em> · <strong>contraargumentativos<\/strong>: <em>en cambio<\/em>, <em>por el contrario<\/em>, <em>sin embargo<\/em>, <em>no obstante<\/em>, <em>con todo<\/em>, <em>ahora bien<\/em>, <em>eso sí<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3 · Reformuladores<\/strong><\/td>\n<td>repiten lo anterior con otras palabras<\/td>\n<td><strong>explicativos<\/strong>: <em>es decir<\/em>, <em>esto es<\/em>, <em>a saber<\/em> (y <em>o sea<\/em>, que es oral) · <strong>rectificativos<\/strong>: <em>mejor dicho<\/em>, <em>más bien<\/em> · <strong>de distanciamiento<\/strong>: <em>en cualquier caso<\/em>, <em>de todos modos<\/em>, <em>en todo caso<\/em> · <strong>recapitulativos<\/strong>: <em>en suma<\/em>, <em>en definitiva<\/em>, <em>en conclusión<\/em>, <em>al fin y al cabo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>4 · Operadores argumentativos<\/strong><\/td>\n<td>no unen nada: modifican solo al miembro en el que están<\/td>\n<td><strong>de refuerzo<\/strong>: <em>en realidad<\/em>, <em>de hecho<\/em>, <em>en el fondo<\/em>, <em>desde luego<\/em> · <strong>de concreción<\/strong>: <em>por ejemplo<\/em>, <em>en particular<\/em>, <em>en concreto<\/em>, <em>sin ir más lejos<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>5 · Marcadores conversacionales<\/strong><\/td>\n<td>organizan una conversación, y <strong>no se escriben en un examen<\/strong><\/td>\n<td><em>hombre<\/em>, <em>mujer<\/em>, <em>claro<\/em>, <em>bueno<\/em>, <em>vamos<\/em>, <em>venga<\/em>, <em>oye<\/em>, <em>mira<\/em>, <em>¿sabes?<\/em>, <em>¿no?<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>El grupo 4 explica un error de redacción.<\/strong> <em>De hecho<\/em> y <em>en realidad<\/em> refuerzan el miembro en el que están, sin enlazarlo con otro. Quien los usa como juntura —«En primer lugar… De hecho…»— deja el segundo argumento sin conector que lo anuncie, y lo que se lee es un solo argumento reforzado con un dato más. Que sean dos lo decide lo que afirma cada uno (pieza 11, regla 4); el conector solo marca dónde empieza el segundo.<\/p>\n<p><strong>Y el grupo 3, los reformuladores, tiene una condición de uso.<\/strong> Reformular es volver a decir lo mismo con otras palabras, y la banda de coherencia descuenta por «repeticiones injustificadas». Un <em>es decir<\/em> está bien puesto cuando lo que viene detrás es <strong>más claro<\/strong> que lo de delante; está mal puesto cuando solo es más largo.<\/p>\n<h3>3 · La puntuación, que separa un marcador de una conjunción<\/h3>\n<p>La diferencia práctica se comprueba con dos pasos.<\/p>\n<p><strong>El marcador va entre comas y se puede mover.<\/strong><\/p>\n<blockquote>\n<p><em>Sin embargo, la obra siguió adelante.<\/em>\n<em>La obra, sin embargo, siguió adelante.<\/em>\n<em>La obra siguió adelante, sin embargo.<\/em><\/p>\n<\/blockquote>\n<p>Las tres son correctas y dicen lo mismo. <strong>La conjunción no se mueve ni va entre comas:<\/strong><\/p>\n<blockquote>\n<p><em>La obra siguió adelante, <\/em><em>pero<\/em><em> el presupuesto se disparó.<\/em>\n⊗ <em>La obra, pero, siguió adelante.<\/em> · ⊗ <em>La obra siguió adelante, el presupuesto se disparó pero.<\/em><\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>son conjunciones y no se mueven<\/th>\n<th>son marcadores y se mueven<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>pero<\/em>, <em>sino (que)<\/em>, <em>aunque<\/em>, <em>porque<\/em>, <em>pues<\/em> (causal), <em>si<\/em>, <em>que<\/em>, <em>ya que<\/em>, <em>puesto que<\/em><\/td>\n<td><em>sin embargo<\/em>, <em>no obstante<\/em>, <em>en cambio<\/em>, <em>por el contrario<\/em>, <em>por tanto<\/em>, <em>además<\/em>, <em>asimismo<\/em>, <em>es decir<\/em>, <em>en definitiva<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dos consecuencias para la puntuación.<\/strong><\/p>\n<p><strong>La primera:<\/strong> detrás de un punto y coma o de un punto, un marcador lleva coma: <em>Llovió tres días; no obstante, la obra siguió<\/em>. Delante de <em>pero<\/em> la puntuación depende de la longitud: con oraciones cortas va coma —<em>Llovió tres días, pero la obra siguió<\/em>—, y con oraciones largas, y sobre todo si ya llevan comas dentro, el DPD escribe punto y coma —<em>Llovió tres días seguidos, con el río a punto de desbordarse; pero la obra, que ya iba con retraso, siguió<\/em>—.<\/p>\n<p><strong>La segunda:<\/strong> dos marcadores del mismo grupo seguidos son redundantes. ⊗<em>Sin embargo, no obstante, la obra siguió<\/em> opone dos veces la misma idea: la oración es gramatical, y lo que se resiente es la banda de estilo del comentario, que puntúa el «uso apropiado de conectores».<\/p>\n<h4>Cinco grafías que se confunden<\/h4>\n<table>\n<thead>\n<tr>\n<th>⊗<\/th>\n<th>✓<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>⊗ <em>sino<\/em> por <em>si no<\/em><\/td>\n<td><em>si no<\/em> llueve, salimos<\/td>\n<td><em>sino<\/em> es la conjunción adversativa; <em>si no<\/em> son dos palabras, la condicional más la negación<\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>sobre todo<\/em> escrito <em>sobretodo<\/em><\/td>\n<td><em>sobre todo<\/em><\/td>\n<td><em>sobretodo<\/em> con una sola palabra es una prenda de abrigo<\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>por que<\/em> por <em>porque<\/em><\/td>\n<td><em>porque<\/em> llovía<\/td>\n<td><em>por que<\/em> solo se escribe separado cuando <em>que<\/em> introduce una oración de relativo o depende de un verbo con <em>por<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>aun que<\/em><\/td>\n<td><em>aunque<\/em><\/td>\n<td>se escribe siempre junto cuando concede<\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>asi mismo<\/em><\/td>\n<td><em>asimismo<\/em> ('además') / <em>así mismo<\/em> ('de esa misma manera')<\/td>\n<td>dos palabras distintas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Los que vienen del catalán<\/h4>\n<p>En este centro se habla catalán la mayor parte del día y el examen se escribe en castellano, y estos ocho aparecen en las redacciones todos los cursos. Cada uno descuenta 0,1 como falta de léxico, y en el comentario ese descuento no tiene tope.<\/p>\n<table>\n<thead>\n<tr>\n<th>⊗<\/th>\n<th>✓<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>⊗ <em>inclús<\/em><\/td>\n<td><em>incluso<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>ademés<\/em>, ⊗ <em>a més<\/em><\/td>\n<td><em>además<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>tampoco no lo sé<\/em><\/td>\n<td><em>tampoco lo sé<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>en quant a<\/em><\/td>\n<td><em>en cuanto a<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>degut a que<\/em><\/td>\n<td><em>debido a que<\/em>, <em>porque<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>per altra banda<\/em><\/td>\n<td><em>por otra parte<\/em>, <em>por otro lado<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>doncs<\/em><\/td>\n<td><em>pues<\/em><\/td>\n<\/tr>\n<tr>\n<td>⊗ <em>tot i que<\/em><\/td>\n<td><em>aunque<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4 · Los cuatro momentos de una redacción<\/h3>\n<table>\n<thead>\n<tr>\n<th>momento<\/th>\n<th style=\"text-align: center;\">de qué oficio sale<\/th>\n<th>conectores, y alternativas para no repetir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>abrir el primer argumento<\/strong><\/td>\n<td style=\"text-align: center;\">1<\/td>\n<td><em>en primer lugar<\/em>, <em>para empezar<\/em>, <em>de entrada<\/em>, <em>por un lado<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>abrir el segundo<\/strong><\/td>\n<td style=\"text-align: center;\">1 + 2<\/td>\n<td><em>además<\/em>, <em>por otro lado<\/em>, <em>en segundo lugar<\/em>, <em>a esto se añade que<\/em>, <em>asimismo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>conceder y girar<\/strong><\/td>\n<td style=\"text-align: center;\">4 + 3<\/td>\n<td><em>es cierto que… pero<\/em>, <em>aunque<\/em>, <em>si bien… sin embargo<\/em>, <em>ciertamente… ahora bien<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>cerrar<\/strong><\/td>\n<td style=\"text-align: center;\">6 + 11<\/td>\n<td><em>por eso<\/em>, <em>por tanto<\/em>, <em>así pues<\/em>, <em>en definitiva<\/em>, <em>a fin de cuentas<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En 50-80 palabras entran los dos primeros y el cierre. En 150-200 entran los cuatro. Las dos redacciones del anexo A-1 que se comparan aquí, la de 2,75 y la de 1,75, son cortas y ninguna lleva concesión, así que lo que las separa es el desarrollo de los argumentos: la de 1,75 enuncia dos razones en una línea cada una, sin ningún dato, y la de 2,75 desarrolla la primera con una cifra y un mecanismo, y cambia de terreno, del trabajador a la empresa.<\/p>\n<p><strong>La regla de no repetir, en números.<\/strong> Un texto de 150-200 palabras escrito con el esqueleto de la pieza 11 lleva cuatro junturas. Repetir <em>además<\/em> en dos de ellas no demuestra que los argumentos se repitan, porque dos razones distintas pueden empezar igual; lo que hace es presentar las dos partes con la misma etiqueta, y la variedad de conectores la puntúa la banda de estilo («uso apropiado de conectores»). Cuatro junturas, cuatro conectores de oficios distintos: ordenar, añadir, conceder, concluir.<\/p>\n<p><strong>Y el error contrario:<\/strong> poner un conector en cada frase. Un texto de ocho frases con ocho marcadores se lee como una lista y la banda de estilo lo descuenta igual. Los conectores van en las junturas —donde empieza una parte del esqueleto—, no dentro de cada parte.<\/p>\n<h3>5 · El ítem del bloque 3, resuelto<\/h3>\n<p>Cuatro secuencias, y hay que elegir la que encaja. De los cinco ítems disponibles en exámenes no reservados, aquí van cuatro con su clave; el quinto, el de 2019t, se guarda para el examen del 17 de diciembre.<\/p>\n<blockquote>\n<p><strong>2015t, 3.3.<\/strong> «<span class=\"hueco\" style=\"width:8.0em\"><\/span> su dilatado historial, el magistrado fue relevado del cargo <span class=\"hueco\" style=\"width:6.4em\"><\/span> incluso inhabilitado del mismo por incumplir órdenes judiciales.»\na) A pesar de - y · b) Sin - pero · c) Más aun - e · d) <strong>No obstante - e<\/strong><\/p>\n<p><strong>Y la trampa de este ítem no es de conectores.<\/strong> La opción a) tiene el primer conector bien —<em>a pesar de<\/em> concede igual que <em>no obstante<\/em>— y falla en el segundo: delante de una palabra que empieza por <em>i-<\/em>, <strong>la conjunción <em>y<em> se convierte en <\/em>e<\/em><\/strong>. <em>Incluso<\/em> empieza por <em>i<\/em>, así que solo valen las opciones con <em>e<\/em>. De las dos que la llevan, la c) empieza por <em>más aun<\/em>, que no concede nada.<\/p>\n<p><strong>2016s, 3.3.<\/strong> «La medida adoptada fue, <span class=\"hueco\" style=\"width:5.0em\"><\/span>, muy prudente, <span class=\"hueco\" style=\"width:5.0em\"><\/span> la falta de libertad; <span class=\"hueco\" style=\"width:5.0em\"><\/span>, no se arriesgaron a una aplicación inmediata <span class=\"hueco\" style=\"width:5.0em\"><\/span> decidieron posponerla.»\n<strong>c) sin duda / a pesar de / sin embargo / sino que<\/strong><\/p>\n<p><strong>2018s, 3.4.<\/strong> «<span class=\"hueco\" style=\"width:6.4em\"><\/span> no ser esposos, tratan de ser aceptados por la sociedad <span class=\"hueco\" style=\"width:6.4em\"><\/span> no lo consiguen.»\na) A pesar de / aún · b) Pero / aunque · c) Sin embargo / y · d) <strong>Pese a / pero<\/strong><\/p>\n<p><strong>2021s, 3.3.<\/strong> «Fuimos superiores en todo momento, <span class=\"hueco\" style=\"width:5.0em\"><\/span> en el segundo tiempo dimos un paso atrás para defendernos; <span class=\"hueco\" style=\"width:5.0em\"><\/span>, estuvimos siempre tranquilos <span class=\"hueco\" style=\"width:5.0em\"><\/span> ellos no nos generaban ocasiones.»\n<strong>b) aunque - no obstante - porque<\/strong><\/p>\n<\/blockquote>\n<h4>Lo que se repite en las cuatro claves<\/h4>\n<p><strong>El primer hueco es concesivo en tres de los cuatro<\/strong>: <em>no obstante<\/em>, <em>pese a<\/em>, <em>aunque<\/em>. Y el ítem mide siempre lo mismo: <strong>si sabes distinguir conceder de oponer<\/strong>, y si reconoces que <em>aunque<\/em> exige un verbo detrás y no admite un sustantivo.<\/p>\n<table>\n<thead>\n<tr>\n<th>se puede poner delante de…<\/th>\n<th>conectores<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>un sustantivo<\/strong> (sin verbo detrás)<\/td>\n<td><em>a pesar de<\/em>, <em>pese a<\/em>, <em>no obstante<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una oración con verbo<\/strong><\/td>\n<td><em>aunque<\/em>, <em>a pesar de que<\/em>, <em>pese a que<\/em>, <em>si bien<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>A pesar de <span class=\"vs\">su historial<\/span><\/em> lleva sustantivo; <em>a pesar de <span class=\"vs\">que tenía<\/span> historial<\/em> lleva verbo. Poner <em>aunque<\/em> delante de un sustantivo —⊗<em>aunque la falta de libertad<\/em>— es el error que descarta la opción a) del ítem de 2016s.<\/p>\n<p><strong>El método, en tres pasos, sirve para los cinco ítems no reservados:<\/strong><\/p>\n<ol>\n<li><strong>Comprueba qué hay detrás del primer hueco<\/strong>: un sustantivo o un verbo. Esa comprobación descarta la mitad de las opciones antes de entrar en el significado.<\/li>\n<li><strong>Decide si el enunciado concede o se opone<\/strong>: si lo de delante y lo de detrás se contradicen y lo de delante se da por bueno, concede.<\/li>\n<li><strong>Comprueba el último hueco<\/strong>, donde suele estar la trampa que no es de conectores: la <em>y<\/em> que pasa a <em>e<\/em>, la <em>o<\/em> que pasa a <em>u<\/em>, un <em>sino que<\/em> donde correspondería <em>sino<\/em>.<\/li>\n<\/ol>\n<h3>6 · Los marcadores que han preguntado por su significado<\/h3>\n<p>A veces no piden elegir la secuencia, sino <strong>qué significado introduce<\/strong> un marcador del texto. <em>De ahí que<\/em>, que cayó en 2016s, y siete más que pueden caer con el mismo formato (<em>no en vano<\/em> se preguntó en 2014, fuera del censo de 2015-2026, y aparece en la clave de 2016s por una errata):<\/p>\n<table>\n<thead>\n<tr>\n<th>marcador<\/th>\n<th>qué introduce<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>de ahí que<\/strong><\/td>\n<td>una <strong>consecuencia<\/strong>: lo que viene detrás se deduce de lo anterior<\/td>\n<td><em>Ha llovido tres meses. De ahí que el embalse esté lleno.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>no en vano<\/strong><\/td>\n<td>un <strong>refuerzo<\/strong>: lo que viene detrás confirma o justifica lo anterior<\/td>\n<td><em>Es la biblioteca más antigua de la comarca. No en vano lleva ochenta años abierta.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>ahora bien<\/strong><\/td>\n<td>una <strong>objeción<\/strong> a lo que se acaba de conceder<\/td>\n<td><em>El plan es razonable. Ahora bien, nadie ha dicho quién lo paga.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>con todo<\/strong><\/td>\n<td>una <strong>oposición<\/strong> a algo ya admitido<\/td>\n<td><em>Costó el doble. Con todo, se terminó a tiempo.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>eso sí<\/strong><\/td>\n<td>una <strong>pega<\/strong> añadida a lo anterior<\/td>\n<td><em>La casa está bien de precio. Eso sí, no tiene ascensor.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>en el fondo<\/strong><\/td>\n<td>un <strong>refuerzo<\/strong> que presenta lo que sigue como lo verdadero<\/td>\n<td><em>Discuten por el ruido. En el fondo discuten por la hora de cierre.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>por cierto<\/strong><\/td>\n<td>una <strong>digresión<\/strong>: se abre un asunto distinto<\/td>\n<td><em>El plazo acaba el viernes. Por cierto, la solicitud ya está colgada.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>al fin y al cabo<\/strong><\/td>\n<td>una <strong>recapitulación<\/strong> que cierra dando la razón de todo lo anterior<\/td>\n<td><em>Nadie protestó. Al fin y al cabo, el cambio les convenía.<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Y este ítem trae una errata oficial documentada.<\/strong> En el examen de 2016s la pregunta 1.4 pide el significado de <strong><em>de ahí que<\/em><\/strong>, y <strong>la clave de corrección contesta a otra pregunta<\/strong>: la del marcador <strong><em>No en vano<\/em><\/strong>, que está dos líneas más arriba en el mismo texto y que ya se había preguntado en 2014. Las dos respuestas son la opción d) —consecuencia para <em>de ahí que<\/em>, refuerzo para <em>no en vano<\/em>—, así que quien contestó d) acertó con cualquiera de las dos versiones. La lección práctica: <strong>se contesta a la pregunta que está impresa en tu cuadernillo<\/strong>, aunque la clave que se publique después hable de otra.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "clasificar", "titulo": "El oficio de cada conector", "dossier": {"cuaderno": "12", "ejercicio": 1}, "ayuda": "Indica de qué oficio es cada conector, entre los once de la lista larga de la teoría.", "ops": ["ordenar", "añadir", "oponer", "conceder", "causa", "consecuencia", "condición", "finalidad", "ejemplificar y concretar", "aclarar y rectificar", "cerrar"], "items": [{"enun": "<i>pues bien<\/i>", "sol": "ordenar", "porque": "es el único de los doce que no aparece en la tabla: <i>pues bien<\/i> es un comentador y abre lo que sigue, como <i>para empezar<\/i>"}, {"enun": "<i>a esto hay que sumar que<\/i>", "sol": "añadir"}, {"enun": "<i>antes bien<\/i>", "sol": "oponer"}, {"enun": "<i>de ahí que<\/i>", "sol": "consecuencia"}, {"enun": "<i>a saber<\/i>", "sol": "aclarar y rectificar"}, {"enun": "<i>si bien<\/i>", "sol": "conceder"}, {"enun": "<i>a fin de cuentas<\/i>", "sol": "cerrar"}, {"enun": "<i>en vista de que<\/i>", "sol": "causa"}, {"enun": "<i>sin ir más lejos<\/i>", "sol": "ejemplificar y concretar"}, {"enun": "<i>a no ser que<\/i>", "sol": "condición"}, {"enun": "<i>con vistas a<\/i>", "sol": "finalidad"}, {"enun": "<i>más bien<\/i>", "sol": "aclarar y rectificar"}], "criterio": "<i>En vista de que<\/i> da la causa —<i>en vista de que nadie contestaba, colgó<\/i>— y <i>con vistas a<\/i> anuncia la finalidad —<i>ahorra con vistas a la entrada de un piso<\/i>—, aunque los dos se construyan con <i>vista<\/i>. <i>Si bien<\/i> c a conjunción que da la causa se escribe en una palabra"}, {"enun": "«Degut a que llovía, se suspendió.»", "sol": "interferencia del catalán", "porque": "<i>debido a que<\/i> o <i>porque<\/i>; <i>degut a<\/i> es catalán"}, {"enun": "«No es una queja sino una propuesta.»", "sol": "no hay falta", "porque": "<i>sino<\/i> opone una idea a otra que va negada"}, {"enun": "«Si no vienes, avísame.»", "sol": "no hay falta", "porque": "<i>si no<\/i> son la condicional y la negación, y admiten algo en medio: <i>si tú no vienes<\/i>"}, {"enun": "«No lo pagó él, si no su hermana.»", "sol": "falta de ortografía", "porque": "<i>sino<\/i>: opone <i>su hermana<\/i> a <i>él<\/i>, que va negado"}, {"enun": "«En quant a los horarios, no hubo cambios.»", "sol": "interferencia del catalán", "porque": "<i>en cuanto a<\/i>"}, {"enun": "«Per altra banda, el precio subió.»", "sol": "interferencia del catalán", "porque": "<i>por otra parte<\/i> o <i>por otro lado<\/i>"}, {"enun": "«Aun que costó más, salió bien.»", "sol": "falta de ortografía", "porque": "<i>aunque<\/i>, en una palabra"}], "criterio": "La interferencia traslada al castellano una palabra o una construcción del catalán: <i>inclús<\/i>, <i>degut a<\/i>, <i>tampoco no<\/i>. La falta de ortografía está en cómo se escribe una palabra castellana: <i>sobretodo<\/i> por <i>sobre todo<\/i>, <i>aun que<\/i> por <i>aunque<\/i>, <i>si no<\/i> por <i>sino<\/i>.", "apoyo": ["3 · La puntuación, que separa un marcador de una conjunción", "Los que vienen del catalán"], "dossier_txt": "Del dossier: pieza 12, ejercicio 5 · la clasificación"}, {"tipo": "opcion", "titulo": "Dos secuencias de conectores", "dossier": {"cuaderno": "12", "ejercicio": 6}, "ayuda": "Dos secuencias en el formato del examen. Elige la que encaja en cada enunciado; al comprobar aparece qué descarta cada opción.", "items": [{"enun": "«______ el mal tiempo, la obra siguió adelante ______ incluso se adelantó una semana.»", "sol": "Pese a - e", "porque": "<i>incluso<\/i> empieza por <i>i<\/i>, así que la <i>y<\/i> pasa a <i>e<\/i>, y quedan descartadas las dos secuencias con <i>y<\/i>. De las dos con <i>e<\/i>, <i>sin embargo<\/i> no puede ir delante del sustantivo <i>el mal tiempo<\/i>", "ops": ["Sin embargo - e", "A pesar de - y", "Pese a - e", "Aunque - y"]}, {"enun": "«______ el plazo era corto, el equipo entregó a tiempo; ______, nadie hizo horas de más ______ se organizaron por turnos.»", "sol": "Aunque - además - sino que", "porque": "el primer hueco lleva un verbo detrás, <i>era<\/i>, y ningún <i>que<\/i>: <i>pese<\/i> y <i>a pesar<\/i> exigen <i>a que<\/i> y <i>de que<\/i>, y quedan descartados. <i>Aunque<\/i> y <i>si bien<\/i> conceden con un verbo detrás, y los separa el segundo hueco: que nadie hiciera horas de más se añade a que el equipo entregara a tiempo, y no se le opone, así que entra <i>además<\/i> y no <i>por el contrario<\/i>. El tercer hueco opone una idea a una negación, <i>nadie hizo horas de más<\/i>, y esa negación exige <i>sino que<\/i> con un verbo detrás", "ops": ["A pesar - no obstante - o", "Pese - sin embargo - pero", "Si bien - por el contrario - y", "Aunque - además - sino que"]}], "criterio": "Tres comprobaciones, en este orden: qué va detrás del primer hueco, un sustantivo o un verbo; si la relación concede, opone o añade; y el último hueco, donde suele estar la <i>y<\/i> que pasa a <i>e<\/i> o el <i>sino que<\/i>.", "apoyo": ["3 · La puntuación, que separa un marcador de una conjunción", "5 · El ítem del bloque 3, resuelto"], "dossier_txt": "Del dossier: pieza 12, ejercicio 6"}, {"tipo": "clasificar", "titulo": "¿Conceder u oponer?", "dossier": {"cuaderno": "12", "ejercicio": 7}, "ayuda": "Ocho oraciones con un hueco. Indica si el conector que falta opone o concede. Para los de conceder, indica además qué va detrás: un sustantivo o un verbo. Dos se han añadido en la web: la del alquiler y la de la línea 12.", "ops": ["conceder, con sustantivo detrás", "conceder, con verbo detrás", "oponer"], "items": [{"enun": "______ el sueldo es bajo, el horario compensa.", "sol": "conceder, con verbo detrás", "porque": "<i>aunque<\/i>, con el verbo <i>es<\/i> detrás"}, {"enun": "El sueldo es bajo; ______, el horario compensa.", "sol": "oponer", "porque": "<i>sin embargo<\/i> o <i>no obstante<\/i>, detrás del punto y coma"}, {"enun": "______ que hubo retrasos, la línea no cambió los horarios.", "sol": "conceder, con verbo detrás", "porque": "<i>a pesar de<\/i> o <i>pese a<\/i>: el <i>que<\/i> ya está escrito, y detrás va el verbo <i>hubo<\/i>"}, {"enun": "______ su experiencia, no consiguió el puesto.", "sol": "conceder, con sustantivo detrás", "porque": "<i>a pesar de<\/i> o <i>pese a<\/i>, con el sustantivo <i>su experiencia<\/i> detrás"}, {"enun": "______ los retrasos, la línea no cambió los horarios.", "sol": "conceder, con sustantivo detrás", "porque": "<i>a pesar de<\/i> o <i>pese a<\/i>, con el sustantivo <i>los retrasos<\/i> detrás"}, {"enun": "______ tenía experiencia, no consiguió el puesto.", "sol": "conceder, con verbo detrás", "porque": "<i>aunque<\/i> o <i>si bien<\/i>, con el verbo <i>tenía<\/i> detrás"}, {"enun": "El alquiler ha subido un veinte por ciento; ______, los sueldos del barrio siguen igual.", "sol": "oponer", "porque": "<i>sin embargo<\/i>, <i>no obstante<\/i> o <i>en cambio<\/i>, detrás del punto y coma"}, {"enun": "La línea 5 pasa cada diez minutos; la 12, ______, solo pasa cada media hora.", "sol": "oponer", "porque": "<i>en cambio<\/i> o <i>por el contrario<\/i>, entre comas: el marcador puede ir en medio de su oración"}], "criterio": "Oponer es negar la idea anterior: <i>el sueldo es bajo; sin embargo, el horario compensa<\/i>. Conceder es darla por buena y sostener la postura de todos modos: <i>aunque el sueldo es bajo, el horario compensa<\/i>. De los que conceden, <i>a pesar de<\/i> y <i>pese a<\/i> admiten un sustantivo detrás, y <i>aunque<\/i> y <i>si bien<\/i> exigen un verbo.", "apoyo": ["2 · Los cinco grupos de marcadores del discurso", "3 · La puntuación, que separa un marcador de una conjunción"], "dossier_txt": "Del dossier: pieza 12, ejercicio 7"}, {"tipo": "clasificar", "titulo": "¿Qué introduce el marcador?", "dossier": {"cuaderno": "12", "ejercicio": 8}, "ayuda": "Nueve oraciones con un marcador. Indica qué introduce cada uno.", "ops": ["consecuencia", "refuerzo", "oposición", "objeción", "digresión", "recapitulación"], "items": [{"enun": "«Ha llovido tres meses seguidos. De ahí que el embalse esté lleno.»", "sol": "consecuencia", "porque": "lo que viene detrás se deduce de lo anterior"}, {"enun": "«Es la biblioteca más antigua de la comarca. No en vano lleva ochenta años abierta.»", "sol": "refuerzo", "porque": "lo que viene detrás confirma o justifica lo anterior"}, {"enun": "«El contrato acababa en junio. Por el contrario, siguió trabajando hasta octubre.»", "sol": "oposición"}, {"enun": "«No llegaron los materiales. Por lo tanto, se paró la obra.»", "sol": "consecuencia"}, {"enun": "«El plan es razonable. Ahora bien, nadie ha dicho quién lo paga.»", "sol": "objeción", "porque": "una objeción a lo que se acaba de conceder"}, {"enun": "«Discuten por el ruido. En el fondo discuten por la hora de cierre.»", "sol": "refuerzo", "porque": "presenta lo que sigue como lo verdadero"}, {"enun": "«El plazo acaba el viernes. Por cierto, la solicitud ya está colgada.»", "sol": "digresión", "porque": "se abre un asunto distinto"}, {"enun": "«Nadie protestó. Al fin y al cabo, el cambio les convenía.»", "sol": "recapitulación", "porque": "cierra dando la razón de todo lo anterior"}, {"enun": "«La casa está bien de precio. Eso sí, no tiene ascensor.»", "sol": "objeción", "porque": "en forma de pega: <i>eso sí<\/i> añade un inconveniente a lo que se acaba de conceder"}], "criterio": "La consecuencia y el refuerzo se confunden porque los dos relacionan una causa con su efecto, y los separa el orden. Con <i>de ahí que<\/i>, la causa va delante y el efecto detrás: ha llovido tres meses, y por eso el embalse está lleno. Con <i>no en vano<\/i>, la razón va detrás: la biblioteca es la más antigua de la comarca porque lleva ochenta años abierta.", "apoyo": ["3 · La puntuación, que separa un marcador de una conjunción", "6 · Los marcadores que han preguntado por su significado"], "dossier_txt": "Del dossier: pieza 12, ejercicio 8"}, {"tipo": "abierta", "titulo": "Escribe las junturas que faltan", "dossier": {"cuaderno": "12", "ejercicio": 9}, "ayuda": "Los dos argumentos de este texto van pegados sin conector. Reescríbelo con un conector de ordenar delante del primero, uno de añadir delante del segundo, una concesión y un cierre de consecuencia.", "items": [{"enun": "«Las empresas deberían pagar el tiempo de desplazamiento. Quien vive lejos dedica diez horas semanales a un trayecto que no ha elegido. Pagarlo empujaría a instalar las naves donde hay transporte público. El sueldo real de quien vive lejos queda por debajo del de quien vive al lado.»", "modelo": "<i>«Las empresas deberían pagar el tiempo de desplazamiento. <b>En primer lugar<\/b>, quien vive lejos dedica diez horas semanales a un trayecto que no ha elegido. <b>Además<\/b>, pagarlo empujaría a instalar las naves donde hay transporte público. <b>Es cierto que<\/b> una medida así encarecería contratar a quien vive lejos, <b>pero<\/b> eso se corrige con un tope de kilómetros. <b>Por eso<\/b>, el sueldo real de quien vive lejos no debería quedar por debajo del de quien vive al lado.»<\/i>"}], "criterio": "Los dos primeros conectores son de oficios distintos, ordenar y añadir. Dos razones abiertas con <i>además<\/i> siguen siendo dos razones, pero el lector las recibe con la misma etiqueta. Detrás del <i>pero<\/i> de la concesión tiene que ir una idea que el texto no llevaba: en el modelo, el tope de kilómetros.", "apoyo": ["4 · Los cuatro momentos de una redacción"], "dossier_txt": "Del dossier: pieza 12, ejercicio 9"}, {"tipo": "abierta", "titulo": "Quita los conectores que sobran", "dossier": {"cuaderno": "12", "ejercicio": 10}, "ayuda": "Este texto lleva nueve marcadores para cuatro junturas. Quita los que sobran y deja cuatro, uno por juntura.", "items": [{"enun": "«En primer lugar, el centro debería abrir en agosto. Es decir, que hay gente que libra en agosto. Además, de hecho, mucho alumnado trabaja en hostelería. Por otra parte, además, la interrupción larga hace abandonar. Por lo tanto, en definitiva, en conclusión, abrir en agosto sería lo razonable.»", "modelo": "<i>«El centro debería abrir en agosto. <b>En primer lugar<\/b>, hay gente que libra en agosto. <b>Además<\/b>, mucho alumnado trabaja en hostelería. <b>Por otra parte<\/b>, la interrupción larga hace abandonar. <b>En definitiva<\/b>, abrir en agosto sería lo razonable.»<\/i>"}], "criterio": "Sobran cinco: el <i>es decir<\/i>, que no aclara nada; el <i>de hecho<\/i>; el <i>además<\/i> que se repite; y dos de los tres marcadores de cierre amontonados. <i>En primer lugar<\/i> cambia de sitio: abre el primer argumento, no la tesis.", "apoyo": ["1 · Los once oficios, con la lista larga", "2 · Los cinco grupos de marcadores del discurso"], "dossier_txt": "Del dossier: pieza 12, ejercicio 10"}, {"tipo": "abierta", "titulo": "Dos argumentos con el mismo conector", "dossier": {"cuaderno": "12", "ejercicio": 11}, "ayuda": "Los dos argumentos de este texto empiezan con el mismo conector. Sustituye uno por un conector de otro oficio y explica qué gana el texto con el cambio.", "items": [{"enun": "«Los centros de adultos deberían abrir en agosto. Además, buena parte del alumnado trabaja en hostelería y libra en agosto. Además, dos meses parado hacen que mucha gente no vuelva en septiembre.»", "modelo": "«Los centros de adultos deberían abrir en agosto. Además, buena parte del alumnado trabaja en hostelería y libra en agosto. <b>Por otra parte<\/b>, dos meses parado hacen que mucha gente no vuelva en septiembre.» También vale <b>A esto se añade que<\/b>. Las dos razones se presentan como dos, y la segunda deja de leerse como una ampliación de la primera. Distintas ya lo eran, con el cambio o sin él; el cambio mejora la variedad de conectores, que la rúbrica de estilo recoge como «uso apropiado de conectores»."}], "apoyo": ["1 · Los once oficios, con la lista larga", "2 · Los cinco grupos de marcadores del discurso"], "dossier_txt": "Del dossier: pieza 12, ejercicio 11"}, {"tipo": "abierta", "titulo": "Una concesión, tres veces", "dossier": {"cuaderno": "12", "ejercicio": 12}, "ayuda": "Escribe tres veces la concesión que falta en este texto, cada vez con una pareja distinta de conectores del momento «conceder y girar», y razona cuál de las tres resulta más formal.", "items": [{"enun": "«El centro debería abrir en agosto. [concesión: mantener abierto un edificio un mes más cuesta dinero y hay que pagar a alguien.] Por eso convendría abrir solo en horario de mañana.»", "modelo": "Tres concesiones modelo, debajo. La que empieza por <i>si bien<\/i> es la más formal, por el conector y por la construcción con <i>resultar<\/i>."}], "modelos": ["<i>Es cierto que mantener abierto un edificio un mes más cuesta dinero, <b>pero<\/b> ese gasto es pequeño al lado de lo que pierde el centro cada septiembre con el alumnado que no vuelve.<\/i>", "<i><b>Aunque<\/b> mantener abierto un edificio un mes más cueste dinero, cada alumno que no vuelve en septiembre es una plaza que el centro deja de cubrir.<\/i>", "<i><b>Si bien<\/b> mantener abierto un edificio un mes más supone un gasto, <b>este resulta<\/b> pequeño frente a las plazas que el abandono deja vacías cada curso.<\/i>"], "apoyo": ["4 · Los cuatro momentos de una redacción"], "dossier_txt": "Del dossier: pieza 12, ejercicio 12"}, {"tipo": "abierta", "titulo": "El operador que hace de juntura", "dossier": {"cuaderno": "12", "ejercicio": 13}, "ayuda": "Estas cuatro frases usan un operador argumentativo como si fuera una juntura. Explica por qué no funciona y sustitúyelo.", "items": [{"enun": "«En primer lugar, el horario es malo. De hecho, el sueldo tampoco compensa.»", "modelo": "<i>De hecho<\/i> → <i>Además<\/i> o <i>En segundo lugar<\/i>."}, {"enun": "«El plan es caro. En realidad, además no hay quien lo gestione.»", "modelo": "<i>En realidad<\/i> sobra entero, y queda <i>Además<\/i>."}, {"enun": "«El transporte es caro. En el fondo, los horarios tampoco encajan con los turnos.»", "modelo": "<i>En el fondo<\/i> presenta lo que sigue como la verdad escondida de lo anterior, y aquí lo que sigue es otra razón: → <i>Además, los horarios tampoco encajan con los turnos<\/i>."}, {"enun": "«Los datos son claros. Desde luego, hay otro motivo para hacerlo.»", "modelo": "<i>Desde luego<\/i> → <i>Además<\/i> o <i>A esto se añade que<\/i>."}], "criterio": "Los cuatro operadores refuerzan o concretan el miembro en el que están y no lo enlazan con ningún otro. En cada frase, la segunda oración trae una razón nueva, y esa relación la marca un conector de añadir: <i>además<\/i>, <i>a esto se añade que<\/i>, <i>en segundo lugar<\/i>.", "apoyo": ["2 · Los cinco grupos de marcadores del discurso", "4 · Los cuatro momentos de una redacción"], "dossier_txt": "Del dossier: pieza 12, ejercicio 13"}, {"tipo": "clasificar", "titulo": "¿El reformulador se queda o se tacha?", "dossier": {"cuaderno": "12", "ejercicio": 14}, "ayuda": "Seis oraciones con un reformulador. Indica si aporta algo, y se queda, o si repite con otras palabras lo que va delante, y se tacha. Dos se han añadido en la web: la del abono de transporte y la del recibo de la luz.", "ops": ["se queda", "se tacha"], "items": [{"enun": "«El plazo es de quince días hábiles, es decir, tres semanas contando los fines de semana, si no cae ningún festivo.»", "sol": "se queda", "porque": "traduce «hábiles» a un plazo que el lector puede contar en el calendario: tres semanas, si no cae ningún festivo"}, {"enun": "«El plazo es de quince días hábiles, es decir, quince jornadas hábiles.»", "sol": "se tacha", "porque": "repite la misma palabra con otra igual de técnica"}, {"enun": "«La medida encarece el transporte, mejor dicho, encarece el transporte de quien vive lejos.»", "sol": "se queda", "porque": "rectifica acotando a quién afecta la medida"}, {"enun": "«El abono de transporte es unipersonal, esto es, solo puede usarlo la persona cuyo nombre figura en la tarjeta.»", "sol": "se queda", "porque": "traduce <i>unipersonal<\/i> a lo que supone en la práctica"}, {"enun": "«La medida encarece el transporte, o sea, lo hace más caro.»", "sol": "se tacha", "porque": "<i>o sea<\/i> es oral, y <i>lo hace más caro<\/i> repite <i>encarece<\/i> sin aclararlo"}, {"enun": "«El recibo de la luz llega cada mes, mejor dicho, mensualmente.»", "sol": "se tacha", "porque": "<i>mejor dicho<\/i> anuncia una rectificación, y <i>mensualmente<\/i> repite <i>cada mes<\/i>"}], "criterio": "El reformulador se queda cuando lo que va detrás es más claro que lo de delante, y no solo más largo: «quince días hábiles, es decir, tres semanas» se puede comprobar en un calendario. Se tacha cuando lo de detrás repite lo de delante con otras palabras del mismo nivel.", "apoyo": ["1 · Los once oficios, con la lista larga", "Lo que se repite en las cuatro claves"], "dossier_txt": "Del dossier: pieza 12, ejercicio 14"}, {"tipo": "opcion", "titulo": "Los cuatro ítems reales de secuencia", "ayuda": "Literales, con su clave oficial. En cada hueco, comprueba primero qué va detrás —sustantivo, infinitivo o verbo conjugado— y después si la idea concede, opone o da la causa.", "items": [{"enun": "¿Qué secuencia de conectores se ajusta mejor al siguiente enunciado? «______ su dilatado historial, el magistrado fue relevado del cargo ______ incluso inhabilitado del mismo por incumplir órdenes judiciales.»", "conv": "2015t", "ops": ["A pesar de - y", "Sin - pero", "Más aun - e", "No obstante - e"], "sol": "No obstante - e", "porque": "delante de <i>incluso<\/i>, que empieza por <i>i<\/i>, la <i>y<\/i> se convierte en <i>e<\/i>, así que quedan descartadas las dos secuencias sin <i>e<\/i>. De las dos con <i>e<\/i>, <i>más aun<\/i> no concede nada, y <i>no obstante<\/i> concede y admite detrás el sustantivo <i>su dilatado historial<\/i>"}, {"enun": "Elija la secuencia de conectores que mejor se ajusta al siguiente enunciado: «La medida adoptada fue, ______, muy prudente, ______ la falta de libertad; ______, no se arriesgaron a una aplicación inmediata ______ decidieron posponerla.»", "conv": "2016s", "ops": ["por supuesto / aunque / si bien / y", "evidentemente / no obstante / por eso / entonces", "sin duda / a pesar de / sin embargo / sino que", "ciertamente / sino que / no obstante / aunque"], "sol": "sin duda / a pesar de / sin embargo / sino que", "porque": "el segundo hueco va delante de un sustantivo, <i>la falta de libertad<\/i>, que de las cuatro opciones solo admite <i>a pesar de<\/i>; el último es <i>no… sino que<\/i>"}, {"enun": "¿Cuál de estas secuencias de conectores encaja mejor en el siguiente enunciado? «______ no ser esposos, tratan de ser aceptados por la sociedad ______ no lo consiguen.»", "conv": "2018s", "ops": ["A pesar de / aún", "Pero / aunque", "Sin embargo / y", "Pese a / pero"], "sol": "Pese a / pero", "porque": "<i>pese a<\/i> admite el infinitivo <i>no ser<\/i> detrás; <i>pero<\/i> opone lo que sigue. La a) empieza bien y <i>aún<\/i> no enlaza nada"}, {"enun": "Elija la secuencia de conectores que mejor se ajusta al siguiente enunciado: «Fuimos superiores en todo momento, ______ en el segundo tiempo dimos un paso atrás para defendernos; ______, estuvimos siempre tranquilos ______ ellos no nos generaban ocasiones.»", "conv": "2021s", "ops": ["no obstante - por eso - porque", "aunque - no obstante - porque", "sino que - no obstante - aunque", "aunque - por supuesto - si bien"], "sol": "aunque - no obstante - porque", "porque": "<i>aunque<\/i> concede delante de un verbo, <i>dimos<\/i>; <i>no obstante<\/i> opone; y el tercero da la causa"}], "criterio": "Tres de los cuatro se deciden por lo que va detrás del conector, y el de 201 ___ conviene mirar el precio; ______, la garantía; y ______, el plazo de entrega.»", "ops": ["Primero - o sea - así pues", "En primer lugar - además - por último", "Por un lado - sin embargo - en definitiva", "Para empezar - es decir - por eso"], "sol": "En primer lugar - además - por último", "porque": "las tres son de ordenar y añadir; las otras introducen una oposición, una aclaración o un registro oral"}], "criterio": "Las cuatro secuencias se deciden por lo que va detrás del conector y por la <i>e<\/i> delante de <i>i-<\/i>; los dos marcadores, por lo que introducen: una consecuencia y un refuerzo.", "apoyo": ["5 · El ítem del bloque 3, resuelto", "6 · Los marcadores que han preguntado por su significado"], "solo_web": true}, {"tipo": "opcion", "titulo": "El marcador de 2016s", "ayuda": "Literal, con la errata de la clave explicada en la teoría: la respuesta es la misma para el marcador impreso y para el que contesta la clave.", "items": [{"enun": "¿Qué significado introduce el marcador discursivo <i>de ahí que<\/i> en la oración «De ahí que, en un primer momento, se relacione con productividad, eficiencia y excelencia»?", "conv": "2016s", "ops": ["Introduce un argumento de contraposición.", "Introduce un argumento de causa.", "No introduce ningún significado.", "Introduce un argumento de consecuencia."], "sol": "Introduce un argumento de consecuencia.", "porque": "lo que viene detrás se deduce de lo anterior: como la Academia lo define así, se relaciona con la productividad. La clave contesta sobre <i>no en vano<\/i>, refuerzo, y también es la d)"}], "criterio": "Se contesta a la pregunta impresa, y <i>de ahí que<\/i> introduce una consecuencia. La opción de causa es la trampa: la causa está antes del marcador, no después.", "apoyo": ["6 · Los marcadores que han preguntado por su significado"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿De qué fila es?", "ops": ["ordenar", "añadir", "oponer", "conceder", "consecuencia", "cerrar"], "ayuda": "Doce con
