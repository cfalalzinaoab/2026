<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 1 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 1, "fecha": "2026-09-24", "tab": "Día 1 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 24 de septiembre", "sub": "La sílaba tónica · la tabla de las nueve clases", "carriles": [{"chapa": "Carril A", "titulo": "La sílaba tónica", "meta": "15 minutos · dónde cae la fuerza, antes de hablar de tildes", "teoria": "<div class=\"enelexamen\"><strong>En el examen.<\/strong> En Llengua castellana, el ejercicio <strong>«Ponga tilde en las palabras que lo requieran»<\/strong>: medio punto, y ha caído en <strong>10 de los 24 exámenes<\/strong>, seis de los ocho últimos. Son siete u ocho palabras sueltas, sin frase alrededor.<\/div>\n<p>En Comentari de text no hay ningún ejercicio de tildes, y aun así la acentuación descuenta ahí más que en castellano: <strong>cada tilde que falta en lo que escribes descuenta 0,1 sin tope<\/strong>, sobre los 7 puntos del bloque 2 y la parte 2. En castellano, la clave de 2026 (tribunal ordinario) detiene ese descuento en 2 puntos; las de 2015 a 2025 no fijan ningún tope, y la parte no baja de 0.<\/p>\n<blockquote>\n<p><strong>El enunciado es siempre el mismo y no pregunta por qué.<\/strong> Delante de cada palabra hay una sola decisión, la misma ocho veces: si lleva tilde o no la lleva. Aquí cada tilde se justifica con la regla, porque así se aprende a decidir; en el examen basta con escribirla.<\/p>\n<\/blockquote>\n<p><strong>Cómo son los diez ejercicios que han caído.<\/strong> De las 79 palabras que han caído en esos diez ejercicios, <strong>49 llevan tilde y 30 no la llevan<\/strong>. Casi cuatro de cada diez palabras del ejercicio están puestas para recibir una tilde que no les corresponde.<\/p>\n<table>\n<thead>\n<tr>\n<th>de las 49 que sí llevan<\/th>\n<th style=\"text-align: right;\"><\/th>\n<th>de las 30 que no llevan<\/th>\n<th style=\"text-align: right;\"><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>hiato (pieza 2)<\/td>\n<td style=\"text-align: right;\">17<\/td>\n<td>llana normal, acabada en vocal, -n o -s<\/td>\n<td style=\"text-align: right;\">20<\/td>\n<\/tr>\n<tr>\n<td>aguda<\/td>\n<td style=\"text-align: right;\">15<\/td>\n<td>aguda normal, acabada en consonante<\/td>\n<td style=\"text-align: right;\">6<\/td>\n<\/tr>\n<tr>\n<td>llana<\/td>\n<td style=\"text-align: right;\">6<\/td>\n<td>monosílabo<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<\/tr>\n<tr>\n<td>esdrújula<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>adverbio en <em>-mente<\/em><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Esta pieza cubre 62 de esas 79 palabras: las 32 que llevan tilde por las tres reglas y las 30 que no la llevan. Los 17 hiatos son la pieza 2.<\/p>\n<p><strong>Dos datos más del examen, que indican dónde buscar primero:<\/strong><\/p>\n<ul>\n<li><strong>Diez de las 79 palabras son formas de <em>vosotros<\/em>,<\/strong> repartidas por ocho de los diez sets: ninguna otra familia aparece tanto. Ocho llevan tilde por agudas, una por hiato y una no la lleva; el apartado 4 separa los tres casos.<\/li>\n<li><strong>El par que más se repite es <em>carácter<\/em> frente a <em>caracteres<\/em>.<\/strong> <em>Carácter<\/em> es llana acabada en -r y lleva tilde; <em>caracteres<\/em> es llana acabada en -s y no la lleva, porque al pasar al plural la fuerza se mueve una sílaba. <em>Caracteres<\/em> ha caído tres veces como señuelo. En <em>régimen<\/em> y <em>regímenes<\/em> la fuerza también se desplaza al formar el plural —<strong>ré<\/strong>-gi-men, re-<strong>gí<\/strong>-me-nes—, pero las dos son esdrújulas y las dos llevan tilde.<\/li>\n<\/ul>\n<h3>1 · La sílaba tónica<\/h3>\n<p>Una sílaba se pronuncia de un solo golpe de voz: <em>tra-ba-jo<\/em> tiene tres, <em>ciu-dad<\/em> dos y <em>sol<\/em> uno. En «ciu» hay dos vocales y una sola sílaba, así que <em>ciu-dad<\/em> tiene dos sílabas y no tres.<\/p>\n<p>Casi toda palabra de dos sílabas o más tiene una que suena más fuerte, la <strong>sílaba tónica<\/strong>; las demás son <strong>átonas<\/strong>. Para localizarla, pronuncia la palabra en voz alta y con más fuerza de la normal: la sílaba que recibe esa fuerza es la tónica.<\/p>\n<p>Dos grupos se apartan de eso. Las preposiciones, los artículos, las conjunciones y el relativo <em>donde<\/em> son <strong>átonos enteros<\/strong> —<em>para<\/em>, <em>desde<\/em>, <em>la<\/em>, <em>que<\/em>, «la casa donde vivo»—: se apoyan en la palabra de al lado, y ninguna de sus sílabas recibe fuerza propia. Y los adverbios en <em>-mente<\/em> llevan <strong>dos<\/strong> —<em>fá-cil-men-te<\/em>—, y por eso conservan la tilde del adjetivo del que salen.<\/p>\n<p><strong>Cuando la fuerza cambia de sílaba, cambia la palabra.<\/strong> Estas cuatro ternas se escriben con las mismas letras y son doce palabras distintas, tres por cada línea:<\/p>\n<table>\n<thead>\n<tr>\n<th>las mismas letras<\/th>\n<th>la fuerza tres sílabas atrás<\/th>\n<th>la fuerza en la penúltima<\/th>\n<th>la fuerza en la última<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>público · publico · publicó<\/td>\n<td><strong>pú<\/strong>-bli-co · <em>el público, un acto público<\/em><\/td>\n<td>pu-<strong>bli<\/strong>-co · <em>yo publico hoy<\/em><\/td>\n<td>pu-bli-<strong>có<\/strong> · <em>él publicó ayer<\/em><\/td>\n<\/tr>\n<tr>\n<td>término · termino · terminó<\/td>\n<td><strong>tér<\/strong>-mi-no · <em>el término del contrato<\/em><\/td>\n<td>ter-<strong>mi<\/strong>-no · <em>yo termino a las seis<\/em><\/td>\n<td>ter-mi-<strong>nó<\/strong> · <em>ella terminó el turno<\/em><\/td>\n<\/tr>\n<tr>\n<td>cálculo · calculo · calculó<\/td>\n<td><strong>cál<\/strong>-cu-lo · <em>el cálculo de la factura<\/em><\/td>\n<td>cal-<strong>cu<\/strong>-lo · <em>yo calculo el gasto<\/em><\/td>\n<td>cal-cu-<strong>ló<\/strong> · <em>el banco calculó mal<\/em><\/td>\n<\/tr>\n<tr>\n<td>ánimo · animo · animó<\/td>\n<td><strong>á<\/strong>-ni-mo · <em>el ánimo de la plantilla<\/em><\/td>\n<td>a-<strong>ni<\/strong>-mo · <em>yo la animo a firmar<\/em><\/td>\n<td>a-ni-<strong>mó<\/strong> · <em>nadie lo animó<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cada línea tiene un sustantivo, un verbo en presente y un verbo en pasado, y por escrito solo los separa la posición de la tilde. En una frase, el sentido indica cuál de los tres corresponde; en el ejercicio del examen las palabras van sueltas y hay que decidir por la fuerza que se oye.<\/p>\n<h3>2 · Aguda, llana y esdrújula<\/h3>\n<p><strong>Las cuatro clases indican dónde cae la sílaba tónica; no indican si lleva tilde.<\/strong> <em>Reloj<\/em> es aguda y no lleva tilde; <em>canción<\/em> es aguda y sí la lleva. La clase se establece oyendo dónde cae la fuerza, y ha de resolverse antes que la tilde, porque la regla se aplica sobre la clase ya fijada.<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>la tónica es la…<\/th>\n<th>con tilde<\/th>\n<th>sin tilde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>aguda<\/strong><\/td>\n<td>última<\/td>\n<td>can-<strong>ción<\/strong>, ja-<strong>más<\/strong>, o-ja-<strong>lá<\/strong><\/td>\n<td>ciu-<strong>dad<\/strong>, pa-<strong>pel<\/strong>, re-<strong>loj<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>llana<\/strong><\/td>\n<td>penúltima<\/td>\n<td><strong>fá<\/strong>-cil, <strong>ár<\/strong>-bol, <strong>tú<\/strong>-nel<\/td>\n<td>i-<strong>ma<\/strong>-gen, <strong>cri<\/strong>-sis, <strong>li<\/strong>-bro<\/td>\n<\/tr>\n<tr>\n<td><strong>esdrújula<\/strong><\/td>\n<td>antepenúltima<\/td>\n<td><strong>úl<\/strong>-ti-mo, ra-pi-<strong>dí<\/strong>-si-mo<\/td>\n<td><em>(no hay: todas llevan)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>sobresdrújula<\/strong><\/td>\n<td>antes de esa<\/td>\n<td><strong>dí<\/strong>-ga-me-lo, <strong>cuén<\/strong>-ta-me-la<\/td>\n<td><em>(no hay)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los <strong>monosílabos<\/strong> no entran en esta clasificación: con una sola sílaba no hay dónde poner la fuerza, así que ni son agudos ni son llanos, y por norma no llevan tilde. Los cuatro que han caído como señuelo en el ejercicio son monosílabos. Los que sí la llevan —<em>él<\/em>, <em>sí<\/em>, <em>más<\/em>— siguen otra regla, la de la tilde diacrítica.<\/p>\n<h3>3 · Las tres reglas<\/h3>\n<p>Casi todas las palabras acabadas en <strong>vocal, -n o -s<\/strong> son llanas —<em>casa<\/em>, <em>imagen<\/em>, <em>crisis<\/em>—, y casi todas las acabadas en <strong>otra consonante<\/strong> son agudas —<em>reloj<\/em>, <em>papel<\/em>, <em>alquiler<\/em>—; esas no llevan tilde. La llevan las que se apartan de ese reparto: las agudas acabadas en vocal, -n o -s (<em>ojalá<\/em>, <em>canción<\/em>, <em>jamás<\/em>), las llanas acabadas en otra consonante (<em>fácil<\/em>, <em>árbol<\/em>) y todas las esdrújulas.<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>lleva tilde cuando…<\/th>\n<th>ejemplos del formato del ejercicio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>aguda<\/strong><\/td>\n<td>acaba en <strong>vocal, -n o -s<\/strong><\/td>\n<td><em>canción<\/em>, <em>jamás<\/em>, <em>sillón<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>llana<\/strong><\/td>\n<td>acaba en <strong>cualquier consonante que no sea -n ni -s<\/strong><\/td>\n<td><em>difícil<\/em>, <em>árbol<\/em>, <em>cárcel<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>esdrújula<\/strong> y <strong>sobresdrújula<\/strong><\/td>\n<td><strong>siempre<\/strong><\/td>\n<td><em>último<\/em>, <em>rapidísimo<\/em>, <em>dígamelo<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Las siete excepciones<\/h4>\n<table>\n<thead>\n<tr>\n<th>caso<\/th>\n<th>qué pasa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>aguda acabada en <strong>consonante + s<\/strong><\/td>\n<td>no lleva<\/td>\n<td><em>complots<\/em>, <em>robots<\/em><\/td>\n<\/tr>\n<tr>\n<td>aguda acabada en <strong>-y<\/strong><\/td>\n<td>no lleva: la <em>-y<\/em> final suena a vocal pero cuenta como consonante<\/td>\n<td><em>virrey<\/em>, <em>convoy<\/em>, <em>estoy<\/em><\/td>\n<\/tr>\n<tr>\n<td>llana acabada en <strong>consonante + s<\/strong> o en <strong>-y<\/strong><\/td>\n<td>sí lleva<\/td>\n<td><em>bíceps<\/em>, <em>cómics<\/em>, <em>yóquey<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mayúsculas<\/strong><\/td>\n<td>llevan tilde igual<\/td>\n<td>ÁFRICA, ÚLTIMO<\/td>\n<\/tr>\n<tr>\n<td>adverbios en <strong>-mente<\/strong><\/td>\n<td>conservan la tilde del adjetivo del que salen, porque mantienen su propio acento además del de <em>-mente<\/em> (<em>fá-cil-men-te<\/em>)<\/td>\n<td><em>fácil<\/em> → <em>fácilmente<\/em>; <em>tierna<\/em> → <em>tiernamente<\/em>, sin tilde, porque <em>tierna<\/em> no la tiene<\/td>\n<\/tr>\n<tr>\n<td><strong>compuestos sin guion<\/strong><\/td>\n<td>se acentúan como una palabra sola: manda la última parte y la primera pierde la tilde que tuviera suelta<\/td>\n<td><em>décimo<\/em> + <em>séptimo<\/em> → <em>decimoséptimo<\/em>; <em>kilómetros<\/em> → <em>cuentakilómetros<\/em>; <em>así<\/em> + <em>mismo<\/em> → <em>asimismo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>compuestos con guion<\/strong><\/td>\n<td>cada parte conserva la tilde que le toque por su cuenta, porque el guion las mantiene como dos palabras<\/td>\n<td><em>físico-químico<\/em>, <em>teórico-práctico<\/em>, <em>histórico-crítico<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y los pronombres pegados detrás del verbo,<\/strong> que alargan la palabra y suelen añadir tilde. <em>Escuchemos<\/em> es llana acabada en -s y no la lleva; con el pronombre <em>los<\/em> detrás, <em>escuchémoslos<\/em> pasa a esdrújula —es-cu-<span class=\"vs\">ché<\/span>-mos-los— y la lleva siempre. El <em>-mos<\/em> es la terminación de la primera persona del plural y no cuenta como pronombre. Cada pronombre añade una sílaba detrás de la tónica: con uno, <em>infringiendo<\/em> → <em>infringiéndolas<\/em>; con dos, <em>da<\/em> → <em>dámelo<\/em> y <em>di<\/em> → <em>díselo<\/em>. La regla se aplica a la palabra entera, ya con los pronombres puestos.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Dónde cae la fuerza?", "dossier": {"cuaderno": "1", "ejercicio": 1, "parte": "la sílaba tónica"}, "ayuda": "Las mismas doce palabras del ejercicio siguiente, escritas sin tilde. Pronuncia cada una en voz alta y decide en qué sílaba cae la fuerza.", "ops": ["aguda", "llana", "esdrújula"], "items": [{"enun": "<i>ciudad<\/i>", "sol": "aguda", "porque": "ciu-<b>dad<\/b>: la fuerza en la última sílaba; «ciu» es una sola sílaba, aunque tenga dos vocales"}, {"enun": "<i>imagen<\/i>", "sol": "llana", "porque": "i-<b>ma<\/b>-gen: la fuerza en la penúltima"}, {"enun": "<i>aprendizaje<\/i>", "sol": "llana", "porque": "a-pren-di-<b>za<\/b>-je: la fuerza en la penúltima"}, {"enun": "<i>huesped<\/i>", "sol": "llana", "porque": "<b>hués<\/b>-ped: la fuerza en la penúltima"}, {"enun": "<i>espectaculo<\/i>", "sol": "esdrújula", "porque": "es-pec-<b>tá<\/b>-cu-lo: la fuerza en la antepenúltima"}, {"enun": "<i>guapisimos<\/i>", "sol": "esdrújula", "porque": "gua-<b>pí<\/b>-si-mos: la fuerza en la antepenúltima"}, {"enun": "<i>volumen<\/i>", "sol": "llana", "porque": "vo-<b>lu<\/b>-men: la fuerza en la penúltima"}, {"enun": "<i>jamas<\/i>", "sol": "aguda", "porque": "ja-<b>más<\/b>: la fuerza en la última sílaba"}, {"enun": "<i>alquiler<\/i>", "sol": "aguda", "porque": "al-qui-<b>ler<\/b>: la fuerza en la última sílaba"}, {"enun": "<i>facturas<\/i>", "sol": "llana", "porque": "fac-<b>tu<\/b>-ras: la fuerza en la penúltima"}, {"enun": "<i>telefono<\/i>", "sol": "esdrújula", "porque": "te-<b>lé<\/b>-fo-no: la fuerza en la antepenúltima"}, {"enun": "<i>autobus<\/i>", "sol": "aguda", "porque": "au-to-<b>bús<\/b>: la fuerza en la última sílaba; «au» es una sola sílaba, aunque tenga dos vocales"}], "criterio": "La clase se decide por el oído, antes de comprobar si la palabra lleva tilde, ya que la tilde depende de la clase. <i>Huésped<\/i> y <i>volumen<\/i> son llanas las dos: <i>huésped<\/i> lleva tilde por acabar en -d, y <i>volumen<\/i> no la lleva por acabar en -n.", "apoyo": ["1 · La sílaba tónica"], "dossier_txt": "Del dossier: pieza 1, ejercicio 1 · la sílaba tónica"}, {"tipo": "hueco", "titulo": "Separa en sílabas y pon la tilde", "dossier": {"cuaderno": "1", "ejercicio": 1, "parte": "sílabas y tilde"}, "ayuda": "Escribe cada palabra separada en sílabas con guiones y con la tilde si la lleva, como en <i>ca-mi-se-ta<\/i> o <i>sá-ba-do<\/i>. Las tres reglas que la deciden están en el apartado 3.", "estricto": true, "items": [{"enun": "<i>ciudad<\/i>", "sol": "ciu-dad", "porque": "ciu-<b>dad<\/b>, aguda acabada en -d: no lleva; «ciu» es una sola sílaba, aunque tenga dos vocales"}, {"enun": "<i>imagen<\/i>", "sol": "i-ma-gen", "porque": "i-<b>ma<\/b>-gen, llana acabada en -n: no lleva"}, {"enun": "<i>aprendizaje<\/i>", "sol": "a-pren-di-za-je", "porque": "a-pren-di-<b>za<\/b>-je, llana acabada en vocal: no lleva"}, {"enun": "<i>huesped<\/i>", "sol": "hués-ped", "porque": "<b>hués<\/b>-ped, llana acabada en -d: lleva"}, {"enun": "<i>espectaculo<\/i>", "sol": "es-pec-tá-cu-lo", "porque": "es-pec-<b>tá<\/b>-cu-lo, esdrújula: lleva"}, {"enun": "<i>guapisimos<\/i>", "sol": "gua-pí-si-mos", "porque": "gua-<b>pí<\/b>-si-mos, esdrújula: lleva"}, {"enun": "<i>volumen<\/i>", "sol": "vo-lu-men", "porque": "vo-<b>lu<\/b>-men, llana acabada en -n: no lleva"}, {"enun": "<i>jamas<\/i>", "sol": "ja-más", "porque": "ja-<b>más<\/b>, aguda acabada en -s: lleva"}, {"enun": "<i>alquiler<\/i>", "sol": "al-qui-ler", "porque": "al-qui-<b>ler<\/b>, aguda acabada en -r: no lleva"}, {"enun": "<i>facturas<\/i>", "sol": "fac-tu-ras", "porque": "fac-<b>tu<\/b>-ras, llana acabada en -s: no lleva"}, {"enun": "<i>telefono<\/i>", "sol": "te-lé-fo-no", "porque": "te-<b>lé<\/b>-fo-no, esdrújula: lleva"}, {"enun": "<i>autobus<\/i>", "sol": "au-to-bús", "porque": "au-to-<b>bús<\/b>, aguda acabada en -s: lleva; «au» es una sola sílaba, aunque tenga dos vocales"}], "criterio" ta como consonante, de modo que <i>bíceps<\/i> la lleva y <i>complots<\/i> no.", "pide": "es … acabada en …: lleva / no lleva tilde", "apoyo": ["2 · Aguda, llana y esdrújula", "Las siete excepciones"], "dossier_txt": "Del dossier: pieza 1, ejercicio 3 · la regla"}, {"tipo": "abierta", "titulo": "Tres tuyas de cada clase", "ayuda": "Palabras que uses tú, no las de la tabla. Dilas en voz alta antes de escribirlas y separa la sílaba fuerte con guiones.", "items": [{"enun": "Tres palabras agudas:", "modelo": "Cualquier palabra con la fuerza en la última sílaba, del tipo <i>ciu-<b>dad<\/b><\/i>, <i>com-pra-<b>dor<\/b><\/i>, <i>a-<b>yer<\/b><\/i>. Se da por buena si la sílaba marcada es la última y la palabra existe."}, {"enun": "Tres llanas:", "modelo": "La fuerza en la penúltima: <i>ca-<b>mi<\/b>-sa<\/i>, <i>bo-<b>te<\/b>-lla<\/i>, <i>en-<b>chu<\/b>-fe<\/i>. Es la clase más numerosa del castellano, así que vale casi cualquier palabra de uso diario."}, {"enun": "Tres esdrújulas:", "modelo": "La fuerza tres sílabas atrás: <i><b>sá<\/b>-ba-do<\/i>, <i><b>mé<\/b>-di-co<\/i>, <i><b>brú<\/b>-ju-la<\/i>. Todas llevan tilde: si la palabra que has escrito no lleva tilde, no es esdrújula."}], "criterio": "Las esdrújulas se fallan más que las agudas y las llanas porque son pocas y casi todas cultas: <i>médico<\/i>, <i>brújula<\/i>, <i>rápido<\/i>, <i>sábado<\/i>. Quien no encuentre tres las localiza entre las palabras con tilde de la primera página de cualquier periódico, porque toda esdrújula lleva tilde.", "apoyo": ["1 · La sílaba tónica"], "solo_web": true}, {"tipo": "hueco", "titulo": "Las excepciones", "estricto": true, "ayuda": "Ocho palabras en las que la regla general no basta. Copia cada una como se escribe, con tilde o sin ella; en las mayúsculas, con mayúsculas.", "items": [{"enun": "<i>AFRICA<\/i>", "sol": "ÁFRICA", "porque": "las mayúsculas llevan tilde igual: <b>Á<\/b>-FRI-CA es esdrújula"}, {"enun": "<i>unicamente<\/i>", "sol": "únicamente", "porque": "conserva la tilde de <i>única<\/i>"}, {"enun": "<i>tranquilamente<\/i>", "sol": "tranquilamente", "porque": "<i>tranquila<\/i> no lleva tilde, y el adverbio tampoco"}, {"enun": "<i>jersey<\/i>", "sol": "jersey", "porque": "aguda acabada en -y: la -y final no cuenta como vocal"}, {"enun": "<i>records<\/i>", "sol": "récords", "porque": "<b>ré<\/b>-cords: llana acabada en consonante + s"}, {"enun": "<i>cortacesped<\/i>", "sol": "cortacésped", "porque": "compuesto sin guion: manda la segunda parte, <i>césped<\/i>"}, {"enun": "<i>decimoquinto<\/i>", "sol": "decimoquinto", "porque": "compuesto sin guion: <i>décimo<\/i> pierde su tilde y la palabra entera es llana acabada en vocal"}, {"enun": "<i>fisico-quimico<\/i>", "sol": "físico-químico", "porque": "con guion, cada parte conserva la suya"}], "criterio": "En las ocho la regla general no basta: hay que saber que la mayúscula no exime de la tilde, que el adverbio en <i>-mente<\/i> la hereda del adjetivo y solo si el adjetivo la tenía, que la <i>-y<\/i> final no cuenta como vocal y que en el compuesto sin guion manda la última parte. De las 79 palabras del censo, una sola es un adverbio en <i>-mente<\/i> y ninguna es una mayúscula ni un compuesto; las excepciones se aprenden porque aparecen en lo que se escribe: un adverbio en <i>-mente<\/i> sin su tilde o un nombre propio en mayúsculas sin la suya son faltas en la redacción, en los dos exámenes.", "apoyo": ["2 · Aguda, llana y esdrújula"], "solo_web": true}, {"tipo": "hueco", "titulo": "Verbo con pronombres pegados", "estricto": true, "ayuda": "Ocho formas escritas sin tilde. Dilas en voz alta, cuenta desde la sílaba fuerte hasta el final y aplica las tres reglas. Copia cada una con tilde si le corresponde, y tal cual si no.", "items": [{"enun": "<i>dame<\/i>", "sol": "dame", "porque": "<b>da<\/b>-me: llana acabada en vocal"}, {"enun": "<i>damelo<\/i>", "sol": "dámelo", "porque": "<b>dá<\/b>-me-lo: esdrújula"}, {"enun": "<i>cuentamelo<\/i>", "sol": "cuéntamelo", "porque": "<b>cuén<\/b>-ta-me-lo: sobresdrújula"}, {"enun": "<i>escribelo<\/i>", "sol": "escríbelo", "porque": "es-<b>crí<\/b>-be-lo: esdrújula"}, {"enun": "<i>decidme<\/i>", "sol": "decidme", "porque": "de-<b>cid<\/b>-me: llana acabada en vocal"}, {"enun": "<i>marchaos<\/i>", "sol": "marchaos", "porque": "mar-<b>cha<\/b>-os: llana acabada en -s"}, {"enun": "<i>entregandoselo<\/i>", "sol": "entregándoselo", "porque": "en-tre-<b>gán<\/b>-do-se-lo: sobresdrújula"}, {"enun": "<i>pidiendoselo<\/i>", "sol": "pidiéndoselo", "porque": "pi-<b>dién<\/b>-do-se-lo: sobresdrújula"}], "criterio": "Cinco llevan tilde y tres no, y en las ocho la fuerza está donde estaba en el verbo solo. Cambia el número de sílabas que quedan detrás: con una detrás la palabra es llana y no lleva tilde; con dos, esdrújula; con tres, sobresdrújula, y en esos dos casos la lleva siempre.", "apoyo": ["2 · Aguda, llana y esdrújula"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Llana, esdrújula o sobresdrújula?", "ops": ["llana", "esdrújula", "sobresdrújula"], "ayuda": "Seis formas escritas sin tilde, como en el examen. Señala dónde cae la fuerza y cuenta cuántas sílabas quedan detrás.", "items": [{"enun": "<i>dame<\/i>", "sol": "llana", "porque": "<b>da<\/b>-me: una sílaba detrás de la fuerte"}, {"enun": "<i>cuentamelo<\/i>", "sol": "sobresdrújula", "porque": "<b>cuén<\/b>-ta-me-lo: tres detrás"}, {"enun": "<i>escuchame<\/i>", "sol": "esdrújula", "porque": "es-<b>cú<\/b>-cha-me: dos detrás"}, {"enun": "<i>traigamelo<\/i>", "sol": "sobresdrújula", "porque": "<b>trái<\/b>-ga-me-lo: tres detrás"}, {"enun": "<i>sentaos<\/i>", "sol": "llana", "porque": "sen-<b>ta<\/b>-os: una detrás, y el hiato <i>a-o<\/i> no cambia nada porque ninguna de las dos es cerrada"}, {"enun": "<i>dimelo<\/i>", "sol": "esdrújula", "porque": "<b>dí<\/b>-me-lo: dos detrás"}], "criterio": "Las dos llanas no llevan tilde y las otras cuatro sí, porque las esdrújulas y las sobresdrújulas la llevan siempre. Contar las sílabas que quedan detrás de la fuerte resuelve las seis sin memorizar ninguna forma.", "apoyo": ["2 · Aguda, llana y esdrújula"], "solo_web": true}, {"tipo": "hueco", "titulo": "Compuestos y adverbios en -mente", "estricto": true, "ayuda": "Siete palabras escritas sin tilde. Copia cada una con tilde si le corresponde, y tal cual si no: en los compuestos manda la segunda parte, y en los adverbios en <i>-mente<\/i>, el adjetivo del que salen.", "items": [{"enun": "<i>sacacorchos<\/i>", "sol": "sacacorchos", "porque": "sa-ca-<b>cor<\/b>-chos: llana acabada en -s"}, {"enun": "<i>cortauñas<\/i>", "sol": "cortaúñas", "porque": "cor-ta-<b>ú<\/b>-ñas: la <i>ú<\/i> tónica junto a la <i>a<\/i> forma hiato y lleva tilde"}, {"enun": "<i>balonmano<\/i>", "sol": "balonmano", "porque": "ba-lon-<b>ma<\/b>-no: llana acabada en vocal; <i>balón<\/i> pierde su tilde al ir delante"}, {"enun": "<i>dificilmente<\/i>", "sol": "difícilmente", "porque": "conserva la tilde de <i>difícil<\/i>"}, {"enun": "<i>solamente<\/i>", "sol": "solamente", "porque": "<i>sola<\/i> no lleva tilde, y el adverbio tampoco"}, {"enun": "<i>comunmente<\/i>", "sol": "comúnmente", "porque": "conserva la tilde de <i>común<\/i>"}, {"enun": "<i>decimosegundo<\/i>", "sol": "decimosegundo", "porque": "<i>décimo<\/i> pierde su tilde y la palabra entera es llana acabada en vocal"}], "criterio": "Tres llevan tilde y cuatro no. En <i>balonmano<\/i> y <i>decimosegundo<\/i> se falla más que en las otras cinco, porque la primera parte llevaba tilde sola —<i>balón<\/i>, <i>décimo<\/i>— y la pierde al ir delante: la palabra compuesta se acentúa entera, como si fuera nueva.", "apoyo": ["1 · La sílaba tónica", "2 · Aguda, llana y esdrújula"], "solo_web": true}], "cuaderno": {"pieza": 1, "apartados": [1, 2, 3], "ejercicios": [1, 2, 3]}, "cuaderno_txt": "Pieza 1 · La sílaba y el acento — apartados 1, 2 y 3: La sílaba tónica; Aguda, llana y esdrújula; Las tres reglas (p. 5 y 6) · ejercicios 1, 2 y 3", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Las nueve clases de palabras", "meta": "45 minutos · la tabla, las tres preguntas y las fronteras", "teoria": "<div class=\"enelexamen\"><strong>En el examen.<\/strong> En el bloque 3 de Llengua castellana hay un ítem que pregunta directamente por una clase de palabra: <strong>«¿Qué clase de palabra es X en esta oración?»<\/strong>, con cuatro opciones. Ha caído en <strong>12 de los 24 exámenes<\/strong> y vale 0,5 puntos. El enunciado alterna dos formulaciones —«¿qué clase de palabra es…?» y «¿a qué categoría gramatical pertenece…?»— y preguntan lo mismo.<\/div>\n<p>Otros tres ejercicios no se contestan sin ella:<\/p>\n<table>\n<thead>\n<tr>\n<th>ejercicio<\/th>\n<th>vale<\/th>\n<th>cae<\/th>\n<th>qué necesita de aquí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Categoría de una palabra en su oración<\/strong><\/td>\n<td>0,5<\/td>\n<td>12/24<\/td>\n<td>todo<\/td>\n<\/tr>\n<tr>\n<td><strong>La tilde diacrítica<\/strong> (pieza 3)<\/td>\n<td>0,5, dentro del ítem de categoría gramatical<\/td>\n<td>2/24<\/td>\n<td>los dos ítems preguntan por <em>aun<\/em>, que no cambia de clase con la tilde; en <em>mi<\/em> / <em>mí<\/em>, <em>el<\/em> / <em>él<\/em> y <em>tu<\/em> / <em>tú<\/em> sí la cambia<\/td>\n<\/tr>\n<tr>\n<td><strong>Antecedente y función de un pronombre<\/strong> (pieza 8)<\/td>\n<td>0,25 + 0,25<\/td>\n<td>7/24<\/td>\n<td>distinguir el pronombre del determinante<\/td>\n<\/tr>\n<tr>\n<td><strong>La función sintáctica de un sintagma<\/strong> (sintaxis, segundo trimestre)<\/td>\n<td>0,5<\/td>\n<td><strong>24/24<\/strong><\/td>\n<td>da por sabidas las nueve clases<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1 · Las nueve clases<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">#<\/th>\n<th>clase<\/th>\n<th>¿cambia de forma?<\/th>\n<th>qué hace<\/th>\n<th>prueba<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1<\/td>\n<td><strong>Sustantivo<\/strong><\/td>\n<td>sí: número, y el género solo en algunos<\/td>\n<td>nombra seres, objetos e ideas<\/td>\n<td>admite artículo delante —<strong>el<\/strong> miedo, <strong>la<\/strong> factura—, y si lo admite una palabra de otra clase es que está sustantivada: <em>el andar<\/em>, <em>el porqué<\/em><\/td>\n<td>alquiler, turno, erosión, esperanza, vecindario, paciencia, autobús, hipoteca<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td><strong>Adjetivo<\/strong><\/td>\n<td>sí: género y número, según el sustantivo al que acompañe<\/td>\n<td>expresa <strong>cómo es<\/strong> el sustantivo al que acompaña<\/td>\n<td>admite <em>muy<\/em> delante y <em>-ísimo<\/em> detrás —muy caro, carísimo—, salvo los que clasifican: ⊗<em>muy alimentario<\/em><\/td>\n<td>caro, tradicional, delicado, ruidoso, provisional, injusta, llena<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">3<\/td>\n<td><strong>Determinante<\/strong><\/td>\n<td>casi todos: género y número; <em>mi<\/em> y <em>tu<\/em> solo número, y los numerales cardinales no cambian nunca<\/td>\n<td><strong>presenta<\/strong> al sustantivo y lo delimita<\/td>\n<td>va delante del sustantivo y lo presenta —<strong>mi<\/strong> turno, <strong>esta<\/strong> factura, <strong>tres<\/strong> meses—, y, a diferencia del adjetivo, no admite <em>muy<\/em> delante ni <em>-ísimo<\/em> detrás<\/td>\n<td>el, la, un, mi, tu, este, ese, aquel, algún, ningún, otro, mucho, tres<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">4<\/td>\n<td><strong>Pronombre<\/strong><\/td>\n<td>casi todos: género, número y persona; <em>alguien<\/em>, <em>nadie<\/em> y <em>algo<\/em> no cambian nunca<\/td>\n<td><strong>ocupa el lugar<\/strong> de un sustantivo, de un sintagma o de una oración entera<\/td>\n<td>va solo, sin sustantivo al lado: <strong>lo<\/strong> vendió<\/td>\n<td>yo, tú, él, ella, me, te, se, lo, la, le, mí, ti, esto, eso, aquello, el mío, alguien, nadie, quien<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">5<\/td>\n<td><strong>Verbo<\/strong><\/td>\n<td>sí: persona, número, tiempo y modo, <strong>salvo las formas no personales<\/strong><\/td>\n<td>expresa <strong>lo que pasa<\/strong>; es el núcleo del predicado<\/td>\n<td>se conjuga: yo vendo, tú vendiste<\/td>\n<td>vender, vendía, había, plantó, dé, firmaron, cobraremos, subieran<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">6<\/td>\n<td><strong>Adverbio<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>modifica al verbo, al adjetivo o a otro adverbio<\/td>\n<td>no concuerda con nada; contesta a cómo, cuándo, dónde, cuánto<\/td>\n<td>sí, no, más, aún, muy, ya, siempre, deprisa, aquí, entonces, quizá<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">7<\/td>\n<td><strong>Preposición<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>une un elemento de la oración con su complemento, yendo delante<\/td>\n<td>lista cerrada de veintitrés, entera en el recuadro de abajo<\/td>\n<td>a, ante, bajo, con, de, desde, en, entre, <strong>hacia<\/strong>, hasta, para, por, sin, sobre, tras<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">8<\/td>\n<td><strong>Conjunción<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td><strong>une<\/strong>: las coordinantes, dos elementos del mismo rango; las subordinantes, una oración dentro de otra<\/td>\n<td>se puede sustituir por otra conjunción del mismo grupo<\/td>\n<td>coordinantes: y, o, ni, pero, mas, sino · subordinantes: que, si, porque, aunque, pues<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">9<\/td>\n<td><strong>Interjección<\/strong><\/td>\n<td><strong>no: es invariable<\/strong><\/td>\n<td>expresa una reacción; vale por una oración entera<\/td>\n<td>va sola, entre signos de exclamación<\/td>\n<td>¡ay!, ¡uf!, ¡vaya!, ¡ojalá!, ¡anda!<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>El género del sustantivo y el género del adjetivo no funcionan igual<\/h4>\n<p>El sustantivo <strong>tiene<\/strong> un género, y casi siempre es el mismo: <em>la mesa<\/em> es femenino y <em>el alquiler<\/em> es masculino, y no hay ⊗<em>el meso<\/em> ni ⊗<em>la alquilera<\/em>. Solo cambian de género los que nombran seres con sexo —<em>perro / perra<\/em>, <em>profesor / profesora<\/em>, <em>vecino / vecina<\/em>— y algunos de oficio o cargo que lo han ido ganando —<em>jueza<\/em>, <em>concejala<\/em>—.<\/p>\n<p>El adjetivo, en cambio, <strong>no tiene<\/strong> género propio: toma el del sustantivo al que acompaña, sea cual sea. <em>Caro<\/em> es <em>caro<\/em> en «un alquiler caro» y <em>cara<\/em> en «una factura cara», sin que la palabra signifique nada distinto. Por eso la prueba del plural y del femenino separa las dos clases: el adjetivo cambia porque se lo pide el sustantivo de al lado; el sustantivo solo cambia si nombra a otro ser.<\/p>\n<h4>El determinante casi siempre va delante<\/h4>\n<p>Va pegado al sustantivo y por delante: <em>mi turno<\/em>, <em>esta factura<\/em>, <em>tres meses<\/em>. Hay dos casos en que se pospone, y los dos llevan otro determinante delante:<\/p>\n<ul>\n<li>el <strong>demostrativo<\/strong>, que pasa detrás con artículo delante: <em>el chico ese<\/em>, <em>la factura aquella<\/em>;<\/li>\n<li>el <strong>posesivo tónico<\/strong>, que se pospone igual: <em>un amigo mío<\/em>, <em>una prima suya<\/em>, <em>la culpa nuestra<\/em>.<\/li>\n<\/ul>\n<h4>La lista de pronombres, por tipos<\/h4>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>cuáles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>personales<\/strong><\/td>\n<td>yo, tú, vos, usted, él, ella, ello, nosotros, nosotras, vosotros, vosotras, ustedes, ellos, ellas · me, te, se, nos, os, lo, la, le, los, las, les · mí, ti, sí, conmigo, contigo, consigo<\/td>\n<\/tr>\n<tr>\n<td><strong>demostrativos<\/strong><\/td>\n<td>este, esta, estos, estas · ese, esa, esos, esas · aquel, aquella, aquellos, aquellas · esto, eso, aquello<\/td>\n<\/tr>\n<tr>\n<td><strong>posesivos<\/strong><\/td>\n<td>el mío, la mía, los míos… y lo mismo con tuyo, suyo, nuestro y vuestro<\/td>\n<\/tr>\n<tr>\n<td><strong>indefinidos<\/strong><\/td>\n<td>alguien, nadie, algo, nada, alguno, ninguno, uno, otro, todo, mucho, poco, bastante, demasiado, varios, cualquiera<\/td>\n<\/tr>\n<tr>\n<td><strong>numerales<\/strong><\/td>\n<td>uno, dos, tres… cuando van solos (<em>me quedan tres<\/em>), y los ordinales (<em>el primero<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>interrogativos y exclamativos<\/strong><\/td>\n<td>qué, quién, quiénes, cuál, cuáles, cuánto y sus femeninos y plurales<\/td>\n<\/tr>\n<tr>\n<td><strong>relativos<\/strong><\/td>\n<td>que, quien, quienes, el cual, cuanto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los demostrativos, los posesivos, los indefinidos y los numerales que funcionan como pronombre aparecen también en la lista de determinantes, y con la misma forma. La clase depende de si llevan sustantivo al lado o van solos, y por eso la segunda de las tres preguntas basta para separarlos.<\/p>\n<h4>La lista de preposiciones, las veintitrés<\/h4>\n<blockquote>\n<p><strong>a, ante, bajo, cabe, con, contra, de, desde, durante, en, entre, hacia, hasta, mediante, para, por, según, sin, so, sobre, tras, versus, vía<\/strong><\/p>\n<\/blockquote>\n<p>Es una lista cerrada y se aprende de memoria: cambia muy despacio, y las últimas en entrar han sido <em>versus<\/em> y <em>vía<\/em>. <em>Cabe<\/em> (= junto a) y <em>so<\/em> (= bajo) están anticuadas y es muy improbable que aparezcan, aunque <em>so<\/em> sigue vivo en <em>so pena de<\/em> y <em>so pretexto de<\/em>; las dos siguen en la lista oficial.<\/p>\n<p>Hay además <strong>locuciones preposicionales<\/strong>: grupos de palabras que funcionan como una preposición: <em>a causa de<\/em>, <em>a pesar de<\/em>, <em>delante de<\/em>, <em>dentro de<\/em>, <em>encima de<\/em>, <em>junto a<\/em>, <em>por medio de<\/em>.<\/p>\n<h4>Las tres preguntas que resuelven casi todo<\/h4>\n<ol>\n<li><strong>¿Cambia de forma?<\/strong> Sí → está entre las cinco primeras. No → entre las cuatro últimas, <strong>salvo<\/strong> los invariables de las cinco primeras: <em>alguien<\/em>, <em>nadie<\/em>, <em>algo<\/em>, el <em>que<\/em> relativo, los numerales cardinales y los infinitivos, gerundios y participios invariables del verbo.\n   <em>Ejemplo:<\/em> en «las <strong>facturas<\/strong> llegaron», <em>facturas<\/em> admite singular —<em>la factura<\/em>—, así que cambia de forma: está entre las cinco primeras. En «llegaron <strong>ayer<\/strong>», <em>ayer<\/em> no admite ningún cambio: está entre las cuatro últimas.<\/li>\n<li><strong>Para decidir entre determinante y pronombre, ¿lleva un sustantivo al lado?<\/strong> Sí → <strong>determinante<\/strong>. Va solo, en su lugar → <strong>pronombre<\/strong>.\n   <em>Ejemplo:<\/em> «<strong>esta<\/strong> factura» lleva <em>factura<\/em> detrás, luego <em>esta<\/em> es determinante; «<strong>esta<\/strong> llegó ayer» no lleva sustantivo, luego es pronombre.<\/li>\n<li><strong>¿Une?<\/strong> Un elemento con su complemento, yendo delante → <strong>preposición<\/strong>. Dos elementos del mismo rango, o una oración metida dentro de otra → <strong>conjunción<\/strong>.\n   <em>Ejemplo:<\/em> «vino <strong>con<\/strong> su hermana» une el verbo con el complemento <em>su hermana<\/em>, que va detrás: preposición. «Vino su hermana <strong>y<\/strong> su cuñado» une dos sintagmas que están al mismo nivel: conjunción.<\/li>\n<\/ol>\n<h4>Cuatro que se clasifican mal a menudo<\/h4>\n<ul>\n<li><strong><em>Cuándo<\/em>, <em>cómo<\/em> y <em>dónde<\/em> son adverbios<\/strong>, aunque lleven tilde y abran pregunta. Solo <em>quién<\/em>, <em>qué<\/em>, <em>cuál<\/em> y <em>cuánto<\/em> pueden ser pronombres. En «no sé <strong>cuándo<\/strong> llega», <em>cuándo<\/em> señala el momento, como haría <em>entonces<\/em>.<\/li>\n<li><strong><em>Mi<\/em> y <em>tu<\/em> son determinantes<\/strong> posesivos: llevan el sustantivo detrás —<em>mi turno<\/em>, <em>tu parte<\/em>—. El pronombre posesivo es <em>el mío<\/em>, <em>el tuyo<\/em>.<\/li>\n<li><strong><em>Que<\/em> es conjunción o pronombre relativo<\/strong>, según lo que haga. En «dijo <strong>que<\/strong> vendría» solo une dos oraciones: conjunción. En «el parte <strong>que<\/strong> firmaste» sustituye a <em>el parte<\/em> dentro de la subordinada —<em>firmaste el parte<\/em>—: pronombre relativo, y por eso tiene antecedente.<\/li>\n<li><strong><em>Un<\/em> y <em>una<\/em> son determinantes cuando presentan un sustantivo<\/strong> —<em>un turno<\/em>— y pronombres cuando van solos —<em>me queda <span class=\"vs\">uno<\/span><\/em>—. La forma es casi la misma y la clase, distinta.<\/li>\n<\/ul>", "ejercicios": [{"tipo": "hueco", "titulo": "Escribe la clase de la palabra en negrita", "dossier": {"cuaderno": "6", "ejercicio": 1}, "ayuda": "Escribe el nombre de la clase: sustantivo, adjetivo, determinante, pronombre, verbo, adverbio, preposición, conjunción o interjección. Cuando la oración del dossier trae dos palabras en negrita, aquí va dos veces, con una sola marcada cada vez.", "estricto": true, "items": [{"enun": "«<b>Muy<\/b> claro lo tenía este chico.»", "sol": "adverbio|adverbio de cantidad", "porque": "modifica al adjetivo <i>claro<\/i>"}, {"enun": "«Muy claro <b>lo<\/b> tenía este chico.»", "sol": "pronombre|pronombre personal", "porque": "va solo"}, {"enun": "«<b>Él<\/b> apenas los había usado.»", "sol": "pronombre|pronombre personal", "porque": "pronombre personal"}, {"enun": "«Él apenas <b>los<\/b> había usado.»", "sol": "pronombre|pronombre personal", "porque": "va solo: <i>los<\/i> = los coches"}, {"enun": "«Se gana la vida <b>con<\/b> ello.»", "sol": "preposición", "porque": "une <i>ganarse la vida<\/i> con su complemento <i>ello<\/i>"}, {"enun": "«El alquiler ha subido, <b>y<\/b> eso no se sostiene.»", "sol": "conjunción|conjunción copulativa", "porque": "une dos oraciones"}, {"enun": "«Sigue conduciendo un coche <b>heredado<\/b>.»", "sol": "adjetivo|adjetivo calificativo", "porque": "expresa cómo es el coche, y admite género y número: <script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);

  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);

  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);

  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();

    ventana.hidden = false;

  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');

      }

    }

  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
