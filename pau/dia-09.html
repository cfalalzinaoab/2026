ca para qué aparece el concepto en el texto, aunque su propio enunciado lo pide; lo prudente es añadir la segunda mitad: Pinker se apoya en la selección natural para sostener que el lenguaje es una adaptación biológica, que evolucionó como cualquier otro órgano."}], "criterio": "Las tres admiten fracciones —0,25, 0,5, 0,75— según la precisión de la respuesta. El título que da la opinión del lector en lugar del contenido del texto, el resumen que se sale del párrafo delimitado y la explicación que no ata el concepto al argumento contestan a medias, y una frase copiada del original se considera incorrecta.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Parte 2: la redacción de 150 a 200 palabras", "ayuda": "Hoy no se escribe: es la primera redacción larga del curso, que se encarga el 5 de noviembre para el 10. Queda aquí para escribirla entonces, con el contador de palabras. Se elige UNA de las dos opciones.", "palabras": {"min": 150, "max": 200}, "items": [{"enun": "«Opción A. ¿Cómo sería la vida sin lenguaje? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que reflexione sobre la importancia del lenguaje para los humanos. Su texto debe incluir como mínimo dos argumentos.» · «Opción B. ¿Conceden los hablantes al lenguaje la importancia que tiene? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a esta pregunta. Su texto debe incluir como mínimo dos argumentos.»", "conv": "2024s", "modelo": "Sin clave: se corrige con la rúbrica del comentario —adecuación 1, coherencia 1,5, estilo 1,5—, con el recuento de palabras y con el descuento por faltas sin tope. La respuesta tiene que quedar establecida y llevar dos argumentos válidos y distintos, 0,5 cada uno; en 150-200 palabras entra la concesión entera, recomendada y no obligatoria."}], "criterio": "Los criterios del comentario lo exigen con estas palabras: dos argumentos válidos y diferentes, 0,5 cada uno; y −0,5 por bajar de 150 palabras o pasar de 200. Contar las palabras al final no es opcional.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [4]}, {"pieza": "TEXTOS", "apartados": [4]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 4: Comentari de text 2024, tribunal especial · el origen del lenguaje (p. 255) · Los textos de cada sesión — apartado 4: «El origen del lenguaje» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda: léxico y fraseología", "meta": "10 minutos · seis ítems reales de exámenes que no se leen en clase, y uno propio", "teoria": "<div class=\"enelexamen\"><strong>En los dos exámenes.<\/strong> Esta pieza sostiene cuatro tipos de pregunta, y entre las cuatro suman más puntos que ninguna otra parte del bloque 1:<\/div>\n<table>\n<thead>\n<tr>\n<th>pregunta<\/th>\n<th>dónde<\/th>\n<th>cae<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Léxico en contexto<\/strong>: sinónimo, antónimo o significado de una palabra culta, entre cuatro opciones<\/td>\n<td>bloque 1 de los dos exámenes<\/td>\n<td><strong>al menos una por examen<\/strong>; en el comentario, nueve preguntas en seis convocatorias<\/td>\n<\/tr>\n<tr>\n<td><strong>Figura retórica<\/strong>: nombrar la figura entre cuatro<\/td>\n<td>bloque 1 de Llengua castellana<\/td>\n<td>5 de 24, y <strong>todas desde 2021<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Sentido figurado y fraseología<\/strong>: qué significa una expresión, o cuál NO está en sentido figurado<\/td>\n<td>bloque 1<\/td>\n<td>alrededor de una por examen<\/td>\n<\/tr>\n<tr>\n<td><strong>Sinónimo suelto, no-sinónimo, campo semántico<\/strong><\/td>\n<td>bloque 3<\/td>\n<td>3 de 24<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y el cambio de formato de las preguntas de léxico en test:<\/strong> no se propone una palabra, <strong>se elige entre cuatro<\/strong>, de modo que lo que hay que entrenar es descartar los tres distractores leyendo la frase con cada uno dentro, y no recordar el sinónimo.<\/p>\n<h3>1 · Sinonimia, y el distractor co-hipónimo<\/h3>\n<p>Dos palabras con el mismo significado y <strong>de la misma clase<\/strong>: un sustantivo por un sustantivo, un verbo por un verbo.<\/p>\n<p>La sinonimia total casi no existe. <em>Can<\/em> y <em>perro<\/em> son sinónimos y nadie dice que saca a pasear a su can. Lo normal es la <strong>sinonimia parcial<\/strong>: dos palabras se intercambian en un contexto y en otro no. Por eso el enunciado suele incluir «en el texto» o «según su uso en el texto»; en 2019t y en 2025t no lo lleva, y la palabra se decide igual leyendo su frase.<\/p>\n<blockquote>\n<p><strong>Cómo se fabrica el distractor, y tres clases que no se descartan igual.<\/strong> De las cuatro opciones, dos o tres suelen estar en el terreno de significado de la palabra buscada, y por eso parecen posibles. Se separan así:<\/p>\n<ul>\n<li><strong>El co-hipónimo<\/strong>, que es del mismo tipo: la palabra buscada y él contestan a «es una clase de…» lo mismo. <em>Furgoneta<\/em> y <em>autobús<\/em> son co-hipónimos porque las dos son vehículos. Se descarta metiéndolo en la frase: es del tipo correcto y no es ese.<\/li>\n<li><strong>La palabra del mismo campo que no es del mismo tipo.<\/strong> En el ítem de <em>tufo<\/em>, <em>humo<\/em> está en el terreno del olor sin ser una clase de olor: comparte el campo semántico y no el hiperónimo. Se descarta por el significado.<\/li>\n<li><strong>El sinónimo de la palabra buscada, en una pregunta que pedía otra relación<\/strong>: <em>idealista<\/em> y <em>quimérica<\/em> son sinónimos de <em>ilusa<\/em> en un ítem que pedía un antónimo. Se descarta releyendo el enunciado.<\/li>\n<\/ul>\n<p>Llamarlos a los tres co-hipónimos deja un solo procedimiento para tres trampas distintas. <strong>Co-hipónimo<\/strong> exige compartir hiperónimo; <strong>campo semántico<\/strong> solo exige compartir terreno, así que admite palabras que no son una clase de nada común: <em>portero<\/em> y <em>mudanza<\/em> están en el campo de la vivienda y no contestan juntas a ninguna pregunta «es una clase de…».<\/p>\n<\/blockquote>\n<p><strong>El procedimiento:<\/strong> no elijas la que se parece. <strong>Sustituye la palabra del texto por cada una de las cuatro y lee la oración entera.<\/strong> Tres de las cuatro producen una oración que no funciona.<\/p>\n<p><strong>Un ejemplo entero, hecho paso a paso.<\/strong> La frase es «el convenio <strong>contempla<\/strong> una subida del 3 %» y las opciones, a) <em>mira<\/em>, b) <em>prevé<\/em>, c) <em>observa<\/em>, d) <em>vigila<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>opción<\/th>\n<th>la frase con ella dentro<\/th>\n<th>qué pasa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a) mira<\/td>\n<td>«el convenio mira una subida»<\/td>\n<td><em>mirar<\/em> pide ojos: un convenio no mira<\/td>\n<\/tr>\n<tr>\n<td>b) prevé<\/td>\n<td>«el convenio prevé una subida»<\/td>\n<td>encaja: <em>contemplar<\/em> aquí significa tener algo previsto por escrito<\/td>\n<\/tr>\n<tr>\n<td>c) observa<\/td>\n<td>«el convenio observa una subida»<\/td>\n<td><em>observar<\/em> vale por <em>cumplir<\/em> —<em>observar la norma<\/em>—, no por <em>prever<\/em><\/td>\n<\/tr>\n<tr>\n<td>d) vigila<\/td>\n<td>«el convenio vigila una subida»<\/td>\n<td>mismo problema que <em>mirar<\/em>, y además añade una intención que no hay<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las tres descartadas son sinónimas de <em>contemplar<\/em> en otro de sus sentidos, el de mirar con atención. Las opciones suelen ser sinónimos de la palabra <strong>en un sentido que no es el del texto<\/strong>.<\/p>\n<h3>2 · Antonimia<\/h3>\n<p>Significados contrarios, misma clase. Tres tipos: <strong>graduales<\/strong> (<em>frío / templado / caliente<\/em>), <strong>complementarios<\/strong> (<em>vivo / muerto<\/em>, sin término medio) y <strong>recíprocos<\/strong> (<em>comprar / vender<\/em>).<\/p>\n<p><strong>Los antónimos con prefijo.<\/strong> El prefijo <strong>no cambia la clase de palabra<\/strong>: <em>legal<\/em> es adjetivo e <em>ilegal<\/em> también; <em>empleo<\/em> es sustantivo y <em>desempleo<\/em> también.<\/p>\n<table>\n<thead>\n<tr>\n<th>prefijo<\/th>\n<th>significa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a- / an-<\/strong><\/td>\n<td>ausencia de<\/td>\n<td>apolítico, analfabeto<\/td>\n<\/tr>\n<tr>\n<td><strong>anti-<\/strong><\/td>\n<td>contra<\/td>\n<td>antirrobo, antivirus<\/td>\n<\/tr>\n<tr>\n<td><strong>des- / de-<\/strong><\/td>\n<td>acción al revés<\/td>\n<td>deshacer, desempleo<\/td>\n<\/tr>\n<tr>\n<td><strong>in- / im- / i- / ir-<\/strong><\/td>\n<td>negación<\/td>\n<td>incapaz · imposible (ante <em>p<\/em>, <em>b<\/em>) · ilegal (ante <em>l<\/em>) · irreal (ante <em>r<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>El ítem de antónimo, donde el distractor es un sinónimo<\/h4>\n<blockquote>\n<p><strong>2016t, 1.3.<\/strong> «De entre las siguientes opciones, elija un <strong>antónimo<\/strong> para el adjetivo <em>ilusa<\/em> en el texto.» a) Realista. b) Idealista. c) Altruista. d) Quimérica.<\/p>\n<p><strong>Clave: a) Realista.<\/strong> El reparto de las cuatro: <strong>b) <em>idealista<em> y d) <\/em>quimérica<em> son sinónimos de <\/em>ilusa<\/em><\/strong>, no antónimos. Solo una de las cuatro va en dirección contraria.<\/p>\n<\/blockquote>\n<p><strong>El paso que lo evita<\/strong> es el mismo que rodear el «NO»: <strong>subraya la palabra <em>antónimo<\/em> en el enunciado antes de leer las opciones.<\/strong> Quien lee deprisa busca una palabra parecida a <em>ilusa<\/em>, y encuentra dos.<\/p>\n<h3>3 · Hiperonimia, polisemia y homonimia<\/h3>\n<p><strong>Hiperónimo<\/strong> es la palabra que nombra la clase; <strong>hipónimo<\/strong>, la que nombra un miembro. <em>Vehículo<\/em> es hiperónimo de <em>furgoneta<\/em> y de <em>autobús<\/em>. La prueba: el hiperónimo puede sustituir al hipónimo y no al revés. De una furgoneta se dice «este vehículo»; de un vehículo cualquiera, no se dice «esta furgoneta».<\/p>\n<p><strong>Polisemia:<\/strong> una palabra con varios significados relacionados entre sí, que están en la misma entrada del diccionario porque vienen unos de otros.<\/p>\n<table>\n<thead>\n<tr>\n<th>palabra<\/th>\n<th>un significado<\/th>\n<th>otro<\/th>\n<th>otro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>operación<\/strong><\/td>\n<td>la que hace un cirujano<\/td>\n<td>la que hace un banco<\/td>\n<td>la que hace una calculadora<\/td>\n<\/tr>\n<tr>\n<td><strong>carta<\/strong><\/td>\n<td>la que se echa al buzón<\/td>\n<td>la de la baraja<\/td>\n<td>la del restaurante<\/td>\n<\/tr>\n<tr>\n<td><strong>plancha<\/strong><\/td>\n<td>la de planchar<\/td>\n<td>la de metal<\/td>\n<td>el error (<em>meter la plancha<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>cabeza<\/strong><\/td>\n<td>la del cuerpo<\/td>\n<td>la de familia<\/td>\n<td>la de ajos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Homonimia:<\/strong> dos palabras distintas que coinciden en la forma por casualidad, y tienen entradas separadas en el diccionario. Se dividen según en qué coinciden:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>coinciden en<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>homógrafos<\/strong><\/td>\n<td>la escritura y la pronunciación<\/td>\n<td><em>vino<\/em> (bebida) / <em>vino<\/em> (de <em>venir<\/em>) · <em>lima<\/em> (fruta) / <em>lima<\/em> (herramienta) · <em>sobre<\/em> (preposición) / <em>sobre<\/em> (el de las cartas)<\/td>\n<\/tr>\n<tr>\n<td><strong>homófonos<\/strong><\/td>\n<td>solo la pronunciación<\/td>\n<td><em>hola<\/em> / <em>ola<\/em> · <em>vaya<\/em> / <em>valla<\/em> · <em>hasta<\/em> / <em>asta<\/em> · <em>bello<\/em> / <em>vello<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los homófonos descuentan al escribir, porque se elige la letra equivocada, y por eso se tratan en la pieza 4. Los homógrafos dan pie a las preguntas de significado: la misma palabra escrita puede estar usada en el texto en un sentido o en otro, y el enunciado pregunta en cuál.<\/p>\n<p><strong>La diferencia entre polisemia y homonimia, en una línea:<\/strong> en la polisemia los significados están emparentados —una <em>operación<\/em> de banco y una de cirugía son las dos una serie de pasos que se ejecutan—; en la homonimia los dos significados no guardan relación y coincide únicamente la forma.<\/p>\n<p><strong>El examen no pregunta cuál de las dos es<\/strong>, sino lo que las dos tienen en común: que una palabra puede estar usada en el texto en su sentido corriente o en otro. De ahí salen las preguntas de sentido figurado.<\/p>\n<h3>4 · Literal y figurado<\/h3>\n<p><strong>Sentido literal<\/strong>: el que la palabra tiene en el terreno al que pertenece. El orden del diccionario no lo decide, porque las acepciones se ordenan por frecuencia y por origen, y la primera puede ser la figurada. <strong>Sentido figurado<\/strong>: el que aparece al trasladar esa palabra a otro terreno. <em>Alto<\/em> de estatura es literal; <em>un alto cargo<\/em> es figurado, porque en ese uso la altura ya no se mide en centímetros.<\/p>\n<p>Dos preguntas del examen salen de aquí, y las dos están resueltas en la pieza 10: «¿cuál de estas expresiones NO está usada en sentido figurado?» (2025t) y «¿cuál de estas palabras subrayadas NO está usada con valor metafórico?» (2025s). Las dos son preguntas con «NO», así que se contestan rodeando primero esa palabra.<\/p>\n<p><strong>La fraseología<\/strong> son las expresiones hechas, que significan algo distinto de la suma de sus palabras. Están en el diccionario como bloque y no admiten cambios internos: se dice <em>a tiro de piedra<\/em>, no ⊗<em>a tiro de ladrillo<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>expresión<\/th>\n<th>qué significa<\/th>\n<th>en una frase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>a tiro de piedra<\/em><\/td>\n<td>muy cerca<\/td>\n<td>«La nave está a tiro de piedra de la parada»<\/td>\n<\/tr>\n<tr>\n<td><em>con luces y sombras<\/em><\/td>\n<td>con aciertos y con fallos<\/td>\n<td>«El balance del año salió con luces y sombras»<\/td>\n<\/tr>\n<tr>\n<td><em>ahogar las penas<\/em><\/td>\n<td>intentar olvidar un disgusto bebiendo<\/td>\n<td>«Se fue a ahogar las penas después de suspender»<\/td>\n<\/tr>\n<tr>\n<td><em>tener las alas cortadas<\/em><\/td>\n<td>no poder hacer lo que uno podría<\/td>\n<td>«Sin coche y en aquel pueblo, tenía las alas cortadas»<\/td>\n<\/tr>\n<tr>\n<td><em>estar en la cuerda floja<\/em><\/td>\n<td>estar a punto de perder algo<\/td>\n<td>«Su puesto lleva un año en la cuerda floja»<\/td>\n<\/tr>\n<tr>\n<td><em>echar una mano<\/em><\/td>\n<td>ayudar<\/td>\n<td>«Le echaron una mano con la mudanza»<\/td>\n<\/tr>\n<tr>\n<td><em>dar largas<\/em><\/td>\n<td>retrasar una respuesta sin negarla<\/td>\n<td>«Llevan tres meses dándole largas»<\/td>\n<\/tr>\n<tr>\n<td><em>poner el grito en el cielo<\/em><\/td>\n<td>protestar con mucha fuerza<\/td>\n<td>«El vecindario puso el grito en el cielo»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo se pregunta.<\/strong> El examen da la expresión y cuatro <strong>paráfrasis<\/strong>: cuatro maneras de decir lo mismo con otras palabras. Una es la correcta y las otras tres traducen la expresión palabra por palabra o se quedan en el sentido literal. El ejercicio de esta pieza pide una paráfrasis: explicar qué significa la expresión sin usar ninguna de sus palabras.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Cinco reales y uno propio", "ayuda": "Seis ítems con cuatro opciones. Los cinco con chapa de año son literales del examen, con su clave oficial. Sustituye la palabra por cada opción, y en el hiperónimo aplica la prueba de la clase.", "items": [{"enun": "Indique cuál de las siguientes palabras es el hiperónimo de <i>tufo<\/i>.", "conv": "2015t", "ops": ["Hedor.", "Humo.", "Peste.", "Efluvio."], "sol": "Efluvio.", "porque": "<i>hedor<\/i> y <i>peste<\/i> son sinónimos de <i>tufo<\/i>, no hiperónimos; <i>humo<\/i> no cumple ninguna de las dos relaciones. Un tufo es una clase de efluvio"}, {"enun": "Indique cuál de los siguientes verbos es un antónimo de <i>vislumbrar<\/i> en el texto.", "conv": "2016s", "ops": ["Conjeturar.", "Omitir.", "Presumir.", "Deducir."], "sol": "Omitir.", "porque": "tres distractores del mismo terreno: <i>conjeturar<\/i>, <i>presumir<\/i> y <i>deducir<\/i> son maneras de acercarse a una idea; solo <i>omitir<\/i> va en dirección contraria"}, {"enun": "Proponga un sinónimo de <i>reputadas<\/i>.", "conv": "2025t", "ops": ["Modernas.", "Típicas.", "Punteadas.", "Célebres."], "sol": "Célebres.", "porque": "reputado significa 'que tiene buena fama'; <i>punteadas<\/i> está puesta por el parecido de letras"}, {"enun": "¿Cuál es el significado de <i>no emanaban de él<\/i> en la oración «Ciertamente, no emanaban de él, pero eso carecía de importancia»?", "conv": "2025s", "ops": ["No los había pagado él.", "No eran obra suya.", "Él no los había comprendido.", "No los había ordenado él."], "sol": "No eran obra suya.", "porque": "<i>emanar de<\/i> es salir de, proceder de: los libros no eran obra suya"}, {"enun": "Proponga un sinónimo de <i>se ubique<\/i> en el siguiente fragmento del texto: «también para que uno se reconozca, se ubique, se encuentre con los suyos».", "conv": "2026s", "ops": ["Se comporte.", "Se sitúe.", "Se organice.", "Se disfrace."], "sol": "Se sitúe.", "porque": "ubicarse es situarse; la frase sostiene que la ropa sirve para que uno sepa dónde está respecto de los demás"}, {"enun": "¿Cuál de las siguientes palabras es el hiperónimo de <i>tornillo<\/i>?", "ops": ["Pieza.", "Clavo.", "Tuerca.", "Martillo."], "sol": "Pieza.", "porque": "el mismo diseño que el de <i>tufo<\/i>: <i>clavo<\/i> y <i>tuerca<\/i> son co-hipónimos, otros objetos de ferretería; <i>martillo<\/i> es la herramienta que lo acompaña"}], "criterio": "Los dos hiperónimos, el real y el propio, se resuelven con la misma prueba de la clase; el antónimo de 2016s y el sinónimo de 2025t, sustituyendo la palabra por cada opción; y los dos de expresión, leyendo la oración entera del texto.", "apoyo": ["1 · Sinonimia, y el distractor co-hipónimo"], "usa_texto": false, "solo_web": true}, {"tipo": "hueco", "titulo": "La abierta de sinónimo: 2026t", "ayuda": "Escribe un sinónimo. La clave admite seis; se corrige sustituyendo la palabra en la oración.", "items": [{"enun": "Escriba un sinónimo del adjetivo que aparece subrayado en la siguiente oración del texto: «corremos el riesgo <u>perentorio<\/u> de convertirnos en una Venecia sin canales ni barceloneses».", "conv": "2026t", "sol": "imperioso|apremiante|acuciante|urgente|inaplazable|impostergable|inminente|apremiantes|urgentes", "porque": "la clave admite <i>imperioso<\/i>, <i>apremiante<\/i>, <i>acuciante<\/i>, <i>urgente<\/i>, <i>inaplazable<\/i> e <i>impostergable<\/i>: perentorio significa que no admite espera"}], "criterio": "Es un adjetivo culto, y la clave admite seis respuestas. Se corrige por sustitución: «corremos el riesgo urgente de convertirnos…» se sostiene, y <i>peligroso<\/i> o <i>grave<\/i> no significan lo mismo.", "apoyo": ["1 · Sinonimia, y el distractor co-hipónimo"], "usa_texto": false, "solo_web": true}, {"tipo": "abierta", "titulo": "La abierta de refrán: 2016s", "ayuda": "Dos líneas, con tus palabras.", "items": [{"enun": "Explique con sus propias palabras el significado del refrán español <i>no es oro todo lo que reluce<\/i>, que aparece en el texto.", "conv": "2016s", "modelo": "Clave oficial: que las apariencias engañan; lo que brilla por fuera puede no valer lo que aparenta. Una respuesta que repita las palabras del refrán —«que no todo lo que brilla es oro»— no lo explica."}], "criterio": "Se da el punto si la explicación recoge el sentido sin usar las palabras del refrán, y si se entiende sin conocerlo.", "apoyo": ["1 · Sinonimia, y el distractor co-hipónimo"], "usa_texto": false, "solo_web": true}], "cuaderno": {"pieza": 5, "apartados": [1, 2, 3, 4]}, "cuaderno_txt": "Pieza 5 · Significado, figuras y sentido figurado — apartados 1, 2, 3 y 4: Sinonimia, y el distractor co-hipónimo; Antonimia; Hiperonimia, polisemia y homonimia; Literal y figurado (p. 159, 161 y 162)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto de José C. Vales (Destino, 2022), reproducido en el carril «El texto» en la adaptación del cuadernillo de 2024, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.

  var ventana = null, disparador = null;

    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'

  function envuelveTablas(nodo) {

  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede

    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {

     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.

  function bloquesTeoria(html) {

  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;

    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });

  }

  /* ---------- persistencia ---------- */

  function compatible(e) {

  function est(n) {

  /* ---------- render de un ejercicio ---------- */

          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
