<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 9 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-10-27">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 27 de octubre</h1>
    <p class="sub">Palabras que se separan y el set de 2018s · el primer examen de comentario (2024s), la segunda redacción corta y el resumen de un párrafo · la tanda de léxico</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 9, "fecha": "2026-10-27", "tab": "Día 9 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 27 de octubre", "sub": "Palabras que se separan y el set de 2018s · el primer examen de comentario (2024s), la segunda redacción corta y el resumen de un párrafo · la tanda de léxico", "carriles": [{"chapa": "Carril A", "titulo": "Palabras que se separan · set 2018s", "meta": "20 minutos · por qué / porque / porqué, sino / si no, conque / con que y las pruebas de cada par; el segundo set real", "teoria": "<p>La familia que más faltas produce en una redacción de examen: pares que se escriben juntos o separados según lo que significan, y que suenan igual. Ningún ítem los pregunta; cada uno mal escrito cuenta como falta en los dos exámenes. Cada par lleva su prueba, y la prueba consiste siempre en meter una palabra en medio o en sustituir el par por otra expresión.<\/p>\n\n<h3>Los pares y sus pruebas<\/h3>\n<table>\n<tr><th>par<\/th><th>cuándo se usa cada uno<\/th><th>la prueba<\/th><\/tr>\n<tr><td><b>por qué<\/b> / <b>porque<\/b> / <b>el porqué<\/b> / <b>por que<\/b><\/td><td>pregunta / responde / sustantivo / preposición + relativo<\/td><td>intercala <i>motivo<\/i>: si admite «por qué <i>motivo<\/i>», va separado y con tilde<\/td><\/tr>\n<tr><td><b>a ver<\/b> / <b>haber<\/b><\/td><td>verbo <i>ver<\/i> / verbo <i>haber<\/i><\/td><td>si puedes decir «vamos a <i>mirar<\/i>», es <i>a ver<\/i><\/td><\/tr>\n<tr><td><b>sino<\/b> / <b>si no<\/b><\/td><td>conjunción adversativa / condicional negativa<\/td><td>intercala <i>mañana<\/i>: si admite «si <i>mañana<\/i> no vienes», va separado<\/td><\/tr>\n<tr><td><b>conque<\/b> / <b>con que<\/b><\/td><td>consecuencia (= <i>así que<\/i>) / preposición + relativo<\/td><td>si admite <i>así que<\/i>, va junto<\/td><\/tr>\n<tr><td><b>entorno<\/b> / <b>en torno a<\/b><\/td><td>sustantivo (= <i>ambiente<\/i>) / locución (= <i>alrededor de<\/i>)<\/td><td>si admite <i>alrededor de<\/i>, va separado<\/td><\/tr>\n<tr><td><b>también<\/b> / <b>tan bien<\/b><\/td><td>adverbio / comparación de modo<\/td><td>si admite <i>tan bien como<\/i>, va separado<\/td><\/tr>\n<tr><td><b>demás<\/b> / <b>de más<\/b><\/td><td>el resto / de sobra<\/td><td>si admite <i>de sobra<\/i>, va separado<\/td><\/tr>\n<tr><td><b>sobre todo<\/b><\/td><td>siempre separado cuando significa <i>principalmente<\/i><\/td><td><i>sobretodo<\/i> junto es una prenda de abrigo<\/td><\/tr>\n<\/table>\n<p>El par de <i>por qué<\/i> tiene cuatro formas y tres se usan a diario: <i>por qué<\/i> pregunta, también en la pregunta indirecta («no sé por qué llegó tarde»); <i>porque<\/i> responde y da la causa; <i>el porqué<\/i> es un sustantivo, lleva artículo y admite plural, <i>los porqués<\/i>. La forma restante, <i>por que<\/i>, equivale a <i>por el que<\/i> y aparece poco: «la razón por que lo hizo».<\/p>\n\n<h3>El segundo set real<\/h3>\n<p>El de 2018s: ocho palabras sin ninguna tilde, con dos plurales que se acentúan de manera distinta y un adverbio en <i>-mente<\/i>. Se contesta con los tres pasos de siempre, y en las dos vocales juntas, con la pregunta del hiato.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Junto o separado", "estricto": true, "ayuda": "Diez oraciones. Escribe la forma que pide cada una, con su tilde si la lleva: <i>por qué / porque / porqué<\/i>, <i>a ver / haber<\/i>, <i>sino / si no<\/i>, <i>conque / con que<\/i>, <i>entorno / en torno a<\/i>. Aplica la prueba del par antes de escribir.", "items": [{"enun": "No me dijo ______ llegaba tarde.", "sol": "por qué", "porque": "admite «por qué <i>motivo<\/i>»: pregunta indirecta, separado y con tilde"}, {"enun": "Llegó tarde ______ perdió el tren.", "sol": "porque", "porque": "da la causa: junto y sin tilde"}, {"enun": "Nadie entiende el ______ de ese cambio de turno.", "sol": "porqué", "porque": "sustantivo: lleva artículo delante"}, {"enun": "Vamos ______ si esta vez firman.", "sol": "a ver", "porque": "«vamos a <i>mirar<\/i>»: el verbo <i>ver<\/i>"}, {"enun": "Tiene que ______ otra manera de hacerlo.", "sol": "haber", "porque": "el verbo <i>haber<\/i>: existir"}, {"enun": "No quiero el turno de tarde, ______ el de mañana.", "sol": "sino", "porque": "adversativa: contrapone; no admite <i>mañana<\/i> en medio"}, {"enun": "______ firmas hoy, pierdes la plaza.", "sol": "si no", "porque": "admite «si <i>mañana<\/i> no firmas»: condicional negativa"}, {"enun": "Ya has cobrado, ______ no protestes.", "sol": "conque", "porque": "admite <i>así que<\/i>: consecuencia, junto"}, {"enun": "El ______ del polígono no tiene ni una parada.", "sol": "entorno", "porque": "sustantivo, con artículo: el ambiente, los alrededores"}, {"enun": "Discutieron ______ los horarios.", "sol": "en torno a", "porque": "admite <i>alrededor de<\/i>: locución, separada"}], "criterio": "Las diez se resuelven con la prueba de su par, y en las tres de <i>por qué<\/i> lo que decide es la función: pregunta, causa o sustantivo. Las que más se escriben mal en redacciones de adultos son <i>si no<\/i> junto y <i>a ver<\/i> con hache.", "apoyo": ["Los pares y sus pruebas"]}, {"tipo": "hueco", "titulo": "Set 2018s: ponga acento en las palabras que lo necesiten", "estricto": true, "ayuda": "Las ocho palabras del ejercicio de 2018, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>caracteres<\/i>", "conv": "2018s", "sol": "caracteres", "porque": "llana acabada en -s, <i>ca-rac-te-res<\/i>; el singular <i>carácter<\/i> sí lleva, porque la fuerza se mueve al pasar al plural"}, {"enun": "<i>regimenes<\/i>", "conv": "2018s", "sol": "regímenes", "porque": "esdrújula, <i>re-gí-me-nes<\/i>"}, {"enun": "<i>altruista<\/i>", "conv": "2018s", "sol": "altruista", "porque": "llana acabada en vocal; <i>ui<\/i> es diptongo"}, {"enun": "<i>zurzais<\/i>", "conv": "2018s", "sol": "zurzáis", "porque": "aguda acabada en -s"}, {"enun": "<i>ultimatum<\/i>", "conv": "2018s", "sol": "ultimátum", "porque": "llana acabada en -m"}, {"enun": "<i>melifluo<\/i>", "conv": "2018s", "sol": "melifluo", "porque": "llana acabada en vocal; <i>uo<\/i> es diptongo"}, {"enun": "<i>asimismo<\/i>", "conv": "2018s", "sol": "asimismo", "porque": "llana acabada en vocal"}, {"enun": "<i>languidamente<\/i>", "conv": "2018s", "sol": "lánguidamente", "porque": "adverbio en -mente: conserva la tilde de <i>lánguido<\/i>"}], "criterio": "Cuatro llevan tilde y cuatro no. Los dos plurales son la pareja del set: <i>regímenes<\/i> es esdrújula y lleva tilde, y <i>caracteres<\/i> es llana acabada en -s y no la lleva, aunque su singular sí. Los otros dos señuelos son llanas acabadas en vocal con un diptongo dentro.", "apoyo": ["El segundo set real"]}, {"tipo": "cazar", "titulo": "Caza las que van mal escritas", "ayuda": "Un fragmento con faltas de esta familia. Cinco palabras están escritas juntas o separadas al revés de como corresponde: márcalas. Dos de las que parecen faltas están bien.", "items": [{"texto": "No sé porque no me han llamado todavía, pero mañana voy haber si me dicen algo. No es que no quiera el puesto, sino que no puedo empezar antes de las ocho, conque tendrán que cambiarme el turno. Sino me lo cambian, lo entenderé: sobretodo si la razón es el horario. Hablaremos entorno a las condiciones con los demás compañeros.", "faltas": {"porque": "por qué: pregunta indirecta, admite «por qué <i>motivo<\/i>»", "haber": "a ver: «voy a <i>mirar<\/i> si me dicen algo»", "Sino": "Si no: admite «si <i>mañana<\/i> no me lo cambian», condicional", "sobretodo": "sobre todo: significa <i>principalmente<\/i>; junto es un abrigo", "entorno": "en torno a: admite <i>alrededor de<\/i>, locución separada"}}], "criterio": "Las cinco se cazan con la prueba de su par. Las dos que están bien y parecen faltas son <i>sino<\/i>, adversativo —«no es que no quiera, sino que»—, y <i>conque<\/i>, que equivale a <i>así que<\/i>; marcarlas cuenta como error.", "apoyo": ["Los pares y sus pruebas"]}], "cuaderno": {"pieza": 4, "apartados": [4, 5], "ejercicios": [5, 6]}, "cuaderno_txt": "Pieza 4 · Las letras, las palabras que se separan y corregir lo que escribes — apartados 4 y 5: Dos concordancias que descuentan; Los parónimos (p. 39) · ejercicios 5 y 6"}, {"chapa": "Carril B", "titulo": "El primer examen de comentario, y la segunda redacción corta", "meta": "60 minutos · el comentario de 2024s en el carril «El texto» (test y las tres preguntas); el descuento sin tope; la redacción corta con el enunciado de 2017t", "teoria": "<p>Hoy aparece por primera vez el examen de Comentari de text entero: está más abajo, en el carril «El texto», con las seis preguntas de test, las tres abiertas y los dos enunciados de la parte 2. En clase se contestan el test y las tres preguntas sobre la fotocopia del cuadernillo; la redacción de 150-200 se encarga más adelante. Después se escribe la segunda redacción corta, con un enunciado real de 2017t.<\/p>\n\n<h3>El examen de comentario, en una tabla<\/h3>\n<table>\n<tr><th>parte<\/th><th>qué pide<\/th><th>vale<\/th><th>cómo se corrige<\/th><\/tr>\n<tr><td><b>Bloque 1<\/b><\/td><td>seis preguntas de test sobre un texto de 550 a 700 palabras<\/td><td>3 puntos<\/td><td>0,5 por acierto, −0,16 por error, 0 en blanco<\/td><\/tr>\n<tr><td><b>Bloque 2<\/b><\/td><td>título, resumen de un párrafo delimitado, explicar una frase o un concepto relacionándolo con la argumentación<\/td><td>3 puntos<\/td><td>1 punto cada una, en cuartos; de una a cinco líneas; reproducir frases del original se considera incorrecto<\/td><\/tr>\n<tr><td><b>Parte 2<\/b><\/td><td>un texto argumentativo de 150 a 200 palabras, a elegir entre dos enunciados, con dos argumentos como mínimo<\/td><td>4 puntos<\/td><td>adecuación 1, coherencia 1,5, estilo 1,5; −0,5 si baja de 150 o pasa de 200<\/td><\/tr>\n<\/table>\n<p>El cuadernillo trae el texto dos veces, en catalán y en castellano, una versión detrás de la otra. Se lee la castellana y no se pierde un minuto en la otra: son el mismo texto. La clave oficial está redactada en catalán.<\/p>\n\n<h3>El descuento sin tope<\/h3>\n<p>Cada falta de ortografía, léxico, morfología o sintaxis descuenta 0,1 en los dos exámenes. En Llengua castellana el descuento se aplica solo al bloque de expresión y se detiene en 2 puntos. En el comentario se aplica a los 7 puntos que se escriben —el bloque 2 y la parte 2— y no se detiene: veinte faltas son 2 puntos, la mitad de la parte 2, y no hace falta equivocarse en veinte palabras distintas. Con repetir tres veces <i>haber<\/i> por <i>a ver<\/i>, dos <i>porqués<\/i> y una concordancia ya van seis. Por eso el carril A de hoy va de las palabras que se separan.<\/p>\n\n<h3>Devolución de la primera redacción · resumir un párrafo<\/h3>\n<p>Hoy se devuelve la redacción del martes con las cuatro bandas anotadas al margen, y la microtarea es un resumen: el del primer párrafo de la columna de David Trueba, que está en la página del día 7.<\/p>\n\n<h3>Lo que suele salir en la primera devolución<\/h3>\n<p>Tres marcas se repiten en casi todas las primeras redacciones. La tesis sin contraria posible, seguida de dos frases que describen la situación sin justificar nada: se corrige reescribiendo la primera frase hasta que alguien pueda contestarla. Las frases sueltas sin conector, que hacen que el corrector no localice dónde empieza el segundo argumento: se corrige añadiendo <i>además<\/i> o <i>por otra parte<\/i> delante de la segunda razón. Y el cierre que repite la tesis: se corrige preguntando qué pasa si se hace lo que la tesis pide. Las faltas van aparte, en la lista de cada uno, que se abre el 3 de noviembre.<\/p>\n\n<h3>El resumen de un párrafo, en cuatro rasgos<\/h3>\n<p>El 20 de octubre se vio con la clave de 2015s: treinta y nueve palabras, tres líneas; recoge qué pasa, por qué y con qué consecuencia; no repite ninguna secuencia del original; y empieza por «En este párrafo…». Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado. Y el otro error, copiar media frase del original: los criterios lo consideran incorrecto, así que cada idea se dice con otras palabras, cambiando la palabra, cambiando el verbo o resumiendo la cita.<\/p>\n", "ejercicios": [{"tipo": "hueco", "titulo": "El descuento sin tope, con números", "ayuda": "Cinco cuentas. Escribe cuánto descuentan las faltas en cada caso, con coma decimal: 1,2 · 0,5 · 2.", "items": [{"enun": "Un comentario con doce faltas entre el bloque 2 y la parte 2.", "sol": "1,2|1.2", "porque": "0,1 por falta, sin tope: 1,2 puntos"}, {"enun": "Una redacción de Llengua castellana con veinticinco faltas.", "sol": "2|2,0|2.0", "porque": "serían 2,5, pero el descuento se detiene en 2 puntos"}, {"enun": "Un comentario con veinticinco faltas.", "sol": "2,5|2.5", "porque": "sin tope: 2,5 puntos, más de la mitad de la parte 2"}, {"enun": "Una redacción de Llengua castellana con siete faltas.", "sol": "0,7|0.7", "porque": "0,7, por debajo del tope"}, {"enun": "Un comentario de 210 palabras con cuatro faltas.", "sol": "0,9|0.9", "porque": "0,4 por las faltas y 0,5 por pasarse de 200 palabras"}], "criterio": "Las veinticinco faltas son la cuenta que conviene recordar: en castellano descuentan 2 puntos y en el comentario 2,5. Y la extensión de la parte 2 descuenta aparte, medio punto, tanto por bajar de 150 como por pasar de 200.", "apoyo": ["El descuento sin tope"]}, {"tipo": "abierta", "titulo": "La segunda redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante. El enunciado es el real de 2017t, sobre la columna de Trueba que se contestó el 20 de octubre.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Escriba un comentario personal, de entre cincuenta y ochenta palabras, a partir de la siguiente afirmación del texto: «También las redes sociales han potenciado el valor de la opinión corta y contundente por encima de la reflexión y el estudio».»", "conv": "2017t", "modelo": "Creo que las redes han hecho que la opinión rápida valga más que la razonada, y que eso empeora las discusiones. En primer lugar, un mensaje de dos líneas se lee y se comparte en segundos, mientras que un argumento con datos exige pararse. Además, quien contesta el primero se lleva la atención, aunque no sepa del tema. Por eso, cuanto más rápida es la conversación, menos gente se toma el trabajo de estudiar antes de opinar. Setenta y una palabras: tesis, dos razones con conector, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. La afirmación del enunciado ya es una tesis; la redacción tiene que tomar postura sobre ella —a favor, en contra o con matices— y no repetirla.", "apoyo": ["El descuento sin tope"], "usa_texto": false}, {"tipo": "opcion", "titulo": "¿Resume el primer párrafo?", "ops": ["resume el párrafo", "resume el texto entero", "copia frases del original", "deja fuera la consecuencia"], "ayuda": "El enunciado pide: «Resuma el párrafo que va desde <i>Encarna compara<\/i> hasta <i>del precio grande<\/i>». Cinco respuestas: clasifica lo que hace cada una.", "items": [{"enun": "«En este párrafo una compradora elige el paquete de arroz más barato y descubre en casa que, al pesar menos, le ha salido más caro por gramo; el precio por kilo estaba en la etiqueta, pero en letra pequeña.»", "sol": "resume el párrafo", "porque": "qué pasa, por qué y con qué consecuencia, en otras palabras y en tres líneas"}, {"enun": "«Encarna compara dos paquetes de arroz en el pasillo del supermercado y coge el segundo, y en casa descubre que el barato pesa ochocientos gramos y el caro un kilo.»", "sol": "copia frases del original", "porque": "dos secuencias enteras del texto; los criterios lo consideran incorrecto"}, {"enun": "«El texto explica que los fabricantes reducen el contenido de los envases sin cambiar el precio y que la mayoría de los compradores no mira el precio por kilo.»", "sol": "resume el texto entero", "porque": "los envases y la encuesta están en el segundo párrafo, fuera de las dos palabras del enunciado"}, {"enun": "«En este párrafo una mujer compra el arroz más barato de dos que compara.»", "sol": "deja fuera la consecuencia", "porque": "falta lo que descubre en casa, y sin esa consecuencia el resumen se queda sin la conclusión del párrafo"}, {"enun": "«En este párrafo, una clienta escoge el arroz de menor precio y luego comprueba que el paquete trae menos cantidad, de modo que cada gramo le cuesta más que en el paquete grande; el dato figuraba en la etiqueta, en un tamaño de letra menor que el precio.»", "sol": "resume el párrafo", "porque": "las dos mitades, con otras palabras; cuarenta y una palabras"}], "criterio": "Los dos que resumen bien dicen lo mismo con palabras distintas entre sí y distintas de las del texto, y los dos ocupan tres líneas. Los otros tres son los tres fallos que se corrigen en clase: copiar, salirse del párrafo y dejar el resumen sin la consecuencia.", "apoyo": ["El resumen de un párrafo, en cuatro rasgos"]}, {"tipo": "abierta", "titulo": "La microtarea de hoy: dos resúmenes", "ayuda": "Tres líneas cada uno, empezando por «En este párrafo…», sin copiar ninguna secuencia del original. El de Trueba, que se leyó el 20 de octubre, se entrega hoy.", "items": [{"enun": "Resume el primer párrafo de «Recuperar ciertos complejos», de David Trueba (página del día 7), desde <i>No es raro ver<\/i> hasta <i>es fabricar un imbécil<\/i>.", "modelo": "En este párrafo el autor describe una época en la que la ignorancia opina sin vergüenza y las redes premian la frase corta sobre el estudio, y sostiene que algunos complejos hacen falta: reconocer que otro sabe más es tan razonable como admitir que Usain Bolt corre más que nosotros. Cuarenta y ocho palabras: qué describe, qué defiende y con qué ejemplo, sin ninguna secuencia del original."}, {"enun": "Resume el tercer párrafo del texto de hoy, desde <i>Otra «estrella» de la psicolingüística<\/i> hasta <i>la supervivencia y la reproducción<\/i>.", "modelo": "En este párrafo se expone la posición contraria a la de Chomsky: para Pinker y su discípulo Bloom el lenguaje acompaña a la especie desde siempre, todas las lenguas resultan igual de complejas y sirven para comunicarse, y sus elementos se afinaron por selección natural como cualquier otro órgano. Cuarenta y ocho palabras, sin ninguna secuencia del original."}], "criterio": "Se corrige con los cuatro rasgos: tres líneas, qué pasa y con qué consecuencia, ninguna secuencia copiada y el arranque que sitúa. Una respuesta que resuma el texto entero en lugar del párrafo pedido se queda en la banda baja aunque esté bien escrita.", "apoyo": ["El resumen de un párrafo, en cuatro rasgos"]}], "cuaderno": {"pieza": 11, "apartados": [3, 4, 8], "ejercicios": [6, 7, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3, 4 y 8: Las dos rúbricas, banda por banda; El registro; Las tres preguntas fijas del comentario (p. 66, 70 y 78) · ejercicios 6, 7 y 8"}, {"chapa": "El texto", "titulo": "El origen del lenguaje · Comentari de text 2024, tribunal especial", "meta": "Convocatoria 2024, tribunal especial · 618 palabras · el primer examen de comentario entero: test, las tres preguntas y los dos enunciados de la parte 2", "literal": true, "teoria": "<p>Este es el texto de comentario que se contesta hoy en clase, en su versión castellana, tal como lo reproduce el cuadernillo de 2024 (tribunal especial); aquí está para volver a él en casa. Es un ensayo de divulgación de 618 palabras, el doble que los de Llengua castellana, y trae las nueve preguntas del examen: seis de test, las tres fijas del bloque 2 y los dos enunciados de la parte 2. La clave oficial está redactada en catalán; las respuestas modelo de aquí son su traducción. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "El origen del lenguaje", "entrada": "José C. Vales · <i>Enseñar a hablar a un monstruo. Sobre el origen del lenguaje, de las lenguas y de la escritura<\/i> (Barcelona: Destino, 2022, pp. 21-27) · adaptación, tal como la reproduce el cuadernillo de Comentari de text de 2024 (tribunal especial), versión castellana.", "lineas": ["El origen de las lenguas siempre ha estado entre los", "principales intereses de los intelectuales y eruditos de todos", "los tiempos. Desde los historiadores griegos a las últimas", "ocurrencias más o menos científicas, el ser humano ha sentido", "la ineludible necesidad de explicar el fenómeno del lenguaje.", "En la actualidad, muchos científicos del campo de la", "psicología cognitiva afirman que el surgimiento del lenguaje", "es probablemente «el problema científico más atractivo y", "difícil que puede plantearse» en la disciplina lingüística.", "", "Noam Chomsky, uno de los grandes lingüistas de nuestro tiempo,", "propuso una idea (conocida hoy como «teoría de la", "discontinuidad») para explicar el paso de una sociedad humana", "sin lenguaje a una sociedad humana con lenguaje. La teoría de", "la discontinuidad, en resumen, sugiere que hace unos cien mil", "años se produjo una mutación genética que propició de manera", "instantánea —y asombrosamente— la facultad lingüística. La", "teoría se denomina a veces «catastrofista», porque se atiene a", "la terminología matemática, según la cual una mínima", "alteración en los parámetros de un sistema dinámico provoca un", "cambio brusco y definitivo: en este caso, una leve mutación", "habría propiciado el prodigioso nacimiento del lenguaje. El", "ideólogo de la GU (gramática universal) no descartaba que", "hubiera existido alguna ventaja evolutiva en la aparición del", "lenguaje, pero afirmaba que los orígenes fueron seguramente", "«accidentales». Para la mayoría de los especialistas, sin", "embargo, la hipótesis de la mutación genética repentina es tan", "inverosímil como la historia de Osiris descendiendo sobre las", "aguas del Nilo y entregándoles a los humildes egipcios el", "recetario de la cerveza. Aunque Chomsky estuviera en lo", "cierto, dicen sus detractores, el proceso de adquisición del", "lenguaje se explicaría mejor desde la evolución y la", "continuidad (esto es, desde un desarrollo progresivo), y así", "lo admiten hoy la mayoría de los especialistas.", "", "Otra «estrella» de la psicolingüística, Steven Pinker,", "consideró en su momento que el lenguaje era una facultad", "intrínsecamente humana y que, por lo tanto, bastó el tiempo y", "la ocasión para que se desarrollara: fue, en definitiva, una", "adaptación biológica propia de la selección natural. Una de", "las ideas centrales de las propuestas iniciales de Steven", "Pinker y su discípulo Paul Bloom fue que la humanidad siempre", "ha tenido lenguaje. Pinker y Bloom también recordaron que", "todas las lenguas eran igual de complejas y servían, todas,", "para una misma función: la comunicación. La propuesta de", "Pinker y Bloom era que todos los elementos que integran el", "lenguaje evolucionaron y se refinaron con la misma precisión", "que cualquier otro órgano, impulsados por la supervivencia y", "la reproducción.", "", "Estas dos teorías de índole psicolingüística atañen a las", "operaciones y relaciones entre los procesos cognitivos y los", "procesos comunicativos. Pero quizá Chomsky tenía razón cuando", "apuntaba que tal vez habría que empezar por la biología. Y ¿de", "qué hablaban los cazadores recolectores de la tundra siberiana", "o de la sabana africana (si es que hablaban de algo)? Desde", "luego, dicen los expertos, aquellos seres primitivos", "(anteriores a los neandertales) tuvieron que comunicarse en", "alguna especie de lengua.", "", "Si tuviéramos que avanzar alguna idea sobre cómo serían", "aquellas «lenguas primigenias» (llamadas protosapiens,", "protohumanas o protomundo), seguramente optaríamos por hablar", "de gruñidos, alaridos, gritos, chillidos u otras formas más o", "menos simples de comunicar las nociones esenciales de la vida", "salvaje. Pero es difícil concebir esos alaridos como un", "lenguaje, especialmente si concretamos la definición de", "lenguaje como la facultad de comunicar algo «mediante signos", "vocales convencionales». Claro que es importante saber cuándo", "empezaron los homínidos a señalar los árboles, o los", "depredadores, o los ríos, o las piedras. Pero resulta aún más", "interesante entender que en un momento dado se cruzó el", "«umbral» lingüístico en el que se comenzaron a nombrar", "entidades abstractas."], "pie": "Adaptación de un fragmento de <i>Enseñar a hablar a un monstruo<\/i>, de José C. Vales (Destino, 2022), en la versión del cuadernillo oficial de la PAU +25 de 2024, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2024_general_comentari_de_text_suplent.pdf<\/i>, p. 4."}, "ejercicios": [{"tipo": "opcion", "titulo": "Bloque 1: las seis preguntas de test", "ayuda": "Literales, con su respuesta oficial. Diez minutos de reloj. Localiza el «falsa» de la 1.3 antes de leer sus opciones, y subraya <i>antónimo<\/i> en la 1.6.", "items": [{"enun": "<b>1.1<\/b> ¿Cuál es la principal intención del autor con este texto?", "conv": "2024s", "ops": ["Presentar distintas teorías sobre el origen del lenguaje.", "Explicar qué son las lenguas.", "Criticar la teoría de Chomsky sobre el origen del lenguaje.", "Defender la teoría de la discontinuidad."], "sol": "Presentar distintas teorías sobre el origen del lenguaje.", "porque": "global: el autor presenta teorías sin tomar partido; la c) y la d) le atribuyen una postura que no defiende"}, {"enun": "<b>1.2<\/b> ¿A qué se refiere el autor con la expresión <i>lenguas primigenias<\/i>?", "conv": "2024s", "ops": ["A lenguas primitivas.", "A las lenguas de los neandertales.", "A lenguas muy evolucionadas.", "A lenguas especialmente complejas."], "sol": "A lenguas primitivas.", "porque": "léxico: <i>primigenio<\/i> es lo primero, lo originario; el último párrafo las llama protosapiens y protomundo"}, {"enun": "<b>1.3<\/b> Según lo que se expone y se puede inferir del texto, ¿cuál de las siguientes afirmaciones es falsa?", "conv": "2024s", "ops": ["Según Pinker, el lenguaje es una adaptación biológica propia de la selección natural.", "La teoría de la discontinuidad defiende un desarrollo progresivo en la adquisición del lenguaje.", "Pinker y Bloom defienden la equicomplejidad de las lenguas.", "El origen de las lenguas interesa a especialistas de ámbitos diversos."], "sol": "La teoría de la discontinuidad defiende un desarrollo progresivo en la adquisición del lenguaje.", "porque": "el NO disfrazado, sin mayúsculas: la discontinuidad defiende una mutación instantánea, lo contrario de un desarrollo progresivo"}, {"enun": "<b>1.4<\/b> Tal y como se utiliza en el texto, el término <i>inverosímil<\/i>", "conv": "2024s", "ops": ["significa ‘que no tiene apariencia de verdadero’.", "es antónimo de improbable, imposible, increíble.", "significa ‘creíble por no ofrecer carácter alguno de falsedad’.", "es sinónimo de plausible, posible, probable."], "sol": "significa ‘que no tiene apariencia de verdadero’.", "porque": "dos opciones dan una relación —antónimo de, sinónimo de— donde se pide un significado, y las dos son falsas además"}, {"enun": "<b>1.5<\/b> Según lo que se puede inferir del texto, podemos decir que", "conv": "2024s", "ops": ["Pinker propone el concepto de gramática universal.", "las teorías catastrofistas defienden un desarrollo progresivo de la capacidad del lenguaje.", "de acuerdo con Pinker el lenguaje no es una facultad específicamente humana.", "las «lenguas primigenias» no podrían considerarse lenguaje aunque fueran un sistema de comunicación."], "sol": "las «lenguas primigenias» no podrían considerarse lenguaje aunque fueran un sistema de comunicación.", "porque": "global de inferencia: el último párrafo sostiene que es difícil concebir esos alaridos como un lenguaje"}, {"enun": "<b>1.6<\/b> De entre las siguientes opciones, elija un antónimo para el adjetivo <i>ineludible<\/i> en el texto.", "conv": "2024s", "ops": ["Inexcusable.", "Inexorable.", "Ineluctable.", "Evitable."], "sol": "Evitable.", "porque": "<i>inexcusable<\/i>, <i>inexorable<\/i> e <i>ineluctable<\/i> son sinónimos de <i>ineludible<\/i>; el mismo diseño que el de <i>ilusa<\/i> de 2016"}], "criterio": "Las dos globales apuntan en direcciones contrarias: la 1.1 pregunta qué hace el autor —presentar teorías, sin tomar partido— y la 1.5 pide inferir una conclusión concreta. Las dos de léxico están construidas al revés de lo habitual: la 1.4 mezcla definiciones con relaciones, y la 1.6 pone tres sinónimos donde pide un antónimo.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Bloque 2: las tres preguntas fijas", "ayuda": "De una a cinco líneas cada una, sin reproducir frases del original. Se puntúan en cuartos según la precisión.", "items": [{"enun": "<b>2.1<\/b> Proponga un título que se adecúe al contenido del texto que acaba de leer.", "conv": "2024s", "modelo": "Clave oficial, traducida: <i>Teorías sobre el origen del lenguaje<\/i> · <i>El misterio del origen del lenguaje<\/i> · <i>De las lenguas primigenias al lenguaje<\/i>. Los tres son sintagmas nominales sin verbo, y los tres nombran el tema del texto entero."}, {"enun": "<b>2.2<\/b> Resuma el último párrafo del texto (es decir, desde «Si tuviéramos que avanzar alguna idea» hasta «en el que se comenzaron a nombrar entidades abstractas»).", "conv": "2024s", "modelo": "Clave oficial, traducida: «Las lenguas primigenias pueden considerarse sistemas de comunicación, pero no lenguaje. Para hablar de lenguaje hace falta disponer de un sistema de signos vocales convencionales que, además de entidades concretas, puedan designar entidades abstractas.» Treinta y cuatro palabras y dos movimientos: lo que las lenguas primigenias sí son, y lo que les falta para ser lenguaje."}, {"enun": "<b>2.3<\/b> Explique, relacionándolo con la argumentación del texto, qué se entiende por <i>selección natural<\/i>.", "conv": "2024s", "modelo": "Clave oficial, traducida: «La selección natural es el proceso por el que los organismos mejor adaptados desplazan a los menos adaptados mediante la acumulación lenta de cambios genéticos favorables a lo largo de las generaciones. La selección natural hace que las poblaciones se adapten o se vuelvan cada vez más adecuadas a su entorno con el paso del tiempo.» La clave se queda en la definición, con sus dos oraciones, y no explica para qué aparece el concepto en el texto, aunque su propio enunciado lo pide; lo prudente es añadir la segunda mitad: Pinker se apoya en la selección natural para sostener que el lenguaje es una adaptación biológica, que evolucionó como cualquier otro órgano."}], "criterio": "Las tres admiten fracciones —0,25, 0,5, 0,75— según la precisión de la respuesta. El título que da la opinión del lector en lugar del contenido del texto, el resumen que se sale del párrafo delimitado y la explicación que no ata el concepto al argumento contestan a medias, y una frase copiada del original se considera incorrecta.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Parte 2: la redacción de 150 a 200 palabras", "ayuda": "Hoy no se escribe: es la primera redacción larga del curso, que se encarga el 5 de noviembre para el 10. Queda aquí para escribirla entonces, con el contador de palabras. Se elige UNA de las dos opciones.", "palabras": {"min": 150, "max": 200}, "items": [{"enun": "«Opción A. ¿Cómo sería la vida sin lenguaje? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que reflexione sobre la importancia del lenguaje para los humanos. Su texto debe incluir como mínimo dos argumentos.» · «Opción B. ¿Conceden los hablantes al lenguaje la importancia que tiene? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a esta pregunta. Su texto debe incluir como mínimo dos argumentos.»", "conv": "2024s", "modelo": "Sin clave: se corrige con la rúbrica del comentario —adecuación 1, coherencia 1,5, estilo 1,5—, con el recuento de palabras y con el descuento por faltas sin tope. La respuesta tiene que quedar establecida y llevar dos argumentos válidos y distintos, 0,5 cada uno; en 150-200 palabras entra la concesión entera, recomendada y no obligatoria."}], "criterio": "Los criterios del comentario lo exigen con estas palabras: dos argumentos válidos y diferentes, 0,5 cada uno; y −0,5 por bajar de 150 palabras o pasar de 200. Contar las palabras al final no es opcional.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [4]}, {"pieza": "TEXTOS", "apartados": [4]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 4: Comentari de text 2024, tribunal especial · el origen del lenguaje (p. 255) · Los textos de cada sesión — apartado 4: «El origen del lenguaje» · texto de examen"}, {"chapa": "Carril C", "titulo": "La tanda: léxico y fraseología", "meta": "10 minutos · seis ítems reales de exámenes que no se leen en clase, y uno propio", "teoria": "<p>El jueves se dieron la sinonimia parcial y el co-hipónimo, el antónimo con el enunciado subrayado, la prueba del hiperónimo y el sentido figurado. Hoy la tanda son ítems reales de léxico de exámenes cuyo texto no se lee en clase: cuatro formatos, sinónimo, antónimo, hiperónimo y significado de una expresión en su contexto, más una abierta de sinónimo y otra de refrán. Cada uno lleva su chapa y su clave oficial.<\/p>\n\n<h3>Qué pide cada uno<\/h3>\n<p>El hiperónimo se falla más que los otros tres formatos, porque las opciones traen sinónimos de la palabra —que nombran lo mismo— y el hiperónimo nombra la clase: la prueba es «un tufo es un efluvio» frente a «un efluvio es un tufo». En el antónimo, tres de las cuatro opciones pueden ir en la misma dirección que la palabra. En las abiertas, la respuesta se comprueba sustituyendo la palabra propuesta en la oración original y leyéndola entera.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Cinco reales y uno propio", "ayuda": "Seis ítems con cuatro opciones. Los cinco con chapa de año son literales del examen, con su clave oficial. Sustituye la palabra por cada opción, y en el hiperónimo aplica la prueba de la clase.", "items": [{"enun": "Indique cuál de las siguientes palabras es el hiperónimo de <i>tufo<\/i>.", "conv": "2015t", "ops": ["Hedor.", "Humo.", "Peste.", "Efluvio."], "sol": "Efluvio.", "porque": "<i>hedor<\/i> y <i>peste<\/i> son sinónimos de <i>tufo<\/i>, no hiperónimos; <i>humo<\/i> no cumple ninguna de las dos relaciones. Un tufo es una clase de efluvio"}, {"enun": "Indique cuál de los siguientes verbos es un antónimo de <i>vislumbrar<\/i> en el texto.", "conv": "2016s", "ops": ["Conjeturar.", "Omitir.", "Presumir.", "Deducir."], "sol": "Omitir.", "porque": "tres distractores del mismo terreno: <i>conjeturar<\/i>, <i>presumir<\/i> y <i>deducir<\/i> son maneras de acercarse a una idea; solo <i>omitir<\/i> va en dirección contraria"}, {"enun": "Proponga un sinónimo de <i>reputadas<\/i>.", "conv": "2025t", "ops": ["Modernas.", "Típicas.", "Punteadas.", "Célebres."], "sol": "Célebres.", "porque": "reputado significa 'que tiene buena fama'; <i>punteadas<\/i> está puesta por el parecido de letras"}, {"enun": "¿Cuál es el significado de <i>no emanaban de él<\/i> en la oración «Ciertamente, no emanaban de él, pero eso carecía de importancia»?", "conv": "2025s", "ops": ["No los había pagado él.", "No eran obra suya.", "Él no los había comprendido.", "No los había ordenado él."], "sol": "No eran obra suya.", "porque": "<i>emanar de<\/i> es salir de, proceder de: los libros no eran obra suya"}, {"enun": "Proponga un sinónimo de <i>se ubique<\/i> en el siguiente fragmento del texto: «también para que uno se reconozca, se ubique, se encuentre con los suyos».", "conv": "2026s", "ops": ["Se comporte.", "Se sitúe.", "Se organice.", "Se disfrace."], "sol": "Se sitúe.", "porque": "ubicarse es situarse; la frase sostiene que la ropa sirve para que uno sepa dónde está respecto de los demás"}, {"enun": "¿Cuál de las siguientes palabras es el hiperónimo de <i>tornillo<\/i>?", "ops": ["Pieza.", "Clavo.", "Tuerca.", "Martillo."], "sol": "Pieza.", "porque": "el mismo diseño que el de <i>tufo<\/i>: <i>clavo<\/i> y <i>tuerca<\/i> son co-hipónimos, otros objetos de ferretería; <i>martillo<\/i> es la herramienta que lo acompaña"}], "criterio": "Los dos hiperónimos, el real y el propio, se resuelven con la misma prueba de la clase; el antónimo de 2016s y el sinónimo de 2025t, sustituyendo la palabra por cada opción; y los dos de expresión, leyendo la oración entera del texto.", "apoyo": ["Qué pide cada uno"], "usa_texto": false}, {"tipo": "hueco", "titulo": "La abierta de sinónimo: 2026t", "ayuda": "Escribe un sinónimo. La clave admite seis; se corrige sustituyendo la palabra en la oración.", "items": [{"enun": "Escriba un sinónimo del adjetivo que aparece subrayado en la siguiente oración del texto: «corremos el riesgo <u>perentorio<\/u> de convertirnos en una Venecia sin canales ni barceloneses».", "conv": "2026t", "sol": "imperioso|apremiante|acuciante|urgente|inaplazable|impostergable|inminente|apremiantes|urgentes", "porque": "la clave admite <i>imperioso<\/i>, <i>apremiante<\/i>, <i>acuciante<\/i>, <i>urgente<\/i>, <i>inaplazable<\/i> e <i>impostergable<\/i>: perentorio significa que no admite espera"}], "criterio": "Es un adjetivo culto, y la clave admite seis respuestas. Se corrige por sustitución: «corremos el riesgo urgente de convertirnos…» se sostiene, y <i>peligroso<\/i> o <i>grave<\/i> no significan lo mismo.", "apoyo": ["Qué pide cada uno"], "usa_texto": false}, {"tipo": "abierta", "titulo": "La abierta de refrán: 2016s", "ayuda": "Dos líneas, con tus palabras.", "items": [{"enun": "Explique con sus propias palabras el significado del refrán español <i>no es oro todo lo que reluce<\/i>, que aparece en el texto.", "conv": "2016s", "modelo": "Clave oficial: que las apariencias engañan; lo que brilla por fuera puede no valer lo que aparenta. Una respuesta que repita las palabras del refrán —«que no todo lo que brilla es oro»— no lo explica."}], "criterio": "Se da el punto si la explicación recoge el sentido sin usar las palabras del refrán, y si se entiende sin conocerlo.", "apoyo": ["Qué pide cada uno"], "usa_texto": false}], "cuaderno": {"pieza": 5, "apartados": [1, 2, 3, 4]}, "cuaderno_txt": "Pieza 5 · Significado, figuras y sentido figurado — apartados 1, 2, 3 y 4: Sinonimia, y el distractor co-hipónimo; Antonimia; Hiperonimia, polisemia y homonimia; Literal y figurado (p. 159, 161 y 162)"}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto de José C. Vales (Destino, 2022), reproducido en el carril «El texto» en la adaptación del cuadernillo de 2024, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>

  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';

  function el(t, cls, txt) {

  function aviso(txt) {

  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».

  function tiene(texto, v) {

            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
