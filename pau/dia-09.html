<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 9 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 9, "fecha": "2026-10-27", "tab": "Día 9 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 27 de octubre", "sub": "Concordancias, parónimos y el set de 2018s · el primer examen de comentario (2024s), la segunda redacción corta y el resumen de un párrafo · la tanda de léxico", "carriles": [{"chapa": "Carril A", "titulo": "Concordancias y parónimos · set 2018s", "meta": "20 minutos · <i>había<\/i> sin plural, la preposición delante de <i>que<\/i> y el artículo de <i>agua<\/i>; los parónimos que aparecen en prensa; el segundo set real, 2018s", "teoria": "<h3>Pieza 4 · 4 · Tres concordancias que descuentan<\/h3>\n<p><strong>«Había» no tiene plural cuando significa <em>existía<\/em>.<\/strong> Se dice <em>había sillas<\/em>, <em>hubo problemas<\/em>, <em>ha habido quejas<\/em>: el sustantivo que va detrás funciona como complemento directo y no como sujeto, así que el verbo no concuerda con él. <em>Habían sillas<\/em> es falta.<\/p>\n<p><strong>La preposición se mantiene delante de la subordinada.<\/strong> Si se dice <em>se acordó <\/em><em>de<\/em><em> su turno<\/em>, también se dice <em>se acordó <\/em><em>de que<\/em><em> tenía turno<\/em>. Quitar el <em>de<\/em> —<em>se acordó que tenía turno<\/em>— es falta; ponerlo donde no va —<em>pienso de que<\/em>— también.<\/p>\n<p><strong>Y un verbo que admite las dos construcciones:<\/strong> <em>informar<\/em>. La Academia da por buenas <em>informó <\/em><em>de que<\/em><em> llegaba<\/em> y <em>informó que llegaba<\/em>, porque <em>informar<\/em> funciona en América como los verbos de decir y en España con <em>de<\/em>. En el examen conviene escribir <em>de que<\/em>, que es la forma habitual aquí, pero un corrector no puede contarla como falta al revés.<\/p>\n<p><strong>El artículo de <em>agua<\/em>.<\/strong> Los sustantivos femeninos que empiezan por <em>a-<\/em> o <em>ha-<\/em> tónicas llevan <em>el<\/em> y <em>un<\/em> en singular y siguen siendo femeninos: <em>el agua fría<\/em>, <em>un hacha afilada<\/em>, <em>el hambre atrasada<\/em>. El adjetivo concuerda en femenino, el plural recupera <em>las<\/em> —<em>las aguas<\/em>, <em>las hachas<\/em>— y los demostrativos y los indefinidos van en femenino: <em>esta agua<\/em>, <em>esa hacha<\/em>, <em>mucha hambre<\/em>. ⊗<em>Este agua<\/em> y ⊗<em>mucho hambre<\/em> son faltas.<\/p>\n<h3>Pieza 4 · 5 · Los parónimos<\/h3>\n<p>Son pares de palabras que se parecen en la forma y no significan lo mismo; a veces significan lo contrario. No las pregunta ningún ítem, y usar una por la otra en la redacción cuenta como <strong>falta de léxico<\/strong>, que descuenta lo mismo que una tilde.<\/p>\n<table>\n<thead>\n<tr>\n<th>par<\/th>\n<th>uno<\/th>\n<th>el otro<\/th>\n<th>la frase que los separa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>infringir / infligir<\/strong><\/td>\n<td>incumplir una norma<\/td>\n<td>causar un daño<\/td>\n<td><em>infringir<\/em> el reglamento · <em>infligir<\/em> un castigo<\/td>\n<\/tr>\n<tr>\n<td><strong>prejuicio / perjuicio<\/strong><\/td>\n<td>idea previa sin fundamento<\/td>\n<td>daño<\/td>\n<td>tener <em>prejuicios<\/em> · causar un <em>perjuicio<\/em> económico<\/td>\n<\/tr>\n<tr>\n<td><strong>actitud / aptitud<\/strong><\/td>\n<td>manera de comportarse<\/td>\n<td>capacidad para algo<\/td>\n<td>mala <em>actitud<\/em> con los compañeros · <em>aptitudes<\/em> para el puesto<\/td>\n<\/tr>\n<tr>\n<td><strong>accesible / asequible<\/strong><\/td>\n<td>al que se puede llegar o tratar<\/td>\n<td>de precio al alcance<\/td>\n<td>un jefe <em>accesible<\/em> · un alquiler <em>asequible<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>inocuo / inicuo<\/strong><\/td>\n<td>que no hace daño<\/td>\n<td>injusto<\/td>\n<td>un producto <em>inocuo<\/em> · un reparto <em>inicuo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>fragante / flagrante<\/strong><\/td>\n<td>que huele bien<\/td>\n<td>evidente, en el momento<\/td>\n<td>un jardín <em>fragante<\/em> · un caso <em>flagrante<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>bimensual / bimestral<\/strong><\/td>\n<td>dos veces al mes<\/td>\n<td>cada dos meses<\/td>\n<td>una revista <em>bimensual<\/em> · una revisión <em>bimestral<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>vasto / basto<\/strong><\/td>\n<td>extenso<\/td>\n<td>tosco<\/td>\n<td>un <em>vasto<\/em> terreno · un tejido <em>basto<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>adición / adicción<\/strong><\/td>\n<td>suma<\/td>\n<td>dependencia de algo<\/td>\n<td>la <em>adición<\/em> de los gastos · una <em>adicción<\/em> al juego<\/td>\n<\/tr>\n<tr>\n<td><strong>rebelarse / revelar<\/strong><\/td>\n<td>levantarse contra algo<\/td>\n<td>dar a conocer lo que estaba oculto<\/td>\n<td><em>rebelarse<\/em> contra la orden · <em>revelar<\/em> el resultado<\/td>\n<\/tr>\n<tr>\n<td><strong>infectado / infestado<\/strong><\/td>\n<td>invadido por gérmenes<\/td>\n<td>invadido en gran número, por una plaga<\/td>\n<td>una herida <em>infectada<\/em> · un almacén <em>infestado<\/em> de ratas<\/td>\n<\/tr>\n<tr>\n<td><strong>apertura / abertura<\/strong><\/td>\n<td>acción de abrir, o comienzo<\/td>\n<td>hueco o grieta<\/td>\n<td>la <em>apertura<\/em> del expediente · una <em>abertura<\/em> en el techo<\/td>\n<\/tr>\n<tr>\n<td><strong>alimenticio / alimentario<\/strong><\/td>\n<td>que alimenta<\/td>\n<td>relativo a la alimentación<\/td>\n<td>un producto <em>alimenticio<\/em> · el sector <em>alimentario<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>ingerir / injerirse<\/strong><\/td>\n<td>tragar<\/td>\n<td>meterse en asuntos ajenos<\/td>\n<td><em>ingerir<\/em> el medicamento · <em>injerirse<\/em> en la discusión<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La lista entera, treinta pares, está en el anexo A-4<\/strong>, que es material de consulta y no de clase. Aquí van los catorce que aparecen en prensa y en redacciones de adultos.<\/p>\n<p><strong>Cómo se estudian.<\/strong> De los catorce, a tu lista de diez —la del apartado 6— solo pasan los que hayas usado mal alguna vez, y se apuntan con la frase entera donde apareció el error, no como pareja suelta. <em>Aptitud<\/em> y <em>actitud<\/em> se recuerdan mejor en «tiene aptitudes para el puesto y mala actitud con los compañeros» que en columnas enfrentadas.<\/p>\n<h3>Anexo A-3 · El gimnasio: sets de tildes y formas verbales<\/h3>\n<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de diez de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de diez, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "ejercicios": [{"tipo": "hueco", "titulo": "¿Falta o no? Corrige la que la tenga", "dossier": {"cuaderno": "4", "ejercicio": 5}, "ayuda": "Escribe la parte en negrita corregida; si está bien, escríbela igual.", "items": [{"enun": "«<b>Habían<\/b> tres personas esperando en la oficina.»", "sol": "Había", "porque": "falta: <i>haber<\/i> de existir no tiene plural; <i>tres personas<\/i> es el complemento", "corto": false}, {"enun": "«<b>Hubo<\/b> quejas durante todo el mes.»", "sol": "Hubo", "porque": "correcta: en singular, con <i>quejas<\/i> de complemento", "corto": false}, {"enun": "«Me <b>informó que<\/b> el contrato se acababa.»", "sol": "informó que|informó de que", "porque": "no es falta: <i>informar<\/i> admite las dos, <i>me informó de que<\/i> y <i>me informó que<\/i>; en España es más habitual <i>de que<\/i>", "corto": false}, {"enun": "«Se <b>acordó de que<\/b> tenía turno.»", "sol": "acordó de que", "porque": "correcta: <i>acordarse <b>de<\/b> algo<\/i>", "corto": false}, {"enun": "«<b>Han habido<\/b> problemas con las nóminas de marzo.»", "sol": "Ha habido", "porque": "falta: <i>haber<\/i> impersonal no tiene plural ni en los tiempos compuestos", "corto": false}, {"enun": "«<b>Pienso de que<\/b> la reunión sobra.»", "sol": "Pienso que", "porque": "falta: <i>pensar<\/i> no pide <i>de<\/i>", "corto": false}, {"enun": "«Estoy <b>seguro de que<\/b> lo firmaron ayer.»", "sol": "seguro de que", "porque": "correcta: <i>estar seguro <b>de<\/b> algo<\/i>", "corto": false}, {"enun": "«<b>Habrán<\/b> muchos días de espera.»", "sol": "Habrá", "porque": "falta: <i>haber<\/i> de existir no tiene plural", "corto": false}], "criterio": "Cuatro son falta y cuatro no. <i>Haber<\/i> cuando significa <i>existir<\/i> no tiene plural en ningún tiempo, y la preposición se queda delante de la subordinada cuando el verbo la pide: <i>acordarse de que<\/i>, <i>estar seguro de que<\/i>; <i>pensar<\/i> no la pide. <i>Informar<\/i> admite las dos construcciones.", "apoyo": ["Pieza 4 · 4 · Tres concordancias que descuentan"], "dossier_txt": "Del dossier: pieza 4, ejercicio 5"}, {"tipo": "opcion", "titulo": "Parónimos: elige", "dossier": {"cuaderno": "4", "ejercicio": 6}, "ayuda": "Elige la palabra del paréntesis en negrita. La oración con dos paréntesis aparece dos veces, una por cada uno.", "estricto": true, "items": [{"enun": "La multa es por <b>(infringir / infligir)<\/b> la norma de ruidos del barrio.", "sol": "infringir", "porque": "se incumple una norma; <i>infligir<\/i> es causar un daño", "ops": ["infligir", "infringir"]}, {"enun": "No es caro: es un precio <b>(accesible / asequible)<\/b>.", "sol": "asequible", "porque": "se habla de precio; <i>accesible<\/i> se dice de un trato o de un sitio", "ops": ["accesible", "asequible"]}, {"enun": "Tiene mucha <b>(actitud / aptitud)<\/b> para el trato con clientes, pero mala (actitud / aptitud) con los compañeros.", "sol": "aptitud", "porque": "capacidad para algo", "ops": ["actitud", "aptitud"]}, {"enun": "Tiene mucha (actitud / aptitud) para el trato con clientes, pero mala <b>(actitud / aptitud)<\/b> con los compañeros.", "sol": "actitud", "porque": "manera de comportarse", "ops": ["actitud", "aptitud"]}, {"enun": "La revisión del contador es <b>(bimensual / bimestral)<\/b>: cada dos meses.", "sol": "bimestral", "porque": "la propia frase trae «cada dos meses»; <i>bimensual<\/i> es dos veces al mes", "ops": ["bimensual", "bimestral"]}, {"enun": "Lleva dos años en tratamiento por una <b>(adición / adicción)<\/b> al juego.", "sol": "adicción", "porque": "dependencia; <i>adición<\/i> es una suma", "ops": ["adicción", "adición"]}, {"enun": "El informe <b>(reveló / rebeló)<\/b> que el contrato llevaba un año caducado.", "sol": "reveló", "porque": "dio a conocer lo oculto; <i>rebelarse<\/i>, que es pronominal, significa levantarse contra algo", "ops": ["reveló", "rebeló"]}, {"enun": "La <b>(apertura / abertura)<\/b> del expediente se anunció en el tablón.", "sol": "apertura", "porque": "un expediente se abre; una <i>abertura<\/i> es un hueco", "ops": ["apertura", "abertura"]}, {"enun": "El convenio de la industria <b>(alimenticia / alimentaria)<\/b> se firma en marzo.", "sol": "alimentaria", "porque": "indica de qué sector es el convenio; <i>alimenticio<\/i> se dice de lo que alimenta", "ops": ["alimentaria", "alimenticia"]}, {"enun": "La empresa le causó un <b>(prejuicio / perjuicio)<\/b> de seis mil euros.", "sol": "perjuicio", "porque": "daño; <i>prejuicio<\/i> es una idea previa", "ops": ["prejuicio", "perjuicio"]}, {"enun": "El almacén está <b>(infectado / infestado)<\/b> de ratas.", "sol": "infestado", "porque": "plaga; <i>infectado<\/i> sería por gérmenes", "ops": ["infectado", "infestado"]}, {"enun": "Le pidieron que no se <b>(ingiriera / injiriera)<\/b> en la discusión.", "sol": "injiriera", "porque": "meterse en algo ajeno; <i>ingerir<\/i> es tragar", "ops": ["injiriera", "ingiriera"]}, {"enun": "El reparto de turnos, con los mismos cuatro en todos los festivos, les pareció <b>(inocuo / inicuo)<\/b>.", "sol": "inicuo", "porque": "injusto; <i>inocuo<\/i> significa que no hace daño", "ops": ["inicuo", "inocuo"]}], "criterio": "Los parónimos se parecen en la forma y tienen significados distintos, así que decide el significado de la frase: en <i>aptitud<\/i> y <i>actitud<\/i>, la capacidad y el comportamiento van en la misma oración y sobre la misma persona.", "apoyo": ["Pieza 4 · 5 · Los parónimos"], "dossier_txt": "Del dossier: pieza 4, ejercicio 6"}, {"tipo": "hueco", "titulo": "Set 2018s: ponga acento en las palabras que lo necesiten", "estricto": true, "ayuda": "Las ocho palabras del ejercicio de 2018, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>caracteres<\/i>", "conv": "2018s", "sol": "caracteres", "porque": "llana acabada en -s, <i>ca-rac-te-res<\/i>; el singular <i>carácter<\/i> sí lleva, porque la fuerza se mueve al pasar al plural"}, {"enun": "<i>regimenes<\/i>", "conv": "2018s", "sol": "regímenes", "porque": "esdrújula, <i>re-gí-me-nes<\/i>"}, {"enun": "<i>altruista<\/i>", "conv": "2018s", "sol": "altruista", "porque": "llana acabada en vocal; <i>ui<\/i> es diptongo"}, {"enun": "<i>zurzais<\/i>", "conv": "2018s", "sol": "zurzáis", "porque": "aguda acabada en -s"}, {"enun": "<i>ultimatum<\/i>", "conv": "2018s", "sol": "ultimátum", "porque": "llana acabada en -m"}, {"enun": "<i>melifluo<\/i>", "conv": "2018s", "sol": "melifluo", "porque": "llana acabada en vocal; <i>uo<\/i> es diptongo"}, {"enun": "<i>asimismo<\/i>", "conv": "2018s", "sol": "asimismo", "porque": "llana acabada en vocal"}, {"enun": "<i>languidamente<\/i>", "conv": "2018s", "sol": "lánguidamente", "porque": "adverbio en -mente: conserva la tilde de <i>lánguido<\/i>"}], "criterio": "Cuatro llevan tilde y cuatro no. Los dos plurales son la pareja del set: <i>regímenes<\/i> es esdrújula y lleva tilde, y <i>caracteres<\/i> es llana acabada en -s y no la lleva, aunque su singular sí. Los otros dos señuelos son llanas acabadas en vocal con un diptongo dentro.", "apoyo": ["Anexo A-3 · El gimnasio: sets de tildes y formas verbales"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set 2018S"}, "dossier_txt": "Del dossier: anexo A-3 · Set 2018S"}, {"tipo": "clasificar", "titulo": "Seis más: ¿falta o no?", "ops": ["falta", "está bien"], "ayuda": "Seis oraciones. Indica si cada una tiene falta o está bien.", "items": [{"enun": "«Ha habido tres avisos esta semana.»", "sol": "está bien", "porque": "<i>ha habido<\/i> en singular: <i>tres avisos<\/i> es el complemento"}, {"enun": "«Este agua está demasiado fría.»", "sol": "falta", "porque": "<i>esta agua<\/i>: el demostrativo va en femenino; solo <i>el<\/i> y <i>un<\/i> cambian"}, {"enun": "«El hacha estaba afilada.»", "sol": "está bien", "porque": "<i>el hacha<\/i> lleva <i>el<\/i> por la <i>a<\/i> fuerte, y el adjetivo va en femenino"}, {"enun": "«Se quejó de que el turno cambiaba cada semana.»", "sol": "está bien", "porque": "<i>se quejó de eso<\/i>: la preposición va"}, {"enun": "«Llevaba todo el día con mucho hambre.»", "sol": "falta", "porque": "<i>mucha hambre<\/i>: el indefinido va en femenino; solo <i>el<\/i> y <i>un<\/i> cambian delante de la <i>a<\/i> tónica"}, {"enun": "«Hubieron retrasos en el reparto de la mañana.»", "sol": "falta", "porque": "<i>hubo retrasos<\/i>: <i>haber<\/i> de existir no tiene plural"}], "criterio": "Tres tienen falta y tres están bien. <i>Esta agua<\/i> y <i>mucha hambre<\/i> van en femenino: delante de la <i>a<\/i> tónica solo cambian <i>el<\/i> y <i>un<\/i>. <i>Haber<\/i> de existir no tiene plural: <i>hubo retrasos<\/i>, <i>ha habido tres avisos<\/i>.", "apoyo": ["Pieza 4 · 4 · Tres concordancias que descuentan"], "solo_web": true}], "cuaderno": [{"pieza": 4, "apartados": [4, 5], "ejercicios": [5, 6]}, {"pieza": "A-3", "apartados": ["Set 2018S"]}], "cuaderno_txt": "Pieza 4 · Las letras, las palabras que se separan y corregir lo que escribes — apartados 4 y 5: Tres concordancias que descuentan; Los parónimos (p. 39) · ejercicios 5 y 6 · Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Set 2018S (p. 294)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El primer examen de comentario, y la segunda redacción corta", "meta": "60 minutos · el comentario de 2024s en el carril «El texto» (test y las tres preguntas); el registro de un examen y la primera persona; el descuento sin tope; la redacción corta con el enunciado de 2017t", "teoria": "<h3>3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>\n<h3>4 · El registro<\/h3>\n<p>De las tres condiciones de la adecuación —el tema, el registro y la extensión—, el registro se pierde casi siempre por la misma causa: el tono de la conversación entra en el texto.<\/p>\n<table>\n<thead>\n<tr>\n<th>fuera del registro<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>jaja<\/em>, emoticonos, <em>xq<\/em>, <em>tb<\/em><\/td>\n<td>canal equivocado<\/td>\n<\/tr>\n<tr>\n<td><em>o sea<\/em>, <em>en plan<\/em>, <em>rollo<\/em>, <em>súper<\/em><\/td>\n<td>marcas de oralidad<\/td>\n<\/tr>\n<tr>\n<td>insultos y descalificaciones<\/td>\n<td>registro vulgar, y además contradice «capacidad de convencer»<\/td>\n<\/tr>\n<tr>\n<td>«como decía antes», «¿tú qué opinas?»<\/td>\n<td>le estás hablando al corrector, y no hay interlocutor<\/td>\n<\/tr>\n<tr>\n<td>«yo pienso que en mi opinión creo que»<\/td>\n<td>una sola marca de opinión basta<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La primera persona sí se puede usar.<\/strong> El enunciado pide tu opinión. Lo que no corresponde es tratar al corrector como a un conocido.<\/p>\n<h4>Siete maneras de quitar la primera persona<\/h4>\n<p>El texto argumentativo es el único de la prueba en el que conviven dos registros: <strong>una postura, que es tuya, y unas razones, que tienen que parecer de cualquiera<\/strong>. La rúbrica del comentario puntúa la adecuación —que se sepa de qué lado estás— y el estilo —riqueza, corrección gramatical, conectores, puntuación y léxico—; la de castellano no tiene banda de estilo. El reparto que sigue es una pauta de este dossier, no un apartado de las rúbricas. Quien escribe todo en primera persona pierde por el segundo lado; quien no toma partido en ninguna línea pierde por el primero.<\/p>\n<p>Una mitad se separa de la otra con siete construcciones. Solo las dos primeras son impersonales en sentido gramatical; las otras cinco llevan sujeto, y lo que hacen es sacar de él a quien escribe:<\/p>\n<table>\n<thead>\n<tr>\n<th>construcción<\/th>\n<th>en lugar de<\/th>\n<th>queda<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><em>se<\/em> + verbo en tercera<\/strong><\/td>\n<td>«yo creo que la gente trabaja más horas de las que le pagan»<\/td>\n<td>«se trabajan más horas de las que se pagan»<\/td>\n<\/tr>\n<tr>\n<td><strong>el sujeto que no señala a nadie en concreto<\/strong><\/td>\n<td>«yo pierdo dos horas al día en el autobús»<\/td>\n<td>«quien va a ese polígono pierde dos horas al día en el autobús»<\/td>\n<\/tr>\n<tr>\n<td><strong>el asunto delante y quien decide al final, o sin nombrarlo<\/strong><\/td>\n<td>«la empresa decide dónde está la nave»<\/td>\n<td>«el lugar de la nave lo decide la empresa» · «el lugar de la nave se decide arriba»<\/td>\n<\/tr>\n<tr>\n<td><strong>el sujeto general<\/strong><\/td>\n<td>«a mí me pasa que salgo del turno agotado»<\/td>\n<td>«quien hace ese turno sale agotado»<\/td>\n<\/tr>\n<tr>\n<td><strong>el nombre en lugar del verbo<\/strong><\/td>\n<td>«el alquiler ha subido mucho estos años»<\/td>\n<td>«la fuerte subida del alquiler de estos años»<\/td>\n<\/tr>\n<tr>\n<td><strong>la obligación sin quien la impone<\/strong><\/td>\n<td>«yo creo que hay que distinguir dos casos»<\/td>\n<td>«conviene distinguir dos casos» · «resulta necesario distinguir dos casos»<\/td>\n<\/tr>\n<tr>\n<td><strong>la fuente, o lo que está comprobado<\/strong><\/td>\n<td>«yo he leído en un estudio que dormir poco sienta mal»<\/td>\n<td>«según ese estudio, dormir poco sienta mal» · «está comprobado que dormir poco sienta mal»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La segunda versión de la última fila tiene una condición.<\/strong> <em>Está comprobado que<\/em>, <em>es evidente que<\/em> y <em>nadie discute que<\/em> presentan una afirmación como sabida por todos, y esa fórmula solo se escribe cuando el texto de partida la sostiene o cuando es de dominio público. Puesta delante de una opinión propia, esa fórmula le presenta al corrector una afirmación sin respaldo, y la banda de adecuación lo descuenta con el nombre de «pobreza de ideas».<\/p>\n<p><strong>Dónde va cada mitad.<\/strong> La tesis y el cierre son la postura y admiten la primera persona; los dos argumentos son hechos y van sin marcas de primera persona. Ese reparto se comprueba entero en un ejemplo:<\/p>\n<blockquote>\n<p>⊗ «Yo pienso que las empresas tendrían que pagar el desplazamiento, porque yo he visto que la gente pierde muchas horas y a mí me parece muy injusto que no se pague.»<\/p>\n<p>«Las empresas deberían pagar el tiempo de desplazamiento. Quien vive a una hora del polígono dedica diez horas semanales al trayecto, y esas horas no se eligen: las impone el lugar donde se ha instalado el centro de trabajo.»<\/p>\n<\/blockquote>\n<p>Las dos versiones defienden lo mismo y ocupan casi lo mismo. La segunda no tiene ni una marca de primera persona y se entiende igual de bien de qué lado está quien la escribe, porque la postura ya está en el verbo <em>deberían<\/em>.<\/p>\n<p><strong>Y el aviso contrario<\/strong>: un texto sin ninguna marca de postura no responde al enunciado. «Se puede opinar de las dos maneras» no sostiene ninguna, y el enunciado pide una. El argumento de competencia del apartado 2 —el que se apoya en la experiencia de quien escribe— necesita esa experiencia y se escribe con el sujeto general, que es la manera de aportarla sin primera persona: «quien ha encadenado turnos con dos autobuses de por medio sabe que esas horas no se recuperan durmiendo».<\/p>\n<blockquote>\n<p>El análisis completo de las construcciones con <em>se<\/em> —cuántos valores tiene y cómo se distinguen— corresponde a la sintaxis del segundo trimestre. Aquí basta con saber escribirlas.<\/p>\n<\/blockquote>\n<h3>8 · Las tres preguntas fijas del comentario<\/h3>\n<p><strong>En el examen.<\/strong> El bloque 2 del comentario son <strong>3 puntos<\/strong> y trae <strong>las mismas tres preguntas en las seis convocatorias<\/strong>, en el mismo orden: proponer un título, resumir un párrafo delimitado y explicar una frase. Cada una vale 1 punto, ocupa <strong>de una a cinco líneas<\/strong> y, según los criterios, «admite fracciones en la puntuación (0,25, 0,5, 0,75) en función de la precisión de la respuesta».<\/p>\n<p>Y sobre las tres pesa la instrucción que recoge el apartado 6 de la pieza 10: <strong>reproducir frases del original se considera incorrecto<\/strong>.<\/p>\n<h4>8.1 · Proponer un título<\/h4>\n<p>Llengua castellana lo pidió una vez, en 2016, con un enunciado que detalla lo que se espera:<\/p>\n<blockquote>\n<p>«Proponga un título (y, si quiere, un subtítulo) para el texto. <strong>La propuesta no debe coincidir con el título del artículo<\/strong> y tiene que recoger debidamente el contenido del fragmento reproducido.»<\/p>\n<p>La clave da dos y admite otros equivalentes: <em>Las relaciones personales en internet<\/em> / <em>Influencia de las redes sociales en las relaciones interpersonales<\/em> / etc.<\/p>\n<\/blockquote>\n<p><strong>Los dos títulos que da la clave son sintagmas nominales<\/strong>, y los tres que acepta la de 2024s también: ninguno lleva verbo conjugado y todos nombran el tema del texto entero. Es el formato más frecuente y el más seguro, y el enunciado no lo exige: pide que el título no coincida con el del artículo y que recoja el contenido del fragmento. Un título con verbo que cumpla los dos requisitos sirve, y además recoge la tesis con más precisión que un sintagma nominal: el sintagma nombra el tema y la oración afirma algo sobre él.<\/p>\n<table>\n<thead>\n<tr>\n<th>sirve<\/th>\n<th>no sirve<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>El valor de la lectura<\/em><\/td>\n<td><em>Leer es bueno<\/em><\/td>\n<td>el segundo es la opinión de quien escribe, y el título recoge el contenido del texto<\/td>\n<\/tr>\n<tr>\n<td><em>Las redes sociales y la imagen que damos<\/em><\/td>\n<td><em>Internet<\/em><\/td>\n<td>demasiado ancho: vale para cualquier texto sobre la red y no distingue <strong>este<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>La discusión sobre si leer mejora a las personas<\/em><\/td>\n<td><em>Mi opinión sobre la lectura<\/em><\/td>\n<td>el título es del texto, no tuyo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres comprobaciones antes de darlo por bueno:<\/strong> que no repita el título original, que abarque el texto entero —no solo el primer párrafo— y que recoja el contenido del texto y no la opinión de quien lo escribe. Que lleve verbo conjugado no lo invalida.<\/p>\n<h4>8.2 · Resumir un párrafo delimitado<\/h4>\n<p>El enunciado marca el párrafo con <strong>su primera y su última palabra<\/strong>: «desde <em>Negar el valor<\/em> hasta <em>como la soberbia<\/em>». El párrafo cambia de una convocatoria a otra; la tarea, no.<\/p>\n<p>Llengua castellana pidió exactamente esto en 2015, y su clave sirve de modelo:<\/p>\n<blockquote>\n<p><strong>Enunciado:<\/strong> «Sintetice el párrafo inicial del texto: <em>El niño, inquieto ante esta noche tan diferente, […] le arranca la palabra tantas veces oída<\/em>.»<\/p>\n<p><strong>Clave:<\/strong> «En este párrafo el niño intuye instintivamente, a partir de una serie signos, que algo terrible le está sucediendo a su abuelo, lo que le lleva a pronunciar el apelativo con el que siempre se ha referido a él.»<\/p>\n<\/blockquote>\n<p><strong>Esa respuesta cumple cuatro condiciones<\/strong>, y las cuatro sirven para el resumen del comentario:<\/p>\n<ol>\n<li><strong>Treinta y nueve palabras<\/strong>, tres líneas. Se reproduce tal cual, con el <em>de<\/em> que le falta en «una serie signos».<\/li>\n<li><strong>Recoge qué pasa, por qué y con qué consecuencia<\/strong>: intuye · a partir de unos signos · y por eso pronuncia el nombre.<\/li>\n<li><strong>No repite ni una secuencia del original.<\/strong> Donde el texto escribe <em>inquieto ante esta noche tan diferente<\/em>, la respuesta pone <em>intuye instintivamente<\/em>. En esa sustitución aparecen a la vez los tres pasos del apartado 6 de la pieza 10.<\/li>\n<li><strong>Empieza por «En este párrafo…»<\/strong>, que sitúa la respuesta sin gastar media línea en metadiscurso.<\/li>\n<\/ol>\n<p><strong>Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado.<\/strong> El enunciado delimita con dos palabras para evitarlo: lo que queda fuera de esas dos palabras no entra en el resumen.<\/p>\n<p><strong>Antes de resumir, se comprueba si el párrafo defiende algo o describe algo,<\/strong> y el resumen se escribe de la misma clase. El párrafo que manda resumir la 2.2 del comentario de 2026s no tiene tesis: describe cómo se va borrando la frontera entre el pensamiento propio y el acceso a la información digital, y la respuesta de la clave describe ese proceso. Un resumen que le pone una tesis a un párrafo descriptivo atribuye al texto una idea que no está en él, y los criterios puntúan esta pregunta por la precisión de la respuesta.<\/p>\n<h4>8.3 · Explicar una frase relacionándola con la argumentación<\/h4>\n<p>El enunciado entrecomilla una frase o un concepto del texto y pide explicarlo <strong>atándolo a lo que el texto defiende<\/strong>. Las palabras <em>relacionándola con la argumentación<\/em> deciden el punto: una paráfrasis de la frase, por buena que sea, deja sin contestar la mitad del enunciado si no explica para qué está esa frase en ese texto.<\/p>\n<p>La primera mitad —qué significa la expresión— ya la preguntaba Llengua castellana en 2016, en una pregunta de comprensión de 0,5 sobre «¿Somos lo que parecemos ser en internet?», el primer texto del trimestre:<\/p>\n<blockquote>\n<p><strong>Enunciado (2016t, 1.5):<\/strong> «Indique a qué idea del texto se refiere el autor con la expresión <em>idílica idea<\/em>.»<\/p>\n<p><strong>Clave oficial:<\/strong> «Contamos lo mejor de nosotros mismos (‘maquillamos’ nuestra identidad) solo en la red (en internet), y no en el contacto personal (cara a cara).»<\/p>\n<\/blockquote>\n<p>Esa pregunta se contesta entera con la paráfrasis, y la paráfrasis ya tiene dos partes: qué hacemos —<em>contamos lo mejor de nosotros mismos<\/em>— y dónde —<em>solo en la red, y no en el contacto personal<\/em>—. La 2.3 del comentario pide además la segunda mitad, <strong>qué función cumple la frase en el argumento del texto<\/strong>. En el texto de 2016, la <em>idílica idea<\/em> es la creencia que el autor discute: la nombra para rebatirla con los datos de la investigación psicológica, y una respuesta de comentario lo escribiría en su segunda frase.<\/p>\n<p><strong>El formato que funciona, en dos frases:<\/strong><\/p>\n<blockquote>\n<p><em>La expresión significa [qué].<\/em> · <em>El autor la usa para [qué defiende con ella].<\/em><\/p>\n<\/blockquote>\n<p>Y el error simétrico del 8.2: <strong>explicar la frase por su cuenta, como si fuera una definición de diccionario<\/strong>, sin indicar para qué está en ese texto. El enunciado exige «relacionándola con la argumentación», y esas tres palabras piden la segunda frase.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Al registro de un examen", "dossier": {"cuaderno": "11", "ejercicio": 6}, "ayuda": "Reescribe cada frase en el registro de un examen, sin cambiar su contenido.", "items": [{"enun": "«Yo pienso que en mi opinión creo que esto está fatal.»", "modelo": "<i>Esta situación me parece injusta.<\/i>"}, {"enun": "«O sea, que la gente ya no lee, en plan nada.»", "modelo": "<i>La gente ha dejado de leer.<\/i>"}, {"enun": "«Como decía antes, y tú qué opinas de esto?»", "modelo": "<i>Como ya se ha dicho…<\/i>, y la pregunta al lector se quita entera."}, {"enun": "«Los políticos son unos inútiles que no dan un palo al agua.»", "modelo": "<i>Los responsables políticos no han atendido este asunto.<\/i>"}, {"enun": "«Es súper importante que se arregle, pero ya!»", "modelo": "<i>Urge arreglarlo.<\/i>"}, {"enun": "«Yo he visto que mucha gente hace eso, xq no tiene otra.»", "modelo": "<i>Mucha gente actúa así porque no tiene alternativa.<\/i>"}, {"enun": "«Voy a hablar de este tema y a continuación daré mi opinión.»", "modelo": "Se borra la frase: la redacción empieza por la tesis."}, {"enun": "«La verdad es que a mí me parece que quizá podría ser que fuera mejor.»", "modelo": "<i>Sería mejor.<\/i>"}], "criterio": "Siete de las ocho se corrigen quitando, no añadiendo. La de los políticos cambia además de argumento: el insulto baja el registro y contradice la «capacidad de convencer» que puntúa la banda de coherencia.", "usa_texto": false, "apoyo": ["3 · Las dos rúbricas, banda por banda", "4 · El registro"], "dossier_txt": "Del dossier: pieza 11, ejercicio 6"}, {"tipo": "abierta", "titulo": "Sin primera persona", "dossier": {"cuaderno": "11", "ejercicio": 7}, "ayuda": "Quita la primera persona de cada frase sin añadir datos ni subir la certeza, y sin usar dos veces el mismo procedimiento de la tabla del apartado 4.", "items": [{"enun": "«Yo pierdo dos horas al día en el autobús.»", "modelo": "<i>Se pierden dos horas al día en el autobús.<\/i> (<i>se<\/i> + tercera persona)"}, {"enun": "«Yo creo que la empresa decide dónde pone la nave.»", "modelo": "<i>El lugar de la nave lo decide la empresa.<\/i> (el asunto delante y la empresa al final; la oración sigue siendo activa)"}, {"enun": "«Yo he leído en un estudio del hospital que dormir poco sienta mal.»", "modelo": "<i>Según un estudio del hospital, dormir poco sienta mal.<\/i> (la fuente delante, en lugar de quien la leyó)"}, {"enun": "«A mí me pasa que salgo del turno agotado.»", "modelo": "<i>Quien sale de un turno llega agotado a casa.<\/i> (sujeto general)"}, {"enun": "«Yo creo que hay que separar dos casos.»", "modelo": "<i>Conviene separar dos casos.<\/i> (obligación sin quien la impone)"}, {"enun": "«Yo veo que el alquiler ha subido mucho estos años.»", "modelo": "<i>La fuerte subida del alquiler de estos años.<\/i> (el nombre en lugar del verbo)"}], "criterio": "Los modelos usan un procedimiento distinto cada uno, el que va entre paréntesis. Una respuesta sirve si mantiene el dato y el grado de certeza de la frase original.", "usa_texto": false, "apoyo": ["Siete maneras de quitar la primera persona"], "dossier_txt": "Del dossier: pieza 11, ejercicio 7"}, {"tipo": "abierta", "titulo": "La primera persona, solo en la primera frase", "dossier": {"cuaderno": "11", "ejercicio": 8}, "ayuda": "Este texto tiene 60 palabras y trece pronombres y posesivos de primera persona. Reescríbelo dejando la primera persona solo en la primera frase. El contador de debajo cuenta las palabras de tu versión: compáralas con las 60 del original.", "items": [{"enun": "«Yo pienso que yo estoy a favor de que las empresas nos paguen a nosotros el desplazamiento. Yo he visto que mis compañeros y yo perdemos muchísimas horas y a mí me parece muy injusto. Yo creo que si yo tengo que ir hasta el polígono, yo debería cobrar ese rato como si estuviera trabajando, porque para mí es trabajo.»", "modelo": "<i>Creo que las empresas deberían pagar el tiempo de desplazamiento. Quien vive lejos del polígono dedica al trayecto varias horas cada semana, y esas horas no se eligen: las impone el lugar donde está el centro de trabajo. Si el horario lo fija la empresa, el rato de ir hasta allí es trabajo.<\/i> (53 palabras)", "palabras": {}}], "criterio": "El modelo tiene siete palabras menos que el original. De los trece pronombres y posesivos de primera persona queda uno, y el verbo <i>creo<\/i> conserva la postura en la primera frase; el resto de la diferencia sale de reescribir dos oraciones, no de quitar marcas. La postura sigue clara sin <i>yo<\/i>: la marca el verbo <i>deberían<\/i>.", "usa_texto": false, "apoyo": ["Siete maneras de quitar la primera persona"], "dossier_txt": "Del dossier: pieza 11, ejercicio 8"}, {"tipo": "hueco", "titulo": "El descuento sin tope, con números", "ayuda": "Cinco cuentas. Escribe cuánto descuentan las faltas en cada caso, con coma decimal: 1,2 · 0,5 · 2.", "items": [{"enun": "Un comentario con doce faltas entre el bloque 2 y la parte 2.", "sol": "1,2|1.2", "porque": "0,1 por falta, sin tope: 1,2 puntos"}, {"enun": "Una redacción de Llengua castellana con veinticinco faltas.", "sol": "2|2,0|2.0", "porque": "serían 2,5, pero el descuento se detiene en 2 puntos"}, {"enun": "Un comentario con veinticinco faltas.", "sol": "2,5|2.5", "porque": "sin tope: 2,5 puntos, más de la mitad de la parte 2"}, {"enun": "Una redacción de Llengua castellana con siete faltas.", "sol": "0,7|0.7", "porque": "0,7, por debajo del tope"}, {"enun": "Un comentario de 210 palabras con cuatro faltas.", "sol": "0,9|0.9", "porque": "0,4 por las faltas y 0,5 por pasarse de 200 palabras"}], "criterio": "Las veinticinco faltas son la cuenta que conviene recordar: en castellano descuentan 2 puntos y en el comentario 2,5. Y la extensión de la parte 2 descuenta aparte, medio punto, tanto por bajar de 150 como por pasar de 200.", "apoyo": ["3 · Las dos rúbricas, banda por banda"], "solo_web": true}, {"tipo": "abierta", "titulo": "La segunda redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante. El enunciado es el real de 2017t, sobre la columna de Trueba que se contestó el 20 de octubre.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Escriba un comentario personal, de entre cincuenta y ochenta palabras, a partir de la siguiente afirmación del texto: «También las redes sociales han potenciado el valor de la opinión corta y contundente por encima de la reflexión y el estudio».»", "conv": "2017t", "modelo": "Creo que las redes han hecho que la opinión rápida valga más que la razonada, y que eso empeora las discusiones. En primer lugar, un mensaje de dos líneas se lee y se comparte en segundos, mientras que un argumento con datos exige pararse. Además, quien contesta el primero se lleva la atención, aunque no sepa del tema. Por eso, cuanto más rápida es la conversación, menos gente se toma el trabajo de estudiar antes de opinar. Setenta y una palabras: tesis, dos razones con conector, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. La afirmación del enunciado ya es una tesis; la redacción tiene que tomar postura sobre ella —a favor, en contra o con matices— y no repetirla.", "apoyo": ["3 · Las dos rúbricas, banda por banda"], "usa_texto": false, "solo_web": true}, {"tipo": "opcion", "titulo": "¿Resume el primer párrafo?", "ops": ["resume el párrafo", "resume el texto entero", "copia frases del original", "deja fuera la consecuencia"], "ayuda": "El párrafo, de una columna inventada para practicar: «Encarna compara dos paquetes de arroz en el pasillo del supermercado. Uno cuesta dos euros con diez y el otro un euro con noventa. Coge el segundo. En casa, al vaciarlo, descubre que el barato pesa ochocientos gramos y el caro un kilo: ha pagado más por cada grano. La etiqueta lo indicaba, en letra pequeña, debajo del precio grande.» El resto de la columna trata de los envases que reducen el contenido sin cambiar el precio. El enunciado pide: «Resuma el párrafo que va desde <i>Encarna compara<\/i> hasta <i>del precio grande<\/i>». Clasifica lo que hace cada una de estas respuestas.", "items": [{"enun": "«En este párrafo una compradora elige el paquete de arroz más barato y descubre en casa que, al pesar menos, le ha salido más caro por gramo; el precio por kilo estaba en la etiqueta, pero en letra pequeña.»", "sol": "resume el párrafo", "porque": "qué pasa, por qué y con qué consecuencia, en otras palabras y en tres líneas"}, {"enun": "«Encarna compara dos paquetes de arroz en el pasillo del supermercado y coge el segundo, y en casa descubre que el barato pesa ochocientos gramos y el caro un kilo.»", "sol": "copia frases del original", "porque": "dos secuencias enteras del texto; los criterios lo consideran incorrecto"}, {"enun": "«El texto explica que los fabricantes reducen el contenido de los envases sin cambiar el precio y que la mayoría de los compradores no mira el precio por kilo.»", "sol": "resume el texto entero", "porque": "los envases y la encuesta están en el segundo párrafo, fuera de las dos palabras del enunciado"}, {"enun": "«En este párrafo una mujer compra el arroz más barato de dos que compara.»", "sol": "deja fuera la consecuencia", "porque": "falta lo que descubre en casa, y sin esa consecuencia el resumen se queda sin la conclusión del párrafo"}, {"enun": "«En este párrafo, una clienta escoge el arroz de menor precio y luego comprueba que el paquete trae menos cantidad, de modo que cada gramo le cuesta más que en el paquete grande; el dato figuraba en la etiqueta, en un tamaño de letra menor que el precio.»", "sol": "resume el párrafo", "porque": "las dos mitades, con otras palabras; cuarenta y una palabras"}], "criterio": "Los dos que resumen bien dicen lo mismo con palabras distintas entre sí y distintas de las del texto, y los dos ocupan tres líneas. Los otros tres son los tres fallos que se corrigen en clase: copiar, salirse del párrafo y dejar el resumen sin la consecuencia.", "apoyo": ["8 · Las tres preguntas fijas del comentario"], "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: dos resúmenes", "ayuda": "Tres líneas cada uno, empezando por «En este párrafo…», sin copiar ninguna secuencia del original. El de Trueba, que se leyó el 20 de octubre, se entrega hoy.", "items": [{"enun": "Resume el primer párrafo de «Recuperar ciertos complejos», de David Trueba (en la página del 20 de octubre), desde <i>No es raro ver<\/i> hasta <i>es fabricar un imbécil<\/i>.", "modelo": "En este párrafo el autor describe una época en la que la ignorancia opina sin vergüenza y las redes premian la frase corta sobre el estudio, y sostiene que algunos complejos hacen falta: reconocer que otro sabe más es tan razonable como admitir que Usain Bolt corre más que nosotros. Cuarenta y ocho palabras: qué describe, qué defiende y con qué ejemplo, sin ninguna secuencia del original."}, {"enun": "Resume el tercer párrafo del texto de hoy, desde <i>Otra «estrella» de la psicolingüística<\/i> hasta <i>la supervivencia y la reproducción<\/i>.", "modelo": "En este párrafo se expone la posición contraria a la de Chomsky: para Pinker y su discípulo Bloom el lenguaje acompaña a la especie desde siempre, todas las lenguas resultan igual de complejas y sirven para comunicarse, y sus elementos se afinaron por selección natural como cualquier otro órgano. Cuarenta y ocho palabras, sin ninguna secuencia del original."}], "criterio": "Se corrige con los cuatro rasgos: tres líneas, qué pasa y con qué consecuencia, ninguna secuencia copiada y el arranque que sitúa. Una respuesta que resuma el texto entero en lugar del párrafo pedido se queda en la banda baja aunque esté bien escrita.", "apoyo": ["8 · Las tres preguntas fijas del comentario"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [3, 4, 8], "ejercicios": [6, 7, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3, 4 y 8: Las dos rúbricas, banda por banda; El registro; Las tres preguntas fijas del comentario (p. 66, 70 y 78) · ejercicios 6, 7 y 8", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "El origen del lenguaje · Comentari de text 2024, tribunal especial", "meta": "Convocatoria 2024, tribunal especial · 618 palabras · el primer examen de comentario entero: test, las tres preguntas y los dos enunciados de la parte 2", "literal": true, "teoria": "<h3>4 · Comentari de text 2024, tribunal especial · el origen del lenguaje<\/h3>\n<p><strong>La primera entrada de comentario, y la primera vez que el alumno ve el examen entero.<\/strong> Pide la sesión completa: son nueve preguntas y una redacción, no seis preguntas.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>José C. Vales, <em>Enseñar a hablar a un monstruo. Sobre el origen del lenguaje, de las lenguas y de la escritura<\/em> (Destino, 2022), adaptado<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>ensayo de divulgación, 618 palabras en la versión castellana<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Comentari de text 2024, tribunal especial; el cuadernillo trae el texto en catalán y en castellano, y el castellano va en el cuaderno de textos de cada sesión (texto 4)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>27 de octubre · primer texto de comentario, con el test y las tres preguntas ya explicadas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>El cuadernillo trae el texto dos veces<\/strong>, en catalán y en castellano. Se reparte la página castellana. <strong>Y la clave está redactada en catalán<\/strong>: las respuestas modelo de abajo son la traducción, y los enunciados, los del examen castellano.<\/p>\n<\/blockquote>", "lectura": {"titulo": "El origen del lenguaje", "entrada": "José C. Vales · <i>Enseñar a hablar a un monstruo. Sobre el origen del lenguaje, de las lenguas y de la escritura<\/i> (Barcelona: Destino, 2022, pp. 21-27) · adaptación, tal como la reproduce el cuadernillo de Comentari de text de 2024 (tribunal especial), versión castellana.", "lineas": ["El origen de las lenguas siempre ha estado entre los", "principales intereses de los intelectuales y eruditos de todos", "los tiempos. Desde los historiadores griegos a las últimas", "ocurrencias más o menos científicas, el ser humano ha sentido", "la ineludible necesidad de explicar el fenómeno del lenguaje.", "En la actualidad, muchos científicos del campo de la", "psicología cognitiva afirman que el surgimiento del lenguaje", "es probablemente «el problema científico más atractivo y", "difícil que puede plantearse» en la disciplina lingüística.", "", "Noam Chomsky, uno de los grandes lingüistas de nuestro tiempo,", "propuso una idea (conocida hoy como «teoría de la", "discontinuidad») para explicar el paso de una sociedad humana", "sin lenguaje a una sociedad humana con lenguaje. La teoría de", "la discontinuidad, en resumen, sugiere que hace unos cien mil", "años se produjo una mutación genética que propició de manera", "instantánea —y asombrosamente— la facultad lingüística. La", "teoría se denomina a veces «catastrofista», porque se atiene a", "la terminología matemática, según la cual una mínima", "alteración en los parámetros de un sistema dinámico provoca un", "cambio brusco y definitivo: en este caso, una leve mutación", "habría propiciado el prodigioso nacimiento del lenguaje. El", "ideólogo de la GU (gramática universal) no descartaba que", "hubiera existido alguna ventaja evolutiva en la aparición del", "lenguaje, pero afirmaba que los orígenes fueron seguramente", "«accidentales». Para la mayoría de los especialistas, sin", "embargo, la hipótesis de la mutación genética repentina es tan", "inverosímil como la historia de Osiris descendiendo sobre las", "aguas del Nilo y entregándoles a los humildes egipcios el", "recetario de la cerveza. Aunque Chomsky estuviera en lo", "cierto, dicen sus detractores, el proceso de adquisición del", "lenguaje se explicaría mejor desde la evolución y la", "continuidad (esto es, desde un desarrollo progresivo), y así", "lo admiten hoy la mayoría de los especialistas.", "", "Otra «estrella» de la psicolingüística, Steven Pinker,", "consideró en su momento que el lenguaje era una facultad", "intrínsecamente humana y que, por lo tanto, bastó el tiempo y", "la ocasión para que se desarrollara: fue, en definitiva, una", "adaptación biológica propia de la selección natural. Una de", "las ideas centrales de las propuestas iniciales de Steven", "Pinker y su discípulo Paul Bloom fue que la humanidad siempre", "ha tenido lenguaje. Pinker y Bloom también recordaron que", "todas las lenguas eran igual de complejas y servían, todas,", "para una misma función: la comunicación. La propuesta de", "Pinker y Bloom era que todos los elementos que integran el", "lenguaje evolucionaron y se refinaron con la misma precisión", "que cualquier otro órgano, impulsados por la supervivencia y", "la reproducción.", "", "Estas dos teorías de índole psicolingüística atañen a las", "operaciones y relaciones entre los procesos cognitivos y los", "procesos comunicativos. Pero quizá Chomsky tenía razón cuando", "apuntaba que tal vez habría que empezar por la biología. Y ¿de", "qué hablaban los cazadores recolectores de la tundra siberiana", "o de la sabana africana (si es que hablaban de algo)? Desde", "luego, dicen los expertos, aquellos seres primitivos", "(anteriores a los neandertales) tuvieron que comunicarse en", "alguna especie de lengua.", "", "Si tuviéramos que avanzar alguna idea sobre cómo serían", "aquellas «lenguas primigenias» (llamadas protosapiens,", "protohumanas o protomundo), seguramente optaríamos por hablar", "de gruñidos, alaridos, gritos, chillidos u otras formas más o", "menos simples de comunicar las nociones esenciales de la vida", "salvaje. Pero es difícil concebir esos alaridos como un", "lenguaje, especialmente si concretamos la definición de", "lenguaje como la facultad de comunicar algo «mediante signos", "vocales convencionales». Claro que es importante saber cuándo", "empezaron los homínidos a señalar los árboles, o los", "depredadores, o los ríos, o las piedras. Pero resulta aún más", "interesante entender que en un momento dado se cruzó el", "«umbral» lingüístico en el que se comenzaron a nombrar", "entidades abstractas."], "pie": "Adaptación de un fragmento de <i>Enseñar a hablar a un monstruo<\/i>, de José C. Vales (Destino, 2022), en la versión del cuadernillo oficial de la PAU +25 de 2024, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2024_general_comentari_de_text_suplent.pdf<\/i>, p. 4."}, "ejercicios": [{"tipo": "opcion", "titulo": "Bloque 1: las seis preguntas de test", "ayuda": "Literales, con su respuesta oficial. Diez minutos de reloj. Localiza el «falsa» de la 1.3 antes de leer sus opciones, y subraya <i>antónimo<\/i> en la 1.6.", "items": [{"enun": "<b>1.1<\/b> ¿Cuál es la principal intención del autor con este texto?", "conv": "2024s", "ops": ["Presentar distintas teorías sobre el origen del lenguaje.", "Explicar qué son las lenguas.", "Criticar la teoría de Chomsky sobre el origen del lenguaje.", "Defender la teoría de la discontinuidad."], "sol": "Presentar distintas teorías sobre el origen del lenguaje.", "porque": "global: el autor presenta teorías sin tomar partido; la c) y la d) le atribuyen una postura que no defiende"}, {"enun": "<b>1.2<\/b> ¿A qué se refiere el autor con la expresión <i>lenguas primigenias<\/i>?", "conv": "2024s", "ops": ["A lenguas primitivas.", "A las lenguas de los neandertales.", "A lenguas muy evolucionadas.", "A lenguas especialmente complejas."], "sol": "A lenguas primitivas.", "porque": "léxico: <i>primigenio<\/i> es lo primero, lo originario; el último párrafo las llama protosapiens y protomundo"}, {"enun": "<b>1.3<\/b> Según lo que se expone y se puede inferir del texto, ¿cuál de las siguientes afirmaciones es falsa?", "conv": "2024s", "ops": ["Según Pinker, el lenguaje es una adaptación biológica propia de la selección natural.", "La teoría de la discontinuidad defiende un desarrollo progresivo en la adquisición del lenguaje.", "Pinker y Bloom defienden la equicomplejidad de las lenguas.", "El origen de las lenguas interesa a especialistas de ámbitos diversos."], "sol": "La teoría de la discontinuidad defiende un desarrollo progresivo en la adquisición del lenguaje.", "porque": "el NO disfrazado, sin mayúsculas: la discontinuidad defiende una mutación instantánea, lo contrario de un desarrollo progresivo"}, {"enun": "<b>1.4<\/b> Tal y como se utiliza en el texto, el término <i>inverosímil<\/i>", "conv": "2024s", "ops": ["significa ‘que no tiene apariencia de verdadero’.", "es antónimo de improbable, imposible, increíble.", "significa ‘creíble por no ofrecer carácter alguno de falsedad’.", "es sinónimo de plausible, posible, probable."], "sol": "significa ‘que no tiene apariencia de verdadero’.", "porque": "dos opciones dan una relación —antónimo de, sinónimo de— donde se pide un significado, y las dos son falsas además"}, {"enun": "<b>1.5<\/b> Según lo que se puede inferir del texto, podemos decir que", "conv": "2024s", "ops": ["Pinker propone el concepto de gramática universal.", "las teorías catastrofistas defienden un desarrollo progresivo de la capacidad del lenguaje.", "de acuerdo con Pinker el lenguaje no es una facultad específicamente humana.", "las «lenguas primigenias» no podrían considerarse lenguaje aunque fueran un sistema de comunicación."], "sol": "las «lenguas primigenias» no podrían considerarse lenguaje aunque fueran un sistema de comunicación.", "porque": "global de inferencia: el último párrafo sostiene que es difícil concebir esos alaridos como un lenguaje"}, {"enun": "<b>1.6<\/b> De entre las siguientes opciones, elija un antónimo para el adjetivo <i>ineludible<\/i> en el texto.", "conv": "2024s", "ops": ["Inexcusable.", "Inexorable.", "Ineluctable.", "Evitable."], "sol": "Evitable.", "porque": "<i>inexcusable<\/i>, <i>inexorable<\/i> e <i>ineluctable<\/i> son sinónimos de <i>ineludible<\/i>; el mismo diseño que el de <i>ilusa<\/i> de 2016"}], "criterio": "Las dos globales apuntan en direcciones contrarias: la 1.1 pregunta qué hace el autor —presentar teorías, sin tomar partido— y la 1.5 pide inferir una conclusión concreta. Las dos de léxico están construidas al revés de lo habitual: la 1.4 mezcla definiciones con relaciones, y la 1.6 pone tres sinónimos donde pide un antónimo.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Bloque 2: las tres preguntas fijas", "ayuda": "De una a cinco líneas cada una, sin reproducir frases del original. Se puntúan en cuartos según la precisión.", "items": [{"enun": "<b>2.1<\/b> Proponga un título que se adecúe al contenido del texto que acaba de leer.", "conv": "2024s", "modelo": "Clave oficial, traducida: <i>Teorías sobre el origen del lenguaje<\/i> · <i>El misterio del origen del lenguaje<\/i> · <i>De las lenguas primigenias al lenguaje<\/i>. Los tres son sintagmas nominales sin verbo, y los tres nombran el tema del texto entero."}, {"enun": "<b>2.2<\/b> Resuma el último párrafo del texto (es decir, desde «Si tuviéramos que avanzar alguna idea» hasta «en el que se comenzaron a nombrar entidades abstractas»).", "conv": "2024s", "modelo": "Clave oficial, traducida: «Las lenguas primigenias pueden considerarse sistemas de comunicación, pero no lenguaje. Para hablar de lenguaje hace falta disponer de un sistema de signos vocales convencionales que, además de entidades concretas, puedan designar entidades abstractas.» Treinta y cuatro palabras y dos movimientos: lo que las lenguas primigenias sí son, y lo que les falta para ser lenguaje."}, {"enun": "<b>2.3<\/b> Explique, relacionándolo con la argumentación del texto, qué se entiende por <i>selección natural<\/i>.", "conv": "2024s", "modelo": "Clave oficial, traducida: «La selección natural es el proceso por el que los organismos mejor adaptados desplazan a los menos adaptados mediante la acumulación lenta de cambios genéticos favorables a lo largo de las generaciones. La selección natural hace que las poblaciones se adapten o se vuelvan cada vez más adecuadas a su entorno con el paso del tiempo.» La clave se queda en la definición, con sus dos oraciones, y no expli
