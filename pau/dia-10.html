<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 10 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

<script>window.DIA = {"dia": 10, "fecha": "2026-10-29", "tab": "Día 10 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 29 de octubre", "sub": "La relectura de tres minutos y el set de 2020t · las figuras y el sentido figurado", "carriles": [{"chapa": "Carril A", "titulo": "La relectura de tres minutos · set 2020t", "meta": "15 minutos · tres pasadas de un minuto, cada una con una sola clase de falta: los verbos, la lista de fallos y la palabra dudosa; el tercer set real, 2020t", "teoria": "<h3>Pieza 4 · 6 · La relectura de tres minutos<\/h3>\n<p>Releer buscando «cualquier falta» no sirve, porque en la relectura se reconoce lo que uno mismo ha escrito en lugar de leerlo letra a letra. La relectura que funciona busca <strong>una sola clase de falta en cada pasada<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué buscas<\/th>\n<th>tiempo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>los <strong>verbos<\/strong>: imperfectos en <em>-aba<\/em>, infinitivos en <em>-bir<\/em>, pasados con j (<em>dije, trajo, condujo<\/em>)<\/td>\n<td>1 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>las palabras de <strong>tu lista de fallos<\/strong>, la del recuadro de abajo<\/td>\n<td>1 min<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>la <strong>palabra dudosa<\/strong>: si no estás seguro de cómo se escribe, cámbiala<\/td>\n<td>1 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sobre la tercera pasada.<\/strong> Cuando dudes de una palabra, primero intenta resolverla con una regla —la de <em>-aba<\/em>, la de <em>-aje<\/em>, la de <em>m<\/em> antes de <em>b<\/em>—. Si ninguna la cubre, busca otra manera de decir lo mismo. Suele funcionar mejor cambiar la construcción de la frase que sustituir la palabra por otra más vaga.<\/p>\n<h4>Tu lista de fallos<\/h4>\n<p>Una hoja con <strong>las palabras que tú has escrito mal en tus propios textos<\/strong>. Se abre el 3 de noviembre, después de la primera devolución, y se cierra el día del examen. Cada devolución añade las palabras que hayan salido y quita las que ya no falles. En la segunda pasada de los tres minutos se buscan solo esas.<\/p>\n<p>La lista de un alumno no le sirve a otro, porque cada uno falla en palabras distintas, y en las suyas reincide.<\/p>\n<h4>Las tildes que la norma quitó<\/h4>\n<p>Los textos de las convocatorias de 2015 a 2026 no traen ni un <em>sólo<\/em> con tilde; en los textos anteriores a 2010 es la norma de entonces, y conviene reconocerla al leerlos. Hoy estas palabras <strong>se escriben sin tilde<\/strong>, y ponérsela donde no hace falta cuenta como falta. El acuerdo de 2023 dejó una salvedad: el adverbio <em>solo<\/em> y los demostrativos <strong>admiten la tilde cuando quien escribe aprecia riesgo de ambigüedad<\/strong>, y la Academia sigue recomendando no ponerla nunca, porque la ambigüedad se deshace antes cambiando <em>solo<\/em> por <em>solamente<\/em> o moviendo la palabra de sitio:<\/p>\n<table>\n<thead>\n<tr>\n<th>se escribía<\/th>\n<th>se escribe hoy<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>sólo<\/em> (= solamente)<\/td>\n<td><strong>solo<\/strong><\/td>\n<td>el adverbio y el adjetivo se escriben igual; la tilde solo es opcional si hay ambigüedad<\/td>\n<\/tr>\n<tr>\n<td><em>éste, ése, aquél<\/em> y sus femeninos y plurales<\/td>\n<td><strong>este, ese, aquel<\/strong><\/td>\n<td>tampoco la llevan cuando van solos, salvo la misma ambigüedad<\/td>\n<\/tr>\n<tr>\n<td><em>guión, truhán, fié, lió, rió, guió<\/em><\/td>\n<td><strong>guion, truhan, fie, lio, rio, guio<\/strong><\/td>\n<td>se consideran monosílabos<\/td>\n<\/tr>\n<tr>\n<td><em>5 ó 6<\/em><\/td>\n<td><strong>5 o 6<\/strong><\/td>\n<td>la <em>o<\/em> entre cifras ya no lleva tilde<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Si copias una de estas palabras de un texto de examen con la tilde puesta, el corrector puede contarlo como falta. La que más aparece es <em>solo<\/em>.<\/p>\n<h3>Anexo A-3 · El gimnasio: sets de tildes y formas verbales<\/h3>\n<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "ejercicios": [{"tipo": "abierta", "titulo": "La tercera pasada: sustituye la palabra dudosa", "dossier": {"cuaderno": "4", "ejercicio": 7}, "ayuda": "Seis frases con una palabra en cursiva de la que se duda al releer. Escribe cada frase con otra palabra o con otra construcción que signifique lo mismo y no lleve <i>b<\/i>, <i>v<\/i>, <i>h<\/i>, <i>j<\/i> ni <i>g<\/i>.", "items": [{"enun": "«La empresa <i>absorbió<\/i> a la pequeña.»", "modelo": "«La empresa <b>compró<\/b> a la pequeña», «La empresa <b>se quedó con<\/b> la pequeña»."}, {"enun": "«Es un sector en <i>auge<\/i>.»", "modelo": "«Es un sector <b>en crecimiento<\/b>»."}, {"enun": "«<i>Exhibía<\/i> los resultados en cada reunión.»", "modelo": "«<b>Lucía<\/b> los resultados en cada reunión»."}, {"enun": "«El convenio <i>excluye<\/i> a los eventuales.»", "modelo": "«El convenio <b>aparta a<\/b> los eventuales», «El convenio <b>no incluye a<\/b> los eventuales»."}, {"enun": "«La reunión se <i>prorrogó<\/i> media hora.»", "modelo": "«La reunión <b>duró<\/b> media hora <b>más<\/b>», «La reunión <b>se estiró<\/b> media hora»."}, {"enun": "«El informe <i>coadyuvó<\/i> a resolverlo.»", "modelo": "«El informe <b>ayudó a<\/b> resolverlo»."}], "criterio": "La palabra que entra tiene que ser tan exacta como la que sale y no llevar ninguna de esas letras. <i>Cogió<\/i> no sirve en lugar de <i>absorbió<\/i>: pierde precisión y lleva la <i>g<\/i> que se quería evitar.", "apoyo": ["Pieza 4 · 6 · La relectura de tres minutos"], "dossier_txt": "Del dossier: pieza 4, ejercicio 7"}, {"tipo": "cazar", "titulo": "Las faltas del párrafo", "dossier": {"cuaderno": "4", "ejercicio": 8, "parte": "las faltas"}, "ayuda": "Un párrafo de redacción con faltas de letra, de tilde, de concordancia y de palabras que se separan. Pincha en cada palabra con falta. El número de faltas no se da, porque contarlas forma parte del ejercicio.", "items": [{"texto": "Hayer estube en la oficina a ver si me daban el contrato. Habían dos personas delante y me dijieron que tenía que aver pedido cita. Me informó la encargada que no podía ser, sino volvía mañana. Le dije que yo ya abia venido en marzo y que nadie me abisó de nada; ella insistió en que el porque del retraso estaba en el sistema, conque no valía la pena protestar. Sali de allí con la sensación de aber perdido la mañana.", "faltas": {"Hayer": "Ayer", "estube": "estuve", "Habían": "Había: <i>haber<\/i> de existir no tiene plural", "dijieron": "dijeron: el pretérito con <i>j<\/i> no lleva <i>i<\/i> delante de la <i>e<\/i>", "aver": "haber: es el verbo, <i>tenía que haber pedido<\/i>", "sino": "si no: condición y negación", "abia": "había", "abisó": "avisó", "porque": "porqué: sustantivo, con artículo delante", "Sali": "Salí: aguda acabada en vocal", "aber": "haber"}}], "criterio": "Once faltas: <i>Hayer<\/i> por <i>Ayer<\/i>, <i>estube<\/i> por <i>estuve<\/i>, <i>Habían<\/i> por <i>Había<\/i>, <i>dijieron<\/i> por <i>dijeron<\/i>, <i>aver<\/i> por <i>haber<\/i>, <i>sino volvía<\/i> por <i>si no volvía<\/i>, <i>abia<\/i> por <i>había<\/i>, <i>abisó<\/i> por <i>avisó<\/i>, <i>el porque<\/i> por <i>el porqué<\/i>, <i>Sali<\/i> por <i>Salí<\/i> y <i>aber perdido<\/i> por <i>haber perdido<\/i>. Tres expresiones parecen faltas y están bien escritas: <i>a ver si me daban<\/i>, <i>conque no valía la pena<\/i> y <i>me informó la encargada que<\/i>, que la norma admite también sin preposición.", "apoyo": ["Las tildes que la norma quitó"], "dossier_txt": "Del dossier: pieza 4, ejercicio 8 · las faltas"}, {"tipo": "hueco", "titulo": "El recuento", "dossier": {"cuaderno": "4", "ejercicio": 8, "parte": "el recuento"}, "ayuda": "Escribe el número de faltas del párrafo. La segunda pregunta se contesta con la tabla del principio de la pieza 4.", "items": [{"enun": "¿Cuántas faltas tiene el párrafo del ejercicio anterior?", "sol": "11|once", "porque": "las once que marca la clave; las tres expresiones que parecen faltas están bien escritas", "corto": true}, {"enun": "¿Cuántos puntos descuentan esas faltas en cada uno de los dos exámenes?", "sol": "1,1", "porque": "cada falta descuenta 0,1 en los dos exámenes; en Llengua castellana el descuento tiene un tope de 2 puntos, y en el comentario no tiene tope: 1,1 es más de un cuarto de los 4 puntos de la parte 2", "corto": true}], "criterio": "Las once faltas son las del ejercicio anterior. <i>A ver si me daban<\/i>, <i>conque no valía la pena<\/i> y <i>me informó la encargada que<\/i> no entran en la cuenta.", "apoyo": ["Pieza 4 · 6 · La relectura de tres minutos"], "dossier_txt": "Del dossier: pieza 4, ejercicio 8 · el recuento"}, {"tipo": "hueco", "titulo": "Set 2020t: ponga la tilde en las palabras en que sea necesario", "estricto": true, "ayuda": "Las siete palabras del ejercicio de 2020, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>bahia<\/i>", "conv": "2020t", "sol": "bahía", "porque": "hiato: <i>í<\/i> tónica + <i>a<\/i>, y la hache no lo impide"}, {"enun": "<i>actua<\/i>", "conv": "2020t", "sol": "actúa", "porque": "hiato: <i>ú<\/i> tónica + <i>a<\/i>"}, {"enun": "<i>lleveis<\/i>", "conv": "2020t", "sol": "llevéis", "porque": "aguda acabada en -s"}, {"enun": "<i>constituir<\/i>", "conv": "2020t", "sol": "constituir", "porque": "aguda acabada en -r; <i>ui<\/i> es diptongo"}, {"enun": "<i>jabalies<\/i>", "conv": "2020t", "sol": "jabalíes", "porque": "hiato: <i>í<\/i> tónica + <i>e<\/i>"}, {"enun": "<i>escritorio<\/i>", "conv": "2020t", "sol": "escritorio", "porque": "llana acabada en vocal; <i>io<\/i> es diptongo"}, {"enun": "<i>tactil<\/i>", "conv": "2020t", "sol": "táctil", "porque": "llana acabada en -l, <i>tác-til<\/i>"}], "criterio": "Cinco de siete llevan tilde, y tres de las cinco son hiatos. <i>Constituir<\/i> vuelve a aparecer como señuelo, igual que en 2015t: el tribunal repite señuelos, y <i>ui<\/i> es diptongo por norma aunque parezca que se separa.", "apoyo": ["Las tildes que la norma quitó"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set 2020T"}, "dossier_txt": "Del dossier: anexo A-3 · Set 2020T"}], "cuaderno": [{"pieza": 4, "apartados": [6], "ejercicios": [7, 8]}, {"pieza": "A-3", "apartados": ["Set 2020T"]}], "cuaderno_txt": "Pieza 4 · Las letras, las palabras que se separan y corregir lo que escribes — apartado 6: La relectura de tres minutos (p. 42) · ejercicios 7 y 8 · Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Set 2020T (p. 294)", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Significado II: las figuras y el sentido figurado", "meta": "45 minutos · las nueve figuras con un ejemplo en prosa cada una; los tres ítems reales, con la misma respuesta; «¿cuál NO está en sentido figurado?»", "teoria": "<h3>5 · Las figuras<\/h3>\n<p>El examen pregunta <strong>el nombre<\/strong> de la figura entre cuatro opciones, así que hay que reconocerlas por su mecanismo, no definirlas de memoria. La última columna marca las que el tribunal ha puesto alguna vez entre las cuatro opciones.<\/p>\n<h4>Las que desplazan el significado<\/h4>\n<table>\n<thead>\n<tr>\n<th>figura<\/th>\n<th>el mecanismo<\/th>\n<th>ejemplo<\/th>\n<th style=\"text-align: center;\">opción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Metáfora<\/strong><\/td>\n<td>da a algo el nombre de otro <strong>por un parecido<\/strong> entre los dos: el nombre se desplaza de su terreno al del otro<\/td>\n<td>«la tarde se evapora entre pantallas»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Comparación<\/strong> o símil<\/td>\n<td>pone los dos términos juntos y el parecido a la vista, <strong>con un nexo<\/strong>: <em>como<\/em>, <em>igual que<\/em>, <em>parece<\/em><\/td>\n<td>«salió de la reunión como quien sale de un juicio»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Personificación<\/strong><\/td>\n<td>deja el nombre en su sitio y le atribuye una <strong>acción o una cualidad humana<\/strong><\/td>\n<td>«la crisis castigó al comercio del barrio»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Metonimia<\/strong><\/td>\n<td>da a algo el nombre de otro <strong>por una relación real<\/strong> y no por parecido: el continente por el contenido, el autor por la obra, el lugar por la institución, la materia por el objeto<\/td>\n<td>«se bebió dos copas» · «lo dijo la Moncloa» · «tiene un Picasso»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Sinécdoque<\/strong><\/td>\n<td>la variedad de metonimia en que la relación es <strong>de parte a todo<\/strong>, o de todo a parte<\/td>\n<td>«no había ni un alma» · «se compró un techo» · «el país entero salió a la calle»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Hipérbole<\/strong><\/td>\n<td><strong>exagera<\/strong> la cantidad o el grado hasta un extremo imposible, y se entiende como énfasis<\/td>\n<td>«llevo esperando mil años»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Las que juegan con ideas contrarias<\/h4>\n<table>\n<thead>\n<tr>\n<th>figura<\/th>\n<th>el mecanismo<\/th>\n<th>ejemplo<\/th>\n<th style=\"text-align: center;\">opción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Antítesis<\/strong><\/td>\n<td>enfrenta dos ideas contrarias en partes distintas de la frase<\/td>\n<td>«mucho ruido en la reunión y poca decisión al final»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Oxímoron<\/strong><\/td>\n<td>junta dos palabras de sentido incompatible <strong>dentro del mismo sintagma<\/strong>, y el choque se lee como intensificación<\/td>\n<td>«una calma tensa», «un silencio ensordecedor»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Paradoja<\/strong><\/td>\n<td>formula un enunciado entero que <strong>parece<\/strong> contradecirse y que, leído del todo, afirma algo verdadero<\/td>\n<td>«una moneda muy valiosa que no sirve para comprar nada»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ironía<\/strong><\/td>\n<td>afirma lo contrario de lo que quiere dar a entender, y la situación deshace el equívoco<\/td>\n<td>«qué puntual, solo una hora tarde»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Eufemismo<\/strong><\/td>\n<td>sustituye una palabra dura por otra más suave<\/td>\n<td>«prescindir de la plantilla» por <em>despedir<\/em><\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Las que cambian el orden o la forma<\/h4>\n<table>\n<thead>\n<tr>\n<th>figura<\/th>\n<th>el mecanismo<\/th>\n<th>ejemplo<\/th>\n<th style=\"text-align: center;\">opción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Hipérbaton<\/strong><\/td>\n<td>altera el orden normal de las palabras<\/td>\n<td>«de la noche en el silencio»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Elipsis<\/strong><\/td>\n<td>suprime una palabra que se sobrentiende<\/td>\n<td>«unos firmaron el acuerdo; otros, no»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Anáfora<\/strong><\/td>\n<td>repite la misma palabra al principio de varias frases seguidas<\/td>\n<td>«Ni un aviso, ni una llamada, ni una línea»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Aliteración<\/strong><\/td>\n<td>repite un mismo sonido a lo largo de la frase<\/td>\n<td>«el susurro de la sierra en el serrín»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Enumeración<\/strong><\/td>\n<td>acumula elementos en serie<\/td>\n<td>«facturas, avisos, recibos, requerimientos»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Interrogación retórica<\/strong><\/td>\n<td>pregunta sin esperar respuesta, para afirmar algo<\/td>\n<td>«¿Quién aguanta ese horario?»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las ocho marcadas —cinco del primer bloque, dos del segundo y el hipérbaton del tercero— han aparecido en el examen. Las demás están aquí porque pueden salir entre las cuatro opciones como distractor, y reconocerlas permite descartarlas.<\/p>\n<h4>Las tres que se confunden<\/h4>\n<p><strong>Metáfora, personificación y metonimia.<\/strong> Las tres ponen un objeto de sujeto o de nombre donde el sentido literal pediría una persona, y se separan por lo que hace ese objeto.<\/p>\n<ul>\n<li><strong>Metáfora<\/strong>: el verbo o el nombre viene de otro terreno y ocupa el sitio de uno más llano. <em>La tarde se evapora<\/em> pone <em>evaporarse<\/em>, que es de líquidos, donde iría <em>pasarse<\/em>; <em>el taller se tragó el sueldo<\/em> pone <em>tragarse<\/em> donde iría <em>costar<\/em>; <em>el contrato le comió tres meses<\/em>, <em>comerse<\/em> donde iría <em>ocupar<\/em>.<\/li>\n<li><strong>Personificación<\/strong>: al objeto se le atribuye una acción o una cualidad <strong>propia de una persona<\/strong>. <em>La ropa habla, señala, diferencia<\/em>; <em>la impresora avisa y se calla<\/em>; <em>el aire acondicionado bebe con avidez de beodo<\/em>.<\/li>\n<li><strong>Metonimia<\/strong>: el objeto no actúa, sino que ocupa el lugar del nombre de quien actúa. <em>La ventanilla le dijo que faltaba un papel<\/em>: quien habla es la persona que atiende.<\/li>\n<\/ul>\n<p>La pregunta que separa las dos primeras: ¿la acción del verbo la hace solo una persona? <em>Hablar<\/em>, <em>avisar<\/em>, <em>señalar<\/em> y <em>callarse<\/em>, sí. <em>Evaporarse<\/em>, <em>tragar<\/em>, <em>comer<\/em> y <em>devorar<\/em> los hacen también un líquido o un animal, y entonces la respuesta es metáfora.<\/p>\n<p><strong>Metonimia y sinécdoque.<\/strong> Las dos nombran por una relación real. En la sinécdoque la relación es de parte a todo —<em>ni un alma<\/em> por <em>ni una persona<\/em>—; en la metonimia es de cualquier otro tipo: continente y contenido, lugar e institución, autor y obra. Muchos manuales tratan la sinécdoque como una clase de metonimia, y en un examen de cuatro opciones raramente aparecen las dos a la vez.<\/p>\n<p><strong>Oxímoron y paradoja.<\/strong> No se separan por lo largas que sean, aunque el oxímoron suela ocupar dos palabras. Se separan por dónde está la contradicción: el <strong>oxímoron<\/strong> la pone entre dos palabras que van juntas en el mismo sintagma, y el choque es de significados; la <strong>paradoja<\/strong> la pone en lo que afirma la frase entera, y se deshace al interpretarla. <em>Calma tensa<\/em> es un sintagma con dos palabras incompatibles; «una moneda muy valiosa que no sirve para comprar nada» es una afirmación entera que, pensada, afirma algo cierto sobre el valor.<\/p>\n<h4>Y el dato del censo, que ahorra tiempo<\/h4>\n<p>Los tres ítems de figura que vienen de exámenes no reservados tienen la misma respuesta, <strong>personificación<\/strong>.<\/p>\n<blockquote>\n<p><strong>2021t, 1.3.<\/strong> «En el enunciado <em>el aire acondicionado funcionando y bebiendo gasolina con avidez de beodo<\/em> hay…» → <strong>una personificación<\/strong>.<\/p>\n<p><strong>2026s, 1.4.<\/strong> «El enunciado del texto <em>La ropa habla, señala, diferencia<\/em> contiene…» → <strong>una personificación<\/strong>.<\/p>\n<p><strong>2026t, 1.4.<\/strong> «Cuando la narradora dice <em>el aire arrastra los faldones de una vieja dama muy conocida: la humedad<\/em>, ¿qué recurso literario utiliza?» → <strong>una personificación<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>El paso que resuelve esos tres ítems es el mismo: busca el verbo.<\/strong> <em>Beber con avidez<\/em>, <em>hablar<\/em>, <em>señalar<\/em> y <em>arrastrar los faldones<\/em> son acciones humanas, y quienes las hacen en esas tres frases son el aire acondicionado, la ropa y el aire. Cuando el sujeto es un objeto y el verbo nombra algo que solo hace una persona, la respuesta es personificación, aunque las otras tres opciones suenen más literarias.<\/p>\n<p><strong>La metonimia aparece como opción en los tres ítems y no ha sido la respuesta en ninguno.<\/strong> En los cinco ítems que han nombrado figuras en los veinticuatro exámenes ocurre lo mismo: la metonimia ha estado entre las cuatro opciones las cinco veces y no ha sido nunca la clave; el hipérbaton ha aparecido en tres y tampoco. Las dos están puestas para quien reconoce el nombre y no el mecanismo. Antes de marcar metonimia, comprueba que la frase nombre algo por una relación real con lo nombrado, como en <em>se bebió dos copas<\/em>.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué figura?", "dossier": {"cuaderno": "5", "ejercicio": 5}, "ayuda": "Catorce frases, cada una con una figura distinta. Identifica la figura de cada frase entre las diecisiete de las tablas del apartado 5.", "ops": ["metáfora", "comparación", "personificación", "metonimia", "sinécdoque", "hipérbole", "antítesis", "oxímoron", "paradoja", "ironía", "eufemismo", "hipérbaton", "elipsis", "anáfora", "aliteración", "enumeración", "interrogación retórica"], "items": [{"enun": "«El contrato le comió tres meses de vacaciones.»", "sol": "metáfora", "porque": "<i>comer<\/i> por <i>consumir<\/i>: el verbo se desplaza de su terreno"}, {"enun": "«El móvil se niega a cargar desde el martes.»", "sol": "personificación", "porque": "<i>negarse<\/i> es una decisión, y quien la toma es el móvil"}, {"enun": "«Fue a firmar al ayuntamiento» (por <i>a la oficina del ayuntamiento<\/i>).", "sol": "metonimia", "porque": "se nombra el edificio por la oficina que hay dentro"}, {"enun": "«Hemos hecho cien mil llamadas y nadie contesta.»", "sol": "hipérbole", "porque": "cien mil llamadas es una cantidad imposible, que se lee como énfasis"}, {"enun": "«Lo llamaron para el puesto: qué suerte, justo el día que empezaba en otro sitio.»", "sol": "ironía", "porque": "«qué suerte» afirma lo contrario de lo que pasó"}, {"enun": "«Trabaja tantas horas para pagar el piso que no lo pisa nunca.»", "sol": "paradoja", "porque": "las dos mitades se contradicen y juntas afirman algo cierto"}, {"enun": "«Salió de la entrevista como quien sale de un examen.»", "sol": "comparación", "porque": "lleva el nexo <i>como<\/i>"}, {"enun": "«Escuchó la negativa del banco con una calma tensa.»", "sol": "oxímoron", "porque": "<i>calma<\/i> y <i>tensa<\/i> van en el mismo sintagma y significan lo contrario"}, {"enun": "«De la paga extra ni rastro quedaba a mitad de enero.»", "sol": "hipérbaton", "porque": "el orden corriente sería <i>no quedaba ni rastro de la paga extra<\/i>"}, {"enun": "«No había ni un alma en la oficina.»", "sol": "sinécdoque", "porque": "<i>alma<\/i> nombra a la persona entera por una parte suya"}, {"enun": "«Ni una llamada, ni un correo, ni una línea en tres semanas.»", "sol": "anáfora", "porque": "<i>ni un<\/i> al principio de los tres miembros"}, {"enun": "«Unos cobraron en marzo; otros, en junio.»", "sol": "elipsis", "porque": "en el segundo miembro falta <i>cobraron<\/i>"}, {"enun": "«La empresa prescindió de doce personas.»", "sol": "eufemismo", "porque": "<i>prescindir de<\/i> por <i>despedir<\/i>"}, {"enun": "«¿Quién aguanta un horario así?»", "sol": "interrogación retórica", "porque": "no espera respuesta: afirma que nadie aguanta ese horario"}], "criterio": "La metáfora toma un verbo o un nombre de otro terreno por un parecido (<i>le comió tres meses<\/i>); la personificación atribuye a un objeto una acción de persona (el móvil <i>se niega<\/i>); la metonimia da a algo el nombre de otro elemento con el que tiene una relación real (el ayuntamiento por su oficina). Las figuras de forma se reconocen sin interpretar la frase: el <i>como<\/i> de la comparación, el orden cambiado del hipérbaton, el <i>ni un<\/i> repetido de la anáfora.", "apoyo": ["5 · Las figuras", "Las que cambian el orden o la forma"], "dossier_txt": "Del dossier: pieza 5, ejercicio 5"}, {"tipo": "clasificar", "titulo": "Las que se confunden: identifica la figura", "dossier": {"cuaderno": "5", "ejercicio": 6, "parte": "la figura"}, "ayuda": "Seis frases, en tres parejas de figuras que se parecen. Identifica la figura de cada una.", "ops": ["metáfora", "comparación", "personificación", "metonimia", "sinécdoque", "hipérbole", "antítesis", "oxímoron", "paradoja", "ironía", "eufemismo", "hipérbaton", "elipsis", "anáfora", "aliteración", "enumeración", "interrogación retórica"], "items": [{"enun": "«La ciudad devora el barrio viejo.»", "sol": "metáfora", "porque": "<i>devorar<\/i> sustituye a <i>ocupar<\/i> por un parecido"}, {"enun": "«La ciudad se quedó dormida a las dos.»", "sol": "personificación", "porque": "<i>quedarse dormida<\/i> es una acción humana y el sujeto es la ciudad"}, {"enun": "«Se compró un techo con treinta años de hipoteca.»", "sol": "sinécdoque", "porque": "<i>techo<\/i> es una parte de la casa y nombra la casa entera"}, {"enun": "«Escuchó a Cervantes toda la tarde.»", "sol": "metonimia", "porque": "el autor nombra su obra, y esa relación no es de parte a todo"}, {"enun": "«Un silencio ensordecedor.»", "sol": "oxímoron", "porque": "dos palabras incompatibles en un sintagma"}, {"enun": "«Cuanto más deprisa firmas, más tarde cobras.»", "sol": "paradoja", "porque": "la contradicción está en lo que afirma la frase entera"}], "criterio": "Cada pareja reúne dos figuras que se confunden: metáfora y personificación, sinécdoque y metonimia, oxímoron y paradoja. La pregunta que separa cada pareja está en el subapartado «Las tres que se confunden».", "apoyo": ["5 · Las figuras", "Las tres que se confunden"], "dossier_txt": "Del dossier: pieza 5, ejercicio 6 · la figura"}, {"tipo": "abierta", "titulo": "Las que se confunden: en qué se distinguen", "dossier": {"cuaderno": "5", "ejercicio": 6, "parte": "la diferencia"}, "ayuda": "Las tres parejas del ejercicio anterior. Explica en qué se distingue cada figura de la que se le parece, en dos o tres líneas.", "items": [{"enun": "«La ciudad devora el barrio viejo.» / «La ciudad se quedó dormida a las dos.»", "modelo": "La primera es una metáfora: <i>devorar<\/i> sustituye a <i>ocupar<\/i> por un parecido. La segunda es una personificación: <i>quedarse dormida<\/i> es una acción humana y el sujeto es la ciudad. En la metáfora se desplaza el nombre de la acción; en la personificación, la capacidad de hacerla."}, {"enun": "«Se compró un techo con treinta años de hipoteca.» / «Escuchó a Cervantes toda la tarde.»", "modelo": "La primera es una sinécdoque: <i>techo<\/i> es una parte de la casa y nombra la casa entera. La segunda es una metonimia: <i>Cervantes<\/i> es el autor y nombra su obra, una relación que no es de parte a todo."}, {"enun": "«Un silencio ensordecedor.» / «Cuanto más deprisa firmas, más tarde cobras.»", "modelo": "La primera es un oxímoron: dos palabras incompatibles en un mismo sintagma. La segunda es una paradoja: la contradicción está en lo que afirma la frase entera, y se resuelve al pensarla, porque quien firma deprisa suele firmar donde no toca."}], "criterio": "Una explicación completa nombra las dos figuras y el rasgo que las separa en el ejemplo: qué se desplaza, qué relación une el nombre con lo que designa, dónde está la contradicción.", "apoyo": ["5 · Las figuras", "Las tres que se confunden"], "dossier_txt": "Del dossier: pieza 5, ejercicio 6 · la diferencia"}, {"tipo": "opcion", "titulo": "¿Qué figura es? Tres reales y cuatro propios", "ayuda": "Siete ítems con cuatro opciones. Los tres con chapa de año son literales del examen, con su clave oficial; los cuatro sin chapa están escritos en el mismo formato, con otras figuras. Busca primero el verbo.", "items": [{"enun": "En el enunciado «el aire acondicionado funcionando y bebiendo gasolina con avidez de beodo» hay", "conv": "2021t", "ops": ["una metáfora.", "una personificación.", "un hipérbaton.", "una metonimia."], "sol": "una personificación.", "porque": "el aire acondicionado bebe con avidez de borracho: una acción humana hecha por un objeto: lo desplazado está en el verbo"}, {"enun": "El enunciado del texto «La ropa habla, señala, diferencia» contiene", "conv": "2026s", "ops": ["una paradoja.", "una metáfora.", "una personificación.", "una metonimia."], "sol": "una personificación.", "porque": "la ropa habla y señala: acciones de persona"}, {"enun": "Cuando la narradora dice «el aire arrastra los faldones de una vieja dama muy conocida: la humedad», ¿qué recurso literario utiliza?", "conv": "2026t", "ops": ["Una hipérbole.", "Una comparación.", "Una personificación.", "Una metonimia."], "sol": "Una personificación.", "porque": "la humedad es una vieja dama con faldones; la metonimia está de opción, como en los cinco ítems del censo, y no es nunca la clave"}, {"enun": "«El taller de la esquina es un agujero negro para el dinero de mi hermano» contiene", "ops": ["una hipérbole.", "una metonimia.", "una personificación.", "una metáfora."], "sol": "una metáfora.", "porque": "llama al taller con el nombre de otro objeto, un agujero negro; el taller no hace nada humano"}, {"enun": "«Cuanto más deprisa contestan los mensajes, más tarde se entienden» contiene", "ops": ["una paradoja.", "una metonimia.", "una personificación.", "un hipérbaton."], "sol": "una paradoja.", "porque": "dos ideas que se contradicen —deprisa, tarde— repartidas por la afirmación entera; si las dos palabras fueran contiguas sería un oxímoron"}, {"enun": "«Llevo esperando esa cita del médico desde antes de que inventaran el teléfono» contiene", "ops": ["una comparación.", "una hipérbole.", "una metonimia.", "un hipérbaton."], "sol": "una hipérbole.", "porque": "exagera la espera"}, {"enun": "«Salió de la entrevista blanco como el folio que llevaba en la mano» contiene", "ops": ["una comparación.", "una metonimia.", "una paradoja.", "una metáfora."], "sol": "una comparación.", "porque": "lleva el nexo <i>como<\/i>: dos términos puestos juntos, no uno en lugar de otro"}], "criterio": "Los tres reales se resuelven con el verbo: un objeto que bebe, habla o arrastra fa         elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
