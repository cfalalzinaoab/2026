<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 13 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Exámenes/2016_general_llengua_castellana_titular.pdf—, que mide 425 px y
   en un móvil de 390 desplazaba de lado la página entera. Hasta el 24-09-2026
   lo partía overflow-wrap:anywhere, por cualquier letra; ahora motor.js pone
   un <wbr> detrás de cada barra y cada guion bajo, y se parte por ahí */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}

details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}

<script>window.DIA = {"dia": 13, "fecha": "2026-11-10", "tab": "Día 13 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 10 de noviembre", "sub": "Set 2026t y los señuelos que se repiten · el comentario de 2025s, la cuarta redacción corta y la comparación de dos objetos · la tanda de plurales, femeninos y diminutivos", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set 2026t · los señuelos que se repiten", "meta": "20 minutos · el quinto set real, con tres de los cuatro señuelos que el tribunal repite; monosílabo o hiato en las palabras en -ir", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los señuelos que se repiten<\/h3>\n<p>Cuatro palabras han caído como señuelo tres veces cada una: <strong><em>caracteres<\/em><\/strong>, <strong><em>pon<\/em><\/strong>, <strong><em>euforia<\/em><\/strong> y <strong><em>textil<\/em><\/strong>. <em>Caracteres<\/em> y <em>euforia<\/em> son llanas acabadas en -s y en vocal, <em>textil<\/em> es aguda acabada en -l y <em>pon<\/em> es monosílabo: ninguna de las cuatro lleva tilde. <em>Caracteres<\/em> se explica ya en la pieza 1, con el par <em>carácter<\/em> / <em>caracteres<\/em>, y las cuatro se nombran en la clave 3 de la pieza 7; en el gimnasio se vuelven a comentar <strong>el día que salen en su set<\/strong>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set 2026t: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Las ocho palabras del ejercicio de 2026, tal como venían: sin ninguna tilde. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>grua<\/i>", "conv": "2026t", "sol": "grúa", "porque": "hiato: <i>ú<\/i> tónica + <i>a<\/i>"}, {"enun": "<i>pon<\/i>", "conv": "2026t", "sol": "pon", "porque": "monosílabo; señuelo repetido tres veces"}, {"enun": "<i>tengais<\/i>", "conv": "2026t", "sol": "tengáis", "porque": "aguda acabada en -s"}, {"enun": "<i>sosten<\/i>", "conv": "2026t", "sol": "sostén", "porque": "aguda acabada en -n"}, {"enun": "<i>sintesis<\/i>", "conv": "2026t", "sol": "síntesis", "porque": "esdrújula"}, {"enun": "<i>euforia<\/i>", "conv": "2026t", "sol": "euforia", "porque": "llana acabada en vocal; <i>ia<\/i> es diptongo; señuelo repetido"}, {"enun": "<i>reirse<\/i>", "conv": "2026t", "sol": "reírse", "porque": "hiato: <i>re-ír-se<\/i>"}, {"enun": "<i>textil<\/i>", "conv": "2026t", "sol": "textil", "porque": "aguda acabada en -l; señuelo repetido"}], "criterio": "Llevan tilde cinco de las ocho, y los tres señuelos son tres de las cuatro palabras que el tribunal repite: un monosílabo, una llana en vocal y una aguda en -l. <i>Reírse<\/i> lleva la tilde del hiato aunque acabe en -e.", "apoyo": ["Los señuelos que se repiten"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set 2026T"}, "dossier_txt": "Del dossier: anexo A-3 · Set 2026T"}, {"tipo": "hueco", "titulo": "Monosílabo o hiato: los pares que engañan", "estricto": true, "ayuda": "Ocho palabras sin tilde. Escribe cada una con tilde si la lleva y tal cual si no. Primero cuenta las sílabas: si tiene una sola, no lleva.", "items": [{"enun": "<i>reir<\/i>", "sol": "reír", "porque": "hiato, dos sílabas: <i>re-ír<\/i>"}, {"enun": "<i>huir<\/i>", "sol": "huir", "porque": "<i>ui<\/i> es diptongo: una sílaba, monosílabo"}, {"enun": "<i>oir<\/i>", "sol": "oír", "porque": "hiato, dos sílabas: <i>o-ír<\/i>"}, {"enun": "<i>fue<\/i>", "sol": "fue", "porque": "monosílabo: <i>ue<\/i> es diptongo"}, {"enun": "<i>guion<\/i>", "sol": "guion", "porque": "monosílabo desde 2010: <i>io<\/i> es diptongo por norma"}, {"enun": "<i>vio<\/i>", "sol": "vio", "porque": "monosílabo"}, {"enun": "<i>ruin<\/i>", "sol": "ruin", "porque": "<i>ui<\/i> es diptongo: monosílabo, como <i>huir<\/i>"}, {"enun": "<i>sonreis<\/i>", "sol": "sonreís", "porque": "hiato: <i>son-re-ís<\/i>, y además aguda acabada en -s"}], "criterio": "Llevan tilde tres de las ocho, las tres con hiato de abierta más cerrada tónica. Las otras cinco son monosílabos, y en dos de ellos, <i>huir<\/i> y <i>ruin<\/i>, la trampa es <i>ui<\/i>, que la norma trata siempre como diptongo aunque se pronuncie en dos golpes.", "apoyo": "todo", "solo_web": true}], "cuaderno": {"pieza": "A-3", "apartados": ["Set 2026T", "Los señuelos que se repiten"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Set 2026T; Los señuelos que se repiten (p. 295 y 301)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El segundo comentario · explicar una frase · la cuarta redacción corta", "meta": "60 minutos · el comentario de 2025s en el carril «El texto» (test y las tres preguntas); el formato de la 2.3; la redacción corta con el enunciado de 2018t; se entrega la primera larga", "teoria": "<h3>6 · El mismo tema, en las dos extensiones<\/h3>\n<p>Enunciado: <em>¿Debería contar como jornada laboral el tiempo que se tarda en llegar al trabajo?<\/em><\/p>\n<h4>Versión de 69 palabras (formato de Llengua castellana)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada. Quien vive a una hora de la fábrica dedica diez horas semanales a desplazarse, y ese tiempo no lo decide él: lo organiza el horario de la empresa. Además, pagarlo empujaría a las empresas a acercar los centros a donde vive la gente. Si no se cuenta, el sueldo real baja cuanto más lejos se vive.<\/p>\n<\/blockquote>\n<p>Cuatro frases: tesis, argumento 1, argumento 2 con <em>además<\/em>, cierre. Sin concesión: la extensión no la admite.<\/p>\n<h4>Versión de 182 palabras (formato del comentario)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada laboral, y debería contarlo también cuando el trayecto se hace en transporte público.<\/p>\n<p>La primera razón atiende a quién decide ese tiempo. Alguien que vive a una hora del polígono dedica diez horas a la semana a desplazarse, más de lo que dura una jornada completa, y las dedica porque la empresa ha decidido dónde está el centro de trabajo. Quien elige el lugar debería pagar el desplazamiento que provoca.<\/p>\n<p>La segunda razón es distinta: contarlo cambiaría la manera de instalar las empresas. Mientras el traslado lo asuma el trabajador con su tiempo, a la empresa le sale igual de barato poner la nave en un polígono sin autobús que al lado de una estación.<\/p>\n<p>Es cierto que una medida así encarecería contratar a quien vive lejos, y podría acabar perjudicando justamente a esas personas. Por eso tendría que aplicarse con un tope de kilómetros y con ayudas al transporte público.<\/p>\n<p>Si no se cuenta, el sueldo real de cada trabajador baja cuanto más lejos vive de su empresa.<\/p>\n<\/blockquote>\n<p><strong>Qué se ha añadido al pasar de 69 a 182 palabras<\/strong>, y en este orden: un dato dentro de cada argumento, la frase que explica <strong>por qué los dos argumentos son distintos<\/strong> («la segunda razón es distinta»), y una concesión entera con su solución. La tesis y el cierre son casi los mismos.<\/p>\n<h3>8 · Las tres preguntas fijas del comentario<\/h3>\n<p><strong>En el examen.<\/strong> El bloque 2 del comentario son <strong>3 puntos<\/strong> y trae <strong>las mismas tres preguntas en las seis convocatorias<\/strong>, en el mismo orden: proponer un título, resumir un párrafo delimitado y explicar una frase. Cada una vale 1 punto, ocupa <strong>de una a cinco líneas<\/strong> y, según los criterios, «admite fracciones en la puntuación (0,25, 0,5, 0,75) en función de la precisión de la respuesta».<\/p>\n<p>Y sobre las tres pesa la instrucción que recoge el apartado 6 de la pieza 10: <strong>reproducir frases del original se considera incorrecto<\/strong>.<\/p>\n<h4>8.1 · Proponer un título<\/h4>\n<p>Llengua castellana lo pidió una vez, en 2016, con un enunciado que detalla lo que se espera:<\/p>\n<blockquote>\n<p>«Proponga un título (y, si quiere, un subtítulo) para el texto. <strong>La propuesta no debe coincidir con el título del artículo<\/strong> y tiene que recoger debidamente el contenido del fragmento reproducido.»<\/p>\n<p>La clave da dos y admite otros equivalentes: <em>Las relaciones personales en internet<\/em> / <em>Influencia de las redes sociales en las relaciones interpersonales<\/em> / etc.<\/p>\n<\/blockquote>\n<p><strong>Los dos títulos que da la clave son sintagmas nominales<\/strong>, y los tres que acepta la de 2024s también: ninguno lleva verbo conjugado y todos nombran el tema del texto entero. Es el formato más frecuente y el más seguro, y el enunciado no lo exige: pide que el título no coincida con el del artículo y que recoja el contenido del fragmento. Un título con verbo que cumpla los dos requisitos sirve, y además recoge la tesis con más precisión que un sintagma nominal: el sintagma nombra el tema y la oración afirma algo sobre él.<\/p>\n<table>\n<thead>\n<tr>\n<th>sirve<\/th>\n<th>no sirve<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>El valor de la lectura<\/em><\/td>\n<td><em>Leer es bueno<\/em><\/td>\n<td>el segundo es la opinión de quien escribe, y el título recoge el contenido del texto<\/td>\n<\/tr>\n<tr>\n<td><em>Las redes sociales y la imagen que damos<\/em><\/td>\n<td><em>Internet<\/em><\/td>\n<td>demasiado ancho: vale para cualquier texto sobre la red y no distingue <strong>este<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>La discusión sobre si leer mejora a las personas<\/em><\/td>\n<td><em>Mi opinión sobre la lectura<\/em><\/td>\n<td>el título es del texto, no tuyo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres comprobaciones antes de darlo por bueno:<\/strong> que no repita el título original, que abarque el texto entero —no solo el primer párrafo— y que recoja el contenido del texto y no la opinión de quien lo escribe. Que lleve verbo conjugado no lo invalida.<\/p>\n<h4>8.2 · Resumir un párrafo delimitado<\/h4>\n<p>El enunciado marca el párrafo con <strong>su primera y su última palabra<\/strong>: «desde <em>Negar el valor<\/em> hasta <em>como la soberbia<\/em>». El párrafo cambia de una convocatoria a otra; la tarea, no.<\/p>\n<p>Llengua castellana pidió exactamente esto en 2015, y su clave sirve de modelo:<\/p>\n<blockquote>\n<p><strong>Enunciado:<\/strong> «Sintetice el párrafo inicial del texto: <em>El niño, inquieto ante esta noche tan diferente, […] le arranca la palabra tantas veces oída<\/em>.»<\/p>\n<p><strong>Clave:<\/strong> «En este párrafo el niño intuye instintivamente, a partir de una serie signos, que algo terrible le está sucediendo a su abuelo, lo que le lleva a pronunciar el apelativo con el que siempre se ha referido a él.»<\/p>\n<\/blockquote>\n<p><strong>Esa respuesta cumple cuatro condiciones<\/strong>, y las cuatro sirven para el resumen del comentario:<\/p>\n<ol>\n<li><strong>Treinta y nueve palabras<\/strong>, tres líneas. Se reproduce tal cual, con el <em>de<\/em> que le falta en «una serie signos».<\/li>\n<li><strong>Recoge qué pasa, por qué y con qué consecuencia<\/strong>: intuye · a partir de unos signos · y por eso pronuncia el nombre.<\/li>\n<li><strong>No repite ni una secuencia del original.<\/strong> Donde el texto escribe <em>inquieto ante esta noche tan diferente<\/em>, la respuesta pone <em>intuye instintivamente<\/em>. En esa sustitución aparecen a la vez los tres pasos del apartado 6 de la pieza 10.<\/li>\n<li><strong>Empieza por «En este párrafo…»<\/strong>, que sitúa la respuesta sin gastar media línea en metadiscurso.<\/li>\n<\/ol>\n<p><strong>Resumir el texto entero en lugar del párrafo pedido deja la respuesta fuera del enunciado.<\/strong> El enunciado delimita con dos palabras para evitarlo: lo que queda fuera de esas dos palabras no entra en el resumen.<\/p>\n<p><strong>Antes de resumir, se comprueba si el párrafo defiende algo o describe algo,<\/strong> y el resumen se escribe de la misma clase. El párrafo que manda resumir la 2.2 del comentario de 2026s no tiene tesis: describe cómo se va borrando la frontera entre el pensamiento propio y el acceso a la información digital, y la respuesta de la clave describe ese proceso. Un resumen que le pone una tesis a un párrafo descriptivo atribuye al texto una idea que no está en él, y los criterios puntúan esta pregunta por la precisión de la respuesta.<\/p>\n<h4>8.3 · Explicar una frase relacionándola con la argumentación<\/h4>\n<p>El enunciado entrecomilla una frase o un concepto del texto y pide explicarlo <strong>atándolo a lo que el texto defiende<\/strong>. Las palabras <em>relacionándola con la argumentación<\/em> deciden el punto: una paráfrasis de la frase, por buena que sea, deja sin contestar la mitad del enunciado si no explica para qué está esa frase en ese texto.<\/p>\n<p>La primera mitad —qué significa la expresión— ya la preguntaba Llengua castellana en 2016, en una pregunta de comprensión de 0,5 sobre «¿Somos lo que parecemos ser en internet?», el primer texto del trimestre:<\/p>\n<blockquote>\n<p><strong>Enunciado (2016t, 1.5):<\/strong> «Indique a qué idea del texto se refiere el autor con la expresión <em>idílica idea<\/em>.»<\/p>\n<p><strong>Clave oficial:<\/strong> «Contamos lo mejor de nosotros mismos (‘maquillamos’ nuestra identidad) solo en la red (en internet), y no en el contacto personal (cara a cara).»<\/p>\n<\/blockquote>\n<p>Esa pregunta se contesta entera con la paráfrasis, y la paráfrasis ya tiene dos partes: qué hacemos —<em>contamos lo mejor de nosotros mismos<\/em>— y dónde —<em>solo en la red, y no en el contacto personal<\/em>—. La 2.3 del comentario pide además la segunda mitad, <strong>qué función cumple la frase en el argumento del texto<\/strong>. En el texto de 2016, la <em>idílica idea<\/em> es la creencia que el autor discute: la nombra para rebatirla con los datos de la investigación psicológica, y una respuesta de comentario lo escribiría en su segunda frase.<\/p>\n<p><strong>El formato que funciona, en dos frases:<\/strong><\/p>\n<blockquote>\n<p><em>La expresión significa [qué].<\/em> · <em>El autor la usa para [qué defiende con ella].<\/em><\/p>\n<\/blockquote>\n<p>Y el error simétrico del 8.2: <strong>explicar la frase por su cuenta, como si fuera una definición de diccionario<\/strong>, sin indicar para qué está en ese texto. El enunciado exige «relacionándola con la argumentación», y esas tres palabras piden la segunda frase.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "La cuarta redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2018t; el texto de ese examen no se lee hoy, y la redacción se escribe con lo que cada uno sabe del tema. Las dos palabras del enunciado, uso y abuso, tienen que estar las dos en la tesis.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Redacte un texto, de entre cincuenta y ochenta palabras, en el que exponga su punto de vista sobre el uso y el abuso de las terapias antiaging.»", "conv": "2018t", "modelo": "Las terapias contra el envejecimiento tienen sentido mientras tratan un daño y dejan de tenerlo cuando prometen parar el tiempo. Una crema o una operación que corrige una lesión real mejora la vida de quien la recibe. Sin embargo, quien encadena tratamientos para parecer diez años más joven paga por una promesa que ningún médico puede cumplir, y cada tratamiento nuevo se compra con la decepción del anterior. El abuso empieza donde termina el diagnóstico. — Setenta y cuatro palabras: tesis con las dos palabras del enunciado, argumento del uso, argumento del abuso con <i>sin embargo<\/i>, cierre con la frontera."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. En adecuación se comprueba que la redacción hable del uso y del abuso, que son las dos palabras del enunciado; una redacción entera contra las terapias, sin explicar para qué sirven, contesta a media pregunta.", "apoyo": ["6 · El mismo tema, en las dos extensiones", "8.3 · Explicar una frase relacionándola con la argumentación"], "usa_texto": false, "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Lleva las dos mitades?", "ops": ["parecido y diferencia", "solo el parecido", "solo la diferencia", "empieza por el ejemplo"], "ayuda": "Ocho respuestas a la pregunta «en qué se parecen y en qué se diferencian». Explica qué le pasa a cada una.", "items": [{"enun": "«Un balcón y una terraza son partes de una vivienda que dan al exterior.»", "sol": "solo el parecido", "porque": "falta la diferencia: la mitad de la respuesta"}, {"enun": "«Mi hermano tiene un contrato temporal en el almacén y mi cuñada uno indefinido en el hospital.»", "sol": "empieza por el ejemplo", "porque": "dos personas y dos sitios, y ninguna propiedad de los contratos"}, {"enun": "«La terraza es más grande que el balcón y suele estar en la azotea o en la planta baja.»", "sol": "solo la diferencia", "porque": "falta nombrar qué son los dos"}, {"enun": "«Un autobús y un tranvía son dos medios de transporte público urbano que llevan a muchas personas a la vez; el autobús va por la calzada con ruedas y el tranvía por raíles fijos.»", "sol": "parecido y diferencia", "porque": "el hiperónimo común y después la propiedad que los separa"}, {"enun": "«Un contrato temporal y uno indefinido son acuerdos de trabajo por escrito entre una empresa y una persona.»", "sol": "solo el parecido", "porque": "el hiperónimo común está y la diferencia no"}, {"enun": "«El balcón es lo que tiene mi vecina del segundo, con las macetas, y la terraza es la del ático.»", "sol": "empieza por el ejemplo", "porque": "dos casos concretos; quien no sepa qué es un balcón sigue sin saberlo"}, {"enun": "«Una nómina y una factura son documentos que justifican un pago; la nómina la cobra un trabajador por cuenta ajena cada mes y la factura la emite quien vende un producto o un servicio.»", "sol": "parecido y diferencia", "porque": "las dos mitades, con el hiperónimo <i>documentos<\/i> delante"}, {"enun": "«El temporal tiene fecha de fin y el indefinido no.»", "sol": "solo la diferencia", "porque": "la diferencia está bien formulada y falta el parecido"}], "criterio": "Las dos que puntúan entero llevan el hiperónimo común y la propiedad que separa. Las de una sola mitad se completan añadiendo la otra, y las que empiezan por el ejemplo se reescriben desde la clase: qué son los dos objetos.", "apoyo": ["6 · El mismo tema, en las dos extensiones", "Versión de 182 palabras (formato del comentario)"], "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: parecidos y diferencias", "ayuda": "Dos o tres líneas cada una, con el hiperónimo común primero y la diferencia después. El enunciado con chapa de año es el real de 2026t y se entrega hoy.", "items": [{"enun": "«Explique brevemente, en dos o tres líneas, en qué se parecen y en qué se diferencian un tejado y una azotea.»", "conv": "2026t", "modelo": "La clave oficial pide, como parecido, que los dos cubren la parte superior de un edificio y lo protegen de la intemperie; y como diferencia, que el tejado suele ser inclinado, cubierto de tejas u otro material y no transitable, y la azotea es plana, transitable y se usa para tender la ropa o tomar el sol. Un modelo: «Un tejado y una azotea son las dos cubiertas que cierran un edificio por arriba y lo protegen de la lluvia. Se diferencian en que el tejado es inclinado, va cubierto de tejas y no se puede pisar, mientras que la azotea es plana y se usa para tender o para tomar el sol.» Cincuenta y cuatro palabras: el hiperónimo común primero y la propiedad que los separa después."}, {"enun": "En qué se parecen y en qué se diferencian un contrato temporal y un contrato indefinido.", "modelo": "«Un contrato temporal y uno indefinido son acuerdos de trabajo por escrito entre una empresa y una persona, y los dos fijan el sueldo, la jornada y las tareas. Se diferencian en que el temporal lleva una fecha de fin y el indefinido no: solo termina si una de las dos partes lo rompe.» Cincuenta y cuatro palabras, con la diferencia formulada desde la fecha de fin."}], "criterio": "Se corrige por mitades: media respuesta con una sola de las dos. Y la mitad del parecido tiene que nombrar la clase —cubiertas, acuerdos—, porque un parecido formulado con <i>los dos sirven para…<\/i> sin hiperónimo deja el hueco de la definición vacío.", "apoyo": ["8 · Las tres preguntas fijas del comentario", "8.2 · Resumir un párrafo delimitado"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [6, 8]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 6 y 8: El mismo tema, en las dos extensiones; Las tres preguntas fijas del comentario (p. 73 y 78)", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "La utilidad de lo inútil · Comentari de text 2025, tribunal especial", "meta": "Convocatoria 2025, tribunal especial · 513 palabras · el segundo examen de comentario: test, las tres preguntas y los dos enunciados de la parte 2", "literal": true, "teoria": "<h3>6 · Comentari de text 2025, tribunal especial · la utilidad de lo inútil<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Nuccio Ordine, <em>La utilidad de lo inútil: Manifiesto<\/em> (Acantilado, 2013), pp. 28-111, adaptado<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>ensayo argumentativo, 513 palabras el cuerpo castellano, sin la línea de procedencia<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Comentari de text 2025, tribunal especial; el texto castellano, en el cuaderno de textos de cada sesión (texto 6); la clave está redactada en catalán<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>10 de noviembre · test y las tres preguntas del bloque 2; la redacción larga va encargada para ese día<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto va el segundo de los comentarios.<\/strong> Es el más argumentativo de los tres del trimestre: tiene tesis explícita, contraargumento reconocido —el autor se adelanta a los científicos que podrían sentirse atacados— y cierre con una cita. Sirve para enseñar lo que la pieza 11 pide en la redacción larga, porque el texto hace delante del alumno lo que él tiene que hacer después.<\/p>", "lectura": {"titulo": "La utilidad de lo inútil", "entrada": "Nuccio Ordine · <i>La utilidad de lo inútil: Manifiesto<\/i> (Barcelona: Acantilado, 2013, pp. 28-111) · adaptación, tal como la reproduce el cuadernillo de Comentari de text de 2025 (tribunal especial), versión castellana.", "lineas": ["No por azar en las últimas décadas a las disciplinas", "humanísticas se las considera inútiles, se las margina no solo", "en los programas escolares sino sobre todo en los capítulos de", "los presupuestos estatales y en los fondos de las entidades", "privadas y las fundaciones. ¿Para qué gastar dinero en un", "ámbito condenado a no generar beneficios? ¿Por qué destinar", "fondos a saberes que no aportan un rápido y tangible", "rendimiento económico?", "", "En este contexto basado exclusivamente en la necesidad de", "pesar y medir con arreglo a criterios que privilegian la", "quantitas, la literatura (pero el mismo discurso podría valer", "para otros saberes humanísticos, así como para los saberes", "científicos sin un propósito utilitarista inmediato) puede por", "el contrario asumir una función fundamental, importantísima:", "precisamente el hecho de ser inmune a toda aspiración al", "beneficio podría constituir, por sí mismo, una forma de", "resistencia a los egoísmos del presente, un antídoto contra la", "barbarie de lo útil que ha llegado incluso a corromper", "nuestras relaciones sociales y nuestros afectos más íntimos.", "Su existencia misma, en efecto, llama la atención sobre la", "gratuidad y el desinterés, valores que hoy se consideran", "contra corriente y pasados de moda.", "", "Pero el elogio de la útil inutilidad de la literatura y la", "filosofía no debe, sin embargo, inducir a engaño. Quisiera", "decir claramente —y no lo hago solo para tranquilizar a los", "colegas científicos— que no me propongo en absoluto volver a", "plantear la dañina contraposición entre saberes humanísticos y", "saberes científicos. Al contrario: consciente de las distintas", "funciones de unos y otros, estoy firmemente convencido de que", "también la ciencia ha ocupado y ocupa un lugar importante en", "la batalla contra las leyes del mercado y el beneficio. Es", "bien sabido que de trabajos científicos considerados en", "apariencia inútiles, esto es, no dirigidos a un preciso", "objetivo práctico, se ha derivado después una inesperada", "utilidad. Los inventos de Guglielmo Marconi habrían sido", "impensables sin las investigaciones sobre las ondas", "electromagnéticas que realizaron James Clerk Maxwell y", "Heinrich Rudolf Hertz: estudios, conviene hacer hincapié en", "ello, inspirados tan solo por la necesidad de satisfacer una", "curiosidad puramente teórica. De hecho, los descubrimientos", "fundamentales que han revolucionado la historia de la", "humanidad son fruto, en gran parte, de investigaciones", "alejadas de cualquier objetivo utilitarista.", "", "En los próximos años habrá que esforzarse para salvar de esta", "deriva utilitarista no solo la ciencia, la escuela y la", "universidad, sino también todo lo que llamamos cultura. Habrá", "que resistir a la disolución programada de la enseñanza, de la", "investigación científica, de los clásicos y de los bienes", "culturales. Porque sabotear la cultura y la enseñanza", "significa sabotear el futuro de la humanidad. Hace algún", "tiempo tuve ocasión de leer una frase simple, pero muy", "significativa, inscrita en el tablón de anuncios de una", "biblioteca de manuscritos en un perdido oasis del Sahara: «El", "conocimiento es una riqueza que se puede transmitir sin", "empobrecerse». Solo el saber —poniendo en cuestión los", "paradigmas dominantes del beneficio— puede ser compartido sin", "empobrecer. Al contrario, enriqueciendo a quien lo transmite y", "a quien lo recibe."], "pie": "Adaptación de fragmentos de <i>La utilidad de lo inútil<\/i>, de Nuccio Ordine (Acantilado, 2013), en la versión del cuadernillo oficial de la PAU +25 de 2025, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2025_general_comentari_de_text_suplent.pdf<\/i>, p. 4."}, "ejercicios": [{"tipo": "opcion", "titulo": "Bloque 1: las seis preguntas de test", "ayuda": "Literales, con su respuesta oficial. Diez minutos de reloj. Rodea el «falsa» de la 1.5 antes de leer sus opciones.", "items": [{"enun": "<b>1.1<\/b> ¿Cuál es la principal intención del autor con este texto?", "conv": "2025s", "ops": ["Mostrar que la literatura y la filosofía son completamente inútiles en la sociedad actual.", "Defender la relevancia de las humanidades en un mundo obsesionado por la utilidad.", "Sostener que la ciencia es la única disciplina valiosa en la sociedad contemporánea.", "Criticar la literatura y la filosofía como disciplinas obsoletas e irrelevantes."], "sol": "Defender la relevancia de las humanidades en un mundo obsesionado por la utilidad.", "porque": "la intención: lo que el autor quiere conseguir con el texto. Las otras tres afirman lo contrario de lo que defiende"}, {"enun": "<b>1.2<\/b> Según lo que se expone y se puede inferir del texto, ¿qué papel desempeñan la literatura y la filosofía en la sociedad actual?", "conv": "2025s", "ops": ["Son esenciales para generar beneficios económicos rápidos y tangibles.", "Representan una forma de resistencia a la obsesión por la utilidad y la cuantificación.", "Deben ser marginadas en los programas escolares y los presupuestos estatales.", "Son obsoletas y no tienen lugar en la sociedad moderna."], "sol": "Representan una forma de resistencia a la obsesión por la utilidad y la cuantificación.", "porque": "el contenido de la tesis, en el segundo párrafo: una forma de resistencia a los egoísmos del presente. La 1.1 preguntaba la intención; esta, la tesis"}, {"enun": "<b>1.3<\/b> Cuando el autor habla de la «batalla contra las leyes del mercado y el beneficio», hace referencia a que", "conv": "2025s", "ops": ["la ciencia debe adaptarse a las leyes del mercado y al beneficio económico.", "la cultura y la enseñanza deben ser sacrificadas en aras de la economía de mercado.", "los saberes culturales y científicos deben preservarse y protegerse de la influencia del mercado y del beneficio.", "la ciencia es la única disciplina que puede vencer a las leyes del mercado y al beneficio."], "sol": "los saberes culturales y científicos deben preservarse y protegerse de la influencia del mercado y del beneficio.", "porque": "la frase está en el tercer párrafo y sostiene que también la ciencia está en esa batalla: los dos saberes, no uno solo"}, {"enun": "<b>1.4<\/b> Según lo que se puede inferir del texto, podemos decir que", "conv": "2025s", "ops": ["el autor considera que los inventos de Marconi demuestran la inutilidad de la investigación teórica.", "las investigaciones de Maxwell y Hertz muestran la importancia de la investigación teórica sin beneficios prácticos.", "el autor sugiere que la ciencia solo avanza cuando se busca un objetivo práctico.", "la investigación teórica solo tiene valor cuando se relaciona con la búsqueda de beneficios económicos."], "sol": "las investigaciones de Maxwell y Hertz muestran la importancia de la investigación teórica sin beneficios prácticos.", "porque": "el ejemplo del tercer párrafo: los inventos de Marconi salieron de estudios hechos por curiosidad teórica"}, {"enun": "<b>1.5<\/b> Teniendo en cuenta lo que se defiende en el texto, ¿cuál de las siguientes afirmaciones es falsa?", "conv": "2025s", "ops": ["En las últimas décadas, las disciplinas humanísticas se consideran inútiles y se marginan en los programas escolares y los presupuestos estatales.", "La literatura y otras disciplinas humanísticas pueden desempeñar una función importante al resistirse a la obsesión contemporánea por lo útil y la cuantificación.", "El autor no defiende la contraposición entre saberes humanísticos y científicos y reconoce la importancia de ambos en la sociedad.", "La ciencia siempre busca un objetivo utilitarista en sus investigaciones."], "sol": "La ciencia siempre busca un objetivo utilitarista en sus investigaciones.", "porque": "la falsa afirma lo contrario de todo el tercer párrafo, y la palabra <i>siempre<\/i> es la pista: los enunciados absolutos suelen ser la opción falsa"}, {"enun": "<b>1.6<\/b> Tal y como se utiliza en el texto, el adjetivo <i>tangible<\/i>", "conv": "2025s", "ops": ["significa ‘que se puede percibir de manera precisa’.", "es sinónimo de intangible.", "significa ‘imperceptible, difícil de notar’.", "es antónimo de palpable, perceptible, concreto."], "sol": "significa ‘que se puede percibir de manera precisa’.", "porque": "«un rápido y tangible rendimiento económico»: un rendimiento perceptible y medible. Dos opciones dan una relación en lugar de un significado, y además son falsas"}], "criterio": "Las dos primeras tienen la misma letra y no son la misma pregunta: la 1.1 pide la intención y la 1.2 el contenido de la tesis; quien marca por parecido acierta las dos sin saber por qué. La 1.5 se resuelve por descarte, y la 1.6 con el diseño de 2024s: definiciones mezcladas con relaciones.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Bloque 2: las tres preguntas fijas", "ayuda": "De una a cinco líneas cada una, sin reproducir frases del original. Se puntúan en cuartos según la precisión.", "items": [{"enun": "<b>2.1<\/b> Proponga un título que se adecúe al contenido del texto que acaba de leer.", "conv": "2025s", "modelo": "Clave oficial, traducida: <i>La relevancia de las disciplinas humanísticas en el mundo actual<\/i> · <i>El papel de la literatura y la filosofía en la sociedad contemporánea<\/i> · <i>La crisis de las humanidades en un mundo obsesionado por la utilidad<\/i> · <i>La lucha por la cultura en una era utilitarista<\/i>. Cuatro sintagmas nominales sin verbo, y los cuatro nombran el tema entero, no un párrafo."}, {"enun": "<b>2.2<\/b> Resuma el tercer párrafo del texto (es decir, desde «Pero el elogio de la útil inutilidad de la literatura y la filosofía» hasta «de investigaciones alejadas de cualquier objetivo utilitarista»).", "conv": "2025s", "modelo": "Clave oficial, traducida: «Se defiende la “útil inutilidad” de la literatura y la filosofía, pero aclarando que no se busca confrontar las disciplinas humanísticas y científicas. Se reconoce que la ciencia ha conseguido avances significativos a través de investigaciones teóricas que han desafiado la utilidad inmediata y han destacado la importancia de los estudios sin un objetivo aplicado evidente.» Dos movimientos, igual que el párrafo: lo que el autor defiende y la aclaración de que no ataca a la ciencia. Un resumen que se quede en la primera mitad deja fuera la concesión, y ese párrafo es la concesión del texto."}, {"enun": "<b>2.3<\/b> Explique, relacionándola con la argumentación del texto, la siguiente frase: «El conocimiento es una riqueza que se puede transmitir sin empobrecerse».", "conv": "2025s", "modelo": "Clave oficial, resumida y traducida: la frase se refiere al valor propio del conocimiento, que no se gasta ni se empobrece al compartirlo, sino que enriquece a quien lo transmite y a quien lo recibe; en el texto sirve para defender que hay que preservar y transmitir la cultura a pesar de la obsesión por la utilidad y el beneficio, porque el saber escapa a esa lógica. Las dos frases del formato: <i>significa<\/i> que el saber no se agota al repartirlo, al revés que el dinero; <i>el autor la usa para<\/i> cerrar su defensa de los saberes sin beneficio inmediato."}], "criterio": "Las tres se corrigen en cuartos. En la 2.2 el párrafo mandado es el de la concesión, y un resumen sin la segunda mitad deja fuera la concesión; en la 2.3 la clave ata la frase al argumento, y una respuesta que solo parafrasee contesta a medias. Las tres admiten fracciones —0,25, 0,5, 0,75— según la precisión de la respuesta.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Parte 2: la redacción de 150 a 200 palabras", "ayuda": "Hoy no se escribe: es la segunda redacción larga del curso, que se encarga el 19 de noviembre para el 24. Queda aquí para escribirla entonces, con el contador de palabras. Se elige UNA de las dos opciones.", "palabras": {"min": 150, "max": 200}, "items": [{"enun": "«Opción A. ¿Es justificable la inversión de recursos públicos y privados en disciplinas humanísticas y científicas que no generan beneficios económicos inmediatos? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que reflexione sobre esta cuestión. Su texto debe incluir como mínimo dos argumentos.» · «Opción B. ¿Puede/debe la educación contribuir a mantener el conocimiento y la cultura y oponerse al utilitarismo de la sociedad actual? Escriba un texto, de entre ciento cincuenta y doscientas palabras, en el que responda a esta pregunta. Su texto debe incluir como mínimo dos argumentos.»", "conv": "2025s", "modelo": "Sin clave: se corrige con la rúbrica del comentario —adecuación 1, coherencia 1,5, estilo 1,5—, con el recuento de palabras y con el descuento por faltas sin tope. Los criterios de 2025 lo establecen así: la respuesta vale tanto a favor como en contra, con al menos dos argumentos válidos y distintos, 0,5 cada uno, y la respuesta a la pregunta bien establecida; en coherencia se valoran negativamente las repeticiones injustificadas, el desorden y la argumentación circular. El propio texto de Ordine sirve de esquema: tesis, concesión, dos argumentos, cierre con consecuencia."}], "criterio": "Los criterios del comentario lo exigen con estas palabras: dos argumentos válidos y diferentes, 0,5 cada uno; argumentación circular, en contra; y 0,5 menos por bajar de 150 palabras o pasar de 200.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [6]}, {"pieza": "TEXTOS", "apartados": [6]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 6: Comentari de text 2025, tribunal especial · la utilidad de lo inútil (p. 259) · Los textos de cada sesión — apartado 6: «La utilidad de lo inútil» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La tanda: plurales, femeninos y diminutivos", "meta": "10 minutos · seis ítems propios en el formato de las preguntas de lista", "teoria": "<h3>4 · Plurales, femeninos y diminutivos<\/h3>\n<h4>Plurales<\/h4>\n<p>Dos sets reales: <em>vals, tabú, pasapurés, rapaz, compás<\/em> (2020t) y <em>jueves, tabú, arpón, desliz, análisis<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>singular<\/th>\n<th>plural<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>vals<\/td>\n<td><strong>valses<\/strong><\/td>\n<td>acabado en consonante, añade <em>-es<\/em><\/td>\n<\/tr>\n<tr>\n<td>tabú<\/td>\n<td><strong>tabús<\/strong> o <strong>tabúes<\/strong><\/td>\n<td>acabado en <em>-ú<\/em> tónica: la clave oficial de 2015t da «tabús (o tabúes)»<\/td>\n<\/tr>\n<tr>\n<td>pasapurés<\/td>\n<td><strong>pasapurés<\/strong><\/td>\n<td>compuesto de verbo más sustantivo en plural, como <em>sacacorchos<\/em>: <strong>no cambia<\/strong><\/td>\n<\/tr>\n<tr>\n<td>rapaz<\/td>\n<td><strong>rapaces<\/strong><\/td>\n<td>la <em>z<\/em> pasa a <em>c<\/em> delante de <em>e<\/em><\/td>\n<\/tr>\n<tr>\n<td>compás<\/td>\n<td><strong>compases<\/strong><\/td>\n<td>aguda acabada en <em>-s<\/em>: añade <em>-es<\/em> y <strong>pierde la tilde<\/strong><\/td>\n<\/tr>\n<tr>\n<td>jueves<\/td>\n<td><strong>jueves<\/strong><\/td>\n<td>llana acabada en <em>-s<\/em>: no cambia<\/td>\n<\/tr>\n<tr>\n<td>arpón<\/td>\n<td><strong>arpones<\/strong><\/td>\n<td>pierde la tilde al añadir sílaba<\/td>\n<\/tr>\n<tr>\n<td>desliz<\/td>\n<td><strong>deslices<\/strong><\/td>\n<td><em>z<\/em> → <em>c<\/em><\/td>\n<\/tr>\n<tr>\n<td>análisis<\/td>\n<td><strong>análisis<\/strong><\/td>\n<td>esdrújula acabada en <em>-s<\/em>: no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los dos grupos que dan los puntos:<\/strong> los que <strong>no cambian<\/strong> —<em>jueves<\/em> y <em>análisis<\/em>, llano y esdrújula acabados en <em>-s<\/em>— y los que <strong>pierden la tilde<\/strong> al crecer una sílaba —<em>compás<\/em> → <em>compases<\/em>, <em>arpón<\/em> → <em>arpones<\/em>—. <em>Pasapurés<\/em> también se queda igual, y por otra razón: es agudo, y lo que lo hace invariable es su formación, verbo más sustantivo en plural. En <em>régimen<\/em> → <em>regímenes<\/em> la tilde ni se gana ni se pierde: las dos formas son esdrújulas y la tilde se mueve con la fuerza.<\/p>\n<h4>Femeninos<\/h4>\n<p><em>Emperador<\/em> → <strong>emperatriz<\/strong>; <em>alcalde<\/em> → <strong>alcaldesa<\/strong>; <em>testigo<\/em> → <strong>la testigo<\/strong>, que es común en cuanto al género y solo cambia el artículo, como <em>el pianista / la pianista<\/em>. Distinto es <em>la víctima<\/em>, que es <strong>epiceno<\/strong>: una sola forma y un solo artículo para los dos sexos —«la víctima era un hombre de sesenta años»—.<\/p>\n<p><strong>Los acabados en consonante añaden <em>-a<\/em>,<\/strong> y si eran agudos con tilde la pierden, porque la palabra gana una sílaba y pasa a llana acabada en vocal: <em>bailarín<\/em> → <strong>bailarina<\/strong>, <em>escocés<\/em> → <strong>escocesa<\/strong>. En el examen se escriben con el artículo delante. La clave de 2019s da así las cinco que pedía: <em>la maniquí<\/em>, <em>la bailarina<\/em>, <em>la alcaldesa<\/em>, <em>la escocesa<\/em>, <em>la testigo<\/em>; en <em>maniquí<\/em> y <em>testigo<\/em> el artículo es lo único que marca el femenino.<\/p>\n<h4>Diminutivos<\/h4>\n<p>Set real de 2025t: <em>agua, pez, ruido, lluvia, examen<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>palabra<\/th>\n<th>diminutivo<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>agua<\/td>\n<td><strong>agüita<\/strong><\/td>\n<td>necesita diéresis para que la <em>u<\/em> suene<\/td>\n<\/tr>\n<tr>\n<td>pez<\/td>\n<td><strong>pececito<\/strong><\/td>\n<td>la <em>z<\/em> pasa a <em>c<\/em>, y entra <em>-ecito<\/em><\/td>\n<\/tr>\n<tr>\n<td>ruido<\/td>\n<td><strong>ruidito<\/strong><\/td>\n<td>regular<\/td>\n<\/tr>\n<tr>\n<td>lluvia<\/td>\n<td><strong>lluviecita<\/strong> o <strong>lluvita<\/strong><\/td>\n<td>la clave admite las dos<\/td>\n<\/tr>\n<tr>\n<td>examen<\/td>\n<td><strong>examencito<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>La clave admite también las formas en -illo / -illa.<\/em><\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Escriba el plural de los siguientes sustantivos", "estricto": true, "ayuda": "Diez palabras en dos ítems del formato real. Escribe cada plural con su tilde si la lleva.", "items": [{"enun": "<i>carácter<\/i>", "sol": "caracteres", "porque": "la fuerza se mueve una sílaba y la tilde desaparece"}, {"enun": "<i>régimen<\/i>", "sol": "regímenes", "porque": "la tilde cambia de sílaba, <b>ré<\/b>-gi-men → re-<b>gí<\/b>-me-nes: las dos son esdrújulas"}, {"enun": "<i>esquí<\/i>", "sol": "esquís|esquíes", "porque": "las dos valen"}, {"enun": "<i>currículum<\/i>", "sol": "currículums", "porque": "latinismo en <i>-um<\/i>: añade <i>-s<\/i>; <i>currículos<\/i> es el plural de otra palabra"}, {"enun": "<i>lápiz<\/i>", "sol": "lápices", "porque": "la <i>z<\/i> pasa a <i>c<\/i>, y la tilde se queda"}, {"enun": "<i>crisis<\/i>", "sol": "crisis", "porque": "llana acabada en -s: no cambia"}, {"enun": "<i>menú<\/i>", "sol": "menús", "porque": "añade <i>-s<\/i> y conserva la tilde"}, {"enun": "<i>autobús<\/i>", "sol": "autobuses", "porque": "pierde la tilde: pasa a llana acabada en -s"}, {"enun": "<i>láser<\/i>", "sol": "láseres", "porque": "añade <i>-es<\/i> y conserva la tilde: esdrújula"}, {"enun": "<i>referéndum<\/i>", "sol": "referéndums", "porque": "latinismo en <i>-um<\/i>: añade <i>-s<\/i>"}], "criterio": "Los cinco grupos de la tabla del jueves 5 de noviembre, repartidos: dos que no cambian o solo añaden, dos que pierden la tilde, una en la que la tilde cambia de sílaba, una <i>z<\/i> y dos latinismos. Escribir ⊗<i>autobúses<\/i> cuenta como plural fallado.", "apoyo": ["4 · Plurales, femeninos y diminutivos", "Plurales"], "solo_web": true}, {"tipo": "hueco", "titulo": "Escriba el femenino de los siguientes sustantivos", "estricto": true, "ayuda": "Cinco palabras. En las que no cambian de forma, escribe el artículo delante.", "items": [{"enun": "<i>actor<\/i>", "sol": "actriz|la actriz", "porque": "<i>-triz<\/i>"}, {"enun": "<i>poeta<\/i>", "sol": "poetisa|la poeta|la poetisa", "porque": "<i>poetisa<\/i>, y también <i>la poeta<\/i>"}, {"enun": "<i>príncipe<\/i>", "sol": "princesa|la princesa", "porque": "<i>-esa<\/i>"}, {"enun": "<i>modelo<\/i>", "sol": "la modelo", "porque": "común en cuanto al género: solo cambia el artículo"}, {"enun": "<i>juez<\/i>", "sol": "jueza|la jueza|la juez", "porque": "<i>jueza<\/i> y <i>la juez<\/i>, las dos admitidas"}], "criterio": "Dos terminaciones propias, una <i>-esa<\/i> y dos comunes en cuanto al género. En <i>modelo<\/i> la única marca de femenino es el artículo, y sin él la respuesta se queda igual que el enunciado.", "apoyo": ["4 · Plurales, femeninos y diminutivos", "Femeninos"], "solo_web": true}, {"tipo": "hueco", "titulo": "Escriba el diminutivo de los siguientes sustantivos", "estricto": true, "ayuda": "Cinco palabras. Valen las formas en <i>-ito<\/i> y en <i>-illo<\/i>.", "items": [{"enun": "<i>pan<\/i>", "sol": "panecillo|panecito", "porque": "monosílabo: <i>-ecito<\/i>, <i>-ecillo<\/i>"}, {"enun": "<i>flor<\/i>", "sol": "florecita|florecilla", "porque": "monosílabo: <i>-ecita<\/i>"}, {"enun": "<i>café<\/i>", "sol": "cafecito|cafelito|cafetito|cafecillo", "porque": "acabada en vocal tónica: <i>-cito<\/i>; la tilde desaparece porque la fuerza cambia de sílaba"}, {"enun": "<i>mano<\/i>", "sol": "manita|manecita", "porque": "las dos admitidas"}, {"enun": "<i>hombre<\/i>", "sol": "hombrecito|hombrecillo", "porque": "acabada en -e: <i>-cito<\/i>"}], "criterio": "Dos monosílabos con <i>-ecito<\/i>, dos con <i>-cito<\/i> y uno regular con dos formas. En <i>cafecito<\/i> la tilde de <i>café<\/i> desaparece, porque la palabra nueva es llana acabada en vocal.", "apoyo": ["4 · Plurales, femeninos y diminutivos", "Plurales"], "solo_web": true}, {"tipo": "opcion", "titulo": "Dos ítems de test", "ayuda": "Los mismos plurales, preguntados desde el otro lado: cuál está mal y cuál sí cambia.", "items": [{"enun": "¿Cuál de estos plurales está <b>mal<\/b> formado?", "ops": ["los currículums", "los cáracteres", "los tórax", "los regímenes"], "sol": "los cáracteres", "porque": "<i>caracteres<\/i>, sin tilde: al pasar al plural la fuerza se mueve una sílaba. <i>Los tórax<\/i> no cambia, como <i>los lunes<\/i>"}, {"enun": "¿Cuál de estas palabras <b>sí<\/b> cambia en plural?", "ops": ["el análisis", "el jueves", "el pasapurés", "el autobús"], "sol": "el autobús", "porque": "<i>autobuses<\/i>; las otras tres son llanas o esdrújulas acabadas en -s y se quedan igual"}], "criterio": "Los dos se resuelven con la tabla del plural: <i>tórax<\/i>, <i>análisis<\/i>, <i>jueves<\/i> y <i>pasapurés<\/i> no cambian, y <i>cáracteres<\/i> lleva la tilde donde ya no va la fuerza.", "apoyo": ["4 · Plurales, femeninos y diminutivos", "Plurales"], "solo_web": true}], "cuaderno": {"pieza": 7, "apartados": [4]}, "cuaderno_txt": "Pieza 7 · Nombre y adjetivo: plurales, femeninos, derivadas y primitivos — apartado 4: Plurales, femeninos y diminutivos (p. 177)", "teoria_dossier": true}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto de Nuccio Ordine (Acantilado, 2013), reproducido en el carril «El texto» en la adaptación del cuadernillo de 2025, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
