<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 22 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-12-15">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 15 de diciembre</h1>
    <p class="sub">El último set propio y los gerundios · Cara de pan (2019t), la séptima redacción corta y la devolución del comentario · la segunda tanda mixta</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>

<script>window.DIA = {"dia": 22, "fecha": "2026-12-15", "tab": "Día 22 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 15 de diciembre", "sub": "El último set propio y los gerundios · Cara de pan (2019t), la séptima redacción corta y la devolución del comentario · la segunda tanda mixta", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 8 · la cuarta tanda de verbos: gerundios", "meta": "20 minutos · el último set antes del examen, con dos hiatos, una llana en -r y un adverbio en -mente; los cinco gerundios", "teoria": "<p>Octavo y último set propio del trimestre, y la cuarta tanda de verbos, la de los gerundios. El set repasa lo que más ha caído en los ocho: dos hiatos con la <i>í<\/i> tónica al lado de una abierta, <i>san-dí-a<\/i> y <i>ra-íz<\/i> —<i>raíz<\/i> es aguda acabada en -z y aun así la lleva, por el hiato—; una llana acabada en -r, <i>azúcar<\/i>; un adverbio en <i>-mente<\/i>, <i>rápidamente<\/i>, que conserva la tilde de <i>rápida<\/i>; y una aguda en -n, <i>según<\/i>.<\/p>\n\n<h3>Los tres señuelos, y lo que se lleva al examen<\/h3>\n<p><i>Cauce<\/i> es llana acabada en vocal con el diptongo <i>au<\/i>; <i>resumen<\/i>, llana en -n, con el plural <i>resúmenes<\/i> que sí la lleva; <i>pastel<\/i>, aguda en -l. En los catorce sets del trimestre, seis reales y ocho propios, los señuelos han sido siempre de estos tres tipos, más el monosílabo. Lo que se lleva al examen del jueves cabe en tres pasos: pronunciar la palabra en voz alta, localizar la fuerza y leer la última letra, y en las vocales juntas preguntar por el hiato. Y en la redacción, la relectura en tres pasadas con la lista de diez.<\/p>\n\n<h3>Los cinco gerundios<\/h3>\n<p>La cuarta tanda son cinco gerundios, tres del censo y dos añadidos: <i>predecir<\/i>, <i>preferir<\/i>, <i>traer<\/i>, <i>reír<\/i> y <i>morir<\/i>. Las dos reglas del 19 de noviembre: la <i>e<\/i> de la raíz se cierra en <i>i<\/i> en los verbos en <i>-ir<\/i>, y la <i>i<\/i> de <i>-iendo<\/i> se escribe <i>y<\/i> cuando queda entre vocales. <i>Riendo<\/i> junta las dos: la <i>e<\/i> se cierra y la <i>i<\/i> resultante no se duplica.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 8: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>sandia<\/i>", "sol": "sandía", "porque": "hiato: <i>san-dí-a<\/i>"}, {"enun": "<i>raiz<\/i>", "sol": "raíz", "porque": "hiato: <i>ra-íz<\/i>; aguda en -z que la lleva por el hiato"}, {"enun": "<i>segun<\/i>", "sol": "según", "porque": "aguda acabada en -n"}, {"enun": "<i>azucar<\/i>", "sol": "azúcar", "porque": "llana acabada en -r"}, {"enun": "<i>rapidamente<\/i>", "sol": "rápidamente", "porque": "adverbio en -mente: conserva la tilde de <i>rápida<\/i>"}, {"enun": "<i>cauce<\/i>", "sol": "cauce", "porque": "llana acabada en vocal; <i>au<\/i> es diptongo"}, {"enun": "<i>resumen<\/i>", "sol": "resumen", "porque": "llana acabada en -n; el plural <i>resúmenes<\/i> sí lleva"}, {"enun": "<i>pastel<\/i>", "sol": "pastel", "porque": "aguda acabada en -l"}], "criterio": "Llevan tilde cinco de las ocho: dos hiatos, una aguda en -n, una llana en -r y un adverbio en <i>-mente<\/i>. Los señuelos son una llana en vocal con diptongo, una llana en -n y una aguda en -l.", "apoyo": ["Los tres señuelos, y lo que se lleva al examen"]}, {"tipo": "hueco", "titulo": "Los cinco verbos: gerundios", "ayuda": "Cinco gerundios, tres con clave oficial. Escribe cada uno.", "items": [{"enun": "«Escriba el gerundio y el participio del verbo predecir»: el gerundio", "conv": "2017s", "sol": "prediciendo", "porque": "e → i, como <i>diciendo<\/i>"}, {"enun": "«Escriba el gerundio de los verbos preferir y traer»: <i>preferir<\/i>", "conv": "2019s", "sol": "prefiriendo", "porque": "e → i"}, {"enun": "«Escriba el gerundio de los verbos preferir y traer»: <i>traer<\/i>", "conv": "2019s", "sol": "trayendo", "porque": "i → y entre vocales"}, {"enun": "Gerundio de <i>reír<\/i>", "sol": "riendo", "porque": "e → i, y la <i>i<\/i> no se duplica"}, {"enun": "Gerundio de <i>morir<\/i>", "sol": "muriendo", "porque": "o → u"}], "criterio": "Las dos reglas del gerundio en cinco verbos. ⊗<i>Traiendo<\/i> y ⊗<i>riiendo<\/i> son las formas falladas que cuentan como error.", "apoyo": ["Los cinco gerundios"]}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)"}, {"chapa": "Carril B", "titulo": "El último texto antes del examen · la séptima redacción corta", "meta": "60 minutos · el texto de 2019t en el carril «El texto»: dos globales sobre personajes opuestos, un sinónimo con el antónimo entre las opciones, un antecedente disperso y una frase hecha; la redacción corta con el enunciado de 2019s", "teoria": "<p>Hoy se contesta el último texto de Llengua castellana del trimestre, un fragmento de <i>Cara de pan<\/i>, de Sara Mesa, de la convocatoria de 2019: está más abajo, en el carril «El texto», con sus seis preguntas y la 2.1. Vuelve a la novela, como el segundo del curso, y sus tres preguntas abiertas obligan a explicar con palabras propias, y el jueves se hace lo mismo con reloj. Después se escribe la séptima redacción corta, con un enunciado real de 2019s.<\/p>\n\n<h3>Dos globales sobre personajes opuestos<\/h3>\n<p>La 1.1 y la 1.2 preguntan por el viejo y por la niña, y los dos leen al revés: el viejo se mete demasiado dentro de la historia y la niña no entra en ella. Las opciones de la 1.2 —<i>pasión<\/i>, <i>motivación<\/i>, <i>incapacidad<\/i>— describen las tres lo contrario de la indiferencia, así que basta con localizar una sola frase sobre la niña, «me aburro lo normal», para descartar las tres. En la 1.1, la trampa está en la a): el viejo no se distrae, y el texto lo afirma con esas palabras, «no porque se distraiga, sino justo al revés».<\/p>\n\n<h3>El sinónimo con el antónimo entre las opciones<\/h3>\n<p>La 1.3 pide un sinónimo de <i>pudor<\/i> y pone tres distractores de tres tipos: <i>peste<\/i> no tiene relación, <i>desvergüenza<\/i> es el antónimo y <i>valor<\/i> pertenece a otro campo. Ningún otro diseño aparece tantas veces en el banco como el antónimo colocado entre las opciones de una pregunta de sinónimo, y la operación del 22 de octubre lo resuelve: subrayar la palabra <i>sinónimo<\/i> del enunciado antes de leer las opciones.<\/p>\n\n<h3>El antecedente disperso y la frase hecha<\/h3>\n<p>La 1.5 pregunta por <i>ellos<\/i>, y <i>ellos<\/i> no tiene un sintagma único al que agarrarse: la respuesta se construye con dos elementos del párrafo, el protagonista y cualquier otro personaje. La clave admite varias formulaciones y exige que aparezcan los personajes, no una frase redactada. La 1.6 es la segunda frase hecha del banco, después de <i>ahogar las penas<\/i>: se explica con palabras propias y sin repetir ninguna palabra de la expresión, y en el texto el viejo rompe el silencio cuando pregunta por preguntar.<\/p>\n\n<h3>La redacción de hoy: una afirmación que se puede discutir<\/h3>\n<p>El enunciado de 2019s da una afirmación del texto, que los adolescentes son una generación cobarde, incapaz de las relaciones cara a cara, y pide un comentario personal a partir de ella, como el de 2017t sobre las redes el 27 de octubre. La afirmación ya es una tesis, y fuerte; la redacción toma postura sobre ella —a favor, en contra o con un matiz— y no la repite. Las posturas que discuten la afirmación dan más material que las que la repiten: quien está de acuerdo tiene que explicar qué hacen los adolescentes que los adultos de su edad no hacían, y quien no lo está tiene que explicar qué hace la herramienta que se toma por cobardía de ellos.<\/p>\n\n<h3>Devolución del comentario con la rúbrica<\/h3>\n<p>Hoy se devuelve el comentario de 2026s, corregido entero: el test con la clave, las tres preguntas en cuartos y la redacción larga con la rúbrica —adecuación 1, coherencia 1,5, estilo 1,5—, más el recuento y las faltas. Es la primera nota completa de comentario del curso, sobre diez.<\/p>\n\n<h3>Lo que suele salir en el primer comentario con reloj<\/h3>\n<p>Tres marcas, y las tres son del tiempo. <b>El test entero y la redacción a medias<\/b>: quien dedicó veinticinco minutos al test llegó a la redacción con diez y entregó 110 palabras, que son 0,5 menos por extensión y una coherencia sin cierre. El reparto del martes está para eso, y se apunta en el margen antes de empezar. <b>El bloque 2 con frases del original<\/b>: con prisa, el resumen de la 2.2 copia «la frontera es cada vez menos clara» tal cual, y los criterios lo consideran incorrecto en esa parte; se resume con las palabras propias aunque tarde un minuto más. <b>La concesión que se cae<\/b>: en la larga escrita en casa la concesión estaba en casi todas; con reloj ha desaparecido de la mitad, y la banda de coherencia baja por argumentación circular. La concesión se escribe en el plan de tres líneas, como una línea más, para que no dependa de que sobre tiempo.<\/p>\n\n<h3>Las tres bandas, con un ejemplo de cada fallo<\/h3>\n<p><b>Adecuación<\/b>: riqueza y propiedad de las ideas, y adecuación al tema; baja cuando la redacción contesta a otra pregunta —la opción A preguntaba por la memoria y la manera de aprender, y una redacción sobre si los libros son mejores que las pantallas contesta a la B—, y cuando hay contradicciones. <b>Coherencia<\/b>: estructura ordenada, claridad y capacidad de convencer; baja por repeticiones injustificadas, desorden y argumentación circular, que es la tesis repetida donde tendría que ir un argumento. <b>Estilo<\/b>: corrección gramatical, conectores y puntuación, y riqueza del léxico; baja por las concordancias, las preposiciones mal puestas y las frases pegadas con coma. Las faltas van aparte y sin tope.<\/p>\n\n<h3>Devolución · a favor y en contra, segunda vez<\/h3>\n<p>Hoy se devuelve la microtarea del 10 de diciembre, la concesión reescrita, y la microtarea es la de a favor y en contra por segunda vez: el 29 de octubre se hizo con el enunciado real de 2026s, el del uniforme escolar, y hoy se hace sobre dos temas propios, con la tabla de los seis tipos de argumento delante.<\/p>\n\n<h3>Lo que suele salir en la concesión reescrita<\/h3>\n<p>Dos marcas. La objeción que sigue sin ser de nadie: «es cierto que hay opiniones distintas, pero…» reconoce que existe la discusión, no una razón concreta del otro lado, y el corrector la cuenta como fórmula. Se corrige escribiendo la objeción con un dato: qué alegaría, con qué número o con qué caso, quien no está de acuerdo. Y el <i>pero<\/i> que devuelve la tesis: detrás del <i>pero<\/i> vuelve la primera frase de la redacción con otras palabras. Se corrige poniendo detrás del <i>pero<\/i> una consecuencia o un dato que la objeción no tenía en cuenta, como en el modelo del jueves: la objeción reconocía el ruido real, y la respuesta añadía que el ruido se había trasladado a la calle de al lado.<\/p>\n\n<h3>A favor y en contra, con la tabla delante<\/h3>\n<p>Las dos mitades salen de razones que no dependen una de otra —lo más seguro, de filas distintas de la tabla del 29 de octubre—: empírico, de competencia, de autoridad, analogía; el lugar común y el afectivo no cuentan. Y las tres marcas de la devolución del 3 de noviembre siguen siendo las que se corrigen: la razón doble, que discute el mismo dato desde los dos lados; el caso en lugar de la razón, que cuenta lo que le pasa a una persona sin explicar qué tiene de general; y la preferencia sin porqué. En dos o tres líneas caben las dos mitades con su porqué, y no cabe ningún ejemplo.<\/p>\n", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué hace la redacción con la afirmación?", "ops": ["la discute con una postura y una razón", "la repite con otras palabras", "la rechaza sin dar razones", "se va del tema"], "ayuda": "Seis arranques de redacción para el enunciado de hoy, sobre la afirmación de que los adolescentes son una generación cobarde. Explica qué hace cada uno.", "items": [{"enun": "«Creo que la afirmación confunde una herramienta con una generación: los adolescentes evitan la llamada porque el mensaje escrito les da tiempo para pensar, y eso no es cobardía, es una manera nueva de medir las palabras.»", "sol": "la discute con una postura y una razón", "porque": "postura en contra y una razón que se puede discutir"}, {"enun": "«Los adolescentes de hoy son cobardes y no saben relacionarse cara a cara, y siempre quieren respuestas inmediatas.»", "sol": "la repite con otras palabras", "porque": "la tesis del enunciado, sin postura propia ni razón"}, {"enun": "«Yo de joven no tenía móvil y quedábamos en la plaza, y ahora todo el día con el teléfono, mi sobrino no suelta el aparato ni en la cena.»", "sol": "se va del tema", "porque": "cuenta un caso y no toma postura sobre la afirmación"}, {"enun": "«Eso es mentira, los jóvenes no son cobardes, es una tontería.»", "sol": "la rechaza sin dar razones", "porque": "la niega sin explicar por qué; además, <i>tontería<\/i> baja la adecuación"}, {"enun": "«Estamos creando una generación de adolescentes que no se atreve a hablar en persona y que lo quiere todo al momento.»", "sol": "la repite con otras palabras", "porque": "la misma afirmación, parafraseada"}, {"enun": "«La afirmación acierta en el síntoma y se equivoca en el nombre: exigir respuestas inmediatas no es cobardía sino un hábito que la mensajería enseña desde los diez años, y se desaprende en el primer trabajo con turnos.»", "sol": "la discute con una postura y una razón", "porque": "un matiz con una razón: acepta una parte y corrige otra"}], "criterio": "Las dos que discuten puntúan en adecuación y en coherencia; las dos que repiten dejan la redacción sin tesis propia; la que rechaza sin razones y la que se va del tema no contestan al enunciado. Antes de escribir: ¿qué digo yo de esta afirmación, y por qué?", "apoyo": ["La redacción de hoy: una afirmación que se puede discutir"]}, {"tipo": "abierta", "titulo": "La séptima redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2019s; el texto de ese examen no se lee hoy. La afirmación ya es una tesis: toma postura sobre ella y no la repitas.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Escriba un comentario personal, de entre cincuenta y ochenta palabras, a partir de la siguiente afirmación del texto: «Estamos creando una generación de adolescentes absolutamente cobarde, incapaz de afrontar las relaciones cara a cara y que exige siempre respuestas inmediatas».»", "conv": "2019s", "modelo": "La afirmación confunde una herramienta con una generación. Es cierto que muchos adolescentes prefieren escribir a llamar y que esperan respuesta en segundos; pero prefieren escribir porque el mensaje les da tiempo para medir las palabras, y esperan rapidez porque la mensajería se la ha enseñado desde los diez años. Además, esa prisa se desaprende en el primer trabajo con turnos, como se desaprendió la nuestra. Cobarde sería quien no cambiara. — Setenta y una palabras: tesis con postura, concesión con <i>es cierto que… pero<\/i>, argumento con <i>además<\/i>, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. La afirmación del enunciado es una tesis, y la redacción tiene que fijar una postura sobre ella con una razón; repetirla con otras palabras deja la banda de coherencia sin nada que desarrollar.", "apoyo": ["La redacción de hoy: una afirmación que se puede discutir"], "usa_texto": false}, {"tipo": "clasificar", "titulo": "¿Qué banda del comentario falla?", "ops": ["adecuación", "coherencia", "estilo", "extensión: el recuento"], "ayuda": "Ocho fragmentos de redacciones largas para la pregunta «¿Deberían los ayuntamientos retirar el mobiliario urbano de las plazas con quejas por ruido?». Señala qué banda pierde cada uno.", "items": [{"enun": "«Han habido muchas quejas y el ayuntamiento tenía de que hacer algo, aunque quitar los bancos afecta a los mayores que no tienen donde sentarse.»", "sol": "estilo", "porque": "<i>han habido<\/i> y <i>tenía de que<\/i>: corrección gramatical"}, {"enun": "«Retirar los bancos traslada el ruido y deja sin sitio a quien salía de día. Es cierto que las quejas por ruido son reales; pero se atienden con vigilancia de noche, no con una plaza vacía de día.»", "sol": "extensión: el recuento", "porque": "en las tres bandas cumple; el texto entero se quedó en 120 palabras"}, {"enun": "«Además, los bancos son útiles. Además, la gente mayor los usa. Además, quitar bancos es caro.»", "sol": "coherencia", "porque": "tres <i>además<\/i> seguidos: el corrector no puede localizar dónde empieza el segundo argumento, y los tres son la misma fila"}, {"enun": "«Yo creo que los jóvenes de hoy no respetan nada y que habría que ponerles horario para estar en la calle, porque antes esto no pasaba.»", "sol": "adecuación", "porque": "contesta a otra pregunta, sobre los jóvenes, y no sobre el mobiliario"}, {"enun": "«Los vecinos se quejan del ruido pero los bancos no hacen ruido los hacen las personas, si quitas los bancos las personas se van a otra calle, y el problema sigue.»", "sol": "estilo", "porque": "frases pegadas con coma y sin conectores; la idea es buena y la puntuación la estropea"}, {"enun": "«Las plazas sin bancos se convierten en lugares de paso, y con ello los mayores pierden el único sitio donde se encontraban con otros; el ruido, en cambio, se desplaza a la calle contigua. Por lo tanto, retirar los bancos castiga a quien no hacía ruido y no resuelve la queja.»", "sol": "extensión: el recuento", "porque": "bien escrito y ordenado; con el resto de la redacción sumaba 215 palabras"}, {"enun": "«Los bancos son necesarios. Sin bancos la gente mayor no puede sentarse. Por eso hacen falta bancos en las plazas. En conclusión, los bancos son necesarios para la gente mayor.»", "sol": "coherencia", "porque": "la tesis repetida cuatro veces: argumentación circular"}, {"enun": "«Como dice la Constitución, sentarse en un banco del barrio es un derecho fundamental.»", "sol": "adecuación", "porque": "la Constitución no dice eso: una cita inventada baja la propiedad de las ideas"}], "criterio": "Dos fragmentos por banda. Los dos de extensión están bien en las tres bandas y pierden 0,5 por no contar: en el primer comentario con reloj aparece en la mitad de las redacciones, y se evita contando.", "apoyo": ["Las tres bandas, con un ejemplo de cada fallo"], "usa_texto": false}, {"tipo": "abierta", "titulo": "Reescribe la concesión de fórmula", "ayuda": "Dos o tres líneas. Sustituye la objeción que no pondría nadie por la que pondría quien no está de acuerdo, y pon detrás del <i>pero<\/i> algo que no estuviera antes.", "items": [{"enun": "Redacción sobre la opción A de 2026s (la tecnología y la memoria). Concesión escrita: «Es cierto que internet es muy útil, pero la memoria también es importante.»", "modelo": "«Es cierto que nadie puede guardar en la cabeza los datos que hoy caben en un teléfono, y que exigirlo sería volver a las listas de reyes godos; pero lo que se pierde al no guardar ningún dato es la posibilidad de relacionar dos sin buscarlos, y a esa relación la llamamos entender.» La objeción recoge lo que diría quien defiende internet, y detrás del <i>pero<\/i> hay una idea nueva: la relación entre datos."}, {"enun": "Redacción sobre si los ayuntamientos deben retirar los bancos de las plazas con quejas por ruido nocturno. Concesión escrita: «Aunque los bancos son buenos, el ruido es malo.»", "modelo": "«Es cierto que los vecinos de los primeros pisos llevan años sin dormir y que su queja es tan real como la de quien se sienta a media tarde; pero el ruido lo hace un grupo de noche y el banco lo usa una vecina de día, y castigar a la segunda no calla al primero, que se limita a trasladarse a la calle de al lado.» La objeción reconoce el problema real de los vecinos y la respuesta añade algo que no estaba: el ruido cambia de sitio."}], "criterio": "Se da por buena la concesión que reconoce una objeción real y contesta con algo nuevo. «Aunque A es bueno, B es malo» no concede nada: enfrenta dos adjetivos y deja la argumentación donde estaba.", "apoyo": ["Lo que suele salir en el primer comentario con reloj"]}, {"tipo": "clasificar", "titulo": "¿De qué tipo es el argumento?", "ops": ["empírico", "de competencia", "de autoridad", "analogía", "lugar común", "afectivo"], "ayuda": "Seis argumentos sobre la tesis «el instituto debería ofrecer refuerzo gratuito a todos los alumnos que lo pidan», uno de cada tipo. Identifica cuál es cuál.", "items": [{"enun": "«Quien ha dado clase a treinta y dos alumnos sabe que en una hora no se puede volver a explicar nada a los seis que no lo han entendido.»", "sol": "de competencia", "porque": "la experiencia de quien escribe"}, {"enun": "«La jefa de estudios del instituto, que dirige el programa de refuerzo, sostiene que veinte plazas para quinientos alumnos no son un programa.»", "sol": "de autoridad", "porque": "lo que sostiene quien firma el texto"}, {"enun": "«Nadie paga aparte por el médico de cabecera, y a nadie le parece raro que el sistema público cubra al que lo necesita.»", "sol": "analogía", "porque": "un caso parecido ya resuelto de otra manera"}, {"enun": "«Según la encuesta de la federación de asociaciones de familias, en los barrios con más renta la mitad de los alumnos va a academia, y en los de menos, uno de cada seis.»", "sol": "empírico", "porque": "un dato del texto de partida"}, {"enun": "«Da mucha pena ver a un chaval de quince años salir de la academia a las nueve de la noche.»", "sol": "afectivo", "porque": "apela al sentimiento y no justifica la tesis"}, {"enun": "«Todo el mundo sabe que la educación es lo más importante.»", "sol": "lugar común", "porque": "una idea que nadie discute y que no añade ninguna razón"}], "criterio": "Cuatro tipos sirven y dos no. Las dos mitades de la microtarea salen de razones que no dependen una de otra —lo más seguro, de filas distintas entre los cuatro que sirven—, y ninguna de las dos puede ser un lugar común ni un sentimiento.", "apoyo": ["A favor y en contra, con la tabla delante"]}, {"tipo": "abierta", "titulo": "La microtarea de hoy: a favor y en contra", "ayuda": "Dos o tres líneas cada una. Cada mitad tiene que explicar por qué, y las dos mitades salen de razones que no dependen una de otra: lo más seguro, de filas distintas de la tabla.", "items": [{"enun": "Un argumento a favor y otro en contra de que el instituto ofrezca refuerzo gratuito a todos los alumnos que lo pidan.", "modelo": "«A favor: en los barrios con más renta la mitad de los alumnos ya paga clases particulares, así que sin refuerzo público la nota acaba dependiendo de lo que gana cada familia. En contra: el refuerzo en grupos de seis exige cinco veces más profesores por alumno que una clase de treinta, y ese dinero sale de las mismas plantillas que ya no llegan a todos.» Un argumento empírico y uno de consecuencia, de dos filas distintas."}, {"enun": "Un argumento a favor y otro en contra de que los ayuntamientos prohíban los patinetes eléctricos en las aceras.", "modelo": "«A favor: en la acera el patinete comparte espacio con quien camina despacio, y un atropello a veinte kilómetros por hora lo paga siempre el peatón. En contra: en las calles sin carril bici, prohibir la acera manda al patinete a la calzada, donde el que pierde es quien va en patinete.» Dos consecuencias distintas, para dos personas distintas."}], "criterio": "Se corrige por mitades: media respuesta con una sola de las dos. Cada mitad se da por buena si explica por qué, con un dato o una consecuencia, y si las dos no discuten el mismo dato desde los dos lados.", "apoyo": ["A favor y en contra, con la tabla delante"]}], "cuaderno": {"pieza": 11, "apartados": [3, 6]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 6: Las dos rúbricas, banda por banda; El mismo tema, en las dos extensiones (p. 66 y 73)"}, {"chapa": "El texto", "titulo": "Cara de pan, de Sara Mesa", "meta": "Convocatoria 2019, tribunal ordinario · fragmento de novela · 328 palabras · el séptimo texto: tres de test, tres abiertas y la 2.1", "literal": true, "teoria": "<p>Este es el texto que se contesta hoy en clase, sobre la fotocopia del cuadernillo de 2019 (tribunal ordinario); aquí está para volver a él en casa. Es la tercera novela del curso y el último texto antes del examen: tres preguntas de test y tres abiertas —una expresión equivalente, un antecedente y una frase hecha—, y del bloque 2 se contesta también la 2.1, que pide describir al viejo con las propias palabras. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "Cara de pan (fragmento)", "entrada": "Sara Mesa · <i>Cara de pan<\/i> (Barcelona: Anagrama, 2018) · fragmento, tal como lo reproduce el cuadernillo de Llengua castellana de 2019 (tribunal ordinario).", "lineas": ["Más o menos a la misma hora, el viejo reaparece. Ahora la niña", "piensa que ya no tiene gracia, se le ocurre la idea de que", "quizá la esté espiando. Sin embargo, la actitud del viejo es", "tan tímida y respetuosa como el día anterior. Lleva la misma", "ropa, la misma expresión de asombro y de pudor. Esta vez le", "pide permiso para sentarse un ratito. Lo hace a la distancia", "máxima que le permiten las dimensiones del refugio: entre la", "fila de setos y el árbol no debe de haber más de un par de", "metros. Con las piernas cruzadas, las manos colocadas sobre", "sus rodillas, la mira sonriente, respira hondo. ¿Hoy no lees?,", "pregunta, pero lo pregunta como podría haber preguntado", "cualquier otra cosa, piensa la niña, para romper el silencio.", "Ella saca de su mochila un libro, uno de los que le mandaron", "comprar en el instituto, y se lo tiende al viejo, que se", "inclina para recogerlo. ¿Te gusta?, pregunta él mientras lo", "hojea. Pse. Según. Me distrae. Él vuelve a sonreír. ¿Es que te", "aburres mucho o qué? No, dice ella. Y luego añade: lo normal,", "me aburro lo normal.", "", "A él nunca le ha gustado leer. Solo sus revistas de pájaros,", "dice, o de naturaleza en general. Pero con las novelas se", "pierde. Siempre que empieza a leer una, se le va la cabeza a", "otro lado, no porque se distraiga, sino justo al revés,", "¡porque se mete demasiado en la historia! Se pega al", "protagonista, o a cualquier otro personaje, y se imagina que", "ellos son él, o que él es ellos. No puede evitar modificar la", "historia, imaginar qué haría él de estar ahí dentro, eligiendo", "un rumbo u otro por sí mismo. A veces entra en varios", "personajes al mismo tiempo y se hace un lío tremendo. Cuando", "se da cuenta, está leyendo sin enterarse. ¡Puede leer páginas", "enteras sin enterarse de nada, mientras sus pensamientos van", "por libre!"], "pie": "Fragmento de <i>Cara de pan<\/i>, de Sara Mesa (Anagrama, 2018), en la versión del cuadernillo oficial de la PAU +25 de 2019, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2019_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las tres preguntas de test", "ayuda": "Las preguntas 1.1 a 1.3 del cuadernillo, literales, con su respuesta oficial. En la 1.3, subraya <i>sinónimo<\/i> antes de leer las opciones.", "items": [{"enun": "<b>1.1<\/b> Al viejo le cuesta seguir el hilo de las novelas porque", "conv": "2019t", "ops": ["se distrae con facilidad.", "hay siempre muchos personajes.", "las vive muy intensamente.", "le falta suficiente imaginación."], "sol": "las vive muy intensamente.", "porque": "«no porque se distraiga, sino justo al revés, porque se mete demasiado en la historia»: la a) afirma lo que el texto niega con esas palabras"}, {"enun": "<b>1.2<\/b> ¿Qué actitud muestra la niña ante la lectura?", "conv": "2019t", "ops": ["Una gran pasión.", "Una fuerte motivación.", "Cierta incapacidad.", "Cierta indiferencia."], "sol": "Cierta indiferencia.", "porque": "«Pse. Según. Me distrae» y «me aburro lo normal»: ni pasión ni incapacidad"}, {"enun": "<b>1.3<\/b> ¿Cuál de las siguientes palabras es un sinónimo de <i>pudor<\/i>?", "conv": "2019t", "ops": ["Peste.", "Recato.", "Desvergüenza.", "Valor."], "sol": "Recato.", "porque": "el pudor es la vergüenza que frena; <i>desvergüenza<\/i> es el antónimo, puesto entre las opciones, y <i>peste<\/i> y <i>valor<\/i> no tienen relación"}], "criterio": "Medio punto por acierto y 0,16 por error. Las dos globales se resuelven con una frase cada una, y la 1.3 con la operación de subrayar <i>sinónimo<\/i>: el antónimo entre las opciones aparece más que ningún otro diseño del banco.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "La expresión equivalente", "ayuda": "Escribe una expresión de dos palabras, con el pronombre: la clave da tres.", "items": [{"enun": "<b>1.4<\/b> Indique una expresión equivalente a la siguiente oración del texto: «Me distrae».", "conv": "2019t", "sol": "me entretiene|me agrada|me divierte|me gusta|me entretengo|me pasa el rato|me hace pasar el rato|me relaja|me ayuda a pasar el rato", "porque": "clave oficial: <i>me entretiene, me agrada, me divierte…<\/i> En boca de la niña, el libro le hace pasar el rato, sin más"}], "criterio": "Se corrige por sustitución en el diálogo: «¿Te gusta? Pse. Según. Me entretiene» se sostiene. <i>Me despista<\/i> es el otro sentido de <i>distraer<\/i>, y no es el del texto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "El antecedente disperso y la frase hecha", "ayuda": "Con tus palabras. En la 1.5, nombra a los personajes; en la 1.6, explica sin repetir <i>romper<\/i> ni <i>silencio<\/i>.", "items": [{"enun": "<b>1.5<\/b> ¿A quién se refiere la autora con el pronombre <i>ellos<\/i> en el siguiente fragmento del texto: «[…] se imagina que ellos son él, o que él es ellos»?", "conv": "2019t", "modelo": "Clave oficial: <i>el protagonista y cualquier otro personaje<\/i> / <i>el protagonista y los personajes<\/i>. El antecedente está repartido en la frase anterior: «se pega al protagonista, o a cualquier otro personaje», y <i>ellos<\/i> los recoge a todos. Lo que se exige es que aparezcan los personajes de la novela que lee; <i>los pájaros<\/i> o <i>la niña y él<\/i> no cumplen."}, {"enun": "<b>1.6<\/b> Explique el significado de la expresión <i>romper el silencio<\/i> que aparece en el texto.", "conv": "2019t", "modelo": "Clave oficial: <i>acabar con, o poner fin a, una situación o un momento tenso, embarazoso, incómodo, difícil<\/i>. En el texto, el viejo pregunta «¿hoy no lees?» solo por hablar, para acabar con la incomodidad de estar callados uno frente a otro. Una respuesta como «dejar de estar en silencio» repite la expresión con otras palabras y no la explica."}], "criterio": "La 1.5 se da por buena si nombra al protagonista y a los demás personajes, de cualquier manera; la 1.6, si recoge el sentido —acabar con un momento incómodo— sin usar las palabras de la expresión.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Describir al viejo con las propias palabras", "ayuda": "Dos o tres líneas, sin ninguna secuencia del original: la actitud y el comportamiento, con lo que hace en el texto.", "items": [{"enun": "<b>2.1<\/b> Describa, con sus propias palabras y en un máximo de dos o tres líneas, los rasgos que caracterizan la actitud y el comportamiento del viejo en este texto.", "conv": "2019t", "modelo": "Clave oficial: en su acercamiento a la niña, el viejo muestra un comportamiento prudente y educado, como midiendo sus reacciones para no asustarla; parece una persona solitaria, encerrada en sus propios pensamientos e intereses, aunque también algo obsesiva. Un modelo: «El viejo se acerca a la niña con cuidado y con buenos modales: pide permiso para sentarse, se queda lo más lejos que puede y le pregunta algo trivial para no estar callados. Vive solo con sus revistas de pájaros y con las novelas en las que se pierde, y en esa manera de meterse en las historias hay algo de obsesión.» Sesenta y dos palabras, sin copiar <i>tímida y respetuosa<\/i> ni <i>asombro y pudor<\/i>."}], "criterio": "Se corrige por rasgos, expresados con otras palabras: prudente, educado, solitario, obsesivo. Copiar <i>tímida y respetuosa<\/i> tal cual se considera incorrecto, aunque sea el rasgo que se pide.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [10]}, {"pieza": "TEXTOS", "apartados": [10]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 10: 2019, tribunal ordinario · Cara de pan (p. 267) · Los textos de cada sesión — apartado 10: «Cara de pan (fragmento)» · texto de examen"}, {"chapa": "Carril C", "titulo": "Tanda mixta, segunda: los siete tipos en diez minutos", "meta": "10 minutos · seis ítems propios de opción, uno por tipo, y tres formas de lista", "teoria": "<p>Segunda tanda mixta, la última del trimestre, con un ítem propio de cada tipo de opción y tres formas de lista. Es el ensayo del bloque 3 del jueves: seis ítems, y el primer paso en cada uno es reconocer el tipo para saber qué prueba toca. El jueves, los seis ítems reales de la hoja son de cuatro tipos de esta tabla: categoría y función de un pronombre, léxico, conectores y campo semántico.<\/p>\n\n<h3>Qué pide cada ítem<\/h3>\n<p>En el de categoría, lo que la palabra hace en esa oración; en el de pronombre, qué sustantivo repite y qué recibe; en el antónimo, la única opción que va en dirección contraria, con el sinónimo puesto de distractor; en la figura, el verbo; en la perífrasis, el <i>eso<\/i>; en los conectores, qué va detrás del hueco. Y en las formas de lista, la ortografía cuenta igual que la forma: <i>regímenes<\/i> sin tilde es un plural fallado. El campo semántico del jueves —cinco palabras del olfato— se contesta con nombres, verbos y adjetivos que tengan que ver con oler: <i>olor<\/i>, <i>aroma<\/i>, <i>perfume<\/i>, <i>oler<\/i>, <i>olfatear<\/i>, <i>hedor<\/i>, <i>nariz<\/i>.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis ítems, uno por tipo", "ayuda": "Seis ítems propios en el formato de 2015-2021. Antes de leer las opciones, indica de qué tipo es cada uno.", "items": [{"enun": "¿Cuál de las siguientes secuencias verbales NO es una perífrasis verbal?", "ops": ["Va a llover.", "Se empeña en cocinar.", "Acaba de llegar.", "Dejó de llamar."], "sol": "Se empeña en cocinar.", "porque": "<i>se empeña en eso<\/i>"}, {"enun": "Indique la categoría gramatical y la función sintáctica de <i>lo<\/i> en la oración «El presupuesto lo firmó la encargada el lunes».", "ops": ["Pronombre, complemento directo.", "Pronombre, sujeto.", "Artículo, determinante.", "Pronombre, complemento indirecto."], "sol": "Pronombre, complemento directo.", "porque": "<i>lo<\/i> repite <i>el presupuesto<\/i>, que se firma; el sujeto es <i>la encargada<\/i>"}, {"enun": "Indique cuál de las siguientes palabras es un antónimo de <i>provisional<\/i> en la oración «Le hicieron un contrato provisional».", "ops": ["Nuevo.", "Breve.", "Temporal.", "Definitivo."], "sol": "Definitivo.", "porque": "<i>temporal<\/i> es sinónimo; <i>breve<\/i> y <i>nuevo<\/i> son del mismo terreno sin ir en dirección contraria"}, {"enun": "Indique la categoría gramatical de <i>tarde<\/i> en la oración «Llegó tarde al turno de noche».", "ops": ["Adverbio.", "Adjetivo.", "Sustantivo.", "Preposición."], "sol": "Adverbio.", "porque": "indica cuándo llegó y no cambia de forma; sería sustantivo en <i>la tarde<\/i>"}, {"enun": "¿Qué secuencia de conectores se ajusta mejor al siguiente enunciado? «______ el precio, el piso se vendió en una semana; ______, el de al lado lleva un año en venta.»", "ops": ["Aunque - además", "Pese a que - por eso", "A pesar de - en cambio", "Sin embargo - así pues"], "sol": "A pesar de - en cambio", "porque": "<i>a pesar de<\/i> admite el sustantivo <i>el precio<\/i>, y lo que sigue opone: <i>en cambio<\/i>"}, {"enun": "En el enunciado «La factura de la luz se ha comido la paga extra» hay", "ops": ["una metonimia.", "una hipérbole.", "una personificación.", "una comparación."], "sol": "una personificación.", "porque": "comer es de personas, y la factura no sustituye a nadie: actúa"}], "criterio": "Categoría, pronombre, antónimo, figura, perífrasis y conectores, cada uno con su paso. El antónimo lleva el sinónimo de distractor, como el <i>pudor<\/i> de hoy lleva el antónimo.", "apoyo": ["Qué pide cada ítem"]}, {"tipo": "hueco", "titulo": "Tres formas de lista", "estricto": true, "ayuda": "Un plural, un primitivo y una primera persona. Con la ortografía de la forma.", "items": [{"enun": "Plural de <i>examen<\/i>", "sol": "exámenes", "porque": "gana la tilde: esdrújula"}, {"enun": "Primitivo de <i>dentadura<\/i>", "sol": "diente", "porque": "<i>dent-<\/i> → <i>diente<\/i>: se devuelve el diptongo"}, {"enun": "Primera persona del presente de <i>torcer<\/i>", "sol": "tuerzo", "porque": "o → ue, y la <i>c<\/i> pasa a <i>z<\/i> delante de <i>o<\/i>"}], "criterio": "Tres formas y tres reglas: la tilde que se gana en el plural, el diptongo que se devuelve al primitivo y la doble irregularidad de <i>cocer<\/i> y <i>torcer<\/i>.", "apoyo": ["Qué pide cada ítem"]}], "cuaderno": {"falta": "segunda tanda mixta, sin apartado nuevo de dossier"}}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El fragmento de <i>Cara de pan<\/i> de Sara Mesa (Anagrama, 2018), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2019, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —oscaralejandrobanos.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */

          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
