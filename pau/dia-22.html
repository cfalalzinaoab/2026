<script>window.DIA = {"dia": 22, "fecha": "2026-12-15", "tab": "Día 22 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 15 de diciembre", "sub": "El último set propio y los gerundios · Cara de pan (2019t), la séptima redacción corta y la devolución del comentario · la segunda tanda mixta", "carriles": [{"chapa": "Carril A", "titulo": "Gimnasio · set propio 8 · la cuarta tanda de verbos: gerundios", "meta": "20 minutos · el último set antes del examen, con dos hiatos, una llana en -r y un adverbio en -mente; los cinco gerundios", "teoria": "<blockquote>\n<p><strong>Los seis sets reales de exámenes no reservados, los ocho sets propios y dieciséis formas verbales de cinco exámenes (2017-2021).<\/strong> Con esto el carril A tiene material propio hasta el 17 de diciembre, y las piezas 1 y 2 se quedan con la teoría y con los ejercicios que enseñan a decidir.<\/p>\n<\/blockquote>\n<p><strong>Cómo funciona.<\/strong> Cada sesión empieza con un set de ocho palabras escritas sin ninguna tilde. Se ponen las que falten, se corrige en el acto y se anota cuántas se fallan. El enunciado <strong>nunca indica cuántas llevan tilde<\/strong>, igual que en el examen. Los seis sets reales son repaso: 34 de sus 47 palabras se han estudiado antes en las piezas 1 y 2, casi siempre con su respuesta —del set de 2015t, siete de ocho—. Los ocho sets propios no llevan ninguna palabra del censo, así que miden lo aprendido sin repaso previo.<\/p>\n<p><strong>El reparto del censo entero:<\/strong> de las 79 palabras de los diez ejercicios reales, <strong>49 llevan tilde y 30 no<\/strong>. Quien pone tilde a todo acierta 49 y falla 30.<\/p>\n<p><strong>El calendario del carril A<\/strong>, sesión por sesión:<\/p>\n<table>\n<thead>\n<tr>\n<th>desde<\/th>\n<th>qué cae cada sesión<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>22 de octubre<\/td>\n<td>un <strong>set real<\/strong>: 2015t, 2018s, 2020t, 2025s, 2026t y 2026s, en ese orden<\/td>\n<\/tr>\n<tr>\n<td>17 de noviembre<\/td>\n<td>un <strong>set propio<\/strong>, ocho en total, hasta el 15 de diciembre<\/td>\n<\/tr>\n<tr>\n<td>24 de noviembre<\/td>\n<td>además, <strong>cinco formas verbales<\/strong> del censo, y la lista de fallos de cada alumno<\/td>\n<\/tr>\n<tr>\n<td>segundo trimestre<\/td>\n<td>solo los martes: cinco formas verbales y la lista de fallos, sin sets nuevos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Los ocho sets propios<\/h3>\n<p>Escritos en el formato real —ocho palabras sueltas, sin indicar cuántas llevan tilde— y con palabras que no aparecen en ninguno de los diez ejercicios del censo, para no gastar ningún set real.<\/p>\n<p><strong>La proporción cambia de un set a otro, como en el examen.<\/strong> En los diez sets reales, ocho traen cinco palabras con tilde y tres sin ella, uno las reparte cuatro y cuatro, y otro trae cinco de siete. Aquí pasa lo mismo: seis sets van cinco y tres, uno cuatro y cuatro y otro seis y dos. Quien se corrija contando en lugar de aplicar la regla acertará unas veces y fallará otras.<\/p>\n<p>Los cuatro primeros practican las tres reglas y las excepciones; los cuatro últimos incorporan hiatos, que son el grupo más numeroso del examen.<\/p>\n<h3>Los cinco verbos, desde el 24 de noviembre<\/h3>\n<p>Dieciséis formas verbales que han caído en cinco exámenes, de 2017 a 2021, repartidas en tandas. Se dicta el infinitivo y lo que se pide —primera persona, participio o gerundio—, se escriben las cinco y se corrigen en el acto. La explicación de cada irregularidad está en la pieza 9.<\/p>\n<p><strong>Tres respuestas con explicación propia:<\/strong> <em>corrompido<\/em> es regular aunque <em>romper<\/em> dé <em>roto<\/em>; <em>cuezo<\/em> lleva <em>z<\/em> porque la <em>c<\/em> delante de <em>o<\/em> sonaría distinto; y <em>yerro<\/em> y <em>yergo<\/em> empiezan por <em>y<\/em>.<\/p>\n<blockquote>\n<p><strong>Para el segundo trimestre<\/strong>, cuando estas cuatro tandas ya se hayan dado, las siguientes salen del anexo A-4, que reúne verbos irregulares que no están en estas cuatro tandas.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "hueco", "titulo": "Set propio 8: ponga tilde en las palabras que la necesiten", "estricto": true, "ayuda": "Ocho palabras sin ninguna tilde, en el formato del examen. Copia cada una con tilde si le corresponde y tal cual si no.", "items": [{"enun": "<i>sandia<\/i>", "sol": "sandía", "porque": "hiato: <i>san-dí-a<\/i>"}, {"enun": "<i>raiz<\/i>", "sol": "raíz", "porque": "hiato: <i>ra-íz<\/i>; aguda en -z que la lleva por el hiato"}, {"enun": "<i>segun<\/i>", "sol": "según", "porque": "aguda acabada en -n"}, {"enun": "<i>sueter<\/i>", "sol": "suéter", "porque": "llana acabada en -r"}, {"enun": "<i>rapidamente<\/i>", "sol": "rápidamente", "porque": "adverbio en -mente: conserva la tilde de <i>rápida<\/i>"}, {"enun": "<i>cauce<\/i>", "sol": "cauce", "porque": "llana acabada en vocal; <i>au<\/i> es diptongo"}, {"enun": "<i>resumen<\/i>", "sol": "resumen", "porque": "llana acabada en -n; el plural <i>resúmenes<\/i> sí lleva"}, {"enun": "<i>pastel<\/i>", "sol": "pastel", "porque": "aguda acabada en -l"}], "criterio": "Llevan tilde cinco de las ocho: dos hiatos, una aguda en -n, una llana en -r y un adverbio en <i>-mente<\/i>. Los señuelos son una llana en vocal con diptongo, una llana en -n y una aguda en -l.", "apoyo": ["Los ocho sets propios"], "dossier": {"cuaderno": "A-3", "ejercicio": "Set propio 8"}, "dossier_txt": "Del dossier: anexo A-3 · Set propio 8"}, {"tipo": "hueco", "titulo": "Los cinco verbos: gerundios", "ayuda": "Cinco gerundios, tres con clave oficial. Escribe cada uno.", "items": [{"enun": "«Escriba el gerundio y el participio del verbo predecir»: el gerundio", "conv": "2017s", "sol": "prediciendo", "porque": "e → i, como <i>diciendo<\/i>"}, {"enun": "«Escriba el gerundio de los verbos preferir y traer»: <i>preferir<\/i>", "conv": "2019s", "sol": "prefiriendo", "porque": "e → i"}, {"enun": "«Escriba el gerundio de los verbos preferir y traer»: <i>traer<\/i>", "conv": "2019s", "sol": "trayendo", "porque": "i → y entre vocales"}, {"enun": "Gerundio de <i>reír<\/i>", "sol": "riendo", "porque": "e → i, y la <i>i<\/i> no se duplica"}, {"enun": "Gerundio de <i>morir<\/i>", "sol": "muriendo", "porque": "o → u"}], "criterio": "Las dos reglas del gerundio en cinco verbos. ⊗<i>Traiendo<\/i> y ⊗<i>riiendo<\/i> son las formas falladas que cuentan como error.", "apoyo": ["Los cinco verbos, desde el 24 de noviembre"], "dossier": {"cuaderno": "A-3", "ejercicio": "Los cinco verbos · tanda 4"}, "dossier_txt": "Del dossier: anexo A-3 · Los cinco verbos · tanda 4"}], "cuaderno": {"pieza": "A-3", "apartados": ["Los ocho sets propios", "Los cinco verbos"]}, "cuaderno_txt": "Anexo A-3 · El gimnasio: sets de tildes y formas verbales — el cuaderno: Los ocho sets propios; Los cinco verbos (p. 296 y 300)", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El último texto antes del examen · la séptima redacción corta", "meta": "60 minutos · el texto de 2019t en el carril «El texto»: dos globales sobre personajes opuestos, un sinónimo con el antónimo entre las opciones, un antecedente disperso y una frase hecha; la redacción corta con el enunciado de 2019s", "teoria": "<h3>3 · Las dos rúbricas, banda por banda<\/h3>\n<h4>Llengua castellana (3 puntos)<\/h4>\n<p>Cuatro apartados sin reparto impreso: <strong>adecuación, coherencia, cohesión y riqueza de expresión<\/strong> (léxico y sintaxis). El desglose que la clave de 2015 dejó por escrito reparte coherencia 1 + riqueza léxica 1 + madurez sintáctica 1.<\/p>\n<ul>\n<li><strong>Adecuación<\/strong>: escribir sobre lo que pide el enunciado, en el registro que corresponde y con la extensión pedida.<\/li>\n<li><strong>Coherencia<\/strong>: una sola tesis, desarrollada y ordenada.<\/li>\n<li><strong>Cohesión<\/strong>: los conectores y la puntuación que enlazan las frases. Desde 2026 la clave pide expresamente conectores argumentativos.<\/li>\n<li><strong>Riqueza<\/strong>: léxico preciso y oraciones de más de un tipo.<\/li>\n<\/ul>\n<h4>Comentari de text (4 puntos)<\/h4>\n<p>Aquí sí hay reparto impreso, y se estudia de memoria:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">máximo<\/th>\n<th>qué puntúa<\/th>\n<th>qué descuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adecuación<\/strong><\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>dos argumentos válidos y distintos, 0,5 cada uno<\/strong>, y que la respuesta a la pregunta quede establecida<\/td>\n<td>pobreza de ideas, no ajustarse al tema, contradecirse<\/td>\n<\/tr>\n<tr>\n<td><strong>Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>estructura ordenada, claridad, capacidad de convencer<\/td>\n<td>repeticiones injustificadas, desorden, <strong>argumentación circular<\/strong>, no saber plantear el tema ni cerrarlo<\/td>\n<\/tr>\n<tr>\n<td><strong>Estilo<\/strong><\/td>\n<td style=\"text-align: right;\">1,5<\/td>\n<td>léxico preciso, variedad de estructuras, conectores apropiados, puntuación correcta<\/td>\n<td>errores de concordancia, de preposición y de tiempo verbal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y las dos rúbricas no reparten igual.<\/strong> Repetir el mismo argumento con otras palabras descuenta en los dos exámenes, y no en la misma banda: en Llengua castellana cae en <strong>coherencia<\/strong>, que puntúa una tesis desarrollada; en el comentario cae en <strong>adecuación<\/strong>, que da 0,5 por cada argumento. El anexo A-1 puntúa con la rúbrica de castellano y el ejercicio 5 de esta pieza, con la del comentario.<\/p>\n<p><strong>Dos avisos que salen de la propia rúbrica.<\/strong> El primero: <strong>da igual de qué lado argumentes<\/strong>. Los criterios establecen que la respuesta vale tanto a favor como en contra, y que se puntúan los argumentos válidos y diferentes. El segundo: <strong>la corrección gramatical cuenta dos veces<\/strong>, dentro de la banda de estilo —hasta 1,5 puntos— y otra vez en el descuento de 0,1 por cada falta, que en este examen no se detiene en ningún tope.<\/p>\n<h3>6 · El mismo tema, en las dos extensiones<\/h3>\n<p>Enunciado: <em>¿Debería contar como jornada laboral el tiempo que se tarda en llegar al trabajo?<\/em><\/p>\n<h4>Versión de 69 palabras (formato de Llengua castellana)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada. Quien vive a una hora de la fábrica dedica diez horas semanales a desplazarse, y ese tiempo no lo decide él: lo organiza el horario de la empresa. Además, pagarlo empujaría a las empresas a acercar los centros a donde vive la gente. Si no se cuenta, el sueldo real baja cuanto más lejos se vive.<\/p>\n<\/blockquote>\n<p>Cuatro frases: tesis, argumento 1, argumento 2 con <em>además<\/em>, cierre. Sin concesión: la extensión no la admite.<\/p>\n<h4>Versión de 182 palabras (formato del comentario)<\/h4>\n<blockquote>\n<p>El tiempo que se tarda en llegar al trabajo debería contar como jornada laboral, y debería contarlo también cuando el trayecto se hace en transporte público.<\/p>\n<p>La primera razón atiende a quién decide ese tiempo. Alguien que vive a una hora del polígono dedica diez horas a la semana a desplazarse, más de lo que dura una jornada completa, y las dedica porque la empresa ha decidido dónde está el centro de trabajo. Quien elige el lugar debería pagar el desplazamiento que provoca.<\/p>\n<p>La segunda razón es distinta: contarlo cambiaría la manera de instalar las empresas. Mientras el traslado lo asuma el trabajador con su tiempo, a la empresa le sale igual de barato poner la nave en un polígono sin autobús que al lado de una estación.<\/p>\n<p>Es cierto que una medida así encarecería contratar a quien vive lejos, y podría acabar perjudicando justamente a esas personas. Por eso tendría que aplicarse con un tope de kilómetros y con ayudas al transporte público.<\/p>\n<p>Si no se cuenta, el sueldo real de cada trabajador baja cuanto más lejos vive de su empresa.<\/p>\n<\/blockquote>\n<p><strong>Qué se ha añadido al pasar de 69 a 182 palabras<\/strong>, y en este orden: un dato dentro de cada argumento, la frase que explica <strong>por qué los dos argumentos son distintos<\/strong> («la segunda razón es distinta»), y una concesión entera con su solución. La tesis y el cierre son casi los mismos.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué hace la redacción con la afirmación?", "ops": ["la discute con una postura y una razón", "la repite con otras palabras", "la rechaza sin dar razones", "se va del tema"], "ayuda": "Seis arranques de redacción para el enunciado de hoy, sobre la afirmación de que los adolescentes son una generación cobarde. Explica qué hace cada uno.", "items": [{"enun": "«Creo que la afirmación confunde una herramienta con una generación: los adolescentes evitan la llamada porque el mensaje escrito les da tiempo para pensar, y eso no es cobardía, es una manera nueva de medir las palabras.»", "sol": "la discute con una postura y una razón", "porque": "postura en contra y una razón que se puede discutir"}, {"enun": "«Los adolescentes de hoy son cobardes y no saben relacionarse cara a cara, y siempre quieren respuestas inmediatas.»", "sol": "la repite con otras palabras", "porque": "la tesis del enunciado, sin postura propia ni razón"}, {"enun": "«Yo de joven no tenía móvil y quedábamos en la plaza, y ahora todo el día con el teléfono, mi sobrino no suelta el aparato ni en la cena.»", "sol": "se va del tema", "porque": "cuenta un caso y no toma postura sobre la afirmación"}, {"enun": "«Eso es mentira, los jóvenes no son cobardes, es una tontería.»", "sol": "la rechaza sin dar razones", "porque": "la niega sin explicar por qué; además, <i>tontería<\/i> baja la adecuación"}, {"enun": "«Estamos creando una generación de adolescentes que no se atreve a hablar en persona y que lo quiere todo al momento.»", "sol": "la repite con otras palabras", "porque": "la misma afirmación, parafraseada"}, {"enun": "«La afirmación acierta en el síntoma y se equivoca en el nombre: exigir respuestas inmediatas no es cobardía sino un hábito que la mensajería enseña desde los diez años, y se desaprende en el primer trabajo con turnos.»", "sol": "la discute con una postura y una razón", "porque": "un matiz con una razón: acepta una parte y corrige otra"}], "criterio": "Las dos que discuten puntúan en adecuación y en coherencia; las dos que repiten dejan la redacción sin tesis propia; la que rechaza sin razones y la que se va del tema no contestan al enunciado. Antes de escribir: ¿qué digo yo de esta afirmación, y por qué?", "apoyo": ["6 · El mismo tema, en las dos extensiones"], "solo_web": true}, {"tipo": "abierta", "titulo": "La séptima redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante y la relectura en tres pasadas al final. El enunciado es el real de 2019s; el texto de ese examen no se lee hoy. La afirmación ya es una tesis: toma postura sobre ella y no la repitas.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«Escriba un comentario personal, de entre cincuenta y ochenta palabras, a partir de la siguiente afirmación del texto: «Estamos creando una generación de adolescentes absolutamente cobarde, incapaz de afrontar las relaciones cara a cara y que exige siempre respuestas inmediatas».»", "conv": "2019s", "modelo": "La afirmación confunde una herramienta con una generación. Es cierto que muchos adolescentes prefieren escribir a llamar y que esperan respuesta en segundos; pero prefieren escribir porque el mensaje les da tiempo para medir las palabras, y esperan rapidez porque la mensajería se la ha enseñado desde los diez años. Además, esa prisa se desaprende en el primer trabajo con turnos, como se desaprendió la nuestra. Cobarde sería quien no cambiara. — Setenta y una palabras: tesis con postura, concesión con <i>es cierto que… pero<\/i>, argumento con <i>además<\/i>, cierre."}], "criterio": "Se corrige con las cuatro bandas y con el recuento. La afirmación del enunciado es una tesis, y la redacción tiene que fijar una postura sobre ella con una razón; repetirla con otras palabras deja la banda de coherencia sin nada que desarrollar.", "apoyo": ["3 · Las dos rúbricas, banda por banda", "Comentari de text (4 puntos)"], "usa_texto": false, "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Qué banda del comentario falla?", "ops": ["adecuación", "coherencia", "estilo", "extensión: el recuento"], "ayuda": "Ocho fragmentos de redacciones largas para la pregunta «¿Deberían los ayuntamientos retirar el mobiliario urbano de las plazas con quejas por ruido?». Señala qué banda pierde cada uno.", "items": [{"enun": "«Han habido muchas quejas y el ayuntamiento tenía de que hacer algo, aunque quitar los bancos afecta a los mayores que no tienen donde sentarse.»", "sol": "estilo", "porque": "<i>han habido<\/i> y <i>tenía de que<\/i>: corrección gramatical"}, {"enun": "«Retirar los bancos traslada el ruido y deja sin sitio a quien salía de día. Es cierto que las quejas por ruido son reales; pero se atienden con vigilancia de noche, no con una plaza vacía de día.»", "sol": "extensión: el recuento", "porque": "en las tres bandas cumple; el texto entero se quedó en 120 palabras"}, {"enun": "«Además, los bancos son útiles. Además, la gente mayor los usa. Además, quitar bancos es caro.»", "sol": "coherencia", "porque": "tres <i>además<\/i> seguidos: el corrector no puede localizar dónde empieza el segundo argumento, y los tres son la misma fila"}, {"enun": "«Yo creo que los jóvenes de hoy no respetan nada y que habría que ponerles horario para estar en la calle, porque antes esto no pasaba.»", "sol": "adecuación", "porque": "contesta a otra pregunta, sobre los jóvenes, y no sobre el mobiliario"}, {"enun": "«Los vecinos se quejan del ruido pero los bancos no hacen ruido los hacen las personas, si quitas los bancos las personas se van a otra calle, y el problema sigue.»", "sol": "estilo", "porque": "frases pegadas con coma y sin conectores; la idea es buena y la puntuación la estropea"}, {"enun": "«Las plazas sin bancos se convierten en lugares de paso, y con ello los mayores pierden el único sitio donde se encontraban con otros; el ruido, en cambio, se desplaza a la calle contigua. Por lo tanto, retirar los bancos castiga a quien no hacía ruido y no resuelve la queja.»", "sol": "extensión: el recuento", "porque": "bien escrito y ordenado; con el resto de la redacción sumaba 215 palabras"}, {"enun": "«Los bancos son necesarios. Sin bancos la gente mayor no puede sentarse. Por eso hacen falta bancos en las plazas. En conclusión, los bancos son necesarios para la gente mayor.»", "sol": "coherencia", "porque": "la tesis repetida cuatro veces: argumentación circular"}, {"enun": "«Como dice la Constitución, sentarse en un banco del barrio es un derecho fundamental.»", "sol": "adecuación", "porque": "la Constitución no dice eso: una cita inventada baja la propiedad de las ideas"}], "criterio": "Dos fragmentos por banda. Los dos de extensión están bien en las tres bandas y pierden 0,5 por no contar: en el primer comentario con reloj aparece en la mitad de las redacciones, y se evita contando.", "apoyo": ["Comentari de text (4 puntos)"], "usa_texto": false, "solo_web": true}, {"tipo": "abierta", "titulo": "Reescribe la concesión de fórmula", "ayuda": "Dos o tres líneas. Sustituye la objeción que no pondría nadie por la que pondría quien no está de acuerdo, y pon detrás del <i>pero<\/i> algo que no estuviera antes.", "items": [{"enun": "Redacción sobre la opción A de 2026s (la tecnología y la memoria). Concesión escrita: «Es cierto que internet es muy útil, pero la memoria también es importante.»", "modelo": "«Es cierto que nadie puede guardar en la cabeza los datos que hoy caben en un teléfono, y que exigirlo sería volver a las listas de reyes godos; pero lo que se pierde al no guardar ningún dato es la posibilidad de relacionar dos sin buscarlos, y a esa relación la llamamos entender.» La objeción recoge lo que diría quien defiende internet, y detrás del <i>pero<\/i> hay una idea nueva: la relación entre datos."}, {"enun": "Redacción sobre si los ayuntamientos deben retirar los bancos de las plazas con quejas por ruido nocturno. Concesión escrita: «Aunque los bancos son buenos, el ruido es malo.»", "modelo": "«Es cierto que los vecinos de los primeros pisos llevan años sin dormir y que su queja es tan real como la de quien se sienta a media tarde; pero el ruido lo hace un grupo de noche y el banco lo usa una vecina de día, y castigar a la segunda no calla al primero, que se limita a trasladarse a la calle de al lado.» La objeción reconoce el problema real de los vecinos y la respuesta añade algo que no estaba: el ruido cambia de sitio."}], "criterio": "Se da por buena la concesión que reconoce una objeción real y contesta con algo nuevo. «Aunque A es bueno, B es malo» no concede nada: enfrenta dos adjetivos y deja la argumentación donde estaba.", "apoyo": ["3 · Las dos rúbricas, banda por banda", "Llengua castellana (3 puntos)"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿De qué tipo es el argumento?", "ops": ["empírico", "de competencia", "de autoridad", "analogía", "lugar común", "afectivo"], "ayuda": "Seis argumentos sobre la tesis «el instituto debería ofrecer refuerzo gratuito a todos los alumnos que lo pidan», uno de cada tipo. Identifica cuál es cuál.", "items": [{"enun": "«Quien ha dado clase a treinta y dos alumnos sabe que en una hora no se puede volver a explicar nada a los seis que no lo han entendido.»", "sol": "de competencia", "porque": "la experiencia de quien escribe"}, {"enun": "«La jefa de estudios del instituto, que dirige el programa de refuerzo, sostiene que veinte plazas para quinientos alumnos no son un programa.»", "sol": "de autoridad", "porque": "lo que sostiene quien firma el texto"}, {"enun": "«Nadie paga aparte por el médico de cabecera, y a nadie le parece raro que el sistema público cubra al que lo necesita.»", "sol": "analogía", "porque": "un caso parecido ya resuelto de otra manera"}, {"enun": "«Según la encuesta de la federación de asociaciones de familias, en los barrios con más renta la mitad de los alumnos va a academia, y en los de menos, uno de cada seis.»", "sol": "empírico", "porque": "un dato del texto de partida"}, {"enun": "«Da mucha pena ver a un chaval de quince años salir de la academia a las nueve de la noche.»", "sol": "afectivo", "porque": "apela al sentimiento y no justifica la tesis"}, {"enun": "«Todo el mundo sabe que la educación es lo más importante.»", "sol": "lugar común", "porque": "una idea que nadie discute y que no añade ninguna razón"}], "criterio": "Cuatro tipos sirven y dos no. Las dos mitades de la microtarea salen de razones que no dependen una de otra —lo más seguro, de filas distintas entre los cuatro que sirven—, y ninguna de las dos puede ser un lugar común ni un sentimiento.", "apoyo": ["6 · El mismo tema, en las dos extensiones", "Versión de 182 palabras (formato del comentario)"], "solo_web": true}, {"tipo": "abierta", "titulo": "La microtarea de hoy: a favor y en contra", "ayuda": "Dos o tres líneas cada una. Cada mitad tiene que explicar por qué, y las dos mitades salen de razones que no dependen una de otra: lo más seguro, de filas distintas de la tabla.", "items": [{"enun": "Un argumento a favor y otro en contra de que el instituto ofrezca refuerzo gratuito a todos los alumnos que lo pidan.", "modelo": "«A favor: en los barrios con más renta la mitad de los alumnos ya paga clases particulares, así que sin refuerzo público la nota acaba dependiendo de lo que gana cada familia. En contra: el refuerzo en grupos de seis exige cinco veces más profesores por alumno que una clase de treinta, y ese dinero sale de las mismas plantillas que ya no llegan a todos.» Un argumento empírico y uno de consecuencia, de dos filas distintas."}, {"enun": "Un argumento a favor y otro en contra de que los ayuntamientos prohíban los patinetes eléctricos en las aceras.", "modelo": "«A favor: en la acera el patinete comparte espacio con quien camina despacio, y un atropello a veinte kilómetros por hora lo paga siempre el peatón. En contra: en las calles sin carril bici, prohibir la acera manda al patinete a la calzada, donde el que pierde es quien va en patinete.» Dos consecuencias distintas, para dos personas distintas."}], "criterio": "Se corrige por mitades: media respuesta con una sola de las dos. Cada mitad se da por buena si explica por qué, con un dato o una consecuencia, y si las dos no discuten el mismo dato desde los dos lados.", "apoyo": ["3 · Las dos rúbricas, banda por banda", "Comentari de text (4 puntos)"], "solo_web": true}], "cuaderno": {"pieza": 11, "apartados": [3, 6]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 6: Las dos rúbricas, banda por banda; El mismo tema, en las dos extensiones (p. 66 y 73)", "teoria_dossier": true}, {"chapa": "El texto", "titulo": "Cara de pan, de Sara Mesa", "meta": "Convocatoria 2019, tribunal ordinario · fragmento de novela · 328 palabras · el séptimo texto: tres de test, tres abiertas y la 2.1", "literal": true, "teoria": "<h3>10 · 2019, tribunal ordinario · <em>Cara de pan<\/em><\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>autoría y fuente<\/strong><\/td>\n<td>Sara Mesa, <em>Cara de pan<\/em> (Anagrama, 2018), fragmento<\/td>\n<\/tr>\n<tr>\n<td><strong>tipo y extensión<\/strong><\/td>\n<td>novela, 328 palabras<\/td>\n<\/tr>\n<tr>\n<td><strong>examen<\/strong><\/td>\n<td>Llengua castellana 2019, tribunal ordinario; el texto, en el cuaderno de textos de cada sesión (texto 10)<\/td>\n<\/tr>\n<tr>\n<td><strong>cuándo<\/strong><\/td>\n<td>15 de diciembre · último texto antes del examen del 17, con la redacción corta sobre una generación de adolescentes cobarde<\/td>\n<\/tr>\n<tr>\n<td><strong>reparto<\/strong><\/td>\n<td>tres preguntas de test y tres abiertas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué este texto cierra el trimestre.<\/strong> Vuelve a la novela, como el segundo del curso, y sus tres preguntas abiertas obligan a explicar con palabras propias: una expresión equivalente, un antecedente y el significado de una frase hecha. Es el repaso natural de todo lo dado antes del examen.<\/p>", "lectura": {"titulo": "Cara de pan (fragmento)", "entrada": "Sara Mesa · <i>Cara de pan<\/i> (Barcelona: Anagrama, 2018) · fragmento, tal como lo reproduce el cuadernillo de Llengua castellana de 2019 (tribunal ordinario).", "lineas": ["Más o menos a la misma hora, el viejo reaparece. Ahora la niña", "piensa que ya no tiene gracia, se le ocurre la idea de que", "quizá la esté espiando. Sin embargo, la actitud del viejo es", "tan tímida y respetuosa como el día anterior. Lleva la misma", "ropa, la misma expresión de asombro y de pudor. Esta vez le", "pide permiso para sentarse un ratito. Lo hace a la distancia", "máxima que le permiten las dimensiones del refugio: entre la", "fila de setos y el árbol no debe de haber más de un par de", "metros. Con las piernas cruzadas, las manos colocadas sobre", "sus rodillas, la mira sonriente, respira hondo. ¿Hoy no lees?,", "pregunta, pero lo pregunta como podría haber preguntado", "cualquier otra cosa, piensa la niña, para romper el silencio.", "Ella saca de su mochila un libro, uno de los que le mandaron", "comprar en el instituto, y se lo tiende al viejo, que se", "inclina para recogerlo. ¿Te gusta?, pregunta él mientras lo", "hojea. Pse. Según. Me distrae. Él vuelve a sonreír. ¿Es que te", "aburres mucho o qué? No, dice ella. Y luego añade: lo normal,", "me aburro lo normal.", "", "A él nunca le ha gustado leer. Solo sus revistas de pájaros,", "dice, o de naturaleza en general. Pero con las novelas se", "pierde. Siempre que empieza a leer una, se le va la cabeza a", "otro lado, no porque se distraiga, sino justo al revés,", "¡porque se mete demasiado en la historia! Se pega al", "protagonista, o a cualquier otro personaje, y se imagina que", "ellos son él, o que él es ellos. No puede evitar modificar la", "historia, imaginar qué haría él de estar ahí dentro, eligiendo", "un rumbo u otro por sí mismo. A veces entra en varios", "personajes al mismo tiempo y se hace un lío tremendo. Cuando", "se da cuenta, está leyendo sin enterarse. ¡Puede leer páginas", "enteras sin enterarse de nada, mientras sus pensamientos van", "por libre!"], "pie": "Fragmento de <i>Cara de pan<\/i>, de Sara Mesa (Anagrama, 2018), en la versión del cuadernillo oficial de la PAU +25 de 2019, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2019_general_llengua_castellana_titular.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las tres preguntas de test", "ayuda": "Las preguntas 1.1 a 1.3 del cuadernillo, literales, con su respuesta oficial. En la 1.3, subraya <i>sinónimo<\/i> antes de leer las opciones.", "items": [{"enun": "<b>1.1<\/b> Al viejo le cuesta seguir el hilo de las novelas porque", "conv": "2019t", "ops": ["se distrae con facilidad.", "hay siempre muchos personajes.", "las vive muy intensamente.", "le falta suficiente imaginación."], "sol": "las vive muy intensamente.", "porque": "«no porque se distraiga, sino justo al revés, porque se mete demasiado en la historia»: la a) afirma lo que el texto niega con esas palabras"}, {"enun": "<b>1.2<\/b> ¿Qué actitud muestra la niña ante la lectura?", "conv": "2019t", "ops": ["Una gran pasión.", "Una fuerte motivación.", "Cierta incapacidad.", "Cierta indiferencia."], "sol": "Cierta indiferencia.", "porque": "«Pse. Según. Me distrae» y «me aburro lo normal»: ni pasión ni incapacidad"}, {"enun": "<b>1.3<\/b> ¿Cuál de las siguientes palabras es un sinónimo de <i>pudor<\/i>?", "conv": "2019t", "ops": ["Peste.", "Recato.", "Desvergüenza.", "Valor."], "sol": "Recato.", "porque": "el pudor es la vergüenza que frena; <i>desvergüenza<\/i> es el antónimo, puesto entre las opciones, y <i>peste<\/i> y <i>valor<\/i> no tienen relación"}], "criterio": "Medio punto por acierto y 0,16 por error. Las dos globales se resuelven con una frase cada una, y la 1.3 con la operación de subrayar <i>sinónimo<\/i>: el antónimo entre las opciones aparece más que ningún otro diseño del banco.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "La expresión equivalente", "ayuda": "Escribe una expresión de dos palabras, con el pronombre: la clave da tres.", "items": [{"enun": "<b>1.4<\/b> Indique una expresión equivalente a la siguiente oración del texto: «Me distrae».", "conv": "2019t", "sol": "me entretiene|me agrada|me divierte|me gusta|me entretengo|me pasa el rato|me hace pasar el rato|me relaja|me ayuda a pasar el rato", "porque": "clave oficial: <i>me entretiene, me agrada, me divierte…<\/i> En boca de la niña, el libro le hace pasar el rato, sin más"}], "criterio": "Se corrige por sustitución en el diálogo: «¿Te gusta? Pse. Según. Me entretiene» se sostiene. <i>Me despista<\/i> es el otro sentido de <i>distraer<\/i>, y no es el del texto.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "El antecedente disperso y la frase hecha", "ayuda": "Con tus palabras. En la 1.5, nombra a los personajes; en la 1.6, explica sin repetir <i>romper<\/i> ni <i>silencio<\/i>.", "items": [{"enun": "<b>1.5<\/b> ¿A quién se refiere la autora con el pronombre <i>ellos<\/i> en el siguiente fragmento del texto: «[…] se imagina que ellos son él, o que él es ellos»?", "conv": "2019t", "modelo": "Clave oficial: <i>el protagonista y cualquier otro personaje<\/i> / <i>el protagonista y los personajes<\/i>. El antecedente está repartido en la frase anterior: «se pega al protagonista, o a cualquier otro personaje», y <i>ellos<\/i> los recoge a todos. Lo que se exige es que aparezcan los personajes de la novela que lee; <i>los pájaros<\/i> o <i>la niña y él<\/i> no cumplen."}, {"enun": "<b>1.6<\/b> Explique el significado de la expresión <i>romper el silencio<\/i> que aparece en el texto.", "conv": "2019t", "modelo": "Clave oficial: <i>acabar con, o poner fin a, una situación o un momento tenso, embarazoso, incómodo, difícil<\/i>. En el texto, el viejo pregunta «¿hoy no lees?» solo por hablar, para acabar con la incomodidad de estar callados uno frente a otro. Una respuesta como «dejar de estar en silencio» repite la expresión con otras palabras y no la explica."}], "criterio": "La 1.5 se da por buena si nombra al protagonista y a los demás personajes, de cualquier manera; la 1.6, si recoge el sentido —acabar con un momento incómodo— sin usar las palabras de la expresión.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Describir al viejo con las propias palabras", "ayuda": "Dos o tres líneas, sin ninguna secuencia del original: la actitud y el comportamiento, con lo que hace en el texto.", "items": [{"enun": "<b>2.1<\/b> Describa, con sus propias palabras y en un máximo de dos o tres líneas, los rasgos que caracterizan la actitud y el comportamiento del viejo en este texto.", "conv": "2019t", "modelo": "Clave oficial: en su acercamiento a la niña, el viejo muestra un comportamiento prudente y educado, como midiendo sus reacciones para no asustarla; parece una persona solitaria, encerrada en sus propios pensamientos e intereses, aunque también algo obsesiva. Un modelo: «El viejo se acerca a la niña con cuidado y con buenos modales: pide permiso para sentarse, se queda lo más lejos que puede y le pregunta algo trivial para no estar callados. Vive solo con sus revistas de pájaros y con las novelas en las que se pierde, y en esa manera de meterse en las historias hay algo de obsesión.» Sesenta y dos palabras, sin copiar <i>tímida y respetuosa<\/i> ni <i>asombro y pudor<\/i>."}], "criterio": "Se corrige por rasgos, expresados con otras palabras: prudente, educado, solitario, obsesivo. Copiar <i>tímida y respetuosa<\/i> tal cual se considera incorrecto, aunque sea el rasgo que se pide.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [10]}, {"pieza": "TEXTOS", "apartados": [10]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 10: 2019, tribunal ordinario · Cara de pan (p. 267) · Los textos de cada sesión — apartado 10: «Cara de pan (fragmento)» · texto de examen", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Tanda mixta, segunda: los siete tipos en diez minutos", "meta": "10 minutos · seis ítems propios de opción, uno por tipo, y tres formas de lista", "teoria": "<p>Segunda tanda mixta, la última del trimestre, con un ítem propio de cada tipo de opción y tres formas de lista. Es el ensayo del bloque 3 del jueves: seis ítems, y el primer paso en cada uno es reconocer el tipo para saber qué prueba toca. El jueves, los seis ítems reales de la hoja son de cuatro tipos de esta tabla: categoría y función de un pronombre, léxico, conectores y campo semántico.<\/p>\n\n<h3>Qué pide cada ítem<\/h3>\n<p>En el de categoría, lo que la palabra hace en esa oración; en el de pronombre, qué sustantivo repite y qué recibe; en el antónimo, la única opción que va en dirección contraria, con el sinónimo puesto de distractor; en la figura, el verbo; en la perífrasis, el <i>eso<\/i>; en los conectores, qué va detrás del hueco. Y en las formas de lista, la ortografía cuenta igual que la forma: <i>regímenes<\/i> sin tilde es un plural fallado. El campo semántico del jueves —cinco palabras del olfato— se contesta con nombres, verbos y adjetivos que tengan que ver con oler: <i>olor<\/i>, <i>aroma<\/i>, <i>perfume<\/i>, <i>oler<\/i>, <i>olfatear<\/i>, <i>hedor<\/i>, <i>nariz<\/i>.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis ítems, uno por tipo", "ayuda": "Seis ítems propios en el formato de 2015-2021. Antes de leer las opciones, indica de qué tipo es cada uno.", "items": [{"enun": "¿Cuál de las siguientes secuencias verbales NO es una perífrasis verbal?", "ops": ["Va a llover.", "Se empeña en cocinar.", "Acaba de llegar.", "Dejó de llamar."], "sol": "Se empeña en cocinar.", "porque": "<i>se empeña en eso<\/i>"}, {"enun": "Indique la categoría gramatical y la función sintáctica de <i>lo<\/i> en la oración «El presupuesto lo firmó la encargada el lunes».", "ops": ["Pronombre, complemento directo.", "Pronombre, sujeto.", "Artículo, determinante.", "Pronombre, complemento indirecto."], "sol": "Pronombre, complemento directo.", "porque": "<i>lo<\/i> repite <i>el presupuesto<\/i>, que se firma; el sujeto es <i>la encargada<\/i>"}, {"enun": "Indique cuál de las siguientes palabras es un antónimo de <i>provisional<\/i> en la oración «Le hicieron un contrato provisional».", "ops": ["Nuevo.", "Breve.", "Temporal.", "Definitivo."], "sol": "Definitivo.", "porque": "<i>temporal<\/i> es sinónimo; <i>breve<\/i> y <i>nuevo<\/i> son del mismo terreno sin ir en dirección contraria"}, {"enun": "Indique la categoría gramatical de <i>tarde<\/i> en la oración «Llegó tarde al turno de noche».", "ops": ["Adverbio.", "Adjetivo.", "Sustantivo.", "Preposición."], "sol": "Adverbio.", "porque": "indica cuándo llegó y no cambia de forma; sería sustantivo en <i>la tarde<\/i>"}, {"enun": "¿Qué secuencia de conectores se ajusta mejor al siguiente enunciado? «______ el precio, el piso se vendió en una semana; ______, el de al lado lleva un año en venta.»", "ops": ["Aunque - además", "Pese a que - por eso", "A pesar de - en cambio", "Sin embargo - así pues"], "sol": "A pesar de - en cambio", "porque": "<i>a pesar de<\/i> admite el sustantivo <i>el precio<\/i>, y lo que sigue opone: <i>en cambio<\/i>"}, {"enun": "En el enunciado «La factura de la luz se ha comido la paga extra» hay", "ops": ["una metonimia.", "una hipérbole.", "una personificación.", "una comparación."], "sol": "una personificación.", "porque": "comer es de personas, y la factura no sustituye a nadie: actúa"}], "criterio": "Categoría, pronombre, antónimo, figura, perífrasis y conectores, cada uno con su paso. El antónimo lleva el sinónimo de distractor, como el <i>pudor<\/i> de hoy lleva el antónimo.", "apoyo": "todo", "solo_web": true}, {"tipo": "hueco", "titulo": "Tres formas de lista", "estricto": true, "ayuda": "Un plural, un primitivo y una primera persona. Con la ortografía de la forma.", "items": [{"enun": "Plural de <i>examen<\/i>", "sol": "exámenes", "porque": "gana la tilde: esdrújula"}, {"enun": "Primitivo de <i>dentadura<\/i>", "sol": "diente", "porque": "<i>dent-<\/i> → <i>diente<\/i>: se devuelve el diptongo"}, {"enun": "Primera persona del presente de <i>torcer<\/i>", "sol": "tuerzo", "porque": "o → ue, y la <i>c<\/i> pasa a <i>z<\/i> delante de <i>o<\/i>"}], "criterio": "Tres formas y tres reglas: la tilde que se gana en el plural, el diptongo que se devuelve al primitivo y la doble irregularidad de <i>cocer<\/i> y <i>torcer<\/i>.", "apoyo": "todo", "solo_web": true}], "cuaderno": {"falta": "segunda tanda mixta, sin apartado nuevo de dossier"}}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El fragmento de <i>Cara de pan<\/i> de Sara Mesa (Anagrama, 2018), reproducido en el carril «El texto» tal como lo trae el cuadernillo de 2019, se incluye con fines docentes al amparo del artículo 32.3 de la Ley de Propiedad Intelectual.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —cfalalzinaoab.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });
    ventana.querySelector('.v-x').focus();
  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');
        h3 = tit;
      }
      out.push({ titulo: tit, html: cuerpo, padre: es3 ? null : h3 });
    }
    return out;
  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
