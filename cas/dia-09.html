<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 9 · 27 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}
.teoria .hueco,.v-bloque .hueco{display:inline-block;border-bottom:1px solid var(--tinta3);height:.9em;
  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}
/* una palabra con guion, barra o raya no se parte de un renglón a otro:
   motor.js la mete en un <span class="nb"> (sinPartir) */
.nb{white-space:nowrap}

<script>window.DIA = {"dia": 9, "fecha": "2026-10-27", "tab": "Día 9 · 27 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 9", "h1": "Martes 27 de octubre", "sub": "B y V · la devolución del primer texto · los pronombres", "carriles": [{"chapa": "Carril A", "titulo": "B y V", "meta": "30 minutos · la letra que no se decide de oído", "cuaderno": {"nudo": 4, "apartados": [1, 2], "ejercicios": [1, 2, 3, 4]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> no hay un ejercicio que se llame así. Esto se descuenta en la <strong>penalización<\/strong>: cada falta de ortografía descuenta <strong>0,1<\/strong> en los bloques 1 y 2, hasta un tope de 2 puntos. Y baja la banda de <strong>corrección<\/strong> de la redacción, que vale 1 punto entero.<\/div>\n<h3>1 · B y V<\/h3>\n<p>En castellano la <strong>b<\/strong> y la <strong>v<\/strong> suenan igual. No hay diferencia de pronunciación: en castellano la v no se pronuncia con los dientes. Solo sirven tres recursos: <strong>la forma del verbo<\/strong>, <strong>unos cuantos prefijos con significado<\/strong> y <strong>tu propia lista de fallos<\/strong>.<\/p>\n<p>Lo que es regla y se cumple casi siempre:<\/p>\n<table>\n<thead>\n<tr>\n<th><strong>B<\/strong><\/th>\n<th>ejemplos (de textos de la prueba)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>después de <strong>m<\/strong><\/td>\n<td>ca<strong>mb<\/strong>io, no<strong>mb<\/strong>re, ho<strong>mb<\/strong>res, novie<strong>mb<\/strong>re, aso<strong>mb<\/strong>rosa<\/td>\n<\/tr>\n<tr>\n<td>delante de otra consonante: <strong>bl, br, bd, bj, bs, bv<\/strong><\/td>\n<td><strong>bl<\/strong>anco, <strong>br<\/strong>eve, <strong>br<\/strong>uta, a<strong>bd<\/strong>omen, o<strong>bv<\/strong>io<\/td>\n<\/tr>\n<tr>\n<td>el imperfecto en <strong>-aba<\/strong> y el de <em>ir<\/em>: <em>iba, íbamos<\/em><\/td>\n<td>esta<strong>ba<\/strong>, lleva<strong>ba<\/strong>, explica<strong>ba<\/strong>, pensa<strong>ba<\/strong><\/td>\n<\/tr>\n<tr>\n<td>los verbos <strong>deber, beber, caber, saber, haber<\/strong><\/td>\n<td>de<strong>b<\/strong>emos, sa<strong>b<\/strong>ía, ha<strong>br<\/strong>á<\/td>\n<\/tr>\n<tr>\n<td>los verbos acabados en <strong>-bir<\/strong> y <strong>-buir<\/strong><\/td>\n<td>escri<strong>bir<\/strong>, reci<strong>bir<\/strong>, prohi<strong>bir<\/strong>, su<strong>bir<\/strong>, distri<strong>buir<\/strong> <em>(menos hervir, servir, vivir)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th><strong>V<\/strong><\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>después de <strong>n<\/strong><\/td>\n<td>i<strong>nv<\/strong>estigación, co<strong>nv<\/strong>iene, co<strong>nv<\/strong>ertido, e<strong>nv<\/strong>ejecimiento<\/td>\n<\/tr>\n<tr>\n<td>los verbos acabados en <strong>-olver<\/strong><\/td>\n<td>res<strong>olver<\/strong>, dev<strong>olver<\/strong>, env<strong>olver<\/strong><\/td>\n<\/tr>\n<tr>\n<td>pretérito perfecto simple de <em>estar, tener, andar<\/em>, y los tiempos que derivan de él<\/td>\n<td>est<strong>uv<\/strong>e, t<strong>uv<\/strong>iera, and<strong>uv<\/strong>o<\/td>\n<\/tr>\n<tr>\n<td>el presente de <em>ir<\/em><\/td>\n<td><strong>v<\/strong>oy, <strong>v<\/strong>as, <strong>v<\/strong>aya, <strong>v<\/strong>amos<\/td>\n<\/tr>\n<tr>\n<td>adjetivos acabados en <strong>-avo/-ava, -evo/-eva, -ivo/-iva<\/strong><\/td>\n<td>nue<strong>vo<\/strong>, creati<strong>vo<\/strong>, atracti<strong>va<\/strong>, masi<strong>vo<\/strong>, negati<strong>vo<\/strong><\/td>\n<\/tr>\n<tr>\n<td>palabras acabadas en <strong>-ívoro / -ívora<\/strong><\/td>\n<td>carn<strong>ívoro<\/strong>, herb<strong>ívora<\/strong> <em>(menos víbora)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Con <\/em><em>-ave / -eve<\/em><em> van clave, grave, leve y también <\/em><em>breve<\/em><em>: empieza por b, pero la terminación es -eve, con v. Confunde la b inicial, no la regla.<\/em><\/p>\n<p><strong>La trampa que más faltas produce: <em>-aba<\/em> frente a <em>-ava<\/em>.<\/strong> <em>Llevaba<\/em>, <em>estaba<\/em>, <em>pensaba<\/em> son <strong>verbos<\/strong>, y el imperfecto de la primera conjugación se escribe <strong>siempre con b<\/strong>. <em>Nueva<\/em>, <em>octava<\/em>, <em>esclava<\/em> son adjetivos o sustantivos, y van con v. Prueba: si puedes ponerlo en infinitivo (<em>llevar<\/em>), es verbo.<\/p>\n<p><strong>La trampa catalana.<\/strong> El catalán escribe algunas de estas palabras con la otra letra, y esas aparecen al escribir deprisa:<\/p>\n<table>\n<thead>\n<tr>\n<th>castellano<\/th>\n<th>catalán<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>go<strong>b<\/strong>ierno<\/td>\n<td>go<strong>v<\/strong>ern<\/td>\n<\/tr>\n<tr>\n<td>a<strong>b<\/strong>ogado<\/td>\n<td>a<strong>dv<\/strong>ocat<\/td>\n<\/tr>\n<tr>\n<td>mó<strong>v<\/strong>il, automó<strong>v<\/strong>il<\/td>\n<td>mò<strong>b<\/strong>il, automò<strong>b<\/strong>il<\/td>\n<\/tr>\n<tr>\n<td>cam<strong>b<\/strong>iar<\/td>\n<td>can<strong>v<\/strong>iar<\/td>\n<\/tr>\n<tr>\n<td>ha<strong>b<\/strong>er<\/td>\n<td>ha<strong>v<\/strong>er<\/td>\n<\/tr>\n<tr>\n<td>pro<strong>b<\/strong>ar<\/td>\n<td>pro<strong>v<\/strong>ar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>2 · Los prefijos que significan algo<\/h3>\n<p>De todas las listas de excepciones que suelen darse, solo se pueden razonar los prefijos que significan algo. <strong>Si sabes qué significa la palabra, sabes cómo se escribe:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>prefijo<\/th>\n<th>significa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>bi-, bis-, biz-<\/strong><\/td>\n<td>dos<\/td>\n<td>bicicleta, bimestre, bilingüe, bisabuelo<\/td>\n<\/tr>\n<tr>\n<td><strong>bio-<\/strong><\/td>\n<td>vida<\/td>\n<td>biología, biólogo, biografía, microbio<\/td>\n<\/tr>\n<tr>\n<td><strong>biblio-<\/strong><\/td>\n<td>libro<\/td>\n<td>biblioteca, bibliografía<\/td>\n<\/tr>\n<tr>\n<td><strong>bene-, bien-<\/strong><\/td>\n<td>bien<\/td>\n<td>beneficio, bienestar, bienvenida<\/td>\n<\/tr>\n<tr>\n<td><strong>sub-<\/strong><\/td>\n<td>debajo, menos<\/td>\n<td>subrayar, subterráneo, subconjunto<\/td>\n<\/tr>\n<tr>\n<td><strong>vice-, viz-, vi-<\/strong><\/td>\n<td>en lugar de<\/td>\n<td>vicepresidente, vizconde, virrey<\/td>\n<\/tr>\n<tr>\n<td><strong>villa-<\/strong> (la palabra <em>villa<\/em>, no un prefijo)<\/td>\n<td>pueblo, casa de campo<\/td>\n<td>villancico, villano<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y dos terminaciones que sí aguantan: <strong>-bilidad<\/strong> (<em>amabilidad, posibilidad<\/em>), con dos excepciones que se explican solas —<em>movilidad<\/em> viene de <em>móvil<\/em> y <em>civilidad<\/em> de <em>civil<\/em>—, y <strong>-bundo / -bunda<\/strong> (<em>moribundo, nauseabunda<\/em>).<\/p>\n<blockquote>\n<h4>⚠ Tres trampas de las listas de excepciones<\/h4>\n<p>Estas tres circulan en casi todas las listas, y las tres están mal. Aplicarlas produce faltas.<\/p>\n<p><strong>1. <em>Violador<\/em> no empieza por <em>vice-<\/em> ni por <em>villa-<\/em>.<\/strong> Viene de <em>violar<\/em>. Se escribe con v, sí, pero <strong>no por esa regla<\/strong>.<\/p>\n<p><strong>2. <em>Biólogo<\/em>, <em>biología<\/em> y <em>billar<\/em> no son excepciones a la regla de <em>vice-/villa-<\/em>.<\/strong> No pueden serlo: no empiezan por esos prefijos. <em>Biólogo<\/em> y <em>biología<\/em> empiezan por <em>bio-<\/em> 'vida', que es <strong>otra regla de esta misma tabla<\/strong>; <em>billar<\/em> es un préstamo del francés <em>billard<\/em>. Se parecen al oído, no a la vista.<\/p>\n<p><strong>3. <em>Ravioles<\/em> no empieza por <em>rab-<\/em>.<\/strong> Empieza por <em>rav-<\/em>, y viene del italiano <em>ravioli<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Lo que tienen en común las listas de excepciones.<\/strong> Listas como «palabras que empiezan por <em>alb-, hab-, heb-, lab-, rab-, sab-, tab-<\/em>» no son reglas: equivalen a «escribe b donde se escribe b». No hay nada que razonar y, por tanto, nada que estudiar, por mucha página que ocupen.<\/p>\n<p><strong>Listado de posibles confusiones:<\/strong><\/p>\n<p><em>haber<\/em> / <em>a ver<\/em> · <em>hubo<\/em> · <em>iba<\/em> · <em>tuvo<\/em> / <em>tubo<\/em> · <em>hierba<\/em> / <em>hierva<\/em> · <em>prohibir<\/em> · <em>obtuvo<\/em> · <em>móvil<\/em> · <em>gobierno<\/em> · <em>abogado<\/em> · <em>absolver<\/em><\/p>\n<p>Dos que hay que tener resueltas antes de la prueba:<\/p>\n<ul>\n<li><strong><em>haber<\/em><\/strong> es el verbo: <em>va a haber problemas<\/em>, <em>tiene que haber una razón<\/em>. <strong><em>a ver<\/em><\/strong> es preposición más <em>ver<\/em>: <em>vamos a ver qué pasa<\/em>, <em>a ver si llueve<\/em>.<\/li>\n<li><strong><em>tuvo<\/em><\/strong> (de <em>tener<\/em>) frente a <strong><em>tubo<\/em><\/strong> (el objeto).<\/li>\n<\/ul>", "ejercicios": [{"tipo": "opcion", "titulo": "¿B o v?", "dossier": {"cuaderno": "4", "ejercicio": 1}, "ayuda": "Elige la letra que falta. Las palabras con un año entre paréntesis aparecen en textos de la prueba; las que no lo llevan se han añadido aquí.", "ops": ["b", "v"], "items": [{"enun": "<i>nue_o<\/i> (2018)", "sol": "v", "porque": "adjetivo en <i>-evo<\/i>"}, {"enun": "<i>con_encida<\/i> (2016)", "sol": "v", "porque": "después de <i>n<\/i>"}, {"enun": "<i>in_estigadores<\/i> (2013)", "sol": "v", "porque": "después de <i>n<\/i>"}, {"enun": "<i>cam_io<\/i> (2014)", "sol": "b", "porque": "después de <i>m<\/i>"}, {"enun": "<i>pensa_a<\/i> (2012)", "sol": "b", "porque": "imperfecto en <i>-aba<\/i>"}, {"enun": "<i>lle_aba<\/i> (2012)", "sol": "v", "porque": "la <i>v<\/i> es de la raíz, <i>llevar<\/i>; la <i>b<\/i> de <i>-aba<\/i> es la del imperfecto"}, {"enun": "<i>no_iembre<\/i> (2024)", "sol": "v", "porque": "empieza por <i>nov-<\/i>; dentro lleva <i>mb<\/i>, después de <i>m<\/i>"}, {"enun": "<i>escri_ir<\/i> (2007)", "sol": "b", "porque": "verbo acabado en <i>-bir<\/i>"}, {"enun": "<i>en_ejecimiento<\/i> (2015)", "sol": "v", "porque": "después de <i>n<\/i>"}, {"enun": "<i>asom_rosa<\/i> (2025)", "sol": "b", "porque": "delante de consonante (<i>br<\/i>), y además después de <i>m<\/i>"}, {"enun": "<i>reci_ir<\/i> (2014)", "sol": "b", "porque": "verbo en <i>-bir<\/i>"}, {"enun": "<i>a_surdo<\/i>", "sol": "b", "porque": "delante de otra consonante: <i>bs<\/i>"}, {"enun": "<i>ha_lar<\/i>", "sol": "b", "porque": "delante de otra consonante: <i>bl<\/i>"}, {"enun": "<i>creati_o<\/i> (2025)", "sol": "v", "porque": "adjetivo en <i>-ivo<\/i>"}], "apoyo": ["1 · B y V"], "dossier_txt": "Del dossier: nudo 4, ejercicio 1"}, {"tipo": "hueco", "titulo": "-aba o -ava", "dossier": {"cuaderno": "4", "ejercicio": 2}, "ayuda": "Escribe la palabra entera, con <i>-aba<\/i> o con <i>-ava<\/i>.", "items": [{"enun": "la oct__ <i>(posición)<\/i>", "sol": "octava", "porque": "adjetivo ordinal: <i>octava<\/i>, con <i>v<\/i>"}, {"enun": "él trabaj__ <i>(verbo)<\/i>", "sol": "trabajaba", "porque": "imperfecto en <i>-aba<\/i>"}, {"enun": "el h__ de la sopa <i>(legumbre)<\/i>", "sol": "haba", "porque": "aquí <i>-aba<\/i> no es el imperfecto: es parte de la palabra"}, {"enun": "ella estudi__ <i>(verbo)<\/i>", "sol": "estudiaba", "porque": "imperfecto en <i>-aba<\/i>"}, {"enun": "la escl__ <i>(persona)<\/i>", "sol": "esclava", "porque": "sustantivo con <i>v<\/i>"}, {"enun": "yo cant__ <i>(verbo)<\/i>", "sol": "cantaba", "porque": "imperfecto en <i>-aba<\/i>"}], "criterio": "Los imperfectos de los verbos en <i>-ar<\/i> van siempre con <i>b<\/i>. <i>Octava<\/i>, <i>esclava<\/i> y <i>haba<\/i> no son formas verbales, y su terminación es parte de la palabra.", "apoyo": ["1 · B y V"], "dossier_txt": "Del dossier: nudo 4, ejercicio 2"}, {"tipo": "hueco", "titulo": "Escríbelas en castellano", "dossier": {"cuaderno": "4", "ejercicio": 3}, "ayuda": "Seis palabras en catalán. Escribe la que les corresponde en castellano.", "estricto": true, "items": [{"enun": "<i>govern<\/i>", "sol": "gobierno"}, {"enun": "<i>advocat<\/i>", "sol": "abogado"}, {"enun": "<i>mòbil<\/i>", "sol": "móvil"}, {"enun": "<i>canviar<\/i>", "sol": "cambiar"}, {"enun": "<i>haver<\/i>", "sol": "haber"}, {"enun": "<i>provar<\/i>", "sol": "probar"}], "criterio": "En las seis, la letra cambia de una lengua a otra: <i>govern<\/i>, <i>advocat<\/i>, <i>mòbil<\/i>, <i>canviar<\/i>, <i>haver<\/i> y <i>provar<\/i> se escriben en castellano <i>gobierno<\/i>, <i>abogado<\/i>, <i>móvil<\/i>, <i>cambiar<\/i>, <i>haber<\/i> y <i>probar<\/i>. Son las faltas de b y v que más aparecen en las redacciones de quien escribe también en catalán.", "apoyo": ["1 · B y V", "2 · Los prefijos que significan algo"], "dossier_txt": "Del dossier: nudo 4, ejercicio 3"}, {"tipo": "hueco", "titulo": "La letra que falta", "dossier": {"cuaderno": "4", "ejercicio": 4, "parte": "la letra"}, "ayuda": "Escribe la palabra entera, con <i>b<\/i> o con <i>v<\/i>.", "estricto": true, "items": [{"enun": "<i>_iología<\/i>", "sol": "biología"}, {"enun": "<i>_icicleta<\/i>", "sol": "bicicleta"}, {"enun": "<i>_ienestar<\/i>", "sol": "bienestar"}, {"enun": "<i>_icepresidente<\/i>", "sol": "vicepresidente"}, {"enun": "<i>_illancico<\/i>", "sol": "villancico"}, {"enun": "<i>_ibliografía<\/i>", "sol": "bibliografía"}, {"enun": "<i>_isabuelo<\/i>", "sol": "bisabuelo"}, {"enun": "<i>su_rayar<\/i>", "sol": "subrayar"}, {"enun": "<i>ama_ilidad<\/i>", "sol": "amabilidad"}, {"enun": "<i>mo_ilidad<\/i>", "sol": "movilidad"}], "apoyo": ["2 · Los prefijos que significan algo"], "dossier_txt": "Del dossier: nudo 4, ejercicio 4 · la letra"}, {"tipo": "justificar", "titulo": "¿Qué la decide?", "dossier": {"cuaderno": "4", "ejercicio": 4, "parte": "el prefijo o la terminación"}, "ayuda": "Las mismas palabras. Indica el prefijo o la terminación que decide la letra, y lo que significa si lo sabes.", "items": [{"palabra": "<i>_iología<\/i>", "requiere": [["bio", "vida"]], "modelo": "<i>bio-<\/i>, vida"}, {"palabra": "<i>_icicleta<\/i>", "requiere": [["bi", "dos"]], "modelo": "<i>bi-<\/i>, dos"}, {"palabra": "<i>_ienestar<\/i>", "requiere": [["bien"]], "modelo": "<i>bien-<\/i>"}, {"palabra": "<i>_icepresidente<\/i>", "requiere": [["vice"]], "modelo": "<i>vice-<\/i>"}, {"palabra": "<i>_illancico<\/i>", "requiere": [["villa"]], "modelo": "<i>villa-<\/i>"}, {"palabra": "<i>_ibliografía<\/i>", "requiere": [["biblio", "libro"]], "modelo": "<i>biblio-<\/i>, libro"}, {"palabra": "<i>_isabuelo<\/i>", "requiere": [["bis", "dos veces"]], "modelo": "<i>bis-<\/i>, dos veces"}, {"palabra": "<i>su_rayar<\/i>", "requiere": [["sub", "debajo"]], "modelo": "<i>sub-<\/i>, debajo"}, {"palabra": "<i>ama_ilidad<\/i>", "requiere": [["bilidad"]], "modelo": "la terminación <i>-bilidad<\/i>"}, {"palabra": "<i>mo_ilidad<\/i>", "requiere": [["movil", "excepcion"]], "modelo": "es la excepción: viene de <i>móvil<\/i>"}], "criterio": "Los prefijos con <i>b<\/i> significan algo: <i>bio-<\/i> es vida, <i>bi-<\/i> y <i>bis-<\/i> son dos, <i>biblio-<\/i> es libro, <i>sub-<\/i> es debajo. <i>Movilidad<\/i> va contra la terminación <i>-bilidad<\/i> porque viene de <i>móvil<\/i>.", "pide": "la decide…", "apoyo": ["2 · Los prefijos que significan algo"], "dossier_txt": "Del dossier: nudo 4, ejercicio 4 · el prefijo o la terminación"}, {"tipo": "opcion", "titulo": "¿Por qué regla?", "ayuda": "Todas están bien escritas. Indica qué regla las explica.", "ops": ["después de m o n", "por la forma del verbo", "por la terminación"], "items": [{"enun": "<i>investigación<\/i>", "sol": "después de m o n"}, {"enun": "<i>resolver<\/i>", "sol": "por la forma del verbo", "porque": "verbo en <i>-olver<\/i>"}, {"enun": "<i>cambio<\/i>", "sol": "después de m o n"}, {"enun": "<i>herbívora<\/i>", "sol": "por la terminación"}, {"enun": "<i>creativo<\/i>", "sol": "por la terminación", "porque": "adjetivo en <i>-ivo<\/i>"}, {"enun": "<i>nombre<\/i>", "sol": "después de m o n"}, {"enun": "<i>escribir<\/i>", "sol": "por la forma del verbo", "porque": "verbo en <i>-bir<\/i>"}, {"enun": "<i>estuve<\/i>", "sol": "por la forma del verbo", "porque": "perfecto simple de <i>estar<\/i>"}], "criterio": "Las tres columnas cubren casi todo lo que se puede razonar. Lo que queda fuera —<i>gobierno<\/i>, <i>abogado<\/i>, <i>móvil<\/i>— no tiene regla y va a tu lista de fallos.", "apoyo": ["1 · B y V"], "solo_web": true}, {"tipo": "hueco", "titulo": "La trampa de -aba", "estricto": true, "ayuda": "Escribe la palabra entera, con b o con v. Prueba antes a ponerla en infinitivo.", "items": [{"enun": "Cuando era pequeño ______ a la piscina cada verano. <i>(ir)<\/i>", "sol": "iba", "porque": "imperfecto de <i>ir<\/i>: con b"}, {"enun": "La empresa ______ el género los martes. <i>(llevar)<\/i>", "sol": "llevaba", "porque": "imperfecto de la primera conjugación"}, {"enun": "Compró una casa ______. <i>(nuevo, femenino)<\/i>", "sol": "nueva", "porque": "adjetivo: no admite infinitivo"}, {"enun": "Es la ______ vez que lo pide. <i>(octavo, femenino)<\/i>", "sol": "octava", "porque": "numeral, no verbo"}, {"enun": "______ a decírselo y se calló. <i>(ir, él)<\/i>", "sol": "Iba|iba"}, {"enun": "Nos ______ la tarde entera. <i>(pasar)<\/i>", "sol": "pasaba"}], "criterio": "Las cuatro con b admiten infinitivo: <i>ir<\/i>, <i>llevar<\/i>, <i>ir<\/i>, <i>pasar<\/i>. Las dos con v, no: <i>nueva<\/i> y <i>octava<\/i> no vienen de ningún verbo. Esa prueba resuelve la terminación entera.", "apoyo": ["1 · B y V"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las que vienen del catalán", "ayuda": "Seis palabras de este párrafo están escritas como en catalán. <b>Pincha en las que estén mal.<\/b> Si te pasas, también cuenta.", "items": [{"texto": "El govern aprobó una ayuda para canviar los coches viejos, y mi advocat dice que conviene provar antes si a uno le toca. Con el mobil se puede pedir cita, aunque hay que haver presentado la declaración. El resto es esperar.", "faltas": {"govern": "gobierno", "canviar": "cambiar", "advocat": "abogado", "provar": "probar", "mobil": "móvil", "haver": "haber"}}], "criterio": "<i>Conviene<\/i> está bien escrito: va detrás de <b>n<\/b>, y en catalán se escribe igual. La interferencia va palabra por palabra, así que no hay más defensa que tu lista de fallos.<br><br>De las seis, <i>móvil<\/i> además lleva tilde: es llana acabada en -l, que es la regla del día 3.", "apoyo": ["1 · B y V"], "solo_web": true}, {"tipo": "opcion", "titulo": "Los prefijos que significan algo", "ayuda": "Si sabes qué significa, sabes cómo se escribe. Explica qué significa el principio de cada palabra.", "ops": ["dos", "vida", "libro", "en lugar de", "debajo"], "items": [{"enun": "<i>bisabuelo<\/i>", "sol": "dos", "porque": "dos generaciones por encima del padre"}, {"enun": "<i>bimestre<\/i>", "sol": "dos"}, {"enun": "<i>biólogo<\/i>", "sol": "vida"}, {"enun": "<i>bibliografía<\/i>", "sol": "libro"}, {"enun": "<i>vicepresidente<\/i>", "sol": "en lugar de"}, {"enun": "<i>subterráneo<\/i>", "sol": "debajo"}], "criterio": "Los tres primeros grupos van con <b>b<\/b> y el de <i>vice-<\/i> con <b>v<\/b>. Saber qué significa el prefijo decide la letra sin memorizar ninguna lista.", "apoyo": ["2 · Los prefijos que significan algo"], "solo_web": true}], "cuaderno_txt": "Nudo 4 · Las letras: B/V y J/G — apartados 1 y 2: B y V; Los prefijos que significan algo (p. 25 y 26) · ejercicios 1, 2, 3 y 4", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El primer texto corregido", "meta": "25 minutos · los errores que no llevan ninguna letra mal", "cuaderno": [{"nudo": 17, "apartados": [4], "ejercicios": [9], "secciones": {"4": ["2019"]}}, {"nudo": 18, "apartados": [5, 6], "ejercicios": [10]}], "teoria": "<h3>Nudo 17 · 4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2019 · Los hermanos Jussen<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El primero de los dos hermanos en engancharse a la música fue Lucas Jussen. Tenía cinco años<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y se sentó frente al televisor a ver un partido de la selección de su país, Holanda. Sonó el himno y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">madre del muchacho, flautista profesional, se percató de que le gustaba, así que le ofreció enseñarle sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">notas al piano. Con esta treta, desvió la atención del niño del fútbol y despertó en él un interés por un<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">instrumento que se convertiría en su pasión. Arthur Jussen, tres años menor, oía los avances musicales de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">su hermano y en cuanto alcanzó la edad suficiente se sentó junto a él en la banqueta. «Le veía tocar con<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mi madre o con mi padre. Yo estaba siempre ahí escuchando y pensaba: “Yo quiero hacer lo que hace<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">él”». Ahora, con 24 y 21 años, forman un dúo de pianistas clásicos con una complicidad única.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Desde muy pronto la joven pareja se convirtió en un fenómeno en Holanda. Eran el combo perfecto.<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Niños virtuosos, guapos, serios al piano, traviesos delante de las cámaras. La televisión se interesó por<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ellos y, como si fueran dos pequeños Mozart, tocaron por primera vez para la reina Beatriz de los Países<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Bajos con 12 y 8 años.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Han editado seis CD con Deutsche Grammophon: con el primero consiguieron el disco de platino,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y con otros tres de ellos, el de oro. Sus logros son inmensos, pero han alcanzado la mayoría de edad y<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">cuenta Lucas que la crítica ya no los juzga como niños, sino como adultos: «Cuando eres pequeño<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">disfrutas tocando sin pensar que te pueden criticar. Si lo hacen, no es delante de ti y suelen añadir: “Hay<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">fallos, pero para ser un niño toca muy bien”. Ahora nos valoran como adultos. Y eso es más honesto,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pero también mucho más duro».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A simple vista, a los hermanos Jussen les pega más tener un balón en los pies que un teclado bajo sus<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">manos. Sus referencias son futbolísticas. Son coquetos, esbeltos, modernos. En su MP3 llevan a Queen y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Diana Krall. Su estética encima de los escenarios es rompedora. Y con ella tratan de ganarse la confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">del público joven. Se han subido al escenario con trajes transparentes. Han quitado las butacas a grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">salas de clásica para poner pufs. Pero la transgresión que defienden con su imagen, explica Lucas, no la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quieren para su repertorio: «Con la música somos muy serios. Cuando vienen jóvenes a vernos sentimos<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">que, por nuestro aspecto, esperan un programa fácil de escuchar. No es el caso. Se sientan y disfrutan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de una hora y media de música clásica pura».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Con los años, los Jussen se han dado cuenta de que el valor de su arte radica en la compenetración<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que han alcanzado juntos. Y aunque les atrae desarrollar sus carreras en solitario, saben que la magia<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chispea cuando tocan a dúo. «Con Lucas construyo algo especial. Hay muchos solistas, pero no tantas<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">parejas con una conexión como la nuestra. Tenemos la suerte de ser hermanos y la oportunidad de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ofrecer juntos algo único. Y además es genial no tener que viajar solo».<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Virginia López, <\/em>El País Semanal<em>, 2 de febrero de 2018, tal como la imprimió la prueba de 2019. Sin título en el original.<\/em><\/p>\n<h3>Nudo 18 · 5 · Nueve redacciones puntuadas<\/h3>\n<p>Léelas con la hoja A-1 delante y puntúalas tú antes de mirar la nota.<\/p>\n<h4>Consigna de 2021, opción A — <em>la educación para poder mejorar la vida de las personas<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 106 palabras.<\/p>\n<blockquote>\n<p>Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>3<\/strong>.<\/p>\n<p>Tesis discutible en la primera frase; dos argumentos con conector (<em>en primer lugar<\/em>, <em>además<\/em>); una concesión (<em>es cierto que… pero<\/em>) que sube variación; cierre con consecuencia, no repetición; ni una falta ni una coma que sobre. <strong>Es el único de los nueve que llega a 3.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 98 palabras.<\/p>\n<blockquote>\n<p>Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,25<\/strong>.<\/p>\n<p>Sin faltas y con los puntos donde van, corrección y cohesión quedan enteras; pierde en las otras cuatro bandas. La tesis no es discutible; los tres argumentos se suman con <em>también<\/em>, sin marcar el orden (<em>en primer lugar<\/em>, <em>además<\/em>), y se acumulan; el cierre repite la primera frase casi igual (coherencia, 0,25). <em>Ayudar<\/em> aparece cuatro veces, <em>la educación<\/em> cuatro y <em>yo pienso que<\/em> dos: palabras que se repiten a menudo, y la variación se queda en 0. El <em>tú<\/em> de conversación (<em>te ayuda<\/em>, <em>si tú sabes<\/em>) y <em>yo pienso que<\/em> dejan el registro en 0.<\/p>\n<p><strong>Modelo bajo.<\/strong> 63 palabras.<\/p>\n<blockquote>\n<p>La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,35<\/strong>, y prorrateado por la extensión, ≈ <strong>0,85<\/strong>.<\/p>\n<p>Siete faltas de ortografía en 63 palabras (corrección, 0,6) — Cuenta C: <em>educacion<\/em> (dos veces), <em>inportante<\/em>, <em>por que<\/em>, <em>ningun<\/em>, <em>estudio<\/em>, <em>estan<\/em>. Cuenta B: tres comas donde iba punto —tras <em>nada<\/em>, tras <em>igual<\/em> y tras <em>y punto<\/em>—, y con tres la cohesión baja a 0,5. No hay tesis discutible, la razón es un ejemplo (<em>en mi pueblo<\/em>) y el final se desdice (coherencia, 0). <em>O sea<\/em> y <em>y punto<\/em> son marcas de oralidad (registro, 0). Y se queda por debajo de las 80 de clase: cada banda se prorratea por la extensión, 63 de las 100 palabras pedidas.<\/p>\n<h4>Consigna de 2020, opción A — <em>la caza<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 111 palabras.<\/p>\n<blockquote>\n<p>Creo que la caza no se puede defender ni condenar en bloque, porque el juicio dependerá de la razón por la que se cace. En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien. Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos. Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no tiene otro objeto que presumir. Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia, ni una falta y una concesión. <em>Por qué no es un tres:<\/em> supongamos que el folio viene sin márgenes. <strong>Ha perdido la banda que solo exige márgenes y letra legible.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 97 palabras. <em>(Escrito con las faltas que se repiten en los primeros textos de clase.)<\/em><\/p>\n<blockquote>\n<p>Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0,8<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,80<\/strong>.<\/p>\n<p>Las razones se amontonan y el final abre un tema nuevo. Cuenta B: cuatro comas donde iba punto, y el punto que falta detrás de <em>sin comida<\/em>. Cuenta C: <em>esta<\/em>, <em>tambien<\/em>, <em>diversion<\/em>, <em>ademas<\/em>, <em>ningun<\/em>. Y <em>animales<\/em> cuatro veces. <strong>Le falta la estructura: una tesis, dos razones con conector y un cierre.<\/strong><\/p>\n<p><strong>Modelo bajo.<\/strong> 83 palabras.<\/p>\n<blockquote>\n<p>A mi la caza me parese una cosa muy antigua que ya no sirbe para nada, en mi pueblo ay muchos cazadores y salen los domingos con las escopetas, luego se ban al bar a contarlo, yo e ido alguna vez de pequeño y la berdad es que no me gusto nada ver al conejo aquel echo un cristo, o sea que por mi que la proiban ya y punto, tanpoco quiero meterme con nadie por que cada uno hase lo que kiere.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>La idea llega al final y luego se desdice. Cinco comas donde iba un punto. Quince faltas —Cuenta C: <em>mi<\/em> (dos veces, sin tilde), <em>parese<\/em>, <em>sirbe<\/em>, <em>ay<\/em>, <em>ban<\/em>, <em>e<\/em>, <em>berdad<\/em>, <em>gusto<\/em>, <em>echo<\/em>, <em>proiban<\/em>, <em>tanpoco<\/em>, <em>por que<\/em>, <em>hase<\/em>, <em>kiere<\/em>—: a partir de doce, corrección es cero. <em>O sea<\/em> y <em>echo un cristo<\/em> se llevan el registro. Y <strong>83 palabras: tres por encima del límite de clase para el prorrateo.<\/strong> Un apunte que tranquiliza: esas quince faltas <strong>no descuentan otros 1,50 aparte<\/strong>, porque la penalización de 0,10 solo corre en los bloques 1 y 2.<\/p>\n<h4>Consigna de 2026, opción A — <em>la necesidad de defender el trabajo agrícola<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 110 palabras.<\/p>\n<blockquote>\n<p>Creo que hay que defender el trabajo agrícola porque de él depende quién decide el precio de lo que comemos. En primer lugar el agricultor cobra por su cosecha una parte muy pequeña de lo que pagamos en la tienda, y la diferencia se la quedan los intermediarios. Además el campo depende de un clima cada vez menos previsible, y dos años malos seguidos pueden cerrar una explotación entera. Es cierto que las subvenciones sostienen al sector cada año pero una ayuda no sustituye un precio justo. Por eso pienso que defender el campo es asegurar que la comida se siga produciendo aquí y no dependa solo de las importaciones.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia y ni una falta. <em>Por qué no es un tres:<\/em> le faltan tres comas —tras <em>En primer lugar<\/em>, tras <em>Además<\/em> y delante de <em>pero<\/em>—. <strong>Los dos primeros errores de cohesión no bajan la banda; a partir del tercero, cada dos errores bajan 0,25, y con tres se queda en 0,5.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 95 palabras, con sus faltas.<\/p>\n<blockquote>\n<p>Yo creo que el trabajo agricola es muy importante para todos porque sin agricultores no comeriamos, los agricultores trabajan mucho y ganan muy poco dinero y eso no esta bien, en mi pueblo casi todos los jovenes se an ido a la ciudad y las tierras se quedan sin nadie que las trabaje, tambien está el problema de que la comida viene de fuera y es más barata. Yo creo que hay que ayudar a los agricultores porque el trabajo agricola es muy importante para todos y luego nos quejamos cuando todo sube de precio.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,85<\/strong>.<\/p>\n<p>El cierre es la primera frase copiada. Tres comas donde iba punto. Siete faltas —Cuenta C: <em>agricola<\/em> (dos veces), <em>comeriamos<\/em>, <em>esta<\/em>, <em>jovenes<\/em>, <em>an<\/em>, <em>tambien<\/em>—, y dos son la misma palabra: <em>agricola<\/em> cuenta cada vez. <em>Por qué está donde está:<\/em> le faltan dos partes que se arreglan en tres minutos: <strong>una tesis discutible y un cierre que no la repita<\/strong>.<\/p>\n<p><strong>Modelo bajo.<\/strong> 91 palabras.<\/p>\n<blockquote>\n<p>El campo es muy duro. Mi tio tenia unas tierras aya en el pueblo y las bendio por que no sacaba nada. Ahora ai muchas naves. La gente de ciudad no save lo que cuesta un kilo de tomates, en berano fui a coger aceituna y acabé echo polvo. Yo que se, esto tendrian que areglarlo los de arriba. Tambien es verda que la fruta de fuera esta mas barata y la gente compra lo barato, es normal. En fin, que el campo esta fatal y no ay quien lo arregle.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>No hay tesis: salta del tío a los tomates y a la aceituna, y al final se desdice. Dieciocho faltas contadas por lo bajo — Cuenta C: <em>tio<\/em>, <em>tenia<\/em>, <em>aya<\/em>, <em>bendio<\/em>, <em>por que<\/em>, <em>ai<\/em>, <em>save<\/em>, <em>berano<\/em>, <em>echo<\/em>, <em>se<\/em>, <em>tendrian<\/em>, <em>areglarlo<\/em>, <em>Tambien<\/em>, <em>verda<\/em>, <em>esta<\/em> (dos veces), <em>mas<\/em>, <em>ay<\/em>. <em>Yo que se<\/em> y <em>echo polvo<\/em> se llevan el registro. <em>Por qué está donde está:<\/em> <strong>la cohesión supera a la de los otros dos modelos bajos<\/strong> —frases cortas, acabadas en punto— y aun así saca 0,75, porque no hay tesis ni argumentos y las dieciocho faltas dejan la corrección en cero.<\/p>\n<h3>Nudo 18 · 6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2019: las cuatro preguntas", "dossier": {"cuaderno": "17", "ejercicio": 9, "parte": "1.1 a 1.4"}, "ayuda": "Las preguntas oficiales de 2019, sobre el texto de los hermanos Jussen, que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos para el bloque entero.", "items": [{"enun": "«Explique brevemente qué motivó la vocación de cada uno de los hermanos.» <b>[0,5]<\/b>", "conv": "2019", "modelo": "Primero surgió la vocación del mayor: cuando su madre observó que le atraía la música del himno de un partido de fútbol, aprovechó esa circunstancia para interesarlo en el piano, y ese interés aumentó hasta convertirse en una pasión. Al hermano pequeño se le despertó la afición observando a sus padres, músicos ambos, y a su hermano mayor, a los que veía tocar y a los que quería imitar."}, {"enun": "«Según los dos hermanos, ¿cuál es la gran diferencia entre el presente y cuando eran pequeños?» <b>[0,5]<\/b>", "conv": "2019", "modelo": "Ambos empezaron a tocar en público cuando eran niños y eran tratados como dos pequeños genios; la crítica ante dos niños que tocan es más bondadosa, porque los errores se les perdonan por ser niños. Llegados a la edad adulta, la crítica ya no es tan benevolente: reconocen que es mucho más justa, pero más difícil de sobrellevar."}, {"enun": "«Explique, con sus propias palabras, el contraste que, según se explica en el texto, se da entre la imagen y el repertorio de los hermanos Jussen.» <b>[1]<\/b>", "conv": "2019", "modelo": "Ambos actúan y se comportan como dos jóvenes actuales: visten de forma moderna, son coquetos y les gusta la música pop; están acostumbrados a ser el centro de atención y en sus espectáculos son rompedores en el vestuario y en la escenografía. En cambio, en el repertorio son muy tradicionales, porque creen que el público joven acude por su imagen, pero que debe y puede disfrutar de un concierto de música clásica pura."}, {"enun": "«¿Cuáles son las ventajas que ambos hermanos encuentran en el hecho de tocar juntos?» <b>[0,5]<\/b>", "conv": "2019", "modelo": "Aunque tienen interés en desarrollar una carrera en solitario, han descubierto que lo que los hace únicos es la compenetración que nace de ser hermanos: alcanzan una conexión difícil para otros pianistas sin ese vínculo. Además, actuar juntos les permite no tener que viajar solos."}], "criterio": "Los modelos son las respuestas oficiales de 2019. Una respuesta completa contesta todo lo que pide el enunciado —en la 1.1, la vocación de los dos hermanos—, redactada y sin copiar frases del texto.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2019"}, "apoyo": ["2019 · Los hermanos Jussen"], "dossier_txt": "Del dossier: nudo 17, ejercicio 9 · 1.1 a 1.4", "texto_titulo": "2019 · Los hermanos Jussen", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El primero de los dos hermanos en engancharse a la música fue Lucas Jussen. Tenía cinco años<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y se sentó frente al televisor a ver un partido de la selección de su país, Holanda. Sonó el himno y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">madre del muchacho, flautista profesional, se percató de que le gustaba, así que le ofreció enseñarle sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">notas al piano. Con esta treta, desvió la atención del niño del fútbol y despertó en él un interés por un<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">instrumento que se convertiría en su pasión. Arthur Jussen, tres años menor, oía los avances musicales de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">su hermano y en cuanto alcanzó la edad suficiente se sentó junto a él en la banqueta. «Le veía tocar con<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mi madre o con mi padre. Yo estaba siempre ahí escuchando y pensaba: “Yo quiero hacer lo que hace<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">él”». Ahora, con 24 y 21 años, forman un dúo de pianistas clásicos con una complicidad única.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Desde muy pronto la joven pareja se convirtió en un fenómeno en Holanda. Eran el combo perfecto.<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Niños virtuosos, guapos, serios al piano, traviesos delante de las cámaras. La televisión se interesó por<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ellos y, como si fueran dos pequeños Mozart, tocaron por primera vez para la reina Beatriz de los Países<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Bajos con 12 y 8 años.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Han editado seis CD con Deutsche Grammophon: con el primero consiguieron el disco de platino,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y con otros tres de ellos, el de oro. Sus logros son inmensos, pero han alcanzado la mayoría de edad y<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">cuenta Lucas que la crítica ya no los juzga como niños, sino como adultos: «Cuando eres pequeño<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">disfrutas tocando sin pensar que te pueden criticar. Si lo hacen, no es delante de ti y suelen añadir: “Hay<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">fallos, pero para ser un niño toca muy bien”. Ahora nos valoran como adultos. Y eso es más honesto,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pero también mucho más duro».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A simple vista, a los hermanos Jussen les pega más tener un balón en los pies que un teclado bajo sus<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">manos. Sus referencias son futbolísticas. Son coquetos, esbeltos, modernos. En su MP3 llevan a Queen y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Diana Krall. Su estética encima de los escenarios es rompedora. Y con ella tratan de ganarse la confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">del público joven. Se han subido al escenario con trajes transparentes. Han quitado las butacas a grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">salas de clásica para poner pufs. Pero la transgresión que defienden con su imagen, explica Lucas, no la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quieren para su repertorio: «Con la música somos muy serios. Cuando vienen jóvenes a vernos sentimos<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">que, por nuestro aspecto, esperan un programa fácil de escuchar. No es el caso. Se sientan y disfrutan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de una hora y media de música clásica pura».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Con los años, los Jussen se han dado cuenta de que el valor de su arte radica en la compenetración<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que han alcanzado juntos. Y aunque les atrae desarrollar sus carreras en solitario, saben que la magia<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chispea cuando tocan a dúo. «Con Lucas construyo algo especial. Hay muchos solistas, pero no tantas<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">parejas con una conexión como la nuestra. Tenemos la suerte de ser hermanos y la oportunidad de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ofrecer juntos algo único. Y además es genial no tener que viajar solo».<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Virginia López, <\/em>El País Semanal<em>, 2 de febrero de 2018, tal como la imprimió la prueba de 2019. Sin título en el original.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "Bloque 1 de 2019: el léxico", "dossier": {"cuaderno": "17", "ejercicio": 9, "parte": "1.5"}, "ayuda": "La pregunta 1.5 de 2019: «Proponga un sinónimo o explique el significado de las siguientes palabras o expresiones. Preste atención a la adecuación de la palabra al contexto en el que se encuentra.» Vale 1 punto.", "items": [{"enun": "<i>engancharse<\/i> (línea 1)", "modelo": "aficionarse, hacerse adicto de forma figurada a algo"}, {"enun": "<i>inmensos<\/i> (línea 14)", "modelo": "enormes, infinitos"}, {"enun": "<i>transgresión<\/i> (línea 23)", "modelo": "ruptura de las normas convencionales en el vestuario, la forma de actuar, el comportamiento"}, {"enun": "<i>chispea<\/i> (línea 29)", "modelo": "brilla, reluce"}], "criterio": "Cada palabra vale 0,25; con alguna imprecisión, 0,1. El sinónimo tiene que servir en la frase del texto: <i>chispea<\/i> no es aquí que caiga lluvia fina, sino que la magia brilla cuando tocan juntos.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2019"}, "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2019 · Los hermanos Jussen"], "dossier_txt": "Del dossier: nudo 17, ejercicio 9 · 1.5", "texto_titulo": "2019 · Los hermanos Jussen", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El primero de los dos hermanos en engancharse a la música fue Lucas Jussen. Tenía cinco años<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y se sentó frente al televisor a ver un partido de la selección de su país, Holanda. Sonó el himno y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">madre del muchacho, flautista profesional, se percató de que le gustaba, así que le ofreció enseñarle sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">notas al piano. Con esta treta, desvió la atención del niño del fútbol y despertó en él un interés por un<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">instrumento que se convertiría en su pasión. Arthur Jussen, tres años menor, oía los a as en solitario, saben que la magia<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chispea cuando tocan a dúo. «Con Lucas construyo algo especial. Hay muchos solistas, pero no tantas<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">parejas con una conexión como la nuestra. Tenemos la suerte de ser hermanos y la oportunidad de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ofrecer juntos algo único. Y además es genial no tener que viajar solo».<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Virginia López, <\/em>El País Semanal<em>, 2 de febrero de 2018, tal como la imprimió la prueba de 2019. Sin título en el original.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "La tesis y los dos argumentos: los niños prodigio", "dossier": {"cuaderno": "18", "ejercicio": 10}, "ayuda": "Escribe la tesis, en una frase que alguien pueda negar, y los dos argumentos, cada uno con su conector y en dos o tres frases. Solo esas tres partes: la concesión y el cierre se escriben otro día. El texto de los Jussen da datos para los dos argumentos.", "items": [{"enun": "Consigna de 2019, opción A: <i>su opinión sobre los niños prodigio en la música, el cine o la danza<\/i>.", "modelo": "Dos modelos debajo, los de la clave del dossier."}], "criterio": "Que la tesis se pueda negar —«pues yo creo que no hay que protegerlo»—; que cada argumento explique un mecanismo y no cuente solo un caso; y que los dos lleven conector distinto.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2019"}, "modelos": ["<b>Tesis:<\/b> «Creo que a un niño prodigio hay que protegerlo de su propio éxito.» <b>Argumentos:<\/b> «En primer lugar, un niño que actúa desde los ocho años trabaja como un adulto sin haber elegido ese trabajo: a Lucas Jussen lo sentó al piano su madre a los cinco años para apartarlo del fútbol. Además, la crítica perdona al niño lo que no perdona al adulto: los Jussen tocaron para la reina de Holanda con doce y ocho años, y ahora, con veinticuatro y veintiuno, se les juzga como a cualquier pianista adulto, de un modo que Lucas describe como más honesto y mucho más duro.»", "<b>Tesis:<\/b> «Creo que el talento precoz solo sale adelante cuando se cuida como un oficio y no como un espectáculo.» <b>Argumentos:<\/b> «Por una parte, los Jussen siguieron formándose después de los primeros aplausos, y hoy, con veinticuatro y veintiún años, llevan seis discos grabados con un sello de música clásica. Por otra, la televisión les dio público a los doce y a los ocho años, pero el oficio se lo dieron sus padres músicos y los años de estudio: el programa con el que llenan salas es hora y media de música clásica pura.»"], "apoyo": ["2019 · Los hermanos Jussen", "Consigna de 2021, opción A — la educación para poder mejorar la vida de las personas"], "dossier_txt": "Del dossier: nudo 18, ejercicio 10", "texto_titulo": "2019 · Los hermanos Jussen", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El primero de los dos hermanos en engancharse a la música fue Lucas Jussen. Tenía cinco años<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">y se sentó frente al televisor a ver un partido de la selección de su país, Holanda. Sonó el himno y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">madre del muchacho, flautista profesional, se percató de que le gustaba, así que le ofreció enseñarle sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">notas al piano. Con esta treta, desvió la atención del niño del fútbol y despertó en él un interés por un<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">instrumento que se convertiría en su pasión. Arthur Jussen, tres años menor, oía los avances musicales de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"
