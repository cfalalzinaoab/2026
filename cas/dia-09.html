 como adultos. Y eso es más honesto,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pero también mucho más duro».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A simple vista, a los hermanos Jussen les pega más tener un balón en los pies que un teclado bajo sus<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">manos. Sus referencias son futbolísticas. Son coquetos, esbeltos, modernos. En su MP3 llevan a Queen y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Diana Krall. Su estética encima de los escenarios es rompedora. Y con ella tratan de ganarse la confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">del público joven. Se han subido al escenario con trajes transparentes. Han quitado las butacas a grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">salas de clásica para poner pufs. Pero la transgresión que defienden con su imagen, explica Lucas, no la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quieren para su repertorio: «Con la música somos muy serios. Cuando vienen jóvenes a vernos sentimos<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">que, por nuestro aspecto, esperan un programa fácil de escuchar. No es el caso. Se sientan y disfrutan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de una hora y media de música clásica pura».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Con los años, los Jussen se han dado cuenta de que el valor de su arte radica en la compenetración<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que han alcanzado juntos. Y aunque les atrae desarrollar sus carreras en solitario, saben que la magia<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chispea cuando tocan a dúo. «Con Lucas construyo algo especial. Hay muchos solistas, pero no tantas<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">parejas con una conexión como la nuestra. Tenemos la suerte de ser hermanos y la oportunidad de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ofrecer juntos algo único. Y además es genial no tener que viajar solo».<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Virginia López, <\/em>El País Semanal<em>, 2 de febrero de 2018, tal como la imprimió la prueba de 2019. Sin título en el original.<\/em><\/p>"}, {"tipo": "hueco", "titulo": "El texto del día: ¿en qué línea?", "estricto": true, "ayuda": "Escribe el número de la línea donde empieza la respuesta. Si ocupa dos líneas, vale cualquiera de las dos.", "items": [{"enun": "¿A qué hora tenían la reserva los dos equipos?", "sol": "3|4"}, {"enun": "¿Con cuántos días de antelación se podía reservar?", "sol": "6"}, {"enun": "¿Qué ofreció el conserje a cada equipo?", "sol": "11|12"}], "criterio": "Se admite cualquiera de las líneas que ocupa el dato. Antes de contestar, lee la oración entera: el número de línea solo indica dónde mirar.", "apoyo_html": "<p><b>Localizar.<\/b> Lee las preguntas antes de volver al texto y anota junto a cada una el número de la línea donde <b>empieza<\/b> la respuesta. Si el dato ocupa dos líneas, vale cualquiera de las dos. Después lee la oración entera: el número solo indica dónde mirar.<\/p><p>Localizar corresponde a la pasada 3 de la lectura de examen: primero se lee entero, después se leen las preguntas, y al final se vuelve al texto a buscar.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico del texto", "ayuda": "Cuatro palabras del texto. Lee la oración entera donde está cada una antes de decidir.", "items": [{"enun": "<b>registrar<\/b> <i>(línea 10)<\/i>", "ops": ["inspeccionar", "cobrar", "anotar en el calendario"], "sol": "anotar en el calendario", "porque": "en el texto, una reserva sin registrar es una reserva que no consta"}, {"enun": "<b>importe<\/b> <i>(línea 12)<\/i>", "ops": ["cantidad de dinero pagada", "documento de reserva", "valor sentimental"], "sol": "cantidad de dinero pagada"}, {"enun": "<b>adjuntó<\/b> <i>(línea 15)<\/i>", "ops": ["resumió", "añadió al mensaje", "borró"], "sol": "añadió al mensaje"}, {"enun": "<b>disponibilidad<\/b> <i>(línea 22)<\/i>", "ops": ["buena voluntad", "precio de la reserva", "horas o espacios libres"], "sol": "horas o espacios libres", "porque": "la otra acepción, «buena disposición para ayudar», no encaja con «canales» ni con «calendario»"}], "criterio": "Aquí se elige entre tres opciones para practicar la comprobación en contexto; en el examen se escribe el significado o un sinónimo que encaje en la oración.", "apoyo_html": "<p><b>Léxico.<\/b> En el examen la pregunta no da opciones —«proponga un sinónimo o explique el significado, atendiendo al contexto»— y vale 0,25 por palabra. Lee la oración entera donde está la palabra: muchas tienen otra acepción más corriente fuera de ese contexto, y quien contesta de memoria escribe esa acepción en lugar de la del texto. Un sinónimo vale si se puede poner en el sitio de la palabra sin que cambie el sentido de la frase.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "cazar", "titulo": "Primera pasada: las tildes que faltan", "ayuda": "Un texto de alumno inventado para practicar, sobre la consigna de 2020 (la caza). <b>Cinco palabras están sin tilde.<\/b> Pínchalas.", "items": [{"texto": "Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.", "faltas": {"esta": "está", "tambien": "también", "diversion": "diversión", "ademas": "además", "ningun": "ningún"}}], "criterio": "Las cinco son de la misma clase: agudas acabadas en vocal o en -n —<i>diversión<\/i>, <i>además<\/i>, <i>ningún<\/i>, <i>también<\/i>— y un diacrítico, <i>está<\/i>.<br><br>Ninguna de las cinco la marca un corrector automático en el móvil, porque <i>esta<\/i> existe y las otras cuatro se escriben así en muchos teclados sin acento.", "apoyo": "todo", "solo_web": true}, {"tipo": "cazar", "titulo": "Segunda pasada: las oraciones pegadas", "ayuda": "El mismo texto. En <b>cuatro sitios<\/b> una coma junta dos oraciones que ya están terminadas, y en un quinto no hay ni coma. <b>Pincha la palabra que va justo antes de cada empalme.<\/b>", "items": [{"texto": "Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.", "faltas": {"vivir": "vivir.", "deporte": "deporte.", "comida": "comida.", "nada": "nada.", "supermercados": "supermercados."}}], "criterio": "El texto entero lleva <b>dos puntos<\/b>: uno al final y otro detrás de <i>deporte<\/i>. Todo lo demás va cosido con comas: cinco empalmes en un texto de cien palabras, y cada uno cuenta como error de construcción.<br><br>El empalme más difícil de localizar está en <i>sin comida los animales no tienen la culpa<\/i>, donde no hay ni coma: dos oraciones seguidas sin ningún signo entre ellas.", "apoyo": "todo", "solo_web": true}, {"tipo": "abierta", "titulo": "Ponle los puntos", "ayuda": "Copia el texto de arriba con los puntos donde tocan y las mayúsculas detrás. No cambies ni una palabra: solo la puntuación.", "items": [{"enun": "El texto, puntuado:", "modelo": "«Yo pienso que la caza está muy mal porque los animales también tienen derecho a vivir. Los cazadores matan a los animales por diversión y eso no es un deporte. Hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida. Los animales no tienen la culpa de nada. En mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y además no hace falta cazar para comer porque hay supermercados: se puede comprar la carne allí sin tener que matar a ningún animal.»<br><br>Seis oraciones donde había dos. Solo han cambiado los signos y las mayúsculas."}], "criterio": "Léelo en voz alta antes y después. El texto significa exactamente lo mismo; solo han cambiado los signos.<br><br>En el último empalme se admiten los dos signos: punto o dos puntos. Los dos puntos marcan que lo segundo explica lo primero, uno de sus usos.", "apoyo": "todo", "solo_web": true}], "lectura": {"titulo": "La reserva de la pista", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["El equipo de Lucía llegó al polideportivo con un balón y la", "confirmación de su reserva. Dentro de la pista ya estaba", "entrenando otro grupo. Los dos habían recibido un correo para las", "siete. El conserje comprobó las fechas: una reserva se había hecho", "por internet y otra por teléfono.", "", "El centro permitía reservar con quince días de antelación. Las", "peticiones digitales entraban directamente en el calendario,", "mientras que las telefónicas se anotaban primero en una libreta.", "Si cambiaba el turno de recepción antes de pasarlas al ordenador,", "podían quedar sin registrar durante varias horas.", "", "El conserje ofreció a uno de los equipos otra pista, más pequeña,", "y devolvió el importe de la reserva al otro. Lucía aceptó el", "cambio porque sus compañeros habían venido desde distintos", "barrios. Después envió una reclamación en la que explicó lo", "ocurrido y adjuntó el correo de confirmación.", "", "La dirección decidió utilizar un único calendario para todas las", "peticiones. Mantuvo el teléfono para quienes preferían reservar", "por esa vía y encargó que la anotación se hiciera durante la", "llamada. El error permitió revisar una organización que había", "funcionado mientras llegaban pocas solicitudes. Al aumentar el uso", "del servicio, era necesario actualizar el procedimiento y", "comprobar que todos los canales mostraban la misma disponibilidad."], "pie": "Texto inventado. Ni Lucía ni los datos que da son reales."}, "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 4: Seis textos reales, con su bloque 1 (p. 48) · ejercicio 9 · Nudo 18 · Escribir: el criterio — apartados 5 y 6: Nueve redacciones puntuadas; Las consignas reales (p. 70 y 74) · ejercicio 10", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los pronombres: los seis tipos", "meta": "30 minutos · el ejercicio que cae 15 de 16 años", "cuaderno": {"nudo": 9, "apartados": [1], "ejercicios": [1, 2, 3, 4]}, "teoria": "<h3>1 · Los seis tipos<\/h3>\n<p><strong>Qué es un pronombre.<\/strong> Una palabra que <strong>ocupa el sitio<\/strong> de otra. No nombra: señala algo que ya se ha nombrado (o que se nombrará). Va <strong>solo<\/strong>: no lleva sustantivo al lado.<\/p>\n<blockquote>\n<p><strong>La única pregunta que hay que hacerse siempre:<\/strong>\n<strong>¿Acompaña a un sustantivo? → determinante. ¿Va en su lugar? → pronombre.<\/strong><\/p>\n<p>«<strong>Los<\/strong> pistachos que cultivan los socios» → determinante.\n«<strong>Los<\/strong> de este año irán al centro de Europa» → pronombre. <em>(convocatoria 2026)<\/em><\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>formas<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Personales<\/strong><\/td>\n<td>yo, mí, me, conmigo · tú, ti, te, contigo · él/ella, sí, se, <strong>lo, la, le<\/strong> · nosotros, <strong>nos<\/strong> · vosotros, os · ellos/ellas, <strong>los, las, les<\/strong><\/td>\n<td>«apenas <strong>los<\/strong> había pisado»<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Demostrativos<\/strong><\/td>\n<td>este, ese, aquel <em>(y femeninos y plurales)<\/em> + los neutros <strong>esto, eso, aquello<\/strong><\/td>\n<td>«por <strong>eso<\/strong> el sur está más poblado»<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Numerales<\/strong><\/td>\n<td>uno, dos, primero, la mitad… cuando van solos<\/td>\n<td>«se pueden resumir en <strong>tres<\/strong>» (2013)<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Indefinidos<\/strong><\/td>\n<td>alguno, ninguno, varios, mucho… y los que <strong>solo<\/strong> son pronombres: <strong>algo, nada, nadie, alguien, quienquiera<\/strong><\/td>\n<td>«aunque algunos están verdes»<\/td>\n<\/tr>\n<tr>\n<td><strong>5. Interrogativos y exclamativos<\/strong><\/td>\n<td>quién, qué, cuál, cuánto <em>(con tilde, y solos)<\/em><\/td>\n<td>«¿Cuáles prefieres?»<\/td>\n<\/tr>\n<tr>\n<td><strong>6. Relativos<\/strong><\/td>\n<td><strong>que<\/strong>, quien, el cual, cuanto <em>(y<\/em> cuyo, <em>que es determinante)<\/em><\/td>\n<td>«los problemas <strong>que<\/strong> puede provocar»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>(Los posesivos —el mío, el tuyo, el suyo— también funcionan como pronombres cuando van solos: «Ese tractor no es mío, es suyo». Así se enseñan en secundaria y así se contestan en el examen. La NGLE (cap. 18) los clasifica como adjetivos en cualquier posición y analiza<\/em> el mío <em>como un grupo nominal con el sustantivo sobrentendido:<\/em> el [tractor] mío.<em>)<\/em><\/p>\n<p><strong>Los tipos 2, 3 y 4 tienen la misma forma que los determinantes correspondientes.<\/strong> Por eso solo la pregunta de arriba permite distinguirlos.<\/p>\n<p><strong>Los que hay que saber de memoria, porque caen en el examen:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>pronombre<\/th>\n<th style=\"text-align: center;\">veces en 15 convocatorias<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>lo<\/strong><\/td>\n<td style=\"text-align: center;\">9<\/td>\n<\/tr>\n<tr>\n<td><strong>los / Los<\/strong><\/td>\n<td style=\"text-align: center;\">6<\/td>\n<\/tr>\n<tr>\n<td><strong>le<\/strong><\/td>\n<td style=\"text-align: center;\">5<\/td>\n<\/tr>\n<tr>\n<td><strong>eso<\/strong><\/td>\n<td style=\"text-align: center;\">2<\/td>\n<\/tr>\n<tr>\n<td><strong>nos<\/strong><\/td>\n<td style=\"text-align: center;\">2<\/td>\n<\/tr>\n<tr>\n<td><strong>la, las, les, él, ella, ellos, aquellos, ello, que<\/strong><\/td>\n<td style=\"text-align: center;\">1 cada uno<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Con <em>lo<\/em>, <em>los<\/em> y <em>le<\/em> ya están cubiertos veinte de los casos.<\/p>\n<p><strong>Dos avisos:<\/strong><\/p>\n<ul>\n<li><strong>El neutro no lleva tilde<\/strong>: <em>esto, eso, aquello<\/em> se escriben siempre sin tilde. Son neutros porque <strong>en español no hay sustantivos neutros<\/strong>: por eso <em>eso<\/em> puede sustituir a una oración entera, que tampoco tiene género.<\/li>\n<li><strong>Cuando <em>le<em> y <\/em>les<em> van delante de <\/em>lo, la, los, las<em>, se convierten en <\/em>se<\/em><\/strong>: <em>le lo contó<\/em> → <strong>«se lo contó»<\/strong>.<\/li>\n<\/ul>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Determinante o pronombre?", "dossier": {"cuaderno": "9", "ejercicio": 1}, "ayuda": "Indica si la palabra en negrita acompaña a un sustantivo o va en su lugar. Cinco son de exámenes oficiales.", "ops": ["determinante", "pronombre"], "items": [{"enun": "«<b>Los<\/b> pistachos que cultivan los socios»", "conv": "2026", "sol": "determinante", "porque": "acompaña a <i>pistachos<\/i>"}, {"enun": "«<b>Los<\/b> de este año irán al centro»",       if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
