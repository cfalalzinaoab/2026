<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 6 · 15 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 6, "fecha": "2026-10-15", "tab": "Día 6 · 15 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 6", "h1": "Jueves 15 de octubre", "sub": "La diéresis · arranca el carril de escritura · el adjetivo: género, número y grados", "carriles": [{"chapa": "Carril A", "titulo": "La diéresis", "meta": "30 minutos · la ü: cuándo va, y los dos sitios donde no va nunca", "cuaderno": {"nudo": 2, "apartados": [3], "ejercicios": [6, 7, 8, 9]}, "teoria": "<h3>3 · La diéresis<\/h3>\n<blockquote>\n<p>En las <strong>dieciséis convocatorias<\/strong> de 2011 a 2026, la <em>ü<\/em> aparece en el texto de partida <strong>una sola vez<\/strong>: <em>vergüenza<\/em>, en 2024. En cambio está impresa en todas, en el encabezado del bloque 2: «Reflexión <strong>lingüística<\/strong>». Es decir: no hay ejercicio de diéresis en el examen, pero sí hay diéresis en lo que escribes tú, y ahí se cuenta como cualquier otra falta.<\/p>\n<\/blockquote>\n<h4>Qué hace<\/h4>\n<p>La diéresis son los dos puntos de la <em>ü<\/em>, y tienen <strong>una sola función<\/strong>: indicar que la <em>u<\/em> <strong>suena<\/strong> cuando va en los grupos <em>gue<\/em> y <em>gui<\/em>. Sin ellos, esa <em>u<\/em> está muda: solo está ahí para que la <em>g<\/em> tenga el sonido de <em>gato<\/em> y no el de <em>gente<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>grupo<\/th>\n<th>¿suena la u?<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>gue, gui<\/strong><\/td>\n<td>no<\/td>\n<td><em>guerra, guitarra, seguir, conseguido, distingue, alguien, guiso<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>güe, güi<\/strong><\/td>\n<td><strong>sí<\/strong><\/td>\n<td><em>vergüenza, cigüeña, pingüino, bilingüe, ambigüedad, antigüedad, desagüe, paragüero, ungüento, lingüística, piragüismo<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Dónde no se pone nunca<\/h4>\n<p>Dos sitios, y los dos se fallan por exceso, por ponerla donde no corresponde:<\/p>\n<p><strong>1 · En <em>gua<\/em> y <em>guo<\/em>.<\/strong> Ahí la <em>u<\/em> ya suena sola: <em>agua<\/em>, <em>antiguo<\/em>, <em>guante<\/em>, <em>ambigua<\/em>. Poner los dos puntos en ese sitio es una falta, igual que no ponerlos donde hacen falta.<\/p>\n<p><strong>2 · Detrás de <em>q<\/em>.<\/strong> En castellano la <em>u<\/em> de <em>que<\/em> y <em>qui<\/em> no suena jamás, y <strong>la <em>ü<\/em> tras <em>q<\/em> no existe<\/strong>: <em>queso<\/em>, <em>quince<\/em>, <em>máquina<\/em>.<\/p>\n<h4>Los verbos en -guar, donde se falla<\/h4>\n<p>En <em>averiguar<\/em>, <em>apaciguar<\/em>, <em>amortiguar<\/em> o <em>menguar<\/em> la <em>u<\/em> suena siempre. Mientras detrás va una <em>a<\/em> o una <em>o<\/em>, no hace falta marcarla. Pero en cuanto llega una <strong>e<\/strong>, el grupo pasa a ser <em>gue<\/em>, y ahí la <em>u<\/em> se quedaría muda si no se marca.<\/p>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>la u ya suena sola<\/th>\n<th>hay que marcarla<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>averiguar<\/td>\n<td><em>averiguo, averiguas, averiguamos<\/em><\/td>\n<td><strong>averigüé, averigüe, averigüemos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>apaciguar<\/td>\n<td><em>apaciguo<\/em><\/td>\n<td><strong>apacigüé, apacigüemos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>amortiguar<\/td>\n<td><em>amortiguo<\/em><\/td>\n<td><strong>amortigües, amortigüe<\/strong><\/td>\n<\/tr>\n<tr>\n<td>menguar<\/td>\n<td><em>mengua<\/em><\/td>\n<td><strong>mengüe, mengüen<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los verbos en <strong>-guir<\/strong> —<em>seguir, conseguir, distinguir, extinguir<\/em>— <strong>no llevan diéresis nunca<\/strong>. En esos verbos la <em>u<\/em> no ha sonado nunca, y delante de <em>a<\/em> u <em>o<\/em> desaparece del todo: <em>sigo<\/em>, <em>consigo<\/em>, <em>distingo<\/em>.<\/p>\n<h4>Y en las palabras derivadas<\/h4>\n<p>La lógica es la misma: si la palabra madre tiene la <em>u<\/em> sonando delante de <em>a<\/em> u <em>o<\/em>, al derivar hacia <em>e<\/em> o <em>i<\/em> hay que ponerle los dos puntos para que siga sonando:<\/p>\n<p><em>antiguo<\/em> → <strong>antigüedad<\/strong> · <em>ambiguo<\/em> → <strong>ambigüedad<\/strong> · <em>agua<\/em> → <strong>agüita<\/strong> · <em>lengua<\/em> → <strong>lengüeta<\/strong> · <em>paraguas<\/em> → <strong>paragüero<\/strong> · <em>Nicaragua<\/em> → <strong>nicaragüense<\/strong><\/p>\n<p>El plural la conserva: <em>bilingüe<\/em> → <em>bilingües<\/em>; <em>cigüeña<\/em> → <em>cigüeñas<\/em>.<\/p>\n<p>Hay además un <strong>uso poético<\/strong> de la diéresis: en verso rompe un diptongo para ganar una sílaba (<em>sü-a-ve<\/em> en lugar de <em>sua-ve<\/em>). Existe, pero no cae en la prueba.<\/p>\n<blockquote>\n<p>Una <em>ü<\/em> que falta es una falta de ortografía como cualquier otra, y cambia la palabra: <em>averiguo<\/em> y <em>averigüe<\/em> no suenan igual.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "hueco", "titulo": "Pon la diéresis donde haga falta", "dossier": {"cuaderno": "2", "ejercicio": 6}, "ayuda": "Escribe cada palabra con la diéresis si la lleva. Cuatro de las doce no la llevan.", "estricto": true, "items": [{"enun": "<i>piraguismo<\/i>", "sol": "piragüismo", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>guerra<\/i>", "sol": "guerra", "porque": "sin diéresis: la u no suena"}, {"enun": "<i>verguenza<\/i>", "sol": "vergüenza", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>ambiguedad<\/i>", "sol": "ambigüedad", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>desague<\/i>", "sol": "desagüe", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>guiso<\/i>", "sol": "guiso", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>unguento<\/i>", "sol": "ungüento", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>cigueña<\/i>", "sol": "cigüeña", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>bilingue<\/i>", "sol": "bilingüe", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>seguidor<\/i>", "sol": "seguidor", "porque": "sin diéresis: la <i>u<\/i> no suena"}, {"enun": "<i>paraguero<\/i>", "sol": "paragüero", "porque": "la <i>u<\/i> suena: lleva diéresis"}, {"enun": "<i>distinguir<\/i>", "sol": "distinguir", "porque": "sin diéresis: verbo en -guir"}], "apoyo": ["3 · La diéresis"], "dossier_txt": "Del dossier: nudo 2, ejercicio 6"}, {"tipo": "hueco", "titulo": "Los verbos en -guar", "dossier": {"cuaderno": "2", "ejercicio": 7}, "ayuda": "Completa con la forma del verbo que va entre paréntesis.", "estricto": true, "items": [{"enun": "Ayer ______ (<i>averiguar<\/i>, yo) quién había llamado.", "sol": "averigüé"}, {"enun": "Espero que ______ (<i>apaciguar<\/i>, nosotros) los ánimos en la reunión.", "sol": "apacigüemos"}, {"enun": "Quiero que ______ (<i>amortiguar<\/i>, tú) el ruido con una alfombra.", "sol": "amortigües"}, {"enun": "Ojalá ______ (<i>menguar<\/i>, ellos) las colas del ambulatorio.", "sol": "mengüen"}, {"enun": "Yo ______ (<i>seguir<\/i>) con mi turno hasta las diez.", "sol": "sigo", "porque": "la <i>u<\/i> desaparece; nunca lleva diéresis"}], "criterio": "En los verbos en <i>-guar<\/i> la <i>u<\/i> suena siempre: cuando detrás viene <i>e<\/i>, la diéresis lo marca, <i>averigüé<\/i>, <i>mengüen<\/i>. En <i>seguir<\/i> la <i>u<\/i> no suena nunca.", "apoyo": ["Los verbos en -guar, donde se falla"], "dossier_txt": "Del dossier: nudo 2, ejercicio 7"}, {"tipo": "hueco", "titulo": "La palabra derivada", "dossier": {"cuaderno": "2", "ejercicio": 8}, "ayuda": "Completa con la palabra derivada de la que va entre paréntesis.", "estricto": true, "items": [{"enun": "La ______ (<i>antiguo<\/i>) del edificio se nota en la fachada.", "sol": "antigüedad"}, {"enun": "La ______ (<i>ambiguo<\/i>) del contrato nos costó una reclamación.", "sol": "ambigüedad"}, {"enun": "Se me ha roto la ______ (<i>lengua<\/i>) del zapato.", "sol": "lengüeta"}, {"enun": "El ______ (<i>paraguas<\/i>) de la esquina cierra en agosto.", "sol": "paragüero"}, {"enun": "Mi vecina es ______ (<i>Nicaragua<\/i>).", "sol": "nicaragüense"}], "criterio": "Al derivar, la <i>u<\/i> que sonaba delante de <i>a<\/i> o de <i>o<\/i> sigue sonando delante de <i>e<\/i> o de <i>i<\/i>, y la diéresis lo marca: <i>antiguo<\/i> → <i>antigüedad<\/i>.", "apoyo": ["Y en las palabras derivadas"], "dossier_txt": "Del dossier: nudo 2, ejercicio 8"}, {"tipo": "justificar", "titulo": "¿Por qué no llevan diéresis?", "dossier": {"cuaderno": "2", "ejercicio": 9}, "ayuda": "Explica por qué estas cuatro palabras no llevan diéresis.", "items": [{"palabra": "<i>guerra<\/i>", "requiere": [["no suena", "no se pronuncia", "muda"]], "modelo": "la <i>u<\/i> no se pronuncia: solo está para que la <i>g<\/i> tenga el sonido de <i>gato<\/i>."}, {"palabra": "<i>máquina<\/i>", "requiere": [["q"]], "modelo": "detrás de <i>q<\/i> la <i>u<\/i> nunca suena y no existe la <i>ü<\/i>."}, {"palabra": "<i>agua<\/i>", "requiere": [["gua", "a"]], "modelo": "el grupo es <i>gua<\/i>, no <i>gue<\/i> ni <i>gui<\/i>; la <i>u<\/i> ya suena sin ayuda."}, {"palabra": "<i>distingue<\/i>", "requiere": [["guir", "no suena", "no se pronuncia"]], "modelo": "es un verbo en <i>-guir<\/i>, donde la <i>u<\/i> nunca ha sonado."}], "pide": "no lleva diéresis porque…", "apoyo": ["3 · La diéresis"], "dossier_txt": "Del dossier: nudo 2, ejercicio 9"}, {"tipo": "opcion", "titulo": "¿Suena la u?", "ayuda": "Antes de escribir nada, el oído. Di la palabra en voz baja y decide.", "ops": ["suena", "no suena"], "items": [{"enun": "<i>agua<\/i>", "sol": "suena", "porque": "grupo <i>gua<\/i>: ahí siempre suena, y por eso nunca lleva diéresis"}, {"enun": "<i>pingüino<\/i>", "sol": "suena", "porque": "grupo <i>güi<\/i>: los dos puntos están para eso"}, {"enun": "<i>guiso<\/i>", "sol": "no suena"}, {"enun": "<i>máquina<\/i>", "sol": "no suena", "porque": "detrás de <i>q<\/i> la u no suena nunca"}, {"enun": "<i>bilingüe<\/i>", "sol": "suena"}, {"enun": "<i>guerra<\/i>", "sol": "no suena", "porque": "grupo <i>gue<\/i> sin dos puntos: la u está muda"}], "criterio": "La <i>u<\/i> solo se calla en dos sitios: en <b>gue<\/b> y <b>gui<\/b> sin marcar, y detrás de <b>q<\/b>. En <i>gua<\/i> y <i>guo<\/i> suena siempre, así que ahí no hay nada que aclarar. Por eso la diéresis solo aparece en <i>güe<\/i> y <i>güi<\/i>.", "apoyo": ["Qué hace", "Dónde no se pone nunca"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las diéresis que faltan", "ayuda": "Seis palabras de este párrafo han perdido la diéresis. <b>Pincha en las que estén mal.<\/b> Si te pasas, también cuenta.", "items": [{"texto": "En el zoo antiguo hay un cartel bilingue que nadie ha cambiado desde hace años. Habla del pinguino y de la cigueña, y da una explicación tan ambigua que da verguenza leerla. Con la antiguedad del recinto pasa igual: el desague se atasca cada invierno y nadie lo arregla.", "faltas": {"bilingue": "bilingüe", "pinguino": "pingüino", "cigueña": "cigüeña", "verguenza": "vergüenza", "antiguedad": "antigüedad", "desague": "desagüe"}}], "criterio": "Las dos que están bien son <i>antiguo<\/i> y <i>ambigua<\/i>: son <i>guo<\/i> y <i>gua<\/i>, y ahí la <i>u<\/i> suena sola. Ponerles los dos puntos sería falta.<br><br>Compara el par <i>antiguo<\/i> / <i>antigüedad<\/i>: la misma palabra, y una lleva diéresis y la otra no, porque al derivar la <i>o<\/i> se vuelve <i>e<\/i>.<br><br>De las seis, solo <i>vergüenza<\/i> ha aparecido en un examen: está en el texto de 2024.", "apoyo": ["Qué hace", "Dónde no se pone nunca"], "solo_web": true}], "cuaderno_txt": "Nudo 2 · Vocales en contacto y la diéresis — apartado 3: La diéresis (p. 16) · ejercicios 6, 7, 8 y 9", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El primer texto", "meta": "25 minutos · hoy se escribe, cronometrado y con el texto delante", "cuaderno": [{"nudo": 18, "apartados": [1]}, {"nudo": "A1", "apartados": ["la hoja de revisión de la redacción"]}], "lectura": {"titulo": "La clase de las nueve de la noche", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["A las nueve menos cinco de la noche, Rosa Company aparca la furgoneta", "delante del centro y entra con el bocadillo en la mano. Tiene cuarenta", "y siete años, reparte material de oficina desde las siete de la mañana", "y está sacándose el acceso a grado superior. Es su segundo intento. El", "primero lo dejó en enero, hace tres años, cuando le cambiaron el turno.", "", "En su clase son diecinueve y solo dos tienen menos de treinta años. Hay", "una cocinera, un vigilante de seguridad y dos que trabajan limpiando el", "metro de madrugada. Rosa dice que lo más difícil no son las clases sino", "la hora: llegar con el día encima y ponerse a leer un texto que exige", "atención.", "", "La profesora les repite que el examen no mide lo listos que son, sino", "lo entrenados que están. A Rosa esa frase le costó aceptarla. Había", "salido del colegio a los quince convencida de que no servía para", "estudiar, y tardó treinta años en volver a intentarlo.", "", "Lo que dice ahora es más concreto. Que ha aprendido a leer un contrato", "entero antes de firmarlo. Que entiende los informes médicos de su", "madre. Y que la semana pasada discutió una factura y ganó, porque supo", "dónde mirar.", "", "Puede que no apruebe en junio; ella misma lo dice sin dramatismo. Pero", "ya no cree lo que creía a los quince, y eso no se lo quita el tribunal."], "pie": "Texto inventado. Ni Rosa Company ni las cifras que da son reales."}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> el bloque 3, <strong>3 puntos<\/strong>, unas cien palabras eligiendo entre dos temas. La <strong>opción A ha sido siempre argumentativa<\/strong>; la <strong>B, narrativa<\/strong>, salvo en 2017, que fue expositiva: manda el enunciado, y hay que leerlo. Y siempre <strong>anclada al texto de partida<\/strong> que acabas de leer.<\/div>\n<blockquote>\n<p>La hoja con la que se puntúa todo esto es el <strong>anexo A-1<\/strong>. Tenla delante desde el primer texto.<\/p>\n<\/blockquote>\n<h3>Nudo 18 · 1 · Cómo se corrige la redacción<\/h3>\n<p>Un texto argumentativo se evalúa por <strong>seis apartados<\/strong>. Los nombres proceden de la hoja de quien corrige, pero <strong>el reparto de puntos no viene impreso en el examen<\/strong>, y sin ese reparto no se puede decidir dónde emplear el tiempo. Lo que sigue explica qué mira cada apartado, en qué se nota y cuánto vale.<\/p>\n<p><strong>Los puntos, uno a uno<\/strong>, de mayor a menor peso y no en el orden en que la hoja los enumera:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">vale<\/th>\n<th>qué mira<\/th>\n<th>en qué se nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>c) Corrección<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>1,00<\/strong><\/td>\n<td>las palabras<\/td>\n<td>ortografía, formas verbales, preposiciones, y que cada palabra signifique lo que quieres decir. Un tercio de la nota de la redacción<\/td>\n<\/tr>\n<tr>\n<td><strong>b) Cohesión<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>0,75<\/strong><\/td>\n<td>las oraciones<\/td>\n<td>dónde termina cada una, si el verbo concuerda con el sujeto, si se entiende quién hace qué<\/td>\n<\/tr>\n<tr>\n<td><strong>a) Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>0,50<\/strong><\/td>\n<td>las ideas<\/td>\n<td>que estén seleccionadas y en orden, y que el cierre no abra un tema nuevo<\/td>\n<\/tr>\n<tr>\n<td>d) Variación<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el vocabulario y la sintaxis<\/td>\n<td>recursos sintácticos variados, léxico preciso y sin repeticiones; la medida de clase: la misma palabra cuatro veces en cien palabras ya cuenta como repetición<\/td>\n<\/tr>\n<tr>\n<td>e) Registro<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el tono<\/td>\n<td>que se note que es un escrito y no una conversación: formalidad y canal adecuados<\/td>\n<\/tr>\n<tr>\n<td>f) Disposición<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el folio<\/td>\n<td>márgenes, renglones, letra que se lea<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td style=\"text-align: right;\"><strong>3,00<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las dos bandas que se cuentan por errores tienen los tramos de los criterios oficiales de 2026; con esta tabla se puntúan los nueve modelos del apartado 5 y los textos propios con la hoja A-1:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th>errores<\/th>\n<th style=\"text-align: right;\">puntos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>b) Cohesión<\/strong><\/td>\n<td>de 0 a 2<\/td>\n<td style=\"text-align: right;\">0,75<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3 o 4<\/td>\n<td style=\"text-align: right;\">0,5<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>5 o 6<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>más de 6<\/td>\n<td style=\"text-align: right;\">0<\/td>\n<\/tr>\n<tr>\n<td><strong>c) Corrección<\/strong><\/td>\n<td>de 0 a 3<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>4 o 5<\/td>\n<td style=\"text-align: right;\">0,8<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>6 o 7<\/td>\n<td style=\"text-align: right;\">0,6<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>8 o 9<\/td>\n<td style=\"text-align: right;\">0,4<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>10 u 11<\/td>\n<td style=\"text-align: right;\">0,2<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>más de 11<\/td>\n<td style=\"text-align: right;\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los dos primeros errores de cohesión y los tres primeros de corrección no bajan la banda; a partir de ahí, cada dos errores bajan un tramo.<\/p>\n<p><strong>Y los tres ceros<\/strong>, que van antes que la suma:<\/p>\n<ul>\n<li><strong>no se adapta al enunciado → 0<\/strong>;<\/li>\n<li><strong>menos de cincuenta palabras → 0<\/strong>;<\/li>\n<li>si es muy breve, <strong>cada apartado se prorratea<\/strong> por la extensión.<\/li>\n<\/ul>\n<p><strong>Antes de mirar cómo está escrito un texto, el corrector mira si es el texto que se pedía.<\/strong> Tres criterios lo deciden, y los tres se comprueban con el enunciado delante:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>cuándo falla<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tipo<\/strong><\/td>\n<td>te piden defender una opinión y cuentas una historia, o al revés<\/td>\n<\/tr>\n<tr>\n<td><strong>tema<\/strong><\/td>\n<td>escribes sobre otro tema, o sobre uno parecido pero no el que pedía el enunciado<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>te quedas muy por debajo de lo que se pide<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un texto que falla en una de las tres <strong>no responde al encargo<\/strong>, y entonces no hay nada que valorar en él: por bien escrito que esté, contesta a otra pregunta. El enunciado pide <strong>unas cien palabras<\/strong>, y los criterios oficiales prorratean el texto «muy breve» sin fijar una cifra. En clase la cifra es ochenta: por debajo, un argumentativo no tiene sitio para una tesis, dos razones desarrolladas y un cierre. Por debajo de cincuenta, cero.<\/p>\n<p><strong>El tema lo fija el enunciado a partir del texto de partida.<\/strong> Para cumplir el criterio de tema basta con escribir sobre ese tema: la redacción no tiene que citar el texto ni resumirlo.<\/p>\n<p><strong>Dos consecuencias de esa tabla:<\/strong><\/p>\n<ol>\n<li><strong>Corrección y cohesión suman 1,75 de 3.<\/strong> Casi el 60 % de la redacción depende de la ortografía, la puntuación y la concordancia: exactamente lo que entrenan los nudos 1-4 y el videojuego de acentuación. Con más de once faltas, la banda de corrección vale 0: un texto bien pensado, con doce faltas de ortografía, pierde por las palabras lo que había ganado con las ideas.<\/li>\n<li><strong>Los tres cuartos de punto de abajo —variación, registro, disposición— exigen menos tiempo que las otras tres bandas.<\/strong> No piden saber más gramática: piden releer, no repetir la misma palabra cuatro veces y escribir con márgenes y con letra que se lea.<\/li>\n<\/ol>\n<h3>Anexo A-1 · Hoja de revisión de la redacción<\/h3>\n<blockquote>\n<p>Esta hoja se rellena <strong>por detrás de cada texto que escribas<\/strong>, antes de entregarlo. Sirve para encontrar lo que todavía se puede arreglar y, con la tabla de tramos del nudo 18, apartado 1, para ponerse nota.<\/p>\n<\/blockquote>\n<hr />\n<h4>HOJA DE REVISIÓN — EXPRESIÓN ESCRITA<\/h4>\n<p>Nombre: ………………………………  Fecha: …………  Texto n.º: ……<\/p>\n<hr />\n<h5>PASO 0 · Los tres ceros. Esto va antes que nada.<\/h5>\n<p>Si fallas una, <strong>la nota es 0 aunque el resto esté perfecto<\/strong>. No sigas rellenando la hoja.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>pregunta<\/th>\n<th style=\"text-align: center;\">sí<\/th>\n<th style=\"text-align: center;\">no<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tipo<\/strong><\/td>\n<td>¿He escrito <strong>el tipo de texto<\/strong> que pedía la opción elegida? (la A ha sido siempre argumentativa: doy mi opinión y la defiendo · la B, narrativa salvo en 2017: cuento algo que pasa; manda el enunciado)<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>tema<\/strong><\/td>\n<td>¿He escrito sobre <strong>el tema exacto<\/strong> del enunciado, y no sobre uno parecido?<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>¿Tengo <strong>50 palabras o más<\/strong>? → cuéntalas ahora: ……… palabras<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Si tengo menos de 50, es cero. Si el texto es muy breve para las cien que pide el enunciado —en clase, por debajo de 80—, <strong>cada apartado se me reduce en proporción<\/strong>. El objetivo son <strong>unas 100<\/strong>.<\/p>\n<\/blockquote>\n<hr />\n<h5>PASO 1 · Las dos cuentas<\/h5>\n<p>Repasa el texto dos veces, una por cuenta, y marca cada error en el margen con su letra. Son dos pasadas distintas porque buscan errores distintos: la cuenta C revisa las palabras y la cuenta B revisa dónde termina cada oración.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué cuento<\/th>\n<th style=\"text-align: center;\">señal en el margen<\/th>\n<th style=\"text-align: center;\"><strong>total<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cuenta B<\/strong><\/td>\n<td><strong>puntuación<\/strong> (comas, puntos que faltan o sobran) · <strong>concordancia<\/strong> (el verbo no va con el sujeto, el adjetivo no va con el nombre) · <strong>oraciones mal construidas<\/strong> (les falta el verbo, se quedan sin terminar, no se entiende dónde acaban)<\/td>\n<td style=\"text-align: center;\">B<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<tr>\n<td><strong>Cuenta C<\/strong><\/td>\n<td><strong>ortografía<\/strong> (letras, tildes, mayúsculas) · <strong>morfosintaxis<\/strong> (formas verbales mal hechas, preposición equivocada) · <strong>léxico<\/strong> (palabra que no significa lo que quiero decir)<\/td>\n<td style=\"text-align: center;\">C<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>PASO 2 · Qué hacer con las dos cuentas<\/h5>\n<p>Cada cuenta cae en un tramo, y los tramos son los oficiales: en <strong>cohesión<\/strong>, de 0 a 2 errores es la banda entera y cada dos errores más baja un escalón; en <strong>corrección<\/strong>, de 0 a 3 errores es la banda entera, y a partir de ahí baja cada dos. La tabla de tramos está en el nudo 18, apartado 1.<\/p>\n<p>Aquí no se apunta ninguna nota. La cuenta sirve para saber <strong>cuántos errores hay que quitar para cambiar de tramo<\/strong>: casi siempre dos.<\/p>\n<hr />\n<h5>PASO 3 · Las tres preguntas que suben la nota antes de entregar<\/h5>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>¿Qué palabra he repetido más? Cuéntala. Si aparece <strong>cuatro veces o más<\/strong>, cambia dos por otra. <em>(Vale 0,25)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Busca dónde termina cada oración: donde acaba una idea completa con su verbo, va un punto. La coma no separa el sujeto del verbo, y entre dos oraciones con verbo propio va punto, salvo que las una <em>y<\/em>, <em>pero<\/em> u <em>o<\/em>. <em>(Vale hasta 0,75)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>¿Hay alguna palabra de la que dudo cómo se escribe? Antes de cambiarla, mira si hay una regla que la resuelva (<em>-aba<\/em>, <em>-aje<\/em>, m antes de b). Si no la hay, busca otra manera de decir lo mismo <strong>sin perder precisión<\/strong>: cambiar una palabra exacta por una vaga descuenta en variación. <em>(Vale hasta 1)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>Lo que hay que recordar de esta hoja<\/h5>\n<ul>\n<li><strong>Corrección + cohesión = 1,75 de 3.<\/strong> Casi el 60 % depende de la ortografía, la puntuación y la concordancia.<\/li>\n<li><strong>Variación + registro + disposición = 0,75<\/strong>, y los tres se arreglan releyendo: una palabra repetida, el tono, los márgenes.<\/li>\n<li><strong>Las faltas de ortografía de la redacción cuentan en la banda de corrección<\/strong> y no descuentan además el 0,10 por falta de los bloques 1 y 2: ese descuento, hasta 2 puntos, corre solo allí.<\/li>\n<li><strong>En corrección, a partir de la cuarta falta, cada dos faltas menos son 0,2 puntos más.<\/strong><\/li>\n<li><strong>Versión 2.<\/strong> Con las marcas B y C delante, se reescribe el texto entero: contar los errores sin volver a escribir deja el texto como estaba.<\/li>\n<\/ul>\n<hr />\n<p><em>Bandas, puntos y tramos de las dos cuentas: criterios oficiales de corrección, Prova d'accés a CFGS, convocatòria 2026 (documento público). Redacción de la hoja y los tres ceros: material propio.<\/em><\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Antes de escribir: ¿en qué línea está?", "ayuda": "Tres minutos localizando en el texto lo que te puede servir. Escribe el número de la línea donde empieza.", "items": [{"enun": "¿Qué le resulta más difícil a Rosa?", "sol": "8|9"}, {"enun": "¿Qué frase de la profesora le costó aceptar?", "sol": "11|12"}, {"enun": "¿Con qué tres ejemplos concretos explica lo que ha ganado?", "sol": "15|16"}, {"enun": "¿En qué línea empieza el cierre con la idea general?", "sol": "19|20"}], "criterio": "Para la redacción de hoy, la columna aporta sobre todo <b>tres ejemplos concretos<\/b> —un contrato, un informe médico, una factura— en lugar de «la educación es importante». Una redacción que baje a ese nivel de detalle ya se distingue de la mitad de las que se entregan.", "apoyo": ["Nudo 18 · 1 · Cómo se corrige la redacción", "Anexo A-1 · Hoja de revisión de la redacción"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Responde al encargo?", "ayuda": "El encargo era: <i>«Redacte un texto argumentativo de unas cien palabras en el que exponga su opinión sobre si estudiar de adulto merece la pena.»<\/i> Seis textos. Señala cuáles responden a ese encargo.", "ops": ["responde", "no responde"], "items": [{"enun": "Cien palabras muy bien escritas contando lo que le pasó a un compañero de clase que volvió a estudiar a los cuarenta.", "sol": "no responde", "porque": "cuenta algo que ocurrió. El encargo pedía defender una opinión, y una historia bien contada sigue sin ser una opinión defendida"}, {"enun": "Ciento veinte palabras impecables sobre la inteligencia artificial en las aulas.", "sol": "no responde", "porque": "el tema es otro. No hay manera de arreglarlo escribiendo mejor"}, {"enun": "Ciento cinco palabras defendiendo que estudiar de adulto no siempre compensa, con doce faltas de ortografía.", "sol": "responde", "porque": "defiende una opinión sobre lo que se pedía, y la defiende del lado contrario al esperado, que también vale. Las faltas son otro asunto"}, {"enun": "Ciento diez palabras defendiendo que estudiar de adulto cambia la vida, con seis faltas de ortografía.", "sol": "responde", "porque": "tipo, tema y extensión están donde tenían que estar"}, {"enun": "Cuarenta y seis palabras con tesis clara, dos argumentos y cierre.", "sol": "no responde", "porque": "menos de la mitad de lo pedido. Con cuarenta y seis palabras no hay sitio para desarrollar ningún argumento, por bien ordenados que estén"}, {"enun": "Noventa palabras argumentando sobre si estudiar de adulto merece la pena, con la letra muy pequeña y sin márgenes.", "sol": "responde", "porque": "la letra y los márgenes se corrigen aparte; el encargo está cumplido"}], "criterio": "Tres de los seis no responden, y ninguno por estar mal escrito. Uno cuenta algo en lugar de defender una idea, otro trata un tema distinto y otro se queda en menos de la mitad de la extensión.<br><br>Las tres preguntas que evitan los tres —<b>qué tipo de texto, qué tema, cuánto<\/b>— se hacen antes de escribir la primera frase, con el enunciado delante. Después ya no hay arreglo: un texto que no responde al encargo se queda sin nada que valorar, por bien escrito que esté.", "apoyo": ["HOJA DE REVISIÓN — EXPRESIÓN ESCRITA"], "solo_web": true}, {"tipo": "abierta", "titulo": "Cien palabras · 20 minutos", "ayuda": "El texto de hoy. Se escribe en clase; este espacio sirve para guardarlo y compararlo con la devolución del 27 de octubre.", "items": [{"enun": "<i>Redacte un texto argumentativo en el que exponga su opinión sobre la educación para poder mejorar la vida de las personas.<\/i> (2021, opción A)", "modelo": "Tres modelos abajo, de tres niveles, con lo que le da y lo que le quita a cada uno."}], "modelos": ["<b>3 sobre 3 · 106 palabras.<\/b> «Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.»<br><br><b>Por qué puntúa alto:<\/b> coherencia 0,5 · cohesión 0,75 · corrección 1 · variación 0,25 · registro 0,25 · disposición 0,25. Tesis discutible en la primera frase; dos argumentos con conector; una concesión; cierre con una consecuencia; ni una falta ni una coma que sobre. Y se apoya en el texto de arriba sin citarlo.", "<b>2,25 · 98 palabras.<\/b> «Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.»<br><br><b>Qué le falta:<\/b> sin faltas y con los puntos donde van, corrección (1) y cohesión (0,75) quedan enteras; pierde en las otras bandas: la tesis no es discutible y el cierre repite la primera frase (coherencia, 0,25); <i>ayudar<\/i> aparece cuatro veces y <i>yo pienso que<\/i>, dos (variación, 0); el <i>tú<\/i> de conversación —<i>te ayuda<\/i>, <i>si tú sabes<\/i>— deja el registro en 0.", "<b>≈0,85 · 63 palabras.<\/b> «La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.»<br><br><b>Qué falla:<\/b> siete faltas en 63 palabras (corrección, 0,6); tres comas donde iba punto, tras <i>nada<\/i>, tras <i>igual<\/i> y tras <i>y punto<\/i> (cohesión, 0,5); sin tesis discutible y con un final que se desdice (coherencia, 0); <i>o sea<\/i> y <i>y punto<\/i> son marcas de oralidad (registro, 0). Suma 1,35, y con 63 palabras es un texto muy breve: cada banda se prorratea por la extensión, 63 de las 100 pedidas."], "criterio": "Tres datos de la tabla de bandas. <b>Uno:<\/b> corrección y cohesión pesan más que las otras cuatro bandas juntas, y el carril A entrena esas dos. <b>Dos:<\/b> esas dos bandas se cuentan error por error, no se aprecian, así que puedes contarlas tú antes de entregar. <b>Tres:<\/b> no repetir, no cambiar de tono y escribir legible no piden saber más gramática; piden releer.", "remate": "En corrección se pasa de 1 punto a 0,8 al cometer el <b>cuarto<\/b> error, y de 0,8 a 0,6 al sexto. A partir de doce, cero. A partir de la cuarta falta, cada dos faltas menos son 0,2 puntos más.", "palabras": {"objetivo": 100}, "apoyo": ["Nudo 18 · 1 · Cómo se corrige la redacción", "Anexo A-1 · Hoja de revisión de la redacción"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 1: Cómo se corrige la redacción (p. 62) · Anexo A-1 · Hoja de revisión de la redacción — el cuaderno: la hoja de revisión de la redacción", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El adjetivo: género, número y grados", "meta": "30 minutos · y de aquí sale el «más» que el martes hace falta", "cuaderno": {"nudo": 8, "apartados": [4], "ejercicios": [14, 15, 16, 17]}, "teoria": "<h3>4 · El adjetivo: género, número y grados<\/h3>\n<p>Este apartado explica cómo cambia el adjetivo de género y de número, con qué concuerda y los <strong>grados<\/strong>, donde aparece el <em>más<\/em> de la tilde diacrítica del nudo 3.<\/p>\n<h4>Género: dos familias<\/h4>\n<p>El género del adjetivo se marca con un <strong>morfema flexivo<\/strong>: la terminación que cambia (<em>-o / -a<\/em>) sin que cambie la palabra. Según tengan ese morfema o no, hay dos familias:<\/p>\n<p><strong>De dos terminaciones.<\/strong> Cambian: <em>rojo / roja<\/em>, <em>saltarín / saltarina<\/em>, <em>majete / majeta<\/em>, <em>catalán / catalana<\/em>. Y un detalle: los gentilicios acabados en consonante forman el femenino con <em>-a<\/em> y <strong>pierden la tilde<\/strong>: <em>francés → francesa<\/em>, <em>alemán → alemana<\/em>.<\/p>\n<p><strong>De una terminación.<\/strong> Valen para los dos géneros, sin cambiar nada: <em>feliz<\/em>, <em>veloz<\/em>, <em>inteligente<\/em>, <em>agrícola<\/em>, <em>belga<\/em>. <em>Un chico feliz<\/em>, <em>una chica feliz<\/em>.<\/p>\n<h4>Número<\/h4>\n<p>Igual que el sustantivo: <strong>+s<\/strong> tras vocal átona (<em>pobre → pobres<\/em>), <strong>+es<\/strong> tras consonante (<em>dócil → dóciles<\/em>), y <strong>-z → -ces<\/strong> (<em>audaz → audaces<\/em>).<\/p>\n<h4>Concordancia: la regla que se falla en la redacción<\/h4>\n<blockquote>\n<p>Un adjetivo <strong>detrás<\/strong> de varios sustantivos va en <strong>plural<\/strong>; si son de distinto género, en <strong>masculino plural<\/strong>: <em>un texto y una imagen bien<\/em> <strong>elegidos<\/strong>, <em>el cuaderno y la libreta<\/em> <strong>nuevos<\/strong>.<\/p>\n<p>Un adjetivo <strong>delante<\/strong> de varios sustantivos concuerda solo con <strong>el primero<\/strong>: <em>la <\/em><em>primera<\/em><em> pregunta y el ejercicio<\/em>.<\/p>\n<\/blockquote>\n<p>La concordancia se cuenta error por error al corregir un texto, igual que la ortografía.<\/p>\n<h4>Los grados<\/h4>\n<table>\n<thead>\n<tr>\n<th>grado<\/th>\n<th>cómo se forma<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>positivo<\/strong><\/td>\n<td>el adjetivo solo<\/td>\n<td>«la madera <strong>inocente<\/strong>» (2012)<\/td>\n<\/tr>\n<tr>\n<td>comparativo de <strong>igualdad<\/strong><\/td>\n<td><em>tan… como<\/em>, <em>igual… que<\/em><\/td>\n<td><em>tan deliciosas como nutritivas<\/em><\/td>\n<\/tr>\n<tr>\n<td>comparativo de <strong>inferioridad<\/strong><\/td>\n<td><em>menos… que<\/em><\/td>\n<td>«la lectura digital es <strong>menos<\/strong> eficiente para aprender y memorizar <strong>que<\/strong> la lectura sobre papel» (2013)<\/td>\n<\/tr>\n<tr>\n<td>comparativo de <strong>superioridad<\/strong><\/td>\n<td><strong><em>más<\/em>… que<\/strong><\/td>\n<td>«sigue siendo <strong>más<\/strong> lenta <strong>que<\/strong> la que hemos hecho toda la vida» (2013)<\/td>\n<\/tr>\n<tr>\n<td><strong>superlativo absoluto<\/strong><\/td>\n<td><em>-ísimo<\/em> / <em>muy<\/em><\/td>\n<td>«una tienda <strong>pequeñísima<\/strong> y coqueta» (2024) · <em>muy delicado<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>superlativo relativo<\/strong><\/td>\n<td><em>el más… de<\/em>, <em>lo más… que<\/em><\/td>\n<td>«era <strong>lo más<\/strong> atroz <strong>que<\/strong> podía depararme el destino» (2012)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Los irregulares, que ya son comparativos<\/h4>\n<p><em>bueno<\/em> → <strong>mejor<\/strong> · <em>malo<\/em> → <strong>peor<\/strong> · <em>grande<\/em> → <strong>mayor<\/strong> · <em>pequeño<\/em> → <strong>menor<\/strong> · <em>alto<\/em> → <strong>superior<\/strong> · <em>bajo<\/em> → <strong>inferior<\/strong><\/p>\n<p>Estas seis <strong>ya llevan el comparativo dentro<\/strong>. Por eso <em>más mejor<\/em> y <em>más peor<\/em> son falta de gramática: equivalen a «más más bueno». <em>Mayor<\/em> es el caso aparte: <em>más mayor<\/em> vale solo con el sentido de «de edad» y en registro coloquial (<em>cuando seas más mayor<\/em>); en una comparación —<em>el más mayor de sus hijos<\/em>— es falta, y se escribe <em>el mayor<\/em>.<\/p>\n<h4>Y los superlativos cultos<\/h4>\n<p><em>bueno<\/em> → <strong>óptimo<\/strong> · <em>malo<\/em> → <strong>pésimo<\/strong> · <em>grande<\/em> → <strong>máximo<\/strong> · <em>pequeño<\/em> → <strong>mínimo<\/strong> · <em>alto<\/em> → <strong>supremo<\/strong> · <em>bajo<\/em> → <strong>ínfimo<\/strong><\/p>\n<p>Mismo aviso: ya son superlativos. <em>Más máxima<\/em> es falta por la misma razón que <em>más mejor<\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "El femenino singular", "dossier": {"cuaderno": "8", "ejercicio": 14}, "ayuda": "Escribe el femenino singular de cada adjetivo. Los de una sola terminación se quedan como están.", "estricto": true, "items": [{"enun": "<i>andaluz<\/i>", "sol": "andaluza"}, {"enun": "<i>saltarín<\/i>", "sol": "saltarina", "porque": "pierde la tilde"}, {"enun": "<i>majete<\/i>", "sol": "majeta"}, {"enun": "<i>feliz<\/i>", "sol": "feliz", "porque": "una sola terminación"}, {"enun": "<i>trabajador<\/i>", "sol": "trabajadora"}, {"enun": "<i>belga<\/i>", "sol": "belga", "porque": "una sola terminación"}, {"enun": "<i>inglés<\/i>", "sol": "inglesa", "porque": "pierde la tilde"}, {"enun": "<i>holgazán<\/i>", "sol": "holgazana", "porque": "pierde la tilde"}, {"enun": "<i>cortés<\/i>", "sol": "cortés", "porque": "una sola terminación"}, {"enun": "<i>hipócrita<\/i>", "sol": "hipócrita", "porque": "una sola terminación"}, {"enun": "<i>español<\/i>", "sol": "española"}, {"enun": "<i>audaz<\/i>", "sol": "audaz", "porque": "una sola terminación"}, {"enun": "<i>alegre<\/i>", "sol": "alegre", "porque": "una sola terminación"}, {"enun": "<i>chiquitín<\/i>", "sol": "chiquitina", "porque": "pierde la tilde"}], "criterio": "Los acabados en consonante que eran agudos con tilde la pierden en femenino, porque ganan una sílaba y pasan a llanos acabados en vocal: <i>saltarín<\/i> → <i>saltarina<\/i>, <i>inglés<\/i> → <i>inglesa<\/i>.", "apoyo": ["4 · El adjetivo: género, número y grados"], "dossier_txt": "Del dossier: nudo 8, ejercicio 14"}, {"tipo": "hueco", "titulo": "Concordancia", "estricto": true, "ayuda": "Completa con el adjetivo que va entre paréntesis. Las del dossier van con <i>nuevo<\/i>; la de <i>elegido<\/i> se añade para comprobar la misma regla.", "items": [{"enun": "una pantalla y un teclado ______ <i>(nuevo)<\/i>", "sol": "nuevos", "porque": "detrás y de distinto género: masculino plural"}, {"enun": "unas tabletas y unos lectores ______ <i>(nuevo)<\/i>", "sol": "nuevos"}, {"enun": "______ pantalla y teclado <i>(nuevo)<\/i>", "sol": "nueva", "porque": "delante: concuerda solo con el primero"}, {"enun": "un texto y una imagen bien ______ <i>(elegido)<\/i>", "sol": "elegidos"}], "criterio": "La de <i>nueva pantalla y teclado<\/i> se falla más que las otras tres porque el adjetivo va <b>delante<\/b> y concuerda solo con el primer sustantivo. Las otras tres van detrás, y detrás manda el plural.", "apoyo": ["Concordancia: la regla que se falla en la redacción"], "dossier": {"cuaderno": "8", "ejercicio": 15}, "dossier_txt": "Del dossier: nudo 8, ejercicio 15"}, {"tipo": "hueco", "titulo": "Corrige el comparativo", "dossier": {"cuaderno": "8", "ejercicio": 16}, "ayuda": "Escribe solo la parte en negrita, corregida. Dos están bien: escríbelas igual.", "estricto": true, "items": [{"enun": "Este pistacho es <b>más mejor<\/b> que aquel.", "sol": "mejor", "porque": "los irregulares ya son comparativos: no se les añade <i>más<\/i>", "corto": false}, {"enun": "La cosecha fue <b>más peor<\/b> que la del año pasado.", "sol": "peor", "corto": false}, {"enun": "Es <b>el más mayor<\/b> de sus hijos.", "sol": "el mayor", "corto": false}, {"enun": "Este ejercicio es <b>más fácil<\/b> que el anterior.", "sol": "más fácil", "porque": "está bien: <i>fácil<\/i> no tiene comparativo irregular, así que el comparativo se hace con <i>más… que<\/i>", "corto": false}, {"enun": "Su sueldo es <b>más superior que el mío<\/b>.", "sol": "superior al mío", "porque": "<i>superior<\/i> ya es comparativo, no admite <i>más<\/i>, y su segundo término va con <i>a<\/i>, no con <i>que<\/i>", "corto": false}, {"enun": "El de la izquierda es <b>el más pequeño<\/b>.", "sol": "el más pequeño|el menor", "porque": "está bien: <i>el más pequeño<\/i> es un superlativo relativo correcto; también <i>el menor<\/i>", "corto": false}, {"enun": "Cada vez lo hace <b>más peor<\/b>.", "sol": "peor", "corto": false}], "criterio": "Los irregulares —<i>mejor<\/i>, <i>peor<\/i>, <i>mayor<\/i>, <i>menor<\/i>, <i>superior<\/i>— ya son comparativos: no se les añade <i>más<\/i>.", "apoyo": ["Los grados", "Los irregulares, que ya son comparativos"], "dossier_txt": "Del dossier: nudo 8, ejercicio 16"}, {"tipo": "hueco", "titulo": "El superlativo culto", "ayuda": "Una sola palabra en cada hueco. Son los seis de la tabla.", "items": [{"enun": "muy bueno →", "sol": "óptimo", "corto": false}, {"enun": "muy malo →", "sol": "pésimo", "corto": false}, {"enun": "muy grande →", "sol": "máximo", "corto": false}, {"enun": "muy pequeño →", "sol": "mínimo", "corto": false}, {"enun": "muy alto →", "sol": "supremo", "corto": false}, {"enun": "muy bajo →", "sol": "ínfimo", "corto": false}], "criterio": "Cinco de los seis son esdrújulos, así que llevan tilde siempre. Y sirven al escribir: <i>pésimo<\/i> dice lo mismo que <i>muy malo<\/i> sin repetir <i>muy<\/i> por tercera vez.", "estricto": true, "apoyo": ["Y los superlativos cultos"], "dossier": {"cuaderno": "8", "ejercicio": 17}, "dossier_txt": "Del dossier: nudo 8, ejercicio 17"}, {"tipo": "opcion", "titulo": "¿De una terminación o de dos?", "ayuda": "Prueba a ponerlo en femenino. Si no cambia nada, es de una.", "ops": ["de dos", "de una"], "items": [{"enun": "<i>feliz<\/i>", "sol": "de una", "porque": "<i>un chico feliz<\/i>, <i>una chica feliz<\/i>"}, {"enun": "<i>belga<\/i>", "sol": "de una", "porque": "acabar en <i>-a<\/i> no lo hace femenino: <i>un jugador belga<\/i>"}, {"enun": "<i>saltarín<\/i>", "sol": "de dos", "porque": "<i>saltarina<\/i>, sin tilde"}, {"enun": "<i>rojo<\/i>", "sol": "de dos", "porque": "<i>roja<\/i>"}, {"enun": "<i>inteligente<\/i>", "sol": "de una"}, {"enun": "<i>catalán<\/i>", "sol": "de dos", "porque": "<i>catalana<\/i>, y de paso <b>pierde la tilde<\/b>"}], "criterio": "Los tres de dos terminaciones se fallan al escribir más que los de una, y siempre por el mismo motivo: el femenino pierde la tilde. <i>Catalán<\/i> la lleva por ser aguda acabada en -n; <i>catalana<\/i> es llana acabada en vocal y no la lleva.", "apoyo": ["Género: dos familias", "Número"], "solo_web": true}, {"tipo": "clasificar", "titulo": "El grado", "ayuda": "Ocho frases. Indica en qué grado está el adjetivo marcado.", "ops": ["positivo", "comparativo de inferioridad", "comparativo de superioridad", "comparativo irregular", "superlativo absoluto", "superlativo culto", "comparativo de igualdad"], "items": [{"enun": "«la <b>máxima<\/b> dosis de terror que mi espíritu podía soportar»", "conv": "2012", "sol": "superlativo culto", "porque": "el superlativo culto de <i>grande<\/i>"}, {"enun": "«la madera <b>inocente<\/b>»", "conv": "2012", "sol": "positivo", "porque": "el adjetivo solo, sin comparar con nada"}, {"enun": "«el sur, <b>más<\/b> contaminado, está <b>más<\/b> poblado»", "conv": "2021", "sol": "comparativo de superioridad", "porque": "con el segundo término sobrentendido: <i>más que el norte<\/i>"}, {"enun": "«unos plazos <b>tan<\/b> cortos <b>como<\/b> imposibles»", "sol": "comparativo de igualdad"}, {"enun": "«una tienda <b>pequeñísima<\/b> y coqueta»", "conv": "2024", "sol": "superlativo absoluto", "porque": "la marca es <i>-ísimo<\/i>"}, {"enun": "«esa calidad es <b>mayor<\/b> en el norte»", "conv": "2021", "sol": "comparativo irregular", "porque": "<i>mayor<\/i> es el comparativo de <i>grande<\/i>: ya lo lleva dentro"}, {"enun": "«un tratamiento clave y <b>delicadísimo<\/b>»", "conv": "2026", "sol": "superlativo absoluto"}, {"enun": "«es <b>menos<\/b> eficiente para aprender y memorizar <b>que<\/b> la lectura sobre papel»", "conv": "2013", "sol": "comparativo de inferioridad"}], "criterio": "En <i>la máxima dosis<\/i> no aparece <i>más<\/i>, porque los superlativos cultos ya lo llevan dentro; así que <i>más máxima<\/i> cuenta como falta, igual que <i>más mejor<\/i>.", "apoyo": ["Los grados", "Los irregulares, que ya son comparativos", "Y los superlativos cultos"], "solo_web": true}], "cuaderno_txt": "Nudo 8 · Las variables nominales: sustantivo, adjetivo, determinantes — apartado 4: El adjetivo: género, número y grados (p. 107) · ejercicios 14, 15, 16 y 17", "teoria_dossier": true}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras y frases marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-24"};</script>
