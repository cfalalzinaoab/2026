<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 17 · 24 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}
.teoria .hueco,.v-bloque .hueco{display:inline-block;border-bottom:1px solid var(--tinta3);height:.9em;
  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}
/* una palabra con guion, barra o raya no se parte de un renglón a otro:

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 17, "fecha": "2026-11-24", "tab": "Día 17 · 24 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 17", "h1": "Martes 24 de noviembre", "sub": "La concordancia · el tercer texto · las preposiciones", "carriles": [{"chapa": "Carril A", "titulo": "La concordancia", "meta": "30 minutos · la falta que no se localiza releyendo letras", "cuaderno": {"nudo": "4bis", "apartados": [4], "ejercicios": [9, 10]}, "teoria": "<h3>4 · La concordancia<\/h3>\n<p>La concordancia <strong>no se localiza releyendo letras<\/strong>. No va en la Cuenta C, la de ortografía, sino en la <strong>Cuenta B<\/strong>, la de cohesión: <strong>0,75<\/strong>. Y en los bloques 1 y 2 descuenta 0,1 igual que una falta de letras.<\/p>\n<p>Concordar es ponerse de acuerdo:<\/p>\n<ul>\n<li><strong>sujeto y verbo<\/strong>, en número y persona: <em>los cazadores <b>aseguran<\/b> amar a los animales<\/em>.<\/li>\n<li><strong>nombre, determinante y adjetivo<\/strong>, en género y número: <em>una larga, cruel <b>agonía<\/b><\/em>.<\/li>\n<\/ul>\n<p>Los cuatro sitios donde se rompe:<\/p>\n<p><strong>1. El sujeto largo.<\/strong> Si entre sujeto y verbo hay muchas palabras, el verbo se va con la última que has oído. Este de 2015:<\/p>\n<blockquote>\n<p>«<strong>El futuro<\/strong> de O Couto, un paraje de A Costa da Morte habitado por una población envejecida y menguante, <strong>está<\/strong> en manos de un grupo de investigadores […] <strong>especializado<\/strong> en resucitar aldeas.»<\/p>\n<\/blockquote>\n<p><em>Está<\/em>, no «están»: el sujeto es <em>el futuro<\/em>. Y <em>especializado<\/em>, no «especializados»: acompaña a <em>grupo<\/em>. Salta lo que va entre comas y el sujeto queda al lado del verbo.<\/p>\n<p><strong>2. Los colectivos van en singular… con una excepción.<\/strong> <em>La gente<\/em>, <em>todo el mundo<\/em>: <strong>piensa<\/strong>, no «piensan». Pero cuando el colectivo lleva detrás <em>de<\/em> + plural —<em>la mayoría <b>de los alumnos<\/b><\/em>, <em>un grupo <b>de vecinos<\/b><\/em>— <strong>las dos concordancias son correctas<\/strong>: <em>aprobó<\/em> y <em>aprobaron<\/em>. Ninguna de las dos es falta. Si dudas, elige el singular.<\/p>\n<p><strong>3. <em>Haber<\/em> impersonal no tiene plural.<\/strong> Cuando significa «existir»: <em>hay<\/em>, <em>había<\/em>, <em>hubo<\/em>. <strong>«Habían muchos cazadores» es falta<\/strong>: <em>había muchos cazadores<\/em>.<\/p>\n<p><strong>4. Un adjetivo con dos nombres.<\/strong> Si son de distinto género, va en masculino plural: <em>un texto y una foto <b>elegidos<\/b><\/em>.<\/p>\n<blockquote>\n<p><strong>Y un contenido que aquí no está, a propósito: la mayúscula.<\/strong> Va con la puntuación, en el nudo 14, que se estudia en febrero. Si en tus textos aparecen mayúsculas mal puestas, se señalan y se dejan hasta entonces.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "justificar", "titulo": "Corrige e indica el caso", "dossier": {"cuaderno": "4bis", "ejercicio": 9}, "ayuda": "Cada frase tiene una falta de concordancia. Escribe la forma corregida y el caso del apartado 4: sujeto largo, colectivo, <i>haber<\/i> impersonal o adjetivo con dos nombres.", "items": [{"enun": "Habían tres personas esperando.", "requiere": [["habia"], ["impersonal", "haber"]], "modelo": "«Había tres personas esperando»: caso 3, <i>haber<\/i> impersonal"}, {"enun": "La gente ya no leen en papel.", "requiere": [["no lee", "lee"], ["colectivo"]], "modelo": "«La gente ya no lee en papel»: caso 2, colectivo"}, {"enun": "El uso de las redes sociales entre los jóvenes han crecido.", "requiere": [["ha crecido"], ["sujeto"]], "modelo": "«El uso de las redes sociales entre los jóvenes ha crecido»: caso 1, sujeto largo; el sujeto es <i>el uso<\/i>"}, {"enun": "Todo el mundo saben lo que pasó aquel día.", "requiere": [["sabe"], ["colectivo"]], "modelo": "«Todo el mundo sabe lo que pasó aquel día»: caso 2, colectivo"}, {"enun": "Compró una mesa y un armario nuevas.", "requiere": [["nuevos"], ["dos nombres", "masculino", "adjetivo"]], "modelo": "«Compró una mesa y un armario nuevos»: caso 4, adjetivo con dos nombres, en masculino plural"}, {"enun": "Hubieron muchas quejas.", "requiere": [["hubo"], ["impersonal", "haber"]], "modelo": "«Hubo muchas quejas»: caso 3, <i>haber<\/i> impersonal"}], "criterio": "En <i>el uso de las redes sociales entre los jóvenes<\/i>, el verbo concuerda con <i>el uso<\/i>: se salta lo que va en medio. <i>La gente<\/i> y <i>todo el mundo<\/i> van en singular. <i>Haber<\/i> cuando significa «existir» no tiene plural. Un adjetivo con dos nombres de distinto género va en masculino plural.", "pide": "la forma corregida y el caso", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 9"}, {"tipo": "opcion", "titulo": "Salta lo que va entre comas", "dossier": {"cuaderno": "4bis", "ejercicio": 10}, "ayuda": "Localiza el sujeto saltando lo que va en medio y elige el verbo que le corresponde.", "items": [{"enun": "El futuro de estos pueblos, vacíos desde hace treinta años, <b>(depende / dependen)<\/b> de una decisión política.", "sol": "depende", "porque": "el sujeto es <i>el futuro<\/i>", "ops": ["depende", "dependen"]}, {"enun": "La opinión de los cazadores que la autora llama decentes <b>(importa / importan)<\/b> poco en el texto.", "sol": "importa", "porque": "el sujeto es <i>la opinión<\/i>", "ops": ["importan", "importa"]}], "criterio": "<i>El futuro de estos pueblos, vacíos desde hace treinta años<\/i>: el sujeto es <i>el futuro<\/i>, en singular, y el plural de <i>pueblos<\/i> no cuenta. En la segunda frase, el sujeto es <i>la opinión<\/i>, no <i>los cazadores<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 10"}, {"tipo": "hueco", "titulo": "Salta lo que hay en medio", "estricto": true, "ayuda": "Escribe el verbo o el adjetivo en la forma que corresponda. Salta lo que va entre el sujeto y el verbo.", "items": [{"enun": "El futuro de estas aldeas, habitadas por gente mayor, ______ en juego. <i>(estar)<\/i>", "sol": "está", "porque": "el sujeto es <i>el futuro<\/i>, no <i>las aldeas<\/i>"}, {"enun": "Un grupo de investigadores ______ en resucitar pueblos. <i>(especializado)<\/i>", "sol": "especializado", "porque": "acompaña a <i>grupo<\/i>"}, {"enun": "La caja de herramientas que dejaron los del turno anterior ______ vacía. <i>(estar)<\/i>", "sol": "estaba|está"}, {"enun": "El precio de los alquileres ______ subido otra vez. <i>(haber)<\/i>", "sol": "ha"}, {"enun": "Las cifras que dio el informe del año pasado ______ equivocadas. <i>(estar)<\/i>", "sol": "estaban|están", "porque": "aquí el sujeto sí es plural: <i>las cifras<\/i>"}, {"enun": "Un texto y una foto bien ______. <i>(elegido)<\/i>", "sol": "elegidos", "porque": "dos nombres de distinto género: masculino plural"}], "criterio": "Saltar lo de en medio resuelve cinco de los seis. El del adjetivo con dos nombres es otra regla: cuando un adjetivo acompaña a <b>dos<\/b> nombres de distinto género, va en masculino plural.<br><br>Y <i>las cifras<\/i> <b>sí<\/b> van en plural: saltar lo de en medio no significa poner siempre singular, sino localizar el sujeto.", "apoyo": "todo", "solo_web": true}, {"tipo": "opcion", "titulo": "¿Es falta?", "ayuda": "Diez frases. Decide si hay error de concordancia.", "ops": ["es falta", "está bien"], "items": [{"enun": "Hubo protestas en tres barrios.", "sol": "está bien"}, {"enun": "Se vendieron dos pisos y una plaza baratos.", "sol": "está bien", "porque": "dos nombres de distinto género: masculino plural"}, {"enun": "Un grupo de vecinos acudió al pleno.", "sol": "está bien"}, {"enun": "En la sala habían sillas para todos.", "sol": "es falta", "porque": "<i>había sillas<\/i>: <i>haber<\/i> impersonal no tiene plural"}, {"enun": "El público aplaudieron al final.", "sol": "es falta", "porque": "<i>aplaudió<\/i>: <i>el público<\/i> es un colectivo sin <i>de<\/i>"}, {"enun": "Se alquilaron dos plazas y un trastero nuevas.", "sol": "es falta", "porque": "distinto género: <b>nuevos<\/b>"}, {"enun": "La mayoría de los vecinos firmaron.", "sol": "está bien", "porque": "colectivo + <i>de<\/i> + plural: las dos concordancias valen"}, {"enun": "El grupo de investigadores están especializados en aldeas.", "sol": "es falta", "porque": "el sujeto es <i>el grupo<\/i>: <b>está especializado<\/b>"}, {"enun": "La gente piensan que es caro.", "sol": "es falta", "porque": "colectivo sin <i>de<\/i> + plural: singular"}, {"enun": "La mayoría de los vecinos firmó.", "sol": "está bien", "porque": "la otra, también"}], "criterio": "Las dos de <i>la mayoría de<\/i> están bien las dos: el colectivo con <i>de<\/i> admite el singular y el plural. No hay elección en los colectivos sin <i>de<\/i> —<i>la gente<\/i>, <i>el público<\/i>— ni en <i>haber<\/i> impersonal.", "apoyo": "todo", "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las concordancias", "ayuda": "Cuatro palabras de este párrafo no concuerdan. <b>Pincha en ellas.<\/b> Recuerda: la concordancia no se localiza buscando letras.", "items": [{"texto": "El precio de los alquileres del barrio han subido un veinte por ciento, y la gente dicen que no llegan. Habían tres pisos libres en enero y ahora no queda ninguno. Se alquilaron una plaza y un trastero nuevas la semana pasada.", "faltas": {"han": "ha — el sujeto es <i>el precio<\/i>", "dicen": "dice — <i>la gente<\/i> es colectivo, singular", "Habían": "Había — <i>haber<\/i> impersonal no tiene plural", "nuevas": "nuevos — dos nombres de distinto género: masculino plural"}}], "criterio": "Las cuatro corresponden a los cuatro sitios de la teoría, uno por cada uno: sujeto largo, colectivo, <i>haber<\/i> impersonal y adjetivo con dos nombres.<br><br>Y ninguna de las cuatro tiene una letra mal. Por eso van en la cuenta B y por eso se escapan en la última lectura, dedicada a la ortografía.", "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartado 4: La concordancia (p. 37) · ejercicios 9 y 10", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El tercer texto", "meta": "25 minutos · el último del trimestre", "cuaderno": [{"nudo": 18, "apartados": [5]}, {"nudo": "A1", "apartados": ["la hoja de revisión de la redacción"]}], "lectura": {"titulo": "La ventanilla que cerró", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["La oficina del banco de Amparo Gil cerró en marzo. La más cercana", "está a nueve kilómetros, en la cabecera de comarca, y para llegar", "hay dos autobuses al día: uno a las siete y otro a las dos. Amparo", "tiene setenta y nueve años y cobra la pensión el primero de cada", "mes.", "", "Le ofrecieron una aplicación. Se la instaló su nieto en agosto y", "funciona, dice, mientras el nieto está delante. Cuando le pide un", "código que llega por mensaje y hay que teclearlo antes de que", "caduque, se pone nerviosa y lo deja. Ha vuelto a la libreta.", "", "En su pueblo quedan trescientos ochenta vecinos y la mitad pasa de", "los sesenta y cinco. El ayuntamiento consiguió que un empleado del", "banco vaya los martes por la mañana a la sala de plenos, con un", "ordenador portátil y una impresora. Amparo va, hace cola y sale", "contenta.", "", "Lo que la molesta no es tener que esperar. Es que el martes se ha", "convertido en un día en que no se puede hacer otra cosa: si el", "médico cae en martes, o si el nieto libra en martes, hay que", "elegir.", "", "Nadie le ha dicho que no pueda ir a la oficina de la cabecera.", "Puede. Solo tiene que coger el autobús de las siete, esperar tres", "horas a que abran y volver en el de las dos. La posibilidad existe", "entera; lo que no existe es la mañana que hace falta para usarla."], "pie": "Texto inventado. Ni Amparo Gil ni las cifras que da son reales."}, "teoria": "<h3>Nudo 18 · 5 · Nueve redacciones puntuadas<\/h3>\n<p>Léelas con la hoja A-1 delante y puntúalas tú antes de mirar la nota.<\/p>\n<h4>Consigna de 2021, opción A — <em>la educación para poder mejorar la vida de las personas<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 106 palabras.<\/p>\n<blockquote>\n<p>Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>3<\/strong>.<\/p>\n<p>Tesis discutible en la primera frase; dos argumentos con conector (<em>en primer lugar<\/em>, <em>además<\/em>); una concesión (<em>es cierto que… pero<\/em>) que sube variación; cierre con consecuencia, no repetición; ni una falta ni una coma que sobre. <strong>Es el único de los nueve que llega a 3.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 98 palabras.<\/p>\n<blockquote>\n<p>Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,25<\/strong>.<\/p>\n<p>Sin faltas y con los puntos donde van, corrección y cohesión quedan enteras; pierde en las otras cuatro bandas. La tesis no es discutible; los tres argumentos se suman con <em>también<\/em>, sin marcar el orden (<em>en primer lugar<\/em>, <em>además<\/em>), y se acumulan; el cierre repite la primera frase casi igual (coherencia, 0,25). <em>Ayudar<\/em> aparece cuatro veces, <em>la educación<\/em> cuatro y <em>yo pienso que<\/em> dos: palabras que se repiten a menudo, y la variación se queda en 0. El <em>tú<\/em> de conversación (<em>te ayuda<\/em>, <em>si tú sabes<\/em>) y <em>yo pienso que<\/em> dejan el registro en 0.<\/p>\n<p><strong>Modelo bajo.<\/strong> 63 palabras.<\/p>\n<blockquote>\n<p>La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,35<\/strong>, y prorrateado por la extensión, ≈ <strong>0,85<\/strong>.<\/p>\n<p>Siete faltas de ortografía en 63 palabras (corrección, 0,6) — Cuenta C: <em>educacion<\/em> (dos veces), <em>inportante<\/em>, <em>por que<\/em>, <em>ningun<\/em>, <em>estudio<\/em>, <em>estan<\/em>. Cuenta B: tres comas donde iba punto —tras <em>nada<\/em>, tras <em>igual<\/em> y tras <em>y punto<\/em>—, y con tres la cohesión baja a 0,5. No hay tesis discutible, la razón es un ejemplo (<em>en mi pueblo<\/em>) y el final se desdice (coherencia, 0). <em>O sea<\/em> y <em>y punto<\/em> son marcas de oralidad (registro, 0). Y se queda por debajo de las 80 de clase: cada banda se prorratea por la extensión, 63 de las 100 palabras pedidas.<\/p>\n<h4>Consigna de 2020, opción A — <em>la caza<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 111 palabras.<\/p>\n<blockquote>\n<p>Creo que la caza no se puede defender ni condenar en bloque, porque el juicio dependerá de la razón por la que se cace. En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien. Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos. Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no tiene otro objeto que presumir. Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia, ni una falta y una concesión. <em>Por qué no es un tres:<\/em> supongamos que el folio viene sin márgenes. <strong>Ha perdido la banda que solo exige márgenes y letra legible.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 97 palabras. <em>(Escrito con las faltas que se repiten en los primeros textos de clase.)<\/em><\/p>\n<blockquote>\n<p>Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0,8<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,80<\/strong>.<\/p>\n<p>Las razones se amontonan y el final abre un tema nuevo. Cuenta B: cuatro comas donde iba punto, y el punto que falta detrás de <em>sin comida<\/em>. Cuenta C: <em>esta<\/em>, <em>tambien<\/em>, <em>diversion<\/em>, <em>ademas<\/em>, <em>ningun<\/em>. Y <em>animales<\/em> cuatro veces. <strong>Le falta la estructura: una tesis, dos razones con conector y un cierre.<\/strong><\/p>\n<p><strong>Modelo bajo.<\/strong> 83 palabras.<\/p>\n<blockquote>\n<p>A mi la caza me parese una cosa muy antigua que ya no sirbe para nada, en mi pueblo ay muchos cazadores y salen los domingos con las escopetas, luego se ban al bar a contarlo, yo e ido alguna vez de pequeño y la berdad es que no me gusto nada ver al conejo aquel echo un cristo, o sea que por mi que la proiban ya y punto, tanpoco quiero meterme con nadie por que cada uno hase lo que kiere.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>La idea llega al final y luego se desdice. Cinco comas donde iba un punto. Quince faltas —Cuenta C: <em>mi<\/em> (dos veces, sin tilde), <em>parese<\/em>, <em>sirbe<\/em>, <em>ay<\/em>, <em>ban<\/em>, <em>e<\/em>, <em>berdad<\/em>, <em>gusto<\/em>, <em>echo<\/em>, <em>proiban<\/em>, <em>tanpoco<\/em>, <em>por que<\/em>, <em>hase<\/em>, <em>kiere<\/em>—: a partir de doce, corrección es cero. <em>O sea<\/em> y <em>echo un cristo<\/em> se llevan el registro. Y <strong>83 palabras: tres por encima del límite de clase para el prorrateo.<\/strong> Un apunte que tranquiliza: esas quince faltas <strong>no descuentan otros 1,50 aparte<\/strong>, porque la penalización de 0,10 solo corre en los bloques 1 y 2.<\/p>\n<h4>Consigna de 2026, opción A — <em>la necesidad de defender el trabajo agrícola<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 110 palabras.<\/p>\n<blockquote>\n<p>Creo que hay que defender el trabajo agrícola porque de él depende quién decide el precio de lo que comemos. En primer lugar el agricultor cobra por su cosecha una parte muy pequeña de lo que pagamos en la tienda, y la diferencia se la quedan los intermediarios. Además el campo depende de un clima cada vez menos previsible, y dos años malos seguidos pueden cerrar una explotación entera. Es cierto que las subvenciones sostienen al sector cada año pero una ayuda no sustituye un precio justo. Por eso pienso que defender el campo es asegurar que la comida se siga produciendo aquí y no dependa solo de las importaciones.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia y ni una falta. <em>Por qué no es un tres:<\/em> le faltan tres comas —tras <em>En primer lugar<\/em>, tras <em>Además<\/em> y delante de <em>pero<\/em>—. <strong>Los dos primeros errores de cohesión no bajan la banda; a partir del tercero, cada dos errores bajan 0,25, y con tres se queda en 0,5.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 95 palabras, con sus faltas.<\/p>\n<blockquote>\n<p>Yo creo que el trabajo agricola es muy importante para todos porque sin agricultores no comeriamos, los agricultores trabajan mucho y ganan muy poco dinero y eso no esta bien, en mi pueblo casi todos los jovenes se an ido a la ciudad y las tierras se quedan sin nadie que las trabaje, tambien está el problema de que la comida viene de fuera y es más barata. Yo creo que hay que ayudar a los agricultores porque el trabajo agricola es muy importante para todos y luego nos quejamos cuando todo sube de precio.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,85<\/strong>.<\/p>\n<p>El cierre es la primera frase copiada. Tres comas donde iba punto. Siete faltas —Cuenta C: <em>agricola<\/em> (dos veces), <em>comeriamos<\/em>, <em>esta<\/em>, <em>jovenes<\/em>, <em>an<\/em>, <em>tambien<\/em>—, y dos son la misma palabra: <em>agricola<\/em> cuenta cada vez. <em>Por qué está donde está:<\/em> le faltan dos partes que se arreglan en tres minutos: <strong>una tesis discutible y un cierre que no la repita<\/strong>.<\/p>\n<p><strong>Modelo bajo.<\/strong> 91 palabras.<\/p>\n<blockquote>\n<p>El campo es muy duro. Mi tio tenia unas tierras aya en el pueblo y las bendio por que no sacaba nada. Ahora ai muchas naves. La gente de ciudad no save lo que cuesta un kilo de tomates, en berano fui a coger aceituna y acabé echo polvo. Yo que se, esto tendrian que areglarlo los de arriba. Tambien es verda que la fruta de fuera esta mas barata y la gente compra lo barato, es normal. En fin, que el campo esta fatal y no ay quien lo arregle.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>No hay tesis: salta del tío a los tomates y a la aceituna, y al final se desdice. Dieciocho faltas contadas por lo bajo — Cuenta C: <em>tio<\/em>, <em>tenia<\/em>, <em>aya<\/em>, <em>bendio<\/em>, <em>por que<\/em>, <em>ai<\/em>, <em>save<\/em>, <em>berano<\/em>, <em>echo<\/em>, <em>se<\/em>, <em>tendrian<\/em>, <em>areglarlo<\/em>, <em>Tambien<\/em>, <em>verda<\/em>, <em>esta<\/em> (dos veces), <em>mas<\/em>, <em>ay<\/em>. <em>Yo que se<\/em> y <em>echo polvo<\/em> se llevan el registro. <em>Por qué está donde está:<\/em> <strong>la cohesión supera a la de los otros dos modelos bajos<\/strong> —frases cortas, acabadas en punto— y aun así saca 0,75, porque no hay tesis ni argumentos y las dieciocho faltas dejan la corrección en cero.<\/p>\n<h3>Anexo A-1 · Hoja de revisión de la redacción<\/h3>\n<blockquote>\n<p>Esta hoja se rellena <strong>por detrás de cada texto que escribas<\/strong>, antes de entregarlo. Sirve para encontrar lo que todavía se puede arreglar y, con la tabla de tramos del nudo 18, apartado 1, para ponerse nota.<\/p>\n<\/blockquote>\n<hr />\n<h4>HOJA DE REVISIÓN — EXPRESIÓN ESCRITA<\/h4>\n<p>Nombre: ………………………………  Fecha: …………  Texto n.º: ……<\/p>\n<hr />\n<h5>PASO 0 · Los tres ceros. Esto va antes que nada.<\/h5>\n<p>Si fallas una, <strong>la nota es 0 aunque el resto esté perfecto<\/strong>. No sigas rellenando la hoja.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>pregunta<\/th>\n<th style=\"text-align: center;\">sí<\/th>\n<th style=\"text-align: center;\">no<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tipo<\/strong><\/td>\n<td>¿He escrito <strong>el tipo de texto<\/strong> que pedía la opción elegida? (la A ha sido siempre argumentativa: doy mi opinión y la defiendo · la B, narrativa salvo en 2017: cuento algo que pasa; manda el enunciado)<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>tema<\/strong><\/td>\n<td>¿He escrito sobre <strong>el tema exacto<\/strong> del enunciado, y no sobre uno parecido?<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>¿Tengo <strong>50 palabras o más<\/strong>? → cuéntalas ahora: ……… palabras<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Si tengo menos de 50, es cero. Si el texto es muy breve para las cien que pide el enunciado —en clase, por debajo de 80—, <strong>cada apartado se me reduce en proporción<\/strong>. El objetivo son <strong>unas 100<\/strong>.<\/p>\n<\/blockquote>\n<hr />\n<h5>PASO 1 · Las dos cuentas<\/h5>\n<p>Repasa el texto dos veces, una por cuenta, y marca cada error en el margen con su letra. Son dos pasadas distintas porque buscan errores distintos: la cuenta C revisa las palabras y la cuenta B revisa dónde termina cada oración.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué cuento<\/th>\n<th style=\"text-align: center;\">señal en el margen<\/th>\n<th style=\"text-align: center;\"><strong>total<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cuenta B<\/strong><\/td>\n<td><strong>puntuación<\/strong> (comas, puntos que faltan o sobran) · <strong>concordancia<\/strong> (el verbo no va con el sujeto, el adjetivo no va con el nombre) · <strong>oraciones mal construidas<\/strong> (les falta el verbo, se quedan sin terminar, no se entiende dónde acaban)<\/td>\n<td style=\"text-align: center;\">B<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<tr>\n<td><strong>Cuenta C<\/strong><\/td>\n<td><strong>ortografía<\/strong> (letras, tildes, mayúsculas) · <strong>morfosintaxis<\/strong> (formas verbales mal hechas, preposición equivocada) · <strong>léxico<\/strong> (palabra que no significa lo que quiero decir)<\/td>\n<td style=\"text-align: center;\">C<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>PASO 2 · Qué hacer con las dos cuentas<\/h5>\n<p>Cada cuenta cae en un tramo, y los tramos son los oficiales: en <strong>cohesión<\/strong>, de 0 a 2 errores es la banda entera y cada dos errores más baja un escalón; en <strong>corrección<\/strong>, de 0 a 3 errores es la banda entera, y a partir de ahí baja cada dos. La tabla de tramos está en el nudo 18, apartado 1.<\/p>\n<p>Aquí no se apunta ninguna nota. La cuenta sirve para saber <strong>cuántos errores hay que quitar para cambiar de tramo<\/strong>: casi siempre dos.<\/p>\n<hr />\n<h5>PASO 3 · Las tres preguntas que suben la nota antes de entregar<\/h5>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>¿Qué palabra he repetido más? Cuéntala. Si aparece <strong>cuatro veces o más<\/strong>, cambia dos por otra. <em>(Vale 0,25)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Busca dónde termina cada oración: donde acaba una idea completa con su verbo, va un punto. La coma no separa el sujeto del verbo, y entre dos oraciones con verbo propio va punto, salvo que las una <em>y<\/em>, <em>pero<\/em> u <em>o<\/em>. <em>(Vale hasta 0,75)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>¿Hay alguna palabra de la que dudo cómo se escribe? Antes de cambiarla, mira si hay una regla que la resuelva (<em>-aba<\/em>, <em>-aje<\/em>, m antes de b). Si no la hay, busca otra manera de decir lo mismo <strong>sin perder precisión<\/strong>: cambiar una palabra exacta por una vaga descuenta en variación. <em>(Vale hasta 1)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>Lo que hay que recordar de esta hoja<\/h5>\n<ul>\n<li><strong>Corrección + cohesión = 1,75 de 3.<\/strong> Casi el 60 % depende de la ortografía, la puntuación y la concordancia.<\/li>\n<li><strong>Variación + registro + disposición = 0,75<\/strong>, y los tres se arreglan releyendo: una palabra repetida, el tono, los márgenes.<\/li>\n<li><strong>Las faltas de ortografía de la redacción cuentan en la banda de corrección<\/strong> y no descuentan además el 0,10 por falta de los bloques 1 y 2: ese descuento, hasta 2 puntos, corre solo allí.<\/li>\n<li><strong>En corrección, a partir de la cuarta falta, cada dos faltas menos son 0,2 puntos más.<\/strong><\/li>\n<li><strong>Versión 2.<\/strong> Con las marcas B y C delante, se reescribe el texto entero: contar los errores sin volver a escribir deja el texto como estaba.<\/li>\n<\/ul>\n<hr />\n<p><em>Bandas, puntos y tramos de las dos cuentas: criterios oficiales de corrección, Prova d'accés a CFGS, convocatòria 2026 (documento público). Redacción de la hoja y los tres ceros: material propio.<\/em><\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Tres minutos localizando", "ayuda": "Antes de escribir, saca del texto lo que te pueda servir. Número de línea.", "items": [{"enun": "Los dos horarios de autobús que tiene", "sol": "2|3|4"}, {"enun": "Por qué la aplicación no le funciona sola", "sol": "7|8|9"}, {"enun": "La solución que encontró el ayuntamiento", "sol": "11|12|13"}, {"enun": "Lo que más le molesta", "sol": "15|16|17"}, {"enun": "El cierre, con la idea general", "sol": "19|20|21|22"}], "criterio": "De la columna, para hoy sirve sobre todo el cierre: <b>la posibilidad existe y la mañana no<\/b>. Esa idea se puede llevar a cualquier trámite digital, y una tesis que parta de esa idea ya está anclada al texto sin citarlo.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas", "Consigna de 2020, opción A — la caza"], "solo_web": true}, {"tipo": "opcion", "titulo": "El plan: ¿esto es argumento o ejemplo?", "ayuda": "Seis frases para el texto de hoy. El argumento explica un mecanismo; el ejemplo cuenta un caso.", "ops": ["argumento", "ejemplo"], "items": [{"enun": "Un trámite que exige un código con caducidad excluye a quien necesita ayuda para hacerlo, porque la ayuda no siempre está delante.", "sol": "argumento"}, {"enun": "Cuando el servicio se concentra en un día, ese día deja de estar disponible para todo lo demás.", "sol": "argumento"}, {"enun": "A mi madre le instalaron la aplicación y no la usa.", "sol": "ejemplo"}, {"enun": "Mi vecina de setenta y nueve años volvió a la libreta.", "sol": "ejemplo"}, {"enun": "Ofrecer una alternativa que cuesta siete horas fuera de casa es ofrecerla solo sobre el papel.", "sol": "argumento"}, {"enun": "En el pueblo de al lado pasó lo mismo el año pasado.", "sol": "ejemplo"}], "criterio": "Los tres argumentos explican <b>por qué<\/b> pasa algo y se pueden aplicar a otros casos. Los tres ejemplos cuentan uno solo, y a cada uno se le puede contestar «pues yo conozco otro».<br><br>En cien palabras caben dos argumentos y, dentro de uno de ellos, medio ejemplo.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas"], "solo_web": true}, {"tipo": "abierta", "titulo": "Cien palabras · 20 minutos", "ayuda": "El último texto del trimestre. Se escribe en clase.", "items": [{"enun": "<i>Redacte un texto argumentativo en el que exponga su opinión sobre el cierre de servicios presenciales y su sustitución por trámites digitales.<\/i>", "modelo": "Un modelo alto abajo."}], "modelos": ["<b>≈2,90 · 110 palabras.<\/b> «Creo que cerrar oficinas y sustituirlas por trámites digitales solo es un ahorro si todo el mundo puede usar la aplicación. En primer lugar, muchos trámites exigen teclear un código que caduca en un minuto, y quien necesita ayuda para hacerlo no siempre tiene a alguien al lado. Además, cuando la atención presencial se reduce a una mañana a la semana, ese día queda ocupado y no sirve para nada más. Es cierto que mantener oficinas casi vacías cuesta dinero, pero cerrarlas traslada ese coste a las personas mayores, las menos preparadas para asumirlo. Por eso pienso que una alternativa digital no debería aprobarse sin medir cuántas horas cuesta usarla.»"], "criterio": "Tres rasgos del modelo. <b>Uno:<\/b> la tesis se puede negar —alguien puede sostener que el ahorro compensa—. <b>Dos:<\/b> los dos argumentos explican mecanismos distintos, el del código y el de la concentración horaria. <b>Tres:<\/b> la concesión reconoce algo verdadero —las oficinas vacías cuestan— y gira sin repetir la tesis.<br><br>Y el cierre no repite «hay que mantener las oficinas»: propone <b>cómo medirlo<\/b>, que es una consecuencia.", "remate": "Con este texto se cierra el trimestre. La distancia entre las faltas que encuentres tú al releer y las que marque el corrector indica si el método ha funcionado; la nota, no.", "palabras": {"objetivo": 100}, "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 5: Nueve redacciones puntuadas (p. 70) · Anexo A-1 · Hoja de revisión de la redacción — el cuaderno: la hoja de revisión de la redacción", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Las preposiciones", "meta": "30 minutos · diecisiete de los treinta y dos ítems se deciden aquí", "cuaderno": {"nudo": 11, "apartados": [2], "ejercicios": [5, 6, 7, 8]}, "teoria": "<h3>2 · La preposición<\/h3>\n<p><strong>Ningún otro apartado del trimestre cubre tantos ítems.<\/strong> De los 32 sintagmas de función sintáctica, <strong>17 se deciden aquí<\/strong>: los 13 complementos directos y los 4 de régimen. La sintaxis llega en el segundo trimestre; ahora hace falta un solo dato: <strong>hay verbos que van pegados a una preposición y no la sueltan<\/strong>.<\/p>\n<p><strong>Qué es una preposición.<\/strong> Una palabra invariable que sola no significa nada y que siempre arrastra algo detrás. La lista está cerrada y <strong>se aprende de memoria<\/strong>:<\/p>\n<blockquote>\n<p>a · ante · bajo · con · contra · de · desde · durante · en · entre · hacia · hasta · mediante · para · por · según · sin · sobre · tras · versus · vía<\/p>\n<\/blockquote>\n<p>(Algunas listas añaden <em>cabe<\/em> y <em>so<\/em>, que ya no usa nadie, y <em>salvo<\/em>, que la mayoría de gramáticas trata aparte.)<\/p>\n<p><strong>Locuciones preposicionales<\/strong>: <em>a falta de, a lo largo de, gracias a, en torno a, a pesar de, delante de, encima de, debajo de, junto a, rumbo a, en lugar de, a favor de<\/em>. <strong>Aviso<\/strong>: <em>en relación con<\/em> y <em>con relación a<\/em> son las formas tradicionales; <em>en relación a<\/em>, nacida del cruce de las dos, ya no la censura la RAE. En el examen, <strong>en relación con<\/strong>.<\/p>\n<p><strong>Los verbos que rigen preposición.<\/strong> Con ellos el complemento no es directo: es <strong>complemento de régimen<\/strong> (las claves oficiales lo llaman también <em>complemento preposicional<\/em>, <em>complemento regido<\/em> o <em>suplemento<\/em> — los cuatro nombres son válidos).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>complemento directo<\/th>\n<th>complemento de régimen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>se sustituye por <em>lo, la, los, las<\/em><\/td>\n<td><strong>sí<\/strong>: «Lidera un equipo» → <em>Lo lidera<\/em><\/td>\n<td><strong>no<\/strong>: «Se convirtió en agricultor» → <em>lo se convirtió<\/em> ✘<\/td>\n<\/tr>\n<tr>\n<td>al preguntar, la preposición<\/td>\n<td>desaparece: <em>¿qué lidera?<\/em> (la <em>a<\/em> del directo de persona se repite, <em>¿a quién cuidó?<\/em>, y no es de régimen: manda la prueba de <em>lo / la<\/em>)<\/td>\n<td><strong>se repite<\/strong>: <em>¿en qué se convirtió?<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los cuatro casos reales, con su clave oficial: «No confiamos en nosotros mismos» (2014), «Los utópicos creen en el progreso» (2018), «Gerehou ejerció de presidente de SOS Racismo» (2022), «Por el camino se ha convertido en una especie de influencer agrícola» (2026).<\/p>\n<h4>La lista de verbos de régimen<\/h4>\n<p>Esta lista es de consulta, no de memoria. Con ★ los que han caído en el ejercicio de función sintáctica; con · los que aparecen en los textos de examen.<\/p>\n<table>\n<thead>\n<tr>\n<th>prep.<\/th>\n<th>verbos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a<\/strong><\/td>\n<td>dedicarse ·, referirse ·, aludir, acostumbrarse ·, atreverse ·, enfrentarse ·, contribuir ·, obligar ·, renunciar, negarse, oponerse, aspirar, parecerse, equivaler, saber (<em>a<\/em>), oler (<em>a<\/em>), dirigirse<\/td>\n<\/tr>\n<tr>\n<td><strong>de<\/strong><\/td>\n<td>avergonzarse, acordarse, olvidarse, arrepentirse, quejarse ·, burlarse, presumir, carecer, depender ·, disfrutar, encargarse, darse cuenta, tratarse ·, huir ·, aprender ·, hablar ·, alegrarse, despedirse, enterarse, tratar<\/td>\n<\/tr>\n<tr>\n<td><strong>en<\/strong><\/td>\n<td>confiar ★, creer ★, convertirse ★, insistir ·, pensar, consistir, fijarse, empeñarse, participar, coincidir, basarse ·, influir, tardar<\/td>\n<\/tr>\n<tr>\n<td><strong>con<\/strong><\/td>\n<td>contar, soñar, conformarse, cumplir, casarse, acabar ·, dar (<em>con<\/em>), enfrentarse, coincidir<\/td>\n<\/tr>\n<tr>\n<td><strong>por<\/strong><\/td>\n<td>preocuparse ·, luchar ·, apostar ·, optar, interesarse, esforzarse, decantarse, decidirse<\/td>\n<\/tr>\n<tr>\n<td><strong>sobre<\/strong><\/td>\n<td>tratar, escribir, opinar, reflexionar, discutir, informar<\/td>\n<\/tr>\n<tr>\n<td><strong>de<\/strong> (oficio)<\/td>\n<td>ejercer ★, trabajar, hacer (<em>de<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los cuatro con estrella son los únicos etiquetados como régimen por una clave oficial; los del punto aparecen en los textos de las convocatorias. El resto funcionan igual: <strong>si al preguntar tienes que repetir la preposición, es de régimen.<\/strong><\/p>\n<p>Cuatro que cambian de significado con la preposición: <em>tratar<\/em> <strong>de<\/strong> (intentar) y <em>tratar<\/em> <strong>con<\/strong> (relacionarse); <em>pensar<\/em> <strong>en<\/strong> (tener en la cabeza) y <em>pensar<\/em> <strong>de<\/strong> (opinar); <em>contar<\/em> <strong>con<\/strong> (disponer de) y <em>contar<\/em> sin preposición (narrar, enumerar); <em>quedar<\/em> <strong>en<\/strong> (acordar) y <em>quedar<\/em> <strong>con<\/strong> (citarse).<\/p>\n<p>Y una falta frecuente que va al revés: meter una preposición donde el verbo no la lleva. <em>Le informó <\/em><em>de<\/em><em> que<\/em> es correcto, porque <em>informar de<\/em> rige preposición; <em>pienso <\/em><em>de<\/em><em> que<\/em>, <em>dijo <\/em><em>de<\/em><em> que<\/em> y <em>creo <\/em><em>de<\/em><em> que<\/em> no lo son, porque <em>pensar<\/em>, <em>decir<\/em> y <em>creer<\/em> llevan el complemento directo sin preposición. La prueba sirve en los dos sentidos: <em>¿qué dijo?<\/em>, sin preposición, así que <em>dijo que<\/em>. Y la prueba del <em>eso<\/em> da lo mismo: la oración que sigue al verbo se sustituye por <em>eso<\/em>, y <em>eso<\/em> arrastra la preposición del verbo o no la arrastra: <em>pienso eso<\/em>, <em>dijo eso<\/em>, <em>creo eso<\/em> —sin preposición— frente a <em>me informó de eso<\/em>, <em>se acordó de eso<\/em>, <em>insistió en eso<\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Las locuciones preposicionales", "dossier": {"cuaderno": "11", "ejercicio": 5}, "ayuda": "Escribe en cada hueco una de estas locuciones: <i>delante de · encima de · junto a · rumbo a · gracias a · a favor de · en lugar de · a lo largo de · en torno a · a falta de · a pesar de · debajo de<\/i>.", "items": [{"enun": "Instalaron su tienda de campaña ______ la nuestra.", "sol": "junto a|delante de", "corto": false}, {"enun": "La tienda está justo ______ Correos.", "sol": "delante de|junto a", "corto": false}, {"enun": "Nos trajo fruta ______ verdura.", "sol": "en lugar de", "corto": false}, {"enun": "Colocamos la maceta ______ la mesa.", "sol": "encima de", "corto": false}, {"enun": "El barco partió ______ América.", "sol": "rumbo a", "corto": false}, {"enun": "Salvaron el partido ______ un tanto en el último minuto.", "sol": "gracias a", "corto": false}, {"enun": "El jurado se pronunció ______ la demandante.", "sol": "a favor de", "corto": false}, {"enun": "Caminamos ______ la playa hasta el faro.", "sol": "a lo largo de", "corto": false}, {"enun": "La reunión giró ______ el nuevo horario.", "sol": "en torno a", "corto": false}, {"enun": "______ voluntarios, suspendieron la actividad.", "sol": "a falta de", "corto": false}, {"enun": "Salieron a la calle ______ la lluvia.", "sol": "a pesar de", "corto": false}, { <script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }

  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);

    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {

        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);

  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();

  function cierraVentana() {

    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');
        h3 = tit;
      }
      out.push({ titulo: tit, html: cuerpo, padre: es3 ? null : h3 });
    }
    return out;
  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));

  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:

  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {

  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };

  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {

        var d = f.querySelector('.dice'); if (d) d.remove();

      var campo;
