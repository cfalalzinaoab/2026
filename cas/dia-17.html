<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 17 · 24 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}

.textoexamen .ln.blanca{height:9px}

  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 17, "fecha": "2026-11-24", "tab": "Día 17 · 24 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 17", "h1": "Martes 24 de noviembre", "sub": "La corrección mixta · el simulacro del bloque 1", "carriles": [{"chapa": "Carril A", "titulo": "Corrección mixta y relectura", "meta": "15 minutos · las faltas del trimestre, mezcladas y repartidas por familias", "cuaderno": {"nudo": "4bis", "apartados": [1, 4], "ejercicios": [11, 12]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> igual que el nudo 4, esto no tiene enunciado propio. Se descuenta en la <strong>penalización<\/strong> —0,1 por falta en los bloques 1 y 2, hasta 2 puntos— y en dos bandas de la redacción: <strong>corrección<\/strong> (1 punto) y <strong>cohesión<\/strong> (0,75), donde va la concordancia.<\/div>\n<blockquote>\n<p>Este nudo no da reglas nuevas: trabaja <strong>las faltas que aparecen en los textos que tú escribes<\/strong>. Por eso va detrás del nudo 4 y no antes.<\/p>\n<p>La cuenta: los bloques 1 y 2 valen <strong>7 de los 10 puntos<\/strong>, y cada falta descuenta <strong>0,1<\/strong> hasta un tope de <strong>2<\/strong>. Diez faltas descuentan un punto; el resumen entero vale 1,5.<\/p>\n<\/blockquote>\n<h3>1 · La relectura de dos minutos<\/h3>\n<p>Releer el texto entero en busca de cualquier falta no sirve: el ojo lee lo que espera leer y pasa por encima de lo escrito. La relectura que funciona busca <strong>una sola clase de falta en cada pasada<\/strong>, en dos pasadas de un minuto.<\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué se busca<\/th>\n<th>tiempo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>los <strong>verbos<\/strong>: imperfectos en <em>-aba<\/em>, infinitivos en <em>-bir<\/em>, pasados con j (<em>dije, trajo, condujo<\/em>)<\/td>\n<td>1 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>la <strong>palabra dudosa<\/strong>: si no estás seguro de cómo se escribe, sustitúyela por otra que sepas escribir<\/td>\n<td>1 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4 · La concordancia<\/h3>\n<p>La concordancia <strong>no se localiza releyendo letras<\/strong>. No va en la Cuenta C, la de ortografía, sino en la <strong>Cuenta B<\/strong>, la de cohesión: <strong>0,75<\/strong>. Y en los bloques 1 y 2 descuenta 0,1 igual que una falta de letras.<\/p>\n<p>Concordar es ponerse de acuerdo:<\/p>\n<ul>\n<li><strong>sujeto y verbo<\/strong>, en número y persona: <em>los cazadores <b>aseguran<\/b> amar a los animales<\/em>.<\/li>\n<li><strong>nombre, determinante y adjetivo<\/strong>, en género y número: <em>una larga, cruel <b>agonía<\/b><\/em>.<\/li>\n<\/ul>\n<p>Los cuatro sitios donde se rompe:<\/p>\n<p><strong>1. El sujeto largo.<\/strong> Si entre sujeto y verbo hay muchas palabras, el verbo se va con la última que has oído. Este de 2015:<\/p>\n<blockquote>\n<p>«<strong>El futuro<\/strong> de O Couto, un paraje de A Costa da Morte habitado por una población envejecida y menguante, <strong>está<\/strong> en manos de un grupo de investigadores […] <strong>especializado<\/strong> en resucitar aldeas.»<\/p>\n<\/blockquote>\n<p><em>Está<\/em>, no «están»: el sujeto es <em>el futuro<\/em>. Y <em>especializado<\/em>, no «especializados»: acompaña a <em>grupo<\/em>. Salta lo que va entre comas y el sujeto queda al lado del verbo.<\/p>\n<p><strong>2. Los colectivos van en singular… con una excepción.<\/strong> <em>La gente<\/em>, <em>todo el mundo<\/em>: <strong>piensa<\/strong>, no «piensan». Pero cuando el colectivo lleva detrás <em>de<\/em> + plural —<em>la mayoría <b>de los alumnos<\/b><\/em>, <em>un grupo <b>de vecinos<\/b><\/em>— <strong>las dos concordancias son correctas<\/strong>: <em>aprobó<\/em> y <em>aprobaron<\/em>. Ninguna de las dos es falta. Si dudas, elige el singular.<\/p>\n<p><strong>3. <em>Haber<\/em> impersonal no tiene plural.<\/strong> Cuando significa «existir»: <em>hay<\/em>, <em>había<\/em>, <em>hubo<\/em>. <strong>«Habían muchos cazadores» es falta<\/strong>: <em>había muchos cazadores<\/em>.<\/p>\n<p><strong>4. Un adjetivo con dos nombres.<\/strong> Si son de distinto género, va en masculino plural: <em>un texto y una foto <b>elegidos<\/b><\/em>.<\/p>\n<blockquote>\n<p><strong>Y un contenido que aquí no está, a propósito: la mayúscula.<\/strong> Va con la puntuación, en el nudo 14, que se estudia en febrero. Si en tus textos aparecen mayúsculas mal puestas, se señalan y se dejan hasta entonces.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "justificar", "titulo": "Y una más difícil", "dossier": {"cuaderno": "4bis", "ejercicio": 12}, "ayuda": "No todas las frases tienen una sola falta. Escribe cada frase corregida, entera.", "items": [{"enun": "El texto abla de la vida en el campo.", "requiere": [["habla"]], "modelo": "«El texto habla de la vida en el campo»: <i>h<\/i>, verbo <i>hablar<\/i>"}, {"enun": "No vino ella sino su hermano, así que no ay problema.", "requiere": [["no hay"]], "modelo": "«…así que no hay problema»: <i>h<\/i>, verbo <i>haber<\/i>; <i>sino<\/i> está bien"}, {"enun": "Habían dos opciones y elegí la primera.", "requiere": [["habia"]], "modelo": "«Había dos opciones y elegí la primera»: concordancia, <i>haber<\/i> impersonal"}, {"enun": "Le pregunté porqué se marchaba.", "requiere": [["por que"]], "modelo": "«Le pregunté por qué se marchaba»: palabras separadas, interrogativa indirecta"}, {"enun": "El paisage estava cubierto de nieve.", "requiere": [["paisaje"], ["estaba"]], "modelo": "«El paisaje estaba cubierto de nieve»: dos faltas, una de <i>j<\/i> y <i>g<\/i> y otra de <i>b<\/i> y <i>v<\/i>"}], "criterio": "La frase del paisaje tiene dos faltas, <i>paisage<\/i> y <i>estava<\/i>: quien corrige <i>paisage<\/i> y pasa a la frase siguiente deja <i>estava<\/i> sin corregir. <i>Sino<\/i>, en <i>no vino ella sino su hermano<\/i>, está bien: corrige una negación.", "pide": "la frase corregida", "apoyo": ["1 · La relectura de dos minutos"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 12"}, {"tipo": "cazar", "titulo": "Tanda mezclada, cronometrada", "ayuda": "Nueve errores en este párrafo. Marca las palabras que debes corregir. Tres minutos.", "items": [{"texto": "El encargado dijo que iva a haver una reunión sobre el nuebo horario, y que si no veniamos tendriamos que firmar despues. Yo le pregunté porqué no lo avisaban con tiempo y me contestó que el mensage se había mandado. Habían dos personas que tampoco lo recibieron.", "faltas": {"iva": "iba", "haver": "haber", "nuebo": "nuevo", "veniamos": "veníamos", "tendriamos": "tendríamos", "despues": "después", "porqué": "por qué", "mensage": "mensaje", "Habían": "Había"}}], "criterio": "Son nueve correcciones: <i>iba<\/i>, <i>haber<\/i>, <i>nuevo<\/i>, <i>veníamos<\/i>, <i>tendríamos<\/i>, <i>después<\/i>, <i>por qué<\/i>, <i>mensaje<\/i> y <i>Había<\/i>. El verbo <i>haber<\/i>, cuando indica existencia, es impersonal y se usa en singular: <i>Había dos personas<\/i>. La palabra <i>avisaban<\/i> está bien escrita.", "apoyo": ["1 · La relectura de dos minutos"], "solo_web": true}, {"tipo": "hueco", "titulo": "Las que más caen", "estricto": true, "ayuda": "Diez huecos, uno por familia. Escribe entero lo que falta, aunque sean dos palabras.", "items": [{"enun": "Antes ______ al pueblo cada verano. <i>(ir, yo, imperfecto)<\/i>", "sol": "iba"}, {"enun": "Va ______ cambios en el turno.", "sol": "a haber"}, {"enun": "Vamos ______ qué pasa.", "sol": "a ver", "corto": false}, {"enun": "Le mandé un ______ ayer. <i>(escrito breve)<\/i>", "sol": "mensaje"}, {"enun": "En ______ hace frío. <i>(mes 11)<\/i>", "sol": "noviembre"}, {"enun": "Nadie explicó ______ del cierre. <i>(el motivo)<\/i>", "sol": "el porqué", "corto": false}, {"enun": "No quiero café, ______ té.", "sol": "sino"}, {"enun": "Ayer ______ mucha gente. <i>(haber)<\/i>", "sol": "hubo"}, {"enun": "Es una palabra ______. <i>(esdrújulo, femenino)<\/i>", "sol": "esdrújula"}, {"enun": "Lo dijo ______ claro que nadie preguntó. <i>(tan / tanto)<\/i>", "sol": "tan"}], "criterio": "Los dos de <i>haber<\/i> y <i>a ver<\/i> van juntos a propósito, y en los dos el hueco empieza por la <i>a<\/i>: si la <i>a<\/i> viniera escrita en la frase, no habría nada que decidir.<br><br>La diferencia: <b>a haber<\/b> es la preposición más el infinitivo del verbo <i>haber<\/i>, y va detrás de otro verbo que pida <i>a<\/i> —<i>va a haber<\/i>, <i>vamos a haber<\/i>, <i>empieza a haber<\/i>—. <b>A ver<\/b> es la preposición más el infinitivo de <i>ver<\/i>, y detrás lleva <i>si<\/i>, <i>qué<\/i>, <i>cómo<\/i> o un sustantivo: <i>vamos a ver qué pasa<\/i>, <i>a ver si llueve<\/i>.<br><br>Prueba: sustitúyelo por <i>mirar<\/i>. Si la frase aguanta, es <i>a ver<\/i>.", "apoyo": ["1 · La relectura de dos minutos"], "solo_web": true}, {"tipo": "justificar", "titulo": "Última pasada mixta", "dossier": {"cuaderno": "4bis", "ejercicio": 11}, "ayuda": "Cada frase tiene una falta. Escribe la frase corregida, o solo la palabra corregida.", "items": [{"enun": "La mayoría de la gente no saben escribir un resumen.", "requiere": [["no sabe", "sabe"]], "modelo": "«La mayoría de la gente no sabe escribir un resumen»: concordancia, colectivo"}, {"enun": "Vamos haber si el jueves sale bien.", "requiere": [["a ver"]], "modelo": "«Vamos a ver si el jueves sale bien»: palabras separadas"}, {"enun": "No es un problema de tiempo si no de método.", "requiere": [["sino"]], "modelo": "«No es un problema de tiempo sino de método»: palabras separadas; corrige lo negado"}, {"enun": "Habían muchas faltas en el primer texto.", "requiere": [["habia"]], "modelo": "«Había muchas faltas en el primer texto»: concordancia, <i>haber<\/i> impersonal"}, {"enun": "Estava convencida de que aprobaría.", "requiere": [["estaba"]], "modelo": "«Estaba convencida de que aprobaría»: <i>b<\/i> y <i>v<\/i>, imperfecto en <i>-aba<\/i>"}, {"enun": "El mensage del texto es bastante claro.", "requiere": [["mensaje"]], "modelo": "«El mensaje del texto es bastante claro»: <i>j<\/i> y <i>g<\/i>, sustantivo en <i>-aje<\/i>"}, {"enun": "No entiendo porqué lo hizo.", "requiere": [["no entiendo por que", "por que"]], "modelo": "«No entiendo por qué lo hizo»: palabras separadas, interrogativa indirecta"}, {"enun": "Ya e terminado la redacción.", "requiere": [["he"]], "modelo": "«Ya he terminado la redacción»: <i>h<\/i>, verbo <i>haber<\/i>"}], "criterio": "Las ocho faltas son de las siete familias del apartado 5: dos de concordancia (<i>la mayoría de la gente sabe<\/i>, <i>había muchas faltas<\/i>), tres de palabras que se separan (<i>a ver<\/i>, <i>sino<\/i>, <i>por qué<\/i>), una de <i>b<\/i> y <i>v<\/i>, una de <i>j<\/i> y <i>g<\/i> y una de <i>h<\/i>.", "pide": "la frase corregida", "apoyo": ["4 · La concordancia"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 11"}, {"tipo": "clasificar", "titulo": "Reparte estas faltas", "ayuda": "Doce faltas reales de redacciones. Ponlas en su casilla: así averiguas de qué familia son las tuyas.", "ops": ["b / v", "j / g", "h", "palabras separadas", "concordancia", "tildes"], "items": [{"enun": "escribió <i>tambien<\/i>", "sol": "tildes"}, {"enun": "escribió <i>la gente piensan<\/i>", "sol": "concordancia"}, {"enun": "escribió <i>deshechos<\/i> por residuos", "sol": "h"}, {"enun": "escribió <i>diálogo<\/i> sin tilde", "sol": "tildes"}, {"enun": "escribió <i>a ver<\/i> donde iba el verbo", "sol": "palabras separadas"}, {"enun": "escribió <i>habían muchas personas<\/i>", "sol": "concordancia"}, {"enun": "escribió <i>mensage<\/i>", "sol": "j / g"}, {"enun": "escribió <i>iva<\/i> por <i>iba<\/i>", "sol": "b / v"}, {"enun": "escribió <i>nobiembre<\/i>", "sol": "b / v"}, {"enun": "escribió <i>echo<\/i> por <i>hecho<\/i>", "sol": "h"}, {"enun": "escribió <i>sobretodo<\/i> por <i>especialmente<\/i>", "sol": "palabras separadas"}, {"enun": "escribió <i>garage<\/i>", "sol": "j / g"}], "criterio": "Doce faltas repartidas en seis casillas, dos por casilla. Con las tuyas no va a salir así: van a salir tres o cuatro en una sola, y esa concentración constituye la información que busca el ejercicio.<br><br>La séptima casilla —la palabra dudosa— no aparece aquí porque solo la conoces tú: la escribiste sin estar seguro.", "apoyo": ["4 · La concordancia"], "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartados 1 y 4: La relectura de dos minutos; La concordancia (p. 32 y 37) · ejercicios 11 y 12", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Simulacro del bloque 1", "meta": "35 minutos con reloj · léxico y resumen", "cuaderno": [{"nudo": 17, "apartados": [1, 2, 3], "ejercicios": [8]}, {"nudo": "A3", "apartados": ["el texto de partida de 2026"]}], "lectura": {"titulo": "Lo que se reparte además de libros", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>. Simulacro: haz las cuatro pasadas antes de bajar y no vuelvas a subir a mirar.", "lineas": ["La biblioteca del barrio abre a las nueve y a las nueve y diez ya no", "hay sitio. Lo cuenta Rubén Alcaide, que lleva once años detrás del", "mostrador y que ha visto cambiar tres veces lo que la gente viene a", "hacer aquí. Primero venían a leer, después a estudiar, y ahora, dice,", "vienen a muchas cosas a la vez.", "", "La sala grande tiene ochenta plazas. Por la mañana las ocupan", "opositores y estudiantes; a mediodía entran jubilados a leer el", "periódico; por la tarde llegan críos que salen del colegio y esperan a", "que sus padres acaben de trabajar.", "", "Hay cosas que ya no se piden. Los préstamos de novela han bajado a la", "mitad en diez años, y los de enciclopedias, a cero. Rubén las retiró", "él mismo y guardó dos por si acaso. Lo que ha subido es el uso de los", "ordenadores y, sobre todo, las preguntas.", "", "Esas preguntas son la parte que no aparece en ninguna estadística. La", "gente llega con un papel de la administración que no entiende, con una", "cita médica que hay que confirmar por internet o con un formulario que", "solo existe en versión digital. Rubén calcula que dedica dos horas al", "día a eso, y que ninguna de esas dos horas figura en su contrato.", "", "Cuando se lo comenta a quien manda, la respuesta suele ser que eso no", "es función de una biblioteca. Él contesta que puede ser, pero que la", "gente entra por esa puerta y no por otra, y que decirle que se", "equivoca de edificio no le resuelve el papel.", "", "Lo que pide es modesto y va en la misma dirección que lo anterior: que", "cuando se cuente lo que hace una biblioteca se cuente también esto,", "para que al repartir el presupuesto alguien sepa que aquí, además de", "libros, se reparte tiempo."], "pie": "Texto inventado. Ni Rubén Alcaide ni las cifras que da son reales."}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> las tres preguntas abiertas del bloque 1 suman <strong>2,5 puntos<\/strong> de los 3,5 del bloque; el punto restante es el léxico, que se estudia en el nudo 5. Dentro va el <strong>resumen<\/strong>, que valió <strong>1,25<\/strong> en 2026 y <strong>1,5<\/strong> en 2024 y 2025. Después de la redacción, ninguna otra pregunta concentra tantos puntos.<\/div>\n<h3>Nudo 17 · 1 · Cómo se lee un texto de examen<\/h3>\n<p>Leer un texto de examen consiste en <strong>localizar<\/strong>, porque las preguntas ya vienen escritas y cada una tiene su sitio en el papel; y, cuando la pregunta pide «qué problemas» o «qué factores», en <strong>reunir<\/strong> lo que está repartido: en 2026, los cuatro problemas de la pregunta 1.2 están en las líneas 13-17 y 29-35.<\/p>\n<p><strong>Las cuatro pasadas:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué hago<\/th>\n<th style=\"text-align: right;\">cuánto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · seguida<\/strong><\/td>\n<td>Leo entero sin parar y sin subrayar. Solo quiero saber de qué va<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2 · leo las preguntas<\/strong><\/td>\n<td>Antes de volver al texto, para saber qué busco en la pasada 3<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<tr>\n<td><strong>3 · localizo<\/strong><\/td>\n<td>Vuelvo al texto y <strong>anoto en el margen el número de la pregunta<\/strong> junto al trozo que la contesta<\/td>\n<td style=\"text-align: right;\">5 min<\/td>\n<\/tr>\n<tr>\n<td><strong>4 · el léxico<\/strong><\/td>\n<td>Busco las cuatro palabras del ejercicio de léxico y leo <strong>la frase entera<\/strong> donde están<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La pasada 2 casi nadie la hace, y ahorra después más trabajo que las otras tres. Leer las preguntas antes convierte la segunda lectura en una búsqueda.<\/p>\n<p><strong>El texto está construido casi siempre igual.<\/strong> En quince de las dieciséis convocatorias es un artículo de prensa —una columna de opinión o un reportaje—, y esos artículos se organizan casi siempre así:<\/p>\n<table>\n<thead>\n<tr>\n<th>dónde<\/th>\n<th>qué suele haber<\/th>\n<th>qué pregunta suele salir de ahí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>primer párrafo<\/strong><\/td>\n<td>la anécdota concreta o el caso<\/td>\n<td>«explique qué hecho…», «cuál es la anécdota»<\/td>\n<\/tr>\n<tr>\n<td><strong>párrafos centrales<\/strong><\/td>\n<td>los datos, los testimonios, los ejemplos<\/td>\n<td>«según X, ¿qué…?», «qué razones…»<\/td>\n<\/tr>\n<tr>\n<td><strong>último párrafo<\/strong><\/td>\n<td><strong>la idea general del autor<\/strong><\/td>\n<td>«cuál es la idea principal», «qué es lo más grave»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La respuesta a la pregunta de la idea principal está casi siempre en el último párrafo<\/strong>, y la de la anécdota, en el primero.<\/p>\n<p><strong>Las marcas que hay que hacer.<\/strong> Tres, y ninguna más: un texto subrayado entero es un texto sin subrayar.<\/p>\n<ol>\n<li><strong>El número de la pregunta<\/strong>, en el margen, junto al trozo que la contesta.<\/li>\n<li><strong>Un círculo<\/strong> en la palabra que no entiendo.<\/li>\n<li><strong>Una raya vertical<\/strong> al lado del párrafo donde está la idea general.<\/li>\n<\/ol>\n<h4>El texto de la convocatoria de 2026<\/h4>\n<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>\n<h3>Nudo 17 · 2 · Responder sin copiar<\/h3>\n<p>Las preguntas abiertas se corrigen con tres bandas oficiales, siempre las mismas:<\/p>\n<blockquote>\n<p>Respuesta clara y completa → <strong>todos los puntos<\/strong>\nRespuesta válida, pero con alguna imprecisión o falta de claridad → <strong>la banda intermedia<\/strong>: 0,5 en una pregunta de 0,75; 0,25 en una de 0,5\nRespuesta claramente deficiente → <strong>0<\/strong><\/p>\n<\/blockquote>\n<p>Y un cuarto dato de la clave: <em>«pueden otorgarse puntuaciones intermedias»<\/em>. No hay tres notas: hay una escala. Los criterios que siguen hacen bajar por ella.<\/p>\n<p><strong>Los quince criterios<\/strong>, destilados de las claves oficiales de las dieciséis convocatorias:<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\"><\/th>\n<th>criterio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>Contestar a menos de lo que pide.<\/strong> Si el enunciado pide dos datos («explique X <strong>y<\/strong> exponga Y») y solo se contesta una, la respuesta cae a la banda intermedia o más abajo<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td><strong>Contestar a más.<\/strong> Añadir lo que no se pregunta no suma: resta claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td><strong>Copiar literalmente<\/strong> el fragmento donde está la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td><strong>Responder con una palabra suelta<\/strong> o con una lista. Se pide una respuesta redactada<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td><strong>Contestar de memoria<\/strong>, con lo que uno sabe en vez de con lo que expone el texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td><strong>Atribuir al texto lo que no dice.<\/strong> La clave lo llama «malinterpretar» y es la única que va directa al 0<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td><strong>No indicar según quién.<\/strong> Si el enunciado indica «según Trenado», la respuesta va atribuida; si no lo indica, se atribuye al autor o a la autora del texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td><strong>Confundir el ejemplo con la idea.<\/strong> El texto pone ejemplos; la pregunta no los pide<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td><strong>No dar el número que se pide.<\/strong> «Qué <strong>dos<\/strong> factores» son dos, separados<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td><strong>Escribir una respuesta que no se entiende sin el texto delante<\/strong> («eso pasa porque él lo dice»): la respuesta tiene que sostenerse sola<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td><strong>Dejar pronombres sin antecedente<\/strong> dentro de la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td><strong>Meter opinión propia.<\/strong> No se pregunta qué opinas: eso es el bloque 3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td><strong>Usar metadiscurso vacío<\/strong>: «el autor nos habla de…». Ocupa palabras y no contesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td><strong>Desproporcionar la extensión.<\/strong> A 0,5 puntos no le corresponde media página; a 1,25, tampoco dos líneas<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td><strong>Las faltas cuentan aquí también<\/strong>: −0,10 por error, hasta −2 en los bloques 1 y 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo no copiar, en tres pasos.<\/strong> El criterio 3 se falla más que los otros catorce.<\/p>\n<table>\n<thead>\n<tr>\n<th>paso<\/th>\n<th>sobre el texto de 2026<\/th>\n<th>sobre otra columna de prensa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sustituir la palabra<\/strong><\/td>\n<td>«una inversión inicial desorbitada» → <em>un dinero inicial muy alto<\/em><\/td>\n<td>«una pasarela de tablones» → <em>un paso de madera<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Sustituir el verbo y con él la construcción<\/strong><\/td>\n<td>«los precios se han disparado» → <em>el precio ha subido muchísimo<\/em><\/td>\n<td>«ha perdido a la mitad de los clientes» → <em>su clientela se ha reducido a la mitad<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Resumir la cita en tus términos<\/strong><\/td>\n<td>«No hay relevo generacional. ¿Cómo va a haberlo?» → <em>el agricultor sostiene que nadie coge el testigo<\/em><\/td>\n<td>«no pasó de la primera pantalla» → <em>no consiguió completar la solicitud<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los nombres propios y los términos sin sinónimo se pueden repetir:<\/strong> <em>Trenado<\/em>, <em>Azuaga<\/em>, <em>pistacho<\/em>, <em>cubiertas vegetales<\/em>. El criterio 3 descuenta la copia de fragmentos, y la medida de clase para comprobarla es la misma que en el resumen del apartado 3: ninguna cadena de tres o más palabras seguidas del original, salvo esos nombres y términos.<\/p>\n<h3>Nudo 17 · 3 · El resumen<\/h3>\n<p><strong>La rúbrica oficial: cuatro niveles, no tres.<\/strong> Cópiala en el cuaderno.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">nivel<\/th>\n<th>qué exige<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\"><strong>1,5<\/strong><\/td>\n<td>recoge <strong>las ideas esenciales<\/strong>, de forma <strong>clara, ordenada y precisa<\/strong>, <strong>sin subjetividad<\/strong> y <strong>sin copia literal<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>1<\/strong><\/td>\n<td>recoge <strong>la mayoría<\/strong> de las esenciales, sin subjetividad ni copia, pero con algún fallo de precisión, claridad u orden<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0,5<\/strong><\/td>\n<td>fallos graves en las ideas esenciales, <strong>o<\/strong> no mantiene la objetividad, <strong>o<\/strong> copia literalmente, <strong>o<\/strong> se expresa con poca claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0<\/strong><\/td>\n<td>no recoge las ideas esenciales, malinterpreta el texto o está desordenado y confuso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Lee despacio la banda de 0,5: tiene <strong>cuatro «o»<\/strong>, y una sola basta para caer a un tercio de la nota. <strong>Copiar una frase baja a la misma banda que no haber entendido el texto.<\/strong> La rúbrica es la de 2025; en 2026 los niveles son 1,25 · 0,75 · 0,5 · 0, con los mismos descriptores.<\/p>\n<p><strong>Lo que no debe aparecer, seis elementos:<\/strong><\/p>\n<ol>\n<li><strong>Esquemas, guiones o listas con guiones.<\/strong> Se pide un texto redactado.<\/li>\n<li><strong>Ejemplos.<\/strong> El resumen se queda con la idea, no con el caso que la ilustra.<\/li>\n<li><strong>Opinión propia.<\/strong> «<em>Es muy triste que…<\/em>», «<em>a mi parecer…<\/em>»: eso es «marca de subjetividad».<\/li>\n<li><strong>Metadiscurso.<\/strong> «<em>El autor nos habla de…<\/em>» no resume nada. Si hay que atribuir una idea, se escribe «según el autor, …» y se sigue con el contenido.<\/li>\n<li><strong>Copia literal.<\/strong> El criterio oficial exige «sin copiar literalmente fragmentos del texto» y no fija cuántas palabras seguidas son un fragmento. La medida que usamos en clase para comprobarlo: ninguna cadena de tres o más palabras seguidas del original, salvo nombres propios y términos sin sinónimo.<\/li>\n<li><strong>Citas entrecomilladas.<\/strong> Si el original trae declaraciones, se pasan a <strong>estilo indirecto<\/strong> —contar lo dicho sin reproducir las palabras— y sin comillas.<\/li>\n<\/ol>\n<p><strong>Sobre la extensión.<\/strong> Se suele proponer un 25 % del original; el examen no fija porcentaje, fija puntos. Para estos textos (500-745 palabras), <strong>100-140 palabras<\/strong> funcionan.<\/p>\n<h3>Anexo A-3 · Texto de partida: «Un influencer agrícola»<\/h3>\n<blockquote>\n<p><strong>Convocatoria de 2026, serie 1.<\/strong> Es el texto sobre el que trabajan los ejercicios del nudo 17, y del que salen muchos de los ejemplos de los nudos 8, 9, 10 y 11. Está reproducido tal como salió en el examen, <strong>con la numeración de líneas de cinco en cinco<\/strong>, porque los enunciados oficiales se refieren a ella.<\/p>\n<p>Léelo con las cuatro pasadas del nudo 17. La forma antes que el contenido: <strong>cinco párrafos<\/strong>, la anécdota en el primero y la idea general en el último. Es el formato de quince de las dieciséis convocatorias.<\/p>\n<\/blockquote>\n<hr />\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<hr />\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1 — documento público de la Generalitat de Catalunya.<\/em><\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Simulacro: las tres preguntas de 2026", "dossier": {"cuaderno": "17", "ejercicio": 8, "parte": "1.1 a 1.3"}, "ayuda": "El bloque 1 entero, con el texto de 2026 delante y veinte minutos de reloj. El icono «texto» abre el artículo, que está también en la teoría. La pregunta 1.2 del examen llama David a Trenado; en el texto se llama Daniel.", "items": [{"enun": "«Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola? ¿Cómo se ejemplifica ese problema a través de su propia trayectoria profesional?» <b>[0,75]<\/b>", "conv": "2026", "modelo": "<i>Trenado sostiene que nadie toma el relevo porque montar una explotación desde cero exige una cantidad de dinero enorme para acabar cobrando el sueldo mínimo. Por eso casi todos los que entran lo hacen sobre tierras familiares. Él mismo es el ejemplo: estudió Biología, no se dedicaba al campo, y en 2017 se puso a trabajar las tierras de su familia; desde entonces se ha formado y ha buscado formas nuevas de sacarles rendimiento.<\/i>"}, {"enun": "«Además del relevo generacional, según David Trenado, ¿qué otros problemas tiene el sector agrícola en la actualidad?» <b>[1,25]<\/b>", "conv": "2026", "modelo": "Cuatro problemas: los vaivenes de precios, que estrechan tanto los márgenes que las cuentas solo salen con subvención; la competencia internacional de productos sujetos a controles más laxos, por ejemplo en pesticidas; los intermediarios, que se llevan parte del beneficio; y el clima impredecible, que reduce cosechas y dispara los precios, y con ellos se pierden mercados."}, {"enun": "«Diga qué dos factores se combinan para explicar el éxito de este agricultor, según el autor del texto.» <b>[0,5]<\/b>", "conv": "2026", "modelo": "Mantener lo tradicional e incorporar lo nuevo: sigue con métodos de siempre, como el tractor heredado y las cubiertas vegetales con especies autóctonas, y a la vez innova, con el GPS en ese mismo tractor y las redes sociales para vender y para defender el sector."}], "criterio": "La 1.2 pide los cuatro problemas redactados, no una lista con guiones: vale 1,25 y la clave de 2026 la corrige con la rúbrica del resumen, así que la copia literal y la opinión bajan la banda igual que en un resumen. En la 1.3, el tractor heredado con GPS reúne los dos factores a la vez: si se cita, se cita entero.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 1, "seccion": "El texto de la convocatoria de 2026"}, "apoyo": ["Nudo 17 · 1 · Cómo se lee un texto de examen", "El texto de la convocatoria de 2026"], "dossier_txt": "Del dossier: nudo 17, ejercicio 8 · 1.1 a 1.3", "texto_titulo": "El texto de la convocatoria de 2026", "texto_html": "<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><
