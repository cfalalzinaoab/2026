<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 5 · 8 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 5, "fecha": "2026-10-08", "tab": "Día 5 · 8 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 5", "h1": "Jueves 8 de octubre", "sub": "El hiato · cómo se defiende una opinión · el adjetivo", "carriles": [{"chapa": "Carril A", "titulo": "El hiato", "meta": "30 minutos · un tercio de todo lo que cae en el ejercicio de la tilde", "cuaderno": {"nudo": 2, "apartados": [2], "ejercicios": [3, 4, 5]}, "teoria": "<h3>2 · El hiato<\/h3>\n<blockquote>\n<p>De los <strong>34 ítems<\/strong> que han caído en el ejercicio de la tilde en dieciséis convocatorias, <strong>12 son hiatos<\/strong>: un tercio largo del total.<\/p>\n<\/blockquote>\n<h4>Qué es<\/h4>\n<p>El diptongo son dos vocales <strong>en la misma sílaba<\/strong>. El hiato hace lo contrario: dos vocales juntas que se pronuncian <strong>en sílabas distintas<\/strong>. <em>Te-a-tro<\/em> tiene tres sílabas; <em>ma-íz<\/em> tiene dos, y la <em>a<\/em> y la <em>i<\/em> están separadas.<\/p>\n<p>Hay tres clases, <strong>una de ellas con regla propia<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>ejemplos<\/th>\n<th>cómo se acentúa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>dos vocales <strong>iguales<\/strong><\/td>\n<td><em>cre-er<\/em>, <em>le-er<\/em>, <em>co-o-pe-ra-ti-va<\/em>, <em>chi-i-ta<\/em><\/td>\n<td>por las reglas generales<\/td>\n<\/tr>\n<tr>\n<td>dos abiertas <strong>distintas<\/strong><\/td>\n<td><em>te-a-tro<\/em>, <em>po-e-ta<\/em>, <em>ca-os<\/em>, <em>lí-ne-a<\/em><\/td>\n<td>por las reglas generales<\/td>\n<\/tr>\n<tr>\n<td><strong>abierta + cerrada tónica<\/strong>, o al revés<\/td>\n<td><em>ma-<\/em><em>í<\/em><em>z<\/em>, <em>ba-<\/em><em>ú<\/em><em>l<\/em>, <em>po-li-<\/em><em>cí<\/em><em>-a<\/em>, <em>ha-<\/em><em>bí<\/em><em>-a<\/em><\/td>\n<td><strong>siempre con tilde<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los dos primeros tipos no intervienen en la colocación de la tilde, pero sí en el recuento de sílabas, del que sale la clase de la palabra: se acentúan con las tres reglas del nudo 1. <em>Línea<\/em> lleva tilde por ser esdrújula, y esa clase se la da el hiato: <em>lí-ne-a<\/em> tiene tres sílabas, y si la <em>e<\/em> y la <em>a<\/em> fueran diptongo —<em>lí-nea<\/em>— sería llana y no la llevaría. <em>Teatro<\/em> y <em>caos<\/em>, en cambio, no llevan ninguna: <em>te-a-tro<\/em> es llana acabada en vocal y <em>ca-os<\/em>, llana acabada en -s.<\/p>\n<h4>El tercer tipo, el que cae en el examen<\/h4>\n<blockquote>\n<p><strong>Una vocal cerrada tónica —<em>í<\/em>, <em>ú<\/em>— junto a una vocal abierta lleva SIEMPRE tilde<\/strong>, aunque por las reglas generales no la llevaría. Y la tilde va sobre la cerrada, nunca sobre la abierta.<\/p>\n<\/blockquote>\n<p><strong>Por qué «siempre».<\/strong> Porque ahí la tilde no está marcando la fuerza: está marcando que <strong>hay dos sílabas y no una<\/strong>. Sin ella, <em>policia<\/em> se leería po-li-<b>cia<\/b>, con diptongo y una sílaba menos. Por escrito, solo la tilde indica que las dos vocales van en sílabas distintas.<\/p>\n<h4>Lo que comparten las doce<\/h4>\n<p>Estas son las doce palabras que han caído: <em>porquerías<\/em>, <em>leído<\/em>, <em>neumonía<\/em>, <em>refería<\/em>, <em>mayoría<\/em>, <em>distopías<\/em>, <em>mayoría<\/em>, <em>policía<\/em>, <em>minoría<\/em>, <em>lío<\/em>, <em>veían<\/em>, <em>había<\/em>.<\/p>\n<blockquote>\n<p><strong>Todas son llanas acabadas en vocal, en -s o en -n.<\/strong> Es decir: por las reglas generales, <strong>ninguna de las doce llevaría tilde<\/strong>. La llevan solo por el hiato.<\/p>\n<p>Al explicarlas hay que escribir <strong>«hiato»<\/strong>. «Llana acabada en vocal» sola es respuesta incorrecta, porque esa regla no da tilde; la clave de 2026 escribe las dos: «es una palabra llana acabada en vocal que debe acentuarse porque la tilde señala el hiato».<\/p>\n<\/blockquote>\n<p><strong>La comprobación:<\/strong> una <em>i<\/em> o una <em>u<\/em> junto a una <em>a<\/em>, una <em>e<\/em> o una <em>o<\/em>, y la fuerza cae sobre la <em>i<\/em> o sobre la <em>u<\/em>. Si eso ocurre, hay hiato y la vocal cerrada lleva tilde.<\/p>\n<p>La tilde de hiato <strong>cambia la palabra<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>sin tilde (diptongo)<\/th>\n<th>con tilde (hiato)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>hacia<\/em> — preposición<\/td>\n<td><em>hacía<\/em> — del verbo <em>hacer<\/em><\/td>\n<\/tr>\n<tr>\n<td><em>continuo<\/em> — adjetivo; <em>continuó<\/em> — él, con diptongo <em>uó<\/em><\/td>\n<td><em>continúo<\/em> — yo<\/td>\n<\/tr>\n<tr>\n<td><em>secretaria<\/em> — la persona<\/td>\n<td><em>secretaría<\/em> — la oficina<\/td>\n<\/tr>\n<tr>\n<td><em>sabia<\/em> — adjetivo<\/td>\n<td><em>sabía<\/em> — del verbo <em>saber<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "ejercicios": [{"tipo": "hueco", "titulo": "Los doce: pon la tilde", "dossier": {"cuaderno": "2", "ejercicio": 3, "parte": "la tilde"}, "ayuda": "Son todos los ítems de hiato de las dieciséis convocatorias, escritos sin tilde. Las doce llevan tilde: escríbelas con ella en la vocal que corresponde.", "estricto": true, "items": [{"enun": "<i>porquerias<\/i>", "conv": "2011", "sol": "porquerías", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>leido<\/i>", "conv": "2013", "sol": "leído", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>neumonia<\/i>", "conv": "2014", "sol": "neumonía", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>referia<\/i>", "conv": "2016", "sol": "refería", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>mayoria<\/i>", "conv": "2017", "sol": "mayoría", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>distopias<\/i>", "conv": "2018", "sol": "distopías", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>mayoria<\/i>", "conv": "2019", "sol": "mayoría", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>policia<\/i>", "conv": "2022", "sol": "policía", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>minoria<\/i>", "conv": "2023", "sol": "minoría", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>lio<\/i>", "conv": "2024", "sol": "lío", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>veian<\/i>", "conv": "2025", "sol": "veían", "porque": "hiato: la cerrada tónica va junto a una abierta"}, {"enun": "<i>habia<\/i>", "conv": "2026", "sol": "había", "porque": "hiato: la cerrada tónica va junto a una abierta"}], "criterio": "<i>Mayoría<\/i> ha caído dos veces, en 2017 y en 2019; y ninguna de las doce llevaría tilde por las reglas generales.", "apoyo": ["2 · El hiato", "Lo que comparten las doce"], "dossier_txt": "Del dossier: nudo 2, ejercicio 3 · la tilde"}, {"tipo": "justificar", "titulo": "Los doce hiatos", "ayuda": "Los doce proceden de exámenes reales. Vale cualquiera de las dos fórmulas oficiales: «ruptura del diptongo» o «hiato».", "items": [{"palabra": "<i>porquerías<\/i>", "conv": "2011", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "palabra llana acabada en vocal más -s que se acentúa para romper el diptongo, porque hay un hiato"}, {"palabra": "<i>leído<\/i>", "conv": "2013", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para señalar el hiato o la ruptura del diptongo"}, {"palabra": "<i>neumonía<\/i>", "conv": "2014", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para marcar el hiato o la ruptura del diptongo"}, {"palabra": "<i>refería<\/i>", "conv": "2016", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para marcar la ruptura del diptongo o la existencia del hiato"}, {"palabra": "<i>mayoría<\/i>", "conv": "2017", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para marcar la ruptura del diptongo o la presencia de un hiato"}, {"palabra": "<i>distopías<\/i>", "conv": "2018", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para marcar la ruptura del diptongo o la presencia de un hiato"}, {"palabra": "<i>mayoría<\/i>", "conv": "2019", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para marcar la ruptura del diptongo o la presencia de un hiato"}, {"palabra": "<i>policía<\/i>", "conv": "2022", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde porque se marca con ella la ruptura del diptongo, o se señala el hiato de una vocal débil y una vocal fuerte"}, {"palabra": "<i>minoría<\/i>", "conv": "2023", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde porque se marca con ella la ruptura del diptongo, o se señala el hiato de una vocal débil y una vocal fuerte"}, {"palabra": "<i>lío<\/i>", "conv": "2024", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "lleva tilde para señalar la ruptura del diptongo o la existencia de un hiato"}, {"palabra": "<i>veían<\/i>", "conv": "2025", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "es una palabra llana que debe acentuarse porque la tilde señala el hiato o la ruptura del diptongo"}, {"palabra": "<i>había<\/i>", "conv": "2026", "requiere": [["hiato", "ruptura del diptongo", "romper el diptongo"]], "modelo": "es una palabra llana acabada en vocal que debe acentuarse porque la tilde señala el hiato"}], "criterio": "En diez de los doce, la clave oficial recoge solo la razón de la tilde: el hiato o la ruptura del diptongo. En <i>veían<\/i> (2025) y en <i>había<\/i> (2026) añade además que es una palabra llana.<br><br><b>Por qué la diferencia.<\/b> Cuando la tilde es de regla general, la clase de palabra <b>es<\/b> la razón: <i>ojalá<\/i> lleva tilde por ser aguda y acabar en vocal. En un hiato no: <i>policía<\/i> es llana acabada en vocal, y una llana acabada en vocal no llevaría tilde. La lleva por el hiato, que es una razón aparte de su clase. Por eso las claves antiguas no nombraban la clase y las dos últimas la añaden como dato de más.<br><br>Aquí basta con la razón. Pero si añades la clase, cubres las dos maneras de redactarlo y no sobra nada.", "apoyo": ["Lo que comparten las doce"], "pide": "lleva tilde porque…", "dossier": {"cuaderno": "2", "ejercicio": 3, "parte": "la justificación"}, "dossier_txt": "Del dossier: nudo 2, ejercicio 3 · la justificación"}, {"tipo": "hueco", "titulo": "Con tilde cambia la palabra", "dossier": {"cuaderno": "2", "ejercicio": 4}, "ayuda": "Escribe la palabra que corresponde, con su tilde si la lleva. Al corregir, la clave indica si hay diptongo o hiato.", "estricto": true, "items": [{"enun": "Iba ______ el norte. <span class=\"terna\">(<i>hacia / hacía<\/i>)<\/span>", "sol": "hacia", "porque": "diptongo <i>ia<\/i>"}, {"enun": "Ella ______ los deberes por la noche. <span class=\"terna\">(<i>hacia / hacía<\/i>)<\/span>", "sol": "hacía", "porque": "hiato <i>í-a<\/i>"}, {"enun": "Es una mujer ______. <span class=\"terna\">(<i>sabia / sabía<\/i>)<\/span>", "sol": "sabia", "porque": "diptongo"}, {"enun": "Yo no ______ nada de esto. <span class=\"terna\">(<i>sabia / sabía<\/i>)<\/span>", "sol": "sabía", "porque": "hiato"}, {"enun": "Trabaja en la ______ del centro. <span class=\"terna\">(<i>secretaría / secretaria<\/i>)<\/span>", "sol": "secretaría", "porque": "hiato"}, {"enun": "Habló con la ______. <span class=\"terna\">(<i>secretaría / secretaria<\/i>)<\/span>", "sol": "secretaria", "porque": "diptongo"}], "apoyo": ["Lo que comparten las doce"], "dossier_txt": "Del dossier: nudo 2, ejercicio 4"}, {"tipo": "clasificar", "titulo": "¿Qué tipo de hiato?", "dossier": {"cuaderno": "2", "ejercicio": 5, "parte": "el tipo de hiato"}, "ayuda": "Diecis  "<i>pa-ís<\/i>: abierta átona + cerrada tónica, <b>tilde por el hiato<\/b>"}, {"enun": "<i>poeta<\/i>", "sol": "sin tilde", "porque": "<i>po-e-ta<\/i>: dos abiertas distintas, sin tilde (llana acabada en vocal)"}, {"enun": "<i>día<\/i>", "sol": "tilde por el hiato", "porque": "<i>dí-a<\/i>: cerrada tónica + abierta, <b>tilde por el hiato<\/b>"}, {"enun": "<i>aéreo<\/i>", "sol": "tilde por la regla general", "porque": "<i>a-é-re-o<\/i>: dos abiertas distintas, dos veces; la tilde es <b>por la regla general<\/b>, porque es esdrújula"}, {"enun": "<i>museo<\/i>", "sol": "sin tilde", "porque": "<i>mu-se-o<\/i>: dos abiertas distintas, sin tilde (llana acabada en vocal)"}, {"enun": "<i>cooperativa<\/i>", "sol": "sin tilde", "porque": "<i>co-o-pe-ra-ti-va<\/i>: dos abiertas iguales, sin tilde (llana acabada en vocal)"}, {"enun": "<i>oír<\/i>", "sol": "tilde por el hiato", "porque": "<i>o-ír<\/i>: igual, <b>tilde por el hiato<\/b>"}, {"enun": "<i>leer<\/i>", "sol": "sin tilde", "porque": "<i>le-er<\/i>: dos abiertas iguales, sin tilde (aguda acabada en -r)"}, {"enun": "<i>caos<\/i>", "sol": "sin tilde", "porque": "<i>ca-os<\/i>: dos abiertas distintas, sin tilde (llana acabada en -s)"}, {"enun": "<i>héroe<\/i>", "sol": "tilde por la regla general", "porque": "<i>hé-ro-e<\/i>: dos abiertas distintas; la tilde es <b>por la regla general<\/b>, porque es esdrújula"}, {"enun": "<i>reír<\/i>", "sol": "tilde por el hiato", "porque": "<i>re-ír<\/i>: abierta átona + cerrada tónica, <b>tilde por el hiato<\/b>"}], "criterio": "Solo el hiato de cerrada tónica y abierta tiene regla propia. Los de vocales iguales y los de abiertas distintas se acentúan por las reglas generales: <i>línea<\/i>, <i>aéreo<\/i> y <i>héroe<\/i> llevan tilde por esdrújulas, y <i>creer<\/i>, <i>teatro<\/i> o <i>museo<\/i> no la llevan.", "apoyo": ["2 · El hiato"], "dossier_txt": "Del dossier: nudo 2, ejercicio 5 · la tilde"}, {"tipo": "cazar", "titulo": "Caza los hiatos sin tilde", "ayuda": "Ocho palabras de este párrafo han perdido la tilde, y <b>todas la llevan por hiato<\/b>: una <i>i<\/i> o una <i>u<\/i> fuerte pegada a otra vocal. Por las reglas generales ninguna la llevaría. <b>Pincha en las que estén mal.<\/b>", "items": [{"texto": "La mayoria de los vecinos decia lo mismo: que en el pueblo ya no habia trabajo y que los jóvenes se iban. Un dia, un reportaje leido en la prensa contaba que la policia intervino en una protesta, y que una minoria seguia resistiendo con más ganas que medios.", "faltas": {"mayoria": "mayoría", "decia": "decía", "habia": "había", "dia": "día", "leido": "leído", "policia": "policía", "minoria": "minoría", "seguia": "seguía"}}], "criterio": "Los casos de <i>jóvenes<\/i> y de <i>más<\/i>: llevan la tilde puesta, pero <b>no por hiato<\/b>. <i>Jóvenes<\/i> es esdrújula, y <i>más<\/i>, adverbio de cantidad, lleva tilde diacrítica, que se estudia el 20 de octubre.<br><br>Las ocho que sí cuentan comparten un rasgo: <b>son llanas acabadas en vocal o en -s<\/b>, así que por las reglas del día 3 no llevarían ninguna. La llevan solo para partir el diptongo.", "apoyo": ["El tercer tipo, el que cae en el examen", "Lo que comparten las doce"], "solo_web": true}], "cuaderno_txt": "Nudo 2 · Vocales en contacto y la diéresis — apartado 2: El hiato (p. 13) · ejercicios 3, 4 y 5", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Cómo se defiende una opinión", "meta": "25 minutos · tesis, argumentos, concesión y cierre", "cuaderno": [{"nudo": 18, "apartados": [3], "ejercicios": [1, 3, 4, 7]}, {"nudo": 15, "apartados": [1, 2, 3], "ejercicios": [1, 2, 3, 4]}], "lectura": {"titulo": "El cajón de la entrada", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["El instituto de Sergi Ollé guarda los móviles en un cajón. Cada mañana,", "al entrar en clase, los veintiséis alumnos dejan el teléfono en una caja", "de plástico numerada, y la caja se cierra con llave hasta las dos y", "media. Lleva funcionando dos cursos. Sergi, que da Matemáticas, dice", "que al principio le pareció una tontería de las de siempre.", "", "Ahora defiende el cajón, aunque no por lo que él esperaba. Pensaba que", "mejorarían las notas y no sabe si han mejorado. Lo que ha cambiado,", "cuenta, es el recreo: antes el patio estaba en silencio y ahora hay", "ruido. «Volvieron a hablarse», resume, «y eso no lo medía yo en ningún", "examen».", "", "En contra del cajón hay razones que él mismo reconoce. Un móvil sirve", "para avisar de que llegas tarde, para consultar una palabra y para que", "una madre localice a su hija. Prohibirlo entero trata a los de", "diecisiete como a los de doce, y algunos profesores del centro siguen", "pensando que eso es faltarles al respeto.", "", "Sergi contesta a eso con una comparación que a él le vale. Dice que en", "su casa tampoco deja el portátil encima de la mesa mientras cenan, y", "que no se siente tratado como un niño por hacerlo. Es una regla que se", "pone uno para poder estar en otra cosa.", "", "Lo que él no sabe es si la regla aguantará cuando se vaya la directora", "que la puso. Las normas que dependen de una persona duran lo que dura", "esa persona, y esta lleva dos cursos."], "pie": "Texto inventado. Ni Sergi Ollé ni las cifras que da son reales."}, "teoria": "<h3>Nudo 18 · 3 · El argumentativo<\/h3>\n<p>La opción A del examen es un argumentativo en las dieciséis convocatorias. La opción A se elige más que la B y se falla más, y casi siempre por lo mismo: <strong>tienes una opinión y no la defiendes, la repites<\/strong>.<\/p>\n<p><strong>El formato de cien palabras.<\/strong> Tres partes, con su tamaño:<\/p>\n<table>\n<thead>\n<tr>\n<th>parte<\/th>\n<th style=\"text-align: right;\">palabras<\/th>\n<th>qué es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tesis<\/strong><\/td>\n<td style=\"text-align: right;\">15-20<\/td>\n<td>Una frase. Lo que sostengo, en afirmativo y <strong>discutible<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Argumentos<\/strong><\/td>\n<td style=\"text-align: right;\">60-70<\/td>\n<td><strong>Dos<\/strong> razones, cada una en dos o tres frases. Cada una con su conector<\/td>\n<\/tr>\n<tr>\n<td><strong>Cierre<\/strong><\/td>\n<td style=\"text-align: right;\">15-20<\/td>\n<td>La consecuencia de lo anterior. <strong>No<\/strong> la tesis repetida<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>1 · La tesis tiene que ser discutible.<\/strong> «La contaminación es un problema» no es una tesis: nadie lo discute, y quien la escribe se queda sin nada que defender. «Voy a hablar de las redes sociales» tampoco: anuncia el tema y no sostiene ninguna afirmación sobre él; en el primer texto, ese error se repite más que ningún otro. Una tesis admite que alguien la niegue.<\/p>\n<p><strong>2 · Un argumento no es un ejemplo.<\/strong> El argumento explica un mecanismo, <em>por qué<\/em> pasa algo. El ejemplo cuenta un caso concreto.<\/p>\n<blockquote>\n<p>«Mi vecino estudió de mayor y ahora está mejor» → <strong>ejemplo<\/strong>.\n«Estudiar de adulto cambia la relación con el trabajo, porque quien tiene un título puede elegir entre varios empleos y no aguantar cualquier condición en el único que tiene» → <strong>argumento<\/strong>.<\/p>\n<\/blockquote>\n<p>Un argumento sin ejemplo se sostiene, porque el mecanismo que explica vale para cualquier caso. Un ejemplo sin argumento no se sostiene, porque siempre se puede contestar «pues yo conozco otro caso», y ahí se acaba la discusión. Por eso el ejemplo va dentro del argumento, en media línea, como prueba de que el mecanismo existe: «Estudiar de adulto cambia la relación con el trabajo, porque quien tiene un título puede elegir entre varios empleos: mi vecina cambió de empresa a los cuarenta y cinco». En cien palabras caben dos argumentos y, como mucho, un ejemplo breve dentro de uno de ellos.<\/p>\n<p><strong>3 · Cada argumento entra con un conector.<\/strong> No por adorno: el corrector lee el conector para saber que hay dos y no uno repetido. Los cuatro momentos y sus conectores están en el <strong>nudo 15<\/strong>, con la lista completa.<\/p>\n<p><strong>4 · La concesión sube la nota más que ningún otro recurso.<\/strong> <em>Es cierto que… pero<\/em> quita la repetición y cambia el tono del texto en dos líneas. Tiene que cumplir dos condiciones: <strong>conceder una objeción real<\/strong>, la que pondría quien no está de acuerdo, y que detrás del <em>pero<\/em> haya algo <strong>distinto<\/strong> de lo que había antes del <em>es cierto<\/em>. Si se repite la tesis con otras palabras, no hay concesión, hay una frase larga.<\/p>\n<p><strong>5 · Las cinco partes, contadas.<\/strong> Un argumentativo de cien palabras lleva cinco partes: una <strong>tesis<\/strong> que alguien pueda negar (<em>la caza no se puede defender ni condenar en bloque<\/em> se puede negar; <em>voy a hablar de la caza<\/em>, no); <strong>dos argumentos<\/strong>, cada uno con su conector delante y con algo concreto dentro, un dato, un caso, un hecho que se pueda comprobar; una <strong>concesión<\/strong>, que reconoce lo que tiene de razón la postura contraria y empieza por <em>es cierto que<\/em>, <em>si bien<\/em> o <em>aunque<\/em>; y un <strong>cierre<\/strong> que saca la consecuencia de lo dicho. Cuando ya no hay faltas, lo que suele fallar es una parte ausente: ni concesión, ni cierre, o la tesis repetida al final. Se detecta contando las partes antes de dar el texto por acabado, porque cinco párrafos no garantizan cinco partes. De las cinco, la concesión falta más veces que ninguna otra.<\/p>\n<div class=\"enelexamen\"><strong>En el examen:<\/strong> el ejercicio 2.4, <em>escriba una expresión equivalente<\/em>, usa conectores como ítems de léxico. Valió 1 punto hasta 2023 y 0,75 desde 2024. Y en la redacción del bloque 3 los conectores son lo que el corrector lee para saber si hay dos argumentos o uno repetido: pesan en la banda de <strong>cohesión<\/strong> (0,75).<\/div>\n<blockquote>\n<p>Este nudo se completa en el segundo trimestre, con los deícticos y la anáfora. Aquí está <strong>la lista entera<\/strong>, ordenada por funciones, para que el día del examen sepas de qué fila sale cualquier conector que te pidan sustituir; y marcados con ● los que hacen falta para escribir cien palabras.<\/p>\n<\/blockquote>\n<h3>Nudo 15 · 1 · Qué es un conector<\/h3>\n<p>Un <strong>conector<\/strong> es una palabra o un grupo de palabras que une dos ideas y <strong>marca qué relación hay entre ellas<\/strong>. Con dos ideas parecidas, el conector decide la relación:<\/p>\n<blockquote>\n<p>«El campo da poco dinero, <strong>por eso<\/strong> nadie quiere empezar.» → relación de <strong>causa-consecuencia<\/strong>: la primera idea es la causa y la segunda, lo que se sigue de ella. El poco dinero explica que nadie empiece.\n«El campo da poco dinero, <strong>sin embargo<\/strong> hay quien empieza.» → relación de <strong>oposición<\/strong>: la segunda idea contradice lo que la primera hacía esperar. Con poco dinero lo esperable es que nadie empiece, y aun así alguien empieza.<\/p>\n<\/blockquote>\n<p>Las mismas dos ideas, dos textos distintos. Poner un conector de causa donde hay oposición —«El campo da poco dinero, por eso hay quien empieza»— es un error de construcción: las dos ideas quedan mal unidas, porque el poco dinero no explica que alguien empiece.<\/p>\n<h3>Nudo 15 · 2 · La lista completa<\/h3>\n<p>La tabla recoge las once funciones. La columna de la derecha marca las que vas a usar en las cien palabras del bloque 3: <strong>●<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\"><\/th>\n<th>función<\/th>\n<th>conectores<\/th>\n<th>ejemplo<\/th>\n<th style=\"text-align: center;\">●<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\"><strong>1<\/strong><\/td>\n<td><strong>Ordenar<\/strong><\/td>\n<td>en primer lugar · para empezar · por un lado · a continuación · por último<\/td>\n<td>«<strong>En primer lugar<\/strong>, no hay relevo generacional.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>2<\/strong><\/td>\n<td><strong>Añadir<\/strong><\/td>\n<td>además · asimismo · también · encima · por añadidura · a esto se añade que<\/td>\n<td>«Cuesta dinero. <strong>Además<\/strong>, cuesta tiempo.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>3<\/strong><\/td>\n<td><strong>Oponer<\/strong><\/td>\n<td>pero · sin embargo · no obstante · en cambio · ahora bien · por el contrario<\/td>\n<td>«Es duro; <strong>sin embargo<\/strong>, compensa.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>4<\/strong><\/td>\n<td><strong>Conceder<\/strong><\/td>\n<td>aunque · a pesar de que · si bien · es cierto que… pero<\/td>\n<td>«<strong>Aunque<\/strong> cuesta, merece la pena.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>5<\/strong><\/td>\n<td><strong>Causa<\/strong><\/td>\n<td>porque · ya que · puesto que · dado que · debido a · a causa de<\/td>\n<td>«Se abandona <strong>porque<\/strong> nadie la hereda.»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>6<\/strong><\/td>\n<td><strong>Consecuencia<\/strong><\/td>\n<td>por eso · por (lo) tanto · así que · así pues · en consecuencia · de modo que<\/td>\n<td>«No sale a cuenta; <strong>por eso<\/strong> se cierra.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>7<\/strong><\/td>\n<td><strong>Condición<\/strong><\/td>\n<td>si · siempre que · a no ser que · en caso de que<\/td>\n<td>«<strong>Si<\/strong> nadie lo cuida, se pierde.»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>8<\/strong><\/td>\n<td><strong>Finalidad<\/strong><\/td>\n<td>para · para que · con el fin de · a fin de que<\/td>\n<td>«Se subvenciona <strong>para que<\/strong> no se abandone.»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>9<\/strong><\/td>\n<td><strong>Ejemplificar<\/strong><\/td>\n<td>por ejemplo · así · en concreto · pongamos por caso<\/td>\n<td>«Hay ayudas; <strong>por ejemplo<\/strong>, la PAC.»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>10<\/strong><\/td>\n<td><strong>Aclarar<\/strong><\/td>\n<td>es decir · esto es · dicho de otro modo · en otras palabras<\/td>\n<td>«Es deficitario, <strong>es decir<\/strong>, pierde dinero.»<\/td>\n<td style=\"text-align: center;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\"><strong>11<\/strong><\/td>\n<td><strong>Cerrar<\/strong><\/td>\n<td>en definitiva · en conclusión · en resumen · para terminar<\/td>\n<td>«<strong>En definitiva<\/strong>, no es rentable.»<\/td>\n<td style=\"text-align: center;\"><strong>●<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dos avisos sobre esta tabla.<\/strong><\/p>\n<ul>\n<li><strong><em>O sea<\/em> no se escribe en un examen.<\/strong> Como muletilla es un marcador de conversación, y en la banda de <strong>registro<\/strong> (0,25) cuenta como tal; como equivalente de <em>es decir<\/em> es correcto pero informal, y la clave lo acepta en el ejercicio de equivalencias. En tu redacción, <em>es decir<\/em>.<\/li>\n<li><strong>La fila 4 no es la 3.<\/strong> Oponer es contraponer (<em>pero<\/em>): la segunda idea va contra lo que la primera hacía esperar, y las dos siguen siendo verdad —<em>es duro, pero compensa<\/em>—; conceder es <strong>darlo por bueno y girar igualmente<\/strong> (<em>aunque<\/em>, <em>es cierto que… pero<\/em>). La concesión está marcada con ● porque es el tercer movimiento de un argumentativo de cien palabras: dar por buena la objeción y girar.<\/li>\n<\/ul>\n<h3>Nudo 15 · 3 · Los que usarás en las cien palabras<\/h3>\n<p>Un argumentativo de cien palabras tiene cuatro momentos, y cada uno se abre con un conector. Son seis filas de las once:<\/p>\n<table>\n<thead>\n<tr>\n<th>momento del texto<\/th>\n<th style=\"text-align: center;\">de qué fila sale<\/th>\n<th>conectores que sirven<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>abrir el primer argumento<\/strong><\/td>\n<td style=\"text-align: center;\">1 · ordenar<\/td>\n<td><em>en primer lugar<\/em>, <em>para empezar<\/em>, <em>por un lado<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>abrir el segundo<\/strong><\/td>\n<td style=\"text-align: center;\">2 · añadir<\/td>\n<td><em>además<\/em>, <em>por otro lado<\/em>, <em>a esto se añade que<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>conceder y girar<\/strong><\/td>\n<td style=\"text-align: center;\">4 + 3<\/td>\n<td><em>es cierto que… pero<\/em>, <em>aunque<\/em>, <em>sin embargo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>cerrar<\/strong><\/td>\n<td style=\"text-align: center;\">6 + 11<\/td>\n<td><em>por eso<\/em>, <em>así pues<\/em>, <em>en definitiva<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las otras cinco funciones —causa, condición, finalidad, ejemplificar, aclarar— no desaparecen: aparecen <strong>dentro<\/strong> de los argumentos, no en las junturas. En cien palabras te caben dos argumentos y, como mucho, un ejemplo breve dentro de uno de ellos.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "El plan de tres líneas", "dossier": {"cuaderno": "18", "ejercicio": 1}, "items": [{"enun": "Escribe el plan de tres líneas (idea + dos razones + cierre) para la consigna de 2021, opción A, que pedía un texto argumentativo con tu opinión sobre la educación como medio para mejorar la vida de las personas. No escribas el texto: solo el plan.", "modelo": "Respuesta abierta. Tres planes modelo, debajo."}], "criterio": "Que la idea sea <b>una<\/b> y esté en una frase; que las razones sean <b>razones<\/b>, no ejemplos; y que el cierre no repita la idea con las mismas palabras.", "modelos": ["<i>Idea:<\/i> la educación mejora la vida antes que el sueldo. <i>Razones:<\/i> (1) quien ha estudiado entiende un contrato, una nómina o un informe médico sin que nadie se lo interprete; (2) con formación se puede elegir entre varios trabajos en lugar de aguantar el único que hay. <i>Cierre:<\/i> estudiar de adulto cambia la vida diaria antes que la cuenta corriente.", "<i>Idea:<\/i> la educación no garantiza un buen empleo, pero sin ella muchas puertas ni se abren. <i>Razones:<\/i> (1) casi todas las ofertas exigen un título mínimo; (2) quien lo tiene negocia condiciones y quien no lo tiene las acepta. <i>Cierre:<\/i> el título no da el sueldo, pero permite negociarlo.", "<i>Idea:<\/i> la educación mejora la vida de quien estudia y la de su familia. <i>Razones:<\/i> (1) los hijos de quien estudia tienen a alguien en casa que puede acompañarlos con los deberes; (2) una persona formada toma decisiones de salud y de dinero con menos riesgo. <i>Cierre:<\/i> lo que se aprende de adulto se reparte entre varios."], "apoyo": ["Nudo 18 · 3 · El argumentativo"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 1"}, {"tipo": "opcion", "titulo": "¿Qué apertura cumple mejor la banda de coherencia?", "dossier": {"cuaderno": "18", "ejercicio": 3}, "items": [{"enun": "De estas tres aperturas, ¿cuál cumple mejor la banda de coherencia?", "sol": "«Defender el trabajo agrícola no es proteger un oficio antiguo: es proteger lo que comemos.»", "porque": "enuncia una idea discutible en una sola frase: eso es una tesis, y a partir de ahí el texto tiene a dónde ir. «Voy a hablar del campo…» no sostiene ninguna afirmación: anuncia que va a hablar. «Mi abuelo tenía un huerto…» es el arranque de un narrativo: si la opción elegida es la A, obliga a un giro que en cien palabras no da tiempo; en la opción B sería la mejor de las tres", "ops": ["«Voy a hablar del campo, un tema muy interesante que tiene muchas cosas.»", "«Defender el trabajo agrícola no es proteger un oficio antiguo: es proteger lo que comemos.»", "«Mi abuelo tenía un huerto en el pueblo y yo iba de pequeño.»"]}], "apoyo": ["Nudo 15 · 3 · Los que usarás en las cien palabras"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 3"}, {"tipo": "clasificar", "titulo": "¿Sirve como tesis?", "dossier": {"cuaderno": "18", "ejercicio": 4}, "ayuda": "Cinco frases. Indica cuáles sirven como tesis y por qué no sirven las demás; al corregir, la clave explica cada caso.", "ops": ["sirve como tesis", "nadie la discute", "anuncia el tema", "es una constatación"], "items": [{"enun": "La contaminación es un problema.", "sol": "nadie la discute", "porque": "nadie lo discute: es un hecho aceptado. Se arregla añadiendo un juicio: «La contaminación es un problema de clase social, no solo de medio ambiente.»"}, {"enun": "Los pueblos pequeños ofrecen mejor vida que las ciudades.", "sol": "sirve como tesis", "porque": "es discutible: alguien puede sostener lo contrario"}, {"enun": "Voy a hablar sobre las redes sociales.", "sol": "anuncia el tema", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}, {"enun": "Prohibir el móvil en clase resuelve menos de lo que parece.", "sol": "sirve como tesis", "porque": "y además es buena: introduce un matiz, «menos de lo que parece», que ya apunta a los argumentos"}, {"enun": "Existen muchos tipos de trabajo agrícola.", "sol": "es una constatación", "porque": "no hay nada que defender"}], "apoyo": ["Nudo 18 · 3 · El argumentativo"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 4"}, {"tipo": "abierta", "titulo": "Reescríbelas para que sean tesis", "dossier": {"cuaderno": "18", "ejercicio": 7}, "ayuda": "Estas dos primeras frases no son tesis. Reescríbelas para que lo sean.", "items": [{"enun": "«La educación es importante.»", "modelo": "«<i>La educación importa más por lo que evita que por lo que consigue.<\/i>»"}, {"enun": "«Voy a hablar del campo.»", "modelo": "«<i>Defender el campo no es proteger un oficio antiguo: es proteger lo que comemos.<\/i>»"}], "criterio": "Que la frase nueva <b>pueda ser discutida por alguien<\/b>. La prueba rápida: si nadie de la clase puede decir «pues yo no lo veo así», no es una tesis.", "apoyo": ["Nudo 18 · 3 · El argumentativo"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 7"}, {"tipo": "clasificar", "titulo": "¿Qué función tiene el conector?", "dossier": {"cuaderno": "15", "ejercicio": 1}, "ayuda": "Indica la función del conector en negrita; al corregir, la clave da la fila de la tabla de la que sale.", "ops": ["ordenar", "añadir", "oponer", "conceder", "causa", "consecuencia", "condición", "finalidad", "ejemplificar", "aclarar", "cerrar"], "items": [{"enun": "«La lectura en papel es más lenta; <b>en cambio<\/b>, se recuerda mejor.»", "sol": "oponer", "porque": "fila 3 de la tabla"}, {"enun": "«No hay relevo, <b>de modo que<\/b> las tierras se quedan sin cultivar.»", "sol": "consecuencia", "porque": "fila 6 de la tabla"}, {"enun": "«<b>Si bien<\/b> el precio ha subido, la renta del agricultor no.»", "sol": "conceder", "porque": "fila 4 de la tabla"}, {"enun": "«Se marchan <b>porque<\/b> el sector apenas da para vivir.»", "sol": "causa", "porque": "fila 5 de la tabla"}, {"enun": "«Es un problema estructural, <b>es decir<\/b>, no se arregla con una subvención.»", "sol": "aclarar", "porque": "fila 10 de la tabla"}, {"enun": "«<b>Para empezar<\/b>, el alquiler se lleva la mitad del sueldo.»", "sol": "ordenar", "porque": "fila 1 de la tabla"}, {"enun": "«El turno de noche cansa; <b>además<\/b>, desordena las comidas.»", "sol": "añadir", "porque": "fila 2 de la tabla"}, {"enun": "«<b>Siempre que<\/b> entregues la solicitud a tiempo, te guardan la plaza.»", "sol": "condición", "porque": "fila 7 de la tabla"}, {"enun": "«Cambió de turno <b>con el fin de<\/b> estudiar por las mañanas.»", "sol": "finalidad", "porque": "fila 8 de la tabla"}, {"enun": "«Algunas facturas han subido este año; <b>en concreto<\/b>, la de la luz.»", "sol": "ejemplificar", "porque": "fila 9 de la tabla"}, {"enun": "«<b>En definitiva<\/b>, el piso está bien de precio, pero queda lejos de todo.»", "sol": "cerrar", "porque": "fila 11 de la tabla"}], "apoyo": ["Nudo 15 · 1 · Qué es un conector", "Nudo 15 · 2 · La lista completa"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 15, ejercicio 1"}, {"tipo": "abierta", "titulo": "Une las dos ideas con el conector que se pide", "dossier": {"cuaderno": "15", "ejercicio": 2}, "ayuda": "Une cada par de ideas en una sola oración con un conector de la función que se indica entre corchetes. Puntúa la juntura como pide el conector que elijas. Vale cualquier conector de la fila que se pide.", "items": [{"enun": "[causa] «Cerraron la panadería del barrio. / El alquiler del local subió un 40 %.»", "modelo": "«Cerraron la panadería del barrio <b>porque<\/b> el alquiler del local subió un 40 %.» (o <i>ya que<\/i>, <i>puesto que<\/i>)"}, {"enun": "[consecuencia] «El último tren sale a las diez. / Nos fuimos antes del final del concierto.»", "modelo": "«El último tren sale a las diez, <b>así que<\/b> nos fuimos antes del final del concierto.» (o <i>por eso<\/i>, <i>de modo que<\/i>)"}, {"enun": "[oposición] «El piso es luminoso. / Está lejos de la parada del metro.»", "modelo": "«El piso es luminoso, <b>pero<\/b> está lejos de la parada del metro.» (o «; <i>sin embargo<\/i>,», «; <i>en cambio<\/i>,»)"}, {"enun": "[concesión] «El curso es por la tarde. / Puedo compaginarlo con el trabajo.»", "modelo": "«<b>Aunque<\/b> el curso es por la tarde, puedo compaginarlo con el trabajo.» (o «<b>Es cierto que<\/b> el curso es por la tarde, <b>pero<\/b> puedo compaginarlo con el trabajo.»)"}, {"enun": "[condición] «Entregas la solicitud antes del viernes. / Te dan plaza en octubre.»", "modelo": "«<b>Si<\/b> entregas la solicitud antes del viernes, te dan plaza en octubre.» (o «<b>Siempre que<\/b> entregues…», «<b>En caso de que<\/b> entregues…»)"}, {"enun": "[finalidad] «Cambió el turno de noche. / Quería estudiar por las mañanas.»", "modelo": "«Cambió el turno de noche <b>para<\/b> estudiar por las mañanas.» (o «<b>con el fin de<\/b> estudiar», «<b>para que<\/b> le quedaran libres las mañanas»)"}, {"enun": "[ejemplificar] «Algunas facturas han subido este año. / La de la luz ha subido.»", "modelo": "«Algunas facturas han subido este año; <b>por ejemplo<\/b>, la de la luz.» (o <i>en concreto<\/i>, <i>así<\/i>)"}, {"enun": "[aclarar] «El contrato es indefinido. / No tiene fecha de fin.»", "modelo": "«El contrato es indefinido, <b>es decir<\/b>, no tiene fecha de fin.» (o <i>esto es<\/i>, <i>dicho de otro modo<\/i>)"}], "criterio": "El conector tiene que ser de la función pedida, y la puntuación tiene que ser la que ese conector exige. <i>Porque<\/i>, <i>aunque<\/i>, <i>si<\/i> y <i>para<\/i> se pegan a la oración sin punto y coma delante; <i>sin embargo<\/i>, <i>por ejemplo<\/i> y <i>es decir<\/i> van entre comas o detrás de punto y coma. Marcar una relación distinta de la pedida —<i>por eso<\/i> donde hay oposición— baja la banda de cohesión; una puntuación mal puesta en la juntura baja la misma banda, porque la puntuación se cuenta en cohesión.", "apoyo": ["Nudo 15 · 1 · Qué es un conector"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 15, ejercicio 2"}, {"tipo": "abierta", "titulo": "Añade los conectores", "dossier": {"cuaderno": "15", "ejercicio": 3}, "ayuda": "Cada fragmento tiene las ideas seguidas y ningún conector. Añádelos y reescríbelo. En cada uno se admiten conectores de funciones distintas; usa al menos dos funciones por fragmento.", "items": [{"enun": "«La sequía redujo la cosecha. Los precios del aceite se dispararon. A esos precios mucha gente dejó de comprarlo. Se pierden mercados.»", "modelo": "«La sequía redujo la cosecha y, <b>en consecuencia<\/b>, los precios del aceite se dispararon. <b>Puesto que<\/b> a esos precios mucha gente dejó de comprarlo, se pierden mercados.» → consecuencia, causa."}, {"enun": "«El piso está bien de precio. Está a cuarenta minutos del trabajo. Lo cogimos. No había nada más cerca por ese dinero.»", "modelo": "«<b>Aunque<\/b> el piso está a cuarenta minutos del trabajo, está bien de precio, <b>así que<\/b> lo cogimos: no había nada más cerca por ese dinero.» → concesión, consecuencia, y los dos puntos hacen de causa."}, {"enun": "«Estudiar de noche tiene dos inconvenientes. Se duerme poco. Se rinde menos al día siguiente. Los lunes lo nota todo el mundo. Conviene repartir las horas por la semana.»", "modelo": "«Estudiar de noche tiene dos inconvenientes. <b>En primer lugar<\/b>, se duerme poco; <b>además<\/b>, se rinde menos al día siguiente: los lunes, <b>por ejemplo<\/b>, lo nota todo el mundo. <b>En definitiva<\/b>, conviene repartir las horas por la semana.» → ordenar, añadir, ejemplificar, cerrar."}], "criterio": "En el fragmento de la sequía la <b>cadena causal<\/b> tiene que quedar marcada (<i>en consecuencia<\/i>, <i>de modo que<\/i>, <i>porque<\/i>); en el del piso, el giro entre el precio y la distancia (<i>aunque<\/i>, <i>sin embargo<\/i>) y la decisión que se sigue (<i>así que<\/i>); en el de estudiar de noche, el orden de los dos inconvenientes (<i>en primer lugar<\/i>, <i>además<\/i>), el ejemplo (<i>por ejemplo<\/i>) y el cierre (<i>en definitiva<\/i>). Da igual usar tres o cinco: ninguna juntura puede quedar sin conector, y ningún conector puede marcar una relación que no existe.", "apoyo": ["Nudo 15 · 1 · Qué es un conector"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 15, ejercicio 3"}, {"tipo": "abierta", "titulo": "Una concesión", "dossier": {"cuaderno": "15", "ejercicio": 4}, "items": [{"enun": "Escribe <b>una concesión<\/b>, una sola oración de 15 a 20 palabras, sobre esta tesis: «prohibir el móvil en clase resuelve menos de lo que parece».", "modelo": "Respuesta abierta. Tres concesiones modelo, debajo."}], "criterio": "Una concesión <b>da por buena la objeción y gira igualmente<\/b>. Si después del <i>pero<\/i> repites la tesis con otras palabras, no has concedido nada: has escrito lo mismo dos veces, y la repetición baja la banda de variación en lugar de subirla.", "modelos": ["«<b>Es cierto que<\/b> el móvil distrae en clase, <b>pero<\/b> el problema aparece igual en casa, donde nadie lo prohíbe.» (19 palabras)", "«<b>Aunque<\/b> prohibirlo mejore la atención durante la hora, no enseña a nadie a administrar su propio tiempo.» (17 palabras)", "«<b>Si bien<\/b> la medida es fácil de aplicar, resuelve el síntoma y deja intacta la costumbre.» (16 palabras)"], "palabras": {"min": 15, "max": 20}, "apoyo": ["Nudo 18 · 3 · El argumentativo", "Nudo 15 · 2 · La lista completa"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 15, ejercicio 4"}, {"tipo": "hueco", "titulo": "¿En qué línea está?", "ayuda": "Localiza en el texto las cuatro partes del argumentativo. Escribe solo el número de la línea donde empieza.", "items": [{"enun": "La <b>tesis<\/b> de Sergi: qué defiende ahora.", "sol": "6|7"}, {"enun": "El <b>argumento<\/b> con el que la defiende.", "sol": "7|8|9", "porque": "el cambio en el recreo, que es un mecanismo, no una anécdota"}, {"enun": "La <b>concesión<\/b>: donde reconoce la objeción de quien no está de acuerdo.", "sol": "11|12", "porque": "reconoce tres usos legítimos del móvil antes de girar"}, {"enun": "El <b>cierre<\/b>, con la idea general.", "sol": "20|21"}], "criterio": "Las cuatro partes aparecen en ese orden, el mismo del formato de cien palabras. Un texto de prensa ocupa más, pero se monta igual, y por eso sirve de modelo.", "apoyo": ["Nudo 18 · 3 · El argumentativo"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Argumento o ejemplo?", "ayuda": "Seis frases que podrían ir en una redacción sobre el móvil en clase.", "ops": ["argumento", "ejemplo"], "items": [{"enun": "Guardar el móvil obliga a buscar con quién hablar, y eso cambia el recreo.", "sol": "argumento", "porque": "explica un mecanismo"}, {"enun": "En el instituto de mi hermana lo quitaron el año pasado.", "sol": "ejemplo"}, {"enun": "Un profesor que conozco dice que su patio ha vuelto a tener ruido.", "sol": "ejemplo", "porque": "un caso: se contesta con otro caso"}, {"enun": "Mi sobrina me contó que en su clase nadie protestó.", "sol": "ejemplo"}, {"enun": "Si el móvil está a la vista, la atención se reparte aunque no se use.", "sol": "argumento"}, {"enun": "Una norma que depende de una sola persona se cae cuando esa persona se va.", "sol": "argumento"}], "criterio": "La prueba rápida: si a la frase se le puede contestar «pues yo conozco un caso distinto», es un ejemplo. Al argumento hay que contestarle con otro argumento; al ejemplo basta con oponerle otro caso.", "apoyo": ["Nudo 18 · 3 · El argumentativo"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Esto es una concesión?", "ayuda": "Las seis empiezan por <i>es cierto que<\/i>. Solo tres conceden algo.", "ops": ["concede", "no concede"], "items": [{"enun": "Es cierto que el móvil sirve para avisar en casa, <b>pero<\/b> para eso bastan dos minutos al salir.", "sol": "concede"}, {"enun": "Es cierto que el móvil distrae, <b>pero<\/b> es que distrae mucho.", "sol": "no concede", "porque": "detrás del <i>pero<\/i> está lo mismo, subrayado"}, {"enun": "Es cierto que algunos profesores están en contra, <b>pero<\/b> hay profesores que están en contra.", "sol": "no concede", "porque": "detrás del <i>pero<\/i> está exactamente lo mismo, con otro orden"}, {"enun": "Es cierto que hay que guardar el móvil, <b>pero<\/b> yo creo que hay que guardarlo.", "sol": "no concede", "porque": "repite la tesis con otras palabras"}, {"enun": "Es cierto que a los de diecisiete se les trata como a los de doce, <b>pero<\/b> una regla igual para todos es más fácil de sostener.", "sol": "concede"}, {"enun": "Es cierto que guardar el móvil no mejora las notas, <b>pero<\/b> cambia lo que pasa en el patio.", "sol": "concede"}], "criterio": "En las tres que conceden, delante del <i>pero<\/i> va una objeción real a la tesis, y detrás, una idea nueva. En las otras tres, delante y detrás está lo mismo.<br><br>La concesión cuenta como recurso sintáctico en la banda de variación y ocupa dos líneas. Se lleva preparada.", "apoyo": ["Nudo 18 · 3 · El argumentativo"], "solo_web": true}, {"tipo": "abierta", "titulo": "Escribe la concesión y el cierre · 5 minutos", "ayuda": "Sobre el texto de arriba. Dos frases: una concesión que conceda algo y un cierre que saque una consecuencia. Entre 30 y 40 palabras.", "items": [{"enun": "Tesis de partida: <i>guardar los móviles en clase mejora el centro, aunque no las notas<\/i>.", "modelo": "Dos modelos abajo."}], "modelos": ["<b>Es cierto que<\/b> prohibir el móvil a todos trata igual a uno de diecisiete que a uno de doce, <b>pero<\/b> una norma con excepciones se discute cada día y acaba sin cumplirse. <b>Por eso<\/b> conviene una regla igual para todos.", "<b>Es cierto que<\/b> el móvil sirve para avisar en casa de un imprevisto, <b>pero<\/b> esos avisos caben en los cinco minutos de la salida. <b>Así que<\/b> se pierde poco y se recupera un patio donde se vuelve a hablar."], "criterio": "Se comprueban tres condiciones. <b>Una:<\/b> que lo reconocido sea una objeción real a la tesis, no algo que ya defiendes. <b>Dos:<\/b> que detrás del <i>pero<\/i> haya una idea distinta. <b>Tres:<\/b> que el cierre saque una consecuencia y no repita la tesis; la tesis repetida cierra casi todos los primeros textos: con las mismas palabras cuenta como repetición en variación, y con otras deja el cierre sin consecuencia y baja la coherencia.", "palabras": {"min": 30, "max": 40}, "apoyo": ["Nudo 18 · 3 · El argumentativo"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 3: El argumentativo (p. 65) · ejercicios 1, 3, 4 y 7 · Nudo 15 · Los conectores — apartados 1, 2 y 3: Qué es un conector; La lista completa; Los que usarás en las cien palabras (p. 81 y 82) · ejercicios 1, 2, 3 y 4", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El adjetivo", "meta": "35 minutos · la casilla que más se falla del cuadro derivativo", "cuaderno": {"nudo": 8, "apartados": [3], "ejercicios": [10, 11, 12, 13]}, "teoria": "<h3>3 · El adjetivo: clasificación<\/h3>\n<p><strong>Qué es un adjetivo.<\/strong> La palabra que expresa una cualidad o una propiedad del sustantivo —<em>un fruto rentable<\/em>, <em>una poda delicada<\/em>, <em>un tractor heredado<\/em>— y que cambia de género y de número para concordar con él.<\/p>\n<p><strong>Cómo se reconoce.<\/strong> Concuerda con el sustantivo en género y número: <em>un fruto rentable<\/em>, <em>unos frutos rentables<\/em>, <em>una poda delicada<\/em>. Y admite <strong>muy<\/strong> delante o <strong>-ísimo<\/strong> detrás: <em>muy rentable<\/em>, <em>rentabilísimo<\/em>; los adjetivos de relación (<em>agrícola<\/em>) y algunos participios (<em>heredado<\/em>) no lo admiten y se reconocen porque concuerdan con el sustantivo. Esa comprobación separa el adjetivo del sustantivo cuando la palabra se parece: <em>muy<\/em> + adjetivo, <em>mucho<\/em> + sustantivo.<\/p>\n<p><strong>Las dos clases que hay que saber:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>especificativo<\/strong><\/th>\n<th><strong>explicativo (epíteto)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>dónde va<\/td>\n<td>detrás del sustantivo<\/td>\n<td>normalmente delante<\/td>\n<\/tr>\n<tr>\n<td>qué hace<\/td>\n<td><strong>restringe<\/strong>: separa unos de otros<\/td>\n<td><strong>no restringe<\/strong>: añade una cualidad sin separar a unos de otros; el epíteto (<em>la blanca nieve<\/em>) repite una que ya se le supone<\/td>\n<\/tr>\n<tr>\n<td>se puede quitar<\/td>\n<td>no, cambia el sentido<\/td>\n<td>sí, sin cambiar de quién se habla<\/td>\n<\/tr>\n<tr>\n<td>coma<\/td>\n<td>no<\/td>\n<td>sí, cuando va explicando entre comas<\/td>\n<\/tr>\n<tr>\n<td>ejemplo<\/td>\n<td><em>los pistachos<\/em> <strong>rentables<\/strong> (solo esos, no todos)<\/td>\n<td><em>la <\/em><em>blanca<\/em><em> nieve<\/em>, <em>el <\/em><em>bello<\/em><em> corzo<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Por qué importa esta distinción. Por la coma.<\/strong> Un adjetivo explicativo entre comas se puntúa; uno especificativo, no. Una coma mal puesta cambia a quién o a cuántos se refiere la frase, y se descuenta en la redacción por <em>cohesión<\/em>. La diferencia: «Los agricultores agotados por la sequía protestaron» significa que protestaron <strong>los agotados<\/strong>, no todos; «Los agricultores, agotados por la sequía, protestaron» significa que protestaron <strong>todos<\/strong>, y que todos estaban agotados. La misma frase, dos significados, y la diferencia está en dos comas. En el segundo trimestre esta misma distinción reaparece con las oraciones de relativo: <em>los alumnos que aprobaron<\/em> (solo unos) frente a <em>los alumnos, que aprobaron,<\/em> (todos).<\/p>\n<p><strong>Adjetivo o sustantivo.<\/strong> Un adjetivo con artículo o con otro determinante delante, y sin ningún sustantivo al que acompañar, pasa a funcionar como sustantivo: <em>blanco<\/em> es adjetivo en <em>un muro blanco<\/em> y sustantivo en <em>el blanco del ojo<\/em>; <em>joven<\/em> es adjetivo en <em>una agricultora joven<\/em> y sustantivo en <em>los jóvenes no encuentran tierra<\/em>; <em>pequeño<\/em> lo es en <em>un piso pequeño<\/em> y sustantivo en <em>el pequeño llora<\/em>. La prueba: si delante lleva artículo y detrás no hay sustantivo, funciona como sustantivo. Con el artículo neutro <em>lo<\/em> el adjetivo nombra una idea abstracta: <em>lo importante<\/em>, <em>lo fácil<\/em>, <em>lo preocupante<\/em>; y <em>lo<\/em> nunca va con un sustantivo («lo problema» no existe). El camino contrario también existe: un sustantivo pegado detrás de otro lo modifica sin dejar de ser sustantivo —es una aposición— y no cambia en plural: <em>un coche bomba, dos coches bomba<\/em>; <em>una palabra clave, varias palabras clave<\/em> (también <em>palabras claves<\/em>, porque ahí <em>clave<\/em> funciona como adjetivo).<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "El adjetivo de la misma raíz", "dossier": {"cuaderno": "8", "ejercicio": 10}, "ayuda": "Escribe el adjetivo de la misma raíz, en masculino singular. Las que llevan el año al lado son casillas reales del cuadro derivativo.", "estricto": true, "items": [{"enun": "<i>producción<\/i>", "conv": "2026", "sol": "producido|productivo", "porque": "la clave oficial de 2026 pedía el femenino: <i>producida<\/i>"}, {"enun": "<i>instalación<\/i>", "conv": "2026", "sol": "instalado", "porque": "en 2026 la casilla pedía el femenino: <i>instalada<\/i>"}, {"enun": "<i>oscuridad<\/i>", "conv": "2018", "sol": "oscuro"}, {"enun": "<i>resistencia<\/i>", "conv": "2015", "sol": "resistente"}, {"enun": "<i>riesgo<\/i>", "conv": "2016", "sol": "arriesgado|riesgoso", "porque": "no todos los adjetivos son participios: en <i>riesgo<\/i> → <i>arriesgado<\/i> hay un prefijo por medio"}, {"enun": "<i>error<\/i>", "conv": "2017", "sol": "erróneo", "porque": "cambia de forma"}, {"enun": "<i>sequía<\/i>", "sol": "seco"}, {"enun": "<i>esperanza<\/i>", "sol": "esperanzado|esperanzador", "porque": "también <i>esperanzador<\/i>"}, {"enun": "<i>valentía<\/i>", "sol": "valiente"}, {"enun": "<i>peligro<\/i>", "sol": "peligroso"}, {"enun": "<i>cuidado<\/i>", "sol": "cuidadoso"}, {"enun": "<i>tradición<\/i>", "sol": "tradicional"}, {"enun": "<i>juventud<\/i>", "sol": "joven|juvenil"}, {"enun": "<i>lluvia<\/i>", "sol": "lluvioso"}], "criterio": "Cuando el participio no suene, prueba con <i>-oso<\/i>, <i>-ente<\/i>, <i>-al<\/i>, <i>-able<\/i>: <i>peligroso<\/i>, <i>resistente<\/i>, <i>tradicional<\/i>.", "apoyo": ["3 · El adjetivo: clasificación"], "dossier_txt": "Del dossier: nudo 8, ejercicio 10"}, {"tipo": "clasificar", "titulo": "¿Especificativo o explicativo?", "dossier": {"cuaderno": "8", "ejercicio": 11}, "ayuda": "Clasifica el adjetivo en negrita. Al corregir, la clave lo justifica en media línea.", "ops": ["especificativo", "explicativo"], "items": [{"enun": "«un <b>bello<\/b> corzo»", "conv": "2020", "sol": "explicativo", "porque": "va delante y la belleza se le supone al corzo; se puede quitar"}, {"enun": "«este rentable fruto <b>seco<\/b>»", "conv": "2026", "sol": "especificativo", "porque": "distingue los frutos secos de los demás"}, {"enun": "el <b>frío<\/b> invierno", "sol": "explicativo", "porque": "el frío se le supone al invierno"}, {"enun": "«la <b>blanca<\/b> nieve»", "sol": "explicativo", "porque": "la nieve ya es blanca"}, {"enun": "la <b>dulce<\/b> miel", "sol": "explicativo", "porque": "la miel es dulce por definición"}, {"enun": "un contrato <b>temporal<\/b>", "sol": "especificativo", "porque": "distingue el contrato temporal del indefinido"}, {"enun": "«unos márgenes tan <b>estrechos<\/b>»", "conv": "2026", "sol": "especificativo", "porque": "no todos los márgenes son estrechos, solo esos"}, {"enun": "el <b>oscuro<\/b> túnel", "sol": "explicativo", "porque": "la oscuridad se le supone al túnel"}, {"enun": "los pisos <b>vacíos<\/b>", "sol": "especificativo", "porque": "solo los pisos que están vacíos, no todos"}, {"enun": "una calle <b>estrecha<\/b>", "sol": "especificativo", "porque": "no todas las calles son estrechas"}], "apoyo": ["3 · El adjetivo: clasificación"], "dossier_txt": "Del dossier: nudo 8, ejercicio 11"}, {"tipo": "clasificar", "titulo": "¿Adjetivo o sustantivo?", "dossier": {"cuaderno": "8", "ejercicio": 12}, "ayuda": "Indica si la palabra en negrita funciona como adjetivo o como sustantivo.", "ops": ["adjetivo", "sustantivo"], "items": [{"enun": "Compró un pastel <b>dulce<\/b>.", "sol": "adjetivo"}, {"enun": "Me gusta <b>lo dulce<\/b>.", "sol": "sustantivo", "porque": "adjetivo sustantivado con <i>lo<\/i>"}, {"enun": "<b>Los mayores<\/b> tienen preferencia en la cola.", "sol": "sustantivo"
