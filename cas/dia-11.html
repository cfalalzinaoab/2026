s distopías siguen teniendo público. Si pensamos que los K<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las asocian con la realidad ni que sea inconscientemente, hemos de concluir que el mundo sigue siendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muy oscuro.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Isabel Gómez Melenchón, <\/em>La Vanguardia. Culturas<em>, 16 de septiembre de 2017, tal como la imprimió la prueba de 2018. El examen añadía una nota al pie: <\/em>distopía<em>, representación ficticia de una sociedad futura de características negativas.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "La tesis y la concesión: lo que preocupa a los jóvenes", "dossier": {"cuaderno": "18", "ejercicio": 11}, "ayuda": "Escribe la tesis en una frase y, debajo, la concesión en una sola oración que empiece por <i>es cierto que<\/i> y siga con un <i>pero<\/i>.", "items": [{"enun": "Consigna de 2018, opción A: <i>su opinión sobre los temas sociales que preocupan a los jóvenes actuales<\/i>.", "modelo": "Tres modelos debajo, los de la clave del dossier."}], "criterio": "La primera parte de la concesión reconoce lo que tiene de razón la postura contraria, con un hecho cierto que va contra la tesis; detrás del <i>pero<\/i> va un dato distinto de la tesis. Si detrás del <i>pero<\/i> se repite la tesis con otras palabras, la oración no contiene ninguna concesión.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2018"}, "modelos": ["<b>Tesis:<\/b> «Creo que lo que más preocupa a los jóvenes es no poder independizarse.» <b>Concesión:<\/b> «Es cierto que muchos siguen viviendo con sus padres por comodidad, pero la mayoría no puede pagar un alquiler con lo que gana en su primer contrato.»", "<b>Tesis:<\/b> «Creo que los jóvenes están más preocupados por el clima que sus padres.» <b>Concesión:<\/b> «Es cierto que las encuestas miden lo que la gente declara y no lo que hace, pero son los jóvenes los que llenan las manifestaciones por el clima y no los adultos.»", "<b>Tesis:<\/b> «Creo que la precariedad laboral pesa más que cualquier otra preocupación.» <b>Concesión:<\/b> «Es cierto que hoy hay más empleo que en 2012, pero un contrato de tres meses no permite firmar una hipoteca ni planear un hijo.»"], "apoyo": ["2018 · La generación K"], "dossier_txt": "Del dossier: nudo 18, ejercicio 11", "texto_titulo": "2018 · La generación K", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La generación K, de Katniss, la heroína de Los juegos del hambre<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz, profesora del University College de Londres, inició en 2015 un estudio sobre los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes nacidos entre 1995 y 2015, a través de más de 2.000 entrevistas a adolescentes británicos y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">estadounidenses. El resultado se presentó en 2015 con la denominación de «Generación K: los nacidos<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">en un arco variable entre finales de los noventa y primeros 2000». Son los niños y adolescentes que han<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">crecido ya con la depresión económica, que no tienen recuerdos del 11-S porque eran bebés o aún no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">habían nacido, los que viven de una forma natural el mundo oscuro que tanto temor provocaba en sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hermanos mayores. Los K se identifican con la lucha por la supervivencia de los protagonistas de las<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">distopías* en boga, como por ejemplo, Katniss Everdeen, la heroína de Los juegos del hambre.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Hace un par de años, The New Yorker, en un extenso análisis sobre la inundación de distopías<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">para todos los públicos que llenaba las librerías, señalaba como primera y primordial diferencia que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los utópicos creen en el progreso y ofrecen promesas; los distópicos no creen en el progreso y lanzan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">advertencias.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La encuesta de Hertz venía a dar la razón a estos argumentos: el 72 % de los jóvenes entrevistados<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">admitía sentirse «profundamente ansioso» por el terrorismo, un 64 % de ellos se mostraba muy<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupado por el cambio climático, un 79 % mostraba su inquietud por encontrar un trabajo y un 72 %<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por endeudarse. Y si hablamos de confianza, mientras que el 60 % de los adultos creía que los grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">organismos u organizaciones cumplían su función, solo el 6 % de estos jóvenes lo pensaba.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz observó además que el factor tecnológico no es el determinante para definir a estos<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">jóvenes. Se trata más bien de la tormenta perfecta en la que han transcurrido sus años de formación, una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tormenta en la que convergen la peor depresión en décadas con un escenario geopolítico compartido<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por el terrorismo islamista, la austeridad impuesta y las revelaciones de WikiLeaks. La falta de confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en los adultos que mienten incluso de forma oficial nos lleva de nuevo a Katniss Everdeen, que fía su<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">supervivencia sólo a sí misma. Y para rematarlo, de la misma manera que en las distopías la pertenencia<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">a una casta concreta determina el futuro, estos jóvenes piensan que el color, la clase social y el género<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">marcarán también el suyo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Finalmente las encuestas, no sólo las de Hertz sino también las realizadas aquí, muestran que para<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los jóvenes la familia y los amigos son lo más importante. Para acabar, dos noticias, una buena y otra<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mala. La buena es que nuestra heroína es mujer, lo que dice mucho de la posición de estos jóvenes frente<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">a las cuestiones de género. La mala es que las distopías siguen teniendo público. Si pensamos que los K<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las asocian con la realidad ni que sea inconscientemente, hemos de concluir que el mundo sigue siendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muy oscuro.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Isabel Gómez Melenchón, <\/em>La Vanguardia. Culturas<em>, 16 de septiembre de 2017, tal como la imprimió la prueba de 2018. El examen añadía una nota al pie: <\/em>distopía<em>, representación ficticia de una sociedad futura de características negativas.<\/em><\/p>"}, {"tipo": "opcion", "titulo": "El vaciado: ¿entra o no entra?", "ayuda": "El enunciado pide <b>el problema<\/b> y <b>las razones<\/b>. Decide sobre cada bloque del texto de arriba.", "ops": ["entra", "no entra"], "items": [{"enun": "Que tomó un antiinflamatorio recetado por su médica", "sol": "no entra", "porque": "detalle clínico de su caso"}, {"enun": "Que la lista podría ordenarse por lo que empeora y no solo por fecha", "sol": "no entra", "porque": "es la propuesta del autor; el enunciado pide el problema y las razones"}, {"enun": "Que pidió cita en enero y la tuvo en octubre", "sol": "entra", "porque": "es el problema, y está en la primera línea"}, {"enun": "Que no hubo ninguna urgencia mal atendida: el sistema funcionó según lo previsto", "sol": "entra", "porque": "es parte del problema que plantea el texto: la espera hizo daño con todo funcionando"}, {"enun": "Que trabaja en un almacén y cambió de turno", "sol": "no entra", "porque": "detalle de su caso; ilustra, pero no es el problema ni una razón"}, {"enun": "Que ya está operada y la atendieron bien", "sol": "no entra", "porque": "es el cierre de la anécdota, no el problema"}, {"enun": "Que discutía con su pareja al cargar la compra", "sol": "no entra", "porque": "ilustra el problema con una escena; el resumen se queda con el problema"}, {"enun": "Que formar un traumatólogo lleva cinco años", "sol": "entra", "porque": "es una de las razones de que la lista no baje"}, {"enun": "Que perdió dos ascensos y un verano", "sol": "no entra", "porque": "son los ejemplos de la idea anterior, y la idea ya está dentro"}, {"enun": "Que su médica de cabecera acaba asumiendo el trabajo", "sol": "entra"}, {"enun": "Que la espera se mide en días y el paciente la vive con una vida encima", "sol": "entra"}], "criterio": "Las que no entran son todas verdaderas y todas interesantes. Quedan fuera porque el enunciado pedía dos datos concretos y ninguna de ellas aporta uno de los dos.<br><br>En esa decisión se aplica el paso 4 del método: <b>releer el enunciado y tachar lo que no pide<\/b>. Manda el enunciado, no el texto.", "apoyo": ["Anexo A-2 · El resumen, resuelto paso a paso"], "solo_web": true}, {"tipo": "hueco", "titulo": "¿En qué línea?", "ayuda": "Localiza en el texto el problema, las razones y la propuesta del final. Escribe el número de línea.", "items": [{"enun": "La primera línea donde aparece <b>el problema<\/b>", "sol": "1|2"}, {"enun": "La razón que da la médica de cabecera", "sol": "15|16"}, {"enun": "La razón por la que contratar más especialistas no resuelve pronto", "sol": "18|19"}, {"enun": "La propuesta con la que cierra el autor", "sol": "20|21"}], "criterio": "Las cuatro caen donde anunciaba la arquitectura: el problema arriba, las razones en medio, la propuesta al final. Con el problema, las razones y la propuesta localizados, el resumen de este texto se escribe en diez minutos.", "apoyo": ["Anexo A-2 · El resumen, resuelto paso a paso"], "solo_web": true}, {"tipo": "abierta", "titulo": "Las tres preguntas del paso 3", "ayuda": "Tres líneas, una por pregunta. Con el vaciado hecho, las tres líneas ocupan dos minutos.", "items": [{"enun": "¿De qué trata? · ¿Por qué se ha escrito? · ¿En qué insiste?", "modelo": "Un modelo abajo."}], "modelos": ["<b>De qué trata:<\/b> de una espera de nueve meses para ver al especialista, que se cumplió tal como estaba prevista.<br><b>Por qué se ha escrito:<\/b> para señalar que el sistema puede funcionar según lo previsto y aun así hacer daño.<br><b>En qué insiste:<\/b> en que la espera se mide en días y se vive en consecuencias, y que ese segundo dato no lo recoge nadie."], "criterio": "Si la segunda pregunta se contesta «para hablar de la sanidad», todavía no está. Un texto no se escribe sobre un tema: se escribe para sostener algo sobre ese tema, y el resumen tiene que recoger ese propósito.", "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1"], "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartados 3 y 4: El resumen; Seis textos reales, con su bloque 1 (p. 46 y 48) · ejercicio 10 · Nudo 18 · Escribir: el criterio — apartado 6: Las consignas reales (p. 74) · ejercicio 11 · Anexo A-2 · El resumen, resuelto paso a paso — el cuaderno: el resumen resuelto paso a paso", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los pronombres: práctica del banco", "meta": "30 minutos · todos los ítems reales de sustitución", "cuaderno": {"nudo": 9, "apartados": [3], "ejercicios": [8, 9]}, "teoria": "<h3>3 · Lo que se corrige antes de contestar<\/h3>\n<ol>\n<li><strong>Se contesta con el grupo de palabras completo<\/strong>, no con una palabra suelta.<\/li>\n<li><strong>Concordancia<\/strong>: si el pronombre es plural, la respuesta va en plural.<\/li>\n<li><strong>Los neutros (<em>lo, ello, eso<\/em>) avisan de oración.<\/strong> Si buscas un sustantivo y no aparece, deja de buscarlo.<\/li>\n<li><strong>No se justifica.<\/strong> El enunciado es «indique a qué palabra o palabras sustituyen». Se indica y nada más: escribir de más gasta tiempo y no suma nada.<\/li>\n<\/ol>\n<p><strong>Dos trampas que aparecen todos los años:<\/strong><\/p>\n<ul>\n<li><strong><em>Lo<\/em> no siempre es pronombre.<\/strong> Delante de un adjetivo es <strong>artículo neutro<\/strong>: <em>lo importante<\/em>, <em>lo preocupante<\/em>, <em>lo cierto<\/em>. Ahí no sustituye a nada.<\/li>\n<li><strong>La misma forma, dos clases.<\/strong> <em>Los<\/em>, <em>la<\/em>, <em>este<\/em>, <em>aquel<\/em>, <em>mucho<\/em> son determinante si llevan sustantivo detrás y pronombre si van solos. La pregunta no cambia.<\/li>\n<\/ul>\n<p><strong>Por qué se pregunta esto.<\/strong> El ejercicio mide si has entendido el texto, más que si sabes gramática. Un pronombre solo se puede resolver leyendo lo que hay antes, así que acertarlo demuestra que has seguido el hilo. Por eso cae quince de dieciséis años y por eso vale tanto para lo poco que ocupa: dos o tres palabras escritas. De ahí sale el procedimiento: <strong>haz este ejercicio después de leer el texto entero<\/strong>, no mientras lo lees. El antecedente puede estar tres líneas antes o en el párrafo anterior, y si vas frase a frase no lo localizas.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "Determinante, pronombre o artículo neutro", "dossier": {"cuaderno": "9", "ejercicio": 8}, "ayuda": "Tres opciones para la palabra en negrita: determinante, pronombre o artículo neutro. Las cinco frases son de exámenes oficiales.", "ops": ["determinante", "pronombre", "artículo neutro"], "items": [{"enun": "«<b>Lo<\/b> más preocupante es nuestra costumbre en la mirada»", "conv": "2021", "sol": "artículo neutro", "porque": "va delante del adjetivo <i>preocupante<\/i> y no sustituye a nada"}, {"enun": "«Aun antes de saber que el paludismo <b>lo<\/b> transmitía un mosquito»", "conv": "2021", "sol": "pronombre", "porque": "sustituye a <i>el paludismo<\/i>"}, {"enun": "«<b>Los<\/b> pistachos que cultivan los socios»", "conv": "2026", "sol": "determinante", "porque": "acompaña a <i>pistachos<\/i>"}, {"enun": "«<b>lo<\/b> cierto es que adoraba a todos los bichos»", "conv": "2020", "sol": "artículo neutro", "porque": "va delante del adjetivo <i>cierto<\/i>"}, {"enun": "«<b>Los<\/b> obliga a ser fanfarrones de opereta»", "conv": "2023", "sol": "pronombre", "porque": "sustituye a <i>los hombres<\/i>"}], "criterio": "<i>Lo más preocupante<\/i> y <i>lo cierto<\/i> llevan <i>lo<\/i> delante de un adjetivo: es artículo neutro y no sustituye a nada. El pronombre ocupa el lugar de algo que ya ha aparecido: <i>el paludismo<\/i> en la frase de 2021 y <i>los hombres<\/i> en la de 2023.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 9, ejercicio 8"}, {"tipo": "hueco", "titulo": "Escribe la clase de la palabra en negrita", "dossier": {"cuaderno": "9", "ejercicio": 9}, "ayuda": "Catorce palabras en negrita, repartidas en las oraciones del dossier: cada oración aparece tantas veces como palabras marcadas trae, con una sola en negrita cada vez. Escribe el nombre de la clase: sustantivo, adjetivo, determinante, pronombre, verbo, adverbio, preposición, conjunción o interjección.", "estricto": true, "items": [{"enun": "«Suelo escribir <b>cuando<\/b> algo me cabrea, pero apenas lo publico.»", "sol": "conjunción|conjunción temporal|conjunción subordinante", "porque": "une dos oraciones, y va sin tilde porque no pregunta nada"}, {"enun": "«Suelo escribir cuando algo <b>me<\/b> cabrea, pero apenas lo publico.»", "sol": "pronombre|pronombre personal|pronombre personal átono", "porque": "pronombre personal átono"}, {"enun": "«Suelo escribir cuando algo me cabrea, <b>pero<\/b> apenas lo publico.»", "sol": "conjunción|conjunción adversativa", "porque": "conjunción adversativa"}, {"enun": "«Suelo escribir cuando algo me cabrea, pero <b>apenas<\/b> lo publico.»", "sol": "adverbio|adverbio de cantidad|adverbio de negación", "porque": "modifica al verbo <i>publico<\/i>"}, {"enun": "«Suelo escribir cuando algo me cabrea, pero apenas <b>lo<\/b> publico.»", "sol": "pronombre|pronombre personal", "porque": "sustituye a lo que escribe"}, {"enun": "«<b>Aquella<\/b> tarde nadie abrió la puerta, aunque llamamos tres veces.»", "sol": "determinante|determinante demostrativo", "porque": "determinante demostrativo: acompaña a <i>tarde<\/i>"}, {"enun": "«Aquella tarde <b>nadie<\/b> abrió la puerta, aunque llamamos tres veces.»", "sol": "pronombre|pronombre indefinido", "porque": "pronombre indefinido: va solo"}, {"enun": "«Aquella tarde nadie abrió la puerta, <b>aunque<\/b> llamamos tres veces.»", "sol": "conjunción|conjunción concesiva", "porque": "conjunción concesiva"}, {"enun": "«Aquella tarde nadie abrió la puerta, aunque llamamos <b>tres<\/b> veces.»", "sol": "determinante|determinante numeral", "porque": "determinante numeral: acompaña a <i>veces<\/i>"}, {"enun": "«<b>Mi<\/b> casero nos avisó tarde, y el recibo llegó sin sello.»", "sol": "determinante|determinante posesivo", "porque": "determinante posesivo: acompaña a <i>casero<\/i>"}, {"enun": "«Mi casero <b>nos<\/b> avisó tarde, y el recibo llegó sin sello.»", "sol": "pronombre|pronombre personal|pronombre personal átono", "porque": "pronombre personal átono"}, {"enun": "«Mi casero nos avisó <b>tarde<\/b>, y el recibo llegó sin sello.»", "sol": "adverbio|adverbio de tiempo", "porque": "adverbio de tiempo: modifica a <i>avisó<\/i>"}, {"enun": "«Mi casero nos avisó tarde, <b>y<\/b> el recibo llegó sin sello.»", "sol": "conjunción|conjunción copulativa", "porque": "conjunción copulativa"}, {"enun": "«Mi casero nos avisó tarde, y el recibo llegó <b>sin<\/b> sello.»", "sol": "preposición", "porque": "une <i>llegó<\/i> con <i>sello<\/i>"}], "criterio": "Se corrige también la tilde de la clase: <i>preposición<\/i>, <i>conjunción<\/i> e <i>interjección<\/i> la llevan; <i>adjetivo<\/i> y <i>adverbio<\/i> no.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 9, ejercicio 9"}, {"tipo": "justificar", "titulo": "¿A qué sustituye? · tanda larga", "ayuda": "El antecedente suele estar en la oración anterior, no al lado. Escribe el grupo <b>entero<\/b>, no la palabra suelta.", "items": [{"palabra": "<i>la<\/i>", "enun": "«El ayuntamiento aprobó en marzo una ayuda para cambiar las ventanas de los pisos más antiguos del barrio. Seis meses después, casi nadie <b>la<\/b> había pedido.»", "requiere": [["ayuda"], ["ventanas"]], "modelo": "una ayuda para cambiar las ventanas de los pisos más antiguos del barrio"}, {"palabra": "<i>lo<\/i>", "enun": "«La empresa anunció que el turno de noche se pagaría un veinte por ciento más a partir de enero. En la reunión de diciembre, nadie <b>lo<\/b> recordaba.»", "requiere": [["turno"], ["noche"], ["pagaría", "pagaria", "pagar", "paga"]], "modelo": "que el turno de noche se pagaría un veinte por ciento más"}, {"palabra": "<i>les<\/i>", "enun": "«Los repartidores de la zona norte llevan dos años pidiendo una sala donde comer. La dirección <b>les<\/b> ha contestado siempre lo mismo: que no hay espacio.»", "requiere": [["repartidores"], ["norte"]], "modelo": "a los repartidores de la zona norte"}, {"palabra": "<i>las<\/i>", "enun": "«Guardó durante todo el año las facturas de la luz, las del gas y las del agua, en una carpeta encima de la nevera. Cuando llegó la reclamación, <b>las<\/b> revisó una por una.»", "requiere": [["facturas"], ["luz", "gas", "agua"]], "modelo": "las facturas de la luz, del gas y del agua"}, {"palabra": "<i>eso<\/i>", "enun": "«Cerraron la biblioteca del barrio en julio y no la volvieron a abrir en septiembre, como habían prometido. Por <b>eso<\/b> los vecinos se organizaron.»", "requiere": [["cerraron", "cerrar", "cerró", "cerro"], ["biblioteca"]], "modelo": "que cerraron la biblioteca del barrio y no la volvieron a abrir"}, {"palabra": "<i>ello<\/i>", "enun": "«Aprendió a leer una nómina a los cuarenta y dos años, en un curso de dos tardes por semana. Con <b>ello<\/b> dejó de tener que preguntar en casa cada mes.»", "requiere": [["aprend"], ["nómina", "nomina"]], "modelo": "haber aprendido a leer una nómina"}, {"palabra": "<i>lo<\/i>", "enun": "«El instituto mandó un correo con los plazos de matrícula, pero lo envió a la dirección antigua de las familias. Muchas <b>lo<\/b> leyeron en octubre.»", "requiere": [["correo"], ["plazos", "matrícula", "matricula"]], "modelo": "el correo con los plazos de matrícula"}, {"palabra": "<i>que<\/i>", "enun": "«Al final del artículo aparecen los problemas de horario <b>que<\/b> tiene quien trabaja a turnos partidos.»", "requiere": [["problemas"], ["horario"]], "modelo": "los probl <script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;

    cuerpo.innerHTML = '';

    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });

  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
    });
    return nodo;
  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');
        h3 = tit;
      }
      out.push({ titulo: tit, html: cuerpo, padre: es3 ? null : h3 });
    }
    return out;
  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();

      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
