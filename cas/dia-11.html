<script>window.DIA = {"dia": 11, "fecha": "2026-11-03", "tab": "Día 11 · 3 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 11", "h1": "Martes 3 de noviembre", "sub": "J y G · el vaciado del resumen · los pronombres, práctica del banco", "carriles": [{"chapa": "Carril A", "titulo": "J y G", "meta": "30 minutos · el problema existe solo delante de e y de i", "cuaderno": {"nudo": 4, "apartados": [3], "ejercicios": [6, 7, 8]}, "teoria": "<h3>3 · J y G<\/h3>\n<p>El problema existe <strong>solo delante de e y de i<\/strong>. Delante de <em>a<\/em>, <em>o<\/em>, <em>u<\/em> no hay ninguna duda: <em>ja, jo, ju<\/em> suenan /j/ y <em>ga, go, gu<\/em> suenan /g/.<\/p>\n<p>Delante de <em>e<\/em> e <em>i<\/em>:<\/p>\n<ul>\n<li>el sonido /j/ se escribe <strong>je, ji<\/strong> <em>o<\/em> <strong>ge, gi<\/strong>: <em>jefe<\/em>, pero <em>gente<\/em>. La duda se concentra en esas dos sílabas.<\/li>\n<li>el sonido /g/ se escribe <strong>gue, gui<\/strong> (con u muda) o <strong>güe, güi<\/strong> si la u suena (nudo 2, apartado 3).<\/li>\n<\/ul>\n<p><strong>Se escribe G:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>gen-<\/strong> y <strong>-gen<\/strong><\/td>\n<td>gente, general, genio, generación, imagen, origen, oxígeno, inteligencia · <em>excepto ajeno, ajena, berenjena, avejentar<\/em><\/td>\n<\/tr>\n<tr>\n<td>verbos en <strong>-ger, -gir, -igerar<\/strong><\/td>\n<td>coger, recoger, escoger, proteger, elegir, dirigir, exigir, refrigerar · <strong>excepto tejer y crujir<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>-gía, -gio, -gión, -gioso, -logía, -gogía<\/strong><\/td>\n<td>biología, tecnología, psicología, analogía, colegio, región, prodigio, religioso, pedagogía · <em>excepto lejía, herejía, bujía y apoplejía<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Se escribe J:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>regla<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>si el infinitivo lleva <strong>j<\/strong><\/td>\n<td>trabajar → traba<strong>j<\/strong>é, traba<strong>j<\/strong>emos; dibujar → dibu<strong>j<\/strong>é<\/td>\n<\/tr>\n<tr>\n<td>si el infinitivo <strong>no lleva ni g ni j<\/strong><\/td>\n<td>traer → <strong>traje, trajeron<\/strong>; decir → <strong>dije, dijimos<\/strong>; conducir → <strong>conduje<\/strong>; producir → <strong>produje<\/strong>; traducir → <strong>traduje<\/strong>. <em>Nunca «condugeron».<\/em><\/td>\n<\/tr>\n<tr>\n<td>sustantivos en <strong>-aje, -eje<\/strong><\/td>\n<td>paisaje, lenguaje, aprendizaje, viaje, personaje, coraje, mestizaje, garaje, hereje<\/td>\n<\/tr>\n<tr>\n<td><strong>-jero, -jera<\/strong><\/td>\n<td>extranjero, callejera, relojero, mensajero<\/td>\n<\/tr>\n<tr>\n<td><strong>-jería<\/strong><\/td>\n<td>extranjería, cerrajería, relojería<\/td>\n<\/tr>\n<tr>\n<td><strong>-jear<\/strong><\/td>\n<td>hojear, canjear, forcejear<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La trampa catalana de este apartado:<\/strong> en catalán esas palabras acaban en <strong>-tge<\/strong>: <em>paisatge, viatge, llenguatge, missatge, personatge, aprenentatge<\/em>. En castellano es <strong>-aje<\/strong>: con j y sin t.<\/p>\n<p><strong>El cambio de letra al conjugar no es una excepción.<\/strong> <em>Coger<\/em> se escribe con g, pero <em>cojo<\/em> y <em>coja<\/em> con j, porque delante de <em>o<\/em> y <em>a<\/em> la g tendría el sonido de <em>gato<\/em>. Igual: <em>dirigir<\/em> → <em>dirijo, dirija<\/em>; <em>proteger<\/em> → <em>protejo, proteja<\/em>. La palabra no cambia de regla: mantiene el sonido.<\/p>\n<p><strong>Dos «excepciones» que no lo son.<\/strong> <em>Protege<\/em> y <em>ligero<\/em> se dan a menudo como excepciones a <em>-aje<\/em> y a <em>-jero<\/em>. Ninguna de las dos acaba en eso: acaban en <em>-ege<\/em> y en <em>-ero<\/em>. <em>Protege<\/em> sigue la regla de los verbos en <em>-ger<\/em>, y <em>ligero<\/em> no cae en ninguna regla de j.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿G o j?", "dossier": {"cuaderno": "4", "ejercicio": 6}, "ayuda": "Elige la letra que falta. Las palabras con un año entre paréntesis aparecen en textos de la prueba; las que no lo llevan se han añadido aquí.", "ops": ["g", "j"], "items": [{"enun": "<i>inteli_encia<\/i> (2023)", "sol": "g", "porque": "<i>gen-<\/i>"}, {"enun": "<i>reco_er<\/i> (2011)", "sol": "g", "porque": "verbo en <i>-ger<\/i>"}, {"enun": "<i>cole_io<\/i> (2014)", "sol": "g", "porque": "<i>-gio<\/i>"}, {"enun": "<i>psicolo_ía<\/i> (2013)", "sol": "g", "porque": "<i>-logía<\/i>"}, {"enun": "<i>_ente<\/i> (2014)", "sol": "g", "porque": "<i>gen-<\/i>"}, {"enun": "<i>mensa_ero<\/i>", "sol": "j", "porque": "<i>-jero<\/i>"}, {"enun": "<i>via_e<\/i> (2017)", "sol": "j", "porque": "sustantivo en <i>-aje<\/i>"}, {"enun": "<i>ori_en<\/i> (2022)", "sol": "g", "porque": "<i>-gen<\/i>"}, {"enun": "<i>biolo_ía<\/i> (2025)", "sol": "g", "porque": "<i>-logía<\/i>"}, {"enun": "<i>ho_ear<\/i>", "sol": "j", "porque": "verbo en <i>-jear<\/i>"}, {"enun": "<i>aprendiza_e<\/i> (2013)", "sol": "j", "porque": "sustantivo en <i>-aje<\/i>"}, {"enun": "<i>ele_ir<\/i> (2001)", "sol": "g", "porque": "verbo en <i>-gir<\/i>"}, {"enun": "<i>cerra_ería<\/i>", "sol": "j", "porque": "<i>-jería<\/i>"}, {"enun": "<i>prote_er<\/i> (2014)", "sol": "g", "porque": "verbo en <i>-ger<\/i>"}, {"enun": "<i>cora_e<\/i>", "sol": "j", "porque": "sustantivo en <i>-aje<\/i>"}, {"enun": "<i>extran_ería<\/i> (2022)", "sol": "j", "porque": "<i>-jería<\/i>"}, {"enun": "<i>te_er<\/i>", "sol": "j", "porque": "una de las dos excepciones de los verbos en <i>-ger<\/i> y <i>-gir<\/i>, con <i>crujir<\/i>"}, {"enun": "<i>le_ía<\/i>", "sol": "j", "porque": "excepción de <i>-gía<\/i>, como <i>herejía<\/i> y <i>bujía<\/i>"}], "criterio": "Con <i>g<\/i> van <i>gen-<\/i> y <i>-gen<\/i>, los verbos en <i>-ger<\/i> y <i>-gir<\/i> y las terminaciones <i>-gía<\/i>, <i>-gio<\/i> y <i>-logía<\/i>; con <i>j<\/i>, los sustantivos en <i>-aje<\/i> y las palabras en <i>-jero<\/i>, <i>-jería<\/i> y <i>-jear<\/i>. <i>Tejer<\/i> y <i>lejía<\/i> son excepciones de las reglas de la <i>g<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 6"}, {"tipo": "hueco", "titulo": "La forma del verbo", "dossier": {"cuaderno": "4", "ejercicio": 7}, "ayuda": "Diez oraciones: seis del dossier y cuatro añadidas aquí. Escribe la forma del verbo del paréntesis que pide cada una.", "estricto": true, "items": [{"enun": "Yo ______ (<i>coger<\/i>) el autobús de las siete.", "sol": "cojo", "porque": "delante de <i>o<\/i> la <i>g<\/i> de <i>coger<\/i> pasa a <i>j<\/i>"}, {"enun": "Yo ______ (<i>dirigir<\/i>) el turno de tarde desde marzo.", "sol": "dirijo", "porque": "delante de <i>o<\/i> la <i>g<\/i> de <i>dirigir<\/i> pasa a <i>j<\/i>"}, {"enun": "Espero que la funda ______ (<i>proteger<\/i>) el móvil.", "sol": "proteja", "porque": "delante de <i>a<\/i> la <i>g<\/i> de <i>proteger<\/i> pasa a <i>j<\/i>"}, {"enun": "Ayer ______ (<i>traer<\/i>, yo) las facturas a la gestoría.", "sol": "traje", "porque": "pretérito de <i>traer<\/i>, que no lleva ni <i>g<\/i> ni <i>j<\/i> en el infinitivo"}, {"enun": "Ayer ellos ______ (<i>conducir<\/i>) toda la noche sin parar.", "sol": "condujeron", "porque": "pretérito de <i>conducir<\/i>, sin <i>i<\/i> delante de la <i>e<\/i>"}, {"enun": "Ayer nosotros ______ (<i>decir<\/i>) la verdad en la reunión.", "sol": "dijimos", "porque": "pretérito de <i>decir<\/i>"}, {"enun": "Tú siempre ______ (<i>escoger<\/i>) la mesa del fondo.", "sol": "escoges", "porque": "delante de <i>e<\/i> se conserva la <i>g<\/i> de <i>escoger<\/i>"}, {"enun": "La profesora ______ (<i>corregir<\/i>) los exámenes en dos días.", "sol": "corrige", "porque": "delante de <i>e<\/i> se conserva la <i>g<\/i> de <i>corregir<\/i>"}, {"enun": "Ayer ______ (<i>elegir<\/i>, ella) el turno de mañana.", "sol": "eligió", "porque": "delante de <i>i<\/i> se conserva la <i>g<\/i> de <i>elegir<\/i>"}, {"enun": "Nosotros ______ (<i>exigir<\/i>) una respuesta por escrito.", "sol": "exigimos", "porque": "delante de <i>i<\/i> se conserva la <i>g<\/i> de <i>exigir<\/i>"}], "criterio": "Los verbos en <i>-ger<\/i> y <i>-gir<\/i> escriben <i>j<\/i> delante de <i>a<\/i> y de <i>o<\/i> (<i>cojo<\/i>, <i>proteja<\/i>) y conservan la <i>g<\/i> delante de <i>e<\/i> y de <i>i<\/i> (<i>escoges<\/i>, <i>eligió<\/i>): la letra cambia para que no cambie el sonido. Los pretéritos de <i>traer<\/i>, <i>conducir<\/i> y <i>decir<\/i> llevan <i>j<\/i> aunque el infinitivo no tenga ni <i>g<\/i> ni <i>j<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 7"}, {"tipo": "hueco", "titulo": "Escríbelas en castellano", "dossier": {"cuaderno": "4", "ejercicio": 8}, "ayuda": "Diez palabras en catalán: las seis del dossier y cuatro añadidas aquí. Escribe la que les corresponde en castellano. Unas van con <i>j<\/i> y otras con <i>g<\/i>: acabar en <i>-tge<\/i> no garantiza la <i>j<\/i>.", "estricto": true, "items": [{"enun": "<i>paisatge<\/i>", "sol": "paisaje", "porque": "<i>-tge<\/i> da <i>-aje<\/i>"}, {"enun": "<i>viatge<\/i>", "sol": "viaje", "porque": "<i>-tge<\/i> da <i>-aje<\/i>"}, {"enun": "<i>missatge<\/i>", "sol": "mensaje", "porque": "con <i>n<\/i>: no es «misaje»"}, {"enun": "<i>llenguatge<\/i>", "sol": "lenguaje", "porque": "<i>-tge<\/i> da <i>-aje<\/i>"}, {"enun": "<i>personatge<\/i>", "sol": "personaje", "porque": "<i>-tge<\/i> da <i>-aje<\/i>"}, {"enun": "<i>aprenentatge<\/i>", "sol": "aprendizaje", "porque": "<i>-tge<\/i> da <i>-aje<\/i>"}, {"enun": "<i>imatge<\/i>", "sol": "imagen", "porque": "no da <i>imaje<\/i>: entra en la regla de <i>-gen<\/i>"}, {"enun": "<i>gent<\/i>", "sol": "gente", "porque": "<i>gen-<\/i>"}, {"enun": "<i>col·legi<\/i>", "sol": "colegio", "porque": "<i>-gio<\/i>"}, {"enun": "<i>religió<\/i>", "sol": "religión", "porque": "<i>-gión<\/i>"}], "criterio": "Los sustantivos catalanes en <i>-tge<\/i> dan sustantivos castellanos en <i>-aje<\/i>, con <i>j<\/i> y sin <i>t<\/i>: <i>paisaje<\/i>, <i>viaje<\/i>, <i>lenguaje<\/i>. <i>Imatge<\/i> es la excepción: da <i>imagen<\/i>, que sigue la regla de <i>-gen<\/i>. <i>Gent<\/i>, <i>col·legi<\/i> y <i>religió<\/i> llevan <i>g<\/i> en las dos lenguas. Y <i>missatge<\/i> da <i>mensaje<\/i>, con <i>n<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 8"}, {"tipo": "hueco", "titulo": "La forma que se pide", "ayuda": "Escribe la forma entera. En los verbos en <i>-ger<\/i> y <i>-gir<\/i> la letra depende de la vocal que va detrás: <i>g<\/i> delante de <i>e<\/i> y de <i>i<\/i>, <i>j<\/i> delante de <i>a<\/i> y de <i>o<\/i>.", "items": [{"enun": "<b>exigir<\/b> · ellos, presente →", "sol": "exigen"}, {"enun": "<b>traer<\/b> · él, pretérito perfecto simple →", "sol": "trajo"}, {"enun": "<b>proteger<\/b> · tú, presente →", "sol": "proteges"}, {"enun": "<b>dirigir<\/b> · que yo, presente de subjuntivo →", "sol": "dirija"}, {"enun": "<b>recoger<\/b> · yo, pretérito perfecto simple →", "sol": "recogí"}, {"enun": "<b>dirigir<\/b> · él, pretérito imperfecto →", "sol": "dirigía"}, {"enun": "<b>trabajar<\/b> · yo, pretérito perfecto simple →", "sol": "trabajé"}, {"enun": "<b>coger<\/b> · él, presente →", "sol": "coge"}], "criterio": "<i>Dirija<\/i> y <i>dirigía<\/i> son formas del mismo verbo con distinta letra, porque decide la vocal de detrás. <i>Trajo<\/i> lleva <i>j<\/i> aunque el infinitivo no tenga ni <i>j<\/i> ni <i>g<\/i>, como los demás pretéritos de ese grupo, y <i>trabajé<\/i> la lleva porque ya está en <i>trabajar<\/i>.", "apoyo": ["3 · J y G"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Por qué lleva esa letra?", "ayuda": "Ocho formas bien escritas. Indica qué regla explica la letra de cada una. No se trata de poner la letra, sino de explicar por qué está.", "ops": ["el infinitivo ya lleva j", "verbo en -ger o -gir, con e o i detrás", "verbo en -ger o -gir, con a u o detrás", "pretérito fuerte en -je"], "items": [{"enun": "<i>trabajé<\/i>", "sol": "el infinitivo ya lleva j", "porque": "procede de <i>trabajar<\/i>, que ya va con j"}, {"enun": "<i>coge<\/i>", "sol": "verbo en -ger o -gir, con e o i detrás", "porque": "detrás viene una e, así que se mantiene la g del infinitivo"}, {"enun": "<i>produjo<\/i>", "sol": "pretérito fuerte en -je", "porque": "<i>producir<\/i> no lleva ni j ni g, y el pretérito fuerte va siempre con j"}, {"enun": "<i>dirija<\/i>", "sol": "verbo en -ger o -gir, con a u o detrás", "porque": "detrás viene una a, y delante de <i>a<\/i> la g se convierte en j"}, {"enun": "<i>exigen<\/i>", "sol": "verbo en -ger o -gir, con e o i detrás", "porque": "detrás viene una e y se queda la g"}, {"enun": "<i>dibujé<\/i>", "sol": "el infinitivo ya lleva j", "porque": "procede de <i>dibujar<\/i>"}, {"enun": "<i>cojo<\/i>", "sol": "verbo en -ger o -gir, con a u o detrás", "porque": "detrás viene una o"}, {"enun": "<i>trajo<\/i>", "sol": "pretérito fuerte en -je", "porque": "<i>traer<\/i> no lleva ni j ni g. <i>Trago<\/i> sería otra palabra"}], "criterio": "Las dos reglas de <i>-ger<\/i> y <i>-gir<\/i> son la misma vista por los dos lados: los verbos en -ger y -gir conservan la g delante de <i>e<\/i> e <i>i<\/i> y la cambian por j delante de <i>a<\/i> y <i>o<\/i>. No hay ninguna excepción.<br><br>Las otras dos no dependen de la vocal: una mira el infinitivo y la otra es la lista de pretéritos fuertes —<i>traje, dije, conduje, produje, traduje<\/i>—, que llevan j sin que en el infinitivo aparezca.", "apoyo": ["3 · J y G"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las jotas y las ges", "ayuda": "Seis palabras de este párrafo están mal escritas. Pincha en ellas.", "items": [{"texto": "El extrangero que dirige el garage de la esquina dijo que el aprendizage le costó dos años. Trabajó de relogero antes, y cuando le pregunté por el viage a su pueblo se encojió de hombros. Recoger la herramienta le lleva media hora.", "faltas": {"extrangero": "extranjero", "garage": "garaje", "aprendizage": "aprendizaje", "relogero": "relojero", "viage": "viaje", "encojió": "encogió"}}], "criterio": "<i>Dirige<\/i> y <i>recoger<\/i> están bien escritas: son verbos en <i>-gir<\/i> y <i>-ger<\/i>, y conservan la <i>g<\/i> delante de <i>e<\/i> y de <i>i<\/i>. <i>Encogió<\/i>, de <i>encoger<\/i>, la conserva también, porque detrás va una <i>i<\/i>. <i>Garaje<\/i> y <i>extranjero<\/i> son las dos faltas de esta lista que más aparecen en las redacciones, por razones distintas: <i>garaje<\/i> viene del francés <i>garage<\/i>, y <i>extranjero<\/i>, del catalán <i>estranger<\/i>.", "apoyo": ["3 · J y G"], "solo_web": true}], "cuaderno_txt": "Nudo 4 · Las letras: B/V y J/G — apartado 3: J y G (p. 28) · ejercicios 6, 7 y 8", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El resumen, paso a paso", "meta": "25 minutos · el vaciado antes de escribir", "cuaderno": [{"nudo": 17, "apartados": [3, 4], "ejercicios": [10], "secciones": {"4": ["2018"]}}, {"nudo": 18, "apartados": [6], "ejercicios": [11]}, {"nudo": "A2", "apartados": ["el resumen resuelto paso a paso"]}], "lectura": {"titulo": "Nueve meses en una lista", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["Elena Sanmartín pidió cita con el traumatólogo en enero y la tuvo en", "octubre. Entre una fecha y otra dejó de subir al segundo piso sin", "parar a mitad de escalera, cambió de turno en el almacén donde trabaja", "y empezó a tomar un antiinflamatorio que le había recetado su médica", "de cabecera para aguantar. «Nadie me engañó», dice. «Me dieron la", "fecha el primer día y la fecha se cumplió».", "", "No hubo una urgencia mal atendida ni una puerta cerrada: hubo nueve", "meses de espera con todo el sistema funcionando según lo previsto. Y", "en esos nueve meses el problema que la llevó al médico se volvió otro.", "", "Los hospitales miden la espera en días, que es el número que se", "publica. Pero un paciente no espera días: espera con una vida encima.", "Elena calcula que esos nueve meses le costaron dos ascensos que no", "pidió, un verano sin playa y una discusión con su pareja cada vez que", "había que cargar la compra.", "", "Su médica de cabecera lo resume de otra manera. Dice que la espera", "traslada el trabajo: lo que no hace el especialista lo acaba haciendo", "ella, con menos herramientas y más visitas.", "", "La respuesta habitual es contratar más especialistas. Funciona, pero", "tarda: un traumatólogo se forma en cinco años y las plazas se convocan", "cuando hay presupuesto. Hay otra menos cara: contar la espera de otro", "modo, por lo que le pasa a alguien mientras está en la lista, y", "ordenarla por lo que empeora y no solo por la fecha de la cita.", "", "Elena ya está operada y dice que la atendieron bien. Lo que le queda", "es una pregunta: por qué una rodilla que en enero era solo una rodilla", "llegó a octubre convertida en un problema de trabajo, de pareja y de", "escaleras."], "pie": "Texto inventado. Ni Elena Sanmartín ni las cifras que da son reales."}, "teoria": "<h3>Nudo 17 · 3 · El resumen<\/h3>\n<p><strong>La rúbrica oficial: cuatro niveles, no tres.<\/strong> Cópiala en el cuaderno.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">nivel<\/th>\n<th>qué exige<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\"><strong>1,5<\/strong><\/td>\n<td>recoge <strong>las ideas esenciales<\/strong>, de forma <strong>clara, ordenada y precisa<\/strong>, <strong>sin subjetividad<\/strong> y <strong>sin copia literal<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>1<\/strong><\/td>\n<td>recoge <strong>la mayoría<\/strong> de las esenciales, sin subjetividad ni copia, pero con algún fallo de precisión, claridad u orden<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0,5<\/strong><\/td>\n<td>fallos graves en las ideas esenciales, <strong>o<\/strong> no mantiene la objetividad, <strong>o<\/strong> copia literalmente, <strong>o<\/strong> se expresa con poca claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0<\/strong><\/td>\n<td>no recoge las ideas esenciales, malinterpreta el texto o está desordenado y confuso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Lee despacio la banda de 0,5: tiene <strong>cuatro «o»<\/strong>, y una sola basta para caer a un tercio de la nota. <strong>Copiar una frase baja a la misma banda que no haber entendido el texto.<\/strong> La rúbrica es la de 2025; en 2026 los niveles son 1,25 · 0,75 · 0,5 · 0, con los mismos descriptores.<\/p>\n<p><strong>Lo que no debe aparecer, seis elementos:<\/strong><\/p>\n<ol>\n<li><strong>Esquemas, guiones o listas con guiones.<\/strong> Se pide un texto redactado.<\/li>\n<li><strong>Ejemplos.<\/strong> El resumen se queda con la idea, no con el caso que la ilustra.<\/li>\n<li><strong>Opinión propia.<\/strong> «<em>Es muy triste que…<\/em>», «<em>a mi parecer…<\/em>»: eso es «marca de subjetividad».<\/li>\n<li><strong>Metadiscurso.<\/strong> «<em>El autor nos habla de…<\/em>» no resume nada. Si hay que atribuir una idea, se escribe «según el autor, …» y se sigue con el contenido.<\/li>\n<li><strong>Copia literal.<\/strong> El criterio oficial exige «sin copiar literalmente fragmentos del texto» y no fija cuántas palabras seguidas son un fragmento. La medida que usamos en clase para comprobarlo: ninguna cadena de tres o más palabras seguidas del original, salvo nombres propios y términos sin sinónimo.<\/li>\n<li><strong>Citas entrecomilladas.<\/strong> Si el original trae declaraciones, se pasan a <strong>estilo indirecto<\/strong> —contar lo dicho sin reproducir las palabras— y sin comillas.<\/li>\n<\/ol>\n<p><strong>Sobre la extensión.<\/strong> Se suele proponer un 25 % del original; el examen no fija porcentaje, fija puntos. Para estos textos (500-745 palabras), <strong>100-140 palabras<\/strong> funcionan.<\/p>\n<h3>Nudo 17 · 4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2018 · La generación K<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La generación K, de Katniss, la heroína de Los juegos del hambre<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz, profesora del University College de Londres, inició en 2015 un estudio sobre los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes nacidos entre 1995 y 2015, a través de más de 2.000 entrevistas a adolescentes británicos y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">estadounidenses. El resultado se presentó en 2015 con la denominación de «Generación K: los nacidos<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">en un arco variable entre finales de los noventa y primeros 2000». Son los niños y adolescentes que han<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">crecido ya con la depresión económica, que no tienen recuerdos del 11-S porque eran bebés o aún no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">habían nacido, los que viven de una forma natural el mundo oscuro que tanto temor provocaba en sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hermanos mayores. Los K se identifican con la lucha por la supervivencia de los protagonistas de las<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">distopías* en boga, como por ejemplo, Katniss Everdeen, la heroína de Los juegos del hambre.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Hace un par de años, The New Yorker, en un extenso análisis sobre la inundación de distopías<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">para todos los públicos que llenaba las librerías, señalaba como primera y primordial diferencia que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los utópicos creen en el progreso y ofrecen promesas; los distópicos no creen en el progreso y lanzan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">advertencias.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La encuesta de Hertz venía a dar la razón a estos argumentos: el 72 % de los jóvenes entrevistados<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">admitía sentirse «profundamente ansioso» por el terrorismo, un 64 % de ellos se mostraba muy<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupado por el cambio climático, un 79 % mostraba su inquietud por encontrar un trabajo y un 72 %<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por endeudarse. Y si hablamos de confianza, mientras que el 60 % de los adultos creía que los grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">organismos u organizaciones cumplían su función, solo el 6 % de estos jóvenes lo pensaba.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz observó además que el factor tecnológico no es el determinante para definir a estos<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">jóvenes. Se trata más bien de la tormenta perfecta en la que han transcurrido sus años de formación, una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tormenta en la que convergen la peor depresión en décadas con un escenario geopolítico compartido<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por el terrorismo islamista, la austeridad impuesta y las revelaciones de WikiLeaks. La falta de confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en los adultos que mienten incluso de forma oficial nos lleva de nuevo a Katniss Everdeen, que fía su<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">supervivencia sólo a sí misma. Y para rematarlo, de la misma manera que en las distopías la pertenencia<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">a una casta concreta determina el futuro, estos jóvenes piensan que el color, la clase social y el género<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">marcarán también el suyo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Finalmente las encuestas, no sólo las de Hertz sino también las realizadas aquí, muestran que para<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los jóvenes la familia y los amigos son lo más importante. Para acabar, dos noticias, una buena y otra<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mala. La buena es que nuestra heroína es mujer, lo que dice mucho de la posición de estos jóvenes frente<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">a las cuestiones de género. La mala es que las distopías siguen teniendo público. Si pensamos que los K<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las asocian con la realidad ni que sea inconscientemente, hemos de concluir que el mundo sigue siendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muy oscuro.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Isabel Gómez Melenchón, <\/em>La Vanguardia. Culturas<em>, 16 de septiembre de 2017, tal como la imprimió la prueba de 2018. El examen añadía una nota al pie: <\/em>distopía<em>, representación ficticia de una sociedad futura de características negativas.<\/em><\/p>\n<h3>Nudo 18 · 6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>\n<h3>Anexo A-2 · El resumen, resuelto paso a paso<\/h3>\n<blockquote>\n<p>Un resumen real, de principio a fin: el vaciado, el texto modelo, por qué se ha tomado cada decisión, el mismo resumen hecho mal, y la comparación con la solución oficial de aquella convocatoria.<\/p>\n<p>El texto de partida está aquí abajo. La rúbrica y el método están en el nudo 17.<\/p>\n<\/blockquote>\n<hr />\n<h4>El encargo<\/h4>\n<p><strong>Texto:<\/strong> «La ciencia resucita aldeas», <em>Prova d'accés a CFGS, convocatòria 2015<\/em>, serie 1. Adaptación de un texto de Sonia Vizoso, <em>El País<\/em> (8 de agosto de 2014). <strong>557 palabras.<\/strong><\/p>\n<p><strong>Enunciado oficial (1.1), 1,5 puntos:<\/strong><\/p>\n<blockquote>\n<p><em>Escriba un resumen explicando, con sus propias palabras, el problema que tiene la aldea gallega de O Couto y exponga cuáles son las razones que han llevado a su situación actual.<\/em><\/p>\n<\/blockquote>\n<p>Lo primero, antes de tocar el texto: <strong>el enunciado pide dos datos.<\/strong> El problema y las razones. Todo lo que no sea uno de esos dos queda fuera, por interesante que sea.<\/p>\n<hr />\n<h4>El texto<\/h4>\n<blockquote>\n<p><strong>LA CIENCIA RESUCITA ALDEAS<\/strong><\/p>\n<p>El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/p>\n<p>Su trabajo será diferente en Galicia, un territorio donde descansan las ruinas de mil trescientas aldeas abandonadas, el 40 % de las que hay en España. Los setenta habitantes que resisten en el menguante núcleo gallego de O Couto contactaron con este equipo científico en busca de ayuda hace dos años. Tienen agua, luz y recogida de basuras, pero por sus calles ya no corretean niños y a los jóvenes no les queda más remedio que irse a trabajar fuera. El autobús escolar, que a finales de los ochenta iba atestado con más de cincuenta críos, solo transporta ahora a cuatro chavales. Porque en O Couto muchas cosas fueron las que empezaron a cambiar en los setenta.<\/p>\n<p>Hasta entonces, en este valle de A Costa da Morte, emplazado entre montes frondosos y la desembocadura del río Anllóns, se vivía «de lo que daba la tierra y el mar», recuerda Carmen Bermúdez. A finales de la dictadura franquista, muchos de los habitantes en edad de volar empezaron a abandonar sus casas por largas temporadas, unos enganchados al tren de la emigración y otros a las mareas en el caladero irlandés del Gran Sol. Los que permanecieron en el pueblo se emplearon en los prósperos aserraderos que se implantaron en la zona y, gracias a la generalización de las becas, estudiar fuera dejó de ser un lujo reservado a los hijos del pudiente del pueblo. Así fue como la mayoría dijo adiós a la agricultura y ganadería de subsistencia.<\/p>\n<p>«Llegaron las ganas del dinero inmediato y con la tierra hay que saber esperar», explica el cambio de mentalidad Adrián Varela, de treinta y tres años. Él trabaja en A Coruña y se hace a diario casi dos horas al volante de su coche para no abandonar la aldea donde desea vivir. «La gente no marcha porque quiere. La vida aquí es más fácil y rica», esgrime. «Sé que el campo y el mar son duros, pero el estrés de la ciudad también». Adrián espera que los investigadores de la Universidad descubran la fórmula que pueda revivir O Couto, ya sea impulsando la agricultura ecológica, el uso de algas para la industria farmacéutica o la explotación del monte. Tiene claro que no se volverá a la agricultura de subsistencia.<\/p>\n<p>La investigación en esta aldea gallega buscará «nichos de negocio» en los que se puedan crear «microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros laboratorios», explica Agüera.<\/p>\n<\/blockquote>\n<p><em>Adaptación de un texto de Sonia Vizoso, El País, 8 de agosto de 2014, tal como se publicó en la Prova d'accés a CFGS, convocatòria 2015, serie 1 — documento público de la Generalitat de Catalunya.<\/em><\/p>\n<hr />\n<h4>PASO A · El vaciado. Párrafo a párrafo, qué hay y qué hago con ello<\/h4>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">§<\/th>\n<th>qué hay ahí<\/th>\n<th style=\"text-align: center;\">¿entra?<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1<\/td>\n<td>O Couto, paraje de A Costa da Morte, población envejecida y menguante<\/td>\n<td style=\"text-align: center;\"><strong>SÍ<\/strong><\/td>\n<td>es el problema, y está en la primera línea<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">1<\/td>\n<td>El equipo de la Universidad de Santiago: trece miembros, física al frente, ingenieros, economistas, un politólogo<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td>el enunciado no pregunta por el equipo. Va en la pregunta 1.3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">1<\/td>\n<td>Cinco años de trabajo, la Unesco, América Latina y África<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td>contexto del equipo. Fuera por lo mismo<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td>Mil trescientas aldeas abandonadas en Galicia, el 40 % de España<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td>dato de contexto. Impresiona, pero no es <em>el problema de O Couto<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td>Setenta habitantes, no hay niños, los jóvenes se van a trabajar fuera<\/td>\n<td style=\"text-align: center;\"><strong>SÍ<\/strong><\/td>\n<td>es el problema, con su magnitud<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td>Tienen agua, luz y recogida de basuras<\/td>\n<td style=\"text-align: center;\"><strong>SÍ<\/strong>, en una línea<\/td>\n<td><strong>acota<\/strong> el problema: no es falta de servicios<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">2<\/td>\n<td>El autobús escolar: cincuenta críos en los ochenta, cuatro ahora<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td><strong>ejemplo<\/strong>. La idea («ya no hay niños») ya está recogida<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">3<\/td>\n<td>Se vivía «de lo que daba la tierra y el mar» — testimonio de Carmen Bermúdez<\/td>\n<td style=\"text-align: center;\"><strong>la idea sí, el nombre no<\/strong><\/td>\n<td>el testimonio no es una idea; lo que afirma, sí<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">3<\/td>\n<td>Años setenta: emigración y campañas de pesca en el Gran Sol<\/td>\n<td style=\"text-align: center;\"><strong>SÍ<\/strong><\/td>\n<td><strong>primera razón<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">3<\/td>\n<td>Los que se quedaron pasaron a los aserraderos; las becas permitieron estudiar fuera<\/td>\n<td style=\"text-align: center;\"><strong>SÍ<\/strong><\/td>\n<td><strong>segunda razón<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">4<\/td>\n<td>Adrián Varela, treinta y tres años, dos horas de coche al día, sus declaraciones<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td>testimonio individual. Su idea («ganas de dinero inmediato») es la pregunta 1.2<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">5<\/td>\n<td>Nichos de negocio, microempresas, «no somos una ONG», «son nuestros laboratorios»<\/td>\n<td style=\"text-align: center;\"><strong>NO<\/strong><\/td>\n<td>es la solución que se busca, no el problema ni sus causas. Pregunta 1.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Seis elementos fuera, más el nombre de un testimonio.<\/strong> Ninguno está fuera por ser falso: están fuera porque <strong>el enunciado no los pidió<\/strong>. Este paso decide la nota, y casi nadie lo hace.<\/p>\n<hr />\n<h4>PASO B · El resumen modelo<\/h4>\n<p><strong>109 palabras<\/strong> (un 20 % del original).<\/p>\n<blockquote>\n<p><strong>[1]<\/strong> O Couto es una aldea gallega de la costa de A Coruña que pierde población y envejece: apenas quedan setenta vecinos, hay muy pocos niños y quien es joven acaba buscando empleo lejos. <strong>[2]<\/strong> No le faltan los servicios básicos; le falta trabajo.<\/p>\n<p><strong>[3]<\/strong> El origen está en los años setenta. <strong>[4]<\/strong> Entonces una parte del vecindario emigró y otra se embarcó en campañas de pesca de meses; quienes se quedaron abandonaron el cultivo y el ganado para consumo propio y pasaron a las serrerías de la zona. <strong>[5]<\/strong> Con las becas, los hijos salieron a estudiar fuera, y esos ya no regresaron. <strong>[6]<\/strong> Hoy los jóvenes siguen marchándose porque cerca no hay empleo.<\/p>\n<\/blockquote>\n<hr />\n<h4>PASO C · Las notas al margen. Por qué cada decisión<\/h4>\n<p><strong>[1] · «pierde población y envejece»<\/strong>\nEl original lleva <em>«una población envejecida y menguante»<\/em>. Se ha cambiado la construcción entera: de dos adjetivos a dos verbos. <strong>Ningún otro procedimiento evita mejor la copia<\/strong>: pasar de sustantivo + adjetivo a verbo obliga a reescribir la frase y hace imposible arrastrar el original. <em>Menguante<\/em> es además una palabra poco frecuente: si aparece en el resumen, el corrector sabe de dónde salió.<\/p>\n<p><strong>[1] · «apenas quedan setenta vecinos»<\/strong>\nEl número <strong>se mantiene<\/strong>. Una cifra no tiene sinónimo y no es un fragmento. Se ha tirado la envoltura: <em>«los setenta habitantes que resisten en el menguante núcleo gallego»<\/em>.<\/p>\n<p><strong>[1] · «hay muy pocos niños»<\/strong>\nAquí se ha <strong>generalizado un ejemplo<\/strong>. El original lo cuenta con una imagen (<em>por sus calles ya no corretean niños<\/em>) y con un dato (el autobús escolar, de cincuenta a cuatro). La imagen y el dato dicen lo mismo. <strong>El resumen se queda con lo que afirman y tira cómo lo formulan.<\/strong> Dejar fuera el autobús exige un esfuerzo, porque ninguna otra frase del texto se recuerda tanto; en un resumen, la frase que más se recuerda se elimina la primera, porque casi siempre es un ejemplo.<\/p>\n<p><strong>[1] · «quien es joven acaba buscando empleo lejos»<\/strong>\nEl original: <em>«a los jóvenes no les queda más remedio que irse a trabajar fuera»<\/em>. Si se conserva <em>irse a trabajar fuera<\/em>, son cuatro palabras seguidas del original, y la medida de clase marca <strong>copia literal<\/strong> desde tres. El corrector decide qué cuenta como fragmento copiado y la rúbrica no fija un número; reescrita entera, no queda nada que contar.<\/p>\n<p><strong>[2] · «No le faltan los servicios básicos; le falta trabajo.»<\/strong>\nEsta frase parece un detalle y pesa más que ninguna otra del resumen. El original la da como una lista (<em>agua, luz y recogida de basuras<\/em>). <strong>Se ha sustituido la lista por su categoría<\/strong> —«servicios básicos»—, la operación central del resumen: subir un escalón de generalidad. Y se ha añadido el contraste (<em>le falta trabajo<\/em>), que no está formulado así en ninguna línea del texto pero recoge lo que el texto sostiene en conjunto. <strong>Añadir esa conexión no inventa: sintetiza<\/strong>, y separa un resumen de 1,5 de uno de 1.<\/p>\n<p><strong>[3] · «El origen está en los años setenta.»<\/strong>\nFrase corta, de transición. Marca que empieza la <strong>segunda mitad del enunciado<\/strong>. El corrector tiene que distinguir, sin buscarlo, dónde acaba «el problema» y dónde empiezan «las razones». Siete palabras dedicadas a eso: la rúbrica exige «ordenada», y esa frontera marcada se llama orden.<\/p>\n<p><strong>[4] · «una parte del vecindario emigró y otra se embarcó en campañas de pesca de meses»<\/strong>\nEl original: <em>«unos enganchados al tren de la emigración y otros a las mareas en el caladero irlandés del Gran Sol»<\/em>. Se ha desmontado la metáfora (<em>el tren de la emigración<\/em>, <em>las mareas<\/em>) y se ha tirado la localización (<em>caladero irlandés del Gran Sol<\/em>). <strong>Las metáforas del original no se copian y no se sustituyen por otras: se traducen a lenguaje llano.<\/strong> Una metáfora propia no añade ninguna información y el corrector la anota como imprecisión.<\/p>\n<p><strong>[4] · «abandonaron el cultivo y el ganado para consumo propio»<\/strong>\nEl original lleva <em>«agricultura y ganadería de subsistencia»<\/em>. Es un término casi técnico y habría sido cómodo dejarlo, pero son cinco palabras seguidas del original: se ha desarmado. <strong>Una palabra sola sin sinónimo se repite; una expresión de varias palabras se reformula o se explica.<\/strong> Explicar ocupa aquí tres palabras más y evita que la respuesta se quede a medias.<\/p>\n<p><strong>[4] · «las serrerías»<\/strong>\n<em>Aserraderos<\/em> → <em>serrerías<\/em>. Sinónimo exacto: no cambia nada del sentido. Cuando existe un sinónimo limpio se usa; cuando no existe —<em>pistacho<\/em>, <em>becas<\/em>, <em>O Couto<\/em>— se repite la palabra.<\/p>\n<p><strong>[5] · «Con las becas, los hijos salieron a estudiar fuera, y esos ya no regresaron»<\/strong>\nAquí hay una <strong>inferencia<\/strong>. El texto afirma que las becas hicieron que estudiar fuera dejara de ser un lujo, y afirma aparte que la aldea se vació. Que los que salieron a estudiar no volvieran es la conexión que el texto sostiene sin escribirla. <strong>Recoger las ideas esenciales consiste en eso<\/strong>: en lo que el texto sostiene, no en la lista de frases con que lo formula. Esta operación entraña más riesgo que ninguna otra del resumen: si la inferencia no se sostiene en el texto, deja de ser síntesis y pasa a ser malinterpretación, que es la banda de 0.<\/p>\n<p><strong>[6] · «Hoy los jóvenes siguen marchándose porque cerca no hay empleo.»<\/strong>\nCierra devolviendo al presente. El enunciado pregunta por <em>«la situación actual»<\/em>, así que el resumen tiene que terminar en el hoy. En este enunciado la última palabra es <em>actual<\/em>, y por eso el resumen termina en el presente.<\/p>\n<p><strong>Lo que se ha dejado fuera a propósito:<\/strong><\/p>\n<ul>\n<li><strong>Ningún nombre propio de persona.<\/strong> Ni Carmen Bermúdez, ni Adrián Varela, ni Ángeles López Agüera. Los testimonios de una columna son la voz, no la idea.<\/li>\n<li><strong>Ninguna comilla.<\/strong> Todas las declaraciones del original se han pasado a estilo indirecto o se han disuelto.<\/li>\n<li><strong>Ninguna marca de opinión.<\/strong> Ni <em>lamentablemente<\/em>, ni <em>por desgracia<\/em>, ni <em>es un problema grave<\/em>. La palabra <em>problema<\/em> aparece en el enunciado, no en el resumen.<\/li>\n<li><strong>Ni una vez «el autor», «el texto» o «se explica que».<\/strong> El resumen recoge lo que afirma el texto; no cuenta que el texto lo afirma.<\/li>\n<li><strong>El proyecto de la Universidad, el asunto al que el original dedica más espacio.<\/strong> Demuestra que <strong>manda el enunciado y no el texto<\/strong>: el proyecto ocupa dos de los cinco párrafos y no entra, porque tiene su propia pregunta (la 1.3) y meterlo aquí sería contestar dos veces a lo mismo y una vez a destiempo.<\/li>\n<\/ul>\n<hr />\n<h4>PASO D · El mismo texto, resumido mal<\/h4>\n<p>Para puntuar en clase con la rúbrica antes de mirar la solución.<\/p>\n<blockquote>\n<p>El futuro de O Couto está en manos de un grupo de investigadores. Es muy triste que los pueblos se queden vacíos y yo creo que debería hacerse algo. El autobús escolar solo transporta ahora a cuatro chavales. El autor nos habla de que la gente no marcha porque quiere.<\/p>\n<\/blockquote>\n<p><strong>Qué activa, una por una:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>condición de la rúbrica<\/th>\n<th>dónde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>copia literal<\/strong><\/td>\n<td>«<em>El futuro de O Couto está en manos de un grupo de investigadores<\/em>» y «<em>solo transporta ahora a cuatro chavales<\/em>» son del original<\/td>\n<\/tr>\n<tr>\n<td><strong>marcas de subjetividad<\/strong><\/td>\n<td>«<em>es muy triste<\/em>», «<em>yo creo<\/em>»<\/td>\n<\/tr>\n<tr>\n<td><strong>metadiscurso / expresión poco clara<\/strong><\/td>\n<td>«<em>el autor nos habla de que<\/em>»<\/td>\n<\/tr>\n<tr>\n<td><strong>ideas esenciales ausentes<\/strong><\/td>\n<td><strong>no recoge ni una sola causa<\/strong>, que es la mitad del enunciado<\/td>\n<\/tr>\n<tr>\n<td><strong>ejemplo por idea<\/strong><\/td>\n<td>el autobús está; la despoblación aparece solo como lamento, sin magnitud ni causas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Nota: 0,5, y defendible el 0.<\/strong> Cincuenta palabras que valen un tercio de lo que valen las ciento nueve de arriba. Los dos textos salen del mismo original; el de cincuenta palabras <strong>no ha decidido qué tirar<\/strong>: conserva el autobús y dos frases literales, y deja fuera las causas.<\/p>\n<hr />\n<h4>PASO E · La comparación con la solución oficial<\/h4>\n<p>La clave oficial de 2015 resuelve el mismo encargo así (se reproduce por ser documento público):<\/p>\n<blockquote>\n<p>«La aldea gallega de O Couto, a pesar de tener un agradable entorno natural, padece un problema de despoblación y de envejecimiento de los residentes. A esto se le añade un problema económico, ya que no hay posibilidades de empleo en la zona. Las razones que explican la situación actual se originaron ya en los años setenta, cuando la aldea empezó a despoblarse por la emigración hacia otras zonas de España o por las largas temporadas de trabajo de los hombres en barcos de pesca. Años más tarde, también los hijos de los que se quedaron se fueron a estudiar fuera y ya no volvieron a la aldea. Y, en la actualidad, los jóvenes se van porque no encuentran trabajo cerca.»<\/p>\n<\/blockquote>\n<p><strong>Tres observaciones sobre la comparación:<\/strong><\/p>\n<ol>\n<li><strong>La estructura es la misma:<\/strong> problema primero, causas después, presente al final. No porque nos hayamos copiado, sino porque <strong>es la estructura que impone el enunciado<\/strong>. Cualquier resumen que siga el enunciado empezará por el problema y seguirá con las razones; dentro de cada parte, el orden puede variar.<\/li>\n<li><strong>La oficial también generaliza y también tira el autobús, los nombres y el proyecto universitario.<\/strong> Los seis elementos que el paso A marcaba como «fuera» están fuera de las dos versiones.<\/li>\n<li><strong>No hay una única redacción correcta.<\/strong> Hay dos textos distintos, con palabras distintas, y los dos valen 1,5. Coinciden <strong>las decisiones<\/strong>, no las frases.<\/li>\n<\/ol>\n<p><em>Texto, enunciado y solución oficial: Prova d'accés a CFGS, convocatòria 2015, serie 1. Vaciado, resumen modelo, notas al margen y resumen defectuoso: material propio.<\/em><\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2018: las cuatro preguntas", "dossier": {"cuaderno": "17", "ejercicio": 10, "parte": "1.1 a 1.4"}, "ayuda": "Las preguntas oficiales de 2018, sobre el texto de la generación K, que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos para el bloque entero.", "items": [{"enun": "«Explique brevemente en qué consiste la generación K según Noreena Hertz.» <b>[0,5]<\/b>", "conv": "2018", "modelo": "La generación K está formada por los jóvenes nacidos entre finales de los años noventa y los primeros años del siglo XXI: los que han crecido en un mundo marcado por la depresión económica y no vivieron el atentado del 11 de septiembre en Nueva York."}, {"enun": "«Según las encuestas de Hertz, ¿qué preocupa a los jóvenes de la generación K?» <b>[0,5]<\/b>", "conv": "2018", "modelo": "Les preocupan diversos hechos actuales: el terrorismo, el cambio climático, las posibilidades de encontrar un trabajo y el riesgo de endeudarse."}, {"enun": "«Según Noreena Hertz, ¿cuáles son los factores determinantes que explican la forma de pensar de los jóvenes de la generación K?» <b>[0,75]<\/b>", "conv": "2018", "modelo": "Hertz cree que el factor tecnológico no es el más importante, al contrario de lo que podría pensarse. Lo determinante es la combinación de los factores sociohistóricos de los años en que estos jóvenes se han formado: una depresión económica de alcance mundial y un escenario geopolítico marcado por el terrorismo islamista, las políticas de austeridad en el gasto y las revelaciones de secretos gubernamentales por parte de WikiLeaks."}, {"enun": "«Resuma brevemente, con sus propias palabras, los rasgos que caracterizan a los jóvenes de la generación K según se explica en los dos últimos párrafos.» <b>[0,75]<\/b>", "conv": "2018", "modelo": "Los rasgos distintivos de esta generación son la desconfianza en los adultos y la ansiedad ante el mundo que les ha tocado vivir, al que miran con pesimismo. Creen que la raza, la clase social y el sexo serán mucho más determinantes para su futuro de lo que creían las generaciones precedentes. Solo confían en sí mismos y en el círculo de amigos y familia, que es lo más importante para ellos. Como rasgo positivo, son una generación con menor dependencia de los papeles tradicionales que se asignan a los géneros."}], "criterio": "Los modelos son las respuestas oficiales de 2018. Una respuesta completa contesta todo lo que pide el enunciado —en la 1.3, el factor que Hertz descarta y los que considera determinantes—, redactada y sin copiar frases del texto.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2018"}, "apoyo": ["2018 · La generación K"], "dossier_txt": "Del dossier: nudo 17, ejercicio 10 · 1.1 a 1.4", "texto_titulo": "2018 · La generación K", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La generación K, de Katniss, la heroína de Los juegos del hambre<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz, profesora del University College de Londres, inició en 2015 un estudio sobre los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes nacidos entre 1995 y 2015, a través de más de 2.000 entrevistas a adolescentes británicos y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">estadounidenses. El resultado se presentó en 2015 con la denominación de «Generación K: los nacidos<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">en un arco variable entre finales de los noventa y primeros 2000». Son los niños y adolescentes que han<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">crecido ya con la depresión económica, que no tienen recuerdos del 11-S porque eran bebés o aún no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">habían nacido, los que viven de una forma natural el mundo oscuro que tanto temor provocaba en sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hermanos mayores. Los K se identifican con la lucha por la supervivencia de los protagonistas de las<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">distopías* en boga, como por ejemplo, Katniss Everdeen, la heroína de Los juegos del hambre.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Hace un par de años, The New Yorker, en un extenso análisis sobre la inundación de distopías<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">para todos los públicos que llenaba las librerías, señalaba como primera y primordial diferencia que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los utópicos creen en el progreso y ofrecen promesas; los distópicos no creen en el progreso y lanzan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">advertencias.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La encuesta de Hertz venía a dar la razón a estos argumentos: el 72 % de los jóvenes entrevistados<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">admitía sentirse «profundamente ansioso» por el terrorismo, un 64 % de ellos se mostraba muy<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupado por el cambio climático, un 79 % mostraba su inquietud por encontrar un trabajo y un 72 %<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por endeudarse. Y si hablamos de confianza, mientras que el 60 % de los adultos creía que los grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">organismos u organizaciones cumplían su función, solo el 6 % de estos jóvenes lo pensaba.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz observó además que el factor tecnológico no es el determinante para definir a estos<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">jóvenes. Se trata más bien de la tormenta perfecta en la que han transcurrido sus años de formación, una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tormenta en la que convergen la peor depresión en décadas con un escenario geopolítico compartido<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por el terrorismo islamista, la austeridad impuesta y las revelaciones de WikiLeaks. La falta de confianza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en los adultos que mienten incluso de forma oficial nos lleva de nuevo a Katniss Everdeen, que fía su<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">supervivencia sólo a sí misma. Y para rematarlo, de la misma manera que en las distopías la pertenencia<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">a una casta concreta determina el futuro, estos jóvenes piensan que el color, la clase social y el género<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">marcarán también el suyo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Finalmente las encuestas, no sólo las de Hertz sino también las realizadas aquí, muestran que para<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los jóvenes la familia y los amigos son lo más importante. Para acabar, dos noticias, una buena y otra<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mala. La buena es que nuestra heroína es mujer, lo que dice mucho de la posición de estos jóvenes frente<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">a las cuestiones de género. La mala es que las distopías siguen teniendo público. Si pensamos que los K<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las asocian con la realidad ni que sea inconscientemente, hemos de concluir que el mundo sigue siendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muy oscuro.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Isabel Gómez Melenchón, <\/em>La Vanguardia. Culturas<em>, 16 de septiembre de 2017, tal como la imprimió la prueba de 2018. El examen añadía una nota al pie: <\/em>distopía<em>, representación ficticia de una sociedad futura de características negativas.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "Bloque 1 de 2018: el léxico", "dossier": {"cuaderno": "17", "ejercicio": 10, "parte": "1.5"}, "ayuda": "La pregunta 1.5 de 2018: «Proponga un sinónimo o explique el significado de las siguientes palabras o expresiones. Preste atención a la adecuación de la palabra al contexto en el que se encuentra.» Vale 1 punto.", "items": [{"enun": "<i>temor<\/i> (línea 7)", "modelo": "miedo, recelo, aprensión, desconfianza"}, {"enun": "<i>en boga<\/i> (línea 9)", "modelo": "de moda, de actualidad"}, {"enun": "<i>progreso<\/i> (línea 12)", "modelo": "prosperidad, mejora, crecimiento, avance"}, {"enun": "<i>cuestiones de género<\/i> (línea 30)", "modelo": "expresión que engloba los problemas relacionados con los modelos de género que impone la sociedad"}], "criterio": "Cada palabra vale 0,25; con alguna imprecisión, 0,1. El sinónimo tiene que servir en la frase del texto: <i>las distopías en boga<\/i> son <i>las distopías de moda<\/i>.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2018"}, "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2018 · La generación K"], "dossier_txt": "Del dossier: nudo 17, ejercicio 10 · 1.5", "texto_titulo": "2018 · La generación K", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La generación K, de Katniss, la heroína de Los juegos del hambre<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Noreena Hertz, profesora del University College de Londres, inició en 2015 un estudio sobre los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes nacidos entre 1995 y 2015, a través de más de 2.000 entrevistas a adolescentes británicos y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">estadounidenses. El resultado se presentó en 2015 con la denominación de «Generación K: los nacidos<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">en un arco variable entre finales de los noventa y primeros 2000». Son los niños y adolescentes que han<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">crecido ya con la depresión económica, que no tienen recuerdos del 11-S porque eran bebés o aún no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">habían nacido, los que viven de una forma natural el mundo oscuro que tanto temor provocaba en sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hermanos mayores. Los K se identifican con la lucha por la supervivencia de los protagonistas de las<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">distopías* en boga, como por ejemplo, Katniss Everdeen, la heroína de Los juegos del hambre.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Hace un par de años, The New Yorker, en un extenso análisis sobre la inundación de distopías<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">para todos los públicos que llenaba las librerías, señalaba como primera y primordial diferencia que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los utópicos creen en el progreso y ofrecen promesas; los distópicos no creen en el progreso y lanzan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">advertencias.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La encuesta de Hertz venía a dar la razón a estos argumentos: el 72 % de los jóvenes entrevistados<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">admitía sentirse «profundamente ansioso» por el terrorismo, un 64 % de ellos se mostraba muy<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupado por el cambio climático, un 79 % mostraba su inquietud por encontrar un trabajo y un 72 %<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por endeudarse. Y si hablamos de confianza, mientras que el 60 % de los adultos creía que los grandes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">organismos u organizaciones cumplían su función, solo el 6 % de estos jóvenes lo pensaba.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\
