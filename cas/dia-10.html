<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 10 · 29 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 10, "fecha": "2026-10-29", "tab": "Día 10 · 29 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 10", "h1": "Jueves 29 de octubre", "sub": "B y V: las excepciones · el resumen · a qué sustituye cada pronombre", "carriles": [{"chapa": "Carril A", "titulo": "B y V: las excepciones y tu lista de fallos", "meta": "30 minutos · y por qué tres de las excepciones que te enseñaron son falsas", "cuaderno": {"nudo": 4, "apartados": [1, 2], "ejercicios": [5]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> no hay un ejercicio que se llame así. Esto se descuenta en la <strong>penalización<\/strong>: cada falta de ortografía descuenta <strong>0,1<\/strong> en los bloques 1 y 2, hasta un tope de 2 puntos. Y baja la banda de <strong>corrección<\/strong> de la redacción, que vale 1 punto entero.<\/div>\n<h3>1 · B y V<\/h3>\n<p>En castellano la <strong>b<\/strong> y la <strong>v<\/strong> suenan igual. No hay diferencia de pronunciación: en castellano la v no se pronuncia con los dientes. Solo sirven tres recursos: <strong>la forma del verbo<\/strong>, <strong>unos cuantos prefijos con significado<\/strong> y <strong>tu propia lista de fallos<\/strong>.<\/p>\n<p>Lo que es regla y se cumple casi siempre:<\/p>\n<table>\n<thead>\n<tr>\n<th><strong>B<\/strong><\/th>\n<th>ejemplos (de textos de la prueba)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>después de <strong>m<\/strong><\/td>\n<td>ca<strong>mb<\/strong>io, no<strong>mb<\/strong>re, ho<strong>mb<\/strong>res, novie<strong>mb<\/strong>re, aso<strong>mb<\/strong>rosa<\/td>\n<\/tr>\n<tr>\n<td>delante de otra consonante: <strong>bl, br, bd, bj, bs, bv<\/strong><\/td>\n<td><strong>bl<\/strong>anco, <strong>br<\/strong>eve, <strong>br<\/strong>uta, a<strong>bd<\/strong>omen, o<strong>bv<\/strong>io<\/td>\n<\/tr>\n<tr>\n<td>el imperfecto en <strong>-aba<\/strong> y el de <em>ir<\/em>: <em>iba, íbamos<\/em><\/td>\n<td>esta<strong>ba<\/strong>, lleva<strong>ba<\/strong>, explica<strong>ba<\/strong>, pensa<strong>ba<\/strong><\/td>\n<\/tr>\n<tr>\n<td>los verbos <strong>deber, beber, caber, saber, haber<\/strong><\/td>\n<td>de<strong>b<\/strong>emos, sa<strong>b<\/strong>ía, ha<strong>br<\/strong>á<\/td>\n<\/tr>\n<tr>\n<td>los verbos acabados en <strong>-bir<\/strong> y <strong>-buir<\/strong><\/td>\n<td>escri<strong>bir<\/strong>, reci<strong>bir<\/strong>, prohi<strong>bir<\/strong>, su<strong>bir<\/strong>, distri<strong>buir<\/strong> <em>(menos hervir, servir, vivir)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th><strong>V<\/strong><\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>después de <strong>n<\/strong><\/td>\n<td>i<strong>nv<\/strong>estigación, co<strong>nv<\/strong>iene, co<strong>nv<\/strong>ertido, e<strong>nv<\/strong>ejecimiento<\/td>\n<\/tr>\n<tr>\n<td>los verbos acabados en <strong>-olver<\/strong><\/td>\n<td>res<strong>olver<\/strong>, dev<strong>olver<\/strong>, env<strong>olver<\/strong><\/td>\n<\/tr>\n<tr>\n<td>pretérito perfecto simple de <em>estar, tener, andar<\/em>, y los tiempos que derivan de él<\/td>\n<td>est<strong>uv<\/strong>e, t<strong>uv<\/strong>iera, and<strong>uv<\/strong>o<\/td>\n<\/tr>\n<tr>\n<td>el presente de <em>ir<\/em><\/td>\n<td><strong>v<\/strong>oy, <strong>v<\/strong>as, <strong>v<\/strong>aya, <strong>v<\/strong>amos<\/td>\n<\/tr>\n<tr>\n<td>adjetivos acabados en <strong>-avo/-ava, -evo/-eva, -ivo/-iva<\/strong><\/td>\n<td>nue<strong>vo<\/strong>, creati<strong>vo<\/strong>, atracti<strong>va<\/strong>, masi<strong>vo<\/strong>, negati<strong>vo<\/strong><\/td>\n<\/tr>\n<tr>\n<td>palabras acabadas en <strong>-ívoro / -ívora<\/strong><\/td>\n<td>carn<strong>ívoro<\/strong>, herb<strong>ívora<\/strong> <em>(menos víbora)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Con <\/em><em>-ave / -eve<\/em><em> van clave, grave, leve y también <\/em><em>breve<\/em><em>: empieza por b, pero la terminación es -eve, con v. Confunde la b inicial, no la regla.<\/em><\/p>\n<p><strong>La trampa que más faltas produce: <em>-aba<\/em> frente a <em>-ava<\/em>.<\/strong> <em>Llevaba<\/em>, <em>estaba<\/em>, <em>pensaba<\/em> son <strong>verbos<\/strong>, y el imperfecto de la primera conjugación se escribe <strong>siempre con b<\/strong>. <em>Nueva<\/em>, <em>octava<\/em>, <em>esclava<\/em> son adjetivos o sustantivos, y van con v. Prueba: si puedes ponerlo en infinitivo (<em>llevar<\/em>), es verbo.<\/p>\n<p><strong>La trampa catalana.<\/strong> El catalán escribe algunas de estas palabras con la otra letra, y esas aparecen al escribir deprisa:<\/p>\n<table>\n<thead>\n<tr>\n<th>castellano<\/th>\n<th>catalán<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>go<strong>b<\/strong>ierno<\/td>\n<td>go<strong>v<\/strong>ern<\/td>\n<\/tr>\n<tr>\n<td>a<strong>b<\/strong>ogado<\/td>\n<td>a<strong>dv<\/strong>ocat<\/td>\n<\/tr>\n<tr>\n<td>mó<strong>v<\/strong>il, automó<strong>v<\/strong>il<\/td>\n<td>mò<strong>b<\/strong>il, automò<strong>b<\/strong>il<\/td>\n<\/tr>\n<tr>\n<td>cam<strong>b<\/strong>iar<\/td>\n<td>can<strong>v<\/strong>iar<\/td>\n<\/tr>\n<tr>\n<td>ha<strong>b<\/strong>er<\/td>\n<td>ha<strong>v<\/strong>er<\/td>\n<\/tr>\n<tr>\n<td>pro<strong>b<\/strong>ar<\/td>\n<td>pro<strong>v<\/strong>ar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>2 · Los prefijos que significan algo<\/h3>\n<p>De todas las listas de excepciones que suelen darse, solo se pueden razonar los prefijos que significan algo. <strong>Si sabes qué significa la palabra, sabes cómo se escribe:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>prefijo<\/th>\n<th>significa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>bi-, bis-, biz-<\/strong><\/td>\n<td>dos<\/td>\n<td>bicicleta, bimestre, bilingüe, bisabuelo<\/td>\n<\/tr>\n<tr>\n<td><strong>bio-<\/strong><\/td>\n<td>vida<\/td>\n<td>biología, biólogo, biografía, microbio<\/td>\n<\/tr>\n<tr>\n<td><strong>biblio-<\/strong><\/td>\n<td>libro<\/td>\n<td>biblioteca, bibliografía<\/td>\n<\/tr>\n<tr>\n<td><strong>bene-, bien-<\/strong><\/td>\n<td>bien<\/td>\n<td>beneficio, bienestar, bienvenida<\/td>\n<\/tr>\n<tr>\n<td><strong>sub-<\/strong><\/td>\n<td>debajo, menos<\/td>\n<td>subrayar, subterráneo, subconjunto<\/td>\n<\/tr>\n<tr>\n<td><strong>vice-, viz-, vi-<\/strong><\/td>\n<td>en lugar de<\/td>\n<td>vicepresidente, vizconde, virrey<\/td>\n<\/tr>\n<tr>\n<td><strong>villa-<\/strong> (la palabra <em>villa<\/em>, no un prefijo)<\/td>\n<td>pueblo, casa de campo<\/td>\n<td>villancico, villano<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y dos terminaciones que sí aguantan: <strong>-bilidad<\/strong> (<em>amabilidad, posibilidad<\/em>), con dos excepciones que se explican solas —<em>movilidad<\/em> viene de <em>móvil<\/em> y <em>civilidad<\/em> de <em>civil<\/em>—, y <strong>-bundo / -bunda<\/strong> (<em>moribundo, nauseabunda<\/em>).<\/p>\n<blockquote>\n<h4>⚠ Tres trampas de las listas de excepciones<\/h4>\n<p>Estas tres circulan en casi todas las listas, y las tres están mal. Aplicarlas produce faltas.<\/p>\n<p><strong>1. <em>Violador<\/em> no empieza por <em>vice-<\/em> ni por <em>villa-<\/em>.<\/strong> Viene de <em>violar<\/em>. Se escribe con v, sí, pero <strong>no por esa regla<\/strong>.<\/p>\n<p><strong>2. <em>Biólogo<\/em>, <em>biología<\/em> y <em>billar<\/em> no son excepciones a la regla de <em>vice-/villa-<\/em>.<\/strong> No pueden serlo: no empiezan por esos prefijos. <em>Biólogo<\/em> y <em>biología<\/em> empiezan por <em>bio-<\/em> 'vida', que es <strong>otra regla de esta misma tabla<\/strong>; <em>billar<\/em> es un préstamo del francés <em>billard<\/em>. Se parecen al oído, no a la vista.<\/p>\n<p><strong>3. <em>Ravioles<\/em> no empieza por <em>rab-<\/em>.<\/strong> Empieza por <em>rav-<\/em>, y viene del italiano <em>ravioli<\/em>.<\/p>\n<\/blockquote>\n<p><strong>Lo que tienen en común las listas de excepciones.<\/strong> Listas como «palabras que empiezan por <em>alb-, hab-, heb-, lab-, rab-, sab-, tab-<\/em>» no son reglas: equivalen a «escribe b donde se escribe b». No hay nada que razonar y, por tanto, nada que estudiar, por mucha página que ocupen.<\/p>\n<p><strong>Listado de posibles confusiones:<\/strong><\/p>\n<p><em>haber<\/em> / <em>a ver<\/em> · <em>hubo<\/em> · <em>iba<\/em> · <em>tuvo<\/em> / <em>tubo<\/em> · <em>hierba<\/em> / <em>hierva<\/em> · <em>prohibir<\/em> · <em>obtuvo<\/em> · <em>móvil<\/em> · <em>gobierno<\/em> · <em>abogado<\/em> · <em>absolver<\/em><\/p>\n<p>Dos que hay que tener resueltas antes de la prueba:<\/p>\n<ul>\n<li><strong><em>haber<\/em><\/strong> es el verbo: <em>va a haber problemas<\/em>, <em>tiene que haber una razón<\/em>. <strong><em>a ver<\/em><\/strong> es preposición más <em>ver<\/em>: <em>vamos a ver qué pasa<\/em>, <em>a ver si llueve<\/em>.<\/li>\n<li><strong><em>tuvo<\/em><\/strong> (de <em>tener<\/em>) frente a <strong><em>tubo<\/em><\/strong> (el objeto).<\/li>\n<\/ul>", "ejercicios": [{"tipo": "opcion", "titulo": "Suenan igual: elige la forma", "dossier": {"cuaderno": "4", "ejercicio": 5}, "ayuda": "Las dos formas de cada paréntesis se pronuncian igual y se distinguen por la clase de palabra. Elige la que corresponde a la oración.", "estricto": true, "items": [{"enun": "Va a <b>(haber / a ver)<\/b> problemas.", "sol": "haber", "porque": "verbo: <i>va a haber problemas<\/i>", "ops": ["a ver", "haber"]}, {"enun": "Vamos <b>(haber / a ver)<\/b> qué pasa.", "sol": "a ver", "porque": "la preposición <i>a<\/i> y el infinitivo <i>ver<\/i>: <i>vamos a comprobar qué pasa<\/i>", "ops": ["haber", "a ver"]}, {"enun": "Ayer <b>(tuvo / tubo)<\/b> fiebre.", "sol": "tuvo", "porque": "forma de <i>tener<\/i>", "ops": ["tuvo", "tubo"]}, {"enun": "Se rompió el <b>(tuvo / tubo)<\/b> del desagüe.", "sol": "tubo", "porque": "sustantivo: <i>el tubo<\/i>", "ops": ["tubo", "tuvo"]}, {"enun": "Espera a que <b>(hierva / hierba)<\/b> el agua.", "sol": "hierva", "porque": "forma de <i>hervir<\/i>", "ops": ["hierva", "hierba"]}, {"enun": "Cortó la <b>(hierva / hierba)<\/b> del jardín.", "sol": "hierba", "porque": "sustantivo: <i>la hierba<\/i>", "ops": ["hierva", "hierba"]}], "criterio": "<i>A ver<\/i> es la preposición <i>a<\/i> seguida del infinitivo <i>ver<\/i>, y se puede sustituir por <i>a comprobar<\/i>: <i>vamos a comprobar qué pasa<\/i>. <i>Haber<\/i> es un solo verbo, el que indica que algo existe: <i>va a haber problemas<\/i>. <i>Tuvo<\/i> y <i>hierva<\/i> son formas de <i>tener<\/i> y de <i>hervir<\/i>; <i>tubo<\/i> y <i>hierba<\/i> son sustantivos, y por eso admiten un artículo delante: <i>el tubo<\/i>, <i>la hierba<\/i>.", "apoyo": ["1 · B y V", "2 · Los prefijos que significan algo"], "dossier_txt": "Del dossier: nudo 4, ejercicio 5"}, {"tipo": "opcion", "titulo": "¿Eso es una regla?", "ayuda": "Seis afirmaciones que se oyen en clase de ortografía. Indica cuáles son reglas, es decir, cuáles permiten decidir la letra de una palabra que no se ha visto nunca.", "ops": ["es regla", "no es regla"], "items": [{"enun": "«Después de <i>m<\/i> siempre va <i>b<\/i>.»", "sol": "es regla", "porque": "se puede aplicar sin haber visto la palabra antes"}, {"enun": "«Los verbos acabados en <i>-buir<\/i> van con b.»", "sol": "es regla", "porque": "<i>distribuir<\/i>, <i>contribuir<\/i>, <i>atribuir<\/i>"}, {"enun": "«<i>Ravioles<\/i> es una excepción a la regla de <i>rab-<\/i>.»", "sol": "no es regla", "porque": "no empieza por <i>rab-<\/i>: empieza por <i>rav-<\/i>, del italiano"}, {"enun": "«<i>Biología<\/i> es una excepción a la regla de <i>vice-<\/i>.»", "sol": "no es regla", "porque": "no empieza por <i>vice-<\/i>: empieza por <i>bio-<\/i>"}, {"enun": "«Las palabras acabadas en <i>-bilidad<\/i> van con b.»", "sol": "es regla", "porque": "con dos excepciones, <i>movilidad<\/i> y <i>civilidad<\/i>, que derivan de <i>móvil<\/i> y <i>civil<\/i>"}, {"enun": "«Las palabras que empiezan por <i>rab-, sab-, tab-<\/i> van con b.»", "sol": "no es regla", "porque": "una lista de comienzos solo equivale a «escribe <i>b<\/i> donde se escribe <i>b<\/i>»"}], "criterio": "Una regla permite decidir la letra sin haber visto antes la palabra. Si para aplicarla hay que saber ya cómo se escribe, detrás hay una lista: «las palabras que empiezan por <i>rab-<\/i>, <i>sab-<\/i>, <i>tab-<\/i> van con <i>b<\/i>» equivale a «escribe <i>b<\/i> donde se escribe <i>b<\/i>». Las dos excepciones falsas circulan en casi todas las listas: <i>ravioles<\/i> empieza por <i>rav-<\/i> y no por <i>rab-<\/i>, y <i>biología<\/i> empieza por <i>bio-<\/i>, que es otra regla.", "apoyo": ["2 · Los prefijos que significan algo"], "solo_web": true}, {"tipo": "hueco", "titulo": "Seis palabras del listado de confusiones", "estricto": true, "ayuda": "Escribe la palabra que falta; entre paréntesis va el infinitivo cuando es una forma verbal. Las seis están en el listado de posibles confusiones del apartado 2.", "items": [{"enun": "El ______ aprobó la ayuda.", "sol": "gobierno", "porque": "en catalán es <i>govern<\/i>"}, {"enun": "Está ______ fumar en la sala. <i>(prohibir, participio)<\/i>", "sol": "prohibido", "porque": "verbo en <i>-bir<\/i>"}, {"enun": "Me he dejado el ______ en el autobús.", "sol": "móvil", "porque": "con <i>v<\/i>, aunque en catalán sea <i>mòbil<\/i>; lleva tilde por ser llana acabada en <i>l<\/i>"}, {"enun": "De pequeña ______ andando al colegio. <i>(ir)<\/i>", "sol": "iba", "porque": "el imperfecto de <i>ir<\/i>: <i>iba<\/i>, <i>íbamos<\/i>"}, {"enun": "La empresa ______ beneficios el año pasado. <i>(obtener)<\/i>", "sol": "obtuvo", "porque": "pretérito perfecto simple de <i>obtener<\/i>, con <i>v<\/i> como <i>tuvo<\/i>, de <i>tener<\/i>"}, {"enun": "El tribunal lo ______ de todos los cargos. <i>(absolver)<\/i>", "sol": "absolvió", "porque": "<i>b<\/i> delante de consonante (<i>bs<\/i>) y <i>v<\/i> en los verbos acabados en <i>-olver<\/i>"}], "criterio": "<i>Gobierno<\/i> se escribe con <i>b<\/i> y <i>móvil<\/i> con <i>v<\/i>, al revés que en catalán (<i>govern<\/i>, <i>mòbil<\/i>). <i>Prohibido<\/i> sigue la regla de los verbos en <i>-bir<\/i>; <i>iba<\/i>, la del imperfecto de <i>ir<\/i>; <i>obtuvo<\/i>, la del pretérito perfecto simple de <i>tener<\/i> y sus derivados; y <i>absolvió<\/i> lleva las dos letras: <i>b<\/i> delante de <i>s<\/i> y <i>v<\/i> en los verbos en <i>-olver<\/i>.", "apoyo": ["1 · B y V", "2 · Los prefijos que significan algo"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las faltas de b y v", "ayuda": "Siete palabras de este párrafo están mal escritas. Pincha en ellas.", "items": [{"texto": "El año pasado tubo que ir al abogado porque iva a haver un problema con el alquiler. Le dijeron que el govern había aprobado una ayuda, y que si el contrato era nuebo se podía pedir con el mobil. Fuimos haber qué pasaba y al final no hubo nada que hacer.", "faltas": {"tubo": "tuvo", "iva": "iba", "haver": "haber", "govern": "gobierno", "nuebo": "nuevo", "mobil": "móvil", "haber": "a ver"}}], "criterio": "<i>Haber<\/i> aparece mal escrito dos veces, por dos causas distintas. En <i>iva a haver<\/i> la falta es de letra: es el infinitivo del verbo y se escribe con <i>b<\/i>. En <i>Fuimos haber qué pasaba<\/i> la letra está bien y la palabra es otra: corresponde <i>a ver<\/i>, la preposición con el infinitivo <i>ver<\/i>. <i>Hubo<\/i>, en la última oración, está bien escrito: es una forma de <i>haber<\/i>.", "apoyo": ["⚠ Tres trampas de las listas de excepciones"], "solo_web": true}], "cuaderno_txt": "Nudo 4 · Las letras: B/V y J/G — apartados 1 y 2: B y V; Los prefijos que significan algo (p. 25 y 26) · ejercicio 5", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El resumen", "meta": "25 minutos · sobre el texto de arriba", "cuaderno": {"nudo": 17, "apartados": [3], "ejercicios": [7]}, "lectura": {"titulo": "El paquete de las siete", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["Yeray Montes empieza a las cuatro de la tarde y termina cuando se", "acaban los paquetes. Reparte en un barrio de casas bajas, con muchos", "timbres que no funcionan, y calcula que sube y baja unas doscientas", "escaleras al día. Cobra por paquete entregado, no por hora.", "", "Esa diferencia lo explica casi todo, según él. Si un portal no abre,", "pierde el tiempo y no cobra nada. Si el cliente no está, vuelve al día", "siguiente y tampoco cobra la primera visita. Por eso corre, y por eso", "deja paquetes donde no debería: en un felpudo, con un vecino, detrás", "de una maceta.", "", "Los clientes se quejan de eso, y él les da la razón. Dice que a nadie", "le gusta encontrar su compra en el suelo. Pero añade que la empresa", "promete una entrega en dos horas que nadie ha comprobado si cabe en un", "turno, y que esa promesa la firma el repartidor con las piernas.", "", "El servicio de atención al cliente sí funciona deprisa. Si un paquete", "desaparece, se devuelve el dinero en dos días y se abre una incidencia", "con el nombre del repartidor. Yeray lleva once incidencias este año.", "Ninguna de ellas recoge si el timbre funcionaba.", "", "Al final lo que se compra por internet no es solo el producto. Es", "también un plazo, y ese plazo lo sostiene alguien subiendo escaleras", "por un dinero que depende de que todos los portales se abran."], "pie": "Texto inventado. Ni Yeray Montes ni las cifras que da son reales."}, "teoria": "<h3>3 · El resumen<\/h3>\n<p><strong>La rúbrica oficial: cuatro niveles, no tres.<\/strong> Cópiala en el cuaderno.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">nivel<\/th>\n<th>qué exige<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\"><strong>1,5<\/strong><\/td>\n<td>recoge <strong>las ideas esenciales<\/strong>, de forma <strong>clara, ordenada y precisa<\/strong>, <strong>sin subjetividad<\/strong> y <strong>sin copia literal<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>1<\/strong><\/td>\n<td>recoge <strong>la mayoría<\/strong> de las esenciales, sin subjetividad ni copia, pero con algún fallo de precisión, claridad u orden<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0,5<\/strong><\/td>\n<td>fallos graves en las ideas esenciales, <strong>o<\/strong> no mantiene la objetividad, <strong>o<\/strong> copia literalmente, <strong>o<\/strong> se expresa con poca claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0<\/strong><\/td>\n<td>no recoge las ideas esenciales, malinterpreta el texto o está desordenado y confuso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Lee despacio la banda de 0,5: tiene <strong>cuatro «o»<\/strong>, y una sola basta para caer a un tercio de la nota. <strong>Copiar una frase baja a la misma banda que no haber entendido el texto.<\/strong> La rúbrica es la de 2025; en 2026 los niveles son 1,25 · 0,75 · 0,5 · 0, con los mismos descriptores.<\/p>\n<p><strong>Lo que no debe aparecer, seis elementos:<\/strong><\/p>\n<ol>\n<li><strong>Esquemas, guiones o listas con guiones.<\/strong> Se pide un texto redactado.<\/li>\n<li><strong>Ejemplos.<\/strong> El resumen se queda con la idea, no con el caso que la ilustra.<\/li>\n<li><strong>Opinión propia.<\/strong> «<em>Es muy triste que…<\/em>», «<em>a mi parecer…<\/em>»: eso es «marca de subjetividad».<\/li>\n<li><strong>Metadiscurso.<\/strong> «<em>El autor nos habla de…<\/em>» no resume nada. Si hay que atribuir una idea, se escribe «según el autor, …» y se sigue con el contenido.<\/li>\n<li><strong>Copia literal.<\/strong> El criterio oficial exige «sin copiar literalmente fragmentos del texto» y no fija cuántas palabras seguidas son un fragmento. La medida que usamos en clase para comprobarlo: ninguna cadena de tres o más palabras seguidas del original, salvo nombres propios y términos sin sinónimo.<\/li>\n<li><strong>Citas entrecomilladas.<\/strong> Si el original trae declaraciones, se pasan a <strong>estilo indirecto<\/strong> —contar lo dicho sin reproducir las palabras— y sin comillas.<\/li>\n<\/ol>\n<p><strong>Sobre la extensión.<\/strong> Se suele proponer un 25 % del original; el examen no fija porcentaje, fija puntos. Para estos textos (500-745 palabras), <strong>100-140 palabras<\/strong> funcionan.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Se queda en el resumen?", "dossier": {"cuaderno": "17", "ejercicio": 7}, "ayuda": "Seis frases escritas para resumir el texto de 2015, <i>La ciencia resucita aldeas<\/i>, que se abre con el icono «texto». Clasifica cada una: se queda en el resumen, o se quita por ser un ejemplo, una opinión o metadiscurso, tres de los seis elementos que no deben aparecer en un resumen según el apartado 3.", "ops": ["se queda", "se quita: es un ejemplo", "se quita: es opinión", "se quita: es metadiscurso"], "items": [{"enun": "«La aldea pierde población y envejece.»", "sol": "se queda", "porque": "es una idea del texto: la aldea pierde vecinos y los que quedan son mayores"}, {"enun": "«El autobús escolar llevaba cincuenta niños en los ochenta y ahora lleva cuatro.»", "sol": "se quita: es un ejemplo", "porque": "el dato del autobús ilustra la idea de que la aldea pierde población; si se quiere el matiz, se generaliza: «apenas quedan niños»"}, {"enun": "«Es una pena que los pueblos se queden vacíos.»", "sol": "se quita: es opinión", "porque": "«es una pena» es una marca de subjetividad, y por sí sola baja el resumen a 0,5"}, {"enun": "«Los vecinos abandonaron el cultivo por el trabajo en las serrerías.»", "sol": "se queda", "porque": "es una idea: la causa por la que se dejó el cultivo"}, {"enun": "«Un equipo de la Universidad de Santiago busca allí nichos de negocio.»", "sol": "se queda", "porque": "es una idea del texto, y entra si el enunciado la pide: si solo pregunta por el problema y sus causas, sobra"}, {"enun": "«El autor nos habla de la despoblación rural.»", "sol": "se quita: es metadiscurso", "porque": "ocupa ocho palabras sin dar ningún dato del contenido"}], "criterio": "Se quitan tres frases: la del autobús que llevaba cincuenta niños y ahora lleva cuatro es un ejemplo de la idea que ya recoge «La aldea pierde población y envejece»; «Es una pena…» es opinión, y «El autor nos habla de…», metadiscurso. Las otras tres son ideas del texto. La del equipo de la Universidad de Santiago entra solo si el enunciado la pide: si pregunta solo por el problema y sus causas, sobra aunque sea verdad.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2015"}, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 17, ejercicio 7", "texto_titulo": "2015 · La ciencia resucita aldeas", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La ciencia resucita aldeas<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Su trabajo será diferente en Galicia, un territorio donde descansan las ruinas de mil trescientas aldeas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">abandonadas, el 40 % de las que hay en España. Los setenta habitantes que resisten en el menguante<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">núcleo gallego de O Couto contactaron con este equipo científico en busca de ayuda hace dos años.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Tienen agua, luz y recogida de basuras, pero por sus calles ya no corretean niños y a los jóvenes no les<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">queda más remedio que irse a trabajar fuera. El autobús escolar, que a finales de los ochenta iba atestado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">con más de cincuenta críos, solo transporta ahora a cuatro chavales. Porque en O Couto muchas cosas<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">fueron las que empezaron a cambiar en los setenta.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hasta entonces, en este valle de A Costa da Morte, emplazado entre montes frondosos y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desembocadura del río Anllóns, se vivía «de lo que daba la tierra y el mar», recuerda Carmen Bermúdez.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A finales de la dictadura franquista, muchos de los habitantes en edad de volar empezaron a abandonar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sus casas por largas temporadas, unos enganchados al tren de la emigración y otros a las mareas en<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">el caladero irlandés del Gran Sol. Los que permanecieron en el pueblo se emplearon en los prósperos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aserraderos que se implantaron en la zona y, gracias a la generalización de las becas, estudiar fuera<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">dejó de ser un lujo reservado a los hijos del pudiente del pueblo. Así fue como la mayoría dijo adiós a la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">agricultura y ganadería de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Llegaron las ganas del dinero inmediato y con la tierra hay que saber esperar», explica el cambio de<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">mentalidad Adrián Varela, de treinta y tres años. Él trabaja en A Coruña y se hace a diario casi dos horas al<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">volante de su coche para no abandonar la aldea donde desea vivir. «La gente no marcha porque quiere.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La vida aquí es más fácil y rica», esgrime. «Sé que el campo y el mar son duros, pero el estrés de la ciudad<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también». Adrián espera que los investigadores de la Universidad descubran la fórmula que pueda revivir<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">O Couto, ya sea impulsando la agricultura ecológica, el uso de algas para la industria farmacéutica o la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">explotación del monte. Tiene claro que no se volverá a la agricultura de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La investigación en esta aldea gallega buscará «nichos de negocio» en los que se puedan crear<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">laboratorios», explica Agüera.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Sonia Vizoso, <\/em>El País<em>, 8 de agosto de 2014, tal como la imprimió la prueba de 2015. De aquí salen las frases del ejercicio 7.<\/em><\/p>"}, {"tipo": "hueco", "titulo": "Las ideas esenciales: ¿en qué línea?", "ayuda": "Antes de resumir hay que saber qué es esencial. Localiza las cuatro ideas y escribe el número de línea donde empieza cada una.", "items": [{"enun": "Cómo cobra Yeray, el dato del que sale todo lo demás.", "sol": "4"}, {"enun": "Por qué deja los paquetes donde no debe.", "sol": "5|6|7|8"}, {"enun": "Qué le reprocha a la empresa.", "sol": "11|12"}, {"enun": "Qué pasa cuando hay una incidencia.", "sol": "14|15|16"}], "criterio": "Las cuatro van seguidas y encadenadas: cobra por paquete → por eso corre → por eso deja los paquetes mal → y la incidencia la firma él. Un resumen que recoja esa cadena está completo aunque esté escrito con frases sencillas.", "apoyo": "todo", "solo_web": true}, {"tipo": "opcion", "titulo": "¿Entra en el resumen?", "ayuda": "Ocho frases que podrían acabar en un resumen de ese texto.", "ops": ["entra", "no entra"], "items": [{"enun": "<i>Sube y baja unas doscientas escaleras al día.<\/i>", "sol": "no entra", "porque": "es un ejemplo del esfuerzo, no una idea esencial — y además va copiado"}, {"enun": "<i>El sistema de pago por entrega condiciona cómo trabaja.<\/i>", "sol": "entra"}, {"enun": "<i>Las reclamaciones se archivan a nombre del repartidor sin recoger las condiciones del reparto.<\/i>", "sol": "entra"}, {"enun": "<i>La empresa promete un plazo que el repartidor sostiene con su tiempo.<\/i>", "sol": "entra"}, {"enun": "<i>Como él dice: «esa promesa la firma el repartidor con las piernas».<\/i>", "sol": "no entra", "porque": "las citas se pasan a estilo indirecto y sin comillas"}, {"enun": "<i>Cobrar por paquete y no por hora explica que corra y que entregue mal.<\/i>", "sol": "entra"}, {"enun": "<i>— cobra por paquete<br>— corre<br>— deja paquetes mal<\/i>", "sol": "no entra", "porque": "se pide un texto redactado, no un esquema"}, {"enun": "<i>Es injusto que las empresas traten así a los repartidores.<\/i>", "sol": "no entra", "porque": "marca de subjetividad"}], "criterio": "Las cuatro que no entran no son falsas ni están mal escritas: caen por la <b>forma<\/b>. Cada una incumple el enunciado de una manera distinta: un ejemplo copiado, una cita literal, un esquema y una opinión.", "apoyo": ["3 · El resumen"], "solo_web": true}, {"tipo": "abierta", "titulo": "El resumen · 10 minutos", "ayuda": "Entre 60 y 80 palabras, la consigna de clase. Con el texto <b>tapado<\/b>: haz primero las notas, luego esconde el texto y escribe, como manda el paso 5.", "items": [{"enun": "Resuma el texto anterior.", "modelo": "Un modelo de banda alta y otro de banda baja, abajo."}], "modelos": ["<b>≈1,5 · 80 palabras.<\/b> Un repartidor a domicilio cobra por paquete entregado y no por horas, de modo que cada portal cerrado o cliente ausente le supone trabajo sin remuneración. Esa forma de pago lo empuja a correr y a dejar envíos en sitios poco seguros, algo que él mismo admite que molesta a los clientes. Sostiene que la empresa promete plazos cortos sin comprobar si caben en una jornada, y que las reclamaciones se registran a su nombre sin atender a esas condiciones.", "<b>≈0,5 · 55 palabras.<\/b> <i>Yeray Montes empieza a las cuatro de la tarde y termina cuando se acaban los paquetes. Cobra por paquete entregado, no por hora. Por eso corre, y por eso deja paquetes donde no debería. A mí me parece muy injusto porque nadie debería trabajar así. Los clientes se quejan y él les da la razón.<\/i><br><br><b>Por qué 0,5:<\/b> tres cadenas copiadas literalmente, una marca de subjetividad y el nombre propio en vez de la idea general. Dos «o» de la banda, y con una bastaba."], "criterio": "Compara los dos. El de banda alta no copia ningún fragmento —ni una cadena de tres palabras del original— y cambia todos los verbos; el de abajo está bien entendido y aun así vale un tercio.<br><br>El bueno empieza así: «un repartidor a domicilio», no «Yeray Montes». El resumen se queda con lo que el caso <b>ejemplifica<\/b>, y el nombre propio casi nunca cuenta entre lo esencial.", "palabras": {"min": 60, "max": 80}, "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 3: El resumen (p. 46) · ejercicio 7", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "La sustitución: a qué se refiere cada pronombre", "meta": "30 minutos · acertar el tamaño resuelve la mitad del ejercicio", "cuaderno": {"nudo": 9, "apartados": [2], "ejercicios": [5, 6, 7]}, "teoria": "<h3>2 · La sustitución y el antecedente<\/h3>\n<p>Aquí empieza <strong>la<\/strong> parte del nudo que se pregunta en el examen.<\/p>\n<p><strong>Antecedente<\/strong> es la palabra —o el grupo de palabras, o la oración entera— <strong>a la que se refiere<\/strong> un pronombre. Se llama así porque casi siempre va <em>antes<\/em>. La relación entre el pronombre y lo que ya se ha dicho se llama <strong>anáfora<\/strong>; cuando el pronombre se adelanta a lo que viene después (<em>Te lo digo ya: no voy<\/em>), <strong>catáfora<\/strong>. Y el antecedente tiene <strong>tres tamaños<\/strong>: acertar el tamaño resuelve la mitad del ejercicio.<\/p>\n<table>\n<thead>\n<tr>\n<th>tamaño<\/th>\n<th>ejemplo real<\/th>\n<th>respuesta oficial<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>una palabra<\/strong><\/td>\n<td>«<strong>Los<\/strong> de este año irán al centro» (2026)<\/td>\n<td><em>pistachos<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>un sintagma<\/strong> <em>(un grupo de palabras: el sustantivo con todo lo que lleva)<\/em><\/td>\n<td>«él apenas <strong>los<\/strong> había pisado» (2026)<\/td>\n<td><em>campos familiares de su pueblo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>una oración entera<\/strong><\/td>\n<td>«no solo ha conseguido ganarse razonablemente bien la vida con <strong>ello<\/strong>» (2026)<\/td>\n<td><em>dedicarse a una profesión que conocía poco<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Uno de cada tres años el antecedente es una oración entera<\/strong> (2012, 2018, 2021, 2024, 2026). El fallo más frecuente consiste en buscar un sustantivo que no existe.<\/p>\n<blockquote>\n<p>«solo el 6 % de estos jóvenes <strong>lo<\/strong> pensaba» (2018) → <em>que los grandes organismos u organizaciones cumplían su función<\/em>.\n«En Madrid esa calidad es mayor en el norte por los vientos de la sierra, y por <strong>eso<\/strong> el sur, más contaminado, está más poblado» (2021) → <em>que en Madrid esa calidad es mayor en el norte por los vientos de la sierra<\/em>: toda la oración anterior.<\/p>\n<\/blockquote>\n<p><strong>Pista fiable:<\/strong> si el pronombre es <strong>neutro<\/strong> —<em>lo<\/em>, <em>ello<\/em>, <em>eso<\/em>, <em>esto<\/em>, <em>aquello<\/em>— y no encuentras un sustantivo que encaje, el antecedente <strong>es una oración<\/strong>. <em>Ello<\/em>, <em>eso<\/em>, <em>esto<\/em> y <em>aquello<\/em> son siempre neutros y no se refieren a sustantivos: se refieren a ideas, hechos y oraciones. <em>Lo<\/em> tiene dos usos: masculino singular (<em>el paludismo lo transmitía un mosquito<\/em>) y neutro (<em>lo pensaba<\/em> = <em>que…<\/em>).<\/p>\n<h4>El método, cuatro pasos<\/h4>\n<ol>\n<li><strong>Vuelve atrás desde el pronombre.<\/strong> El antecedente está antes, casi siempre en la misma frase o en la anterior.<\/li>\n<li><strong>Comprueba su género y su número.<\/strong> <em>Los<\/em> pide un masculino plural. <em>Ello<\/em> y <em>eso<\/em> son neutros, y <em>lo<\/em> puede serlo: <strong>avisan de que puede ser una oración<\/strong>.<\/li>\n<li><strong>Prueba la sustitución.<\/strong> Quita el pronombre, pon en su lugar el antecedente que propones y lee la frase. Si suena, has acertado.<\/li>\n<li><strong>Copia el grupo entero<\/strong>, no una palabra suelta. Si el antecedente es <em>campos familiares de su pueblo<\/em>, contestar <em>campos<\/em> es respuesta incompleta.<\/li>\n<\/ol>\n<p><strong>El relativo <em>que<\/em>.<\/strong> El pronombre más usado y el más confundido. Prueba: <strong>el <em>que<\/em> relativo lleva delante un antecedente —un sustantivo o un grupo nominal— que se puede volver a meter en su oración; la conjunción <em>que<\/em> no tiene antecedente, y la oración que introduce se cambia por <em>eso<\/em>.<\/strong><\/p>\n<blockquote>\n<p>«los problemas concretos y mucho más reales <strong>que<\/strong> puede provocar esta tecnología» (2025) → el antecedente es el grupo entero, <em>los problemas concretos y más reales<\/em>, y vuelve a su oración: <em>puede provocar los problemas<\/em>. <strong>Relativo.<\/strong>\n«el texto explica <strong>que<\/strong> la lectura digital es menos eficiente» (2013) → delante de <em>que<\/em> no hay ningún sustantivo al que sustituir, y la oración entera se cambia por <em>eso<\/em> (<em>explica eso<\/em>). <strong>Conjunción.<\/strong><\/p>\n<\/blockquote>\n<p>La diferencia está en lo que hace cada <em>que<\/em>. El relativo tiene antecedente y lo sustituye dentro de su oración: <em>los problemas que puede provocar<\/em> = <em>puede provocar los problemas<\/em>. La conjunción no sustituye a nada: <strong>introduce una oración subordinada<\/strong> que hace de complemento del verbo (<em>explica que la lectura digital es menos eficiente<\/em>), y esa oración entera se puede sustituir por <em>eso<\/em> o por un sustantivo: <em>explica eso<\/em>, <em>explica la diferencia<\/em>. Segunda prueba, por tanto: si detrás del <em>que<\/em> hay una oración completa que se puede cambiar por <em>eso<\/em>, es conjunción.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿De qué tamaño es el antecedente?", "dossier": {"cuaderno": "9", "ejercicio": 5, "parte": "el tamaño"}, "ayuda": "Indica si el antecedente del pronombre en negrita es una palabra, un sintagma o una oración entera. Los ítems con año son reales; cuando el antecedente no aparecía en la cita, va delante una oración inventada, en cursiva.", "ops": ["una palabra", "un sintagma", "una oración"], "items": [{"enun": "«La máquina no entiende el significado de cada término» […] «solo <b>los<\/b> coloca en el orden adecuado»", "conv": "2025", "sol": "una palabra", "porque": "el antecedente es el sustantivo de <i>cada término<\/i>"}, {"enun": "«Son todos esos que maltratan a sus perros, que <b>los<\/b> sacrifican cruelmente»", "conv": "2020", "sol": "un sintagma", "porque": "el antecedente es <i>sus perros<\/i>"}, {"enun": "«el placer, para mí incomprensible, de descerrajar<b>le<\/b> un tiro a un bello corzo»", "conv": "2020", "sol": "un sintagma", "porque": "el antecedente es <i>un bello corzo<\/i>; <i>le<\/i> es complemento indirecto: se le descerraja un tiro a alguien"}, {"enun": "«De los hombres me encanta, ya lo he dicho, que son lo otro. <b>Los<\/b> entiendo mucho mejor cuando escribo»", "conv": "2023", "sol": "una palabra", "porque": "el antecedente es <i>hombres<\/i>"}, {"enun": "Llamé a la gestora el lunes. <b>Le<\/b> expliqué el problema y me pidió los recibos.", "sol": "un sintagma", "porque": "<i>le<\/i> es complemento indirecto: <i>a la gestora<\/i>"}, {"enun": "<i>Trenado dejó su trabajo para dedicarse a una profesión que conocía poco.<\/i> «no solo ha conseguido ganarse razonablemente bien la vida con <b>ello<\/b>»", "conv": "2026", "sol": "una oración", "porque": "<i>ello<\/i> es neutro y sustituye a <i>dedicarse a una profesión que conocía poco<\/i>"}, {"enun": "«mientras que el 60 % de los adultos creía que los grandes organismos u organizaciones cumplían su función, solo el 6 % de estos jóvenes <b>lo<\/b> pensaba»", "conv": "2018", "sol": "una oración", "porque": "<i>lo<\/i> es neutro: no hay ningún sustantivo masculino singular al que pueda referirse"}, {"enun": "Mi vecina heredó una finca de olivos. <b>Los<\/b> vende porque no puede cuidarlos.", "sol": "una palabra", "porque": "el antecedente es <i>olivos<\/i>"}, {"enun": "El ayuntamiento prometió un centro de día hace cuatro años. Nadie <b>lo<\/b> ha visto todavía.", "sol": "un sintagma", "porque": "el antecedente es <i>un centro de día<\/i>"}, {"enun": "<i>A los seres humanos nos gusta creer que controlamos lo que inventamos.<\/i> «Todas estas historias <b>nos<\/b> previenen de querer volar demasiado alto»", "conv": "2025", "sol": "un sintagma", "porque": "el antecedente es <i>los seres humanos<\/i>, y <i>nos<\/i> incluye al autor y al lector"}, {"enun": "El casero subió el alquiler sin avisar, y <b>eso<\/b> no es legal.", "sol": "una oración", "porque": "<i>eso<\/i> es neutro y sustituye a la oración anterior entera"}, {"enun": "Mis hijos quieren tener un perro. Se <b>lo<\/b> he prohibido hasta que acaben el curso.", "sol": "una oración", "porque": "<i>lo<\/i> es neutro: lo prohibido es tener un perro, no el animal"}], "criterio": "Cuatro de los doce pronombres son neutros —<i>ello<\/i>, <i>eso<\/i> y dos <i>lo<\/i>— y los cuatro sustituyen a una oración entera. <i>Nos<\/i> y los dos <i>le<\/i> tienen por antecedente un grupo de palabras: <i>los seres humanos<\/i>, <i>el bello corzo<\/i>, <i>a la gestora<\/i>.", "usa_texto": false, "apoyo": ["2 · La sustitución y el antecedente"], "dossier_txt": "Del dossier:
