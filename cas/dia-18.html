<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 18 · 26 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}

/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}

  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}
/* una palabra con guion, barra o raya no se parte de un renglón a otro:

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 18, "fecha": "2026-11-26", "tab": "Día 18 · 26 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 18", "h1": "Jueves 26 de noviembre", "sub": "La lista y el recuento · la última devolución · las conjunciones", "carriles": [{"chapa": "Carril A", "titulo": "La lista y el recuento", "meta": "25 minutos · las siete familias del trimestre, en una redacción con faltas", "cuaderno": {"nudo": "4bis", "apartados": [4, 5], "ejercicios": [11, 13]}, "teoria": "<h3>4 · La concordancia<\/h3>\n<p>La concordancia <strong>no se localiza releyendo letras<\/strong>. No va en la Cuenta C, la de ortografía, sino en la <strong>Cuenta B<\/strong>, la de cohesión: <strong>0,75<\/strong>. Y en los bloques 1 y 2 descuenta 0,1 igual que una falta de letras.<\/p>\n<p>Concordar es ponerse de acuerdo:<\/p>\n<ul>\n<li><strong>sujeto y verbo<\/strong>, en número y persona: <em>los cazadores <b>aseguran<\/b> amar a los animales<\/em>.<\/li>\n<li><strong>nombre, determinante y adjetivo<\/strong>, en género y número: <em>una larga, cruel <b>agonía<\/b><\/em>.<\/li>\n<\/ul>\n<p>Los cuatro sitios donde se rompe:<\/p>\n<p><strong>1. El sujeto largo.<\/strong> Si entre sujeto y verbo hay muchas palabras, el verbo se va con la última que has oído. Este de 2015:<\/p>\n<blockquote>\n<p>«<strong>El futuro<\/strong> de O Couto, un paraje de A Costa da Morte habitado por una población envejecida y menguante, <strong>está<\/strong> en manos de un grupo de investigadores […] <strong>especializado<\/strong> en resucitar aldeas.»<\/p>\n<\/blockquote>\n<p><em>Está<\/em>, no «están»: el sujeto es <em>el futuro<\/em>. Y <em>especializado<\/em>, no «especializados»: acompaña a <em>grupo<\/em>. Salta lo que va entre comas y el sujeto queda al lado del verbo.<\/p>\n<p><strong>2. Los colectivos van en singular… con una excepción.<\/strong> <em>La gente<\/em>, <em>todo el mundo<\/em>: <strong>piensa<\/strong>, no «piensan». Pero cuando el colectivo lleva detrás <em>de<\/em> + plural —<em>la mayoría <b>de los alumnos<\/b><\/em>, <em>un grupo <b>de vecinos<\/b><\/em>— <strong>las dos concordancias son correctas<\/strong>: <em>aprobó<\/em> y <em>aprobaron<\/em>. Ninguna de las dos es falta. Si dudas, elige el singular.<\/p>\n<p><strong>3. <em>Haber<\/em> impersonal no tiene plural.<\/strong> Cuando significa «existir»: <em>hay<\/em>, <em>había<\/em>, <em>hubo<\/em>. <strong>«Habían muchos cazadores» es falta<\/strong>: <em>había muchos cazadores<\/em>.<\/p>\n<p><strong>4. Un adjetivo con dos nombres.<\/strong> Si son de distinto género, va en masculino plural: <em>un texto y una foto <b>elegidos<\/b><\/em>.<\/p>\n<blockquote>\n<p><strong>Y un contenido que aquí no está, a propósito: la mayúscula.<\/strong> Va con la puntuación, en el nudo 14, que se estudia en febrero. Si en tus textos aparecen mayúsculas mal puestas, se señalan y se dejan hasta entonces.<\/p>\n<\/blockquote>\n<h3>5 · Dónde termina la oración<\/h3>\n<p>La banda de cohesión de la redacción (0,75) cuenta la puntuación, y en cuatro de los seis modelos medios y bajos del nudo 18 el error que más se repite es la coma donde iba un punto: «los cazadores matan a los animales por diversión y eso no es un deporte, hay cazadores que tratan muy mal a sus perros». Son dos oraciones, cada una con su verbo y su sujeto, y entre dos oraciones así va un punto, no una coma. La puntuación entera se estudia en febrero, en el nudo 14; lo que hace falta ahora es localizar el final de cada oración.<\/p>\n<p><strong>Cómo se localiza.<\/strong> Se buscan los verbos conjugados. Cada verbo que no depende de otro —que no lleva delante <em>que<\/em>, <em>porque<\/em>, <em>cuando<\/em>, <em>si<\/em>, <em>aunque<\/em>— abre una oración nueva, y delante de ella va punto (o punto y coma), salvo que <em>y<\/em>, <em>pero<\/em> u <em>o<\/em> la una a la anterior: «Mi tío tenía unas tierras y las vendió» son dos verbos y una sola oración. En «la caza está muy mal porque los animales también tienen derecho a vivir, los cazadores matan a los animales por diversión» hay tres verbos: <em>está<\/em> abre la oración, <em>tienen<\/em> depende de <em>porque<\/em> y sigue en la misma, y <em>matan<\/em> no depende de nada: ahí empieza otra, y la coma tiene que ser un punto.<\/p>\n<p><strong>Dos comas que no se ponen:<\/strong> entre el sujeto y el verbo —«Los agricultores de la comarca protestaron», sin coma aunque el sujeto sea largo— y entre el verbo y su complemento directo —«El corrector cuenta las faltas»—.<\/p>\n<p><strong>Las que sí van:<\/strong> detrás del conector que abre la oración (<em>En primer lugar,<\/em> <em>Además,<\/em> <em>Sin embargo,<\/em>) y delante de <em>pero<\/em>.<\/p>\n<p>Cada coma puesta por punto es un error de la Cuenta B de la hoja A-1; a partir del tercero, cada dos bajan un tramo.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "Última pasada mixta", "dossier": {"cuaderno": "4bis", "ejercicio": 11}, "ayuda": "Cada frase tiene una falta. Escribe la frase corregida, o solo la palabra corregida.", "items": [{"enun": "La mayoría de la gente no saben escribir un resumen.", "requiere": [["no sabe", "sabe"]], "modelo": "«La mayoría de la gente no sabe escribir un resumen»: concordancia, colectivo"}, {"enun": "Vamos haber si el jueves sale bien.", "requiere": [["a ver"]], "modelo": "«Vamos a ver si el jueves sale bien»: palabras separadas"}, {"enun": "No es un problema de tiempo si no de método.", "requiere": [["sino"]], "modelo": "«No es un problema de tiempo sino de método»: palabras separadas; corrige lo negado"}, {"enun": "Habían muchas faltas en el primer texto.", "requiere": [["habia"]], "modelo": "«Había muchas faltas en el primer texto»: concordancia, <i>haber<\/i> impersonal"}, {"enun": "Estava convencida de que aprobaría.", "requiere": [["estaba"]], "modelo": "«Estaba convencida de que aprobaría»: <i>b<\/i> y <i>v<\/i>, imperfecto en <i>-aba<\/i>"}, {"enun": "El mensage del texto es bastante claro.", "requiere": [["mensaje"]], "modelo": "«El mensaje del texto es bastante claro»: <i>j<\/i> y <i>g<\/i>, sustantivo en <i>-aje<\/i>"}, {"enun": "No entiendo porqué lo hizo.", "requiere": [["no entiendo por que", "por que"]], "modelo": "«No entiendo por qué lo hizo»: palabras separadas, interrogativa indirecta"}, {"enun": "Ya e terminado la redacción.", "requiere": [["he"]], "modelo": "«Ya he terminado la redacción»: <i>h<\/i>, verbo <i>haber<\/i>"}], "criterio": "Las ocho faltas son de las siete familias del apartado 5: dos de concordancia (<i>la mayoría de la gente sabe<\/i>, <i>había muchas faltas<\/i>), tres de palabras que se separan (<i>a ver<\/i>, <i>sino<\/i>, <i>por qué<\/i>), una de <i>b<\/i> y <i>v<\/i>, una de <i>j<\/i> y <i>g<\/i> y una de <i>h<\/i>.", "pide": "la frase corregida", "apoyo": ["4 · La concordancia"], "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 11"}, {"tipo": "cazar", "titulo": "Pon los puntos que faltan", "ayuda": "Cada texto tiene cuatro oraciones pegadas con comas: en <b>tres sitios<\/b> de cada uno hay una coma donde va un punto. <b>Pincha la palabra que va justo antes de esa coma.<\/b> Al escribirlo, detrás de cada punto nuevo iría mayúscula.", "items": [{"texto": "El piso está a cuarenta minutos del trabajo, lo cogimos porque no había nada más cerca por ese dinero, el casero subió el alquiler a los seis meses, ahora buscamos otro.", "faltas": {"trabajo": "trabajo.", "dinero": "dinero.", "meses": "meses."}}, {"texto": "Mi tío tenía unas tierras en el pueblo y las vendió, no sacaba nada de ellas, ahora hay naves donde estaban los olivos, la gente de ciudad no sabe lo que cuesta un kilo de tomates.", "faltas": {"vendió": "vendió.", "ellas": "ellas.", "olivos": "olivos."}}], "criterio": "En el texto del piso abren oración <i>está<\/i>, <i>cogimos<\/i>, <i>subió<\/i> y <i>buscamos<\/i>; <i>había<\/i> depende de <i>porque<\/i> y no abre ninguna. En el texto del tío, <i>vendió<\/i> va unido a <i>tenía<\/i> por <i>y<\/i>, en la misma oración; <i>estaban<\/i> depende de <i>donde<\/i> y <i>cuesta<\/i> de <i>lo que<\/i>. Tres puntos en cada texto, ni uno más: el corrector cuenta cada coma que hace de punto, y también cada punto que parte una oración por la mitad («Lo cogimos. Porque no había nada más cerca» es otro error).", "apoyo": ["5 · Dónde termina la oración"], "dossier": {"cuaderno": "4bis", "ejercicio": 13}, "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 13"}, {"tipo": "clasificar", "titulo": "Reparte estas faltas", "ayuda": "Doce faltas reales de redacciones. Ponlas en su casilla: así averiguas de qué familia son las tuyas.", "ops": ["b / v", "j / g", "h", "palabras separadas", "concordancia", "tildes"], "items": [{"enun": "escribió <i>tambien<\/i>", "sol": "tildes"}, {"enun": "escribió <i>la gente piensan<\/i>", "sol": "concordancia"}, {"enun": "escribió <i>deshechos<\/i> por residuos", "sol": "h"}, {"enun": "escribió <i>diálogo<\/i> sin tilde", "sol": "tildes"}, {"enun": "escribió <i>a ver<\/i> donde iba el verbo", "sol": "palabras separadas"}, {"enun": "escribió <i>habían muchas personas<\/i>", "sol": "concordancia"}, {"enun": "escribió <i>mensage<\/i>", "sol": "j / g"}, {"enun": "escribió <i>iva<\/i> por <i>iba<\/i>", "sol": "b / v"}, {"enun": "escribió <i>nobiembre<\/i>", "sol": "b / v"}, {"enun": "escribió <i>echo<\/i> por <i>hecho<\/i>", "sol": "h"}, {"enun": "escribió <i>sobretodo<\/i> por <i>especialmente<\/i>", "sol": "palabras separadas"}, {"enun": "escribió <i>garage<\/i>", "sol": "j / g"}], "criterio": "Doce faltas repartidas en seis casillas, dos por casilla. Con las tuyas no va a salir así: van a salir tres o cuatro en una sola, y esa concentración constituye la información que busca el ejercicio.<br><br>La séptima casilla —la palabra dudosa— no aparece aquí porque solo la conoces tú: la escribiste sin estar seguro.", "apoyo": ["4 · La concordancia"], "solo_web": true}, {"tipo": "cazar", "titulo": "Cuenta C: las palabras mal escritas", "ayuda": "Una redacción de 102 palabras. Tiene <b>cinco palabras mal escritas<\/b>. Pínchalas. De las dos pasadas que se hacen al releer, esta es la de las palabras, letra por letra.", "items": [{"texto": "Yo creo que el transporte público de mi barrio esta mal organizado. El autobus pasa cada veinte minutos, a las siete de la mañana va tan lleno que muchos días no puedo subir. Eso significa llegar tarde al trabajo, el jefe ya me lo ha dicho dos veces. El transporte es caro para lo que ofrece, el transporte tendría que pasar mas veces por la mañana. El transporte del fin de semana empieza a las nueve, para quien trabaja el sábado eso no sirve de nada. He echo una reclamación en la web del ayuntamiento, ahora hay que esperar haber si contestan.", "faltas": {"esta": "está", "autobus": "autobús", "mas": "más", "echo": "hecho", "haber": "a ver"}}], "criterio": "Tres de las cinco son de tilde —<i>está<\/i>, <i>autobús<\/i>, <i>más<\/i>—, una es de h y una es de palabras separadas. Repartidas en el cuadro de siete casillas, este texto manda a su autor a repasar tildes el fin de semana.<br><br>Las dos que más tardan en localizarse existen escritas de las dos maneras: <i>esta<\/i> y <i>está<\/i> son palabras las dos, y <i>mas<\/i> y <i>más<\/i> también. El corrector automático no las marca.", "apoyo": ["5 · Dónde termina la oración"], "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartados 4 y 5: La concordancia; Dónde termina la oración (p. 37 y 38) · ejercicios 11 y 13", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El tercer texto y las dos pasadas", "meta": "35 minutos · dos pasadas y una redacción entera", "cuaderno": [{"nudo": 17, "apartados": [4], "ejercicios": [14], "secciones": {"4": ["2015"]}}, {"nudo": 18, "apartados": [5, 6], "ejercicios": [14, 15]}], "teoria": "<h3>Nudo 17 · 4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2015 · La ciencia resucita aldeas<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La ciencia resucita aldeas<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Su trabajo será diferente en Galicia, un territorio donde descansan las ruinas de mil trescientas aldeas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">abandonadas, el 40 % de las que hay en España. Los setenta habitantes que resisten en el menguante<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">núcleo gallego de O Couto contactaron con este equipo científico en busca de ayuda hace dos años.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Tienen agua, luz y recogida de basuras, pero por sus calles ya no corretean niños y a los jóvenes no les<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">queda más remedio que irse a trabajar fuera. El autobús escolar, que a finales de los ochenta iba atestado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">con más de cincuenta críos, solo transporta ahora a cuatro chavales. Porque en O Couto muchas cosas<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">fueron las que empezaron a cambiar en los setenta.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hasta entonces, en este valle de A Costa da Morte, emplazado entre montes frondosos y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desembocadura del río Anllóns, se vivía «de lo que daba la tierra y el mar», recuerda Carmen Bermúdez.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A finales de la dictadura franquista, muchos de los habitantes en edad de volar empezaron a abandonar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sus casas por largas temporadas, unos enganchados al tren de la emigración y otros a las mareas en<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">el caladero irlandés del Gran Sol. Los que permanecieron en el pueblo se emplearon en los prósperos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aserraderos que se implantaron en la zona y, gracias a la generalización de las becas, estudiar fuera<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">dejó de ser un lujo reservado a los hijos del pudiente del pueblo. Así fue como la mayoría dijo adiós a la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">agricultura y ganadería de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Llegaron las ganas del dinero inmediato y con la tierra hay que saber esperar», explica el cambio de<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">mentalidad Adrián Varela, de treinta y tres años. Él trabaja en A Coruña y se hace a diario casi dos horas al<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">volante de su coche para no abandonar la aldea donde desea vivir. «La gente no marcha porque quiere.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La vida aquí es más fácil y rica», esgrime. «Sé que el campo y el mar son duros, pero el estrés de la ciudad<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también». Adrián espera que los investigadores de la Universidad descubran la fórmula que pueda revivir<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">O Couto, ya sea impulsando la agricultura ecológica, el uso de algas para la industria farmacéutica o la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">explotación del monte. Tiene claro que no se volverá a la agricultura de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La investigación en esta aldea gallega buscará «nichos de negocio» en los que se puedan crear<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">laboratorios», explica Agüera.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Sonia Vizoso, <\/em>El País<em>, 8 de agosto de 2014, tal como la imprimió la prueba de 2015. De aquí salen las frases del ejercicio 7.<\/em><\/p>\n<h3>Nudo 18 · 5 · Nueve redacciones puntuadas<\/h3>\n<p>Léelas con la hoja A-1 delante y puntúalas tú antes de mirar la nota.<\/p>\n<h4>Consigna de 2021, opción A — <em>la educación para poder mejorar la vida de las personas<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 106 palabras.<\/p>\n<blockquote>\n<p>Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>3<\/strong>.<\/p>\n<p>Tesis discutible en la primera frase; dos argumentos con conector (<em>en primer lugar<\/em>, <em>además<\/em>); una concesión (<em>es cierto que… pero<\/em>) que sube variación; cierre con consecuencia, no repetición; ni una falta ni una coma que sobre. <strong>Es el único de los nueve que llega a 3.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 98 palabras.<\/p>\n<blockquote>\n<p>Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,25<\/strong>.<\/p>\n<p>Sin faltas y con los puntos donde van, corrección y cohesión quedan enteras; pierde en las otras cuatro bandas. La tesis no es discutible; los tres argumentos se suman con <em>también<\/em>, sin marcar el orden (<em>en primer lugar<\/em>, <em>además<\/em>), y se acumulan; el cierre repite la primera frase casi igual (coherencia, 0,25). <em>Ayudar<\/em> aparece cuatro veces, <em>la educación<\/em> cuatro y <em>yo pienso que<\/em> dos: palabras que se repiten a menudo, y la variación se queda en 0. El <em>tú<\/em> de conversación (<em>te ayuda<\/em>, <em>si tú sabes<\/em>) y <em>yo pienso que<\/em> dejan el registro en 0.<\/p>\n<p><strong>Modelo bajo.<\/strong> 63 palabras.<\/p>\n<blockquote>\n<p>La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,35<\/strong>, y prorrateado por la extensión, ≈ <strong>0,85<\/strong>.<\/p>\n<p>Siete faltas de ortografía en 63 palabras (corrección, 0,6) — Cuenta C: <em>educacion<\/em> (dos veces), <em>inportante<\/em>, <em>por que<\/em>, <em>ningun<\/em>, <em>estudio<\/em>, <em>estan<\/em>. Cuenta B: tres comas donde iba punto —tras <em>nada<\/em>, tras <em>igual<\/em> y tras <em>y punto<\/em>—, y con tres la cohesión baja a 0,5. No hay tesis discutible, la razón es un ejemplo (<em>en mi pueblo<\/em>) y el final se desdice (coherencia, 0). <em>O sea<\/em> y <em>y punto<\/em> son marcas de oralidad (registro, 0). Y se queda por debajo de las 80 de clase: cada banda se prorratea por la extensión, 63 de las 100 palabras pedidas.<\/p>\n<h4>Consigna de 2020, opción A — <em>la caza<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 111 palabras.<\/p>\n<blockquote>\n<p>Creo que la caza no se puede defender ni condenar en bloque, porque el juicio dependerá de la razón por la que se cace. En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien. Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos. Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no tiene otro objeto que presumir. Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia, ni una falta y una concesión. <em>Por qué no es un tres:<\/em> supongamos que el folio viene sin márgenes. <strong>Ha perdido la banda que solo exige márgenes y letra legible.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 97 palabras. <em>(Escrito con las faltas que se repiten en los primeros textos de clase.)<\/em><\/p>\n<blockquote>\n<p>Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0,8<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,80<\/strong>.<\/p>\n<p>Las razones se amontonan y el final abre un tema nuevo. Cuenta B: cuatro comas donde iba punto, y el punto que falta detrás de <em>sin comida<\/em>. Cuenta C: <em>esta<\/em>, <em>tambien<\/em>, <em>diversion<\/em>, <em>ademas<\/em>, <em>ningun<\/em>. Y <em>animales<\/em> cuatro veces. <strong>Le falta la estructura: una tesis, dos razones con conector y un cierre.<\/strong><\/p>\n<p><strong>Modelo bajo.<\/strong> 83 palabras.<\/p>\n<blockquote>\n<p>A mi la caza me parese una cosa muy antigua que ya no sirbe para nada, en mi pueblo ay muchos cazadores y salen los domingos con las escopetas, luego se ban al bar a contarlo, yo e ido alguna vez de pequeño y la berdad es que no me gusto nada ver al conejo aquel echo un cristo, o sea que por mi que la proiban ya y punto, tanpoco quiero meterme con nadie por que cada uno hase lo que kiere.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>La idea llega al final y luego se desdice. Cinco comas donde iba un punto. Quince faltas —Cuenta C: <em>mi<\/em> (dos veces, sin tilde), <em>parese<\/em>, <em>sirbe<\/em>, <em>ay<\/em>, <em>ban<\/em>, <em>e<\/em>, <em>berdad<\/em>, <em>gusto<\/em>, <em>echo<\/em>, <em>proiban<\/em>, <em>tanpoco<\/em>, <em>por que<\/em>, <em>hase<\/em>, <em>kiere<\/em>—: a partir de doce, corrección es cero. <em>O sea<\/em> y <em>echo un cristo<\/em> se llevan el registro. Y <strong>83 palabras: tres por encima del límite de clase para el prorrateo.<\/strong> Un apunte que tranquiliza: esas quince faltas <strong>no descuentan otros 1,50 aparte<\/strong>, porque la penalización de 0,10 solo corre en los bloques 1 y 2.<\/p>\n<h4>Consigna de 2026, opción A — <em>la necesidad de defender el trabajo agrícola<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 110 palabras.<\/p>\n<blockquote>\n<p>Creo que hay que defender el trabajo agrícola porque de él depende quién decide el precio de lo que comemos. En primer lugar el agricultor cobra por su cosecha una parte muy pequeña de lo que pagamos en la tienda, y la diferencia se la quedan los intermediarios. Además el campo depende de un clima cada vez menos previsible, y dos años malos seguidos pueden cerrar una explotación entera. Es cierto que las subvenciones sostienen al sector cada año pero una ayuda no sustituye un precio justo. Por eso pienso que defender el campo es asegurar que la comida se siga produciendo aquí y no dependa solo de las importaciones.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia y ni una falta. <em>Por qué no es un tres:<\/em> le faltan tres comas —tras <em>En primer lugar<\/em>, tras <em>Además<\/em> y delante de <em>pero<\/em>—. <strong>Los dos primeros errores de cohesión no bajan la banda; a partir del tercero, cada dos errores bajan 0,25, y con tres se queda en 0,5.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 95 palabras, con sus faltas.<\/p>\n<blockquote>\n<p>Yo creo que el trabajo agricola es muy importante para todos porque sin agricultores no comeriamos, los agricultores trabajan mucho y ganan muy poco dinero y eso no esta bien, en mi pueblo casi todos los jovenes se an ido a la ciudad y las tierras se quedan sin nadie que las trabaje, tambien está el problema de que la comida viene de fuera y es más barata. Yo creo que hay que ayudar a los agricultores porque el trabajo agricola es muy importante para todos y luego nos quejamos cuando todo sube de precio.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,85<\/strong>.<\/p>\n<p>El cierre es la primera frase copiada. Tres comas donde iba punto. Siete faltas —Cuenta C: <em>agricola<\/em> (dos veces), <em>comeriamos<\/em>, <em>esta<\/em>, <em>jovenes<\/em>, <em>an<\/em>, <em>tambien<\/em>—, y dos son la misma palabra: <em>agricola<\/em> cuenta cada vez. <em>Por qué está donde está:<\/em> le faltan dos partes que se arreglan en tres minutos: <strong>una tesis discutible y un cierre que no la repita<\/strong>.<\/p>\n<p><strong>Modelo bajo.<\/strong> 91 palabras.<\/p>\n<blockquote>\n<p>El campo es muy duro. Mi tio tenia unas tierras aya en el pueblo y las bendio por que no sacaba nada. Ahora ai muchas naves. La gente de ciudad no save lo que cuesta un kilo de tomates, en berano fui a coger aceituna y acabé echo polvo. Yo que se, esto tendrian que areglarlo los de arriba. Tambien es verda que la fruta de fuera esta mas barata y la gente compra lo barato, es normal. En fin, que el campo esta fatal y no ay quien lo arregle.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>No hay tesis: salta del tío a los tomates y a la aceituna, y al final se desdice. Dieciocho faltas contadas por lo bajo — Cuenta C: <em>tio<\/em>, <em>tenia<\/em>, <em>aya<\/em>, <em>bendio<\/em>, <em>por que<\/em>, <em>ai<\/em>, <em>save<\/em>, <em>berano<\/em>, <em>echo<\/em>, <em>se<\/em>, <em>tendrian<\/em>, <em>areglarlo<\/em>, <em>Tambien<\/em>, <em>verda<\/em>, <em>esta<\/em> (dos veces), <em>mas<\/em>, <em>ay<\/em>. <em>Yo que se<\/em> y <em>echo polvo<\/em> se llevan el registro. <em>Por qué está donde está:<\/em> <strong>la cohesión supera a la de los otros dos modelos bajos<\/strong> —frases cortas, acabadas en punto— y aun así saca 0,75, porque no hay tesis ni argumentos y las dieciocho faltas dejan la corrección en cero.<\/p>\n<h3>Nudo 18 · 6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2015: las tres preguntas", "dossier": {"cuaderno": "17", "ejercicio": 14, "parte": "1.1 a 1.3"}, "ayuda": "Las preguntas oficiales de 2015, sobre «La ciencia resucita aldeas», que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos, y antes de entregar, las dos pasadas de relectura del nudo 4 bis.", "items": [{"enun": "«Escriba un resumen explicando, con sus propias palabras, el problema que tiene la aldea gallega de O Couto y exponga cuáles son las razones que han llevado a su situación actual.» <b>[1,5]<\/b>", "conv": "2015", "modelo": "La aldea gallega de O Couto, a pesar de su entorno natural, padece un problema de despoblación y de envejecimiento de los residentes, al que se añade un problema económico, porque no hay posibilidades de empleo en la zona. Las razones se originaron en los años setenta, cuando la aldea empezó a despoblarse por la emigración hacia otras zonas de España y por las largas temporadas de trabajo de los hombres en barcos de pesca; años más tarde, los hijos de los que se quedaron se fueron a estudiar fuera y ya no volvieron; y en la actualidad los jóvenes se van porque no encuentran trabajo cerca."}, {"enun": "«Según Adrián Varela, ¿cuál es el cambio de mentalidad que se ha producido y que ha empeorado el problema de O Couto?» <b>[0,5]<\/b>", "conv": "2015", "modelo": "Según Adrián Varela, el cambio de mentalidad fue que llegaron las ganas de conseguir dinero de forma inmediata, lo que conllevaba falta de paciencia para esperar los resultados que dan a medio y largo plazo las inversiones en la agricultura."}, {"enun": "«¿Cuáles son los objetivos del proyecto de investigación que lleva a cabo la Universidad de Santiago de Compostela?» <b>[0,5]<\/b>", "conv": "2015", "modelo": "Los objetivos son modificar la forma de actuar de los habitantes de la aldea y ayudarlos a encontrar oportunidades de negocio con las que crear microempresas que permitan mantenerse a quienes viven en el pueblo y volver a quienes lo deseen; algunos de esos negocios pueden basarse en el uso de algas para la industria farmacéutica, la agricultura ecológica o la explotación del monte."}], "criterio": "Los modelos son las respuestas oficiales de 2015. El resumen de la 1.1 vale 1,5 y se corrige con la rúbrica de cuatro niveles (1,5 · 1 · 0,5 · 0); las otras dos, con las tres bandas del apartado 2 del nudo 17. Las faltas descuentan 0,1 en todo el bloque.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2015"}, "apoyo": ["2015 · La ciencia resucita aldeas"], "dossier_txt": "Del dossier: nudo 17, ejercicio 14 · 1.1 a 1.3", "texto_titulo": "2015 · La ciencia resucita aldeas", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La ciencia resucita aldeas<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Su trabajo será diferente en Galicia, un territorio donde descansan las ruinas de mil trescientas aldeas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">abandonadas, el 40 % de las que hay en España. Los setenta habitantes que resisten en el menguante<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">núcleo gallego de O Couto contactaron con este equipo científico en busca de ayuda hace dos años.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Tienen agua, luz y recogida de basuras, pero por sus calles ya no corretean niños y a los jóvenes no les<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">queda más remedio que irse a trabajar fuera. El autobús escolar, que a finales de los ochenta iba atestado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">con más de cincuenta críos, solo transporta ahora a cuatro chavales. Porque en O Couto muchas cosas<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">fueron las que empezaron a cambiar en los setenta.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hasta entonces, en este valle de A Costa da Morte, emplazado entre montes frondosos y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desembocadura del río Anllóns, se vivía «de lo que daba la tierra y el mar», recuerda Carmen Bermúdez.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A finales de la dictadura franquista, muchos de los habitantes en edad de volar empezaron a abandonar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sus casas por largas temporadas, unos enganchados al tren de la emigración y otros a las mareas en<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">el caladero irlandés del Gran Sol. Los que permanecieron en el pueblo se emplearon en los prósperos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aserraderos que se implantaron en la zona y, gracias a la generalización de las becas, estudiar fuera<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">dejó de ser un lujo reservado a los hijos del pudiente del pueblo. Así fue como la mayoría dijo adiós a la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">agricultura y ganadería de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Llegaron las ganas del dinero inmediato y con la tierra hay que saber esperar», explica el cambio de<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">mentalidad Adrián Varela, de treinta y tres años. Él trabaja en A Coruña y se hace a diario casi dos horas al<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">volante de su coche para no abandonar la aldea donde desea vivir. «La gente no marcha porque quiere.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La vida aquí es más fácil y rica», esgrime. «Sé que el campo y el mar son duros, pero el estrés de la ciudad<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también». Adrián espera que los investigadores de la Universidad descubran la fórmula que pueda revivir<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">O Couto, ya sea impulsando la agricultura ecológica, el uso de algas para la industria farmacéutica o la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">explotación del monte. Tiene claro que no se volverá a la agricultura de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La investigación en esta aldea gallega buscará «nichos de negocio» en los que se puedan crear<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">laboratorios», explica Agüera.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Sonia Vizoso, <\/em>El País<em>, 8 de agosto de 2014, tal como la imprimió la prueba de 2015. De aquí salen las frases del ejercicio 7.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "Bloque 1 de 2015: el léxico", "dossier": {"cuaderno": "17", "ejercicio": 14, "parte": "1.4"}, "ayuda": "La pregunta 1.4 de 2015: «Proponga un sinónimo o explique el significado de las siguientes palabras o expresiones. Preste atención a la adecuación de la palabra al contexto en el que se encuentra.» Vale 1 punto.", "items": [{"enun": "<i>autosuficientes<\/i> (línea 8)", "modelo": "que tienen la capacidad de conseguir por sí mismos todo lo necesario para subsistir"}, {"enun": "<i>en edad de volar<\/i> (línea 18)", "modelo": "en la edad de empezar a ser autónomo y llevar una vida propia"}, {"enun": "<i>implantaron<\/i> (línea 21)", "modelo": "establecieron"}, {"enun": "<i>reservado<\/i> (línea 22)", "modelo": "limitado, exclusivo"}], "criterio": "Cada palabra vale 0,25. El sinónimo tiene que servir en la frase del texto: <i>en edad de volar<\/i> se dice de los jóvenes que ya pueden irse de casa, no de los pájaros.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2015"}, "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2015 · La ciencia resucita aldeas"], "dossier_txt": "Del dossier: nudo 17, ejercicio 14 · 1.4", "texto_titulo": "2015 · La ciencia resucita aldeas", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La ciencia resucita aldeas<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\
