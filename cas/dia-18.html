 «nichos de negocio» en los que se puedan crear<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">laboratorios», explica Agüera.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Sonia Vizoso, <\/em>El País<em>, 8 de agosto de 2014, tal como la imprimió la prueba de 2015. De aquí salen las frases del ejercicio 7.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "El texto entero: la vida en los pueblos", "dossier": {"cuaderno": "18", "ejercicio": 14}, "ayuda": "El texto entero, unas cien palabras, en veinte minutos. Antes de entregar, cuenta las palabras y haz las dos pasadas de relectura del nudo 4 bis: una para los verbos y otra para la palabra dudosa.", "items": [{"enun": "Consigna de 2015, opción A: <i>su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población<\/i>.", "modelo": "Un modelo de 108 palabras debajo, el de la clave del dossier.", "palabras": {"min": 90, "max": 120}}], "criterio": "Además de las cinco partes, la relectura tiene que haber pasado por los verbos —<i>había<\/i>, <i>iba<\/i>, <i>hubo<\/i>— y por la palabra dudosa. Un texto de cien palabras con cuatro faltas pierde 0,2 en corrección, y con seis, 0,4.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2015"}, "modelos": ["Creo que vivir en un pueblo compensa mientras haya trabajo cerca, y deja de compensar en cuanto no lo hay. En primer lugar, el alquiler y la comida cuestan menos que en la ciudad, y con el mismo sueldo se vive con más margen. Además, en un pueblo pequeño los vecinos saben quién eres y responden cuando hace falta. Es cierto que sin médico, sin autobús y sin colegio la vida se complica, pero esos servicios se pierden porque antes se ha ido la gente. Por eso pienso que un pueblo con empleo cerca es el mejor sitio para vivir, y que sin empleo no lo es ninguno."], "apoyo": ["Consigna de 2021, opción A — la educación para poder mejorar la vida de las personas", "Consigna de 2026, opción A — la necesidad de defender el trabajo agrícola"], "dossier_txt": "Del dossier: nudo 18, ejercicio 14", "texto_titulo": "2015 · La ciencia resucita aldeas", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La ciencia resucita aldeas<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El futuro de O Couto, un paraje de A Costa da Morte (A Coruña) habitado por una población envejecida y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">menguante, está en manos de un grupo de investigadores de la Universidad de Santiago de Compostela<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">especializado en resucitar aldeas por el mundo. Dirigidos por la física Ángeles López Agüera, entre<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">sus trece miembros hay ingenieros, economistas, arquitectos y hasta un politólogo. Desde hace cinco<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años y bajo la supervisión de la Unesco, estos científicos unen sus conocimientos para transformar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pequeñas comunidades vecinales de América Latina y África que no tenían ni los servicios más básicos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en poblaciones «autosuficientes» —económica y energéticamente—, sostenibles y adaptadas al siglo xxi.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Su trabajo será diferente en Galicia, un territorio donde descansan las ruinas de mil trescientas aldeas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">abandonadas, el 40 % de las que hay en España. Los setenta habitantes que resisten en el menguante<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">núcleo gallego de O Couto contactaron con este equipo científico en busca de ayuda hace dos años.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Tienen agua, luz y recogida de basuras, pero por sus calles ya no corretean niños y a los jóvenes no les<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">queda más remedio que irse a trabajar fuera. El autobús escolar, que a finales de los ochenta iba atestado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">con más de cincuenta críos, solo transporta ahora a cuatro chavales. Porque en O Couto muchas cosas<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">fueron las que empezaron a cambiar en los setenta.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hasta entonces, en este valle de A Costa da Morte, emplazado entre montes frondosos y la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desembocadura del río Anllóns, se vivía «de lo que daba la tierra y el mar», recuerda Carmen Bermúdez.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">A finales de la dictadura franquista, muchos de los habitantes en edad de volar empezaron a abandonar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sus casas por largas temporadas, unos enganchados al tren de la emigración y otros a las mareas en<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">el caladero irlandés del Gran Sol. Los que permanecieron en el pueblo se emplearon en los prósperos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aserraderos que se implantaron en la zona y, gracias a la generalización de las becas, estudiar fuera<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">dejó de ser un lujo reservado a los hijos del pudiente del pueblo. Así fue como la mayoría dijo adiós a la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">agricultura y ganadería de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Llegaron las ganas del dinero inmediato y con la tierra hay que saber esperar», explica el cambio de<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">mentalidad Adrián Varela, de treinta y tres años. Él trabaja en A Coruña y se hace a diario casi dos horas al<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">volante de su coche para no abandonar la aldea donde desea vivir. «La gente no marcha porque quiere.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La vida aquí es más fácil y rica», esgrime. «Sé que el campo y el mar son duros, pero el estrés de la ciudad<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también». Adrián espera que los investigadores de la Universidad descubran la fórmula que pueda revivir<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">O Couto, ya sea impulsando la agricultura ecológica, el uso de algas para la industria farmacéutica o la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">explotación del monte. Tiene claro que no se volverá a la agricultura de subsistencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">La investigación en esta aldea gallega buscará «nichos de negocio» en los que se puedan crear<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«microempresas» con las que se ganen la vida tanto los que no quieren abandonar el campo como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quienes sueñan con regresar a él. «No son proyectos asistencialistas, no somos una ONG. Nosotros no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">damos nada, lo que hacemos es ayudar a estas personas a modificar su forma de actuar. Son nuestros<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">laboratorios», explica Agüera.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Sonia Vizoso, <\/em>El País<em>, 8 de agosto de 2014, tal como la imprimió la prueba de 2015. De aquí salen las frases del ejercicio 7.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "El plan de una anécdota", "ayuda": "Consigna de 2014, opción B: <i>una anécdota relacionada con la fantasía y la imaginación en la infancia<\/i>. No escribas el texto: escribe el plan de la anécdota en tres líneas —qué pasó, qué lo complicó y cómo acabó— y, debajo, tres verbos que irán en pretérito perfecto simple, porque hacen avanzar la historia, y dos que irán en imperfecto, porque describen el fondo.", "items": [{"enun": "Tu plan, en tres líneas, y los cinco verbos:", "modelo": "Qué pasó: a los siete años estaba convencida de que el sótano de mi abuela tenía una puerta a otro mundo. Qué lo complicó: una tarde bajé sola con una linterna y la luz se apagó. Cómo acabó: mi abuela me encontró dormida en el segundo escalón, y al día siguiente seguí creyendo en la puerta. Perfecto simple (la historia avanza): <i>bajé<\/i>, <i>se apagó<\/i>, <i>me encontró<\/i>. Imperfecto (el fondo): <i>estaba convencida<\/i>, <i>tenía<\/i>."}], "criterio": "Que el plan tenga un hecho, una complicación y un final, y no una descripción sin nada que pase; que los verbos del perfecto simple sean los que hacen avanzar la historia y los del imperfecto, los que describen lo que había alrededor. Con el plan hecho, el texto de cien palabras se escribe en quince minutos.", "apoyo": "todo", "dossier": {"cuaderno": "18", "ejercicio": 15}, "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 15"}, {"tipo": "hueco", "titulo": "El texto del día: ¿en qué línea?", "estricto": true, "ayuda": "Escribe el número de la línea donde empieza la respuesta. Si ocupa dos líneas, vale cualquiera de las dos.", "items": [{"enun": "¿Qué dato olvidó Nuria en el primer mensaje?", "sol": "2|3"}, {"enun": "¿Dónde venía la fecha en el nuevo mensaje?", "sol": "13|14"}, {"enun": "¿Qué propuso la asociación vecinal?", "sol": "16|17"}], "criterio": "Se admite cualquiera de las líneas que ocupa el dato. Antes de contestar, lee la oración entera: el número de línea solo indica dónde mirar.", "apoyo_html": "<p><b>Localizar.<\/b> Lee las preguntas antes de volver al texto y anota junto a cada una el número de la línea donde <b>empieza<\/b> la respuesta. Si el dato ocupa dos líneas, vale cualquiera de las dos. Después lee la oración entera: el número solo indica dónde mirar.<\/p><p>Localizar corresponde a la pasada 3 de la lectura de examen: primero se lee entero, después se leen las preguntas, y al final se vuelve al texto a buscar.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico del texto", "ayuda": "Cuatro palabras del texto. Lee la oración entera donde está cada una antes de decidir.", "items": [{"enun": "<b>recepción<\/b> <i>(línea 7)<\/i>", "ops": ["sala de espera", "constancia de que ha llegado la solicitud", "fecha de recogida"], "sol": "constancia de que ha llegado la solicitud", "porque": "el mensaje confirmaba que la solicitud había llegado, no que hubiera cita"}, {"enun": "<b>asignara<\/b> <i>(línea 10)<\/i>", "ops": ["fijara, adjudicara", "cancelara", "cobrara"], "sol": "fijara, adjudicara"}, {"enun": "<b>expresamente<\/b> <i>(línea 13)<\/i>", "ops": ["por correo urgente", "en voz alta", "de manera explícita"], "sol": "de manera explícita"}, {"enun": "<b>destinatario<\/b> <i>(línea 22)<\/i>", "ops": ["quien escribe el mensaje", "quien recibe el mensaje", "quien lo reparte"], "sol": "quien recibe el mensaje"}], "criterio": "Aquí se elige entre tres opciones para practicar la comprobación en contexto; en el examen se escribe el significado o un sinónimo que encaje en la oración.", "apoyo_html": "<p><b>Léxico.<\/b> En el examen la pregunta no da opciones —«proponga un sinónimo o explique el significado, atendiendo al contexto»— y vale 0,25 por palabra. Lee la oración entera donde está la palabra: muchas tienen otra acepción más corriente fuera de ese contexto, y quien contesta de memoria escribe esa acepción en lugar de la del texto. Un sinónimo vale si se puede poner en el sitio de la palabra sin que cambie el sentido de la frase.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "cazar", "titulo": "Cuenta B: la coma que hace de punto", "ayuda": "El mismo texto, segunda pasada. En <b>cinco sitios<\/b> hay una coma donde tendría que haber un punto, porque junta dos oraciones que ya están terminadas. <b>Pincha la palabra que va justo antes de esa coma.<\/b>", "items": [{"texto": "Yo creo que el transporte público de mi barrio esta mal organizado. El autobus pasa cada veinte minutos, a las siete de la mañana va tan lleno que muchos días no puedo subir. Eso significa llegar tarde al trabajo, el jefe ya me lo ha dicho dos veces. El transporte es caro para lo que ofrece, el transporte tendría que pasar mas veces por la mañana. El transporte del fin de semana empieza a las nueve, para quien trabaja el sábado eso no sirve de nada. He echo una reclamación en la web del ayuntamiento, ahora hay que esperar haber si contestan.", "faltas": {"minutos": "minutos.", "trabajo": "trabajo.", "ofrece": "ofrece.", "nueve": "nueve.", "ayuntamiento": "ayuntamiento."}}], "criterio": "La prueba para saber si la coma tendría que ser punto: salta lo que va delante y lee lo de detrás solo. Si se sostiene como frase entera —<i>a las siete de la mañana va tan lleno que no puedo subir<\/i>—, era un punto.<br><br>La coma por punto se escapa al releer más que cualquier falta de letra, porque no hay ninguna letra mal: quien relee buscando faltas de ortografía pasa por encima de las cinco.", "apoyo": "todo", "solo_web": true}, {"tipo": "abierta", "titulo": "Cien palabras, con el reloj", "ayuda": "«Redacte un texto argumentativo en el que exponga su opinión sobre si las empresas deberían avisar de los turnos con más antelación.» Unas cien palabras. <b>Veinte minutos, cronometrados, a mano.<\/b> Cuando termines, dale las dos pasadas de arriba a tu propio texto: primero las palabras, después las comas.", "palabras": {"min": 90, "max": 120}, "items": [{"enun": "Tu texto:", "modelo": "Una tesis que alguien pueda negar, dos razones con algo concreto dentro —una cifra, un horario, algo que hayas visto—, una concesión y un cierre. El modelo de abajo hace eso en 98 palabras."}], "modelos": ["<b>Modelo · 98 palabras.<\/b> «Creo que los turnos deberían avisarse con al menos dos semanas de antelación. En primer lugar, con el cuadrante a tres días no se puede pedir cita médica, apuntarse a un curso ni organizar quién recoge a los niños. Además, cambiar un turno a última hora obliga a llamar a cuatro compañeros, y al final media plantilla se debe favores entre sí. Es cierto que hay picos que nadie puede prever, como una baja o un pedido urgente. Por eso pienso que esos casos tendrían que ser la excepción y no el modo normal de hacer el cuadrante.»"], "criterio": "Este texto reproduce las condiciones del examen: el mismo enunciado, la misma extensión y el mismo reloj.<br><br>Y las dos pasadas se hacen siempre en este orden, porque la segunda cansa más: primero las palabras que llevan algo mal escrito, después las comas que separan dos oraciones enteras.", "apoyo": "todo", "solo_web": true}], "lectura": {"titulo": "Una dirección más clara", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["Nuria escribió al servicio de recogida para pedir que retiraran un", "armario. En el primer mensaje puso su calle, pero olvidó indicar", "el número del portal. Recibió una respuesta automática y pensó que", "la cita estaba confirmada. Dos días después, el armario seguía en", "el mismo lugar.", "", "Al llamar, supo que la solicitud había quedado incompleta. El", "mensaje recibido confirmaba la recepción, no una fecha de", "recogida. Nuria volvió a leerlo y encontró al final una indicación", "que había pasado por alto: debía completar la dirección antes de", "que se asignara el servicio.", "", "En la siguiente solicitud escribió la calle, el número y una", "referencia para localizar la entrada. También pidió que le", "indicaran expresamente el día de recogida. El nuevo mensaje", "incluía la fecha en la primera línea y un enlace para avisar si", "surgía algún cambio. Esta vez, Nuria pudo organizarse.", "", "La asociación vecinal propuso revisar el modelo de respuesta", "automática. Sugirió separar la confirmación de recepción de la", "confirmación de cita y colocar las instrucciones pendientes al", "comienzo. Una comunicación clara debe permitir saber qué se ha", "hecho, qué falta y quién debe actuar. Revisar el orden de la", "información puede evitar llamadas y esperas, especialmente cuando", "el destinatario necesita tomar una decisión a partir del mensaje."], "pie": "Texto inventado. Ni Nuria ni los datos que da son reales."}, "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 4: Seis textos reales, con su bloque 1 (p. 48) · ejercicio 14 · Nudo 18 · Escribir: el criterio — apartados 5 y 6: Nueve redacciones puntuadas; Las consignas reales (p. 70 y 74) · ejercicios 14 y 15", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Las conjunciones", "meta": "30 minutos · coordinantes y subordinantes, y las equivalencias", "cuaderno": {"nudo": 11, "apartados": [3], "ejercicios": [4, 9, 10, 11]}, "teoria": "<h3>3 · La conjunción<\/h3>\n<p>La conjunción también es invariable, pero no modifica nada: <strong>une<\/strong>. Y une de dos maneras.<\/p>\n<ul>\n<li><strong>Coordinantes<\/strong>: unen dos elementos del mismo rango, que podrían ir separados. <em>y, ni, o, pero, sino, es decir<\/em>.<\/li>\n<li><strong>Subordinantes<\/strong>: meten una oración dentro de otra. <em>que, si, porque, aunque, cuando, como, para que<\/em>.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>conjunciones<\/th>\n<th>qué expresa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>copulativa<\/td>\n<td>y, e, ni<\/td>\n<td>suma<\/td>\n<\/tr>\n<tr>\n<td>disyuntiva<\/td>\n<td>o, u<\/td>\n<td>alternativa<\/td>\n<\/tr>\n<tr>\n<td>adversativa<\/td>\n<td>pero, sino, mas, aunque<\/td>\n<td>oposición<\/td>\n<\/tr>\n<tr>\n<td>explicativa<\/td>\n<td>es decir, o sea, esto es<\/td>\n<td>aclaración<\/td>\n<\/tr>\n<tr>\n<td>causal<\/td>\n<td>porque, ya que, puesto que, como<\/td>\n<td>causa<\/td>\n<\/tr>\n<tr>\n<td>consecutiva<\/td>\n<td>así que, por tanto, de modo que<\/td>\n<td>consecuencia<\/td>\n<\/tr>\n<tr>\n<td>final<\/td>\n<td>para que, a fin de que<\/td>\n<td>finalidad<\/td>\n<\/tr>\n<tr>\n<td>condicional<\/td>\n<td>si, siempre que, con tal de que<\/td>\n<td>condición<\/td>\n<\/tr>\n<tr>\n<td>concesiva<\/td>\n<td>aunque, a pesar de que, si bien<\/td>\n<td>dificultad que no impide<\/td>\n<\/tr>\n<tr>\n<td>temporal<\/td>\n<td>cuando, mientras, en cuanto, apenas<\/td>\n<td>tiempo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong><em>Sin embargo<\/em> no está en la tabla, y no es un olvido.<\/strong> Ni <em>sin embargo<\/em> ni <em>no obstante<\/em> son conjunciones: son <strong>conectores<\/strong> —locuciones adverbiales— que van entre comas, y las dos oraciones que enlazan quedan <strong>yuxtapuestas<\/strong>, separadas por punto y coma o por punto: <em>Es duro; sin embargo, compensa<\/em>. En el ejercicio de equivalencias sustituyen a <em>pero<\/em> porque el significado es el mismo, pero la puntuación cambia: <em>pero<\/em> se pega a la oración con una coma delante (<em>Es duro, pero compensa<\/em>); <em>sin embargo<\/em> pide punto y coma o punto delante y coma detrás cuando abre la segunda oración; también puede ir en medio, entre comas (<em>es duro y, sin embargo, compensa<\/em>). La NGLE analiza igual <em>es decir<\/em>, <em>o sea<\/em> y <em>esto es<\/em>: conectores, no conjunciones; la gramática escolar conserva la fila de las explicativas, y así aparece aquí.<\/p>\n<p><strong>Por qué esto es el ejercicio de expresión equivalente.<\/strong> <em>Pero<\/em> ha caído <strong>nueve veces en dieciséis convocatorias<\/strong>, y en ocho de ellas la clave oficial da <em>sin embargo<\/em>. <em>Porque<\/em> ha caído cinco, con <em>ya que<\/em>. Apréndete esta tabla de equivalencias. Y las mismas conjunciones que se piden aquí abren los argumentos de la redacción: <em>pero<\/em> y <em>sin embargo<\/em> para la concesión, <em>porque<\/em> y <em>ya que<\/em> para la razón.<\/p>\n<table>\n<thead>\n<tr>\n<th>en el texto<\/th>\n<th>lo que aceptan las claves<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pero<\/td>\n<td>sin embargo, no obstante, mas<\/td>\n<\/tr>\n<tr>\n<td>porque<\/td>\n<td>ya que, puesto que, debido a que<\/td>\n<\/tr>\n<tr>\n<td>ya que<\/td>\n<td>porque<\/td>\n<\/tr>\n<tr>\n<td>aunque<\/td>\n<td>a pesar de que<\/td>\n<\/tr>\n<tr>\n<td>sin embargo<\/td>\n<td>a pesar de ello, no obstante, pero<\/td>\n<\/tr>\n<tr>\n<td>es decir<\/td>\n<td>o sea, en otras palabras (<em>o sea<\/em> vale como equivalente; en tu redacción, <em>es decir<\/em>)<\/td>\n<\/tr>\n<tr>\n<td>de manera que<\/td>\n<td>de forma que, de modo que<\/td>\n<\/tr>\n<tr>\n<td>mientras que<\/td>\n<td>en tanto que<\/td>\n<\/tr>\n<tr>\n<td>para<\/td>\n<td>con el fin de<\/td>\n<\/tr>\n<tr>\n<td>por otra parte<\/td>\n<td>por otro lado<\/td>\n<\/tr>\n<tr>\n<td>por eso<\/td>\n<td>por ello<\/td>\n<\/tr>\n<tr>\n<td>en fin<\/td>\n<td>finalmente, por último<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dos trampas de escritura que descuentan 0,1 cada vez:<\/strong><\/p>\n<ul>\n<li><strong>sino / si no<\/strong>. <em>Sino<\/em> es una conjunción y va detrás de una negación: <em>No es difícil, sino largo<\/em>. <em>Si no<\/em> son dos palabras, condición más negación: <em>Si no vienes, avísame<\/em>. Prueba: si puedes meter algo entre las dos (<em>si tú no vienes<\/em>), van separadas.<\/li>\n<li><strong>porque / por qué / porqué / por que<\/strong>. <em>Porque<\/em> da una posible razón (<em>porque quiero<\/em>); <em>por qué<\/em> pregunta (<em>¿por qué?<\/em>, también en preguntas indirectas: <em>no sé por qué<\/em>); <em>porqué<\/em> es un sustantivo y lleva artículo (<em>el porqué de todo esto<\/em>); <em>por que<\/em> es preposición <em>por<\/em> + <em>que<\/em> —conjunción (<em>luchan por que se apruebe<\/em>) o relativo (<em>la razón por que<\/em>)— y es raro. Los cuatro, con su tabla, en el nudo 3 y en el nudo 4 bis.<\/li>\n<\/ul>\n<p>Y una interferencia: en castellano se dice <strong>a pesar de que<\/strong>, con <em>de<\/em>, no <em>a pesar que<\/em>.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "Adverbio, preposición o conjunción", "dossier": {"cuaderno": "11", "ejercicio": 4}, "ayuda": "Clasifica cada palabra o locución. <i>Mientras<\/i> se acepta como adverbio y como conjunción.", "ops": ["adverbio", "preposición", "conjunción"], "items": [{"enun": "<i>quizá<\/i>", "sol": "adverbio"}, {"enun": "<i>delante de<\/i>", "sol": "preposición", "porque": "locución preposicional"}, {"enun": "<i>ante<\/i>", "sol": "preposición"}, {"enun": "<i>silenciosamente<\/i>", "sol": "adverbio"}, {"enun": "<i>a la chita calla  equivalente. Los ocho con año son ítems reales, con las respuestas de su clave oficial; los demás están inventados. Se aceptan otras expresiones del mismo valor.", "items": [{"enun": "<b>pero<\/b> (2023)", "sol": "sin embargo|no obstante", "corto": false}, {"enun": "<b>porque<\/b> (2016)", "sol": "ya que|puesto que|dado que", "corto": false}, {"enun": "<b>aunque<\/b> (2019)", "sol": "a pesar de que|si bien", "corto": false}, {"enun": "<b>mientras que<\/b>: «pasaban más tiempo intentando recordar» […] «mientras que los que leían sobre papel conseguían una comprensión más completa»", "conv": "2013", "sol": "en tanto que", "corto": false}, {"enun": "<b>De manera que<\/b>: «De manera que sí, vale, de acuerdo, hay cazadores decentes»", "conv": "2020", "sol": "de forma que|de modo que|así que", "corto": false}, {"enun": "<b>Es decir<\/b> (2024)", "sol": "o sea|en otras palabras|esto es", "corto": false}, {"enun": "<b>para<\/b> (2016)", "sol": "con el fin de|a fin de", "corto": false}, {"enun": "<b>ya que<\/b> (2026)", "sol": "porque|puesto que|dado que", "corto": false}, {"enun": "<b>sin embargo<\/b>", "sol": "no obstante|a pesar de ello", "corto": false}, {"enun": "<b>por eso<\/b>", "sol": "por ello|por lo tanto|por tanto|así que", "corto": false}, {"enun": "<b>en fin<\/b>", "sol": "finalmente|por último", "corto": false}, {"enun": "<b>por otra parte<\/b>", "sol": "por otro lado|además", "corto": false}, {"enun": "<b>a pesar de que<\/b>", "sol": "aunque|si bien", "corto": false}, {"enun": "<b>puesto que<\/b>", "sol": "ya que|porque|dado que", "corto": false}], "criterio": "El equivalente tiene que cumplir la misma función en la frase: <i>pero<\/i> y <i>sin embargo<\/i> oponen; <i>porque<\/i> y <i>ya que<\/i> dan la causa; <i>aunque<\/i> y <i>a pesar de que<\/i> conceden. <i>Para<\/i> se sustituye por <i>con el fin de<\/i>, que también introduce la finalidad.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 11, ejercicio 9"}, {"tipo": "hueco", "ti : "Qué relación establece la conjunción", "dossier": {"cuaderno": "11", "ejercicio": 11}, "ayuda": "Indica el tipo de relación que establece la conjunción en negrita.", "ops": ["causal", "concesiva", "consecutiva", "final", "condicional", "temporal", "copulativa", "disyuntiva", "adversativa", "explicativa"], "items": [{"enun": "Llegué tarde <b>porque<\/b> perdí el tren.", "sol": "causal"}, {"enun": "<b>Aunque<\/b> estaba cansado, terminó el ejercicio.", "sol": "concesiva"}, {"enun": "Estudia mucho, <b>así que<\/b> aprobará.", "sol": "consecutiva"}, {"enun": "Te lo explico <b>para que<\/b> lo entiendas.", "sol": "final"}, {"enun": "<b>Si<\/b> llueve, no salimos.", "sol": "condicional"}, {"enun": "No es caro, <b>sino<\/b> barato.", "sol": "adversativa"}, {"enun": "<b>Ni<\/b> come <b>ni<\/b> deja comer.", "sol": "copulativa", "porque": "<i>ni… ni<\/i> suma dos negaciones"}, {"enun": "¿Vienes <b>o<\/b> te quedas?", "sol": "disyuntiva"}, {"enun": "Es tarde, <b>es decir<\/b>, hay que irse.", "sol": "explicativa"}, {"enun": "<b>Mientras<\/b> yo cocino, tú pones la mesa.", "sol": "temporal"}, {"enun": "<b>Como<\/b> no tenía llaves, esperó en la escalera.", "sol": "causal", "porque": "<i>como<\/i> al principio de la oración da la causa"}, {"enun": "Aprobó, <b>aunque<\/b> por poco.", "sol": "concesiva"}, {"enun": "Te aviso <b>en cuanto<\/b> llegue.", "sol": "temporal"}, {"enun": "<b>Ya que<\/b> estás aquí, ayúdame con esto.", "sol": "causal"}], "criterio": "La relación se decide por lo que une la conjunción: una causa (<i>porque<\/i>, <i>ya que<\/i>, <i>como<\/i> al principio), un obstáculo que no impide (<i>aunque<\/i>), una consecuencia (<i>así que<\/i>), una finalidad (<i>para que<\/i>), una condición (<i>si<\/i>) o un momento (<i>mientras<\/i>, <i>en cuanto<\/i>).", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 11, ejercicio 11"}, {"tipo": "clasificar", "titulo": "¿Qué expresa?", "ayuda": "Ocho frases. Indica la relación que establece la conjunció eba de separarlas funciona siempre: «Llamó. Dejó un recado.» se sostiene; «Dijo. No vendría.» ya no dice lo mismo.<br><br>Distinguirlas sirve de base a la sintaxis, que empieza en enero.", "apoyo": ["3 · La conjunción"], "solo_web": true}], "cuaderno_txt": "Nudo 11 · Las palabras invariables: adverbio, preposición, conjunción — apartado 3: La conjunción (p. 160) · ejercicios 4, 9, 10 y 11", "teoria_dossier": true}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras y frases marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:

(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);

    return String(esperado).split('|').some(function (v) { return f(v) === d; });

          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
