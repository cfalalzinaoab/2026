leccionada y ordenada: un texto sin concesión puede llegar a 0,5 en coherencia, y uno sin cierre o con la tesis repetida al final casi nunca llega.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2016"}, "modelos": ["Creo que aprender a leer y a escribir bien sigue siendo lo más útil que da la escuela. En primer lugar, casi todo lo que decide la vida adulta llega por escrito, un contrato, una nómina, una carta del ayuntamiento, y quien no lo entiende depende de que otro se lo explique. Además, escribir obliga a ordenar lo que uno piensa, y quien ordena sus ideas discute mejor. Es cierto que hoy casi todo se resuelve con el móvil, pero también en el móvil se lee y se escribe. Por eso pienso que leer y escribir bien es lo primero que la escuela tendría que asegurar."], "apoyo": ["Consigna de 2021, opción A — la educación para poder mejorar la vida de las personas", "Consigna de 2026, opción A — la necesidad de defender el trabajo agrícola"], "dossier_txt": "Del dossier: nudo 18, ejercicio 13", "texto_titulo": "2016 · Entrevista a Elia Barceló", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Entrevista a Elia Barceló<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Has escrito muchos libros para jóvenes y has tenido mucho contacto con ellos. ¿Qué crees que es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lo que más les gusta encontrar en los libros?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hablando con jóvenes en muchos de los encuentros que hemos tenido, un tema que aparece con<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">frecuencia es el amor. Lo encuentro lógico porque ellos están en la edad ideal para descubrirlo, para tener<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las primeras experiencias, para hacer proyectos y fijarse metas, para aprender. Como para mí el amor<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">es uno de los temas centrales, tanto en mi obra juvenil como en mis novelas para adultos, los lectores<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes y yo nos entendemos bien, aunque yo no escribo siempre sobre amores románticos y con final<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">feliz. Yo lo que quiero es pasarles la idea de que el amor es el motor del universo (entendiendo el amor<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">del modo más amplio posible, claro) y que puede funcionar si uno pone trabajo, alegría y entusiasmo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">¿Cómo ha cambiado la literatura juvenil desde tu punto de vista de autora?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Ha habido dos cambios importantes, uno muy positivo y otro bastante negativo. El positivo es que hay<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mucha más libertad y muchas más posibilidades para escribir novelas diferentes, arriesgadas, que tratan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo tipo de temas con más claridad y dureza de lo que se permitía hace un par de décadas. Ahora también<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">podemos escribir novelas fantásticas y de terror sin temer que nos las rechacen. Los editores se han dado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cuenta de que son temas que gustan a los jóvenes y han aprendido también que ambos géneros son<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">importantes para el desarrollo de los adolescentes.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El cambio negativo al que me refería más arriba es que muchas editoriales que antes se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupaban sobre todo de cribar para publicar buenos libros han decidido que, como hay que<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">sobrevivir económicamente, sale muy rentable publicar lo que ellos creen que los jóvenes quieren leer,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">independientemente de su valor literario. Por eso han inundado el panorama juvenil de novelas facilonas,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cursis, tan incoherentes como la mayor parte de las películas «para público juvenil», que ni siquiera están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">bien escritas ni tienen una mínima riqueza léxica ni una leve complejidad sintáctica.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Desde 1981 trabajas como profesora de literatura creativa. ¿Crees que la escritura creativa debería<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">estar más presente en las universidades españolas?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Creo que debería estar más presente en toda educación, porque escribir es expresar el pensamiento,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los sentimientos, las emociones…, aprender que lo que está dentro salga al exterior con claridad, con<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precisión, y otras personas puedan entonces comprenderlo. Estoy convencida de que si a las personas se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las enseñara desde muy pequeñas a poner en palabras lo que sienten y piensan, habría menos violencia,<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">porque en muchas ocasiones la violencia nace de la incapacidad de decir lo que a uno le pasa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">También es muy importante enseñar a los niños a ordenar su pensamiento, a argumentar sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">opiniones, a protestar educadamente…, a mil cosas necesarias.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación de la entrevista de Nerea Marco y Carlota Echeverría, <\/em>El Templo de las Mil Puertas<em>, n.º 46, junio de 2015, tal como la imprimió la prueba de 2016. Es el único texto de la serie que no es una columna: es una entrevista, y las preguntas forman parte del texto.<\/em><\/p>"}, {"tipo": "hueco", "titulo": "El texto del día: ¿en qué línea?", "estricto": true, "ayuda": "Escribe el número de la línea donde empieza la respuesta. Si ocupa dos líneas, vale cualquiera de las dos.", "items": [{"enun": "¿Cuántos años tenía la cafetera?", "sol": "6"}, {"enun": "¿Cuánto tardó el taller en encontrar una alternativa?", "sol": "12"}, {"enun": "¿Cuántas piezas más traía el conjunto del fabricante?", "sol": "6|7"}], "criterio": "Se admite cualquiera de las líneas que ocupa el dato. Antes de contestar, lee la oración entera: el número de línea solo indica dónde mirar.", "apoyo_html": "<p><b>Localizar.<\/b> Lee las preguntas antes de volver al texto y anota junto a cada una el número de la línea donde <b>empieza<\/b> la respuesta. Si el dato ocupa dos líneas, vale cualquiera de las dos. Después lee la oración entera: el número solo indica dónde mirar.<\/p><p>Localizar corresponde a la pasada 3 de la lectura de examen: primero se lee entero, después se leen las preguntas, y al final se vuelve al texto a buscar.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico del texto", "ayuda": "Cuatro palabras del texto. Lee la oración entera donde está cada una antes de decidir.", "items": [{"enun": "<b>junta<\/b> <i>(línea 2)<\/i>", "ops": ["reunión de vecinos", "pieza que cierra la unión entre dos partes", "conjunto de piezas"], "sol": "pieza que cierra la unión entre dos partes", "porque": "la junta de vecinos existe, pero aquí la junta está desgastada y pierde agua"}, {"enun": "<b>gama<\/b> <i>(línea 9)<\/i>", "ops": ["nivel o categoría de un producto", "color del aparato", "marca comercial"], "sol": "nivel o categoría de un producto"}, {"enun": "<b>compatible<\/b> <i>(línea 10)<\/i>", "ops": ["más barata", "de segunda mano", "que sirve para ese aparato"], "sol": "que sirve para ese aparato"}, {"enun": "<b>repuestos<\/b> <i>(línea 18)<\/i>", "ops": ["descansos", "piezas de recambio", "aparatos nuevos"], "sol": "piezas de recambio"}], "criterio": "Aquí se elige entre tres opciones para practicar la comprobación en contexto; en el examen se escribe el significado o un sinónimo que encaje en la oración.", "apoyo_html": "<p><b>Léxico.<\/b> En el examen la pregunta no da opciones —«proponga un sinónimo o explique el significado, atendiendo al contexto»— y vale 0,25 por palabra. Lee la oración entera donde está la palabra: muchas tienen otra acepción más corriente fuera de ese contexto, y quien contesta de memoria escribe esa acepción en lugar de la del texto. Un sinónimo vale si se puede poner en el sitio de la palabra sin que cambie el sentido de la frase.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Qué hace cada frase?", "ayuda": "Ocho frases de dos textos escritos con la consigna de la caza: uno bien construido y otro más flojo. Identifica la parte de cada una.", "ops": ["tesis", "argumento", "concesión", "cierre", "repite lo ya dicho"], "items": [{"enun": "En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien.", "sol": "argumento", "porque": "lleva conector delante y trae un caso concreto"}, {"enun": "Yo pienso que la caza está muy mal porque los animales también tienen derecho a vivir.", "sol": "tesis", "porque": "se puede negar, y abre el texto"}, {"enun": "Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no sirve más que para presumir.", "sol": "concesión", "porque": "empieza por <i>es cierto que<\/i> y da la razón a la postura contraria"}, {"enun": "Creo que la caza no se puede defender ni condenar en bloque, porque depende de para qué se cace.", "sol": "tesis", "porque": "alguien puede contestar que sí se puede condenar en bloque"}, {"enun": "En mi opinión creo que la caza se tendría que prohibir en todos los sitios.", "sol": "repite lo ya dicho", "porque": "es la misma idea de la primera frase con otras palabras. No cierra nada"}, {"enun": "Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos.", "sol": "argumento", "porque": "conector <i>además<\/i> y una razón distinta de la anterior"}, {"enun": "Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.", "sol": "cierre", "porque": "saca la consecuencia: el problema es el motivo, no la actividad"}, {"enun": "Los cazadores matan a los animales por diversión y eso no es un deporte.", "sol": "argumento", "porque": "da una razón, aunque le falte el conector delante"}], "criterio": "El texto bien construido tiene las cinco partes. El flojo tiene tesis y dos razones, y en lugar de concesión y cierre repite la tesis: por eso el orden de las ideas se queda a medias aunque las ideas se entiendan.<br><br>La prueba del cierre: si se puede borrar sin que falte nada, repetía la tesis. Un cierre añade algo que no aparecía antes.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas"], "solo_web": true}, {"tipo": "abierta", "titulo": "Las cinco partes, sobre otro tema", "ayuda": "«Redacte un texto argumentativo en el que exponga su opinión sobre si los comercios deberían abrir los domingos.» Unas cien palabras, con las cinco partes y en este orden: tesis, dos argumentos con conector, concesión y cierre.", "palabras": {"min": 90, "max": 120}, "items": [{"enun": "Tu texto:", "modelo": "Marca al margen las cinco partes cuando termines. Si alguna no aparece, añádela antes de entregar."}], "modelos": ["<b>Modelo · 103 palabras.<\/b> «Creo que abrir los domingos no debería decidirlo cada comercio por su cuenta. En primer lugar, cuando una gran superficie abre, las tiendas pequeñas del barrio tienen que abrir también para no perder la clientela, y ahí no hay ninguna elección. Además, el domingo es el único día que coincide libre para quien trabaja a turnos, y una plantilla de tres personas no puede repartírselo. Es cierto que para quien trabaja de lunes a viernes el domingo es la única oportunidad de comprar con calma. Por eso pienso que la apertura tendría que estar regulada por zonas y no dejada a la competencia.»"], "criterio": "El modelo lleva un conector en cada argumento —<i>en primer lugar<\/i>, <i>además<\/i>—, una concesión que reconoce algo real y un cierre que propone algo que no aparecía antes.<br><br>La concesión no debilita la tesis: reconoce el problema de la postura contraria, y el cierre lo resuelve.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas"], "solo_web": true}], "lectura": {"titulo": "La pieza que faltaba", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["Nerea llevó su cafetera al taller con una nota pegada: perdía agua", "por la base. El técnico la abrió y encontró una junta desgastada.", "La reparación requería una pieza pequeña que no tenía en el", "almacén. Antes de pedirla, buscó el modelo exacto en la etiqueta", "de la máquina.", "", "La cafetera tenía siete años. El fabricante ofrecía la junta", "dentro de un conjunto que incluía otras cuatro piezas. El precio", "del conjunto y la mano de obra se acercaban al de una cafetera", "nueva de la misma gama. Nerea pidió dos presupuestos: uno con ese", "conjunto y otro con una pieza compatible que el técnico pudiera", "garantizar.", "", "El taller tardó tres días en encontrar una alternativa. Nerea", "aceptó el segundo presupuesto y recogió la cafetera al final de la", "semana. Conservó la factura con la referencia de la junta por si", "volvía a necesitarla.", "", "El caso muestra qué información interviene en la decisión de", "reparar: el diagnóstico, el coste, el plazo y la disponibilidad de", "repuestos. Una pieza de poco tamaño puede exigir una búsqueda", "larga. Ofrecer presupuestos claros permite comparar alternativas y", "decidir si conviene reparar o sustituir el aparato. Guardar la", "referencia utilizada facilita futuras consultas, tanto al cliente", "como a quien se encargue de la siguiente reparación."], "pie": "Texto inventado. Ni Nerea ni los datos que da son reales."}, "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 4: Seis textos reales, con su bloque 1 (p. 48) · ejercicio 12 · Nudo 18 · Escribir: el criterio — apartados 5 y 6: Nueve redacciones puntuadas; Las consignas reales (p. 70 y 74) · ejercicio 13", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Las formas no personales", "meta": "30 minutos · infinitivo, gerundio y participio", "cuaderno": {"nudo": 10, "apartados": [3], "ejercicios": [7, 8, 9]}, "teoria": "<h3>3 · Las formas no personales<\/h3>\n<p>Se llaman así porque no indican quién hace la acción: no tienen persona. Son tres y cada una se comporta como otra clase de palabra.<\/p>\n<table>\n<thead>\n<tr>\n<th>forma<\/th>\n<th>terminación<\/th>\n<th>se comporta como<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>infinitivo<\/strong><\/td>\n<td>-ar, -er, -ir<\/td>\n<td><strong>sustantivo<\/strong><\/td>\n<td><em>Madrugar cansa<\/em> → <em>Eso cansa<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>gerundio<\/strong><\/td>\n<td>-ando, -iendo<\/td>\n<td><strong>adverbio<\/strong><\/td>\n<td><em>Salió corriendo<\/em> → <em>Salió así<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>participio<\/strong><\/td>\n<td>-ado, -ido<\/td>\n<td><strong>adjetivo<\/strong><\/td>\n<td><em>un plazo agotado<\/em> → <em>un plazo corto<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La prueba del <em>eso<\/em>.<\/strong> Si en el sitio del infinitivo puedes poner <em>eso<\/em>, está haciendo de sustantivo, y entonces puede ser sujeto o complemento directo como cualquier nombre. Un ítem real lo muestra: en «Y además es genial no tener que viajar solo» (2019), el sujeto es el infinitivo entero — <em>eso es genial<\/em> — y <em>genial<\/em> es el atributo, la respuesta que pedía la clave. <em>Tener que viajar<\/em> es una perífrasis de obligación (apartado 4): el sujeto no es <em>viajar<\/em> solo, sino la perífrasis entera con su negación y su complemento, <em>no tener que viajar solo<\/em>.<\/p>\n<p>El participio regular se forma con <em>-ado<\/em> en los verbos en <em>-ar<\/em> y con <em>-ido<\/em> en los verbos en <em>-er<\/em> e <em>-ir<\/em>: <em>cantado, comido, vivido<\/em>. Cuando la raíz acaba en vocal, la <em>i<\/em> de <em>-ido<\/em> forma hiato y lleva tilde —<em>leído, caído, oído, traído, reído<\/em>—; no la lleva cuando la vocal anterior es cerrada, porque ahí hay diptongo: <em>construido, huido, destruido<\/em>.<\/p>\n<p><strong>Participios irregulares<\/strong>, con el infinitivo del que salen:<\/p>\n<table>\n<thead>\n<tr>\n<th>infinitivo<\/th>\n<th>participio<\/th>\n<th>infinitivo<\/th>\n<th>participio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>hacer<\/td>\n<td><strong>hecho<\/strong><\/td>\n<td>volver<\/td>\n<td><strong>vuelto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>decir<\/td>\n<td><strong>dicho<\/strong><\/td>\n<td>devolver, envolver<\/td>\n<td><strong>devuelto, envuelto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>escribir<\/td>\n<td><strong>escrito<\/strong><\/td>\n<td>resolver<\/td>\n<td><strong>resuelto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>freír<\/td>\n<td><strong>frito<\/strong> (o <em>freído<\/em>)<\/td>\n<td>romper<\/td>\n<td><strong>roto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ver<\/td>\n<td><strong>visto<\/strong><\/td>\n<td>abrir<\/td>\n<td><strong>abierto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>prever<\/td>\n<td><strong>previsto<\/strong><\/td>\n<td>cubrir, descubrir<\/td>\n<td><strong>cubierto, descubierto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>poner<\/td>\n<td><strong>puesto<\/strong><\/td>\n<td>morir<\/td>\n<td><strong>muerto<\/strong><\/td>\n<\/tr>\n<tr>\n<td>componer, suponer<\/td>\n<td><strong>compuesto, supuesto<\/strong><\/td>\n<td>satisfacer<\/td>\n<td><strong>satisfecho<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los compuestos siguen al verbo simple: <em>deshacer → deshecho<\/em>, <em>reponer → repuesto<\/em>, <em>reabrir → reabierto<\/em>, <em>describir → descrito<\/em>. Y las faltas que más se corrigen en esta tabla: <em>rompido<\/em> por <strong>roto<\/strong>, <em>abrido<\/em> por <strong>abierto<\/strong>, <em>escribido<\/em> por <strong>escrito<\/strong>, <em>volvido<\/em> por <strong>vuelto<\/strong> y <em>hacido<\/em> por <strong>hecho<\/strong>.<\/p>\n<p><strong>Participios dobles<\/strong>: <em>freído / frito<\/em>, <em>imprimido / impreso<\/em>, <em>proveído / provisto<\/em>. Con <em>haber<\/em> valen las dos —<em>he imprimido<\/em> / <em>he impreso<\/em>, <em>he freído<\/em> / <em>he frito<\/em>—; como adjetivo, con <em>ser<\/em> y <em>estar<\/em>, la irregular: <em>el examen está impreso<\/em>, <em>las patatas están fritas<\/em>.<\/p>\n<p><strong>Los dos errores de gerundio:<\/strong><\/p>\n<ol>\n<li><strong>Gerundio de posterioridad.<\/strong> El gerundio expresa lo que pasa <em>a la vez<\/em>, no lo que pasa <em>después<\/em>. Se admite cuando lo segundo es inmediato (<em>salió dando un portazo<\/em>; <em>se cayó, rompiéndose una pierna<\/em>) o es consecuencia de lo primero; no cuando solo viene después, sin relación con la primera acción.\n   <em>Entró en el edificio, saliendo a los diez minutos<\/em> → <strong>Entró en el edificio y salió a los diez minutos.<\/strong><\/li>\n<li><strong>Gerundio con valor de adjetivo.<\/strong> No se usa el gerundio para calificar a un nombre.\n   <em>Han traído una caja conteniendo material<\/em> → <strong>una caja que contiene material.<\/strong>\n   Las excepciones: <em>agua hirviendo<\/em>, <em>un edificio ardiendo<\/em>, los pies de foto y títulos (<em>Niños jugando en el parque<\/em>) y los nombres de comunicación —<em>una carta anunciando su llegada<\/em>, <em>un cartel anunciando el concierto<\/em>—, que la RAE admite aunque prefiere <em>que anuncia<\/em>.<\/li>\n<\/ol>\n<p><strong>Cómo se corrige una frase con gerundio mal puesto.<\/strong> Primero se comprueba si hay error: si lo segundo ni es inmediato ni es consecuencia de lo primero —se puede intercalar <em>después<\/em> o <em>más tarde<\/em> y nada une las dos acciones—, el gerundio de posterioridad no sirve; si el gerundio va pegado a un sustantivo y contesta a «¿qué caja?», «¿qué ley?», es el gerundio adjetivo. Después se sustituye:<\/p>\n<ul>\n<li>El gerundio de posterioridad se cambia por un <strong>verbo conjugado en el mismo tiempo que el principal<\/strong>, unido con <em>y<\/em> —o con <em>y después<\/em>, <em>y luego<\/em>, si hay distancia entre las dos acciones—, o se parte la oración en dos.\n  <em>Estudió toda la noche, aprobando al día siguiente<\/em> → <strong>Estudió toda la noche y aprobó al día siguiente.<\/strong>\n  <em>Cerró la tienda en marzo, abriendo otra en la calle Mayor en junio<\/em> → <strong>Cerró la tienda en marzo y en junio abrió otra en la calle Mayor.<\/strong>\n  <em>El tren salió a las ocho, llegando a Zaragoza a las diez<\/em> → <strong>El tren salió a las ocho y llegó a Zaragoza a las diez.<\/strong>\n  <em>Firmó el contrato, arrepintiéndose semanas más tarde<\/em> → <strong>Firmó el contrato. Semanas más tarde se arrepintió.<\/strong><\/li>\n<li>El gerundio adjetivo se cambia por una <strong>oración de relativo<\/strong> (<em>que<\/em> + verbo conjugado), por un <strong>participio<\/strong> o por una <strong>preposición<\/strong>.\n  <em>Aprobaron una ley regulando el alquiler<\/em> → <strong>una ley que regula el alquiler.<\/strong>\n  <em>Recibí un paquete conteniendo libros<\/em> → <strong>un paquete con libros<\/strong> / <strong>que contenía libros.<\/strong>\n  <em>El hombre llevando sombrero es mi tío<\/em> → <strong>El hombre del sombrero<\/strong> / <strong>que lleva sombrero<\/strong> <em>es mi tío.<\/em>\n  <em>Un informe detallando los gastos<\/em> → <strong>un informe que detalla los gastos<\/strong> / <strong>un informe detallado de los gastos.<\/strong><\/li>\n<\/ul>\n<p>Y un tercer error, frecuente al escribir deprisa: <strong>el infinitivo por el imperativo<\/strong>. En la lengua cuidada, <em>¡Callar todos!<\/em> no es una orden: se dice <strong>¡Callad todos!<\/strong>, o bien <em>¡A callar!<\/em> con la preposición delante. El infinitivo solo vale en los avisos a nadie en concreto: <em>No fumar<\/em>, <em>Lavar a mano<\/em>.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Las formas no personales y su función", "dossier": {"cuaderno": "10", "ejercicio": 7}, "ayuda": "Localiza las formas no personales de cada oración, identifica cada una —infinitivo, gerundio o participio— e indica cómo funciona: como sustantivo, como adverbio, como adjetivo o dentro de una perífrasis. Una de las formas de las seis oraciones está mal usada: señálala.", "items": [{"enun": "Después de pasar diez años trabajando en una oficina de Madrid, decidió convertirse en agricultor y volver al pueblo de sus abuelos.", "modelo": "pasar, infinitivo, funciona como sustantivo (complemento de la preposición después de: después de eso); trabajando, gerundio, funciona como adverbio (expresa cómo pasó esos años); convertirse y volver, infinitivos, complementos directos de decidió (decidió eso)."}, {"enun": "«atreverse a poner un local que solo vende trufas es de una originalidad y una valentía poco comunes»", "conv": "2024", "modelo": "atreverse a poner, infinitivos, sujeto de es (eso es de una originalidad…); poner va dentro de atreverse a."}, {"enun": "«una puede estar triunfando con sus amigos y pifiándola con su pareja»", "conv": "2024", "modelo": "estar, infinitivo dentro de la perífrasis poder + infinitivo; triunfando y pifiándola, gerundios, dentro de la perífrasis estar + gerundio."}, {"enun": "Los cuentos censurados y reescritos por los editores del siglo XIX siguen circulando por las escuelas sin que nadie se haya molestado en recuperar las versiones originales.", "modelo": "censurados y reescritos, participios, funcionan como adjetivos de cuentos; circulando, gerundio, dentro de la perífrasis seguir + gerundio; molestado, participio del tiempo compuesto se haya molestado, forma parte del verbo; recuperar, infinitivo, funciona como sustantivo (complemento de molestado en: molestado en eso)."}, {"enun": "Yo estaba siempre ahí, escuchando las conversaciones de los mayores sin entender casi nada y esperando que alguien se acordara de mandarme a dormir.", "modelo": "escuchando y esperando, gerundios, funcionan como adverbios (expresan cómo estaba); entender, infinitivo tras sin (sin eso); mandarme y dormir, infinitivos, sustantivos (se acordara de eso)."}, {"enun": "Cansada de esperar un autobús que no llegaba, decidió irse andando hasta la estación, arrepintiéndose a los diez minutos.", "modelo": "Cansada, participio, funciona como adjetivo (concuerda con el sujeto: ella); esperar, infinitivo, sustantivo (cansada de eso); irse, infinitivo, complemento directo de decidió; andando, gerundio, adverbio de modo. La forma mal usada es arrepintiéndose: es un gerundio de posterioridad —el arrepentimiento llega diez minutos después—. Corrección: decidió irse andando hasta la estación, y a los diez minutos se arrepintió."}], "criterio": "El infinitivo funciona como sustantivo y se sustituye por <i>eso<\/i>; el gerundio, como adverbio, y se sustituye por <i>así<\/i>; el participio, como adjetivo, y concuerda con un sustantivo. La forma mal usada es <i>arrepintiéndose<\/i>: un gerundio de posterioridad, porque el arrepentimiento llega diez minutos después. Se corrige con un verbo conjugado: <i>y a los diez minutos se arrepintió<\/i>.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 10, ejercicio 7"}, {"tipo": "justificar", "titulo": "Corrige el gerundio y el imperativo", "dossier": {"cuaderno": "10", "ejercicio": 8}, "ayuda": "Escribe la frase corregida. Tres de las diez están bien: de esas, escribe «correcta».", "items": [{"enun": "Entró en el edificio, saliendo a los diez minutos.", "requiere": [["salio"]], "modelo": "«Entró en el edificio y salió a los diez minutos»: la salida es posterior y no es consecuencia de entrar"}, {"enun": "Necesito una carpeta conteniendo los recibos.", "requiere": [["contenga"]], "modelo": "«Necesito una carpeta que contenga los recibos»"}, {"enun": "¡Sentaros donde queráis!", "requiere": [["sentaos"]], "modelo": "«¡Sentaos donde queráis!»: imperativo de <i>vosotros<\/i>; delante de <i>os<\/i> se cae la <i>-d<\/i>"}, {"enun": "Salió de casa poniéndose el abrigo.", "requiere": [["correcta", "bien"]], "modelo": "correcta: ponerse el abrigo y salir pasan a la vez"}, {"enun": "¡Venir aquí ahora mismo, que os lo explico!", "requiere": [["venid"]], "modelo": "«¡Venid aquí ahora mismo, que os lo explico!»: una orden a personas concretas va en imperativo"}, {"enun": "Aprobó en junio, matriculándose en septiembre.", "requiere": [["matriculo"]], "modelo": "«Aprobó en junio y se matriculó en septiembre»: tres meses después"}, {"enun": "Vimos un cartel anunciando el concierto.", "requiere": [["correcta", "bien"]], "modelo": "correcta: con nombres de comunicación, como <i>cartel<\/i>, se admite el gerundio, aunque <i>que anunciaba<\/i> es la forma preferible"}, {"enun": "¡Callar, que no oigo nada!", "requiere": [["callad"]], "modelo": "«¡Callad, que no oigo nada!»"}, {"enun": "Trabajó veinte años en la fábrica, jubilándose en 2019.", "requiere": [["jubilo"]], "modelo": "«Trabajó veinte años en la fábrica y se jubiló en 2019»: veinte años después"}, {"enun": "Se pasó la tarde leyendo en el sofá.", "requiere": [["correcta", "bien"]], "modelo": "correcta: <i>leyendo<\/i> expresa cómo pasó la tarde"}], "criterio": "El gerundio expresa una acción que pasa a la vez que la del verbo principal o justo antes; para lo que pasa después se usa <i>y<\/i> con el verbo conjugado: <i>y salió a los diez minutos<\/i>. Como adjetivo se sustituye por <i>que<\/i> y el verbo conjugado: <i>una carpeta que contenga<\/i>. El imperativo de <i>vosotros<\/i> termina en <i>-d<\/i> (<i>venid<\/i>, <i>callad<\/i>) y la pierde delante de <i>os<\/i>: <i>sentaos<\/i>.", "pide": "la frase corregida, o «correcta»", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 10, ejercicio 8"}, {"tipo": "hueco", "titulo": "El participio que toca", "dossier": {"cuaderno": "10", "ejercicio": 9}, "ayuda": "Escribe el participio del verbo del paréntesis que pide la oración.", "estricto": true, "items": [{"enun": "He (imprimir) ______ las fichas.", "sol": "imprimido|impreso", "porque": "con <i>haber<\/i> valen las dos formas"}, {"enun": "Las fichas ya están (imprimir) ______.", "sol": "impresas", "porque": "como adjetivo, la forma irregular, y concuerda con <i>fichas<\/i>"}, {"enun": "El cristal se ha (romper) ______.", "sol": "roto"}, {"enun": "Nos han (decir) ______ que sí.", "sol": "dicho"}, {"enun": "Ha (freír) ______ las patatas.", "sol": "freído|frito", "porque": "con <i>haber<\/i> valen las dos formas"}, {"enun": "Las patatas están (freír) ______.", "sol": "fritas", "porque": "como adjetivo, la forma irregular, y concuerda con <i>patatas<\/i>"}, {"enun": "Han (abrir) ______ una panadería nueva.", "sol": "abierto"}, {"enun": "La tienda está (abrir) ______ hasta las nueve.", "sol": "abierta", "porque": "concuerda con <i>tienda<\/i>"}, {"enun": "¿Has (ver) ______ mis llaves?", "sol": "visto"}, {"enun": "He (volver) ______ a llamar y no contesta.", "sol": "vuelto"}, {"enun": "El botiquín está (proveer) ______ de todo lo necesario.", "sol": "provisto"}, {"enun": "Nos han (devolver) ______ el dinero.", "sol": "devuelto"}, {"enun": "Ha (escribir) ______ tres cartas de queja.", "sol": "escrito"}, {"enun": "Todavía no han (resolver) ______ el problema.", "sol": "resuelto"}], "criterio": "Con <i>haber<\/i>, <i>imprimir<\/i> y <i>freír<\/i> admiten las dos formas: <i>he imprimido<\/i> o <i>he impreso<\/i>, <i>ha freído<\/i> o <i>ha frito<\/i>. Como adjetivo, con <i>estar<\/i>, va la irregular y concuerda: <i>las fichas están impresas<\/i>, <i>las patatas están fritas<\/i>. <i>Romper<\/i>, <i>decir<\/i>, <i>abrir<\/i>, <i>ver<\/i>, <i>volver<\/i>, <i>proveer<\/i>, <i>escribir<\/i> y <i>resolver<\/i> tienen participio irregular.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 10, ejercicio 9"}, {"tipo": "clasificar", "titulo": "¿Qué forma es, y como qué funciona?", "ayuda": "Aplica la prueba: ¿se puede cambiar por <i>eso<\/i>, por <i>así<\/i> o por un adjetivo?", "ops": ["infinitivo · como sustantivo", "gerundio · como adverbio", "participio · como adjetivo"], "items": [{"enun": "un plazo <b>agotado<\/b>", "sol": "participio · como adjetivo"}, {"enun": "Salió <b>corriendo<\/b>.", "sol": "gerundio · como adverbio", "porque": "<i>salió así<\/i> ✔"}, {"enun": "Es genial no <b>tener<\/b> que viajar solo.", "conv": "2019", "sol": "infinitivo · como sustantivo", "porque": "<i>eso es genial<\/i>: es el sujeto"}, {"enun": "<b>Madrugar<\/b> cansa.", "sol": "infinitivo · como sustantivo", "porque": "<i>eso cansa<\/i> ✔"}, {"enun": "Contestó <b>sonriendo<\/b>.", "sol": "gerundio · como adverbio"}, {"enun": "las cuentas <b>presentadas<\/b> en enero", "sol": "participio · como adjetivo"}], "criterio": "Tres pruebas, una por forma: <b>eso<\/b> para el infinitivo, <b>así<\/b> para el gerundio y <b>un adjetivo<\/b> para el participio. No hace falta recordar las terminaciones si tienes las tres pruebas.", "apoyo": ["3 · Las formas no personales"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Está bien ese gerundio?", "ayuda": "Seis frases. Decide si el gerundio se puede usar así.", "ops": ["está bien", "está mal"], "items": [{"enun": "Echó el arroz en agua <b>hirviendo<\/b>.", "sol": "está bien", "porque": "una de las dos excepciones vivas, con <i>ardiendo<\/i>"}, {"enun": "Entró <b>llamando<\/b> a la puerta.", "sol": "está bien", "porque": "las dos acciones pasan a la vez"}, {"enun": "Aprobó el examen, <b>consiguiendo<\/b> la plaza al mes siguiente.", "sol": "está mal"}, {"enun": "Publicó el informe, <b>dimitiendo<\/b> al día siguiente.", "sol": "está mal", "porque": "gerundio de posterioridad: <i>y dimitió al día siguiente<\/i>"}, {"enun": "Busco un piso <b>teniendo<\/b> dos habitaciones.", "sol": "está mal", "porque": "gerundio con valor de adjetivo: <i>un piso que tenga dos habitaciones<\/i>"}, {"enun": "Contestó <b>mirando<\/b> al suelo.", "sol": "está bien"}], "criterio": "Los tres que están mal se arreglan igual: con <b>y<\/b> más un verbo conjugado, o con <b>que<\/b> más un verbo conjugado. Y la prueba para decidirlo es preguntarse si las dos acciones ocurren a la vez.", "apoyo": ["3 · Las formas no personales"], "solo_web": true}], "cuaderno_txt": "Nudo 10 · El verbo — apartado 3: Las formas no personales (p. 133) · ejercicios 7, 8 y 9", "teoria_dossier": true}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras y frases marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.

  var ventana = null, disparador = null;
  function creaVentana() {

    caja.setAttribute('aria-modal', 'true');

    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');

    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');

    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });
    ventana.querySelector('.v-x').focus();
  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {
    nodo.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentNode.classList && tb.parentNode.classList.contains('tabla-scroll')) return;
      var w = el('div', 'tabla-scroll');
      tb.parentNode.insertBefore(w, tb); w.appendChild(tb);

  }
  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;
  function pliegaApartados(nodo) {
    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');
      nodo.insertBefore(det, h);
      sum.appendChild(h);
      det.appendChild(sum);
      while (det.nextSibling && det.nextSibling.tagName !== 'H3') det.appendChild(det.nextSibling);
    });
    return nodo;
  }
  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y
     un bloque por cada <h3> o <h4>. La teoría que sale del dossier trae un h3 por
     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);
    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;
    for (var i = 1; i < partes.length; i += 2) {
      var tit = partes[i].replace(/<[^>]+>/g, '').trim();
      var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)
          cuerpo += partes[j] + (partes[j + 1] || '');
        h3 = tit;
      }
      out.push({ titulo: tit, html: cuerpo, padre: es3 ? null : h3 });
    }
    return out;
  }
  function teoriaDe(c, ej) {
    var frag = el('div', 'v-teoria');
    if (ej.apoyo_html) {
      /* el ejercicio trae su propia explicación; la teoría del carril queda debajo, plegada */
      frag.appendChild(el('div', 'v-bloque', ej.apoyo_html));
      var det0 = el('details', 'v-todo');
      det0.appendChild(el('summary', null, 'Toda la teoría de este carril'));
      det0.appendChild(el('div', 'v-bloque', c.teoria));
      frag.appendChild(det0);
      return envuelveTablas(frag);
    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');

          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }

    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });

    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;

    function corrige() {
      var ok = 0, tot = 0;

          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {

          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
