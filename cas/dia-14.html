<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 14 · 12 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 14, "fecha": "2026-11-12", "tab": "Día 14 · 12 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 14", "h1": "Jueves 12 de noviembre", "sub": "La h · la devolución del segundo texto · las formas no personales", "carriles": [{"chapa": "Carril A", "titulo": "La h", "meta": "30 minutos · cuatro familias y seis pares", "cuaderno": {"nudo": "4bis", "apartados": [2], "ejercicios": [3, 4]}, "teoria": "<h3>2 · La h<\/h3>\n<p>Empieza por las faltas de h, porque se arreglan antes que las de b y v. La h no suena, así que el oído no interviene: la regla se reduce a cuatro familias y seis pares.<\/p>\n<p><strong>Dónde hay h siempre:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>familia<\/th>\n<th>ejemplos, todos de textos y criterios de la prueba<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>los verbos <strong>haber, hacer, hablar, hallar, habitar<\/strong> y sus derivados<\/td>\n<td>ha, han, hay, había, hecho, hace, hablar, hallan, habitado<\/td>\n<\/tr>\n<tr>\n<td><strong>hie-, hue-, hui-<\/strong> al empezar<\/td>\n<td>hierba, huella, huir, hueso, huérfano<\/td>\n<\/tr>\n<tr>\n<td><strong>hum-, herm-, horr-, hist-<\/strong><\/td>\n<td>humanos, humanidad, hermano, horror, historia<\/td>\n<\/tr>\n<tr>\n<td><strong>exh-, inh-, coh-, proh-<\/strong> dentro de la palabra<\/td>\n<td>exhibición, inhumano, coherencia, prohibir<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y los pares que deciden la falta:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>con h<\/th>\n<th>sin h<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ha<\/strong> (verbo: <em>ha llegado<\/em>)<\/td>\n<td><strong>a<\/strong> (preposición: <em>a las ocho<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>hay<\/strong> (verbo: <em>hay cazadores<\/em>) · <strong>ahí<\/strong> (lugar)<\/td>\n<td><strong>ay<\/strong> (queja)<\/td>\n<\/tr>\n<tr>\n<td><strong>he<\/strong> (verbo: <em>he visto<\/em>)<\/td>\n<td><strong>e<\/strong> (conjunción: <em>padres e hijos<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>hecho<\/strong> (de <em>hacer<\/em>)<\/td>\n<td><strong>echo<\/strong> (de <em>echar<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>hasta<\/strong> (límite: <em>hasta la puerta<\/em>)<\/td>\n<td><strong>asta<\/strong> (el palo de la bandera)<\/td>\n<\/tr>\n<tr>\n<td><strong>deshecho<\/strong> (de <em>deshacer<\/em>)<\/td>\n<td><strong>desecho<\/strong> (residuo, de <em>desechar<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Una falta real, y en un documento oficial.<\/strong> La respuesta modelo de la convocatoria 2021 escribe «los <strong>deshechos<\/strong> tecnológicos». Está mal: <em>deshecho<\/em> es de <em>deshacer<\/em>; la basura es <strong>desecho<\/strong>. Que aparezca en un papel oficial no la hace correcta. Sirve como aviso: esta falta la comete hasta quien redacta la clave oficial.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Con h o sin ella: elige", "dossier": {"cuaderno": "4bis", "ejercicio": 3}, "ayuda": "Elige la forma del paréntesis que corresponde a la oración.", "estricto": true, "items": [{"enun": "Marcial <b>(a / ha)<\/b> presumido de sus trofeos.", "sol": "ha", "porque": "verbo <i>haber<\/i>: <i>ha presumido<\/i>", "ops": ["a", "ha"]}, {"enun": "<b>(Hay / Ahí / Ay)<\/b> cazadores decentes.", "sol": "Hay", "porque": "verbo <i>haber<\/i>: existen", "ops": ["Ahí", "Ay", "Hay"]}, {"enun": "Lo dejó <b>(hay / ahí / ay)<\/b> mismo.", "sol": "ahí", "porque": "adverbio de lugar: <i>ahí mismo<\/i>", "ops": ["hay", "ay", "ahí"]}, {"enun": "Ya <b>(e / he)<\/b> terminado el resumen.", "sol": "he", "porque": "verbo <i>haber<\/i>: <i>he terminado<\/i>", "ops": ["he", "e"]}, {"enun": "Vinieron padres <b>(e / he)<\/b> hijos.", "sol": "e", "porque": "conjunción: <i>y<\/i> delante de <i>hi-<\/i>", "ops": ["e", "he"]}, {"enun": "Yo no le <b>(hecho / echo)<\/b> sal a la comida.", "sol": "echo", "porque": "de <i>echar<\/i>: echar sal", "ops": ["hecho", "echo"]}, {"enun": "Eso lo ha <b>(hecho / echo)<\/b> ella.", "sol": "hecho", "porque": "de <i>hacer<\/i>: <i>lo ha hecho ella<\/i>", "ops": ["hecho", "echo"]}, {"enun": "Caminó <b>(hasta / asta)<\/b> la puerta.", "sol": "hasta", "porque": "preposición: hasta la puerta", "ops": ["asta", "hasta"]}], "criterio": "Las formas de <i>haber<\/i> llevan <i>h<\/i>: <i>ha<\/i>, <i>he<\/i>, <i>hay<\/i>. Si la palabra se puede sustituir por otro verbo o por <i>existe<\/i>, es de <i>haber<\/i>. <i>Ahí<\/i> es un adverbio de lugar; <i>e<\/i> es la conjunción <i>y<\/i> delante de una palabra que empieza por <i>hi-<\/i>. <i>Hecho<\/i> es de <i>hacer<\/i> y <i>echo<\/i>, de <i>echar<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 3"}, {"tipo": "hueco", "titulo": "Deshecho o desecho", "dossier": {"cuaderno": "4bis", "ejercicio": 4}, "ayuda": "Escribe <i>deshecho<\/i> o <i>desecho<\/i>, en singular o en plural según la frase.", "estricto": true, "items": [{"enun": "Los ______ de las fábricas contaminan.", "sol": "desechos", "porque": "residuos"}, {"enun": "Llegó ______ del viaje.", "sol": "deshecho", "porque": "de <i>deshacer<\/i>: agotado"}, {"enun": "El contenedor marrón es para los ______ orgánicos.", "sol": "desechos", "porque": "residuos"}, {"enun": "Ha ______ la maleta en cinco minutos.", "sol": "deshecho", "porque": "la maleta, de <i>deshacer<\/i>"}, {"enun": "Tiene los nervios ______ desde el despido.", "sol": "deshechos", "porque": "de <i>deshacer<\/i>: los nervios, deshechos"}, {"enun": "El ______ de la obra se lleva a un vertedero.", "sol": "desecho", "porque": "residuo"}], "criterio": "<i>Deshecho<\/i>, con <i>h<\/i>, es el participio de <i>deshacer<\/i>: una maleta deshecha, una persona deshecha de cansancio. <i>Desecho<\/i>, sin <i>h<\/i>, nombra lo que se tira: los desechos de una fábrica, el desecho de una obra.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 4"}, {"tipo": "hueco", "titulo": "Los seis pares", "estricto": true, "ayuda": "Escribe la palabra del hueco, con h o sin ella.", "items": [{"enun": "El paquete ______ llegado esta mañana.", "sol": "ha"}, {"enun": "Empieza ______ las ocho.", "sol": "a"}, {"enun": "Déjalo ______, encima de la mesa.", "sol": "ahí"}, {"enun": "______ mucha gente esperando.", "sol": "Hay|hay"}, {"enun": "Han ______ una reforma en el local. <i>(hacer, participio)<\/i>", "sol": "hecho"}, {"enun": "Yo no le ______ la culpa a nadie. <i>(echar)<\/i>", "sol": "echo"}, {"enun": "Aguantó ______ el final.", "sol": "hasta"}, {"enun": "La bandera ondea en el ______.", "sol": "asta"}, {"enun": "Reciclan los ______ del taller. <i>(los residuos)<\/i>", "sol": "desechos"}], "criterio": "Los tres primeros pares se resuelven con una sola pregunta: <b>¿es un verbo?<\/b> Si lo es, lleva h. <i>Ha llegado<\/i>, <i>hay gente<\/i>, <i>he visto<\/i>.<br><br>En los tres últimos la oposición es distinta: son dos verbos que existen los dos (<i>hacer<\/i> / <i>echar<\/i>, <i>deshacer<\/i> / <i>desechar<\/i>) y un sustantivo. En esos tres hay que saber qué se quiere decir.", "apoyo": ["2 · La h"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las haches", "ayuda": "Ocho palabras de este párrafo están mal por la h: sobra o falta. <b>Pincha en ellas.<\/b>", "items": [{"texto": "A llegado el aviso de que ay que retirar los deshechos antes del viernes. E hablado con el vecino y dice que él va a llamar asta el ayuntamiento, aunque no cree que aya nadie hasta el lunes. Yo e echo lo que he podido.", "faltas": {"A": "Ha", "ay": "hay", "deshechos": "desechos", "E": "He", "asta": "hasta", "aya": "haya", "echo": "hecho", "e": "he"}}], "criterio": "Seis de las ocho son verbos a los que les falta la h; <i>asta<\/i> es la preposición <i>hasta<\/i> sin ella, y <i>deshechos<\/i>, con una h de más, es la falta de la clave oficial de 2021.<br><br>Atiende a las dos <i>hasta<\/i>: una está escrita <i>asta<\/i> y la otra bien. Y en <i>e echo<\/i> del final, que lleva las dos mal seguidas: <b>he hecho<\/b>.", "apoyo": ["2 · La h"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Por qué lleva h?", "ayuda": "Todas están bien escritas. Indica qué familia lo explica.", "ops": ["es del verbo haber, hacer o hablar", "empieza por hie-, hue-, hui-", "empieza por hum-, herm-, horr-, hist-", "lleva exh-, inh-, coh- dentro"], "items": [{"enun": "<i>coherencia<\/i>", "sol": "lleva exh-, inh-, coh- dentro"}, {"enun": "<i>habitado<\/i>", "sol": "es del verbo haber, hacer o hablar"}, {"enun": "<i>hallan<\/i>", "sol": "es del verbo haber, hacer o hablar", "porque": "de <i>hallar<\/i>, encontrar"}, {"enun": "<i>huella<\/i>", "sol": "empieza por hie-, hue-, hui-"}, {"enun": "<i>hierba<\/i>", "sol": "empieza por hie-, hue-, hui-"}, {"enun": "<i>prohibir<\/i>", "sol": "lleva exh-, inh-, coh- dentro"}, {"enun": "<i>historia<\/i>", "sol": "empieza por hum-, herm-, horr-, hist-"}, {"enun": "<i>hermano<\/i>", "sol": "empieza por hum-, herm-, horr-, hist-"}], "criterio": "<i>Coherencia<\/i> se falla más que las otras siete, y en este curso aparece a diario: da nombre a una de las seis bandas de la redacción.", "apoyo": ["2 · La h"], "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartado 2: La h (p. 33) · ejercicios 3 y 4", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El segundo texto y las cinco partes", "meta": "25 minutos · lo que falla cuando ya no hay faltas", "cuaderno": [{"nudo": 17, "apartados": [4], "ejercicios": [12], "secciones": {"4": ["2016"]}}, {"nudo": 18, "apartados": [5, 6], "ejercicios": [13]}], "teoria": "<h3>Nudo 17 · 4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2016 · Entrevista a Elia Barceló<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Entrevista a Elia Barceló<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Has escrito muchos libros para jóvenes y has tenido mucho contacto con ellos. ¿Qué crees que es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lo que más les gusta encontrar en los libros?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hablando con jóvenes en muchos de los encuentros que hemos tenido, un tema que aparece con<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">frecuencia es el amor. Lo encuentro lógico porque ellos están en la edad ideal para descubrirlo, para tener<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las primeras experiencias, para hacer proyectos y fijarse metas, para aprender. Como para mí el amor<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">es uno de los temas centrales, tanto en mi obra juvenil como en mis novelas para adultos, los lectores<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes y yo nos entendemos bien, aunque yo no escribo siempre sobre amores románticos y con final<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">feliz. Yo lo que quiero es pasarles la idea de que el amor es el motor del universo (entendiendo el amor<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">del modo más amplio posible, claro) y que puede funcionar si uno pone trabajo, alegría y entusiasmo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">¿Cómo ha cambiado la literatura juvenil desde tu punto de vista de autora?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Ha habido dos cambios importantes, uno muy positivo y otro bastante negativo. El positivo es que hay<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mucha más libertad y muchas más posibilidades para escribir novelas diferentes, arriesgadas, que tratan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo tipo de temas con más claridad y dureza de lo que se permitía hace un par de décadas. Ahora también<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">podemos escribir novelas fantásticas y de terror sin temer que nos las rechacen. Los editores se han dado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cuenta de que son temas que gustan a los jóvenes y han aprendido también que ambos géneros son<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">importantes para el desarrollo de los adolescentes.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El cambio negativo al que me refería más arriba es que muchas editoriales que antes se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupaban sobre todo de cribar para publicar buenos libros han decidido que, como hay que<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">sobrevivir económicamente, sale muy rentable publicar lo que ellos creen que los jóvenes quieren leer,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">independientemente de su valor literario. Por eso han inundado el panorama juvenil de novelas facilonas,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cursis, tan incoherentes como la mayor parte de las películas «para público juvenil», que ni siquiera están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">bien escritas ni tienen una mínima riqueza léxica ni una leve complejidad sintáctica.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Desde 1981 trabajas como profesora de literatura creativa. ¿Crees que la escritura creativa debería<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">estar más presente en las universidades españolas?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Creo que debería estar más presente en toda educación, porque escribir es expresar el pensamiento,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los sentimientos, las emociones…, aprender que lo que está dentro salga al exterior con claridad, con<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precisión, y otras personas puedan entonces comprenderlo. Estoy convencida de que si a las personas se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las enseñara desde muy pequeñas a poner en palabras lo que sienten y piensan, habría menos violencia,<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">porque en muchas ocasiones la violencia nace de la incapacidad de decir lo que a uno le pasa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">También es muy importante enseñar a los niños a ordenar su pensamiento, a argumentar sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">opiniones, a protestar educadamente…, a mil cosas necesarias.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación de la entrevista de Nerea Marco y Carlota Echeverría, <\/em>El Templo de las Mil Puertas<em>, n.º 46, junio de 2015, tal como la imprimió la prueba de 2016. Es el único texto de la serie que no es una columna: es una entrevista, y las preguntas forman parte del texto.<\/em><\/p>\n<h3>Nudo 18 · 5 · Nueve redacciones puntuadas<\/h3>\n<p>Léelas con la hoja A-1 delante y puntúalas tú antes de mirar la nota.<\/p>\n<h4>Consigna de 2021, opción A — <em>la educación para poder mejorar la vida de las personas<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 106 palabras.<\/p>\n<blockquote>\n<p>Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>3<\/strong>.<\/p>\n<p>Tesis discutible en la primera frase; dos argumentos con conector (<em>en primer lugar<\/em>, <em>además<\/em>); una concesión (<em>es cierto que… pero<\/em>) que sube variación; cierre con consecuencia, no repetición; ni una falta ni una coma que sobre. <strong>Es el único de los nueve que llega a 3.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 98 palabras.<\/p>\n<blockquote>\n<p>Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,25<\/strong>.<\/p>\n<p>Sin faltas y con los puntos donde van, corrección y cohesión quedan enteras; pierde en las otras cuatro bandas. La tesis no es discutible; los tres argumentos se suman con <em>también<\/em>, sin marcar el orden (<em>en primer lugar<\/em>, <em>además<\/em>), y se acumulan; el cierre repite la primera frase casi igual (coherencia, 0,25). <em>Ayudar<\/em> aparece cuatro veces, <em>la educación<\/em> cuatro y <em>yo pienso que<\/em> dos: palabras que se repiten a menudo, y la variación se queda en 0. El <em>tú<\/em> de conversación (<em>te ayuda<\/em>, <em>si tú sabes<\/em>) y <em>yo pienso que<\/em> dejan el registro en 0.<\/p>\n<p><strong>Modelo bajo.<\/strong> 63 palabras.<\/p>\n<blockquote>\n<p>La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,35<\/strong>, y prorrateado por la extensión, ≈ <strong>0,85<\/strong>.<\/p>\n<p>Siete faltas de ortografía en 63 palabras (corrección, 0,6) — Cuenta C: <em>educacion<\/em> (dos veces), <em>inportante<\/em>, <em>por que<\/em>, <em>ningun<\/em>, <em>estudio<\/em>, <em>estan<\/em>. Cuenta B: tres comas donde iba punto —tras <em>nada<\/em>, tras <em>igual<\/em> y tras <em>y punto<\/em>—, y con tres la cohesión baja a 0,5. No hay tesis discutible, la razón es un ejemplo (<em>en mi pueblo<\/em>) y el final se desdice (coherencia, 0). <em>O sea<\/em> y <em>y punto<\/em> son marcas de oralidad (registro, 0). Y se queda por debajo de las 80 de clase: cada banda se prorratea por la extensión, 63 de las 100 palabras pedidas.<\/p>\n<h4>Consigna de 2020, opción A — <em>la caza<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 111 palabras.<\/p>\n<blockquote>\n<p>Creo que la caza no se puede defender ni condenar en bloque, porque el juicio dependerá de la razón por la que se cace. En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien. Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos. Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no tiene otro objeto que presumir. Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia, ni una falta y una concesión. <em>Por qué no es un tres:<\/em> supongamos que el folio viene sin márgenes. <strong>Ha perdido la banda que solo exige márgenes y letra legible.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 97 palabras. <em>(Escrito con las faltas que se repiten en los primeros textos de clase.)<\/em><\/p>\n<blockquote>\n<p>Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0,8<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,80<\/strong>.<\/p>\n<p>Las razones se amontonan y el final abre un tema nuevo. Cuenta B: cuatro comas donde iba punto, y el punto que falta detrás de <em>sin comida<\/em>. Cuenta C: <em>esta<\/em>, <em>tambien<\/em>, <em>diversion<\/em>, <em>ademas<\/em>, <em>ningun<\/em>. Y <em>animales<\/em> cuatro veces. <strong>Le falta la estructura: una tesis, dos razones con conector y un cierre.<\/strong><\/p>\n<p><strong>Modelo bajo.<\/strong> 83 palabras.<\/p>\n<blockquote>\n<p>A mi la caza me parese una cosa muy antigua que ya no sirbe para nada, en mi pueblo ay muchos cazadores y salen los domingos con las escopetas, luego se ban al bar a contarlo, yo e ido alguna vez de pequeño y la berdad es que no me gusto nada ver al conejo aquel echo un cristo, o sea que por mi que la proiban ya y punto, tanpoco quiero meterme con nadie por que cada uno hase lo que kiere.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>La idea llega al final y luego se desdice. Cinco comas donde iba un punto. Quince faltas —Cuenta C: <em>mi<\/em> (dos veces, sin tilde), <em>parese<\/em>, <em>sirbe<\/em>, <em>ay<\/em>, <em>ban<\/em>, <em>e<\/em>, <em>berdad<\/em>, <em>gusto<\/em>, <em>echo<\/em>, <em>proiban<\/em>, <em>tanpoco<\/em>, <em>por que<\/em>, <em>hase<\/em>, <em>kiere<\/em>—: a partir de doce, corrección es cero. <em>O sea<\/em> y <em>echo un cristo<\/em> se llevan el registro. Y <strong>83 palabras: tres por encima del límite de clase para el prorrateo.<\/strong> Un apunte que tranquiliza: esas quince faltas <strong>no descuentan otros 1,50 aparte<\/strong>, porque la penalización de 0,10 solo corre en los bloques 1 y 2.<\/p>\n<h4>Consigna de 2026, opción A — <em>la necesidad de defender el trabajo agrícola<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 110 palabras.<\/p>\n<blockquote>\n<p>Creo que hay que defender el trabajo agrícola porque de él depende quién decide el precio de lo que comemos. En primer lugar el agricultor cobra por su cosecha una parte muy pequeña de lo que pagamos en la tienda, y la diferencia se la quedan los intermediarios. Además el campo depende de un clima cada vez menos previsible, y dos años malos seguidos pueden cerrar una explotación entera. Es cierto que las subvenciones sostienen al sector cada año pero una ayuda no sustituye un precio justo. Por eso pienso que defender el campo es asegurar que la comida se siga produciendo aquí y no dependa solo de las importaciones.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia y ni una falta. <em>Por qué no es un tres:<\/em> le faltan tres comas —tras <em>En primer lugar<\/em>, tras <em>Además<\/em> y delante de <em>pero<\/em>—. <strong>Los dos primeros errores de cohesión no bajan la banda; a partir del tercero, cada dos errores bajan 0,25, y con tres se queda en 0,5.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 95 palabras, con sus faltas.<\/p>\n<blockquote>\n<p>Yo creo que el trabajo agricola es muy importante para todos porque sin agricultores no comeriamos, los agricultores trabajan mucho y ganan muy poco dinero y eso no esta bien, en mi pueblo casi todos los jovenes se an ido a la ciudad y las tierras se quedan sin nadie que las trabaje, tambien está el problema de que la comida viene de fuera y es más barata. Yo creo que hay que ayudar a los agricultores porque el trabajo agricola es muy importante para todos y luego nos quejamos cuando todo sube de precio.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,85<\/strong>.<\/p>\n<p>El cierre es la primera frase copiada. Tres comas donde iba punto. Siete faltas —Cuenta C: <em>agricola<\/em> (dos veces), <em>comeriamos<\/em>, <em>esta<\/em>, <em>jovenes<\/em>, <em>an<\/em>, <em>tambien<\/em>—, y dos son la misma palabra: <em>agricola<\/em> cuenta cada vez. <em>Por qué está donde está:<\/em> le faltan dos partes que se arreglan en tres minutos: <strong>una tesis discutible y un cierre que no la repita<\/strong>.<\/p>\n<p><strong>Modelo bajo.<\/strong> 91 palabras.<\/p>\n<blockquote>\n<p>El campo es muy duro. Mi tio tenia unas tierras aya en el pueblo y las bendio por que no sacaba nada. Ahora ai muchas naves. La gente de ciudad no save lo que cuesta un kilo de tomates, en berano fui a coger aceituna y acabé echo polvo. Yo que se, esto tendrian que areglarlo los de arriba. Tambien es verda que la fruta de fuera esta mas barata y la gente compra lo barato, es normal. En fin, que el campo esta fatal y no ay quien lo arregle.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>No hay tesis: salta del tío a los tomates y a la aceituna, y al final se desdice. Dieciocho faltas contadas por lo bajo — Cuenta C: <em>tio<\/em>, <em>tenia<\/em>, <em>aya<\/em>, <em>bendio<\/em>, <em>por que<\/em>, <em>ai<\/em>, <em>save<\/em>, <em>berano<\/em>, <em>echo<\/em>, <em>se<\/em>, <em>tendrian<\/em>, <em>areglarlo<\/em>, <em>Tambien<\/em>, <em>verda<\/em>, <em>esta<\/em> (dos veces), <em>mas<\/em>, <em>ay<\/em>. <em>Yo que se<\/em> y <em>echo polvo<\/em> se llevan el registro. <em>Por qué está donde está:<\/em> <strong>la cohesión supera a la de los otros dos modelos bajos<\/strong> —frases cortas, acabadas en punto— y aun así saca 0,75, porque no hay tesis ni argumentos y las dieciocho faltas dejan la corrección en cero.<\/p>\n<h3>Nudo 18 · 6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2016: las tres preguntas", "dossier": {"cuaderno": "17", "ejercicio": 12, "parte": "1.1 a 1.3"}, "ayuda": "Las preguntas oficiales de 2016, sobre la entrevista a Elia Barceló, que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos para el bloque entero.", "items": [{"enun": "«Resuma brevemente con sus propias palabras qué dos cambios destaca la escritora en la literatura juvenil actual.» <b>[1,5]<\/b>", "conv": "2016", "modelo": "La escritora cree que se ha producido un cambio positivo y otro negativo. El positivo es que ahora se pueden escribir más subgéneros de novela juvenil que antes, porque los editores aceptan las novelas de terror y las fantásticas. El negativo es que los editores tienen como principal objetivo el rendimiento económico y por ello publican muchas veces novelas que se venden rápido pero no tienen un mínimo de calidad literaria."}, {"enun": "«¿Qué aspectos del amor intenta trasmitir Elia Barceló en sus libros para jóvenes?» <b>[0,5]<\/b>", "conv": "2016", "modelo": "Quiere plasmar una imagen alejada de la concepción tradicional del amor romántico con final feliz; a la vez, es consciente de la importancia del amor para los jóvenes e intenta transmitirles la idea de que es algo imprescindible en la vida y que funciona si se trabaja con alegría y entusiasmo para conseguirlo y mantenerlo."}, {"enun": "«Explique brevemente por qué Elia Barceló cree que es importante que la escritura creativa esté presente en la educación.» <b>[0,5]<\/b>", "conv": "2016", "modelo": "Porque la escritura creativa permite a niños y jóvenes aprender dos tareas importantes: expresar el pensamiento y los sentimientos propios con la precisión necesaria para que otros los entiendan, y argumentar las propias opiniones."}], "criterio": "Los modelos son las respuestas oficiales de 2016. El resumen de la 1.1 vale 1,5 y se corrige con la rúbrica de cuatro niveles (1,5 · 1 · 0,75 · 0): tiene que recoger los dos cambios, el positivo y el negativo, sin copiar frases del texto.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2016"}, "apoyo": ["2016 · Entrevista a Elia Barceló"], "dossier_txt": "Del dossier: nudo 17, ejercicio 12 · 1.1 a 1.3", "texto_titulo": "2016 · Entrevista a Elia Barceló", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Entrevista a Elia Barceló<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Has escrito muchos libros para jóvenes y has tenido mucho contacto con ellos. ¿Qué crees que es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lo que más les gusta encontrar en los libros?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hablando con jóvenes en muchos de los encuentros que hemos tenido, un tema que aparece con<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">frecuencia es el amor. Lo encuentro lógico porque ellos están en la edad ideal para descubrirlo, para tener<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las primeras experiencias, para hacer proyectos y fijarse metas, para aprender. Como para mí el amor<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">es uno de los temas centrales, tanto en mi obra juvenil como en mis novelas para adultos, los lectores<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">jóvenes y yo nos entendemos bien, aunque yo no escribo siempre sobre amores románticos y con final<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">feliz. Yo lo que quiero es pasarles la idea de que el amor es el motor del universo (entendiendo el amor<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">del modo más amplio posible, claro) y que puede funcionar si uno pone trabajo, alegría y entusiasmo.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">¿Cómo ha cambiado la literatura juvenil desde tu punto de vista de autora?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Ha habido dos cambios importantes, uno muy positivo y otro bastante negativo. El positivo es que hay<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">mucha más libertad y muchas más posibilidades para escribir novelas diferentes, arriesgadas, que tratan<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo tipo de temas con más claridad y dureza de lo que se permitía hace un par de décadas. Ahora también<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">podemos escribir novelas fantásticas y de terror sin temer que nos las rechacen. Los editores se han dado<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cuenta de que son temas que gustan a los jóvenes y han aprendido también que ambos géneros son<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">importantes para el desarrollo de los adolescentes.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El cambio negativo al que me refería más arriba es que muchas editoriales que antes se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">preocupaban sobre todo de cribar para publicar buenos libros han decidido que, como hay que<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">sobrevivir económicamente, sale muy rentable publicar lo que ellos creen que los jóvenes quieren leer,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">independientemente de su valor literario. Por eso han inundado el panorama juvenil de novelas facilonas,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">cursis, tan incoherentes como la mayor parte de las películas «para público juvenil», que ni siquiera están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">bien escritas ni tienen una mínima riqueza léxica ni una leve complejidad sintáctica.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Desde 1981 trabajas como profesora de literatura creativa. ¿Crees que la escritura creativa debería<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">estar más presente en las universidades españolas?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Creo que debería estar más presente en toda educación, porque escribir es expresar el pensamiento,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los sentimientos, las emociones…, aprender que lo que está dentro salga al exterior con claridad, con<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precisión, y otras personas puedan entonces comprenderlo. Estoy convencida de que si a las personas se<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las enseñara desde muy pequeñas a poner en palabras lo que sienten y piensan, habría menos violencia,<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">porque en muchas ocasiones la violencia nace de la incapacidad de decir lo que a uno le pasa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">También es muy importante enseñar a los niños a ordenar su pensamiento, a argumentar sus<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">opiniones, a protestar educadamente…, a mil cosas necesarias.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación de la entrevista de Nerea Marco y Carlota Echeverría, <\/em>El Templo de las Mil Puertas<em>, n.º 46, junio de 2015, tal como la imprimió la prueba de 2016. Es el único texto de la serie que no es una columna: es una entrevista, y las preguntas forman parte del texto.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "Bloque 1 de 2016: el léxico", "dossier": {"cuaderno": "17", "ejercicio": 12, "parte": "1.4"}, "ayuda": "La pregunta 1.4 de 2016: «Proponga un sinónimo o explique el significado de las siguientes palabras o expresiones. Preste atención a la adecuación de la palabra al contexto en el que se encuentra.» Vale 1 punto.", "items": [{"enun": "<i>el motor del universo<\/i> (línea 9)", "modelo": "la fuerza que rige las actitudes y acciones de toda la humanidad"}, {"enun": "<i>rentable<\/i> (línea 20)", "modelo": "productivo, beneficioso; que produce el dinero suficiente"}, {"enun": "<i>facilonas<\/i> (línea 21)", "modelo": "sencillas, simples; extremadamente simples y poco trabajadas"}, {"enun": "<i>importante<\/i> (línea 31)", "modelo": "fundamental, interesante; necesario para conseguir un fin"}], "criterio": "Cada palabra vale 0,25; con alguna imprecisión, 0,1. El sinónimo tiene que servir en la frase del texto: <i>rentable<\/i> se dice aquí de un libro que vende, y por eso la clave lo explica con el dinero que produce.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2016"}, "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2016 · Entrevista a Elia Barceló"], "dossier_txt": "Del dossier: nudo 17, ejercicio 12 · 1.4", "texto_titulo": "2016 · Entrevista a Elia Barceló", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Entrevista a Elia Barceló<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Has escrito muchos libros para jóvenes y has tenido mucho contacto con ellos. ¿Qué crees que es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lo que más les gusta encontrar en los libros?<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hablando con jóvenes en muchos de los encuentros que hemos tenido, un tema que aparece con<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">frecuencia es el amor. Lo encuentro lógico porque ellos están en la edad
