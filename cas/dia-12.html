<script>window.DIA = {"dia": 12, "fecha": "2026-11-05", "tab": "Día 12 · 5 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 12", "h1": "Jueves 5 de noviembre", "sub": "Práctica de B/V y J/G · el resumen entero · copulativos y atributo", "carriles": [{"chapa": "Carril A", "titulo": "Práctica: B/V y J/G", "meta": "30 minutos · sin reglas nuevas, solo las tres que más resuelven", "cuaderno": {"nudo": 4, "apartados": [4], "ejercicios": [9, 10, 11]}, "teoria": "<h3>4 · Las tres reglas que evitan más faltas<\/h3>\n<p>Tres reglas cubren la mayoría de las faltas reales de B/V y J/G:<\/p>\n<ol>\n<li><strong>El imperfecto acaba en <em>-aba<\/em>, siempre con b.<\/strong> <em>Estaba, llevaba, pensaba, trabajaba.<\/em> Todos los imperfectos de los verbos en <em>-ar<\/em>, sin ninguna excepción, incluidos los que en infinitivo llevan v: <em>lavar → lavaba<\/em>, <em>votar → votaba<\/em>. Y el de <em>ir<\/em>, que es irregular y también va con b: <em>iba, íbamos<\/em>. Dónde se falla: al cruzarlo con los verbos en <em>-er<\/em> y en <em>-ir<\/em>, que no hacen <em>-aba<\/em> sino <em>-ía<\/em>, sin b y con tilde: <em>volver → volvía<\/em>, <em>vivir → vivía<\/em>.<\/li>\n<li><strong>Los sustantivos en <em>-aje<\/em> van siempre con j.<\/strong> <em>Paisaje, mensaje, lenguaje, aprendizaje, garaje, equipaje.<\/em> Dónde se falla: en los verbos que suenan igual y van con g —<em>coger, proteger, dirigir, exigir<\/em>— y en las palabras de la misma familia que ya no acaban en <em>-aje<\/em>: de <em>pasaje<\/em> sale <em>pasajero<\/em>, también con j.<\/li>\n<li><strong><em>m<\/em> + <em>b<\/em>, <em>n<\/em> + <em>v<\/em>.<\/strong> <em>Cambio, hombre, nombre, también, asombro, cumbre<\/em> / <em>invierno, convivir, envejecer, enviar.<\/em> Nunca al revés: en castellano no existe ninguna palabra con <em>nb<\/em> ni con <em>mv<\/em>, así que la duda la resuelve la letra siguiente y no el oído.<\/li>\n<\/ol>\n<p>Y el hábito: <strong>la última lectura de un examen se dedica solo a la ortografía<\/strong>. No relees el contenido; buscas las bes, las uves, las jotas, las ges y las tildes. Ocupa tres minutos.<\/p>\n<p><strong>La cuenta.<\/strong> Si repites la misma palabra mal escrita cuatro veces en tres textos, esa palabra sola suma cuatro faltas, y todas se quitan aprendiendo una palabra.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Huecos de b y v en el texto de 2026", "dossier": {"cuaderno": "4", "ejercicio": 9}, "ayuda": "Doce huecos de un fragmento del texto de 2026, el que empieza en «Así, la mayoría…». Cada hueco va con las palabras de alrededor: escribe la palabra entera, con su tilde si la lleva. El icono «texto» abre el artículo entero.", "estricto": true, "items": [{"enun": "…la mayoría de los que se <b>atre__en<\/b> a recoger el testigo es porque…", "sol": "atreven", "porque": "no la decide ninguna regla: se aprende con la palabra"}, {"enun": "…de Trenado, que además se ha <b>mo__ido<\/b>, se ha formado y ha inno__ado.…", "sol": "movido", "porque": "no la decide ninguna regla: familia de <i>móvil<\/i>"}, {"enun": "…mo__ido, se ha formado y ha <b>inno__ado<\/b>. Plantó los oli__os que producen el…", "sol": "innovado", "porque": "después de <i>n<\/i> va <i>v<\/i>"}, {"enun": "…formado y ha inno__ado. Plantó los <b>oli__os<\/b> que producen el aceite que hoy…", "sol": "olivos", "porque": "no la decide ninguna regla: se aprende con la palabra"}, {"enun": "…que producen el aceite que hoy <b>__ende<\/b> íntegramente a través de la web…", "sol": "vende", "porque": "no la decide ninguna regla: familia de <i>venta<\/i>"}, {"enun": "…a través de la web y <b>tam__ién<\/b> los ár__oles de pistacho que en…", "sol": "también", "porque": "después de <i>m<\/i> va <i>b<\/i>"}, {"enun": "…de la web y tam__ién los <b>ár__oles<\/b> de pistacho que en este pasado…", "sol": "árboles", "porque": "no la decide ninguna regla: se aprende con la palabra"}, {"enun": "…delicadísimo para que los árboles den <b>__uenas<\/b> cantidades de este rentable fruto seco.…", "sol": "buenas", "porque": "no la decide ninguna regla: se aprende con la palabra"}, {"enun": "…especializado en poda que ofrece sus <b>ser__icios<\/b>, principalmente, a los compañeros de la…", "sol": "servicios", "porque": "de <i>servir<\/i>, una de las tres excepciones de <i>-bir<\/i>, con <i>hervir<\/i> y <i>vivir<\/i>"}, {"enun": "…principalmente, a los compañeros de la <b>cooperati__a<\/b>. Los pistachos que culti__an los socios…", "sol": "cooperativa", "porque": "adjetivo en <i>-iva<\/i>"}, {"enun": "…de la cooperati__a. Los pistachos que <b>culti__an<\/b> los socios y luego pasan por…", "sol": "cultivan", "porque": "no la decide ninguna regla: familia de <i>cultivo<\/i>"}, {"enun": "…su planta de procesado se están <b>__endiendo<\/b> fuera de España.", "sol": "vendiendo", "porque": "no la decide ninguna regla: familia de <i>venta<\/i>"}], "criterio": "Cuatro de las doce las decide una regla: <i>innovado<\/i> (después de <i>n<\/i> va <i>v<\/i>), <i>también<\/i> (después de <i>m<\/i> va <i>b<\/i>), <i>servicios<\/i> (de <i>servir<\/i>, excepción de <i>-bir<\/i>) y <i>cooperativa<\/i> (adjetivo en <i>-iva<\/i>). Las otras ocho se aprenden con su familia: <i>movido<\/i> con <i>móvil<\/i>, <i>vende<\/i> con <i>venta<\/i>, <i>cultivan<\/i> con <i>cultivo<\/i>.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 1, "seccion": "El texto de la convocatoria de 2026"}, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 9", "texto_titulo": "El texto de la convocatoria de 2026", "texto_html": "<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>"}, {"tipo": "hueco", "titulo": "Huecos de j y g en el texto de 2022", "dossier": {"cuaderno": "4", "ejercicio": 10}, "ayuda": "Seis huecos de un fragmento del texto de la convocatoria de 2022, sobre el periodista Moha Gerehou. Cada hueco va con las palabras de alrededor: escribe la palabra entera, con su tilde si la lleva.", "estricto": true, "items": [{"enun": "…exista, sino que mucha <b>__ente<\/b> no quiere reconocer el…", "sol": "gente", "porque": "<i>gen-<\/i>"}, {"enun": "…calle\", resume Gerehou los <b>orí__enes<\/b> __ambianos de su familia.…", "sol": "orígenes", "porque": "<i>-gen<\/i>"}, {"enun": "…resume Gerehou los orí__enes <b>__ambianos<\/b> de su familia. \"Los…", "sol": "gambianos", "porque": "suena /g/: no hay elección"}, {"enun": "…de su familia. \"Los <b>hi__os<\/b> de mi__rantes vivimos entre…", "sol": "hijos", "porque": "suena /j/ y no cae en ninguna regla de <i>g<\/i>"}, {"enun": "…familia. \"Los hi__os de <b>mi__rantes<\/b> vivimos entre dos mundos,…", "sol": "migrantes", "porque": "suena /g/: no hay elección"}, {"enun": "…2016 y 2018, Gerehou <b>e__erció<\/b> de presidente de SOS…", "sol": "ejerció", "porque": "suena /j/ y no cae en ninguna regla de <i>g<\/i>"}], "criterio": "<i>Gente<\/i> y <i>orígenes<\/i> siguen la regla de <i>gen-<\/i> y <i>-gen<\/i>. En <i>gambianos<\/i> y <i>migrantes<\/i> la letra suena /g/, así que no hay elección. <i>Hijos<\/i> y <i>ejerció<\/i> suenan /j/ y ninguna regla de <i>g<\/i> los cubre.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 10"}, {"tipo": "cazar", "titulo": "Encuentra la falta de cada frase", "dossier": {"cuaderno": "4", "ejercicio": 11}, "ayuda": "Ocho frases seguidas, cada una con una sola falta. Pincha en la palabra mal escrita de cada frase.", "items": [{"texto": "Ayer estava en casa cuando llamaron. El paisage desde aquí es impresionante. Vamos haber si esta vez sale bien. Los inbiernos aquí son muy largos. Ella condugo toda la noche sin parar. Es un problema de mobilidad urbana. Me gusta el mensage que transmite. No sé si abrá sitio para todos.", "faltas": {"estava": "estaba: imperfecto en <i>-aba<\/i>, con <i>b<\/i>", "paisage": "paisaje: sustantivo en <i>-aje<\/i>, con <i>j<\/i>", "haber": "a ver: aquí es la preposición con el infinitivo <i>ver<\/i>, no el verbo <i>haber<\/i>", "inbiernos": "inviernos: después de <i>n<\/i> va <i>v<\/i>", "condugo": "condujo: <i>conducir<\/i> no lleva ni <i>g<\/i> ni <i>j<\/i>, y el pretérito va con <i>j<\/i>", "mobilidad": "movilidad: excepción de <i>-bilidad<\/i>, porque viene de <i>móvil<\/i>", "mensage": "mensaje: sustantivo en <i>-aje<\/i>, con <i>j<\/i>", "abrá": "habrá: forma del verbo <i>haber<\/i>, con <i>h<\/i>"}}], "criterio": "Las ocho faltas se corrigen con las reglas del apartado 4: el imperfecto en <i>-aba<\/i> con <i>b<\/i>, los sustantivos en <i>-aje<\/i> con <i>j<\/i>, <i>v<\/i> después de <i>n<\/i>, el pretérito de <i>conducir<\/i> con <i>j<\/i>. <i>Vamos haber<\/i> tiene la letra bien y la palabra mal: corresponde <i>a ver<\/i>. <i>Movilidad<\/i> se aparta de <i>-bilidad<\/i> porque viene de <i>móvil<\/i>.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4, ejercicio 11"}, {"tipo": "cazar", "titulo": "La última lectura, cronometrada", "ayuda": "Cinco faltas en este párrafo: bes, uves, jotas y ges. <b>Pincha en ellas.<\/b> Tres minutos.", "items": [{"texto": "El mensage llegó en nobiembre y decía que el paisage del valle iva a cambiar. El gobernador dijo que había que proteger el bosque, aunque el año pasado el ayuntamiento había autorizado la tala. Un vecino recogió firmas y las entregó en la conserjería, pero nadie le respondió. El aprendizage, dice, fue que conviene guardar copia.", "faltas": {"mensage": "mensaje", "nobiembre": "noviembre", "paisage": "paisaje", "iva": "iba", "aprendizage": "aprendizaje"}}], "criterio": "Lo que <b>está bien<\/b> y parece falta: <i>proteger<\/i> (verbo en -ger), <i>recogió<\/i> (de <i>recoger<\/i>), <i>gobernador<\/i> (de <i>gobierno<\/i>) y <i>conserjería<\/i>, que va con <b>j<\/b> porque es una palabra en <i>-jería<\/i>, como <i>relojería<\/i> y <i>cerrajería<\/i>.<br><br>Las cinco que fallan pertenecen a las tres reglas de arriba: <i>-aje<\/i> tres veces —<i>mensaje<\/i>, <i>paisaje<\/i>, <i>aprendizaje<\/i>—, <i>n + v<\/i> una y el imperfecto en <i>-aba<\/i> otra.", "apoyo": ["4 · Las tres reglas que evitan más faltas"], "solo_web": true}, {"tipo": "hueco", "titulo": "Las tres reglas, aplicadas", "estricto": true, "ayuda": "Escribe la palabra entera.", "items": [{"enun": "Antes ______ que era fácil. <i>(pensar, imperfecto, yo)<\/i>", "sol": "pensaba"}, {"enun": "Le mandé un ______ por el móvil. <i>(el escrito breve)<\/i>", "sol": "mensaje"}, {"enun": "En ______ hace frío. <i>(el mes 11)<\/i>", "sol": "noviembre", "porque": "n + v, nunca al revés"}, {"enun": "El ______ del valle ha cambiado. <i>(el terreno que se abarca con la vista)<\/i>", "sol": "paisaje"}, {"enun": "Quiero ______ el coche. <i>(cambiar, infinitivo)<\/i>", "sol": "cambiar", "porque": "m + b; en catalán es <i>canviar<\/i>"}, {"enun": "El ______ cuesta más de lo que parece. <i>(aprender algo)<\/i>", "sol": "aprendizaje"}], "criterio": "Las seis proceden de las tres reglas de arriba. Si en la última lectura solo te da tiempo a comprobar una regla, comprueba los imperfectos: aparecen en una redacción de cien palabras más que cualquier otra forma verbal.", "apoyo": ["4 · Las tres reglas que evitan más faltas"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿En qué casilla va esta falta?", "ayuda": "Las seis casillas del recuento. Señala dónde apuntarías cada falta.", "ops": ["b / v", "j / g", "h", "palabras separadas", "concordancia", "tildes"], "items": [{"enun": "Escribió <i>iva<\/i> por <i>iba<\/i>", "sol": "b / v"}, {"enun": "Escribió <i>echo<\/i> por <i>hecho<\/i>", "sol": "h"}, {"enun": "Escribió <i>habían muchas personas<\/i>", "sol": "concordancia", "porque": "<i>haber<\/i> impersonal no tiene plural: <i>había muchas personas<\/i>"}, {"enun": "Escribió <i>porque<\/i> donde iba <i>por qué<\/i>", "sol": "palabras separadas"}, {"enun": "Escribió <i>a ver<\/i> donde iba el verbo <i>haber<\/i>", "sol": "palabras separadas"}, {"enun": "Escribió <i>una larga y cruel agonias<\/i>", "sol": "concordancia"}, {"enun": "Escribió <i>tambien<\/i>", "sol": "tildes"}, {"enun": "Escribió <i>garage<\/i>", "sol": "j / g"}], "criterio": "La casilla con más marcas al final del trimestre marca lo único que repasas el fin de semana: no las seis familias, la que más pesa.<br><br>Las dos de concordancia: esas <b>no se localizan releyendo letras<\/b>. Van en la cuenta B, la de cohesión, y se escapan en la última lectura más que las faltas de letra.", "apoyo": ["4 · Las tres reglas que evitan más faltas"], "solo_web": true}], "cuaderno_txt": "Nudo 4 · Las letras: B/V y J/G — apartado 4: Las tres reglas que evitan más faltas (p. 30) · ejercicios 9, 10 y 11", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El resumen, sobre un texto", "meta": "25 minutos · vaciar, tapar el texto y escribir", "cuaderno": [{"nudo": 17, "apartados": [3, 4], "ejercicios": [11], "secciones": {"4": ["2017"]}}, {"nudo": 18, "apartados": [6], "ejercicios": [12]}, {"nudo": "A3", "apartados": ["el texto de partida de 2026"]}], "lectura": {"titulo": "Cincuenta minutos para once kilómetros", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["El primer autobús al polígono sale a las cinco y media de la mañana y", "tarda cincuenta minutos en hacer once kilómetros. No es que haya", "atasco: es que da la vuelta por tres pueblos. Marcos Iribarne lo coge", "cuatro días a la semana y dice que el quinto lo hace en bici, aunque", "sean once kilómetros de arcén y camión.", "", "En el polígono trabajan, según el cartel de la entrada, unas mil cuatro", "personas. Casi ninguna vive allí, porque allí no vive nadie: hay naves,", "una gasolinera y una máquina de café. Todo el mundo llega de fuera y", "todo el mundo se va al acabar.", "", "Marcos cuenta que la empresa le paga una ayuda de transporte de", "veinticinco euros al mes. El abono de autobús cuesta más, así que la", "diferencia la pone él. Y cuando el turno acaba a las diez de la noche no", "hay autobús: hay que buscarse a alguien con coche o pagar un taxi que", "cuesta lo que media jornada.", "", "Lo llamativo es que nadie discute los números. La empresa sabe a qué", "hora acaba el turno, el ayuntamiento sabe cuántos coches entran cada", "mañana y la compañía de autobuses sabe qué líneas van vacías a mediodía", "y llenas a las seis. Cada uno tiene su parte de la cuenta y nadie tiene", "la cuenta entera.", "", "Marcos no pide que le lleven en coche a casa. Dice que pide algo más", "aburrido: que el horario del autobús se haga mirando el horario de los", "turnos, que es un dato que está escrito y que no se ha mirado nunca."], "pie": "Texto inventado. Ni Marcos Iribarne ni las cifras que da son reales."}, "teoria": "<h3>Nudo 17 · 3 · El resumen<\/h3>\n<p><strong>La rúbrica oficial: cuatro niveles, no tres.<\/strong> Cópiala en el cuaderno.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">nivel<\/th>\n<th>qué exige<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\"><strong>1,5<\/strong><\/td>\n<td>recoge <strong>las ideas esenciales<\/strong>, de forma <strong>clara, ordenada y precisa<\/strong>, <strong>sin subjetividad<\/strong> y <strong>sin copia literal<\/strong><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>1<\/strong><\/td>\n<td>recoge <strong>la mayoría<\/strong> de las esenciales, sin subjetividad ni copia, pero con algún fallo de precisión, claridad u orden<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0,5<\/strong><\/td>\n<td>fallos graves en las ideas esenciales, <strong>o<\/strong> no mantiene la objetividad, <strong>o<\/strong> copia literalmente, <strong>o<\/strong> se expresa con poca claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>0<\/strong><\/td>\n<td>no recoge las ideas esenciales, malinterpreta el texto o está desordenado y confuso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Lee despacio la banda de 0,5: tiene <strong>cuatro «o»<\/strong>, y una sola basta para caer a un tercio de la nota. <strong>Copiar una frase baja a la misma banda que no haber entendido el texto.<\/strong> La rúbrica es la de 2025; en 2026 los niveles son 1,25 · 0,75 · 0,5 · 0, con los mismos descriptores.<\/p>\n<p><strong>Lo que no debe aparecer, seis elementos:<\/strong><\/p>\n<ol>\n<li><strong>Esquemas, guiones o listas con guiones.<\/strong> Se pide un texto redactado.<\/li>\n<li><strong>Ejemplos.<\/strong> El resumen se queda con la idea, no con el caso que la ilustra.<\/li>\n<li><strong>Opinión propia.<\/strong> «<em>Es muy triste que…<\/em>», «<em>a mi parecer…<\/em>»: eso es «marca de subjetividad».<\/li>\n<li><strong>Metadiscurso.<\/strong> «<em>El autor nos habla de…<\/em>» no resume nada. Si hay que atribuir una idea, se escribe «según el autor, …» y se sigue con el contenido.<\/li>\n<li><strong>Copia literal.<\/strong> El criterio oficial exige «sin copiar literalmente fragmentos del texto» y no fija cuántas palabras seguidas son un fragmento. La medida que usamos en clase para comprobarlo: ninguna cadena de tres o más palabras seguidas del original, salvo nombres propios y términos sin sinónimo.<\/li>\n<li><strong>Citas entrecomilladas.<\/strong> Si el original trae declaraciones, se pasan a <strong>estilo indirecto<\/strong> —contar lo dicho sin reproducir las palabras— y sin comillas.<\/li>\n<\/ol>\n<p><strong>Sobre la extensión.<\/strong> Se suele proponer un 25 % del original; el examen no fija porcentaje, fija puntos. Para estos textos (500-745 palabras), <strong>100-140 palabras<\/strong> funcionan.<\/p>\n<h3>Nudo 17 · 4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2017 · El espejo<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El espejo<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El otro día pasó por Madrid la viguesa Chus Lago. Chus es una alpinista y exploradora de élite; fue la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tercera mujer del mundo en subir al Everest sin oxígeno en 1999. Luego, en diciembre de 2008 y enero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de 2009, se pasó dos meses cruzando la Antártida ella sola.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">Cuando estuvo aquí hace un par de semanas volvía de liderar una expedición de cuatro mujeres<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por los lagos helados de Laponia para concienciar sobre el cambio climático. En fin, con todo esto solo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quiero señalar el coraje extraordinario de Chus Lago. Su entereza, su fuerza física y sobre todo su fuerza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">interior. Hace falta ser alguien muy templado para lanzarse a la inmensa, inconcebible soledad helada<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la Antártida, sin posibilidad de contacto humano, y arrostrar eso durante dos meses sin enloquecer.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Llegó a Madrid de paso, pues, repito por tercera vez; quería comprarse algo de ropa y, como somos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">amigas, hicimos eso tan típico de chicas que es ir juntas de tiendas. En una tienda, en fin, nos pusimos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las dos a probarnos las mismas prendas. Nos mirábamos en el enorme espejo que cubría toda una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pared y yo cavilaba, resignada, en lo mucho mejor que le quedaba todo a ella. Tiene quince años menos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que yo y un cuerpo flexible, atlético, precioso, sin un solo átomo de grasa. Después de escrutarnos por<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">delante y por detrás meticulosamente, de subirnos y bajarnos la cinturilla, de tironearnos del jersey y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hacer todos esos tontos movimientos que uno hace cuando se está probando algo, Chus hundió los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hombros, torció el gesto y dijo con genuino desaliento: «¡Jo, no sé, a mí es que me parece que te queda<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo mucho mejor a ti!».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Sus palabras me dejaron atónita. En aquel instante pensé en lo increíblemente errónea que era la<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">percepción que tenía de sí misma, y en la facilidad con la que caemos todos en esa trampa. Esta mujer<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que se ha medido a sí misma hasta la extenuación; esta guerrera capaz de soportar todos los retos,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">soportaba sin embargo mal el abismo imaginario del espejo, la confrontación con el yo ideal inexistente.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hay numerosos estudios sobre esa alteración de nuestra mirada. Recuerdo uno de hace bastantes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años en el que los sujetos, hombres y mujeres, tenían que valorar varios aspectos de su propio físico<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">tales como peso, musculación o altura, y luego los mismos aspectos en otras personas desconocidas a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las que veían a cierta distancia. La gran mayoría se creía comparativamente más gorda, más baja y más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">enclenque y en muchos casos esa apreciación era claramente errónea. De lo que estamos hablando, en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">realidad, es de poder reconocernos a nosotros mismos; de la inseguridad y el aprecio que nos tenemos;<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la capacidad de aceptar la frustración por no poder alcanzar el ideal. Todo esto es la eterna pelea de<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">la vida, nuestro viaje de exploración más importante, y se ve que es más difícil de lograr que atravesar a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">solas la aterradora Antártida. Madre mía, da miedo.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Rosa Montero, <\/em>El País Semanal<em>, 20 de marzo de 2016, tal como la imprimió la prueba de 2017.<\/em><\/p>\n<h3>Nudo 18 · 6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>\n<h3>Anexo A-3 · Texto de partida: «Un influencer agrícola»<\/h3>\n<blockquote>\n<p><strong>Convocatoria de 2026, serie 1.<\/strong> Es el texto sobre el que trabajan los ejercicios del nudo 17, y del que salen muchos de los ejemplos de los nudos 8, 9, 10 y 11. Está reproducido tal como salió en el examen, <strong>con la numeración de líneas de cinco en cinco<\/strong>, porque los enunciados oficiales se refieren a ella.<\/p>\n<p>Léelo con las cuatro pasadas del nudo 17. La forma antes que el contenido: <strong>cinco párrafos<\/strong>, la anécdota en el primero y la idea general en el último. Es el formato de quince de las dieciséis convocatorias.<\/p>\n<\/blockquote>\n<hr />\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<hr />\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1 — documento público de la Generalitat de Catalunya.<\/em><\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2017: las tres preguntas", "dossier": {"cuaderno": "17", "ejercicio": 11, "parte": "1.1 a 1.3"}, "ayuda": "Las preguntas oficiales de 2017, sobre «El espejo», de Rosa Montero, que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos para el bloque entero.", "items": [{"enun": "«¿Qué quiere destacar la escritora del carácter de Chus Lago en los dos primeros párrafos? ¿Cómo lo hace?» <b>[1]<\/b>", "conv": "2017", "modelo": "En los dos primeros párrafos la autora quiere demostrar la fortaleza de carácter y la valentía de Chus Lago, y lo hace mencionando tres acontecimientos de su carrera como alpinista y exploradora: fue la tercera mujer en subir al Everest sin oxígeno, atravesó la Antártida en solitario y lideró una expedición a los lagos de Laponia."}, {"enun": "«¿Qué sorprende a Rosa Montero de la reacción de Chus Lago en el probador de ropa?» <b>[0,5]<\/b>", "conv": "2017", "modelo": "El contraste entre el carácter decidido y valiente de la alpinista y su reacción exagerada y poco realista ante su propio cuerpo."}, {"enun": "«Resuma brevemente, con sus propias palabras, lo que expone la autora en el último párrafo sobre la percepción que tienen los seres humanos de su propio cuerpo.» <b>[1]<\/b>", "conv": "2017", "modelo": "Rosa Montero explica que el ser humano tiene, en ocasiones, una falsa percepción de sí mismo que le lleva a tensiones y problemas psicológicos, y se apoya en un estudio en el que un grupo de hombres y mujeres valoraba aspectos físicos en ellos mismos y en los demás: siempre valoraban mejor y de forma más realista a los demás. Concluye que el problema radica en que no todos saben valorar su propia imagen, quererse y aceptar la frustración de no alcanzar el ideal que se han propuesto, un viaje personal más difícil e importante que atravesar la Antártida."}], "criterio": "Los modelos son las respuestas oficiales de 2017. La 1.1 y la 1.3 se corrigen con la rúbrica del resumen, con los niveles 1 · 0,75 · 0,5 · 0: una respuesta que copia frases del texto baja a 0,5 aunque recoja las ideas. La 1.1 pide dos datos: qué destaca la autora del carácter de Chus Lago y cómo lo hace.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2017"}, "apoyo": ["2017 · El espejo"], "dossier_txt": "Del dossier: nudo 17, ejercicio 11 · 1.1 a 1.3", "texto_titulo": "2017 · El espejo", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El espejo<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El otro día pasó por Madrid la viguesa Chus Lago. Chus es una alpinista y exploradora de élite; fue la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tercera mujer del mundo en subir al Everest sin oxígeno en 1999. Luego, en diciembre de 2008 y enero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de 2009, se pasó dos meses cruzando la Antártida ella sola.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">Cuando estuvo aquí hace un par de semanas volvía de liderar una expedición de cuatro mujeres<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por los lagos helados de Laponia para concienciar sobre el cambio climático. En fin, con todo esto solo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quiero señalar el coraje extraordinario de Chus Lago. Su entereza, su fuerza física y sobre todo su fuerza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">interior. Hace falta ser alguien muy templado para lanzarse a la inmensa, inconcebible soledad helada<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la Antártida, sin posibilidad de contacto humano, y arrostrar eso durante dos meses sin enloquecer.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Llegó a Madrid de paso, pues, repito por tercera vez; quería comprarse algo de ropa y, como somos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">amigas, hicimos eso tan típico de chicas que es ir juntas de tiendas. En una tienda, en fin, nos pusimos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las dos a probarnos las mismas prendas. Nos mirábamos en el enorme espejo que cubría toda una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pared y yo cavilaba, resignada, en lo mucho mejor que le quedaba todo a ella. Tiene quince años menos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que yo y un cuerpo flexible, atlético, precioso, sin un solo átomo de grasa. Después de escrutarnos por<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">delante y por detrás meticulosamente, de subirnos y bajarnos la cinturilla, de tironearnos del jersey y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hacer todos esos tontos movimientos que uno hace cuando se está probando algo, Chus hundió los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hombros, torció el gesto y dijo con genuino desaliento: «¡Jo, no sé, a mí es que me parece que te queda<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo mucho mejor a ti!».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Sus palabras me dejaron atónita. En aquel instante pensé en lo increíblemente errónea que era la<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">percepción que tenía de sí misma, y en la facilidad con la que caemos todos en esa trampa. Esta mujer<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que se ha medido a sí misma hasta la extenuación; esta guerrera capaz de soportar todos los retos,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">soportaba sin embargo mal el abismo imaginario del espejo, la confrontación con el yo ideal inexistente.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hay numerosos estudios sobre esa alteración de nuestra mirada. Recuerdo uno de hace bastantes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años en el que los sujetos, hombres y mujeres, tenían que valorar varios aspectos de su propio físico<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">tales como peso, musculación o altura, y luego los mismos aspectos en otras personas desconocidas a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las que veían a cierta distancia. La gran mayoría se creía comparativamente más gorda, más baja y más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">enclenque y en muchos casos esa apreciación era claramente errónea. De lo que estamos hablando, en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">realidad, es de poder reconocernos a nosotros mismos; de la inseguridad y el aprecio que nos tenemos;<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la capacidad de aceptar la frustración por no poder alcanzar el ideal. Todo esto es la eterna pelea de<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">la vida, nuestro viaje de exploración más importante, y se ve que es más difícil de lograr que atravesar a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">solas la aterradora Antártida. Madre mía, da miedo.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Rosa Montero, <\/em>El País Semanal<em>, 20 de marzo de 2016, tal como la imprimió la prueba de 2017.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "Bloque 1 de 2017: el léxico", "dossier": {"cuaderno": "17", "ejercicio": 11, "parte": "1.4"}, "ayuda": "La pregunta 1.4 de 2017: «Proponga un sinónimo o explique el significado de las siguientes palabras o expresiones. Preste atención a la adecuación de la palabra al contexto en el que se encuentra.» Vale 1 punto.", "items": [{"enun": "<i>cambio climático<\/i> (línea 6)", "modelo": "el conjunto de fenómenos atmosféricos y naturales que ha provocado la subida de temperatura en el planeta"}, {"enun": "<i>muy templado<\/i> (línea 8)", "modelo": "sereno, tranquilo; capaz de actuar con valentía y serenidad"}, {"enun": "<i>escrutarnos<\/i> (línea 14)", "modelo": "analizarnos, observarnos, examinarnos cuidadosamente"}, {"enun": "<i>atónita<\/i> (línea 19)", "modelo": "sorprendida, asombrada"}], "criterio": "Cada palabra vale 0,25; con alguna imprecisión, 0,1. El sinónimo tiene que servir en la frase del texto: <i>alguien muy templado<\/i> es alguien sereno y valiente, no alguien que está a una temperatura media.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2017"}, "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2017 · El espejo"], "dossier_txt": "Del dossier: nudo 17, ejercicio 11 · 1.4", "texto_titulo": "2017 · El espejo", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El espejo<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El otro día pasó por Madrid la viguesa Chus Lago. Chus es una alpinista y exploradora de élite; fue la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tercera mujer del mundo en subir al Everest sin oxígeno en 1999. Luego, en diciembre de 2008 y enero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de 2009, se pasó dos meses cruzando la Antártida ella sola.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">Cuando estuvo aquí hace un par de semanas volvía de liderar una expedición de cuatro mujeres<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por los lagos helados de Laponia para concienciar sobre el cambio climático. En fin, con todo esto solo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quiero señalar el coraje extraordinario de Chus Lago. Su entereza, su fuerza física y sobre todo su fuerza<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">interior. Hace falta ser alguien muy templado para lanzarse a la inmensa, inconcebible soledad helada<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la Antártida, sin posibilidad de contacto humano, y arrostrar eso durante dos meses sin enloquecer.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">Llegó a Madrid de paso, pues, repito por tercera vez; quería comprarse algo de ropa y, como somos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">amigas, hicimos eso tan típico de chicas que es ir juntas de tiendas. En una tienda, en fin, nos pusimos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las dos a probarnos las mismas prendas. Nos mirábamos en el enorme espejo que cubría toda una<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pared y yo cavilaba, resignada, en lo mucho mejor que le quedaba todo a ella. Tiene quince años menos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que yo y un cuerpo flexible, atlético, precioso, sin un solo átomo de grasa. Después de escrutarnos por<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">delante y por detrás meticulosamente, de subirnos y bajarnos la cinturilla, de tironearnos del jersey y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hacer todos esos tontos movimientos que uno hace cuando se está probando algo, Chus hundió los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">hombros, torció el gesto y dijo con genuino desaliento: «¡Jo, no sé, a mí es que me parece que te queda<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">todo mucho mejor a ti!».<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Sus palabras me dejaron atónita. En aquel instante pensé en lo increíblemente errónea que era la<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">percepción que tenía de sí misma, y en la facilidad con la que caemos todos en esa trampa. Esta mujer<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que se ha medido a sí misma hasta la extenuación; esta guerrera capaz de soportar todos los retos,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">soportaba sin embargo mal el abismo imaginario del espejo, la confrontación con el yo ideal inexistente.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Hay numerosos estudios sobre esa alteración de nuestra mirada. Recuerdo uno de hace bastantes<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">años en el que los sujetos, hombres y mujeres, tenían que valorar varios aspectos de su propio físico<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">tales como peso, musculación o altura, y luego los mismos aspectos en otras personas desconocidas a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las que veían a cierta distancia. La gran mayoría se creía comparativamente más gorda, más baja y más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">enclenque y en muchos casos esa apreciación era claramente errónea. De lo que estamos hablando, en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">realidad, es de poder reconocernos a nosotros mismos; de la inseguridad y el aprecio que nos tenemos;<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de la capacidad de aceptar la frustración por no poder alcanzar el ideal. Todo esto es la eterna pelea de<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">la vida, nuestro viaje de exploración más importante, y se ve que es más difícil de lograr que atravesar a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">solas la aterradora Antártida. Madre mía, da miedo.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Rosa Montero, <\/em>El País Semanal<em>, 20 de marzo de 2016, tal como la imprimió la prueba de 2017.<\/em><\/p>"}, {"tipo": "abierta", "titulo": "El cierre: la falsa percepción del propio físico", "dossier": {"cuaderno": "18", "ejercicio": 12}, "ayuda": "El texto ya tiene tesis y argumentos. Escribe solo el cierre: una o dos frases, entre 15 y 20 palabras, con una consecuencia de los dos argumentos y sin repetir la tesis.", "items": [{"enun": "Consigna de 2017, opción A: <i>su opinión sobre los problemas personales que comporta la falsa percepción del propio físico<\/i>. Tesis: <i>la imagen que uno tiene de su propio cuerpo casi nunca coincide con la real<\/i>. Argumentos: <i>quien se cree peor de lo que es evita situaciones que necesita, como una entrevista o una consulta médica<\/i>, y <i>esa distancia entre lo que uno ve y lo que hay se alimenta de comparaciones con cuerpos que no existen fuera de la pantalla<\/i>.", "modelo": "Dos cierres modelo debajo, los de la clave del dossier.", "palabras": {"min": 15, "max": 20}}], "criterio": "El cierre saca una consecuencia de los dos argumentos. Si repite la tesis con las mismas palabras, el corrector lo cuenta como repetición en la banda de variación; si la repite con otras, el texto se queda sin consecuencia y baja la coherencia.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2017"}, "modelos": ["«Por eso, quien se juzga con más justicia deja de perder oportunidades por una imagen que no existe.» (18 palabras)", "«En definitiva, corregir la mirada sobre uno mismo evita perder otra entrevista por una imagen falsa.» (16 palabras)"], "apoyo": ["Nudo 17 · 4 · Seis textos reales, con su bloque 1", "2017 · El espejo"], "dossier_txt": "Del dossier: nudo 18, ejercicio 12", "texto_titulo": "2017 · El espejo", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El espejo<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">El otro día pasó por Madrid la viguesa Chus Lago. Chus es una alpinista y exploradora de élite; fue la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tercera mujer del mundo en subir al Everest sin oxígeno en 1999. Luego, en diciembre de 2008 y enero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de 2009, se pasó dos meses cruzando la Antártida ella sola.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">Cuando estuvo aquí hace un par de semanas volvía de liderar una expedición de cuatro mujeres<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">por los lagos helados de Laponia para concienciar sobre el cambio climático. En fin, con todo esto solo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">quiero señalar el coraje extraordinario de Chu a", "porque": "detalle personal"}, {"enun": "Que un taxi cuesta lo que media jornada", "sol": "no entra", "porque": "es el ejemplo de que no hay transporte de noche, y esa idea ya está dentro"}], "criterio": "Los tres que entran forman una cadena: el horario no encaja, lo que se paga no cubre, y el dato para arreglarlo está partido en tres. Los otros tres son buenos detalles y ninguno es esencial.", "apoyo": ["Nudo 17 · 3 · El resumen", "Nudo 17 · 4 · Seis textos reales, con su bloque 1"], "solo_web": true}, {"tipo": "abierta", "titulo": "El resumen · 10 minutos", "ayuda": "Entre 60 y 80 palabras, con el texto <b>tapado<\/b>. Cuando lo tengas, ábrelo y compáralo con los dos modelos.", "items": [{"enun": "<i>Resuma el texto explicando el problema que plantea y por qué nadie lo resuelve.<\/i>", "modelo": "Un modelo de banda alta y otro de banda baja."}], "modelos": ["<b>≈1,5 · 74 palabras.<\/b> Quienes trabajan en un polígono industrial dependen de una línea de autobús cuyo recorrido y cuyos horarios no coinciden con los turnos, de modo que el trayecto se alarga y al salir de noche no hay servicio. La ayuda que abona la empresa no llega a cubrir el abono. Nadie corrige la situación porque la información necesaria está repartida entre la empresa, el ayuntamiento y la compañía de transporte, y ninguno la tiene completa.", "<b>≈0,5 · 52 palabras.<\/b> <i>El primer autobús al polígono sale a las cinco y media de la mañana y tarda cincuenta minutos en hacer once kilómetros. Marcos lo coge cuatro días a la semana. A mí me parece muy injusto que la empresa solo le pague veinticinco euros. El ayuntamiento sabe cuántos coches entran cada mañana.<\/i><br><br><b>Por qué 0,5:<\/b> dos cadenas copiadas literalmente, una marca de subjetividad, el nombre propio en vez de la idea general, y el cierre deja el problema sin explicar."], "criterio": "Compara los arranques. El bueno empieza por «quienes trabajan en un polígono»; el malo, por «el primer autobús», que es la primera línea del texto. Empezar por la primera línea del original delata, con más seguridad que ninguna otra señal, que no ha habido vaciado.", "remate": "Y el reloj: el resumen se hace en <b>nueve o diez minutos<\/b>. Si tardas veinte, esos diez de más salen del tiempo de escribir el texto largo, donde más falta hacen.", "palabras": {"min": 60, "max": 80}, "apoyo": ["Nudo 17 · 3 · El resumen"], "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartados 3 y 4: El resumen; Seis textos reales, con su bloque 1 (p. 46 y 48) · ejercicio 11 · Nudo 18 · Escribir: el criterio — apartado 6: Las consignas reales (p. 74) · ejercicio 12 · Anexo A-3 · Texto de partida: «Un influencer agrícola» — el cuaderno: el texto de partida de 2026", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El verbo: copulativos y atributo", "meta": "30 minutos · siete de los treinta y dos ítems de función sintáctica", "cuaderno": {"nudo": 10, "apartados": [1], "ejercicios": [1, 2, 3]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> la conjugación <strong>no tiene ejercicio propio<\/strong>. El verbo se estudia igualmente por tres razones que sí tienen puntos detrás: los <strong>copulativos<\/strong> deciden el atributo, que es una de las funciones sintácticas que se preguntan; los <strong>pasados<\/strong> sostienen la opción B de la redacción, la narrativa; y las <strong>interferencias del catalán<\/strong> se descuentan a 0,1 por falta.<\/div>\n<h3>1 · Copulativos y predicativos<\/h3>\n<blockquote>\n<p>La conjugación <strong>no ha caído nunca<\/strong> en dieciséis convocatorias. El verbo se estudia por otras razones, y la de más peso es esta: de los <strong>32 sintagmas<\/strong> que han caído en el ejercicio de función sintáctica, <strong>7 son atributo<\/strong> —la segunda función más frecuente, detrás del complemento directo—, y los siete llevaban <em>ser<\/em> o <em>estar<\/em>.<\/p>\n<\/blockquote>\n<h4>El verbo manda<\/h4>\n<p>Quita el verbo de una oración y no queda oración. Por eso el primer paso es siempre localizarlo: el verbo es el <strong>núcleo del predicado<\/strong>, y todo lo demás se define respecto a él.<\/p>\n<p>Dos clases de verbos:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué hace<\/th>\n<th>qué deja detrás<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>predicativo<\/strong><\/td>\n<td>expresa una acción, un proceso o un estado con contenido propio: <em>apagar, escribir, correr<\/em><\/td>\n<td>complementos: directo, indirecto, circunstancial…<\/td>\n<\/tr>\n<tr>\n<td><strong>copulativo<\/strong><\/td>\n<td>no aporta significado propio; solo une el sujeto con lo que se afirma de él: <strong>ser, estar, parecer<\/strong><\/td>\n<td><strong>atributo<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>La prueba del «lo»<\/h4>\n<blockquote>\n<p>El atributo se sustituye por <strong>lo<\/strong>, siempre, sea cual sea el género y el número.<\/p>\n<p><em>«Los e-books y las tabletas son perfectos»<\/em> → <em>los e-books y las tabletas <\/em><em>lo<\/em><em> son<\/em> ✔ hay atributo.<\/p>\n<\/blockquote>\n<h4>Un aviso: no siempre son copulativos<\/h4>\n<p><strong>Ser y estar.<\/strong> Cuando <em>ser<\/em> significa «ocurrir» o <em>estar<\/em> significa «encontrarse», no hay atributo: hay circunstancial. <em>La reunión es en la sala pequeña<\/em> → <em>la reunión lo es<\/em> no se dice.<\/p>\n<p><strong>Parecer<\/strong> tampoco lo es siempre. En <em>parece que va a llover<\/em> lo que va detrás es una oración que hace de sujeto, no un atributo; y <em>parecerse a<\/em> —<em>se parece a su madre<\/em>— es un verbo pronominal con complemento de régimen. La prueba del <em>lo<\/em> decide: <em>el crío parece cansado<\/em> → <em>lo parece<\/em> ✔; <em>se parece a su madre<\/em> → <em>se lo parece<\/em> ✘.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "¿Tiene atributo?", "dossier": {"cuaderno": "10", "ejercicio": 1}, "ayuda": "Si la oración tiene atributo, escríbelo; si no lo tiene, escribe la función del complemento que va detrás del verbo: circunstancial de lugar o de tiempo. Comprueba cada caso con la prueba del <i>lo<\/i>. Las frases con año son de exámenes oficiales.", "items": [{"enun": "«Los e-books y las tabletas son perfectos»", "conv": "2013", "requiere": [["perfectos"]], "modelo": "perfectos (atributo: <i>lo son<\/i>)"}, {"enun": "«El amor es el motor del universo»", "conv": "2016", "requiere": [["motor"]], "modelo": "el motor del universo (atributo)"}, {"enun": "«Todo esto es la eterna pelea de la vida»", "conv": "2017", "requiere": [["pelea"]], "modelo": "la eterna pelea de la vida (atributo)"}, {"enun": "«Y además es genial no tener que viajar solo»", "conv": "2019", "requiere": [["genial"]], "modelo": "genial (atributo; el sujeto es el infinitivo <i>no tener que viajar solo<\/i>)"}, {"enun": "«Hoy en día son ingenieros»", "conv": "2020", "requiere": [["ingenieros"]], "modelo": "ingenieros (atributo)"}, {"enun": "«La violencia sexista no es un problema de las mujeres»", "conv": "2023", "requiere": [["problema"]], "modelo": "un problema de las mujeres (atributo)"}, {"enun": "Los recibos están en el cajón de la cocina.", "requiere": [["circunstancial"], ["lugar"]], "modelo": "circunstancial de lugar; no hay atributo (<i>están<\/i> significa «se encuentran»; <i>lo están<\/i> no se dice)"}, {"enun": "Mi compañera de turno parece agotada.", "requiere": [["agotada"]], "modelo": "agotada (atributo: <i>lo parece<\/i>)"}, {"enun": "La entrega de llaves será el viernes.", "requiere": [["circunstancial"], ["tiempo"]], "modelo": "circunstancial de tiempo; no hay atributo (<i>será<\/i> significa «tendrá lugar»)"}, {"enun": "El barrio está tranquilo por las noches.", "requiere": [["tranquilo"]], "modelo": "tranquilo (atributo: <i>lo está<\/i>)"}, {"enun": "Ese contrato parece una trampa.", "requiere": [["trampa"]], "modelo": "una trampa (atributo: <i>lo parece<\/i>)"}, {"enun": "La reunión fue en el bar de la esquina.", "requiere": [["circunstancial"], ["lugar"]], "modelo": "circunstancial de lugar; no hay atributo (<i>fue<\/i> significa «tuvo lugar»)"}, {"enun": "El ascensor está estropeado desde el lunes.", "requiere": [["estropeado"]], "modelo": "estropeado (atributo: <i>lo está<\/i>; <i>desde el lunes<\/i> es circunstancial de tiempo)"}], "criterio": "En las seis frases de examen la clave oficial señaló el atributo. <i>Estar<\/i>, <i>ser<\/i> y <i>parecer<\/i> llevan atributo cuando la parte de detrás se sustituye por <i>lo<\/i>: <i>lo parece<\/i>, <i>lo está<\/i>. Cuando <i>ser<\/i> significa «tener lugar» y <i>estar<\/i>, «encontrarse», lo que va detrás es un circunstancial.", "pide": "el atributo, o la función del complemento", "usa_texto": false, "apoyo": ["El verbo manda", "La prueba del «lo»"], "dossier_txt": "Del dossier: nudo 10, ejercicio 1"}, {"tipo": "opcion", "titulo": "¿Copulativo o no?", "dossier": {"cuaderno": "10", "ejercicio": 2}, "ayuda": "Catorce oraciones: doce del dossier y dos añadidas aquí. Aplica la prueba del <i>lo<\/i> e identifica el complemento que va detrás del verbo.", "ops": ["copulativo", "no copulativo"], "items": [{"enun": "Mi hermana es enfermera.", "sol": "copulativo", "porque": "atributo <i>enfermera<\/i>"}, {"enun": "La fiesta de fin de curso fue un éxito.", "sol": "copulativo", "porque": "atributo <i>un éxito<\/i>: <i>lo fue<\/i>"}, {"enun": "La reunión de delegados es en la sala pequeña.", "sol": "no copulativo", "porque": "<i>es<\/i> significa «tiene lugar»; <i>en la sala pequeña<\/i> es circunstancial de lugar"}, {"enun": "El taller está en la otra punta del barrio.", "sol": "no copulativo", "porque": "circunstancial de lugar"}, {"enun": "El crío parece cansado.", "sol": "copulativo", "porque": "atributo <i>cansado<\/i>: <i>lo parece<\/i>"}, {"enun": "Este año la fiesta será en octubre.", "sol": "no copulativo", "porque": "circunstancial de tiempo"}, {"enun": "Su primo es de Badajoz.", "sol": "copulativo", "porque": "atributo <i>de Badajoz<\/i>: <i>lo es<\/i>"}, {"enun": "Estamos a martes.", "sol": "no copulativo", "porque": "<i>a martes<\/i> es un complemento de tiempo: <i>lo estamos<\/i> no se dice"}, {"enun": "Se parece mucho a su padre.", "sol": "no copulativo", "porque": "<i>parecerse a<\/i> es pronominal, y <i>a su padre<\/i> es complemento de régimen"}, {"enun": "Los niños estaban en el patio.", "sol": "no copulativo", "porque": "<i>en el patio<\/i> es circunstancial de lugar"}, {"enun": "Mi abuela era modista.", "sol": "copulativo", "porque": "atributo <i>modista<\/i>: <i>lo era<\/i>"}, {"enun": "La nueva encargada parece seria.", "sol": "copulativo", "porque": "atributo <i>seria<\/i>: <i>lo parece<\/i>"}, {"enun": "El médico estuvo aquí ayer.", "sol": "no copulativo", "porque": "<i>estuvo<\/i> significa «se encontró»; <i>aquí<\/i> y <i>ayer<\/i> son circunstanciales"}, {"enun": "Después de la mudanza estábamos agotados.", "sol": "copulativo", "porque": "atributo <i>agotados<\/i>: <i>lo estábamos<\/i>"}], "criterio": "El verbo es copulativo cuando lo de detrás se cambia por <i>lo<\/i>: <i>Mi hermana es enfermera<\/i>, <i>lo es<\/i>. <i>Es en la sala pequeña<\/i> y <i>está en la otra punta del barrio<\/i> no admiten el cambio, porque ahí <i>ser<\/i> significa «tener lugar» y <i>estar<\/i>, «encontrarse». <i>Se parece a su padre<\/i> tampoco: <i>parecerse a<\/i> es otro verbo, con complemento de régimen.", "usa_texto": false, "apoyo": ["El verbo manda", "Un aviso: no siempre son copulativos"], "dossier_txt": "Del dossier: nudo 10, ejercicio 2"}, {"tipo": "hueco", "titulo": "¿Falta o no? Corrige la que la tenga", "dossier": {"cuaderno": "10", "ejercicio": 3}, "ayuda": "Escribe la parte en negrita corregida; si está bien, escríbela igual. Tres de las diez están bien.", "estricto": true, "items": [{"enun": "En la reunión <b>habían<\/b> más de treinta personas.", "sol": "había", "porque": "falta: <i>haber<\/i> impersonal no tiene plural", "corto": false}, {"enun": "<b>Hubieron<\/b> muchas dudas al final.", "sol": "Hubo", "porque": "falta: <i>haber<\/i> impersonal no tiene plural", "corto": false}, {"enun": "Si <b>hubieran<\/b> problemas, avísame.", "sol": "hubiera", "porque": "falta: <i>haber<\/i> impersonal no tiene plural", "corto": false}, {"enun": "<b>Han habido<\/b> tres cambios de horario.", "sol": "Ha habido", "porque": "falta: tampoco en los tiempos compuestos", "corto": false}, {"enun": "Siempre <b>hubo<\/b> gente que ayudaba.", "sol": "hubo", "porque": "correcta: <i>hubo<\/i> en singular", "corto": false}, {"enun": "<b>Habían<\/b> pasado dos horas cuando llegó.", "sol": "Habían", "porque": "correcta: aquí <i>haber<\/i> es auxiliar de <i>pasar<\/i>, y <i>dos horas<\/i> es el sujeto", "corto": false}, {"enun": "<b>Hubieron<\/b> de marcharse antes de tiempo.", "sol": "Hubieron", "porque": "correcta: <i>haber de<\/i> + infinitivo es una perífrasis, y concuerda con su sujeto", "corto": false}, {"enun": "En el barrio <b>habían<\/b> muchos bares.", "sol": "había", "porque": "falta: <i>haber<\/i> impersonal no tiene plural", "corto": false}, {"enun": "<b>Habrán<\/b> unas cincuenta personas en la sala.", "sol": "Habrá", "porque": "falta: <i>haber<\/i> impersonal no tiene plural", "corto": false}, {"enun": "<b>Han habido<\/b> quejas de los vecinos.", "sol": "Ha habido", "porque": "falta: tampoco en los tiempos compuestos", "corto": false}], "criterio": "<i>Haber<\/i> impersonal no concuerda con nada, porque lo que lo sigue es su complemento directo: <i>había más de treinta personas<\/i>, <i>ha habido tres cambios<\/i>. Concuerda cuando es auxiliar (<i>habían pasado dos horas<\/i>) y en la perífrasis <i>haber de<\/i> + infinitivo (<i>hubieron de marcharse<\/i>).", "usa_texto": false, "apoyo": ["Un aviso: no siempre son copulativos"], "dossier_txt": "Del dossier: nudo 10, ejercicio 3"}, {"tipo": "opcion", "titulo": "¿Hay atributo?", "ayuda": "Aplica la prueba del <i>lo<\/i>: sustituye la parte en negrita por <i>lo<\/i> y comprueba si la frase se sostiene.", "ops": ["hay atributo", "no hay atributo"], "items": [{"enun": "El encargado parece <b>cansado<\/b>.", "sol": "hay atributo"}, {"enun": "Está <b>en el almacén<\/b> desde las siete.", "sol": "no hay atributo", "porque": "<i>estar<\/i> aquí significa «encontrarse»"}, {"enun": "Los plazos eran <b>imposibles<\/b>.", "sol": "hay atributo"}, {"enun": "El café está <b>frío<\/b> otra vez.", "sol": "hay atributo", "porque": "<i>lo está<\/i> ✔"}, {"enun": "El taller abre <b>a las ocho<\/b>.", "sol": "no hay atributo", "porque": "<i>abrir<\/i> es predicativo: no puede llevar atributo"}, {"enun": "La oficina está <b>en el segundo piso<\/b>.", "sol": "no hay atributo", "porque": "<i>estar<\/i> significa aquí «encontrarse»: <i>la oficina lo está<\/i> no se dice"}], "criterio": "Las tres que no lo tienen fallan por dos motivos distintos: dos porque el verbo es <i>ser<\/i> o <i>estar<\/i> con otro significado, y una porque el verbo no es copulativo. La prueba del <i>lo<\/i> resuelve los tres casos sin tener que decidir cuál es cuál.", "apoyo": ["La prueba del «lo»"], "solo_web": true}, {"tipo": "hueco", "titulo": "Haber impersonal", "estricto": true, "ayuda": "Escribe la forma del verbo. Atención al plural.", "items": [{"enun": "El año pasado ______ muchas quejas. <i>(haber)<\/i>", "sol": "hubo", "porque": "nunca <i>hubieron<\/i>: lo que viene detrás es complemento directo"}, {"enun": "Antes ______ dos panaderías en la calle. <i>(haber, imperfecto)<\/i>", "sol": "había", "porque": "nunca <i>habían<\/i>"}, {"enun": "Mañana ______ tres reuniones. <i>(haber, futuro)<\/i>", "sol": "habrá"}, {"enun": "Los vecinos ______ presentado dos escritos. <i>(haber, presente)<\/i>", "sol": "han", "porque": "aquí <i>haber<\/i> no es impersonal: es auxiliar y sí concuerda"}], "criterio": "<i>Hubo<\/i>, <i>había<\/i> y <i>habrá<\/i> son <i>haber<\/i> con el significado de «existir», y ahí no hay plural nunca. <i>Han presentado<\/i> pertenece a otro caso: <i>haber<\/i> como auxiliar de un tiempo compuesto, que sí concuerda con el sujeto.<br><br>Se distinguen por el participio: si detrás viene uno, <i>haber<\/i> funciona como auxiliar.", "apoyo": ["1 · Copulativos y predicativos"], "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Qué función hace la parte en negrita?", "ayuda": "Las tres funciones que ya se pueden decidir con lo de hoy.", "ops": ["atributo", "complemento directo", "circunstancial"], "items": [{"enun": "La cosecha fue <b>escasa<\/b>.", "sol": "atributo"}, {"enun": "El acuerdo parecía <b>razonable<\/b>.", "sol": "atributo"}, {"enun": "Trabaja <b>en el turno de noche<\/b>.", "sol": "circunstancial"}, {"enun": "Presentó <b>dos escritos<\/b>.", "sol": "complemento directo", "porque": "<i>los presentó<\/i> ✔"}, {"enun": "La asamblea es <b>el jueves<\/b>.", "sol": "circunstancial", "porque": "<i>ser<\/i> con el significado de «ocurrir»"}, {"enun": "Siempre hubo <b>hombres buenos y tipejos<\/b>.", "conv": "2023", "sol": "complemento directo", "porque": "lo establece la clave oficial: <i>haber<\/i> impersonal"}], "criterio": "La sintaxis entera llega en el segundo trimestre. Hoy se llevan dos pruebas: el atributo se cambia por <b>lo<\/b>, y el complemento directo por <b>lo, la, los, las<\/b>. Con esas dos ya se resuelven veinte de los treinta y dos ítems que han caído.", "apoyo": ["1 · Copulativos y predicativos"], "solo_web": true}], "cuaderno_txt": "Nudo 10 · El verbo — apartado 1: Copulativos y predicativos (p. 127) · ejercicios 1, 2 y 3", "teoria_dossier": true}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras y frases marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:

(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */

  function el(t, cls, txt) {

    if (cls) n.className = cls;
