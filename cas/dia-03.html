<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 3 · 1 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 3, "fecha": "2026-10-01", "tab": "Día 3 · 1 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 3", "h1": "Jueves 1 de octubre", "sub": "Cuándo se pone la tilde · lo que vale cada apartado de la redacción · el género del sustantivo", "carriles": [{"chapa": "Carril A", "titulo": "Cuándo se pone la tilde", "meta": "30 minutos · hoy se escribe la respuesta entera", "cuaderno": {"nudo": 1, "apartados": [2], "ejercicios": [4, 5, 6]}, "teoria": "<h3>2 · Las tres reglas<\/h3>\n<h4>Cuándo se escribe la tilde<\/h4>\n<p>Casi todas las palabras del castellano son llanas acabadas en vocal —<em>casa<\/em>, <em>mesa<\/em>, <em>libro<\/em>, <em>pistacho<\/em>— o agudas acabadas en consonante distinta de -n y -s —<em>reloj<\/em>, <em>papel<\/em>, <em>comer<\/em>, <em>ciudad<\/em>—, y esas dos formas no llevan tilde. La tilde se escribe cuando la palabra se aparta de ellas: una aguda acabada en vocal, en -n o en -s (<em>ojalá<\/em>, <em>canción<\/em>, <em>después<\/em>), una llana acabada en consonante distinta de -n y -s (<em>fácil<\/em>) y, siempre, las esdrújulas. La tercera columna de la tabla es la frase que se escribe en la prueba, copiada de las respuestas oficiales.<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>lleva tilde cuando…<\/th>\n<th>lo que escribes en la prueba<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>aguda<\/strong><\/td>\n<td>acaba en <strong>vocal, -n o -s<\/strong><\/td>\n<td>«es una palabra aguda acabada en -n» (o «en -s», o «en vocal», según la palabra)<\/td>\n<\/tr>\n<tr>\n<td><strong>llana<\/strong><\/td>\n<td>acaba en <strong>cualquier consonante que no sea -n ni -s<\/strong><\/td>\n<td>«es una palabra llana acabada en una consonante que no es -n ni -s»<\/td>\n<\/tr>\n<tr>\n<td><strong>esdrújula<\/strong> y <strong>sobreesdrújula<\/strong><\/td>\n<td><strong>siempre<\/strong><\/td>\n<td>«es una palabra esdrújula, y todas las esdrújulas llevan tilde»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>La respuesta tiene dos mitades: la clase y la terminación.<\/strong> «Es aguda» indica la clase pero no por qué lleva tilde; «acaba en -n» indica la terminación pero no la clase. Las claves oficiales dan siempre las dos, y una sola no explica la tilde: los 0,25 puntos del apartado se dan enteros o no se dan.<\/p>\n<\/blockquote>\n<h4>Las excepciones<\/h4>\n<p>Son siete casos.<\/p>\n<table>\n<thead>\n<tr>\n<th>caso<\/th>\n<th>qué pasa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>aguda acabada en <strong>consonante + s<\/strong><\/td>\n<td>no lleva<\/td>\n<td><em>complots<\/em>, <em>robots<\/em><\/td>\n<\/tr>\n<tr>\n<td>aguda acabada en <strong>-y<\/strong><\/td>\n<td>no lleva: la <em>-y<\/em> final suena a vocal pero cuenta como consonante<\/td>\n<td><em>virrey<\/em>, <em>convoy<\/em>, <em>estoy<\/em><\/td>\n<\/tr>\n<tr>\n<td>llana acabada en <strong>consonante + s<\/strong> o en <strong>-y<\/strong><\/td>\n<td>sí lleva<\/td>\n<td><em>bíceps<\/em>, <em>cómics<\/em>, <em>yóquey<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>mayúsculas<\/strong><\/td>\n<td>llevan tilde igual<\/td>\n<td>ÁFRICA, ÚLTIMO<\/td>\n<\/tr>\n<tr>\n<td>adverbios en <strong>-mente<\/strong><\/td>\n<td>conservan la tilde del adjetivo del que proceden, porque tienen dos sílabas tónicas (<em>fá-cil-MEN-te<\/em>) y no siguen la regla general<\/td>\n<td><em>fácil<\/em> → <em>fácilmente<\/em> · <em>tierna<\/em> → <em>tiernamente<\/em>, sin tilde, porque <em>tierna<\/em> no la tiene<\/td>\n<\/tr>\n<tr>\n<td><strong>compuestos sin guion<\/strong><\/td>\n<td>se acentúan como una sola palabra, por las reglas generales: la primera parte pierde la tilde que tuviera suelta y la última la lleva o no según la palabra nueva (<em>balón<\/em> + <em>pie<\/em> → <em>balompié<\/em>)<\/td>\n<td><em>kilómetros<\/em> → <em>cuentakilómetros<\/em> · <em>décimo<\/em> + <em>séptimo<\/em> → <em>decimoséptimo<\/em> · <em>así<\/em> + <em>mismo<\/em> → <em>asimismo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>compuestos con guion<\/strong><\/td>\n<td>cada parte conserva la tilde que le toque por su cuenta, porque el guion las mantiene como dos palabras<\/td>\n<td><em>físico-químico<\/em>, <em>teórico-práctico<\/em>, <em>astur-leonés<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y una que ya no está en vigor pero sigue apareciendo: <strong>la conjunción <em>o<\/em> entre cifras no lleva tilde<\/strong>. Se escribe «13 o 14». El texto oficial de la convocatoria de 2022 todavía imprime «con 13 ó 14 años»; que aparezca en un examen no la hace correcta.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "Trece de reglas generales", "ayuda": "Los trece proceden de exámenes reales. La respuesta completa lleva <b>dos datos<\/b>: la clase de palabra y la terminación.", "items": [{"palabra": "<i>está<\/i>", "conv": "2011", "requiere": [["aguda"], ["vocal", "en a"]], "modelo": "palabra aguda acabada en vocal"}, {"palabra": "<i>popularización<\/i>", "conv": "2013", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal más -n"}, {"palabra": "<i>emigración<\/i>", "conv": "2015", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal más -n"}, {"palabra": "<i>también<\/i>", "conv": "2016", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal más -n"}, {"palabra": "<i>formación<\/i>", "conv": "2018", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal seguida de -n"}, {"palabra": "<i>celebración<\/i>", "conv": "2020", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal más -n"}, {"palabra": "<i>fermentación<\/i>", "conv": "2021", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "aguda acabada en vocal más sto con guion, cada parte conserva la suya"}, {"enun": "<i>teorico-practico<\/i>", "sol": "teórico-práctico", "porque": "con dos tildes: cada parte conserva la suya"}, {"enun": "<i>historico-critico<\/i>", "sol": "histórico-crítico", "porque": "con dos tildes: cada parte conserva la suya"}, {"enun": "<i>astur-leones<\/i>", "sol": "astur-leonés", "porque": "con una tilde: <i>leonés<\/i> es aguda acabada en -s y la lleva; <i>astur<\/i> es aguda acabada en -r y no"}], "criterio": "En las cinco familias la regla general no basta: la consonante + s cuenta como consonante, de modo que la llana la lleva (<i>bíceps<\/i>) y la aguda no (<i>complots<\/i>); la -y final también cuenta como consonante; el adverbio en -mente conserva la tilde del adjetivo cuando el adjetivo la tiene; en el compuesto sin guion manda la segunda parte, y con guion cada parte conserva la suya.", "apoyo": ["2 · Las tres reglas", "Cuándo se escribe la tilde"], "dossier_txt": "Del dossier: nudo 1, ejercicio 5 · la grafía"}, {"tipo": "clasificar", "titulo": "¿Qué regla o excepción lo decide?", "dossier": {"cuaderno": "1", "ejercicio": 5, "parte": "la regla"}, "ayuda": "Las mismas veintitrés, ya escritas bien. Indica cuál de las cinco familias decide la tilde.", "ops": ["aguda o llana acabada en consonante + s", "palabra acabada en -y", "adverbio en -mente", "compuesto sin guion", "compuesto con guion"], "items": [{"enun": "<i>virrey<\/i>", "sol": "palabra acabada en -y", "porque": "sin tilde: aguda acabada en -y"}, {"enun": "<i>bíceps<\/i>", "sol": "aguda o llana acabada en consonante + s", "porque": "con tilde: llana acabada en consonante + s"}, {"enun": "<i>complots<\/i>", "sol": "aguda o llana acabada en consonante + s", "porque": "sin tilde: aguda acabada en consonante + s"}, {"enun": "<i>fórceps<\/i>", "sol": "aguda o llana acabada en consonante + s", "porque": "con tilde: llana acabada en consonante + s"}, {"enun": "<i>convoy<\/i>", "sol": "palabra acabada en -y", "porque": "sin tilde: aguda acabada en -y"}, {"enun": "<i>comúnmente<\/i>", "sol": "adverbio en -mente", "porque": "con tilde: la conserva de <i>común<\/i>"}, {"enun": "<i>yóquey<\/i>", "sol": "palabra acabada en -y", "porque": "con tilde: llana acabada en -y"}, {"enun": "<i>robots<\/i>", "sol": "aguda o llana acabada en consonante + s", "porque": "sin tilde: aguda acabada en consonante + s"}, {"enun": "<i>estoy<\/i>", "sol": "palabra acabada en -y", "porque": "sin tilde: aguda acabada en -y"}, {"enun": "<i>tiovivo<\/i>", "sol": "compuesto sin guion", "porque": "sin tilde: <i>tío<\/i> pierde la suya y <i>vivo<\/i> no la lleva"}, {"enun": "<i>rápidamente<\/i>", "sol": "adverbio en -mente", "porque": "con tilde: la conserva de <i>rápida<\/i>"}, {"enun": "<i>decimoséptimo<\/i>", "sol": "compuesto sin guion", "porque": "con tilde: compuesto sin guion, esdrújula, y <i>décimo<\/i> pierde la suya"}, {"enun": "<i>tiernamente<\/i>", "sol": "adverbio en -mente", "porque": "sin tilde: <i>tierna<\/i> no la lleva"}, {"enun": "<i>físico-químico<\/i>", "sol": "compuesto con guion", "porque": "con dos tildes: compuesto con guion, cada parte conserva la suya"}, {"enun": "<i>cómics<\/i>", "sol": "aguda o llana acabada en consonante + s", "porque": "con tilde: llana acabada en consonante + s"}, {"enun": "<i>fácilmente<\/i>", "sol": "adverbio en -mente", "porque": "con tilde: la conserva de <i>fácil<\/i>"}, {"enun": "<i>cortésmente<\/i>", "sol": "adverbio en -mente", "porque": "con tilde: la conserva de <i>cortés<\/i>"}, {"enun": "<i>asimismo<\/i>", "sol": "compuesto sin guion", "porque": "sin tilde: compuesto sin guion, <i>así<\/i> pierde la suya y <i>mismo<\/i> no la lleva"}, {"enun": "<i>cuentakilómetros<\/i>", "sol": "compuesto sin guion", "porque": "con tilde: la lleva porque <i>kilómetros<\/i> la lleva"}, {"enun": "<i>astur-leonés<\/i>", "sol": "compuesto con guion", "porque": "con una tilde: <i>leonés<\/i> es aguda acabada en -s y la lleva; <i>astur<\/i> es aguda acabada en -r y no"}, {"enun": "<i>amablemente<\/i>", "sol": "adverbio en -mente", "porque": "sin tilde: <i>amable<\/i> no la lleva"}, {"enun": "<i>teórico-práctico<\/i>", "sol": "compuesto con guion", "porque": "con dos tildes: cada parte conserva la suya"}, {"enun": "<i>histórico-crítico<\/i>", "sol": "compuesto con guion", "porque": "con dos tildes: cada parte conserva la suya"}], "apoyo": ["Las excepciones"], "dossier_txt": "Del dossier: nudo 1, ejercicio 5 · la regla"}, {"tipo": "hueco", "titulo": "Mayúsculas", "ayuda": "Escríbelas en mayúscula. Las cuatro del dossier —<i>África<\/i>, <i>Ángel<\/i>, <i>último<\/i> y <i>éxito<\/i>— van con cuatro más que no llevan tilde: en mayúscula se aplica la misma regla que en minúscula.", "items": [{"enun": "africa", "sol": "ÁFRICA", "estricto": true}, {"enun": "joven", "sol": "JOVEN", "estricto": true}, {"enun": "ultimo", "sol": "ÚLTIMO", "estricto": true}, {"enun": "examen", "sol": "EXAMEN", "estricto": true}, {"enun": "angel", "sol": "ÁNGEL", "estricto": true}, {"enun": "bilbao", "sol": "BILBAO", "estricto": true}, {"enun": "exito", "sol": "ÉXITO", "estricto": true}, {"enun": "carmen", "sol": "CARMEN", "estricto": true}], "criterio": "Cuatro llevan tilde y cuatro no, por la misma regla que en minúscula: <i>África<\/i>, <i>último<\/i> y <i>éxito<\/i> son esdrújulas, y <i>Ángel<\/i> es llana acabada en -l. <i>Joven<\/i>, <i>examen<\/i> y <i>Carmen<\/i> son llanas acabadas en -n, y <i>Bilbao<\/i> es llana acabada en vocal.<br><br>La mayúscula no quita la tilde.", "estricto": true, "apoyo": "todo", "dossier": {"cuaderno": "1", "ejercicio": 6}, "dossier_txt": "Del dossier: nudo 1, ejercicio 6"}, {"tipo": "opcion", "titulo": "Antes de la regla: ¿forma frecuente o no?", "ayuda": "Sin pensar todavía en la tilde. Las formas frecuentes son <b>llana acabada en vocal<\/b> y <b>aguda acabada en consonante<\/b>. Todo lo demás se aparta de ellas.", "ops": ["forma frecuente", "se aparta de la forma frecuente"], "items": [{"enun": "<i>diálogo<\/i> — esdrújula", "sol": "se aparta de la forma frecuente", "porque": "la fuerza en la antepenúltima se aparta siempre de las dos formas frecuentes: todas las esdrújulas llevan tilde"}, {"enun": "<i>ventana<\/i> — llana, acaba en vocal", "sol": "forma frecuente", "porque": "y por eso no lleva tilde"}, {"enun": "<i>reloj<\/i> — aguda, acaba en consonante", "sol": "forma frecuente", "porque": "no lleva tilde"}, {"enun": "<i>ojalá<\/i> — aguda, acaba en vocal", "sol": "se aparta de la forma frecuente", "porque": "una aguda acabada en vocal no es lo esperable: se avisa con tilde"}, {"enun": "<i>fácil<\/i> — llana, acaba en consonante", "sol": "se aparta de la forma frecuente", "porque": "lleva tilde"}, {"enun": "<i>examen<\/i> — llana, acaba en -n", "sol": "forma frecuente", "porque": "y por eso no lleva tilde"}], "criterio": "Las tres reglas aplican <b>una sola idea<\/b> a las tres clases de palabra. La tilde señala que la fuerza cae donde no se esperaba; cuando cae en la forma frecuente, no se escribe.", "apoyo": ["Cuándo se escribe la tilde"], "solo_web": true}], "cuaderno_txt": "Nudo 1 · La sílaba y el acento — apartado 2: Las tres reglas (p. 5) · ejercicios 4, 5 y 6", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Qué se corrige en un texto", "meta": "25 minutos · los seis apartados, y los dos que se cuentan", "cuaderno": {"nudo": 18, "apartados": [1, 6], "ejercicios": [9]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> el bloque 3, <strong>3 puntos<\/strong>, unas cien palabras eligiendo entre dos temas. La <strong>opción A ha sido siempre argumentativa<\/strong>; la <strong>B, narrativa<\/strong>, salvo en 2017, que fue expositiva: manda el enunciado, y hay que leerlo. Y siempre <strong>anclada al texto de partida<\/strong> que acabas de leer.<\/div>\n<blockquote>\n<p>La hoja con la que se puntúa todo esto es el <strong>anexo A-1<\/strong>. Tenla delante desde el primer texto.<\/p>\n<\/blockquote>\n<h3>1 · Cómo se corrige la redacción<\/h3>\n<p>Un texto argumentativo se evalúa por <strong>seis apartados<\/strong>. Los nombres proceden de la hoja de quien corrige, pero <strong>el reparto de puntos no viene impreso en el examen<\/strong>, y sin ese reparto no se puede decidir dónde emplear el tiempo. Lo que sigue explica qué mira cada apartado, en qué se nota y cuánto vale.<\/p>\n<p><strong>Los puntos, uno a uno<\/strong>, de mayor a menor peso y no en el orden en que la hoja los enumera:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th style=\"text-align: right;\">vale<\/th>\n<th>qué mira<\/th>\n<th>en qué se nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>c) Corrección<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>1,00<\/strong><\/td>\n<td>las palabras<\/td>\n<td>ortografía, formas verbales, preposiciones, y que cada palabra signifique lo que quieres decir. Un tercio de la nota de la redacción<\/td>\n<\/tr>\n<tr>\n<td><strong>b) Cohesión<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>0,75<\/strong><\/td>\n<td>las oraciones<\/td>\n<td>dónde termina cada una, si el verbo concuerda con el sujeto, si se entiende quién hace qué<\/td>\n<\/tr>\n<tr>\n<td><strong>a) Coherencia<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>0,50<\/strong><\/td>\n<td>las ideas<\/td>\n<td>que estén seleccionadas y en orden, y que el cierre no abra un tema nuevo<\/td>\n<\/tr>\n<tr>\n<td>d) Variación<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el vocabulario y la sintaxis<\/td>\n<td>recursos sintácticos variados, léxico preciso y sin repeticiones; la medida de clase: la misma palabra cuatro veces en cien palabras ya cuenta como repetición<\/td>\n<\/tr>\n<tr>\n<td>e) Registro<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el tono<\/td>\n<td>que se note que es un escrito y no una conversación: formalidad y canal adecuados<\/td>\n<\/tr>\n<tr>\n<td>f) Disposición<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<td>el folio<\/td>\n<td>márgenes, renglones, letra que se lea<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td style=\"text-align: right;\"><strong>3,00<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las dos bandas que se cuentan por errores tienen los tramos de los criterios oficiales de 2026; con esta tabla se puntúan los nueve modelos del apartado 5 y los textos propios con la hoja A-1:<\/p>\n<table>\n<thead>\n<tr>\n<th>banda<\/th>\n<th>errores<\/th>\n<th style=\"text-align: right;\">puntos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>b) Cohesión<\/strong><\/td>\n<td>de 0 a 2<\/td>\n<td style=\"text-align: right;\">0,75<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3 o 4<\/td>\n<td style=\"text-align: right;\">0,5<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>5 o 6<\/td>\n<td style=\"text-align: right;\">0,25<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>más de 6<\/td>\n<td style=\"text-align: right;\">0<\/td>\n<\/tr>\n<tr>\n<td><strong>c) Corrección<\/strong><\/td>\n<td>de 0 a 3<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>4 o 5<\/td>\n<td style=\"text-align: right;\">0,8<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>6 o 7<\/td>\n<td style=\"text-align: right;\">0,6<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>8 o 9<\/td>\n<td style=\"text-align: right;\">0,4<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>10 u 11<\/td>\n<td style=\"text-align: right;\">0,2<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>más de 11<\/td>\n<td style=\"text-align: right;\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los dos primeros errores de cohesión y los tres primeros de corrección no bajan la banda; a partir de ahí, cada dos errores bajan un tramo.<\/p>\n<p><strong>Y los tres ceros<\/strong>, que van antes que la suma:<\/p>\n<ul>\n<li><strong>no se adapta al enunciado → 0<\/strong>;<\/li>\n<li><strong>menos de cincuenta palabras → 0<\/strong>;<\/li>\n<li>si es muy breve, <strong>cada apartado se prorratea<\/strong> por la extensión.<\/li>\n<\/ul>\n<p><strong>Antes de mirar cómo está escrito un texto, el corrector mira si es el texto que se pedía.<\/strong> Tres criterios lo deciden, y los tres se comprueban con el enunciado delante:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>cuándo falla<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tipo<\/strong><\/td>\n<td>te piden defender una opinión y cuentas una historia, o al revés<\/td>\n<\/tr>\n<tr>\n<td><strong>tema<\/strong><\/td>\n<td>escribes sobre otro tema, o sobre uno parecido pero no el que pedía el enunciado<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>te quedas muy por debajo de lo que se pide<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un texto que falla en una de las tres <strong>no responde al encargo<\/strong>, y entonces no hay nada que valorar en él: por bien escrito que esté, contesta a otra pregunta. El enunciado pide <strong>unas cien palabras<\/strong>, y los criterios oficiales prorratean el texto «muy breve» sin fijar una cifra. En clase la cifra es ochenta: por debajo, un argumentativo no tiene sitio para una tesis, dos razones desarrolladas y un cierre. Por debajo de cincuenta, cero.<\/p>\n<p><strong>El tema lo fija el enunciado a partir del texto de partida.<\/strong> Para cumplir el criterio de tema basta con escribir sobre ese tema: la redacción no tiene que citar el texto ni resumirlo.<\/p>\n<p><strong>Dos consecuencias de esa tabla:<\/strong><\/p>\n<ol>\n<li><strong>Corrección y cohesión suman 1,75 de 3.<\/strong> Casi el 60 % de la redacción depende de la ortografía, la puntuación y la concordancia: exactamente lo que entrenan los nudos 1-4 y el videojuego de acentuación. Con más de once faltas, la banda de corrección vale 0: un texto bien pensado, con doce faltas de ortografía, pierde por las palabras lo que había ganado con las ideas.<\/li>\n<li><strong>Los tres cuartos de punto de abajo —variación, registro, disposición— exigen menos tiempo que las otras tres bandas.<\/strong> No piden saber más gramática: piden releer, no repetir la misma palabra cuatro veces y escribir con márgenes y con letra que se lea.<\/li>\n<\/ol>\n<h3>6 · Las consignas reales<\/h3>\n<p>Los enunciados del bloque 3 de seis convocatorias, literales. Todos empiezan igual: «Elija UNA de las dos opciones siguientes y desarróllela en unas cien palabras». En las seis la opción A es un argumentativo; la B es un narrativo, salvo en 2017, que fue un expositivo. Los ejercicios 9 a 14 trabajan sobre ellos, una parte del texto cada vez, y los textos de partida de esas convocatorias están en el nudo 17, apartado 4.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>opción A<\/th>\n<th>opción B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>2014<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la violencia en los juegos infantiles.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con la fantasía y la imaginación en la infancia.<\/td>\n<\/tr>\n<tr>\n<td><strong>2015<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre las ventajas y los inconvenientes de la vida en pueblos o pequeños núcleos de población.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el estrés de la vida en la gran ciudad.<\/td>\n<\/tr>\n<tr>\n<td><strong>2016<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre la importancia de la lectura y la escritura en la educación.<\/td>\n<td>Redacte un texto narrativo en el que explique una anécdota relacionada con el amor.<\/td>\n<\/tr>\n<tr>\n<td><strong>2017<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los problemas personales que comporta la falsa percepción del propio físico.<\/td>\n<td>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración.<\/td>\n<\/tr>\n<tr>\n<td><strong>2018<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los temas sociales que preocupan a los jóvenes actuales.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o novela ambientada en un mundo futuro.<\/td>\n<\/tr>\n<tr>\n<td><strong>2019<\/strong><\/td>\n<td>Redacte un texto argumentativo en el que exponga su opinión sobre los niños prodigio en la música, el cine o la danza.<\/td>\n<td>Redacte un texto narrativo en el que explique alguna película o anécdota relacionada con la música.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En las seis, el tema de la opción A sale del texto de partida: la violencia de los cuentos, la aldea que se vacía, la escritura en la educación, la imagen del propio cuerpo, las preocupaciones de la generación K, los hermanos pianistas. El corrector espera que se note.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Los dos enunciados de 2014", "dossier": {"cuaderno": "18", "ejercicio": 9}, "ayuda": "Los dos enunciados de 2014 están en la tabla del apartado 6, «Las consignas reales». Para cada opción, indica el tipo de texto, el tema y la extensión que exige, y escribe cuál de las dos elegirías y por qué.", "items": [{"enun": "Opción A: el tipo de texto, el tema y la extensión que exige.", "modelo": "Texto <b>argumentativo<\/b>; tema, <b>la violencia en los juegos infantiles<\/b>; extensión, <b>unas cien palabras<\/b>."}, {"enun": "Opción B: el tipo de texto, el tema y la extensión que exige.", "modelo": "Texto <b>narrativo<\/b>; tema, <b>una anécdota sobre la fantasía y la imaginación en la infancia<\/b>; la misma extensión, unas cien palabras."}, {"enun": "¿Cuál de las dos elegirías, y por qué?", "modelo": "Respuesta abierta. Se elige la opción para la que ya se tienen las partes: dos razones que se puedan explicar en la A, o una anécdota con principio y final en la B. Quien elige la A porque «parece más seria» y luego no tiene segunda razón escribe la tesis dos veces."}], "apoyo": ["6 · Las consignas reales"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 9"}, {"tipo": "hueco", "titulo": "El texto del día: ¿en qué línea?", "estricto": true, "ayuda": "Escribe el número de la línea donde empieza la respuesta. Si ocupa dos líneas, vale cualquiera de las dos.", "items": [{"enun": "¿Hasta qué hora trabajaba Iván?", "sol": "8"}, {"enun": "¿Qué prueba permitió comparar el estado de la prenda?", "sol": "3|4|5"}, {"enun": "¿Qué le faltaba al cartel del mostrador?", "sol": "11|12"}], "criterio": "Se admite cualquiera de las líneas que ocupa el dato. Antes de contestar, lee la oración entera: el número de línea solo indica dónde mirar.", "apoyo_html": "<p><b>Localizar.<\/b> Lee las preguntas antes de volver al texto y anota junto a cada una el número de la línea donde <b>empieza<\/b> la respuesta. Si el dato ocupa dos líneas, vale cualquiera de las dos. Después lee la oración entera: el número solo indica dónde mirar.<\/p><p>Localizar corresponde a la pasada 3 de la lectura de examen: primero se lee entero, después se leen las preguntas, y al final se vuelve al texto a buscar.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico del texto", "ayuda": "Cuatro palabras del texto. Lee la oración entera donde está cada una antes de decidir.", "items": [{"enun": "<b>resguardo<\/b> <i>(línea 2)<\/i>", "ops": ["funda que protege la ropa", "papel que acredita la entrega de la prenda", "descuento por adelantado"], "sol": "papel que acredita la entrega de la prenda"}, {"enun": "<b>incidencia<\/b> <i>(línea 9)<\/i>", "ops": ["problema surgido en el servicio", "número de clientes", "aumento de precio"], "sol": "problema surgido en el servicio"}, {"enun": "<b>pendiente<\/b> <i>(línea 19)<\/i>", "ops": ["colgado de la percha", "inclinado", "todavía sin resolver"], "sol": "todavía sin resolver", "porque": "aquí no significa ni la joya ni la cuesta: significa lo que falta por decidir"}, {"enun": "<b>compromisos<\/b> <i>(línea 22)<\/i>", "ops": ["reuniones de trabajo", "obligaciones que alguien ha aceptado", "situaciones difíciles"], "sol": "obligaciones que alguien ha aceptado"}], "criterio": "Aquí se elige entre tres opciones para practicar la comprobación en contexto; en el examen se escribe el significado o un sinónimo que encaje en la oración.", "apoyo_html": "<p><b>Léxico.<\/b> En el examen la pregunta no da opciones —«proponga un sinónimo o explique el significado, atendiendo al contexto»— y vale 0,25 por palabra. Lee la oración entera donde está la palabra: muchas tienen otra acepción más corriente fuera de ese contexto, y quien contesta de memoria escribe esa acepción en lugar de la del texto. Un sinónimo vale si se puede poner en el sitio de la palabra sin que cambie el sentido de la frase.<\/p>", "apoyo": "propio", "solo_web": true}, {"tipo": "clasificar", "titulo": "¿Qué clase de error es?", "ayuda": "Ocho marcas que un corrector deja en una redacción. Clasifica cada una. Ninguna es una falta de ortografía.", "ops": ["el orden de las ideas", "la construcción de las oraciones", "la palabra elegida", "la presentación"], "items": [{"enun": "El cierre abre un tema nuevo que no estaba en el texto.", "sol": "el orden de las ideas", "porque": "el texto termina en otro sitio del que venía"}, {"enun": "Una oración se queda sin verbo.", "sol": "la construcción de las oraciones", "porque": "no es una falta: está mal construida"}, {"enun": "Los tres argumentos van seguidos, sin ningún conector.", "sol": "el orden de las ideas", "porque": "sin conector no se distingue dónde acaba uno y empieza otro"}, {"enun": "Repite <i>animales<\/i> cuatro veces en ocho líneas.", "sol": "la palabra elegida", "porque": "hay sinónimos a mano y no se han usado"}, {"enun": "Pone una coma donde tenía que ir un punto.", "sol": "la construcción de las oraciones", "porque": "dos oraciones enteras cosidas con una coma"}, {"enun": "Escribe <i>hacer una reclamación<\/i> donde bastaba <i>reclamar<\/i>.", "sol": "la palabra elegida", "porque": "un verbo vacío más un nombre, donde había un verbo"}, {"enun": "El folio no tiene márgenes y la letra se sale por los lados.", "sol": "la presentación", "porque": "se corrige aparte de lo que afirma el texto"}, {"enun": "La opinión aparece tres veces con otras palabras y ninguna razón detrás.", "sol": "el orden de las ideas", "porque": "repetir no es ordenar: no hay progresión"}], "criterio": "Las cuatro clases se corrigen en apartados distintos: el orden en <b>coherencia<\/b>, la construcción en <b>cohesión<\/b>, la palabra en <b>variación<\/b> y <b>corrección<\/b>, y la presentación en <b>disposición<\/b>.<br><br>Los dos que más se colocan mal son la oración sin verbo y los argumentos sin conector. Una oración sin verbo se cuenta como construcción, no como ortografía; y la falta de conectores rompe el orden, no la construcción.", "apoyo": "todo", "solo_web": true}, {"tipo": "abierta", "titulo": "Una tesis y dos razones", "ayuda": "Sobre el tema que quieras de estos dos: si conviene que el transporte público sea gratuito, o si los móviles deberían estar prohibidos en los institutos. <b>Solo la tesis y las dos razones<\/b>, con su conector delante. Cinco líneas, no cien palabras.", "palabras": {"min": 35, "max": 70}, "items": [{"enun": "Tesis y dos razones:", "modelo": "La tesis tiene que poder negarse. Las dos razones, llevar algo concreto dentro y un conector delante. El modelo de abajo ocupa cuatro líneas."}], "modelos": ["<b>Modelo · 54 palabras.<\/b> «El transporte público no debería ser gratuito, sino más frecuente. En primer lugar, en mi línea a las siete de la mañana pasa un autobús cada veinte minutos, y ese retraso pesa más que el precio del billete. Además, lo que hoy se paga con el billete tendría que salir de algún otro sitio.»"], "criterio": "Escribir solo el arranque sirve para comprobar si la tesis aguanta antes de gastar veinte minutos en el texto entero. Si no se le puede contestar «pues yo no lo veo así», todavía no es una tesis.", "apoyo": "todo", "solo_web": true}], "lectura": {"titulo": "Dos prendas y un resguardo", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["Al recoger una chaqueta en la tintorería, Iván encontró una manga", "más corta que la otra. La empleada comprobó el resguardo y llamó a", "la encargada. Iván había conservado también una fotografía de la", "prenda, tomada el día en que la llevó para limpiar. La imagen", "permitió comparar el estado anterior con el resultado.", "", "La encargada atendía dos establecimientos y aquella mañana estaba", "en el otro. Ofrecieron a Iván que volviera por la tarde. Él", "trabajaba hasta las nueve, así que pidió una respuesta por", "escrito. La empleada anotó la incidencia y acordaron llamarse al", "día siguiente.", "", "En el mostrador había un cartel que explicaba los precios, pero no", "indicaba a quién dirigirse si surgía un problema. La empleada", "admitió que cada compañero resolvía esas situaciones de una manera", "distinta. A veces se prometía una llamada que nadie había", "apuntado.", "", "La semana siguiente, la tienda añadió al resguardo un teléfono de", "contacto y un espacio para anotar incidencias. También fijó quién", "debía responder durante cada turno. El desacuerdo sobre la", "chaqueta seguía pendiente de resolución. Sin embargo, Iván ya", "sabía quién estudiaba su caso y cuándo recibiría una respuesta. Un", "procedimiento claro permite seguir una reclamación y comprobar si", "se cumplen los compromisos."], "pie": "Texto inventado. Ni Iván ni los datos que da son reales."}, "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartados 1 y 6: Cómo se corrige la redacción; Las consignas reales (p. 62 y 74) · ejercicio 9", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El género del sustantivo", "meta": "35 minutos · dónde se equivoca todo el mundo", "cuaderno": {"nudo": 8, "apartados": [1], "ejercicios": [1, 2, 3, 4]}, "teoria": "<h3>1 · El sustantivo: clases y género<\/h3>\n<p><strong>Las terminaciones que fabrican sustantivos.<\/strong> El cuadro derivativo del bloque 2 —el ejercicio que da una palabra y pide el sustantivo, el adjetivo y el verbo de la misma raíz— se rellena reconociéndolas. La columna del medio lleva las casillas que han caído en el examen; la de la derecha, otros ejemplos.<\/p>\n<table>\n<thead>\n<tr>\n<th>terminación<\/th>\n<th>ejemplo real de examen<\/th>\n<th>otros ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>-ción / -sión<\/strong><\/td>\n<td>producir → <strong>producción<\/strong> (2026) · comprender → <strong>comprensión<\/strong> (2013)<\/td>\n<td>instalar → instalación · decidir → decisión · reclamar → reclamación<\/td>\n<\/tr>\n<tr>\n<td><strong>-dad / -tad<\/strong><\/td>\n<td>claro → <strong>claridad<\/strong> (2015) · oscuro → <strong>oscuridad<\/strong> (2018)<\/td>\n<td>leal → lealtad · seguro → seguridad · igual → igualdad<\/td>\n<\/tr>\n<tr>\n<td><strong>-eza / -ez<\/strong><\/td>\n<td>limpio → <strong>limpieza<\/strong> (2011) · pequeño → <strong>pequeñez<\/strong> (2019)<\/td>\n<td>pobre → pobreza · rápido → rapidez · sencillo → sencillez<\/td>\n<\/tr>\n<tr>\n<td><strong>-miento<\/strong><\/td>\n<td>crecer → <strong>crecimiento<\/strong> (2026) · entender → <strong>entendimiento<\/strong> (2016)<\/td>\n<td>alojar → alojamiento · aparcar → aparcamiento · sufrir → sufrimiento<\/td>\n<\/tr>\n<tr>\n<td><strong>-ancia / -encia<\/strong><\/td>\n<td>resistir → <strong>resistencia<\/strong> (2015)<\/td>\n<td>elegante → elegancia · paciente → paciencia · abundar → abundancia<\/td>\n<\/tr>\n<tr>\n<td><strong>-ura<\/strong><\/td>\n<td>—<\/td>\n<td>escribir → escritura · alto → altura · fresco → frescura<\/td>\n<\/tr>\n<tr>\n<td><strong>-anza<\/strong><\/td>\n<td>—<\/td>\n<td>esperar → esperanza · enseñar → enseñanza · confiar → confianza<\/td>\n<\/tr>\n<tr>\n<td><strong>-aje<\/strong><\/td>\n<td>—<\/td>\n<td>aprender → aprendizaje · almacenar → almacenaje · reciclar → reciclaje<\/td>\n<\/tr>\n<tr>\n<td><strong>-ía<\/strong><\/td>\n<td>—<\/td>\n<td>alegre → alegría · cobarde → cobardía · rebelde → rebeldía<\/td>\n<\/tr>\n<tr>\n<td><strong>-tud<\/strong><\/td>\n<td>—<\/td>\n<td>lento → lentitud · alto → altitud · joven → juventud<\/td>\n<\/tr>\n<tr>\n<td><strong>-ada / -ida<\/strong> <em>(el resultado de la acción)<\/em><\/td>\n<td>—<\/td>\n<td>llegar → llegada · salir → salida · caer → caída<\/td>\n<\/tr>\n<tr>\n<td><strong>-dor / -tor<\/strong> <em>(persona que hace algo)<\/em><\/td>\n<td>investigar → <strong>investigador<\/strong> (2015) · fundar → <strong>fundador<\/strong> (2020)<\/td>\n<td>vender → vendedor · conducir → conductor · trabajar → trabajador<\/td>\n<\/tr>\n<tr>\n<td><strong>-o / -a / -e<\/strong> <em>(cortando el verbo)<\/em><\/td>\n<td>recordar → <strong>recuerdo<\/strong> (2013) · apostar → <strong>apuesta<\/strong> (2020)<\/td>\n<td>cambiar → cambio · pescar → pesca · cortar → corte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Las clases de sustantivo:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué distingue<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>común / propio<\/strong><\/td>\n<td>el común nombra a cualquiera de una clase; el propio, a uno concreto, <strong>y va con mayúscula<\/strong><\/td>\n<td><em>agricultor<\/em>, <em>región<\/em> / <em>Trenado<\/em>, <em>Extremadura<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>concreto / abstracto<\/strong><\/td>\n<td>se puede percibir por los sentidos, o no<\/td>\n<td><em>tractor<\/em>, <em>pistacho<\/em> / <em>esperanza<\/em>, <em>erosión<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>individual / colectivo<\/strong><\/td>\n<td>en singular nombra uno, o nombra un conjunto<\/td>\n<td><em>árbol<\/em>, <em>vecino<\/em> / <em>arboleda<\/em>, <em>gente<\/em>, <em>rebaño<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>contable / incontable<\/strong><\/td>\n<td>admite número, o no lo admite con el mismo sentido<\/td>\n<td><em>dos olivos<\/em> / <em>aceite<\/em>, <em>paciencia<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>De las cuatro clases, dos exigen algo al escribir: la mayúscula del nombre propio y la concordancia del colectivo.<\/p>\n<ul>\n<li><strong>El nombre propio va con mayúscula.<\/strong> Son nombres propios los de persona (<em>Daniel Trenado<\/em>), los de lugar (<em>Extremadura<\/em>, <em>Cáceres<\/em>, <em>el Guadiana<\/em>), los de instituciones y organismos (<em>la Generalitat<\/em>, <em>el Ministerio de Agricultura<\/em>) y los de marcas y títulos (<em>Mercadona<\/em>, <em>El Quijote<\/em>). Van con minúscula, aunque parezcan propios, los días de la semana y los meses (<em>lunes<\/em>, <em>septiembre<\/em>), los gentilicios (<em>extremeño<\/em>, <em>catalana<\/em>), los idiomas (<em>castellano<\/em>) y los cargos y oficios (<em>el alcalde<\/em>, <em>la ministra<\/em>).<\/li>\n<li><strong>Los colectivos concuerdan en singular.<\/strong> Un colectivo nombra un conjunto con una palabra en singular: <em>la gente<\/em>, <em>el rebaño<\/em>, <em>la arboleda<\/em>. Y el verbo va en singular: <strong>la gente piensa<\/strong>, no «la gente piensan». Esta falta de concordancia aparece entre las más frecuentes de las redacciones, y se estudia entera en el nudo 4 bis, apartado 4.<\/li>\n<\/ul>\n<h4>El género: los seis casos que fallan<\/h4>\n<p>El género del sustantivo <strong>no se elige: viene dado con la palabra<\/strong>. <em>La mesa<\/em> es femenino por convención, no porque las mesas tengan nada de femenino. Como casi nunca da problemas, hay que estudiar los seis casos en los que sí los da.<\/p>\n<p><strong>1 · Heterónimos.<\/strong> El masculino y el femenino son <strong>palabras distintas<\/strong>, no dos formas de la misma: <em>padre / madre<\/em>, <em>carnero / oveja<\/em>, <em>yerno / nuera<\/em>, <em>caballo / yegua<\/em>.<\/p>\n<p><strong>2 · Comunes.<\/strong> La palabra <strong>no cambia<\/strong>; lo que cambia es el artículo: <em>el periodista / la periodista<\/em>, <em>el tenista / la tenista<\/em>, <em>el estudiante / la estudiante<\/em>.<\/p>\n<p><strong>3 · Epicenos.<\/strong> Sustantivos <strong>de una sola forma<\/strong> que vale para el macho y para la hembra; el género de la palabra no indica el sexo del ser: <em>la víctima<\/em> es femenino aunque la víctima sea un hombre; <em>el personaje<\/em> es masculino aunque el personaje sea una mujer. También <em>el delfín<\/em>, <em>la hormiga<\/em>, <em>la jirafa<\/em>.<\/p>\n<p><strong>4 · Sustantivos que empiezan por <em>a-<\/em> o <em>ha-<\/em> tónicas.<\/strong> En singular llevan <strong>el<\/strong>, pero <strong>siguen siendo femeninos<\/strong>: <em>el agua<\/em>, <em>el alma<\/em>, <em>el hacha<\/em> (quedan fuera los nombres de las letras, <em>la a<\/em>, <em>la hache<\/em>, y los nombres de persona). En plural recuperan el artículo femenino: <em>las aguas<\/em>, <em>las almas<\/em>.<\/p>\n<blockquote>\n<p>Aquí aparece el error típico, y el corrector lo localiza enseguida: se escribe «el agua claro». La palabra es femenina, así que el adjetivo va en femenino: <strong>«el agua clara»<\/strong>. El artículo cambia; el género, no.<\/p>\n<\/blockquote>\n<p><strong>5 · Los que cambian de significado con el género.<\/strong> El cambio de género no introduce un matiz: <strong>crea dos palabras distintas<\/strong>. <em>El frente<\/em> (de una guerra) y <em>la frente<\/em> (de la cara). <em>El capital<\/em> (dinero) y <em>la capital<\/em> (ciudad). <em>El cura<\/em> y <em>la cura<\/em>. <em>El orden<\/em> y <em>la orden<\/em>.<\/p>\n<p><strong>6 · Ambiguos.<\/strong> Admiten los dos artículos <strong>sin cambiar de significado<\/strong>: <em>el mar / la mar<\/em>, <em>el azúcar / la azúcar<\/em>, <em>el maratón / la maratón<\/em>, <em>el interrogante / la interrogante<\/em>, <em>el armazón / la armazón<\/em>. El diccionario da los dos géneros por buenos; en un texto formal la forma más frecuente es la masculina (<em>el mar<\/em>, <em>el azúcar<\/em>, <em>el maratón<\/em>).<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "El sustantivo de la misma raíz", "dossier": {"cuaderno": "8", "ejercicio": 1}, "ayuda": "Todas son casillas reales del cuadro derivativo. Escribe el sustantivo de la misma raíz, en singular y con su tilde si la lleva.", "estricto": true, "items": [{"enun": "<i>heredar<\/i>", "conv": "2026", "sol": "herencia|heredad|heredero", "porque": "también <i>heredad<\/i> o <i>heredero<\/i>"}, {"enun": "<i>instalar<\/i>", "conv": "2026", "sol": "instalación|instalador", "porque": "también <i>instalador<\/i>"}, {"enun": "<i>escribir<\/i>", "conv": "2014", "sol": "escritura|escritor|escrito", "porque": "también <i>escritor<\/i> o <i>escrito<\/i>"}, {"enun": "<i>entretenido<\/i>", "conv": "2014", "sol": "entretenimiento"}, {"enun": "<i>señalar<\/i>", "conv": "2018", "sol": "señal|señalización|señalamiento", "porque": "también <i>señalización<\/i>"}, {"enun": "<i>criticar<\/i>", "conv": "2019", "sol": "crítica|crítico", "porque": "también <i>crítico<\/i>"}], "criterio": "Cualquier falta de ortografía anula la casilla, aunque la palabra sea la correcta. La clave oficial de 2026 añade «Pueden aceptarse otras respuestas correctas», y por eso valen otros sustantivos de la misma raíz: <i>heredero<\/i>, <i>instalador<\/i>, <i>escritor<\/i>.", "apoyo": ["1 · El sustantivo: clases y género"], "dossier_txt": "Del dossier: nudo 8, ejercicio 1"}, {"tipo": "hueco", "titulo": "Pon el artículo correcto", "dossier": {"cuaderno": "8", "ejercicio": 2}, "ayuda": "Escribe solo el artículo: <i>el<\/i>, <i>la<\/i>, <i>los<\/i> o <i>las<\/i>. Al corregir, la clave da la justificación.", "items": [{"enun": "______ agua está fría.", "sol": "el", "porque": "femenino que empieza por <i>a-<\/i> tónica: lleva <i>el<\/i> en singular"}, {"enun": "______ aguas están frías.", "sol": "las", "porque": "en plural vuelve el artículo femenino"}, {"enun": "______ hacha nueva.", "sol": "el", "porque": "femenino con <i>ha-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ alma humana.", "sol": "el", "porque": "femenino con <i>a-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ águila real.", "sol": "el", "porque": "femenino con <i>a-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ área más pequeña.", "sol": "el", "porque": "femenino con <i>a-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ hambre de la posguerra.", "sol": "el", "porque": "femenino con <i>ha-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ armas requisadas.", "sol": "las", "porque": "plural, artículo femenino"}, {"enun": "______ amiga de mi hermana.", "sol": "la", "porque": "la <i>a-<\/i> es átona (<i>a-MI-ga<\/i>), así que lleva el artículo de siempre"}, {"enun": "______ aula del fondo.", "sol": "el", "porque": "femenino con <i>a-<\/i> tónica: <i>el<\/i> en singular"}, {"enun": "______ harina integral.", "sol": "la", "porque": "la <i>a-<\/i> es átona (<i>ha-RI-na<\/i>)"}], "criterio": "En todos los casos con <i>el<\/i> la palabra sigue siendo femenina: por eso se dice <i>el agua fría<\/i>, <i>el área pequeña<\/i>, <i>el hambre negra<\/i>, nunca ⊗<i>el agua frío<\/i>.", "apoyo": ["El género: los seis casos que fallan"], "dossier_txt": "Del dossier: nudo 8, ejercicio 2"}, {"tipo": "hueco", "titulo": "El mismo sustantivo, con el otro género", "dossier": {"cuaderno": "8", "ejercicio": 3}, "ayuda": "Siete parejas de oraciones con el mismo sustantivo. Escribe el artículo que corresponde; al corregir, la clave explica la diferencia de significado.", "items": [{"enun": "Lo hirieron en ______ frente, en Ucrania.", "sol": "el", "porque": "el frente: la zona de combate"}, {"enun": "Se secó ______ frente con el pañuelo.", "sol": "la", "porque": "la frente: la parte de la cara"}, {"enun": "Invirtió todo ______ capital.", "sol": "el", "porque": "el capital: el dinero"}, {"enun": "Madrid es ______ capital.", "sol": "la", "porque": "la capital: la ciudad"}, {"enun": "Le dieron ______ orden de salir.", "sol": "la", "porque": "la orden: el mandato"}, {"enun": "Puso ______ orden en el armario.", "sol": "el", "porque": "el orden: la colocación"}, {"enun": "______ cura del pueblo lleva allí treinta años.", "sol": "el", "porque": "el cura: el sacerdote"}, {"enun": "______ cura de la herida tardó un mes.", "sol": "la", "porque": "la cura: la curación"}, {"enun": "______ pendiente de la montaña es muy fuerte.", "sol": "la", "porque": "la pendiente: la inclinación del terreno"}, {"enun": "Perdió ______ pendiente de oro.", "sol": "el", "porque": "el pendiente: la joya"}, {"enun": "El periódico publicó ______ editorial muy duro.", "sol": "un|el", "porque": "un editorial: el artículo de opinión del periódico"}, {"enun": "______ editorial publicó el libro en marzo.", "sol": "la", "porque": "la editorial: la empresa que publica libros"}, {"enun": "Los niños volaban ______ cometa en la playa.", "sol": "la", "porque": "la cometa: el juguete"}, {"enun": "______ cometa Halley pasa cada 76 años.", "sol": "el", "porque": "el cometa: el astro"}], "criterio": "Estas palabras pertenecen al vocabulario, no a la gramática: el artículo es lo único que separa dos significados escritos con las mismas letras.", "apoyo": ["1 · El sustantivo: clases y género"], "dossier_txt": "Del dossier: nudo 8, ejercicio 3"}, {"tipo": "clasificar", "titulo": "Los seis casos del género", "dossier": {"cuaderno": "8", "ejercicio": 4}, "ayuda": "Clasifica cada sustantivo en uno de los casos del género: heterónimo, común, epiceno, <i>a-<\/i> tónica, cambio de significado o ambiguo.", "ops": ["común", "heterónimo", "epiceno", "a- tónica", "cambio de significado", "ambiguo"], "items": [{"enun": "<i>el/la tenista<\/i>", "sol": "común", "porque": "la misma forma para los dos sexos; los distingue el artículo"}, {"enun": "<i>yerno/nuera<\/i>", "sol": "heterónimo", "porque": "una palabra distinta para cada sexo"}, {"enun": "<i>la víctima<\/i>", "sol": "epiceno", "porque": "una sola forma y un solo artículo para los dos sexos"}, {"enun": "<i>el/la estudiante<\/i>", "sol": "común", "porque": "la misma forma para los dos sexos; los distingue el artículo"}, {"enun": "<i>caballo/yegua<\/i>", "sol": "heterónimo", "porque": "una palabra distinta para cada sexo"}, {"enun": "<i>el agua<\/i>", "sol": "a- tónica", "porque": "femenino que lleva <i>el<\/i> en singular"}, {"enun": "<i>el mar / la mar<\/i>", "sol": "ambiguo", "porque": "admite los dos artículos sin cambiar de significado"}, {"enun": "<i>el capital / la capital<\/i>", "sol": "cambio de significado", "porque": "con cada artículo tiene un significado distinto"}, {"enun": "<i>la jirafa<\/i>", "sol": "epiceno", "porque": "una sola forma y un solo artículo para los dos sexos"}, {"enun": "<i>el/la periodista<\/i>", "sol": "común", "porque": "la misma forma para los dos sexos; los distingue el artículo"}, {"enun": "<i>el hacha<\/i>", "sol": "a- tónica", "porque": "femenino que lleva <i>el<\/i> en singular"}, {"enun": "<i>el azúcar / la azúcar<\/i>", "sol": "ambiguo", "porque": "admite los dos artículos sin cambiar de significado"}, {"enun": "<i>el cometa / la cometa<\/i>", "sol": "cambio de significado", "porque": "con cada artículo tiene un significado distinto"}, {"enun": "<i>toro/vaca<\/i>", "sol": "heterónimo", "porque": "una palabra distinta para cada sexo"}, {"enun": "<i>el/la testigo<\/i>", "sol": "común", "porque": "la misma forma para los dos sexos; los distingue el artículo"}, {"enun": "<i>el personaje<\/i>", "sol": "epiceno", "porque": "una sola forma y un solo artículo para los dos sexos"}, {"enun": "<i>el arma<\/i>", "sol": "a- tónica", "porque": "femenino que lleva <i>el<\/i> en singular"}, {"enun": "<i>el maratón / la maratón<\/i>", "sol": "ambiguo", "porque": "admite los dos artículos sin cambiar de significado"}], "apoyo": ["1 · El sustantivo: clases y género", "El género: los seis casos que fallan"], "dossier_txt": "Del dossier: nudo 8, ejercicio 4"}, {"tipo": "cazar", "titulo": "Caza los fallos de género", "ayuda": "Seis palabras de este párrafo no concuerdan: cuatro en género con un sustantivo femenino y dos en número con un colectivo. <b>Pincha en las que estén mal.<\/b>", "items": [{"texto": "El agua estaba fresco y el alma del pueblo seguía intacto. La periodista dijo que la gente hablan mucho de eso y que todo el mundo saben lo que pasa. Le pareció que aquella hacha nueva estaba mal afilado y que las aguas del río bajaban turbio.", "faltas": {"fresco": "fresca — <i>el agua<\/i> es femenino", "intacto": "intacta — <i>el alma<\/i> es femenino", "hablan": "habla — <i>la gente<\/i> es un colectivo: singular", "saben": "sabe — <i>todo el mundo<\/i> es singular", "afilado": "afilada — <i>el hacha<\/i> es femenino", "turbio": "turbias — <i>las aguas<\/i> es femenino plural"}}], "criterio": "Lo que <b>no<\/b> es fallo: <i>el agua<\/i>, <i>el alma<\/i> y <i>el hacha<\/i> llevan bien el artículo <i>el<\/i>, porque empiezan por <i>a-<\/i> tónica. Falla siempre el adjetivo, que tiene que ir en <b>femenino<\/b>. Y en cuanto la palabra pasa a plural, el artículo vuelve a ser femenino: <i>las aguas<\/i>.<br><br>Las dos de <i>gente<\/i> y <i>todo el mundo<\/i> pertenecen a otra familia, la de los colectivos, que van en singular por mucho que nombren a mucha gente. Equivocar el género o la concordancia cuenta como error de gramática.", "apoyo": ["1 · El sustantivo: clases y género"], "solo_web": true}, {"tipo": "opcion", "titulo": "Concordancia con colectivos", "ayuda": "Un colectivo nombra un conjunto con una palabra en singular. ¿Cómo va el verbo?", "ops": ["singular", "plural"], "items": [{"enun": "La mayoría de los vecinos ______ de acuerdo. <i>(estar)<\/i>", "sol": "plural|singular", "porque": "con <i>la mayoría de<\/i> + plural valen las dos: <i>están<\/i> y <i>está<\/i>"}, {"enun": "El rebaño ______ al monte al amanecer. <i>(subir)<\/i>", "sol": "singular", "porque": "<b>sube<\/b>"}, {"enun": "La gente ya no ______ en papel. <i>(leer)<\/i>", "sol": "singular", "porque": "<b>lee<\/b>. <i>La gente<\/i> es una sola palabra en singular"}, {"enun": "Todo el mundo ______ lo que pasó. <i>(saber)<\/i>", "sol": "singular", "porque": "<b>sabe<\/b>"}, {"enun": "Varios socios ______ en contra. <i>(votar)<\/i>", "sol": "plural"}, {"enun": "Un grupo de vecinos ______ al pleno. <i>(acudir)<\/i>", "sol": "singular|plural", "porque": "el núcleo es <i>grupo<\/i>: <i>acude<\/i>; y también se admite <i>acuden<\/i>, pensando en los vecinos uno a uno"}, {"enun": "Los vecinos ______ una reunión. <i>(pedir)<\/i>", "sol": "plural", "porque": "<b>pidieron<\/b>. <i>Los vecinos<\/i> ya es plural: no es un colectivo"}, {"enun": "Las cooperativas ______ el precio en asamblea. <i>(fijar)<\/i>", "sol": "plural"}], "criterio": "Hay un caso en el que las dos valen: cuando el colectivo lleva detrás <i>de<\/i> + plural —<i>la mayoría <b>de los alumnos<\/b><\/i>, <i>un grupo <b>de vecinos<\/b><\/i>—, tanto <i>aprobó<\/i> como <i>aprobaron<\/i> son correctas. <b>Nadie puede descontar por eso.<\/b> Si dudas, elige el singular.", "apoyo": ["1 · El sustantivo: clases y género"], "solo_web": true}], "cuaderno_txt": "Nudo 8 · Las variables nominales: sustantivo, adjetivo, determinantes — apartado 1: El sustantivo: clases y género (p. 94) · ejercicios 1, 2, 3 y 4", "teoria_dossier": true}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. Los tramos de los apartados son los de la convocatoria 2026. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-24"};</script>
<script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        var primero = f[0], ultimo = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === primero) { ultimo.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);
    ventana = velo;
  }
  function abreVentana(kicker, titulo, contenido, desde) {
    if (!ventana) creaVentana();
    disparador = desde || document.activeElement;
    ventana.querySelector('.v-k').textContent = kicker;
    ventana.querySelector('#v-titulo').innerHTML = titulo;
    var cuerpo = ventana.querySelector('.v-cuerpo');
    cuerpo.innerHTML = '';
    cuerpo.appendChild(contenido);
    cuerpo.scrollTop = 0;
    ventana.hidden = false;
    document.body.classList.add('con-ventana');
    requestAnimationFrame(function () { ventana.classList.add('on'); ventana._sigue(); });
    ventana.querySelector('.v-x').focus();
  }
  function cierraVentana() {
    if (!ventana || ventana.hidden) return;
    ventana.classList.remove('on');
    ventana.hidden = true;
    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
    cruz: '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    texto: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',

  function envuelveTablas(nodo) {

  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede
     traer más de mil palabras: los ejercicios quedaban a varias pantallas del
     título del carril. Por encima de PLIEGUE palabras, cada apartado se pliega
     bajo su título; por debajo, la teoría se lee seguida, como en el papel. */
  var PLIEGUE = 1200;

    var h3s = Array.prototype.slice.call(nodo.children).filter(function (x) { return x.tagName === 'H3'; });
    if (!h3s.length) return nodo;
    if ((nodo.textContent.match(/\S+/g) || []).length <= PLIEGUE) return nodo;
    h3s.forEach(function (h) {
      var det = el('details', 'ap-dossier');
      var sum = el('summary');

      sum.appendChild(h);

     apartado y un h4 por subapartado; el bloque de un h3 lleva dentro sus h4, y
     el de un h4 sabe de qué h3 es. "apoyo" del ejercicio dice cuáles enseñar.
     _teoria_web.py hace el mismo corte en Python. */
  function bloquesTeoria(html) {
    var partes = (html || '').split(/(<h[34][^>]*>[\s\S]*?<\/h[34]>)/);

      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)

    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {

        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
