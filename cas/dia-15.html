<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 15 · 17 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 15, "fecha": "2026-11-17", "tab": "Día 15 · 17 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 15", "h1": "Martes 17 de noviembre", "sub": "Los cuatro porqués y a ver / haber · el texto explicativo · las perífrasis", "carriles": [{"chapa": "Carril A", "titulo": "Palabras que se separan (1)", "meta": "30 minutos · los cuatro porqués y el par a ver / haber", "cuaderno": {"nudo": "4bis", "apartados": [3], "ejercicios": [5, 6]}, "teoria": "<h3>3 · Palabras que se separan<\/h3>\n<h4>3.1 · <em>por qué<\/em>, <em>porque<\/em>, <em>el porqué<\/em>, <em>por que<\/em><\/h4>\n<p><em>Por qué<\/em>, <em>porque<\/em>, <em>el porqué<\/em> y <em>por que<\/em> suenan igual y se escriben de cuatro maneras distintas. Las cuatro aparecen en la prueba: las preguntas de comprensión del bloque 1 se formulan con <em>por qué<\/em> —en la convocatoria 2026, «Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola?», 0,75 puntos—, la respuesta se construye con <em>porque<\/em>, y en la redacción cada razón que se justifica lleva un <em>porque<\/em> delante.<\/p>\n<table>\n<thead>\n<tr>\n<th>forma<\/th>\n<th>función<\/th>\n<th>cómo se comprueba<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>por qué<\/strong> (dos palabras, con tilde)<\/td>\n<td>la pregunta, directa o indirecta<\/td>\n<td>admite <em>razón<\/em> dentro: «¿Por qué [razón] lo hizo?»<\/td>\n<\/tr>\n<tr>\n<td><strong>porque<\/strong> (una palabra, sin tilde)<\/td>\n<td>la respuesta, la causa<\/td>\n<td>se puede cambiar por <em>ya que<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>el porqué<\/strong> (una palabra, con tilde)<\/td>\n<td>un sustantivo, <em>el motivo<\/em><\/td>\n<td>lleva delante <em>el<\/em>, <em>un<\/em>, <em>su<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>por que<\/strong> (dos palabras, sin tilde)<\/td>\n<td>preposición <em>por<\/em> + <em>que<\/em>: conjunción (<em>luchan por que se apruebe<\/em>) o relativo (<em>la razón por que<\/em> = <em>por la que<\/em>). Raro<\/td>\n<td>si dudas, <strong>descártala<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En el texto de la convocatoria 2024: «…es original y valiente, sino también sensato, <strong>porque<\/strong> ha apostado por un modelo que ha funcionado». Una palabra, sin tilde: introduce la causa y admite el cambio por <em>ya que<\/em>.<\/p>\n<h4>3.2 · <em>a ver<\/em> / <em>haber<\/em><\/h4>\n<ul>\n<li><strong>haber<\/strong>, con h, pertenece al verbo <em>haber<\/em>. Va detrás de <em>va a<\/em>, <em>puede<\/em>, <em>debe<\/em>, <em>tiene que<\/em>, o delante de un participio. En el texto de 2020: «se vanagloriaba <strong>de haber abatido<\/strong> piezas de 420 especies».<\/li>\n<li><strong>a ver<\/strong>, en dos palabras, se compone de la preposición <em>a<\/em> y el verbo <em>ver<\/em>. Detrás admite a menudo <em>si<\/em> o <em>qué<\/em>: «vamos <strong>a ver qué<\/strong> pasa». Prueba rápida: si puedes decir «a mirar», corresponde <em>a ver<\/em>; si puedes decir «existir» o va delante de un participio, corresponde <em>haber<\/em>.<\/li>\n<\/ul>\n<h4>3.3 · <em>sino<\/em> / <em>si no<\/em><\/h4>\n<p><strong>sino<\/strong> (una palabra) corrige algo que acabas de negar. La fórmula es <em>no… sino…<\/em>. Tres ejemplos reales:<\/p>\n<ul>\n<li>2013: «Y <strong>no<\/strong> solo más lenta, <strong>sino<\/strong> menos eficiente.»<\/li>\n<li>2020: «este tipo de cacerías crueles de seres en peligro <strong>no<\/strong> hacen <strong>sino<\/strong> aumentar.»<\/li>\n<li>2023: «lo que me acongoja de verdad <strong>no<\/strong> es que existan esos monstruos, <strong>sino que<\/strong> un nutrido número de buenos hombres se sientan aludidos.»<\/li>\n<\/ul>\n<p><strong>si no<\/strong> (dos palabras) es una condición negada: <em>si<\/em> + <em>no<\/em>. Prueba: puedes meter algo entre las dos palabras. «<strong>Si<\/strong> [tú] <strong>no<\/strong> vienes, empezamos sin ti.»<\/p>\n<h4>3.4 · Tres pares más<\/h4>\n<table>\n<thead>\n<tr>\n<th>dos palabras<\/th>\n<th>una palabra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tan bien<\/strong> = de manera tan buena. <em>Nunca escribió tan bien como aquel año.<\/em><\/td>\n<td><strong>también<\/strong> = además. <em>También vinieron los vecinos.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>sobre todo<\/strong> = especialmente, la forma que aparece casi siempre<\/td>\n<td><strong>sobretodo<\/strong> = un abrigo, de uso poco frecuente<\/td>\n<\/tr>\n<tr>\n<td><strong>de más<\/strong> = de sobra. <em>Me han dado dos euros de más.<\/em><\/td>\n<td><strong>demás<\/strong> = los otros. <em>Vinieron Ana y las demás.<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>De <em>sobre todo<\/em> hay constancia oficial: en la convocatoria 2017 cayó en el ejercicio de léxico, «sobre todo» (línea 7), y la solución la glosa como «especialmente». Dos palabras.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Por qué, porque o el porqué", "dossier": {"cuaderno": "4bis", "ejercicio": 5}, "ayuda": "Escribe <i>por qué<\/i>, <i>porque<\/i> o <i>porqué<\/i>, según la frase: junto o separado, con tilde o sin ella.", "estricto": true, "items": [{"enun": "No entiendo ______ lo hizo.", "sol": "por qué", "porque": "interrogativa indirecta: <i>no entiendo por qué razón<\/i>", "corto": false}, {"enun": "Lo hizo ______ nadie se lo impidió.", "sol": "porque", "porque": "causa: se puede sustituir por <i>ya que<\/i>", "corto": false}, {"enun": "Todavía no sabemos el ______ de su decisión.", "sol": "porqué|el porqué", "porque": "sustantivo: lleva el artículo <i>el<\/i> delante", "corto": false}, {"enun": "¿______ no vino ayer?", "sol": "Por qué", "porque": "pregunta directa", "corto": false}, {"enun": "Me preguntó ______ me iba.", "sol": "por qué", "porque": "interrogativa indirecta: <i>me preguntó por qué razón<\/i>", "corto": false}], "criterio": "<i>Por qué<\/i>, separado y con tilde, pregunta, sea con signos o dentro de otra oración (<i>no entiendo por qué lo hizo<\/i>): admite <i>razón<\/i> detrás. <i>Porque<\/i> da la causa y se sustituye por <i>ya que<\/i>. <i>Porqué<\/i> es un sustantivo: lleva artículo y tiene plural, <i>los porqués<\/i>.", "apoyo": ["3 · Palabras que se separan", "3.1 · por qué, porque, el porqué, por que"], "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 5"}, {"tipo": "hueco", "titulo": "A ver o haber", "dossier": {"cuaderno": "4bis", "ejercicio": 6}, "ayuda": "Escribe <i>a ver<\/i> o <i>haber<\/i>. Si se puede sustituir por <i>a mirar<\/i>, es <i>a ver<\/i>.", "estricto": true, "items": [{"enun": "Vamos ______ si esta vez sale.", "sol": "a ver", "porque": "detrás va <i>si<\/i>", "corto": false}, {"enun": "Va ______ problemas con el horario.", "sol": "haber", "porque": "detrás de <i>va a<\/i>", "corto": false}, {"enun": "Tiene que ______ una explicación.", "sol": "haber", "porque": "detrás de <i>tiene que<\/i>", "corto": false}, {"enun": "Sube ______ qué ha pasado.", "sol": "a ver", "porque": "detrás va <i>qué<\/i>", "corto": false}, {"enun": "Debería ______ avisado antes.", "sol": "haber", "porque": "detrás de <i>debería<\/i>, y delante de un participio", "corto": false}], "criterio": "<i>Haber<\/i> es el infinitivo del verbo: va detrás de <i>va a<\/i>, <i>tiene que<\/i> o <i>debería<\/i>, y delante de un participio (<i>debería haber avisado<\/i>). <i>A ver<\/i> es la preposición con el infinitivo <i>ver<\/i>: lleva detrás <i>si<\/i> o <i>qué<\/i>, y se puede cambiar por <i>a mirar<\/i>.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 6"}, {"tipo": "hueco", "titulo": "Los cuatro porqués", "estricto": true, "ayuda": "Escribe la forma que corresponde: junta o separada, con tilde o sin ella.", "items": [{"enun": "No vino ______ estaba de guardia.", "sol": "porque", "corto": false}, {"enun": "¿______ no lo dijiste antes?", "sol": "Por qué|por qué", "corto": false}, {"enun": "Nadie explicó ______ del cambio de horario.", "sol": "el porqué", "corto": false, "porque": "lleva artículo delante: es el sustantivo"}, {"enun": "Quiero saber ______ lo cambiaron.", "sol": "por qué", "corto": false, "porque": "pregunta indirecta"}, {"enun": "Lucharon ______ se aprobara la ayuda.", "sol": "por que", "corto": false}, {"enun": "Cerraron ______ no había clientes.", "sol": "porque", "corto": false}, {"enun": "Todavía no entiendo sus ______. <i>(en plural)<\/i>", "sol": "porqués", "corto": false, "porque": "como sustantivo que es, hace plural"}], "criterio": "La prueba de meter <i>razón<\/i> dentro resuelve los dos <i>por qué<\/i>: «¿por qué [razón] no lo dijiste?» funciona. Y el plural <i>porqués<\/i> demuestra que <i>el porqué<\/i> es un sustantivo como cualquier otro.", "apoyo": "todo", "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las separadas", "ayuda": "Tres palabras de este párrafo están mal juntas o mal separadas. <b>Pincha en ellas.<\/b>", "items": [{"texto": "Nadie me explicó porqué cerraron la oficina. Fui haber si me lo decían, aunque sabía que habría cola. Al final me dieron un papel donde tampoco venía el porque del cierre.", "faltas": {"porqué": "por qué — es una pregunta indirecta: dos palabras y con tilde", "haber": "a ver — preposición más el verbo ver: «a mirar si me lo decían»", "porque": "el porqué — lleva artículo delante: es el sustantivo, junto y con tilde"}}], "criterio": "Las tres repiten la misma confusión, resuelta de tres maneras distintas. Y las tres formas mal escritas <b>existen<\/b>: <i>porqué<\/i>, <i>haber<\/i> y <i>porque<\/i> son palabras correctas, solo que no las que correspondían en esas frases.<br><br>Por eso el corrector ortográfico no las marca, y por eso se escapan.", "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartado 3: Palabras que se separan (p. 34) · ejercicios 5 y 6", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El texto explicativo", "meta": "25 minutos · explicar no es opinar", "cuaderno": {"nudo": 18, "apartados": [4], "ejercicios": [5, 6]}, "lectura": {"titulo": "Las dos mitades de una factura", "entrada": "Texto explicativo · <b>inventado para practicar<\/b>. No es una columna de opinión: aquí nadie defiende nada, se explica cómo funciona algo.", "lineas": ["Una factura de la luz tiene dos partes, y casi todo el desconcierto", "viene de confundirlas. La primera es lo que se paga por estar", "conectado, aunque no se encienda nada. La segunda es lo que se paga por", "lo que se ha gastado.", "", "A la primera se la llama término de potencia. La potencia es el máximo", "que la instalación puede dar a la vez: cuántos aparatos se pueden tener", "encendidos sin que salte el automático. Se contrata en kilovatios y se", "paga por días, tenga uno la casa vacía o llena.", "", "A la segunda se la llama término de energía, y se mide en kilovatios", "hora. Un kilovatio hora es lo que gasta un aparato de mil vatios", "funcionando una hora seguida. Una vitrocerámica ronda los dos mil", "vatios; una bombilla led, ocho.", "", "De ahí salen las dos maneras de bajar el recibo, que no son la misma.", "Bajar la potencia contratada abarata el primer término y no toca el", "segundo: se paga menos cada día, pero salta el automático si se juntan", "demasiados aparatos. Gastar menos abarata el segundo y no toca el", "primero.", "", "Hay además un tercer bloque que no depende de la compañía: impuestos y", "alquiler del contador. Aparecen al final, no se negocian y suelen ser la", "razón por la que dos facturas con el mismo consumo no dan lo mismo en", "meses distintos.", "", "Y una advertencia práctica. Cuando alguien ofrece por teléfono una", "tarifa más barata, conviene preguntar cuál de los dos términos baja. Si", "baja el de energía y sube el de potencia, una casa que consume poco", "puede acabar pagando más."], "pie": "Texto inventado con fines didácticos."}, "teoria": "<h3>4 · El explicativo o expositivo<\/h3>\n<p><strong>Aviso primero: el texto explicativo —el examen lo llama <em>expositivo<\/em>— no ha caído nunca como opción A.<\/strong> Solo una vez, en 2017, apareció como <strong>opción B<\/strong>: «<em>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración<\/em>».<\/p>\n<p>Sirve para tres tareas de este examen:<\/p>\n<ol>\n<li><strong>Las preguntas abiertas se contestan con un explicativo en miniatura.<\/strong> Cuando el enunciado pide «explique», está pidiendo esto: información ordenada, sin opinión, con conectores.<\/li>\n<li><strong>El resumen es un texto explicativo.<\/strong> «Sin marcas de subjetividad» es exactamente la definición de este tipo de texto.<\/li>\n<li><strong>Constituye la mitad de un argumentativo.<\/strong> Los argumentos de la opción A son explicaciones; lo que añade el argumentativo es la tesis y la intención de convencer.<\/li>\n<\/ol>\n<p><strong>La diferencia, en una línea:<\/strong> el explicativo quiere que <strong>entiendas<\/strong>; el argumentativo quiere que <strong>estés de acuerdo<\/strong>. Y en cuatro:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>argumentativo<\/th>\n<th>explicativo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>qué busca<\/td>\n<td>que estés de acuerdo<\/td>\n<td>que entiendas<\/td>\n<\/tr>\n<tr>\n<td>quién habla<\/td>\n<td>alguien con una postura<\/td>\n<td>nadie: sin marcas de opinión (<em>creo<\/em>, <em>me parece<\/em>)<\/td>\n<\/tr>\n<tr>\n<td>cómo empieza<\/td>\n<td>con una tesis discutible<\/td>\n<td>con lo que se va a explicar<\/td>\n<\/tr>\n<tr>\n<td>cómo cierra<\/td>\n<td>con una consecuencia<\/td>\n<td>con lo práctico o con un aviso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>rasgo<\/th>\n<th>cómo se nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>objetividad<\/strong><\/td>\n<td>tercera persona; nada de <em>creo<\/em>, <em>me parece<\/em>, <em>por desgracia<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>orden explícito<\/strong><\/td>\n<td><em>en primer lugar<\/em>, <em>por otra parte<\/em>, <em>finalmente<\/em>, <em>es decir<\/em>, <em>por ejemplo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>claridad léxica<\/strong><\/td>\n<td>si aparece un término técnico, se define ahí mismo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y su estructura: <strong>introducción<\/strong> (de qué voy a hablar), <strong>desarrollo<\/strong> (los datos, ordenados) y <strong>conclusión<\/strong> (lo que se recoge de todo ello). Tres partes, igual que el argumentativo, con distinto contenido. Dentro de ellas, cuatro movimientos: <strong>presentar<\/strong> lo que se va a explicar, en una frase; <strong>definir<\/strong> los términos que hagan falta, sin añadir otros; <strong>ordenar<\/strong>, de lo general a lo concreto o por partes; y <strong>cerrar<\/strong> con lo que le sirve a quien lee.<\/p>\n<p><strong>El detector:<\/strong> si la frase se puede <strong>discutir<\/strong>, es argumentativa. Si solo se puede <strong>comprobar<\/strong>, es explicativa.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Explicativa o argumentativa?", "dossier": {"cuaderno": "18", "ejercicio": 5, "parte": "la clase"}, "ayuda": "Seis frases: cinco del dossier y una añadida aquí. Indica si cada una explica o argumenta.", "ops": ["explicativa", "argumentativa"], "items": [{"enun": "«El pistacho necesita una poda anual muy cuidadosa.»", "sol": "explicativa", "porque": "da un dato que se puede comprobar"}, {"enun": "«Es una vergüenza lo poco que cobra un agricultor.»", "sol": "argumentativa", "porque": "«es una vergüenza» es una marca de subjetividad"}, {"enun": "«La cubierta vegetal consiste en dejar crecer plantas autóctonas entre los árboles.»", "sol": "explicativa", "porque": "define una técnica"}, {"enun": "«Los intermediarios se quedan una parte del precio final.»", "sol": "explicativa", "porque": "da un dato que se puede comprobar"}, {"enun": "«Deberíamos comprar productos de proximidad.»", "sol": "argumentativa", "porque": "hace una propuesta: <i>deberíamos<\/i>"}, {"enun": "«Los supermercados tendrían que pagar más a los agricultores por la fruta.»", "sol": "argumentativa", "porque": "hace una propuesta: <i>tendrían que<\/i>"}], "criterio": "La frase explicativa da un dato que se puede comprobar. La argumentativa toma postura: con una marca de opinión (<i>es una vergüenza<\/i>) o con una propuesta (<i>deberíamos<\/i>, <i>tendrían que<\/i>).", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 5 · la clase"}, {"tipo": "abierta", "titulo": "Reescríbelas como explicativas", "dossier": {"cuaderno": "18", "ejercicio": 5, "parte": "la reescritura"}, "ayuda": "Las dos argumentativas del dossier. Reescribe cada una como una frase explicativa, sin opinión ni propuesta.", "items": [{"enun": "«Es una vergüenza lo poco que cobra un agricultor.»", "modelo": "«El precio que recibe el agricultor por su producto es muy inferior al que paga el consumidor.»"}, {"enun": "«Deberíamos comprar productos de proximidad.»", "modelo": "«Los productos de proximidad recorren menos distancia entre el productor y el consumidor.»"}], "criterio": "La versión explicativa conserva el asunto y cambia la postura por un dato: la diferencia entre lo que cobra el agricultor y lo que paga el consumidor, la distancia que recorren los productos de proximidad.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 5 · la reescritura"}, {"tipo": "abierta", "titulo": "Una introducción explicativa", "dossier": {"cuaderno": "18", "ejercicio": 6}, "ayuda": "Escribe una introducción explicativa de dos frases, unas 25 palabras.", "items": [{"enun": "Tema: <i>cómo funciona una cooperativa agrícola<\/i>.", "modelo": "Dos modelos debajo, los de la clave del dossier.", "palabras": {"min": 20, "max": 35}}], "criterio": "La primera frase define y la segunda anuncia el desarrollo, sin ninguna marca de opinión.", "usa_texto": false, "modelos": ["«Una cooperativa agrícola es una empresa formada por los propios agricultores. Su función principal es reunir la producción de todos sus socios para venderla en mejores condiciones.» (27 palabras)", "«Las cooperativas agrarias agrupan a productores de una misma zona. Existen para reducir costes y para negociar el precio de venta con más fuerza de la que tendría cada agricultor por separado.» (32 palabras)"], "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 6"}, {"tipo": "hueco", "titulo": "Los cuatro movimientos: ¿en qué línea?", "ayuda": "Escribe el número de la línea donde empieza cada uno.", "items": [{"enun": "Dónde <b>presenta<\/b> lo que va a explicar", "sol": "1|2"}, {"enun": "Dónde <b>define<\/b> qué es la potencia", "sol": "5|6"}, {"enun": "Dónde saca la <b>consecuencia práctica<\/b> de las dos definiciones", "sol": "13|14"}, {"enun": "Dónde está el <b>aviso final<\/b>", "sol": "22|23"}], "criterio": "Los cuatro movimientos van en ese orden y ocupan párrafos enteros. El texto <b>no afirma en ningún momento qué le parece<\/b> el precio de la luz: explica cómo se compone y deja que el lector decida. Una columna de opinión haría lo contrario: afirmaría si le parece caro y daría razones.", "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Explica u opina?", "ayuda": "Las once son sobre la factura de la luz. Marca <b>explica<\/b> si la frase se puede comprobar y <b>opina<\/b> si se puede discutir.", "ops": ["explica", "opina"], "items": [{"enun": "Si baja el término de energía y sube el de potencia, una casa que consume poco puede pagar más.", "sol": "explica"}, {"enun": "Habría que prohibir esas llamadas comerciales.", "sol": "opina"}, {"enun": "El alquiler del contador aparece como un concepto aparte.", "sol": "explica"}, {"enun": "Los impuestos aparecen al final y no se negocian.", "sol": "explica"}, {"enun": "Cualquiera con dos dedos de frente entendería que esto hay que cambiarlo.", "sol": "opina"}, {"enun": "La potencia contratada es el máximo que la instalación puede dar a la vez.", "sol": "explica"}, {"enun": "Bajar la potencia abarata el primer término y no toca el segundo.", "sol": "explica"}, {"enun": "Un kilovatio hora equivale al consumo de un aparato de mil vatios durante una hora.", "sol": "explica"}, {"enun": "Es vergonzoso lo que cobran las eléctricas.", "sol": "opina"}, {"enun": "Nadie entiende una factura, y eso está hecho a propósito.", "sol": "opina", "porque": "la segunda mitad atribuye una intención: eso ya es una tesis"}, {"enun": "Las compañías se aprovechan de que nadie lee la letra pequeña.", "sol": "opina"}], "criterio": "La prueba práctica: una frase que <b>explica<\/b> se puede comprobar, y una que <b>opina<\/b> se puede discutir. «Un kilovatio hora equivale…» se comprueba; «es vergonzoso» se discute.<br><br>La de «nadie entiende una factura», que empieza explicando y acaba opinando en la misma frase. La subjetividad entra sobre todo por esa vía, también en el resumen.", "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}, {"tipo": "abierta", "titulo": "Explica algo en cien palabras · 10 minutos", "ayuda": "Los cuatro movimientos, sin opinar ni una vez. Elige algo que sepas explicar de memoria.", "items": [{"enun": "Explica cómo funciona algo que conozcas: una nómina, un abono de transporte, una receta, una máquina de tu trabajo.", "modelo": "Dos modelos abajo, sobre asuntos distintos."}], "modelos": ["<b>Una nómina · 95 palabras.<\/b> Una nómina tiene dos columnas que casi nunca se leen juntas. La primera suma: el salario base, los complementos y las horas extra, y da el bruto. La segunda resta: la cotización a la Seguridad Social, que es un porcentaje fijo, y la retención del IRPF, que depende de lo que se gana y de la situación familiar. El líquido resulta de esa resta. De ahí sale una consecuencia práctica: cuando alguien dice que cobra tanto, conviene preguntar si habla del bruto o del líquido, porque entre los dos puede haber un veinte por ciento.", "<b>Un abono de transporte · 87 palabras.<\/b> El abono mensual se compone de dos decisiones: cuántas zonas se cruzan y qué tipo de usuario es cada uno. Las zonas se cuentan por el recorrido más largo que se vaya a hacer, no por el habitual; si una sola vez al mes se cruza una zona de más, hay que pagarla igual. El tipo de usuario aplica descuentos por edad, familia numerosa o desempleo, y se acredita una vez al año. Conviene revisarlo cada enero: mucha gente paga la tarifa general teniendo derecho a otra."], "criterio": "Compara los dos cierres: los dos acaban con algo que le sirve a quien lee, y ninguno afirma si le parece bien o mal.<br><br>Y los dos arranques presentan la estructura antes de entrar en las partes. Quien empieza por un detalle obliga al lector a esperar para saber de qué va.", "palabras": {"objetivo": 100}, "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 4: El explicativo o expositivo (p. 68) · ejercicios 5 y 6", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Las perífrasis", "meta": "30 minutos · dos verbos con un solo significado", "cuaderno": {"nudo": 10, "apartados": [4], "ejercicios": [10, 11, 12]}, "teoria": "<h3>4 · Las perífrasis<\/h3>\n<p><strong>Una perífrasis son dos verbos con un solo significado.<\/strong> El primero se conjuga y pierde su significado; el segundo, en infinitivo, gerundio o participio, aporta el significado de la acción. A veces entre los dos hay un enlace (<em>que<\/em>, <em>a<\/em>, <em>de<\/em>).<\/p>\n<blockquote>\n<p><em>Tengo que salir<\/em> — <em>tengo<\/em> aquí no significa 'poseer'. Los dos verbos juntos significan 'obligación de salir'.<\/p>\n<\/blockquote>\n<p><strong>La prueba del <em>eso<\/em>, otra vez.<\/strong> Si el segundo verbo se puede sustituir por <em>eso<\/em>, no hay perífrasis: es un verbo con su complemento (en estos ejemplos, directo; en <em>me gusta salir<\/em>, el infinitivo es sujeto). <em>Quiero salir<\/em> → <em>quiero eso<\/em> ✔, no es perífrasis. <em>Tengo que salir<\/em> → <em>tengo que eso<\/em> ✘, es perífrasis.<\/p>\n<p><strong>Las clases.<\/strong> Se reparten en dos familias, según lo que añade el verbo conjugado: las <strong>modales<\/strong> expresan la actitud ante la acción (obligación, probabilidad, capacidad); las <strong>aspectuales<\/strong> expresan en qué fase está la acción (a punto de empezar, empezando, en curso, repetida, acabada, con resultado, habitual).<\/p>\n<table>\n<thead>\n<tr>\n<th>familia<\/th>\n<th>valor<\/th>\n<th>perífrasis<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>modal<\/strong><\/td>\n<td>obligación<\/td>\n<td><em>tener que<\/em> + inf. · <em>haber de<\/em> + inf. · <em>deber<\/em> + inf.<\/td>\n<td><em>Tengo que entregar el trabajo el lunes.<\/em> · <em>Has de reconocer que tenía razón.<\/em> · <em>Debes descansar.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>modal<\/strong><\/td>\n<td>probabilidad, suposición<\/td>\n<td><em>deber de<\/em> + inf. · <em>poder<\/em> + inf. · <em>venir a<\/em> + inf.<\/td>\n<td><em>Deben de ser las cinco.<\/em> · <em>Puede llover esta tarde.<\/em> · <em>Viene a costar cien euros.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>modal<\/strong><\/td>\n<td>capacidad, permiso<\/td>\n<td><em>poder<\/em> + inf.<\/td>\n<td><em>Ya puedo conducir de noche.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>inminencia, futuro próximo<\/td>\n<td><em>ir a<\/em> + inf. · <em>estar a punto de<\/em> + inf.<\/td>\n<td><em>Voy a llamar al centro.<\/em> · <em>Está a punto de llover.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>inicio (incoativa)<\/td>\n<td><em>empezar a<\/em>, <em>comenzar a<\/em>, <em>ponerse a<\/em>, <em>echarse a<\/em> + inf.<\/td>\n<td><em>Se puso a llover a las seis.<\/em> · <em>Se echó a reír.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>acción en curso (durativa)<\/td>\n<td><em>estar<\/em>, <em>seguir<\/em>, <em>continuar<\/em>, <em>llevar<\/em>, <em>ir<\/em>, <em>andar<\/em> + gerundio<\/td>\n<td><em>Está estudiando.<\/em> · <em>Sigue trabajando en el mismo sitio.<\/em> · <em>Llevo tres años estudiando de noche.<\/em> · <em>Va mejorando poco a poco.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>repetición (reiterativa)<\/td>\n<td><em>volver a<\/em> + inf.<\/td>\n<td><em>Volvió a suspender.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>final (terminativa)<\/td>\n<td><em>acabar de<\/em>, <em>terminar de<\/em>, <em>dejar de<\/em>, <em>llegar a<\/em> + inf.<\/td>\n<td><em>Acabo de salir del trabajo.<\/em> · <em>Terminó de leer el informe.<\/em> · <em>Dejó de fumar.<\/em> · <em>Llegó a dirigir la cooperativa.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>resultado (resultativa)<\/td>\n<td><em>tener<\/em>, <em>llevar<\/em>, <em>dejar<\/em> + participio<\/td>\n<td><em>Tengo escritas tres páginas.<\/em> · <em>Lleva leídos veinte libros.<\/em> · <em>Dejó preparada la cena.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>aspectual<\/strong><\/td>\n<td>costumbre (habitual)<\/td>\n<td><em>soler<\/em> + inf. · <em>acostumbrar (a)<\/em> + inf.<\/td>\n<td><em>Suele llegar a las ocho.<\/em> · <em>Acostumbra a repasar los martes.<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tres avisos de uso.<\/strong> El primero es una distinción que se recomienda y que un corrector puede contar; los otros dos son correctos, y se avisa porque circulan como errores:<\/p>\n<ul>\n<li><strong><em>Deber<\/em> y <em>deber de<\/em> no son lo mismo.<\/strong> <em>Debes estudiar<\/em> = obligación. <em>Debe de estar en casa<\/em> = suposición. La forma recomendada: si hay obligación, sin <em>de<\/em>. La RAE ya no censura <em>deber de<\/em> con obligación —lo registra en la lengua culta, con mucha menor frecuencia—. En el examen, la forma recomendada: es la única que ninguna norma discute. Para la suposición, <em>debe de<\/em> es la forma recomendada, y <em>debe<\/em> sin <em>de<\/em> también se admite.<\/li>\n<li><strong><em>Acostumbrar (a)<\/em> + infinitivo es correcto<\/strong> con el sentido de <em>soler<\/em>: <em>acostumbra a llover en otoño<\/em> y <em>suele llover en otoño<\/em> valen las dos.<\/li>\n<li><strong><em>Haber de<\/em> + infinitivo es correcto<\/strong>, y más formal que <em>tener que<\/em>; en Cataluña se usa más por el catalán <em>haver de<\/em>, y no es falta.<\/li>\n<\/ul>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Perífrasis? ¿De qué valor?", "dossier": {"cuaderno": "10", "ejercicio": 10}, "ayuda": "Aplica la prueba del <i>eso<\/i> al infinitivo o al gerundio. Si se puede sustituir por <i>eso<\/i>, es un complemento directo y no hay perífrasis; si no, es perífrasis: indica su valor.", "ops": ["no es perífrasis", "obligación", "probabilidad", "futuro próximo", "incoativa", "durativa", "terminativa", "resultativa"], "items": [{"enun": "Necesito hablar contigo.", "sol": "no es perífrasis", "porque": "<i>necesito eso<\/i> ✔: complemento directo"}, {"enun": "Tengo que hablar contigo.", "sol": "obligación", "porque": "perífrasis modal: <i>tengo que eso<\/i> no se dice"}, {"enun": "Voy a llamar al centro.", "sol": "futuro próximo", "porque": "perífrasis aspectual: <i>voy a eso<\/i> cambiaría el significado, «me dirijo allí»"}, {"enun": "Deseo aprobar en junio.", "sol": "no es perífrasis", "porque": "<i>deseo eso<\/i> ✔"}, {"enun": "Acabo de salir del trabajo.", "sol": "terminativa", "porque": "perífrasis aspectual: la acción acaba de terminar"}, {"enun": "Llevo tres años estudiando de noche.", "sol": "durativa", "porque": "perífrasis aspectual: <i>llevar<\/i> + gerundio"}, {"enun": "Quiero irme a casa.", "sol": "no es perífrasis", "porque": "<i>quiero eso<\/i> ✔"}, {"enun": "Empezó a llover a las seis.", "sol": "incoativa", "porque": "perífrasis aspectual: el comienzo de la acción"}, {"enun": "Prefiero estudiar por la mañana.", "sol": "no es perífrasis", "porque": "<i>prefiero eso<\/i> ✔"}, {"enun": "Debe de haber más de cien personas.", "sol": "probabilidad", "porque": "perífrasis modal: <i>deber de<\/i>, suposición"}, {"enun": "Dejó de fumar hace un año.", "sol": "terminativa", "porque": "perífrasis aspectual: <i>dejar de<\/i>"}, {"enun": "Intentó abrir la puerta.", "sol": "no es perífrasis", "porque": "<i>intentó eso<\/i> ✔"}, {"enun": "Va mejorando poco a poco.", "sol": "durativa", "porque": "perífrasis aspectual: <i>ir<\/i> + gerundio, un progreso"}, {"enun": "Tengo leídas las tres primeras páginas.", "sol": "resultativa", "porque": "perífrasis aspectual: <i>tener<\/i> + participio"}], "criterio": "En <i>necesito hablar<\/i>, <i>deseo aprobar<\/i>, <i>quiero irme<\/i>, <i>prefiero estudiar<\/i> e <i>intentó abrir<\/i> el primer verbo conserva su significado y el infinitivo se cambia por <i>eso<\/i>. En la perífrasis el primer verbo lo pierde: <i>voy a llamar<\/i> no significa que alguien vaya a ningún sitio.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 10, ejercicio 10"}, {"tipo": "justificar", "titulo": "Otra perífrasis del mismo valor", "dossier": {"cuaderno": "10", "ejercicio": 11}, "ayuda": "Escribe la frase con otra perífrasis que exprese lo mismo que la que va en cursiva.", "items": [{"enun": "<i>Debes<\/i> entregarlo el lunes.", "requiere": [["tienes que", "has de"]], "modelo": "«<b>Tienes que<\/b> entregarlo el lunes», «<b>Has de<\/b> entregarlo el lunes»: obligación"}, {"enun": "<i>Empezó a<\/i> llover a las seis.", "requiere": [["se puso a", "comenzo a"]], "modelo": "«<b>Se puso a<\/b> llover a las seis», «<b>Comenzó a<\/b> llover a las seis»: inicio"}, {"enun": "<i>Sigue trabajando<\/i> en el mismo sitio.", "requiere": [["continua"]], "modelo": "«<b>Continúa trabajando<\/b> en el mismo sitio»: duración"}, {"enun": "<i>Está a punto de<\/i> terminar la carrera.", "requiere": [["va a"]], "modelo": "«<b>Va a<\/b> terminar la carrera»: inminencia"}, {"enun": "<i>Debe de<\/i> tener unos cuarenta años.", "requiere": [["puede tener", "vendra a tener", "tiene que tener"]], "mod       var cuerpo = partes[i] + (partes[i + 1] || '');
      var es3 = /^<h3/i.test(partes[i]);
      if (es3) {
        for (var j = i + 2; j < partes.length && !/^<h3/i.test(partes[j]); j += 2)

  function teoriaDe(c, ej) {

    }
    var bs = bloquesTeoria(c.teoria), ap = ej.apoyo;
    var parcial = ap && ap !== 'todo' && bs.length > 1;
    if (parcial) {
      var elegidos = bs.filter(function (b) {
        return (b.titulo === '' && ap.indexOf('intro') >= 0) || (b.titulo && ap.indexOf(b.titulo) >= 0);
      }).filter(function (b) {
        /* un subapartado cuyo apartado también se enseña ya va dentro de él */
        return !(b.padre && ap.indexOf(b.padre) >= 0);
      });
      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');

        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }

    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;

  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));

    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;

    }

    function cambio() {
      e.hecho = false;

    }

    (ej.items || []).forEach(function (it, i) {

      fila.appendChild(lin);

      var campo;

          b.onclick = function () {

            b.setAttribute('aria-pressed', 'true');

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);

          w.onclick = function () {

            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }

          };

      } else { /* hueco */

    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {

          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };

          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();

  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
