<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 15 · 17 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}

.textoexamen .ln.blanca{height:9px}

  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;

@media(max-width:560px){.ej-dossier{margin-left:0}}

.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);

.terna{color:var(--tinta2);white-space:nowrap}

.nb{white-space:nowrap}

<script>window.DIA = {"dia": 15, "fecha": "2026-11-17", "tab": "Día 15 · 17 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 15", "h1": "Martes 17 de noviembre", "sub": "La concordancia y el final de la oración · el texto explicativo · el adverbio y las preposiciones", "carriles": [{"chapa": "Carril A", "titulo": "La concordancia y el final de la oración", "meta": "15 minutos · la falta que no se localiza releyendo letras y la coma donde va un punto", "cuaderno": {"nudo": "4bis", "apartados": [4, 5], "ejercicios": [9, 10, 13]}, "teoria": "<h3>4 · La concordancia<\/h3>\n<p>La concordancia <strong>no se localiza releyendo letras<\/strong>. No va en la Cuenta C, la de ortografía, sino en la <strong>Cuenta B<\/strong>, la de cohesión: <strong>0,75<\/strong>. Y en los bloques 1 y 2 descuenta 0,1 igual que una falta de letras.<\/p>\n<p>Concordar es ponerse de acuerdo:<\/p>\n<ul>\n<li><strong>sujeto y verbo<\/strong>, en número y persona: <em>los cazadores <b>aseguran<\/b> amar a los animales<\/em>.<\/li>\n<li><strong>nombre, determinante y adjetivo<\/strong>, en género y número: <em>una larga, cruel <b>agonía<\/b><\/em>.<\/li>\n<\/ul>\n<p>Los cuatro sitios donde se rompe:<\/p>\n<p><strong>1. El sujeto largo.<\/strong> Si entre sujeto y verbo hay muchas palabras, el verbo se va con la última que has oído. Este de 2015:<\/p>\n<blockquote>\n<p>«<strong>El futuro<\/strong> de O Couto, un paraje de A Costa da Morte habitado por una población envejecida y menguante, <strong>está<\/strong> en manos de un grupo de investigadores […] <strong>especializado<\/strong> en resucitar aldeas.»<\/p>\n<\/blockquote>\n<p><em>Está<\/em>, no «están»: el sujeto es <em>el futuro<\/em>. Y <em>especializado<\/em>, no «especializados»: acompaña a <em>grupo<\/em>. Salta lo que va entre comas y el sujeto queda al lado del verbo.<\/p>\n<p><strong>2. Los colectivos van en singular… con una excepción.<\/strong> <em>La gente<\/em>, <em>todo el mundo<\/em>: <strong>piensa<\/strong>, no «piensan». Pero cuando el colectivo lleva detrás <em>de<\/em> + plural —<em>la mayoría <b>de los alumnos<\/b><\/em>, <em>un grupo <b>de vecinos<\/b><\/em>— <strong>las dos concordancias son correctas<\/strong>: <em>aprobó<\/em> y <em>aprobaron<\/em>. Ninguna de las dos es falta. Si dudas, elige el singular.<\/p>\n<p><strong>3. <em>Haber<\/em> impersonal no tiene plural.<\/strong> Cuando significa «existir»: <em>hay<\/em>, <em>había<\/em>, <em>hubo<\/em>. <strong>«Habían muchos cazadores» es falta<\/strong>: <em>había muchos cazadores<\/em>.<\/p>\n<p><strong>4. Un adjetivo con dos nombres.<\/strong> Si son de distinto género, va en masculino plural: <em>un texto y una foto <b>elegidos<\/b><\/em>.<\/p>\n<blockquote>\n<p><strong>Y un contenido que aquí no está, a propósito: la mayúscula.<\/strong> Va con la puntuación, en el nudo 14, que se estudia en febrero. Si en tus textos aparecen mayúsculas mal puestas, se señalan y se dejan hasta entonces.<\/p>\n<\/blockquote>\n<h3>5 · Dónde termina la oración<\/h3>\n<p>La banda de cohesión de la redacción (0,75) cuenta la puntuación, y en cuatro de los seis modelos medios y bajos del nudo 18 el error que más se repite es la coma donde iba un punto: «los cazadores matan a los animales por diversión y eso no es un deporte, hay cazadores que tratan muy mal a sus perros». Son dos oraciones, cada una con su verbo y su sujeto, y entre dos oraciones así va un punto, no una coma. La puntuación entera se estudia en febrero, en el nudo 14; lo que hace falta ahora es localizar el final de cada oración.<\/p>\n<p><strong>Cómo se localiza.<\/strong> Se buscan los verbos conjugados. Cada verbo que no depende de otro —que no lleva delante <em>que<\/em>, <em>porque<\/em>, <em>cuando<\/em>, <em>si<\/em>, <em>aunque<\/em>— abre una oración nueva, y delante de ella va punto (o punto y coma), salvo que <em>y<\/em>, <em>pero<\/em> u <em>o<\/em> la una a la anterior: «Mi tío tenía unas tierras y las vendió» son dos verbos y una sola oración. En «la caza está muy mal porque los animales también tienen derecho a vivir, los cazadores matan a los animales por diversión» hay tres verbos: <em>está<\/em> abre la oración, <em>tienen<\/em> depende de <em>porque<\/em> y sigue en la misma, y <em>matan<\/em> no depende de nada: ahí empieza otra, y la coma tiene que ser un punto.<\/p>\n<p><strong>Dos comas que no se ponen:<\/strong> entre el sujeto y el verbo —«Los agricultores de la comarca protestaron», sin coma aunque el sujeto sea largo— y entre el verbo y su complemento directo —«El corrector cuenta las faltas»—.<\/p>\n<p><strong>Las que sí van:<\/strong> detrás del conector que abre la oración (<em>En primer lugar,<\/em> <em>Además,<\/em> <em>Sin embargo,<\/em>) y delante de <em>pero<\/em>.<\/p>\n<p>Cada coma puesta por punto es un error de la Cuenta B de la hoja A-1; a partir del tercero, cada dos bajan un tramo.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "Corrige e indica el caso", "dossier": {"cuaderno": "4bis", "ejercicio": 9}, "ayuda": "Cada frase tiene una falta de concordancia. Escribe la forma corregida y el caso del apartado 4: sujeto largo, colectivo, <i>haber<\/i> impersonal o adjetivo con dos nombres.", "items": [{"enun": "Habían tres personas esperando.", "requiere": [["habia"], ["impersonal", "haber"]], "modelo": "«Había tres personas esperando»: caso 3, <i>haber<\/i> impersonal"}, {"enun": "La gente ya no leen en papel.", "requiere": [["no lee", "lee"], ["colectivo"]], "modelo": "«La gente ya no lee en papel»: caso 2, colectivo"}, {"enun": "El uso de las redes sociales entre los jóvenes han crecido.", "requiere": [["ha crecido"], ["sujeto"]], "modelo": "«El uso de las redes sociales entre los jóvenes ha crecido»: caso 1, sujeto largo; el sujeto es <i>el uso<\/i>"}, {"enun": "Todo el mundo saben lo que pasó aquel día.", "requiere": [["sabe"], ["colectivo"]], "modelo": "«Todo el mundo sabe lo que pasó aquel día»: caso 2, colectivo"}, {"enun": "Compró una mesa y un armario nuevas.", "requiere": [["nuevos"], ["dos nombres", "masculino", "adjetivo"]], "modelo": "«Compró una mesa y un armario nuevos»: caso 4, adjetivo con dos nombres, en masculino plural"}, {"enun": "Hubieron muchas quejas.", "requiere": [["hubo"], ["impersonal", "haber"]], "modelo": "«Hubo muchas quejas»: caso 3, <i>haber<\/i> impersonal"}], "criterio": "En <i>el uso de las redes sociales entre los jóvenes<\/i>, el verbo concuerda con <i>el uso<\/i>: se salta lo que va en medio. <i>La gente<\/i> y <i>todo el mundo<\/i> van en singular. <i>Haber<\/i> cuando significa «existir» no tiene plural. Un adjetivo con dos nombres de distinto género va en masculino plural.", "pide": "la forma corregida y el caso", "apoyo": ["4 · La concordancia"], "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 9"}, {"tipo": "opcion", "titulo": "Salta lo que va entre comas", "dossier": {"cuaderno": "4bis", "ejercicio": 10}, "ayuda": "Localiza el sujeto saltando lo que va en medio y elige el verbo que le corresponde.", "items": [{"enun": "El futuro de estos pueblos, vacíos desde hace treinta años, <b>(depende / dependen)<\/b> de una decisión política.", "sol": "depende", "porque": "el sujeto es <i>el futuro<\/i>", "ops": ["depende", "dependen"]}, {"enun": "La opinión de los cazadores que la autora llama decentes <b>(importa / importan)<\/b> poco en el texto.", "sol": "importa", "porque": "el sujeto es <i>la opinión<\/i>", "ops": ["importan", "importa"]}], "criterio": "<i>El futuro de estos pueblos, vacíos desde hace treinta años<\/i>: el sujeto es <i>el futuro<\/i>, en singular, y el plural de <i>pueblos<\/i> no cuenta. En la segunda frase, el sujeto es <i>la opinión<\/i>, no <i>los cazadores<\/i>.", "apoyo": ["4 · La concordancia"], "usa_texto": false, "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 10"}, {"tipo": "hueco", "titulo": "Salta lo que hay en medio", "estricto": true, "ayuda": "Escribe el verbo o el adjetivo en la forma que corresponda. Salta lo que va entre el sujeto y el verbo.", "items": [{"enun": "El futuro de estas aldeas, habitadas por gente mayor, ______ en juego. <i>(estar)<\/i>", "sol": "está", "porque": "el sujeto es <i>el futuro<\/i>, no <i>las aldeas<\/i>"}, {"enun": "Un grupo de investigadores ______ en resucitar pueblos. <i>(especializado)<\/i>", "sol": "especializado", "porque": "acompaña a <i>grupo<\/i>"}, {"enun": "La caja de herramientas que dejaron los del turno anterior ______ vacía. <i>(estar)<\/i>", "sol": "estaba|está"}, {"enun": "El precio de los alquileres ______ subido otra vez. <i>(haber)<\/i>", "sol": "ha"}, {"enun": "Las cifras que dio el informe del año pasado ______ equivocadas. <i>(estar)<\/i>", "sol": "estaban|están", "porque": "aquí el sujeto sí es plural: <i>las cifras<\/i>"}, {"enun": "Un texto y una foto bien ______. <i>(elegido)<\/i>", "sol": "elegidos", "porque": "dos nombres de distinto género: masculino plural"}], "criterio": "Saltar lo de en medio resuelve cinco de los seis. El del adjetivo con dos nombres es otra regla: cuando un adjetivo acompaña a <b>dos<\/b> nombres de distinto género, va en masculino plural.<br><br>Y <i>las cifras<\/i> <b>sí<\/b> van en plural: saltar lo de en medio no significa poner siempre singular, sino localizar el sujeto.", "apoyo": ["4 · La concordancia"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Es falta?", "ayuda": "Diez frases. Decide si hay error de concordancia.", "ops": ["es falta", "está bien"], "items": [{"enun": "Hubo protestas en tres barrios.", "sol": "está bien"}, {"enun": "Se vendieron dos pisos y una plaza baratos.", "sol": "está bien", "porque": "dos nombres de distinto género: masculino plural"}, {"enun": "Un grupo de vecinos acudió al pleno.", "sol": "está bien"}, {"enun": "En la sala habían sillas para todos.", "sol": "es falta", "porque": "<i>había sillas<\/i>: <i>haber<\/i> impersonal no tiene plural"}, {"enun": "El público aplaudieron al final.", "sol": "es falta", "porque": "<i>aplaudió<\/i>: <i>el público<\/i> es un colectivo sin <i>de<\/i>"}, {"enun": "Se alquilaron dos plazas y un trastero nuevas.", "sol": "es falta", "porque": "distinto género: <b>nuevos<\/b>"}, {"enun": "La mayoría de los vecinos firmaron.", "sol": "está bien", "porque": "colectivo + <i>de<\/i> + plural: las dos concordancias valen"}, {"enun": "El grupo de investigadores están especializados en aldeas.", "sol": "es falta", "porque": "el sujeto es <i>el grupo<\/i>: <b>está especializado<\/b>"}, {"enun": "La gente piensan que es caro.", "sol": "es falta", "porque": "colectivo sin <i>de<\/i> + plural: singular"}, {"enun": "La mayoría de los vecinos firmó.", "sol": "está bien", "porque": "la otra, también"}], "criterio": "Las dos de <i>la mayoría de<\/i> están bien las dos: el colectivo con <i>de<\/i> admite el singular y el plural. No hay elección en los colectivos sin <i>de<\/i> —<i>la gente<\/i>, <i>el público<\/i>— ni en <i>haber<\/i> impersonal.", "apoyo": ["4 · La concordancia"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las concordancias", "ayuda": "Cuatro palabras de este párrafo no concuerdan. <b>Pincha en ellas.<\/b> Recuerda: la concordancia no se localiza buscando letras.", "items": [{"texto": "El precio de los alquileres del barrio han subido un veinte por ciento, y la gente dicen que no llegan. Habían tres pisos libres en enero y ahora no queda ninguno. Se alquilaron una plaza y un trastero nuevas la semana pasada.", "faltas": {"han": "ha — el sujeto es <i>el precio<\/i>", "dicen": "dice — <i>la gente<\/i> es colectivo, singular", "Habían": "Había — <i>haber<\/i> impersonal no tiene plural", "nuevas": "nuevos — dos nombres de distinto género: masculino plural"}}], "criterio": "Las cuatro corresponden a los cuatro sitios de la teoría, uno por cada uno: sujeto largo, colectivo, <i>haber<\/i> impersonal y adjetivo con dos nombres.<br><br>Y ninguna de las cuatro tiene una letra mal. Por eso van en la cuenta B y por eso se escapan en la última lectura, dedicada a la ortografía.", "apoyo": ["4 · La concordancia"], "solo_web": true}, {"tipo": "cazar", "titulo": "Pon los puntos que faltan", "ayuda": "Cada texto tiene cuatro oraciones pegadas con comas: en <b>tres sitios<\/b> de cada uno hay una coma donde va un punto. <b>Pincha la palabra que va justo antes de esa coma.<\/b> Al escribirlo, detrás de cada punto nuevo iría mayúscula.", "items": [{"texto": "El piso está a cuarenta minutos del trabajo, lo cogimos porque no había nada más cerca por ese dinero, el casero subió el alquiler a los seis meses, ahora buscamos otro.", "faltas": {"trabajo": "trabajo.", "dinero": "dinero.", "meses": "meses."}}, {"texto": "Mi tío tenía unas tierras en el pueblo y las vendió, no sacaba nada de ellas, ahora hay naves donde estaban los olivos, la gente de ciudad no sabe lo que cuesta un kilo de tomates.", "faltas": {"vendió": "vendió.", "ellas": "ellas.", "olivos": "olivos."}}], "criterio": "En el texto del piso abren oración <i>está<\/i>, <i>cogimos<\/i>, <i>subió<\/i> y <i>buscamos<\/i>; <i>había<\/i> depende de <i>porque<\/i> y no abre ninguna. En el texto del tío, <i>vendió<\/i> va unido a <i>tenía<\/i> por <i>y<\/i>, en la misma oración; <i>estaban<\/i> depende de <i>donde<\/i> y <i>cuesta<\/i> de <i>lo que<\/i>. Tres puntos en cada texto, ni uno más: el corrector cuenta cada coma que hace de punto, y también cada punto que parte una oración por la mitad («Lo cogimos. Porque no había nada más cerca» es otro error).", "apoyo": ["5 · Dónde termina la oración"], "dossier": {"cuaderno": "4bis", "ejercicio": 13}, "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 13"}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartados 4 y 5: La concordancia; Dónde termina la oración (p. 36 y 37) · ejercicios 9, 10 y 13", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El texto explicativo", "meta": "25 minutos · explicar no es opinar", "cuaderno": {"nudo": 18, "apartados": [4], "ejercicios": [5, 6]}, "lectura": {"titulo": "Las dos mitades de una factura", "entrada": "Texto explicativo · <b>inventado para practicar<\/b>. No es una columna de opinión: aquí nadie defiende nada, se explica cómo funciona algo.", "lineas": ["Una factura de la luz tiene dos partes, y casi todo el desconcierto", "viene de confundirlas. La primera es lo que se paga por estar", "conectado, aunque no se encienda nada. La segunda es lo que se paga por", "lo que se ha gastado.", "", "A la primera se la llama término de potencia. La potencia es el máximo", "que la instalación puede dar a la vez: cuántos aparatos se pueden tener", "encendidos sin que salte el automático. Se contrata en kilovatios y se", "paga por días, tenga uno la casa vacía o llena.", "", "A la segunda se la llama término de energía, y se mide en kilovatios", "hora. Un kilovatio hora es lo que gasta un aparato de mil vatios", "funcionando una hora seguida. Una vitrocerámica ronda los dos mil", "vatios; una bombilla led, ocho.", "", "De ahí salen las dos maneras de bajar el recibo, que no son la misma.", "Bajar la potencia contratada abarata el primer término y no toca el", "segundo: se paga menos cada día, pero salta el automático si se juntan", "demasiados aparatos. Gastar menos abarata el segundo y no toca el", "primero.", "", "Hay además un tercer bloque que no depende de la compañía: impuestos y", "alquiler del contador. Aparecen al final, no se negocian y suelen ser la", "razón por la que dos facturas con el mismo consumo no dan lo mismo en", "meses distintos.", "", "Y una advertencia práctica. Cuando alguien ofrece por teléfono una", "tarifa más barata, conviene preguntar cuál de los dos términos baja. Si", "baja el de energía y sube el de potencia, una casa que consume poco", "puede acabar pagando más."], "pie": "Texto inventado con fines didácticos."}, "teoria": "<h3>4 · El explicativo o expositivo<\/h3>\n<p><strong>Aviso primero: el texto explicativo —el examen lo llama <em>expositivo<\/em>— no ha caído nunca como opción A.<\/strong> Solo una vez, en 2017, apareció como <strong>opción B<\/strong>: «<em>Redacte un texto expositivo en el que explique los rasgos y hechos más destacados de un personaje real al que admire y explique argumentadamente el porqué de esa admiración<\/em>».<\/p>\n<p>Sirve para tres tareas de este examen:<\/p>\n<ol>\n<li><strong>Las preguntas abiertas se contestan con un explicativo en miniatura.<\/strong> Cuando el enunciado pide «explique», está pidiendo esto: información ordenada, sin opinión, con conectores.<\/li>\n<li><strong>El resumen es un texto explicativo.<\/strong> «Sin marcas de subjetividad» es exactamente la definición de este tipo de texto.<\/li>\n<li><strong>Constituye la mitad de un argumentativo.<\/strong> Los argumentos de la opción A son explicaciones; lo que añade el argumentativo es la tesis y la intención de convencer.<\/li>\n<\/ol>\n<p><strong>La diferencia, en una línea:<\/strong> el explicativo quiere que <strong>entiendas<\/strong>; el argumentativo quiere que <strong>estés de acuerdo<\/strong>. Y en cuatro:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>argumentativo<\/th>\n<th>explicativo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>qué busca<\/td>\n<td>que estés de acuerdo<\/td>\n<td>que entiendas<\/td>\n<\/tr>\n<tr>\n<td>quién habla<\/td>\n<td>alguien con una postura<\/td>\n<td>nadie: sin marcas de opinión (<em>creo<\/em>, <em>me parece<\/em>)<\/td>\n<\/tr>\n<tr>\n<td>cómo empieza<\/td>\n<td>con una tesis discutible<\/td>\n<td>con lo que se va a explicar<\/td>\n<\/tr>\n<tr>\n<td>cómo cierra<\/td>\n<td>con una consecuencia<\/td>\n<td>con lo práctico o con un aviso<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>rasgo<\/th>\n<th>cómo se nota<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>objetividad<\/strong><\/td>\n<td>tercera persona; nada de <em>creo<\/em>, <em>me parece<\/em>, <em>por desgracia<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>orden explícito<\/strong><\/td>\n<td><em>en primer lugar<\/em>, <em>por otra parte<\/em>, <em>finalmente<\/em>, <em>es decir<\/em>, <em>por ejemplo<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>claridad léxica<\/strong><\/td>\n<td>si aparece un término técnico, se define ahí mismo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y su estructura: <strong>introducción<\/strong> (de qué voy a hablar), <strong>desarrollo<\/strong> (los datos, ordenados) y <strong>conclusión<\/strong> (lo que se recoge de todo ello). Tres partes, igual que el argumentativo, con distinto contenido. Dentro de ellas, cuatro movimientos: <strong>presentar<\/strong> lo que se va a explicar, en una frase; <strong>definir<\/strong> los términos que hagan falta, sin añadir otros; <strong>ordenar<\/strong>, de lo general a lo concreto o por partes; y <strong>cerrar<\/strong> con lo que le sirve a quien lee.<\/p>\n<p><strong>El detector:<\/strong> si la frase se puede <strong>discutir<\/strong>, es argumentativa. Si solo se puede <strong>comprobar<\/strong>, es explicativa.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Explicativa o argumentativa?", "dossier": {"cuaderno": "18", "ejercicio": 5, "parte": "la clase"}, "ayuda": "Seis frases: cinco del dossier y una añadida aquí. Indica si cada una explica o argumenta.", "ops": ["explicativa", "argumentativa"], "items": [{"enun": "«El pistacho necesita una poda anual muy cuidadosa.»", "sol": "explicativa", "porque": "da un dato que se puede comprobar"}, {"enun": "«Es una vergüenza lo poco que cobra un agricultor.»", "sol": "argumentativa", "porque": "«es una vergüenza» es una marca de subjetividad"}, {"enun": "«La cubierta vegetal consiste en dejar crecer plantas autóctonas entre los árboles.»", "sol": "explicativa", "porque": "define una técnica"}, {"enun": "«Los intermediarios se quedan una parte del precio final.»", "sol": "explicativa", "porque": "da un dato que se puede comprobar"}, {"enun": "«Deberíamos comprar productos de proximidad.»", "sol": "argumentativa", "porque": "hace una propuesta: <i>deberíamos<\/i>"}, {"enun": "«Los supermercados tendrían que pagar más a los agricultores por la fruta.»", "sol": "argumentativa", "porque": "hace una propuesta: <i>tendrían que<\/i>"}], "criterio": "La frase explicativa da un dato que se puede comprobar. La argumentativa toma postura: con una marca de opinión (<i>es una vergüenza<\/i>) o con una propuesta (<i>deberíamos<\/i>, <i>tendrían que<\/i>).", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 5 · la clase"}, {"tipo": "abierta", "titulo": "Reescríbelas como explicativas", "dossier": {"cuaderno": "18", "ejercicio": 5, "parte": "la reescritura"}, "ayuda": "Las dos argumentativas del dossier. Reescribe cada una como una frase explicativa, sin opinión ni propuesta.", "items": [{"enun": "«Es una vergüenza lo poco que cobra un agricultor.»", "modelo": "«El precio que recibe el agricultor por su producto es muy inferior al que paga el consumidor.»"}, {"enun": "«Deberíamos comprar productos de proximidad.»", "modelo": "«Los productos de proximidad recorren menos distancia entre el productor y el consumidor.»"}], "criterio": "La versión explicativa conserva el asunto y cambia la postura por un dato: la diferencia entre lo que cobra el agricultor y lo que paga el consumidor, la distancia que recorren los productos de proximidad.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 5 · la reescritura"}, {"tipo": "abierta", "titulo": "Una introducción explicativa", "dossier": {"cuaderno": "18", "ejercicio": 6}, "ayuda": "Escribe una introducción explicativa de dos frases, unas 25 palabras.", "items": [{"enun": "Tema: <i>cómo funciona una cooperativa agrícola<\/i>.", "modelo": "Dos modelos debajo, los de la clave del dossier.", "palabras": {"min": 20, "max": 35}}], "criterio": "La primera frase define y la segunda anuncia el desarrollo, sin ninguna marca de opinión.", "usa_texto": false, "modelos": ["«Una cooperativa agrícola es una empresa formada por los propios agricultores. Su función principal es reunir la producción de todos sus socios para venderla en mejores condiciones.» (27 palabras)", "«Las cooperativas agrarias agrupan a productores de una misma zona. Existen para reducir costes y para negociar el precio de venta con más fuerza de la que tendría cada agricultor por separado.» (32 palabras)"], "apoyo": "todo", "dossier_txt": "Del dossier: nudo 18, ejercicio 6"}, {"tipo": "hueco", "titulo": "Los cuatro movimientos: ¿en qué línea?", "ayuda": "Escribe el número de la línea donde empieza cada uno.", "items": [{"enun": "Dónde <b>presenta<\/b> lo que va a explicar", "sol": "1|2"}, {"enun": "Dónde <b>define<\/b> qué es la potencia", "sol": "5|6"}, {"enun": "Dónde saca la <b>consecuencia práctica<\/b> de las dos definiciones", "sol": "13|14"}, {"enun": "Dónde está el <b>aviso final<\/b>", "sol": "22|23"}], "criterio": "Los cuatro movimientos van en ese orden y ocupan párrafos enteros. El texto <b>no afirma en ningún momento qué le parece<\/b> el precio de la luz: explica cómo se compone y deja que el lector decida. Una columna de opinión haría lo contrario: afirmaría si le parece caro y daría razones.", "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Explica u opina?", "ayuda": "Las once son sobre la factura de la luz. Marca <b>explica<\/b> si la frase se puede comprobar y <b>opina<\/b> si se puede discutir.", "ops": ["explica", "opina"], "items": [{"enun": "Si baja el término de energía y sube el de potencia, una casa que consume poco puede pagar más.", "sol": "explica"}, {"enun": "Habría que prohibir esas llamadas comerciales.", "sol": "opina"}, {"enun": "El alquiler del contador aparece como un concepto aparte.", "sol": "explica"}, {"enun": "Los impuestos aparecen al final y no se negocian.", "sol": "explica"}, {"enun": "Cualquiera con dos dedos de frente entendería que esto hay que cambiarlo.", "sol": "opina"}, {"enun": "La potencia contratada es el máximo que la instalación puede dar a la vez.", "sol": "explica"}, {"enun": "Bajar la potencia abarata el primer término y no toca el segundo.", "sol": "explica"}, {"enun": "Un kilovatio hora equivale al consumo de un aparato de mil vatios durante una hora.", "sol": "explica"}, {"enun": "Es vergonzoso lo que cobran las eléctricas.", "sol": "opina"}, {"enun": "Nadie entiende una factura, y eso está hecho a propósito.", "sol": "opina", "porque": "la segunda mitad atribuye una intención: eso ya es una tesis"}, {"enun": "Las compañías se aprovechan de que nadie lee la letra pequeña.", "sol": "opina"}], "criterio": "La prueba práctica: una frase que <b>explica<\/b> se puede comprobar, y una que <b>opina<\/b> se puede discutir. «Un kilovatio hora equivale…» se comprueba; «es vergonzoso» se discute.<br><br>La de «nadie entiende una factura», que empieza explicando y acaba opinando en la misma frase. La subjetividad entra sobre todo por esa vía, también en el resumen.", "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}, {"tipo": "abierta", "titulo": "Explica algo en cien palabras · 10 minutos", "ayuda": "Los cuatro movimientos, sin opinar ni una vez. Elige algo que sepas explicar de memoria.", "items": [{"enun": "Explica cómo funciona algo que conozcas: una nómina, un abono de transporte, una receta, una máquina de tu trabajo.", "modelo": "Dos modelos abajo, sobre asuntos distintos."}], "modelos": ["<b>Una nómina · 95 palabras.<\/b> Una nómina tiene dos columnas que casi nunca se leen juntas. La primera suma: el salario base, los complementos y las horas extra, y da el bruto. La segunda resta: la cotización a la Seguridad Social, que es un porcentaje fijo, y la retención del IRPF, que depende de lo que se gana y de la situación familiar. El líquido resulta de esa resta. De ahí sale una consecuencia práctica: cuando alguien dice que cobra tanto, conviene preguntar si habla del bruto o del líquido, porque entre los dos puede haber un veinte por ciento.", "<b>Un abono de transporte · 87 palabras.<\/b> El abono mensual se compone de dos decisiones: cuántas zonas se cruzan y qué tipo de usuario es cada uno. Las zonas se cuentan por el recorrido más largo que se vaya a hacer, no por el habitual; si una sola vez al mes se cruza una zona de más, hay que pagarla igual. El tipo de usuario aplica descuentos por edad, familia numerosa o desempleo, y se acredita una vez al año. Conviene revisarlo cada enero: mucha gente paga la tarifa general teniendo derecho a otra."], "criterio": "Compara los dos cierres: los dos acaban con algo que le sirve a quien lee, y ninguno afirma si le parece bien o mal.<br><br>Y los dos arranques presentan la estructura antes de entrar en las partes. Quien empieza por un detalle obliga al lector a esperar para saber de qué va.", "palabras": {"objetivo": 100}, "apoyo": ["4 · El explicativo o expositivo"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 4: El explicativo o expositivo (p. 68) · ejercicios 5 y 6", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El adverbio y las preposiciones", "meta": "45 minutos · adverbios y locuciones, la preposición que pide el verbo y el complemento de régimen frente al directo", "cuaderno": [{"nudo": 11, "apartados": [1], "ejercicios": [1, 2, 3]}, {"nudo": 11, "apartados": [2], "ejercicios": [5, 6, 7, 8]}], "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> este nudo aparece en dos ejercicios distintos. En el de <strong>expresión equivalente<\/strong> —1 punto hasta 2023 y 0,75 desde 2024— casi todo lo que mandan sustituir son adverbios, locuciones adverbiales o conjunciones. Y en el de <strong>función sintáctica<\/strong>, la mayoría de los sintagmas se resuelven con una sola pregunta: ¿el verbo arrastra preposición o no?<\/div>\n<blockquote>\n<p>Son las palabras que <strong>no cambian<\/strong>: no tienen género ni número, se escriben siempre igual.<\/p>\n<\/blockquote>\n<h3>1 · El adverbio<\/h3>\n<p><strong>El adverbio modifica<\/strong>, y modifica tres clases de palabra: un verbo (<em>llegó<\/em> <strong>tarde<\/strong>), un adjetivo (<em>es<\/em> <strong>muy<\/strong> <em>caro<\/em>) u otro adverbio (<em>bastante<\/em> <strong>lejos<\/strong>).<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>lugar<\/td>\n<td>aquí, allí, cerca, lejos, delante, fuera, arriba<\/td>\n<\/tr>\n<tr>\n<td>tiempo<\/td>\n<td>ayer, hoy, luego, todavía, siempre, mientras<\/td>\n<\/tr>\n<tr>\n<td>modo<\/td>\n<td>bien, mal, deprisa, así, despacio<\/td>\n<\/tr>\n<tr>\n<td>cantidad<\/td>\n<td>mucho, poco, bastante, demasiado, casi, más<\/td>\n<\/tr>\n<tr>\n<td>afirmación<\/td>\n<td>sí, también, ciertamente<\/td>\n<\/tr>\n<tr>\n<td>negación<\/td>\n<td>no, tampoco, nunca, jamás<\/td>\n<\/tr>\n<tr>\n<td>duda<\/td>\n<td>quizá, acaso, tal vez<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Locuciones adverbiales<\/strong>: dos o más palabras que funcionan como un adverbio. El ejercicio de expresión equivalente pide sustituirlas por otra que diga lo mismo, y casi siempre hay un adverbio en <em>-mente<\/em> que sirve. Media docena de estas han caído literalmente en el examen.<\/p>\n<table>\n<thead>\n<tr>\n<th>locución<\/th>\n<th>clase<\/th>\n<th>equivalentes que valen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a menudo<\/td>\n<td>tiempo<\/td>\n<td>frecuentemente, con frecuencia, muchas veces<\/td>\n<\/tr>\n<tr>\n<td>de vez en cuando · en ocasiones<\/td>\n<td>tiempo<\/td>\n<td>a veces, ocasionalmente, algunas veces<\/td>\n<\/tr>\n<tr>\n<td>a diario<\/td>\n<td>tiempo<\/td>\n<td>diariamente, cada día, todos los días<\/td>\n<\/tr>\n<tr>\n<td>de repente · de pronto<\/td>\n<td>modo<\/td>\n<td>repentinamente, súbitamente, de golpe<\/td>\n<\/tr>\n<tr>\n<td>de nuevo<\/td>\n<td>tiempo<\/td>\n<td>otra vez, nuevamente<\/td>\n<\/tr>\n<tr>\n<td>en seguida<\/td>\n<td>tiempo<\/td>\n<td>inmediatamente, al momento<\/td>\n<\/tr>\n<tr>\n<td>poco a poco<\/td>\n<td>modo<\/td>\n<td>gradualmente, despacio, paulatinamente<\/td>\n<\/tr>\n<tr>\n<td>al final · por fin<\/td>\n<td>tiempo<\/td>\n<td>finalmente, por último<\/td>\n<\/tr>\n<tr>\n<td>sin duda<\/td>\n<td>afirmación<\/td>\n<td>indudablemente, ciertamente, seguro<\/td>\n<\/tr>\n<tr>\n<td>tal vez · a lo mejor<\/td>\n<td>duda<\/td>\n<td>quizá, quizás, acaso, posiblemente<\/td>\n<\/tr>\n<tr>\n<td>sobre todo<\/td>\n<td>cantidad<\/td>\n<td>especialmente, principalmente<\/td>\n<\/tr>\n<tr>\n<td>a lo lejos · a la derecha<\/td>\n<td>lugar<\/td>\n<td>lejos, allí; al lado derecho<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un aviso de ortografía: <em>sobre todo<\/em> y <em>tal vez<\/em> se escriben en dos palabras; la clave de 2017 glosa «sobre todo» como «especialmente».<\/p>\n<p><strong>Los adverbios en <em>-mente<\/em><\/strong> se forman sobre el femenino del adjetivo (<em>rápida<\/em> → <em>rápidamente<\/em>) y <strong>conservan la tilde del adjetivo<\/strong>: <em>fácil<\/em> → <em>fácilmente<\/em>. Si van dos seguidos, solo el último lleva <em>-mente<\/em>; el primero queda en femenino y conserva su tilde: <em>habló clara y rápidamente<\/em>, <em>lo hizo rápida y fácilmente<\/em>.<\/p>\n<p><strong>Tres parejas que hay que dejar cerradas:<\/strong><\/p>\n<ul>\n<li><strong>muy / mucho<\/strong>: <em>muy<\/em> va delante de adjetivo o adverbio (<em>muy caro<\/em>, <em>muy lejos<\/em>); <em>mucho<\/em> va con el verbo (<em>come mucho<\/em>). Excepción: delante de <em>mayor, menor, mejor, peor<\/em> y de <em>más<\/em> se dice <em>mucho<\/em> (<em>mucho mejor<\/em>, <em>mucho más caro<\/em>).<\/li>\n<li><strong>aún / aun<\/strong>: con tilde cuando significa 'todavía' (<em>aún no ha llegado<\/em>); sin tilde cuando significa 'incluso' (<em>aun así lo hizo<\/em>). Las dos han caído: en 2020 pedían el equivalente de <em>aún<\/em> (→ <em>todavía<\/em>) y en 2021 el de <em>aun<\/em> (→ <em>incluso<\/em>).<\/li>\n<li><strong><em>solo<\/em> no necesita tilde<\/strong> desde la Ortografía de 2010, tampoco cuando significa 'solamente': sin tilde nunca es falta (nudo 3). En 2022 cayó como ítem, y la clave dio <em>solamente, únicamente, exclusivamente<\/em>.<\/li>\n<\/ul>\n<p>Y una falta frecuente: <strong>el adverbio no concuerda<\/strong>. <em>Están medio dormidas<\/em>, no <em>medias dormidas<\/em>. <em>Trabajan duro<\/em>, no <em>duros<\/em>.<\/p>\n<h3>2 · La preposición<\/h3>\n<p><strong>Ningún otro apartado del trimestre cubre tantos ítems.<\/strong> De los 32 sintagmas de función sintáctica, <strong>17 se deciden aquí<\/strong>: los 13 complementos directos y los 4 de régimen. La sintaxis llega en el segundo trimestre; ahora hace falta un solo dato: <strong>hay verbos que van pegados a una preposición y no la sueltan<\/strong>.<\/p>\n<p><strong>Qué es una preposición.<\/strong> Una palabra invariable que sola no significa nada y que siempre arrastra algo detrás. La lista está cerrada y <strong>se aprende de memoria<\/strong>:<\/p>\n<blockquote>\n<p>a · ante · bajo · con · contra · de · desde · durante · en · entre · hacia · hasta · mediante · para · por · según · sin · sobre · tras · versus · vía<\/p>\n<\/blockquote>\n<p>(Algunas listas añaden <em>cabe<\/em> y <em>so<\/em>, que ya no usa nadie, y <em>salvo<\/em>, que la mayoría de gramáticas trata aparte.)<\/p>\n<p><strong>Locuciones preposicionales<\/strong>: <em>a falta de, a lo largo de, gracias a, en torno a, a pesar de, delante de, encima de, debajo de, junto a, rumbo a, en lugar de, a favor de<\/em>. <strong>Aviso<\/strong>: <em>en relación con<\/em> y <em>con relación a<\/em> son las formas tradicionales; <em>en relación a<\/em>, nacida del cruce de las dos, ya no la censura la RAE. En el examen, <strong>en relación con<\/strong>.<\/p>\n<p><strong>Los verbos que rigen preposición.<\/strong> Con ellos el complemento no es directo: es <strong>complemento de régimen<\/strong> (las claves oficiales lo llaman también <em>complemento preposicional<\/em>, <em>complemento regido<\/em> o <em>suplemento<\/em> — los cuatro nombres son válidos).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>complemento directo<\/th>\n<th>complemento de régimen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>se sustituye por <em>lo, la, los, las<\/em><\/td>\n<td><strong>sí<\/strong>: «Lidera un equipo» → <em>Lo lidera<\/em><\/td>\n<td><strong>no<\/strong>: «Se convirtió en agricultor» → <em>lo se convirtió<\/em> ✘<\/td>\n<\/tr>\n<tr>\n<td>al preguntar, la preposición<\/td>\n<td>desaparece: <em>¿qué lidera?<\/em> (la <em>a<\/em> del directo de persona se repite, <em>¿a quién cuidó?<\/em>, y no es de régimen: manda la prueba de <em>lo / la<\/em>)<\/td>\n<td><strong>se repite<\/strong>: <em>¿en qué se convirtió?<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los cuatro casos reales, con su clave oficial: «No confiamos en nosotros mismos» (2014), «Los utópicos creen en el progreso» (2018), «Gerehou ejerció de presidente de SOS Racismo» (2022), «Por el camino se ha convertido en una especie de influencer agrícola» (2026).<\/p>\n<h4>La lista de verbos de régimen<\/h4>\n<p>Esta lista es de consulta, no de memoria. Con ★ los que han caído en el ejercicio de función sintáctica; con · los que aparecen en los textos de examen.<\/p>\n<table>\n<thead>\n<tr>\n<th>prep.<\/th>\n<th>verbos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a<\/strong><\/td>\n<td>dedicarse ·, referirse ·, aludir, acostumbrarse ·, atreverse ·, enfrentarse ·, contribuir ·, obligar ·, renunciar, negarse, oponerse, aspirar, parecerse, equivaler, saber (<em>a<\/em>), oler (<em>a<\/em>), dirigirse<\/td>\n<\/tr>\n<tr>\n<td><strong>de<\/strong><\/td>\n<td>avergonzarse, acordarse, olvidarse, arrepentirse, quejarse ·, burlarse, presumir, carecer, depender ·, disfrutar, encargarse, darse cuenta, tratarse ·, huir ·, aprender ·, hablar ·, alegrarse, despedirse, enterarse, tratar<\/td>\n<\/tr>\n<tr>\n<td><strong>en<\/strong><\/td>\n<td>confiar ★, creer ★, convertirse ★, insistir ·, pensar, consistir, fijarse, empeñarse, participar, coincidir, basarse ·, influir, tardar<\/td>\n<\/tr>\n<tr>\n<td><strong>con<\/strong><\/td>\n<td>contar, soñar, conformarse, cumplir, casarse, acabar ·, dar (<em>con<\/em>), enfrentarse, coincidir<\/td>\n<\/tr>\n<tr>\n<td><strong>por<\/strong><\/td>\n<td>preocuparse ·, luchar ·, apostar ·, optar, interesarse, esforzarse, decantarse, decidirse<\/td>\n<\/tr>\n<tr>\n<td><strong>sobre<\/strong><\/td>\n<td>tratar, escribir, opinar, reflexionar, discutir, informar<\/td>\n<\/tr>\n<tr>\n<td><strong>de<\/strong> (oficio)<\/td>\n<td>ejercer ★, trabajar, hacer (<em>de<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los cuatro con estrella son los únicos etiquetados como régimen por una clave oficial; los del punto aparecen en los textos de las convocatorias. El resto funcionan igual: <strong>si al preguntar tienes que repetir la preposición, es de régimen.<\/strong><\/p>\n<p>Cuatro que cambian de significado con la preposición: <em>tratar<\/em> <strong>de<\/strong> (intentar) y <em>tratar<\/em> <strong>con<\/strong> (relacionarse); <em>pensar<\/em> <strong>en<\/strong> (tener en la cabeza) y <em>pensar<\/em> <strong>de<\/strong> (opinar); <em>contar<\/em> <strong>con<\/strong> (disponer de) y <em>contar<\/em> sin preposición (narrar, enumerar); <em>quedar<\/em> <strong>en<\/strong> (acordar) y <em>quedar<\/em> <strong>con<\/strong> (citarse).<\/p>\n<p>Y una falta frecuente que va al revés: meter una preposición donde el verbo no la lleva. <em>Le informó <\/em><em>de<\/em><em> que<\/em> es correcto, porque <em>informar de<\/em> rige preposición; <em>pienso <\/em><em>de<\/em><em> que<\/em>, <em>dijo <\/em><em>de<\/em><em> que<\/em> y <em>creo <\/em><em>de<\/em><em> que<\/em> no lo son, porque <em>pensar<\/em>, <em>decir<\/em> y <em>creer<\/em> llevan el complemento directo sin preposición. La prueba sirve en los dos sentidos: <em>¿qué dijo?<\/em>, sin preposición, así que <em>dijo que<\/em>. Y la prueba del <em>eso<\/em> da lo mismo: la oración que sigue al verbo se sustituye por <em>eso<\/em>, y <em>eso<\/em> arrastra la preposición del verbo o no la arrastra: <em>pienso eso<\/em>, <em>dijo eso<\/em>, <em>creo eso<\/em> —sin preposición— frente a <em>me informó de eso<\/em>, <em>se acordó de eso<\/em>, <em>insistió en eso<\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Expresión equivalente: diez ítems reales", "dossier": {"cuaderno": "11", "ejercicio": 1}, "ayuda": "Diez adverbios y locuciones de exámenes reales, con la convocatoria entre paréntesis. Escribe una expresión equivalente. Se aceptan las de las claves oficiales y otras que signifiquen lo mismo.", "items": [{"enun": "<b>quizá<\/b> (2011)", "sol": "tal vez|acaso|a lo mejor|posiblemente", "corto": false}, {"enun": "<b>luego<\/b>: «valorar varios aspectos de su propio físico» […] «y luego los mismos aspectos en otras personas»", "conv": "2017", "sol": "después|más tarde|posteriormente", "corto": false}, {"enun": "<b>sencillamente<\/b> (2013)", "sol": "simplemente|llanamente", "corto": false}, {"enun": "<b>así<\/b>: «Así funcionamos desde que el mundo es mundo»", "conv": "2013", "sol": "de esta manera|de este modo|de esta forma", "corto": false}, {"enun": "<b>hoy día<\/b> (2014)", "sol": "actualmente|hoy en día|en la actualidad", "corto": false}, {"enun": "<b>a diario<\/b> (2015)", "sol": "todos los días|diariamente|cada día", "corto": false}, {"enun": "<b>sobre todo<\/b> (2017)", "sol": "especialmente|principalmente|particularmente", "corto": false}, {"enun": "<b>de nuevo<\/b> (2018)", "sol": "otra vez|nuevamente", "corto": false}, {"enun": "<b>en ocasiones<\/b> (2022)", "sol": "a veces|ocasionalmente|de tanto en tanto|de vez en cuando|algunas veces", "corto": false}, {"enun": "<b>apenas<\/b> (2026)", "sol": "escasamente|casi no", "corto": false}], "criterio": "Las claves oficiales dan una expresión del mismo significado y de la misma clase: <i>quizá<\/i>, <i>tal vez<\/i>; <i>a diario<\/i>, <i>todos los días<\/i>; <i>en ocasiones<\/i>, <i>a veces<\/i>. Muchas locuciones tienen un adverbio en <i>-mente<\/i> que las sustituye: <i>de nuevo<\/i>, <i>nuevamente<\/i>; <i>hoy día<\/i>, <i>actualmente<\/i>.", "usa_tex   /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:

    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;

          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
