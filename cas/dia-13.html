<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 13 · 10 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}

  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}

details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}

details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}

compañero esa misma mañana y la vacante desapareció.", "faltas": {"digo": "dijo", "estava": "estaba", "inscrivir": "inscribir", "pensava": "pensaba", "condugeron": "condujeron"}}], "criterio": "Los cinco son verbos y solo hay que comprobar tres terminaciones: el imperfecto en <b>-aba<\/b>, el infinitivo en <b>-bir<\/b> y el pasado con <b>j<\/b> de los verbos que no llevan ni g ni j en infinitivo.<br><br><i>Había<\/i> y <i>habían dicho<\/i> están bien: <i>había<\/i> es impersonal y <i>habían dicho<\/i> es auxiliar con participio detrás.", "apoyo": "todo", "solo_web": true}, {"tipo": "hueco", "titulo": "Pasada 2: sustitúyela por otra", "estricto": true, "ayuda": "De cada par, escribe la palabra que usarías si no estuvieras seguro de cómo se escribe la otra. Las dos significan lo mismo, así que no se pierde precisión.", "items": [{"enun": "dudas entre <i>exhaustivo<\/i> y <i>completo<\/i>", "sol": "completo", "corto": false}, {"enun": "dudas entre <i>ineludible<\/i> y <i>obligatorio<\/i>", "sol": "obligatorio", "corto": false}, {"enun": "dudas entre <i>vislumbrar<\/i> y <i>ver<\/i>", "sol": "ver", "corto": false}, {"enun": "dudas entre <i>subvención<\/i> y <i>ayuda<\/i>", "sol": "ayuda", "corto": false}, {"enun": "dudas entre <i>coherente<\/i> y <i>ordenado<\/i>", "sol": "ordenado", "corto": false}], "criterio": "Ninguna de las cinco de la izquierda está mal; solo se escriben mal con más facilidad. El corrector valora que la palabra <b>signifique lo que quieres decir<\/b>, no que sea de uso culto.<br><br>El cambio ocupa dos segundos y se hace en la pasada 2, con el texto ya escrito.", "apoyo": "todo", "solo_web": true}, {"tipo": "opcion", "titulo": "La norma vieja", "ayuda": "Seis grafías que se leen en textos publicados y en libros antiguos. Indica si hoy se escriben así.", "ops": ["hoy es correcto", "es la norma vieja"], "items": [{"enun": "<i>éste<\/i> con tilde cuando es pronombre", "sol": "es la norma vieja"}, {"enun": "<i>sólo<\/i> con tilde, con el significado de «solamente»", "sol": "es la norma vieja", "porque": "desde 2010 se escribe <i>solo<\/i> sin tilde; la tilde solo se admite si quien escribe aprecia una ambigüedad, y en un examen no se pone"}, {"enun": "<i>este<\/i>, <i>esa<\/i>, <i>aquellos<\/i> sin tilde, aunque vayan solos", "sol": "hoy es correcto"}, {"enun": "<i>solo<\/i> sin tilde, con el significado de «sin compañía»", "sol": "hoy es correcto"}, {"enun": "<i>guion<\/i> y <i>truhan<\/i> sin tilde", "sol": "hoy es correcto", "porque": "son monosílabos a efectos de acentuación desde 2010"}, {"enun": "<i>13 ó 14<\/i>, con tilde en la <i>o<\/i>", "sol": "es la norma vieja", "porque": "la tilde se ponía para no confundirla con un cero; ya no"}], "criterio": "Las tres de la norma vieja aparecen en libros y en textos de exámenes antiguos, y muchos adultos las aprendieron así. Que una grafía aparezca impresa no la hace correcta hoy.", "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartado 1: La relectura de dos minutos (p. 32) · ejercicios 1 y 2", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El segundo texto", "meta": "25 minutos · se escribe, cronometrado, con el texto delante", "cuaderno": [{"nudo": 18, "apartados": [5]}, {"nudo": "A1", "apartados": ["la hoja de revisión de la redacción"]}], "lectura": {"titulo": "Veinticuatro horas de supervisión", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["Cuando a la madre de Julio Ferrán le dieron el alta, el informe", "decía que necesitaba supervisión las veinticuatro horas. Julio", "leyó esa frase en el pasillo del hospital y calculó lo que", "significaba: alguien en casa a todas horas, todos los días, sin", "fecha de final.", "", "Él trabaja de nueve a seis. Su hermana vive a cuatrocientos", "kilómetros. La residencia más cercana con plaza pública tenía", "lista de espera de dos años, y la privada costaba más que el", "sueldo de Julio entero. Contrató a una mujer once horas al día y", "pidió una excedencia parcial.", "", "Dos años después hace las cuentas con calma. Ha gastado los", "ahorros que tenía para cambiar de coche, ha rechazado un puesto", "que le habrían dado y ha aprendido a poner una sonda. Dice que lo", "volvería a hacer y que eso no quita nada de lo anterior.", "", "Lo que le sorprende, mirándolo ahora, es que nadie le preguntara", "nunca cómo estaba él. Hubo informes de la madre, revisiones de la", "madre y llamadas para citas de la madre. Del que la cuidaba no", "consta nada en ningún papel, aunque sin él no había alta posible.", "", "Julio dice que no reclama una medalla. Reclama que el que firma un", "alta con supervisión de veinticuatro horas sepa a quién se las", "está pidiendo, y que ese nombre aparezca escrito en alguna parte."], "pie": "Texto inventado. Ni Julio Ferrán ni los datos que da son reales."}, "teoria": "<h3>Nudo 18 · 5 · Nueve redacciones puntuadas<\/h3>\n<p>Léelas con la hoja A-1 delante y puntúalas tú antes de mirar la nota.<\/p>\n<h4>Consigna de 2021, opción A — <em>la educación para poder mejorar la vida de las personas<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 106 palabras.<\/p>\n<blockquote>\n<p>Creo que la educación mejora la vida de las personas porque les da autonomía en asuntos que antes dependían de otros. En primer lugar, quien ha estudiado entiende un contrato, una nómina o un informe médico, y puede decidir sin que nadie se lo interprete. Además, con más formación se puede optar a más trabajos, y quien tiene varias opciones no está obligado a aguantar cualquier condición en la única que tiene. Es cierto que un título no garantiza un buen empleo, pero sin él muchas puertas ni siquiera se abren. Por eso pienso que estudiar de adulto cambia la vida diaria antes que el sueldo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>3<\/strong>.<\/p>\n<p>Tesis discutible en la primera frase; dos argumentos con conector (<em>en primer lugar<\/em>, <em>además<\/em>); una concesión (<em>es cierto que… pero<\/em>) que sube variación; cierre con consecuencia, no repetición; ni una falta ni una coma que sobre. <strong>Es el único de los nueve que llega a 3.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 98 palabras.<\/p>\n<blockquote>\n<p>Yo pienso que la educación es muy importante para las personas. La educación te ayuda a tener un trabajo mejor y a ganar más dinero. También te ayuda a saber más cosas y a no ser engañado por la gente. Mucha gente no ha podido estudiar y luego lo pasa mal, porque sin estudios no consigues casi nada. La educación también te ayuda con tus hijos, porque si tú sabes les puedes ayudar a ellos con los deberes. Yo pienso que la educación es lo más importante para mejorar la vida y por eso hay que estudiar siempre.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,25<\/strong>.<\/p>\n<p>Sin faltas y con los puntos donde van, corrección y cohesión quedan enteras; pierde en las otras cuatro bandas. La tesis no es discutible; los tres argumentos se suman con <em>también<\/em>, sin marcar el orden (<em>en primer lugar<\/em>, <em>además<\/em>), y se acumulan; el cierre repite la primera frase casi igual (coherencia, 0,25). <em>Ayudar<\/em> aparece cuatro veces, <em>la educación<\/em> cuatro y <em>yo pienso que<\/em> dos: palabras que se repiten a menudo, y la variación se queda en 0. El <em>tú<\/em> de conversación (<em>te ayuda<\/em>, <em>si tú sabes<\/em>) y <em>yo pienso que<\/em> dejan el registro en 0.<\/p>\n<p><strong>Modelo bajo.<\/strong> 63 palabras.<\/p>\n<blockquote>\n<p>La educacion es muy inportante en la vida de las personas por que sin educacion no se puede ir a ningun sitio ni encontrar trabajo ni nada, en mi pueblo mucha gente no estudio y ahora estan todos igual, o sea que hay que estudiar sea como sea y punto, lo que pasa es que no todo el mundo puede por el trabajo.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,35<\/strong>, y prorrateado por la extensión, ≈ <strong>0,85<\/strong>.<\/p>\n<p>Siete faltas de ortografía en 63 palabras (corrección, 0,6) — Cuenta C: <em>educacion<\/em> (dos veces), <em>inportante<\/em>, <em>por que<\/em>, <em>ningun<\/em>, <em>estudio<\/em>, <em>estan<\/em>. Cuenta B: tres comas donde iba punto —tras <em>nada<\/em>, tras <em>igual<\/em> y tras <em>y punto<\/em>—, y con tres la cohesión baja a 0,5. No hay tesis discutible, la razón es un ejemplo (<em>en mi pueblo<\/em>) y el final se desdice (coherencia, 0). <em>O sea<\/em> y <em>y punto<\/em> son marcas de oralidad (registro, 0). Y se queda por debajo de las 80 de clase: cada banda se prorratea por la extensión, 63 de las 100 palabras pedidas.<\/p>\n<h4>Consigna de 2020, opción A — <em>la caza<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 111 palabras.<\/p>\n<blockquote>\n<p>Creo que la caza no se puede defender ni condenar en bloque, porque el juicio dependerá de la razón por la que se cace. En primer lugar, hay una caza que controla las poblaciones de jabalíes o de conejos donde ya no quedan depredadores, y esa función la tiene que hacer alguien. Además, quien vive del monte suele conocerlo mejor que quien lo visita los domingos. Es cierto que también existe la caza de trofeo, con animales criados para que el tiro no falle, y esa no tiene otro objeto que presumir. Por eso pienso que el problema no está en cazar, sino en el motivo por el que se caza.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,75<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia, ni una falta y una concesión. <em>Por qué no es un tres:<\/em> supongamos que el folio viene sin márgenes. <strong>Ha perdido la banda que solo exige márgenes y letra legible.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 97 palabras. <em>(Escrito con las faltas que se repiten en los primeros textos de clase.)<\/em><\/p>\n<blockquote>\n<p>Yo pienso que la caza esta muy mal porque los animales tambien tienen derecho a vivir, los cazadores matan a los animales por diversion y eso no es un deporte, hay cazadores que tratan muy mal a sus perros y los dejan encerrados sin comida los animales no tienen la culpa de nada, en mi opinión creo que la caza se tendría que prohibir en todos los sitios porque los animales sufren mucho y ademas no hace falta cazar para comer porque hay supermercados, se puede comprar la carne allí sin tener que matar a ningun animal.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0,8<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,80<\/strong>.<\/p>\n<p>Las razones se amontonan y el final abre un tema nuevo. Cuenta B: cuatro comas donde iba punto, y el punto que falta detrás de <em>sin comida<\/em>. Cuenta C: <em>esta<\/em>, <em>tambien<\/em>, <em>diversion<\/em>, <em>ademas<\/em>, <em>ningun<\/em>. Y <em>animales<\/em> cuatro veces. <strong>Le falta la estructura: una tesis, dos razones con conector y un cierre.<\/strong><\/p>\n<p><strong>Modelo bajo.<\/strong> 83 palabras.<\/p>\n<blockquote>\n<p>A mi la caza me parese una cosa muy antigua que ya no sirbe para nada, en mi pueblo ay muchos cazadores y salen los domingos con las escopetas, luego se ban al bar a contarlo, yo e ido alguna vez de pequeño y la berdad es que no me gusto nada ver al conejo aquel echo un cristo, o sea que por mi que la proiban ya y punto, tanpoco quiero meterme con nadie por que cada uno hase lo que kiere.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,25<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>La idea llega al final y luego se desdice. Cinco comas donde iba un punto. Quince faltas —Cuenta C: <em>mi<\/em> (dos veces, sin tilde), <em>parese<\/em>, <em>sirbe<\/em>, <em>ay<\/em>, <em>ban<\/em>, <em>e<\/em>, <em>berdad<\/em>, <em>gusto<\/em>, <em>echo<\/em>, <em>proiban<\/em>, <em>tanpoco<\/em>, <em>por que<\/em>, <em>hase<\/em>, <em>kiere<\/em>—: a partir de doce, corrección es cero. <em>O sea<\/em> y <em>echo un cristo<\/em> se llevan el registro. Y <strong>83 palabras: tres por encima del límite de clase para el prorrateo.<\/strong> Un apunte que tranquiliza: esas quince faltas <strong>no descuentan otros 1,50 aparte<\/strong>, porque la penalización de 0,10 solo corre en los bloques 1 y 2.<\/p>\n<h4>Consigna de 2026, opción A — <em>la necesidad de defender el trabajo agrícola<\/em><\/h4>\n<p><strong>Modelo alto.<\/strong> 110 palabras.<\/p>\n<blockquote>\n<p>Creo que hay que defender el trabajo agrícola porque de él depende quién decide el precio de lo que comemos. En primer lugar el agricultor cobra por su cosecha una parte muy pequeña de lo que pagamos en la tienda, y la diferencia se la quedan los intermediarios. Además el campo depende de un clima cada vez menos previsible, y dos años malos seguidos pueden cerrar una explotación entera. Es cierto que las subvenciones sostienen al sector cada año pero una ayuda no sustituye un precio justo. Por eso pienso que defender el campo es asegurar que la comida se siga produciendo aquí y no dependa solo de las importaciones.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,5<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>1<\/strong> · variación <strong>0,25<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>2,75<\/strong>.<\/p>\n<p>Tesis discutible, dos razones con conector, cierre con consecuencia y ni una falta. <em>Por qué no es un tres:<\/em> le faltan tres comas —tras <em>En primer lugar<\/em>, tras <em>Además<\/em> y delante de <em>pero<\/em>—. <strong>Los dos primeros errores de cohesión no bajan la banda; a partir del tercero, cada dos errores bajan 0,25, y con tres se queda en 0,5.<\/strong><\/p>\n<p><strong>Modelo medio.<\/strong> 95 palabras, con sus faltas.<\/p>\n<blockquote>\n<p>Yo creo que el trabajo agricola es muy importante para todos porque sin agricultores no comeriamos, los agricultores trabajan mucho y ganan muy poco dinero y eso no esta bien, en mi pueblo casi todos los jovenes se an ido a la ciudad y las tierras se quedan sin nadie que las trabaje, tambien está el problema de que la comida viene de fuera y es más barata. Yo creo que hay que ayudar a los agricultores porque el trabajo agricola es muy importante para todos y luego nos quejamos cuando todo sube de precio.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0,25<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0,6<\/strong> · variación <strong>0<\/strong> · registro <strong>0,25<\/strong> · disposición <strong>0,25<\/strong> = <strong>1,85<\/strong>.<\/p>\n<p>El cierre es la primera frase copiada. Tres comas donde iba punto. Siete faltas —Cuenta C: <em>agricola<\/em> (dos veces), <em>comeriamos<\/em>, <em>esta<\/em>, <em>jovenes<\/em>, <em>an<\/em>, <em>tambien<\/em>—, y dos son la misma palabra: <em>agricola<\/em> cuenta cada vez. <em>Por qué está donde está:<\/em> le faltan dos partes que se arreglan en tres minutos: <strong>una tesis discutible y un cierre que no la repita<\/strong>.<\/p>\n<p><strong>Modelo bajo.<\/strong> 91 palabras.<\/p>\n<blockquote>\n<p>El campo es muy duro. Mi tio tenia unas tierras aya en el pueblo y las bendio por que no sacaba nada. Ahora ai muchas naves. La gente de ciudad no save lo que cuesta un kilo de tomates, en berano fui a coger aceituna y acabé echo polvo. Yo que se, esto tendrian que areglarlo los de arriba. Tambien es verda que la fruta de fuera esta mas barata y la gente compra lo barato, es normal. En fin, que el campo esta fatal y no ay quien lo arregle.<\/p>\n<\/blockquote>\n<p>Coherencia <strong>0<\/strong> · cohesión <strong>0,5<\/strong> · corrección <strong>0<\/strong> · variación <strong>0<\/strong> · registro <strong>0<\/strong> · disposición <strong>0,25<\/strong> = <strong>0,75<\/strong>.<\/p>\n<p>No hay tesis: salta del tío a los tomates y a la aceituna, y al final se desdice. Dieciocho faltas contadas por lo bajo — Cuenta C: <em>tio<\/em>, <em>tenia<\/em>, <em>aya<\/em>, <em>bendio<\/em>, <em>por que<\/em>, <em>ai<\/em>, <em>save<\/em>, <em>berano<\/em>, <em>echo<\/em>, <em>se<\/em>, <em>tendrian<\/em>, <em>areglarlo<\/em>, <em>Tambien<\/em>, <em>verda<\/em>, <em>esta<\/em> (dos veces), <em>mas<\/em>, <em>ay<\/em>. <em>Yo que se<\/em> y <em>echo polvo<\/em> se llevan el registro. <em>Por qué está donde está:<\/em> <strong>la cohesión supera a la de los otros dos modelos bajos<\/strong> —frases cortas, acabadas en punto— y aun así saca 0,75, porque no hay tesis ni argumentos y las dieciocho faltas dejan la corrección en cero.<\/p>\n<h3>Anexo A-1 · Hoja de revisión de la redacción<\/h3>\n<blockquote>\n<p>Esta hoja se rellena <strong>por detrás de cada texto que escribas<\/strong>, antes de entregarlo. Sirve para encontrar lo que todavía se puede arreglar y, con la tabla de tramos del nudo 18, apartado 1, para ponerse nota.<\/p>\n<\/blockquote>\n<hr />\n<h4>HOJA DE REVISIÓN — EXPRESIÓN ESCRITA<\/h4>\n<p>Nombre: ………………………………  Fecha: …………  Texto n.º: ……<\/p>\n<hr />\n<h5>PASO 0 · Los tres ceros. Esto va antes que nada.<\/h5>\n<p>Si fallas una, <strong>la nota es 0 aunque el resto esté perfecto<\/strong>. No sigas rellenando la hoja.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>pregunta<\/th>\n<th style=\"text-align: center;\">sí<\/th>\n<th style=\"text-align: center;\">no<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tipo<\/strong><\/td>\n<td>¿He escrito <strong>el tipo de texto<\/strong> que pedía la opción elegida? (la A ha sido siempre argumentativa: doy mi opinión y la defiendo · la B, narrativa salvo en 2017: cuento algo que pasa; manda el enunciado)<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>tema<\/strong><\/td>\n<td>¿He escrito sobre <strong>el tema exacto<\/strong> del enunciado, y no sobre uno parecido?<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<tr>\n<td><strong>extensión<\/strong><\/td>\n<td>¿Tengo <strong>50 palabras o más<\/strong>? → cuéntalas ahora: ……… palabras<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<td style=\"text-align: center;\">☐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>Si tengo menos de 50, es cero. Si el texto es muy breve para las cien que pide el enunciado —en clase, por debajo de 80—, <strong>cada apartado se me reduce en proporción<\/strong>. El objetivo son <strong>unas 100<\/strong>.<\/p>\n<\/blockquote>\n<hr />\n<h5>PASO 1 · Las dos cuentas<\/h5>\n<p>Repasa el texto dos veces, una por cuenta, y marca cada error en el margen con su letra. Son dos pasadas distintas porque buscan errores distintos: la cuenta C revisa las palabras y la cuenta B revisa dónde termina cada oración.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>qué cuento<\/th>\n<th style=\"text-align: center;\">señal en el margen<\/th>\n<th style=\"text-align: center;\"><strong>total<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cuenta B<\/strong><\/td>\n<td><strong>puntuación<\/strong> (comas, puntos que faltan o sobran) · <strong>concordancia<\/strong> (el verbo no va con el sujeto, el adjetivo no va con el nombre) · <strong>oraciones mal construidas<\/strong> (les falta el verbo, se quedan sin terminar, no se entiende dónde acaban)<\/td>\n<td style=\"text-align: center;\">B<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<tr>\n<td><strong>Cuenta C<\/strong><\/td>\n<td><strong>ortografía<\/strong> (letras, tildes, mayúsculas) · <strong>morfosintaxis<\/strong> (formas verbales mal hechas, preposición equivocada) · <strong>léxico<\/strong> (palabra que no significa lo que quiero decir)<\/td>\n<td style=\"text-align: center;\">C<\/td>\n<td style=\"text-align: center;\">………<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>PASO 2 · Qué hacer con las dos cuentas<\/h5>\n<p>Cada cuenta cae en un tramo, y los tramos son los oficiales: en <strong>cohesión<\/strong>, de 0 a 2 errores es la banda entera y cada dos errores más baja un escalón; en <strong>corrección<\/strong>, de 0 a 3 errores es la banda entera, y a partir de ahí baja cada dos. La tabla de tramos está en el nudo 18, apartado 1.<\/p>\n<p>Aquí no se apunta ninguna nota. La cuenta sirve para saber <strong>cuántos errores hay que quitar para cambiar de tramo<\/strong>: casi siempre dos.<\/p>\n<hr />\n<h5>PASO 3 · Las tres preguntas que suben la nota antes de entregar<\/h5>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>¿Qué palabra he repetido más? Cuéntala. Si aparece <strong>cuatro veces o más<\/strong>, cambia dos por otra. <em>(Vale 0,25)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Busca dónde termina cada oración: donde acaba una idea completa con su verbo, va un punto. La coma no separa el sujeto del verbo, y entre dos oraciones con verbo propio va punto, salvo que las una <em>y<\/em>, <em>pero<\/em> u <em>o<\/em>. <em>(Vale hasta 0,75)<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>¿Hay alguna palabra de la que dudo cómo se escribe? Antes de cambiarla, mira si hay una regla que la resuelva (<em>-aba<\/em>, <em>-aje<\/em>, m antes de b). Si no la hay, busca otra manera de decir lo mismo <strong>sin perder precisión<\/strong>: cambiar una palabra exacta por una vaga descuenta en variación. <em>(Vale hasta 1)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h5>Lo que hay que recordar de esta hoja<\/h5>\n<ul>\n<li><strong>Corrección + cohesión = 1,75 de 3.<\/strong> Casi el 60 % depende de la ortografía, la puntuación y la concordancia.<\/li>\n<li><strong>Variación + registro + disposición = 0,75<\/strong>, y los tres se arreglan releyendo: una palabra repetida, el tono, los márgenes.<\/li>\n<li><strong>Las faltas de ortografía de la redacción cuentan en la banda de corrección<\/strong> y no descuentan además el 0,10 por falta de los bloques 1 y 2: ese descuento, hasta 2 puntos, corre solo allí.<\/li>\n<li><strong>En corrección, a partir de la cuarta falta, cada dos faltas menos son 0,2 puntos más.<\/strong><\/li>\n<li><strong>Versión 2.<\/strong> Con las marcas B y C delante, se reescribe el texto entero: contar los errores sin volver a escribir deja el texto como estaba.<\/li>\n<\/ul>\n<hr />\n<p><em>Bandas, puntos y tramos de las dos cuentas: criterios oficiales de corrección, Prova d'accés a CFGS, convocatòria 2026 (documento público). Redacción de la hoja y los tres ceros: material propio.<\/em><\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Antes de escribir: ¿en qué línea?", "ayuda": "Tres minutos localizando lo que te puede servir del texto.", "items": [{"enun": "La frase del informe que pone en marcha todo", "sol": "1|2|3"}, {"enun": "Las tres opciones que tenía y por qué ninguna servía", "sol": "6|7|8"}, {"enun": "Lo que ha perdido él, en concreto", "sol": "11|12|13"}, {"enun": "Lo que pide al final", "sol": "19|20"}], "criterio": "De la columna, para la redacción de hoy sirve sobre todo lo que ha perdido él: <b>ahorros, un puesto rechazado y una sonda<\/b>. Tres datos concretos valen más en una redacción que tres frases generales sobre lo duro que es cuidar.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas", "Consigna de 2021, opción A — la educación para poder mejorar la vida de las personas"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Sirve como tesis?", "ayuda": "Seis frases para abrir el texto de hoy. Decide si alguien podría negarlas.", "ops": ["sirve", "no sirve"], "items": [{"enun": "Quien firma un alta con supervisión permanente debería tener que decir quién la hace.", "sol": "sirve"}, {"enun": "Cuidar a un familiar dependiente es muy duro.", "sol": "no sirve", "porque": "nadie lo discute"}, {"enun": "Pagar a quien cuida en casa saldría más caro que ampliar las residencias.", "sol": "sirve", "porque": "es discutible, y además obliga a dar cifras o razones"}, {"enun": "El sistema da por supuesto un cuidador gratis, y por eso sale barato.", "sol": "sirve"}, {"enun": "Existen varios tipos de ayuda a la dependencia.", "sol": "no sirve", "porque": "es una constatación"}, {"enun": "Voy a hablar del tema de los cuidados, que es muy importante.", "sol": "no sirve", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}], "criterio": "Las tres que sirven tienen algo que las otras no: alguien podría contestarles «pues yo no lo veo así». Y las tres parten del texto que acabas de leer, de donde tiene que partir también la tuya.", "apoyo": ["Nudo 18 · 5 · Nueve redacciones puntuadas", "Consigna de 2021, opción A — la educación para poder mejorar la vida de las personas"], "solo_web": true}, {"tipo": "abierta", "titulo": "Cien palabras · 20 minutos", "ayuda": "Se escribe en clase. Este espacio sirve para guardarlo y compararlo con la devolución del 12 de noviembre.", "items": [{"enun": "<i>Redacte un texto argumentativo en el que exponga su opinión sobre el reconocimiento del trabajo de cuidar a un familiar dependiente.<\/i>", "modelo": "Un modelo alto abajo, y debajo lo que le habría faltado para llegar a los tres puntos."}], "modelos": ["<b>≈2,75 · 107 palabras.<\/b> «En mi opinión, cuidar a un familiar dependiente es un trabajo y debería reconocerse como tal. En primer lugar, ocupa el mismo tiempo que un empleo: quien cuida deja de trabajar o reduce su jornada, y pierde ingresos, ahorros y oportunidades. Además, si nadie apunta quién cuida, nadie planifica su descanso ni quién lo sustituye cuando enferma. Es cierto que la administración no puede sustituir a la familia en todo, pero sí puede contar con ella por escrito y darle apoyo. Por eso creo que el primer reconocimiento consiste en que el nombre del cuidador figure en el informe del alta, con sus horas y sus derechos.»", "<b>Qué le habría faltado para el tres:<\/b> nada de contenido. Le faltan los márgenes y una letra legible — la banda de disposición, 0,25, que exige menos tiempo que ninguna otra y se pierde con más frecuencia que ninguna, por escribir con prisa los dos últimos minutos."], "criterio": "Vuelve a la concesión del modelo: reconoce una objeción real —que ninguna administración puede sustituir a una familia— y gira hacia una idea distinta. Si detrás del <i>pero<\/i> repites la tesis, no has concedido nada.<br><br>Y el cierre saca una consecuencia concreta —un nombre en el papel— en vez de repetir que cuidar es importante.", "palabras": {"objetivo": 100}, "apoyo": ["Consigna de 2026, opción A — la necesidad de defender el trabajo agrícola"], "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 5: Nueve redacciones puntuadas (p. 70) · Anexo A-1 · Hoja de revisión de la redacción — el cuaderno: la hoja de revisión de la redacción", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los tiempos del pasado", "meta": "30 minutos · lo que sostiene la opción B de la redacción: los dos tiempos, sus formas y el subjuntivo", "cuaderno": [{"nudo": 10, "apartados": [2], "ejercicios": [4, 5, 6]}, {"nudo": 10, "apartados": [5], "ejercicios": [13, 14]}], "teoria": "<h3>2 · Los tiempos del pasado<\/h3>\n<p>Esta parte se aplica en la redacción. La opción B —contar una anécdota— ha caído <strong>14 de los 16 años<\/strong>, y una narración se entiende o no se entiende según cómo repartas dos tiempos.<\/p>\n<table>\n<thead>\n<tr>\n<th>tiempo<\/th>\n<th>ejemplo<\/th>\n<th>qué hace<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>pretérito perfecto simple<\/strong><\/td>\n<td><em>entré, dijo, fue<\/em><\/td>\n<td><strong>hace avanzar<\/strong> la historia: los hechos, uno detrás de otro<\/td>\n<\/tr>\n<tr>\n<td><strong>pretérito imperfecto<\/strong><\/td>\n<td><em>entraba, decía, era<\/em><\/td>\n<td><strong>describe el fondo<\/strong>: lo que había alrededor, lo que duraba, lo que se repetía<\/td>\n<\/tr>\n<tr>\n<td><strong>pretérito pluscuamperfecto<\/strong><\/td>\n<td><em>había entrado<\/em><\/td>\n<td>lo anterior a lo anterior<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Los nombres son los de la RAE, los mismos del <em>Glosario de términos gramaticales<\/em>. En los libros antiguos el perfecto simple se llamaba <em>pretérito indefinido<\/em>, y el perfecto compuesto (<em>he entrado<\/em>), <em>pretérito perfecto<\/em> a secas.<\/p>\n<p>Aparece en el arranque de un texto real de examen:<\/p>\n<blockquote>\n<p>«El primero de los dos hermanos en engancharse a la música <strong>fue<\/strong> Lucas Jussen. <strong>Tenía<\/strong> cinco años y <strong>se sentó<\/strong> frente al televisor a ver un partido de la selección de su país, Holanda. <strong>Sonó<\/strong> el himno y la madre del muchacho, flautista profesional, <strong>se percató<\/strong> de que le <strong>gustaba<\/strong>, así que le <strong>ofreció<\/strong> enseñarle sus notas al piano.» (convocatoria 2019)<\/p>\n<\/blockquote>\n<p><em>Fue, se sentó, sonó, se percató, ofreció<\/em>: la historia avanza. <em>Tenía, gustaba<\/em>: no avanzan, sostienen. Cámbialos de sitio y el texto deja de contar.<\/p>\n<p><strong>El error más frecuente en las narraciones: el perfecto compuesto por el simple.<\/strong> No lo decide el oído, sino el <strong>marcador temporal<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>si en la frase hay…<\/th>\n<th>va…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>ayer, anoche, el año pasado, hace dos años, en 2019, aquel día, un día<\/em><\/td>\n<td><strong>fui, dije, hice<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>hoy, esta mañana, esta semana, este año, últimamente, ya, todavía no, nunca (hasta ahora)<\/em><\/td>\n<td><strong>he ido, he dicho, he hecho<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En una anécdota que empieza «Hace unos años…», los hechos de aquel momento van en simple e imperfecto; el compuesto se reserva para lo que llega hasta hoy (<em>desde entonces no he vuelto<\/em>). Cada <em>he ido<\/em> contando aquel momento es, en el castellano peninsular que corrige el tribunal, un error de morfosintaxis.<\/p>\n<p><strong>Y el condicional por el subjuntivo.<\/strong> En la oración condicional —la que empieza por <em>si<\/em> y pone una condición—, detrás de <em>si<\/em> no va condicional ni futuro: <em>si tuviera<\/em>, <em>si tienes<\/em>, y <strong>no<\/strong> <em>si tendría<\/em>, <em>si tendrás<\/em>. Cuando <em>si<\/em> introduce una pregunta indirecta (<em>no sé si vendrá<\/em>), el futuro es correcto. Y detrás de <em>cuando<\/em> con valor de futuro va subjuntivo: <em>cuando llegues<\/em>, no <em>cuando llegarás<\/em>. En catalán, <em>quan arribaràs<\/em> es correcto; en castellano, no.<\/p>\n<ul>\n<li><em>Si tendría tiempo, lo haría<\/em> → <strong>Si tuviera<\/strong> (o <em>tuviese<\/em>) <strong>tiempo, lo haría.<\/strong><\/li>\n<li><em>Cuando llegarás, me avisas<\/em> → <strong>Cuando llegues, me avisas.<\/strong><\/li>\n<\/ul>\n<p>Los dos son calcos del catalán, y por eso aparecen tanto en las redacciones del centro.<\/p>\n<p>Las formas de cada tiempo —los regulares, los irregulares y el subjuntivo que piden <em>si<\/em> y <em>cuando<\/em>— están en el apartado 5.<\/p>\n<h3>5 · Las formas que necesitas<\/h3>\n<p>En tus redacciones y en el resumen aparecen las formas del pasado, y el subjuntivo que piden <em>si<\/em> y <em>cuando<\/em>; una anécdota de cien palabras lleva casi siempre <em>fue<\/em>, <em>tuvo<\/em>, <em>hizo<\/em>, <em>dijo<\/em> o <em>vino<\/em>, y cada <em>andó<\/em>, cada <em>dijieron<\/em> y cada <em>si tendría<\/em> cuenta como error de morfosintaxis. Este apartado reúne esas formas y, de un vistazo, el resto de los tiempos del verbo regular.<\/p>\n<h4>Los regulares<\/h4>\n<p>La raíz —lo que queda al quitar <em>-ar<\/em>, <em>-er<\/em> o <em>-ir<\/em>— más una terminación fija. Pretérito perfecto simple:<\/p>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>cant<strong>ar<\/strong><\/th>\n<th>com<strong>er<\/strong><\/th>\n<th>viv<strong>ir<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yo<\/td>\n<td>cant<strong>é<\/strong><\/td>\n<td>com<strong>í<\/strong><\/td>\n<td>viv<strong>í<\/strong><\/td>\n<\/tr>\n<tr>\n<td>tú<\/td>\n<td>cant<strong>aste<\/strong><\/td>\n<td>com<strong>iste<\/strong><\/td>\n<td>viv<strong>iste<\/strong><\/td>\n<\/tr>\n<tr>\n<td>él, ella<\/td>\n<td>cant<strong>ó<\/strong><\/td>\n<td>com<strong>ió<\/strong><\/td>\n<td>viv<strong>ió<\/strong><\/td>\n<\/tr>\n<tr>\n<td>nosotros<\/td>\n<td>cant<strong>amos<\/strong><\/td>\n<td>com<strong>imos<\/strong><\/td>\n<td>viv<strong>imos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>vosotros<\/td>\n<td>cant<strong>asteis<\/strong><\/td>\n<td>com<strong>isteis<\/strong><\/td>\n<td>viv<strong>isteis<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ellos, ellas<\/td>\n<td>cant<strong>aron<\/strong><\/td>\n<td>com<strong>ieron<\/strong><\/td>\n<td>viv<strong>ieron<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Pretérito imperfecto:<\/p>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>cant<strong>ar<\/strong><\/th>\n<th>com<strong>er<\/strong><\/th>\n<th>viv<strong>ir<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yo<\/td>\n<td>cant<strong>aba<\/strong><\/td>\n<td>com<strong>ía<\/strong><\/td>\n<td>viv<strong>ía<\/strong><\/td>\n<\/tr>\n<tr>\n<td>tú<\/td>\n<td>cant<strong>abas<\/strong><\/td>\n<td>com<strong>ías<\/strong><\/td>\n<td>viv<strong>ías<\/strong><\/td>\n<\/tr>\n<tr>\n<td>él, ella<\/td>\n<td>cant<strong>aba<\/strong><\/td>\n<td>com<strong>ía<\/strong><\/td>\n<td>viv<strong>ía<\/strong><\/td>\n<\/tr>\n<tr>\n<td>nosotros<\/td>\n<td>cant<strong>ábamos<\/strong><\/td>\n<td>com<strong>íamos<\/strong><\/td>\n<td>viv<strong>íamos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>vosotros<\/td>\n<td>cant<strong>abais<\/strong><\/td>\n<td>com<strong>íais<\/strong><\/td>\n<td>viv<strong>íais<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ellos, ellas<\/td>\n<td>cant<strong>aban<\/strong><\/td>\n<td>com<strong>ían<\/strong><\/td>\n<td>viv<strong>ían<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tres avisos de ortografía sobre el pretérito. <strong>Uno:<\/strong> las formas de <em>yo<\/em> y de <em>él<\/em> llevan tilde —<em>canté, cantó, comí, comió<\/em>—, y por eso <em>canto<\/em> (presente, yo) y <em>cantó<\/em> (pasado, él) son dos palabras distintas. <strong>Dos:<\/strong> la forma de <em>tú<\/em> no lleva <em>-s<\/em>: <em>cantaste<\/em>, <em>comiste<\/em>; <em>cantastes<\/em> cuenta como falta, y la <em>-s<\/em> pertenece a <em>vosotros<\/em>, <em>cantasteis<\/em>. <strong>Tres:<\/strong> la forma de <em>yo<\/em> de los verbos en <em>-gar<\/em>, <em>-car<\/em> y <em>-zar<\/em> cambia una letra para conservar el sonido —<em>llegar → llegué<\/em>, <em>buscar → busqué<\/em>, <em>empezar → empecé<\/em>—, y las formas de <em>él<\/em> y de <em>ellos<\/em> en <em>leer<\/em>, <em>caer<\/em>, <em>oír<\/em>, <em>creer<\/em> y <em>construir<\/em> escriben <em>y<\/em> en lugar de <em>i<\/em>: <em>leyó, cayó, oyó, creyó, construyó<\/em>; <em>leyeron, cayeron<\/em>.<\/p>\n<p>El imperfecto tiene dos terminaciones con una letra fija: los verbos en <em>-ar<\/em> acaban en <em>-aba<\/em>, siempre con b, y los verbos en <em>-er<\/em> e <em>-ir<\/em> acaban en <em>-ía<\/em>, siempre con tilde, porque la <em>i<\/em> fuerte pegada a la <em>a<\/em> forma hiato (nudo 2). Las formas de <em>yo<\/em> y de <em>él<\/em> coinciden —<em>yo cantaba<\/em>, <em>él cantaba<\/em>—, y quién habla lo decide la frase entera. De todo el trimestre, ninguna regla evita más faltas que la de <em>-aba<\/em>; está también en el nudo 4.<\/p>\n<p>Los dos tiempos compuestos se forman con <em>haber<\/em> más el participio, que no cambia nunca: <strong>he, has, ha, hemos, habéis, han<\/strong> + <em>cantado, comido, vivido<\/em> para el perfecto compuesto, y <strong>había, habías, había, habíamos, habíais, habían<\/strong> + participio para el pluscuamperfecto. Los participios irregulares están en el apartado 3.<\/p>\n<h4>Los demás tiempos del verbo regular, de un vistazo<\/h4>\n<p>El verbo tiene tres modos —<strong>indicativo<\/strong> (lo que se presenta como real), <strong>subjuntivo<\/strong> (lo deseado, lo dudoso, lo que depende de otro verbo) e <strong>imperativo<\/strong> (la orden)— y cada tiempo es simple o compuesto. Los compuestos se forman siempre igual: <em>haber<\/em> en el tiempo simple correspondiente más el participio.<\/p>\n<p><strong>Indicativo, tiempos simples.<\/strong> El presente lleva raíz más terminación; el futuro y el condicional se forman sobre <strong>el infinitivo entero<\/strong>, y sus terminaciones son las mismas para las tres conjugaciones.<\/p>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>presente<\/th>\n<th>futuro simple<\/th>\n<th>condicional simple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yo<\/td>\n<td>cant<strong>o<\/strong> · com<strong>o<\/strong> · viv<strong>o<\/strong><\/td>\n<td>cantar<strong>é<\/strong><\/td>\n<td>cantar<strong>ía<\/strong><\/td>\n<\/tr>\n<tr>\n<td>tú<\/td>\n<td>cant<strong>as<\/strong> · com<strong>es<\/strong> · viv<strong>es<\/strong><\/td>\n<td>cantar<strong>ás<\/strong><\/td>\n<td>cantar<strong>ías<\/strong><\/td>\n<\/tr>\n<tr>\n<td>él, ella<\/td>\n<td>cant<strong>a<\/strong> · com<strong>e<\/strong> · viv<strong>e<\/strong><\/td>\n<td>cantar<strong>á<\/strong><\/td>\n<td>cantar<strong>ía<\/strong><\/td>\n<\/tr>\n<tr>\n<td>nosotros<\/td>\n<td>cant<strong>amos<\/strong> · com<strong>emos<\/strong> · viv<strong>imos<\/strong><\/td>\n<td>cantar<strong>emos<\/strong><\/td>\n<td>cantar<strong>íamos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>vosotros<\/td>\n<td>cant<strong>áis<\/strong> · com<strong>éis<\/strong> · viv<strong>ís<\/strong><\/td>\n<td>cantar<strong>éis<\/strong><\/td>\n<td>cantar<strong>íais<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ellos, ellas<\/td>\n<td>cant<strong>an<\/strong> · com<strong>en<\/strong> · viv<strong>en<\/strong><\/td>\n<td>cantar<strong>án<\/strong><\/td>\n<td>cantar<strong>ían<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Con el perfecto simple y el imperfecto de arriba, son los cinco tiempos simples del indicativo. Los compuestos, con <em>haber<\/em>: <strong>pretérito perfecto compuesto<\/strong> (<em>he cantado<\/em>), <strong>pretérito pluscuamperfecto<\/strong> (<em>había cantado<\/em>), <strong>pretérito anterior<\/strong> (<em>hube cantado<\/em>, hoy casi solo en textos escritos), <strong>futuro compuesto<\/strong> (<em>habré cantado<\/em>) y <strong>condicional compuesto<\/strong> (<em>habría cantado<\/em>).<\/p>\n<p><strong>Subjuntivo.<\/strong> Dos tiempos simples: el <strong>presente<\/strong> (<em>cante, cantes, cante, cantemos, cantéis, canten<\/em> · <em>coma…<\/em> · <em>viva…<\/em>) y el <strong>pretérito imperfecto<\/strong> (<em>cantara<\/em> o <em>cantase, cantaras, cantara, cantáramos, cantarais, cantaran<\/em> · <em>comiera…<\/em> · <em>viviera…<\/em>); cómo se sacan los dos de formas que ya conoces está más abajo. Los compuestos: <strong>pretérito perfecto compuesto<\/strong> (<em>haya cantado<\/em>) y <strong>pretérito pluscuamperfecto<\/strong> (<em>hubiera<\/em> o <em>hubiese cantado<\/em>). El futuro de subjuntivo (<em>cantare<\/em>) solo aparece en textos jurídicos y en fórmulas fijas (<em>sea lo que fuere<\/em>).<\/p>\n<p><strong>Imperativo.<\/strong> Solo tiene formas propias para <em>tú<\/em> y <em>vosotros<\/em>: <em>canta, cantad<\/em> · <em>come, comed<\/em> · <em>vive, vivid<\/em>. Para <em>usted<\/em>, <em>nosotros<\/em> y <em>ustedes<\/em> se usa el presente de subjuntivo: <em>cante, cantemos, canten<\/em>. La orden negativa va siempre en subjuntivo: <em>no cantes<\/em>, <em>no cantéis<\/em>.<\/p>\n<h4>Los irregulares del pretérito<\/h4>\n<p>Cambian la raíz y toman unas terminaciones propias, <strong>sin tilde<\/strong> en las formas de <em>yo<\/em> y de <em>él<\/em>: <em>tuve<\/em>, <em>tuvo<\/em>, y no <em>tuvé<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>yo<\/th>\n<th>tú<\/th>\n<th>él, ella<\/th>\n<th>nosotros<\/th>\n<th>vosotros<\/th>\n<th>ellos, ellas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ser<\/strong> e <strong>ir<\/strong> <em>(las mismas formas)<\/em><\/td>\n<td>fui<\/td>\n<td>fuiste<\/td>\n<td>fue<\/td>\n<td>fuimos<\/td>\n<td>fuisteis<\/td>\n<td>fueron<\/td>\n<\/tr>\n<tr>\n<td><strong>tener<\/strong><\/td>\n<td>tuve<\/td>\n<td>tuviste<\/td>\n<td>tuvo<\/td>\n<td>tuvimos<\/td>\n<td>tuvisteis<\/td>\n<td>tuvieron<\/td>\n<\/tr>\n<tr>\n<td><strong>estar<\/strong><\/td>\n<td>estuve<\/td>\n<td>estuviste<\/td>\n<td>estuvo<\/td>\n<td>estuvimos<\/td>\n<td>estuvisteis<\/td>\n<td>estuvieron<\/td>\n<\/tr>\n<tr>\n<td><strong>andar<\/strong><\/td>\n<td>anduve<\/td>\n<td>anduviste<\/td>\n<td>anduvo<\/td>\n<td>anduvimos<\/td>\n<td>anduvisteis<\/td>\n<td>anduvieron<\/td>\n<\/tr>\n<tr>\n<td><strong>hacer<\/strong><\/td>\n<td>hice<\/td>\n<td>hiciste<\/td>\n<td>hizo<\/td>\n<td>hicimos<\/td>\n<td>hicisteis<\/td>\n<td>hicieron<\/td>\n<\/tr>\n<tr>\n<td><strong>decir<\/strong><\/td>\n<td>dije<\/td>\n<td>dijiste<\/td>\n<td>dijo<\/td>\n<td>dijimos<\/td>\n<td>dijisteis<\/td>\n<td>dijeron<\/td>\n<\/tr>\n<tr>\n<td><strong>traer<\/strong><\/td>\n<td>traje<\/td>\n<td>trajiste<\/td>\n<td>trajo<\/td>\n<td>trajimos<\/td>\n<td>trajisteis<\/td>\n<td>trajeron<\/td>\n<\/tr>\n<tr>\n<td><strong>conducir<\/strong> <em>(producir, traducir)<\/em><\/td>\n<td>conduje<\/td>\n<td>condujiste<\/td>\n<td>condujo<\/td>\n<td>condujimos<\/td>\n<td>condujisteis<\/td>\n<td>condujeron<\/td>\n<\/tr>\n<tr>\n<td><strong>poder<\/strong><\/td>\n<td>pude<\/td>\n<td>pudiste<\/td>\n<td>pudo<\/td>\n<td>pudimos<\/td>\n<td>pudisteis<\/td>\n<td>pudieron<\/td>\n<\/tr>\n<tr>\n<td><strong>poner<\/strong><\/td>\n<td>puse<\/td>\n<td>pusiste<\/td>\n<td>puso<\/td>\n<td>pusimos<\/td>\n<td>pusisteis<\/td>\n<td>pusieron<\/td>\n<\/tr>\n<tr>\n<td><strong>saber<\/strong><\/td>\n<td>supe<\/td>\n<td>supiste<\/td>\n<td>supo<\/td>\n<td>supimos<\/td>\n<td>supisteis<\/td>\n<td>supieron<\/td>\n<\/tr>\n<tr>\n<td><strong>querer<\/strong><\/td>\n<td>quise<\/td>\n<td>quisiste<\/td>\n<td>quiso<\/td>\n<td>quisimos<\/td>\n<td>quisisteis<\/td>\n<td>quisieron<\/td>\n<\/tr>\n<tr>\n<td><strong>venir<\/strong><\/td>\n<td>vine<\/td>\n<td>viniste<\/td>\n<td>vino<\/td>\n<td>vinimos<\/td>\n<td>vinisteis<\/td>\n<td>vinieron<\/td>\n<\/tr>\n<tr>\n<td><strong>dar<\/strong><\/td>\n<td>di<\/td>\n<td>diste<\/td>\n<td>dio<\/td>\n<td>dimos<\/td>\n<td>disteis<\/td>\n<td>dieron<\/td>\n<\/tr>\n<tr>\n<td><strong>ver<\/strong><\/td>\n<td>vi<\/td>\n<td>viste<\/td>\n<td>vio<\/td>\n<td>vimos<\/td>\n<td>visteis<\/td>\n<td>vieron<\/td>\n<\/tr>\n<tr>\n<td><strong>haber<\/strong> <em>(impersonal)<\/em><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>hubo<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Las faltas que más se corrigen en esta tabla: <em>andó<\/em> por <strong>anduvo<\/strong>, <em>dijieron<\/em> por <strong>dijeron<\/strong>, <em>condució<\/em> por <strong>condujo<\/strong>, <em>traducí<\/em> por <strong>traduje<\/strong>, <em>cabió<\/em> por <strong>cupo<\/strong>, <em>satisfació<\/em> por <strong>satisfizo<\/strong>, <em>preveyó<\/em> por <strong>previó<\/strong> (<em>prever<\/em> se conjuga como <em>ver<\/em>), <em>veniste<\/em> por <strong>viniste<\/strong>, <em>dijistes<\/em> e <em>hicistes<\/em> por <strong>dijiste<\/strong> e <strong>hiciste<\/strong> (la <em>-s<\/em> es de <em>vosotros<\/em>: <em>dijisteis<\/em>), <em>hubieron<\/em> por <strong>hubo<\/strong>, y <em>dió<\/em>, <em>vió<\/em> y <em>fué<\/em> con tilde: son monosílabos y no la llevan.<\/p>\n<p><strong>Haber impersonal.<\/strong> Va solo en tercera del singular, aunque lo que venga detrás sea plural, porque eso funciona como <strong>complemento directo<\/strong>, no como sujeto: en «Siempre hubo hombres buenos y tipejos» (2023), <em>hombres buenos y tipejos<\/em> es complemento directo. De ahí que <em>habían muchas personas<\/em> y <em>hubieron dos reuniones<\/em> sean falta: <strong>había muchas personas<\/strong>, <strong>hubo dos reuniones<\/strong>. Cuando <em>haber<\/em> es auxiliar de un tiempo compuesto sí concuerda con el sujeto: <em>habían pasado dos horas<\/em>.<\/p>\n<p>En el imperfecto solo hay tres irregulares, y los tres aparecen en cualquier anécdota: <strong>ser<\/strong> —<em>era, eras, era, éramos, erais, eran<\/em>—, <strong>ir<\/strong> —<em>iba, ibas, iba, íbamos, ibais, iban<\/em>, con b— y <strong>ver<\/strong> —<em>veía, veías, veía, veíamos, veíais, veían<\/em>—.<\/p>\n<h4>El subjuntivo que piden <em>si<\/em> y <em>cuando<\/em><\/h4>\n<p>Las dos formas de subjuntivo que hacen falta se sacan de otras dos que ya conoces.<\/p>\n<p><strong>El presente de subjuntivo<\/strong> —el de <em>cuando llegues<\/em>— sale de la forma de <em>yo<\/em> del presente de indicativo cambiando la vocal: los verbos en <em>-ar<\/em> pasan a <strong>-e<\/strong> (<em>llego → llegue, acabo → acabe, empiezo → empiece<\/em>) y los verbos en <em>-er<\/em> e <em>-ir<\/em> pasan a <strong>-a<\/strong> (<em>como → coma, tengo → tenga, hago → haga, digo → diga, vengo → venga, salgo → salga, puedo → pueda<\/em>). Como se parte de la forma de <em>yo<\/em>, la irregularidad del presente se conserva: <em>tengo → tenga<\/em>, no <em>tene<\/em>. Seis verbos no se sacan de la forma de <em>yo<\/em>: <strong>ser → sea<\/strong>, <strong>ir → vaya<\/strong>, <strong>estar → esté<\/strong>, <strong>saber → sepa<\/strong>, <strong>haber → haya<\/strong>, <strong>dar → dé<\/strong>. Las personas: <em>llegue, llegues, llegue, lleguemos, lleguéis, lleguen<\/em>; <em>tenga, tengas, tenga, tengamos, tengáis, tengan<\/em>. En los verbos en <em>-ar<\/em> y <em>-er<\/em> que cambian <em>e<\/em> por <em>ie<\/em> u <em>o<\/em> por <em>ue<\/em>, <em>nosotros<\/em> y <em>vosotros<\/em> vuelven a la vocal del infinitivo: <em>pueda, puedas, pueda, podamos, podáis, puedan<\/em>; <em>empiece… empecemos, empecéis<\/em>. Los de <em>-ir<\/em> cambian también en esas dos personas: <em>sentir → sintamos, sintáis<\/em>; <em>dormir → durmamos, durmáis<\/em>.<\/p>\n<p><strong>El imperfecto de subjuntivo<\/strong> —el de <em>si tuviera<\/em>— sale de la forma de <em>ellos<\/em> del pretérito perfecto simple quitando <em>-ron<\/em> y añadiendo <strong>-ra<\/strong> o <strong>-se<\/strong>, que valen las dos: <em>tuvieron → tuviera / tuviese<\/em>, <em>supieron → supiera<\/em>, <em>fueron → fuera<\/em>, <em>hicieron → hiciera<\/em>, <em>dijeron → dijera<\/em>, <em>pudieron → pudiera<\/em>, <em>llegaron → llegara<\/em>, <em>comieron → comiera<\/em>. Las personas: <em>tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran<\/em>; la de <em>nosotros<\/em> lleva tilde.<\/p>\n<h4>Anexo · las tablas enteras<\/h4>\n<p>Los diecisiete verbos de arriba con las tres formas que piden los ejercicios: pretérito perfecto simple, presente de subjuntivo e imperfecto de subjuntivo en <em>-ra<\/em>. La forma en <em>-se<\/em> se obtiene cambiando la terminación: <em>tuviera → tuviese<\/em>.<\/p>\n<table>\n<thead>\n<tr>\n<th>verbo<\/th>\n<th>pretérito perfecto simple<\/th>\n<th>presente de subjuntivo<\/th>\n<th>imperfecto de subjuntivo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ser<\/strong><\/td>\n<td>fui, fuiste, fue, fuimos, fuisteis, fueron<\/td>\n<td>sea, seas, sea, seamos, seáis, sean<\/td>\n<td>fuera, fueras, fuera, fuéramos, fuerais, fueran<\/td>\n<\/tr>\n<tr>\n<td><strong>ir<\/strong><\/td>\n<td>fui, fuiste, fue, fuimos, fuisteis, fueron<\/td>\n<td>vaya, vayas, vaya, vayamos, vayáis, vayan<\/td>\n<td>fuera, fueras, fuera, fuéramos, fuerais, fueran<\/td>\n<\/tr>\n<tr>\n<td><strong>estar<\/strong><\/td>\n<td>estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron<\/td>\n<td>esté, estés, esté, estemos, estéis, estén<\/td>\n<td>estuviera, estuvieras, estuviera, estuviéramos, estuvierais, estuvieran<\/td>\n<\/tr>\n<tr>\n<td><strong>haber<\/strong><\/td>\n<td>hube, hubiste, hubo, hubimos, hubisteis, hubieron<\/td>\n<td>haya, hayas, haya, hayamos, hayáis, hayan<\/td>\n<td>hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran<\/td>\n<\/tr>\n<tr>\n<td><strong>tener<\/strong><\/td>\n<td>tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron<\/td>\n<td>tenga, tengas, tenga, tengamos, tengáis, tengan<\/td>\n<td>tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran<\/td>\n<\/tr>\n<tr>\n<td><strong>hacer<\/strong><\/td>\n<td>hice, hiciste, hizo, hicimos, hicisteis, hicieron<\/td>\n<td>haga, hagas, haga, hagamos, hagáis, hagan<\/td>\n<td>hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran<\/td>\n<\/tr>\n<tr>\n<td><strong>decir<\/strong><\/td>\n<td>dije, dijiste, dijo, dijimos, dijisteis, dijeron<\/td>\n<td>diga, digas, diga, digamos, digáis, digan<\/td>\n<td>dijera, dijeras, dijera, dijéramos, dijerais, dijeran<\/td>\n<\/tr>\n<tr>\n<td><strong>poder<\/strong><\/td>\n<td>pude, pudiste, pudo, pudimos, pudisteis, pudieron<\/td>\n<td>pueda, puedas, pueda, podamos, podáis, puedan<\/td>\n<td>pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran<\/td>\n<\/tr>\n<tr>\n<td><strong>poner<\/strong><\/td>\n<td>puse, pusiste, puso, pusimos, pusisteis, pusieron<\/td>\n<td>ponga, pongas, ponga, pongamos, pongáis, pongan<\/td>\n<td>pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran<\/td>\n<\/tr>\n<tr>\n<td><strong>saber<\/strong><\/td>\n<td>supe, supiste, supo, supimos, supisteis, supieron<\/td>\n<td>sepa, sepas, sepa, sepamos, sepáis, sepan<\/td>\n<td>supiera, supieras, supiera, supiéramos, supierais, supieran<\/td>\n<\/tr>\n<tr>\n<td><strong>querer<\/strong><\/td>\n<td>quise, quisiste, quiso, quisimos, quisisteis, quisieron<\/td>\n<td>quiera, quieras, quiera, queramos, queráis, quieran<\/td>\n<td>quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran<\/td>\n<\/tr>\n<tr>\n<td><strong>venir<\/strong><\/td>\n<td>vine, viniste, vino, vinimos, vinisteis, vinieron<\/td>\n<td>venga, vengas, venga, vengamos, vengáis, vengan<\/td>\n<td>viniera, vinieras, viniera, viniéramos, vinierais, vinieran<\/td>\n<\/tr>\n<tr>\n<td><strong>andar<\/strong><\/td>\n<td>anduve, anduviste, anduvo, anduvimos, anduvisteis, anduvieron<\/td>\n<td>ande, andes, ande, andemos, andéis, anden<\/td>\n<td>anduviera, anduvieras, anduviera, anduviéramos, anduvierais, anduvieran<\/td>\n<\/tr>\n<tr>\n<td><strong>traer<\/strong><\/td>\n<td>traje, trajiste, trajo, trajimos, trajisteis, trajeron<\/td>\n<td>traiga, traigas, traiga, traigamos, traigáis, traigan<\/td>\n<td>trajera, trajeras, trajera, trajéramos, trajerais, trajeran<\/td>\n<\/tr>\n<tr>\n<td><strong>conducir<\/strong><\/td>\n<td>conduje, condujiste, condujo, condujimos, condujisteis, condujeron<\/td>\n<td>conduzca, conduzcas, conduzca, conduzcamos, conduzcáis, conduzcan<\/td>\n<td>condujera, condujeras, condujera, condujéramos, condujerais, condujeran<\/td>\n<\/tr>\n<tr>\n<td><strong>dar<\/strong><\/td>\n<td>di, diste, dio, dimos, disteis, dieron<\/td>\n<td>dé, des, dé, demos, deis, den<\/td>\n<td>diera, dieras, diera, diéramos, dierais, dieran<\/td>\n<\/tr>\n<tr>\n<td><strong>ver<\/strong><\/td>\n<td>vi, viste, vio, vimos, visteis, vieron<\/td>\n<td>vea, veas, vea, veamos, veáis, vean<\/td>\n<td>viera, vieras, viera, viéramos, vierais, vieran<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Y cuando dudes de una forma que no está aquí:<\/strong> el conjugador del diccionario de la RAE, en <code>dle.rae.es<\/code>, botón «Conjugar». Buscas el infinitivo y te da la tabla entera, sin coste y sin registro.<\/p>\n<h4>Los tres verbos modelo, enteros<\/h4>\n<p><em>Cantar<\/em>, <em>comer<\/em> y <em>vivir<\/em> representan las tres conjugaciones. Todo verbo regular se conjuga como uno de ellos: se quita <em>-ar<\/em>, <em>-er<\/em> o <em>-ir<\/em> y se ponen estas terminaciones.<\/p>\n<h5>Indicativo<\/h5>\n<h6>presente<\/h6>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>cantar<\/th>\n<th>comer<\/th>\n<th>vivir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yo<\/td>\n<td>canto<\/td>\n<td>como<\/td>\n<td>vivo<\/td>\n<\/tr>\n<tr>\n<td>tú<\/td>\n<td>cantas<\/td>\n<td>comes<\/td>\n<td>vives<\/td>\n<\/tr>\n<tr>\n<td>él, ella<\/td>\n<td>canta<\/td>\n<td>come<\/td>\n<td>vive<\/td>\n<\/tr>\n<tr>\n<td>nosotros<\/td>\n<td>cantamos<\/td>\n<td>comemos<\/td>\n<td>vivimos<\/td>\n<\/tr>\n<tr>\n<td>vosotros<\/td>\n<td>cantáis<\/td>\n<td>coméis<\/td>\n<td>vivís<\/td>\n<\/tr>\n<tr>\n<td>ellos, ellas<\/td>\n<td>cantan<\/td>\n<td>comen<\/td>\n<td>viven<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h6>pretérito imperfecto<\/h6>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>cantar<\/th>\n<th>comer<\/th>\n<th>vivir<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>yo<\/td>\n<td>cantaba<\/td>\n<td>comía<\/td>\n<td>vivía<\/td>\n<\/tr>\n<tr>\n<td>tú<\/td>\n<td>cantabas<\/td>\n<td>comías<\/td>\n<td>vivías<\/td>\n<\/tr>\n<tr>\n<td>él, ella<\/td>\n<td>cantaba<\/td>\n<td>comía<\/td>\n<td>vivía<\/td>\n<\/tr>\n<tr>\n<td>nosotros<\/td>\n<td>cantábamos<\/td>\n<td>comíamos<\/td>\n<td>vivíamos<\/td>\n<\/tr>\n<tr>\n<td>vosotros<\/td>\n<td>cantabais<\/td>\n<td>comíais<\/td>\n<td>vivíais<\/td>\n<\/tr>\n<tr>\n<td>ellos, ellas<\/td>\n<td>cantaban<\/td>\n<td>comían<\/td>\n<td>vivían<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h6>pretérito perfecto simple<\/h6>\n<table>\n<thead>\n<tr>\n<th>persona<\/th>\n<th>cantar<\/th>\n<th>comer<\/th>\n<th>vivir<\/th>\n< er texto.<\/i> La profesora (estar) … explicando la rúbrica y no <b>(enterarme) ______<\/b> de casi nada.", "sol": "me enteré", "porque": "un hecho: lo que pasó aquel día", "ops": ["me enteraba", "me enteré"]}, {"enun": "<i>Primer texto.<\/i> Al salir <b>(pensar) ______<\/b> que aquello no (ser) … para mí.", "sol": "pensé", "porque": "un hecho: lo que pensó al salir", "ops": ["pensaba", "pensé"]}, {"enun": "<i>Primer texto.<\/i> Al salir (pensar) … que aquello no <b>(ser) ______<\/b> para mí.", "sol": "era", "porque": "estado, no hecho", "ops": ["fue", "era"]}, {"enun": "<i>Primer texto.<\/i> En junio <b>(aprobar) ______<\/b>.", "sol": "aprobé", "porque": "un hecho: el final de la historia", "ops": ["aprobé", "aprobaba"]}, {"enun": "<i>Segundo texto.<\/i> El verano pasado <b>(nosotros, alquilar) ______<\/b> un piso en la costa.", "sol": "alquilamos", "porque": "un hecho: el alquiler de aquel verano", "ops": ["alquilamos", "alquilábamos"]}, {"enun": "<i>Segundo texto.<\/i> <b>(Ser) ______<\/b> pequeño, pero (tener) … una terraza enorme.", "sol": "era", "porque": "describe el piso", "ops": ["fue", "era"]}, {"enun": "<i>Segundo texto.<\/i> (Ser) … pequeño, pero <b>(tener) ______<\/b> una terraza enorme.", "sol": "tenía", "porque": "describe el piso", "ops": ["tuvo", "tenía"]}, {"enun": "<i>Segundo texto.<\/i> Cada mañana <b>(yo, bajar) ______<\/b> a la playa mientras mi hermana (dormir) ….", "sol": "bajaba", "porque": "lo que se repetía cada mañana", "ops": ["bajaba", "bajé"]}, {"enun": "<i>Segundo texto.<\/i> Cada mañana (yo, bajar) … a la playa mientras mi hermana <b>(dormir) ______<\/b>.", "sol": "dormía", "porque": "lo que se repetía cada mañana", "ops": ["durmió", "dormía"]}, {"enun": "<i>Segundo texto.<\/i> Un día <b>(nosotros, conocer) ______<\/b> a unos vecinos que (vivir) … allí todo el año, y nos (invitar) … a cenar.", "sol": "conocimos", "porque": "un hecho: lo que pasó un día", "ops": ["conocíamos", "conocimos"]}, {"enun": "<i>Segundo texto.<\/i> Un día (no
