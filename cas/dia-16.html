veniente"}], "criterio": "Cada palabra vale 0,25. El sinónimo tiene que servir en la frase del texto: <i>familias modernas<\/i> no significa aquí «familias actuales», sino familias con otra estructura que la tradicional.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2014"}, "apoyo": ["4 · Seis textos reales, con su bloque 1", "2014 · Cuentos para niños malos"], "dossier_txt": "Del dossier: nudo 17, ejercicio 13 · 1.4", "texto_titulo": "2014 · Cuentos para niños malos", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Cuentos para niños malos<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Mi autor infantil favorito, Roald Dahl, es uno de los más irreverentes. Su cuento Matilda, con el<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que Danny DeVito hizo una película, es un alegato contra la familia y el colegio. El padre de Matilda es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">repulsivo. Odia la lectura y ama la televisión. Se dedica a las estafas de poca monta. Y cuando tiene que<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">huir de la policía, no le importa abandonar a su hija. Pero mucho peor es la directora de la escuela, la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">temible señorita Trunchbull, que simplemente odia a los niños y dedica su institución a torturarlos.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Los autores de libros infantiles sabemos que hoy día no se puede escribir nada de esto. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">editores están en guardia contra cualquier sospecha de valores inadecuados. Los libros infantiles no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">son considerados objetos de placer o entretenimiento, sino modelos de conducta. Las familias descritas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">deben ser agradables, y las profesoras, atentas. Los niños no deben recibir castigos, sino aprender la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lección mediante el diálogo. Y los malos tienen que perder miserablemente, aunque sin violencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Todos esos principios son muy loables, pero pueden producir libros aburridos. Por el contrario, a lo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">largo de la historia, los cuentos infantiles han sido bastante irreverentes, incluso crueles. Pulgarcito, por<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ejemplo, debe ser la pesadilla de un educador. Sus padres lo abandonan en medio del bosque para no<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">tener que alimentarlo, y él engaña al ogro para que decapite a su vez a sus propios hijos.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Con notable frecuencia, estos cuentos son censurados y reescritos. Hace un par de años compré un<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ejemplar en el que Pulgarcito no era abandonado, sino que se perdía en el bosque.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Pero los «malos ejemplos» están por todas partes: ¿Qué hacemos con la bruja antropófaga que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muere quemada en Hansel y Gretel? Podríamos ponerla vegetariana, y matarla de una neumonía. ¿Y los<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">valores sexistas de los cuentos de princesas? Quizá en vez de princesas deberíamos poner ejecutivas de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">transnacionales. ¿Y qué hay del prejuicio contra las familias modernas en Cenicienta? A lo mejor, en vez<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de madrastra, la mala debe ser «una amiga de la familia». Así nos aseguraríamos de transmitir valores<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sanos… Y cuentos insoportables.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Pensemos qué pasaría en la gran literatura si tuviese que limitarse a las lecciones edificantes. En vez<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">del ejecutivo asesino en serie de American psycho, tendríamos que poner a un jardinero macrobiótico.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">¿Absurdo? ¿Y por qué no es absurdo con los niños? ¿No confiamos en ellos? No. No confiamos en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">nosotros mismos. El férreo control de contenidos editoriales infantiles no protege a los niños, sino a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los padres. Tenemos miedo de las preguntas incómodas. Nos asusta ser incapaces de explicar por qué<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">esos padres abandonan a sus hijos o esas madrastras son malas (aunque durante siglos ha bastado la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">frase «porque es un cuento, hijo»). En suma, tenemos miedo de hablar con nuestros propios hijos. Pero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precisamente para eso se hacen los libros: para pensar, imaginar y discutir.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Si eliminamos de los libros todo lo que nos parezca inapropiado, no salvaremos a nuestros hijos de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las malas ideas. Al contrario, los volveremos incapaces de reconocerlas. Lo que sí lograremos es que los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chicos abandonen la lectura y se entreguen a la PlayStation, donde pueden matar a un montón de gente<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">sin que nadie se queje.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Santiago Roncagliolo, <\/em>El País Semanal<em>, 20 de diciembre de 2013, tal como la imprimió la prueba de 2014.<\/em><\/p>"}, {"tipo": "hueco", "titulo": "¿En qué línea está?", "ayuda": "Pasada 3, cronometrada. Escribe el número de la línea donde empieza la respuesta.", "items": [{"enun": "¿Cuánta gente pasa por la peluquería el sábado?", "sol": "2|3"}, {"enun": "¿Cuántos comercios abren el sábado ahora, y cuántos hace diez años?", "sol": "6|7"}, {"enun": "Según Fina, ¿por qué cerraron los que cerraron?", "sol": "7|8|9"}, {"enun": "¿Qué la obliga a ella a abrir el sábado?", "sol": "12|13"}, {"enun": "¿En qué línea empieza la idea general con la que cierra?", "sol": "19|20"}], "criterio": "Las cinco están donde anunciaba la arquitectura. La pregunta sobre los comercios que cerraron lleva «según Fina», así que la respuesta tiene que ir atribuida a ella y no darse como un hecho del texto.", "apoyo": ["2 · Responder sin copiar", "4 · Seis textos reales, con su bloque 1"], "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico", "ayuda": "Cuatro palabras del texto. Lee <b>la frase entera<\/b> donde están antes de decidir.", "items": [{"enun": "<b>sostiene<\/b> <i>(línea 2)<\/i>", "ops": ["afirma con seguridad", "mantiene económicamente", "aguanta un peso físico"], "sol": "mantiene económicamente", "porque": "en esa frase, el sábado hace viable el negocio"}, {"enun": "<b>convenio<\/b> <i>(línea 16)<\/i>", "ops": ["contrato de alquiler", "reunión de vecinos", "acuerdo entre empresa y trabajadores"], "sol": "acuerdo entre empresa y trabajadores"}, {"enun": "<b>autónomo<\/b> <i>(línea 19)<\/i>", "ops": ["quien trabaja por cuenta propia", "quien decide con independencia", "quien no depende de nadie"], "sol": "quien trabaja por cuenta propia", "porque": "las otras dos son el sentido general de la palabra; aquí es el laboral"}, {"enun": "<b>libra<\/b> <i>(línea 16)<\/i>", "ops": ["pesa", "tiene el día libre", "paga"], "sol": "tiene el día libre", "porque": "de <i>librar<\/i>: no trabajar ese día. No guarda relación con la libra de peso"}], "criterio": "La de <i>autónomo<\/i> resume el ejercicio entero. La palabra tiene un sentido general —«que no depende de nadie»— y uno laboral, y el texto juega precisamente con esa diferencia en su última frase. Contestar el general aquí descuenta el cuarto de punto.", "apoyo": ["4 · Seis textos reales, con su bloque 1"], "solo_web": true}, {"tipo": "abierta", "titulo": "Dos preguntas sobre el texto", "ayuda": "Cuatro o cinco líneas cada una. Atribuidas, sin copiar y sin opinar. Nueve minutos para las dos.", "items": [{"enun": "<b>a)<\/b> «Según Fina, ¿por qué han cerrado los comercios que han cerrado <b>y<\/b> qué la obliga a ella a seguir abriendo?» <i>[0,75]<\/i>", "modelo": "Ella lo atribuye a la edad de los dueños más que a la falta de clientes: llega un momento en que descansar el séptimo día pesa más que lo que se ingresa ese día. A ella, en cambio, la obliga una razón económica: el alquiler del local se paga los siete días y con seis de apertura no le sale la cuenta."}, {"enun": "<b>b)<\/b> «Explique en qué consiste la crítica que hace al uso de la palabra <i>autónomo<\/i>.» <i>[0,75]<\/i>", "modelo": "Sostiene que el término se emplea para hablar de libertad de horarios cuando en su situación significa lo contrario. Al no depender de un convenio, nadie le impone el horario, pero tampoco hay nadie que pueda quitárselo: la ausencia de norma, presentada como una ventaja, la deja sin descanso."}], "criterio": "Las dos respuestas modelo cumplen tres condiciones que hay que copiar. <b>Una:<\/b> van atribuidas —«ella lo atribuye», «sostiene»— porque el enunciado pide «según Fina». <b>Dos:<\/b> contestan a las <b>dos<\/b> partes de la «y» en la pregunta de los cierres. <b>Tres:<\/b> no copian fragmentos: ninguna cadena de tres palabras del original, la medida de clase.<br><br>Y ninguna de las dos afirma si le parece justo: la pregunta es qué sostiene Fina, no qué opina quien contesta.", "remate": "Nueve minutos para las dos. Si has tardado quince, has escrito de más: cuenta cuántas líneas te han salido y compáralas con las cuatro o cinco que pedía.", "apoyo": ["2 · Responder sin copiar"], "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartados 1, 2 y 4: Cómo se lee un texto de examen; Responder sin copiar; Seis textos reales, con su bloque 1 (p. 40, 44 y 48) · ejercicio 13", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El adverbio", "meta": "30 minutos · el apartado que más ítems cubre del trimestre", "cuaderno": {"nudo": 11, "apartados": [1], "ejercicios": [1, 2, 3]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> este nudo aparece en dos ejercicios distintos. En el de <strong>expresión equivalente<\/strong> —1 punto hasta 2023 y 0,75 desde 2024— casi todo lo que mandan sustituir son adverbios, locuciones adverbiales o conjunciones. Y en el de <strong>función sintáctica<\/strong>, la mayoría de los sintagmas se resuelven con una sola pregunta: ¿el verbo arrastra preposición o no?<\/div>\n<blockquote>\n<p>Son las palabras que <strong>no cambian<\/strong>: no tienen género ni número, se escriben siempre igual.<\/p>\n<\/blockquote>\n<h3>1 · El adverbio<\/h3>\n<p><strong>El adverbio modifica<\/strong>, y modifica tres clases de palabra: un verbo (<em>llegó<\/em> <strong>tarde<\/strong>), un adjetivo (<em>es<\/em> <strong>muy<\/strong> <em>caro<\/em>) u otro adverbio (<em>bastante<\/em> <strong>lejos<\/strong>).<\/p>\n<table>\n<thead>\n<tr>\n<th>clase<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>lugar<\/td>\n<td>aquí, allí, cerca, lejos, delante, fuera, arriba<\/td>\n<\/tr>\n<tr>\n<td>tiempo<\/td>\n<td>ayer, hoy, luego, todavía, siempre, mientras<\/td>\n<\/tr>\n<tr>\n<td>modo<\/td>\n<td>bien, mal, deprisa, así, despacio<\/td>\n<\/tr>\n<tr>\n<td>cantidad<\/td>\n<td>mucho, poco, bastante, demasiado, casi, más<\/td>\n<\/tr>\n<tr>\n<td>afirmación<\/td>\n<td>sí, también, ciertamente<\/td>\n<\/tr>\n<tr>\n<td>negación<\/td>\n<td>no, tampoco, nunca, jamás<\/td>\n<\/tr>\n<tr>\n<td>duda<\/td>\n<td>quizá, acaso, tal vez<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Locuciones adverbiales<\/strong>: dos o más palabras que funcionan como un adverbio. El ejercicio de expresión equivalente pide sustituirlas por otra que diga lo mismo, y casi siempre hay un adverbio en <em>-mente<\/em> que sirve. Media docena de estas han caído literalmente en el examen.<\/p>\n<table>\n<thead>\n<tr>\n<th>locución<\/th>\n<th>clase<\/th>\n<th>equivalentes que valen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a menudo<\/td>\n<td>tiempo<\/td>\n<td>frecuentemente, con frecuencia, muchas veces<\/td>\n<\/tr>\n<tr>\n<td>de vez en cuando · en ocasiones<\/td>\n<td>tiempo<\/td>\n<td>a veces, ocasionalmente, algunas veces<\/td>\n<\/tr>\n<tr>\n<td>a diario<\/td>\n<td>tiempo<\/td>\n<td>diariamente, cada día, todos los días<\/td>\n<\/tr>\n<tr>\n<td>de repente · de pronto<\/td>\n<td>modo<\/td>\n<td>repentinamente, súbitamente, de golpe<\/td>\n<\/tr>\n<tr>\n<td>de nuevo<\/td>\n<td>tiempo<\/td>\n<td>otra vez, nuevamente<\/td>\n<\/tr>\n<tr>\n<td>en seguida<\/td>\n<td>tiempo<\/td>\n<td>inmediatamente, al momento<\/td>\n<\/tr>\n<tr>\n<td>poco a poco<\/td>\n<td>modo<\/td>\n<td>gradualmente, despacio, paulatinamente<\/td>\n<\/tr>\n<tr>\n<td>al final · por fin<\/td>\n<td>tiempo<\/td>\n<td>finalmente, por último<\/td>\n<\/tr>\n<tr>\n<td>sin duda<\/td>\n<td>afirmación<\/td>\n<td>indudablemente, ciertamente, seguro<\/td>\n<\/tr>\n<tr>\n<td>tal vez · a lo mejor<\/td>\n<td>duda<\/td>\n<td>quizá, quizás, acaso, posiblemente<\/td>\n<\/tr>\n<tr>\n<td>sobre todo<\/td>\n<td>cantidad<\/td>\n<td>especialmente, principalmente<\/td>\n<\/tr>\n<tr>\n<td>a lo lejos · a la derecha<\/td>\n<td>lugar<\/td>\n<td>lejos, allí; al lado derecho<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un aviso de ortografía: <em>sobre todo<\/em> y <em>tal vez<\/em> se escriben en dos palabras; la clave de 2017 glosa «sobre todo» como «especialmente».<\/p>\n<p><strong>Los adverbios en <em>-mente<\/em><\/strong> se forman sobre el femenino del adjetivo (<em>rápida<\/em> → <em>rápidamente<\/em>) y <strong>conservan la tilde del adjetivo<\/strong>: <em>fácil<\/em> → <em>fácilmente<\/em>. Si van dos seguidos, solo el último lleva <em>-mente<\/em>; el primero queda en femenino y conserva su tilde: <em>habló clara y rápidamente<\/em>, <em>lo hizo rápida y fácilmente<\/em>.<\/p>\n<p><strong>Tres parejas que hay que dejar cerradas:<\/strong><\/p>\n<ul>\n<li><strong>muy / mucho<\/strong>: <em>muy<\/em> va delante de adjetivo o adverbio (<em>muy caro<\/em>, <em>muy lejos<\/em>); <em>mucho<\/em> va con el verbo (<em>come mucho<\/em>). Excepción: delante de <em>mayor, menor, mejor, peor<\/em> y de <em>más<\/em> se dice <em>mucho<\/em> (<em>mucho mejor<\/em>, <em>mucho más caro<\/em>).<\/li>\n<li><strong>aún / aun<\/strong>: con tilde cuando significa 'todavía' (<em>aún no ha llegado<\/em>); sin tilde cuando significa 'incluso' (<em>aun así lo hizo<\/em>). Las dos han caído: en 2020 pedían el equivalente de <em>aún<\/em> (→ <em>todavía<\/em>) y en 2021 el de <em>aun<\/em> (→ <em>incluso<\/em>).<\/li>\n<li><strong><em>solo<\/em> no necesita tilde<\/strong> desde la Ortografía de 2010, tampoco cuando significa 'solamente': sin tilde nunca es falta (nudo 3). En 2022 cayó como ítem, y la clave dio <em>solamente, únicamente, exclusivamente<\/em>.<\/li>\n<\/ul>\n<p>Y una falta frecuente: <strong>el adverbio no concuerda<\/strong>. <em>Están medio dormidas<\/em>, no <em>medias dormidas<\/em>. <em>Trabajan duro<\/em>, no <em>duros<\/em>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Expresión equivalente: diez ítems reales", "dossier": {"cuaderno": "11", "ejercicio": 1}, "ayuda": "Diez adverbios y locuciones de exámenes reales, con la convocatoria entre paréntesis. Escribe una expresión equivalente. Se aceptan las de las claves oficiales y otras que signifiquen lo mismo.", "items": [{"enun": "<b>quizá<\/b> (2011)", "sol": "tal vez|acaso|a lo mejor|posiblemente", "corto": false}, {"enun": "<b>luego<\/b>: «valorar varios aspectos de su propio físico» […] «y luego los mismos aspectos en otras personas»", "conv": "2017", "sol": "después|más tarde|posteriormente", "corto": false}, {"enun": "<b>sencillamente<\/b> (2013)", "sol": "simplemente|llanamente", "corto": false}, {"enun": "<b>así<\/b>: «Así funcionamos desde que el mundo es mundo»", "conv": "2013", "sol": "de esta manera|de este modo|de esta forma", "corto": false}, {"enun": "<b>hoy día<\/b> (2014)", "sol": "actualmente|hoy en día|en la actualidad", "corto": false}, {"enun": "<b>a diario<\/b> (2015)", "sol": "todos los días|diariamente|cada día", "corto": false}, {"enun": "<b>sobre todo<\/b> (2017)", "sol": "especialmente|principalmente|particularmente", "corto": false}, {"enun": "<b>de nuevo<\/b> (2018)", "sol": "otra vez|nuevamente", "corto": false}, {"enun": "<b>en ocasiones<\/b> (2022)", "sol": "a veces|ocasionalmente|de tanto en tanto|de vez en cuando|algunas veces", "corto": false}, {"enun": "<b>apenas<\/b> (2026)", "sol": "escasamente|casi no", "corto": false}], "criterio": "Las claves oficiales dan una expresión del mismo significado y de la misma clase: <i>quizá<\/i>, <i>tal vez<\/i>; <i>a diario<\/i>, <i>todos los días<\/i>; <i>en ocasiones<\/i>, <i>a veces<\/i>. Muchas locuciones tienen un adverbio en <i>-mente<\/i> que las sustituye: <i>de nuevo<\/i>, <i>nuevamente<\/i>; <i>hoy día<\/i>, <i>actualmente<\/i>.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 11, ejercicio 1"}, {"tipo": "clasificar", "titulo": "¿Adverbio, adjetivo o determinante?", "dossier": {"cuaderno": "11", "ejercicio": 2}, "ayuda": "Dieciséis frases: catorce del dossier y dos añadidas aquí. Indica la clase de la palabra en negrita y comprueba si concuerda.", "ops": ["adverbio", "adjetivo", "determinante"], "items": [{"enun": "Habla <b>bajo<\/b>.", "sol": "adverbio", "porque": "modifica a <i>habla<\/i>"}, {"enun": "Habla <b>claro<\/b>.", "sol": "adverbio", "porque": "modifica a <i>habla<\/i> y no cambia de forma"}, {"enun": "Están <b>medio<\/b> dormidas.", "sol": "adverbio", "porque": "invariable: <i>medio<\/i>, no <i>medias<\/i>"}, {"enun": "Vinieron <b>bastantes<\/b> compañeros.", "sol": "determinante", "porque": "determinante indefinido: concuerda con <i>compañeros<\/i>"}, {"enun": "Trabajan <b>duro<\/b>.", "sol": "adverbio", "porque": "modifica a <i>trabajan<\/i>; por eso no <i>duros<\/i>"}, {"enun": "Es un coche <b>rápido<\/b>.", "sol": "adjetivo", "porque": "acompaña a <i>coche<\/i>: <i>coches rápidos<\/i>"}, {"enun": "Tiene la voz <b>clara<\/b>.", "sol": "adjetivo", "porque": "acompaña a <i>voz<\/i> y concuerda con ella"}, {"enun": "Es <b>bastante<\/b> tarde.", "sol": "adverbio", "porque": "modifica a <i>tarde<\/i> y es invariable"}, {"enun": "El pan está <b>duro<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>pan<\/i>: <i>panes duros<\/i>"}, {"enun": "Corre <b>rápido<\/b>.", "sol": "adverbio", "porque": "modifica a <i>corre<\/i>; no concuerda: <i>corren rápido<\/i>"}, {"enun": "Tienen el pelo <b>largo<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>pelo<\/i>: <i>pelos largos<\/i>"}, {"enun": "Hay <b>poca<\/b> luz.", "sol": "determinante", "porque": "determinante indefinido: concuerda con <i>luz<\/i>"}, {"enun": "Llegaron <b>temprano<\/b>.", "sol": "adverbio", "porque": "adverbio de tiempo: modifica a <i>llegaron<\/i>"}, {"enun": "Duerme <b>poco<\/b>.", "sol": "adverbio", "porque": "adverbio de cantidad: modifica a <i>duerme<\/i>"}, {"enun": "El techo es <b>bajo<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>techo<\/i>: <i>techos bajos<\/i>"}, {"enun": "Compró <b>muchas<\/b> naranjas.", "sol": "determinante", "porque": "determinante indefinido: concuerda con <i>naranjas<\/i>"}], "criterio": "El adverbio no cambia de forma: <i>habla claro<\/i>, <i>hablan claro<\/i>. El adjetivo concuerda con el sustantivo: <i>voz clara<\/i>, <i>techos bajos<\/i>. El determinante va delante del sustantivo y también concuerda: <i>bastantes compañeros<\/i>, <i>poca luz<\/i>. La misma palabra puede ser las tres cosas: <i>bastante tarde<\/i>, <i>bastantes compañeros<\/i>.", "usa_texto": false, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 11, ejercicio 2"}, {"tipo": "opcion", "titulo": "Muy o mucho, aún o aun, solo", "dossier": {"cuaderno": "11", "ejercicio": 3}, "ayuda": "Elige la forma del paréntesis que corresponde a la oración.", "estricto": true, "items": [{"enun": "Este ejercicio es <b>(muy / mucho)<\/b> mejor que el otro.", "sol": "mucho", "porque": "delante de <i>mejor<\/i>", "ops": ["mucho", "muy"]}, {"enun": "Llegó <b>(muy / mucho)<\/b> tarde.", "sol": "muy", "porque": "delante de un adverbio", "ops": ["muy", "mucho"]}, {"enun": "Estudia <b>(muy / mucho)<\/b>.", "sol": "mucho", "porque": "con el verbo", "ops": ["mucho", "muy"]}, {"enun": "Vino <b>(sólo / solo)<\/b> una persona.", "sol": "solo", "porque": "sin tilde: la tilde solo se admite ante una ambigüedad, y aquí no la hay", "ops": ["solo", "sólo"]}, {"enun": "<b>(Aún / Aun)<\/b> no me han contestado.", "sol": "Aún", "porque": "equivale a «todavía»", "ops": ["Aun", "Aún"]}, {"enun": "Trabaja <b>(muy / mucho)<\/b> des   function norm(s) {

  function tiene(texto, v) {

    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';

  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres

  function negado(antes) {

  function normT(s) {

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------

  var ventana = null, disparador = null;

    teoria: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5c2.5-1 5-1 7.5.5 2.5-1.5 5-1.5 7.5-.5v11c-2.5-1-5-1-7.5.5-2.5-1.5-5-1.5-7.5-.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5v11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
  };
  function envuelveTablas(nodo) {

  /* La teoría que sale del dossier trae un h3 por apartado, y una sesión puede

  var PLIEGUE = 1200;

  /* la teoría del carril partida en bloques: lo anterior al primer encabezado y

  function bloquesTeoria(html) {

    var out = [{ titulo: '', html: partes[0], padre: null }], h3 = null;

  function teoriaDe(c, ej) {

      if (!elegidos.length) parcial = false;
      else {
        elegidos.forEach(function (b) { frag.appendChild(el('div', 'v-bloque', b.html)); });
        var det = el('details', 'v-todo');
        det.appendChild(el('summary', null, 'Toda la teoría de este carril'));
        det.appendChild(el('div', 'v-bloque', c.teoria));
        frag.appendChild(det);
      }
    }
    if (!parcial) frag.appendChild(el('div', 'v-bloque', c.teoria));
    return envuelveTablas(frag);
  }
  function botonIcono(clase, icono, etiqueta, titulo) {
    var b = el('button', 'ej-ico ' + clase, icono + '<span>' + etiqueta + '</span>');
    b.type = 'button';
    b.title = titulo;
    b.setAttribute('aria-label', titulo);
    return b;
  }
  /* ¿el ejercicio pregunta por el texto del día? Se miran el título, la ayuda y
     los enunciados: la línea, el párrafo, el autor, «el texto». Los martes de
     PAU el texto va en su propio carril y las preguntas sobre él, en otros; sin
     esto, esas preguntas no llevaban el icono. "usa_texto" en el JSON manda. */
  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {
    if (ej.usa_texto === true || ej.usa_texto === false) return ej.usa_texto;
    if (ej.tipo === 'cazar') return false;   /* lleva su propio texto */
    var todo = [ej.titulo || '', ej.ayuda || ''];
    (ej.items || []).forEach(function (it) { todo.push(it.enun || ''); });
    return RE_TEXTO.test(todo.join(' ').replace(/<[^>]+>/g, ' '));
  }

  /* ---------- persistencia ---------- */
  function carga() {
    try {
      var x = localStorage.getItem(LLAVE);
      estado = x ? JSON.parse(x) : {};
    } catch (e) { estado = {}; }
    estado = compatible(estado);
  }
  /* Si la página ha cambiado de versión (DIA.revision), los ejercicios ya no
     están en el mismo orden y el progreso guardado apuntaría a otro sitio:
     se descarta. Sin revisión declarada, se acepta todo, como antes. */
  function compatible(e) {
    if (!e || typeof e !== 'object') return {};
    if (DIA.revision && e._rev !== DIA.revision) return {};
    return e;
  }
  function guarda() {
    try {
      if (DIA.revision) estado._rev = DIA.revision;
      localStorage.setItem(LLAVE, JSON.stringify(estado));
    } catch (e) { }
  }
  function est(n) {
    if (!estado[n]) estado[n] = { v: {}, r: {}, hecho: false };
    return estado[n];
  }

  /* ---------- render de un ejercicio ---------- */
  function pinta(ej, idx) {
    var n = idx + 1;
    var box = el('div', 'ej');
    box.id = 'ej' + n;

    var h = el('div', 'ej-h');
    h.appendChild(el('div', 'num', String(n)));
    h.appendChild(el('div', 'ej-t', ej.titulo));
    box.appendChild(h);
    /* de qué ejercicio del dossier sale: el mismo que el alumno tiene en papel */
    if (ej.dossier_txt) box.appendChild(el('p', 'ej-dossier', ej.dossier_txt));
    if (ej.ayuda) box.appendChild(el('p', 'ej-ayuda', ej.ayuda));

    var cont = el('div', 'items');
    box.appendChild(cont);
    var e = est(n);
    if (ej.tipo === 'cazar' && e.versionCaza !== 2) {
      delete e.mejor;
      e.versionCaza = 2;
    }

    function cambio() {
      e.hecho = false;
      e.r = {};
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
      });
      guarda(); marcaTxt(); progreso();
    }

    (ej.items || []).forEach(function (it, i) {
      var k = String(i + 1);
      var fila = el('div', 'item');
      fila.dataset.k = k;
      var lin = el('div', 'item-l');
      if ((ej.items || []).length > 1) lin.appendChild(el('span', 'letra', letra(i) + ')'));
      var enun = el('div', 'enun');
      enun.innerHTML = it.enun || it.palabra || '';
      enun.id = 'enun-' + n + '-' + k;
      lin.appendChild(enun);
      if (it.conv) lin.appendChild(el('span', 'conv', it.conv));
      fila.appendChild(lin);

      var campo;
      if (ej.tipo === 'opcion') {
        campo = el('div', 'ops');
        (it.ops || ej.ops || []).forEach(function (o) {
          var b = el('button', 'op', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', e.v[k] === o ? 'true' : 'false');
          b.onclick = function () {
            campo.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            e.v[k] = o; cambio();
          };
          campo.appendChild(b);
        });
        lin.appendChild(campo);

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {
        campo = el('textarea');
        campo.value = e.v[k] || '';
        campo.placeholder = ej.pide || (ej.tipo === 'justificar' ? 'Explica por qué…' : 'Escribe aquí tu respuesta…');
        var cuenta = null;
        /* la consigna de extensión puede ir en el ítem: el mismo plan, en 50-80 y en 150-200 */
        var P0 = it.palabras || ej.palabras;
        if (ej.tipo === 'abierta' && P0) {
          /* consigna de extensión: {min, max} o {objetivo}. Se cuenta lo escrito,
             que es lo que el alumno tiene que hacer en el examen antes de entregar */
          campo.classList.add('larga');
          cuenta = el('div', 'cuenta', '');
          var pintaCuenta = function () {
            var n = (campo.value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
            var P = P0, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {
              t += ' · consigna: entre ' + P.min + ' y ' + P.max;
              fuera = n > 0 && (n < P.min || n > P.max);
            } else if (P.objetivo != null) {
              t += ' · consigna: unas ' + P.objetivo;
              fuera = n > 0 && n < 50;   /* por debajo de cincuenta, la redacción es cero */
            }
            cuenta.textContent = t;
            cuenta.classList.toggle('fuera', fuera);
          };
          pintaCuenta();
        }
        campo.oninput = function () { e.v[k] = campo.value; if (cuenta) pintaCuenta(); cambio(); };
        fila.appendChild(campo);
        if (cuenta) fila.appendChild(cuenta);

      } else if (ej.tipo === 'cazar') {
        /* cada palabra se identifica por su POSICIÓN, no por cómo se escribe:
           si «había» sale dos veces, son dos dianas distintas */
        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      /* una clave con varias respuestas válidas las separa con «|» en el JSON;
         en pantalla van con « / », que se lee y deja cada palabra entera */
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' +
        String(it.sol).split('|').join(' / ')));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        /* el pie de los textos de examen acaba con el nombre del cuadernillo
           —Exámenes/2019_general_llengua_castellana_titular.pdf—: un <wbr> detrás
           de cada barra y de cada guion bajo deja partir el renglón por ahí, y no
           por dentro de una palabra. Las etiquetas no se tocan. */
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie.split(/(<[^>]+>)/).map(function (s, i) {
          return i % 2 ? s : s.replace(/([\/_])/g, '$1<wbr>');
        }).join('')));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', c.teoria_dossier ? 'teoria dossier' : 'teoria', c.teoria);
        if (c.teoria_dossier) pliegaApartados(t);
        envuelveTablas(t);
        sec.appendChild(t);
      }
      var yaWeb = false;
      (c.ejercicios || []).forEach(function (ej) {
        /* los ejercicios del dossier van primero; los que no están en papel,
           detrás de un rótulo que lo dice */
        if (ej.solo_web && !yaWeb) {
          sec.appendChild(el('p', 'solo-web', 'Práctica que solo está en la web'));
          yaWeb = true;
        }
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        /* "usa_texto": false quita el icono también en el carril del texto: lo
           llevan las preguntas que van sobre otro texto, el que trae la teoría */
        var li = ej.usa_texto === false || ej.texto_html ? -1 :
          (c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1));
        /* el ejercicio que pregunta por un texto del dossier que hoy no está en
           la página (el de 2026 después del 20 de octubre) trae el suyo */
        if (ej.texto_html) {
          var btx = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          btx.onclick = function () {
            var caja = envuelveTablas(el('div', 'teoria dossier', ej.texto_html));
            abreVentana(c.chapa + ' · el texto', ej.texto_titulo || 'El texto', caja, btx);
          };
          iconos.appendChild(btx);
        }
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
    vigilaCortes();
  }

  /* Ninguna palabra se parte de un renglón a otro (lo pidió Osky el
     24-09-2026). El navegador admite un corte detrás de un guion, de una
     barra o de unos puntos suspensivos, y a los dos lados de una raya: «-aba»
     podía quedar con el guion al final de una línea y «aba» al principio de
     la siguiente, y una raya de cierre podía abrir renglón. Cada palabra que
     lleva uno de esos signos va
     en un <span class="nb">, que no se parte. Las de más de treinta
     caracteres, como un nombre de archivo o un enlace, se dejan partir,
     porque en un móvil no caben en un renglón. Los textos de «cazar» no se
     tocan: cada palabra ya es su propio <span class="tk">. */
  var PARTIBLE = /[-\u2010\u2011\u2013\u2014\u2026\/]/;
  function partible(t) { return t.length > 1 && t.length <= 30 && PARTIBLE.test(t); }
  function sinPartir(raiz) {
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentElement;
        if (!p || !PARTIBLE.test(n.data)) return NodeFilter.FILTER_REJECT;
        if (p.closest('script,style,textarea,.caza,.nb')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodos = [];
    while (w.nextNode()) nodos.push(w.currentNode);
    nodos.forEach(function (n) {
      var trozos = n.data.split(/(\s+)/);
      if (!trozos.some(partible)) return;
      var frag = document.createDocumentFragment();
      trozos.forEach(function (t) {
        if (partible(t)) {
          var s = document.createElement('span');
          s.className = 'nb';
          s.textContent = t;
          frag.appendChild(s);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }
  /* la página se pinta entera al arrancar, pero la ventana de teoría, las
     soluciones y los veredictos se escriben después: se vigila el cuerpo */
  function vigilaCortes() {
    sinPartir(document.body);
    new MutationObserver(function (cambios) {
      cambios.forEach(function (c) {
        c.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) sinPartir(n);
          else if (n.nodeType === 3 && n.parentElement) sinPartir(n.parentElement);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
