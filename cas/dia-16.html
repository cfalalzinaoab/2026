<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 16 · 19 nov · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

  margin:0 .12em -.1em;vertical-align:baseline;max-width:40%}
th.vacia,td.vacia{border:0;background:transparent;width:14px;padding:0}
/* un texto de examen dentro de la teoría: una fila por línea, como la lectura */
.textoexamen{border:1px solid var(--linea);border-radius:8px;padding:14px 17px;margin:14px 0 18px;
  background:var(--fondo);font-size:14px;line-height:1.75}
.textoexamen .ln{display:flex;gap:11px;align-items:baseline}
.textoexamen .ln.blanca{height:9px}
.textoexamen .n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* una línea del examen que no cabe sigue debajo con sangría: sin ella, el trozo
   partido parece otra línea y la numeración de cinco en cinco se descoloca */
.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}
@media(max-width:560px){.textoexamen{padding:12px 12px;font-size:13px}.textoexamen .n{flex-basis:17px}}
/* por encima de mil doscientas palabras, cada apartado se pliega bajo su título */
details.ap-dossier{border-top:1px solid var(--linea)}
details.ap-dossier+details.ap-dossier{margin-top:0}
details.ap-dossier:last-of-type{border-bottom:1px solid var(--linea);margin-bottom:10px}
details.ap-dossier>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:13px 0;user-select:none}
details.ap-dossier>summary::-webkit-details-marker{display:none}
details.ap-dossier>summary::before{content:"▸";color:var(--acento);font-size:14px;flex:0 0 auto}
details.ap-dossier[open]>summary::before{content:"▾"}
details.ap-dossier>summary>h3{margin:0;padding:0;border:0;font-size:16px}
details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}
@media print{details.ap-dossier>summary::before{display:none}}
/* de qué ejercicio del dossier sale el de la web */
.ej-dossier{margin:-2px 0 8px 37px;font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3)}
@media(max-width:560px){.ej-dossier{margin-left:0}}
/* el rótulo que separa los ejercicios del dossier de la práctica que solo está en la web */
.solo-web{margin:38px 0 0;padding-top:14px;border-top:2px dashed var(--linea);
  font:700 11px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tinta3)}
/* la terna de un ejercicio de huecos: las tres formas entre paréntesis */
.terna{color:var(--tinta2);white-space:nowrap}
/* una palabra con guion, barra o raya no se parte de un renglón a otro:
   motor.js la mete en un <span class="nb"> (sinPartir) */
.nb{white-space:nowrap}

<script>window.DIA = {"dia": 16, "fecha": "2026-11-19", "tab": "Día 16 · 19 nov · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 16", "h1": "Jueves 19 de noviembre", "sub": "Sino, también, sobre todo · el bloque 1 entero · el adverbio", "carriles": [{"chapa": "Carril A", "titulo": "Palabras que se separan (2)", "meta": "30 minutos · sino, tan bien, sobre todo, de más", "cuaderno": {"nudo": "4bis", "apartados": [3], "ejercicios": [7, 8]}, "teoria": "<h3>3 · Palabras que se separan<\/h3>\n<h4>3.1 · <em>por qué<\/em>, <em>porque<\/em>, <em>el porqué<\/em>, <em>por que<\/em><\/h4>\n<p><em>Por qué<\/em>, <em>porque<\/em>, <em>el porqué<\/em> y <em>por que<\/em> suenan igual y se escriben de cuatro maneras distintas. Las cuatro aparecen en la prueba: las preguntas de comprensión del bloque 1 se formulan con <em>por qué<\/em> —en la convocatoria 2026, «Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola?», 0,75 puntos—, la respuesta se construye con <em>porque<\/em>, y en la redacción cada razón que se justifica lleva un <em>porque<\/em> delante.<\/p>\n<table>\n<thead>\n<tr>\n<th>forma<\/th>\n<th>función<\/th>\n<th>cómo se comprueba<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>por qué<\/strong> (dos palabras, con tilde)<\/td>\n<td>la pregunta, directa o indirecta<\/td>\n<td>admite <em>razón<\/em> dentro: «¿Por qué [razón] lo hizo?»<\/td>\n<\/tr>\n<tr>\n<td><strong>porque<\/strong> (una palabra, sin tilde)<\/td>\n<td>la respuesta, la causa<\/td>\n<td>se puede cambiar por <em>ya que<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>el porqué<\/strong> (una palabra, con tilde)<\/td>\n<td>un sustantivo, <em>el motivo<\/em><\/td>\n<td>lleva delante <em>el<\/em>, <em>un<\/em>, <em>su<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>por que<\/strong> (dos palabras, sin tilde)<\/td>\n<td>preposición <em>por<\/em> + <em>que<\/em>: conjunción (<em>luchan por que se apruebe<\/em>) o relativo (<em>la razón por que<\/em> = <em>por la que<\/em>). Raro<\/td>\n<td>si dudas, <strong>descártala<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>En el texto de la convocatoria 2024: «…es original y valiente, sino también sensato, <strong>porque<\/strong> ha apostado por un modelo que ha funcionado». Una palabra, sin tilde: introduce la causa y admite el cambio por <em>ya que<\/em>.<\/p>\n<h4>3.2 · <em>a ver<\/em> / <em>haber<\/em><\/h4>\n<ul>\n<li><strong>haber<\/strong>, con h, pertenece al verbo <em>haber<\/em>. Va detrás de <em>va a<\/em>, <em>puede<\/em>, <em>debe<\/em>, <em>tiene que<\/em>, o delante de un participio. En el texto de 2020: «se vanagloriaba <strong>de haber abatido<\/strong> piezas de 420 especies».<\/li>\n<li><strong>a ver<\/strong>, en dos palabras, se compone de la preposición <em>a<\/em> y el verbo <em>ver<\/em>. Detrás admite a menudo <em>si<\/em> o <em>qué<\/em>: «vamos <strong>a ver qué<\/strong> pasa». Prueba rápida: si puedes decir «a mirar», corresponde <em>a ver<\/em>; si puedes decir «existir» o va delante de un participio, corresponde <em>haber<\/em>.<\/li>\n<\/ul>\n<h4>3.3 · <em>sino<\/em> / <em>si no<\/em><\/h4>\n<p><strong>sino<\/strong> (una palabra) corrige algo que acabas de negar. La fórmula es <em>no… sino…<\/em>. Tres ejemplos reales:<\/p>\n<ul>\n<li>2013: «Y <strong>no<\/strong> solo más lenta, <strong>sino<\/strong> menos eficiente.»<\/li>\n<li>2020: «este tipo de cacerías crueles de seres en peligro <strong>no<\/strong> hacen <strong>sino<\/strong> aumentar.»<\/li>\n<li>2023: «lo que me acongoja de verdad <strong>no<\/strong> es que existan esos monstruos, <strong>sino que<\/strong> un nutrido número de buenos hombres se sientan aludidos.»<\/li>\n<\/ul>\n<p><strong>si no<\/strong> (dos palabras) es una condición negada: <em>si<\/em> + <em>no<\/em>. Prueba: puedes meter algo entre las dos palabras. «<strong>Si<\/strong> [tú] <strong>no<\/strong> vienes, empezamos sin ti.»<\/p>\n<h4>3.4 · Tres pares más<\/h4>\n<table>\n<thead>\n<tr>\n<th>dos palabras<\/th>\n<th>una palabra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>tan bien<\/strong> = de manera tan buena. <em>Nunca escribió tan bien como aquel año.<\/em><\/td>\n<td><strong>también<\/strong> = además. <em>También vinieron los vecinos.<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>sobre todo<\/strong> = especialmente, la forma que aparece casi siempre<\/td>\n<td><strong>sobretodo<\/strong> = un abrigo, de uso poco frecuente<\/td>\n<\/tr>\n<tr>\n<td><strong>de más<\/strong> = de sobra. <em>Me han dado dos euros de más.<\/em><\/td>\n<td><strong>demás<\/strong> = los otros. <em>Vinieron Ana y las demás.<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>De <em>sobre todo<\/em> hay constancia oficial: en la convocatoria 2017 cayó en el ejercicio de léxico, «sobre todo» (línea 7), y la solución la glosa como «especialmente». Dos palabras.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Sino o si no", "dossier": {"cuaderno": "4bis", "ejercicio": 7}, "ayuda": "Escribe <i>sino<\/i> o <i>si no<\/i>. Si entre las dos palabras se puede meter otra, van separadas.", "estricto": true, "items": [{"enun": "No es un problema de dinero ______ de tiempo.", "sol": "sino", "porque": "corrige lo negado: <i>no… de dinero, sino de tiempo<\/i>", "corto": false}, {"enun": "______ llegas a las ocho, no entras.", "sol": "Si no", "porque": "condición: admite algo en medio, «si [tú] no llegas»", "corto": false}, {"enun": "No vino ella ______ su hermano.", "sol": "sino", "porque": "corrige lo negado: <i>no vino ella, sino su hermano<\/i>", "corto": false}, {"enun": "Avísame ______ puedes venir.", "sol": "si no", "porque": "condición: «si [tú] no puedes venir»", "corto": false}, {"enun": "No solo lo sabía, ______ que lo había contado.", "sol": "sino|sino que", "porque": "detrás de <i>no solo<\/i> va <i>sino que<\/i> cuando sigue un verbo", "corto": false}], "criterio": "<i>Sino<\/i> corrige una negación anterior: <i>no es un problema de dinero sino de tiempo<\/i>. <i>Si no<\/i> abre una condición, y admite una palabra en medio: <i>si [tú] no llegas a las ocho<\/i>. Detrás de <i>no solo<\/i> va <i>sino que<\/i> cuando sigue un verbo.", "apoyo": ["3.3 · sino / si no"], "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 7"}, {"tipo": "opcion", "titulo": "Una palabra o dos", "dossier": {"cuaderno": "4bis", "ejercicio": 8}, "ayuda": "Elige la forma del paréntesis que corresponde a la oración.", "estricto": true, "items": [{"enun": "Vinieron los padres y <b>(también / tan bien)<\/b> los abuelos.", "sol": "también", "porque": "significa «además»", "ops": ["tan bien", "también"]}, {"enun": "Cocina <b>(también / tan bien)<\/b> como su madre.", "sol": "tan bien", "porque": "significa «de manera tan buena»", "ops": ["tan bien", "también"]}, {"enun": "Me interesa <b>(sobre todo / sobretodo)<\/b> el primer párrafo.", "sol": "sobre todo", "porque": "significa «especialmente»; <i>sobretodo<\/i> es un abrigo", "ops": ["sobretodo", "sobre todo"]}, {"enun": "Reparte esto entre los <b>(demás / de más)<\/b>.", "sol": "demás", "porque": "significa «los otros»", "ops": ["demás", "de más"]}, {"enun": "Has puesto una silla <b>(demás / de más)<\/b>.", "sol": "de más", "porque": "significa «de sobra»", "ops": ["demás", "de más"]}], "criterio": "<i>También<\/i> significa «además», y <i>tan bien<\/i>, «de manera tan buena». <i>Sobre todo<\/i>, separado, significa «especialmente»; junto es el nombre de un abrigo. <i>Demás<\/i> significa «los otros», y <i>de más<\/i>, «de sobra».", "apoyo": ["3.4 · Tres pares más"], "dossier_txt": "Del dossier: nudo 4 bis, ejercicio 8"}, {"tipo": "hueco", "titulo": "Sino o si no", "estricto": true, "ayuda": "Escribe la forma. Prueba a meter algo entre las dos palabras.", "items": [{"enun": "No quiero café, ______ té.", "sol": "sino", "corto": false}, {"enun": "______ llamas antes, no te atienden.", "sol": "Si no|si no", "corto": false, "porque": "«si [tú] no llamas»: admite algo en medio"}, {"enun": "No es que no quiera, ______ que no puedo.", "sol": "sino", "corto": false}, {"enun": "Avísame, y ______ me voy.", "sol": "si no", "corto": false}, {"enun": "No vino nadie, ______ el encargado.", "sol": "sino", "corto": false}, {"enun": "______ te importa, lo dejamos para mañana.", "sol": "Si no|si no", "corto": false}], "criterio": "Los tres de <i>sino<\/i> llevan delante una negación —<i>no quiero<\/i>, <i>no es<\/i>, <i>no vino<\/i>— y corrigen lo negado. Los tres de <i>si no<\/i> abren una condición, y en los tres se puede intercalar una palabra entre <i>si<\/i> y <i>no<\/i>.<br><br>Si las dos pruebas te dan lo mismo, comprueba cuál de las dos frases tiene sentido.", "apoyo": ["3.3 · sino / si no"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Junta o separada?", "ayuda": "Seis frases con los tres pares de la tabla.", "ops": ["junta", "separada"], "items": [{"enun": "Le gusta el cine, ______ el europeo. <i>(sobretodo / sobre todo)<\/i>", "sol": "separada", "porque": "= especialmente"}, {"enun": "Ana y las ______ llegaron tarde. <i>(demas / de más)<\/i>", "sol": "junta", "porque": "= las otras"}, {"enun": "Nunca lo hizo ______ como aquella vez. <i>(tambien / tan bien)<\/i>", "sol": "separada", "porque": "= de manera tan buena"}, {"enun": "Me cobraron veinte euros ______. <i>(demas / de más)<\/i>", "sol": "separada", "porque": "= de sobra"}, {"enun": "Se puso el ______ y salió. <i>(sobretodo / sobre todo)<\/i>", "sol": "junta", "porque": "el abrigo — la única vez que va junta"}, {"enun": "Vinieron los vecinos y ______ el casero. <i>(tambien / tan bien)<\/i>", "sol": "junta", "porque": "= además"}], "criterio": "<i>Sobretodo<\/i> junto significa «abrigo», y en un examen no aparece. <b>Cuando dudes con esta, sepáralas<\/b>: acertarás casi siempre.<br><br>Las otras dos parejas sí se usan las dos formas a diario, y en ellas decide el significado.", "apoyo": ["3.4 · Tres pares más"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las mal separadas", "ayuda": "Tres faltas de palabras mal juntas o mal separadas, repartidas en cuatro palabras: una de las faltas ocupa dos. <b>Pincha en las cuatro.<\/b>", "items": [{"texto": "No me quejo del horario sino de que nadie avise, y si no fuera por los compañeros no me enteraría. El jefe dice que tan bien podría organizarse mejor, sobretodo los viernes, y que si nos pagan horas demás es porque hace falta.", "faltas": {"bien": "también — aquí significa «además», y va junto", "sobretodo": "sobre todo — «especialmente», dos palabras", "demás": "de más — «de sobra», dos palabras", "tan": "parte de «tan bien», que aquí debía ser «también»"}}], "criterio": "Dos están bien y engañan: <i>sino<\/i> corrige una negación y <i>si no<\/i> abre una condición, las dos correctas y seguidas a propósito.<br><br>Lo que falla viene después: <i>tan bien<\/i> donde iba <b>también<\/b>, <i>sobretodo<\/i> donde iba <b>sobre todo<\/b> y <i>demás<\/i> donde iba <b>de más<\/b>. Tres de los tres pares de la tabla, cada uno hacia el lado contrario.", "apoyo": ["3.3 · sino / si no", "3.4 · Tres pares más"], "solo_web": true}], "cuaderno_txt": "Nudo 4 bis · Corregir lo que escribes — apartado 3: Palabras que se separan (p. 34) · ejercicios 7 y 8", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Práctica de comprensión", "meta": "25 minutos · el bloque 1 entero sobre un texto", "cuaderno": {"nudo": 17, "apartados": [1, 2, 4], "ejercicios": [13], "secciones": {"4": ["2014"]}}, "lectura": {"titulo": "El día que sostiene la semana", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["La peluquería de Fina Arrabal abre los sábados desde hace treinta y dos", "años. Dice que es el día que sostiene la semana: entre las nueve y las", "tres pasan por su silla tantas personas como de lunes a jueves juntos.", "También dice que es el día que le ha costado dos bautizos, una boda y", "casi todas las comidas familiares desde que abrió.", "", "En el barrio quedan cuatro comercios que abren el sábado entero. Hace", "diez años eran once. Los que cerraron no lo hicieron por falta de", "clientes, según Fina, sino porque los dueños llegaron a una edad en que", "el séptimo día pesa más que el dinero que da.", "", "La discusión pública sobre los horarios suele plantearse entre las", "grandes superficies y los pequeños comercios. Fina cree que esa", "discusión no la incluye. A ella no la obliga ninguna ley a abrir el", "sábado: la obliga que el alquiler del local se paga igual siete días y", "que en seis no llega.", "", "Su hija, que estudió peluquería y trabaja en una cadena del centro,", "libra dos sábados al mes y cobra por convenio. Fina dice que eso le", "parece bien y que ella no lo tendrá nunca, porque para tenerlo habría", "que cerrar la tienda y ponerse a trabajar para otro.", "", "Lo que le molesta no es el sábado. Es que la palabra autónomo se use", "para hablar de libertad de horarios cuando en su caso significa lo", "contrario: que nadie le pone el horario, y por eso no puede quitárselo", "nadie tampoco."], "pie": "Texto inventado. Ni Fina Arrabal ni los datos que da son reales."}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> las tres preguntas abiertas del bloque 1 suman <strong>2,5 puntos<\/strong> de los 3,5 del bloque; el punto restante es el léxico, que se estudia en el nudo 5. Dentro va el <strong>resumen<\/strong>, que valió <strong>1,25<\/strong> en 2026 y <strong>1,5<\/strong> en 2024 y 2025. Después de la redacción, ninguna otra pregunta concentra tantos puntos.<\/div>\n<h3>1 · Cómo se lee un texto de examen<\/h3>\n<p>Leer un texto de examen consiste en <strong>localizar<\/strong>, porque las preguntas ya vienen escritas y cada una tiene su sitio en el papel; y, cuando la pregunta pide «qué problemas» o «qué factores», en <strong>reunir<\/strong> lo que está repartido: en 2026, los cuatro problemas de la pregunta 1.2 están en las líneas 13-17 y 29-35.<\/p>\n<p><strong>Las cuatro pasadas:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué hago<\/th>\n<th style=\"text-align: right;\">cuánto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · seguida<\/strong><\/td>\n<td>Leo entero sin parar y sin subrayar. Solo quiero saber de qué va<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2 · leo las preguntas<\/strong><\/td>\n<td>Antes de volver al texto, para saber qué busco en la pasada 3<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<tr>\n<td><strong>3 · localizo<\/strong><\/td>\n<td>Vuelvo al texto y <strong>anoto en el margen el número de la pregunta<\/strong> junto al trozo que la contesta<\/td>\n<td style=\"text-align: right;\">5 min<\/td>\n<\/tr>\n<tr>\n<td><strong>4 · el léxico<\/strong><\/td>\n<td>Busco las cuatro palabras del ejercicio de léxico y leo <strong>la frase entera<\/strong> donde están<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La pasada 2 casi nadie la hace, y ahorra después más trabajo que las otras tres. Leer las preguntas antes convierte la segunda lectura en una búsqueda.<\/p>\n<p><strong>El texto está construido casi siempre igual.<\/strong> En quince de las dieciséis convocatorias es un artículo de prensa —una columna de opinión o un reportaje—, y esos artículos se organizan casi siempre así:<\/p>\n<table>\n<thead>\n<tr>\n<th>dónde<\/th>\n<th>qué suele haber<\/th>\n<th>qué pregunta suele salir de ahí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>primer párrafo<\/strong><\/td>\n<td>la anécdota concreta o el caso<\/td>\n<td>«explique qué hecho…», «cuál es la anécdota»<\/td>\n<\/tr>\n<tr>\n<td><strong>párrafos centrales<\/strong><\/td>\n<td>los datos, los testimonios, los ejemplos<\/td>\n<td>«según X, ¿qué…?», «qué razones…»<\/td>\n<\/tr>\n<tr>\n<td><strong>último párrafo<\/strong><\/td>\n<td><strong>la idea general del autor<\/strong><\/td>\n<td>«cuál es la idea principal», «qué es lo más grave»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La respuesta a la pregunta de la idea principal está casi siempre en el último párrafo<\/strong>, y la de la anécdota, en el primero.<\/p>\n<p><strong>Las marcas que hay que hacer.<\/strong> Tres, y ninguna más: un texto subrayado entero es un texto sin subrayar.<\/p>\n<ol>\n<li><strong>El número de la pregunta<\/strong>, en el margen, junto al trozo que la contesta.<\/li>\n<li><strong>Un círculo<\/strong> en la palabra que no entiendo.<\/li>\n<li><strong>Una raya vertical<\/strong> al lado del párrafo donde está la idea general.<\/li>\n<\/ol>\n<h4>El texto de la convocatoria de 2026<\/h4>\n<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>\n<h3>2 · Responder sin copiar<\/h3>\n<p>Las preguntas abiertas se corrigen con tres bandas oficiales, siempre las mismas:<\/p>\n<blockquote>\n<p>Respuesta clara y completa → <strong>todos los puntos<\/strong>\nRespuesta válida, pero con alguna imprecisión o falta de claridad → <strong>la banda intermedia<\/strong>: 0,5 en una pregunta de 0,75; 0,25 en una de 0,5\nRespuesta claramente deficiente → <strong>0<\/strong><\/p>\n<\/blockquote>\n<p>Y un cuarto dato de la clave: <em>«pueden otorgarse puntuaciones intermedias»<\/em>. No hay tres notas: hay una escala. Los criterios que siguen hacen bajar por ella.<\/p>\n<p><strong>Los quince criterios<\/strong>, destilados de las claves oficiales de las dieciséis convocatorias:<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\"><\/th>\n<th>criterio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>Contestar a menos de lo que pide.<\/strong> Si el enunciado pide dos datos («explique X <strong>y<\/strong> exponga Y») y solo se contesta una, la respuesta cae a la banda intermedia o más abajo<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td><strong>Contestar a más.<\/strong> Añadir lo que no se pregunta no suma: resta claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td><strong>Copiar literalmente<\/strong> el fragmento donde está la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td><strong>Responder con una palabra suelta<\/strong> o con una lista. Se pide una respuesta redactada<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td><strong>Contestar de memoria<\/strong>, con lo que uno sabe en vez de con lo que expone el texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td><strong>Atribuir al texto lo que no dice.<\/strong> La clave lo llama «malinterpretar» y es la única que va directa al 0<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td><strong>No indicar según quién.<\/strong> Si el enunciado indica «según Trenado», la respuesta va atribuida; si no lo indica, se atribuye al autor o a la autora del texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td><strong>Confundir el ejemplo con la idea.<\/strong> El texto pone ejemplos; la pregunta no los pide<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td><strong>No dar el número que se pide.<\/strong> «Qué <strong>dos<\/strong> factores» son dos, separados<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td><strong>Escribir una respuesta que no se entiende sin el texto delante<\/strong> («eso pasa porque él lo dice»): la respuesta tiene que sostenerse sola<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td><strong>Dejar pronombres sin antecedente<\/strong> dentro de la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td><strong>Meter opinión propia.<\/strong> No se pregunta qué opinas: eso es el bloque 3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td><strong>Usar metadiscurso vacío<\/strong>: «el autor nos habla de…». Ocupa palabras y no contesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td><strong>Desproporcionar la extensión.<\/strong> A 0,5 puntos no le corresponde media página; a 1,25, tampoco dos líneas<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td><strong>Las faltas cuentan aquí también<\/strong>: −0,10 por error, hasta −2 en los bloques 1 y 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo no copiar, en tres pasos.<\/strong> El criterio 3 se falla más que los otros catorce.<\/p>\n<table>\n<thead>\n<tr>\n<th>paso<\/th>\n<th>sobre el texto de 2026<\/th>\n<th>sobre otra columna de prensa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sustituir la palabra<\/strong><\/td>\n<td>«una inversión inicial desorbitada» → <em>un dinero inicial muy alto<\/em><\/td>\n<td>«una pasarela de tablones» → <em>un paso de madera<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Sustituir el verbo y con él la construcción<\/strong><\/td>\n<td>«los precios se han disparado» → <em>el precio ha subido muchísimo<\/em><\/td>\n<td>«ha perdido a la mitad de los clientes» → <em>su clientela se ha reducido a la mitad<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Resumir la cita en tus términos<\/strong><\/td>\n<td>«No hay relevo generacional. ¿Cómo va a haberlo?» → <em>el agricultor sostiene que nadie coge el testigo<\/em><\/td>\n<td>«no pasó de la primera pantalla» → <em>no consiguió completar la solicitud<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los nombres propios y los términos sin sinónimo se pueden repetir:<\/strong> <em>Trenado<\/em>, <em>Azuaga<\/em>, <em>pistacho<\/em>, <em>cubiertas vegetales<\/em>. El criterio 3 descuenta la copia de fragmentos, y la medida de clase para comprobarla es la misma que en el resumen del apartado 3: ninguna cadena de tres o más palabras seguidas del original, salvo esos nombres y términos.<\/p>\n<h3>4 · Seis textos reales, con su bloque 1<\/h3>\n<p>Los seis textos que siguen son los de las convocatorias de 2014 a 2019, reproducidos como salieron en el examen, con la numeración de líneas de cinco en cinco y el título contado como línea 1, que es como los cuentan los enunciados. Cada uno lleva su bloque 1 completo en los ejercicios 9 a 14: las preguntas abiertas, el resumen cuando lo hubo y las cuatro palabras de léxico, con la puntuación de cada pregunta y la respuesta oficial en la clave. Se contestan como en la prueba: veinte minutos por texto, sin diccionario y sin mirar la clave hasta el final.<\/p>\n<h4>2014 · Cuentos para niños malos<\/h4>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Cuentos para niños malos<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Mi autor infantil favorito, Roald Dahl, es uno de los más irreverentes. Su cuento Matilda, con el<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que Danny DeVito hizo una película, es un alegato contra la familia y el colegio. El padre de Matilda es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">repulsivo. Odia la lectura y ama la televisión. Se dedica a las estafas de poca monta. Y cuando tiene que<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">huir de la policía, no le importa abandonar a su hija. Pero mucho peor es la directora de la escuela, la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">temible señorita Trunchbull, que simplemente odia a los niños y dedica su institución a torturarlos.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Los autores de libros infantiles sabemos que hoy día no se puede escribir nada de esto. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">editores están en guardia contra cualquier sospecha de valores inadecuados. Los libros infantiles no<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">son considerados objetos de placer o entretenimiento, sino modelos de conducta. Las familias descritas<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">deben ser agradables, y las profesoras, atentas. Los niños no deben recibir castigos, sino aprender la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">lección mediante el diálogo. Y los malos tienen que perder miserablemente, aunque sin violencia.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Todos esos principios son muy loables, pero pueden producir libros aburridos. Por el contrario, a lo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">largo de la historia, los cuentos infantiles han sido bastante irreverentes, incluso crueles. Pulgarcito, por<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ejemplo, debe ser la pesadilla de un educador. Sus padres lo abandonan en medio del bosque para no<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">tener que alimentarlo, y él engaña al ogro para que decapite a su vez a sus propios hijos.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Con notable frecuencia, estos cuentos son censurados y reescritos. Hace un par de años compré un<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">ejemplar en el que Pulgarcito no era abandonado, sino que se perdía en el bosque.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Pero los «malos ejemplos» están por todas partes: ¿Qué hacemos con la bruja antropófaga que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">muere quemada en Hansel y Gretel? Podríamos ponerla vegetariana, y matarla de una neumonía. ¿Y los<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">valores sexistas de los cuentos de princesas? Quizá en vez de princesas deberíamos poner ejecutivas de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">transnacionales. ¿Y qué hay del prejuicio contra las familias modernas en Cenicienta? A lo mejor, en vez<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">de madrastra, la mala debe ser «una amiga de la familia». Así nos aseguraríamos de transmitir valores<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">sanos… Y cuentos insoportables.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Pensemos qué pasaría en la gran literatura si tuviese que limitarse a las lecciones edificantes. En vez<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">del ejecutivo asesino en serie de American psycho, tendríamos que poner a un jardinero macrobiótico.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">¿Absurdo? ¿Y por qué no es absurdo con los niños? ¿No confiamos en ellos? No. No confiamos en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">nosotros mismos. El férreo control de contenidos editoriales infantiles no protege a los niños, sino a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">los padres. Tenemos miedo de las preguntas incómodas. Nos asusta ser incapaces de explicar por qué<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">esos padres abandonan a sus hijos o esas madrastras son malas (aunque durante siglos ha bastado la<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">frase «porque es un cuento, hijo»). En suma, tenemos miedo de hablar con nuestros propios hijos. Pero<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precisamente para eso se hacen los libros: para pensar, imaginar y discutir.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Si eliminamos de los libros todo lo que nos parezca inapropiado, no salvaremos a nuestros hijos de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">las malas ideas. Al contrario, los volveremos incapaces de reconocerlas. Lo que sí lograremos es que los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">chicos abandonen la lectura y se entreguen a la PlayStation, donde pueden matar a un montón de gente<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">sin que nadie se queje.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de Santiago Roncagliolo, <\/em>El País Semanal<em>, 20 de diciembre de 2013, tal como la imprimió la prueba de 2014.<\/em><\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Bloque 1 de 2014: las tres preguntas", "dossier": {"cuaderno": "17", "ejercicio": 13, "parte": "1.1 a 1.3"}, "ayuda": "Las preguntas oficiales de 2014, sobre «Cuentos para niños malos», que se abre con el icono «texto» y está también en la teoría. Contesta como en la prueba, con reloj: veinte minutos para el bloque entero.", "items": [{"enun": "«Escriba un resumen que exponga las diferencias de contenido e intención de los cuentos tradicionales respecto a la literatura infantil actual.» <b>[1,5]<\/b>", "conv": "2014", "modelo": "Los cuentos tradicionales se contaban a los niños para su entretenimiento y placer y podían contener escenas violentas, desagradables e incorrectas desde el punto de vista ético o moral: ogros que se comen a sus propios hijos, madrastras que maltratan a sus hijastras y un alto grado de sexismo en los papeles masculinos y femeninos. La literatura infantil actual, en cambio, tiene que ser un modelo de conducta adecuado a los valores de la sociedad actual; por ello, editores y escritores huyen de todo lo que tenga que ver con la violencia gratuita, el sexismo o la crueldad, y promueven valores como el diálogo y la resolución pacífica de los conflictos."}, {"enun": "«Explique cuál es la razón de la limitación de los contenidos de la literatura infantil según el autor del texto.» <b>[0,5]<\/b>", "conv": "2014", "modelo": "El autor cree que el verdadero motivo no es tanto proteger a los niños como proteger a los padres de preguntas incómodas sobre las maldades del mundo real que no tienen una respuesta fácil."}, {"enun": "«¿Qué efectos negativos tiene esa limitación de los contenidos en la calidad de la literatura infantil y en los hábitos de lectura infantiles y juveniles?» <b>[0,5]<\/b>", "conv": "2014", "modelo": "La calidad de la literatura desciende, porque los libros resultan insoportables y aburridos, y eso contribuye a alejar a los lectores infantiles de los libros hacia otras formas de entretenimiento, como las videoconsolas, en las que no se censuran la violencia ni otras realidades desagradables."}], "criterio": "Los modelos son las respuestas oficiales de 2014. El resumen de la 1.1 vale 1,5 y se corrige con la rúbrica de cuatro niveles (1,5 · 1 · 0,5 · 0): tiene que recoger las diferencias de contenido y de intención entre los cuentos tradicionales y la literatura infantil actual.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 4, "seccion": "2014"}, "apoyo": ["2014 · Cuentos para niños malos"], "dossier_txt": "Del dossier: nudo 17, ejercicio 13 · 1.1 a 1.3", "texto_titulo": "2014 · Cuentos para niños malos", "texto_html": "<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Cuentos para niños malos<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Mi autor infantil favorito, Roald Dahl, es uno de los más irreverentes. Su cuento Matilda, con el<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que Danny DeVito hizo una película, es un alegato contra la familia y el colegio. El padre de Matilda es<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">repulsivo. Odia la lectura y ama la televisión. Se dedica a las estafas de poca monta. Y cuando tiene que<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">huir de la policía, no le importa abandonar a su hija. Pero mucho peor es la directora de la escuela, la<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">temible señorita Trunchbull, que simplemente odia a los niños y dedica su institución a torturarlos.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span cla
