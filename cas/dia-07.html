<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 7 · 20 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

.textoexamen .t{flex:1;white-space:pre-wrap;hyphens:none;min-width:0;padding-left:1.6em;text-indent:-1.6em}

details.ap-dossier>summary:hover>h3{color:var(--acento)}
details.ap-dossier[open]{padding-bottom:12px}

<script>window.DIA = {"dia": 7, "fecha": "2026-10-20", "tab": "Día 7 · 20 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 7", "h1": "Martes 20 de octubre", "sub": "La tilde diacrítica · cómo se lee un texto de examen · los determinantes", "carriles": [{"chapa": "Carril A", "titulo": "La tilde diacrítica (1): los monosílabos", "meta": "30 minutos · nueve pares, siete de ellos frecuentes", "cuaderno": {"nudo": 3, "apartados": [1], "ejercicios": [1, 2]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> ejercicio 2.2, <em>explicar la razón de las tildes<\/em>. Después del hiato, la tilde diacrítica es <strong>la segunda explicación más pedida<\/strong>. Entre las dos se llevan la mayor parte del ejercicio.<\/div>\n<h3>1 · Los nueve pares<\/h3>\n<h4>Qué es<\/h4>\n<p>Ocho de los nueve pares son <strong>monosílabos<\/strong>, y en una palabra de una sola sílaba la tilde no puede marcar la sílaba fuerte; <em>aún<\/em> tiene dos sílabas (<em>a-ún<\/em>), y su tilde también es diacrítica. La tilde diacrítica sirve para <strong>distinguir dos palabras que se escriben igual<\/strong> y no significan lo mismo.<\/p>\n<p>Por regla general los monosílabos no se acentúan.<\/p>\n<h4>Los nueve pares<\/h4>\n<table>\n<thead>\n<tr>\n<th>con tilde<\/th>\n<th>qué es<\/th>\n<th>sin tilde<\/th>\n<th>qué es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>dé<\/strong><\/td>\n<td>verbo <em>dar<\/em><\/td>\n<td>de<\/td>\n<td>preposición<\/td>\n<\/tr>\n<tr>\n<td><strong>él<\/strong><\/td>\n<td>pronombre personal<\/td>\n<td>el<\/td>\n<td>artículo<\/td>\n<\/tr>\n<tr>\n<td><strong>más<\/strong><\/td>\n<td>adverbio de cantidad<\/td>\n<td>mas<\/td>\n<td>conjunción adversativa (= <em>pero<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>mí<\/strong><\/td>\n<td>pronombre personal<\/td>\n<td>mi<\/td>\n<td><strong>determinante<\/strong> posesivo; nota musical<\/td>\n<\/tr>\n<tr>\n<td><strong>sé<\/strong><\/td>\n<td>verbo <em>saber<\/em> (<em>yo sé<\/em>) o imperativo de <em>ser<\/em> (<em>sé prudente<\/em>)<\/td>\n<td>se<\/td>\n<td>pronombre personal y reflexivo<\/td>\n<\/tr>\n<tr>\n<td><strong>sí<\/strong><\/td>\n<td>adverbio de afirmación; pronombre reflexivo (<em>para sí<\/em>)<\/td>\n<td>si<\/td>\n<td>conjunción condicional; nota musical<\/td>\n<\/tr>\n<tr>\n<td><strong>té<\/strong><\/td>\n<td>sustantivo, la bebida<\/td>\n<td>te<\/td>\n<td>pronombre personal<\/td>\n<\/tr>\n<tr>\n<td><strong>tú<\/strong><\/td>\n<td>pronombre personal<\/td>\n<td>tu<\/td>\n<td><strong>determinante<\/strong> posesivo<\/td>\n<\/tr>\n<tr>\n<td><strong>aún<\/strong><\/td>\n<td>= <em>todavía<\/em><\/td>\n<td>aun<\/td>\n<td>= <em>incluso<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<h4>⚠ El error que descuenta el cuarto de punto<\/h4>\n<p>A <em>mi<\/em> y a <em>tu<\/em> se les llama muy a menudo «<strong>pronombres posesivos<\/strong>». Son <strong>determinantes posesivos<\/strong>.<\/p>\n<p>La diferencia: un <strong>determinante<\/strong> va <strong>delante de un sustantivo<\/strong> — <em>mi casa<\/em>, <em>tu coche<\/em>. Un <strong>pronombre<\/strong> va <strong>solo<\/strong>, sustituyendo al sustantivo — <em>la mía<\/em>, <em>el tuyo<\/em>.<\/p>\n<\/blockquote>\n<h4>Una comprobación por par<\/h4>\n<p>Todas consisten en sustituir la palabra por otra y comprobar si la frase aguanta.<\/p>\n<ul>\n<li><em>más<\/em> / <em>mas<\/em>: si se puede sustituir por <strong>pero<\/strong>, es <em>mas<\/em>; si se puede sustituir por <strong>menos<\/strong>, es <em>más<\/em>.<\/li>\n<li><em>sí<\/em> / <em>si<\/em>: si se puede sustituir por <strong>claro<\/strong>, es <em>sí<\/em>; si abre una condición, es <em>si<\/em>.<\/li>\n<li><em>él<\/em> / <em>el<\/em>: delante de sustantivo, artículo (<em>el coche<\/em>); solo, pronombre (<em>él vino<\/em>).<\/li>\n<li><em>mí<\/em> / <em>mi<\/em> y <em>tú<\/em> / <em>tu<\/em>: delante de sustantivo, determinante (<em>mi casa<\/em>, <em>tu hermano<\/em>); solo o detrás de preposición, pronombre (<em>a mí<\/em>, <em>tú vienes<\/em>).<\/li>\n<li><em>sé<\/em> / <em>se<\/em>: si se puede sustituir por <strong>yo lo sé<\/strong>, es verbo.<\/li>\n<li><em>dé<\/em> / <em>de<\/em>: <em>de<\/em> es una preposición, una palabra que enlaza otras dos y no cambia nunca de forma (<em>la casa de mi madre<\/em>, <em>vengo de trabajar<\/em>); <em>dé<\/em> es una forma del verbo <em>dar<\/em>, y como verbo admite sujeto (<em>que él te lo dé<\/em>).<\/li>\n<li><em>té<\/em> / <em>te<\/em>: si se bebe, tilde.<\/li>\n<\/ul>\n<h4>Cómo se explica<\/h4>\n<blockquote>\n<p>Enunciar «lleva tilde diacrítica» deja la explicación a medias. Hay que <strong>nombrar las dos palabras<\/strong>: cuál lleva tilde, cuál no y por qué.<\/p>\n<p>Incompleto: «<em>mí<\/em> lleva tilde diacrítica».\nCompleto: «<em>mí<\/em> es un monosílabo que lleva tilde diacrítica para diferenciar el <strong>pronombre personal<\/strong> —<em>a mí<\/em>— del <strong>determinante posesivo<\/strong> —<em>mi casa<\/em>—».\nCompleto: «<em>sé<\/em> lleva tilde diacrítica que indica que es la primera persona del singular del presente de indicativo del verbo <em>saber<\/em>».<\/p>\n<\/blockquote>\n<p><strong><em>Sé<\/em> corresponde a dos verbos.<\/strong> Es <em>saber<\/em> en primera persona del presente —<em>ya sé que es tarde<\/em>— y <em>ser<\/em> en imperativo —<em>sé prudente<\/em>—. Por la palabra sola no se distingue: hay que leer la frase para saber de cuál se trata, y decirlo al explicar la tilde.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "Los siete diacríticos frecuentes", "ayuda": "Los siete proceden de exámenes reales. La respuesta completa lleva <b>dos datos<\/b>: que la tilde es diacrítica, y cuál es la palabra que la lleva frente a la que no.", "items": [{"palabra": "<i>Sí<\/i>", "conv": "2011", "enun": "«<b>Sí<\/b>, la lectora tiene razón, todo forma parte de lo mismo…»", "requiere": [["diacrítica", "diacrítico"], ["afirmación", "afirmativo", "afirmar"]], "modelo": "acento diacrítico que indica que se trata del adverbio de afirmación, frente a la conjunción condicional si"}, {"palabra": "<i>sé<\/i>", "conv": "2012", "enun": "«…aunque <b>sé<\/b> que son imperceptibles.»", "requiere": [["diacrítica", "diacrítico"], ["saber"], ["primera persona", "presente"]], "modelo": "tilde diacrítica que indica que es la primera persona del singular del presente de indicativo del verbo saber, frente al pronombre se"}, {"palabra": "<i>Sé<\/i>", "conv": "2015", "enun": "«<b>Sé<\/b> que el campo y el mar son duros, pero el estrés de la ciudad también.»", "requiere": [["diacrítica", "diacrítico"], ["saber"], ["primera persona", "presente"]], "modelo": "tilde diacrítica que indica que es la primera persona del singular del presente de indicativo del verbo saber"}, {"palabra": "<i>mí<\/i>", "conv": "2017", "enun": "«¡Jo, no sé, a <b>mí<\/b> es que me parece que te queda todo mucho mejor a ti!»", "requiere": [["diacrítica", "diacrítico"], ["pronombre personal", "pronombre"], ["determinante"]], "modelo": "es un monosílabo que lleva tilde diacrítica para diferenciar el pronombre personal del determinante posesivo"}, {"palabra": "<i>sí<\/i>", "conv": "2020", "enun": "«De manera que <b>sí<\/b>, vale, de acuerdo, hay cazadores decentes.»", "requiere": [["diacrítica", "diacrítico"], ["afirmación", "afirmativo", "afirmar"]], "modelo": "tilde diacrítica obligatoria cuando se usa como adverbio de afirmación"}, {"palabra": "<i>más<\/i>", "conv": "2021", "enun": "«el sur, <b>más<\/b> contaminado, está <b>más<\/b> poblado»", "requiere": [["diacrítica", "diacrítico"], ["adverbio de cantidad", "cantidad"]], "modelo": "monosílabo con tilde diacrítica porque es el adverbio de cantidad, frente a la conjunción adversativa mas"}, {"palabra": "<i>sé<\/i>", "conv": "2023", "enun": "«Ya <b>sé<\/b> que estoy haciendo una generalización grosera.»", "requiere": [["diacrítica", "diacrítico"], ["saber"], ["primera persona", "presente"]], "modelo": "tilde diacrítica que indica la primera persona del singular del presente de indicativo del verbo saber, frente al pronombre se"}], "criterio": "Cinco de los siete son <i>sí<\/i> o <i>sé<\/i>. Si solo te preparas dos pares, que sean esos dos.<br><br>Las claves oficiales exigen más: en los tres de <i>sé<\/i> hay que indicar <b>persona y tiempo<\/b>; no basta con «es el verbo saber». En el de <i>mí<\/i> hay que nombrar <b>las dos<\/b> clases del par.", "apoyo": ["Los nueve pares", "Cómo se explica"], "pide": "lleva tilde porque…", "dossier": {"cuaderno": "3", "ejercicio": 1}, "dossier_txt": "Del dossier: nudo 3, ejercicio 1"}, {"tipo": "opcion", "titulo": "Elige la forma", "dossier": {"cuaderno": "3", "ejercicio": 2}, "ayuda": "Elige la forma que corresponde al paréntesis en negrita. Las oraciones con dos paréntesis aparecen dos veces, una por cada paréntesis.", "estricto": true, "items": [{"enun": "Espera a que te lo <b>(de / dé)<\/b> él mismo.", "sol": "dé", "porque": "verbo <i>dar<\/i>: admite sujeto, <i>que él te lo dé<\/i>", "ops": ["dé", "de"]}, {"enun": "A <b>(mi / mí)<\/b> no me dijo nada de (mi / mí) contrato.", "sol": "mí", "porque": "pronombre, detrás de preposición", "ops": ["mi", "mí"]}, {"enun": "A (mi / mí) no me dijo nada de <b>(mi / mí)<\/b> contrato.", "sol": "mi", "porque": "determinante, delante de sustantivo", "ops": ["mi", "mí"]}, {"enun": "<b>(Tu / Tú)<\/b> hermano dice que (tu / tú) no vas.", "sol": "Tu", "porque": "determinante: va delante del sustantivo", "ops": ["Tu", "Tú"]}, {"enun": "(Tu / Tú) hermano dice que <b>(tu / tú)<\/b> no vas.", "sol": "tú", "porque": "pronombre", "ops": ["tu", "tú"]}, {"enun": "¿Me pones un <b>(te / té)<\/b>?", "sol": "té", "porque": "el sustantivo: la bebida", "ops": ["te", "té"]}, {"enun": "Quería ayudar, <b>(mas / más)<\/b> no pudo.", "sol": "mas", "porque": "se puede sustituir por <i>pero<\/i>", "ops": ["más", "mas"]}, {"enun": "No hay nada <b>(mas / más)<\/b> que decir.", "sol": "más", "porque": "adverbio de cantidad", "ops": ["mas", "más"]}, {"enun": "<b>(El / Él)<\/b> coche es de (el / él).", "sol": "El", "porque": "artículo: va delante del sustantivo", "ops": ["El", "Él"]}, {"enun": "(El / Él) coche es de <b>(el / él)<\/b>.", "sol": "él", "porque": "pronombre: va solo", "ops": ["él", "el"]}, {"enun": "<b>(Si / Sí)<\/b> llueve, no salimos.", "sol": "Si", "porque": "conjunción condicional", "ops": ["Sí", "Si"]}, {"enun": "<b>(Se / Sé)<\/b> puntual: el turno empieza a las seis.", "sol": "Sé", "porque": "imperativo de <i>ser<\/i>", "ops": ["Sé", "Se"]}, {"enun": "Dijo que <b>(si / sí)<\/b>, que vendría (el / él) solo.", "sol": "sí", "porque": "adverbio de afirmación", "ops": ["si", "sí"]}, {"enun": "Dijo que (si / sí), que vendría <b>(el / él)<\/b> solo.", "sol": "él", "porque": "pronombre", "ops": ["el", "él"]}, {"enun": "No <b>(se / sé)<\/b> si (se / sé) ha enterado.", "sol": "sé", "porque": "verbo <i>saber<\/i>", "ops": ["sé", "se"]}, {"enun": "No (se / sé) si <b>(se / sé)<\/b> ha enterado.", "sol": "se", "porque": "pronombre", "ops": ["sé", "se"]}, {"enun": "La factura viene <b>(de / dé)<\/b> la compañía del gas.", "sol": "de", "porque": "preposición", "ops": ["de", "dé"]}, {"enun": "<b>(Te / Té)<\/b> llamo cuando salga; no (te / té) muevas.", "sol": "Te", "porque": "pronombre", "ops": ["Té", "Te"]}, {"enun": "(Te / Té) llamo cuando salga; no <b>(te / té)<\/b> muevas.", "sol": "te", "porque": "pronombre", "ops": ["te", "té"]}, {"enun": "Para <b>(mi / mí)<\/b>, (tu / tú) tienes razón.", "sol": "mí", "porque": "pronombre, detrás de preposición", "ops": ["mí", "mi"]}, {"enun": "Para (mi / mí), <b>(tu / tú)<\/b> tienes razón.", "sol": "tú", "porque": "pronombre", "ops": ["tú", "tu"]}, {"enun": "Ella <b>(se / sé)<\/b> lo guardó para (si / sí).", "sol": "se", "porque": "pronombre", "ops": ["se", "sé"]}, {"enun": "Ella (se / sé) lo guardó para <b>(si / sí)<\/b>.", "sol": "sí", "porque": "pronombre reflexivo", "ops": ["sí", "si"]}, {"enun": "Quiere <b>(mas / más)<\/b> horas, (mas / más) no se las dan.", "sol": "más", "porque": "adverbio de cantidad", "ops": ["más", "mas"]}, {"enun": "Quiere (mas / más) horas, <b>(mas / más)<\/b> no se las dan.", "sol": "mas", "porque": "equivale a <i>pero<\/i>", "ops": ["mas", "más"]}], "criterio": "La forma con tilde es la tónica: el pronombre (<i>él<\/i>, <i>tú<\/i>, <i>mí<\/i>, <i>sí<\/i>), el verbo (<i>dé<\/i>, <i>sé<\/i>), el adverbio (<i>más<\/i>, <i>sí<\/i>) y el sustantivo (<i>té<\/i>). Sin tilde van el artículo, el determinante, la preposición, la conjunción y los pronombres átonos <i>te<\/i> y <i>se<\/i>.", "apoyo": ["Los nueve pares", "Una comprobación por par"], "dossier_txt": "Del dossier: nudo 3, ejercicio 2"}, {"tipo": "opcion", "titulo": "¿Está bien escrito?", "ayuda": "Frases corrientes. Lee solo la palabra en negrita y decide.", "ops": ["bien", "mal"], "items": [{"enun": "<b>Si<\/b> no llueve, salimos.", "sol": "bien", "porque": "abre una condición: conjunción condicional"}, {"enun": "<b>Él<\/b> llegó el último.", "sol": "bien", "porque": "va solo, sin sustantivo detrás: pronombre personal"}, {"enun": "<b>Tu<\/b> no sabes lo que dices.", "sol": "mal", "porque": "no hay sustantivo detrás: pronombre, <i>tú<\/i>"}, {"enun": "<b>Mi<\/b> hermana llega el jueves.", "sol": "bien", "porque": "lleva sustantivo detrás: determinante posesivo, sin tilde"}, {"enun": "No me dijo nada a <b>mi<\/b>.", "sol": "mal", "porque": "va detrás de preposición y sola: es pronombre, <i>a mí<\/i>"}, {"enun": "Quería ayudar, <b>más<\/b> no pudo.", "sol": "mal", "porque": "admite <i>pero<\/i>: es <i>mas<\/i>, sin tilde"}, {"enun": "Espera a que te lo <b>de<\/b> el encargado.", "sol": "mal", "porque": "admite sujeto (<i>que él te lo dé<\/i>): es el verbo <i>dar<\/i>"}, {"enun": "¿Te apetece un <b>té<\/b>?", "sol": "bien", "porque": "se bebe: lleva tilde"}], "criterio": "Dos de las cuatro que estaban mal se resuelven con la pregunta de siempre: <b>¿hay un sustantivo detrás?<\/b> En <i>mi hermana<\/i> hay sustantivo al lado: determinante. En <i>a mí<\/i> y en <i>tú no sabes<\/i> no lo hay: pronombres. Las otras dos se resuelven con la sustitución: <i>mas<\/i> admite <i>pero<\/i>, y a <i>dé<\/i> se le puede poner sujeto. La pregunta del sustantivo resuelve tres de los nueve pares.", "apoyo": ["Los nueve pares"], "solo_web": true}, {"tipo": "hueco", "titulo": "La forma que corresponde", "estricto": true, "ayuda": "Escribe solo la palabra del hueco, con tilde o sin ella. Aquí la tilde forma parte de la respuesta: sin ella la palabra cambia.", "items": [{"enun": "Espera a que te lo ______ él mismo.", "sol": "dé", "porque": "verbo <i>dar<\/i>; admite sujeto"}, {"enun": "Quería ayudar, ______ no pudo.", "sol": "mas", "porque": "admite <i>pero<\/i>"}, {"enun": "No hay nada ______ que decir.", "sol": "más", "porque": "adverbio de cantidad"}, {"enun": "______ hermano dice que ______ no vas. <i>(las dos, separadas por un espacio)<\/i>", "sol": "Tu tú|tu tú", "corto": false, "porque": "determinante delante del sustantivo, y pronombre solo"}, {"enun": "A ______ no me dijo nada de ______ contrato. <i>(las dos)<\/i>", "sol": "mí mi", "corto": false, "porque": "detrás de preposición, pronombre; delante de sustantivo, determinante"}, {"enun": "Ya ______ que llego tarde.", "sol": "sé", "porque": "verbo <i>saber<\/i>"}], "criterio": "Las dos frases llevan las dos formas del mismo par. Caen en el examen más que las demás y enseñan mejor la regla: la palabra no cambia de tilde por cómo suena, sino por lo que hace en esa frase.", "apoyo": ["Los nueve pares", "Una comprobación por par"], "solo_web": true}], "cuaderno_txt": "Nudo 3 · La tilde diacrítica — apartado 1: Los nueve pares (p. 19) · ejercicios 1 y 2", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Cómo se lee un texto de examen", "meta": "25 minutos · con un texto delante", "cuaderno": {"nudo": 17, "apartados": [1], "ejercicios": [1, 2, 3, 4]}, "lectura": {"titulo": "La hora en que nadie mira", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["Marta Ferrán entra a trabajar a la hora en que los demás cenan.", "Limpia oficinas en un edificio del Eixample desde las diez de la noche", "hasta las seis de la mañana, y lleva once años haciéndolo. Cuando sale,", "se cruza en el portal con la gente que llega. «Nos saludamos», dice,", "«pero no nos conocemos de nada».", "", "Su empresa la llama personal de mantenimiento. Ella prefiere decir que", "limpia, porque le parece que la palabra larga esconde algo. En su turno", "son ocho personas para cuatro plantas, y asegura que hace diez años", "eran doce para las mismas plantas. Nadie le ha explicado esa cuenta.", "", "Lo que más le pesa no es el sueño, aunque duerme mal desde el primer", "año. Es que su horario no coincide con el de nadie. Sus hijos crecieron", "viéndola dormir por las tardes. Las bodas, las cenas y los cumpleaños", "caen siempre dentro de su jornada, y hace tiempo que dejaron de", "invitarla, porque daban por hecho que no iba a poder ir.", "", "Hay trabajos que la ciudad necesita de noche y nadie discute: los", "hospitales, los trenes, los bomberos. Y hay otros que son de noche", "porque de día molestarían o costarían más. Limpiar una oficina vacía", "sale más barato que limpiarla llena, y esa diferencia la paga alguien.", "", "Marta no pide que se prohíba el turno de noche. Dice que sería absurdo,", "y que además ella eligió quedarse cuando pudo cambiar. Pide otra cosa,", "más pequeña y más difícil: que quien decide los horarios sepa lo que", "cuesta uno de esos horarios, y que ese coste aparezca en alguna parte,", "aunque sea en la nómina.", "", "Ella lo resume de otra manera. Dice que del trabajo nocturno se habla", "siempre por el sueño que quita, y que a ella lo que le ha quitado son", "las invitaciones. Eso no sale en ningún convenio y no se recupera."], "pie": "Ni Marta Ferrán ni su empresa existen. Las cifras que da son suyas, no del autor."}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> las tres preguntas abiertas del bloque 1 suman <strong>2,5 puntos<\/strong> de los 3,5 del bloque; el punto restante es el léxico, que se estudia en el nudo 5. Dentro va el <strong>resumen<\/strong>, que valió <strong>1,25<\/strong> en 2026 y <strong>1,5<\/strong> en 2024 y 2025. Después de la redacción, ninguna otra pregunta concentra tantos puntos.<\/div>\n<h3>1 · Cómo se lee un texto de examen<\/h3>\n<p>Leer un texto de examen consiste en <strong>localizar<\/strong>, porque las preguntas ya vienen escritas y cada una tiene su sitio en el papel; y, cuando la pregunta pide «qué problemas» o «qué factores», en <strong>reunir<\/strong> lo que está repartido: en 2026, los cuatro problemas de la pregunta 1.2 están en las líneas 13-17 y 29-35.<\/p>\n<p><strong>Las cuatro pasadas:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>pasada<\/th>\n<th>qué hago<\/th>\n<th style=\"text-align: right;\">cuánto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 · seguida<\/strong><\/td>\n<td>Leo entero sin parar y sin subrayar. Solo quiero saber de qué va<\/td>\n<td style=\"text-align: right;\">3 min<\/td>\n<\/tr>\n<tr>\n<td><strong>2 · leo las preguntas<\/strong><\/td>\n<td>Antes de volver al texto, para saber qué busco en la pasada 3<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<tr>\n<td><strong>3 · localizo<\/strong><\/td>\n<td>Vuelvo al texto y <strong>anoto en el margen el número de la pregunta<\/strong> junto al trozo que la contesta<\/td>\n<td style=\"text-align: right;\">5 min<\/td>\n<\/tr>\n<tr>\n<td><strong>4 · el léxico<\/strong><\/td>\n<td>Busco las cuatro palabras del ejercicio de léxico y leo <strong>la frase entera<\/strong> donde están<\/td>\n<td style=\"text-align: right;\">2 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La pasada 2 casi nadie la hace, y ahorra después más trabajo que las otras tres. Leer las preguntas antes convierte la segunda lectura en una búsqueda.<\/p>\n<p><strong>El texto está construido casi siempre igual.<\/strong> En quince de las dieciséis convocatorias es un artículo de prensa —una columna de opinión o un reportaje—, y esos artículos se organizan casi siempre así:<\/p>\n<table>\n<thead>\n<tr>\n<th>dónde<\/th>\n<th>qué suele haber<\/th>\n<th>qué pregunta suele salir de ahí<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>primer párrafo<\/strong><\/td>\n<td>la anécdota concreta o el caso<\/td>\n<td>«explique qué hecho…», «cuál es la anécdota»<\/td>\n<\/tr>\n<tr>\n<td><strong>párrafos centrales<\/strong><\/td>\n<td>los datos, los testimonios, los ejemplos<\/td>\n<td>«según X, ¿qué…?», «qué razones…»<\/td>\n<\/tr>\n<tr>\n<td><strong>último párrafo<\/strong><\/td>\n<td><strong>la idea general del autor<\/strong><\/td>\n<td>«cuál es la idea principal», «qué es lo más grave»<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La respuesta a la pregunta de la idea principal está casi siempre en el último párrafo<\/strong>, y la de la anécdota, en el primero.<\/p>\n<p><strong>Las marcas que hay que hacer.<\/strong> Tres, y ninguna más: un texto subrayado entero es un texto sin subrayar.<\/p>\n<ol>\n<li><strong>El número de la pregunta<\/strong>, en el margen, junto al trozo que la contesta.<\/li>\n<li><strong>Un círculo<\/strong> en la palabra que no entiendo.<\/li>\n<li><strong>Una raya vertical<\/strong> al lado del párrafo donde está la idea general.<\/li>\n<\/ol>\n<h4>El texto de la convocatoria de 2026<\/h4>\n<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "De qué va el texto, en una línea", "dossier": {"cuaderno": "17", "ejercicio": 1}, "ayuda": "Los cuatro ejercicios del dossier de hoy van sobre el texto de la convocatoria de 2026, el de Daniel Trenado, que está en la teoría de este carril con sus líneas numeradas. La lectura de arriba es para la práctica que solo está en la web.", "items": [{"enun": "Sin leer las preguntas, escribe en una línea de qué va el texto de la convocatoria de 2026.", "modelo": "Un biólogo que se hizo agricultor y explica en redes sociales los problemas del campo."}], "criterio": "«Va del campo» no sirve: nombra el tema y no el texto. Una línea válida nombra quién y qué hace. Otras dos formulaciones válidas: «Un agricultor extremeño explica por internet por qué el campo no sale a cuenta.» · «La historia de un joven que dejó la biología por las tierras de su familia y se ha convertido en la voz del sector en las redes.»", "usa_texto": false, "apoyo": ["El texto de la convocatoria de 2026"], "dossier_txt": "Del dossier: nudo 17, ejercicio 1"}, {"tipo": "abierta", "titulo": "Dos preguntas de 2026: ¿en qué líneas está la respuesta?", "dossier": {"cuaderno": "17", "ejercicio": 2}, "ayuda": "Lee estas dos preguntas oficiales de 2026 y escribe en qué líneas del texto está cada respuesta.", "items": [{"enun": "«Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola?»", "modelo": "Líneas 18-21: la cita entrecomillada («No hay relevo generacional. ¿Cómo va a haberlo?…») y las líneas que la siguen. La pregunta tiene dos partes —la razón y cómo lo ejemplifica su trayectoria—, y la segunda está más adelante, en las líneas 21-22."}, {"enun": "«Diga qué dos factores se combinan para explicar el éxito de este agricultor, según el autor del texto.»", "modelo": "Líneas 36-44, las últimas: los dos factores son mantener métodos tradicionales e incorporar innovación."}], "criterio": "Una respuesta puede estar repartida en dos sitios: localizar consiste en encontrar todas las líneas de la respuesta, no una.", "usa_texto": false, "apoyo": ["El texto de la convocatoria de 2026"], "dossier_txt": "Del dossier: nudo 17, ejercicio 2"}, {"tipo": "opcion", "titulo": "¿En qué párrafo está la idea principal?", "dossier": {"cuaderno": "17", "ejercicio": 3}, "items": [{"enun": "¿En qué párrafo esperarías encontrar la respuesta a «¿cuál es la idea principal del texto?»? Contesta antes de buscarla.", "sol": "en el último", "porque": "en el texto de 2026 el cierre reúne lo tradicional y lo innovador, que es la idea del texto", "ops": ["en el primero", "en uno de los centrales", "en el último"]}], "usa_texto": false, "apoyo": ["1 · Cómo se lee un texto de examen"], "dossier_txt": "Del dossier: nudo 17, ejercicio 3"}, {"tipo": "abierta", "titulo": "La frase entera de dos expresiones", "dossier": {"cuaderno": "17", "ejercicio": 4}, "ayuda": "Localiza las dos expresiones en el texto de 2026 y copia la frase entera en la que está cada una. Después, comprueba si se entienden mejor dentro de la frase.", "items": [{"enun": "<i>los entresijos<\/i>", "modelo": "Líneas 7-8: «explica en redes sociales los entresijos de un sector que sobrevive a duras penas»."}, {"enun": "<i>su sustento<\/i>", "modelo": "Línea 40: «utiliza las redes sociales para defender su sustento»."}], "criterio": "Sí se entienden mejor: en los dos casos la frase entera da el sentido. Por eso existe la pasada 4. El enunciado oficial avisa: «Preste atención a la adecuación de la palabra al contexto en el que se encuentra». Quien contesta sin leer la frase pierde ese punto.", "usa_texto": false, "apoyo": ["1 · Cómo se lee un texto de examen"], "dossier_txt": "Del dossier: nudo 17, ejercicio 4"}, {"tipo": "hueco", "titulo": "¿En qué línea está la respuesta?", "ayuda": "Aquí se practica la pasada 3, cronometrada. Escribe solo el número de la línea donde <b>empieza<\/b> la respuesta. Si dudas entre dos seguidas, vale cualquiera de ellas.", "items": [{"enun": "¿Cuántas personas limpian ahora las cuatro plantas?", "sol": "8|9", "porque": "ocho ahora, doce hace diez años: la respuesta ocupa dos líneas"}, {"enun": "¿A qué hora entra y a qué hora sale?", "sol": "2|3"}, {"enun": "¿Qué lleva peor del turno de noche?", "sol": "10|11"}, {"enun": "¿Qué pide Marta exactamente?", "sol": "20|21"}, {"enun": "¿En qué línea empieza el párrafo que cierra con la idea general?", "sol": "24", "porque": "el cierre, donde el autor deja de contar y concluye"}], "criterio": "Las cinco respuestas están donde anunciaba la arquitectura: los datos en medio, la anécdota arriba, la idea al final. Por eso la pasada 2 ahorra tanto: leyendo antes las preguntas, esta búsqueda dura un minuto en vez de cinco.<br><br>La pregunta de lo que peor lleva. La respuesta ocupa <b>dos frases<\/b> —que no es el sueño, y que su horario no coincide con el de nadie—, así que localizar una línea no basta: hay que encontrarlas todas.", "apoyo": "todo", "solo_web": true}, {"tipo": "opcion", "titulo": "Léxico", "ayuda": "Cuatro palabras del texto. Lee <b>la frase entera<\/b> donde están antes de decidir; el enunciado oficial avisa de que hay que atender «a la adecuación de la palabra al contexto».", "items": [{"enun": "<b>mantenimiento<\/b> <i>(línea 6)<\/i>", "ops": ["reparación de averías", "vigilancia", "conservación y limpieza"], "sol": "conservación y limpieza", "porque": "en esa frase, la empresa usa la palabra para no escribir <i>limpieza<\/i>"}, {"enun": "<b>jornada<\/b> <i>(línea 13)<\/i>", "ops": ["horario de trabajo", "reunión de empresa", "día festivo"], "sol": "horario de trabajo"}, {"enun": "<b>nómina<\/b> <i>(línea 23)<\/i>", "ops": ["la lista de empleados", "el papel donde consta el sueldo", "el contrato"], "sol": "el papel donde consta el sueldo", "porque": "la otra acepción —la lista de empleados— existe, pero aquí se habla del sueldo"}, {"enun": "<b>convenio<\/b> <i>(línea 26)<\/i>", "ops": ["reunión de sindicatos", "acuerdo laboral entre empresa y trabajadores", "contrato individual"], "sol": "acuerdo laboral entre empresa y trabajadores"}], "criterio": "En dos de las cuatro la palabra tiene más de un significado de uso diario y solo la frase decide cuál. <i>Nómina<\/i> significa también la lista de empleados de una empresa; aquí designa el papel del sueldo. Quien contesta de memoria, sin volver al texto, pierde ese cuarto de punto.", "apoyo": "todo", "solo_web": true}, {"tipo": "cazar", "titulo": "Caza lo que está copiado", "ayuda": "Esta es la respuesta de un alumno a «¿por qué dice Marta que el turno de noche la ha aislado?». Hay <b>siete palabras seguidas<\/b> copiadas del texto. <b>Pincha en ellas.<\/b>", "items": [{"texto": "Marta dice que su horario no coincide con el de nadie y que por eso se quedó sin vida social fuera del trabajo.", "faltas": {"su": "línea 11 del texto", "horario": "línea 11", "no": "línea 11", "coincide": "línea 11", "con": "línea 11", "el": "línea 11", "de": "línea 11"}}], "criterio": "Siete palabras seguidas, de «su» a «de», son un trozo del texto tal cual. Con eso basta para que la respuesta baje de banda, aunque el resto esté bien redactado.<br><br>El criterio oficial exige «sin copiar literalmente fragmentos del texto» y no fija cuántas palabras seguidas son un fragmento. La medida que usamos en clase para comprobarlo: <b>ninguna cadena de tres o más palabras seguidas del original<\/b>, salvo nombres propios y términos sin sinónimo. Dos maneras de arreglarlo: sustituir el verbo —«dice que no comparte horario con nadie»— o resumir la idea en tus términos —«explica que trabaja cuando los demás descansan»—.", "apoyo": "todo", "solo_web": true}, {"tipo": "abierta", "titulo": "Contesta con el texto delante", "ayuda": "Una pregunta con la forma de las oficiales: pide <b>dos datos<\/b>. Cuatro o cinco líneas, redactadas, sin copiar y sin opinar. Cuando la tengas escrita, abre la clave.", "items": [{"enun": "«Según Marta, ¿qué lleva peor del turno de noche <b>y<\/b> cómo lo ejemplifica con su propia familia?»", "modelo": "Dos modelos abajo: uno contesta a las dos partes y el otro se queda en una."}], "modelos": ["<b>Completo.<\/b> Lo que peor lleva no es dormir mal, sino que su horario no encaja con el de nadie, de modo que se ha quedado fuera de la vida de los demás. Lo ejemplifica con su casa: sus hijos se criaron viéndola dormir de día, y las celebraciones familiares caían siempre dentro de sus horas de trabajo, hasta que dejaron de contar con ella.", "<b>Media respuesta.<\/b> Lo que peor lleva es que no coincide con nadie y se ha quedado sola. <i>(Contesta a la primera mitad y deja fuera la segunda, que el enunciado pedía con una «y». En 2026 la banda intermedia de esta pregunta es 0,5: una respuesta a la que le falta una de las dos partes cae ahí o más abajo.)<\/i>"], "criterio": "Se comprueban tres condiciones, las tres del bloque 1. <b>Una:<\/b> que estén las <b>dos<\/b> partes que pide la «y» del enunciado. <b>Dos:<\/b> que vaya atribuido —«según Marta»— y no como opinión tuya. <b>Tres:<\/b> que no haya fragmentos copiados; la medida de clase, ninguna cadena de tres palabras seguidas del original. El modelo completo escribe «no encaja con el de nadie» donde el texto trae «no coincide con el de nadie»: una palabra cambiada rompe la cadena.", "remate": "Y la regla del reloj: 0,75 puntos son cuatro minutos y medio.", "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 1: Cómo se lee un texto de examen (p. 40) · ejercicios 1, 2, 3 y 4", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los determinantes (1): artículo, demostrativos y posesivos", "meta": "30 minutos · y tres de los nueve pares de esta mañana se forman aquí", "cuaderno": {"nudo": 8, "apartados": [5], "ejercicios": [18, 19]}, "teoria": "<h3>5 · Los determinantes<\/h3>\n<p><strong>Qué es un determinante.<\/strong> Una palabra que va <strong>con<\/strong> el sustantivo, lo presenta y le marca el género y el número. No puede ir sola: si le quitas el sustantivo, la frase queda incompleta o la palabra cambia de clase.<\/p>\n<p><strong>El artículo.<\/strong><\/p>\n<ul>\n<li>Determinado: <em>el, la, los, las<\/em> — hablamos de algo ya conocido.<\/li>\n<li>Indeterminado: <em>un, una, unos, unas<\/em> — algo que aparece por primera vez.<\/li>\n<li>Neutro: <em>lo<\/em> — solo delante de adjetivos, y los vuelve abstractos: <em>lo importante<\/em>, <em>lo preocupante<\/em>. <strong>No existe <em>lo<\/em> delante de un sustantivo<\/strong>: nunca <em>lo problema<\/em>.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Este <em>lo<\/em> no es el <em>lo<\/em> pronombre.<\/strong> <em>Lo importante<\/em> lleva un adjetivo detrás y forma un grupo que funciona como sustantivo: es el artículo neutro. <em>Lo vendió<\/em> lleva un verbo, y <em>lo<\/em> ocupa el lugar del complemento directo (<em>vendió el tractor<\/em>): es el pronombre. La prueba: el pronombre <em>lo<\/em> se puede sustituir por <em>eso<\/em> o por un sustantivo (<em>vendió eso<\/em>); el artículo <em>lo<\/em>, no.<\/p>\n<\/blockquote>\n<p><strong>Los demostrativos.<\/strong> Marcan distancia: <em>este/esta/estos/estas<\/em> (aquí) · <em>ese/esa/esos/esas<\/em> (ahí) · <em>aquel/aquella/aquellos/aquellas<\/em> (allí). Si van detrás del sustantivo, exigen artículo delante: <em>el cuaderno aquel<\/em>.<\/p>\n<p><strong>Los posesivos.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>forma corta<\/strong> <em>(delante del sustantivo)<\/em><\/th>\n<th><strong>forma plena<\/strong> <em>(detrás, o ella sola)<\/em><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.ª · un poseedor<\/td>\n<td>mi, mis<\/td>\n<td>mío, mía, míos, mías<\/td>\n<\/tr>\n<tr>\n<td>2.ª · un poseedor<\/td>\n<td>tu, tus<\/td>\n<td>tuyo, tuya, tuyos, tuyas<\/td>\n<\/tr>\n<tr>\n<td>3.ª · un poseedor<\/td>\n<td>su, sus<\/td>\n<td>suyo, suya, suyos, suyas<\/td>\n<\/tr>\n<tr>\n<td>1.ª · varios poseedores<\/td>\n<td>nuestro, nuestra, nuestros, nuestras<\/td>\n<td><em>(la misma)<\/em><\/td>\n<\/tr>\n<tr>\n<td>2.ª · varios poseedores<\/td>\n<td>vuestro, vuestra, vuestros, vuestras<\/td>\n<td><em>(la misma)<\/em><\/td>\n<\/tr>\n<tr>\n<td>3.ª · varios poseedores<\/td>\n<td>su, sus<\/td>\n<td>suyo, suya, suyos, suyas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La forma corta va siempre delante y siempre con sustantivo: es <strong>determinante<\/strong>. La forma plena va detrás del sustantivo (<em>un amigo<\/em> <strong>mío<\/strong>) y ahí funciona como <strong>adjetivo<\/strong>; o va sola (<em>ese tractor no es<\/em> <strong>mío<\/strong>, <em>es<\/em> <strong>suyo<\/strong>; <em>el<\/em> <strong>mío<\/strong> <em>está en el taller<\/em>) y entonces funciona como <strong>pronombre<\/strong>. Así se enseña en secundaria y así se contesta en el examen. La NGLE (cap. 18) clasifica <em>mío<\/em>, <em>tuyo<\/em> y <em>suyo<\/em> como adjetivos en cualquier posición, y analiza <em>el mío<\/em> como un grupo nominal con el sustantivo sobrentendido (<em>el [tractor] mío<\/em>).<\/p>\n<p><strong>Tres pares de este apartado caen en el ejercicio de la tilde:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>sin tilde<\/th>\n<th>con tilde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>mi<\/strong> — determinante posesivo (<em>mi casa<\/em>)<\/td>\n<td><strong>mí<\/strong> — pronombre personal (<em>a mí<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>tu<\/strong> — determinante posesivo (<em>tu casa<\/em>)<\/td>\n<td><strong>tú<\/strong> — pronombre personal (<em>tú vienes<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>el<\/strong> — artículo, determinante (<em>el coche<\/em>)<\/td>\n<td><strong>él<\/strong> — pronombre personal (<em>él vino<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La prueba, una sola pregunta:<\/strong> ¿hay un sustantivo detrás? Sí → determinante, sin tilde. No → pronombre, con tilde.<\/p>\n<p><strong>Indefinidos.<\/strong> Expresan cantidad, pero <strong>imprecisa<\/strong>: <em>algún, ningún, mucho, poco, bastante, todo, otro, varios, cualquier, demasiado<\/em>. Formas apocopadas (pierden la sílaba final) <strong>delante<\/strong> del sustantivo: <em>algún día<\/em>, <em>ningún fruto<\/em>, <em>cualquier razón<\/em>. Formas plenas <strong>detrás<\/strong>: <em>un día cualquiera<\/em>, <em>razón ninguna<\/em>.<\/p>\n<p><strong>Numerales.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>qué expresa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cardinales<\/strong><\/td>\n<td>cantidad exacta<\/td>\n<td>uno, dos, veintiún, cien<\/td>\n<\/tr>\n<tr>\n<td><strong>ordinales<\/strong><\/td>\n<td>lugar en una serie<\/td>\n<td>primer, segundo, décimo, vigésimo<\/td>\n<\/tr>\n<tr>\n<td><strong>partitivos<\/strong><\/td>\n<td>una parte<\/td>\n<td>medio, tercio, quinceava parte<\/td>\n<\/tr>\n<tr>\n<td><strong>multiplicativos<\/strong><\/td>\n<td>una multiplicación<\/td>\n<td>doble, triple, cuádruple<\/td>\n<\/tr>\n<tr>\n<td><strong>distributivos<\/strong><\/td>\n<td>reparto<\/td>\n<td>cada, sendos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cuatro normas que se preguntan poco y se fallan mucho:<\/p>\n<ul>\n<li><strong><em>Uno<\/em> delante de un sustantivo masculino se apocopa<\/strong>: <em>un lápiz<\/em>, <em>veintiún lápices<\/em>. Con femenino, <em>veintiuna personas<\/em>; solo si empieza por <em>a<\/em> tónica se admite también <em>veintiún hachas<\/em>.<\/li>\n<li><strong><em>Cien<\/em><\/strong> delante de sustantivo (<em>cien años<\/em>), <strong><em>ciento<\/em><\/strong> en los porcentajes (<em>el diez por ciento<\/em>); para el total valen las tres formas, <em>cien por cien<\/em>, <em>cien por ciento<\/em> y <em>ciento por ciento<\/em>.<\/li>\n<li><strong>Los multiplicativos largos son esdrújulos y llevan tilde<\/strong>: <em>cuádruple<\/em>, <em>séxtuple<\/em>. <em>Doble<\/em> y <em>triple<\/em> son llanas y no la llevan.<\/li>\n<li>Los ordinales altos no se forman con el cardinal: el de 50 es <strong>quincuagésimo<\/strong>; el de 40, <strong>cuadragésimo<\/strong>.<\/li>\n<\/ul>\n<p><strong>Interrogativos y exclamativos.<\/strong> Son <em>qué, cuál/cuáles, cuánto/a/os/as, quién/quiénes<\/em>. <strong>Todos llevan tilde diacrítica<\/strong>, vayan entre signos o no.<\/p>\n<ul>\n<li>Como <strong>determinante<\/strong>, si llevan sustantivo detrás: <em>¿<\/em><em>Qué<\/em><em> tapices te gustan?<\/em> · <em>¿<\/em><em>Cuántos<\/em><em> años tienes?<\/em><\/li>\n<li>Como <strong>pronombre<\/strong>, si van solos: <em>¿<\/em><em>Cuáles<\/em><em> prefieres?<\/em> · <em>¿<\/em><em>Quién<\/em><em> vendrá?<\/em> (<em>quién<\/em> funciona solo como pronombre; <em>cuál<\/em> va delante de un sustantivo sobre todo en América —<em>¿cuál libro?<\/em>—, y en España se prefiere <em>qué<\/em>)<\/li>\n<\/ul>\n<p>La misma prueba que con los posesivos: <strong>¿hay un sustantivo detrás?<\/strong><\/p>\n<blockquote>\n<p><strong>Corrección:<\/strong> <strong><em>cuándo<\/em>, <em>cómo<\/em> y <em>dónde<\/em> son adverbios<\/strong>, no determinantes ni pronombres. Llevan tilde igual, pero si en la prueba te preguntan la clase, la respuesta es <em>adverbio<\/em>. Las claves oficiales de 2024 y 2026 evitan la clasificación con la fórmula <strong>«partícula interrogativa»<\/strong>: si dudas, esa es la fórmula segura.<\/p>\n<\/blockquote>\n<p><strong>La tilde no depende de los signos, depende del sentido.<\/strong> También la llevan en preguntas indirectas:<\/p>\n<blockquote>\n<p>«Y me pregunto <strong>cuánto<\/strong> tiempo más podrá mantenerse sin cerrar» (2024).\n«Es fácil imaginar la ilusión con la que se metió en este proyecto, <strong>cómo<\/strong> reunió el dinero» (2024).<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Determinante o pronombre?", "dossier": {"cuaderno": "8", "ejercicio": 18, "parte": "la clase"}, "ayuda": "Indica si la palabra en negrita es determinante o pronombre. Las tildes todavía no están puestas: se ponen en «Pon la tilde donde haga falta». El artículo cuenta como determinante.", "ops": ["determinante", "pronombre"], "items": [{"enun": "Compró un pastel para <b>mi<\/b>.", "sol": "pronombre", "porque": "no hay sustantivo detrás: pronombre, con tilde"}, {"enun": "Para <b>mi<\/b> que no llega.", "sol": "pronombre", "porque": "pronombre detrás de preposición, con tilde"}, {"enun": "<b>El<\/b> vino a casa.", "sol": "pronombre", "porque": "pronombre personal: es el sujeto de <i>vino<\/i>"}, {"enun": "<b>Mi<\/b> coche no arranca.", "sol": "determinante", "porque": "acompaña a <i>coche<\/i>: determinante, sin tilde"}, {"enun": "<b>El<\/b> vino está frío.", "sol": "determinante", "porque": "artículo, que es un determinante: acompaña a <i>vino<\/i>"}, {"enun": "Se lo dije a <b>el<\/b>.", "sol": "pronombre", "porque": "pronombre detrás de preposición, con tilde"}, {"enun": "<b>Tu<\/b> no lo sabes.", "sol": "pronombre", "porque": "pronombre: no hay sustantivo detrás"}, {"enun": "<b>Tu<\/b> hermano no lo sabe.", "sol": "determinante", "porque": "acompaña a <i>hermano<\/i>: determinante, sin tilde"}, {"enun": "¿<b>Tu o o artículo.", "pide": "lleva tilde diacrítica para diferenciar…", "apoyo": "todo", "usa_texto": false, "dossier_txt": "Del dossier: nudo 8, ejercicio 19"}, {"tipo": "opcion", "titulo": "Seis más: ¿determinante o pronombre?", "ayuda": "Una sola pregunta: ¿hay un sustantivo detrás?", "ops": ["determinante", "pronombre"], "items": [{"enun": "<b>Nuestra<\/b> terraza da al patio de dentro.", "sol": "determinante", "porque": "terraza"}, {"enun": "A <b>mí<\/b> no me avisaron.", "sol": "pronombre", "porque": "detrás de preposición y solo"}, {"enun": "Ese cargador es <b>mío<\/b>.", "sol": "pronombre", "porque": "va solo, sin sustantivo al que acompañar"}, {"enun": "<b>Sus<\/b> razones tendrá.", "sol": "determinante", "porque": "razones"}, {"enun": "Déjame <b>tu<\/b> cargador.", "sol": "determinante", "porque": "cargador"}, {"enun": "El coche es <b>suyo<\/b>.", "sol": "pronombre", "porque": "va solo, no presenta a ningún sustantivo"}], "criterio": "Las tres formas cortas —<i>tu<\/i>, <i>nuestra<\/i>, <i>sus<\/i>— llevan sustantivo detrás y son determinantes. Las tres plenas —<i>suyo<\/i>, <i>mí<\/i>, <i>mío<\/i>— van solas: son pronombres. No hay más criterio que ese.", "apoyo": "todo", "solo_web": true}, {"tipo": "opcion", "titulo": "¿Está bien nombrado?", "ayuda": "Seis respuestas. Decide si la clase de palabra está bien dicha.", "ops": ["bien nombrado", "mal nombrado"], "items": [{"enun": "«<i>mí<\/i> lleva tilde para diferenciar el pronombre personal del determinante posesivo»", "sol": "bien nombrado", "porque": "es la fórmula de la clave de 2017"}, {"enun": "«<i>eso<\/i> es un pronombre demostrativo neutro»", "sol": "bien nombrado"}, {"enun": "«<i>mi<\/i> es un pronombre posesivo»", "sol": "mal nombrado", "porque": "es <b>determinante<\/b> posesivo: va delante de un sustantivo"}, {"enun": "«<i>el<\/i> es un determinante artículo»", "sol": "bien nombrado"}, {"enun": "«<i>el<\/i> es un pronombre personal»", "sol": "mal nombrado", "porque": "<i>el<\/i> sin tilde es <b>art <script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:

(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');

    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {

    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;
      if (ev.key === 'Escape') { cierraVentana(); return; }
      if (ev.key === 'Tab') {
        /* el tabulador no sale de la ventana mientras está abierta */
        var f = caja.querySelectorAll('button, [href], input, textarea, select, summary, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;

        else if (!ev.shiftKey && document.activeElement === ultimo) { primero.focus(); ev.preventDefault(); }
      }
    });
    var cuerpo0 = caja.querySelector('.v-cuerpo');
    function sigue() { caja.classList.toggle('sigue', cuerpo0.scrollTop + cuerpo0.clientHeight < cuerpo0.scrollHeight - 6); }
    cuerpo0.addEventListener('scroll', sigue);
    velo._sigue = sigue;
    document.body.appendChild(velo);

  function abreVentana(kicker, titulo, contenido, desde) {

  function cierraVentana() {

    document.body.classList.remove('con-ventana');
    if (disparador && disparador.focus) disparador.focus();
  }
  /* iconos en línea: se ven igual en cualquier pantalla y no dependen de ninguna fuente */
  var ICONO = {
