<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 8 · 22 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../cas-trimestres.html#sesion/2026-10-22">Volver a la sesión</a></p>
    <div class="kicker">CAS Castellà 26-27 · primer trimestre · día 8</div>
    <h1>Jueves 22 de octubre</h1>
    <p class="sub">Los interrogativos con tilde · responder sin copiar · numerales e indefinidos</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>
</div>

<script>window.DIA = {"dia": 8, "fecha": "2026-10-22", "tab": "Día 8 · 22 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 8", "h1": "Jueves 22 de octubre", "sub": "Los interrogativos con tilde · responder sin copiar · numerales e indefinidos", "carriles": [{"chapa": "Carril A", "titulo": "La tilde diacrítica (2): los interrogativos", "meta": "30 minutos · con esto queda cerrada la acentuación", "cuaderno": {"nudo": 3, "apartados": [2], "ejercicios": [3, 4, 5, 6, 7]}, "teoria": "<div class=\"nota\"><p>Hoy se cierra la acentuación. No vuelve a tener sesión de clase en todo el curso: a partir de mañana vive en el videojuego, hasta el repaso del 1 de diciembre.<\/p><\/div><h3 style=\"font-size:17px;margin:24px 0 6px\">Interrogativos y exclamativos<\/h3><p>Son diacríticos. <i>Qué<\/i>, <i>quién<\/i> y <i>cuál<\/i> son monosílabos; <i>cómo<\/i>, <i>cuándo<\/i>, <i>cuánto<\/i> y <i>dónde<\/i> son llanas acabadas en vocal: por las reglas generales ninguno llevaría tilde. La tilde señala para qué se usa la palabra, no dónde está la fuerza.<\/p><div class=\"nota\"><p><b>qué · quién / quiénes · cuál / cuáles · cómo · cuándo · cuánto / -a / -os / -as · dónde · adónde<\/b><\/p><\/div><p>Llevan tilde cuando <b>preguntan o exclaman<\/b>. Y la llevan también cuando la pregunta es <b>indirecta<\/b>, sin signos de interrogación: en esas se olvida la tilde más que en las directas.<\/p><table><tr><th><\/th><th>ejemplo<\/th><\/tr><tr><td>pregunta directa<\/td><td>¿<b>Cómo<\/b> va a haberlo? · ¡<b>Cuántos<\/b> problemas!<\/td><\/tr><tr><td><b>pregunta indirecta<\/b><\/td><td>Me pregunto <b>cuánto<\/b> tiempo aguantará. · No sé <b>dónde<\/b> está. · Quisieron saber <b>qué<\/b> hacía allí.<\/td><\/tr><tr><td>relativo o conjunción: <b>sin tilde<\/b><\/td><td>La casa <b>donde<\/b> vivo. · <b>Cuando<\/b> llegues, avisa. · Haz lo <b>que<\/b> quieras. · <b>Como<\/b> no viniste, me fui.<\/td><\/tr><\/table><p><b>La comprobación:<\/b> convierte la frase en pregunta directa. «No sé dónde está» → «¿Dónde está?»: funciona, lleva tilde. «La casa donde vivo» → «¿Dónde vivo?» no dice lo mismo: no la lleva.<\/p><h3 style=\"font-size:17px;margin:24px 0 6px\">Los cuatro porqués<\/h3><table><tr><th>forma<\/th><th>qué es<\/th><th>ejemplo<\/th><\/tr><tr><td><b>por qué<\/b><\/td><td>pregunta, directa o indirecta<\/td><td>¿Por qué lo hiciste? · No sé por qué lo hizo.<\/td><\/tr><tr><td><b>porque<\/b><\/td><td>conjunción causal (= <i>ya que<\/i>)<\/td><td>No fui porque llovía.<\/td><\/tr><tr><td><b>el porqué<\/b><\/td><td>sustantivo (= el motivo); lleva artículo y hace plural<\/td><td>No entiendo el porqué. · Los porqués.<\/td><\/tr><tr><td><b>por que<\/b><\/td><td>preposición + <i>que<\/i><\/td><td>Luchamos por que se cumpla la ley.<\/td><\/tr><\/table><p><i>Por que<\/i> es raro y no ha caído nunca. Los otros tres sí se usan a diario y se confunden a diario.<\/p><h3 style=\"font-size:17px;margin:24px 0 6px\">Aún / aun, y una palabra que ya no lleva tilde<\/h3><p><b>aún<\/b> cuando se puede sustituir por <i>todavía<\/i>: <i>Aún no ha llegado<\/i>. <b>aun<\/b> cuando se puede sustituir por <i>incluso<\/i>: <i>Aun con ayuda, no llegó<\/i>.<\/p><div class=\"nota\"><p><b><i>solo<\/i> se escribe sin tilde.<\/b> La Ortografía de 2010 dejó de recomendarla y la RAE (2023) solo la admite si quien escribe aprecia una ambigüedad; sin tilde nunca cuenta como falta, y en un examen se escribe así. Así lo aplican las convocatorias: en 2022 aparece en el texto sin tilde, y como ítem de sinónimo (= <i>solamente<\/i>), no de acentuación. Si te la enseñaron con tilde, aprendiste la norma anterior a 2010.<\/p><\/div><h3 style=\"font-size:17px;margin:24px 0 6px\">Lo que ha pesado cada familia<\/h3><table><tr><th>familia<\/th><th>ítems<\/th><th>dónde se explica<\/th><\/tr><tr><td>hiato<\/td><td>12<\/td><td>día 5<\/td><\/tr><tr><td>diacrítica<\/td><td>9<\/td><td>días 7 y 8<\/td><\/tr><tr><td>aguda<\/td><td>8<\/td><td>día 3<\/td><\/tr><tr><td>esdrújula<\/td><td>3<\/td><td>día 3<\/td><\/tr><tr><td>llana acabada en consonante<\/td><td>2<\/td><td>día 3<\/td><\/tr><\/table><p>Tres familias —hiato, diacrítica y aguda— suman <b>29 de los 34 ítems<\/b>: el 85 %. Y en las dieciséis convocatorias siempre ha caído al menos un hiato o una diacrítica.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "¿Pregunta o no pregunta?", "ayuda": "Prueba a convertirlo en pregunta directa. Si funciona, lleva tilde.", "ops": ["con tilde", "sin tilde"], "items": [{"enun": "¿______ empieza? <i>(cuando)<\/i>", "sol": "con tilde", "porque": "pregunta directa"}, {"enun": "Explícame ______ funciona. <i>(como)<\/i>", "sol": "con tilde", "porque": "interrogativa indirecta"}, {"enun": "Lo hice ______ me dijiste. <i>(como)<\/i>", "sol": "sin tilde", "porque": "relativo de modo"}, {"enun": "No sé ______ lo he dejado. <i>(donde)<\/i>", "sol": "con tilde", "porque": "interrogativa indirecta: «¿dónde lo he dejado?»"}, {"enun": "Iremos ______ tú digas. <i>(donde)<\/i>", "sol": "sin tilde", "porque": "relativo"}, {"enun": "Avísame ______ llegues. <i>(cuando)<\/i>", "sol": "sin tilde", "porque": "conjunción temporal"}, {"enun": "Dijo ______ no venía. <i>(que)<\/i>", "sol": "sin tilde", "porque": "conjunción"}, {"enun": "Pregúntale ______ quiere. <i>(que)<\/i>", "sol": "con tilde", "porque": "interrogativa indirecta"}], "criterio": "Las tres que llevan tilde sin signos de interrogación concentran los fallos. <b>Detrás de <i>no sé<\/i>, <i>pregúntale<\/i>, <i>explícame<\/i> o <i>me pregunto<\/i> casi siempre hay una pregunta<\/b>, aunque no se escriban los signos.", "apoyo": ["Interrogativos y exclamativos"]}, {"tipo": "hueco", "titulo": "Los cuatro porqués", "estricto": true, "ayuda": "Escribe la forma que corresponde: <i>por qué<\/i>, <i>porque<\/i>, <i>el porqué<\/i> o <i>por que<\/i>. Separadas o juntas, con tilde o sin ella.", "items": [{"enun": "No fui ______ estaba enfermo.", "sol": "porque", "corto": false, "porque": "causal: admite <i>ya que<\/i>"}, {"enun": "¿______ no me lo dijiste?", "sol": "Por qué|por qué", "corto": false, "porque": "pregunta directa"}, {"enun": "Nadie entiende ______ de la decisión.", "sol": "el porqué", "corto": false, "porque": "sustantivo: lleva artículo delante"}, {"enun": "Me gustaría saber ______ lo hizo.", "sol": "por qué", "corto": false, "porque": "pregunta indirecta"}, {"enun": "Luchan ______ se apruebe la ley.", "sol": "por que", "corto": false, "porque": "preposición <i>por<\/i> + conjunción <i>que<\/i>"}], "criterio": "El sustantivo <i>porqué<\/i> se reconoce por el artículo: si admite <i>el<\/i> delante, va junto y con tilde. <i>Por que<\/i> es raro y no ha caído nunca; está aquí para que no te sorprenda si lo encuentras escrito.", "apoyo": ["Los cuatro porqués"]}, {"tipo": "hueco", "titulo": "Aún o aun", "estricto": true, "ayuda": "Sustituye la palabra por <i>todavía<\/i> o por <i>incluso<\/i> y comprueba cuál encaja.", "items": [{"enun": "______ no ha contestado.", "sol": "Aún|aún", "porque": "= todavía"}, {"enun": "______ sabiéndolo, no dijo nada.", "sol": "Aun|aun", "porque": "= incluso"}, {"enun": "Es ______ peor de lo que parecía.", "sol": "aún", "porque": "= todavía"}, {"enun": "______ con dos trabajos, no llega a fin de mes.", "sol": "Aun|aun", "porque": "= incluso"}], "criterio": "Los dos que llevan <i>incluso<\/i> abren una concesión: expresan que algo pasa <b>a pesar de<\/b> lo que viene detrás. La redacción del bloque 3 pide ese mismo giro.", "apoyo": ["Aún / aun, y una palabra que ya no lleva tilde"]}, {"tipo": "justificar", "titulo": "Los dos interrogativos", "ayuda": "Los dos proceden de exámenes reales. La respuesta completa lleva <b>dos datos<\/b>: que la tilde es diacrítica, y que la palabra es una partícula interrogativa.", "items": [{"palabra": "<i>cuánto<\/i>", "conv": "2024", "enun": "«Y me pregunto <b>cuánto<\/b> tiempo más podrá mantenerse sin cerrar.»", "requiere": [["diacrítica", "diacrítico"], ["interrogativa", "interrogativo", "pregunta"]], "modelo": "lleva tilde diacrítica porque es una partícula interrogativa en una interrogativa indirecta"}, {"palabra": "<i>Cómo<\/i>", "conv": "2026", "enun": "«No hay relevo generacional. ¿<b>Cómo<\/b> va a haberlo?»", "requiere": [["diacrítica", "diacrítico"], ["interrogativa", "interrogativo", "pregunta"]], "modelo": "es una palabra llana que lleva tilde diacrítica que señala que es una partícula interrogativa, aquí en pregunta directa"}], "criterio": "Uno va entre signos de interrogación y el otro no, y los dos llevan tilde. Escribir solo «es interrogativo» deja la respuesta a medias: falta nombrar la tilde <b>diacrítica<\/b>, porque esa clase explica por qué está puesta.", "apoyo": ["Interrogativos y exclamativos", "Aún / aun, y una palabra que ya no lleva tilde"], "pide": "lleva tilde porque…"}], "cuaderno_txt": "Nudo 3 · La tilde diacrítica — apartado 2: Interrogativos y exclamativos (p. 22) · ejercicios 3, 4, 5, 6 y 7"}, {"chapa": "Carril B", "titulo": "Responder sin copiar", "meta": "25 minutos · los quince criterios, sobre un texto", "cuaderno": {"nudo": 17, "apartados": [2], "ejercicios": [5, 6]}, "lectura": {"titulo": "Dos años de esquemas", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["La panadería de Amalia Ruiz lleva veintidós meses detrás de una valla.", "Las obras del carril bus empezaron en marzo del año pasado y todavía", "no han llegado a su esquina. Para entrar hay que rodear dos manzanas o", "cruzar por una pasarela de tablones que se moja cuando llueve. Amalia", "dice que ha perdido a la mitad de los clientes de por la mañana.", "", "El ayuntamiento anunció ocho meses de trabajos. Va por veintidós, y en", "el barrio ya nadie pregunta cuándo acaban. Hay cuatro locales cerrados", "en esa acera; tres abrieron antes de que empezaran las obras. Amalia", "guarda los recortes de prensa en una carpeta detrás del mostrador.", "", "Lo que más le molesta no es el retraso, que da por descontado. Es que", "nadie le avise. Se entera de los cortes cuando ve llegar la máquina, y", "una vez estuvo tres días sin poder recibir la harina porque habían", "levantado el asfalto delante de la puerta sin decir nada.", "", "Hay ayudas para los comercios afectados. Son de mil quinientos euros y", "se piden por internet, con certificado digital. Amalia lo intentó dos", "veces, no pasó de la primera pantalla y acabó dejándolo. Dice que la", "ayuda existe para quien sabe pedirla.", "", "Y esa es la parte que se repite en cada obra de cada barrio. El dinero", "está previsto, el plazo está publicado y la compensación está escrita.", "Lo que no está previsto es que alguien llame a la puerta de la", "panadería para contarlo."], "pie": "Texto inventado. Ni Amalia Ruiz ni las cifras que da son reales."}, "teoria": "<div class=\"nota\"><p>Las preguntas abiertas ocupan la parte más larga del bloque 1. Se corrigen con tres bandas —completa, con alguna imprecisión, deficiente—, y la clave añade que «pueden otorgarse puntuaciones intermedias»: funciona como una escala continua.<\/p><\/div><h3 style=\"font-size:17px;margin:24px 0 6px\">Las cinco maneras de bajar por esa escala<\/h3><p>Las claves oficiales reúnen quince en total. Estas cinco aparecen todos los años:<\/p><table><tr><th><\/th><th>criterio<\/th><\/tr><tr><td><b>1<\/b><\/td><td><b>Contestar a menos de lo que pide.<\/b> Si el enunciado pide dos datos («explique X <b>y<\/b> exponga Y») y solo contestas una, la respuesta cae a la banda intermedia o más abajo<\/td><\/tr><tr><td><b>3<\/b><\/td><td><b>Copiar literalmente<\/b> el fragmento donde está la respuesta<\/td><\/tr><tr><td><b>7<\/b><\/td><td><b>No indicar según quién.<\/b> Si el enunciado indica «según Amalia», la respuesta va atribuida<\/td><\/tr><tr><td><b>12<\/b><\/td><td><b>Meter opinión propia.<\/b> No se pregunta qué opinas: eso es el bloque 3<\/td><\/tr><tr><td><b>13<\/b><\/td><td><b>Metadiscurso vacío<\/b>: «el autor nos habla de…». Ocupa palabras y no contesta<\/td><\/tr><\/table><h3 style=\"font-size:17px;margin:24px 0 6px\">Cómo no copiar, en tres pasos<\/h3><table><tr><th>paso<\/th><th>sobre el texto de arriba<\/th><\/tr><tr><td><b>Sustituir la palabra<\/b><\/td><td>«una pasarela de tablones» → <i>un paso de madera<\/i><\/td><\/tr><tr><td><b>Sustituir el verbo, y con él la construcción<\/b><\/td><td>«ha perdido a la mitad de los clientes» → <i>su clientela se ha reducido a la mitad<\/i><\/td><\/tr><tr><td><b>Resumir en tus términos<\/b><\/td><td>«no pasó de la primera pantalla» → <i>no consiguió completar la solicitud<\/i><\/td><\/tr><\/table><p>Un nombre propio o una palabra técnica <b>se pueden repetir<\/b>: <i>Amalia<\/i> o <i>certificado digital<\/i> no tienen sinónimo, y lo que se prohíbe es copiar fragmentos.<\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué criterio se salta?", "ayuda": "Cinco respuestas de alumno a preguntas sobre el texto de arriba. Ninguna es falsa, y a todas les falta algo.", "ops": ["contesta a menos", "copia literal", "no indica según quién", "mete opinión", "metadiscurso vacío"], "items": [{"enun": "<i>Se entera de los cortes cuando ve llegar la máquina.<\/i>", "sol": "copia literal", "porque": "ocho palabras seguidas del original"}, {"enun": "Pregunta: «según Amalia, ¿qué le molesta más?». Respuesta: <i>Que nadie le avise de los cortes.<\/i>", "sol": "no indica según quién", "porque": "es verdad y está bien escrito, pero el enunciado pedía «según Amalia» y la respuesta lo presenta como un hecho"}, {"enun": "<i>Es indignante que tengan a una mujer dos años detrás de una valla.<\/i>", "sol": "mete opinión", "porque": "la pregunta pide lo que afirma el texto, no lo que le parece a quien contesta"}, {"enun": "Pregunta: «explique el problema de las ayudas <b>y<\/b> por qué no las cobró». Respuesta: <i>Las ayudas son de mil quinientos euros.<\/i>", "sol": "contesta a menos", "porque": "el enunciado pedía dos datos"}, {"enun": "<i>En este texto el autor nos habla de un tema muy actual que afecta a los comercios.<\/i>", "sol": "metadiscurso vacío"}], "criterio": "Ninguna de las cinco afirma nada falso sobre el texto. La diferencia no está en haber entendido el texto, sino en haber contestado lo que se preguntaba y como se preguntaba.", "apoyo": ["Las cinco maneras de bajar por esa escala"]}, {"tipo": "cazar", "titulo": "Caza lo copiado", "ayuda": "Esta respuesta a «¿por qué Amalia no llegó a cobrar la ayuda?» tiene <b>seis palabras seguidas<\/b> copiadas del texto. <b>Pincha en ellas.<\/b>", "items": [{"texto": "Amalia intentó pedirla, pero no pasó de la primera pantalla y acabó abandonando el trámite.", "faltas": {"no": "copiado del texto", "pasó": "copiado del texto", "de": "copiado del texto", "la": "copiado del texto", "primera": "copiado del texto", "pantalla": "copiado del texto"}}], "criterio": "De «no» a «pantalla» son seis palabras del original tal cual. Y atiende a lo que <b>sí<\/b> se puede repetir: <i>Amalia<\/i> y <i>trámite<\/i> no cuentan como copia.<br><br>Arreglado: «probó dos veces y se atascó en la primera de las pantallas, así que lo dejó».", "apoyo": ["Cómo no copiar, en tres pasos"]}, {"tipo": "opcion", "titulo": "¿Vale esta reescritura?", "ayuda": "El original: «ha perdido a la mitad de los clientes de por la mañana». Decide sobre cada versión.", "ops": ["vale", "es copia"], "items": [{"enun": "<i>Se le han ido la mitad de los clientes de la mañana.<\/i>", "sol": "es copia", "porque": "«la mitad de los clientes de» son seis palabras seguidas del original: se ha cambiado el verbo y se ha copiado el resto"}, {"enun": "<i>Atiende a la mitad de gente que antes por las mañanas.<\/i>", "sol": "vale"}, {"enun": "<i>Su clientela de primera hora se ha reducido a la mitad.<\/i>", "sol": "vale"}, {"enun": "<i>Por las mañanas entra la mitad de gente que antes.<\/i>", "sol": "vale"}, {"enun": "<i>Ha perdido a la mitad de los clientes.<\/i>", "sol": "es copia"}, {"enun": "<i>Perdió a la mitad de los clientes de por la mañana.<\/i>", "sol": "es copia", "porque": "cambia el verbo y deja nueve palabras seguidas del original"}], "criterio": "La medida de clase no cambia: <b>ninguna cadena de tres o más palabras seguidas del original<\/b>, salvo nombres y términos sin sinónimo. Las versiones que cambian el verbo y copian el resto repiten el error más frecuente: se cambia la primera palabra y se sigue copiando lo demás.", "apoyo": ["Cómo no copiar, en tres pasos"]}, {"tipo": "abierta", "titulo": "Contesta con el texto delante", "ayuda": "Una pregunta con «y»: pide dos datos. Cuatro o cinco líneas, redactadas, atribuidas y sin copiar. Cuatro minutos y medio.", "items": [{"enun": "«Según Amalia, ¿qué lleva peor de las obras <b>y<\/b> cómo lo ilustra con el episodio de la harina?»", "modelo": "Dos modelos abajo: uno contesta a las dos partes y el otro se queda en una."}], "modelos": ["<b>Completo.<\/b> Según ella, lo que peor lleva no es que las obras se alarguen, retraso que ya da por hecho, sino que nadie le comunique nada: se entera de los cortes cuando aparece la maquinaria. El episodio de la harina lo ilustra: estuvo tres días sin poder recibir el género porque habían levantado el asfalto delante de su puerta sin avisarla.", "<b>Media respuesta.<\/b> Lo que peor lleva es que no le avisan de nada. <i>(Contesta a la primera mitad y deja fuera el ejemplo, que el enunciado pedía con una «y». En 2026 la banda intermedia de esta pregunta es 0,5: una respuesta a la que le falta una de las dos partes cae ahí o más abajo.)<\/i>"], "criterio": "Tres condiciones. <b>Una:<\/b> las <b>dos<\/b> partes que pide la «y». <b>Dos:<\/b> atribuido —«según ella»—, no como opinión tuya. <b>Tres:<\/b> sin fragmentos copiados —la medida de clase, ninguna cadena de tres palabras—: el modelo escribe «cuando aparece la maquinaria» donde el texto trae «cuando ve llegar la máquina».", "apoyo": ["Cómo no copiar, en tres pasos"]}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 2: Responder sin copiar (p. 44) · ejercicios 5 y 6"}, {"chapa": "Carril C", "titulo": "Los determinantes (2): indefinidos, numerales e interrogativos", "meta": "30 minutos · la apócope, los numerales y los interrogativos", "cuaderno": {"nudo": 8, "apartados": [5], "ejercicios": [20, 21, 22, 23, 24, 25, 26]}, "teoria": "<p>El martes se estudiaron el artículo, los demostrativos y los posesivos. Hoy se cierran los tres grupos que faltaban, y de los tres, el de los interrogativos se pregunta más que los otros dos.<\/p><h3 style=\"font-size:17px;margin:24px 0 6px\">Indefinidos<\/h3><p>Expresan cantidad, pero <b>imprecisa<\/b>: <i>algún, ningún, mucho, poco, bastante, todo, otro, varios, cualquier, demasiado<\/i>.<\/p><p>Se acortan —se <b>apocopan<\/b>— cuando van <b>delante<\/b> del sustantivo: <i>algún día<\/i>, <i>ningún fruto<\/i>, <i>cualquier razón<\/i>. Y recuperan la forma entera cuando van detrás: <i>un día cualquiera<\/i>, <i>razón ninguna<\/i>.<\/p><h3 style=\"font-size:17px;margin:24px 0 6px\">Numerales<\/h3><table><tr><th>tipo<\/th><th>qué expresa<\/th><th>ejemplos<\/th><\/tr><tr><td><b>cardinales<\/b><\/td><td>cantidad exacta<\/td><td>uno, dos, veintiuno, cien<\/td><\/tr><tr><td><b>ordinales<\/b><\/td><td>lugar en una serie<\/td><td>primer, segundo, décimo, vigésimo<\/td><\/tr><tr><td><b>partitivos<\/b><\/td><td>una parte<\/td><td>medio, tercio, quinceava parte<\/td><\/tr><tr><td><b>multiplicativos<\/b><\/td><td>una multiplicación<\/td><td>doble, triple, cuádruple<\/td><\/tr><tr><td><b>distributivos<\/b><\/td><td>reparto<\/td><td>cada, sendos<\/td><\/tr><\/table><p>Cuatro normas que se preguntan poco y se fallan mucho:<\/p><p><b>1 · <i>Uno<\/i> delante de un sustantivo masculino se apocopa:<\/b> <i>un lápiz<\/i>, <i>veintiún lápices<\/i>. Con femenino, <i>veintiuna personas<\/i>; solo si empieza por a tónica se admite también <i>veintiún hachas<\/i>.<br><b>2 · <i>Cien<\/i><\/b> delante de sustantivo (<i>cien años<\/i>), <b><i>ciento<\/i><\/b> en los porcentajes (<i>el diez por ciento<\/i>); para el total valen las tres formas, <i>cien por cien<\/i>, <i>cien por ciento<\/i> y <i>ciento por ciento<\/i>.<br><b>3 · Los multiplicativos largos son esdrújulos y llevan tilde:<\/b> <i>cuádruple<\/i>, <i>séxtuple<\/i>. <i>Doble<\/i> y <i>triple<\/i> son llanas y no la llevan.<br><b>4 ·<\/b> Los ordinales altos no se forman con el cardinal: el de 50 es <b>quincuagésimo<\/b>; el de 40, <b>cuadragésimo<\/b>.<\/p><h3 style=\"font-size:17px;margin:24px 0 6px\">Interrogativos y exclamativos, la casilla que se pregunta<\/h3><p>Son <i>qué<\/i>, <i>cuál / cuáles<\/i>, <i>cuánto / -a / -os / -as<\/i>, <i>quién / quiénes<\/i>. <b>Todos llevan tilde diacrítica<\/b>, vayan entre signos o no, como se ha estudiado esta mañana en el carril A.<\/p><div class=\"nota\"><p>Como <b>determinante<\/b>, si llevan sustantivo detrás: <i>¿<b>Qué<\/b> tapices te gustan?<\/i> · <i>¿<b>Cuántos<\/b> años tienes?<\/i><br>Como <b>pronombre<\/b>, si van solos: <i>¿<b>Cuáles<\/b> prefieres?<\/i> · <i>¿<b>Quién<\/b> vendrá?<\/i> (<i>quién<\/i> funciona solo como pronombre; <i>cuál<\/i> va delante de un sustantivo sobre todo en América —<i>¿cuál libro?<\/i>—, y en España se prefiere <i>qué<\/i>)<\/p><\/div><p>La prueba no cambia, y con este ya van cuatro grupos en los que sirve: <b>¿hay un sustantivo detrás?<\/b><\/p>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué clase de numeral?", "ayuda": "Los cinco tipos de la tabla.", "ops": ["cardinal", "ordinal", "partitivo", "multiplicativo", "distributivo"], "items": [{"enun": "el <b>vigésimo<\/b> aniversario", "sol": "ordinal"}, {"enun": "<b>cien<\/b> años", "sol": "cardinal"}, {"enun": "<b>veintiún<\/b> kilos", "sol": "cardinal"}, {"enun": "<b>media<\/b> hora", "sol": "partitivo"}, {"enun": "el <b>triple<\/b> de horas", "sol": "multiplicativo"}, {"enun": "<b>cada<\/b> alumno", "sol": "distributivo"}], "criterio": "Los partitivos y los multiplicativos se confunden porque los dos suenan a operación. <i>Media cosecha<\/i> es la mitad de una; <i>el triple de horas<\/i> son tres veces más. Uno parte y el otro multiplica.", "apoyo": ["Numerales"]}, {"tipo": "hueco", "titulo": "La forma que corresponde", "estricto": true, "ayuda": "Apócope, <i>cien<\/i> o <i>ciento<\/i>, y los ordinales altos. Escribe solo la palabra.", "items": [{"enun": "______ hachas nuevas <i>(21)<\/i>", "sol": "veintiún|veintiuna", "porque": "<i>hacha<\/i> es femenino, pero empieza por a tónica: valen <i>veintiún hachas<\/i> y <i>veintiuna hachas<\/i>"}, {"enun": "Han pasado ______ años. <i>(100)<\/i>", "sol": "cien"}, {"enun": "Subió el diez por ______. <i>(100)<\/i>", "sol": "ciento", "porque": "en los porcentajes, la forma entera"}, {"enun": "Es el ______ aniversario. <i>(50.º)<\/i>", "sol": "quincuagésimo", "corto": false}, {"enun": "Cobra el ______. <i>(×4)<\/i>", "sol": "cuádruple", "corto": false, "porque": "esdrújula: lleva tilde siempre"}, {"enun": "No tengo ______ problema con eso.", "sol": "ningún", "porque": "apocopado delante del sustantivo"}, {"enun": "Es el ______ capítulo. <i>(1.º)<\/i>", "sol": "primer", "porque": "apocopado delante de un sustantivo masculino"}], "criterio": "El de <i>cuádruple<\/i> junta dos contenidos del curso: numeral y esdrújula. Por eso lleva tilde siempre, igual que <i>séxtuple<\/i>. <i>Doble<\/i> y <i>triple<\/i> son llanas acabadas en vocal y no la llevan.", "apoyo": ["Numerales", "Indefinidos"]}, {"tipo": "opcion", "titulo": "¿Determinante o pronombre?", "ayuda": "Interrogativos y exclamativos. Todos llevan tilde. De uno a otro cambia la clase: unos presentan un sustantivo y otros ocupan su lugar.", "ops": ["determinante", "pronombre"], "items": [{"enun": "¡<b>Cuánta<\/b> gente!", "sol": "determinante", "porque": "gente"}, {"enun": "¿<b>Qué<\/b> tapices te gustan?", "sol": "determinante", "porque": "tapices"}, {"enun": "No sé <b>cuántos<\/b> vendrán.", "sol": "pronombre", "porque": "no hay sustantivo detrás, aunque la pregunta sea indirecta"}, {"enun": "¿<b>Quién<\/b> vendrá?", "sol": "pronombre"}, {"enun": "¿<b>Cuáles<\/b> prefieres?", "sol": "pronombre", "porque": "va solo"}, {"enun": "¿<b>Cuántos<\/b> años tienes?", "sol": "determinante", "porque": "años"}], "criterio": "Los seis llevan tilde y la llevan por lo mismo: son partículas interrogativas o exclamativas. De uno a otro cambia si presentan a un sustantivo o están en su lugar; la misma pregunta lo resuelve por cuarta vez este mes.", "apoyo": ["Interrogativos y exclamativos, la casilla que se pregunta"]}, {"tipo": "opcion", "titulo": "¿Bien o mal?", "ayuda": "Ocho frases corrientes con numerales e indefinidos.", "ops": ["bien", "mal"], "items": [{"enun": "No me dio <b>ninguna<\/b> explicación.", "sol": "bien"}, {"enun": "Tiene <b>veintiún<\/b> años.", "sol": "bien", "porque": "masculino: se apocopa"}, {"enun": "Le tocaron <b>veintiún<\/b> décimas.", "sol": "mal", "porque": "<i>décimas<\/i> es femenino: <i>veintiuna décimas<\/i>. La apócope <i>veintiún<\/i> vale con masculinos y con femeninos que empiezan por a tónica (<i>veintiún hachas<\/i>)"}, {"enun": "Llegó en <b>tercer<\/b> lugar.", "sol": "bien", "porque": "<i>tercero<\/i> se apocopa delante de un sustantivo masculino"}, {"enun": "Vinieron <b>veintiuno<\/b> personas.", "sol": "mal", "porque": "con un femenino se usa la forma <i>veintiuna<\/i>: <i>veintiuna personas<\/i>"}, {"enun": "Es el <b>cincuentavo<\/b> aniversario.", "sol": "mal", "porque": "<i>cincuentavo<\/i> es partitivo; el ordinal es <i>quincuagésimo<\/i>"}, {"enun": "Cobra el <b>cuadruple<\/b>.", "sol": "mal", "porque": "le falta la tilde: esdrújula"}, {"enun": "Es la <b>décima<\/b> vez que lo pide.", "sol": "bien"}], "criterio": "Las cuatro que están mal no suenan mal al decirlas, y por eso se escapan al releer. Van a tu lista de fallos del carril A: se corrigen mirándolas, no escuchándolas.", "apoyo": ["Indefinidos", "Numerales"]}, {"tipo": "hueco", "titulo": "El cuadro derivativo, en el formato del examen", "estricto": true, "ayuda": "Cinco filas como las del examen: cada fila da una palabra y pide las otras dos de la misma raíz. La cabecera de este cuadro: <b>sustantivo singular · adjetivo femenino singular · verbo en infinitivo<\/b>. Una falta de ortografía anula la casilla, así que la tilde cuenta.", "items": [{"enun": "cultivar → sustantivo singular: ______", "sol": "cultivo", "corto": false}, {"enun": "cultivar → adjetivo femenino singular: ______", "sol": "cultivada", "corto": false}, {"enun": "vendida → sustantivo singular: ______", "sol": "venta", "corto": false}, {"enun": "vendida → verbo en infinitivo: ______", "sol": "vender", "corto": false}, {"enun": "protección → adjetivo femenino singular: ______", "sol": "protegida|protectora", "corto": false, "porque": "la clave oficial acepta otras respuestas correctas de la misma raíz: <i>protectora<\/i> también vale"}, {"enun": "protección → verbo en infinitivo: ______", "sol": "proteger", "corto": false, "porque": "con <i>g<\/i>: <i>protejer<\/i> anula la casilla"}, {"enun": "formar → sustantivo singular: ______", "sol": "formación", "corto": false, "porque": "con tilde: <i>formacion<\/i> anula la casilla"}, {"enun": "formar → adjetivo femenino singular: ______", "sol": "formada|formativa", "corto": false}, {"enun": "reducida → sustantivo singular: ______", "sol": "reducción", "corto": false}, {"enun": "reducida → verbo en infinitivo: ______", "sol": "reducir", "corto": false}], "criterio": "Las tres columnas salen de la misma raíz y la cabecera fija la forma: el sustantivo en singular, el adjetivo en femenino singular y el verbo en infinitivo. Las respuestas oficiales suelen ser participios usados como adjetivo (<i>cultivada<\/i>, <i>vendida<\/i>, <i>formada<\/i>), y donde el participio no suena la clave acepta otro adjetivo de la raíz (<i>protectora<\/i>). Una casilla con la forma correcta y una letra o una tilde mal —<i>protejida<\/i>, <i>reduccion<\/i>— se anula entera.", "apoyo": "propio", "apoyo_html": "<p><b>El cuadro derivativo.<\/b> Es el ejercicio del bloque 2 que da una palabra por fila y pide las otras dos de la misma raíz; la cabecera de cada columna fija la forma (sustantivo singular o plural, adjetivo masculino o femenino, verbo en infinitivo), y una respuesta correcta en la forma equivocada pierde la casilla. La raíz se mantiene y cambia el final: <i>-ción<\/i>, <i>-dad<\/i>, <i>-miento<\/i> y <i>-eza<\/i> fabrican sustantivos; <i>-ado/-ada<\/i>, <i>-ente<\/i> y <i>-oso<\/i>, adjetivos. La mayoría de los adjetivos que piden las claves son participios usados como adjetivo (<i>producida<\/i>, <i>instalada<\/i>, <i>heredado<\/i>), y donde el participio no suena la clave acepta otro adjetivo de la raíz (<i>protectora<\/i>).<\/p><p>Una falta de ortografía anula la casilla entera: la <i>g<\/i> de <i>proteger<\/i>, la tilde de <i>formación<\/i> y la doble <i>c<\/i> de <i>construcciones<\/i> se cuentan.<\/p>"}, {"tipo": "hueco", "titulo": "Otro cuadro, con la cabecera cambiada", "estricto": true, "ayuda": "Ahora el sustantivo va en <b>plural<\/b> y el adjetivo en <b>masculino singular<\/b>. Lee la cabecera antes de escribir: la cabecera decide la casilla.", "items": [{"enun": "alquilar → sustantivo plural: ______", "sol": "alquileres", "corto": false, "porque": "en plural, como pide la cabecera: <i>alquiler<\/i> pierde la casilla"}, {"enun": "alquilar → adjetivo masculino singular: ______", "sol": "alquilado", "corto": false}, {"enun": "pagado → sustantivo plural: ______", "sol": "pagos|pagas", "corto": false}, {"enun": "pagado → verbo en infinitivo: ______", "sol": "pagar", "corto": false}, {"enun": "transportes → adjetivo masculino singular: ______", "sol": "transportado|transportable", "corto": false}, {"enun": "transportes → verbo en infinitivo: ______", "sol": "transportar", "corto": false}, {"enun": "construir → sustantivo plural: ______", "sol": "construcciones", "corto": false, "porque": "en plural y con doble <i>c<\/i>"}, {"enun": "construir → adjetivo masculino singular: ______", "sol": "construido|constructivo", "corto": false}, {"enun": "conocido → sustantivo plural: ______", "sol": "conocimientos|conocidos", "corto": false}, {"enun": "conocido → verbo en infinitivo: ______", "sol": "conocer", "corto": false}], "criterio": "El cuadro de 2026 pedía el sustantivo en singular y una respuesta en plural —<i>crecimientos<\/i> por <i>crecimiento<\/i>— perdía la casilla; aquí pasa al revés: <i>alquiler<\/i>, <i>pago<\/i> o <i>conocimiento<\/i> en singular la pierden. La raíz es la misma en las tres columnas y la cabecera manda sobre la forma.", "apoyo": "propio", "apoyo_html": "<p><b>El cuadro derivativo.<\/b> Es el ejercicio del bloque 2 que da una palabra por fila y pide las otras dos de la misma raíz; la cabecera de cada columna fija la forma (sustantivo singular o plural, adjetivo masculino o femenino, verbo en infinitivo), y una respuesta correcta en la forma equivocada pierde la casilla. La raíz se mantiene y cambia el final: <i>-ción<\/i>, <i>-dad<\/i>, <i>-miento<\/i> y <i>-eza<\/i> fabrican sustantivos; <i>-ado/-ada<\/i>, <i>-ente<\/i> y <i>-oso<\/i>, adjetivos. La mayoría de los adjetivos que piden las claves son participios usados como adjetivo (<i>producida<\/i>, <i>instalada<\/i>, <i>heredado<\/i>), y donde el participio no suena la clave acepta otro adjetivo de la raíz (<i>protectora<\/i>).<\/p><p>Una falta de ortografía anula la casilla entera: la <i>g<\/i> de <i>proteger<\/i>, la tilde de <i>formación<\/i> y la doble <i>c<\/i> de <i>construcciones<\/i> se cuentan.<\/p>"}], "cuaderno_txt": "Nudo 8 · Las variables nominales: sustantivo, adjetivo, determinantes — apartado 5: Los determinantes (p. 110) · ejercicios 20, 21, 22, 23, 24, 25 y 26"}], "pie": "Ejercicios del CAS Castellà del CFA L'Alzina, curso 2026-27. Las palabras y frases marcadas con un año están tomadas literalmente de las <i>Proves d'accés a CFGS<\/i> de la Generalitat de Catalunya, documentos públicos, y las justificaciones proceden de sus criterios oficiales de corrección. El progreso se guarda en este navegador; «Guardar progreso» descarga un archivo que puedes conservar o entregar.", "revision": "2026-09-23"};</script>
<script>
/* Motor de ejercicios · CAS Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  var LLAVE = 'cas2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo
     mismo y el ejercicio no se puede fallar. Se activa con "estricto": true. */
  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */
      .replace(/\s+/g, ' ').trim();             /* el guion y la coma SÍ deciden */
  }
  /* acepta variantes separadas por | y compara normalizado */
  function coincide(dado, esperado, estricto) {
    var f = estricto ? normT : norm;
    var d = f(dado);
    if (!d) return false;
    return String(esperado).split('|').some(function (v) { return f(v) === d; });
  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------
     Una sola, reutilizada. Se cierra con la cruz, con Escape o pinchando fuera.
     Mientras está abierta, la página de detrás no se desplaza. */
  var ventana = null, disparador = null;
  function creaVentana() {
    var velo = el('div', 'velo');
    velo.hidden = true;
    var caja = el('div', 'ventana');
    caja.setAttribute('role', 'dialog');
    caja.setAttribute('aria-modal', 'true');
    caja.setAttribute('aria-labelledby', 'v-titulo');
    var cab = el('header', 'v-cab');
    var txt = el('div', 'v-txt');
    txt.appendChild(el('div', 'v-k', ''));
    var h = el('h2', null, ''); h.id = 'v-titulo';
    txt.appendChild(h);
    cab.appendChild(txt);
    var x = el('button', 'v-x', ICONO.cruz);
    x.type = 'button';
    x.setAttribute('aria-label', 'Cerrar');
    x.onclick = cierraVentana;
    cab.appendChild(x);
    caja.appendChild(cab);
    caja.appendChild(el('div', 'v-cuerpo'));
    velo.appendChild(caja);
    velo.addEventListener('click', function (ev) { if (ev.target === velo) cierraVentana(); });
    document.addEventListener('keydown', function (ev) {
      if (velo.hidden) return;

      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'CAS Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cas-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
