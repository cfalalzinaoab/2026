<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 8 · 22 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 8, "fecha": "2026-10-22", "tab": "Día 8 · 22 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 8", "h1": "Jueves 22 de octubre", "sub": "Los interrogativos con tilde · responder sin copiar · numerales e indefinidos", "carriles": [{"chapa": "Carril A", "titulo": "La tilde diacrítica (2): los interrogativos", "meta": "30 minutos · con esto queda cerrada la acentuación", "cuaderno": {"nudo": 3, "apartados": [2], "ejercicios": [3, 4, 5, 6, 7]}, "teoria": "<h3>2 · Interrogativos y exclamativos<\/h3>\n<p>Son diacríticos. <em>Qué<\/em>, <em>quién<\/em> y <em>cuál<\/em> son monosílabos; <em>cómo<\/em>, <em>cuándo<\/em>, <em>cuánto<\/em> y <em>dónde<\/em>, llanas acabadas en vocal: por las reglas generales ninguno llevaría tilde. La tilde señala para qué se usa la palabra:<\/p>\n<blockquote>\n<p><strong>qué, quién / quiénes, cuál / cuáles, cómo, cuándo, cuánto / -a / -os / -as, dónde, adónde<\/strong><\/p>\n<\/blockquote>\n<p>Llevan tilde cuando <strong>preguntan o exclaman<\/strong>. Y la llevan <strong>también cuando la pregunta es indirecta<\/strong>, sin signos de interrogación: en esas se olvida la tilde más que en las directas.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pregunta directa<\/td>\n<td>¿<strong>Cómo<\/strong> va a haberlo? · ¡<strong>Cuántos<\/strong> problemas!<\/td>\n<\/tr>\n<tr>\n<td><strong>pregunta indirecta<\/strong><\/td>\n<td>Me pregunto <strong>cuánto<\/strong> tiempo aguantará. · No sé <strong>dónde<\/strong> está. · Quisieron saber <strong>qué<\/strong> hacía allí.<\/td>\n<\/tr>\n<tr>\n<td>relativo o conjunción: <strong>sin tilde<\/strong><\/td>\n<td>La casa <strong>donde<\/strong> vivo. · <strong>Cuando<\/strong> llegues, avisa. · Haz lo <strong>que<\/strong> quieras. · <strong>Como<\/strong> no viniste, me fui.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los cuatro <em>porqués<\/em>:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>forma<\/th>\n<th>qué es<\/th>\n<th>ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>por qué<\/strong><\/td>\n<td>pregunta, directa o indirecta<\/td>\n<td>¿Por qué lo hiciste? · No sé por qué lo hizo.<\/td>\n<\/tr>\n<tr>\n<td><strong>porque<\/strong><\/td>\n<td>conjunción causal (= <em>ya que<\/em>)<\/td>\n<td>No fui porque llovía.<\/td>\n<\/tr>\n<tr>\n<td><strong>el porqué<\/strong><\/td>\n<td>sustantivo (= el motivo); lleva artículo y hace plural<\/td>\n<td>No entiendo el porqué. · Los porqués.<\/td>\n<\/tr>\n<tr>\n<td><strong>por que<\/strong><\/td>\n<td>preposición + <em>que<\/em><\/td>\n<td>Luchamos por que se cumpla la ley. <em>(raro; no ha caído nunca)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Por que<\/em> casi no se usa. Los otros tres sí se usan a diario y se confunden a diario, empezando por los enunciados del bloque 1, que preguntan con <em>por qué<\/em>: en 2026, «Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola?».<\/p>\n<p><strong><em>aún<\/em> / <em>aun<\/em>:<\/strong> si se puede sustituir por <strong>todavía<\/strong>, lleva tilde (<em>Aún no ha llegado<\/em>). Si se puede sustituir por <strong>incluso<\/strong>, no (<em>Aun con ayuda, no llegó<\/em>).<\/p>\n<p><strong><em>solo<\/em>:<\/strong> <strong>sin tilde<\/strong>. La Ortografía de 2010 dejó de recomendarla y la RAE (2023) solo la admite cuando quien escribe aprecia una ambigüedad; sin tilde nunca es falta, y en un examen es la opción segura. Así lo aplican las convocatorias: en 2022 <em>solo<\/em> aparece en el texto sin tilde, y como ítem de sinónimo (= <em>solamente<\/em>), no de acentuación. Si te la enseñaron con tilde, aprendiste la norma anterior a 2010.<\/p>", "ejercicios": [{"tipo": "justificar", "titulo": "Los dos interrogativos", "ayuda": "Los dos proceden de exámenes reales. La respuesta completa lleva <b>dos datos<\/b>: que la tilde es diacrítica, y que la palabra es una partícula interrogativa.", "items": [{"palabra": "<i>cuánto<\/i>", "conv": "2024", "enun": "«Y me pregunto <b>cuánto<\/b> tiempo más podrá mantenerse sin cerrar.»", "requiere": [["diacrítica", "diacrítico"], ["interrogativa", "interrogativo", "pregunta"]], "modelo": "lleva tilde diacrítica porque es una partícula interrogativa en una interrogativa indirecta"}, {"palabra": "<i>Cómo<\/i>", "conv": "2026", "enun": "«No hay relevo generacional. ¿<b>Cómo<\/b> va a haberlo?»", "requiere": [["diacrítica", "diacrítico"], ["interrogativa", "interrogativo", "pregunta"]], "modelo": "es una palabra llana que lleva tilde diacrítica que señala que es una partícula interrogativa, aquí en pregunta directa"}], "criterio": "Uno va entre signos de interrogación y el otro no, y los dos llevan tilde. Escribir solo «es interrogativo» deja la respuesta a medias: falta nombrar la tilde <b>diacrítica<\/b>, porque esa clase explica por qué está puesta.", "apoyo": ["2 · Interrogativos y exclamativos"], "pide": "lleva tilde porque…", "dossier": {"cuaderno": "3", "ejercicio": 3}, "dossier_txt": "Del dossier: nudo 3, ejercicio 3"}, {"tipo": "opcion", "titulo": "Con tilde o sin ella", "dossier": {"cuaderno": "3", "ejercicio": 4, "parte": "la forma"}, "ayuda": "Elige la forma que corresponde en cada oración. Si la palabra pregunta, aunque la oración no lleve signos de interrogación, lleva tilde: convierte la oración en una pregunta directa y comprueba si conserva el sentido.", "estricto": true, "items": [{"enun": "No sé <b>(donde / dónde)<\/b> lo he dejado.", "sol": "dónde", "porque": "interrogativa indirecta: «¿dónde lo he dejado?»", "ops": ["dónde", "donde"]}, {"enun": "¿<b>(Cuando / Cuándo)<\/b> empieza?", "sol": "Cuándo", "porque": "pregunta directa", "ops": ["Cuando", "Cuándo"]}, {"enun": "Pregúntale <b>(que / qué)<\/b> quiere.", "sol": "qué", "porque": "interrogativa indirecta: «¿qué quiere?»", "ops": ["qué", "que"]}, {"enun": "Iremos <b>(donde / dónde)<\/b> tú digas.", "sol": "donde", "porque": "relativo: <i>donde tú digas<\/i> no pregunta nada", "ops": ["donde", "dónde"]}, {"enun": "Avísame <b>(cuando / cuándo)<\/b> llegues.", "sol": "cuando", "porque": "conjunción temporal: sitúa en el tiempo, no pregunta", "ops": ["cuando", "cuándo"]}, {"enun": "Explícame <b>(como / cómo)<\/b> funciona.", "sol": "cómo", "porque": "interrogativa indirecta: «¿cómo funciona?»", "ops": ["cómo", "como"]}, {"enun": "Dime <b>(quien / quién)<\/b> te lo contó.", "sol": "quién", "porque": "interrogativa indirecta: «¿quién te lo contó?»", "ops": ["quien", "quién"]}, {"enun": "No sé <b>(cuanto / cuánto)<\/b> cuesta.", "sol": "cuánto", "porque": "interrogativa indirecta: «¿cuánto cuesta?»", "ops": ["cuanto", "cuánto"]}, {"enun": "¿<b>(Cual / Cuál)<\/b> prefieres?", "sol": "Cuál", "porque": "pregunta directa", "ops": ["Cuál", "Cual"]}, {"enun": "El vecino <b>(que / qué)<\/b> vive arriba se queja del ruido.", "sol": "que", "porque": "relativo: equivale a <i>el cual<\/i>, <i>el vecino el cual vive arriba<\/i>", "ops": ["qué", "que"]}, {"enun": "Dijo <b>(que / qué)<\/b> no venía.", "sol": "que", "porque": "conjunción: introduce el complemento directo del verbo", "ops": ["qué", "que"]}, {"enun": "No entiendo <b>(como / cómo)<\/b> lo aguanta.", "sol": "cómo", "porque": "interrogativa indirecta: «¿cómo lo aguanta?»", "ops": ["cómo", "como"]}, {"enun": "Hazlo <b>(como / cómo)<\/b> puedas.", "sol": "como", "porque": "relativo de modo: <i>de la manera que puedas<\/i>", "ops": ["cómo", "como"]}, {"enun": "Lo hice <b>(como / cómo)<\/b> me dijiste.", "sol": "como", "porque": "relativo de modo: <i>de la manera que me dijiste<\/i>", "ops": ["cómo", "como"]}, {"enun": "Trabajo <b>(cuanto / cuánto)<\/b> puedo.", "sol": "cuanto", "porque": "relativo de cantidad: <i>todo lo que puedo<\/i>", "ops": ["cuánto", "cuanto"]}, {"enun": "Pregunta <b>(adonde / adónde)<\/b> vamos.", "sol": "adónde", "porque": "interrogativa indirecta: «¿adónde vamos?»", "ops": ["adónde", "adonde"]}], "criterio": "Las interrogativas indirectas concentran los fallos, porque no llevan signos de interrogación. Detrás de <i>no sé<\/i>, <i>pregúntale<\/i>, <i>explícame<\/i>, <i>dime<\/i> o <i>no entiendo<\/i> suele haber una pregunta, y la palabra que la introduce lleva tilde.", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 3, ejercicio 4 · la forma"}, {"tipo": "clasificar", "titulo": "¿Pregunta, directa o indirecta, o no pregunta?", "dossier": {"cuaderno": "3", "ejercicio": 4, "parte": "qué es"}, "ayuda": "Las mismas oraciones. Indica si la palabra del paréntesis introduce una pregunta directa, una pregunta indirecta, o si es un relativo o una conjunción, que no preguntan.", "ops": ["interrogativa directa", "interrogativa indirecta", "relativo o conjunción"], "items": [{"enun": "No sé <b>(donde / dónde)<\/b> lo he dejado.", "sol": "interrogativa indirecta", "porque": "interrogativa indirecta: «¿dónde lo he dejado?»"}, {"enun": "Pregúntale <b>(que / qué)<\/b> quiere.", "sol": "interrogativa indirecta", "porque": "interrogativa indirecta: «¿qué quiere?»"}, {"enun": "El vecino <b>(que / qué)<\/b> vive arriba se queja del ruido.", "sol": "relativo o conjunción", "porque": "relativo: equivale a <i>el cual<\/i>, <i>el vecino el cual vive arriba<\/i>"}, {"enun": "Avísame <b>(cuando / cuándo)<\/b> llegues.", "sol": "relativo o conjunción", "porque": "conjunción temporal: sitúa en el tiempo, no pregunta"}, {"enun": "Lo hice <b>(como / cómo)<\/b> me dijiste.", "sol": "relativo o conjunción", "porque": "relativo de modo: <i>de la manera que me dijiste<\/i>"}, {"enun": "No entiendo <b>(como / cómo)<\/b> lo aguanta.", "sol": "interrogativa indirecta", "porque": "interrogativa indirecta: «¿cómo lo aguanta?»"}, {"enun": "Dijo <b>(que / qué)<\/b> no venía.", "sol": "relativo o conjunción", "porque": "conjunción: introduce el complemento directo del verbo"}, {"enun": "Iremos <b>(donde / dónde)<\/b> tú digas.", "sol": "relativo o conjunción", "porque": "relativo: <i>donde tú digas<\/i> no pregunta nada"}, {"enun": "Explícame <b>(como / cómo)<\/b> funciona.", "sol": "in delante"}, {"enun": "Me gustaría saber ______ lo hizo.", "sol": "por qué", "corto": false, "porque": "pregunta indirecta"}, {"enun": "Luchan ______ se apruebe la ley.", "sol": "por que|porque", "corto": false, "porque": "preposición <i>por<\/i> + conjunción <i>que<\/i>; la clave del dossier admite también <i>porque<\/i> en un registro corriente, y la forma cuidada es la separada"}], "criterio": "El sustantivo <i>porqué<\/i> se reconoce por el artículo: si admite <i>el<\/i> delante, va junto y con tilde. <i>Por que<\/i> es raro y no ha caído nunca; está aquí para que no te sorprenda si lo encuentras escrito.", "apoyo": ["2 · Interrogativos y exclamativos"], "dossier": {"cuaderno": "3", "ejercicio": 5}, "dossier_txt": "Del dossier: nudo 3, ejercicio 5"}, {"tipo": "hueco", "titulo": "Aún o aun", "estricto": true, "ayuda": "Sustituye la palabra por <i>todavía<\/i> o por <i>incluso<\/i> y comprueba cuál encaja.", "items": [{"enun": "______ no ha contestado.", "sol": "Aún|aún", "porque": "= todavía"}, {"enun": "______ sabiéndolo, no dijo nada.", "sol": "Aun|aun", "porque": "= incluso"}, {"enun": "Es ______ peor de lo que parecía.", "sol": "aún", "porque": "= todavía"}, {"enun": "______ con dos trabajos, no llega a fin de mes.", "sol": "Aun|aun", "porque": "= incluso"}], "criterio": "Los dos que llevan <i>incluso<\/i> abren una concesión: expresan que algo pasa <b>a pesar de<\/b> lo que viene detrás. La redacción del bloque 3 pide ese mismo giro.", "apoyo": ["2 · Interrogativos y exclamativos"], "dossier": {"cuaderno": "3", "ejercicio": 6}, "dossier_txt": "Del dossier: nudo 3, ejercicio 6"}, {"tipo": "justificar", "titulo": "Simulacro del ejercicio 2.2", "dossier": {"cuaderno": "3", "ejercicio": 7}, "ayuda": "Cinco palabras de exámenes reales, una de cada familia: hiato, llana, aguda, esdrújula y diacrítica. Escribe la justificación entera, como en la prueba.", "items": [{"palabra": "<i>mayoría<\/i>", "conv": "2019", "requiere": [["hiato", "diptongo"]], "modelo": "lleva tilde para marcar la ruptura del diptongo o la presencia de un hiato"}, {"palabra": "<i>fácil<\/i>", "conv": "2019", "requiere": [["llana", "grave"], ["consonante", "en l"]], "modelo": "lleva tilde porque es una palabra llana acabada en una consonante que no es -n ni -s"}, {"palabra": "<i>celebración<\/i>", "conv": "2020", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "es una palabra aguda que lleva tilde porque acaba en vocal más -n"}, {"palabra": "<i>democrático<\/i>", "conv": "2022", "requiere": [["esdrujula"], ["todas", "siempre"]], "modelo": "es una palabra esdrújula y, en castellano, todas las esdrújulas llevan tilde"}, {"palabra": "<i>sé<\/i>", "conv": "2023", "requiere": [["diacritica", "diacritico"], ["saber", "verbo"]], "modelo": "lleva tilde diacrítica que indica que es la primera persona del singular del presente de indicativo del verbo <i>saber<\/i>", "enun": "«Ya <b>sé<\/b> que estoy haciendo una generalización grosera»"}], "criterio": "Los modelos son las respuestas de las claves oficiales. Cada una nombra la clase de la palabra y la condición que decide la tilde; la de <i>sé<\/i> nombra además la forma verbal, porque la tilde diacrítica existe para distinguirla del pronombre <i>se<\/i>.", "pide": "lleva tilde porque…", "apoyo": "todo", "dossier_txt": "Del dossier: nudo 3, ejercicio 7"}], "cuaderno_txt": "Nudo 3 · La tilde diacrítica — apartado 2: Interrogativos y exclamativos (p. 22) · ejercicios 3, 4, 5, 6 y 7", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "Responder sin copiar", "meta": "25 minutos · los quince criterios, sobre un texto", "cuaderno": {"nudo": 17, "apartados": [2], "ejercicios": [5, 6]}, "lectura": {"titulo": "Dos años de esquemas", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["La panadería de Amalia Ruiz lleva veintidós meses detrás de una valla.", "Las obras del carril bus empezaron en marzo del año pasado y todavía", "no han llegado a su esquina. Para entrar hay que rodear dos manzanas o", "cruzar por una pasarela de tablones que se moja cuando llueve. Amalia", "dice que ha perdido a la mitad de los clientes de por la mañana.", "", "El ayuntamiento anunció ocho meses de trabajos. Va por veintidós, y en", "el barrio ya nadie pregunta cuándo acaban. Hay cuatro locales cerrados", "en esa acera; tres abrieron antes de que empezaran las obras. Amalia", "guarda los recortes de prensa en una carpeta detrás del mostrador.", "", "Lo que más le molesta no es el retraso, que da por descontado. Es que", "nadie le avise. Se entera de los cortes cuando ve llegar la máquina, y", "una vez estuvo tres días sin poder recibir la harina porque habían", "levantado el asfalto delante de la puerta sin decir nada.", "", "Hay ayudas para los comercios afectados. Son de mil quinientos euros y", "se piden por internet, con certificado digital. Amalia lo intentó dos", "veces, no pasó de la primera pantalla y acabó dejándolo. Dice que la", "ayuda existe para quien sabe pedirla.", "", "Y esa es la parte que se repite en cada obra de cada barrio. El dinero", "está previsto, el plazo está publicado y la compensación está escrita.", "Lo que no está previsto es que alguien llame a la puerta de la", "panadería para contarlo."], "pie": "Texto inventado. Ni Amalia Ruiz ni las cifras que da son reales."}, "teoria": "<h3>2 · Responder sin copiar<\/h3>\n<p>Las preguntas abiertas se corrigen con tres bandas oficiales, siempre las mismas:<\/p>\n<blockquote>\n<p>Respuesta clara y completa → <strong>todos los puntos<\/strong>\nRespuesta válida, pero con alguna imprecisión o falta de claridad → <strong>la banda intermedia<\/strong>: 0,5 en una pregunta de 0,75; 0,25 en una de 0,5\nRespuesta claramente deficiente → <strong>0<\/strong><\/p>\n<\/blockquote>\n<p>Y un cuarto dato de la clave: <em>«pueden otorgarse puntuaciones intermedias»<\/em>. No hay tres notas: hay una escala. Los criterios que siguen hacen bajar por ella.<\/p>\n<p><strong>Los quince criterios<\/strong>, destilados de las claves oficiales de las dieciséis convocatorias:<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\"><\/th>\n<th>criterio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td><strong>Contestar a menos de lo que pide.<\/strong> Si el enunciado pide dos datos («explique X <strong>y<\/strong> exponga Y») y solo se contesta una, la respuesta cae a la banda intermedia o más abajo<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td><strong>Contestar a más.<\/strong> Añadir lo que no se pregunta no suma: resta claridad<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td><strong>Copiar literalmente<\/strong> el fragmento donde está la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td><strong>Responder con una palabra suelta<\/strong> o con una lista. Se pide una respuesta redactada<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td><strong>Contestar de memoria<\/strong>, con lo que uno sabe en vez de con lo que expone el texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td><strong>Atribuir al texto lo que no dice.<\/strong> La clave lo llama «malinterpretar» y es la única que va directa al 0<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td><strong>No indicar según quién.<\/strong> Si el enunciado indica «según Trenado», la respuesta va atribuida; si no lo indica, se atribuye al autor o a la autora del texto<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td><strong>Confundir el ejemplo con la idea.<\/strong> El texto pone ejemplos; la pregunta no los pide<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td><strong>No dar el número que se pide.<\/strong> «Qué <strong>dos<\/strong> factores» son dos, separados<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td><strong>Escribir una respuesta que no se entiende sin el texto delante<\/strong> («eso pasa porque él lo dice»): la respuesta tiene que sostenerse sola<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td><strong>Dejar pronombres sin antecedente<\/strong> dentro de la respuesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td><strong>Meter opinión propia.<\/strong> No se pregunta qué opinas: eso es el bloque 3<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td><strong>Usar metadiscurso vacío<\/strong>: «el autor nos habla de…». Ocupa palabras y no contesta<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td><strong>Desproporcionar la extensión.<\/strong> A 0,5 puntos no le corresponde media página; a 1,25, tampoco dos líneas<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td><strong>Las faltas cuentan aquí también<\/strong>: −0,10 por error, hasta −2 en los bloques 1 y 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cómo no copiar, en tres pasos.<\/strong> El criterio 3 se falla más que los otros catorce.<\/p>\n<table>\n<thead>\n<tr>\n<th>paso<\/th>\n<th>sobre el texto de 2026<\/th>\n<th>sobre otra columna de prensa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sustituir la palabra<\/strong><\/td>\n<td>«una inversión inicial desorbitada» → <em>un dinero inicial muy alto<\/em><\/td>\n<td>«una pasarela de tablones» → <em>un paso de madera<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Sustituir el verbo y con él la construcción<\/strong><\/td>\n<td>«los precios se han disparado» → <em>el precio ha subido muchísimo<\/em><\/td>\n<td>«ha perdido a la mitad de los clientes» → <em>su clientela se ha reducido a la mitad<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>Resumir la cita en tus términos<\/strong><\/td>\n<td>«No hay relevo generacional. ¿Cómo va a haberlo?» → <em>el agricultor sostiene que nadie coge el testigo<\/em><\/td>\n<td>«no pasó de la primera pantalla» → <em>no consiguió completar la solicitud<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Los nombres propios y los términos sin sinónimo se pueden repetir:<\/strong> <em>Trenado<\/em>, <em>Azuaga<\/em>, <em>pistacho<\/em>, <em>cubiertas vegetales<\/em>. El criterio 3 descuenta la copia de fragmentos, y la medida de clase para comprobarla es la misma que en el resumen del apartado 3: ninguna cadena de tres o más palabras seguidas del original, salvo esos nombres y términos.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "La pregunta 1.1 de 2026", "dossier": {"cuaderno": "17", "ejercicio": 5}, "ayuda": "Contesta la pregunta oficial, que valía 0,75 puntos. El texto de 2026 se abre con el icono «texto»; la lectura de arriba es para la práctica que solo está en la web.", "items": [{"enun": "«Según Trenado, ¿por qué no hay relevo generacional en el sector agrícola? ¿Cómo se ejemplifica ese problema a través de su propia trayectoria profesional?»", "conv": "2026", "modelo": "<i>Trenado sostiene que nadie toma el relevo porque montar una explotación desde cero exige una cantidad de dinero enorme para acabar cobrando el sueldo mínimo. Por eso casi todos los que entran lo hacen sobre tierras familiares. Él mismo es el ejemplo: estudió Biología, no se dedicaba al campo, y en 2017 se puso a trabajar las tierras de su familia; desde entonces se ha formado y ha buscado formas nuevas de sacarles rendimiento.<\/i>"}], "criterio": "Que estén las dos partes, la razón y el ejemplo de su trayectoria (criterio 1), y que la segunda mencione que las tierras son heredadas o familiares: sin ese dato, el ejemplo no explica por qué él sí pudo empezar. La clave oficial expone lo mismo que el modelo con otras palabras.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 1, "seccion": "El texto de la convocatoria de 2026"}, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 17, ejercicio 5", "texto_titulo": "El texto de la convocatoria de 2026", "texto_html": "<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>"}, {"tipo": "clasificar", "titulo": "¿Qué criterio falla cada respuesta?", "dossier": {"cuaderno": "17", "ejercicio": 6}, "ayuda": "Cuatro respuestas a la pregunta 1.1 de 2026, la del ejercicio anterior. Cada una falla por un criterio distinto de la tabla de los quince; si falla por dos, vale cualquiera de los dos.", "ops": ["1 · contesta a menos", "3 · copia literal", "5 · contesta de memoria", "6 · atribuye al texto lo que no afirma", "13 · metadiscurso vacío"], "items": [{"enun": "«Porque necesitas una inversión inicial desorbitada para ganar el salario mínimo.»", "sol": "3 · copia literal|1 · contesta a menos", "porque": "copia literal, y además solo contesta a la primera mitad de la pregunta"}, {"enun": "«El autor nos habla de un tema muy interesante que es el campo y sus problemas.»", "sol": "13 · metadiscurso vacío|5 · contesta de memoria", "porque": "metadiscurso: ocupa una línea y no da ningún dato del texto"}, {"enun": "«Porque a los jóvenes hoy en día no les gusta trabajar, prefieren estar con el móvil.»", "sol": "5 · contesta de memoria|6 · atribuye al texto lo que no afirma", "porque": "contesta con un tópico y le atribuye al texto algo que no afirma: va directa al 0"}, {"enun": "«Porque hace falta mucho dinero para empezar.»", "sol": "1 · contesta a menos", "porque": "no es falsa, pero se queda a la mitad: falta el sueldo mínimo y falta la segunda pregunta. Banda intermedia"}], "criterio": "Las dos respuestas que hablan del dinero nombran la causa que da el texto: «Porque necesitas una inversión…» la copia palabra por palabra, y «Porque hace falta mucho dinero…» se queda sin el sueldo mínimo y sin la segunda pregunta. Las otras dos no contestan con nada que esté en el texto.", "usa_texto": false, "texto_dossier": {"nudo": 17, "apartado": 1, "seccion": "El texto de la convocatoria de 2026"}, "apoyo": "todo", "dossier_txt": "Del dossier: nudo 17, ejercicio 6", "texto_titulo": "El texto de la convocatoria de 2026", "texto_html": "<p>Los ejercicios de este nudo trabajan sobre este texto, el de la convocatoria de 2026, serie 1, reproducido tal como salió en el examen y con la numeración de líneas de cinco en cinco, porque los enunciados oficiales se refieren a ella. Es el mismo texto del anexo A-3.<\/p>\n<div class=\"textoexamen\"><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Muy claro lo debía tener este joven extremeño cuando, bien entrado el siglo XXI, decidió<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">convertirse en agricultor. Por supuesto, el biólogo Daniel Trenado conocía la historia de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">campos familiares en su pueblo (Azuaga, Badajoz). Pero él apenas los había pisado más que de<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">forma puntual hasta el día de 2017 en que se plantó allí<\/span><\/div><div class=\"ln\"><span class=\"n\">5<\/span><span class=\"t\">para dedicarse a una profesión de la que conocía muy poco. Lo que ocurre es que, como<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">aprende rápido, no solo ha conseguido ganarse razonablemente bien la vida con ello, sino<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que por el camino se ha convertido en una especie de influencer agrícola que explica en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">redes sociales los entresijos de un sector que sobrevive a duras penas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«Suelo escribir cuando algo me cabrea», explica este agricultor de 33 años en<\/span><\/div><div class=\"ln\"><span class=\"n\">10<\/span><span class=\"t\">el Cortijo el Mayoral, entre árboles de pistachos y olivos, su principal sustento, que<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">completa con algo de cereal. Así fue como empezó a ganar popularidad en enero de 2020, tras<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">unas protestas agrícolas en las que los antidisturbios repartieron palos. En un hilo de X,<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Trenado explicaba que el sector lleva años ahogado, entre otras cosas, por los vaivenes de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">precios, con unos márgenes tan estrechos que las más de las<\/span><\/div><div class=\"ln\"><span class=\"n\">15<\/span><span class=\"t\">veces lo único que hace que las cuentas salgan en positivo es la subvención. Sin contar<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">la competencia internacional de productos que no tienen que cumplir las mismas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">exigencias de seguridad, por ejemplo, en cuanto al uso de pesticidas.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">«No hay relevo generacional. ¿Cómo va a haberlo? Si necesitas una inversión inicial<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">desorbitada para ganar el salario mínimo». Así, la mayoría de los que se atreven<\/span><\/div><div class=\"ln\"><span class=\"n\">20<\/span><span class=\"t\">a recoger el testigo es porque no parten de cero, sino que mantienen o resucitan campos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">familiares. Es el caso de Trenado, que además se ha movido, se ha formado y ha innovado.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Plantó los olivos que producen el aceite que hoy vende íntegramente a través de la web y<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">también los árboles de pistacho que en este pasado mes de enero lucían desnudos tras la poda.<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Un tratamiento clave y delicadísimo para que los árboles<\/span><\/div><div class=\"ln\"><span class=\"n\">25<\/span><span class=\"t\">den buenas cantidades de este rentable fruto seco. Lidera un equipo especializado en<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">poda que ofrece sus servicios, principalmente, a los compañeros de la cooperativa. Los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">pistachos que cultivan los socios y luego pasan por su planta de procesado se están<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">vendiendo fuera de España. Los de este año irán al centro y norte de Europa.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">Se trata, explica Trenado, de eliminar en lo posible los intermediarios para<\/span><\/div><div class=\"ln\"><span class=\"n\">30<\/span><span class=\"t\">mejorar las cuentas. Pero estar en manos de intermediarios es solo uno de los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">problemas del campo. Están los imponderables de toda la vida, que ahora resultan todavía más<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">impredecibles. Por ejemplo, Trenado explicaba en X cómo la falta de lluvias y los calores a<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">destiempo de los dos últimos años han reducido de tal manera la producción de aceite de oliva<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">que los precios se han disparado; y esto no es bueno, ya<\/span><\/div><div class=\"ln\"><span class=\"n\">35<\/span><span class=\"t\">que, a estos precios, hay mercados que se pierden.<\/span><\/div><div class=\"ln blanca\"><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">En ese contexto, él procura ir poco a poco. Con objetivos modestos y graduales, invirtiendo<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">en tecnologías que realmente se van a notar en la producción y manteniendo aquellas que, sin<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">más, cumplen su función. Un ejemplo: sigue utilizando un tractor heredado, pero le ha<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">instalado un aparato de control remoto con GPS para que ande<\/span><\/div><div class=\"ln\"><span class=\"n\">40<\/span><span class=\"t\">solo. Así, mientras utiliza las redes sociales para defender su sustento frente a los<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tópicos manidos y vender una parte de su producción, Trenado defiende también métodos<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">tradicionales como el uso de cubiertas vegetales, dejando crecer especies autóctonas<\/span><\/div><div class=\"ln\"><span class=\"n\"><\/span><span class=\"t\">entre sus árboles de pistachos y sus olivos para proteger el suelo de la erosión.<\/span><\/div><div class=\"ln blanca\"><\/div><\/div>\n<p><em>Adaptación del texto de UNIÓN, J. A., «Un influencer agrícola para revitalizar el campo», El País Semanal, 6 de marzo de 2024. La adaptación y la numeración de líneas son las de la Prova d'accés a CFGS, convocatòria 2026, serie 1.<\/em><\/p>"}, {"tipo": "clasificar", "titulo": "¿Qué criterio se salta?", "ayuda": "Cinco respuestas de alumno a preguntas sobre el texto de arriba. Ninguna es falsa, y a todas les falta algo.", "ops": ["contesta a menos", "copia literal", "no indica según quién", "mete opinión", "metadiscurso vacío"], "items": [{"enun": "<i>Se entera de los cortes cuando ve llegar la máquina.<\/i>", "sol": "copia literal", "porque": "ocho palabras seguidas del original"}, {"enun": "Pregunta: «según Amalia, ¿qué le molesta más?». Respuesta: <i>Que nadie le avise de los cortes.<\/i>", "sol": "no indica según quién", "porque": "es verdad y está bien escrito, pero el enunciado pedía «según Amalia» y la respuesta lo presenta como un hecho"}, {"enun": "<i>Es indignante que tengan a una mujer dos años detrás de una valla.<\/i>", "sol": "mete opinión", "porque": "la pregunta pide lo que afirma el texto, no lo que le parece a quien contesta"}, {"enun": "Pregunta: «explique el problema de las ayudas <b>y<\/b> por qué no las cobró». Respuesta: <i>Las ayudas son de mil quinientos euros.<\/i>", "sol": "contesta a menos", "porque": "el enunciado pedía dos datos"}, {"enun": "<i>En este texto el autor nos habla de un tema muy actual que afecta a los comercios.<\/i>", "sol": "metadiscurso vacío"}], "criterio": "Ninguna de las cinco afirma nada falso sobre el texto. La diferencia no está en haber entendido el texto, sino en haber contestado lo que se preguntaba y como se preguntaba.", "apoyo": ["2 · Responder sin copiar"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza lo copiado", "ayuda": "Esta respuesta a «¿por qué Amalia no llegó a cobrar la ayuda?» tiene <b>seis palabras seguidas<\/b> copiadas del texto. <b>Pincha en ellas.<\/b>", "items": [{"texto": "Amalia intentó pedirla, pero no pasó de la primera pantalla y acabó abandonando el trámite.", "faltas": {"no": "copiado del texto", "pasó": "copiado del texto", "de": "copiado del texto", "la": "copiado del texto", "primera": "copiado del texto", "pantalla": "copiado del texto"}}], "criterio": "De «no» a «pantalla» son seis palabras del original tal cual. Y atiende a lo que <b>sí<\/b> se puede repetir: <i>Amalia<\/i> y <i>trámite<\/i> no cuentan como copia.<br><br>Arreglado: «probó dos veces y se atascó en la primera de las pantallas, así que lo dejó».", "apoyo": ["2 · Responder sin copiar"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Vale esta reescritura?", "ayuda": "El original: «ha perdido a la mitad de los clientes de por la mañana». Decide sobre cada versión.", "ops": ["vale", "es copia"], "items": [{"enun": "<i>Se le han ido la mitad de los clientes de la mañana.<\/i>", "sol": "es copia", "porque": "«la mitad de los clientes de» son seis palabras seguidas del original: se ha cambiado el verbo y se ha copiado el resto"}, {"enun": "<i>Atiende a la mitad de gente que antes por las mañanas.<\/i>", "sol": "vale"}, {"enun": "<i>Su clientela de primera hora se ha reducido a la mitad.<\/i>", "sol": "vale"}, {"enun": "<i>Por las mañanas entra la mitad de gente que antes.<\/i>", "sol": "vale"}, {"enun": "<i>Ha perdido a la mitad de los clientes.<\/i>", "sol": "es copia"}, {"enun": "<i>Perdió a la mitad de los clientes de por la mañana.<\/i>", "sol": "es copia", "porque": "cambia el verbo y deja nueve palabras seguidas del original"}], "criterio": "La medida de clase no cambia: <b>ninguna cadena de tres o más palabras seguidas del original<\/b>, salvo nombres y términos sin sinónimo. Las versiones que cambian el verbo y copian el resto repiten el error más frecuente: se cambia la primera palabra y se sigue copiando lo demás.", "apoyo": ["2 · Responder sin copiar"], "solo_web": true}, {"tipo": "abierta", "titulo": "Contesta con el texto delante", "ayuda": "Una pregunta con «y»: pide dos datos. Cuatro o cinco líneas, redactadas, atribuidas y sin copiar. Cuatro minutos y medio.", "items": [{"enun": "«Según Amalia, ¿qué lleva peor de las obras <b>y<\/b> cómo lo ilustra con el episodio de la harina?»", "modelo": "Dos modelos abajo: uno contesta a las dos partes y el otro se queda en una."}], "modelos": ["<b>Completo.<\/b> Según ella, lo que peor lleva no es que las obras se alarguen, retraso que ya da por hecho, sino que nadie le comunique nada: se entera de los cortes cuando aparece la maquinaria. El episodio de la harina lo ilustra: estuvo tres días sin poder recibir el género porque habían levantado el asfalto delante de su puerta sin avisarla.", "<b>Media respuesta.<\/b> Lo que peor lleva es que no le avisan de nada. <i>(Contesta a la primera mitad y deja fuera el ejemplo, que el enunciado pedía con una «y». En 2026 la banda intermedia de esta pregunta es 0,5: una respuesta a la que le falta una de las dos partes cae ahí o más abajo.)<\/i>"], "criterio": "Tres condiciones. <b>Una:<\/b> las <b>dos<\/b> partes que pide la «y». <b>Dos:<\/b> atribuido —«según ella»—, no como opinión tuya. <b>Tres:<\/b> sin fragmentos copiados —la medida de clase, ninguna cadena de tres palabras—: el modelo escribe «cuando aparece la maquinaria» donde el texto trae «cuando ve llegar la máquina».", "apoyo": ["2 · Responder sin copiar"], "solo_web": true}], "cuaderno_txt": "Nudo 17 · Leer y sintetizar — apartado 2: Responder sin copiar (p. 44) · ejercicios 5 y 6", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "Los determinantes (2): indefinidos, numerales e interrogativos", "meta": "30 minutos · la apócope, los numerales y los interrogativos", "cuaderno": {"nudo": 8, "apartados": [5], "ejercicios": [20, 21, 22, 23, 24, 25, 26]}, "teoria": "<h3>5 · Los determinantes<\/h3>\n<p><strong>Qué es un determinante.<\/strong> Una palabra que va <strong>con<\/strong> el sustantivo, lo presenta y le marca el género y el número. No puede ir sola: si le quitas el sustantivo, la frase queda incompleta o la palabra cambia de clase.<\/p>\n<p><strong>El artículo.<\/strong><\/p>\n<ul>\n<li>Determinado: <em>el, la, los, las<\/em> — hablamos de algo ya conocido.<\/li>\n<li>Indeterminado: <em>un, una, unos, unas<\/em> — algo que aparece por primera vez.<\/li>\n<li>Neutro: <em>lo<\/em> — solo delante de adjetivos, y los vuelve abstractos: <em>lo importante<\/em>, <em>lo preocupante<\/em>. <strong>No existe <em>lo<\/em> delante de un sustantivo<\/strong>: nunca <em>lo problema<\/em>.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Este <em>lo<\/em> no es el <em>lo<\/em> pronombre.<\/strong> <em>Lo importante<\/em> lleva un adjetivo detrás y forma un grupo que funciona como sustantivo: es el artículo neutro. <em>Lo vendió<\/em> lleva un verbo, y <em>lo<\/em> ocupa el lugar del complemento directo (<em>vendió el tractor<\/em>): es el pronombre. La prueba: el pronombre <em>lo<\/em> se puede sustituir por <em>eso<\/em> o por un sustantivo (<em>vendió eso<\/em>); el artículo <em>lo<\/em>, no.<\/p>\n<\/blockquote>\n<p><strong>Los demostrativos.<\/strong> Marcan distancia: <em>este/esta/estos/estas<\/em> (aquí) · <em>ese/esa/esos/esas<\/em> (ahí) · <em>aquel/aquella/aquellos/aquellas<\/em> (allí). Si van detrás del sustantivo, exigen artículo delante: <em>el cuaderno aquel<\/em>.<\/p>\n<p><strong>Los posesivos.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>forma corta<\/strong> <em>(delante del sustantivo)<\/em><\/th>\n<th><strong>forma plena<\/strong> <em>(detrás, o ella sola)<\/em><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.ª · un poseedor<\/td>\n<td>mi, mis<\/td>\n<td>mío, mía, míos, mías<\/td>\n<\/tr>\n<tr>\n<td>2.ª · un poseedor<\/td>\n<td>tu, tus<\/td>\n<td>tuyo, tuya, tuyos, tuyas<\/td>\n<\/tr>\n<tr>\n<td>3.ª · un poseedor<\/td>\n<td>su, sus<\/td>\n<td>suyo, suya, suyos, suyas<\/td>\n<\/tr>\n<tr>\n<td>1.ª · varios poseedores<\/td>\n<td>nuestro, nuestra, nuestros, nuestras<\/td>\n<td><em>(la misma)<\/em><\/td>\n<\/tr>\n<tr>\n<td>2.ª · varios poseedores<\/td>\n<td>vuestro, vuestra, vuestros, vuestras<\/td>\n<td><em>(la misma)<\/em><\/td>\n<\/tr>\n<tr>\n<td>3.ª · varios poseedores<\/td>\n<td>su, sus<\/td>\n<td>suyo, suya, suyos, suyas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>La forma corta va siempre delante y siempre con sustantivo: es <strong>determinante<\/strong>. La forma plena va detrás del sustantivo (<em>un amigo<\/em> <strong>mío<\/strong>) y ahí funciona como <strong>adjetivo<\/strong>; o va sola (<em>ese tractor no es<\/em> <strong>mío<\/strong>, <em>es<\/em> <strong>suyo<\/strong>; <em>el<\/em> <strong>mío<\/strong> <em>está en el taller<\/em>) y entonces funciona como <strong>pronombre<\/strong>. Así se enseña en secundaria y así se contesta en el examen. La NGLE (cap. 18) clasifica <em>mío<\/em>, <em>tuyo<\/em> y <em>suyo<\/em> como adjetivos en cualquier posición, y analiza <em>el mío<\/em> como un grupo nominal con el sustantivo sobrentendido (<em>el [tractor] mío<\/em>).<\/p>\n<p><strong>Tres pares de este apartado caen en el ejercicio de la tilde:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>sin tilde<\/th>\n<th>con tilde<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>mi<\/strong> — determinante posesivo (<em>mi casa<\/em>)<\/td>\n<td><strong>mí<\/strong> — pronombre personal (<em>a mí<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>tu<\/strong> — determinante posesivo (<em>tu casa<\/em>)<\/td>\n<td><strong>tú<\/strong> — pronombre personal (<em>tú vienes<\/em>)<\/td>\n<\/tr>\n<tr>\n<td><strong>el<\/strong> — artículo, determinante (<em>el coche<\/em>)<\/td>\n<td><strong>él<\/strong> — pronombre personal (<em>él vino<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>La prueba, una sola pregunta:<\/strong> ¿hay un sustantivo detrás? Sí → determinante, sin tilde. No → pronombre, con tilde.<\/p>\n<p><strong>Indefinidos.<\/strong> Expresan cantidad, pero <strong>imprecisa<\/strong>: <em>algún, ningún, mucho, poco, bastante, todo, otro, varios, cualquier, demasiado<\/em>. Formas apocopadas (pierden la sílaba final) <strong>delante<\/strong> del sustantivo: <em>algún día<\/em>, <em>ningún fruto<\/em>, <em>cualquier razón<\/em>. Formas plenas <strong>detrás<\/strong>: <em>un día cualquiera<\/em>, <em>razón ninguna<\/em>.<\/p>\n<p><strong>Numerales.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>qué expresa<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cardinales<\/strong><\/td>\n<td>cantidad exacta<\/td>\n<td>uno, dos, veintiún, cien<\/td>\n<\/tr>\n<tr>\n<td><strong>ordinales<\/strong><\/td>\n<td>lugar en una serie<\/td>\n<td>primer, segundo, décimo, vigésimo<\/td>\n<\/tr>\n<tr>\n<td><strong>partitivos<\/strong><\/td>\n<td>una parte<\/td>\n<td>medio, tercio, quinceava parte<\/td>\n<\/tr>\n<tr>\n<td><strong>multiplicativos<\/strong><\/td>\n<td>una multiplicación<\/td>\n<td>doble, triple, cuádruple<\/td>\n<\/tr>\n<tr>\n<td><strong>distributivos<\/strong><\/td>\n<td>reparto<\/td>\n<td>cada, sendos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cuatro normas que se preguntan poco y se fallan mucho:<\/p>\n<ul>\n<li><strong><em>Uno<\/em> delante de un sustantivo masculino se apocopa<\/strong>: <em>un lápiz<\/em>, <em>veintiún lápices<\/em>. Con femenino, <em>veintiuna personas<\/em>; solo si empieza por <em>a<\/em> tónica se admite también <em>veintiún hachas<\/em>.<\/li>\n<li><strong><em>Cien<\/em><\/strong> delante de sustantivo (<em>cien años<\/em>), <strong><em>ciento<\/em><\/strong> en los porcentajes (<em>el diez por ciento<\/em>); para el total valen las tres formas, <em>cien por cien<\/em>, <em>cien por ciento<\/em> y <em>ciento por ciento<\/em>.<\/li>\n<li><strong>Los multiplicativos largos son esdrújulos y llevan tilde<\/strong>: <em>cuádruple<\/em>, <em>séxtuple<\/em>. <em>Doble<\/em> y <em>triple<\/em> son llanas y no la llevan.<\/li>\n<li>Los ordinales altos no se forman con el cardinal: el de 50 es <strong>quincuagésimo<\/strong>; el de 40, <strong>cuadragésimo<\/strong>.<\/li>\n<\/ul>\n<p><strong>Interrogativos y exclamativos.<\/strong> Son <em>qué, cuál/cuáles, cuánto/a/os/as, quién/quiénes<\/em>. <strong>Todos llevan tilde diacrítica<\/strong>, vayan entre signos o no.<\/p>\n<ul>\n<li>Como <strong>determinante<\/strong>, si llevan sustantivo detrás: <em>¿<\/em><em>Qué<\/em><em> tapices te gustan?<\/em> · <em>¿<\/em><em>Cuántos<\/em><em> años tienes?<\/em><\/li>\n<li>Como <strong>pronombre<\/strong>, si van solos: <em>¿<\/em><em>Cuáles<\/em><em> prefieres?<\/em> · <em>¿<\/em><em>Quién<\/em><em> vendrá?<\/em> (<em>quién<\/em> funciona solo como pronombre; <em>cuál<\/em> va delante de un sustantivo sobre todo en América —<em>¿cuál libro?<\/em>—, y en España se prefiere <em>qué<\/em>)<\/li>\n<\/ul>\n<p>La misma prueba que con los posesivos: <strong>¿hay un sustantivo detrás?<\/strong><\/p>\n<blockquote>\n<p><strong>Corrección:<\/strong> <strong><em>cuándo<\/em>, <em>cómo<\/em> y <em>dónde<\/em> son adverbios<\/strong>, no determinantes ni pronombres. Llevan tilde igual, pero si en la prueba te preguntan la clase, la respuesta es <em>adverbio<\/em>. Las claves oficiales de 2024 y 2026 evitan la clasificación con la fórmula <strong>«partícula interrogativa»<\/strong>: si dudas, esa es la fórmula segura.<\/p>\n<\/blockquote>\n<p><strong>La tilde no depende de los signos, depende del sentido.<\/strong> También la llevan en preguntas indirectas:<\/p>\n<blockquote>\n<p>«Y me pregunto <strong>cuánto<\/strong> tiempo más podrá mantenerse sin cerrar» (2024).\n«Es fácil imaginar la ilusión con la que se metió en este proyecto, <strong>cómo<\/strong> reunió el dinero» (2024).<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué clase de determinante?", "dossier": {"cuaderno": "8", "ejercicio": 20}, "ayuda": "Clasifica el determinante en negrita. Si es numeral, indica también de qué tipo.", "ops": ["artículo", "demostrativo", "posesivo", "indefinido", "numeral cardinal", "numeral ordinal", "numeral partitivo", "numeral distributivo", "interrogativo o exclamativo"], "items": [{"enun": "«<b>su<\/b> planta de procesado»", "conv": "2026", "sol": "posesivo"}, {"enun": "«<b>esa<\/b> calidad»", "conv": "2021", "sol": "demostrativo"}, {"enun": "«<b>los<\/b> intermediarios»", "conv": "2026", "sol": "artículo"}, {"enun": "«<b>esos<\/b> carniceros de safaris»", "conv": "2020", "sol": "demostrativo"}, {"enun": "«<b>mi<\/b> casa»", "conv": "2024", "sol": "posesivo"}, {"enun": "<b>algunos<\/b> años", "sol": "indefinido"}, {"enun": "<b>tres<\/b> olivos", "sol": "numeral cardinal"}, {"enun": "¿<b>qué<\/b> tapices?", "sol": "interrogativo o exclamativo", "porque": "interrogativo: pregunta"}, {"enun": "<b>cada<\/b> socio", "sol": "numeral distributivo|indefinido", "porque": "la clave del dossier lo da como numeral distributivo; la gramática académica lo cuenta entre los indefinidos, y también vale"}, {"enun": "<b>ningún<\/b> relevo", "sol": "indefinido"}, {"enun": "el <b>primer<\/b> año", "sol": "numeral ordinal", "porque": "la forma apocopada de <i>primero<\/i>"}, {"enun": "¡<b>cuánto<\/b> tiempo!", "sol": "interrogativo o exclamativo", "porque": "exclamativo: lleva los signos de exclamación"}, {"enun": "<b>varias<\/b> fincas", "sol": "indefinido"}, {"enun": "<b>medio<\/b> kilo", "sol": "numeral partitivo", "porque": "la mitad de un kilo"}, {"enun": "<b>una<\/b> cooperativa", "sol": "artículo|indefinido", "porque": "artículo indeterminado; hay gramáticas que lo llaman indefinido, y también vale"}], "apoyo": "todo", "dossier_txt": "Del dossier: nudo 8, ejercicio 20"}, {"tipo": "hueco", "titulo": "Apocopa cuando haga falta", "dossier": {"cuaderno": "8", "ejercicio": 21}, "ayuda": "Escribe la forma que corresponde a la palabra del paréntesis en ese sitio de la frase.", "estricto": true, "items": [{"enun": "______ día <i>(alguno)<\/i>", "sol": "algún", "porque": "se apocopa delante de un sustantivo masculino"}, {"enun": "______ fruto <i>(ninguno)<\/i>", "sol": "ningún", "porque": "se apocopa delante de un sustantivo masculino"}, {"enun": "______ hachas <i>(veintiuno)<\/i>", "sol": "veintiún|veintiuna", "porque": "delante de un sustantivo femenino que empieza por <i>a<\/i> tónica valen las dos: <i>veintiún hachas<\/i> y <i>veintiuna hachas<\/i>; la clave del dossier da la apocopada"}, {"enun": "un día ______ <i>(cualquiera)<\/i>", "sol": "cualquiera", "porque": "detrás del sustantivo no se apocopa"}, {"enun": "______ años <i>(ciento)<\/i>", "sol": "cien", "porque": "delante de un sustantivo se apocopa"}], "apoyo": "todo", "dossier_txt": "Del dossier: nudo 8, ejercicio 21"}, {"tipo": "clasificar", "titulo": "¿Determinante, pronombre o adverbio?", "dossier": {"cuaderno": "8", "ejercicio": 22, "parte": "la clase"}, "ayuda": "Indica la clase de la palabra en negrita. Las tildes todavía no están puestas: se ponen en «Pon la tilde donde haga falta».", "ops": ["determinante", "pronombre", "adverbio", "conjunción"], "items": [{"enun": "¿<b>Cuantos<\/b> años tienes?", "sol": "determinante", "porque": "acompaña a <i>años<\/i>"}, {"enun": "¿<b>Que<\/b> tapices prefieres?", "sol": "determinante", "porque": "acompaña a <i>tapices<\/i>"}, {"enun": "«¿<b>Como<\/b> va a haberlo?»", "conv": "2026", "sol": "adverbio", "porque" sol": "distributivo"}], "criterio": "Los partitivos y los multiplicativos se confunden porque los dos suenan a operación. <i>Media cosecha<\/i> es la mitad de una; <i>el triple de horas<\/i> son tres veces más. Uno parte y el otro multiplica.", "apoyo": ["5 · Los determinantes"], "solo_web": true}, {"tipo": "hueco", "titulo": "La forma que corresponde", "estricto": true, "ayuda": "Apócope, <i>cien<\/i> o <i>ciento<\/i>, y los ordinales altos. Escribe solo la palabra.", "items": [{"enun": "Subió el diez por ______. <i>(100)<\/i>", "sol": "ciento", "porque": "en los porcentajes, la forma entera"}, {"enun": "Es el ______ aniversario. <i>(50.º)<\/i>", "sol": "quincuagésimo", "corto": false}, {"enun": "Cobra el ______. <i>(×4)<\/i>", "sol": "cuádruple", "corto": false, "porque": "esdrújula: lleva tilde siempre"}, {"enun": "No tengo ______ problema con eso.", "sol": "ningún", "porque": "apocopado delante del sustantivo"}, {"enun": "Es el ______ capítulo. <i>(1.º)<\/i>", "sol": "primer", "porque": "apocopado delante de un sustantivo masculino"}], "criterio": "El de <i>cuádruple<\/i> junta dos contenidos del curso: numeral y esdrújula. Por eso lleva tilde siempre, igual que <i>séxtuple<\/i>. <i>Doble<\/i> y <i>triple<\/i> son llanas acabadas en vocal y no la llevan.", "apoyo": ["5 · Los determinantes"], "solo_web": true}, {"tipo": "opcion", "titulo": "¿Determinante o pronombre?", "ayuda": "Interrogativos y exclamativos. Todos llevan tilde. De uno a otro cambia la clase: unos presentan un sustantivo y otros ocupan su lugar.", "ops": ["determinante", "pronombre"], "items": [{"enun": "¡<b>Cuánta<\/b> gente!", "sol": "determinante", "porque": "gente"}, {"enun": "¿<b>Qué<\/b> tapices te gustan?", "sol": "determinante", "porque": "tapices"}, {"enun": "No sé <b>cuántos<\/b> vendrán.", "sol": "pronombre", "porque": "no hay sustantivo detrás, aunque la pregunta sea indirecta"}, {"enun": "¿<b>Quién<\/b> vendrá?", "sol": "pronombre"}, {"enun": "¿<b>Cuáles<\/b> prefieres?", "sol": "pro
