<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 4 · 6 oct · CAS Castellà</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* El texto corrido va justificado y sin partir palabras (lo pidió Osky el
   24-09-2026): sin partición, el renglón se iguala abriendo el espacio entre
   palabras. A la izquierda se quedan los títulos, las tablas, los botones,
   los campos que se rellenan y los textos de examen con las líneas
   numeradas, porque cada fila copia un renglón del cuadernillo. */
body{text-align:justify;hyphens:none;-webkit-hyphens:none}
h1,h2,h3,h4,h5,h6,.kicker,.sub,.meta,.ej-t,.lec-t,.lec-f,.textoexamen,nav,summary,
button,input,textarea,select,.ops,.chapa,.conv,.pie{text-align:left}
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;white-space:nowrap;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

/* la teoría que sale del dossier (_teoria_web.py): los mismos elementos que el
   PDF —apartados, subapartados, recuadros, la línea «En el examen», versalitas
   y los textos de examen con las líneas numeradas— con los colores de la web.
   Los recuadros van también en la ventana de teoría de cada ejercicio. */
:root{--verde:#3d7400;--verdef:#eef4e4}
@media (prefers-color-scheme:dark){:root{--verde:#a4d17a;--verdef:#1e2717}}
.teoria.dossier>h3,.teoria.dossier>details.ap-dossier:first-of-type{margin-top:26px}
.teoria.dossier>h3{padding-top:16px;border-top:1px solid var(--linea)}
.teoria h3,.v-bloque h3{font-size:17px;line-height:1.3;margin:24px 0 8px}
.teoria h4,.v-bloque h4{font-size:15px;line-height:1.35;margin:20px 0 6px;color:var(--tinta2)}
.teoria h5,.v-bloque h5{font-size:15px;margin:16px 0 4px}
.teoria h6,.v-bloque h6{font-size:14px;margin:14px 0 4px;color:var(--tinta2)}
.teoria ul,.teoria ol,.v-bloque ul,.v-bloque ol{padding-left:22px}
.teoria li,.v-bloque li{margin-bottom:5px}
.teoria hr,.v-bloque hr{border:0;border-top:1px solid var(--linea);margin:22px 18%}
.teoria blockquote,.v-bloque blockquote{margin:14px 0;padding:11px 15px;background:var(--verdef);
  border-left:3px solid var(--verde);border-radius:0 8px 8px 0;font-size:15px}
.teoria blockquote p,.v-bloque blockquote p{margin:0 0 7px}
.teoria blockquote p:last-child,.v-bloque blockquote p:last-child{margin-bottom:0}
.teoria blockquote strong:first-child,.v-bloque blockquote strong:first-child{color:var(--verde)}
.teoria blockquote.criterio,.v-bloque blockquote.criterio{background:var(--acento2);border-left-color:var(--acento)}
.teoria blockquote.criterio strong:first-child,.v-bloque blockquote.criterio strong:first-child{color:var(--acento)}
.teoria blockquote.juego,.v-bloque blockquote.juego{background:var(--fondo);border-left-color:var(--tinta3);font-size:14px}
.teoria blockquote.juego strong:first-child,.v-bloque blockquote.juego strong:first-child{color:var(--tinta2)}
.enelexamen{font-size:14px;line-height:1.55;background:var(--acento2);border-left:3px solid var(--acento);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 18px}
.enelexamen strong{color:var(--acento)}
.vs{font-variant:small-caps;letter-spacing:.03em;font-weight:600}

<script>window.DIA = {"dia": 4, "fecha": "2026-10-06", "tab": "Día 4 · 6 oct · CAS Castellà", "kicker": "CAS Castellà 26-27 · primer trimestre · día 4", "h1": "Martes 6 de octubre", "sub": "Dos vocales en una sílaba · el plan y el registro · el plural del sustantivo", "carriles": [{"chapa": "Carril A", "titulo": "Dos vocales en una sílaba", "meta": "30 minutos · lo que decide dónde se pone la tilde", "cuaderno": {"nudo": 2, "apartados": [1], "ejercicios": [1, 2]}, "teoria": "<div class=\"enelexamen\"><strong>En el examen:<\/strong> ejercicio 2.2, <em>explicar la razón de las tildes<\/em>. <strong>Ese ejercicio manda explicar más hiatos que ninguna otra clase de tilde<\/strong>, y el hiato se justifica con una fórmula propia: se escribe «hiato»; «llana acabada en vocal» sola es respuesta incorrecta, porque esa regla no da tilde.<\/div>\n<h3>1 · Diptongos y triptongos<\/h3>\n<p>En el nudo 1 apareció la trampa de <em>ciu-dad<\/em>: «ciu» tiene dos vocales y forma <strong>una sola sílaba<\/strong>. Aquí se explica por qué, y para qué sirve saberlo.<\/p>\n<h4>Vocales abiertas y cerradas<\/h4>\n<p>Las cinco vocales se reparten en dos grupos:<\/p>\n<table>\n<thead>\n<tr>\n<th>abiertas<\/th>\n<th>cerradas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a, e, o<\/strong><\/td>\n<td><strong>i, u<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Se llaman así por la posición de la boca: para pronunciar <em>a<\/em> se abre del todo; para pronunciar <em>i<\/em> se cierra casi entera.<\/p>\n<h4>El diptongo<\/h4>\n<p>Un <strong>diptongo<\/strong> son <strong>dos vocales en la misma sílaba<\/strong>: se pronuncian en una sola emisión de voz, sin separarlas. En <em>ciu-dad<\/em>, «ciu» es un diptongo; en <em>bai-le<\/em>, «bai» también.<\/p>\n<p>Solo hay tres maneras de formarlo:<\/p>\n<table>\n<thead>\n<tr>\n<th>tipo<\/th>\n<th>combinación<\/th>\n<th>cuáles<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>creciente<\/strong><\/td>\n<td>cerrada + abierta · <em>la boca se abre<\/em><\/td>\n<td>ia, ie, io, ua, ue, uo<\/td>\n<td>in-te-li-<strong>gen<\/strong>-cia, tam-<strong>bién<\/strong>, <strong>hués<\/strong>-ped, a-gua<\/td>\n<\/tr>\n<tr>\n<td><strong>decreciente<\/strong><\/td>\n<td>abierta + cerrada · <em>la boca se cierra<\/em><\/td>\n<td>ai, ei, oi, au, eu, ou<\/td>\n<td><strong>bai<\/strong>-le, <strong>pei<\/strong>-ne, au-to-<strong>bús<\/strong>, <strong>cau<\/strong>-sa<\/td>\n<\/tr>\n<tr>\n<td><strong>homogéneo<\/strong><\/td>\n<td>cerrada + cerrada · <em>la boca ni se abre ni se cierra<\/em><\/td>\n<td><strong>ui, iu<\/strong><\/td>\n<td><strong>ciu<\/strong>-dad, <strong>cui<\/strong>-da-do, <strong>rui<\/strong>-do<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>El error que más se repite en este punto.<\/strong> <em>UI<\/em> e <em>IU<\/em> aparecen muy a menudo colocados entre los diptongos <strong>decrecientes<\/strong>. No lo son: son <strong>homogéneos<\/strong>.<\/p>\n<p>La razón está en el propio nombre. «Creciente» significa que la boca se abre (la abierta va detrás) y «decreciente» que se cierra (la abierta va delante). En <em>ciudad<\/em> y en <em>ruido<\/em> <strong>no hay ninguna vocal abierta<\/strong>, así que la boca ni se abre ni se cierra.<\/p>\n<\/blockquote>\n<p><strong>Dos avisos.<\/strong> La <strong>h<\/strong> entre vocales no rompe nada: <em>ahu-ma-do<\/em> sigue teniendo diptongo. Y en <strong>gue, gui, que, qui<\/strong> la <em>u<\/em> no suena, así que <strong>no hay diptongo<\/strong>: en <em>guerra<\/em>, <em>seguida<\/em>, <em>quince<\/em> o <em>máquina<\/em> solo interviene una vocal. Si la <em>u<\/em> sí suena, se marca con diéresis, y de eso trata el apartado 3.<\/p>\n<h4>El triptongo<\/h4>\n<p>Tres vocales en la misma sílaba: <strong>cerrada átona + abierta + cerrada átona<\/strong>. Aparece casi siempre en la forma de <em>vosotros<\/em>: es-tu-<b>diáis<\/b>, lim-<b>piáis<\/b>, a-ve-ri-<b>güéis<\/b>. También en <em>buey<\/em> y U-ru-<b>guay<\/b>.<\/p>\n<p>Si una de las cerradas es la tónica, no hay triptongo y la palabra se parte: re-<b>í<\/b>-ais.<\/p>\n<h4>Lo que decide la tilde<\/h4>\n<blockquote>\n<p><strong>El diptongo no es la razón de la tilde<\/strong>: la palabra se acentúa siguiendo las reglas generales de acentuación, y el diptongo solo decide sobre qué vocal se escribe.<\/p>\n<p>Si hay una abierta y una cerrada, y la tónica es la abierta, la tilde va <strong>sobre la abierta<\/strong>: <b>náu<\/b>-ti-co, tam-<b>bién<\/b>, can-<b>ción<\/b>, es-tu-<b>diáis<\/b>. Si las dos son cerradas, va <strong>sobre la segunda<\/strong>: lin-<b>güís<\/b>-ti-ca, <b>cuí<\/b>-da-te.<\/p>\n<p><em>También<\/em> lleva tilde <strong>porque es aguda acabada en -n<\/strong>, no porque tenga diptongo. Contestar «lleva tilde porque hay un diptongo» deja la explicación a medias, y en la prueba no vale: el diptongo no explica la tilde, solo dónde se coloca.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "clasificar", "titulo": "¿Qué diptongo?", "dossier": {"cuaderno": "2", "ejercicio": 1}, "ayuda": "Clasifica el diptongo en creciente, decreciente u homogéneo. Dos de la lista no tienen diptongo.", "ops": ["creciente", "decreciente", "homogéneo", "no hay diptongo"], "items": [{"enun": "<i>ciudad<\/i>", "conv": "2011", "sol": "homogéneo", "porque": "<i>ciu-dad<\/i>: <b>homogéneo<\/b> (iu)"}, {"enun": "<i>cuidado<\/i>", "conv": "2011", "sol": "homogéneo", "porque": "<i>cui-da-do<\/i>: <b>homogéneo<\/b> (ui)"}, {"enun": "<i>canción<\/i>", "conv": "2004", "sol": "creciente", "porque": "<i>can-ción<\/i>: creciente (io)"}, {"enun": "<i>autobús<\/i>", "conv": "2015", "sol": "decreciente", "porque": "<i>au-to-bús<\/i>: decreciente (au)"}, {"enun": "<i>también<\/i>", "conv": "2016", "sol": "creciente", "porque": "<i>tam-bién<\/i>: creciente (ie)"}, {"enun": "<i>inquietante<\/i>", "conv": "2025", "sol": "creciente", "porque": "<i>in-quie-tan-te<\/i>: creciente (ie)"}, {"enun": "<i>huésped<\/i>", "conv": "2012", "sol": "creciente", "porque": "<i>hués-ped<\/i>: creciente (ue)"}, {"enun": "<i>seguida<\/i>", "conv": "2018", "sol": "no hay diptongo", "porque": "<i>se-gui-da<\/i>: <b>no hay diptongo<\/b>, la u de <i>gui<\/i> no suena"}, {"enun": "<i>causó<\/i>", "conv": "2004", "sol": "decreciente", "porque": "<i>cau-só<\/i>: decreciente (au)"}, {"enun": "<i>quince<\/i>", "conv": "2017", "sol": "no hay diptongo", "porque": "<i>quin-ce<\/i>: <b>no hay diptongo<\/b>, la u de <i>qui<\/i> no suena"}], "criterio": "En <i>gui<\/i> y <i>qui<\/i> la <i>u<\/i> no suena, y por eso <i>seguida<\/i> y <i>quince<\/i> no tienen diptongo: solo interviene una vocal.", "apoyo": ["El diptongo"], "dossier_txt": "Del dossier: nudo 2, ejercicio 1"}, {"tipo": "hueco", "titulo": "¿Triptongo, sí o no?", "dossier": {"cuaderno": "2", "ejercicio": 2}, "ayuda": "Si la palabra tiene triptongo, escribe las tres vocales que lo forman, con su tilde: <i>estudiáis<\/i> → <i>iái<\/i>. Si no lo tiene, sepárala en sílabas con guiones: <i>reíais<\/i> → <i>re-í-ais<\/i>.", "estricto": true, "items": [{"enun": "estudiáis", "sol": "iái|sí iái|sí, iái", "porque": "triptongo: <i>iái<\/i>, tres vocales en la misma sílaba"}, {"enun": "averigüéis", "sol": "üéi|sí üéi|sí, üéi", "porque": "triptongo: <i>üéi<\/i>, tres vocales en la misma sílaba"}, {"enun": "buey", "sol": "uey|sí uey|sí, uey", "porque": "triptongo: <i>uey<\/i>, tres vocales en la misma sílaba"}, {"enun": "Uruguay", "sol": "uay|sí uay|sí, uay", "porque": "triptongo: <i>uay<\/i>, tres vocales en la misma sílaba"}, {"enun": "reíais", "sol": "re-í-ais|no re-í-ais|no, re-í-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>re-í-ais<\/i>"}, {"enun": "limpiáis", "sol": "iái|sí iái|sí, iái", "porque": "triptongo: <i>iái<\/i>, tres vocales en la misma sílaba"}, {"enun": "Paraguay", "sol": "uay|sí uay|sí, uay", "porque": "triptongo: <i>uay<\/i>, tres vocales en la misma sílaba"}, {"enun": "veíais", "sol": "ve-í-ais|no ve-í-ais|no, ve-í-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>ve-í-ais<\/i>"}, {"enun": "cambiáis", "sol": "iái|sí iái|sí, iái", "porque": "triptongo: <i>iái<\/i>, tres vocales en la misma sílaba"}, {"enun": "vivíais", "sol": "vi-ví-ais|no vi-ví-ais|no, vi-ví-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>vi-ví-ais<\/i>"}, {"enun": "miau", "sol": "iau|sí iau|sí, iau", "porque": "triptongo: <i>iau<\/i>, tres vocales en la misma sílaba"}, {"enun": "leíais", "sol": "le-í-ais|no le-í-ais|no, le-í-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>le-í-ais<\/i>"}, {"enun": "actuéis", "sol": "uéi|sí uéi|sí, uéi", "porque": "triptongo: <i>uéi<\/i>, tres vocales en la misma sílaba"}, {"enun": "creíais", "sol": "cre-í-ais|no cre-í-ais|no, cre-í-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>cre-í-ais<\/i>"}, {"enun": "Camagüey", "sol": "üey|sí üey|sí, üey", "porque": "triptongo: <i>üey<\/i>, tres vocales en la misma sílaba"}, {"enun": "oíais", "sol": "o-í-ais|no o-í-ais|no, o-í-ais", "porque": "no hay triptongo: la <i>í<\/i> es tónica y el grupo se rompe en <i>o-í-ais<\/i>"}], "criterio": "En <i>reíais<\/i>, <i>veíais<\/i>, <i>vivíais<\/i>, <i>leíais<\/i>, <i>creíais<\/i> y <i>oíais<\/i> la <i>í<\/i> lleva la fuerza, y una cerrada tónica junto a una abierta forma hiato: las vocales van en sílabas distintas, <i>re-í-ais<\/i>.", "apoyo": ["El triptongo", "Lo que decide la tilde"], "dossier_txt": "Del dossier: nudo 2, ejercicio 2"}, {"tipo": "hueco", "titulo": "Separa en sílabas", "ayuda": "Escríbelas con guiones, así: <i>ciu-dad<\/i>. Esa separación se hace mentalmente antes de decidir nada sobre la tilde. Todas proceden de textos de examen.", "items": [{"enun": "<i>ciudad<\/i>", "conv": "2011", "sol": "ciu-dad", "corto": false, "porque": "«ciu» va junta: dos cerradas seguidas no se separan"}, {"enun": "<i>inteligencia<\/i>", "conv": "2023", "sol": "in-te-li-gen-cia", "corto": false, "porque": "«cia» va junta: cerrada + abierta"}, {"enun": "<i>aprendizaje<\/i>", "conv": "2013", "sol": "a-pren-di-za-je", "corto": false}, {"enun": "<i>autobús<\/i>", "conv": "2015", "sol": "au-to-bús", "corto": false, "porque": "«au» va junta: abierta + cerrada"}, {"enun": "<i>huésped<\/i>", "conv": "2012", "sol": "hués-ped", "corto": false, "porque": "«hués» va junta; la <i>h<\/i> no separa nada"}, {"enun": "<i>seguida<\/i>", "conv": "2018", "sol": "se-gui-da", "corto": false, "porque": "«gui» va junta porque la <i>u<\/i> ni siquiera suena"}], "criterio": "Contar mal las sílabas hace fallar la clase de palabra, y con ella toda la justificación. Quien separa <i>ci-u-dad<\/i> o <i>in-te-li-gen-ci-a<\/i> se lleva la palabra a otra columna sin darse cuenta.", "estricto": true, "apoyo": ["1 · Diptongos y triptongos"], "solo_web": true}, {"tipo": "cazar", "titulo": "Caza las tildes que faltan", "ayuda": "Este párrafo tiene <b>seis palabras<\/b> sin la tilde que les corresponde. Cinco son <b>agudas acabadas en -n<\/b> y una es esdrújula. <b>Pincha en las que estén mal.<\/b> Si te pasas, también cuenta.", "items": [{"texto": "El encargado explicaba en un correo que la produccion del taller había caído mucho y que los precios se dispararon tambien ese año. Segun el informe, la unica manera de que las cuentas salgan en positivo es la subvencion, y esa relacion entre coste y precio no se sostiene.", "faltas": {"produccion": "producción", "tambien": "también", "Segun": "Según", "subvencion": "subvención", "relacion": "relación", "unica": "única"}}], "criterio": "Cuatro de las seis acaban en <i>-ión<\/i> o <i>-ién<\/i>: dos vocales juntas y la fuerza en la segunda vocal. Ese formato se repite más que ningún otro: cinco de las trece palabras del 1 de octubre acaban en -ción. <i>Según<\/i> es aguda acabada en -n igual que ellas, pero en ella no hay diptongo; y <i>única<\/i> es esdrújula, y las esdrújulas llevan tilde siempre. <i>Había<\/i> y <i>caído<\/i> llevan la suya puesta, pero por hiato, que se estudia el jueves 8 de octubre; por eso no entran aquí.<br><br><b>Esta pasada coincide con la última lectura antes de entregar<\/b>: tres minutos buscando solo tildes, sin leer el contenido.", "apoyo": ["1 · Diptongos y triptongos"], "solo_web": true}, {"tipo": "hueco", "titulo": "¿Dónde va la tilde?", "ayuda": "Estas palabras llevan tilde. Escríbelas enteras, con la tilde puesta donde corresponde.", "items": [{"enun": "tambien", "sol": "también", "porque": "abierta + cerrada: la tilde va sobre la <b>abierta<\/b>"}, {"enun": "cancion", "sol": "canción", "porque": "sobre la abierta"}, {"enun": "nautico", "sol": "náutico", "porque": "sobre la abierta"}, {"enun": "linguistica", "sol": "lingüística", "porque": "dos cerradas: la tilde va sobre la <b>segunda<\/b>. Y la diéresis se estudia el 15 de octubre"}, {"enun": "estudiais", "sol": "estudiáis", "porque": "triptongo: sobre la abierta del medio"}], "criterio": "La regla de colocación es mecánica y no admite duda: <b>hay abierta → sobre la abierta; no la hay → sobre la segunda vocal<\/b>. No hay tercer caso.", "estricto": true, "apoyo": ["El diptongo", "Lo que decide la tilde"], "solo_web": true}, {"tipo": "justificar", "titulo": "La trampa de <i>también<\/i>", "ayuda": "Contesta con la frase entera. Es una palabra con diptongo, pero la razón de la tilde no es esa.", "items": [{"palabra": "<i>también<\/i>", "conv": "2016", "requiere": [["aguda"], ["vocal mas n", "vocal y n", "vocal seguida de n", "en n"]], "modelo": "es una palabra aguda acabada en vocal más -n"}], "criterio": "El diptongo <i>ie<\/i> solo explica <b>que la tilde vaya sobre la <i>e<\/i> y no sobre la <i>i<\/i><\/b>. La razón de que haya tilde es otra: la palabra es aguda y acaba en -n. Quien contesta «porque hay un diptongo» responde a una pregunta que nadie ha hecho.", "apoyo": ["El diptongo", "Lo que decide la tilde"], "pide": "lleva tilde porque…", "solo_web": true}], "cuaderno_txt": "Nudo 2 · Vocales en contacto y la diéresis — apartado 1: Diptongos y triptongos (p. 10) · ejercicios 1 y 2", "teoria_dossier": true}, {"chapa": "Carril B", "titulo": "El plan y el registro", "meta": "25 minutos · tres líneas antes de escribir, y el tono que corresponde", "cuaderno": {"nudo": 18, "apartados": [2], "ejercicios": [2]}, "lectura": {"titulo": "Lo que cabe en seiscientos euros", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato, la extensión y la arquitectura de los que caen en la prueba.", "lineas": ["Cuando Nadia Berrocal encontró por fin un piso, llevaba cinco meses", "mirando. Cuarenta y un anuncios, dice, y doce visitas. En una de ellas", "había ocho personas esperando en el rellano con la misma carpeta de", "papeles debajo del brazo: nóminas, contrato, aval. «Parecía una", "oposición», cuenta, «y solo era para vivir en un tercero sin ascensor».", "", "Nadia gana algo más de mil doscientos euros y trabaja en una óptica.", "El piso que alquiló le cuesta seiscientos ochenta. Con la luz, el agua", "y el transporte, calcula que le queda para comer y para poco más.", "Comparte con una compañera de trabajo, y las dos han renunciado a", "irse de vacaciones estos dos últimos veranos.", "", "Lo llamativo no es el precio, que cualquiera conoce. Es el papeleo. Le", "pidieron tres nóminas, un contrato indefinido, un aval bancario y una", "garantía adicional de seis meses. «Si tuviera todo eso», dice, «no", "estaría buscando piso: estaría comprándolo». Al final la aceptaron", "porque su jefa llamó por teléfono y respondió por ella.", "", "Ese es el detalle que conviene mirar. El mercado del alquiler no filtra", "solo por dinero; filtra por contactos, por avales y por familias que", "puedan firmar. Quien no tenga una jefa dispuesta a llamar se queda en", "el rellano con los otros siete, aunque cobre lo mismo que Nadia.", "", "Y ahí hay algo que ninguna estadística de precios recoge. Se publica", "cada mes cuánto cuesta el metro cuadrado en cada barrio. No se publica", "cuántas llamadas hay que conseguir para que te dejen pagarlo."], "pie": "Texto inventado. Ni Nadia Berrocal ni las cifras que da son reales."}, "teoria": "<h3>2 · El registro<\/h3>\n<p>Se distinguen cinco registros: formal, estándar, no formal o coloquial, vulgar y culto. Esa banda vale 0,25 y se pierde siempre por lo mismo: <strong>aparece el tono de la conversación<\/strong>.<\/p>\n<p>Hay que fijar lo que <strong>queda fuera del registro<\/strong> de un examen:<\/p>\n<table>\n<thead>\n<tr>\n<th>fuera del registro<\/th>\n<th>por qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>jaja<\/em>, emoticonos, <em>xq<\/em>, <em>tb<\/em><\/td>\n<td>canal equivocado: eso es un chat<\/td>\n<\/tr>\n<tr>\n<td><em>o sea<\/em>, <em>en plan<\/em>, <em>rollo<\/em>, <em>súper<\/em><\/td>\n<td>marcas de oralidad<\/td>\n<\/tr>\n<tr>\n<td>insultos y tacos<\/td>\n<td>registro vulgar<\/td>\n<\/tr>\n<tr>\n<td>«<em>como te decía antes<\/em>», «<em>¿tú qué opinas?<\/em>»<\/td>\n<td>le estás hablando al corrector; no hay interlocutor<\/td>\n<\/tr>\n<tr>\n<td>«<em>yo pienso que en mi opinión creo que<\/em>»<\/td>\n<td>acumulación; una sola marca de opinión basta<\/td>\n<\/tr>\n<tr>\n<td>«los cazadores son unos asesinos»<\/td>\n<td>descalificar al que piensa distinto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Y una advertencia: <strong>la primera persona sí se puede usar en el argumentativo<\/strong>. El enunciado oficial pide «exponga <em>su<\/em> opinión». No se puede tratar al corrector como si fuera un amigo.<\/p>", "ejercicios": [{"tipo": "abierta", "titulo": "Reescribe en el registro de un examen", "dossier": {"cuaderno": "18", "ejercicio": 2}, "ayuda": "Estas cinco frases están en un registro que no corresponde a un examen. Reescríbelas.", "items": [{"enun": "«Es que la gente pasa un montón de esto, o sea, un rollo.»", "modelo": "«Mucha gente no le da importancia a este asunto.»"}, {"enun": "«Yo pienso que en mi opinión creo que deberían pagarles más.»", "modelo": "«En mi opinión, deberían cobrar más.» Una sola marca de opinión."}, {"enun": "«Y tú, ¿qué harías si te pasara a ti? jaja.»", "modelo": "Se elimina: no hay interlocutor en un examen. Si se quiere mantener la idea: «Cualquiera reaccionaría igual en esa situación.»"}, {"enun": "«Los agricultores están to el día currando xq no les queda otra.»", "modelo": "«Los agricultores trabajan todo el día porque no tienen alternativa.»"}, {"enun": "«El tema del campo es súper importante, la verdad.»", "modelo": "«El futuro del campo es un asunto importante.» <i>Súper<\/i> y <i>la verdad<\/i> son marcas de oralidad."}], "apoyo": "todo", "usa_texto": false, "dossier_txt": "Del dossier: nudo 18, ejercicio 2"}, {"tipo": "opcion", "titulo": "¿Sirve como tesis para este texto?", "ayuda": "La consigna sería: <i>redacte un texto argumentativo exponiendo su opinión sobre el acceso a la vivienda de alquiler<\/i>. Decide si cada frase puede abrirlo.", "ops": ["sirve", "no sirve"], "items": [{"enun": "Alquilar un piso se ha vuelto muy caro en las ciudades.", "sol": "no sirve", "porque": "nadie lo discute: es un hecho aceptado, no una tesis"}, {"enun": "Voy a hablar del problema de la vivienda, que es muy importante.", "sol": "no sirve", "porque": "anuncia el tema y no sostiene ninguna afirmación sobre él"}, {"enun": "El alquiler se reparte más por avales y contactos que por dinero.", "sol": "sirve", "porque": "alguien puede negarlo, y además parte del texto"}, {"enun": "Poner límites al precio del alquiler crea más problemas de los que resuelve.", "sol": "sirve", "porque": "es discutible, que es lo único que se pide"}, {"enun": "Pedir tres nóminas y un aval para alquilar es pedir que no alquile quien lo necesita.", "sol": "sirve", "porque": "es discutible y parte del texto"}, {"enun": "Existen muchos tipos de contrato de alquiler.", "sol": "no sirve", "porque": "es una constatación: no hay nada que defender"}], "criterio": "Las tres que sirven tienen algo en común: alguien podría contestarte «pues yo no lo veo así».<br><br>Y atiende a la del aval: parte del texto que acabas de leer. La redacción va siempre anclada al texto que se acaba de leer, así que una tesis que recoja algo de lo leído empieza con ventaja.", "apoyo": "todo", "solo_web": true}, {"tipo": "cazar", "titulo": "Caza lo que queda fuera del registro", "ayuda": "Un alumno ha escrito esta apertura sobre el texto de arriba. <b>Seis palabras<\/b> pertenecen al registro hablado y no corresponden a un examen. <b>Pincha en ellas.<\/b>", "items": [{"texto": "Bueno, yo pienso que buscar piso es un rollo, xq los alquileres están súper altos y la gente está to el día mirando anuncios sin encontrar nada, ¿sabes? Algo habrá que hacer.", "faltas": {"Bueno": "muletilla de arranque: solo funciona con alguien delante", "rollo": "marca de oralidad; en un escrito, <i>una tarea pesada<\/i>", "xq": "abreviatura de chat: <i>porque<\/i>", "súper": "intensificador de la conversación; en un escrito, <i>muy altos<\/i> o <i>altísimos<\/i>", "to": "apócope de la lengua hablada: <i>todo<\/i>", "sabes": "apelación al lector: en un examen no hay nadie al otro lado"}}], "criterio": "<i>Yo pienso que<\/i> se queda: una marca de opinión corresponde a un argumentativo, y el enunciado oficial pide «su opinión». Queda fuera lo que solo funciona con alguien delante —la muletilla de arranque y el <i>¿sabes?<\/i>— ni lo que se dice y no se escribe: <i>rollo<\/i>, <i>súper<\/i>, <i>to<\/i> y la abreviatura de chat <i>xq<\/i>.", "apoyo": ["2 · El registro"], "solo_web": true}, {"tipo": "abierta", "titulo": "El plan de tres líneas · 3 minutos", "ayuda": "Sobre el texto de arriba y la consigna del primer ejercicio. Tesis, dos razones y cierre. Tres líneas, cronometradas.", "items": [{"enun": "Tu plan para <i>«exponga su opinión sobre el acceso a la vivienda de alquiler»<\/i>", "modelo": "Tres planes modelo abajo. Los tres sirven y no se parecen."}], "modelos": ["<b>Plan 1.<\/b> Tesis: el alquiler ya no se reparte por lo que ganas, sino por a quién conoces. · Razones: (1) piden avales que quien los tiene no necesita alquilar; (2) la misma nómina abre o no abre la puerta según quién llame por ti. · Cierre: mientras el filtro sea ese, subir sueldos no cambiará quién entra.", "<b>Plan 2.<\/b> Tesis: buscar piso de alquiler cuesta más tiempo que dinero. · Razones: (1) cinco meses buscando piso son cinco meses sin tiempo para nada más; (2) los requisitos dejan fuera a más gente que el precio. · Cierre: una estadística de precios no mide nada de eso.", "<b>Plan 3.<\/b> Tesis: poner tope al precio no basta si el filtro es el aval. · Razones: (1) el tope baja el recibo pero no quita los requisitos; (2) con más demanda al mismo precio, el casero elige y elige por garantías. · Cierre: sin tocar los requisitos, el tope solo cambia quién se queda fuera."], "criterio": "Lo único que se comprueba en el plan es que la tesis se pueda discutir y que las dos razones no sean la misma formulada dos veces. Si tus dos razones se pueden juntar en una frase, todavía tienes una sola.", "apoyo": "todo", "solo_web": true}], "cuaderno_txt": "Nudo 18 · Escribir: el criterio — apartado 2: El registro (p. 64) · ejercicio 2", "teoria_dossier": true}, {"chapa": "Carril C", "titulo": "El plural del sustantivo", "meta": "30 minutos · el plural que mueve la tilde", "cuaderno": {"nudo": 8, "apartados": [2], "ejercicios": [5, 6, 7, 8, 9]}, "teoria": "<h3>2 · El sustantivo: número<\/h3>\n<h4>La regla, en cuatro líneas<\/h4>\n<table>\n<thead>\n<tr>\n<th>si el singular acaba en…<\/th>\n<th>plural<\/th>\n<th>ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>vocal átona, o <em>-á, -é, -ó<\/em> tónicas<\/td>\n<td><strong>+ s<\/strong><\/td>\n<td>puerta → puertas · café → cafés · sofá → sofás<\/td>\n<\/tr>\n<tr>\n<td>consonante<\/td>\n<td><strong>+ es<\/strong><\/td>\n<td>melón → melones · alquiler → alquileres<\/td>\n<\/tr>\n<tr>\n<td><em>-y<\/em><\/td>\n<td><strong>+ es<\/strong>; en los préstamos, la <em>y<\/em> pasa a <em>i<\/em> y se añade <strong>-s<\/strong><\/td>\n<td>rey → reyes · jersey → jerséis<\/td>\n<\/tr>\n<tr>\n<td>consonante, en préstamos<\/td>\n<td><strong>+ s<\/strong> (algunos admiten también <strong>+ es<\/strong>)<\/td>\n<td>club → clubs / clubes · récord → récords<\/td>\n<\/tr>\n<tr>\n<td><em>-z<\/em><\/td>\n<td><strong>-ces<\/strong><\/td>\n<td>feliz → felices · voz → voces<\/td>\n<\/tr>\n<tr>\n<td><em>-í, -ú<\/em> tónicas<\/td>\n<td><strong>+ s<\/strong> o <strong>+ es<\/strong><\/td>\n<td>hindú → hindús / hindúes · jabalí → jabalís / jabalíes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Los que no cambian<\/h4>\n<p>Las palabras <strong>llanas o esdrújulas acabadas en <em>-s<em> o en <\/em>-x<\/em><\/strong> son iguales en singular y en plural: <em>el virus / los virus<\/em>, <em>la crisis / las crisis<\/em>, <em>el lunes / los lunes<\/em>, <em>el tórax / los tórax<\/em>. Lo que marca el número es el determinante, no la palabra.<\/p>\n<p>La regla usa la clasificación del nudo 1: <strong>llana o esdrújula<\/strong>. <em>El autobús<\/em> es aguda, así que sí cambia: <em>los autobuses<\/em>.<\/p>\n<h4>Los que solo tienen una forma<\/h4>\n<p><strong>Solo singular, o casi:<\/strong> <em>el caos<\/em>, <em>la sed<\/em>, <em>la salud<\/em>. No se dice «los caos» ni «las seds».<\/p>\n<p><strong>Solo plural<\/strong> son bastantes menos de los que se suele decir: <em>los víveres<\/em>, <em>los enseres<\/em>, <em>las exequias<\/em>, <em>las nupcias<\/em>, hacerse <em>añicos<\/em>. El diccionario los marca <strong>m. pl.<\/strong> o <strong>f. pl.<\/strong> y no les da entrada en singular.<\/p>\n<blockquote>\n<p><strong>Y una lista que circula mal.<\/strong> <em>Tijeras<\/em>, <em>gafas<\/em>, <em>alicates<\/em> y <em>tenazas<\/em> se dan casi siempre como «palabras que solo existen en plural», y <strong>no lo son<\/strong>. El diccionario las recoge en singular y añade: «<em>U. m. en pl. con el mismo significado que en sing.<\/em>» — usado más en plural, con el mismo significado que en singular.<\/p>\n<\/blockquote>\n<h4>Los que cambian de significado<\/h4>\n<p>Como pasaba con el género, aquí el número también separa dos palabras distintas: <em>la esposa<\/em> (la persona) y <em>las esposas<\/em> (las del policía); <em>el celo<\/em> (el interés) y <em>los celos<\/em>; <em>la ciencia<\/em> (la actividad) y <em>las ciencias<\/em> (las asignaturas).<\/p>\n<blockquote>\n<p><strong>Tres plurales que se escriben mal en las redacciones:<\/strong><\/p>\n<p><strong>Siglas:<\/strong> no llevan <em>-s<\/em>. Se escribe <em>los CD<\/em>, <em>estas ONG<\/em>, <em>dos DNI<\/em>. El plural lo marca el determinante. <em>CDs<\/em> u <em>ONGs<\/em> es falta.<\/p>\n<p><strong>Compuestos con guion:<\/strong> solo pluraliza el segundo elemento — <em>físico-químicos<\/em>.<\/p>\n<p><strong><em>Currículum<\/em>:<\/strong> el plural es <em>currículums<\/em>. La RAE recomienda la forma hispanizada <em>currículo<\/em>, con plural <em>currículos<\/em>.<\/p>\n<\/blockquote>", "ejercicios": [{"tipo": "hueco", "titulo": "Pon en plural", "dossier": {"cuaderno": "8", "ejercicio": 5}, "ayuda": "Escribe el plural con su artículo: <i>el mes<\/i> → <i>los meses<\/i>.", "estricto": true, "items": [{"enun": "el análisis", "sol": "los análisis", "porque": "esdrújula acabada en -s: no cambia"}, {"enun": "la crisis", "sol": "las crisis", "porque": "llana acabada en -s: no cambia"}, {"enun": "el jueves", "sol": "los jueves", "porque": "llana acabada en -s: no cambia"}, {"enun": "la voz", "sol": "las voces", "porque": "la <i>z<\/i> pasa a <i>c<\/i> delante de <i>e<\/i>"}, {"enun": "el marroquí", "sol": "los marroquíes|los marroquís", "porque": "también <i>los marroquís<\/i>"}, {"enun": "el sofá", "sol": "los sofás"}, {"enun": "el carácter", "sol": "los caracteres", "porque": "no ⊗<i>carácteres<\/i>: el acento se desplaza y la palabra deja de llevar tilde, ca-rac-<b>te<\/b>-res, llana acabada en -s"}, {"enun": "el régimen", "sol": "los regímenes", "porque": "el acento también se desplaza, y la tilde va en la sílaba nueva"}, {"enun": "el lápiz", "sol": "los lápices"}, {"enun": "el rey", "sol": "los reyes"}, {"enun": "el menú", "sol": "los menús"}, {"enun": "el jersey", "sol": "los jerséis"}, {"enun": "la tesis", "sol": "las tesis", "porque": "llana acabada en -s: no cambia"}, {"enun": "el club", "sol": "los clubes|los clubs", "porque": "también <i>clubs<\/i>"}, {"enun": "el tabú", "sol": "los tabúes|los tabús", "porque": "también <i>tabús<\/i>"}], "criterio": "En <i>carácter<\/i> y en <i>régimen<\/i> el plural cambia la sílaba fuerte: <i>caracteres<\/i> pierde la tilde y <i>regímenes<\/i> la cambia de sitio.", "apoyo": ["La regla, en cuatro líneas", "Los que no cambian"], "dossier_txt": "Del dossier: nudo 8, ejercicio 5"}, {"tipo": "hueco", "titulo": "Corrige lo que esté mal", "dossier": {"cuaderno": "8", "ejercicio": 6}, "ayuda": "Escribe la parte en negrita corregida. Dos están bien: escríbelas igual.", "estricto": true, "items": [{"enun": "Tengo <b>tres CDs y dos DVDs<\/b>.", "sol": "tres CD y dos DVD", "porque": "las siglas no llevan -s: el plural lo marca el determinante", "corto": false}, {"enun": "Trabaja en <b>dos ONGs<\/b>.", "sol": "dos ONG", "porque": "las siglas no llevan -s", "corto": false}, {"enun": "Me han pedido <b>dos currículums<\/b>.", "sol": "dos currículums|dos currículos", "porque": "está bien; también <i>currículos<\/i>, si se parte de la forma hispanizada <i>currículo<\/i>", "corto": false}, {"enun": "<b>Los físicos-químicos<\/b> se reunieron.", "sol": "los físico-químicos", "porque": "en el compuesto con guion solo pluraliza el segundo", "corto": false}, {"enun": "Han cambiado <b>los PCs<\/b> de la oficina.", "sol": "los PC", "porque": "las siglas no llevan -s", "corto": false}, {"enun": "Hay <b>dos sofás-camas<\/b> en el salón.", "sol": "dos sofás cama", "porque": "en los compuestos de dos sustantivos escritos en dos palabras pluraliza el primero: <i>coches cama<\/i>, <i>hombres rana<\/i>", "corto": false}, {"enun": "<b>Los cursos teórico-práct tijera<\/i>: el diccionario la recoge con el mismo significado"}], "criterio": "Tres de las seis desmienten lo que se enseña casi siempre. La lista de «palabras que solo existen en plural» que circula por los manuales está llena de palabras que sí tienen singular, aunque de <b>poco uso<\/b>. Las palabras sin singular son pocas, y ninguna aparece en los textos de examen.", "apoyo": ["Los que solo tienen una forma"], "solo_web": true}, {"tipo": "hueco", "titulo": "Cuando el plural es otra palabra", "ayuda": "Tres palabras —<i>interés<\/i>, <i>bien<\/i> y <i>letra<\/i>— cambian de significado al pasar al plural. Escribe la forma que pide cada frase, en singular o en plural y con su artículo si hace falta. En estos casos las dos formas no son la misma palabra en dos números: <b>son dos palabras<\/b>.", "items": [{"enun": "El banco cobra unos ______ del cuatro por ciento.", "sol": "intereses", "corto": false, "porque": "los del banco van siempre en plural"}, {"enun": "La noticia despertó ______ en todo el barrio.", "sol": "interés|el interés|mucho interés", "corto": false, "porque": "la curiosidad, en singular"}, {"enun": "Al morir repartió ______ entre sus hijos.", "sol": "los bienes|sus bienes|bienes", "corto": false, "porque": "las propiedades"}, {"enun": "Distinguir ______ del mal no siempre es fácil.", "sol": "el bien|bien", "corto": false}, {"enun": "Estudió ______ en la universidad, no Ciencias.", "sol": "letras|Letras|la carrera de letras", "corto": false, "porque": "las humanidades, en plural"}, {"enun": "Con esa ______ tan pequeña no leo el cartel.", "sol": "letra|la letra", "corto": false, "porque": "el tipo de letra o la caligrafía"}], "criterio": "Tres pares y seis significados, y <b>ninguno se deduce de la gramática<\/b>: hay que saber que los del banco son <i>intereses<\/i> y que la carrera es <i>Letras<\/i>.", "estricto": true, "apoyo": ["Los que cambian de significado"], "solo_web": true}], "cuaderno_txt": "Nudo 8 · Las variables nominales: sustantivo, a
