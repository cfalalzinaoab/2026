<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAU +25 Castellano — Trimestres y sesiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<script>try{let t=localStorage.getItem('pau-agenda-tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#e9e3d6;--paper:#f7f1e5;--ink:#302b24;--muted:#655947;--line:#a89a80;--accent:#73551b;--wood:#39291b;--shadow:#392d222a;--metal:linear-gradient(145deg,#c4a66b,#76592c 40%,#a78b55 76%,#dac18d)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#242522;--paper:#30312c;--ink:#f0e8d8;--muted:#c9bea8;--line:#81745a;--accent:#e0c58b;--wood:#241c16;--shadow:#10110e80}}
:root[data-theme=dark]{color-scheme:dark;--bg:#242522;--paper:#30312c;--ink:#f0e8d8;--muted:#c9bea8;--line:#81745a;--accent:#e0c58b;--wood:#241c16;--shadow:#10110e80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:30px/1.45 Archivo,Arial,sans-serif}body:before{content:'';position:fixed;inset:0;background:url('img/tex-verjurado.webp');opacity:.055;pointer-events:none;z-index:9}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}button{touch-action:manipulation}button:hover:not(:disabled){filter:brightness(1.04)}[hidden]{display:none!important}.shell{max-width:1560px;margin:36px auto;padding:0 48px}header{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:24px 0 32px;border-bottom:1px solid var(--line)}.brand{font:500 clamp(38px,4vw,64px)/1.1 'Bodoni Moda',Georgia,serif;text-decoration:none}.light{display:flex;align-items:center;gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:60px;padding:10px 22px 10px 12px;box-shadow:0 3px 0 var(--shadow),inset 0 1px #ffffff40;white-space:nowrap}.mechanism{width:94px;height:52px;display:block;position:relative;border-radius:30px;background:var(--wood);box-shadow:inset 0 3px 7px #0007;border:2px solid #8c7041}.knob{position:absolute;left:4px;top:3px;width:42px;height:42px;border-radius:50%;background:var(--metal);box-shadow:0 2px 4px #0008,inset 0 0 0 2px #d4bb8477;display:grid;place-items:center;transition:transform .24s ease;color:#2d251b}.knob svg{width:28px;height:28px}.light[aria-checked=true] .knob{transform:translateX(40px)}main{padding:52px 0 24px}h1,h2,h3,p{margin-top:0}h1{font:400 clamp(48px,5.4vw,84px)/1.12 'Bodoni Moda',Georgia,serif;margin-bottom:20px}h2{font:500 44px/1.18 'Bodoni Moda',Georgia,serif}h3{font:500 36px/1.25 'Bodoni Moda',Georgia,serif}.intro{color:var(--muted);margin-bottom:42px}.trimesters{display:grid;gap:26px;max-width:1120px;margin:auto}.drawer{position:relative;text-align:left;width:100%;padding:25px 90px;background:linear-gradient(#ffffff08,#00000024),url('img/tex-mesa.webp') center/cover,var(--wood);border:5px ridge #977b4c;border-radius:3px;box-shadow:inset 0 0 0 6px #221a12,0 6px 0 #251e16,0 15px 22px var(--shadow);transition:transform .2s}.drawer:hover{transform:translateY(-3px)}.drawer:before,.drawer:after{content:'';position:absolute;top:calc(50% - 13px);width:26px;height:26px;border-radius:50%;background:var(--metal);box-shadow:0 3px 4px #0009,inset 0 0 0 2px #c3a572}.drawer:before{left:29px}.drawer:after{right:29px}.holder{display:block;padding:7px;background:var(--metal);border-radius:5px;box-shadow:0 3px 6px #0008;position:relative}.label{display:grid;grid-template-columns:1fr auto;gap:8px 24px;background:var(--paper);padding:20px 26px;box-shadow:inset 0 0 0 1px #65543d,inset 0 3px 6px #0002}.label strong{grid-column:1/-1;font:500 44px/1.2 'Bodoni Moda',Georgia,serif}.label span{color:var(--muted)}.arrow{align-self:center;color:var(--accent)!important}.footnote{margin:36px auto 0;max-width:1120px;color:var(--muted)}.back{display:inline-flex;gap:12px;background:none;border:0;padding:0;margin-bottom:28px;color:var(--muted);text-decoration:underline;text-underline-offset:7px}.months{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0}.month{border:1px solid transparent;background:none;padding:10px 18px;border-bottom:2px solid var(--line)}.month[aria-pressed=true]{color:var(--accent);border:1px solid var(--line);border-bottom:4px solid var(--accent);background:var(--paper)}.agenda{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.85fr);gap:36px;align-items:start}.days{display:grid;gap:14px}.day{text-align:left;display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:22px;box-shadow:0 3px 0 var(--shadow)}.day[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}.date{text-align:center;border-right:1px solid var(--line);padding-right:16px;font-variant-numeric:tabular-nums}.date b{font:500 50px/1.1 'Bodoni Moda',Georgia,serif;display:block}.day-title{display:block;font-weight:500}.day-summary{display:block;color:var(--muted);margin-top:6px}.detail{background:var(--paper);padding:32px;border:1px solid var(--line);box-shadow:6px 6px 0 var(--shadow);position:sticky;top:24px}.detail h2{border-bottom:1px solid var(--line);padding-bottom:24px}.detail dl{margin:0}.detail dt{font-weight:600;color:var(--accent);margin-top:24px}.detail dd{margin:8px 0 0;overflow-wrap:anywhere}.primary{background:var(--accent);color:var(--paper);border:0;min-height:62px;padding:14px 24px;margin-top:30px;width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px}.motto{font:400 34px/1.4 'Bodoni Moda',Georgia,serif;max-width:540px;margin:48px 0 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:28px 0 36px;margin-top:40px;color:var(--muted)}.session-page{max-width:1000px}.session-page .detail{position:static}.status{margin:30px 0 0;color:var(--muted)}
.drawer{background-blend-mode:multiply;background-color:#6d5035}.label{background-image:linear-gradient(180deg,#ffffff08,transparent);border:1px solid var(--line)}
@media(min-width:1200px){#terms h1,#terms .intro{text-align:center}}
@media(max-width:1000px){.agenda{grid-template-columns:1fr}.detail{position:static}.shell{padding:0 28px}header{flex-wrap:wrap}.day-summary{display:none}}
@media(max-width:600px){.shell{margin:12px auto;padding:0 18px}header{gap:24px;padding:24px 0}.brand{font-size:42px}.light{font-size:30px;padding-right:16px;gap:12px}main{padding-top:36px}h1{font-size:48px}h2{font-size:38px}.drawer{padding:16px 24px}.drawer:before,.drawer:after{display:none}.label{grid-template-columns:1fr;padding:18px 14px}.label strong{font-size:38px}.arrow{display:none}.trimesters{gap:24px}.month{padding:8px 10px}.day{padding:18px 12px;grid-template-columns:75px 1fr;gap:12px}.day>.arrow{display:none}.date{padding-right:10px}.detail{padding:24px 18px}.intro{margin-bottom:30px}.primary{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style><link rel="stylesheet" href="cas-materiales.css"><link rel="stylesheet" href="pau-materiales.css"></head><body><div class="shell"><header><a class="brand" href="#"><img class="brand__sello" src="img/sello-cfa.webp" width="44" height="44" alt=""><span class="brand-code">PAU +25</span> Castellano</a><button class="light" id="light" role="switch" aria-label="Modo noche" aria-checked="false"><span class="mechanism" aria-hidden="true"><span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg></span></span><span id="light-label">Apagar la luz</span></button></header>
<main><section id="terms"><h1><span class="title-lead">Elige el</span> <span class="title-ink">trimestre</span></h1><p class="intro">Curso 2026–27</p><div class="trimesters" id="drawers"></div><p class="footnote" id="notas"></p></section>
<section id="calendar" hidden><button class="back" id="back-terms">← Volver a trimestres</button><h1 id="term-title" tabindex="-1"></h1><p class="intro">Elige el día de trabajo</p><nav class="months" id="months" aria-label="Meses del trimestre"></nav><h2 id="month-title" class="relief-title"></h2><div class="agenda"><div class="days" id="days"></div><aside class="detail" id="detail" aria-label="Contenido de la sesión"></aside></div></section>
</main></div>
<script src="pau-trimestres-datos.js"></script><script src="pau-ejercicios-datos.js"></script><script>
const $=id=>document.getElementById(id), names=['Primer trimestre','Segundo trimestre','Tercer trimestre'], monthNames=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* Los tres rótulos del cajón —el rango de fechas y cuántas sesiones tiene cada
   trimestre— salen de PAU_DAYS, que escribe publicar-web.py desde la
   temporalización. Antes eran tres listas escritas a mano; al mover una sesión
   había que acordarse de venir a cambiarlas. */
const cortos=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const diaMes=s=>+s.slice(8)+' '+cortos[+s.slice(5,7)-1];
function rango(t){const f=PAU_DAYS.filter(d=>d.term===t).map(d=>d.date).sort();if(!f.length)return '';const a=f[0],b=f[f.length-1];return diaMes(a)+(a.slice(0,4)===b.slice(0,4)?'':' '+a.slice(0,4))+' \u2013 '+diaMes(b)+' '+b.slice(0,4)}
const ranges=[0,1,2].map(rango), counts=[0,1,2].map(t=>PAU_DAYS.filter(d=>d.term===t).length);
let term=0,month='',selected=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s+'T12:00:00');const full=s=>date(s).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function isDark(){return document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}function syncLight(){const dark=isDark();$('light').setAttribute('aria-checked',String(dark));$('light-label').textContent=dark?'Encender la luz':'Apagar la luz'}syncLight();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncLight);$('light').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('pau-agenda-tema',t)}catch(e){}syncLight()};
$('drawers').innerHTML=names.map((n,i)=>`<button class="drawer" data-term="${i}"><span class="holder"><span class="label"><strong>${n}</strong><span>${ranges[i]}<br>${counts[i]} sesiones</span></span></span></button>`).join('');$('drawers').onclick=e=>{const b=e.target.closest('[data-term]');if(b)location.hash='trimestre/'+(+b.dataset.term+1)};
function show(id){for(const v of ['terms','calendar'])$(v).hidden=v!==id}function rows(){return PAU_DAYS.filter(d=>d.term===term)}function blocks(d){return `<dl>${d.parts.map((p,i)=>p?`<dt class="${d.special?'':'relief-title'}"><span class="relief-depth" aria-hidden="true">${d.special?'Sesión':['Ortografía y gimnasio','Leer y escribir','Lengua'][i]}</span><span class="relief-face">${d.special?'Sesión':['Ortografía y gimnasio','Leer y escribir','Lengua'][i]}</span></dt><dd>${esc(p)}</dd>`:'').join('')}</dl>`}
/* La hoja del día, debajo de la lista. Aquí va TODO lo del día: lo que se da
   en cada carril y lo que hay para llevarse. Antes había un botón que abría
   una segunda página solo para enseñar el enlace de los ejercicios y el del
   dossier; esa página no añadía nada y se ha quitado. */
function choose(d,focus=false){selected=d;for(const b of $('days').children)b.setAttribute('aria-pressed',String(b.dataset.date===d.date));$('detail').innerHTML=`<div class="session-sheet"><h2>${esc(cap(full(d.date)))}</h2>${blocks(d)}${materiales(d)}</div><div class="printer-mark"><img class="flower-ornament" src="img/cas-libro-floral.png" alt="" width="160" height="200"><p class="motto"><span>Mejores conversaciones</span> <strong>para un mundo</strong> <em>más tuyo.</em></p></div>`;if(focus)$('detail').scrollIntoView({behavior:'auto',block:'nearest'})}
function raisedText(text){return `<span class="relief-depth" aria-hidden="true">${esc(text)}</span><span class="relief-face">${esc(text)}</span>`}
/* Lo que hay colgado de cada sesión. PAU_EJERCICIOS y PAU_DOSSIER los escribe
   publicar-web.py desde el material: si una sesión no sale ahí, es que todavía
   no tiene página, y se dice en vez de callarlo. */
function materiales(d){
  const ej=typeof PAU_EJERCICIOS!=='undefined'?PAU_EJERCICIOS[d.date]:null;
  const pdfs=(typeof PAU_DOSSIER!=='undefined'?PAU_DOSSIER:[]).filter(p=>p.term===d.term);
  if(!ej&&!pdfs.length)return '<p class="status">Esta sesión no tiene ejercicios en la web.</p>';
  let h='<div class="bench">';
  if(ej){
    h+=`<h2 class="bench-title relief-title">${raisedText('Los ejercicios')}</h2>`
      +`<p class="bench-note">${ej.ejercicios} ejercicios de la sesión, corregidos al momento. Lo que contestas se guarda en este navegador.</p>`
      +`<a class="primary bench-go" href="${esc(ej.pagina)}">Abrir los ejercicios<span aria-hidden="true">→</span></a>`;
  }else{
    h+='<p class="status">Esta sesión todavía no tiene ejercicios en la web.</p>';
  }
  if(pdfs.length){
    h+=`<h2 class="bench-title relief-title">${raisedText('Para imprimir')}</h2>`
      +pdfs.map(p=>`<a class="sheet" href="${esc(p.archivo)}"><span class="sheet-txt"><b>${esc(p.titulo)}</b><small>${esc(p.detalle)}</small><small class="sheet-meta">${p.paginas} páginas, PDF de ${esc(p.peso)}</small></span><span class="sheet-go" aria-hidden="true">↓</span></a>`).join('');
  }
  return h+'</div>';
}
function renderMonth(m){month=m;const current=rows().filter(d=>d.date.slice(0,7)===m);$('month-title').innerHTML=raisedText(cap(monthNames[+m.slice(5)-1])+' '+m.slice(0,4));for(const b of $('months').children)b.setAttribute('aria-pressed',String(b.dataset.month===m));$('days').innerHTML=current.map(d=>`<button class="day" data-date="${d.date}" aria-pressed="false"><span class="date">${date(d.date).toLocaleDateString('es',{weekday:'short'}).replace('.','')}<b>${date(d.date).getDate()}</b></span><span><span class="day-title relief-title">${raisedText(d.number?'Sesión '+d.number:d.title)}</span><span class="day-summary">${esc(d.special?d.parts[0].split(' — ')[0]:d.parts[2]||d.parts[1]||d.parts[0])}</span></span><span class="arrow" aria-hidden="true">→</span></button>`).join('');choose(current.find(d=>selected&&d.date===selected.date)||current[0])}
function renderTerm(i){term=i;show('calendar');$('term-title').innerHTML='<span class="title-lead">'+names[i].split(' ')[0]+'</span> <span class="title-ink">trimestre</span>';const months=[...new Set(rows().map(d=>d.date.slice(0,7)))];$('months').innerHTML=months.map(m=>`<button class="month" data-month="${m}" aria-pressed="false"><span class="month-letter relief-title">${raisedText(cap(monthNames[+m.slice(5)-1]))}</span></button>`).join('');renderMonth(months.includes(month)?month:months[0]);$('term-title').focus({preventScroll:true})}
$('months').onclick=e=>{const b=e.target.closest('[data-month]');if(b)renderMonth(b.dataset.month)};$('days').onclick=e=>{const b=e.target.closest('[data-date]');if(b)choose(rows().find(d=>d.date===b.dataset.date),innerWidth<1000)};$('back-terms').onclick=()=>location.hash='';
/* `#sesion/FECHA` sigue existiendo como enlace directo a un día: es la vuelta
   de las páginas de ejercicios (`../cas-trimestres.html#sesion/2026-10-01`).
   Ya no abre una página aparte: abre el calendario de su trimestre, en su mes,
   con el día elegido y la hoja a la vista. */
function route(){const h=location.hash.slice(1);let m;if((m=h.match(/^trimestre\/([123])$/)))renderTerm(+m[1]-1);else if((m=h.match(/^sesion\/(\d{4}-\d{2}-\d{2})$/))){const d=PAU_DAYS.find(x=>x.date===m[1]);if(!d){location.hash='';return}selected=d;month=d.date.slice(0,7);renderTerm(d.term);window.scrollTo(0,0);$('detail').scrollIntoView({behavior:'auto',block:'nearest'});return}else show('terms');window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
/* El pie de los cajones: las filas de la temporalización que no son sesión.
   Si PAU_NOTAS viene vacío, el pie se queda sin pintar en vez de enseñar un
   hueco. */
(function(){const n=typeof PAU_NOTAS!=='undefined'?PAU_NOTAS:[];const p=$('notas');
 if(!p)return; if(!n.length){p.hidden=true;return}
 p.innerHTML=n.map(x=>esc([x.cuando,x.texto].filter(Boolean).join(': '))).join(' \u00b7 ');})();

</script></body></html>
